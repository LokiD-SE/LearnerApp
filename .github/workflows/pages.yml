# Runs every check (the app and the practice projects) on pushes and pull requests, and deploys main to
# GitHub Pages.
# One-time repository setting: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # typecheck, lint, format, unit tests, build, end-to-end tests (installed Google Chrome)
      - run: npm run check
      - name: Keep test evidence when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # The practice projects: reference solutions pass, unsolved exercises fail (practice/verify.sh).
  practice:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: practice/verify.sh java
      # Selenium against the practice shop, with the runner's Google Chrome (headless because CI=true)
      - run: practice/verify.sh framework
      - name: Keep test evidence when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: practice-evidence
          path: |
            practice/*/target/evidence
            practice/*/target/surefire-reports
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [check, practice]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
