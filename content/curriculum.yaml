# The curriculum map: stages, subjects (tracks), modules and lessons.
# A lesson with a file in content/lessons/<subject>/<id>.yaml only needs its id here.
# A lesson without a file is "planned" and needs a title, level and summary.

stages:
  - id: stage-1
    number: 1
    title: Foundations
    summary: Testing fundamentals, web and mobile basics, HTTP, and basic Java.
  - id: stage-2
    number: 2
    title: Manual payment, API and mobile testing
    summary: Test payments, APIs and mobile apps by hand, with real test design.
  - id: stage-3
    number: 3
    title: Payment architecture and defect isolation
    summary: Trace a payment through every layer and prove which component is at fault.
  - id: stage-4
    number: 4
    title: Advanced Java, Maven, Git and debugging
    summary: The engineering base for automation code that lasts.
  - id: stage-5
    number: 5
    title: Selenium, Appium and the Page Object Model
    summary: Reliable web and mobile UI automation.
  - id: stage-6
    number: 6
    title: Framework design, reporting and CI
    summary: Grow a small reference framework only as real needs appear.
  - id: stage-7
    number: 7
    title: End-to-end scenarios and interview simulations
    summary: Integrated payment scenarios, failure analysis and mock interviews.

subjects:
  - id: foundations
    track: Foundation
    title: Testing and engineering foundations
    summary: How testers think, and the web, mobile and tooling basics everything else builds on.
    modules:
      - id: testing-fundamentals
        title: Testing fundamentals
        stage: stage-1
        summary: Test design techniques and the vocabulary of quality.
        lessons:
          - id: test-design-techniques
          - id: state-transition-testing
          - id: defect-reports-that-get-fixed
          - id: risk-based-testing
      - id: web-mobile-basics
        title: How web and mobile apps work
        stage: stage-1
        summary: Browsers, clients, servers and what happens between a tap and a response.
        lessons:
          - id: client-server-request-flow
          - id: browser-devtools-for-testers
      - id: git-and-debugging
        title: Git and systematic debugging
        stage: stage-4
        summary: Version control and a repeatable way to find root causes.
        lessons:
          - id: git-for-testers
          - id: scientific-debugging

  - id: payments-testing
    track: Track A
    title: Payments manual testing
    summary: Test payment journeys on web and mobile like a payments specialist.
    modules:
      - id: payment-lifecycle
        title: The payment lifecycle
        stage: stage-2
        summary: From initiation to settlement, refund and reconciliation.
        lessons:
          - id: payment-lifecycle-overview
          - id: payment-ecosystem-roles
          - id: void-reversal-refund-chargeback
      - id: checkout-and-methods
        title: Checkout and payment methods
        stage: stage-2
        summary: Cards, wallets, bank payments, tokenisation and 3-D Secure.
        lessons:
          - id: card-payments-and-tokenisation
          - id: three-d-secure-and-redirects
          - id: wallets-and-bank-payments
      - id: payment-failure-modes
        title: Failures, retries and money correctness
        stage: stage-2
        summary: Declines, timeouts, unknown outcomes, duplicates and amounts.
        lessons:
          - id: declines-timeouts-unknown-outcomes
          - id: amounts-currency-rounding
          - id: interruptions-refresh-back-navigation
      - id: refunds-and-reconciliation
        title: Refunds and reconciliation
        stage: stage-2
        summary: Partial refunds, financial invariants, receipts and audit trails.
        lessons:
          - id: partial-refunds-and-invariants
          - id: reconciliation-for-testers
      - id: payment-test-design
        title: Payment test plans and sign-off
        stage: stage-2
        summary: Scenario matrices, test data, sandbox limits and release decisions.
        lessons:
          - id: payment-scenario-matrix
          - id: sandbox-test-data
          - id: pci-dss-awareness

  - id: payment-architecture
    track: Track B
    title: Payment architecture and root-cause analysis
    summary: Follow a payment through every layer and find the component at fault.
    modules:
      - id: payment-request-flow
        title: The payment request flow
        stage: stage-3
        summary: Frontend, API gateway, services, processor, database and queues.
        lessons:
          - id: tracing-a-payment-end-to-end
          - id: sync-vs-async-payments
      - id: observability-and-rca
        title: Observability and root-cause analysis
        stage: stage-3
        summary: Logs, metrics, traces and a diagnostic method that avoids blaming the first layer.
        lessons:
          - id: logs-metrics-traces
          - id: defect-isolation-decision-trees
          - id: inconsistent-status-incidents

  - id: api-testing
    track: Track C
    title: API testing and payment API testing
    summary: HTTP from first principles to payment API contracts.
    modules:
      - id: api-foundations
        title: HTTP for testers
        stage: stage-1
        summary: Requests, responses, methods, status codes, headers and authentication.
        lessons:
          - id: http-request-response-anatomy
          - id: http-methods-safety-idempotency
          - id: status-codes-and-errors
          - id: authentication-and-authorization
      - id: manual-api-testing
        title: Manual API testing
        stage: stage-2
        summary: Postman, environments, schemas, contracts and negative matrices.
        lessons:
          - id: postman-environments-and-collections
          - id: schema-and-contract-validation
          - id: pagination-filtering-rate-limits
      - id: payment-api-testing
        title: Payment API testing
        stage: stage-2
        summary: Create, capture, refund, status, idempotency, webhooks and reconciliation.
        lessons:
          - id: idempotency-keys
          - id: webhooks-and-async-status
          - id: payment-api-negative-matrix

  - id: mobile-testing
    track: Track D
    title: Android and iOS manual testing
    summary: General mobile testing first, then platform specifics and mobile payments.
    modules:
      - id: mobile-fundamentals
        title: Mobile testing fundamentals
        stage: stage-2
        summary: Installs, upgrades, permissions, interruptions, networks and devices.
        lessons:
          - id: mobile-test-planning
          - id: interruptions-and-lifecycle
      - id: android-testing
        title: Android-specific testing
        stage: stage-2
        summary: Activities, intents, deep links, permissions and ADB.
        lessons:
          - id: android-lifecycle-and-process-death
          - id: adb-and-logcat-for-testers
      - id: ios-testing
        title: iOS-specific testing
        stage: stage-2
        summary: Lifecycle, universal links, permissions, Simulator and device logs.
        lessons:
          - id: ios-lifecycle-and-links
      - id: mobile-payment-testing
        title: Mobile payment testing
        stage: stage-7
        summary: App switching, 3-D Secure return flows, termination mid-payment and recovery.
        lessons:
          - id: mobile-payment-interruptions

  - id: java
    track: Track E
    title: Java for interviews and automation
    summary: From fundamentals to the Java that reliable automation frameworks need.
    modules:
      - id: java-basics
        title: Java basics
        stage: stage-1
        summary: Types, control flow, methods, arrays and strings.
        lessons:
          - id: java-types-and-variables
          - id: java-strings-and-stringbuilder
      - id: java-oop
        title: Object-oriented Java
        stage: stage-4
        summary: Encapsulation, inheritance, polymorphism, composition and interfaces.
        lessons:
          - id: java-oop-pillars
          - id: java-exceptions
      - id: java-collections-generics
        title: Collections, generics and equality
        stage: stage-4
        summary: List, Set, Map, equals, hashCode and comparators.
        lessons:
          - id: java-equals-hashcode
          - id: java-collections-choice
      - id: java-modern
        title: Modern Java
        stage: stage-4
        summary: Lambdas, streams, Optional, records and the date/time API.
        lessons:
          - id: java-streams-and-lambdas
          - id: java-concurrency-basics

  - id: ui-automation
    track: Track F
    title: Selenium and Appium with Java
    summary: Reliable web and mobile automation, from locators to gestures.
    modules:
      - id: selenium-webdriver
        title: Selenium WebDriver
        stage: stage-5
        summary: WebDriver, locators, waits, frames, windows and flakiness.
        lessons:
          - id: selenium-locators
          - id: selenium-waits-and-synchronisation
      - id: appium
        title: Appium
        stage: stage-5
        summary: Architecture, drivers, capabilities, contexts and gestures.
        lessons:
          - id: appium-architecture
          - id: appium-native-hybrid-webview

  - id: frameworks
    track: Track G
    title: POM, Maven and automation frameworks
    summary: Page objects, builds, and a framework that grows only when needed.
    modules:
      - id: maven
        title: Maven
        stage: stage-4
        summary: pom.xml, dependencies, scopes, lifecycle, plugins and profiles.
        lessons:
          - id: maven-pom-and-dependencies
          - id: maven-lifecycle-surefire
      - id: page-object-model
        title: The Page Object Model
        stage: stage-5
        summary: Page objects, components and separating intent from mechanics.
        lessons:
          - id: page-objects-done-right
      - id: framework-design
        title: Framework design
        stage: stage-6
        summary: Drivers, configuration, data, reporting, parallelism and CI.
        lessons:
          - id: reference-framework-skeleton
          - id: parallel-runs-and-thread-safety
            title: Parallel execution and thread safety
            level: advanced
            summary: One driver per thread, isolated data and honest retries.
          - id: ci-quality-gates
            title: CI pipelines and quality gates
            level: advanced
            summary: Running suites in CI with secrets handled safely.
      - id: capstone
        title: End-to-end capstone
        stage: stage-7
        summary: An end-to-end payment journey automated across API, web and mobile.
        lessons:
          - id: e2e-payment-capstone
            title: Capstone - an end-to-end payment journey
            level: expert
            summary: Checkout to refund, verified at the UI, the API and the data.
          - id: mock-interview-payments-qa
            title: Mock interview - payments QA engineer
            level: expert
            summary: A full interview simulation with follow-ups and a scoring rubric.

  - id: playwright
    track: Track H
    title: Playwright with JavaScript and TypeScript
    summary: Modern web automation - the language basics, locators and web-first assertions, fixtures, network mocking and API tests.
    modules:
      - id: js-ts-basics
        title: JavaScript and TypeScript for testers
        stage: stage-4
        summary: Promises, async/await and the types that keep test code honest.
        lessons:
          - id: js-ts-async-and-types
      - id: playwright-test
        title: Playwright Test
        stage: stage-5
        summary: Locators, auto-waiting, web-first assertions, fixtures, network control and API testing.
        lessons:
          - id: playwright-locators-and-assertions
          - id: playwright-fixtures-and-page-objects
          - id: playwright-network-and-api

paths:
  - id: payments-qa-core
    title: Payments QA - core path
    level: beginner
    summary: The shortest route to testing payments and payment APIs with confidence.
    lessons:
      - http-request-response-anatomy
      - http-methods-safety-idempotency
      - payment-lifecycle-overview
      - sandbox-test-data
      - idempotency-keys
      - declines-timeouts-unknown-outcomes
      - webhooks-and-async-status
      - payment-scenario-matrix
  - id: automation-engineer
    title: Java automation engineer
    level: intermediate
    summary: Java, Maven, Selenium, Appium and a framework you can defend in an interview.
    lessons:
      - java-types-and-variables
      - java-oop-pillars
      - java-equals-hashcode
      - maven-pom-and-dependencies
      - selenium-locators
      - selenium-waits-and-synchronisation
      - page-objects-done-right
      - appium-architecture
      - reference-framework-skeleton
  - id: playwright-engineer
    title: Playwright automation engineer (TypeScript)
    level: intermediate
    summary: JavaScript and TypeScript basics, Playwright locators, fixtures, network mocking and API tests - with the payments judgement around them.
    lessons:
      - js-ts-async-and-types
      - http-request-response-anatomy
      - playwright-locators-and-assertions
      - playwright-fixtures-and-page-objects
      - page-objects-done-right
      - playwright-network-and-api
      - payment-scenario-matrix
  - id: testing-foundations
    title: Testing foundations
    level: beginner
    summary: The test design, risk, reporting, web, tooling and debugging basics every tester and automation engineer builds on - from ISTQB, the RFCs and official tool documentation.
    lessons:
      - test-design-techniques
      - state-transition-testing
      - risk-based-testing
      - defect-reports-that-get-fixed
      - client-server-request-flow
      - browser-devtools-for-testers
      - git-for-testers
      - scientific-debugging

# Practice projects in this repository. Coding exercises name one; the app links to its files.
practice:
  repository: https://github.com/LokiD-SE/LearnerApp
  branch: main
  projects:
    - id: java
      title: Java practice project
      path: practice/java
      summary: Small Java exercises, each checked by a JUnit test class.
      setup: |
        You need a **JDK 17 or later** - a development kit, not only a Java runtime (`javac -version` must
        work) - and **Maven 3.8 or later** (`mvn -v`).

        ```bash
        git clone https://github.com/LokiD-SE/LearnerApp.git
        cd LearnerApp/practice/java
        mvn test -Dtest=MoneyTest
        ```

        The first run downloads JUnit and the Maven plugins, then the tests fail - nothing is solved yet.
        Change the file the exercise names (under `src/exercises/java`), run its command again and read
        the **first** failure: its message says what is still wrong. Repeat until every test passes.

        Reference solutions are in `src/solutions/java`. Look only after you have tried;
        `mvn -Psolutions test` runs every test against them. More in `practice/README.md`.
    - id: framework
      title: Reference UI-automation framework
      path: practice/framework
      summary: A small Selenium and JUnit framework that tests the SandPay Demo Shop, with exercises for locators, waits and page objects.
      setup: |
        You need **Google Chrome**, a **JDK 17 or later** (`javac -version` must work) and **Maven 3.8 or
        later** (`mvn -v`). Selenium finds or downloads the matching ChromeDriver by itself.

        ```bash
        git clone https://github.com/LokiD-SE/LearnerApp.git
        cd LearnerApp/practice/framework
        mvn test -Dtest=CheckoutJourneyTest
        ```

        The tests serve the shop from `practice/shop` themselves and open a Chrome window for every test
        so you can watch (add `-Dheadless=true` to hide it). When a test fails, a screenshot and the page
        source are saved in `target/evidence`.

        Exercises are in `src/exercises/java`, their tests in `src/test/java/learnerapp/exercises`, and
        reference solutions in `src/solutions/java` (`mvn -Psolutions test`). Explore the shop itself in
        your browser at `practice/shop/index.html` served by any static server, or use the copy published
        with this app. More in `practice/README.md`.
    - id: maven
      title: Maven practice project
      path: practice/maven
      summary: Small Maven projects with broken pom.xml files; tests run Maven on them and check the result.
      setup: |
        You need a **JDK 17 or later** (`javac -version` must work) and **Maven 3.8 or later** (`mvn -v`).

        ```bash
        git clone https://github.com/LokiD-SE/LearnerApp.git
        cd LearnerApp/practice/maven
        mvn test -Dtest=ReceiptToolBuildTest
        ```

        Each exercise is a small project of its own in `src/exercises/projects/<name>` - build it yourself
        there with `mvn test` while you fix its `pom.xml`. The test class then runs Maven on it and checks
        what happened (the first run downloads plugins, so it takes a minute). Reference solutions are in
        `src/solutions/projects`. More in `practice/README.md`.
    - id: playwright
      title: Playwright practice project
      path: practice/playwright
      summary: Playwright Test in TypeScript (and one JavaScript exercise) against the SandPay Demo Shop.
      setup: |
        You need **Node.js 20 or later** (`node -v`) - LearnerApp itself is developed on Node 24.

        ```bash
        git clone https://github.com/LokiD-SE/LearnerApp.git
        cd LearnerApp/practice/playwright
        npm ci                                  # Playwright, TypeScript and type definitions
        npx playwright install chromium         # once: the browser Playwright drives
        npx playwright test tests/check-all.spec.ts
        ```

        The tests serve the shop from `practice/shop` themselves. With Google Chrome installed you can skip
        the download and run `PW_CHANNEL=chrome npx playwright test ...`. Add `--ui` to watch and step through
        tests, or `--headed` to see the browser.

        Exercises are in `exercises/`, their tests in `tests/`, reference solutions in `solutions/`
        (`npm run test:solutions` runs every test against them). `npm run typecheck` checks your TypeScript.
        More in `practice/README.md`.
