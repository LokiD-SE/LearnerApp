# Practice projects in this repository. Coding exercises name one; the app links to its files.
practice:
  repository: https://github.com/LokiD-SE/LearnerApp
  branch: main
  projects:
    - id: java
      title: Java practice project
      path: practice/java
      summary: Small Java exercises, each checked by a JUnit test class.
      setup: |
        You need a **JDK 17 or later** - a development kit, not only a Java runtime (`javac -version` must
        work) - and **Maven 3.8 or later** (`mvn -v`).

        ```bash
        git clone https://github.com/LokiD-SE/LearnerApp.git
        cd LearnerApp/practice/java
        mvn test -Dtest=MoneyTest
        ```

        The first run downloads JUnit and the Maven plugins, then the tests fail - nothing is solved yet.
        Change the file the exercise names (under `src/exercises/java`), run its command again and read
        the **first** failure: its message says what is still wrong. Repeat until every test passes.

        Reference solutions are in `src/solutions/java`. Look only after you have tried;
        `mvn -Psolutions test` runs every test against them. More in `practice/README.md`.
    - id: framework
      title: Reference UI-automation framework
      path: practice/framework
      summary: A small Selenium and JUnit framework that tests the SandPay Demo Shop, with exercises for locators, waits and page objects.
      setup: |
        You need **Google Chrome**, a **JDK 17 or later** (`javac -version` must work) and **Maven 3.8 or
        later** (`mvn -v`). Selenium finds or downloads the matching ChromeDriver by itself.

        ```bash
        git clone https://github.com/LokiD-SE/LearnerApp.git
        cd LearnerApp/practice/framework
        mvn test -Dtest=CheckoutJourneyTest
        ```

        The tests serve the shop from `practice/shop` themselves and open a Chrome window for every test
        so you can watch (add `-Dheadless=true` to hide it). When a test fails, a screenshot and the page
        source are saved in `target/evidence`.

        Exercises are in `src/exercises/java`, their tests in `src/test/java/learnerapp/exercises`, and
        reference solutions in `src/solutions/java` (`mvn -Psolutions test`). Explore the shop itself in
        your browser at `practice/shop/index.html` served by any static server, or use the copy published
        with this app. More in `practice/README.md`.
    - id: maven
      title: Maven practice project
      path: practice/maven
      summary: Small Maven projects with broken pom.xml files; tests run Maven on them and check the result.
      setup: |
        You need a **JDK 17 or later** (`javac -version` must work) and **Maven 3.8 or later** (`mvn -v`).

        ```bash
        git clone https://github.com/LokiD-SE/LearnerApp.git
        cd LearnerApp/practice/maven
        mvn test -Dtest=ReceiptToolBuildTest
        ```

        Each exercise is a small project of its own in `src/exercises/projects/<name>` - build it yourself
        there with `mvn test` while you fix its `pom.xml`. The test class then runs Maven on it and checks
        what happened (the first run downloads plugins, so it takes a minute). Reference solutions are in
        `src/solutions/projects`. More in `practice/README.md`.
    - id: playwright
      title: Playwright practice project
      path: practice/playwright
      summary: Playwright Test in TypeScript (and one JavaScript exercise) against the SandPay Demo Shop.
      setup: |
        You need **Node.js 20 or later** (`node -v`) - LearnerApp itself is developed on Node 24.

        ```bash
        git clone https://github.com/LokiD-SE/LearnerApp.git
        cd LearnerApp/practice/playwright
        npm ci                                  # Playwright, TypeScript and type definitions
        npx playwright install chromium         # once: the browser Playwright drives
        npx playwright test tests/check-all.spec.ts
        ```

        The tests serve the shop from `practice/shop` themselves. With Google Chrome installed you can skip
        the download and run `PW_CHANNEL=chrome npx playwright test ...`. Add `--ui` to watch and step through
        tests, or `--headed` to see the browser.

        Exercises are in `exercises/`, their tests in `tests/`, reference solutions in `solutions/`
        (`npm run test:solutions` runs every test against them). `npm run typecheck` checks your TypeScript.
        More in `practice/README.md`.
    - id: fullstack
      title: Full stack practice project (TypeScript)
      path: practice/fullstack
      summary: TypeScript, React, Express and PostgreSQL exercises, each checked by Vitest tests - no database or browser to install.
      setup: |
        You need **Node.js 24** (`node -v`; the repository's `.nvmrc` names it).

        ```bash
        git clone https://github.com/LokiD-SE/LearnerApp.git
        cd LearnerApp/practice/fullstack
        npm ci
        npx vitest run tests/js
        ```

        The tests fail at first - nothing is solved yet. Change the file the exercise names (under
        `exercises/`), run its command again and read the **first** failure. React tests run in a simulated
        browser (jsdom), API tests call Express in memory with supertest, and database tests use PGlite - a
        real PostgreSQL engine compiled to WebAssembly - so there is no server to install.

        Reference solutions are in `solutions/`, at the same paths. Look only after you have tried;
        `npm run test:solutions` runs every test against them. More in `practice/fullstack/README.md`.
    - id: ai
      title: AI engineering practice project (Python)
      path: practice/ai
      summary: Python exercises - NumPy, pandas, scikit-learn and later LLM apps and agents - checked by pytest, with a scripted fake model instead of a paid API.
      setup: |
        You need **Python 3.12** (`python3 --version`; the project's `.python-version` names it).

        ```bash
        git clone https://github.com/LokiD-SE/LearnerApp.git
        cd LearnerApp/practice/ai
        python3 -m venv .venv
        .venv/bin/pip install -r requirements.txt
        .venv/bin/python -m pytest tests/ml_foundations
        ```

        The tests fail at first - nothing is solved yet. Change the file the exercise names (under
        `exercises/`), run its command again and read the **first** failure. Tests fix their random seeds, so a
        result that passes once passes every time.

        Reference solutions are in `solutions/`, at the same paths. Look only after you have tried;
        `AI_TARGET=solutions .venv/bin/python -m pytest` runs every test against them. More in
        `practice/ai/README.md`.
    - id: perf
      title: Performance testing practice project (JMeter and Locust)
      path: practice/perf
      summary: Load tests with Apache JMeter and Locust against a local SandPay practice API, plus Python analysis exercises - checked by pytest.
      setup: |
        You need **Python 3.12** and **Java 8 or later** for JMeter (`java -version`; JDK 17 or 21 is tested).

        ```bash
        git clone https://github.com/LokiD-SE/LearnerApp.git
        cd LearnerApp/practice/perf
        python3 -m venv .venv
        .venv/bin/pip install -r requirements.txt   # Locust and pytest
        scripts/get-jmeter.sh                        # Apache JMeter into tools/, SHA-512 checked
        .venv/bin/python -m pytest tests/support      # the target, JMeter and Locust all work
        ```

        Every load test runs against `support/sandpay_target.py`, a practice API on your own machine
        (`.venv/bin/python support/sandpay_target.py --port 8090`) - never point a load test at a system you
        do not own or have written permission to test.

        Reference solutions are in `solutions/`, at the same paths. Look only after you have tried;
        `PERF_TARGET=solutions .venv/bin/python -m pytest` runs every test against them. More in
        `practice/perf/README.md`.
    - id: security
      title: Security testing practice project
      path: practice/security
      summary: Security tests in Python against a deliberately vulnerable SandPay portal that runs only on your own machine - checked by pytest.
      setup: |
        You need **Python 3.12**.

        ```bash
        git clone https://github.com/LokiD-SE/LearnerApp.git
        cd LearnerApp/practice/security
        python3 -m venv .venv
        .venv/bin/pip install -r requirements.txt
        .venv/bin/python -m pytest tests/support      # every flaw is present, and closed when fixed
        ```

        `support/sandpay_vuln.py` is **deliberately vulnerable**. It binds to `127.0.0.1` only; never expose
        or deploy it. Start it with `.venv/bin/python support/sandpay_vuln.py --port 8765` to explore it with
        a browser or an intercepting proxy. Test only systems you own or have written permission to test.

        Reference solutions are in `solutions/`, at the same paths. Look only after you have tried;
        `SEC_TARGET=solutions .venv/bin/python -m pytest` runs every test against them. More in
        `practice/security/README.md`.
