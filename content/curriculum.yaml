# The curriculum map: stages, subjects (tracks), modules and lessons.
# A lesson with a file in content/lessons/<subject>/<id>.yaml only needs its id here.
# A lesson without a file is "planned" and needs a title, level and summary.

stages:
  - id: stage-1
    number: 1
    title: Foundations
    summary: Testing fundamentals, web and mobile basics, HTTP, and basic Java.
  - id: stage-2
    number: 2
    title: Manual payment, API and mobile testing
    summary: Test payments, APIs and mobile apps by hand, with real test design.
  - id: stage-3
    number: 3
    title: Payment architecture and defect isolation
    summary: Trace a payment through every layer and prove which component is at fault.
  - id: stage-4
    number: 4
    title: Advanced Java, Maven, Git and debugging
    summary: The engineering base for automation code that lasts.
  - id: stage-5
    number: 5
    title: Selenium, Appium and the Page Object Model
    summary: Reliable web and mobile UI automation.
  - id: stage-6
    number: 6
    title: Framework design, reporting and CI
    summary: Grow a small reference framework only as real needs appear.
  - id: stage-7
    number: 7
    title: End-to-end scenarios and interview simulations
    summary: Integrated payment scenarios, failure analysis and mock interviews.
  - id: stage-8
    number: 8
    title: 'Full stack: the web platform and the frontend'
    summary: HTML, CSS, accessibility, JavaScript, TypeScript, Node.js and React.
  - id: stage-9
    number: 9
    title: 'Full stack: APIs, data and security'
    summary: An Express API, REST and OpenAPI, PostgreSQL, transactions, authentication and OWASP.
  - id: stage-10
    number: 10
    title: 'Full stack: testing, delivery and the capstone'
    summary: Tests at every layer, Docker, CI/CD, deployment, performance, observability and a shipped app.
  - id: stage-11
    number: 11
    title: 'AI: machine learning foundations'
    summary: Python, the maths that matters, supervised and unsupervised learning and honest evaluation.
  - id: stage-12
    number: 12
    title: 'AI: deep learning'
    summary: Neural networks, training, PyTorch, computer vision, sequence models and transformers.
  - id: stage-13
    number: 13
    title: 'AI: generative AI engineering'
    summary: LLMs, their APIs, prompting, embeddings, RAG, evaluation and guardrails.
  - id: stage-14
    number: 14
    title: 'AI: agents and the Model Context Protocol'
    summary: Tool use, agent loops, LangGraph, CrewAI, memory and MCP servers, clients and security.
  - id: stage-15
    number: 15
    title: 'AI: production and the capstone'
    summary: Deploying and operating AI applications, a capstone agent and a mock interview.
  - id: stage-16
    number: 16
    title: 'Performance: fundamentals and workload models'
    summary: Test types, the metrics that matter, Little's law, requirements and realistic workloads.
  - id: stage-17
    number: 17
    title: 'Performance: JMeter and Locust'
    summary: Script, parameterise, correlate, validate and scale load tests in both tools.
  - id: stage-18
    number: 18
    title: 'Performance: analysis, CI and the capstone'
    summary: Read results honestly, find bottlenecks, gate releases on performance and run a full engagement.
  - id: stage-19
    number: 19
    title: 'Security: foundations and methodology'
    summary: Ethics and scope, threat modelling, the OWASP testing guides, HTTP security and reconnaissance.
  - id: stage-20
    number: 20
    title: 'Security: web and API vulnerabilities'
    summary: Find and prove authentication, access control, injection, XSS, CSRF, SSRF and API flaws.
  - id: stage-21
    number: 21
    title: 'Security: automation, DevSecOps and the capstone'
    summary: DAST, SAST, dependency scanning, security tests in CI, mobile and payments, reporting and an assessment.

subjects:
  - id: foundations
    track: Foundation
    title: Testing and engineering foundations
    summary: How testers think, and the web, mobile and tooling basics everything else builds on.
    modules:
      - id: testing-fundamentals
        title: Testing fundamentals
        stage: stage-1
        summary: Test design techniques and the vocabulary of quality.
        lessons:
          - id: test-design-techniques
          - id: state-transition-testing
          - id: defect-reports-that-get-fixed
          - id: risk-based-testing
      - id: web-mobile-basics
        title: How web and mobile apps work
        stage: stage-1
        summary: Browsers, clients, servers and what happens between a tap and a response.
        lessons:
          - id: client-server-request-flow
          - id: browser-devtools-for-testers
      - id: git-and-debugging
        title: Git and systematic debugging
        stage: stage-4
        summary: Version control and a repeatable way to find root causes.
        lessons:
          - id: git-for-testers
          - id: scientific-debugging

  - id: payments-testing
    track: Track A
    title: Payments manual testing
    summary: Test payment journeys on web and mobile like a payments specialist.
    modules:
      - id: payment-lifecycle
        title: The payment lifecycle
        stage: stage-2
        summary: From initiation to settlement, refund and reconciliation.
        lessons:
          - id: payment-lifecycle-overview
          - id: payment-ecosystem-roles
          - id: void-reversal-refund-chargeback
      - id: checkout-and-methods
        title: Checkout and payment methods
        stage: stage-2
        summary: Cards, wallets, bank payments, tokenisation and 3-D Secure.
        lessons:
          - id: card-payments-and-tokenisation
          - id: three-d-secure-and-redirects
          - id: wallets-and-bank-payments
      - id: payment-failure-modes
        title: Failures, retries and money correctness
        stage: stage-2
        summary: Declines, timeouts, unknown outcomes, duplicates and amounts.
        lessons:
          - id: declines-timeouts-unknown-outcomes
          - id: amounts-currency-rounding
          - id: interruptions-refresh-back-navigation
      - id: refunds-and-reconciliation
        title: Refunds and reconciliation
        stage: stage-2
        summary: Partial refunds, financial invariants, receipts and audit trails.
        lessons:
          - id: partial-refunds-and-invariants
          - id: reconciliation-for-testers
      - id: payment-test-design
        title: Payment test plans and sign-off
        stage: stage-2
        summary: Scenario matrices, test data, sandbox limits and release decisions.
        lessons:
          - id: payment-scenario-matrix
          - id: sandbox-test-data
          - id: pci-dss-awareness

  - id: payment-architecture
    track: Track B
    title: Payment architecture and root-cause analysis
    summary: Follow a payment through every layer and find the component at fault.
    modules:
      - id: payment-request-flow
        title: The payment request flow
        stage: stage-3
        summary: Frontend, API gateway, services, processor, database and queues.
        lessons:
          - id: tracing-a-payment-end-to-end
          - id: sync-vs-async-payments
      - id: observability-and-rca
        title: Observability and root-cause analysis
        stage: stage-3
        summary: Logs, metrics, traces and a diagnostic method that avoids blaming the first layer.
        lessons:
          - id: logs-metrics-traces
          - id: defect-isolation-decision-trees
          - id: inconsistent-status-incidents

  - id: api-testing
    track: Track C
    title: API testing and payment API testing
    summary: HTTP from first principles to payment API contracts.
    modules:
      - id: api-foundations
        title: HTTP for testers
        stage: stage-1
        summary: Requests, responses, methods, status codes, headers and authentication.
        lessons:
          - id: http-request-response-anatomy
          - id: http-methods-safety-idempotency
          - id: status-codes-and-errors
          - id: authentication-and-authorization
      - id: manual-api-testing
        title: Manual API testing
        stage: stage-2
        summary: Postman, environments, schemas, contracts and negative matrices.
        lessons:
          - id: postman-environments-and-collections
          - id: schema-and-contract-validation
          - id: pagination-filtering-rate-limits
      - id: payment-api-testing
        title: Payment API testing
        stage: stage-2
        summary: Create, capture, refund, status, idempotency, webhooks and reconciliation.
        lessons:
          - id: idempotency-keys
          - id: webhooks-and-async-status
          - id: payment-api-negative-matrix

  - id: mobile-testing
    track: Track D
    title: Android and iOS manual testing
    summary: General mobile testing first, then platform specifics and mobile payments.
    modules:
      - id: mobile-fundamentals
        title: Mobile testing fundamentals
        stage: stage-2
        summary: Installs, upgrades, permissions, interruptions, networks and devices.
        lessons:
          - id: mobile-test-planning
          - id: interruptions-and-lifecycle
      - id: android-testing
        title: Android-specific testing
        stage: stage-2
        summary: Activities, intents, deep links, permissions and ADB.
        lessons:
          - id: android-lifecycle-and-process-death
          - id: adb-and-logcat-for-testers
      - id: ios-testing
        title: iOS-specific testing
        stage: stage-2
        summary: Lifecycle, universal links, permissions, Simulator and device logs.
        lessons:
          - id: ios-lifecycle-and-links
      - id: mobile-payment-testing
        title: Mobile payment testing
        stage: stage-7
        summary: App switching, 3-D Secure return flows, termination mid-payment and recovery.
        lessons:
          - id: mobile-payment-interruptions

  - id: java
    track: Track E
    title: Java for interviews and automation
    summary: From fundamentals to the Java that reliable automation frameworks need.
    modules:
      - id: java-basics
        title: Java basics
        stage: stage-1
        summary: Types, control flow, methods, arrays and strings.
        lessons:
          - id: java-types-and-variables
          - id: java-strings-and-stringbuilder
      - id: java-oop
        title: Object-oriented Java
        stage: stage-4
        summary: Encapsulation, inheritance, polymorphism, composition and interfaces.
        lessons:
          - id: java-oop-pillars
          - id: java-exceptions
      - id: java-collections-generics
        title: Collections, generics and equality
        stage: stage-4
        summary: List, Set, Map, equals, hashCode and comparators.
        lessons:
          - id: java-equals-hashcode
          - id: java-collections-choice
      - id: java-modern
        title: Modern Java
        stage: stage-4
        summary: Lambdas, streams, Optional, records and the date/time API.
        lessons:
          - id: java-streams-and-lambdas
          - id: java-concurrency-basics

  - id: ui-automation
    track: Track F
    title: Selenium and Appium with Java
    summary: Reliable web and mobile automation, from locators to gestures.
    modules:
      - id: selenium-webdriver
        title: Selenium WebDriver
        stage: stage-5
        summary: WebDriver, locators, waits, frames, windows and flakiness.
        lessons:
          - id: selenium-locators
          - id: selenium-waits-and-synchronisation
      - id: appium
        title: Appium
        stage: stage-5
        summary: Architecture, drivers, capabilities, contexts and gestures.
        lessons:
          - id: appium-architecture
          - id: appium-native-hybrid-webview

  - id: frameworks
    track: Track G
    title: POM, Maven and automation frameworks
    summary: Page objects, builds, and a framework that grows only when needed.
    modules:
      - id: maven
        title: Maven
        stage: stage-4
        summary: pom.xml, dependencies, scopes, lifecycle, plugins and profiles.
        lessons:
          - id: maven-pom-and-dependencies
          - id: maven-lifecycle-surefire
      - id: page-object-model
        title: The Page Object Model
        stage: stage-5
        summary: Page objects, components and separating intent from mechanics.
        lessons:
          - id: page-objects-done-right
      - id: framework-design
        title: Framework design
        stage: stage-6
        summary: Drivers, configuration, data, reporting, parallelism and CI.
        lessons:
          - id: reference-framework-skeleton
          - id: parallel-runs-and-thread-safety
          - id: ci-quality-gates
      - id: capstone
        title: End-to-end capstone
        stage: stage-7
        summary: An end-to-end payment journey automated across API, web and mobile.
        lessons:
          - id: e2e-payment-capstone
          - id: mock-interview-payments-qa

  - id: playwright
    track: Track H
    title: Playwright with JavaScript and TypeScript
    summary: Modern web automation - the language basics, locators and web-first assertions, fixtures, network mocking and API tests.
    modules:
      - id: js-ts-basics
        title: JavaScript and TypeScript for testers
        stage: stage-4
        summary: Promises, async/await and the types that keep test code honest.
        lessons:
          - id: js-ts-async-and-types
      - id: playwright-test
        title: Playwright Test
        stage: stage-5
        summary: Locators, auto-waiting, web-first assertions, fixtures, network control and API testing.
        lessons:
          - id: playwright-locators-and-assertions
          - id: playwright-fixtures-and-page-objects
          - id: playwright-network-and-api

  - id: fullstack
    track: Track I
    title: 'Full stack web development (TypeScript)'
    summary: 'End to end - HTML, CSS and accessibility, TypeScript, React, a Node.js API, PostgreSQL, security, testing, Docker, CI/CD and deployment.'
    modules:
      - id: web-platform
        title: 'The web platform'
        stage: stage-8
        summary: 'Semantic HTML, CSS layout, responsive design, accessibility and the DOM.'
        lessons:
          - id: html-semantics-and-forms
          - id: css-layout-flexbox-grid
          - id: responsive-design
          - id: web-accessibility-wcag
          - id: dom-events-event-loop
      - id: js-ts-node
        title: 'JavaScript, TypeScript and Node.js'
        stage: stage-8
        summary: 'The language and runtime used on both sides of the stack.'
        lessons:
          - id: modern-javascript-core
          - id: typescript-for-applications
          - id: node-runtime-and-npm
      - id: react-frontend
        title: 'React frontend'
        stage: stage-8
        summary: 'Components, state, effects, forms, routing and data fetching.'
        lessons:
          - id: react-components-and-jsx
          - id: react-state-and-effects
          - id: react-forms-and-validation
          - id: react-routing-and-data-fetching
          - id: frontend-state-management
      - id: backend-api
        title: 'Backend API with Node.js'
        stage: stage-9
        summary: 'An Express API designed, validated, documented and versioned.'
        lessons:
          - id: express-http-server
          - id: rest-api-design
          - id: input-validation-and-error-handling
          - id: openapi-contract-first
      - id: databases
        title: 'Databases with PostgreSQL'
        stage: stage-9
        summary: 'Relational modelling, SQL, indexes, transactions and migrations.'
        lessons:
          - id: relational-modelling-and-sql
          - id: postgres-indexes-and-query-plans
          - id: transactions-and-isolation
          - id: migrations-and-data-access
      - id: security-auth
        title: 'Authentication and web security'
        stage: stage-9
        summary: 'Sessions, tokens, passwords, OAuth and the OWASP Top 10.'
        lessons:
          - id: sessions-cookies-and-tokens
          - id: passwords-oauth-and-oidc
          - id: owasp-top-10-for-developers
      - id: quality-and-delivery
        title: 'Testing, delivery and operations'
        stage: stage-10
        summary: 'Tests at every layer, containers, pipelines, deployment, performance and observability.'
        lessons:
          - id: fullstack-testing-strategy
          - id: docker-and-compose
          - id: ci-cd-for-web-apps
          - id: deployment-and-configuration
          - id: web-performance-and-caching
          - id: observability-for-web-apps
      - id: fullstack-capstone-module
        title: 'Capstone and interview'
        stage: stage-10
        summary: 'Build and ship a full stack app, then defend it in an interview.'
        lessons:
          - id: fullstack-capstone
          - id: fullstack-system-design-interview

  - id: ai-engineering
    track: Track J
    title: 'AI engineering'
    summary: 'Machine learning, deep learning, generative AI engineering, AI agents and the Model Context Protocol - from the maths to production.'
    modules:
      - id: ml-foundations
        title: 'Machine learning foundations'
        stage: stage-11
        summary: 'Python for data, the maths that matters, and classic supervised and unsupervised learning.'
        lessons:
          - id: python-numpy-pandas
          - id: ml-maths-essentials
          - id: linear-regression-gradient-descent
          - id: logistic-regression-classification
          - id: model-evaluation-and-overfitting
          - id: scikit-learn-pipelines
          - id: decision-trees-and-ensembles
          - id: unsupervised-learning
      - id: deep-learning
        title: 'Deep learning'
        stage: stage-12
        summary: 'Neural networks from backpropagation to transformers, in PyTorch.'
        lessons:
          - id: neural-networks-and-backprop
          - id: pytorch-fundamentals
          - id: training-deep-networks
          - id: cnns-for-computer-vision
          - id: sequence-models-and-embeddings
          - id: attention-and-transformers
      - id: genai-engineering
        title: 'Generative AI engineering'
        stage: stage-13
        summary: 'Build applications on large language models - APIs, prompts, retrieval and evaluation.'
        lessons:
          - id: how-llms-work
          - id: llm-apis-and-structured-output
          - id: prompt-engineering
          - id: embeddings-and-vector-search
          - id: retrieval-augmented-generation
          - id: llm-evaluation-and-guardrails
          - id: fine-tuning-vs-rag-vs-prompting
      - id: ai-agents
        title: 'AI agents and agentic workflows'
        stage: stage-14
        summary: 'Tool use, agent loops, LangGraph, CrewAI and memory.'
        lessons:
          - id: tool-use-and-function-calling
          - id: agent-loops-and-workflow-patterns
          - id: langgraph-state-machines
          - id: langgraph-persistence-and-hitl
          - id: multi-agent-systems-crewai
          - id: agent-memory-and-context
      - id: model-context-protocol
        title: 'The Model Context Protocol (MCP)'
        stage: stage-14
        summary: 'Connect AI applications to tools and data through MCP - from the specification.'
        lessons:
          - id: mcp-architecture
          - id: mcp-lifecycle-and-transports
          - id: building-mcp-servers
          - id: building-mcp-clients
          - id: mcp-security-and-authorization
          - id: mcp-multi-agent-architectures
      - id: ai-production-capstone
        title: 'Production AI and capstone'
        stage: stage-15
        summary: 'Run AI applications in production, build a capstone agent and rehearse the interview.'
        lessons:
          - id: deploying-and-operating-ai-apps
          - id: ai-capstone-support-agent
          - id: ai-engineer-mock-interview

  - id: performance-testing
    track: Track K
    title: 'Performance testing (JMeter and Locust)'
    summary: 'Plan, script, run and analyse load tests with Apache JMeter and Locust against a local SandPay API - from Little''s law to a CI performance gate.'
    modules:
      - id: perf-fundamentals
        title: 'Performance testing fundamentals'
        stage: stage-16
        summary: 'Test types, metrics, workload models, requirements, environments and data.'
        lessons:
          - id: performance-testing-types
          - id: performance-metrics-and-percentiles
          - id: littles-law-and-workload-models
          - id: performance-requirements-and-slos
          - id: workload-modelling-from-production
          - id: performance-test-environments-and-data
      - id: jmeter
        title: 'Apache JMeter'
        stage: stage-17
        summary: 'Test plans, thread groups, samplers, correlation, assertions, data, logic, scripting, reports and distributed runs.'
        lessons:
          - id: jmeter-architecture-and-test-plans
          - id: jmeter-thread-groups-and-timers
          - id: jmeter-http-samplers-and-config
          - id: jmeter-correlation-and-extractors
          - id: jmeter-assertions-and-listeners
          - id: jmeter-parameterisation-and-data
          - id: jmeter-logic-controllers
            title: 'Logic controllers and transactions'
            level: intermediate
            summary: 'Transaction, If, Loop, Once Only and Throughput controllers.'
          - id: jmeter-jsr223-and-groovy
            title: 'Scripting JMeter with JSR223 and Groovy'
            level: advanced
            summary: 'When to script, how to cache compiled scripts and what it costs.'
          - id: jmeter-html-dashboard-and-ci
            title: 'The JMeter HTML dashboard and CI runs'
            level: intermediate
            summary: 'Generate the dashboard, read APDEX and percentiles, run JMeter in a pipeline.'
          - id: jmeter-distributed-testing
            title: 'Distributed testing with JMeter'
            level: advanced
            summary: 'Controller and remote servers, data distribution and when one machine is enough.'
      - id: locust
        title: 'Locust'
        stage: stage-17
        summary: 'Users, tasks, validation, flows, events, load shapes and distributed runs in Python.'
        lessons:
          - id: locust-fundamentals
            title: 'Locust fundamentals - users, tasks and wait time'
            level: beginner
            summary: 'Write a locustfile, run it headless and read the statistics.'
          - id: locust-http-validation-and-grouping
            title: 'HTTP sessions, validation and request grouping'
            level: intermediate
            summary: 'catch_response, name grouping, authentication and correlation in Locust.'
          - id: locust-task-sets-and-user-flows
            title: 'Task sets, weights and realistic user flows'
            level: intermediate
            summary: 'TaskSet, SequentialTaskSet, weights, on_start and test data per user.'
          - id: locust-events-and-custom-clients
            title: 'Event hooks, custom metrics and custom clients'
            level: advanced
            summary: 'Hook into requests and test lifecycle, and load non-HTTP systems.'
          - id: locust-load-shapes
            title: 'Load shapes - steps, spikes and soak'
            level: intermediate
            summary: 'LoadTestShape classes for stepped, spike and long-running profiles.'
          - id: locust-distributed-and-ci
            title: 'Distributed Locust and CI runs'
            level: advanced
            summary: 'Master and workers, CSV output, exit codes and failing a pipeline.'
      - id: perf-analysis
        title: 'Analysis, CI and the capstone'
        stage: stage-18
        summary: 'Read results honestly, find bottlenecks, gate releases and run an engagement end to end.'
        lessons:
          - id: reading-load-test-results
            title: 'Reading load test results honestly'
            level: intermediate
            summary: 'Percentiles over time, warm-up, coordinated omission and noisy runs.'
          - id: bottleneck-analysis
            title: 'Bottleneck analysis with the USE and RED methods'
            level: advanced
            summary: 'Saturation, queues, CPU, memory, pools and the one resource that limits throughput.'
          - id: backend-and-database-performance
            title: 'Backend and database performance for testers'
            level: advanced
            summary: 'Connection pools, N+1 queries, indexes, caches and what load tests reveal.'
          - id: frontend-performance-testing
            title: 'Frontend performance testing'
            level: intermediate
            summary: 'Core Web Vitals and lab versus field data - and why it is not load testing.'
          - id: performance-testing-in-ci-cd
            title: 'Performance testing in CI/CD'
            level: advanced
            summary: 'Baselines, regression gates, noise and where performance tests run.'
          - id: performance-testing-payment-systems
            title: 'Performance testing payment systems'
            level: advanced
            summary: 'Idempotency, rate limits and provider sandboxes under load.'
          - id: load-testing-tools-compared
            title: 'JMeter, Locust and other tools compared'
            level: intermediate
            summary: 'JMeter, Locust, k6 and Gatling - models, strengths and how to choose.'
          - id: performance-testing-capstone
            title: 'Capstone - a load test engagement for the SandPay API'
            level: advanced
            summary: 'Plan, script in both tools, run, analyse and report with evidence.'
          - id: performance-testing-mock-interview
            title: 'Performance testing mock interview'
            level: advanced
            summary: 'Explain, design and diagnose load tests under interview conditions.'

  - id: security-testing
    track: Track L
    title: 'Security testing'
    summary: 'Find, prove and report web, API, mobile and payment vulnerabilities - ethically, with the OWASP guides, against a deliberately vulnerable local SandPay portal.'
    modules:
      - id: security-foundations
        title: 'Foundations and methodology'
        stage: stage-19
        summary: 'Ethics and scope, threat modelling, the OWASP guides, HTTP security, proxies and reconnaissance.'
        lessons:
          - id: security-testing-fundamentals
          - id: threat-modelling-stride
          - id: owasp-wstg-and-asvs
          - id: http-security-for-testers
          - id: intercepting-proxies
          - id: reconnaissance-and-attack-surface
      - id: web-vulnerabilities
        title: 'Web application vulnerabilities'
        stage: stage-20
        summary: 'Authentication, sessions, access control, injection, XSS, CSRF, SSRF, files, misconfiguration and cryptography.'
        lessons:
          - id: testing-authentication
            title: 'Testing authentication'
            level: intermediate
            summary: 'Brute force, lockout, rate limits, credential stuffing and password storage.'
          - id: testing-session-management
            title: 'Testing session management'
            level: intermediate
            summary: 'Cookie attributes, fixation, logout, timeouts and token handling.'
          - id: testing-access-control-idor
            title: 'Testing access control and IDOR'
            level: intermediate
            summary: 'Horizontal and vertical privilege checks and object-level authorisation.'
          - id: testing-sql-injection
            title: 'Testing for SQL injection'
            level: intermediate
            summary: 'Detect, confirm and prove injection safely, and verify the fix.'
          - id: testing-cross-site-scripting
            title: 'Testing for cross-site scripting'
            level: intermediate
            summary: 'Reflected, stored and DOM XSS, output encoding and Content Security Policy.'
          - id: testing-csrf-and-clickjacking
            title: 'Testing for CSRF and clickjacking'
            level: intermediate
            summary: 'Forged requests, tokens, SameSite cookies and framing protection.'
          - id: testing-ssrf-and-open-redirects
            title: 'Testing for SSRF and open redirects'
            level: advanced
            summary: 'Server-side request forgery, internal targets and unvalidated redirects.'
          - id: testing-file-handling-and-path-traversal
            title: 'Testing file handling and path traversal'
            level: intermediate
            summary: 'Traversal, uploads and file inclusion - and allow-lists that hold.'
          - id: testing-security-misconfiguration
            title: 'Testing for security misconfiguration'
            level: intermediate
            summary: 'Headers, verbose errors, defaults, version disclosure and exposed admin.'
          - id: testing-cryptography-and-data-exposure
            title: 'Testing cryptography and sensitive data exposure'
            level: advanced
            summary: 'TLS, password hashing, secrets in responses and logs.'
      - id: api-security
        title: 'API security testing'
        stage: stage-20
        summary: 'The OWASP API Security Top 10, tokens, object properties, rate limits and business logic.'
        lessons:
          - id: owasp-api-security-top-10
            title: 'The OWASP API Security Top 10'
            level: intermediate
            summary: 'API-specific risks from BOLA to unsafe consumption of APIs.'
          - id: testing-jwt-and-oauth
            title: 'Testing JWTs and OAuth 2.0'
            level: advanced
            summary: 'Signature and algorithm checks, claims, expiry and OAuth flow flaws.'
          - id: testing-mass-assignment-and-data-exposure
            title: 'Testing mass assignment and excessive data exposure'
            level: intermediate
            summary: 'Object property level authorisation in requests and responses.'
          - id: testing-business-logic-and-rate-limits
            title: 'Testing business logic, races and rate limits'
            level: advanced
            summary: 'Double refunds, race conditions, workflow bypass and resource limits.'
      - id: devsecops
        title: 'Automation and DevSecOps'
        stage: stage-21
        summary: 'DAST, SAST, secrets and dependency scanning, CI gates and security regression suites.'
        lessons:
          - id: dast-with-owasp-zap
            title: 'DAST with OWASP ZAP'
            level: intermediate
            summary: 'Baseline, full and API scans, alert triage and false positives.'
          - id: sast-and-secret-scanning
            title: 'SAST and secret scanning'
            level: intermediate
            summary: 'Static analysis rules, findings triage and keeping secrets out of git.'
          - id: dependency-and-supply-chain-security
            title: 'Dependency and supply chain security'
            level: intermediate
            summary: 'SCA, CVE and CVSS, SBOMs and pinning what you ship.'
          - id: security-testing-in-ci-cd
            title: 'Security testing in CI/CD'
            level: advanced
            summary: 'Which scans run where, gates, baselines and triage that scales.'
          - id: security-regression-automation
            title: 'Automating security regression tests'
            level: intermediate
            summary: 'Turn every confirmed finding into an automated test that stays.'
      - id: security-specialised
        title: 'Mobile, payments, reporting and the capstone'
        stage: stage-21
        summary: 'Mobile app security, payment security, reporting findings and a full assessment.'
        lessons:
          - id: mobile-app-security-testing
            title: 'Mobile app security testing with OWASP MASVS'
            level: advanced
            summary: 'Storage, network, platform and resilience checks from MASVS and MASTG.'
          - id: payments-security-testing
            title: 'Security testing payment systems'
            level: advanced
            summary: 'PCI DSS testing requirements, card data handling, tokenisation and fraud abuse cases.'
          - id: vulnerability-reporting-and-cvss
            title: 'Reporting vulnerabilities and scoring with CVSS'
            level: intermediate
            summary: 'Write findings developers can act on, score them and disclose responsibly.'
          - id: security-testing-capstone
            title: 'Capstone - a security assessment of the SandPay portal'
            level: advanced
            summary: 'Scope, test, prove, report and verify fixes end to end.'
          - id: security-testing-mock-interview
            title: 'Security testing mock interview'
            level: advanced
            summary: 'Explain, find and report vulnerabilities under interview conditions.'

