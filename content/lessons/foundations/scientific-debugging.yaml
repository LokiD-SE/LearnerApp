id: scientific-debugging
title: Scientific debugging - hypotheses, evidence and isolation
subject: foundations
module: git-and-debugging
level: intermediate
status: published
estimatedMinutes: 50
summary: Find root causes with the scientific method - state a hypothesis, predict, experiment, keep a logbook - isolate the cause by simplifying, comparing and bisecting, and tell a confirmed cause from a plausible story.
tags: [debugging, root cause analysis, scientific method, hypothesis, isolation, git bisect, delta debugging, flaky tests, evidence]

environment: |
  - **Sources:** Andreas Zeller, **Why Programs Fail - A Guide to Systematic Debugging**, 2nd edition
    (Morgan Kaufmann, 2009), chapter 6 "Scientific Debugging" (the scientific method, explicit debugging,
    keeping a logbook); and Zeller's free online **The Debugging Book**
    ([debuggingbook.org](https://www.debuggingbook.org/)) - chapters "Introduction to Debugging",
    "Reducing Failure-Inducing Inputs" and "Isolating Failure-Inducing Changes".
  - **Terms:** error, defect, failure and root cause as defined in the **ISTQB CTFL syllabus v4.0.1**,
    section 1.2.3 ([free PDF](https://www.istqb.org/wp-content/uploads/2024/11/ISTQB_CTFL_Syllabus_v4.0.1.pdf)).
  - **Tools:** `git bisect` as documented at [git-scm.com/docs/git-bisect](https://git-scm.com/docs/git-bisect);
    output shown is from **Git 2.43**, trimmed, with shortened commit ids.
  - **Examples:** the demo shop's tests, services and incidents are **fictional**.

prerequisites:
  - defect-reports-that-get-fixed
  - git-for-testers

concepts:
  - id: scientific-method-debugging
    name: The scientific method for debugging
    summary: Observe the failure, state a hypothesis consistent with the observations, derive a prediction, test it by experiment, then refine or replace the hypothesis - written down in a logbook - until it becomes a diagnosis.
  - id: isolating-the-cause
    name: Isolating the cause
    summary: Make the failure reproducible, then narrow it - simplify the input, compare a passing and a failing case, change one thing at a time, and bisect the history.
  - id: confirmed-vs-plausible-cause
    name: Confirmed versus plausible cause
    summary: A plausible cause fits the story; a confirmed cause predicted an experiment's result correctly, ruled out alternatives, and makes the failure disappear and return when it is removed and restored.

objectives:
  - Apply the scientific method to a failure, writing hypotheses, predictions, experiments, observations and conclusions in a logbook.
  - Isolate the cause of a failure by simplifying the input, comparing passing and failing cases, and bisecting the history with `git bisect`.
  - Decide whether evidence confirms a root cause or only makes it plausible, and design the experiment that would confirm it.
  - Explain why changing one thing at a time and recording every experiment make debugging faster.

sections:
  - id: intuition
    kind: intuition
    concepts: [scientific-method-debugging]
    title: The idea in plain language
    body: |
      A doctor doesn't prescribe the first medicine that comes to mind. They listen to the symptoms, think
      "it could be an infection", predict "if it is, the blood test will show X", run the test, and - if the
      result doesn't match - think again. Only when a test result **matches the prediction** do they treat
      it.

      Most debugging goes the other way: "I bet it's the cache" → clear the cache → it works once → "fixed".
      Next week it is back, because the cache was never the cause - the failure was intermittent and that
      run happened to pass.

      Scientific debugging is the doctor's method applied to software: **guess, predict, test, and believe
      only what the test showed**. It sounds slower. It is faster, because you stop going round in circles.

  - id: what
    kind: what
    concepts: [scientific-method-debugging, confirmed-vs-plausible-cause]
    title: What the method is
    body: |
      Zeller's version of the scientific method for debugging (*Why Programs Fail*, chapter 6):

      1. **Observe** a failure (as described in the problem report).
      2. **Invent a hypothesis** about the failure cause that is consistent with the observations.
      3. Use the hypothesis to make **predictions**.
      4. **Test** the hypothesis by experiments and further observations:
         - if the experiment satisfies the predictions, **refine** the hypothesis;
         - if not, create an **alternative** hypothesis.
      5. Repeat 3 and 4 until the hypothesis can no longer be refined.

      What you end with is a **diagnosis**: a theory of how the failure came to be that **explains the
      earlier observations** and **predicts future ones** - for example, that the failure disappears after
      a particular fix.

      Vocabulary (ISTQB 1.2.3): a person's **error** produces a **defect**, which may cause a **failure**;
      the **root cause** is the fundamental reason the problem occurred. Debugging goes from the failure to
      the defect; root cause analysis asks why the defect was made, so similar ones can be prevented.

  - id: why
    kind: why
    concepts: [confirmed-vs-plausible-cause]
    title: Why intuition alone fails
    body: |
      Experience gives good hunches - Zeller notes that debugging "gurus" are people with a large memory of
      earlier failures. But hunches go wrong in predictable ways:

      - **Confirmation bias** - you look for evidence that supports your first idea and explain away the
        rest.
      - **Coincidence taken for cause** - "it started after Tuesday's deployment" is a correlation; many
        things changed on Tuesday.
      - **Fixing the symptom** - a retry or a longer timeout makes the test pass, and the defect ships.
      - **Losing track** - after two hours you no longer remember which ideas you already ruled out, so you
        test them again.

      The Debugging Book lists the anti-patterns in its "Devil's guide to debugging" - scattering print
      statements everywhere, "debugging into existence" by randomly changing code, and using the most
      obvious fix - and the remedy: understand the code, **fix the problem, not the symptom**, and **proceed
      systematically**.

  - id: visual
    kind: visual
    concepts: [scientific-method-debugging]
    title: "Flowchart: the debugging loop"
    body: |
      The loop ends only when a hypothesis survives an experiment designed to refute it - and the fix is
      checked against the same prediction.

      ```mermaid
      flowchart TD
          A[Observe and reproduce the failure] --> B[State a hypothesis consistent with all observations]
          B --> C[Derive a prediction - if H is true, experiment E shows X]
          C --> D[Run the experiment, change one thing]
          D --> E{Observation matches the prediction?}
          E -- No --> F[Reject H, record why, form an alternative]
          F --> B
          E -- Yes --> G{Can H be refined further?}
          G -- Yes --> B
          G -- No --> H[Diagnosis - remove the cause, failure gone; restore it, failure back]
          H --> I[Fix, then confirmation and regression tests]
      ```

  - id: steps
    kind: steps
    concepts: [isolating-the-cause]
    title: Step by step - isolating the cause
    body: |
      **1. Reproduce it.** A failure you can trigger on demand is half solved. Record the exact environment,
      data and steps (see [defect reports that get fixed](#/lesson/defect-reports-that-get-fixed)). For an
      intermittent failure, find the **rate** ("fails 6 times in 20 runs") - you need it to judge later
      whether a change made a difference.

      **2. Simplify the input.** Remove whatever isn't needed for the failure: half the test data, half the
      steps, half the configuration - and check it still fails. The Debugging Book automates this as
      **delta debugging** ("Reducing Failure-Inducing Inputs"). A 3-line reproduction gets fixed in an hour;
      a 300-step one waits.

      **3. Compare passing and failing cases.** Same test, two environments; same request, two users;
      yesterday's build and today's. List every difference, then **change one at a time** until the failure
      moves with one of them.

      **4. Narrow the location.** Divide the system by layer (client, network, gateway, service, database -
      see [the request flow](#/lesson/client-server-request-flow)): check the data at each boundary and find
      the first place it is wrong. The defect is between the last correct and the first wrong point.

      **5. Bisect the history** when it "used to work". `git bisect` binary-searches the commits between a
      good and a bad version - about log₂(N) tests for N commits - and can run a script for you.

      **6. Write it all down.** Every hypothesis, prediction, experiment, observation and conclusion goes in
      the logbook (below). You can stop and resume, hand it over, and you will never test the same idea
      twice.

  - id: example
    kind: example
    concepts: [scientific-method-debugging, confirmed-vs-plausible-cause, isolating-the-cause]
    title: "Real-world example: the checkout test that fails one run in four"
    body: |
      **Observations:** since Monday, `CheckoutTest.discountIsApplied` fails in CI about 1 run in 4 -
      `expected 118.80 EUR but was 120.00 EUR`. It never fails locally. CI runs test classes **in
      parallel**; locally they run one after another.

      The logbook (the format Zeller recommends):

      | # | Hypothesis | Prediction | Experiment | Observation | Conclusion |
      |---|---|---|---|---|---|
      | 1 | The discount service is slow in CI, so the total is read too early | with an explicit wait for the discount line, the test passes 20 of 20 | add the wait, run 20× in CI | fails 5 of 20 | **rejected** |
      | 2 | Another test running at the same time changes the discount | checkout run **alone** in CI never fails; run in parallel with the other suites it fails | 20× alone, 20× in parallel | 0 of 20 alone, 6 of 20 in parallel | **supported** - refine |
      | 3 | `RefundTest`'s clean-up deletes the coupons of the **shared** test customer | parallel with only `RefundTest` fails; parallel with everything except `RefundTest` never fails | run both combinations 20× | 5 of 20 with it, 0 of 20 without | **supported** - refine |
      | 4 | The cause is the shared customer: give each test its own and the failure goes away | 50 parallel runs, 0 failures; restoring the shared customer brings failures back | change the fixture, 50 runs; then revert, 50 runs | 0 of 50; then 12 of 50 | **confirmed - diagnosis** |

      Notice:

      - Hypothesis 1 was **plausible** - CI is slower - and wrong. Without the experiment, a longer wait
        would have been "the fix", and the test would have kept failing.
      - Every experiment **changed one thing** and used **enough runs** to tell 1 in 4 from 0.
      - Hypothesis 4 is confirmed both ways: **remove the cause → the failure goes; restore it → it comes
        back**. That is the standard of proof for a root cause.

      The root cause - test data shared between parallel tests - is a design problem in the framework; the
      fix is per-test data, covered in
      [concurrency basics for parallel test runs](#/lesson/java-concurrency-basics).

  - id: code
    kind: code
    concepts: [isolating-the-cause]
    title: Bisecting with git
    collapsed: true
    body: |
      The rule "amounts from 1.00 EUR are allowed" started failing somewhere between tag `v1.0` (good) and
      `HEAD` (bad), eight commits apart. A script that exits **0 for good** and **1-127 (except 125) for
      bad** lets Git do the search; **125** means "can't test this commit, skip it".

      ```bash
      #!/bin/sh
      # check.sh - exit 0 if the commit is good, non-zero if bad
      mvn -q -Dtest=AmountRuleTest test || exit 1
      ```

      ```bash
      git bisect start HEAD v1.0 --     # bad first, then good
      git bisect run ./check.sh
      git bisect reset                  # back to where you started
      ```

      Trimmed output from Git 2.43:

      ```plaintext
      Bisecting: 3 revisions left to test after this (roughly 2 steps)
      [224ebec] Change 4
      running './check.sh'
      Bisecting: 1 revision left to test after this (roughly 1 step)
      [3cd4525] Change 6
      running './check.sh'
      Bisecting: 0 revisions left to test after this (roughly 0 steps)
      [6b897f4] Change 5
      running './check.sh'
      6b897f4 is the first bad commit
      ```

      Three test runs instead of eight. Then `git show 6b897f4` shows exactly what changed.

      Two cautions:

      - **Flaky checks mislead bisect.** If the failure is intermittent, make the script run the test
        enough times (for example 20) and fail if any run fails - otherwise a "good" verdict is just luck.
      - **Exit code 125 is for commits that can't be built or tested** - use it rather than calling them bad.

      Manual bisecting works the same way: `git bisect start`, `git bisect bad`, `git bisect good <commit>`,
      then mark each commit Git checks out with `git bisect good` or `git bisect bad`.

  - id: tests
    kind: tests
    concepts: [confirmed-vs-plausible-cause]
    title: Experiments that confirm a cause
    body: |
      Before you write "root cause:" in a report, check the evidence against this list:

      | Check | Question | Example from the checkout case |
      |---|---|---|
      | Explains all observations | does it explain *every* fact, including the ones that don't fit a simple story? | it explains "only in CI" (parallel runs) and "1 in 4" (overlap timing) |
      | Made a risky prediction | did it predict something that could have turned out false? | "alone it never fails" could have failed |
      | Remove → gone | when you remove the cause, does the failure disappear, with enough runs? | per-test customer: 0 of 50 |
      | Restore → back | when you put the cause back, does the failure return? | shared customer again: 12 of 50 |
      | Alternatives ruled out | what else could explain it, and was it tested? | the slow discount service was tested and rejected |
      | Fix verified against the prediction | after the real fix, does the original failure stay gone? | 200 CI runs over two days, 0 failures |

      If any row is "not checked", call it a **suspected** or **likely** cause in the report, say what
      evidence supports it, and say which experiment would confirm it.

  - id: mistakes
    kind: mistakes
    concepts: [scientific-method-debugging, isolating-the-cause, confirmed-vs-plausible-cause]
    title: Common mistakes and how to avoid them
    body: |
      - **Changing several things at once.** It passes - but which change fixed it? Undo all but one.
      - **Too few runs for an intermittent failure.** At 1 failure in 4, two passes in a row happen often by
        chance. Decide the number of runs before the experiment.
      - **Hypotheses that can't fail.** "Something in the environment" predicts nothing. A hypothesis must
        say which experiment would prove it wrong.
      - **Stopping at the first supported hypothesis.** "Another test interferes" is a start; refine it to
        *which* test and *how*.
      - **Fixing the symptom.** Retries, sleeps and longer timeouts hide a cause. Use them only after the
        cause is known and the fix is planned.
      - **Debugging in your head.** Write the logbook. Zeller compares keeping experiments only in memory to
        playing Mastermind without the board.
      - **Trusting the "obvious" cause after a deployment.** Correlation in time is a reason to form a
        hypothesis, not a conclusion.
      - **Not explaining it to someone.** Stating the problem aloud - to a colleague or, as The Debugging
        Book suggests, a rubber duck - often reveals the assumption you never checked.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [isolating-the-cause]
    title: Choosing an isolation technique
    body: |
      | Technique | Best when | Cost | Watch out for |
      |---|---|---|---|
      | Simplify the input (delta debugging) | big inputs, files, long test scenarios | many runs, cheap each | the failure may depend on a combination - remove in halves, not one item at a time |
      | Compare passing and failing | "works for me", "only in CI", "only for this customer" | listing all differences | hidden differences (time zone, feature flags, data age) |
      | Divide by layer | wrong data somewhere in a chain | access to logs and data at each boundary | logs that don't share a request id |
      | `git bisect` | "it used to work" with a known good version | one build and test per step, ~log₂(N) | flaky checks, commits that don't build (use 125) |
      | Debugger and tracing | the location is known and you need the details | your time | changing timing hides race conditions |

      The scientific method is the frame around all of them: each technique is a way to design the next
      experiment.

  - id: summary
    kind: summary
    title: Summary and quick reference
    body: |
      - **Observe → hypothesis → prediction → experiment → refine or replace → diagnosis** (Zeller, *Why
        Programs Fail*, chapter 6).
      - A hypothesis must make a prediction that **could be false**.
      - **Logbook:** hypothesis, prediction, experiment, observation, conclusion - every time.
      - Isolate: **reproduce**, **simplify**, **compare** good and bad, **change one thing**, **divide by
        layer**, **bisect** history (`git bisect run`: 0 good, 1-127 bad, 125 skip).
      - **Confirmed** = explains everything, risky prediction held, remove → gone, restore → back,
        alternatives ruled out. Otherwise it is **plausible** - say so.
      - Fix the problem, not the symptom; then confirmation and regression tests.

exercises:
  - id: order-scientific-method
    type: order
    concept: scientific-method-debugging
    skill: recall
    title: The loop in order
    prompt: Put the steps of scientific debugging in order.
    items:
      - id: observe
        text: Observe and reproduce the failure
      - id: hypothesis
        text: State a hypothesis that is consistent with all observations
      - id: predict
        text: Derive a prediction that the hypothesis makes
      - id: experiment
        text: Run an experiment that tests the prediction
      - id: conclude
        text: Compare the observation with the prediction and refine or reject the hypothesis
      - id: diagnose
        text: When the hypothesis can no longer be refined, state the diagnosis and fix the cause
    hints:
      - A prediction comes from a hypothesis, and an experiment tests a prediction.
    solution: |
      Observe → hypothesis → prediction → experiment → conclusion → (repeat) → diagnosis. The prediction
      must come **before** the experiment, otherwise any result can be read as support.

  - id: testable-hypothesis
    type: mcq
    concept: scientific-method-debugging
    skill: application
    title: Which hypothesis is useful?
    prompt: |
      Refunds above 1,000.00 EUR fail with `500` on staging but work on production. Which hypothesis is the
      most useful starting point?
    options:
      - id: environment
        text: "\"Something is different on staging.\""
        feedback: True but useless - it predicts nothing specific, so no experiment can prove it wrong.
      - id: limit-config
        text: "\"Staging's refund limit is configured at 1,000.00 EUR, and the service throws instead of returning a clear error - so a refund of 1,000.00 EUR succeeds and 1,000.01 EUR fails, and the configuration value differs from production.\""
        feedback: Correct - it explains the observations and makes specific predictions (a boundary at exactly 1,000.00, a configuration difference) that one or two experiments can check.
      - id: database
        text: "\"The database is broken.\""
        feedback: Too vague, and it doesn't explain why only amounts above 1,000 fail. A broken database would affect smaller refunds too.
      - id: fix-first
        text: "\"Let's restart the refund service and see.\""
        feedback: That is an action without a hypothesis. If it "works", you've learned nothing about the cause - and it may come back.
    correct: [limit-config]
    hints:
      - A useful hypothesis says what you would see in an experiment if it were true.
      - Which option explains why the amount matters?
    solution: |
      **The configured limit.** It is consistent with all observations (only above 1,000, only on staging)
      and predicts results you can check in minutes: try 1,000.00 and 1,000.01; compare the configuration
      values. If 1,000.01 works, the hypothesis is rejected and you've still learned something.
    followUp: |
      The experiment shows 1,000.00 fails too, but 999.99 works. How do you refine the hypothesis?

  - id: plausible-or-confirmed
    type: mcq
    concept: confirmed-vs-plausible-cause
    skill: analysis
    title: Is the cause confirmed?
    prompt: |
      Orders sometimes get two confirmation emails. A developer says: *"It's the retry in the email client -
      it was added last week, and the duplicates started last week."* Which additional evidence would
      **confirm** that cause?
    options:
      - id: timing
        text: The duplicates started on the same day the retry was deployed.
        feedback: That is the correlation you already have. Many other things may have changed that day.
      - id: remove-restore
        text: With the retry disabled, no duplicates in a week of normal traffic; re-enabled on staging under the same conditions, duplicates return - and the logs show the second email sent by a retry after a timeout.
        feedback: Correct - removing the suspected cause makes the failure disappear, restoring it brings it back, and the logs show the mechanism. That is confirmation.
      - id: senior
        text: The senior developer who wrote the retry agrees it's probably the cause.
        feedback: Agreement makes it more plausible, but it is not evidence.
      - id: code-review
        text: Reading the retry code shows it could send twice if the mail server times out.
        feedback: That shows the cause is possible - a plausible mechanism. It still has to be shown to actually happen.
    correct: [remove-restore]
    hints:
      - What is the strongest test of "X causes Y"?
    solution: |
      **Remove → gone, restore → back, with the mechanism in the logs.** Timing, opinions and "it could
      happen" make the cause plausible; an experiment whose result was predicted - and could have come out
      differently - confirms it.
    followUp: |
      Disabling the retry on production isn't allowed. Design an experiment on staging that confirms or
      rejects the hypothesis.

  - id: debug-logbook
    type: debug
    concept: confirmed-vs-plausible-cause
    skill: analysis
    title: Find the unjustified conclusion
    prompt: |
      A colleague's debugging logbook for an intermittent login failure (about 1 in 3 attempts). Click the
      line whose conclusion is **not** justified by its experiment.
    language: plaintext
    code: |
      Observation: login fails ~1 in 3 attempts on staging since Monday, "invalid session" error
      H1 session cookie lost on redirect | predict: missing cookie in failing attempts | 30 attempts with HAR | cookie present in all 10 failures | REJECTED
      H2 two app servers, one with the old signing key | predict: all failures from server B | 30 attempts, log server id | 10 of 10 failures from B, 0 of 20 from A | SUPPORTED
      H3 server B's key differs from A's | predict: key fingerprints differ | compare fingerprints | they differ | SUPPORTED
      H4 fix: rotate B to the same key | predict: 0 failures | 1 attempt after rotation | it worked | CONFIRMED - root cause found
    correctLines: [5]
    lineNotes:
      - line: 2
        note: Justified - the prediction (missing cookie) was false in all 10 failures, so the hypothesis is rightly rejected.
      - line: 3
        note: Justified as SUPPORTED - all failures came from server B, which the hypothesis predicted, with enough attempts to tell 1 in 3 from 0.
    hints:
      - The failure happened about one time in three. How many attempts does it take to show it is gone?
    solution: |
      **Line 5.** One successful attempt proves nothing for a failure that happened only one time in three
      - two of three attempts passed even before the fix. Run enough attempts (for example 30 again, with
      the server id logged) and expect 0 failures; ideally also show that pointing traffic back at a server
      with the old key brings the failures back.
    followUp: |
      Rewrite line 5 with an experiment that would justify "confirmed".

  - id: bisect-exit-codes
    type: mcq
    concept: isolating-the-cause
    skill: application
    title: The commit that doesn't build
    prompt: |
      You run `git bisect run ./check.sh`. Some commits in the range don't compile because of an unrelated,
      later-fixed build error, so the test can't run on them. What should `check.sh` do for those commits?
    options:
      - id: exit-125
        text: Exit with code 125, so bisect skips the commit
        feedback: Correct - git bisect run treats 125 as "this revision can't be tested" and skips it.
      - id: exit-1
        text: Exit with code 1, marking it bad
        feedback: That would claim the commit has your failure when it really just doesn't build - bisect may then blame the wrong commit.
      - id: exit-0
        text: Exit with code 0, marking it good
        feedback: That claims the failure is absent, which you don't know. Bisect may then search in the wrong half.
      - id: exit-255
        text: Exit with code 255
        feedback: Exit codes above 127 abort the whole bisect run, rather than skipping one commit.
    correct: [exit-125]
    hints:
      - The git-bisect documentation reserves one special code for "cannot be tested".
    solution: |
      **Exit 125.** For `git bisect run`: 0 = good, 1-127 except 125 = bad, 125 = skip, anything else aborts.
      For example: build first, `exit 125` if the build fails, then run the test and exit 0 or 1.
    followUp: |
      The failure you are bisecting is intermittent (1 in 5). How would you change `check.sh` so the verdicts
      can be trusted?

  - id: minimise-input
    type: mcq
    concept: isolating-the-cause
    skill: application
    title: The import that fails
    prompt: |
      An import of a 2,000-line CSV file of payments fails with "invalid record" but doesn't say which line.
      A small sample file imports fine. What is the most efficient next step?
    options:
      - id: halve
        text: Split the file in half, import each half, keep the failing half, and repeat
        feedback: Correct - halving finds the failing record in about 11 imports (log₂ 2,000), and you can keep going until only the record - or the minimal combination - remains.
      - id: line-by-line
        text: Import the lines one at a time until one fails
        feedback: That can take up to 2,000 imports, and misses failures that need a combination of lines (for example a duplicate id).
      - id: read
        text: Read all 2,000 lines carefully looking for a mistake
        feedback: Possible, but slow and unreliable - and the importer's idea of "invalid" may not be yours.
      - id: report
        text: Report it to the developers with the whole file attached
        feedback: Reporting it is right, but a minimal failing file makes the report far more useful - and it takes minutes to produce.
    correct: [halve]
    hints:
      - How many halvings does it take to get from 2,000 lines to one?
    solution: |
      **Halve and keep the failing half.** That is the core idea of delta debugging. If neither half fails
      on its own, the failure needs lines from both halves - a combination such as a duplicate - which is
      itself a valuable clue. Attach the minimal file to the report.
    followUp: |
      Both halves import fine on their own, but the whole file fails. What does that tell you, and what do
      you try next?

  - id: interview-flaky-test
    type: interview
    concept: isolating-the-cause
    skill: application
    title: "Interview: the flaky test"
    prompt: |
      *"One of our end-to-end tests fails about once every ten runs in CI, never locally. The team wants to
      add a retry. What would you do?"* Answer as you would in the interview.
    hints:
      - What is the retry hiding - a test problem or a product problem?
      - What differs between CI and local runs?
      - How do you know a change helped, for a failure that happens one time in ten?
    modelAnswer: |
      I'd resist the retry until we know the cause, because a retry can hide a real product defect - a race
      condition users will also hit - and makes the suite slower and less trusted.

      First I'd collect evidence from failing runs: the error, screenshots or traces, timestamps, which
      worker ran it and what else ran at the same time. Then I'd list the differences between CI and local
      - parallelism, speed, data, environment, browser version - and form hypotheses that each predict
      something: "it fails only when running in parallel with suite X", "it fails when the API answers
      slower than 2 s".

      I'd test them one at a time with enough runs to see a 1-in-10 failure - say 50 runs per experiment -
      and keep a logbook. When one is supported, I'd refine it until removing the cause makes the failure
      disappear and restoring it brings it back. Then the fix goes where the cause is: test isolation,
      proper waits, or a product defect report.

      If the release is blocked meanwhile, I'd quarantine the test with a tracking ticket rather than add a
      silent retry.
    rubric:
      - Explained why a retry before diagnosis is risky (hides product defects, erodes trust)
      - Collected evidence from failing runs
      - Listed differences between CI and local as hypotheses
      - Made hypotheses testable with predictions
      - Used enough runs per experiment for an intermittent failure
      - Required remove-and-restore evidence before calling it the cause
      - Proposed quarantine with tracking as a temporary measure instead of a silent retry
    followUps:
      - The cause turns out to be in the product, not the test. How does that change your report?
      - How many runs would you use, and why?
      - When is a retry acceptable?
    solution: |
      The strongest answers treat flakiness as **a failure to diagnose, not to suppress** - and show the
      method: evidence, testable hypotheses, enough runs, confirmation.

  - id: explain-one-change
    type: short
    concept: isolating-the-cause
    skill: recall
    title: One change at a time
    prompt: In two or three sentences, explain why each debugging experiment should change only one thing.
    hints:
      - If two things change and the failure disappears, what do you know?
    modelAnswer: |
      If an experiment changes several things and the result changes, you can't tell which change caused
      it - or whether one helped and another hid the failure. Changing one thing at a time makes each result
      attributable, so the logbook builds up real knowledge instead of a lucky combination.
    rubric:
      - Said several changes make the result impossible to attribute
      - Mentioned that changes can interact or mask each other
      - Connected it to building reliable conclusions
    solution: |
      The same reasoning is why a defect report keeps the steps minimal and why `git bisect` works on
      single commits.

placement:
  - id: place-prediction
    type: mcq
    concept: scientific-method-debugging
    skill: application
    title: What comes next?
    prompt: |
      Hypothesis: *"The export fails because file names with spaces aren't escaped."* What is the next step
      of the scientific method?
    options:
      - id: predict
        text: Derive a prediction - an export of a file named "a b.csv" fails, "a_b.csv" succeeds - and run that experiment.
        feedback: Correct - a hypothesis is useful only through the prediction it makes, tested by an experiment that could refute it.
      - id: fix
        text: Add escaping to the code and close the defect.
        feedback: That treats the hypothesis as proven. If the cause is something else, the fix does nothing and the defect stays open.
      - id: more-hypotheses
        text: List more hypotheses before testing any.
        feedback: Alternatives are useful, but this one already makes a cheap, specific prediction - test it now.
      - id: ask
        text: Ask the developer whether they agree.
        feedback: Agreement isn't evidence. The experiment takes a minute and settles the question.
    correct: [predict]
    solution: |
      **Predict, then experiment.** If both names succeed, the hypothesis is rejected - record that and form
      an alternative.

  - id: place-isolate
    type: mcq
    concept: isolating-the-cause
    skill: application
    title: It used to work
    prompt: |
      A test that passed on release tag `v2.3` fails on today's `main`, 120 commits later. The test is fast
      and deterministic. What isolates the failure-inducing commit most efficiently?
    options:
      - id: bisect
        text: git bisect between v2.3 (good) and main (bad), ideally with git bisect run and the test as the script
        feedback: Correct - binary search needs about log₂(120), so roughly 7 test runs, and can run automatically.
      - id: read-log
        text: Read the 120 commit messages and guess which one did it
        feedback: Messages describe intentions, not side effects. A guess still has to be tested - bisect tests systematically.
      - id: revert-all
        text: Revert the most recent commits one by one until it passes
        feedback: Linear search can take up to 120 steps, and reverting on main affects everyone.
      - id: latest
        text: Assume it is the latest commit and revert it
        feedback: That is a plausible guess, not a test. If it's wrong, you've removed a good change and kept the defect.
    correct: [bisect]
    solution: |
      **`git bisect`.** About 7 steps for 120 commits. Then read the first bad commit's diff to form a precise
      hypothesis about the cause.

  - id: place-confirm
    type: mcq
    concept: confirmed-vs-plausible-cause
    skill: analysis
    title: Root cause or not yet?
    prompt: Which evidence best shows that a suspected cause is the **confirmed** root cause of an intermittent failure?
    options:
      - id: remove-restore
        text: With the cause removed, 0 failures in 50 runs; with it restored, failures return at the original rate
        feedback: Correct - the failure follows the cause in both directions, over enough runs to be meaningful.
      - id: one-pass
        text: After removing it, the next run passed
        feedback: An intermittent failure often passes anyway - one run proves nothing.
      - id: timing
        text: The failures started when the suspected change was deployed
        feedback: Correlation in time is a reason to suspect it, not proof - other things changed too.
      - id: explanation
        text: The cause explains how the failure could happen
        feedback: A mechanism that fits makes it plausible. Confirmation needs an experiment whose predicted result could have been different.
    correct: [remove-restore]
    solution: |
      **Remove → gone, restore → back, with enough runs.** Anything less is a plausible cause - report it as
      such and name the experiment that would confirm it.

recall:
  - id: recall-steps
    concept: scientific-method-debugging
    prompt: What are the steps of Zeller's scientific method for debugging?
    answer: Observe the failure; invent a hypothesis consistent with the observations; make predictions; test them by experiments - refine the hypothesis if they hold, replace it if not; repeat until it can't be refined. The result is a diagnosis.
  - id: recall-logbook
    concept: scientific-method-debugging
    prompt: What goes into a debugging logbook entry?
    answer: The hypothesis, the prediction, the experiment, the observation and the conclusion (rejected, supported, confirmed).
  - id: recall-diagnosis
    concept: scientific-method-debugging
    prompt: What makes a hypothesis a diagnosis?
    answer: It explains all earlier observations, including the failure, and predicts future ones - such as the failure disappearing after a particular fix.
  - id: recall-bisect-codes
    concept: isolating-the-cause
    prompt: What do the exit codes of a git bisect run script mean?
    answer: 0 good, 1-127 except 125 bad, 125 skip (can't be tested), anything else aborts the bisect.
  - id: recall-simplify
    concept: isolating-the-cause
    prompt: How do you shrink a large failing input efficiently?
    answer: Split it in halves, keep the part that still fails, and repeat - the idea behind delta debugging. If neither half fails alone, the failure needs a combination.
  - id: recall-confirmed
    concept: confirmed-vs-plausible-cause
    prompt: What is the standard of proof for a root cause?
    answer: It explains all observations, its risky prediction held, alternatives were ruled out, and removing it makes the failure disappear while restoring it brings it back.

