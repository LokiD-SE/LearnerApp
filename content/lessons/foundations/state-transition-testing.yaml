id: state-transition-testing
title: State transition testing
subject: foundations
module: testing-fundamentals
level: beginner
status: published
estimatedMinutes: 45
summary: Model a feature as states and events, then test every legal move - and try the illegal ones - with coverage you can count.
tags: [test design, state transition, state diagram, state table, coverage, istqb, black-box, otp, lockout]

environment: |
  - **Standards and syllabi:** notation and coverage criteria follow the **ISTQB Certified Tester
    Foundation Level syllabus v4.0.1**, section 4.2.4 "State Transition Testing" -
    [free PDF from ISTQB](https://www.istqb.org/wp-content/uploads/2024/11/ISTQB_CTFL_Syllabus_v4.0.1.pdf).
    State transition testing is also one of the techniques in **ISO/IEC/IEEE 29119-4:2021**
    ([ISO catalogue page](https://www.iso.org/standard/79430.html)).
  - **Universal:** any feature whose response depends on **what happened before** - logins, payments,
    orders, subscriptions, wizards, device connections - can be modelled this way.
  - **Diagrams:** drawn with Mermaid state diagrams; the transition label syntax
    `event [guard] / action` is the syllabus's.
  - **Examples:** the SandPay one-time passcode (OTP) check and its limits (3 attempts, 5 minutes) are
    **fictional**. Real limits come from your product's requirements and, for card payments, from the
    scheme and issuer - check them, never assume them.

prerequisites:
  - test-design-techniques

concepts:
  - id: state-models
    name: State models
    summary: States, events, guard conditions and actions, drawn as a state diagram or written as a state table that also shows the invalid transitions.
  - id: state-transition-coverage
    name: State transition coverage
    summary: All states, valid transitions (0-switch) and all transitions coverage - and why each invalid transition gets its own test.

objectives:
  - Draw a state diagram and a state table for a feature from its requirements, with events, guards and actions.
  - Derive test cases as event sequences that reach 100 % all states, valid transitions and all transitions coverage.
  - Explain why invalid transitions are tested one per test case.
  - Find requirement gaps by checking every empty cell of a state table.

sections:
  - id: intuition
    kind: intuition
    concepts: [state-models]
    title: The idea in plain language
    body: |
      A ticket barrier at a station is **closed** until you tap a valid ticket; then it is **open** until
      you walk through, and then it closes again. Tapping a ticket while it is already open does nothing
      useful. Pushing a closed barrier does nothing either - or sounds an alarm.

      The same action - "tap", "push" - has a different result depending on the barrier's **state**. You
      can't test such a thing with single inputs; you have to test **sequences**: tap then walk, walk
      without tapping, tap twice.

      State transition testing gives you a map of those states and moves, so you can choose the sequences
      systematically, count what you covered, and spot the moves nobody specified.

  - id: what
    kind: what
    concepts: [state-models]
    title: "What a state model contains"
    body: |
      | Element | Meaning | Example (OTP check) |
      |---|---|---|
      | **State** | a condition the system is in, which decides how it reacts | *Code sent*, *Verified*, *Locked*, *Expired* |
      | **Event** | something that happens and may cause a transition | the customer enters a wrong code |
      | **Guard condition** | an extra condition that must hold for this transition | `[2 failures already]` |
      | **Action** | what the system does during the transition | lock the card for online payments |
      | **Transition** | a move from one state to another (or back to the same one) | *Code sent* → *Locked* |

      A transition is labelled **`event [guard] / action`**; guard and action are left out when there
      are none (ISTQB 4.2.4).

      There are two equivalent ways to write the model:

      - **State diagram** - states as boxes, transitions as arrows. Easy to read, but it only shows what
        *can* happen.
      - **State table** - one row per state, one column per event; each cell holds the target state and
        action. **Empty cells are the invalid transitions** - events that should change nothing (or be
        refused) in that state. The table makes them explicit, the diagram hides them.

  - id: why
    kind: why
    concepts: [state-models, state-transition-coverage]
    title: Why history-dependent features need their own technique
    body: |
      Equivalence partitioning looks at one input at a time. But "the customer entered a wrong code" is
      harmless the first time and locks the card the third time. **The same input belongs to different
      partitions depending on history** - so the history has to be part of the test.

      Defects that live here are some of the most expensive:

      - a **reset that shouldn't happen** - "resend code" also resets the failure counter, so an attacker
        gets unlimited guesses;
      - an **invalid transition that is accepted** - capturing a payment that was already voided, or
        refunding twice;
      - a **state with no way out** - an order stuck in *PENDING* forever because nobody specified what
        happens when the bank never answers.

      A state table forces you to ask, for **every** state and event: *what should happen here?* Each
      empty cell you can't explain is a requirement gap.

  - id: visual
    kind: visual
    concepts: [state-models]
    title: "State diagram: the SandPay one-time passcode"
    body: |
      Fictional requirement: *"SandPay sends a six-digit code. The customer has 5 minutes and 3
      attempts. The third wrong code locks the card for online payments. An expired code can be resent;
      resending does not reset the attempt counter."*

      ```mermaid
      stateDiagram-v2
          [*] --> CodeSent: payment needs verification / send code
          CodeSent --> Verified: correct code / approve payment
          CodeSent --> CodeSent: wrong code [fewer than 2 failures] / count failure
          CodeSent --> Locked: wrong code [2 failures already] / lock card
          CodeSent --> Expired: 5 minutes pass
          CodeSent --> CodeSent: resend / new code, restart timer
          Expired --> CodeSent: resend / new code, restart timer
          Verified --> [*]
          Locked --> [*]
      ```

      Notice the **two arrows for "wrong code"** out of *Code sent*: the guard decides which one fires.
      And notice what the diagram does **not** show - what happens if the customer types the old code
      after it expired. That is where the state table comes in.

  - id: internals
    kind: internals
    concepts: [state-models]
    title: The same model as a state table
    body: |
      Rows are states, columns are events. A dash is an **invalid transition**: the event must not change
      the state, and the customer should get a clear message.

      | State \ Event | E1 correct code | E2 wrong code | E3 5 minutes pass | E4 resend |
      |---|---|---|---|---|
      | **Code sent** | Verified / approve | Code sent / count failure *[fewer than 2]* or Locked / lock card *[2 already]* | Expired | Code sent / new code |
      | **Expired** | – | – | – | Code sent / new code |
      | **Verified** | – | – | – | – |
      | **Locked** | – | – | – | – |

      Counting: **6 valid transitions** (five out of *Code sent*, counting each guarded branch, plus
      *Expired* → *Code sent*) and **11 invalid cells**.

      Each dash is a question for the requirements:

      - *Expired* + correct (old) code - refused with "this code has expired"? Does it count as an attempt?
      - *Locked* + resend - refused? Does the lock ever end, or does the customer have to call the bank?
      - *Verified* + any event - ignored? Can a second submission approve the payment twice?

      The last one is an idempotency question - see
      [Idempotency keys and duplicate payment requests](#/lesson/idempotency-keys).

  - id: steps
    kind: steps
    concepts: [state-transition-coverage]
    title: Step by step - from model to test cases
    body: |
      A test case is a **sequence of events** from the start state, with the expected state (and
      action) after each one. One test usually covers several transitions.

      **All states coverage** - every state visited:

      - T1: send → E1 → *Verified*
      - T2: send → E3 → *Expired* → E4 → *Code sent* → E2 → E2 → E2 → *Locked*

      Two tests, 4 of 4 states. But the transition "resend while the code is still valid" was never used.

      **Valid transitions coverage (0-switch)** - every valid transition exercised:

      - T1 and T2 as above, plus
      - T3: send → E4 → *Code sent* (new code) → E1 → *Verified*

      Three tests, 6 of 6 valid transitions. This is the **most widely used** criterion (ISTQB 4.2.4).

      **All transitions coverage** - valid transitions **and attempts at every invalid one**:

      - T4: send → E3 → *Expired* → E1 with the old code → still *Expired*, "code expired"
      - T5: send → E2 → E2 → E2 → *Locked* → E4 → still *Locked*, no new code sent
      - ...one test per remaining invalid cell (11 in total).

      **One invalid transition per test.** If T5 also tried a correct code after the resend, and the
      resend wrongly unlocked the card, the correct code would *succeed* and you would see "Verified" -
      one defect hiding the other. The syllabus calls this **defect masking**.

      Strength order: all states < valid transitions < all transitions. Full valid transitions coverage
      guarantees full all states coverage; full all transitions coverage guarantees both, and the
      syllabus recommends it as a minimum for mission- and safety-critical software.

  - id: example
    kind: example
    concepts: [state-models, state-transition-coverage]
    title: "Real-world example: the order that stays pending"
    body: |
      In the [SandPay Demo Shop](shop/index.html), some test cards leave an order **PENDING**; the order
      page then updates to **SUCCEEDED** or **FAILED** a few seconds later. Modelled:

      ```mermaid
      stateDiagram-v2
          [*] --> PENDING: pay with sandpay-unknown or sandpay-pending-then-failed
          [*] --> SUCCEEDED: pay with sandpay-success
          PENDING --> SUCCEEDED: SandPay confirms
          PENDING --> FAILED: SandPay reports failure
          SUCCEEDED --> [*]
          FAILED --> [*]
      ```

      The diagram is small, but the **state table** adds the events a real customer causes - *reload
      the order page*, *go back to checkout* - in every state. What the shop does today:

      | State \ Event | Reload the order page | Go back to checkout |
      |---|---|---|
      | PENDING | still PENDING, keeps updating | the cart is empty - the same order can't be paid twice |
      | SUCCEEDED | still SUCCEEDED | the cart is empty |
      | FAILED | still FAILED - must never flip to SUCCEEDED | the cart is empty too |

      The last cell is a finding: the shop empties the cart when the order is **placed**, so a customer
      whose payment failed has to add everything again. Is that intended? The table raised the question
      before anyone complained. The same method
      applied to the payment lifecycle - for example *capture* in state *voided* - is in
      [Payment lifecycle - authorise, capture, settle, refund](#/lesson/payment-lifecycle-overview).

  - id: tests
    kind: tests
    concepts: [state-transition-coverage]
    title: Positive and negative test cases
    body: |
      For the OTP model. Evidence is what proves both the final state **and** the action.

      | ID | Sequence | Expected | Evidence |
      |---|---|---|---|
      | P1 | send → correct code | *Verified*, payment approved | payment status in the SandPay sandbox dashboard |
      | P2 | send → resend → correct **new** code | *Verified* | two "code sent" entries, one approval |
      | P3 | send → wrong → wrong → correct | *Verified* (2 failures are allowed) | approval, failure count 2 |
      | N1 | send → wrong ×3 | *Locked*, card locked | lock event, error message |
      | N2 | send → wrong ×2 → resend → wrong | *Locked* - resend did **not** reset the counter | lock event after 3 failures in total |
      | N3 | send → wait 5 min → old code | *Expired*, "code expired", not approved | no approval |
      | N4 | send → wait 5 min → resend → **old** code | refused - the old code is no longer valid | error message |
      | N5 | locked → resend | still *Locked*, no new code sent | no new "code sent" entry |

      N2 tests a **sequence of two transitions** that matters for security. Pairs of transitions are
      called 1-switch coverage - beyond the foundation syllabus, but worth it wherever a counter or a
      timer can be reset.

  - id: mistakes
    kind: mistakes
    concepts: [state-models, state-transition-coverage]
    title: Common mistakes and how to debug them
    body: |
      - **Testing only the happy path.** All states coverage is weak; aim at least for valid transitions
        coverage.
      - **Ignoring the empty cells.** The invalid transitions are where accepted-but-illegal moves hide.
      - **Several invalid events in one test.** One defect masks the next - one invalid transition per
        test.
      - **Forgetting guards.** "Wrong code" is two transitions with different guards; test both sides of
        the guard - the guard is a boundary (2 failures versus fewer).
      - **Forgetting timers and external events.** Time passing, a webhook arriving, a session expiring
        are events too.
      - **Checking only the screen.** Verify the state where it is stored (API, database, sandbox
        dashboard) and the action (was the card really locked? was the code really sent?).
      - **A model nobody agreed on.** Review the diagram with the developer and product owner before
        writing tests - disagreements are defects found early.

      **Debugging an unexpected state:** write down the exact event sequence, the state after each event
      and the timestamps. Most "random" state bugs are a missed event (a timer, a duplicate request) that
      only a precise sequence reveals.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [state-transition-coverage]
    title: Limitations and alternatives
    body: |
      | Criterion | Tests needed | Finds | Misses |
      |---|---|---|---|
      | All states | fewest | unreachable states | wrong transitions, illegal moves |
      | Valid transitions (0-switch) | moderate | wrong targets, missing transitions | accepted illegal moves |
      | All transitions | most | illegal moves that are accepted | wrong behaviour that needs longer sequences |
      | 1-switch (pairs) | many | resets and sequence-dependent defects | longer histories |

      The model grows quickly: 10 states and 10 events give 100 cells. Keep models **small and focused**
      on one feature, and choose the criterion by risk - all transitions for payment states and security
      lockouts, valid transitions for a settings wizard.

      A state model also says nothing about **data inside** a state - the amount, the currency. Combine
      it with equivalence partitioning and boundary values from
      [the previous lesson](#/lesson/test-design-techniques).

  - id: summary
    kind: summary
    title: Summary and quick reference
    body: |
      - Model = **states, events, guards, actions**; label transitions `event [guard] / action`.
      - **State table** rows = states, columns = events; **empty cells = invalid transitions**.
      - Test case = **sequence of events** with the expected state after each.
      - Coverage: **all states** < **valid transitions (0-switch)** < **all transitions** (valid +
        attempted invalid).
      - **One invalid transition per test** - avoid defect masking.
      - Every empty cell is a question for the requirements. Source: ISTQB CTFL v4.0.1, 4.2.4.

exercises:
  - id: count-valid-transitions
    type: mcq
    concept: state-transition-coverage
    skill: analysis
    title: Is all states coverage enough?
    prompt: |
      For the OTP model, a colleague has two tests:

      - T1: send → correct code → *Verified*
      - T2: send → wait 5 minutes → *Expired* → resend → wrong ×3 → *Locked*

      Which statement is true?
    options:
      - id: full-transitions
        text: They give 100 % valid transitions coverage.
        feedback: They visit every state, but "resend while the code is still valid" (Code sent → Code sent by resend) is never exercised - 5 of 6 valid transitions.
      - id: all-states-only
        text: They give 100 % all states coverage, but not 100 % valid transitions coverage.
        feedback: Correct - all four states are visited, but one valid transition (resend in Code sent) is missing, so valid transitions coverage is 5/6.
      - id: all-transitions
        text: They give 100 % all transitions coverage.
        feedback: All transitions coverage also requires attempting every invalid transition, and these tests attempt none.
      - id: neither
        text: They don't even give all states coverage - Expired is never left correctly.
        feedback: T2 reaches Expired and leaves it by resend, which is a valid transition. All four states are visited.
    correct: [all-states-only]
    hints:
      - List the four states and tick the ones each test visits.
      - Now list the six valid transitions and tick those. Which one is never used?
    solution: |
      **100 % all states, 5 of 6 valid transitions.** The missing transition is *resend while in Code
      sent*. Add T3: send → resend → correct new code → *Verified*. That is the syllabus's point: all
      states coverage can be reached without exercising all transitions.
    followUp: |
      How many tests at least do you need for 100 % all transitions coverage of the OTP table, given
      one invalid transition per test? Explain your count.

  - id: empty-cell-meaning
    type: mcq
    concept: state-models
    skill: recognition
    title: What an empty cell means
    prompt: In a state table, what does an empty cell (or a dash) represent?
    options:
      - id: invalid
        text: An invalid transition - the event should not cause a change in that state.
        feedback: Correct - the state table shows invalid transitions explicitly as empty cells, which a state diagram does not.
      - id: untested
        text: A transition that hasn't been tested yet.
        feedback: The table is a model of behaviour, not a test log. Empty cells describe the system, not the testing progress.
      - id: unknown
        text: Behaviour the requirements forgot, so it can be ignored.
        feedback: An empty cell you can't explain may well be a requirement gap - but that makes it something to ask about and test, not to ignore.
      - id: same-state
        text: A self-transition - the system goes back to the same state and performs an action.
        feedback: A self-transition is a valid transition and gets its own entry in the cell (target state and action), like "wrong code / count failure" in Code sent.
    correct: [invalid]
    hints:
      - The syllabus contrasts the state table with the state diagram on exactly this point.
    solution: |
      **An invalid transition.** Testing it means attempting the event and checking nothing changes -
      and that the user gets a sensible message. This is what all transitions coverage adds.
    followUp: |
      In the OTP table, which invalid transition would you test first, and why?

  - id: order-locked-sequence
    type: order
    concept: state-transition-coverage
    skill: application
    title: Build the test sequence for N2
    prompt: |
      Put the steps of test N2 in order. It proves that resending a code does **not** reset the failure
      counter.
    items:
      - id: start
        text: Start a payment that needs verification - state Code sent, code A sent
      - id: wrong1
        text: Enter a wrong code - still Code sent, 1 failure
      - id: wrong2
        text: Enter a wrong code - still Code sent, 2 failures
      - id: resend
        text: Resend - still Code sent, code B sent, failures still 2
      - id: wrong3
        text: Enter a wrong code - state Locked, card locked
      - id: evidence
        text: Check the lock in the sandbox dashboard and that no payment was approved
    hints:
      - The resend has to come after some failures, otherwise there is nothing to reset.
      - The test ends with the evidence, not with the last event.
    solution: |
      Start → wrong → wrong → resend → wrong → check evidence. If the system wrongly reset the counter on
      resend, the third wrong code would leave it in *Code sent* with 1 failure - the test catches it at
      the last event.

  - id: debug-counter-reset
    type: debug
    concept: state-models
    skill: analysis
    title: Find the transition that breaks the model
    prompt: |
      Test N2 fails: after wrong, wrong, resend, wrong the state is still `CODE_SENT`. Click the line that
      implements a transition differently from the model.
    language: java
    code: |
      State on(Event event) {
          switch (state) {
              case CODE_SENT -> {
                  if (event == Event.CORRECT_CODE) state = State.VERIFIED;
                  else if (event == Event.WRONG_CODE) {
                      failures++;
                      if (failures == 3) state = State.LOCKED;
                  } else if (event == Event.TIMEOUT) state = State.EXPIRED;
                  else if (event == Event.RESEND) { sendNewCode(); failures = 0; }
              }
              case EXPIRED -> { if (event == Event.RESEND) { sendNewCode(); state = State.CODE_SENT; } }
              default -> { }
          }
          return state;
      }
    correctLines: [9]
    lineNotes:
      - line: 7
        note: Locking on the third failure is what the model says - "2 failures already" plus this one.
      - line: 11
        note: Resend from Expired is a valid transition in the model, and it correctly doesn't touch the counter.
    hints:
      - Which event happens between the second and third wrong code in N2?
      - Read the requirement again - what must resend not do?
    solution: |
      **Line 9.** The resend transition sets `failures = 0`, but the model says resending does **not**
      reset the attempt counter. After wrong, wrong, resend the counter is 0 again, so the next wrong code
      only makes it 1. An attacker could guess forever by resending every two attempts - a security
      defect, so report it with high severity.
    followUp: |
      Line 11 never sets `failures` either. What happens if the customer fails twice, lets the code expire,
      resends and fails once more? Is that what the requirement wants?

  - id: shop-order-states
    type: testdesign
    concept: state-transition-coverage
    skill: application
    title: Test the pending order
    prompt: |
      Using the demo shop's order states (PENDING, SUCCEEDED, FAILED) and the events *SandPay confirms*,
      *SandPay reports failure*, *customer reloads the order page* and *customer goes back to checkout*,
      write test cases that reach **valid transitions coverage** plus **two invalid transitions** you
      consider most important. For each, give the sequence, the expected state and the evidence.
    hints:
      - Which test cards in the shop lead to PENDING, and what do they settle as?
      - An invalid transition here is an event that must NOT change a final state.
      - Paying twice for the same order is the expensive mistake. Which state makes a customer try it?
    modelAnswer: |
      Valid transitions:

      1. Pay with `sandpay-success` → SUCCEEDED. Evidence: order page status, one order.
      2. Pay with `sandpay-unknown` → PENDING → (SandPay confirms) SUCCEEDED. Evidence: status changes
         on the page without a reload; one order.
      3. Pay with `sandpay-pending-then-failed` → PENDING → (SandPay reports failure) FAILED. Evidence:
         status FAILED with the "not charged" message.

      Invalid transitions (one per test):

      4. FAILED → reload the page several times → stays FAILED, never flips to SUCCEEDED. Evidence:
         status after each reload.
      5. PENDING → go back to checkout → the cart is empty, so the same order can't be paid again.
         Evidence: cart count 0, still one order in the order list.
    rubric:
      - Covered all three valid transitions (direct success, pending to succeeded, pending to failed)
      - Gave each test as an event sequence with the expected state after each event
      - Chose invalid transitions that matter (a final state changing, or a duplicate payment)
      - Tested only one invalid transition per test case
      - Named evidence beyond the screen, such as the order count or the requests sent
    solution: |
      Compare with the model answer. The most valuable test is **5** - a customer who gets impatient
      while a payment is pending is the classic source of double charges. Also note what you saw after
      FAILED: the cart is empty, which is worth raising with the product owner.
    followUp: |
      Add the event "the customer closes the browser while PENDING and opens the order link the next
      day". Which state should they see, and what does the shop need to make that work?

  - id: interview-lockout
    type: interview
    concept: state-models
    skill: application
    title: "Interview: testing an account lockout"
    prompt: |
      *"Our app locks an account after five failed logins for 15 minutes. How would you test it?"*
      Answer as you would in the interview.
    hints:
      - Start by naming the technique and sketching the states.
      - The guard (five failures) is a boundary. The timer is an event.
      - What could reset the counter by mistake?
    modelAnswer: |
      It depends on history, so I'd model it as a state machine: *Active (n failures)*, *Locked*, and
      back to *Active* when 15 minutes pass. Events: wrong password, correct password, 15 minutes pass,
      password reset.

      Tests: four failures then a correct password logs in (boundary below the guard) - and I'd ask
      whether a successful login resets the counter; five failures lock (on the guard); a correct
      password while locked is refused (invalid transition - the most important one, otherwise the lock
      is useless); after 15 minutes the account works again; 14 minutes isn't enough. For the timer I'd
      use a test clock or a configurable duration rather than waiting.

      Then the history questions: does the counter reset on success, on password reset, after some
      time? Is it per account or per device? Does the lock message reveal that the account exists? I'd
      check the lock in the database or audit log, not only on the screen.
    rubric:
      - Modelled it as states and events instead of single inputs
      - Tested both sides of the five-failure guard
      - Tested a correct password while locked (invalid transition)
      - Tested the unlock timer, including just before 15 minutes
      - Asked what resets the counter
      - Mentioned how to test the timer without waiting (test clock or configuration)
      - Mentioned a security aspect such as account enumeration or verifying the lock server-side
    followUps:
      - The counter is stored in the browser. What can a tester do with that?
      - Two devices try wrong passwords at the same time. What could go wrong, and how do you test it?
      - How would you automate the 15-minute unlock?
    solution: |
      Strong answers show the model, test **both sides of the guard and the invalid transition**, and
      ask about the resets - that is where real lockout bugs live.

  - id: explain-defect-masking
    type: short
    concept: state-transition-coverage
    skill: recall
    title: One invalid transition per test
    prompt: In two or three sentences, explain why each test case should attempt only one invalid transition.
    hints:
      - What can happen to the second invalid event if the first one is wrongly accepted?
    modelAnswer: |
      If the first invalid transition is wrongly accepted, the system is in a different state than the
      test expects, so the second invalid event is tested in the wrong state - or appears to behave
      correctly. One defect hides the other (defect masking), and you can't tell from the result which
      transition is broken.
    rubric:
      - Explained that the first wrongly accepted transition changes the state
      - Named defect masking or described one defect hiding another
      - Mentioned that the failing transition becomes hard to identify
    solution: |
      The syllabus names this **defect masking** (4.2.4). The same reason makes one invalid value per
      test the rule in equivalence partitioning.

placement:
  - id: place-guard
    type: mcq
    concept: state-models
    skill: application
    title: Read the transition label
    prompt: |
      A transition is labelled `withdraw [balance ≥ amount] / dispense cash`. What does it say?
    options:
      - id: right
        text: When a withdraw event happens and the balance covers the amount, the system moves on and dispenses cash.
        feedback: Correct - event, then the guard in brackets, then the action after the slash.
      - id: guard-as-event
        text: When the balance becomes at least the amount, the system dispenses cash.
        feedback: The balance condition is a guard, not the event. Nothing happens until the withdraw event occurs.
      - id: action-as-state
        text: The system enters a state called "dispense cash".
        feedback: The part after the slash is an action performed during the transition, not the target state - the target is where the arrow points.
      - id: always
        text: Withdraw always dispenses cash; the bracket is a comment.
        feedback: The bracket is a guard condition. Without it holding, this transition doesn't fire - typically another transition handles "insufficient balance".
    correct: [right]
    solution: |
      **Event `[guard]` / action.** Test both sides of the guard: a withdraw with exactly the balance
      (guard true, a boundary) and one cent more (guard false).

  - id: place-coverage
    type: mcq
    concept: state-transition-coverage
    skill: analysis
    title: Which criterion includes the others?
    prompt: Which statement about state transition coverage criteria is correct?
    options:
      - id: all-transitions
        text: 100 % all transitions coverage guarantees 100 % valid transitions and 100 % all states coverage.
        feedback: Correct - all transitions includes every valid transition (which visits every state) plus attempts at the invalid ones.
      - id: states-strongest
        text: 100 % all states coverage guarantees 100 % valid transitions coverage.
        feedback: The reverse holds. You can visit every state while skipping some transitions, as in the OTP example.
      - id: invalid-optional
        text: All transitions coverage only counts transitions shown in the state diagram.
        feedback: It counts all transitions in the state table, including the invalid ones in the empty cells, which the diagram doesn't show.
      - id: combine-invalid
        text: To save time, all transitions coverage tests all invalid transitions in one test case.
        feedback: That invites defect masking. The syllabus recommends one invalid transition per test case.
    correct: [all-transitions]
    solution: |
      **All transitions ⊃ valid transitions ⊃ all states.** Full all transitions coverage is the
      syllabus's suggested minimum for mission- and safety-critical software.

recall:
  - id: recall-label
    concept: state-models
    prompt: How is a transition labelled in a state diagram?
    answer: event [guard condition] / action - guard and action are left out when there are none.
  - id: recall-table-vs-diagram
    concept: state-models
    prompt: What does a state table show that a state diagram doesn't?
    answer: The invalid transitions, as empty cells - every state and event combination is listed.
  - id: recall-zero-switch
    concept: state-transition-coverage
    prompt: What is another name for valid transitions coverage, and what does 100 % require?
    answer: 0-switch coverage. Every single valid transition must be exercised by at least one test.
  - id: recall-all-transitions
    concept: state-transition-coverage
    prompt: What does all transitions coverage add to valid transitions coverage?
    answer: Attempts at every invalid transition in the state table, each in its own test case.
  - id: recall-masking
    concept: state-transition-coverage
    prompt: What is defect masking?
    answer: One defect preventing another from being detected - for example a wrongly accepted transition putting the system in a state where the next check can't fail.

