id: risk-based-testing
title: Risk-based testing
subject: foundations
module: testing-fundamentals
level: intermediate
status: published
estimatedMinutes: 45
summary: Spend test effort where failure would hurt most - identify product risks, rate their likelihood and impact, and let the risk level decide scope, depth, technique and order.
tags: [risk-based testing, risk analysis, product risk, project risk, likelihood, impact, test strategy, prioritisation, istqb]

environment: |
  - **Standards and syllabi:** definitions follow the **ISTQB Certified Tester Foundation Level syllabus
    v4.0.1**, section 5.2 "Risk Management" -
    [free PDF from ISTQB](https://www.istqb.org/wp-content/uploads/2024/11/ISTQB_CTFL_Syllabus_v4.0.1.pdf).
    The syllabus bases risk management on **ISO 31000** (risk management guidelines) and product risks on
    the quality characteristics of **ISO/IEC 25010** (functional suitability, performance efficiency,
    security, reliability and others). The test process standard **ISO/IEC/IEEE 29119-2** builds test
    planning on identifying and analysing risks.
  - **Universal:** the method fits any product and any process - a sprint, a release, a single change.
  - **Common practice, not a standard:** the 1-5 rating scales and the "likelihood × impact" score used in
    the examples are a widespread convention. The syllabus allows quantitative scores or a qualitative
    risk matrix; teams choose their own scales.
  - **Examples:** the SandPay Demo Shop release, its features and its ratings are **fictional**.

prerequisites:
  - test-design-techniques

concepts:
  - id: risk-level-assessment
    name: Risk level assessment
    summary: Rate each risk's likelihood and impact, and combine them - as a product or in a risk matrix - into a risk level that orders the risks.
  - id: product-and-project-risks
    name: Product and project risks
    summary: Product risks are about the quality of what is built; project risks are about schedule, people, tools and suppliers. Testing mitigates product risks.
  - id: risk-driven-test-scope
    name: Risk-driven test scope
    summary: Use the risk level to choose scope, test levels and types, techniques, coverage, effort and order - and keep monitoring the risks as you learn.

objectives:
  - Distinguish product risks from project risks and give examples of each.
  - Rate risks by likelihood and impact and order them by risk level, quantitatively or with a risk matrix.
  - Turn a risk assessment into decisions about test scope, technique, coverage, effort and order.
  - Choose a response for a risk - mitigation by testing, acceptance, transfer or a contingency plan - and explain it.

sections:
  - id: intuition
    kind: intuition
    concepts: [risk-level-assessment]
    title: The idea in plain language
    body: |
      Before a long drive you can't check every part of the car. So you check the **brakes and the tyres**
      carefully, glance at the wipers, and don't check the radio at all. Not because the radio can't
      break, but because a broken radio **hurts less** than a brake failure - and tyres wear out **more
      often** than the glovebox.

      You have just done risk-based testing: for each thing that could go wrong you asked **how likely
      is it?** and **how bad would it be?**, and spent your limited time accordingly.

      Testing software is the same, with one difference: you write the reasoning down, so the team can
      see what was tested deeply, what lightly, and **what risk is left** when you stop.

  - id: what
    kind: what
    concepts: [risk-level-assessment, product-and-project-risks]
    title: What risk means in testing
    body: |
      **Risk** - a potential event, hazard, threat or situation whose occurrence causes an adverse effect
      (ISTQB 5.2.1). It has two attributes:

      - **Risk likelihood** - the probability that it occurs (more than zero, less than one);
      - **Risk impact** - the harm if it does.

      Together they give the **risk level**: the higher the level, the more important the treatment.

      | | Product risk | Project risk |
      |---|---|---|
      | About | the **quality of the product** - ISO/IEC 25010 characteristics | the **management and control** of the project |
      | Examples | wrong calculations, missing functionality, slow responses, security holes, poor usability | late deliveries, wrong estimates, missing skills, staff shortage, scope creep, a supplier failing |
      | If it happens | unhappy users, lost revenue and trust, damage to others, penalties | schedule, budget or scope slip |
      | What testing does | **mitigates** it - testing finds the failures before users do | is **affected** by it - a late build squeezes test time |

      **Risk-based testing** is the test approach in which test activities are selected, prioritised and
      managed based on risk analysis and risk control (ISTQB 5.2).

  - id: why
    kind: why
    concepts: [risk-driven-test-scope]
    title: Why testing needs a way to choose
    body: |
      Two of the seven testing principles in the syllabus make risk-based testing necessary:

      - **Exhaustive testing is impossible** - so something must decide what gets tested, and how deeply.
      - **Defects cluster together** - a few components hold most of the defects, and predicted or
        observed clusters are "an important input for risk-based testing".

      Without an explicit decision, the choice is made anyway - by habit, by what is easy to automate,
      by the loudest stakeholder. Typical results: a week of tests on the settings page and one happy-path
      test of the refund. Risk-based testing replaces that with an argument the team can check:

      > "Refunds are high impact and recently rewritten, so they get decision-table tests, boundary
      > values on amounts, and run first. Product reviews are low impact - one smoke test."

      It also gives you the honest answer to "are we done?": **the remaining risk is X**, and the
      product owner decides whether X is acceptable.

  - id: internals
    kind: internals
    concepts: [risk-level-assessment, risk-driven-test-scope]
    title: How risk analysis and risk control work
    body: |
      The syllabus splits risk management into two activities, each with two parts:

      **1. Risk analysis**

      - **Risk identification** - a comprehensive list of risks, from brainstorming, workshops,
        interviews, cause-effect diagrams, past incidents and defect data.
      - **Risk assessment** - categorise each risk, rate its likelihood and impact, compute its risk level,
        prioritise, and propose how to handle it.

      Assessment can be:

      - **quantitative** - risk level = likelihood × impact, for example 0.3 × 9 = 2.7 (or 3 × 5 = 15 on
        1-5 scales);
      - **qualitative** - likelihood and impact as low / medium / high, and a **risk matrix** gives the
        level;
      - or a mix of both.

      **What drives likelihood:** new or changed code, complex logic, many integrations, new technology,
      inexperienced team, time pressure, a history of defects there. **What drives impact:** money, data
      loss, security, legal duties, number of users affected, reputation, whether there is a workaround.

      **2. Risk control**

      - **Risk mitigation** - carry out the proposed actions to reduce the risk level.
      - **Risk monitoring** - check that mitigation works, improve the assessment with new information,
        and spot **emerging risks**.

      Responses to a product risk (ISTQB 5.2.4): **mitigate it by testing**, **accept** it, **transfer** it
      (to an insurer or a supplier), or prepare a **contingency plan** (a feature flag, a rollback, a manual
      fallback). Testing mitigates by choosing the right testers, independence, reviews and static
      analysis, techniques and coverage, test types, and dynamic and regression testing.

  - id: visual
    kind: visual
    concepts: [risk-level-assessment]
    title: "Risk matrix: the demo shop release"
    body: |
      Each point is a product risk, placed by likelihood (left to right) and impact (bottom to top). The
      quadrant decides how deep and how early testing goes.

      ```mermaid
      quadrantChart
          title Product risks for the release
          x-axis Low likelihood --> High likelihood
          y-axis Low impact --> High impact
          quadrant-1 Test first and deepest
          quadrant-2 Test thoroughly
          quadrant-3 Test lightly
          quadrant-4 Test early and watch
          Duplicate charge on retry: [0.3, 0.85]
          Partial refund total wrong: [0.7, 0.85]
          Checkout slow at peak: [0.6, 0.6]
          Order email delayed: [0.75, 0.25]
          Search ranking odd: [0.55, 0.15]
          Review stars misaligned: [0.2, 0.1]
      ```

      Notice the top-left point: the duplicate charge is **not very likely**, but its impact is so high
      that it still gets thorough testing. Ranking by likelihood alone would have missed it.

  - id: steps
    kind: steps
    concepts: [risk-level-assessment, risk-driven-test-scope]
    title: Step by step - a risk workshop for one release
    body: |
      1. **Gather the right people for an hour:** product owner (impact), developers and architects
         (likelihood), support (what users complain about), testers (what broke before).
      2. **Identify risks** per feature or change, phrased as **what could go wrong for whom**:
         "a customer is charged twice when the network times out" - not "payments".
      3. **Rate** each risk's likelihood and impact on the agreed scale. Rate independently, then discuss
         the big disagreements - they usually reveal missing knowledge.
      4. **Compute the risk level** and sort.
      5. **Decide the response** for each risk: test depth and technique, test level, who tests, when -
         or acceptance, transfer or a contingency plan.
      6. **Write it down** in a risk register next to the test plan, and trace tests to risks.
      7. **Monitor** during testing: defects found raise likelihood; a feature dropped removes a risk; a
         late change adds one. Re-rate and re-plan.
      8. **Report in risk terms** at the end: which risks are covered, which remain, and how big they are.

  - id: example
    kind: example
    concepts: [risk-driven-test-scope, product-and-project-risks]
    title: "Real-world example: three days for the release"
    body: |
      The demo shop release adds partial refunds and a new checkout retry. Testing has **three days**.
      An excerpt of the risk register (likelihood and impact 1-5, level = L × I):

      | Risk | L | I | Level | Response |
      |---|---|---|---|---|
      | Partial refunds can exceed the captured amount | 3 | 5 | **15** | decision table + boundary values on amounts; day 1; developer pairs on fixes |
      | Retry after a timeout charges twice | 2 | 5 | **10** | idempotency tests from the [idempotency lesson](#/lesson/idempotency-keys); day 1 |
      | Checkout slower than 2 s at peak | 3 | 3 | **9** | short load test on the staging copy; day 2 |
      | Order email arrives late | 4 | 2 | **8** | accept; monitor the email queue after release |
      | Review stars misaligned on small screens | 2 | 1 | **2** | one exploratory pass on two phones; day 3 if time |
      | **Project risk:** the refund build arrives a day late | 3 | 4 | 12 | not tested away - escalate; prepare refunds tests on the old build's API so day 1 isn't lost |

      What the register changed:

      - **Order:** refunds and retries first, so their defects are found while there is time to fix them.
      - **Technique and depth:** formal techniques for the top risks, exploratory testing for the bottom.
      - **Not everything is tested:** the late email is **accepted** and **monitored** - a decision the
        product owner signs, not one the tester takes silently.
      - **The project risk** is handled by planning and escalation, because testing can't mitigate it.

  - id: when
    kind: when
    concepts: [risk-driven-test-scope]
    title: When risk decides - and when it doesn't
    body: |
      Use risk-based testing for **every** plan where time is limited - which is every plan. It also
      chooses what goes into the regression suite and in which order it runs.

      But risk is not the only input:

      - **Mandatory tests** - legal, regulatory or contractual requirements (accessibility, data
        protection, scheme certification for payments) are tested whatever their risk score.
      - **Acceptance criteria** agreed with the customer must be checked.
      - **Coverage targets** may be set by the organisation's test strategy.

      And risk analysis is only as good as the knowledge in the room. A brand-new technology with no
      history gets a **higher likelihood**, not a lower one, because nobody knows yet where it breaks.

  - id: mistakes
    kind: mistakes
    concepts: [risk-level-assessment, product-and-project-risks, risk-driven-test-scope]
    title: Common mistakes and how to avoid them
    body: |
      - **Vague risks** - "payments might fail". Write who is harmed and how, so you can design a test.
      - **Rating by likelihood only** - rare but catastrophic risks (double charges, data leaks) drop to the
        bottom. Always multiply or use the matrix.
      - **Testers rating impact alone** - impact is a business judgement; get the product owner's rating.
      - **Mixing project and product risks** - "the build is late" can't be mitigated by more test cases;
        it needs planning and escalation.
      - **A register written once and never updated** - risk monitoring is half of risk control. Defects
        found are new evidence about likelihood.
      - **Silent acceptance** - skipping low risks without telling anyone. Accepting a risk is a decision
        to record and have signed off.
      - **Treating the score as precise** - 3 × 5 = 15 versus 4 × 4 = 16 is not a real difference. Use the
        numbers to sort roughly and discuss the borderline cases.
      - **Reporting test counts instead of risk** - "412 tests passed" says less than "all high risks
        covered; two medium risks open, both with workarounds".

  - id: tradeoffs
    kind: tradeoffs
    concepts: [risk-driven-test-scope]
    title: Limitations and alternatives
    body: |
      | Approach | Good at | Weak at |
      |---|---|---|
      | Risk-based | focusing effort; explaining what is left untested | depends on the quality of the assessment; blind spots stay blind |
      | Requirements-based (cover every requirement) | completeness against the specification | treats a typo and a double charge as equal |
      | Coverage-based (code or model coverage) | objective, measurable | says nothing about impact |
      | Exploratory, time-boxed | finds the unexpected | hard to show what was covered |

      In practice they are combined: risk sets the **priorities**, requirements and coverage set the
      **minimum**, exploratory sessions cover the **blind spots**. For many combinations of inputs, risk
      also decides which rows of a scenario matrix are kept in full - see
      [Building a payment scenario matrix](#/lesson/payment-scenario-matrix).

  - id: summary
    kind: summary
    title: Summary and quick reference
    body: |
      - **Risk level = likelihood × impact** (quantitative) or from a **risk matrix** (qualitative).
      - **Product risk** = quality of the product (testing mitigates it). **Project risk** = schedule,
        people, tools, suppliers (testing is affected by it).
      - Risk management = **analysis** (identification + assessment) and **control** (mitigation +
        monitoring).
      - Risk decides **scope, levels, types, techniques, coverage, effort and order**.
      - Responses: **mitigate by testing, accept, transfer, contingency plan**.
      - Report the **remaining risk**, not only test counts. Source: ISTQB CTFL v4.0.1, 5.2.

exercises:
  - id: classify-risks
    type: mcq
    concept: product-and-project-risks
    skill: application
    title: Product or project risk?
    prompt: Which of these are **product** risks? Select every one that applies.
    options:
      - id: rounding
        text: Refund amounts are rounded wrongly for currencies with three decimal places.
        feedback: Correct - an incorrect calculation is a product risk (functional suitability).
      - id: test-env
        text: The staging environment is shared with another team and often unavailable.
        feedback: That is a project risk - a technical or organisational issue that affects testing, not the quality of the product.
      - id: timeout
        text: The checkout page takes more than 10 seconds to respond at peak load.
        feedback: Correct - inadequate response time is a product risk (performance efficiency).
      - id: leaving
        text: The only developer who knows the refund code is leaving next month.
        feedback: That is a project risk - a people issue. It may raise the likelihood of product defects, but it is not itself a quality problem of the product.
      - id: enumeration
        text: The login error message reveals whether an email address has an account.
        feedback: Correct - a security vulnerability is a product risk.
    correct: [rounding, timeout, enumeration]
    hints:
      - Ask of each one - is this about how the product behaves, or about how the project is run?
    solution: |
      **Rounding, the slow checkout and the revealing error message** are product risks - they are about
      the product's quality (correctness, performance, security). The shared environment and the
      departing developer are **project** risks: they threaten the schedule and the team's ability to
      test, and are handled by planning and escalation.
    followUp: |
      The departing developer raises the likelihood of which product risks? How would you reflect that in
      the register?

  - id: compute-risk-level
    type: mcq
    concept: risk-level-assessment
    skill: application
    title: Which risk comes first?
    prompt: |
      On 1-5 scales with risk level = likelihood × impact, which risk should be tested **first**?

      | Risk | Likelihood | Impact |
      |---|---|---|
      | A - product images load slowly | 5 | 2 |
      | B - a refund can be issued twice | 2 | 5 |
      | C - the new tax calculation is wrong for one region | 4 | 4 |
      | D - the footer link is broken | 3 | 1 |
    options:
      - id: a
        text: A - it is the most likely to happen.
        feedback: A's level is 5 × 2 = 10. Likelihood alone ignores impact, which is why the level multiplies both.
      - id: b
        text: B - it has the highest impact.
        feedback: B's level is 2 × 5 = 10. Impact alone ignores likelihood. B is still important - but C's level is higher.
      - id: c
        text: C - it has the highest risk level.
        feedback: Correct - 4 × 4 = 16, ahead of A and B (10 each) and D (3).
      - id: d
        text: D - it is quickest to test, so do it first.
        feedback: Ordering by convenience is how important risks end up untested when time runs out. D's level is only 3.
    correct: [c]
    hints:
      - Compute likelihood × impact for each row.
    solution: |
      **C (16)**, then A and B (10 each - discuss which goes first; many teams break ties by impact,
      so B), then D (3). The point of the multiplication is that neither likelihood nor impact alone
      decides.
    followUp: |
      Testing C finds three defects in the tax code. What happens to C's likelihood, and to the
      likelihood of other risks in the same component?

  - id: order-risks
    type: order
    concept: risk-level-assessment
    skill: application
    title: Sort the register
    prompt: |
      Likelihood × impact on 1-5 scales. Put the risks in the order you would test them, highest risk
      level first.
    items:
      - id: overcharge
        text: Saved-card payment charges the wrong currency (L4, I5)
      - id: data
        text: Order history shows another customer's orders (L2, I5)
      - id: slow
        text: Search takes 3 seconds on mobile data (L4, I2)
      - id: typo
        text: Spelling mistake on the returns page (L3, I1)
    hints:
      - Compute each product first; 20, 10, 8 and 3.
    solution: |
      Wrong currency (20) → another customer's orders (10) → slow search (8) → typo (3). The data leak
      is rare but its impact keeps it above the far more likely slow search.

  - id: risk-register-design
    type: testdesign
    concept: risk-driven-test-scope
    skill: application
    title: From risks to a test plan
    prompt: |
      The demo shop's next release adds **gift cards**: customers can buy them, redeem them at checkout
      (alone or together with a card payment) and see the remaining balance. You have two days.

      Write three product risks as "what could go wrong for whom", rate each (likelihood and impact, with
      a reason), and for the top risk write the test response: technique, test cases or coverage, test
      level, order, and the evidence you would keep.
    hints:
      - Think about money first - balances, partial redemption, refunds of gift-card orders.
      - Who knows the impact? Who knows the likelihood?
      - Which technique fits a balance that must never go negative? Which fits combinations of payment methods?
    modelAnswer: |
      1. A customer can redeem more than the remaining balance (balance goes negative) - L3 (new code,
         concurrent redemptions possible), I5 (direct money loss). Level 15.
      2. Gift card plus card payment charges the card the full amount instead of the remainder - L3
         (split payments are complex), I4. Level 12.
      3. The balance shown after redemption is stale - L4 (caching), I2 (confusing, but the server is
         correct). Level 8.

      Response for risk 1: boundary value analysis on the balance (redeem exactly the balance, one cent
      more, one cent less); a concurrency test (two checkouts redeem the same card at the same time);
      API-level tests first (day 1), then one end-to-end journey. Evidence: balance before and after
      from the API, the ledger entries, the HTTP responses of both concurrent requests.

      Risk 3 is accepted for release with monitoring of support tickets, signed off by the product owner.
    rubric:
      - Phrased each risk as a concrete failure and who is harmed
      - Gave likelihood and impact with a reason for each
      - Ordered the risks by level
      - Chose a technique that fits the top risk (boundaries for balances, decision table for payment combinations)
      - Planned the top risk first and at a suitable test level
      - Named evidence beyond the UI (API responses, ledger or database)
      - Made an explicit decision (test, accept, monitor) for the lowest risk
    solution: |
      Compare with the model answer. The usual gap is the **concurrent redemption** - two checkouts using
      the same gift card at once is how balances go negative in real systems, and only a deliberate test
      finds it.
    followUp: |
      Halfway through day 1 you find two defects in the split-payment code. How do you update the register
      and the plan for day 2?

  - id: response-option
    type: mcq
    concept: risk-driven-test-scope
    skill: analysis
    title: Name the response
    prompt: |
      Late in the release, nobody can test the new export to the accounting system properly. The team
      ships it **behind a feature flag that is off by default**, with a documented procedure to switch it
      off again within minutes. Which risk response is that, mainly?
    options:
      - id: mitigate
        text: Risk mitigation by testing
        feedback: No additional testing was done - the risk level of the feature itself is unchanged.
      - id: accept
        text: Risk acceptance
        feedback: Acceptance would ship it and live with the consequences. Here the team prepared a way to limit the damage if it happens.
      - id: transfer
        text: Risk transfer
        feedback: Transfer moves the consequences to someone else - an insurer or a supplier under contract. The team still owns this risk.
      - id: contingency
        text: A contingency plan
        feedback: Correct - the team prepared what to do if the risk occurs (switch the flag off), limiting the impact rather than the likelihood.
    correct: [contingency]
    hints:
      - Did the change reduce the chance of a failure, or what happens after one?
    solution: |
      **A contingency plan.** The flag and the switch-off procedure reduce the **impact** if the export
      fails, not the likelihood. It is a legitimate response - but the remaining risk should still be
      written down, and the export tested before the flag is switched on for everyone.
    followUp: |
      Which risk response is it when the payment provider's contract makes them liable for fraud losses on
      their hosted payment page?

  - id: interview-two-days
    type: interview
    concept: risk-driven-test-scope
    skill: application
    title: "Interview: two days instead of two weeks"
    prompt: |
      *"The release normally gets two weeks of testing. This time you have two days. What do you do?"*
      Answer as you would in the interview.
    hints:
      - Start with how you decide, not with what you cut.
      - Who else must be part of the decision?
      - What do you say at the end of day two?
    modelAnswer: |
      I'd run a short risk analysis first - an hour with the product owner and a developer: what changed,
      what is money- or data-critical, where we had defects before. We rate likelihood and impact and
      sort.

      Then I'd plan the two days by risk: the high risks first and with the strongest techniques, at the
      lowest level that proves them (API tests are faster than UI journeys); automated regression for
      the critical paths running in parallel; exploratory sessions on new features; low risks get a smoke
      test or are explicitly accepted.

      I'd make the trade-off visible: a list of what will **not** be tested and the remaining risk, signed
      off by the product owner - and propose mitigations such as a feature flag, a staged rollout and
      extra monitoring. At the end of day two I report in risk terms - covered, open, and the defects
      found - so the go / no-go decision is the business's, made with facts.
    rubric:
      - Started with a risk analysis involving the product owner and developers
      - Prioritised by likelihood and impact rather than by convenience
      - Chose test levels and techniques by risk (for example API tests for speed, formal techniques for top risks)
      - Made untested areas and remaining risk explicit and had them accepted
      - Proposed non-testing mitigations such as feature flags, staged rollout or monitoring
      - Reported in terms of risk so the business can decide
    followUps:
      - The product owner says "everything is high risk". What do you do?
      - On day one you find a severe defect in a medium-risk area. How does that change the plan?
      - How do you make sure you don't get two days every time from now on?
    solution: |
      Weak answers list what to cut. Strong answers show **how the decision is made, who makes it, and
      how the remaining risk is reported** - that is what the interviewer is listening for.

  - id: explain-monitoring
    type: short
    concept: risk-driven-test-scope
    skill: recall
    title: Why risk monitoring matters
    prompt: In two to three sentences, explain why risk control includes **monitoring**, not only mitigation.
    hints:
      - What do you learn during testing that you didn't know during the workshop?
    modelAnswer: |
      Monitoring checks whether the mitigation actually worked, and feeds new information back into the
      assessment - defects found raise the likelihood of risks in that area, and late changes create new
      risks. Without it the plan keeps following a risk picture that is no longer true.
    rubric:
      - Said monitoring checks that mitigation is effective
      - Said test results such as defects found change the assessment
      - Mentioned emerging or new risks
    solution: |
      The syllabus lists all three aims of risk monitoring (5.2.4): effectiveness of mitigation, better
      assessment, emerging risks.

placement:
  - id: place-product-project
    type: mcq
    concept: product-and-project-risks
    skill: application
    title: Classify the risk
    prompt: |
      "Our test automation tool's licence expires in two weeks, and renewal is not approved yet." What kind
      of risk is this?
    options:
      - id: project
        text: A project risk
        feedback: Correct - poor tool support is a technical issue of the project; it affects schedule and testing, not the product's quality directly.
      - id: product
        text: A product risk
        feedback: Product risks concern the quality of the product - wrong calculations, slow responses, security holes. A tool licence is about how the project runs.
      - id: not-risk
        text: Not a risk - it is certain to happen.
        feedback: Renewal is not approved yet, so losing the tool is uncertain - likelihood between zero and one. That makes it a risk.
      - id: residual
        text: A residual risk
        feedback: Residual risk is what remains after mitigation. This risk hasn't been treated at all yet.
    correct: [project]
    solution: |
      **A project risk** - handled by escalation and planning (approve the renewal, or plan manual
      regression), not by writing more test cases.

  - id: place-risk-level
    type: mcq
    concept: risk-level-assessment
    skill: application
    title: Risk level from likelihood and impact
    prompt: |
      Using likelihood × impact, risk P has likelihood 0.2 and impact 9; risk Q has likelihood 0.6 and
      impact 2. Which statement is right?
    options:
      - id: p-higher
        text: P has the higher risk level (1.8 versus 1.2).
        feedback: Correct - 0.2 × 9 = 1.8 and 0.6 × 2 = 1.2.
      - id: q-higher
        text: Q has the higher risk level because it is three times as likely.
        feedback: Likelihood alone doesn't set the level. Q's level is 0.6 × 2 = 1.2, below P's 1.8.
      - id: equal
        text: They are equal - one is likely, the other severe.
        feedback: Multiply them - 1.8 and 1.2 are not equal.
      - id: impact-only
        text: Only impact matters for prioritisation, so P comes first.
        feedback: P does come first here, but for the wrong reason. A very likely moderate risk can outrank a rare severe one.
    correct: [p-higher]
    solution: |
      **P: 0.2 × 9 = 1.8; Q: 0.6 × 2 = 1.2.** In the quantitative approach the risk level is the product
      of likelihood and impact.

  - id: place-response
    type: mcq
    concept: risk-driven-test-scope
    skill: analysis
    title: What risk analysis decides
    prompt: Which of these is **not** something product risk analysis is used to decide, according to the ISTQB syllabus?
    options:
      - id: scope
        text: The test scope and which test levels and test types to perform
        feedback: Product risk analysis does decide this - it is the first use the syllabus lists.
      - id: techniques
        text: Which test techniques to use and what coverage to reach
        feedback: This is one of the listed uses - higher risk, more rigorous technique and coverage.
      - id: order
        text: The order of testing, so critical defects are found as early as possible
        feedback: Prioritisation is one of the main uses of risk analysis.
      - id: ship
        text: Whether the product is released despite the remaining risks
        feedback: Correct - risk analysis informs that decision, but the release decision is made by the stakeholders (for example the product owner), not by the analysis or the tester.
    correct: [ship]
    solution: |
      Risk analysis decides **scope, levels, types, techniques, coverage, effort, order** and whether
      other activities besides testing are needed. Whether to ship with the remaining risk is a business
      decision that the test report informs.

recall:
  - id: recall-risk-attributes
    concept: risk-level-assessment
    prompt: What two attributes characterise a risk, and how do they give the risk level?
    answer: Likelihood (probability of occurring) and impact (the harm). Quantitatively the level is likelihood × impact; qualitatively a risk matrix combines them.
  - id: recall-product-project
    concept: product-and-project-risks
    prompt: What is the difference between a product risk and a project risk?
    answer: A product risk concerns the quality of the product (wrong results, slow, insecure). A project risk concerns managing the project (schedule, people, tools, suppliers).
  - id: recall-activities
    concept: risk-driven-test-scope
    prompt: What are the two main risk management activities and their parts?
    answer: Risk analysis (identification and assessment) and risk control (mitigation and monitoring).
  - id: recall-responses
    concept: risk-driven-test-scope
    prompt: Name four possible responses to a product risk.
    answer: Mitigation by testing, acceptance, transfer and a contingency plan.
  - id: recall-uses
    concept: risk-driven-test-scope
    prompt: Name four decisions that product risk analysis feeds.
    answer: Test scope, test levels and types, techniques and coverage, test effort, and the order of testing.
  - id: recall-principle
    concept: risk-level-assessment
    prompt: Which testing principle provides evidence for rating likelihood?
    answer: Defects cluster together - components with many defects in the past are more likely to have more.

