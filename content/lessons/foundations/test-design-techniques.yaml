id: test-design-techniques
title: Equivalence partitioning, boundaries and decision tables
subject: foundations
module: testing-fundamentals
level: beginner
status: published
estimatedMinutes: 50
summary: Derive test cases systematically instead of guessing - partition the inputs, test the edges of each partition, and turn business rules into a decision table.
tags: [test design, equivalence partitioning, boundary value analysis, decision tables, black-box, istqb, coverage]

environment: |
  - **Standards and syllabi:** the definitions and coverage rules follow the **ISTQB Certified Tester
    Foundation Level syllabus v4.0.1** (2024), section 4.2 "Black-Box Test Techniques" -
    [free PDF from ISTQB](https://www.istqb.org/wp-content/uploads/2024/11/ISTQB_CTFL_Syllabus_v4.0.1.pdf).
    The international standard for test techniques is **ISO/IEC/IEEE 29119-4:2021** "Test techniques"
    ([ISO catalogue page](https://www.iso.org/standard/79430.html)); it is paid, and the syllabus points
    to it for more detail.
  - **Universal:** the techniques work for any software - web, mobile, API or batch - because they are
    based on the specified behaviour, not on the code ("black-box").
  - **Examples:** the SandPay Demo Shop and its rules (amount limits, delivery rules) are **fictional**,
    invented for practice. Real limits always come from your own requirements.
  - **Code:** the parameterised test is illustrative Java for **JUnit Jupiter** (`junit-jupiter-params`,
    JUnit 5.x or 6.x).

prerequisites: []

concepts:
  - id: equivalence-partitioning
    name: Equivalence partitioning
    summary: Split each input or output into partitions the software should treat the same way, and test one value from each, including the invalid partitions.
  - id: boundary-value-analysis
    name: Boundary value analysis
    summary: Test the minimum and maximum of each ordered partition and their neighbours, where misplaced boundaries hide.
  - id: decision-table-testing
    name: Decision table testing
    summary: List conditions and actions, give every feasible combination of conditions its own column, and test each column.

objectives:
  - Identify the valid and invalid equivalence partitions of an input or output and pick one test value for each.
  - Derive 2-value and 3-value boundary values for an ordered partition and explain which defects each set catches.
  - Build a decision table for a business rule, remove infeasible columns and turn each column into a test case.
  - Measure coverage for each technique as covered items divided by identified items.

sections:
  - id: intuition
    kind: intuition
    concepts: [equivalence-partitioning, boundary-value-analysis]
    title: The idea in plain language
    body: |
      Imagine checking a lift that carries **1 to 8 people**. You don't test it with 1, 2, 3, 4, 5, 6, 7
      and 8 people - if it works with 4, it almost certainly works with 5. Those numbers form one
      **group the lift treats the same way**. Zero people is a different group (the lift shouldn't move
      at all), and 9 or more is another (the alarm should sound).

      So you pick **one person count from each group** - that is equivalence partitioning.

      Then you remember where engineers make mistakes: at the **edges**. Did they write "fewer than 8"
      when they meant "up to 8"? So you test 8 and 9, and 1 and 0, exactly where one group ends and the
      next begins - that is boundary value analysis.

      Finally, some behaviour depends on **several conditions at once** - "free delivery if you are a
      member *and* the order is over 50 euros, unless the item is oversized". A table with one column
      per combination makes sure no combination is forgotten - that is a decision table.

  - id: what
    kind: what
    concepts: [equivalence-partitioning, boundary-value-analysis, decision-table-testing]
    title: What the three techniques are
    body: |
      All three are **black-box** (specification-based) techniques: test cases come from the specified
      behaviour, so they stay useful when the implementation changes but the behaviour doesn't (ISTQB
      CTFL v4.0.1, 4.1).

      | Technique | Coverage items | 100 % coverage means |
      |---|---|---|
      | **Equivalence partitioning (EP)** | the partitions | every partition - **valid and invalid** - exercised at least once |
      | **2-value boundary value analysis (BVA)** | each boundary value and its closest neighbour in the adjacent partition | all of them exercised |
      | **3-value BVA** | each boundary value and **both** its neighbours | all of them exercised |
      | **Decision table testing** | the columns with feasible combinations of conditions | every feasible column exercised |

      Coverage is always **items exercised ÷ items identified**, as a percentage.

      Key terms, as the syllabus uses them:

      - **Equivalence partition** - a set of values the test object is expected to process the same way.
        Partitions must not overlap and must not be empty. They can be for inputs, outputs,
        configuration, internal values, times or interface parameters.
      - **Valid / invalid partition** - values that should be processed / values that should be ignored or
        rejected. Teams define these slightly differently; agree on it.
      - **Boundary value** - the minimum or maximum of an **ordered** partition. BVA only works where
        values have an order (numbers, dates, lengths), not for unordered sets such as currencies.
      - **Each Choice coverage** - with several inputs, each partition of each input appears in at least
        one test. It does **not** cover combinations.
      - **Decision table** - conditions and actions as rows, one **rule** per column. Notation: `T` / `F`
        for conditions, `–` irrelevant, `N/A` infeasible; `X` means the action happens.

  - id: why
    kind: why
    concepts: [equivalence-partitioning]
    title: Why guessing is not enough
    body: |
      **Exhaustive testing is impossible** - the second of the seven testing principles in the ISTQB
      syllabus. An amount field accepting 1.00 to 5,000.00 euros already has 499,901 valid values in
      cents, before you think about invalid ones.

      Without a technique, testers pick values by habit: a "normal" value, a big one, maybe zero. The
      result is **many tests in one partition and none in another**. Typical gaps:

      - no test for an **invalid** partition at all (negative, empty, text, too many decimals);
      - no test **at** the limit, only well inside it - so a `<` written instead of `<=` goes unnoticed;
      - a combination of conditions that **nobody listed**, so the code does something nobody specified.

      The techniques also give you a **number you can defend**: "we cover 6 of 6 partitions and all 6
      3-value boundary values" is a statement a reviewer can check. "We tested it well" is not.

  - id: internals
    kind: internals
    concepts: [boundary-value-analysis]
    title: Why boundaries find defects - 2-value versus 3-value
    body: |
      Defects cluster at boundaries because the boundary is written **in code by a human**, usually as a
      comparison. The typical defects BVA finds are boundaries **moved** one step up or down, or
      **missing** altogether (ISTQB CTFL 4.2.2).

      Take the rule "amounts up to 10 are accepted" (`x ≤ 10`), and three wrong implementations:

      | Implementation | 2-value BVA tests 10, 11 | 3-value BVA tests 9, 10, 11 |
      |---|---|---|
      | `x < 10` (boundary moved down) | 10 fails - **found** | 10 fails - **found** |
      | `x <= 11` (boundary moved up) | 11 passes when it shouldn't - **found** | **found** |
      | `x == 10` (wrong operator) | 10 passes, 11 rejected - **not found** | 9 rejected when it should pass - **found** |

      The last row is the syllabus's own example: 3-value BVA is **more rigorous** because the extra
      neighbour inside the partition catches defects 2-value BVA misses. It costs more tests, so use it
      where a wrong boundary is expensive - money, limits, eligibility.

      Two practical details:

      - **Find the real step size.** For money in cents the neighbour of 100.00 is 99.99, not 99. For a
        date it is the day before. For a string length it is one character.
      - **Boundaries of outputs count too.** "Show a warning when the balance drops below 0" has a boundary
        on the computed balance, not on any input field.

  - id: visual
    kind: visual
    concepts: [equivalence-partitioning, boundary-value-analysis]
    title: "Flowchart: from a requirement to test values"
    body: |
      The order to work in for a single input. Notice that **invalid** partitions get their own tests,
      one invalid value per test, so one rejection cannot hide another.

      ```mermaid
      flowchart TD
          A[Read the requirement for one input or output] --> B[List partitions the software treats differently]
          B --> C{Partitions ordered?}
          C -- Yes --> D[Mark each minimum and maximum as a boundary]
          D --> E[Add neighbours - 2-value or 3-value]
          C -- No --> F[One representative per partition]
          E --> G[Combine valid values into as few tests as possible]
          F --> G
          G --> H[One test per invalid value - never two invalid values together]
          H --> I[Compute coverage - exercised divided by identified]
      ```

  - id: steps
    kind: steps
    concepts: [equivalence-partitioning, boundary-value-analysis]
    title: Step by step - the amount field
    body: |
      Fictional requirement: *"The SandPay Demo Shop accepts card payments from 1.00 to 5,000.00 EUR
      inclusive. Amounts have at most two decimal places."*

      **1. Partitions** (the amount in euros):

      | Partition | Values | Expected |
      |---|---|---|
      | P1 invalid - too small | less than 1.00 (0.99, 0, negative) | rejected: "minimum is 1.00" |
      | P2 valid | 1.00 to 5,000.00 | accepted |
      | P3 invalid - too large | more than 5,000.00 | rejected: "maximum is 5,000.00" |
      | P4 invalid - format | three decimals, text, empty | rejected: "enter a valid amount" |

      **2. Boundaries.** P1 / P2 meet at 0.99 / 1.00; P2 / P3 at 5,000.00 / 5,000.01 (step 0.01).

      - 2-value BVA: **0.99, 1.00, 5,000.00, 5,000.01**.
      - 3-value BVA: **0.99, 1.00, 1.01, 4,999.99, 5,000.00, 5,000.01**.

      **3. Tests.** Six 3-value BVA values already cover P1, P2 and P3. Add one test for P4 (for example
      `12.345`) and one for an empty field: **8 tests, 4 of 4 partitions, 6 of 6 boundary items**.

      **4. Expected results come from the requirement**, not from what the app does today. If the
      requirement doesn't say what happens to `12.345` (rounded? rejected?), that is a question for the
      product owner - and a gap you just found without running anything.

  - id: example
    kind: example
    concepts: [decision-table-testing]
    title: "Real-world example: delivery rules as a decision table"
    body: |
      Fictional rule from the demo shop: *"Members get free delivery on orders of 50 EUR or more.
      Everyone gets free delivery during a promotion. Oversized items never get free delivery and are
      always shipped by freight."*

      Conditions and actions, one column (rule) per combination:

      | | R1 | R2 | R3 | R4 | R5 |
      |---|---|---|---|---|---|
      | **C1** Item oversized? | T | F | F | F | F |
      | **C2** Promotion running? | – | T | F | F | F |
      | **C3** Member? | – | – | T | T | F |
      | **C4** Order ≥ 50 EUR? | – | – | T | F | – |
      | **A1** Free delivery | | X | X | | |
      | **A2** Freight shipping | X | | | | |

      Three conditions are irrelevant (`–`) once an earlier one decides the outcome, so the full table of
      2⁴ = 16 columns **minimises** to 5. Each column becomes one test case, with values chosen by EP and
      BVA - R3 and R4 use 50.00 and 49.99, the boundary of C4.

      Writing the table already found two questions for the product owner:

      - Does the promotion apply to **oversized** items? The rule says "everyone" and "never" - they
        contradict. The table makes the contradiction visible as two possible outcomes for R1.
      - Is "50 EUR or more" before or after discounts? That decides which amount the boundary is on.

      Finding gaps and contradictions in requirements is one of the strengths of decision tables named
      in the syllabus (4.2.3).

  - id: code
    kind: code
    concepts: [boundary-value-analysis]
    title: Boundary values as a parameterised test
    collapsed: true
    body: |
      Illustrative JUnit Jupiter test (needs `junit-jupiter-params`). `AmountRule.isAllowed` takes the
      amount in **cents** - whole numbers, so there are no floating-point surprises at the boundary.

      ```java
      import static org.junit.jupiter.api.Assertions.assertEquals;

      import org.junit.jupiter.params.ParameterizedTest;
      import org.junit.jupiter.params.provider.CsvSource;

      class AmountRuleTest {

          @ParameterizedTest(name = "{0} cents allowed: {1}")
          @CsvSource({
              "99,     false",   // P1, below the lower boundary
              "100,    true",    // lower boundary
              "101,    true",    // 3-value neighbour inside P2
              "499999, true",    // 3-value neighbour inside P2
              "500000, true",    // upper boundary
              "500001, false"    // P3, above the upper boundary
          })
          void acceptsAmountsFromOneToFiveThousandEuros(long cents, boolean expected) {
              assertEquals(expected, AmountRule.isAllowed(cents));
          }
      }
      ```

      Each row is a test case with its own name in the report, so a failure says exactly which value
      broke - "500000 cents allowed: true" failing points straight at the upper boundary.

  - id: tests
    kind: tests
    concepts: [equivalence-partitioning, boundary-value-analysis, decision-table-testing]
    title: Positive and negative test cases
    body: |
      For the amount field and the delivery rules above. Evidence is what you keep to prove the result.

      | ID | Technique | Input | Expected | Evidence |
      |---|---|---|---|---|
      | T1 | BVA lower | 1.00 EUR | accepted, payment form shown | screenshot of the next step |
      | T2 | BVA lower | 0.99 EUR | rejected, "minimum is 1.00" | the error text |
      | T3 | BVA upper | 5,000.00 EUR | accepted | screenshot |
      | T4 | BVA upper | 5,000.01 EUR | rejected, "maximum is 5,000.00" | the error text |
      | T5 | EP format | `12.345` | rejected, nothing sent to SandPay | error text, no request in the Network panel |
      | T6 | EP format | empty | rejected, field marked | screenshot |
      | T7 | Decision R1 | oversized item, member, 80 EUR | freight, no free delivery | order summary |
      | T8 | Decision R4 | member, 49.99 EUR, no promotion | delivery charged | order summary |

      The negative tests (T2, T4, T5, T6) check **one invalid value each**. A test with both an invalid
      amount and an invalid email may be rejected for the email only - the amount check never runs, and
      the defect it would have revealed stays hidden.

  - id: mistakes
    kind: mistakes
    concepts: [equivalence-partitioning, boundary-value-analysis, decision-table-testing]
    title: Common mistakes and how to debug them
    body: |
      - **Forgetting invalid partitions.** 100 % EP coverage includes the invalid ones (ISTQB 4.2.1).
      - **Combining several invalid values in one test.** The first rejection masks the others.
      - **Wrong step size.** For money the neighbour of 1.00 is 0.99; for an integer quantity it is 0.
      - **Boundaries on unordered data.** Currencies or card brands have no "next value" - use EP only.
      - **Partitions that overlap** ("1 to 10" and "10 to 20") - every value must belong to exactly one.
      - **Testing only the inputs.** Outputs and computed values (totals, balances, ages) have partitions
        and boundaries too.
      - **Copying expected results from the application.** Expected results come from the requirement.
        If the requirement is silent, ask - don't invent.
      - **Decision tables with missing columns.** Count: n Boolean conditions give 2ⁿ combinations before
        you merge irrelevant ones. If your table has fewer, check each merged column is truly irrelevant.

      **When a boundary test fails:** check the step size and the units first (euros or cents? inclusive
      or exclusive?), then the requirement's wording, then the code. Many "boundary defects" are a test
      that used the wrong neighbour.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [decision-table-testing]
    title: Limitations and alternatives
    body: |
      | Technique | Strength | Limitation | Use with |
      |---|---|---|---|
      | EP | few tests, every kind of value covered | assumes the partitions are right - a wrong partition hides defects | BVA for ordered partitions |
      | BVA | finds misplaced comparisons | only for ordered data; 3-value costs more tests | EP |
      | Decision tables | every combination of conditions; exposes gaps and contradictions | grows as 2ⁿ - 10 conditions are 1,024 columns | minimisation, risk-based selection, pairwise testing |
      | State transition testing | behaviour that depends on history | needs a model of the states | the next lesson |

      Black-box techniques cannot see code that the specification doesn't mention - a hidden "test mode"
      or a special customer id. **Experience-based** techniques (error guessing, exploratory testing) and
      white-box techniques complement them (ISTQB 4.1). For many interacting parameters, combine EP with
      pairwise selection, as in [Building a payment scenario matrix](#/lesson/payment-scenario-matrix).

  - id: summary
    kind: summary
    title: Summary and quick reference
    body: |
      - **EP:** partitions the software treats the same way; one value each; **include invalid ones**.
      - **BVA:** min and max of each **ordered** partition. 2-value = boundary + neighbour across;
        3-value = boundary + both neighbours (catches `==` instead of `<=`).
      - **Decision table:** conditions and actions as rows, one column per feasible combination; `–` for
        irrelevant. Test every column.
      - **Coverage** = exercised items ÷ identified items.
      - One invalid value per negative test. Expected results come from the requirement.
      - Source: ISTQB CTFL v4.0.1, section 4.2; ISO/IEC/IEEE 29119-4.

exercises:
  - id: ep-quantity-partitions
    type: mcq
    concept: equivalence-partitioning
    skill: application
    title: Partitions for the quantity field
    prompt: |
      The cart accepts a **whole-number quantity from 1 to 10** per product. Which set of test values
      gives **100 % equivalence partitioning coverage** with the fewest tests?
    options:
      - id: valid-only
        text: "`1`, `5`, `10`"
        feedback: All three values are in the same valid partition. EP coverage counts partitions, and the invalid partitions (below 1, above 10, not a whole number) are not exercised at all.
      - id: one-per-partition
        text: "`0`, `5`, `11`, `2.5`"
        feedback: Correct - one value from each partition - below the range, inside it, above it and not a whole number. Four partitions, four tests.
      - id: boundaries
        text: "`0`, `1`, `10`, `11`"
        feedback: These are good boundary values, but EP also needs the non-integer partition. And 1 and 10 are the same partition, so for EP alone one of them is redundant.
      - id: every-value
        text: Every value from 0 to 11
        feedback: That is close to exhaustive testing - twelve tests for what four tests cover. EP exists precisely to avoid this, and it still misses the non-integer partition.
    correct: [one-per-partition]
    hints:
      - Count the groups of values the cart should treat differently - not the values.
      - What should happen to 2.5? Is that the same group as 0?
    solution: |
      **`0`, `5`, `11`, `2.5`.** The partitions are: below 1 (invalid), 1-10 (valid), above 10 (invalid)
      and not a whole number (invalid). One value per partition gives 4 / 4 = 100 % EP coverage.

      Boundary value analysis would then add 1 and 10 (and their neighbours), but that is a different
      coverage measure.
    followUp: |
      The same field also rejects empty input and text such as `two`. Are these new partitions, or part of
      "not a whole number"? Argue both ways and say what you would ask the developer.

  - id: bva-three-value
    type: mcq
    concept: boundary-value-analysis
    skill: application
    title: 3-value boundary values for a password length
    prompt: |
      A password must be **8 to 64 characters** long. Which set is exactly the **3-value BVA** set?
    options:
      - id: two-value
        text: "`7`, `8`, `64`, `65`"
        feedback: That is the 2-value set - each boundary and its neighbour in the adjacent partition. 3-value adds the neighbour on the other side as well.
      - id: three-value
        text: "`7`, `8`, `9`, `63`, `64`, `65`"
        feedback: Correct - each boundary (8 and 64) with both neighbours.
      - id: inside-only
        text: "`8`, `9`, `63`, `64`"
        feedback: This leaves out the invalid neighbours 7 and 65, so a boundary moved outwards (accepting 7 characters) would not be detected.
      - id: round-numbers
        text: "`0`, `8`, `32`, `64`, `100`"
        feedback: "0, 32 and 100 are partition representatives, not boundary neighbours. They would not catch a `<` written instead of `<=`."
    correct: [three-value]
    hints:
      - First find the boundaries - the minimum and the maximum of the valid partition.
      - 3-value means the boundary plus one step on each side.
    solution: |
      **7, 8, 9, 63, 64, 65.** The valid partition 8-64 has two boundaries, 8 and 64. 3-value BVA tests
      each boundary and both neighbours: 7 / 8 / 9 and 63 / 64 / 65 - six coverage items.
    followUp: |
      The rule changes to "at least 8 characters" with no maximum. Which boundary values remain, and what
      would you test instead of an upper boundary?

  - id: debug-boundary
    type: debug
    concept: boundary-value-analysis
    skill: analysis
    title: Which line moves the boundary?
    prompt: |
      Requirement: amounts from **100 to 500000 cents inclusive** are allowed. The 3-value boundary test
      with `100` fails - the shop rejects exactly 1.00 EUR. Click the line with the defect.
    language: java
    code: |
      final class AmountRule {
          static final long MIN_CENTS = 100;
          static final long MAX_CENTS = 500_000;

          static boolean isAllowed(long cents) {
              return cents > MIN_CENTS && cents <= MAX_CENTS;
          }
      }
    correctLines: [6]
    lineNotes:
      - line: 2
        note: The constant is right - 100 cents is 1.00 EUR, the minimum in the requirement. The comparison that uses it is the problem.
      - line: 3
        note: The upper limit is correct and the upper comparison uses `<=`, so 500000 is accepted as required.
    hints:
      - Which value fails? Which comparison decides that value?
      - "Inclusive means the boundary itself is allowed. Which operator includes it?"
    solution: |
      **Line 6.** `cents > MIN_CENTS` excludes 100 itself - the lower boundary has moved up by one step.
      It must be `cents >= MIN_CENTS`.

      This is exactly the defect class BVA targets. A test with a "typical" amount such as 25.00 EUR
      would never find it; only a test **at** the boundary does.
    followUp: |
      Suppose line 6 were `cents == MIN_CENTS || cents <= MAX_CENTS`. Which 2-value and which 3-value tests
      would fail, and why does that show the difference between the two?

  - id: delivery-decision-table
    type: testdesign
    concept: decision-table-testing
    skill: application
    title: Turn a discount rule into tests
    prompt: |
      Fictional rule: *"Students get 10 % off. Orders paid with a SandPay gift card get 5 % off. The two
      discounts never combine - a student paying with a gift card gets the student discount only.
      Discounts don't apply to orders under 20 EUR."*

      Build the decision table (conditions, actions, rules), minimise it, and write one test case per
      rule with its input values, expected result and the evidence you would keep.
    hints:
      - There are three conditions. Write them as questions with T / F answers.
      - When the order is under 20 EUR, do the other two conditions matter? Use `–`.
      - Choose the order amounts with boundary value analysis - which value sits exactly on the 20 EUR boundary?
    modelAnswer: |
      Conditions: C1 order ≥ 20 EUR, C2 student, C3 gift card. Actions: A1 10 % off, A2 5 % off, A3 no
      discount.

      | | R1 | R2 | R3 | R4 |
      |---|---|---|---|---|
      | C1 ≥ 20 EUR | F | T | T | T |
      | C2 student | – | T | F | F |
      | C3 gift card | – | – | T | F |
      | A1 10 % off | | X | | |
      | A2 5 % off | | | X | |
      | A3 no discount | X | | | X |

      Tests (evidence: order summary screenshot or the order API response with the discount line):

      1. R1 - student, gift card, 19.99 EUR → no discount (19.99 is the boundary neighbour).
      2. R2 - student, gift card, 20.00 EUR → 10 % off, **not** 15 % (checks "never combine").
      3. R3 - not a student, gift card, 20.00 EUR → 5 % off.
      4. R4 - not a student, card, 20.00 EUR → no discount.

      Questions for the product owner: is the 20 EUR before or after delivery costs? Is the discount
      rounded, and how?
    rubric:
      - Listed the three conditions and the discount actions separately
      - Used "irrelevant" for conditions that don't change the outcome, and ended with about four rules
      - One test case per rule with concrete input values
      - Used a boundary value (20.00 or 19.99) for the order amount
      - Included a test proving the discounts never combine
      - Named evidence for each result
      - Raised at least one question about an ambiguity in the rule
    solution: |
      Compare with the model answer. The test most often missed is **R2 with a gift card** - it is the
      only one that proves the two discounts don't add up to 15 %. The second most missed point is using
      a round amount such as 50 EUR instead of the 20 EUR boundary.
    followUp: |
      The business adds a fourth condition - "first order". How many columns does the full table have
      now, and which of them can you merge?

  - id: count-decision-rules
    type: mcq
    concept: decision-table-testing
    skill: analysis
    title: Is the decision table complete?
    prompt: |
      A colleague's table for a login rule has three Boolean conditions - *account active?*, *password
      correct?*, *second factor passed?* - and **four** columns, none of them containing `–`. What do you
      conclude?
    options:
      - id: complete
        text: The table is complete - four columns are enough for three conditions.
        feedback: Three Boolean conditions give 2³ = 8 combinations. With no `–` marks, four columns cannot cover them all.
      - id: missing
        text: Combinations are missing - either some columns should merge with `–`, or up to four combinations were never considered.
        feedback: Correct - 2³ = 8 combinations. Four columns without irrelevant markers means half of them are unaccounted for. Each missing one is either irrelevant (merge it explicitly) or a gap.
      - id: too-many
        text: The table has too many columns - one per condition is enough.
        feedback: One column per condition tests each condition once but no combinations - the whole point of a decision table is the combinations.
      - id: pairwise
        text: Fine, because pairwise testing only needs four tests.
        feedback: Pairwise is a different technique with a different coverage measure. Decision table coverage means every feasible column, and here columns are simply missing.
    correct: [missing]
    hints:
      - How many combinations do three true/false conditions have?
      - What does `–` mean, and does this table use it?
    solution: |
      **Combinations are missing.** Three Boolean conditions give 8 combinations. A table may have fewer
      columns only by marking conditions irrelevant (`–`) or removing infeasible ones - and it should say
      so. Here it does neither, so ask which four combinations were left out and why. For instance,
      *inactive account + correct password + second factor passed* must still be refused.
    followUp: |
      Write the minimised table for the login rule. Which conditions become irrelevant once the account
      is inactive?

  - id: order-technique-steps
    type: order
    concept: equivalence-partitioning
    skill: recall
    title: Put the test-design steps in order
    prompt: Put the steps for designing tests for one input field in the order you would do them.
    items:
      - id: read
        text: Read the requirement for the input and its outputs
      - id: partition
        text: Identify valid and invalid partitions
      - id: boundaries
        text: Mark the boundaries of the ordered partitions
      - id: values
        text: Choose the test values, including boundary neighbours
      - id: combine
        text: Combine valid values into tests, one invalid value per test
      - id: coverage
        text: Measure coverage and record the expected results
    hints:
      - You can't find boundaries before you know the partitions.
      - Coverage is measured against what you identified, so it comes last.
    solution: |
      Read → partition → boundaries → values → combine → coverage. Boundaries are the edges of
      partitions, so partitioning comes first; coverage is measured against the items you identified,
      so it comes last.

  - id: interview-how-many-tests
    type: interview
    concept: equivalence-partitioning
    skill: application
    title: "Interview: how many tests for this field?"
    prompt: |
      The interviewer shows you a "date of birth" field - customers must be 18 or older to register - and
      asks: *"How would you decide which values to test, and how many tests are enough?"* Answer as you
      would in the interview.
    hints:
      - Name the techniques, then apply them to this field.
      - The boundary is not a fixed date - it moves every day. What does that mean for test data?
    modelAnswer: |
      I would use equivalence partitioning and boundary value analysis. The partitions are: 18 or older
      (valid), under 18 (invalid), a date in the future (invalid), an impossible date such as 31 February
      (invalid), and an empty or badly formatted value (invalid). The important boundary is the 18th
      birthday, so with 3-value BVA I test someone who turns 18 tomorrow, today and yesterday.

      Because the boundary depends on today's date, I calculate the test dates relative to the
      current date - or fix the clock in automated tests - so the tests don't break next week. I'd also
      ask which time zone "today" is in.

      "Enough" means every partition and boundary item is covered - about eight tests here - plus extra
      tests where the risk is high, such as leap-day birthdays (29 February).
    rubric:
      - Named equivalence partitioning and boundary value analysis
      - Listed valid and invalid partitions, including future and impossible dates
      - Placed the boundary on the 18th birthday with neighbours on both sides
      - Noticed the boundary moves with the current date and handled it (relative dates or a fixed clock)
      - Defined "enough" in terms of coverage, not a gut feeling
      - Mentioned a risky special case such as 29 February or time zones
    followUps:
      - Someone born on 29 February 2008 - on which date do they turn 18, and how do you know what the system should do?
      - The developer says "the date picker prevents invalid dates". Do you still test them? At which level?
      - How would you automate the moving boundary without flaky tests?
    solution: |
      The strongest answers apply the techniques to the field instead of reciting definitions, and spot
      the **moving boundary** - the detail that separates a tester who has done this from one who has
      read about it.

  - id: explain-three-value
    type: short
    concept: boundary-value-analysis
    skill: recall
    title: Why 3-value BVA catches more
    prompt: |
      In two to three sentences, explain a defect that 3-value BVA detects but 2-value BVA misses, using
      the rule `x ≤ 10`.
    hints:
      - Think of an implementation that is right at 10 and at 11 but wrong somewhere else.
    modelAnswer: |
      If `x ≤ 10` is wrongly implemented as `x == 10`, the 2-value tests (10 accepted, 11 rejected) both
      pass. 3-value BVA also tests 9, the neighbour inside the partition, which is wrongly rejected - so
      the defect is found.
    rubric:
      - Gave a concrete wrong implementation such as x == 10
      - Explained why both 2-value tests (10 and 11) still pass
      - Named the inside neighbour (9) as the test that fails
    solution: |
      This is the example in the ISTQB syllabus (4.2.2). The general lesson: the extra neighbour tests
      that the partition is still valid **just inside** the boundary.

placement:
  - id: place-ep-coverage
    type: mcq
    concept: equivalence-partitioning
    skill: application
    title: EP coverage of an age field
    prompt: |
      A field accepts ages **18 to 65** for a fictional insurance quote. Values under 18 and over 65 are
      rejected with different messages. Tests so far: `30`, `45`, `70`. What is the equivalence
      partitioning coverage?
    options:
      - id: two-thirds
        text: 2 of 3 partitions (67 %) - under 18 is not tested
        feedback: Correct - 30 and 45 are both in the valid partition; 70 covers "over 65". "Under 18" has no test.
      - id: full
        text: 100 % - three tests for three partitions
        feedback: Three tests don't mean three partitions. 30 and 45 fall in the same partition, so one partition is still uncovered.
      - id: one-third
        text: 1 of 3 partitions (33 %)
        feedback: 70 is in the "over 65" partition, which counts as covered - invalid partitions are coverage items too.
      - id: boundaries-needed
        text: 0 % - no boundary values were tested
        feedback: That mixes up EP and BVA. EP coverage counts partitions exercised, whatever the value inside them.
    correct: [two-thirds]
    solution: |
      **2 of 3 (67 %).** Partitions: under 18, 18-65, over 65. 30 and 45 both exercise 18-65, 70 exercises
      over 65, nothing exercises under 18. Add one test such as `10`.

  - id: place-bva
    type: mcq
    concept: boundary-value-analysis
    skill: application
    title: The 2-value boundary set
    prompt: |
      A transfer limit is **at most 2,000.00 EUR** (anything from 0.01 up to 2,000.00 is allowed). Which
      values form the **2-value BVA** set for the upper boundary?
    options:
      - id: right
        text: 2,000.00 and 2,000.01
        feedback: Correct - the boundary value and its closest neighbour in the adjacent (invalid) partition.
      - id: three
        text: 1,999.99, 2,000.00 and 2,000.01
        feedback: That is the 3-value set. 2-value BVA has two coverage items per boundary.
      - id: integers
        text: 2,000 and 2,001
        feedback: The step size for money in cents is 0.01, so the neighbour of 2,000.00 is 2,000.01. 2,001 would not catch a check written as "less than 2,000.50".
      - id: round
        text: 1,000.00 and 3,000.00
        feedback: These are representatives of each partition (EP), not boundary values.
    correct: [right]
    solution: |
      **2,000.00 and 2,000.01.** 2-value BVA tests the boundary and its closest neighbour in the next
      partition, and for money the step is one cent.

  - id: place-decision-table
    type: mcq
    concept: decision-table-testing
    skill: analysis
    title: What the dash means
    prompt: |
      In this decision table column, what must your test case do with condition C2?

      | | R3 |
      |---|---|
      | C1 Card expired? | T |
      | C2 Amount over 100 EUR? | – |
      | A1 Reject payment | X |
    options:
      - id: any
        text: Use any value - C2 doesn't affect the outcome when the card is expired.
        feedback: Correct - `–` means the condition is irrelevant for this rule, so any value of C2 gives the same action.
      - id: both
        text: Write two tests, one with C2 true and one with C2 false.
        feedback: That would test something the table says doesn't matter. Doubling it is optional extra assurance, not what the column requires.
      - id: skip
        text: Skip the column - it is incomplete.
        feedback: "`–` is deliberate notation for an irrelevant condition, not a missing value. The column is complete."
      - id: infeasible
        text: Leave C2 unset because the combination is infeasible.
        feedback: Infeasible combinations are marked N/A and removed. `–` means feasible but irrelevant.
    correct: [any]
    solution: |
      **Any value.** In the ISTQB notation `–` means "irrelevant for the outcome" and `N/A` means
      "infeasible". The column is one rule: an expired card is rejected whatever the amount.

recall:
  - id: recall-ep
    concept: equivalence-partitioning
    prompt: What is an equivalence partition, and what does 100 % EP coverage require?
    answer: A non-empty set of values the software should treat the same way. 100 % coverage means every partition, valid and invalid, is exercised by at least one test.
  - id: recall-invalid-one
    concept: equivalence-partitioning
    prompt: Why should each negative test contain only one invalid value?
    answer: The first rejection can stop processing, so a second invalid value is never checked - one defect masks another.
  - id: recall-bva-two-three
    concept: boundary-value-analysis
    prompt: What is the difference between 2-value and 3-value boundary value analysis?
    answer: 2-value tests each boundary and its neighbour in the adjacent partition. 3-value tests each boundary and both neighbours, so it also checks just inside the partition.
  - id: recall-bva-ordered
    concept: boundary-value-analysis
    prompt: When can't you use boundary value analysis?
    answer: When the partition is not ordered - for example currencies or card brands - because there is no "next value".
  - id: recall-dt-notation
    concept: decision-table-testing
    prompt: In a decision table, what do T, F, – and N/A mean for a condition?
    answer: T true, F false, – irrelevant to the outcome of this rule, N/A an infeasible combination.
  - id: recall-dt-size
    concept: decision-table-testing
    prompt: How many columns does a full decision table with n Boolean conditions have, and how do you reduce it?
    answer: 2 to the power n. Remove infeasible columns and merge columns where a condition is irrelevant; with many conditions, select by risk.

