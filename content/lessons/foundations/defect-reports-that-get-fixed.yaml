id: defect-reports-that-get-fixed
title: Defect reports that get fixed
subject: foundations
module: testing-fundamentals
level: beginner
status: published
estimatedMinutes: 45
summary: Write defect reports a developer can reproduce in minutes - a precise title, minimal steps, expected versus actual, evidence, and severity kept apart from priority - and follow them through to closure.
tags: [defect report, bug report, severity, priority, defect lifecycle, reproduction, evidence, istqb, bugzilla, jira]

environment: |
  - **Standards and syllabi:** the contents of a defect report and the defect workflow follow the
    **ISTQB Certified Tester Foundation Level syllabus v4.0.1**, section 5.5 "Defect Management", and the
    terms error / defect / failure / root cause its section 1.2.3 -
    [free PDF from ISTQB](https://www.istqb.org/wp-content/uploads/2024/11/ISTQB_CTFL_Syllabus_v4.0.1.pdf).
    Templates and examples are in **ISO/IEC/IEEE 29119-3:2021** "Test documentation"
    ([ISO catalogue page](https://www.iso.org/standard/79429.html)), which calls defect reports
    **incident reports**.
  - **Practice guide:** Mozilla's
    [Bug Writing Guidelines](https://bugzilla.mozilla.org/page.cgi?id=bug-writing.html) - a long-standing
    public guide from a project that receives reports from thousands of people.
  - **Tool-specific:** field names, statuses and workflows differ between trackers (Jira, Bugzilla, Azure
    DevOps, GitHub Issues, Zoho and others) and between teams. Map the ideas to your tracker's fields.
  - **Examples:** the SandPay Demo Shop, its defects, ids and versions are **fictional**. Never paste real
    customer data, card data or credentials into a report.

prerequisites: []

concepts:
  - id: defect-report-contents
    name: Defect report contents
    summary: Identifier, title, environment, context, minimal steps, expected and actual results, evidence and references - enough for someone else to reproduce and resolve it.
  - id: severity-and-priority
    name: Severity and priority
    summary: Severity is the degree of impact of the defect; priority is how urgently it should be fixed. They are set separately and can disagree.
  - id: defect-lifecycle
    name: Defect lifecycle
    summary: A report moves from logged through analysed and classified to a decision (fix, defer, reject) and is closed only after confirmation and regression testing.

objectives:
  - Write a defect report whose title, steps and expected versus actual results let a developer reproduce the failure without asking questions.
  - Separate observations from speculation and attach evidence that proves the failure without leaking secrets.
  - Set severity and priority independently and justify each.
  - Explain each step of the defect lifecycle, including confirmation and regression testing after a fix.

sections:
  - id: intuition
    kind: intuition
    concepts: [defect-report-contents]
    title: The idea in plain language
    body: |
      Phoning a mechanic and saying "my car makes a noise" gets you an appointment next week. Saying
      "since Monday there is a grinding noise from the front left wheel when I brake below 30 km/h, but not
      when it is dry; here is a 10-second recording" gets you a diagnosis on the phone.

      A defect report is that phone call. The person reading it **wasn't there** when you saw the
      failure. Everything they need to see it themselves - where, what you did, what you expected, what
      happened instead, and the proof - has to be in the report.

      A good report saves the developer an hour of guessing. A bad one comes back as *"cannot
      reproduce"*, and the defect ships.

  - id: what
    kind: what
    concepts: [defect-report-contents, severity-and-priority]
    title: What a defect report contains
    body: |
      First, the vocabulary (ISTQB 1.2.3): a person makes an **error** (mistake), which produces a
      **defect** (fault, bug) in code or a document, which may cause a **failure** when executed - the
      thing you observe. The **root cause** is the fundamental reason the error happened. You report the
      **failure** you saw; the developer finds the defect.

      A defect report logged during dynamic testing typically includes (ISTQB 5.5):

      | Field | What to write |
      |---|---|
      | **Unique identifier** | usually assigned by the tracker |
      | **Title** | a short summary of the anomaly - what fails, where, under which condition |
      | **Date, organisation, author and role** | often filled in automatically |
      | **Test object and environment** | build or app version, OS and browser or device, test environment, data set |
      | **Context** | test case or activity, technique, checklist or test data used |
      | **Description** | steps to reproduce, with logs, screenshots, recordings, database extracts |
      | **Expected and actual results** | two separate statements |
      | **Severity** | degree of impact on stakeholders or requirements |
      | **Priority** | urgency of the fix |
      | **Status** | open, deferred, duplicate, waiting to be fixed, awaiting confirmation testing, re-opened, closed, rejected... |
      | **References** | the test case, requirement or story, related reports |

      A report is about an **anomaly**. Analysis may show it is a real defect - or a false positive, a
      test problem, or a change request. That is decided in the defect process, not by the reporter alone.

  - id: why
    kind: why
    concepts: [defect-report-contents]
    title: Why so many reports don't get fixed
    body: |
      The syllabus gives defect reports three objectives: give the people who resolve them **enough
      information**, provide a way to **track quality**, and give **ideas to improve** the process. Most
      reports fail the first one:

      - **"Doesn't work"** - no expected result, so nobody can tell whether the behaviour is wrong.
      - **No environment** - it fails only on Android 14, the developer tries iOS.
      - **Steps that skip the setup** - "go to the order page" (which order? created how?).
      - **Speculation as fact** - "the cache is broken" sends the developer to the wrong component.
      - **Several problems in one report** - half gets fixed, the report is closed, the other half is lost.
      - **No evidence** - "it happened once" with no log or screenshot can't be investigated.

      Mozilla's guidelines put it bluntly: the steps to reproduce are "the most important part of any bug
      report", and you should "clearly separate facts (observations) from speculations".

  - id: steps
    kind: steps
    concepts: [defect-report-contents]
    title: Step by step - from failure to report
    body: |
      1. **Stop and capture** before you retry: screenshot or recording, the time (with time zone), the
         URL or screen, the network request and response, the console or device log.
      2. **Reproduce it.** Note whether it happens every time, sometimes (how often?) or once.
      3. **Search for duplicates** in the tracker - add your evidence to an existing report instead.
      4. **Minimise the steps.** Remove each step and see if it still fails; start from a clean state (new
         account, fresh profile, cleared storage). The shortest sequence that fails is the most useful.
      5. **Vary one thing** to find the edges: other browser or device, other data, other user role, the
         previous build. "Fails on 4.2.0, works on 4.1.3" is gold.
      6. **Write the title last**, from what you now know: *what* fails, *where*, *when*.
      7. **Write expected and actual** as two separate, factual sentences. Quote the requirement or
         acceptance criterion for the expected result if you can.
      8. **Attach evidence** with secrets removed: tokens, cookies, card data and personal data redacted.
      9. **Set severity** (impact) and **suggest a priority**; the triage owner confirms priority.
      10. **One report per problem.** Link related reports instead of merging them.

  - id: example
    kind: example
    concepts: [defect-report-contents, severity-and-priority]
    title: "Real-world example: the same defect, reported twice"
    body: |
      **The report that comes back as "cannot reproduce":**

      ```plaintext
      Title: Cart broken
      Steps: Add stuff to the cart and change the quantity. Total is wrong.
      Probably a caching issue.
      ```

      **The report that gets fixed** (fictional demo shop defect):

      ```plaintext
      ID:          SHOP-482 (assigned by the tracker)
      Title:       Cart total shows 0.00 EUR after changing a line's quantity to 10
      Environment: SandPay Demo Shop build 2.7.1 (staging), Chrome 129 on Windows 11;
                   also on Safari, iPhone (iOS 18). Not on build 2.7.0.
      Context:     Test case CART-07 (boundary values for quantity 1-10)
      Preconditions: Empty cart, not signed in.
      Steps:
        1. Open the catalogue and add "Ceramic mug" (12.00 EUR) to the cart.
        2. Open the cart.
        3. Press + until the quantity is 10.
      Expected:    Line total 120.00 EUR, cart total 120.00 EUR (story SHOP-301: max quantity 10).
      Actual:      Line total 120.00 EUR, cart total 0.00 EUR. Quantities 1-9 show correct totals.
      Reproducible: 5 of 5 attempts.
      Evidence:    cart-total-0.png; screen recording (14 s); console shows no errors.
      Severity:    Major - customers can't see what they will pay; checkout total not yet checked.
      Priority:    High (suggested) - on the release branch, release on Friday.
      ```

      What makes the second one work: a title that **names the condition** (quantity 10), the build where
      it **started**, minimal steps from a **clean state**, expected result **traced to the story**, the
      observation that 1-9 work (a boundary - see
      [test design techniques](#/lesson/test-design-techniques)), and no guessing about the cause.

  - id: visual
    kind: visual
    concepts: [defect-lifecycle]
    title: "State diagram: a typical defect lifecycle"
    body: |
      Statuses differ between trackers; this is the common shape. The syllabus's workflow is: log the
      anomaly, analyse and classify it, decide a response (fix or keep as it is), close the report.

      ```mermaid
      stateDiagram-v2
          [*] --> New: tester logs the report
          New --> Rejected: not a defect, works as specified
          New --> Duplicate: already reported
          New --> Open: triaged - severity and priority confirmed
          Open --> Deferred: fix later, risk accepted
          Deferred --> Open: re-planned
          Open --> Fixed: developer fixes it
          Fixed --> Reopened: confirmation test fails
          Reopened --> Fixed: fixed again
          Fixed --> Closed: confirmation and regression tests pass
          Rejected --> [*]
          Duplicate --> [*]
          Closed --> [*]
      ```

      Notice that **"Fixed" is not the end**. The tester who reported it - or someone else - runs the
      original steps again (**confirmation testing**) and checks nothing nearby broke (**regression
      testing**, ISTQB 2.2.3) before the report is closed.

  - id: internals
    kind: internals
    concepts: [severity-and-priority, defect-lifecycle]
    title: Severity, priority and triage
    body: |
      **Severity** is the degree of impact of the defect on the interests of stakeholders or on the
      requirements. **Priority** is how urgently it should be fixed. They are separate fields because
      they answer separate questions, and they often disagree:

      | Defect | Severity | Priority | Why they differ |
      |---|---|---|---|
      | Company name misspelt on the home page | low | **high** | tiny impact on function, big impact on reputation, trivial fix |
      | Year-end tax export crashes (used once a year, in 10 months) | **high** | low (for now) | serious, but there is time; priority rises as the date nears |
      | Payment charged twice on retry | high | high | money and trust - fix now |
      | Tooltip overlaps a label on one rare screen size | low | low | cosmetic, few users |

      Who sets what is a team convention. A common one: the **reporter sets severity** (they saw the
      impact) and **suggests** priority; the **triage** meeting or product owner **decides priority**,
      because it depends on release plans, customers and cost - business information the tester may
      not have.

      Many teams define severity levels in writing - for example *critical* (data loss, security, money,
      no workaround), *major* (main function broken, workaround exists), *minor*, *trivial*. Use your
      team's definitions so "critical" means the same to everyone.

  - id: tests
    kind: tests
    concepts: [defect-lifecycle]
    title: Testing a fix - confirmation and regression
    body: |
      When SHOP-482 comes back as **Fixed**:

      | Check | What | Expected |
      |---|---|---|
      | Confirmation | the original steps on the fixed build | total 120.00 EUR at quantity 10 |
      | Boundaries | quantity 9 and 10 again, and 11 (should be refused) | correct totals; 11 refused |
      | Other entry points | change the quantity from the product page, not only the cart | same correct total |
      | Neighbours | several lines in the cart, remove a line, checkout total, order confirmation | all totals consistent |
      | Environments | the browsers and devices in the original report | fixed everywhere it failed |
      | Regression | the automated cart and checkout suite | still passes |

      Record the build you verified on in the report. If the fix works but you find **something new**,
      that is a **new report** linked to the old one - not a reason to reopen the old one.

  - id: mistakes
    kind: mistakes
    concepts: [defect-report-contents, severity-and-priority, defect-lifecycle]
    title: Common mistakes and how to fix them
    body: |
      - **Vague titles** - "Checkout bug". Use *what fails, where, when*: "Pay button stays disabled after
        a declined card is replaced".
      - **Opinions in place of facts** - "the API is slow" → "`POST /orders` took 8.4 s (HAR attached);
        the requirement is under 2 s".
      - **Diagnosing in the report** - add a hypothesis only if you label it as one, after the facts.
      - **Severity inflation** - everything "critical" means nothing is. Use the team's definitions.
      - **Leaking secrets** - screenshots with tokens, HAR files with cookies, real card or personal data.
        Redact before attaching.
      - **Reopening for a different problem** - new problem, new report, linked.
      - **Arguing in comments** - if a report is rejected as "works as designed", bring the requirement and
        the user impact to the product owner; it may be a **change request**, and that is a legitimate
        outcome.
      - **Never closing the loop** - "Fixed" reports that nobody retests are how regressions reach users.

      **When a developer can't reproduce it:** compare environments field by field (build, data,
      account, browser, feature flags, time zone), offer a screen-share, attach logs with timestamps
      they can search, and try their environment yourself.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [defect-report-contents]
    title: How much detail is enough?
    body: |
      | Situation | Lighter report is fine | Full report needed |
      |---|---|---|
      | Developer sits next to you, fixes it today | a short ticket plus a conversation | - |
      | Different team, time zone or company | - | always |
      | Intermittent failure | - | yes, with timestamps, logs, and how often it happens |
      | Defect in production affecting customers | - | yes, plus impact and the incident reference |
      | Found by static analysis | the tool's output and location | - |

      A detailed report costs you ten minutes and saves hours later; but a team that pairs closely may
      agree that an issue fixed within the hour only needs a one-line record **for tracking quality** -
      the second objective of defect reports. Decide this as a team rule, not report by report.

  - id: summary
    kind: summary
    title: Summary and quick reference
    body: |
      - **Error** (human) → **defect** (in the work product) → **failure** (what you observe). Report the
        failure; root cause analysis finds why.
      - Title = **what fails, where, when**. Steps = **minimal, from a clean state**. **Expected** and
        **actual** as separate facts.
      - Environment and build, reproducibility rate, evidence with **secrets removed**.
      - **Severity** = impact; **priority** = urgency. Set separately.
      - Lifecycle: log → analyse and classify → decide (fix, defer, reject) → fix → **confirmation +
        regression testing** → close.
      - One problem per report. Sources: ISTQB CTFL v4.0.1 5.5; ISO/IEC/IEEE 29119-3; Mozilla Bug Writing
        Guidelines.

exercises:
  - id: severity-priority-pairs
    type: mcq
    concept: severity-and-priority
    skill: application
    title: Low severity, high priority
    prompt: Which defect is the clearest example of **low severity but high priority**?
    options:
      - id: logo
        text: The shop's logo is shown upside down on the home page on launch day.
        feedback: Correct - functionally nothing is broken (low severity), but every visitor sees it on launch day, so it should be fixed at once (high priority).
      - id: crash
        text: The app crashes when a refund is issued.
        feedback: That is high severity - a core function fails. It would usually also be high priority.
      - id: tooltip
        text: A tooltip has a typo on a settings screen few people open.
        feedback: Low severity and low priority - small impact and no urgency.
      - id: export
        text: The yearly report export fails; it is next needed in eleven months.
        feedback: That is the opposite case - high severity (the function fails completely) but lower priority because there is time.
    correct: [logo]
    hints:
      - Severity is about impact on the function or requirement. Priority is about urgency.
      - Which defect hurts the business through visibility rather than through broken function?
    solution: |
      **The upside-down logo on launch day.** Severity and priority answer different questions - how bad
      is the impact, and how soon must it be fixed - so they are set separately.
    followUp: |
      Give an example from a payment flow of a defect with high severity and low priority, and explain
      what would make its priority rise.

  - id: debug-bad-report
    type: debug
    concept: defect-report-contents
    skill: analysis
    title: Which line will send the developer the wrong way?
    prompt: |
      Read this (made-up) report. Click the line that will most likely **mislead** the developer about
      where to look.
    language: plaintext
    code: |
      Title: Order confirmation email missing for PENDING orders
      Environment: Demo Shop build 2.7.1 (staging), any browser
      Steps:
        1. Pay with test card sandpay-unknown
        2. Wait until the order page shows SUCCEEDED
      Expected: confirmation email within 1 minute of SUCCEEDED
      Actual: no email after 15 minutes (3 of 3 attempts)
      Cause: the email service is down
      Evidence: order ids ord_7Kq2, ord_9Xa1, ord_3Lm8
    correctLines: [8]
    lineNotes:
      - line: 1
        note: A good title - what fails (email missing) and the condition (PENDING orders).
      - line: 7
        note: Factual, measured and with a reproduction rate - exactly what an actual result should be.
    hints:
      - Which line is an observation, and which is a guess?
      - If emails for orders paid with sandpay-success do arrive, what does that say about this line?
    solution: |
      **Line 8.** "The email service is down" is speculation stated as fact. If it were down, **every**
      order would lack an email - but the title says the problem is specific to PENDING orders. The
      developer may waste time on the email service while the real defect is probably that the email is
      triggered at order creation only when the status is SUCCEEDED. Replace it with an observation:
      "Orders paid with sandpay-success in the same period did get an email (ord_2Pz5)."
    followUp: |
      Rewrite line 8 as a labelled hypothesis that helps without misleading, and add the one extra
      observation that would support or reject it.

  - id: write-the-report
    type: testdesign
    concept: defect-report-contents
    skill: application
    title: Write the report from the evidence
    prompt: |
      Imagine this happens while you test the demo shop on an Android phone (Chrome) - the scenario is
      made up for practice; the real shop handles it correctly. With a declined test card
      (`sandpay-card-declined`), the error appears; you replace the card with `sandpay-success`, but the
      **Pay** button stays disabled. Reloading the page makes it work. On desktop Chrome the button is
      enabled again correctly. It happened 4 times out of 4.

      Write the complete defect report: title, environment, preconditions, steps, expected, actual,
      reproducibility, evidence, severity and suggested priority with reasons.
    hints:
      - The title needs the condition - after a decline, on mobile.
      - What would you attach that proves the button is disabled, not just slow?
      - Is there a workaround? How does that affect severity?
    modelAnswer: |
      **Title:** Pay button stays disabled after a declined card is replaced (Android Chrome)

      **Environment:** Demo Shop build (version from the footer), staging; Chrome on Android (version,
      device model); works on desktop Chrome (version).

      **Preconditions:** one product in the cart, on the checkout page, valid email entered.

      **Steps:** 1. Enter test card `sandpay-card-declined` and press Pay. 2. Wait for the message
      "Payment declined by the card issuer." 3. Replace the card with `sandpay-success`.

      **Expected:** the Pay button becomes enabled once a valid card and email are present (as it does
      before the first attempt).

      **Actual:** the Pay button stays disabled; reloading the page enables it. 4 of 4 attempts.

      **Evidence:** screen recording from step 1 to 3; screenshot of the disabled button; remote
      debugging console output (no errors / the error seen).

      **Severity:** major - customers whose first card is declined can't pay with another card; the
      workaround (reload) is not obvious. **Priority (suggested):** high - declined-then-retry is a
      common journey and lost sales are direct.
    rubric:
      - Title names what fails and the condition (after a decline, on Android)
      - Environment includes build, browser and device, and where it works
      - Preconditions and minimal numbered steps from a known state
      - Expected and actual written separately and factually
      - Reproducibility rate given
      - Evidence that proves the state (recording or screenshot), with nothing sensitive
      - Severity and priority set separately, each with a reason
      - No speculation about the cause presented as fact
    solution: |
      Compare with the model answer. The detail most often missing is **where it works** (desktop) - it
      tells the developer to look at mobile-specific event handling straight away.
    followUp: |
      The developer replies "cannot reproduce" on their Android emulator. List three differences you
      would check between your setup and theirs.

  - id: order-after-fix
    type: order
    concept: defect-lifecycle
    skill: recall
    title: After the developer marks it fixed
    prompt: Put the steps in order, from the developer marking the defect fixed to closing the report.
    items:
      - id: build
        text: Check the fix is in the build you are testing
      - id: confirm
        text: Run the original steps again (confirmation testing)
      - id: around
        text: Test boundaries and other entry points around the fix
      - id: regression
        text: Run the relevant regression tests
      - id: record
        text: Record the verified build and the result in the report
      - id: close
        text: Close the report
    hints:
      - You can't confirm a fix that isn't in your build.
      - Closing comes after the evidence is recorded.
    solution: |
      Build → confirmation → around the fix → regression → record → close. The two kinds of testing are
      different: confirmation proves **this** failure is gone, regression proves the change didn't break
      **something else**.

  - id: cannot-reproduce
    type: mcq
    concept: defect-lifecycle
    skill: analysis
    title: "\"Cannot reproduce\""
    prompt: |
      Your report about a wrong refund total comes back **Rejected - cannot reproduce**. You can still
      reproduce it on staging every time. What is the best next step?
    options:
      - id: reopen-angry
        text: Reopen it and write that it definitely happens.
        feedback: Reopening without new information repeats the disagreement. The developer needs something they can act on.
      - id: compare
        text: Compare environments and data with the developer (build, account, feature flags, data), and offer to reproduce it together.
        feedback: Correct - "cannot reproduce" almost always means the two setups differ. Finding the difference is often half the diagnosis.
      - id: new-report
        text: File a new report with the same content.
        feedback: That creates a duplicate and loses the history. Improve the existing report instead.
      - id: accept
        text: Accept the rejection - if the developer can't see it, it isn't a defect.
        feedback: You can see it reliably on staging, so something real is failing. Dropping it lets it reach users.
    correct: [compare]
    hints:
      - If both of you are right, what must be different?
    solution: |
      **Compare the setups and reproduce it together.** Typical differences: build or branch, test data
      (a refund on a partially refunded payment), account role, feature flags, browser, time zone. Add
      what you find to the report - it often points straight at the defect.
    followUp: |
      It turns out the defect only happens for payments created before the last database migration. How
      do you update the report's title and steps?

  - id: interview-not-a-bug
    type: interview
    concept: defect-lifecycle
    skill: application
    title: "Interview: \"that's not a bug\""
    prompt: |
      *"A developer closes your defect saying it works as designed. You think customers will be hurt by
      it. What do you do?"* Answer as you would in the interview.
    hints:
      - Is the developer the person who decides what the product should do?
      - What evidence would change the decision?
    modelAnswer: |
      First I'd check whether they're right: re-read the requirement or story, the design, and any
      decision records. If the behaviour really is as specified, the question is whether the
      specification is right - and that is the product owner's decision, not mine or the developer's.

      So I'd bring it to the product owner with evidence of impact: who is affected, how (money, data,
      blocked journeys), how often, and what users will experience - ideally with a short recording.
      I'd frame it as a possible **change request**, which is a legitimate outcome of defect analysis,
      and keep the report linked to it.

      Whatever is decided, I'd make sure it's recorded - accepted as designed with the risk noted, or
      changed and planned. I wouldn't reopen it repeatedly or argue in comments; the goal is the right
      product, not winning.
    rubric:
      - Checked the requirement or design before escalating
      - Recognised that the product owner decides intended behaviour
      - Brought evidence of user or business impact
      - Mentioned change request as a possible outcome
      - Made sure the decision is recorded either way
      - Stayed constructive rather than adversarial
    followUps:
      - The product owner agrees with the developer, and you still disagree. Now what?
      - How do you prevent this kind of disagreement on the next feature?
      - What if the "design" is the developer's own undocumented decision?
    solution: |
      Interviewers listen for **judgement and collaboration**: you check yourself first, take it to the
      person who owns the decision, argue with impact, and accept a recorded decision.

  - id: explain-expected-actual
    type: short
    concept: defect-report-contents
    skill: recall
    title: Why expected and actual are separate
    prompt: In two or three sentences, explain why a defect report states the expected and the actual result separately.
    hints:
      - What can the reader not tell from "the total is wrong"?
    modelAnswer: |
      The expected result says what should happen, ideally traced to a requirement, so the reader can
      check the tester's assumption; the actual result says exactly what was observed. Together they
      define the failure precisely - without the expected result the reader can't tell whether the
      behaviour is wrong or the expectation is.
    rubric:
      - Said the expected result should be traceable to a requirement or criterion
      - Said the actual result is the precise observation
      - Explained that both are needed to judge whether it is a defect
    solution: |
      The pair also makes **confirmation testing** possible later - the fix is verified against the
      expected result.

placement:
  - id: place-severity
    type: mcq
    concept: severity-and-priority
    skill: application
    title: Severity or priority?
    prompt: |
      "Customers on the old app version can't complete payment, but that version is forced to update on
      Monday and only a handful of users are still on it." Which assessment fits best?
    options:
      - id: high-sev-lower-pri
        text: High severity, lower priority
        feedback: Correct - payment is blocked (high impact for those users), but the forced update removes the problem soon and few users are affected, which lowers the urgency.
      - id: low-sev-high-pri
        text: Low severity, high priority
        feedback: Being unable to pay is a serious impact on the users who hit it - that is high severity, not low.
      - id: same
        text: Severity and priority must always be equal
        feedback: They are separate fields precisely because impact and urgency can differ.
      - id: tester-decides
        text: The tester sets both and the team must accept them
        feedback: The reporter usually sets severity and suggests priority; priority depends on business plans and is confirmed in triage.
    correct: [high-sev-lower-pri]
    solution: |
      **High severity, lower priority.** Severity measures impact; priority measures urgency, which
      here is reduced by the forced update and the small number of users. A triage owner might still fix
      it if Monday's update slips.

  - id: place-report-gap
    type: mcq
    concept: defect-report-contents
    skill: analysis
    title: What is missing?
    prompt: |
      A report reads: *"Title: Refund fails. Steps: 1. Open a captured payment 2. Refund 40.00 EUR.
      Expected: refund succeeds. Actual: error shown."* What should the reporter add **first** to make it
      reproducible?
    options:
      - id: env-data
        text: The environment and build, the payment's details (amount captured, earlier refunds) and the exact error message
        feedback: Correct - without the build, the data and the exact error, the developer can't recreate the situation or search the logs.
      - id: severity
        text: A higher severity so it gets attention
        feedback: Severity doesn't make a report reproducible, and inflating it erodes trust in all your reports.
      - id: cause
        text: The likely cause in the code
        feedback: Guessing the cause is not the reporter's job and can mislead. Facts that let someone reproduce it come first.
      - id: screenshots
        text: More screenshots of the payment list
        feedback: Evidence helps, but screenshots of a list don't tell the developer the payment's state, the build or the error text.
    correct: [env-data]
    solution: |
      **Environment, data and the exact error.** "Refund 40.00 EUR" fails differently on a 30.00 EUR
      payment, a 100.00 EUR payment already refunded by 70.00 EUR, or a payment in another currency.

  - id: place-lifecycle
    type: mcq
    concept: defect-lifecycle
    skill: application
    title: The report says "Fixed"
    prompt: A defect you reported is marked **Fixed** in the new build. What should happen before the report is closed?
    options:
      - id: confirm-regress
        text: Confirmation testing of the original failure and regression testing around the change
        feedback: Correct - confirmation proves this failure is gone; regression checks the change broke nothing else.
      - id: close
        text: Nothing - the developer has verified it
        feedback: The developer's check is valuable but not independent, and they may have tested a different scenario or environment than the one that failed.
      - id: new-report
        text: A new report to confirm the fix
        feedback: The verification belongs in the same report, with the build it was verified on.
      - id: wait
        text: Wait for a customer to confirm it in production
        feedback: That ships an unverified fix - if it doesn't work, customers find out first.
    correct: [confirm-regress]
    solution: |
      **Confirmation testing, then regression testing**, recorded in the report with the build number -
      then close it.

recall:
  - id: recall-error-defect-failure
    concept: defect-report-contents
    prompt: What is the difference between an error, a defect and a failure?
    answer: An error is a human mistake; it produces a defect in a work product; executing the defect may cause a failure - the observed wrong behaviour.
  - id: recall-title
    concept: defect-report-contents
    prompt: What should a defect report title contain?
    answer: What fails, where, and under which condition - specific enough to identify the report uniquely.
  - id: recall-facts
    concept: defect-report-contents
    prompt: How should you handle your idea of the cause in a report?
    answer: Report the facts first; if you add a hypothesis, label it clearly as one so it doesn't send the developer the wrong way.
  - id: recall-sev-pri
    concept: severity-and-priority
    prompt: What is the difference between severity and priority?
    answer: Severity is the degree of impact of the defect; priority is how urgently it should be fixed. They are set separately.
  - id: recall-who-priority
    concept: severity-and-priority
    prompt: Who usually decides a defect's priority, and why?
    answer: The triage owner or product owner - priority depends on release plans, customers and cost, which the reporter may not know.
  - id: recall-confirmation
    concept: defect-lifecycle
    prompt: What is the difference between confirmation testing and regression testing?
    answer: Confirmation testing re-runs the original failing steps to prove the fix works; regression testing checks the change didn't break anything else.

