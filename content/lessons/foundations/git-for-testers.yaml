id: git-for-testers
title: Git for testers and automation engineers
subject: foundations
module: git-and-debugging
level: beginner
status: published
estimatedMinutes: 50
summary: Commit test code safely - the working tree, staging area and history, branches and pull requests, merge conflicts, and how to undo a change without destroying anyone's work.
tags: [git, version control, branches, pull requests, merge, rebase, conflicts, revert, reset, automation]

environment: |
  - **Sources:** the official Git documentation at [git-scm.com/docs](https://git-scm.com/docs) and the
    free book **Pro Git** (Scott Chacon and Ben Straub, 2nd edition) at
    [git-scm.com/book](https://git-scm.com/book/en/v2) - in particular "What is Git?" (the three states)
    and "Git Branching - Rebasing" (the perils of rebasing).
  - **Version:** commands and output shown are from **Git 2.43**. `git switch` and `git restore` exist
    since **Git 2.23**; on older versions use `git checkout`.
  - **Hosting-specific:** pull requests are a feature of hosting services, not of Git itself - GitHub and
    Bitbucket call them pull requests, GitLab calls them merge requests. Review rules and branch
    protection are configured per repository.
  - **Examples:** the repository, file names and commits are fictional; commit ids are shortened.

prerequisites: []

concepts:
  - id: git-three-states
    name: Working tree, staging area and history
    summary: Files are modified in the working tree, staged in the index, and committed as snapshots into the repository's history, each commit identified by a hash.
  - id: branches-and-pull-requests
    name: Branches and pull requests
    summary: Work on a branch, keep it up to date, push it and open a pull request for review and CI before it is merged; never rewrite history that others already have.
  - id: conflicts-and-safe-undo
    name: Conflicts and safe undo
    summary: Resolve conflict markers deliberately, and undo with the right tool - restore for local files, revert for shared commits, reset only for history nobody else has.

objectives:
  - Explain the working tree, staging area and repository, and read `git status` to say which state each change is in.
  - Add a test on a branch and take it through push, pull request, review and merge.
  - Resolve a merge conflict in test code and check the result before committing it.
  - Choose between `git restore`, `git revert` and `git reset` to undo a change safely.

sections:
  - id: intuition
    kind: intuition
    concepts: [git-three-states, branches-and-pull-requests]
    title: The idea in plain language
    body: |
      Think of a shared photo album of the project. Your **desk** is where you change things (the working
      tree). Before adding a page to the album you put the photos you've chosen into an **envelope** (the
      staging area). Gluing the envelope's contents in as a new, dated page is a **commit** - and pages are
      never torn out of a shared album; mistakes are corrected with a new page.

      A **branch** is your own copy of the album where you can add pages without disturbing anyone. When
      your pages are ready you ask the others to look at them - a **pull request** - and once they agree,
      your pages are added to the shared album (the merge).

      If two people changed the same photo on their copies, Git can't choose for them - that is a
      **conflict**, and a person has to decide.

  - id: what
    kind: what
    concepts: [git-three-states]
    title: "What Git keeps: three states, three places"
    body: |
      From Pro Git: files are in one of three states - **modified** (changed, not committed), **staged**
      (marked to go into the next commit) or **committed** (safely stored in your local database). That
      gives the three main sections of a Git project:

      | Place | Also called | What it holds | Command that moves things in |
      |---|---|---|---|
      | **Working tree** | working directory | the files on disk you edit | (you edit) |
      | **Staging area** | the **index** | what will go into the next commit | `git add` |
      | **Repository** | `.git` directory | every commit - the history | `git commit` |

      Each **commit** is a **snapshot** of the whole project (unchanged files are linked, not copied) with an
      author, a date, a message and a pointer to its parent. It is identified by a **hash** - a 40-character
      hexadecimal SHA-1 by default, usually shown shortened (`7b3321b`).

      A **branch** is just a movable name pointing at a commit; `HEAD` is the commit you have checked out.
      A **remote** (usually `origin`) is another copy of the repository, such as the one on GitHub.

  - id: why
    kind: why
    concepts: [branches-and-pull-requests, conflicts-and-safe-undo]
    title: Why testers need Git
    body: |
      - **Test code is code.** Automated tests, page objects, test data and CI configuration live in the
        same repository as the product, or next to it. Changing them means committing, branching and
        reviewing like a developer.
      - **Builds are commits.** "Which build did you test?" is answered with a commit hash or tag. A defect
        report that says "fails on `a005ac8`, passes on `dddccf1`" is precise.
      - **History is evidence.** `git log` and `git blame` show what changed, when, and in which pull
        request - the fastest route from "this test started failing yesterday" to the change that did it.
        [The next lesson](#/lesson/scientific-debugging) uses `git bisect` to find it automatically.
      - **Mistakes are recoverable** - if you use the right undo. The wrong one (a forced push over shared
        history) can delete a colleague's work.

  - id: steps
    kind: steps
    concepts: [branches-and-pull-requests, git-three-states]
    title: Step by step - adding a test through a pull request
    body: |
      ```bash
      git switch main
      git pull                              # get the latest shared history
      git switch -c refund-tests            # create a branch and switch to it

      # ...write the test...
      git status                            # what changed?
      git diff                              # the exact changes, not yet staged
      git add src/test/java/RefundTest.java # stage only what belongs in this commit
      git diff --staged                     # review what will be committed
      git commit -m "Add partial refund boundary tests"

      git push -u origin refund-tests       # publish the branch; -u remembers the upstream
      ```

      Then on the hosting service:

      1. **Open a pull request** from `refund-tests` into `main`. Describe what the tests cover and why,
         and link the story or defect.
      2. **CI runs** the checks on your branch. A red build is your first reviewer.
      3. **Review:** respond to comments with new commits on the same branch; the pull request updates
         itself when you push.
      4. **Keep it current:** if `main` has moved on, bring its changes into your branch (`git pull origin
         main`, or rebase if your team does that **and** the branch is only yours).
      5. **Merge** when approved and green, then delete the branch.

      Git's own advice for messages: a short first line (under 50 characters) summarising the change,
      a blank line, then more detail if needed.

  - id: visual
    kind: visual
    concepts: [branches-and-pull-requests]
    title: "Branch graph: a test branch and its merge"
    body: |
      `main` keeps moving while you work. The merge commit joins the two lines of history.

      ```mermaid
      gitGraph
          commit id: "Add checkout test"
          branch refund-tests
          checkout refund-tests
          commit id: "Add refund page object"
          commit id: "Add partial refund tests"
          checkout main
          commit id: "Fix flaky wait"
          checkout refund-tests
          merge main id: "Bring main up to date"
          checkout main
          merge refund-tests id: "Merge pull request"
      ```

      Bringing `main` into the branch **before** the final merge means CI tests your tests together with
      everyone else's latest changes - conflicts and breakages show up on your branch, not on `main`.

  - id: internals
    kind: internals
    concepts: [git-three-states]
    title: Reading git status
    body: |
      `git status` tells you which of the three states every change is in. Real output from Git 2.43:

      ```plaintext
      On branch main
      Changes to be committed:
        (use "git restore --staged <file>..." to unstage)
              modified:   CheckoutTest.java

      Changes not staged for commit:
        (use "git add <file>..." to update what will be committed)
        (use "git restore <file>..." to discard changes in working directory)
              modified:   notes.txt

      Untracked files:
        (use "git add <file>..." to include in what will be committed)
              test-results/
      ```

      - **Changes to be committed** - staged; `git commit` will include them.
      - **Changes not staged for commit** - modified in the working tree; not in the next commit unless you
        `git add` them.
      - **Untracked files** - Git doesn't know them yet. Test output like `test-results/`, `target/` or
        `playwright-report/`, and secrets like `.env`, should be listed in **`.gitignore`** so they never
        get committed by accident.

      The same file can be in two sections at once: you staged one version, then edited it again. The
      commit takes the **staged** version.

  - id: example
    kind: example
    concepts: [conflicts-and-safe-undo]
    title: "Real-world example: two people change the same expected value"
    body: |
      On `main`, a colleague changed the expected total to include the currency. On your branch you changed
      it for a new discount. Merging `refund-tests` into `main` (real Git 2.43 output):

      ```plaintext
      Auto-merging CheckoutTest.java
      CONFLICT (content): Merge conflict in CheckoutTest.java
      Automatic merge failed; fix conflicts and then commit the result.
      ```

      The file now contains both versions between **conflict markers**:

      ```java
      class CheckoutTest {
      <<<<<<< HEAD
          String expectedTotal = "120.00 EUR";
      =======
          String expectedTotal = "118.80";
      >>>>>>> refund-tests
      }
      ```

      - between `<<<<<<< HEAD` and `=======` - the version on the branch you are merging **into**;
      - between `=======` and `>>>>>>> refund-tests` - the version from the branch being merged.

      Neither side is simply "right": the correct result is **both changes** - the discounted amount with
      the currency, `"118.80 EUR"`. So you:

      1. edit the file to the intended result and **delete all three marker lines**;
      2. run the tests - a conflict resolved by hand is new code;
      3. `git add CheckoutTest.java` to mark it resolved, then `git commit`.

      If you're unsure, `git merge --abort` puts everything back as it was before the merge.

  - id: code
    kind: code
    concepts: [conflicts-and-safe-undo, git-three-states]
    title: Undo commands - which one, when
    collapsed: true
    body: |
      ```bash
      # Discard your uncommitted changes to one file (working tree back to the last commit)
      git restore src/test/java/RefundTest.java

      # Unstage a file but keep your changes in the working tree
      git restore --staged src/test/java/RefundTest.java

      # Fix the message or add a forgotten file to your LAST commit - only if not pushed yet
      git commit --amend

      # Undo a commit that is already pushed: a NEW commit that reverses it
      git revert 7b3321b

      # Put your work aside to switch branches, then bring it back
      git stash
      git stash pop

      # Move your branch back and DISCARD the commits and changes after it - local, unshared work only
      git reset --hard dddccf1

      # If you really must overwrite your own remote branch, refuse if someone else pushed meanwhile
      git push --force-with-lease
      ```

      Finding where a change came from:

      ```bash
      git log --oneline --graph --all            # the shape of the history
      git log -p -- src/test/java/RefundTest.java  # every change to one file, with diffs
      git blame src/test/java/RefundTest.java    # which commit last changed each line
      git show 7b3321b                           # one commit in full
      ```

  - id: tradeoffs
    kind: tradeoffs
    concepts: [branches-and-pull-requests, conflicts-and-safe-undo]
    title: Merge or rebase? Revert or reset?
    body: |
      **Merge versus rebase** (Pro Git, "Rebasing"):

      | | Merge | Rebase |
      |---|---|---|
      | What it does | joins two lines of history with a merge commit | replays your commits on top of the other branch |
      | History | records what actually happened, including parallel work | linear, as if the work happened in sequence |
      | Final files | the same | the same |
      | Risk | extra merge commits | **rewrites commits** - new hashes |

      Pro Git's rule: **"Do not rebase commits that exist outside your repository and that people may have
      based work on."** Rebasing your own unpushed (or unshared) branch is fine; rebasing a shared branch
      forces everyone else to untangle their copies.

      **Revert versus reset:**

      | | `git revert` | `git reset --hard` |
      |---|---|---|
      | How | adds a new commit that undoes an old one | moves the branch back; later commits disappear from it |
      | History | kept - everyone can see what was undone and why | rewritten |
      | Use on shared branches | **yes** | **no** - it needs a forced push and breaks others' copies |

  - id: mistakes
    kind: mistakes
    concepts: [git-three-states, branches-and-pull-requests, conflicts-and-safe-undo]
    title: Common mistakes and how to recover
    body: |
      - **Committing test output or secrets.** Add `test-results/`, `target/`, screenshots folders and
        `.env` to `.gitignore`. If a secret was pushed, **rotate it** - deleting the commit doesn't remove
        it from everyone's copies.
      - **`git add .` without looking.** Review `git status` and `git diff --staged` before every commit.
      - **Huge pull requests.** Ten small, focused commits in a small pull request get reviewed properly;
        one big one gets skimmed.
      - **Working on `main` directly.** Branch first; many repositories protect `main` so you can't push to
        it.
      - **Leaving conflict markers in the file.** Search for `<<<<<<<` before committing; a test file with a
        marker doesn't compile.
      - **Resolving a conflict by picking one side blindly.** Read both - usually both changes are needed.
      - **Force-pushing a shared branch.** Use `git revert` instead, or `--force-with-lease` on a branch
        that is only yours.
      - **Panicking after a bad reset.** `git reflog` lists where `HEAD` has been recently, so a lost local
        commit can usually be found again and recovered with `git switch -c rescue <hash>`.

  - id: summary
    kind: summary
    title: Summary and quick reference
    body: |
      - **Working tree → `git add` → staging area (index) → `git commit` → history.** `git status` shows
        each state.
      - Commits are **snapshots** with a hash; branches are movable names; `HEAD` is where you are.
      - Flow: `git switch -c branch` → commit → `git push -u origin branch` → **pull request** → CI and
        review → merge.
      - Conflicts: edit to the intended result, remove `<<<<<<<` `=======` `>>>>>>>`, **run the tests**,
        `git add`, `git commit` - or `git merge --abort`.
      - Undo: `git restore` (local files), `git revert` (shared commits), `git reset` (unshared history
        only). **Never rebase or force-push shared history.**
      - Ignore test output and secrets with `.gitignore`. Sources: Pro Git; git-scm.com/docs.

exercises:
  - id: read-status
    type: mcq
    concept: git-three-states
    skill: application
    title: What will the commit contain?
    prompt: |
      ```plaintext
      On branch refund-tests
      Changes to be committed:
              modified:   src/test/java/RefundTest.java

      Changes not staged for commit:
              modified:   src/test/java/pages/RefundPage.java

      Untracked files:
              test-results/
      ```

      You run `git commit -m "Add refund tests"`. What goes into the commit?
    options:
      - id: staged-only
        text: Only the changes to RefundTest.java
        feedback: Correct - only staged changes are committed. RefundPage.java is modified but not staged, and test-results/ is untracked.
      - id: all-modified
        text: RefundTest.java and RefundPage.java
        feedback: git commit takes the staging area. RefundPage.java's changes stay in the working tree until you git add them (or use git commit -a).
      - id: everything
        text: Everything listed, including test-results/
        feedback: Untracked files are never committed unless added. test-results/ should go in .gitignore.
      - id: nothing
        text: Nothing - you must push first
        feedback: Committing is local. Pushing publishes commits you already made.
    correct: [staged-only]
    hints:
      - Which section is "to be committed"?
    solution: |
      **Only RefundTest.java.** If the page object change is part of the same work, `git add` it too before
      committing - otherwise the committed test may not compile without it. And add `test-results/` to
      `.gitignore`.
    followUp: |
      You notice too late that RefundPage.java was needed. The commit is not pushed yet. Which command adds
      it to the same commit?

  - id: order-pr-flow
    type: order
    concept: branches-and-pull-requests
    skill: application
    title: From idea to merged test
    prompt: Put the steps for contributing a new automated test in order.
    items:
      - id: update
        text: Switch to main and pull the latest changes
      - id: branch
        text: Create a branch for the new test
      - id: commit
        text: Write the test, review the diff, and commit it
      - id: push
        text: Push the branch to the remote
      - id: pr
        text: Open a pull request and let CI run
      - id: review
        text: Address review comments with new commits
      - id: merge
        text: Merge once approved and green, then delete the branch
    hints:
      - Start from an up-to-date main, so your branch starts from the latest history.
    solution: |
      Update main → branch → commit → push → pull request → review → merge. Starting from an up-to-date
      `main` keeps conflicts small; CI on the pull request tests your change before it reaches everyone.

  - id: debug-leftover-marker
    type: debug
    concept: conflicts-and-safe-undo
    skill: analysis
    title: The resolved file doesn't compile
    prompt: |
      After resolving a merge conflict, the build fails with a syntax error in this file. Click the line
      that was left behind by the resolution.
    language: java
    code: |
      public class RefundPage {
          private final Page page;

          public RefundPage(Page page) {
              this.page = page;
          }

          public void refund(String amount) {
              page.getByTestId("refund-amount").fill(amount);
      >>>>>>> refund-tests
              page.getByTestId("refund-submit").click();
          }
      }
    correctLines: [10]
    lineNotes:
      - line: 9
        note: This is ordinary test code - filling in the amount field. It compiles.
      - line: 11
        note: Submitting the form is part of the intended method.
    hints:
      - Look for a line that isn't Java at all.
    solution: |
      **Line 10.** `>>>>>>> refund-tests` is the closing conflict marker. The other markers were deleted,
      this one was missed. Search the whole change for `<<<<<<<`, `=======` and `>>>>>>>` before
      committing - and run the tests, because a compiling file can still be a wrong resolution.
    followUp: |
      What would `git diff --check` or your IDE show you here? Find out which conflict-marker check your
      tools offer.

  - id: undo-shared
    type: mcq
    concept: conflicts-and-safe-undo
    skill: analysis
    title: Undo a pushed commit
    prompt: |
      Your commit `a005ac8` on the shared `main` branch disabled half of the regression suite by mistake.
      Others have already pulled it and pushed commits on top. How do you undo it?
    options:
      - id: revert
        text: git revert a005ac8, then push
        feedback: Correct - revert adds a new commit that reverses a005ac8. History stays intact, and everyone simply pulls the fix.
      - id: reset
        text: git reset --hard to the commit before a005ac8, then force-push
        feedback: That rewrites shared history and throws away everyone else's commits made after yours. Their copies no longer match the remote.
      - id: amend
        text: git commit --amend to change a005ac8
        feedback: Amend only changes your latest local commit - and rewriting a pushed commit has the same problems as reset.
      - id: delete-branch
        text: Delete main and push it again from your machine
        feedback: That is a forced rewrite of the most important branch - the most destructive option here.
    correct: [revert]
    hints:
      - Others have commits on top of yours. Which option keeps their work untouched?
    solution: |
      **`git revert a005ac8`.** It creates a commit that does the opposite of `a005ac8`; push it like any
      other change (through a pull request if `main` is protected). The history then tells the truth: the
      suite was disabled by mistake and restored.
    followUp: |
      The same mistake is on your own branch and nobody else has it yet. Which undo would you use there,
      and why is it acceptable?

  - id: merge-or-rebase
    type: mcq
    concept: branches-and-pull-requests
    skill: application
    title: Bringing main into your branch
    prompt: |
      Your pull request branch `refund-tests` has been pushed, and a colleague has added commits to it to
      help you. `main` has moved on. How do you bring `main`'s changes into the branch?
    options:
      - id: merge-main
        text: Merge main into refund-tests and push
        feedback: Correct - merging doesn't rewrite the commits your colleague already has, so their copy keeps working.
      - id: rebase-force
        text: Rebase refund-tests onto main and force-push
        feedback: The branch is shared now - your colleague based work on its commits. Rebasing rewrites them, which Pro Git warns against.
      - id: new-branch
        text: Start a new branch from main and copy the files over by hand
        feedback: It works, but loses the history and your colleague's commits' authorship, and is error-prone.
      - id: wait
        text: Nothing - the pull request will merge it automatically
        feedback: The merge into main happens at the end; without updating the branch, CI never tests your tests together with main's latest changes.
    correct: [merge-main]
    hints:
      - Is anyone else using this branch's commits?
    solution: |
      **Merge `main` into the branch.** Rebase is fine for a branch only you have, but this one is shared,
      and Pro Git's rule is clear: don't rebase commits that exist outside your repository and that people
      may have based work on.
    followUp: |
      Your team insists on a linear history. How can you get one without rebasing shared commits?

  - id: explain-staging
    type: short
    concept: git-three-states
    skill: recall
    title: Why a staging area?
    prompt: In two or three sentences, explain what the staging area is for, with an example from test automation.
    hints:
      - Think of a working tree with several unrelated changes in it.
    modelAnswer: |
      The staging area (the index) holds exactly what will go into the next commit, so you can commit some
      changes and not others. For example, if I fixed a flaky wait and also started a new test, I can stage
      and commit the wait fix on its own, so it can be reviewed and reverted separately from the unfinished
      test.
    rubric:
      - Said the staging area holds what the next commit will contain
      - Said it lets you commit part of your changes
      - Gave a concrete example of separating unrelated changes
    solution: |
      Small, focused commits are easier to review, to revert and to find with `git bisect`.

  - id: interview-contribute-test
    type: interview
    concept: branches-and-pull-requests
    skill: application
    title: "Interview: your first change to the test repository"
    prompt: |
      *"You've joined the team and need to add automated tests for a new feature to our shared repository.
      Walk me through how you'd do it, from cloning to merge."* Answer as you would in the interview.
    hints:
      - Include the Git steps and the team steps (review, CI).
      - What do you check before committing? What do you never commit?
    modelAnswer: |
      I'd clone the repository, read the README and contribution guide, and run the existing suite locally
      first so I know it's green before I change anything.

      Then I'd create a branch from an up-to-date `main`, write the tests following the existing patterns -
      page objects, fixtures, naming - and run them locally, including a check that they fail when the
      feature is broken. Before each commit I'd review `git status` and `git diff --staged`, and keep test
      output, credentials and `.env` files out with `.gitignore`.

      I'd push the branch and open a pull request with a description of what's covered and why, linked to
      the story, and let CI run. I'd respond to review comments with new commits, keep the branch up to date
      by merging `main` in, resolve any conflicts carefully and re-run the tests, and merge only when it's
      approved and green. If something goes wrong after merge, I'd revert rather than rewrite history.
    rubric:
      - Ran the existing suite before changing anything
      - Worked on a branch from an up-to-date main
      - Reviewed the diff and kept output and secrets out of commits
      - Opened a pull request with a clear description and let CI run
      - Kept the branch current and handled conflicts with a re-run of the tests
      - Mentioned a safe undo (revert) instead of rewriting shared history
    followUps:
      - Your pull request has a merge conflict in a shared page object. How do you resolve it safely?
      - CI fails on your branch but the tests pass locally. What do you check?
      - How do you keep a pull request small when the feature is big?
    solution: |
      Interviewers listen for **safe habits**: a green start, branches, reviewing your own diff, no secrets,
      CI before merge, and undoing with revert.

placement:
  - id: place-states
    type: mcq
    concept: git-three-states
    skill: application
    title: Staged or not?
    prompt: |
      You edit `LoginTest.java`, run `git add LoginTest.java`, then edit the file again. What happens if you
      now run `git commit`?
    options:
      - id: first-version
        text: The commit contains the version you staged; the later edit stays uncommitted in the working tree.
        feedback: Correct - git add stages a snapshot of the file at that moment. Later edits need another git add.
      - id: latest
        text: The commit contains the latest version of the file.
        feedback: Only what is staged is committed. The second edit was never added.
      - id: error
        text: Git refuses because the file changed after staging.
        feedback: Git allows this - git status shows the file in both "to be committed" and "not staged".
      - id: both-lost
        text: Both edits are lost.
        feedback: Nothing is lost - one version is committed and the other is still in your working tree.
    correct: [first-version]
    solution: |
      **The staged version.** `git status` would show the file twice: once under "Changes to be
      committed" and once under "Changes not staged for commit".

  - id: place-rebase
    type: mcq
    concept: branches-and-pull-requests
    skill: analysis
    title: When rebasing is a problem
    prompt: In which situation does rebasing cause problems for other people?
    options:
      - id: shared
        text: Rebasing commits that are already pushed and that others have based work on
        feedback: Correct - rebase rewrites those commits with new hashes, so others' copies no longer match. This is Pro Git's rule.
      - id: local
        text: Rebasing local commits you haven't pushed yet
        feedback: Nobody else has those commits, so rewriting them affects only you.
      - id: final-files
        text: Any rebase, because it produces different final files than a merge
        feedback: The final snapshot is the same as with a merge; only the history differs.
      - id: never
        text: Never - rebase is always safe because Git keeps a backup
        feedback: Your reflog keeps your own old commits for a while, but other people's copies still diverge from the rewritten branch.
    correct: [shared]
    solution: |
      **Rebasing shared, pushed commits.** Rebase your own unshared work freely; merge when the commits
      exist elsewhere.

  - id: place-undo
    type: mcq
    concept: conflicts-and-safe-undo
    skill: application
    title: Discard a local change
    prompt: You changed `config/test.properties` while experimenting and want to throw that change away. It is not staged or committed. Which command does it?
    options:
      - id: restore
        text: git restore config/test.properties
        feedback: Correct - it puts the file in the working tree back to the last committed (or staged) version.
      - id: revert
        text: git revert config/test.properties
        feedback: git revert works on commits, not on uncommitted file changes.
      - id: reset-hard
        text: git reset --hard
        feedback: That would discard ALL uncommitted changes in every file, not just this one - far more than you asked for.
      - id: rm
        text: git rm config/test.properties
        feedback: That deletes the file from the repository in the next commit - the opposite of restoring it.
    correct: [restore]
    solution: |
      **`git restore <file>`** (Git 2.23+; older versions use `git checkout -- <file>`). It discards that
      file's uncommitted changes - permanently, so be sure first.

recall:
  - id: recall-three-states
    concept: git-three-states
    prompt: What are Git's three states for a file, and the three places that go with them?
    answer: Modified, staged and committed - in the working tree, the staging area (index) and the repository (.git directory).
  - id: recall-commit
    concept: git-three-states
    prompt: What is a Git commit?
    answer: A snapshot of the project with an author, date, message and parent, identified by a hash.
  - id: recall-ignore
    concept: git-three-states
    prompt: How do you keep test output and secrets out of commits?
    answer: List them in .gitignore (for example test-results/, target/, .env) and review git status and git diff --staged before committing.
  - id: recall-pr
    concept: branches-and-pull-requests
    prompt: What does a pull request add on top of a branch?
    answer: A place for review and CI checks before the branch is merged - a hosting-service feature (merge request on GitLab), not part of Git itself.
  - id: recall-rebase-rule
    concept: branches-and-pull-requests
    prompt: What is Pro Git's rule about rebasing?
    answer: Do not rebase commits that exist outside your repository and that people may have based work on.
  - id: recall-markers
    concept: conflicts-and-safe-undo
    prompt: What do the three conflict markers separate?
    answer: Between <<<<<<< HEAD and ======= is the version on the current branch; between ======= and >>>>>>> branch-name is the version being merged in.
  - id: recall-revert-reset
    concept: conflicts-and-safe-undo
    prompt: When do you use git revert rather than git reset?
    answer: For commits that are already shared - revert adds a new commit that undoes the change, while reset rewrites history.

