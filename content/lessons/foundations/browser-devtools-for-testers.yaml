id: browser-devtools-for-testers
title: Browser DevTools for testers
subject: foundations
module: web-mobile-basics
level: beginner
status: published
estimatedMinutes: 50
summary: Use the Network, Console and Application panels and device mode to gather evidence - what was sent, what came back, what failed in the page, what is stored - and know where emulation stops and a real device starts.
tags: [devtools, chrome, network panel, har, console, cookies, local storage, device mode, throttling, evidence, mobile web]

environment: |
  - **Browser:** **Chrome DevTools**, as documented on developer.chrome.com -
    [Network features reference](https://developer.chrome.com/docs/devtools/network/reference),
    [Console features reference](https://developer.chrome.com/docs/devtools/console/reference),
    [Cookies](https://developer.chrome.com/docs/devtools/storage/cookies),
    [Local storage](https://developer.chrome.com/docs/devtools/storage/localstorage),
    [Device mode](https://developer.chrome.com/docs/devtools/device-mode). Microsoft Edge uses the same
    DevTools. Labels and menus **change between Chrome versions** - if a label differs, search the
    docs for the feature.
  - **Other browsers:** Firefox (Firefox DevTools) and Safari (Web Inspector) have equivalent panels with
    different names and menus; check their own documentation.
  - **Practice target:** the fictional [SandPay Demo Shop](shop/index.html) published with this app. Its
    catalogue loads `products.json`, and its cart and orders live in `sessionStorage` under
    `sandpay-shop-cart` and `sandpay-shop-orders`.
  - **Privacy:** HAR files, copied requests and screenshots can contain cookies, tokens and personal
    data. Remove them before sharing anything.

prerequisites:
  - client-server-request-flow

concepts:
  - id: network-panel-evidence
    name: Network panel evidence
    summary: Record requests across page loads, filter them, read status, headers, payload, response and timing, reproduce them as cURL, simulate slow or offline networks, and export a sanitised HAR.
  - id: console-and-storage
    name: Console and storage
    summary: The Console shows the page's JavaScript errors and warnings; the Application panel shows and edits cookies, local and session storage, and clears site data for a clean start.
  - id: device-emulation-limits
    name: Device emulation and its limits
    summary: Device mode approximates a phone's viewport, touch, user agent, throttling and sensors on a desktop - useful early, but not a replacement for testing on real devices.

objectives:
  - Capture a failing request with Preserve log, filter it, and read its status, headers, payload, response and timing.
  - Reproduce a request outside the browser with Copy as cURL, and share a HAR or a command without leaking secrets.
  - Use the Console and the Application panel to find client-side errors and inspect, edit or clear stored state.
  - Test a responsive page with device mode and throttling, and say what still needs a real device.

sections:
  - id: intuition
    kind: intuition
    concepts: [network-panel-evidence]
    title: The idea in plain language
    body: |
      A web page is like a restaurant where you only see the dining room. When the food is wrong, you can't
      tell whether the waiter wrote the order down wrongly, the kitchen cooked it wrongly, or it was
      dropped on the way.

      DevTools is the **window into the kitchen**. The **Network** panel shows every order slip that went
      to the kitchen and every plate that came back. The **Console** shows the waiter's own mistakes - the
      page's JavaScript errors. The **Application** panel shows what the restaurant remembers about you -
      cookies and stored data.

      With it, "the page is broken" becomes "`POST /api/orders` returned 422 with `quantity must be at
      most 10`, and the page showed no message". That sentence gets fixed.

  - id: what
    kind: what
    concepts: [network-panel-evidence, console-and-storage, device-emulation-limits]
    title: What each part of DevTools is for
    body: |
      Open DevTools with **F12**, or **Ctrl+Shift+I** (Windows, Linux) / **Cmd+Option+I** (Mac), or
      right-click → **Inspect**.

      | Panel or tool | What a tester uses it for |
      |---|---|
      | **Network** | every request: URL, method, status, size, time, initiator; headers, payload, response, timing; throttling and offline; HAR export |
      | **Console** | JavaScript errors and warnings, failed network messages, logs from the page |
      | **Application** | cookies, local storage, session storage, IndexedDB, service workers, **Clear site data** |
      | **Elements** | the live DOM and CSS - hidden elements, disabled buttons, attributes for locators |
      | **Device toolbar** (device mode) | phone and tablet viewports, touch, user agent, throttling, sensors |

      Key facts from the Chrome documentation:

      - DevTools records requests **only while it is open** - open it before you reproduce the problem.
      - By default the Network log and the Console are **cleared on every page load**; tick **Preserve log**
        (Network panel, and in the Console settings) to keep them across navigations and redirects.
      - **Disable cache** makes DevTools disable the browser cache, so you see what a first-time visitor
        downloads.

  - id: why
    kind: why
    concepts: [network-panel-evidence, console-and-storage]
    title: Why testers need it, not only developers
    body: |
      Most defects you see in a browser fall into one of three groups, and DevTools tells you which:

      1. **The server answered wrongly** - wrong status, wrong data, slow response. Evidence: the request
         and response in the Network panel.
      2. **The server answered correctly, the page handled it wrongly** - a 422 with a clear message, but
         the page shows nothing; a JavaScript exception. Evidence: the response **and** the Console error.
      3. **Stored state is wrong** - an old cookie, a stale value in local storage, a cart from yesterday.
         Evidence: the Application panel.

      Knowing the group decides **who** fixes it (back end, front end, or a data migration) and makes your
      report reproducible. It also saves you from false reports: a "missing product" that is just a cached
      old response disappears with **Disable cache**.

  - id: steps
    kind: steps
    concepts: [network-panel-evidence]
    title: Step by step - capture a failing request
    body: |
      1. **Open DevTools first**, then the **Network** panel. Tick **Preserve log** and, for a first-visit
         view, **Disable cache**.
      2. **Clear** the log, then reproduce the problem once.
      3. **Filter** to cut the noise: the **Fetch/XHR** type button for API calls, or type a filter such as
         `status-code:500`, `domain:api.shop.example.com`, or part of the URL. Spaces combine filters (AND);
         the **Invert** checkbox shows everything that does *not* match.
      4. **Find the request** - often red (failed or error status). Check the **Status** and **Initiator**
         columns: the initiator tells you whether the parser, a redirect or a script sent it.
      5. **Click it** and read the tabs: **Headers** (URL, method, status, request and response headers),
         **Payload** (what was sent), **Preview** / **Response** (what came back), **Timing** (where the
         time went).
      6. **Reproduce it outside the browser:** right-click → **Copy** → **Copy as cURL**, paste into a
         terminal, and check you get the same response. Now you can vary one thing at a time.
      7. **Keep the evidence:** a screenshot of the request and response, and if needed a HAR file -
         **Export HAR (sanitized)...**.
      8. **Check the Console** for errors at the same moment - the page's reaction to the response.

  - id: internals
    kind: internals
    concepts: [network-panel-evidence]
    title: Simulating networks, blocking requests, and HAR files
    body: |
      **Throttling and offline.** The throttling drop-down next to **Disable cache** has presets such as
      *Fast 4G*, *Slow 4G* and *3G*, custom profiles, and **Offline**. DevTools shows a warning icon on the
      Network tab while throttling or offline is on - remember to switch it off.

      **Blocking a request.** The **Network request blocking** tab in the DevTools drawer (newer versions:
      the **Request conditions** panel) blocks URLs or patterns you choose. Use it to see how the page
      behaves when one dependency fails - for example block `products.json` on the demo shop and check
      that the catalogue shows its *"Products could not be loaded."* message with **Try again**.

      **HAR files.** HAR (HTTP Archive) is a JSON format for a recording of requests and responses that
      others can import into their own DevTools (**Import HAR**, or drag and drop). Chrome exports a
      **sanitized** HAR by default, which leaves out the `Cookie`, `Set-Cookie` and `Authorization`
      headers. An export **with sensitive data** must be enabled first in **Settings → Preferences →
      Network → Allow to generate HAR with sensitive data**.

      Sanitized does **not** mean safe: request and response **bodies** are still in the file - names,
      emails, addresses, tokens in JSON. Open the file and search it before you attach it anywhere.

      **Copy as cURL** includes headers - often cookies and authorization tokens. Replace them with a
      placeholder before pasting the command into a ticket or chat; a pasted session cookie works for
      anyone who reads it.

  - id: visual
    kind: visual
    concepts: [network-panel-evidence, console-and-storage]
    title: "Flowchart: which panel answers which question"
    body: |
      Start from what you saw, and follow the evidence.

      ```mermaid
      flowchart TD
          A[Something looks wrong in the page] --> B{Was a request sent?}
          B -- No --> C[Console - a script error stopped it?]
          B -- Yes --> D{Status and response as expected?}
          D -- No --> E[Server side - report request, response, timing]
          D -- Yes --> F{Console errors at that moment?}
          F -- Yes --> G[Front end handles the response wrongly]
          F -- No --> H{Stored state involved?}
          H -- Yes --> I[Application panel - cookies and storage]
          H -- No --> J[Elements panel - hidden, disabled or covered element]
      ```

  - id: example
    kind: example
    concepts: [console-and-storage, network-panel-evidence]
    title: "Real-world example: the cart that remembers yesterday"
    body: |
      After a release that renamed a product's SKU, some testers see the cart page crash with a blank area;
      others don't. The Network panel shows nothing unusual - no failed request.

      The **Console** shows `TypeError: Cannot read properties of undefined (reading 'price')`. The
      **Application** panel → **Session storage** shows the cart value (in the demo shop, the
      `sandpay-shop-cart` key) still contains the **old SKU**, saved before the release. The new code looks
      the SKU up, finds nothing, and crashes.

      Testers who started a fresh session had an empty cart, so they never saw it. The reproduction
      becomes precise:

      1. Add the product on the old build (or put the old SKU into the stored cart by editing the value in
         the Application panel).
      2. Open the cart on the new build.

      The report goes to the front-end team with the Console error and the stored value - and the
      question for the product owner: what should happen to carts saved before a catalogue change?
      **Clear site data** (Application → Storage) gives you a clean start afterwards.

  - id: code
    kind: code
    concepts: [network-panel-evidence]
    title: Network filters and a sanitised copy of a request
    collapsed: true
    body: |
      Filters you can type into the Network panel's filter box (combine with spaces):

      ```plaintext
      status-code:500                 only responses with status 500
      domain:api.shop.example.com     only one host (wildcards like *.example.com work)
      method:POST                     only POST requests
      larger-than:100k                big responses
      /api/orders                     any URL containing this text
      ```

      A request copied with **Copy as cURL**, after replacing the secrets (shortened):

      ```bash
      curl 'https://shop.example.com/api/orders' \
        -H 'accept: application/json' \
        -H 'content-type: application/json' \
        -H 'cookie: session=<REDACTED>' \
        -H 'authorization: Bearer <REDACTED>' \
        --data-raw '{"items":[{"sku":"ceramic-mug","quantity":11}]}'
      ```

      Now change one thing - `quantity` 10 instead of 11 - and compare the responses. That isolates the
      boundary without clicking through the page again.

  - id: when
    kind: when
    concepts: [device-emulation-limits]
    title: Device mode - and when you need a real device
    body: |
      **Toggle device toolbar** (the phone-and-tablet icon at the top of DevTools) switches the page into
      device mode. It can emulate:

      - **viewports** - preset devices or any size, rotation, device pixel ratio, foldable postures, zoom;
      - **touch** - with the *Mobile* device type, the page receives touch events instead of clicks;
      - **user agent** - set per custom device;
      - **throttling** - presets such as *Mid-tier mobile* (fast 3G network, 4× slower CPU) and *Low-end
        mobile* (slow 3G, 6× slower CPU);
      - **sensors** - geolocation and device orientation.

      Chrome's own documentation calls device mode a **"first-order approximation"**: the code still runs
      on your desktop, so things like the **CPU architecture** can't be simulated. It does not give you the
      phone's real browser engine (Safari on iOS is WebKit, not Chrome's engine), its fonts, its keyboard
      covering the form, the notch, the battery saver, or the real network.

      | Use device mode for | Use a real device for |
      |---|---|
      | layout at many widths, quickly | final sign-off of mobile journeys |
      | finding breakpoints and overflowing elements | iOS Safari behaviour |
      | a first look at slow networks | real network changes, background and foreground |
      | geolocation and orientation checks | keyboards, autofill, camera, payments sheets, performance |

      For a real Android device, connect it with USB debugging and use **remote debugging** from desktop
      Chrome to get full DevTools on the phone's page; for iOS, Safari's Web Inspector does the same.

  - id: tests
    kind: tests
    concepts: [network-panel-evidence, device-emulation-limits, console-and-storage]
    title: Positive and negative checks on the demo shop
    body: |
      Try these on the [SandPay Demo Shop](shop/index.html):

      | ID | DevTools set-up | Action | Expected | Evidence |
      |---|---|---|---|---|
      | D1 | Network, Fetch/XHR filter | open the catalogue | `products.json` returns 200, the list renders | the request and its response |
      | D2 | block `products.json` | open the catalogue | "Products could not be loaded." with **Try again** | screenshot, blocked request in the log |
      | D3 | unblock, then **Try again** | click Try again | products appear without reloading the page | new `products.json` request |
      | D4 | throttling *3G* | add a product | the loading state and toast still behave, no double add on repeated clicks | recording, cart count |
      | D5 | Application → Session storage | add two products | `sandpay-shop-cart` holds both lines with quantities | screenshot of the value |
      | D6 | device mode, 360 px wide | checkout page | no horizontal scrolling, Pay button reachable | screenshot |
      | D7 | Console open | full checkout with `sandpay-success` | no errors in the Console | Console screenshot |

      D2 and D3 test the **error and recovery path** that real users only see on a bad day - and that
      automated suites often forget.

  - id: mistakes
    kind: mistakes
    concepts: [network-panel-evidence, console-and-storage, device-emulation-limits]
    title: Common mistakes and how to avoid them
    body: |
      - **Opening DevTools after the failure.** Nothing was recorded. Open it first, then reproduce.
      - **Losing the request on a redirect.** Tick **Preserve log**.
      - **Testing with a warm cache.** Your page looks fine; a first-time visitor's doesn't. Use **Disable
        cache** or a fresh profile.
      - **Forgetting throttling is on.** The next hour of "slow" results is your own setting - look for the
        warning icon.
      - **Sharing secrets.** HAR files, copied cURL commands and screenshots of headers carry cookies and
        tokens. Use the sanitized HAR, redact copies, and check bodies for personal data.
      - **Calling device mode "tested on mobile".** It is an approximation; say "tested in Chrome device
        mode at 390 px" in the report.
      - **Editing storage and forgetting it.** Clear site data after experiments, or you'll report defects
        you caused yourself.
      - **Ignoring warnings.** Mixed content, deprecations and CORS messages in the Console often explain a
        failure that only appears in some browsers.

  - id: summary
    kind: summary
    title: Summary and quick reference
    body: |
      - Open DevTools **before** reproducing; **Preserve log**; **Disable cache** for a first visit.
      - Network: filter (`status-code:`, `domain:`, `method:`, Fetch/XHR, **Invert**), then **Headers,
        Payload, Response, Timing**, and the **Initiator**.
      - **Copy as cURL** to reproduce and vary a request - redact cookies and tokens.
      - **Export HAR (sanitized)** leaves out Cookie, Set-Cookie and Authorization - bodies are still
        inside.
      - Throttling presets and **Offline**; **Network request blocking** to break one dependency.
      - Console = page errors; Application = cookies, storage, **Clear site data**.
      - Device mode is a **first-order approximation** - sign off on real devices, debug them remotely.

exercises:
  - id: lost-after-redirect
    type: mcq
    concept: network-panel-evidence
    skill: application
    title: The request disappears
    prompt: |
      After you press **Pay**, the page redirects to the order page. When you look at the Network panel,
      the payment request is gone - only the order page's requests are listed. What do you change?
    options:
      - id: preserve
        text: Tick Preserve log and reproduce again.
        feedback: Correct - by default the log is cleared on every page load. Preserve log keeps the requests across navigations and redirects.
      - id: disable-cache
        text: Tick Disable cache and reproduce again.
        feedback: Disabling the cache changes what is downloaded, but the log is still cleared on the redirect.
      - id: throttle
        text: Throttle the network so the request takes longer.
        feedback: The request isn't too fast to see - the log is cleared when the next page loads.
      - id: console
        text: Look for the request in the Console instead.
        feedback: The Console is also cleared on navigation by default, and it lists messages, not the full request and response.
    correct: [preserve]
    hints:
      - What happens to the Network log when a new page loads?
    solution: |
      **Preserve log.** Then you will see the payment request, the redirect and the order page's requests
      in one list - and you can read the payment request's status and response.
    followUp: |
      The Console error you want also disappears on the redirect. Which setting keeps it?

  - id: share-har-safely
    type: mcq
    concept: network-panel-evidence
    skill: application
    title: Sharing a HAR with the vendor
    prompt: |
      A third-party widget fails on your checkout and the vendor asks for a HAR file. You export it with
      **Export HAR (sanitized)...**. What is still true before you send it?
    options:
      - id: safe
        text: It is safe to send - sanitized means all sensitive data is removed.
        feedback: The sanitized export leaves out the Cookie, Set-Cookie and Authorization headers, but request and response bodies stay in the file.
      - id: check-bodies
        text: Cookies and Authorization headers are left out, but you should still check the bodies and URLs for personal data or tokens.
        feedback: Correct - the sanitized HAR removes specific headers only. Personal data in JSON bodies or tokens in URLs are still there.
      - id: never
        text: HAR files can never be shared outside the company.
        feedback: Sharing a HAR with a vendor is often reasonable and sometimes necessary - once it has been checked and the data is minimised.
      - id: with-sensitive
        text: Export it with sensitive data instead, so the vendor can reproduce the session.
        feedback: That would include cookies and authorization headers - a working session for whoever receives the file.
    correct: [check-bodies]
    hints:
      - Which parts of a request can carry personal data besides headers?
    solution: |
      **Check the bodies and URLs.** Chrome's sanitized HAR leaves out the `Cookie`, `Set-Cookie` and
      `Authorization` headers. Order requests can still contain names, emails and addresses in the JSON,
      and some sites put tokens in URLs. Search the file, record only the failing flow with a test
      account, and share only what is needed.
    followUp: |
      Which test data would you use for the recording so the HAR has nothing personal in it at all?

  - id: debug-copied-request
    type: debug
    concept: network-panel-evidence
    skill: analysis
    title: Before you paste it in the ticket
    prompt: |
      You copied this request with **Copy as cURL** to attach to a defect report. Click **every** line
      you must redact first.
    language: bash
    code: |
      curl 'https://shop.example.com/api/orders' \
        -H 'accept: application/json' \
        -H 'content-type: application/json' \
        -H 'cookie: session=s%3A9f2c41d7e8b0a3; theme=dark' \
        -H 'authorization: Bearer eyJhbGciOiJIUzI1NiJ9.e30.Q1w2E3r4' \
        -H 'user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)' \
        --data-raw '{"items":[{"sku":"ceramic-mug","quantity":11}]}'
    correctLines: [4, 5]
    lineNotes:
      - line: 6
        note: The user agent says which browser and OS sent the request - useful in a report and not secret.
      - line: 7
        note: The body has a product and a quantity - test data that the developer needs to reproduce it. Check bodies for personal data, but this one has none.
    hints:
      - Which lines would let someone act as you on the site?
      - There are two - one is a cookie, one a token.
    solution: |
      **Lines 4 and 5.** The `session` cookie and the bearer token both authenticate the request -
      anyone with them can act as the logged-in user until they expire. Replace them with
      `<REDACTED>`; the developer has their own session. Keep the URL, the content type, the user agent
      and the body - they are what reproduce the defect.
    followUp: |
      The token was already pasted into a team chat an hour ago. What should happen now?

  - id: order-intermittent-capture
    type: order
    concept: network-panel-evidence
    skill: application
    title: Capturing an intermittent checkout failure
    prompt: The checkout fails roughly one time in five. Put the steps for capturing evidence in order.
    items:
      - id: open
        text: Open DevTools on the Network panel before starting
      - id: preserve
        text: Tick Preserve log (Network and Console) and clear the log
      - id: repeat
        text: Repeat the checkout until it fails, noting the time of each attempt
      - id: find
        text: Find the failing request with a filter and compare it with a successful one
      - id: copy
        text: Copy both as cURL and replay them to see whether the difference reproduces
      - id: export
        text: Export a sanitized HAR and screenshots, and check them for personal data
    hints:
      - The comparison between a good and a bad attempt is the most valuable evidence.
      - Exporting and checking comes last, when you know what you have.
    solution: |
      Open → Preserve log → repeat with timestamps → compare failing and successful requests → replay →
      export and check. For intermittent failures, **the difference between a good and a bad request**
      (headers, payload, timing, which server answered) is usually the clue.

  - id: stale-storage
    type: mcq
    concept: console-and-storage
    skill: application
    title: Only some testers see it
    prompt: |
      After a release, the cart page is blank for some testers. The Console shows `TypeError: Cannot read
      properties of undefined (reading 'price')`. No request fails. Testers who use a new private window
      never see it. What do you check next?
    options:
      - id: storage
        text: The stored cart in the Application panel (cookies, local or session storage) - it may contain data saved by the old version.
        feedback: Correct - a fresh private window starts with empty storage and doesn't fail, which points at stored state from before the release.
      - id: server
        text: The server logs for 500 errors.
        feedback: No request fails, so the server is answering correctly. The error is in the page's script.
      - id: device-mode
        text: Device mode, because it might be a mobile layout problem.
        feedback: The difference is between normal and private windows, not between screen sizes.
      - id: throttle
        text: Throttle the network to see if it is a timing problem.
        feedback: A timing issue wouldn't depend on private windows. Stored state does.
    correct: [storage]
    hints:
      - What does a new private window not have that a normal one does?
    solution: |
      **Stored state.** Inspect the cart's stored value in the Application panel, compare it with what the
      new version expects, and reproduce on purpose by putting the old value back. Then **Clear site
      data** for a clean start.
    followUp: |
      Write the steps to reproduce for this defect so that a developer with a clean browser can see it.

  - id: device-mode-plan
    type: testdesign
    concept: device-emulation-limits
    skill: application
    title: What device mode can and can't sign off
    prompt: |
      You must test the demo shop's checkout for mobile web before a release. You have desktop Chrome, one
      Android phone and one iPhone for an hour. Write a plan: which checks you do in **device mode**, which
      on the **real devices**, and why. Include at least six checks with the evidence for each.
    hints:
      - Use device mode for breadth (many widths), real devices for depth (real engine, keyboard, network).
      - Which browser engine runs on the iPhone?
      - What can a real network do that throttling can't?
    modelAnswer: |
      **Device mode (desktop Chrome):**

      1. Checkout at 320, 360, 390 and 430 px wide and in landscape - no horizontal scroll, Pay button
         visible. Evidence: screenshots per width.
      2. *Low-end mobile* throttling - loading states shown, no double submit on repeated taps. Evidence:
         recording, Network log.
      3. Offline at Pay - clear message, no order created. Evidence: screenshot, no request.

      **Real devices:**

      4. iPhone Safari full checkout - Safari's engine (WebKit) behaves differently from Chrome's. Evidence:
         screenshots, Web Inspector console.
      5. Android Chrome with the on-screen keyboard - email field not hidden by the keyboard, correct
         keyboard type for email. Evidence: screenshot.
      6. Card iframe on both phones - typing, autofill, focus. Evidence: recording.
      7. Switch from Wi-Fi to mobile data during the PENDING order page - status still updates. Evidence:
         recording.

      In the report, label which results come from device mode and which from real devices.
    rubric:
      - Used device mode for widths, layout and breakpoints
      - Used throttling or offline for network conditions in device mode
      - Moved iOS Safari checks to the real iPhone, naming the different engine
      - Included at least one check only a real device shows (keyboard, autofill, real network, iframe input)
      - Gave evidence for every check
      - Labelled results by where they were tested
    solution: |
      Compare with the model answer. The key judgement is **why** each check goes where it does - device
      mode is quick and broad but approximate; real devices are slow but tell the truth about engines,
      keyboards and networks.
    followUp: |
      A defect appears only on the real iPhone. How would you get a Console log from it?

  - id: interview-blank-page
    type: interview
    concept: console-and-storage
    skill: application
    title: "Interview: the page is blank"
    prompt: |
      *"A user reports that a page is completely blank. You can reproduce it. How do you use the browser's
      developer tools to find out why?"* Answer as you would in the interview.
    hints:
      - Go panel by panel, and say what each one could prove.
      - How do you rule out your own cache and storage?
    modelAnswer: |
      I'd open DevTools first, tick Preserve log and Disable cache, and reload.

      **Console:** a blank page is very often a JavaScript error that stopped the app from rendering, so I
      look for red errors and their source file and line.

      **Network:** did the HTML and the main scripts load, with 200s? A 404 for a script after a
      deployment (an old HTML page asking for files that no longer exist), a blocked request, or an API call
      that failed and wasn't handled would all explain it. I'd check the responses, not just the
      statuses.

      **Application:** if it only happens for some users, stored state - a cookie or local storage value
      from an older version - is a suspect. I'd compare with a private window, then clear site data.

      **Elements:** maybe the content is there but hidden - an overlay or a CSS problem.

      Then I'd copy the failing request as cURL to confirm the server side independently, and report the
      Console error, the failing request and the steps, with secrets removed.
    rubric:
      - Opened DevTools before reproducing, with Preserve log and cache disabled
      - Checked the Console for script errors
      - Checked the Network panel for failed or missing resources and API calls
      - Considered stored state and compared with a clean profile
      - Considered content present but hidden (Elements)
      - Described the evidence to report, with secrets removed
    followUps:
      - The Console shows nothing and every request is 200. What next?
      - It only happens on iPhones. How do you debug it?
      - How would you make sure this kind of failure is caught before release?
    solution: |
      A structured answer - **Console, Network, Application, Elements**, each with what it could prove -
      is what the interviewer is listening for.

  - id: explain-device-mode
    type: short
    concept: device-emulation-limits
    skill: recall
    title: Why device mode isn't mobile testing
    prompt: In two or three sentences, explain why passing in Chrome's device mode doesn't prove a page works on phones.
    hints:
      - Where does the code actually run in device mode?
    modelAnswer: |
      Device mode only approximates a phone on the desktop - the page still runs in desktop Chrome, on the
      desktop's CPU, with a simulated viewport, touch and network. It can't reproduce other browser engines
      such as Safari on iOS, real keyboards, real networks or hardware, so real devices are still needed
      for sign-off.
    rubric:
      - Said the page still runs on the desktop in desktop Chrome
      - Named at least one thing device mode can't reproduce (iOS Safari's engine, keyboard, CPU, real network)
      - Concluded that real devices are needed for sign-off
    solution: |
      Chrome's documentation calls device mode a "first-order approximation" and points to remote debugging
      on real devices for accurate testing.

placement:
  - id: place-network
    type: mcq
    concept: network-panel-evidence
    skill: application
    title: See it like a first-time visitor
    prompt: |
      A customer says the new banner image is missing. You see it fine. Which Network panel setting helps you
      see what a first-time visitor downloads?
    options:
      - id: disable-cache
        text: Disable cache
        feedback: Correct - DevTools disables the browser cache, so every file is downloaded again as for a new visitor.
      - id: preserve
        text: Preserve log
        feedback: Preserve log keeps requests across page loads; it doesn't change what is served from the cache.
      - id: offline
        text: Offline
        feedback: Offline simulates having no network at all - the banner would certainly be missing, which proves nothing.
      - id: har
        text: Import HAR
        feedback: Importing a HAR shows someone else's recorded requests; it doesn't change how your browser loads the page.
    correct: [disable-cache]
    solution: |
      **Disable cache.** Your browser probably has the image cached from before. With the cache disabled you
      may see that the new image URL returns 404 for everyone.

  - id: place-storage
    type: mcq
    concept: console-and-storage
    skill: application
    title: Start from a clean state
    prompt: You've been experimenting with cookies and stored values on a site and want to start a test from a completely clean state for that site. What do you use?
    options:
      - id: clear-site-data
        text: Application panel → Storage → Clear site data
        feedback: Correct - it clears the site's storage, such as cookies, local and session storage, IndexedDB and the cache storage, in one step.
      - id: disable-cache
        text: Network panel → Disable cache
        feedback: That only affects the HTTP cache while DevTools is open - cookies and stored values stay.
      - id: console-clear
        text: Console → Clear console
        feedback: That clears the messages shown in the Console, not the site's data.
      - id: reload
        text: A normal page reload
        feedback: A reload keeps cookies and storage - that is their purpose.
    correct: [clear-site-data]
    solution: |
      **Clear site data.** A new private window also starts clean - useful to compare against your
      current state.

  - id: place-device
    type: mcq
    concept: device-emulation-limits
    skill: analysis
    title: Where the test belongs
    prompt: Which check **cannot** be trusted from Chrome's device mode alone?
    options:
      - id: ios-safari
        text: The checkout works in Safari on an iPhone
        feedback: Correct - device mode runs the page in desktop Chrome; Safari on iOS uses a different engine (WebKit) and must be tested on a real device or a simulator.
      - id: widths
        text: The layout has no horizontal scrolling at 360 px wide
        feedback: Viewport sizes are exactly what device mode emulates well.
      - id: touch
        text: The page reacts to touch events
        feedback: With the Mobile device type, device mode makes the page receive touch events, so it is a reasonable first check.
      - id: geo
        text: The store finder uses a simulated location in Berlin
        feedback: Device mode can override geolocation with presets or custom coordinates.
    correct: [ios-safari]
    solution: |
      **iPhone Safari.** Device mode emulates a viewport, touch, user agent, throttling and sensors - but not
      another browser engine, the real keyboard or the real hardware.

recall:
  - id: recall-before
    concept: network-panel-evidence
    prompt: Why must you open DevTools before reproducing a problem?
    answer: DevTools records network requests only while it is open, so requests made before opening it are not shown.
  - id: recall-preserve
    concept: network-panel-evidence
    prompt: What does Preserve log do in the Network panel?
    answer: It keeps the recorded requests across page loads and redirects instead of clearing the log on each navigation.
  - id: recall-har
    concept: network-panel-evidence
    prompt: What does Chrome's sanitized HAR export leave out, and what does it keep?
    answer: It leaves out the Cookie, Set-Cookie and Authorization headers. Bodies and URLs stay, so check them for personal data and tokens.
  - id: recall-curl
    concept: network-panel-evidence
    prompt: Why copy a request as cURL, and what must you do before sharing it?
    answer: To replay and vary the request outside the browser. Redact cookies and authorization tokens first.
  - id: recall-console
    concept: console-and-storage
    prompt: Which DevTools panel shows cookies, local storage and session storage?
    answer: The Application panel - it can also delete entries and clear all site data.
  - id: recall-device
    concept: device-emulation-limits
    prompt: What does Chrome's documentation call device mode, and why?
    answer: A first-order approximation - the page still runs on the desktop, so things like CPU architecture and other browser engines are not simulated.

