id: interruptions-and-lifecycle
title: Interruptions and the app lifecycle
subject: mobile-testing
module: mobile-fundamentals
level: intermediate
status: published
estimatedMinutes: 45
summary: Calls, notifications, app switching, rotation, permission dialogs, network changes and the operating system reclaiming memory - how each moves an app through its lifecycle on Android and iOS, what state must survive, and a repeatable technique for interruption testing.
tags: [mobile, android, ios, interruptions, lifecycle, background, foreground, state restoration, rotation, notifications, network]

environment: |
  - **Platform documentation:** Android - [The activity lifecycle](https://developer.android.com/guide/components/activities/activity-lifecycle)
    ("the system kills processes when it needs to free up RAM"; configuration changes destroy and recreate the activity by
    default) and [Save UI states](https://developer.android.com/topic/libraries/architecture/saving-states); iOS -
    [Managing your app's life cycle](https://developer.apple.com/documentation/uikit/managing-your-app-s-life-cycle) (scene
    states foreground active and inactive, background, suspended; suspended apps can be terminated to free memory). Apple's pages
    render with JavaScript - read them in a browser.
  - **Platform- and version-specific:** background execution limits, battery optimisation and permission dialogs differ by OS
    version and, on Android, by manufacturer. Details in [Android lifecycle and process death](#/lesson/android-lifecycle-and-process-death)
    and [iOS lifecycle and links](#/lesson/ios-lifecycle-and-links).
  - **Fictional:** the SandPay Demo Shop app.

prerequisites:
  - mobile-test-planning

concepts:
  - id: mobile-interruption-types
    name: Kinds of interruption
    summary: Interruptions move the app between foreground, background and back - calls, notifications, app switches, system dialogs, rotation, network and power changes, and the OS terminating a background app.
  - id: state-preservation
    name: What state must survive
    summary: Screen position, form input, in-progress operations and their outcomes must survive each interruption at the level the platform allows - rotation, backgrounding and process death need different mechanisms.
  - id: interruption-test-technique
    name: Interruption testing technique
    summary: For each screen and step of a journey, apply each interruption at the riskiest moment - mid-input, mid-request, mid-transition - and check state, data and server-side effects afterwards.

objectives:
  - Name the common interruptions and the lifecycle transitions they cause on Android and iOS.
  - Decide which state must survive each interruption and how the app should behave on return.
  - Apply interruptions systematically at the riskiest moments of a journey.
  - Report interruption defects with exact steps, timing and evidence.

sections:
  - id: intuition
    kind: intuition
    concepts: [mobile-interruption-types]
    title: The idea in plain language
    body: |
      You are filling in a long form at a counter when the phone rings. You step away, take the call, come back - and the clerk has
      **thrown your form away**, or kept it but **forgotten you'd already paid**. That's what a badly handled interruption feels like.

      A phone app is interrupted all the time: calls, messages, the user checking another app, the screen rotating, the battery
      saver kicking in, the train going into a tunnel. Worse, when an app is out of sight, the operating system may **quietly end it**
      to free memory - and recreate it when the user comes back, as if nothing happened.

      Interruption testing makes sure that after every interruption, the user is **back where they were, with what they'd entered,
      and with the true result** of anything that was in progress.

  - id: what
    kind: what
    concepts: [mobile-interruption-types]
    title: What interrupts an app - and what happens to it
    body: |
      | Interruption | Android (activity) | iOS (scene) | Typical risk |
      |---|---|---|---|
      | Notification shade or Control Center pulled down | may pause (`onPause`) | foreground **inactive** | timers and animations; usually little |
      | Incoming call, alarm, system dialog | paused or stopped | inactive, then background if answered | media, video calls, timing-sensitive steps |
      | User switches to another app (banking app, email for an OTP) | stopped (`onStop`), stays in memory for a while | **background**, then **suspended** | state lost if killed; in-flight requests |
      | Screen lock | stopped | background | sessions, timers |
      | Rotation, dark mode change, language change, window resize | **activity destroyed and recreated** by default (configuration change) | the view adapts; the scene stays | form input lost on Android |
      | OS reclaims memory while in background | **process killed**, later recreated | suspended app **terminated** | everything in memory lost |
      | Network change (Wi-Fi ↔ cellular, airplane mode) | no lifecycle change | no lifecycle change | requests fail or hang |
      | Low battery / battery saver | background limits tighten | Low Power Mode reduces background activity | background work delayed or stopped |
      | Permission dialog | the app is partly covered | inactive | flows blocked or restarted |

      The Android documentation is explicit: "The system never kills an activity directly to free up memory. Instead, it kills the
      process the activity runs in" - and a stopped app in the background is more likely to be killed than one in the foreground.

  - id: why
    kind: why
    concepts: [state-preservation]
    title: Why interruptions cause expensive defects
    body: |
      - **Users lose work.** A long form wiped by a rotation or a phone call is the most common one-star review topic for forms.
      - **Payments lose their outcome.** The app switches to a banking or UPI app; the OS kills the shop app; on return it starts fresh
        and never shows whether the payment worked - so the customer pays again (see
        [mobile payment interruptions](#/lesson/mobile-payment-interruptions)).
      - **Duplicate actions.** On return, a screen re-submits a request it had already sent.
      - **Wrong data.** An app restored after process death shows cached data from before - a stale balance, an old order status.
      - **Most test runs never trigger it.** A tester working through a journey on a powerful phone rarely gets interrupted - the defects
        reach users first unless interruptions are applied **on purpose**.

  - id: internals
    kind: internals
    concepts: [state-preservation]
    title: What state survives what
    body: |
      Different interruptions destroy different amounts. Android's documentation compares where state can live:

      | Kept in | Survives configuration change | Survives system-initiated process death | Survives the user closing the screen (Back, swipe away) |
      |---|---|---|---|
      | ViewModel (memory) | yes | **no** | no |
      | Saved instance state (`SavedStateHandle`, `rememberSaveable`) | yes | **yes** | no |
      | Persistent storage (database, files, server) | yes | yes | yes |

      On iOS, an app that is suspended and then terminated loses everything in memory; apps save what they need when entering the
      background and use state restoration to rebuild the UI.

      For a tester this gives a clear question per piece of state: **what should survive?**

      | State | Should survive rotation | Should survive process death | Where it should live |
      |---|---|---|---|
      | Text typed into a form | yes | yes | saved instance state |
      | Scroll position, selected tab | yes | yes | saved instance state |
      | "Payment in progress for order ORD-1042" | yes | **yes** | persistent storage or server - and re-checked on return |
      | Large lists of products | yes | reload is fine | ViewModel + reload from the server |
      | Signed-in session | yes | yes, within its expiry | secure storage (Keystore / Keychain) |

  - id: visual
    kind: visual
    concepts: [mobile-interruption-types, state-preservation]
    title: "State diagram: an app's journey through an interruption"
    body: |
      A simplified, cross-platform view. The dangerous path is the one through **killed**.

      ```mermaid
      stateDiagram-v2
          [*] --> Foreground: launch
          Foreground --> Inactive: call, notification shade, system dialog
          Inactive --> Foreground: dismissed
          Inactive --> Background: user leaves the app
          Foreground --> Background: home, app switch, screen lock
          Background --> Foreground: user returns - app still in memory
          Background --> Killed: OS reclaims memory
          Killed --> Restored: user returns - app recreated from saved state
          Restored --> Foreground: state restored and re-checked
      ```

  - id: steps
    kind: steps
    concepts: [interruption-test-technique]
    title: Step by step - an interruption test session
    body: |
      1. **Pick a journey** - for example: product → cart → address → payment → result.
      2. **List the risky moments** in it: typing in a form, a request in flight (spinner), a transition between screens, waiting for an
         external app (OTP, banking app), the result screen.
      3. **Pick the interruptions**: notification, call (or a timer alarm), app switch for 10 seconds and for 10 minutes, screen lock,
         rotation, dark-mode switch, airplane mode on and off, Wi-Fi to cellular, and **process death** while in the background.
      4. **Apply each interruption at each risky moment** - a grid; prioritise the payment steps.
      5. **On return, check**: the screen, the entered data, the in-progress operation's **true** outcome, and the server side (one order,
         one payment).
      6. **Capture evidence**: screen recording, device logs with timestamps (`adb logcat` on Android, Console app or Xcode on iOS),
         and the server-side records.
      7. **Repeat on a low-memory device** - process death happens there naturally.

  - id: example
    kind: example
    concepts: [interruption-test-technique, state-preservation]
    title: "Real-world example: the address form and the OTP"
    body: |
      The demo shop app asks new users for an address, then sends a one-time code by SMS to verify the phone number. Users report:
      "I went to my messages to copy the code and when I came back the form was empty."

      The tester's grid:

      | Moment | Interruption | Result |
      |---|---|---|
      | address half typed | rotation | **form empty** (Android) |
      | address half typed | switch to Messages for 5 s | fine |
      | address half typed | switch to Messages, OS kills the app (simulated) | **form empty, back on home screen** |
      | code requested | switch to Messages for 2 minutes on a low-memory phone | **back on home screen**; a second code is sent on retry |

      Two defects: form input lived only in memory (lost on rotation and process death), and the "code requested" step wasn't saved, so
      the app restarted the flow and sent another code. Fixes: keep form fields in saved state; persist the verification step; on Android,
      also offer the platform's SMS code autofill so the user doesn't need to leave the app. Regression tests: rotation and simulated process
      death at both moments.

  - id: tests
    kind: tests
    concepts: [interruption-test-technique, mobile-interruption-types]
    title: An interruption grid for checkout
    body: |
      | Step | Notification | Call / alarm | App switch 10 s | App switch 10 min | Rotation | Network off/on | Process death |
      |---|---|---|---|---|---|---|---|
      | Cart | items kept | items kept | items kept | items kept | items kept | message, retry | items kept (server cart) |
      | Address form (typing) | input kept | input kept | input kept | input kept | **input kept** | input kept | **input kept** |
      | Pay pressed, request in flight | one payment | one payment | one payment, result shown | true result shown | one payment | outcome checked, no duplicate | **true result shown on restore** |
      | Waiting for bank app | - | - | returns to the right screen | result or pending shown | - | resolved on reconnect | **result or pending shown** |
      | Result screen | unchanged | unchanged | unchanged | refreshed status | unchanged | unchanged | order shown from the server |

      Each cell is a test; the expected result is written in it. Cells in bold are the ones most often failing.

  - id: mistakes
    kind: mistakes
    concepts: [interruption-test-technique, state-preservation]
    title: Common mistakes and how to avoid them
    body: |
      - **Interrupting only at calm moments.** Interrupt mid-typing and mid-request.
      - **Only short interruptions.** A 5-second switch rarely kills the app; also test long ones and simulated process death.
      - **Testing on a flagship phone only.** Low-memory devices kill background apps quickly - use one.
      - **Checking only the screen.** Count orders and payments on the server after every interruption.
      - **Treating rotation as cosmetic.** On Android it destroys and recreates the screen by default - a functional test.
      - **Vague reports.** Give the step, the exact interruption, its duration and timing, the device and OS, and a recording.

  - id: summary
    kind: summary
    title: Summary and quick reference
    body: |
      - Interruptions: **notification, call, app switch, lock, rotation and other configuration changes, network change, battery saver,
        permission dialog, process death**.
      - Android: configuration changes recreate the activity; the OS kills **processes**, not activities, to free memory. iOS: suspended
        apps can be terminated.
      - State: **ViewModel** survives rotation, not process death; **saved state** survives both; **persistent/server** survives all.
      - Technique: journey × risky moments × interruptions; check screen, data, true outcome and server side; use a low-memory device.

exercises:
  - id: what-survives
    type: mcq
    concept: state-preservation
    skill: application
    title: Where should the form input live?
    prompt: On Android, the user's half-typed address must survive both rotation and the system killing the app in the background. Where should the app keep it?
    options:
      - id: saved-state
        text: In saved instance state (for example SavedStateHandle or rememberSaveable)
        feedback: Correct - Android's documentation lists saved state as surviving configuration changes and system-initiated process death.
      - id: viewmodel
        text: Only in a ViewModel
        feedback: A ViewModel survives rotation but not process death.
      - id: local-variable
        text: In a variable in the activity
        feedback: The activity is destroyed on rotation - its fields are lost.
      - id: server
        text: Send every keystroke to the server
        feedback: It would survive, but it is far heavier than needed for transient form input.
    correct: [saved-state]
    hints:
      - Look at the table - which row survives both columns?
    solution: |
      **Saved instance state.** Test both: rotate while typing; and simulate process death while in the background (see the Android
      lesson for how).
    followUp: |
      Where should "payment in progress for order ORD-1042" live, and why is saved state not enough for it?

  - id: kill-what
    type: mcq
    concept: mobile-interruption-types
    skill: recognition
    title: What does Android kill?
    prompt: According to Android's documentation, when the system needs memory, what does it kill?
    options:
      - id: process
        text: The whole process the activity runs in
        feedback: Correct - "The system never kills an activity directly to free up memory. Instead, it kills the process."
      - id: activity
        text: Individual activities, starting with the oldest
        feedback: The documentation says it never kills an activity directly for memory.
      - id: nothing
        text: Nothing - Android never kills apps the user hasn't closed
        feedback: It kills background processes when it needs RAM; stopped apps are likelier to be killed.
      - id: foreground
        text: The foreground app first
        feedback: Foreground processes have the lowest likelihood of being killed.
    correct: [process]
    hints:
      - Read the quotation in the "What" section.
    solution: |
      **The process.** Everything in memory goes - activities, ViewModels, singletons - which is why saved and persistent state matter.
    followUp: |
      Which process state has the highest likelihood of being killed, according to the same page?

  - id: dark-mode-switch
    type: mcq
    concept: mobile-interruption-types
    skill: application
    title: The form cleared by dark mode
    prompt: |
      On Android, a user switches the phone to dark mode from the quick settings while typing an address in the app. The form is
      empty afterwards. Which interruption type explains it, and what should the test plan add?
    options:
      - id: config-change
        text: A configuration change recreated the activity - add dark-mode, rotation and language changes to the interruption grid
        feedback: Correct - like rotation, a UI mode change is a configuration change that destroys and recreates the activity by default.
      - id: process-death
        text: The OS killed the process to free memory
        feedback: The app never went to the background; the change happened while it was in the foreground.
      - id: network
        text: The network changed
        feedback: Network changes don't recreate screens; they make requests fail.
      - id: notification
        text: A notification interrupted the app
        feedback: The quick settings panel makes the app briefly inactive, but the loss comes from the mode change.
    correct: [config-change]
    hints:
      - What else besides rotation counts as a configuration change on Android?
    solution: |
      **A configuration change.** Test every configuration change the app supports - rotation, dark mode, language, font scale,
      window size - while input is on screen.
    followUp: |
      Which of these configuration changes can you trigger from adb or the emulator without touching the device?

  - id: debug-report
    type: debug
    concept: interruption-test-technique
    skill: analysis
    title: The interruption report that can't be reproduced
    prompt: Click the line that makes this defect report impossible to reproduce reliably.
    language: plaintext
    code: |
      Title: Checkout form cleared after leaving the app (Android)
      Device: Samsung mid-range phone, Android 14, app 5.4.0 (build 5402)
      Steps: 1. Open checkout  2. Type a name and street  3. Leave the app for a while  4. Return
      Expected: typed name and street still there
      Actual: form empty, app back on the home screen
      Evidence: screen recording, logcat excerpt with timestamps
    correctLines: [3]
    lineNotes:
      - line: 2
        note: Device, OS and app build are exactly what is needed.
      - line: 6
        note: A recording and timestamped logs are strong evidence.
    hints:
      - Which step is vague about the interruption itself?
    solution: |
      **Line 3.** "Leave the app for a while" doesn't say how or how long. Five seconds on the home screen won't kill the app; ten
      minutes in the camera app on that phone might. State the exact interruption and duration - or the simulated process death you used -
      so anyone can reproduce it.
    followUp: |
      Rewrite step 3 using a reliable way to simulate process death on Android.

  - id: grid-design
    type: testdesign
    concept: interruption-test-technique
    skill: application
    title: Build the interruption grid for sign-up
    prompt: |
      The app's sign-up has three steps: (1) enter email and password, (2) enter a code sent by email, (3) accept terms and finish.
      Build an interruption test grid: risky moments, at least six interruptions, the expected result for each cell that matters, and
      what you check on the server.
    hints:
      - Step 2 makes the user leave the app - which interruptions follow from that?
      - Which moments have a request in flight?
    modelAnswer: |
      Risky moments: typing email/password; "send code" request in flight; waiting for the code (user in the email app); typing the
      code; "finish" request in flight.

      Interruptions: notification; app switch 10 s; app switch 10 min; rotation; network off/on; simulated process death.

      Expected (key cells):
      - Typing (step 1) × rotation / process death → input kept (password may be cleared by design - then say so).
      - "Send code" in flight × network off → error with retry; one code sent per tap.
      - Waiting for code × app switch 10 min / process death → app returns to the code screen for the same email; no new code sent
        automatically; "resend" available.
      - Typing the code × rotation → code input kept.
      - "Finish" in flight × process death → on return, account exists and the user is signed in or asked to sign in; never a second
        account.

      Server checks: one account per email; number of codes sent per flow; no half-created accounts after interrupted finishes.
    rubric:
      - Identified moments with requests in flight and the external email step
      - Used at least six different interruptions including process death
      - Wrote expected results per important cell
      - Covered no duplicate codes or accounts
      - Checked server-side state, not only the screen
      - Stated a design decision where behaviour is a choice (for example the password field)
    solution: |
      Compare with the model answer. The **wait-for-code × process death** cell is the classic failure - the flow restarts and the old
      code becomes useless.
    followUp: |
      Which cells would you automate, and which need a real device?

  - id: order-session
    type: order
    concept: interruption-test-technique
    skill: recall
    title: Running an interruption session
    prompt: Put the steps of an interruption test session in order.
    items:
      - id: journey
        text: Pick a journey
      - id: moments
        text: List its risky moments
      - id: interruptions
        text: Choose the interruptions to apply
      - id: apply
        text: Apply each interruption at each risky moment
      - id: check
        text: Check screen, data, true outcome and server side on return
      - id: evidence
        text: Capture recordings, device logs and server records for failures
    hints:
      - You need the grid's rows and columns before you can fill it.
    solution: |
      Journey → moments → interruptions → apply → check → evidence. Repeat the payment steps on a low-memory device.

  - id: interview-interruptions
    type: interview
    concept: state-preservation
    skill: application
    title: "Interview: what does interruption testing mean to you?"
    prompt: |
      *"How do you test how our app handles interruptions?"* Answer as you would in the interview.
    hints:
      - Kinds of interruption, what must survive, technique, evidence.
    modelAnswer: |
      Interruptions move the app between foreground, background and - the important one - being killed by the OS and recreated. I'd
      cover notifications and calls, switching to other apps for short and long periods, screen lock, configuration changes like
      rotation and dark mode, network changes, battery saver, permission dialogs, and simulated process death.

      For each screen I'd decide what must survive: form input and scroll position should survive rotation and process death via saved
      state; anything in progress, like a payment, should be persisted and re-checked with the server on return; caches can simply
      reload.

      Technique: take a journey, list its risky moments - typing, requests in flight, waiting for an external app - and apply each
      interruption at each moment, prioritising payments. On return I check the screen, the data, the true outcome and the server side -
      one order, one payment. I use a low-memory device where the OS kills apps naturally, and I report with the exact interruption,
      timing, device and OS, a recording and logs.
    rubric:
      - Named several interruption types including process death
      - Distinguished what survives rotation versus process death
      - Said in-progress operations must be persisted and re-checked
      - Applied interruptions at risky moments in a journey
      - Checked server-side effects
      - Used a low-memory device and precise reporting
    followUps:
      - How do you simulate process death on Android?
      - What's different on iOS?
      - Which interruption do you think causes the most payment defects, and why?
    solution: |
      The strongest answers mention **process death** and **server-side checks** - the two things casual testing misses.

  - id: explain-rotation
    type: short
    concept: mobile-interruption-types
    skill: recall
    title: Why rotation is a functional test on Android
    prompt: In two or three sentences, explain why rotating the screen is a functional test on Android, not just a layout check.
    hints:
      - What does Android do to the activity by default on a configuration change?
    modelAnswer: |
      By default Android destroys and recreates the activity on a configuration change such as rotation, wiping state kept in the
      activity instance. Any input or progress not saved in a ViewModel or saved state is lost, so rotation tests whether the app
      preserves state correctly, not only whether the layout fits.
    rubric:
      - Said the activity is destroyed and recreated by default
      - Said state in the activity instance is lost
      - Connected it to state preservation (ViewModel or saved state)
    solution: |
      Dark mode, language and window-size changes are configuration changes too - test them the same way.

placement:
  - id: place-type
    type: mcq
    concept: mobile-interruption-types
    skill: application
    title: The most destructive interruption
    prompt: Which interruption typically loses the most in-memory state in a mobile app?
    options:
      - id: process-death
        text: The OS terminating the app's process while it is in the background
        feedback: Correct - everything in memory is gone; only saved and persistent state come back.
      - id: shade
        text: Pulling down the notification shade
        feedback: That usually just makes the app inactive or paused briefly.
      - id: short-switch
        text: Switching to another app for two seconds
        feedback: The app usually stays in memory for such a short switch.
      - id: notification
        text: Receiving a notification banner
        feedback: A banner rarely changes the app's lifecycle at all.
    correct: [process-death]
    solution: |
      **Process death.** Test it deliberately - it rarely happens by itself on a powerful test phone.

  - id: place-state
    type: mcq
    concept: state-preservation
    skill: application
    title: The payment in progress
    prompt: The app is killed while the user approves a payment in their banking app. On return, what should the app do?
    options:
      - id: recheck
        text: Restore the checkout from persisted state and ask the server for the payment's true status before showing a result
        feedback: Correct - the outcome may have happened while the app was dead; only the server knows.
      - id: restart
        text: Start again from the home screen
        feedback: The user loses the result and may pay again.
      - id: assume-failed
        text: Show "payment failed" because the app was interrupted
        feedback: The payment may have succeeded at the bank - showing failed invites a double payment.
      - id: assume-success
        text: Show "payment successful" because the user returned
        feedback: Returning proves nothing about the outcome.
    correct: [recheck]
    solution: |
      **Restore and re-check with the server.** Covered in depth in [mobile payment interruptions](#/lesson/mobile-payment-interruptions).

  - id: place-technique
    type: mcq
    concept: interruption-test-technique
    skill: analysis
    title: The riskiest moment
    prompt: In a checkout journey, at which moment is an interruption most likely to cause a duplicate payment or a lost outcome?
    options:
      - id: in-flight
        text: While the payment request is in flight or the user is in the banking app
        feedback: Correct - the outcome is being decided outside the app's view.
      - id: browsing
        text: While browsing products
        feedback: Annoying if state is lost, but no money is at stake.
      - id: result
        text: On the result screen after the payment completed
        feedback: The outcome is already known and stored.
      - id: launch
        text: During app launch
        feedback: Nothing payment-related is in progress yet.
    correct: [in-flight]
    solution: |
      **In flight and in the bank app.** Prioritise those cells of the grid.

recall:
  - id: recall-interruptions
    concept: mobile-interruption-types
    prompt: Name six kinds of mobile interruption.
    answer: Notifications, calls and alarms, app switches, screen lock, rotation and other configuration changes, network changes, battery saver, permission dialogs, and process death.
  - id: recall-ios-states
    concept: mobile-interruption-types
    prompt: What are the main iOS scene lifecycle states?
    answer: Foreground active, foreground inactive, background and suspended - and suspended apps can be terminated to free memory.
  - id: recall-survive
    concept: state-preservation
    prompt: Which Android state mechanism survives configuration changes but not process death?
    answer: The ViewModel; saved instance state survives both, and persistent storage survives everything.
  - id: recall-in-progress
    concept: state-preservation
    prompt: How should an app handle an operation that was in progress when it was killed?
    answer: Persist it, and on return re-check its true outcome with the server before showing a result.
  - id: recall-grid
    concept: interruption-test-technique
    prompt: What are the axes of an interruption test grid?
    answer: The risky moments of a journey against the interruptions to apply, with an expected result in each cell.
  - id: recall-low-memory
    concept: interruption-test-technique
    prompt: Why test on a low-memory device?
    answer: The OS kills background apps quickly there, so process-death defects appear naturally.

