id: adb-and-logcat-for-testers
title: adb and logcat for testers
subject: mobile-testing
module: android-testing
level: beginner
status: published
estimatedMinutes: 45
summary: Use the Android Debug Bridge to install builds, reset and configure apps, grant or revoke permissions, open deep links and capture screenshots, recordings and bug reports - and read logcat with filters, buffers and process ids to turn "it crashed" into a stack trace.
tags: [mobile, android, adb, logcat, crash, evidence, deep links, permissions, screenrecord, bugreport]

environment: |
  - **Platform documentation (primary source):** [Android Debug Bridge (adb)](https://developer.android.com/tools/adb) - USB
    debugging under Developer options and the RSA authorisation dialog (Android 4.2.2 / API 17 and later), `am start` with `-a`,
    `-d` and `-n`, `am force-stop`, `am kill`, `pm clear`, `pm grant` / `pm revoke`, `screencap`, `screenrecord` (maximum and default
    180 seconds, no audio); [Logcat command-line tool](https://developer.android.com/tools/logcat) - `-v` formats (`threadtime` is
    the default), buffers via `-b` (`main`, `system`, `crash`, `radio`, `events`, `all`, `default`), priorities `V D I W E F S` and
    filter expressions such as `adb logcat ActivityManager:I MyApp:D *:S`.
  - **Version:** options shown were checked against **adb 34.0.4** (`adb install [-lrtsdg]`, `-r` replace, `-g` grant all runtime
    permissions; `adb uninstall [-k]`). Options can differ by platform-tools and Android version - `adb help` and
    `adb logcat --help` are the authority on your machine.
  - **Ethics and safety:** use test devices and test builds; logs can contain personal data - handle them like any evidence.
  - **Fictional:** the package `com.sandpay.demoshop` and its log tags.

prerequisites:
  - mobile-test-planning

concepts:
  - id: adb-essentials
    name: adb essentials for testers
    summary: Connect a device, install and upgrade builds, reset app data, grant and revoke permissions, open deep links and send key events - repeatable set-up instead of tapping through settings.
  - id: logcat-filtering
    name: Reading logcat
    summary: Logcat shows system and app logs with time, process, thread, priority and tag; filter by tag and priority, by process id, or read the crash buffer to find the stack trace that explains a failure.
  - id: adb-evidence-capture
    name: Capturing evidence with adb
    summary: Screenshots, screen recordings, log extracts with timestamps and full bug reports make Android defects reproducible and diagnosable.

objectives:
  - Set up a device for adb and install, upgrade and reset an app from the command line.
  - Grant and revoke permissions, open deep links and simulate key presses for repeatable tests.
  - Filter logcat to the app and priority you need and find the stack trace of a crash.
  - Capture screenshots, recordings, log extracts and bug reports as defect evidence.

sections:
  - id: intuition
    kind: intuition
    concepts: [adb-essentials, logcat-filtering]
    title: The idea in plain language
    body: |
      A mechanic doesn't diagnose a car by driving it around and listening. They plug a **diagnostic cable** into the car and read
      what its computer recorded: the error codes, the sensor values, the moment it went wrong.

      **adb** is that cable for Android: it lets you control the phone from your computer - install a build, wipe an app's data, switch a
      permission off, open a link, take a screenshot. **Logcat** is the car's recorded log: everything the system and the app wrote, with
      times and severities.

      With them, "the app closed when I tapped Pay" becomes "build 5402 on Android 14 throws `IllegalStateException` in `CheckoutFragment`
      at 10:42:07 after the payment response" - a report a developer can fix the same day.

  - id: what
    kind: what
    concepts: [adb-essentials]
    title: What adb can do for a tester
    body: |
      **Set-up:** enable **Developer options** (tap the build number seven times in the device's settings), turn on **USB debugging**,
      connect the device and accept the **RSA key** dialog - on Android 4.2.2 and later the device asks before allowing adb, so a locked or
      unattended phone can't be controlled.

      | Task | Command |
      |---|---|
      | list devices (with models) | `adb devices -l` |
      | install a build / upgrade keeping data | `adb install app.apk` / `adb install -r app.apk` |
      | install granting all runtime permissions | `adb install -g app.apk` |
      | uninstall (keeping data with `-k`) | `adb uninstall com.sandpay.demoshop` |
      | wipe the app's data (fresh start) | `adb shell pm clear com.sandpay.demoshop` |
      | grant / revoke a permission | `adb shell pm grant com.sandpay.demoshop android.permission.CAMERA` / `pm revoke ...` |
      | open a deep link | `adb shell am start -a android.intent.action.VIEW -d "https://shop.example.com/orders/ORD-1042"` |
      | start a specific screen | `adb shell am start -n com.sandpay.demoshop/.MainActivity` |
      | stop the app / kill it in the background | `adb shell am force-stop ...` / `adb shell am kill ...` |
      | type text, press keys | `adb shell input text "Main%sStreet"` (`%s` = space), `adb shell input keyevent KEYCODE_HOME` |
      | screenshot to your computer | `adb exec-out screencap -p > screen.png` |
      | screen recording (max 180 s, no audio) | `adb shell screenrecord /sdcard/demo.mp4`, then `adb pull /sdcard/demo.mp4` |
      | full bug report | `adb bugreport bugreport.zip` |

      With **several devices**, add `-s <serial>` (from `adb devices`) to every command.

  - id: why
    kind: why
    concepts: [adb-evidence-capture, adb-essentials]
    title: Why testers need it, not only developers
    body: |
      - **Android defects are often unreproducible without logs.** A crash that happens "sometimes" needs the stack trace and the moments
        before it - only logcat has them.
      - **Set-up by hand is slow and inconsistent.** Clearing data, granting permissions and opening deep links through menus takes
        minutes and differs every time; one adb command does it identically for every run.
      - **Evidence decides priority.** A report with a stack trace, a recording and the build number is fixed this sprint; "it closed
        once" is parked.
      - **It is the foundation of automation.** Appium and Android's own test tools use the same commands - see
        [Appium architecture](#/lesson/appium-architecture).

  - id: internals
    kind: internals
    concepts: [logcat-filtering]
    title: How logcat output is structured and filtered
    body: |
      The default `threadtime` format shows "the date, invocation time, priority, tag, PID, and TID" (logcat documentation):

      ```plaintext
      10-12 10:42:07.311  8123  8123 E AndroidRuntime: FATAL EXCEPTION: main
      10-12 10:42:07.311  8123  8123 E AndroidRuntime: Process: com.sandpay.demoshop, PID: 8123
      10-12 10:42:07.311  8123  8123 E AndroidRuntime: java.lang.IllegalStateException: Fragment CheckoutFragment not attached to a context.
      10-12 10:42:07.311  8123  8123 E AndroidRuntime:     at com.sandpay.demoshop.checkout.CheckoutFragment.onPaymentResult(CheckoutFragment.kt:88)
      ```

      Columns: date, time, **PID** (process), **TID** (thread), **priority**, **tag**, message.

      **Priorities**, lowest to highest: `V` verbose, `D` debug, `I` info, `W` warning, `E` error, `F` fatal, `S` silent.

      **Filter expressions** `tag:priority` show messages for that tag at or above the priority; `*:S` silences everything else:

      ```bash
      adb logcat ActivityManager:I DemoShop:D *:S     # the docs' pattern, with the app's own tag
      adb logcat *:W                                  # warnings and above from everyone
      ```

      **Buffers** with `-b`: `main` (apps), `system`, `crash` (crash reports), `events`, `radio`, or `all`. The fastest way to the stack
      trace of a crash:

      ```bash
      adb logcat -b crash -d
      ```

      Other common options (check `adb logcat --help`): `-c` clears the buffers before a test, `-d` dumps what's there and exits, and
      `--pid=<id>` shows one process only - combined with `pidof`:

      ```bash
      adb logcat --pid=$(adb shell pidof -s com.sandpay.demoshop)
      ```

  - id: visual
    kind: visual
    concepts: [adb-evidence-capture, logcat-filtering]
    title: "Flowchart: from \"it crashed\" to a defect report"
    body: |
      ```mermaid
      flowchart TD
          A[App closes unexpectedly] --> B[adb logcat -c, then reproduce]
          B --> C[adb logcat -b crash -d]
          C --> D{Stack trace from the app's package?}
          D -- Yes --> E[Copy the exception and the first app frames]
          D -- No --> F[Filter by the app's PID and look for ANR or system kills]
          E --> G[Add time, device, OS, build and steps]
          F --> G
          G --> H[Attach recording, screenshot, log extract - or a bug report zip]
      ```

  - id: steps
    kind: steps
    concepts: [adb-essentials, adb-evidence-capture]
    title: Step by step - a repeatable test set-up with adb
    body: |
      Before each test session or automated run:

      1. `adb devices -l` - the right device is connected and authorised.
      2. `adb install -r demoshop-5402.apk` - the build under test, keeping data (or `pm clear` for a fresh start).
      3. `adb shell pm clear com.sandpay.demoshop` - when the test needs a first launch.
      4. Set permissions explicitly: `pm grant` for tests that need them, `pm revoke` for the denial path - instead of tapping dialogs.
      5. `adb logcat -c` - clear the logs so the extract contains only this test.
      6. Start a recording if the issue is visual: `adb shell screenrecord /sdcard/run.mp4`.
      7. Run the test; open deep links with `am start -a android.intent.action.VIEW -d <url>`.
      8. Collect: `adb logcat -d > run.log`, `adb logcat -b crash -d > crash.log`, `adb pull /sdcard/run.mp4`, screenshots.
      9. For hard cases (ANRs, system behaviour): `adb bugreport bugreport.zip`.

  - id: example
    kind: example
    concepts: [logcat-filtering, adb-evidence-capture]
    title: "Real-world example: the crash nobody could reproduce"
    body: |
      Beta testers report "the app closes after paying - sometimes". Developers can't reproduce it on their phones.

      The tester clears the logs, pays with the sandbox test method several times on a mid-range phone, and gets the crash on the third
      try. `adb logcat -b crash -d` shows the trace from the "How" section: `IllegalStateException: Fragment CheckoutFragment not attached to
      a context` in `onPaymentResult`. The full log, filtered by the app's PID, shows the timing:

      ```plaintext
      10-12 10:42:01.902  8123  8123 I DemoShop: pay tapped order=ORD-2210
      10-12 10:42:03.415  8123  8123 I DemoShop: navigation -> OrderStatusFragment
      10-12 10:42:07.311  8123  8123 E AndroidRuntime: FATAL EXCEPTION: main
      ```

      The user tapped Back to the orders screen while the payment was still processing; the response arrived 4 seconds later and was
      delivered to a fragment that no longer existed. It happens only when the response is slow - a slower phone and network made it
      visible.

      Report: steps with timing ("tap Back within 3 seconds of Pay; use a slow network profile"), the stack trace, the log extract, device,
      OS and build. Fix: deliver results through a lifecycle-aware component; regression test with a delayed sandbox method.

  - id: code
    kind: code
    concepts: [adb-essentials]
    title: A small script for a clean test run
    collapsed: true
    body: |
      ```bash
      #!/usr/bin/env bash
      # clean-run.sh - prepare a device, run a manual or automated test, collect evidence
      set -euo pipefail
      PKG=com.sandpay.demoshop
      APK=${1:?usage: clean-run.sh path/to/app.apk}
      OUT=evidence/$(date +%Y%m%d-%H%M%S)
      mkdir -p "$OUT"

      adb devices -l
      adb install -r "$APK"
      adb shell pm clear "$PKG"
      adb shell pm grant "$PKG" android.permission.CAMERA
      adb logcat -c

      echo "Run the test now, then press Enter"
      read -r

      adb logcat -d > "$OUT/app.log"
      adb logcat -b crash -d > "$OUT/crash.log"
      adb exec-out screencap -p > "$OUT/final-screen.png"
      echo "Evidence in $OUT"
      ```

      Grant only permissions the app declares in its manifest (on Android 6.0 / API 23 and later, `pm grant` accepts any permission declared
      there). Review `app.log` for personal data before attaching it to a ticket.

  - id: tests
    kind: tests
    concepts: [adb-essentials]
    title: Test cases that adb makes repeatable
    body: |
      | ID | adb set-up | Test | Expected |
      |---|---|---|---|
      | B1 | `pm clear`, launch | first-run onboarding | shown once, then not again |
      | B2 | install old build, add data, `install -r` new build | upgrade | data migrated, user still signed in |
      | B3 | `pm revoke ... CAMERA` | scan a return label | explains why the camera is needed, offers settings |
      | B4 | `pm grant` then revoke in settings while the app runs | return to the scanner | handles the revocation without crashing |
      | B5 | `am start -a VIEW -d https://shop.example.com/orders/ORD-1042` | deep link while signed out | sign-in, then the order |
      | B6 | same deep link with an unknown order | error screen | clear message, no crash |
      | B7 | `input keyevent KEYCODE_HOME` during payment, then return | interruption | true payment result shown |
      | B8 | `logcat -c`, run checkout, `logcat -b crash -d` | any journey | crash buffer empty |

  - id: mistakes
    kind: mistakes
    concepts: [logcat-filtering, adb-evidence-capture, adb-essentials]
    title: Common mistakes and how to avoid them
    body: |
      - **Reading the whole unfiltered log.** Filter by PID, tag and priority, or use the crash buffer.
      - **Not clearing before reproducing.** `adb logcat -c` first, so the extract is only your test.
      - **Pasting only the last log line.** Include the exception, the "Caused by" lines and the first frames from the app's package.
      - **Wrong device with several connected.** Use `-s <serial>`.
      - **Tapping permission dialogs by hand in every test.** Use `pm grant` / `pm revoke` for repeatable states.
      - **Attaching logs with personal data or tokens.** Review and redact.
      - **Using force-stop to simulate process death.** Use `am kill` on a backgrounded app (see the
        [Android lifecycle lesson](#/lesson/android-lifecycle-and-process-death)).

  - id: summary
    kind: summary
    title: Summary and quick reference
    body: |
      - Set-up: Developer options → **USB debugging**, accept the **RSA key** dialog; `adb devices -l`; `-s <serial>` for several devices.
      - Builds and data: `install -r` (keep data), `install -g` (grant permissions), `uninstall [-k]`, `pm clear`.
      - Control: `pm grant` / `pm revoke`, `am start -a VIEW -d <url>`, `input text` / `input keyevent`, `am kill`, `am force-stop`.
      - Logcat: `threadtime` columns (date, time, PID, TID, priority, tag); priorities **V D I W E F S**; filters `tag:priority *:S`;
        buffers `-b crash`; `-c`, `-d`, `--pid`.
      - Evidence: `screencap -p`, `screenrecord` (≤ 180 s, no audio), `bugreport`.

exercises:
  - id: crash-command
    type: mcq
    concept: logcat-filtering
    skill: application
    title: Get the stack trace
    prompt: The app just crashed on the connected device. Which command shows its crash report most directly?
    options:
      - id: crash-buffer
        text: adb logcat -b crash -d
        feedback: Correct - the crash buffer holds crash reports; -d prints what's there and exits.
      - id: all
        text: adb logcat
        feedback: It works, but streams everything from every process - the trace is buried in noise.
      - id: verbose
        text: adb logcat *:V
        feedback: Verbose from all tags is even more noise.
      - id: screencap
        text: adb exec-out screencap -p > crash.png
        feedback: A screenshot shows the screen, not why the app crashed.
    correct: [crash-buffer]
    hints:
      - Logcat has a separate buffer for crashes.
    solution: |
      **`adb logcat -b crash -d`.** Copy the exception, the "Caused by" lines and the first frames from the app's own package into the report.
    followUp: |
      The crash buffer is empty but the app closed. What else could have happened, and which log would show it?

  - id: filter-expression
    type: mcq
    concept: logcat-filtering
    skill: application
    title: Only the app's warnings
    prompt: You want to see only messages with tag `DemoShop` at warning level or higher, and nothing else. Which filter fits?
    options:
      - id: right
        text: adb logcat DemoShop:W *:S
        feedback: Correct - DemoShop at W and above, everything else silenced.
      - id: missing-silence
        text: adb logcat DemoShop:W
        feedback: Without *:S, other tags still print at their default level.
      - id: wrong-priority
        text: adb logcat DemoShop:V *:S
        feedback: V shows everything from DemoShop, including verbose and debug messages.
      - id: global
        text: adb logcat *:W
        feedback: That shows warnings from every tag, not only DemoShop.
    correct: [right]
    hints:
      - The docs' example ends with *:S - why?
    solution: |
      **`DemoShop:W *:S`.** Quote the expression in shells that expand `*`: `adb logcat "DemoShop:W *:S"`.
    followUp: |
      How would you show only the app's process, whatever the tags?

  - id: debug-log
    type: debug
    concept: logcat-filtering
    skill: analysis
    title: Find the line that explains the crash
    prompt: Click the log line that gives the cause of the crash.
    language: plaintext
    code: |
      10-12 10:42:01.902  8123  8123 I DemoShop: pay tapped order=ORD-2210
      10-12 10:42:03.415  8123  8123 I DemoShop: navigation -> OrderStatusFragment
      10-12 10:42:05.120  8123  8140 D OkHttp: <-- 201 Created (5203ms)
      10-12 10:42:07.311  8123  8123 E AndroidRuntime: FATAL EXCEPTION: main
      10-12 10:42:07.311  8123  8123 E AndroidRuntime: java.lang.IllegalStateException: Fragment CheckoutFragment not attached to a context.
      10-12 10:42:07.312  8123  8123 E AndroidRuntime:     at com.sandpay.demoshop.checkout.CheckoutFragment.onPaymentResult(CheckoutFragment.kt:88)
      10-12 10:42:07.500  1290  1350 I ActivityManager: Process com.sandpay.demoshop (pid 8123) has died
    correctLines: [5]
    lineNotes:
      - line: 4
        note: This announces that a fatal exception happened, but not which one.
      - line: 6
        note: This is where it happened - useful, but the cause is in the exception message above it.
      - line: 7
        note: The system reporting the process death - a consequence.
    hints:
      - Which line names the exception and its message?
    solution: |
      **Line 5.** `IllegalStateException: Fragment CheckoutFragment not attached to a context` - with lines 2 and 3 showing the user left the
      checkout before the slow payment response (5.2 s) arrived. Line 6 locates it in the code.
    followUp: |
      Write the steps to reproduce, using the timing you can read from this log.

  - id: setup-design
    type: testdesign
    concept: adb-essentials
    skill: application
    title: Repeatable permission and deep-link tests
    prompt: |
      Design repeatable tests, using adb for set-up, for the demo shop's camera-based "scan return label" feature and its deep link
      `https://shop.example.com/returns/{orderId}`. Cover permission states and deep-link cases; give the adb commands, the expected
      results and the evidence.
    hints:
      - Use pm clear, pm grant and pm revoke instead of tapping dialogs.
      - What if the user is signed out, or the order doesn't exist?
    modelAnswer: |
      Set-up for each: `adb install -r <build>`, `adb logcat -c`.

      1. Fresh install (`pm clear`), open scanner → system permission dialog shown with the app's explanation first. Evidence: screenshots.
      2. `pm grant <pkg> android.permission.CAMERA` → scanner opens camera preview. Evidence: screenshot.
      3. `pm revoke <pkg> android.permission.CAMERA` → open scanner → explanation and a button to settings; no crash. Evidence: screenshot,
         crash buffer empty.
      4. Granted, scanner open → revoke in system settings → return to the app → handled without crash (the system may restart the
         process when a permission is revoked). Evidence: recording, logcat.
      5. Deep link `am start -a android.intent.action.VIEW -d https://shop.example.com/returns/ORD-1042` signed in → return form for that
         order. Evidence: screenshot.
      6. Same link signed out → sign-in, then the return form. Evidence: recording.
      7. Link with an unknown or another customer's order → clear error, no data shown. Evidence: screenshot.
      8. After all: `adb logcat -b crash -d` empty. Evidence: crash.log.
    rubric:
      - Used pm clear, pm grant and pm revoke to set permission states
      - Covered denied, granted and revoked-while-running
      - Opened deep links with am start and a VIEW intent
      - Covered signed-out and unknown or foreign orders
      - Checked the crash buffer
      - Named evidence for each test
    solution: |
      Compare with the model answer. Case 4 often finds crashes - revoking a permission in settings can restart the app's process.
    followUp: |
      How would you run the same cases in an automated Appium suite?

  - id: order-evidence
    type: order
    concept: adb-evidence-capture
    skill: recall
    title: Capturing a crash properly
    prompt: Put the steps for capturing evidence of an intermittent crash in order.
    items:
      - id: clear
        text: Clear the logs with adb logcat -c
      - id: record
        text: Start a screen recording
      - id: reproduce
        text: Reproduce the steps until the crash happens, noting the time
      - id: dump
        text: Dump the crash buffer and the app's log extract
      - id: pull
        text: Pull the recording and take a screenshot of the final state
      - id: report
        text: Write the report with device, OS, build, steps, timing and the stack trace
    hints:
      - Clearing comes before reproducing so the extract is clean.
    solution: |
      Clear → record → reproduce → dump logs → pull recording → report. For system-level problems, add `adb bugreport`.

  - id: interview-adb
    type: interview
    concept: adb-evidence-capture
    skill: application
    title: "Interview: how do you report an Android crash?"
    prompt: |
      *"A tester tells you the Android app crashes sometimes. What do you need, and how would you get it?"* Answer as you would in the
      interview.
    hints:
      - Reproduction, the stack trace, context, and how adb helps.
    modelAnswer: |
      I need enough to let a developer reproduce and diagnose it: the device, Android version and app build, exact steps with timing, how
      often it happens, and above all the stack trace.

      I'd connect the device with USB debugging, install the exact build with adb, clear the logs with adb logcat -c, start a screen recording,
      and reproduce - varying one thing at a time, like network speed or how fast I tap Back, until it happens reliably. Then adb logcat -b
      crash -d gives the crash report; I'd also take the app's log extract filtered by its PID to see what happened just before - which screen,
      which request, how long it took.

      The report gets the exception and the first frames from our package, the log extract with timestamps, the recording, and the conditions
      that make it reproducible. For freezes or system-level issues I'd attach adb bugreport. And I'd check the logs for personal data before
      attaching them.
    rubric:
      - Listed device, OS, build, steps, timing and frequency
      - Used adb to install the exact build and clear logs
      - Reproduced by varying one factor at a time
      - Used the crash buffer for the stack trace
      - Used a PID-filtered log extract for context
      - Attached a recording and, when relevant, a bug report
      - Checked evidence for personal data
    followUps:
      - How do you find the app's process id?
      - What's an ANR, and where would you look for it?
      - How would you capture the same on iOS?
    solution: |
      The answer stands out with **the crash buffer, the PID filter and reproducible timing**.

  - id: explain-rsa
    type: short
    concept: adb-essentials
    skill: recall
    title: Why the RSA dialog
    prompt: In two or three sentences, explain why Android asks you to accept an RSA key when you connect a computer for USB debugging.
    hints:
      - What could someone do with adb on a phone that isn't theirs?
    modelAnswer: |
      adb can install apps, read logs and control the phone, so Android (4.2.2 and later) only allows a computer once the user has unlocked
      the device and accepted that computer's key. That prevents someone with a cable from controlling a locked or unattended phone.
    rubric:
      - Said adb gives powerful control of the device
      - Said the user must unlock and accept the computer's key
      - Said it protects against control by unauthorised computers
    solution: |
      If `adb devices` shows "unauthorized", unlock the phone and accept the dialog.

placement:
  - id: place-install
    type: mcq
    concept: adb-essentials
    skill: application
    title: Upgrade without losing data
    prompt: You want to install a new build over the existing one on a test phone, keeping the app's data so you can test the upgrade. Which command?
    options:
      - id: reinstall
        text: adb install -r new.apk
        feedback: Correct - -r replaces the existing application and keeps its data.
      - id: clear
        text: adb shell pm clear com.sandpay.demoshop, then adb install new.apk
        feedback: pm clear deletes the data - the opposite of an upgrade test.
      - id: uninstall
        text: adb uninstall com.sandpay.demoshop, then adb install new.apk
        feedback: Uninstalling removes the data (unless -k), so it's a fresh install, not an upgrade.
      - id: grant
        text: adb install -g new.apk
        feedback: -g grants runtime permissions; on an existing install you need -r to replace it.
    correct: [reinstall]
    solution: |
      **`adb install -r`.** Upgrade testing needs the old version's data in place first.

  - id: place-logcat
    type: mcq
    concept: logcat-filtering
    skill: application
    title: Read the priority
    prompt: "In the logcat line `10-12 10:42:07.311  8123  8123 W DemoShop: retrying payment status`, what does `W` mean?"
    options:
      - id: warning
        text: The message has warning priority
        feedback: Correct - V, D, I, W, E, F are verbose, debug, info, warning, error and fatal.
      - id: wifi
        text: It was logged while on Wi-Fi
        feedback: The letter is the priority, not the network.
      - id: write
        text: The app wrote to storage
        feedback: It's a priority level, not an action.
      - id: thread
        text: It is the thread name
        feedback: The thread id is the number before the priority (8123 here).
    correct: [warning]
    solution: |
      **Warning.** Filter with `DemoShop:W *:S` to see only warnings and above from the app.

  - id: place-evidence
    type: mcq
    concept: adb-evidence-capture
    skill: analysis
    title: The best evidence for a visual glitch
    prompt: A button flickers and briefly shows the wrong price during checkout. Which evidence is most useful?
    options:
      - id: recording
        text: A screen recording (adb shell screenrecord) with the time, plus the app's log extract for that time
        feedback: Correct - a recording captures the transient state; the log shows what the app was doing then.
      - id: screenshot
        text: One screenshot after it has finished
        feedback: The glitch is gone by then.
      - id: bugreport-only
        text: Only a full bug report zip
        feedback: Useful for system issues, but it doesn't show what the user saw.
      - id: description
        text: A description from memory
        feedback: Hard to reproduce and easy to dispute.
    correct: [recording]
    solution: |
      **Recording plus logs.** Remember screenrecord's 180-second limit and that it records no audio.

recall:
  - id: recall-setup
    concept: adb-essentials
    prompt: How do you prepare a phone for adb?
    answer: Enable Developer options, turn on USB debugging, connect it, and accept the computer's RSA key dialog on the unlocked phone.
  - id: recall-permissions
    concept: adb-essentials
    prompt: How do you set a runtime permission state from adb?
    answer: adb shell pm grant or pm revoke with the package name and the permission, for example android.permission.CAMERA.
  - id: recall-deeplink
    concept: adb-essentials
    prompt: How do you open a deep link with adb?
    answer: adb shell am start -a android.intent.action.VIEW -d followed by the URL.
  - id: recall-priorities
    concept: logcat-filtering
    prompt: What are logcat's priority letters?
    answer: V verbose, D debug, I info, W warning, E error, F fatal, S silent.
  - id: recall-crash
    concept: logcat-filtering
    prompt: Which logcat option shows crash reports directly?
    answer: The crash buffer - adb logcat -b crash (with -d to dump and exit).
  - id: recall-capture
    concept: adb-evidence-capture
    prompt: Name three ways to capture evidence with adb.
    answer: screencap for screenshots, screenrecord for recordings (up to 180 seconds, no audio), and bugreport for a full diagnostic zip - plus log extracts.

