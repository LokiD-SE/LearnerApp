id: mobile-test-planning
title: Planning mobile app testing
subject: mobile-testing
module: mobile-fundamentals
level: beginner
status: published
estimatedMinutes: 45
summary: Plan testing for an Android and iOS app - choose devices and OS versions from real usage data, list the risks only mobile apps have (networks, interruptions, permissions, updates, stores), and decide what to test on emulators, real devices and device clouds.
tags: [mobile, android, ios, test planning, device matrix, emulator, simulator, real devices, device cloud, risk, accessibility]

environment: |
  - **Platform documentation:** Android - [developer.android.com](https://developer.android.com/) (for example "Test your app"
    and the Android Emulator); iOS - [developer.apple.com](https://developer.apple.com/documentation/xcode) (Xcode, Simulator,
    TestFlight). Both platforms' app review rules: Google Play's Developer Program Policies and Apple's App Store Review
    Guidelines.
  - **Usage data:** Apple publishes the share of devices by iOS version on its App Store support pages
    ([developer.apple.com/support/app-store](https://developer.apple.com/support/app-store/)); Android Studio shows Android
    version distribution when you choose a minimum SDK. **Your own analytics beat any global figure** - plan from them.
  - **Accessibility:** WCAG 2.2 (W3C) is the common reference; Android and iOS provide TalkBack and VoiceOver, font scaling and
    contrast settings to test with.
  - **Platform- and version-specific:** OS versions, permission models and limits change every year - check the current
    documentation for each release.
  - **Fictional:** the SandPay Demo Shop's mobile app and its analytics figures.

prerequisites:
  - risk-based-testing
  - client-server-request-flow

concepts:
  - id: device-coverage-matrix
    name: Device and OS coverage matrix
    summary: Choose devices, OS versions, screen sizes and manufacturers from your own usage data plus known high-risk variants, and cover them deliberately rather than with whatever phones are on the desk.
  - id: mobile-specific-risks
    name: Mobile-specific risks
    summary: Unreliable networks, interruptions, permissions, background limits, storage and battery, app updates, store review, accessibility and many device variants create risks web testing doesn't have.
  - id: test-environment-mix
    name: Emulators, real devices and device clouds
    summary: Emulators and simulators are fast and scriptable; real devices show real performance, sensors, networks and manufacturer quirks; device clouds give breadth - each answers different questions.

objectives:
  - Build a device and OS coverage matrix from usage data and risk.
  - List the risks specific to mobile apps and turn them into test areas.
  - Decide which tests run on emulators or simulators, on real devices, and in device clouds.
  - Write a mobile test plan section that a team can review and act on.

sections:
  - id: intuition
    kind: intuition
    concepts: [mobile-specific-risks]
    title: The idea in plain language
    body: |
      Testing a website is like testing a recipe in **your own kitchen**. Testing a mobile app is like testing it in **thousands of
      kitchens** - different ovens (devices), different gas pressure (networks), cooks who get interrupted by the phone, the door, the
      children (calls, notifications, app switches), and cupboards that are sometimes locked (permissions).

      You can't visit every kitchen. So you **choose wisely**: the kitchens most of your customers have, plus the strange ones where
      recipes typically fail. And you test the recipe under **interruptions**, not only on a quiet afternoon.

      A mobile test plan is that choice, written down: which devices, which OS versions, which conditions, which tools - and why.

  - id: what
    kind: what
    concepts: [device-coverage-matrix]
    title: What a coverage matrix contains
    body: |
      | Dimension | Where the data comes from | Typical choice |
      |---|---|---|
      | **OS versions** | your analytics; Apple's published adoption figures; Android Studio's distribution view; your minimum supported versions | newest, the most used, and the oldest you support - per platform |
      | **Manufacturers and models** (Android) | analytics: top models by sessions and by payments | 2-3 top manufacturers' current and older popular models |
      | **Screen sizes and densities** | analytics; design breakpoints | smallest supported, a common one, a large phone, a tablet if supported |
      | **Hardware tiers** | analytics; market (low-cost devices are common in many regions) | at least one low-memory device |
      | **Form factors** | product scope | foldables, tablets - if supported |
      | **App versions in the field** | store analytics | the current version and the oldest still allowed to call the API |

      A matrix is a **priority list**, not a promise to test everything everywhere. Example (fictional analytics):

      | Tier | Android | iOS | Used for |
      |---|---|---|---|
      | **P1** (every release, real device) | Samsung mid-range on Android 15, Pixel on Android 16 | iPhone on iOS 26, iPhone on iOS 18 | full regression of critical journeys |
      | **P2** (every release, device cloud) | Xiaomi and OnePlus models, Android 12-14 | older iPhone at the minimum supported iOS | critical journeys |
      | **P3** (monthly or before big releases) | tablets, foldables, low-memory device | iPad | smoke and layout |

  - id: why
    kind: why
    concepts: [mobile-specific-risks]
    title: Why mobile needs its own plan
    body: |
      | Risk | Why it is mobile-specific | Test area |
      |---|---|---|
      | **Networks** | mobile data, weak signal, switching between Wi-Fi and cellular, captive portals | offline, slow, switching, retries |
      | **Interruptions and lifecycle** | calls, notifications, app switching, the OS killing background apps | see [interruptions and lifecycle](#/lesson/interruptions-and-lifecycle) |
      | **Permissions** | camera, location, notifications - granted, denied, revoked later | every permission state |
      | **Fragmentation** | thousands of Android models with manufacturer changes (battery savers, custom skins) | coverage matrix |
      | **Installed versions** | users update when they like - old app versions keep calling the API | old versions against new APIs; forced update |
      | **Store review** | Apple and Google review builds and can reject them | review guidelines checklist before submission |
      | **Resources** | storage full, low battery, low memory | install, cache, background behaviour |
      | **Accessibility** | screen readers, font scaling, touch target size | TalkBack, VoiceOver, large fonts |
      | **Deep links and other apps** | links from email, banking-app returns, wallets | link routing, return flows |

  - id: internals
    kind: internals
    concepts: [test-environment-mix]
    title: Emulators, real devices and device clouds
    body: |
      | | Emulator (Android) / Simulator (iOS) | Real device in the team | Device cloud (remote real devices) |
      |---|---|---|---|
      | Speed and automation | fastest; easy to script and reset | manual or local automation | slower to start; good for automation at scale |
      | Fidelity | Android Emulator runs a full Android system image; iOS Simulator runs iOS frameworks on the Mac's CPU - neither has real radios, real performance or manufacturer customisations | full | full, but remote |
      | Networks | simulated conditions | real Wi-Fi and cellular | the provider's networks |
      | Sensors, camera, biometrics | simulated | real | partly |
      | Payments and wallets | limited (test cards, sandbox wallets) | real behaviour with test data | limited by provider policies |
      | Cost | free | buy and maintain devices | subscription |
      | Best for | development checks, UI automation in CI, quick reproduction | P1 journeys, performance, interruptions, payments | breadth across models and OS versions |

      A practical split: **every commit** on emulators and simulators; **every release** on P1 real devices for critical journeys and
      on a device cloud for P2; **exploratory sessions** on real devices with real networks.

  - id: visual
    kind: visual
    concepts: [device-coverage-matrix, test-environment-mix]
    title: "Flowchart: building the mobile test plan"
    body: |
      ```mermaid
      flowchart TD
          A[Usage analytics - OS versions, models, screens, app versions] --> B[Supported range - minimum OS, form factors]
          B --> C[Risk list - networks, interruptions, permissions, payments, accessibility]
          C --> D[Coverage matrix - P1, P2, P3 tiers]
          D --> E{Which environment answers this risk?}
          E -- Fast, scriptable --> F[Emulators and simulators in CI]
          E -- Real behaviour --> G[Real devices for P1 journeys]
          E -- Breadth --> H[Device cloud for P2 models]
          F --> I[Test plan - scope, environments, schedule, exit criteria]
          G --> I
          H --> I
      ```

  - id: steps
    kind: steps
    concepts: [device-coverage-matrix, mobile-specific-risks]
    title: Step by step - writing the mobile section of a test plan
    body: |
      1. **Get the analytics**: sessions and - more important - payments by OS version, model, screen size and app version, for
         the last 90 days.
      2. **Fix the supported range** with the product owner: minimum OS per platform, form factors, oldest app version allowed.
      3. **Draft the matrix** in tiers; justify each row with a number ("Samsung A-series: 31 % of Android payments").
      4. **List mobile risks** for the release's changes - a new camera feature raises permissions risk, a new payment method raises
         app-switch and interruption risk (see [risk-based testing](#/lesson/risk-based-testing)).
      5. **Assign environments**: which risks on emulators, which on real devices, which in the cloud.
      6. **Define conditions** to test under: network profiles, permission states, low battery or battery saver, dark mode, large
         fonts, screen reader.
      7. **Define exit criteria**: P1 journeys pass on all P1 devices; no open critical defects; crash-free rate in beta at or above the
         agreed target.
      8. **Review every quarter** - usage shifts with every new phone and OS release.

  - id: example
    kind: example
    concepts: [device-coverage-matrix]
    title: "Real-world example: the payments that only failed on one brand"
    body: |
      The demo shop's app has a crash-free rate of 99.7 % - healthy. But finance notices that payments **completed per checkout
      started** are 9 points lower on Android than on iOS.

      The tester breaks the funnel down by device model: one manufacturer's popular mid-range phones complete 22 % fewer checkouts.
      None of those models is in the team's test matrix - the team tests on two Pixels and three iPhones.

      On a device cloud, with that model, the tester reproduces it: the manufacturer's aggressive battery optimisation kills the app
      within seconds of switching to the banking app for authentication. When the customer returns, the app restarts on the home
      screen, and the payment's outcome is never shown.

      Changes: the matrix now comes from **payment analytics by model**, not from the phones on the desk; that model family is P1; and
      the app restores the checkout state after a process restart (see
      [Android lifecycle and process death](#/lesson/android-lifecycle-and-process-death)).

  - id: tests
    kind: tests
    concepts: [mobile-specific-risks]
    title: Mobile test areas and sample checks
    body: |
      | Area | Check | Expected |
      |---|---|---|
      | Install and update | update from the oldest supported version with data | data kept, migration runs, user still signed in |
      | Old versions | oldest allowed app version against the new API | works, or a clear forced-update screen |
      | Network | offline at launch, offline at pay, Wi-Fi → cellular during a request | clear messages, no lost or duplicate actions |
      | Interruptions | call or notification during checkout | state kept, flow continues |
      | Permissions | deny, allow once, revoke in settings while the app runs | the feature degrades gracefully; the app explains why |
      | Background | app in background 10 minutes, then reopened | correct screen and data; session handled |
      | Resources | storage almost full, battery saver on | sensible errors; no crash |
      | Accessibility | screen reader through checkout; font size 200 % | all controls labelled and reachable; no clipped text |
      | Display | dark mode, small and large screens, rotation (if supported) | layout correct |
      | Store | review guidelines checklist (account deletion, payments rules, privacy labels) | ready for submission |

  - id: mistakes
    kind: mistakes
    concepts: [device-coverage-matrix, test-environment-mix, mobile-specific-risks]
    title: Common mistakes and how to avoid them
    body: |
      - **Testing on the phones on the desk.** Plan from usage data - especially payment data.
      - **Only the newest OS.** Your users are spread over many versions; test the oldest supported.
      - **Simulators only.** They miss real performance, radios, manufacturer behaviour and real banking-app switches.
      - **Wi-Fi only.** Real users are on weak mobile data - test network conditions.
      - **Ignoring old app versions.** They keep calling the API for months.
      - **Accessibility at the end.** Screen-reader issues are cheap to fix during development, expensive after release.
      - **A matrix that never changes.** Review it every quarter.

  - id: summary
    kind: summary
    title: Summary and quick reference
    body: |
      - Matrix from **your analytics** (sessions and payments): OS versions, models, screens, hardware tiers, app versions - in
        **P1 / P2 / P3** tiers.
      - Mobile risks: **networks, interruptions, permissions, fragmentation, installed versions, store review, resources,
        accessibility, deep links**.
      - **Emulators/simulators** for speed and CI; **real devices** for P1 journeys, performance and payments; **device clouds** for
        breadth.
      - Exit criteria: P1 journeys on P1 devices, no open critical defects, crash-free rate target in beta.
      - Review the matrix every quarter.

exercises:
  - id: matrix-source
    type: mcq
    concept: device-coverage-matrix
    skill: application
    title: Where should the device list come from?
    prompt: Your team must choose 6 Android devices for release testing of a payments app. What is the best basis for the choice?
    options:
      - id: analytics
        text: Your app's own analytics - sessions and payments by model and OS version - plus the oldest supported OS and a low-memory device
        feedback: Correct - your own users' devices, weighted by the journeys that matter, are the best predictor of where defects hurt.
      - id: newest
        text: The six newest flagship phones
        feedback: Most customers don't own the newest flagships; you would miss the devices most payments come from.
      - id: desk
        text: Whatever phones the team already has
        feedback: Convenient but arbitrary - the example in this lesson shows how that misses a whole manufacturer.
      - id: global
        text: The global top-selling phones list
        feedback: Better than nothing, but your users may differ a lot from the global market - especially by region.
    correct: [analytics]
    hints:
      - Whose devices will run your app?
    solution: |
      **Your own analytics**, by sessions and payments, plus deliberate risk picks (oldest supported OS, low memory). Review it every
      quarter.
    followUp: |
      Analytics show 18 % of payments from Android 12, the oldest version you support. Which tier would you put it in, and why?

  - id: emulator-or-device
    type: mcq
    concept: test-environment-mix
    skill: analysis
    title: Where does this test belong?
    prompt: Which test most needs a **real device** rather than an emulator or simulator?
    options:
      - id: bank-app
        text: Paying with a flow that switches to a real banking app and back, on a manufacturer's battery-optimised phone
        feedback: Correct - real app switching, manufacturer battery behaviour and real networks are what emulators don't reproduce.
      - id: layout
        text: Checking that the checkout layout fits a 360 dp wide screen
        feedback: Screen sizes are easy to emulate; a real device isn't needed for this first check.
      - id: unit
        text: Running UI tests for every commit in CI
        feedback: Emulators and simulators are the right tool for fast, repeatable CI runs.
      - id: text
        text: Checking button labels are translated
        feedback: Text and translations show correctly on emulators.
    correct: [bank-app]
    hints:
      - What do emulators not have - other companies' apps, real radios, manufacturer changes?
    solution: |
      **The banking-app switch on a real, battery-optimised phone.** The others are well served by emulators and simulators.
    followUp: |
      Which other two tests from this lesson's tables would you always run on real devices?

  - id: risk-list
    type: mcq
    concept: mobile-specific-risks
    skill: application
    title: Mobile or not?
    prompt: Which of these are risks specific to mobile apps (compared with a website)? Select every one that applies.
    options:
      - id: old-versions
        text: Old app versions in the field keep calling the API
        feedback: Correct - users decide when to update installed apps; websites serve the newest code on each load.
      - id: permission-revoked
        text: The user revokes the camera permission while the app is running
        feedback: Correct - mobile permission models allow granting, denying and revoking at any time.
      - id: process-killed
        text: The OS kills the app in the background while the user is in another app
        feedback: Correct - mobile OSs reclaim memory aggressively; the app must restore its state.
      - id: wrong-total
        text: The order total is calculated wrongly on the server
        feedback: A server calculation defect affects web and mobile alike - it isn't mobile-specific.
    correct: [old-versions, permission-revoked, process-killed]
    hints:
      - Which would also happen on a desktop website?
    solution: |
      **Old versions, revoked permissions and process death** are mobile risks. Server-side defects belong in shared API tests.
    followUp: |
      For each mobile risk you selected, write one concrete test case.

  - id: plan-design
    type: testdesign
    concept: device-coverage-matrix
    skill: application
    title: Write the mobile test plan section
    prompt: |
      The demo shop app adds UPI payments for India. Its analytics: 78 % Android (top manufacturers Samsung, Xiaomi, Vivo; Android
      12-16), 22 % iOS (iOS 18 and 26). Write the mobile part of the test plan: coverage matrix in tiers with reasons, mobile risks
      for this feature, which environment covers which risk, conditions to test under, and exit criteria.
    hints:
      - UPI intent flows switch to another app - which risks does that add?
      - Which devices do Indian users of this app actually use?
      - What makes a release ready?
    modelAnswer: |
      Matrix:
      - P1 (real devices, every release): a popular Samsung, Xiaomi and Vivo model on the most-used Android versions; Android 12 (oldest
        supported); iPhone on iOS 26 and iOS 18. Reason: together most payments; UPI app switching needs real devices.
      - P2 (device cloud, every release): further popular models and Android 13-15; a low-memory device.
      - P3 (monthly): tablets, foldables.

      Risks for UPI: switching to the UPI app and back (intent flow); the OS killing the shop app while the UPI app is open; no UPI app
      installed; several UPI apps installed (chooser); pending outcomes; network changes during the switch; old app versions without
      UPI; accessibility of the new screens.

      Environments: real devices for app switching, process death, pending and network conditions; emulators in CI for screen logic and
      error states with mocked responses; cloud for breadth.

      Conditions: mobile data and weak signal, battery saver on, large fonts and screen reader, dark mode.

      Exit criteria: UPI journeys (success, decline, pending then success, abandon) pass on all P1 devices; no open critical defects;
      beta crash-free rate at or above the target; payment completion in beta comparable to cards.
    rubric:
      - Built a tiered matrix justified by the analytics
      - Included the oldest supported OS and a low-memory device
      - Listed app-switch and process-death risks for UPI
      - Covered no UPI app and several UPI apps installed
      - Assigned risks to emulators, real devices and the cloud
      - Defined test conditions such as network, battery saver and accessibility
      - Wrote measurable exit criteria
    solution: |
      Compare with the model answer. The most valuable line is **process death during the UPI app switch** - it is the mobile-specific
      way payments get lost.
    followUp: |
      Which of these risks would you also add to the API test plan, and which are purely client-side?

  - id: order-planning
    type: order
    concept: device-coverage-matrix
    skill: recall
    title: Planning in order
    prompt: Put the steps of planning mobile testing in order.
    items:
      - id: analytics
        text: Collect usage and payment analytics by OS, model, screen and app version
      - id: range
        text: Agree the supported range with the product owner
      - id: matrix
        text: Draft the coverage matrix in tiers with reasons
      - id: risks
        text: List the mobile risks of this release
      - id: environments
        text: Assign each risk to emulators, real devices or a device cloud
      - id: exit
        text: Define conditions and exit criteria
    hints:
      - The matrix can't be drafted before you know the supported range.
    solution: |
      Analytics → supported range → matrix → risks → environments → conditions and exit criteria. Review it every quarter.

  - id: interview-mobile-plan
    type: interview
    concept: mobile-specific-risks
    skill: application
    title: "Interview: how would you plan testing for our app?"
    prompt: |
      *"We have an Android and iOS shopping app with in-app payments. How would you decide what to test and on which devices?"*
      Answer as you would in the interview.
    hints:
      - Data, risks, environments, exit criteria.
    modelAnswer: |
      I'd start with data: our analytics for sessions and especially payments by OS version, device model, screen size and app
      version, plus the supported range we've agreed. From that I'd build a tiered matrix - P1 devices that cover most payments plus the
      oldest supported OS on real devices every release, P2 for breadth on a device cloud, P3 for tablets or foldables less often.

      Then the risks that are specific to mobile: unreliable networks and switching; interruptions like calls and notifications; the OS
      killing the app in the background, which matters a lot for payments that switch to a banking or UPI app; permissions granted,
      denied and revoked; old app versions still calling the API; battery savers, especially on some manufacturers; accessibility; and
      store review rules.

      I'd run fast checks on emulators and simulators in CI, critical journeys and payments on real devices, and breadth on a device cloud,
      with conditions like weak mobile data, battery saver, large fonts and a screen reader. Exit criteria: critical journeys pass on P1
      devices, no open critical defects, and a beta crash-free rate and payment completion rate at the agreed targets.
    rubric:
      - Based device choice on the app's own analytics, including payments
      - Used a tiered matrix including the oldest supported OS
      - Listed mobile-specific risks, including process death during app switches
      - Mentioned old app versions and store review
      - Split work between emulators, real devices and a device cloud
      - Defined measurable exit criteria
    followUps:
      - How often would you review the matrix?
      - What would you test on an emulator, and what never only on an emulator?
      - How do you test accessibility on mobile?
    solution: |
      Strong answers show **data-driven choice** and **mobile-specific risks**, not a list of phone names.

  - id: explain-old-versions
    type: short
    concept: mobile-specific-risks
    skill: recall
    title: Why test old app versions
    prompt: In two or three sentences, explain why a mobile test plan includes old app versions, and what the app and API should do about them.
    hints:
      - Who decides when an installed app is updated?
    modelAnswer: |
      Users update installed apps when they choose, so older versions keep running and calling the API for months. The API must stay
      compatible with every version still allowed, and the app should have a minimum-version check that shows a clear forced-update
      screen when a version is no longer supported.
    rubric:
      - Said users control updates so old versions stay in use
      - Said the API must stay compatible with supported versions
      - Mentioned a minimum version or forced-update mechanism
    solution: |
      Test both: the oldest supported version against the new API, and a version just below the minimum showing the forced update.

placement:
  - id: place-matrix
    type: mcq
    concept: device-coverage-matrix
    skill: application
    title: The oldest supported OS
    prompt: Why should the oldest OS version you support usually be in the high-priority tier of the matrix?
    options:
      - id: risk
        text: APIs and behaviours differ most from the newest version there, so defects are likely - and real customers still use it
        feedback: Correct - old versions combine real usage with the highest chance of compatibility defects.
      - id: popular
        text: It is always the most popular version
        feedback: Rarely - it is usually a minority, but a risky one.
      - id: fast
        text: Tests run faster on old versions
        feedback: Speed has nothing to do with it.
      - id: store
        text: The app stores require it
        feedback: Stores don't require testing on your minimum version; the risk does.
    correct: [risk]
    solution: |
      **Risk plus real usage.** If nobody uses it, raise the minimum instead of testing it.

  - id: place-risks
    type: mcq
    concept: mobile-specific-risks
    skill: application
    title: The missing test area
    prompt: A mobile test plan covers functional tests, layouts on four screen sizes and dark mode. Which mobile-specific area is most clearly missing for a payments app?
    options:
      - id: interruptions
        text: Interruptions and process death during payment - calls, app switches, the OS killing the app
        feedback: Correct - these are where mobile payments get lost or duplicated.
      - id: fonts
        text: Font licensing
        feedback: Not a testing risk in this sense.
      - id: server-perf
        text: Database indexing
        feedback: A server concern, not mobile-specific.
      - id: logos
        text: Logo colours
        feedback: Cosmetic, not a mobile-specific risk area.
    correct: [interruptions]
    solution: |
      **Interruptions and lifecycle.** Add network conditions, permissions and old app versions too.

  - id: place-env
    type: mcq
    concept: test-environment-mix
    skill: analysis
    title: Emulator limits
    prompt: Which statement about the Android Emulator and iOS Simulator is true?
    options:
      - id: limits
        text: They are fast and scriptable but don't reproduce real radios, real performance or manufacturer customisations
        feedback: Correct - great for CI and quick checks, not a replacement for real devices.
      - id: same
        text: They are identical to real devices
        feedback: They differ in performance, radios, sensors and, on Android, manufacturer changes.
      - id: useless
        text: They are useless for testing
        feedback: They are excellent for fast, repeatable checks and automation.
      - id: payments
        text: They are the best place to test real banking-app switches
        feedback: Those need real devices with the real apps installed.
    correct: [limits]
    solution: |
      **Fast but limited.** Use them in CI; keep real devices for P1 journeys and payments.

recall:
  - id: recall-matrix-dims
    concept: device-coverage-matrix
    prompt: Name five dimensions of a mobile coverage matrix.
    answer: OS versions, manufacturers and models, screen sizes and densities, hardware tiers, form factors - and app versions in the field.
  - id: recall-data
    concept: device-coverage-matrix
    prompt: What data should drive the device matrix?
    answer: The app's own analytics - sessions and payments by OS, model, screen and app version - plus deliberate risk picks.
  - id: recall-risks
    concept: mobile-specific-risks
    prompt: Name five mobile-specific risks.
    answer: Unreliable networks, interruptions and process death, permissions, fragmentation, old installed versions, store review, resources, accessibility, deep links.
  - id: recall-accessibility
    concept: mobile-specific-risks
    prompt: Which built-in tools do you use to test mobile accessibility?
    answer: TalkBack on Android and VoiceOver on iOS, plus large font sizes, contrast settings and touch target checks.
  - id: recall-env
    concept: test-environment-mix
    prompt: What is each test environment best for?
    answer: Emulators and simulators - fast, scriptable CI checks; real devices - critical journeys, performance, payments and interruptions; device clouds - breadth across models and versions.
  - id: recall-exit
    concept: test-environment-mix
    prompt: Give three exit criteria for a mobile release.
    answer: Critical journeys pass on all P1 devices, no open critical defects, and the beta crash-free rate meets the agreed target.

