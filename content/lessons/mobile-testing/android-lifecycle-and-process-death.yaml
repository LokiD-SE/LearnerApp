id: android-lifecycle-and-process-death
title: Android lifecycle, configuration changes and process death
subject: mobile-testing
module: android-testing
level: intermediate
status: published
estimatedMinutes: 50
summary: The six activity lifecycle callbacks, why rotation and other configuration changes recreate a screen, how and why Android kills app processes, what survives (ViewModel, saved state, storage) - and the exact ways a tester simulates process death and proves the app restores correctly.
tags: [mobile, android, activity lifecycle, configuration change, process death, saved state, viewmodel, adb, don't keep activities]

environment: |
  - **Platform documentation (primary source):**
    - [The activity lifecycle](https://developer.android.com/guide/components/activities/activity-lifecycle) - "a core set of six
      callbacks": `onCreate`, `onStart`, `onResume`, `onPause`, `onStop`, `onDestroy`; configuration changes destroy and recreate the
      activity by default; "The system never kills an activity directly to free up memory. Instead, it kills the process"; the table of
      process states and their likelihood of being killed.
    - [Save UI states](https://developer.android.com/topic/libraries/architecture/saving-states) - which of ViewModel, saved state
      and persistent storage survive configuration changes, system-initiated process death and the user closing the screen.
    - [Android Debug Bridge (adb)](https://developer.android.com/tools/adb) - `am kill` "kills only processes that are safe to kill
      and that will not impact the user experience"; `am force-stop`; `pm clear`.
  - **Version-specific:** developer options, background limits and manufacturer battery optimisations vary by Android version and
    device; check on the devices in your matrix.
  - **Fictional:** the demo shop app's package name `com.sandpay.demoshop`.

prerequisites:
  - interruptions-and-lifecycle

concepts:
  - id: android-activity-lifecycle
    name: The activity lifecycle
    summary: onCreate, onStart, onResume, onPause, onStop and onDestroy mark an activity becoming created, visible, interactive, partly hidden, hidden and destroyed - and each transition has typical defects.
  - id: android-configuration-changes
    name: Configuration changes
    summary: Rotation, dark mode, language, font scale and window size changes destroy and recreate the activity by default, so anything not kept in a ViewModel or saved state is lost.
  - id: process-death-testing
    name: Simulating and testing process death
    summary: Android kills background processes to free memory and recreates them when the user returns; testers simulate it with adb am kill on a backgrounded app and check that saved and persistent state restore correctly.

objectives:
  - Describe the six lifecycle callbacks and the user actions that trigger them.
  - Test configuration changes and explain which state they destroy.
  - Simulate process death reliably and distinguish it from force-stop and from "Don't keep activities".
  - Verify that state restores correctly after process death, including in-progress operations.

sections:
  - id: intuition
    kind: intuition
    concepts: [process-death-testing]
    title: The idea in plain language
    body: |
      Imagine a library that is short of desks. When you go for coffee, a librarian may **clear your desk** to give it to someone
      else - but she leaves a **note** with the page you were on. When you come back, she rebuilds your desk from the note. If you wrote
      something important on a loose sheet instead of in the note, it's gone.

      Android does exactly this. When your app is out of sight and the phone needs memory, Android **kills the app's process**. When the
      user comes back, Android **recreates** the app and hands it its "note" - the saved state. To the user it should look as if nothing
      happened.

      Apps that keep important things only "on loose sheets" - in memory - lose them. And because powerful test phones rarely run out of
      memory, this defect hides from casual testing. A tester has to **clear the desk on purpose**.

  - id: what
    kind: what
    concepts: [android-activity-lifecycle]
    title: What the lifecycle callbacks mean
    body: |
      From the Android documentation:

      | Callback | Called when | Typical defect to look for |
      |---|---|---|
      | `onCreate` | the activity is first created - "basic application startup logic that happens only once"; receives `savedInstanceState` (null the first time) | state not restored from `savedInstanceState` after recreation |
      | `onStart` | the activity becomes visible | data shown before it is refreshed |
      | `onResume` | it comes to the foreground and "interacts with the user" | camera, sensors or location not restarted |
      | `onPause` | "the first indication that the user is leaving" - not necessarily destroyed | work done here is cut short; the docs warn `onPause` "does not offer enough time" for saving data |
      | `onStop` | no longer visible | resources not released; saving not done |
      | `onDestroy` | the activity is finishing **or** being destroyed for a configuration change | treating every destroy as "user left" - check `isFinishing` |

      Process states and how likely Android kills them (documentation, Table 1):

      | Likelihood of being killed | Process state | Activity state |
      |---|---|---|
      | lowest | foreground (has or is about to get focus) | resumed |
      | low | visible (no focus) | started / paused |
      | higher | background (invisible) | stopped |
      | highest | empty | destroyed |

  - id: internals
    kind: internals
    concepts: [android-configuration-changes, process-death-testing]
    title: How configuration changes and process death differ
    body: |
      **Configuration change** (rotation, dark mode, language, font scale, window size, keyboard): "the system destroys the activity by
      default ... wiping away any UI state stored in the activity instance", and "immediately creates a new activity instance". The
      process stays alive, so **ViewModels survive**.

      **Process death**: the app is in the background; the system kills the whole process. When the user returns (from the recent apps
      screen or the launcher), Android starts a **new process**, recreates the activity stack and passes the **saved instance state**.
      ViewModels, singletons and caches are **gone**.

      What survives - from "Save UI states":

      | | ViewModel | Saved state (`SavedStateHandle`, `rememberSaveable`) | Persistent storage |
      |---|---|---|---|
      | configuration change | yes | yes | yes |
      | system-initiated process death | **no** | yes | yes |
      | user dismisses the screen (Back, `finish()`) | no | no | yes |

      **Simulation methods - and what they really simulate:**

      | Method | What it does | Simulates process death? |
      |---|---|---|
      | App in background, then `adb shell am kill <package>` | kills processes "that are safe to kill" | **yes** - closest to the real thing |
      | `adb shell am force-stop <package>` | "Force-stop everything associated with package" | **no** - like the user force-stopping it; saved state is not restored |
      | Developer options → **Don't keep activities** | destroys each activity as soon as the user leaves it | partly - activity recreation with saved state, but the process (and ViewModels) may survive |
      | Developer options → **Background process limit: No background processes** | kills processes when they go to the background | yes, broadly - but affects all apps |
      | Low-memory device, many apps opened | natural process death | yes - realistic but not on demand |

  - id: visual
    kind: visual
    concepts: [process-death-testing, android-activity-lifecycle]
    title: "Sequence diagram: process death and restoration"
    body: |
      What happens when the user leaves the checkout for the banking app, Android kills the shop app, and the user returns.

      ```mermaid
      sequenceDiagram
          participant U as User
          participant A as Shop app process
          participant OS as Android system
          participant S as Shop server
          U->>A: On checkout, opens the banking app
          A->>A: onPause, onStop, onSaveInstanceState - saves order ORD-1042 in saved state
          OS->>A: Kills the process to free memory
          U->>OS: Returns via recent apps
          OS->>A: New process, onCreate with savedInstanceState
          A->>A: Restore checkout screen for ORD-1042
          A->>S: GET payment status for ORD-1042
          S-->>A: authorized
          A->>U: Shows "Payment successful"
      ```

      Notice the app **re-asks the server** after restoring - the payment may have completed while the process was dead.

  - id: why
    kind: why
    concepts: [android-configuration-changes]
    title: Why these defects reach production
    body: |
      - **Developers' phones are fast and have lots of memory.** Process death rarely happens there - and real users with mid-range or
        older phones, or aggressive manufacturer battery savers, hit it daily.
      - **Rotation gets disabled, other changes don't.** Many apps lock portrait orientation and assume configuration changes are gone -
        but dark mode, language, font scale and multi-window still recreate activities.
      - **ViewModel gives a false sense of safety.** It survives rotation, so rotation tests pass - and process death still loses
        everything.
      - **Restored screens show stale data.** The activity comes back with its saved state, but the world moved on (a payment completed,
        a session expired). Apps must refresh, not just restore.

  - id: steps
    kind: steps
    concepts: [process-death-testing]
    title: Step by step - testing process death
    body: |
      With a device or emulator connected (`adb devices` lists it) and a debug or test build of the app:

      1. **Open the screen** you want to test and put it in an interesting state: type into a form, start a checkout, scroll a list.
      2. **Send the app to the background**: press Home, or switch to another app (the banking app, Messages).
      3. **Kill the process**:

         ```bash
         adb shell am kill com.sandpay.demoshop
         ```

         It only kills processes that are safe to kill - the app must be in the background.
      4. **Check it is gone**: `adb shell pidof com.sandpay.demoshop` prints nothing.
      5. **Return through the recent apps screen** (not the launcher icon, which may start a fresh task depending on the app's set-up).
      6. **Check**: the same screen, the input, the scroll position - and, for operations in progress, that the app re-checked the server.
      7. **Repeat with "Don't keep activities"** for multi-screen flows, and on a low-memory device for realism.
      8. **Configuration changes**: rotate, switch dark mode, change the font size and language while input is on screen.

  - id: example
    kind: example
    concepts: [process-death-testing, android-configuration-changes]
    title: "Real-world example: the crash after returning from the camera"
    body: |
      The demo shop app lets customers photograph a damaged item for a return. Crash reports show `NullPointerException` in
      `ReturnPhotoActivity.onCreate` - only on some phones, only after taking a photo.

      The tester reproduces it: open the return form, tap "Take photo" (the camera app opens and the shop app goes to the background),
      run `adb shell am kill com.sandpay.demoshop`, take the photo and confirm. Crash.

      Cause: the activity kept the selected order in a field set by the previous screen; after process death, the field is null and the
      camera's result arrives in a freshly created activity that never received it. On a flagship phone the process survives the camera,
      so developers never saw it.

      Fixes: put the order id in the activity's saved state (or arguments), and handle the camera result after restoration. New tests:
      process death during the camera step, with and without "Don't keep activities"; rotation on the form; dark-mode switch with a photo
      attached.

  - id: code
    kind: code
    concepts: [process-death-testing, android-configuration-changes]
    title: Commands for lifecycle testing
    collapsed: true
    body: |
      ```bash
      # which devices are connected
      adb devices -l

      # is the app running? (prints the process id)
      adb shell pidof com.sandpay.demoshop

      # simulate process death - app must be in the background first (press Home)
      adb shell am kill com.sandpay.demoshop

      # NOT process death: stops everything, like the user force-stopping the app
      adb shell am force-stop com.sandpay.demoshop

      # start fresh with no data at all (also not process death)
      adb shell pm clear com.sandpay.demoshop

      # follow the app's logs while you test (see the adb and logcat lesson for filters)
      adb logcat --pid=$(adb shell pidof com.sandpay.demoshop)
      ```

      Configuration changes can be triggered from the device's quick settings (dark mode, auto-rotate), the system settings (font size,
      language) or, on the emulator, its controls. Check `adb shell cmd uimode help` on your device for UI-mode commands - availability
      differs by Android version.

  - id: tests
    kind: tests
    concepts: [process-death-testing, android-configuration-changes, android-activity-lifecycle]
    title: Positive and negative test cases
    body: |
      | ID | Set-up | Action | Expected | Evidence |
      |---|---|---|---|---|
      | L1 | address half typed | rotate | input kept | screen recording |
      | L2 | address half typed | switch to dark mode | input kept | recording |
      | L3 | address half typed | background, `am kill`, return via recents | same screen, input kept | recording, `pidof` before/after |
      | L4 | checkout, payment approved in the banking app | `am kill` while in the banking app, return | app re-checks the server, shows the true result | recording, server request in logs |
      | L5 | return form, camera open | `am kill`, take photo, confirm | photo attached, no crash | logcat, recording |
      | L6 | multi-step flow | "Don't keep activities" on, go back and forth | each screen restores its state | recording |
      | L7 | signed in | `am kill`, return after the session expired | sign-in prompt, then back to the same screen | recording |
      | L8 | list scrolled far | `am kill`, return | scroll position restored (or deliberately reset, as designed) | recording |
      | N1 | checkout restored after process death | - | no second payment request sent automatically | server logs |

  - id: mistakes
    kind: mistakes
    concepts: [process-death-testing, android-configuration-changes]
    title: Common mistakes and how to avoid them
    body: |
      - **Using force-stop to simulate process death.** It isn't the same - use `am kill` on a backgrounded app.
      - **Returning via the launcher icon.** Use the recent apps screen to resume the task.
      - **Testing only rotation.** Dark mode, language, font scale and window size changes recreate activities too.
      - **Trusting ViewModel tests.** Passing rotation doesn't prove process-death safety.
      - **Restoring without refreshing.** After restoration, re-check anything that may have changed on the server.
      - **Only flagship devices.** Repeat on a low-memory device and on manufacturers with aggressive battery savers.

  - id: summary
    kind: summary
    title: Summary and quick reference
    body: |
      - Callbacks: **onCreate → onStart → onResume → onPause → onStop → onDestroy** (Android docs).
      - **Configuration change** = activity destroyed and recreated; ViewModels survive.
      - **Process death** = the whole process killed in the background; only **saved state** and **persistent storage** come back.
      - Simulate: background the app, **`adb shell am kill <package>`**, return via **recents**. Not `force-stop`. Also "Don't keep
        activities" and low-memory devices.
      - After restore: **same screen and input**, and **re-check server-side outcomes**.

exercises:
  - id: simulate-method
    type: mcq
    concept: process-death-testing
    skill: application
    title: Simulating process death
    prompt: Which procedure best simulates the system killing your app in the background?
    options:
      - id: am-kill
        text: Put the app in the background, run adb shell am kill <package>, then return through the recent apps screen
        feedback: Correct - am kill only kills processes safe to kill (backgrounded), and returning via recents restores the task with its saved state.
      - id: force-stop
        text: Run adb shell am force-stop <package> while the app is open, then open it again
        feedback: Force-stop behaves like the user force-stopping the app - saved state isn't restored, so it doesn't test restoration.
      - id: pm-clear
        text: Run adb shell pm clear <package>
        feedback: That deletes all the app's data - a fresh install state, not process death.
      - id: uninstall
        text: Uninstall and reinstall the app
        feedback: That tests installation, not restoration after process death.
    correct: [am-kill]
    hints:
      - Which command kills processes that are "safe to kill"?
    solution: |
      **Background, `am kill`, return via recents.** Confirm with `adb shell pidof <package>` that the process was really gone.
    followUp: |
      Why might `am kill` do nothing if you forget to send the app to the background first?

  - id: viewmodel-trap
    type: mcq
    concept: android-configuration-changes
    skill: analysis
    title: Rotation passes, process death fails
    prompt: |
      A screen keeps the user's input in a ViewModel. Rotation tests pass, but after `am kill` and returning, the input is gone. Why?
    options:
      - id: viewmodel
        text: A ViewModel survives configuration changes but not process death
        feedback: Correct - Android's "Save UI states" table says so; the input needs saved state (for example SavedStateHandle).
      - id: rotation-broken
        text: The rotation tests were wrong
        feedback: They were right - ViewModels do survive rotation; they just don't cover process death.
      - id: am-kill-wrong
        text: am kill deletes app data
        feedback: am kill kills the process; it doesn't delete data. pm clear deletes data.
      - id: launcher
        text: The app should never be killed
        feedback: Android kills background processes when it needs memory - apps must handle it.
    correct: [viewmodel]
    hints:
      - Look at the "survives system-initiated process death" row.
    solution: |
      **ViewModel doesn't survive process death.** Use `SavedStateHandle` (or `rememberSaveable`) for small UI state, persistent storage
      for important data.
    followUp: |
      Which of these should go in saved state, and which in persistent storage - the typed address, or "order ORD-1042 is being paid"?

  - id: debug-restore
    type: debug
    concept: process-death-testing
    skill: analysis
    title: The restored checkout that pays again
    prompt: After process death during payment, some users are charged twice. Click the line responsible.
    language: kotlin
    code: |
      class CheckoutViewModel(private val handle: SavedStateHandle, private val api: ShopApi) : ViewModel() {
          val orderId: String = handle["orderId"] ?: error("no order")
          init {
              if (handle.get<Boolean>("paymentStarted") == true) {
                  viewModelScope.launch { api.pay(orderId) }
              }
          }
          fun pay() {
              handle["paymentStarted"] = true
              viewModelScope.launch { api.pay(orderId) }
          }
      }
    correctLines: [5]
    lineNotes:
      - line: 2
        note: Restoring the order id from saved state is correct.
      - line: 9
        note: Recording that the payment started is useful - the problem is what happens with it on restore.
    hints:
      - What does the restored ViewModel do when it sees that a payment had started?
    solution: |
      **Line 5.** On restoration after process death, the ViewModel sends the payment **again**. It should instead **ask the server for
      the status** of the payment for `orderId` and show it - the first request may well have succeeded while the app was dead. (The server
      should also be idempotent per attempt - see [idempotency keys](#/lesson/idempotency-keys).)
    followUp: |
      Write the test case that catches this, with the exact adb steps.

  - id: lifecycle-tests
    type: testdesign
    concept: android-configuration-changes
    skill: application
    title: Lifecycle tests for a sign-up form with a photo
    prompt: |
      A sign-up screen has name and email fields and a "Take profile photo" button that opens the camera. Design lifecycle tests:
      configuration changes, process death at the riskiest moments, and returning after a long time. For each, give the exact
      steps (including adb commands), the expected result and the evidence.
    hints:
      - The camera step sends the app to the background - perfect for process death.
      - List every configuration change, not only rotation.
    modelAnswer: |
      1. Type name and email → rotate → fields kept. Evidence: recording.
      2. Same → switch dark mode, change font size, change language → fields kept, layout correct. Evidence: screenshots.
      3. Type → Home → `adb shell am kill <package>` → `adb shell pidof <package>` empty → return via recents → fields kept. Evidence:
         recording, pidof output.
      4. Tap "Take photo" (camera opens) → `am kill` → take and confirm the photo → back on sign-up with fields and photo, no crash.
         Evidence: recording, logcat without exceptions.
      5. Developer option "Don't keep activities" on → go to the camera and back, and to another screen and back → state kept. Evidence:
         recording.
      6. Background for 2 hours on a low-memory device → return → either restored with fields, or a clear restart if the design says
         so. Evidence: recording.
      7. After restore, submit → exactly one account created. Evidence: server record.
    rubric:
      - Covered rotation and at least two other configuration changes
      - Used am kill on a backgrounded app and confirmed the process was gone
      - Returned via recent apps
      - Tested process death during the camera step
      - Used Don't keep activities or a low-memory device
      - Checked server-side effects after restoration
      - Named evidence for each test
    solution: |
      Compare with the model answer. Test 4 is the one that finds real crashes - external apps like the camera are where process death
      happens naturally.
    followUp: |
      Which of these would you automate with an instrumentation or Appium test, and how would you trigger process death there?

  - id: order-callbacks
    type: order
    concept: android-activity-lifecycle
    skill: recall
    title: Callbacks when leaving and returning
    prompt: A user opens a screen, then switches to another app, then the system destroys the activity. Put the callbacks in order.
    items:
      - id: create
        text: onCreate
      - id: start
        text: onStart
      - id: resume
        text: onResume
      - id: pause
        text: onPause
      - id: stop
        text: onStop
      - id: destroy
        text: onDestroy
    hints:
      - Created, visible, interactive - then the reverse.
    solution: |
      onCreate → onStart → onResume → onPause → onStop → onDestroy. If the **process** is killed instead, onDestroy may never be called -
      which is why saving belongs in onStop or saved state, not in onDestroy.

  - id: battery-drain
    type: mcq
    concept: android-activity-lifecycle
    skill: application
    title: Location updates after leaving
    prompt: |
      Battery reports show the demo shop app using GPS for an hour after users leave the store-finder screen for another app. Which
      lifecycle handling is most likely missing, and how would you test the fix?
    options:
      - id: stop-updates
        text: Location updates aren't stopped in onPause or onStop - test by leaving the screen and checking that location requests end
        feedback: Correct - resources acquired for a visible screen must be released when it is no longer visible.
      - id: oncreate
        text: Location updates should be started in onCreate instead
        feedback: Where they start isn't the problem; they are never stopped when the screen is left.
      - id: ondestroy-only
        text: Stopping them in onDestroy is enough
        feedback: onDestroy may come much later - or never, if the process is killed - so the GPS keeps running meanwhile.
      - id: permission
        text: The location permission should be revoked automatically
        feedback: Permissions are the user's choice; the app must stop using the resource when it doesn't need it.
    correct: [stop-updates]
    hints:
      - Which callbacks mean "the user can no longer see this screen"?
    solution: |
      **Release in onPause / onStop, reacquire in onResume / onStart.** Test: open the store finder, switch to another app, and check
      with the device's location indicator or `adb shell dumpsys location` (output varies by version) that the app no longer requests
      location.
    followUp: |
      Which other resources follow the same rule? Name two and the test for each.

  - id: interview-android
    type: interview
    concept: process-death-testing
    skill: application
    title: "Interview: what is process death?"
    prompt: |
      *"What is process death on Android, and how do you test for it?"* Answer as you would in the interview.
    hints:
      - Explain it, distinguish it from configuration changes and force-stop, then the procedure and what you check.
    modelAnswer: |
      When an app is in the background and the system needs memory, Android kills the app's whole process - the docs say it never kills
      activities directly, it kills the process. When the user comes back, Android starts a new process and recreates the activities,
      handing them their saved instance state. Anything only in memory - ViewModels, singletons, caches - is gone. That's different from a
      configuration change like rotation, where the activity is recreated but the process and ViewModels survive, and from force-stop,
      which is like the user stopping the app - saved state isn't restored.

      To test it, I put the screen into an interesting state, send the app to the background, run adb shell am kill with the package name,
      check with pidof that it's gone, and return through the recent apps screen. I check the same screen, the input and the scroll
      position come back, and that anything in progress - especially a payment - is re-checked with the server rather than repeated or
      forgotten. I also use "Don't keep activities" for multi-screen flows and a low-memory device for realistic cases, and I do it at the
      moments where the app naturally goes to the background - the camera, a banking app, an OTP in Messages.
    rubric:
      - Explained that the system kills the process of a backgrounded app to free memory
      - Distinguished process death from configuration changes and force-stop
      - Said only saved state and persistent storage survive
      - Gave the am kill procedure with return via recents
      - Checked restoration of screen and input
      - Checked in-progress operations are re-checked, not repeated
      - Tested at natural background moments (camera, banking app)
    followUps:
      - Why might developers never see these defects?
      - How would you automate a process-death test?
      - What about iOS - is there an equivalent?
    solution: |
      The distinction from **force-stop** and the **re-check on restore** are what interviewers listen for.

  - id: explain-onpause
    type: short
    concept: android-activity-lifecycle
    skill: recall
    title: Why not save in onPause or onDestroy
    prompt: In two or three sentences, explain why apps shouldn't rely on onPause or onDestroy to save important data.
    hints:
      - What do the docs say about onPause's time, and when is onDestroy not called?
    modelAnswer: |
      The Android documentation warns that onPause doesn't offer enough time for saving work, and when the system kills the process in the
      background, onDestroy may never be called. Important data should be saved as it changes or in onStop, small UI state in saved instance
      state, and anything critical in persistent storage or on the server.
    rubric:
      - Said onPause doesn't give enough time
      - Said onDestroy may not run when the process is killed
      - Named better places (saved state, onStop, persistent storage)
    solution: |
      That is also why process-death tests catch defects that "close and reopen" tests never do.

placement:
  - id: place-config
    type: mcq
    concept: android-configuration-changes
    skill: application
    title: Which survives rotation?
    prompt: On rotation, Android destroys and recreates the activity. Which state survives without extra work?
    options:
      - id: viewmodel
        text: Data held in a ViewModel
        feedback: Correct - ViewModels are retained across configuration changes.
      - id: field
        text: A field of the activity class
        feedback: The activity instance is destroyed, and its fields with it.
      - id: local
        text: A local variable in onCreate
        feedback: onCreate runs again in the new instance; locals from the old one are gone.
      - id: none
        text: Nothing - everything is lost
        feedback: ViewModels and saved state survive; activity fields don't.
    correct: [viewmodel]
    solution: |
      **The ViewModel.** But not after process death - that needs saved state.

  - id: place-kill
    type: mcq
    concept: process-death-testing
    skill: application
    title: force-stop or kill?
    prompt: Why is `adb shell am force-stop` not a good way to test process-death restoration?
    options:
      - id: not-restore
        text: It acts like the user force-stopping the app, so the saved state isn't restored when the app is opened again
        feedback: Correct - use am kill on a backgrounded app instead.
      - id: deletes
        text: It deletes the app's data
        feedback: That is pm clear; force-stop keeps data.
      - id: needs-root
        text: It needs a rooted device
        feedback: It works through adb on normal devices with USB debugging.
      - id: same
        text: It is fine - it is the same as process death
        feedback: The system treats them differently; force-stop doesn't lead to restoration from saved state.
    correct: [not-restore]
    solution: |
      **No restoration.** Background the app, `am kill`, return via recents.

  - id: place-lifecycle
    type: mcq
    concept: android-activity-lifecycle
    skill: analysis
    title: Camera and sensors after returning
    prompt: A barcode-scanner screen shows a black preview after the user returns from another app. Which callback most likely misses its work?
    options:
      - id: resume
        text: onResume - the camera isn't restarted when the activity comes back to the foreground
        feedback: Correct - resources released when leaving must be reacquired in onResume (or onStart).
      - id: create
        text: onCreate - it isn't called on return from another app
        feedback: onCreate isn't called when returning to an activity that is still alive - which is exactly why the camera must be restarted in onResume or onStart.
      - id: destroy
        text: onDestroy - it should restart the camera
        feedback: onDestroy runs when the activity is going away, not when it returns.
      - id: none
        text: None - black previews are always device defects
        feedback: Most are lifecycle handling in the app.
    correct: [resume]
    solution: |
      **onResume.** Test leave-and-return on every screen using the camera, sensors or location.

recall:
  - id: recall-callbacks
    concept: android-activity-lifecycle
    prompt: Name the six core activity lifecycle callbacks in order.
    answer: onCreate, onStart, onResume, onPause, onStop, onDestroy.
  - id: recall-kill-likelihood
    concept: android-activity-lifecycle
    prompt: Which process states are most and least likely to be killed by Android?
    answer: Empty processes are most likely, then background (stopped); foreground (resumed) processes are least likely.
  - id: recall-config
    concept: android-configuration-changes
    prompt: Name four configuration changes that recreate an activity by default.
    answer: Rotation, dark mode (UI mode), language, font scale - also window size or multi-window changes and keyboard changes.
  - id: recall-survival
    concept: android-configuration-changes
    prompt: What survives a configuration change and what survives process death?
    answer: ViewModel and saved state survive configuration changes; only saved state and persistent storage survive process death.
  - id: recall-am-kill
    concept: process-death-testing
    prompt: How do you simulate process death with adb?
    answer: Put the app in the background, run adb shell am kill with the package name, check pidof is empty, and return via recent apps.
  - id: recall-dont-keep
    concept: process-death-testing
    prompt: What does the developer option "Don't keep activities" do?
    answer: It destroys each activity as soon as the user leaves it, testing recreation from saved state - but the process may survive, so it isn't full process death.

