placement:
  - id: place-stage
    type: mcq
    concept: ci-pipeline-stages
    skill: application
    title: The 50-minute pull request
    prompt: |
      Every pull request runs the whole suite - unit tests, API tests and 60 UI journeys - in one job that
      takes 50 minutes. Developers have started merging before it finishes. What is the best first change?
    options:
      - id: split
        text: Split into a fast required job (unit, API, a few smoke journeys) and run the full UI suite after merge or nightly
        feedback: Correct - the gate must be fast enough that people wait for it; the rest still runs, later.
      - id: retries
        text: Add automatic re-runs so the job fails less often
        feedback: Re-runs make it slower and hide flakiness; the problem is feedback time.
      - id: drop-ui
        text: Delete the UI journeys
        feedback: They still find defects; move them to a later stage instead of losing them.
      - id: bigger-timeout
        text: Raise timeout-minutes so the job never times out
        feedback: The job isn't timing out - it is too slow to be waited for.
    correct: [split]
    solution: |
      **Tier the pipeline.** A pull-request gate that takes minutes, required by branch protection; the
      slow suites after merge or nightly, with someone owning their failures.

  - id: place-failsafe-gate
    type: mcq
    concept: ci-quality-gate
    skill: analysis
    title: Integration failures, green job
    prompt: |
      The CI step runs `mvn -B verify`. The log shows Failsafe running `CheckoutIT` with two failures,
      then `BUILD SUCCESS`, and the job is green. The pom has the Failsafe plugin with one execution whose
      goals list contains only `integration-test`. What is wrong?
    options:
      - id: no-verify
        text: The verify goal is missing - integration-test records failures without failing the build
        feedback: Correct - Failsafe deliberately doesn't fail in integration-test, so post-integration-test can clean up; its verify goal fails the build.
      - id: wrong-phase
        text: The command should be mvn integration-test
        feedback: Failsafe's documentation says to run mvn verify; integration-test would also skip post-integration-test clean-up, and still never fail.
      - id: batch-mode
        text: The -B flag hides test failures
        feedback: Batch mode only makes Maven non-interactive; it doesn't change the result.
      - id: required
        text: The job isn't a required status check
        feedback: That would let a red job merge - but this job is green, so the problem is earlier.
    correct: [no-verify]
    solution: |
      **Add the `verify` goal** to the Failsafe execution. `integration-test` runs and records;
      `verify` reads `target/failsafe-reports` and fails the build, which is what turns the job red.

  - id: place-secret
    type: mcq
    concept: ci-secrets-handling
    skill: application
    title: Storing the SandPay credentials
    prompt: |
      The UI suite needs a SandPay sandbox API key and a test merchant password. Which setup is safest in
      GitHub Actions?
    options:
      - id: separate-env
        text: Two separate secrets in an environment limited to main, passed through env on the step that runs Maven
        feedback: Correct - one value per secret keeps redaction working, and only the job and step that need them get them.
      - id: json
        text: One secret holding a JSON object with both values, exported at the top of the workflow
        feedback: GitHub warns that structured data can make log redaction fail, and workflow-level env gives every step the values.
      - id: base64-file
        text: A Base64-encoded properties file committed to the repository
        feedback: Base64 is encoding, not encryption; anyone who can read the repository can decode it.
      - id: cli-arg
        text: Pass them as -Dsandpay.key=... on the Maven command line, printed in the log so failures are easy to debug
        feedback: GitHub advises against passing secrets on the command line, and printing them defeats the point.
    correct: [separate-env]
    solution: |
      **One secret per value, scoped to an environment, delivered as environment variables to the one step
      that needs them.** Add `permissions: contents: read` and keep those jobs off fork pull requests.
