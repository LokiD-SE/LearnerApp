placement:
  - id: place-boundaries
    type: mcq
    concept: e2e-check-placement
    skill: application
    title: Thirty refund boundaries
    prompt: |
      A team wants to verify 30 refund-amount combinations (full, partial, exactly refundable, one minor unit over,
      several small refunds). Where should most of them run?
    options:
      - id: api
        text: In the API (or component) suite, with one over-refund journey kept end to end
        feedback: Correct - many cases, exact amounts, no browser; the journey proves only that the error reaches the customer.
      - id: ui
        text: In the end-to-end UI suite, because that is what the customer uses
        feedback: Thirty browser journeys are slow and flaky, and the screen doesn't show the totals you need to check.
      - id: data-only
        text: Only as data checks on the ledger, without calling the API
        feedback: The ledger proves invariants after the fact; the rule that refuses an over-refund is an API behaviour.
      - id: manual
        text: Manually before each release, because amounts are business-critical
        feedback: Critical and repetitive is exactly what automation at a low level is for.
    correct: [api]
    solution: |
      **Push them down.** Each check lives once, at the lowest layer that can see it; the end-to-end suite keeps one
      row to prove the wiring.

  - id: place-flaky-wait
    type: mcq
    concept: e2e-async-oracles
    skill: application
    title: The 2 % failure
    prompt: |
      An end-to-end test refunds a payment, waits `Thread.sleep(5000)`, then asserts the refund is `succeeded`. It fails
      about 2 % of the time with status `pending`. What is the best change?
    options:
      - id: poll
        text: Poll the refund status every couple of seconds until it is not pending, with a deadline, and fail with the last status seen
        feedback: Correct - it waits as long as needed and no longer, and a real hang still fails with a useful message.
      - id: longer
        text: Increase the sleep to 15 seconds
        feedback: Every run now pays 15 s, and a slow day still fails. Sleeps fail "when it doesn't sleep long enough".
      - id: retry
        text: Enable automatic test retries in CI
        feedback: That hides the race and doubles the run time on failure; it doesn't fix the oracle.
      - id: accept-pending
        text: Accept either pending or succeeded as a pass
        feedback: Then a refund stuck in pending forever - a real defect - passes.
    correct: [poll]
    solution: |
      **A bounded poll.** The status is asynchronous by design; the test must wait for the condition, not for a guessed
      time.

  - id: place-parallel-data
    type: mcq
    concept: e2e-journey-matrix
    skill: analysis
    title: Refunds that are not yours
    prompt: |
      Two CI jobs run the refund journey in parallel against one sandbox account, both using a fixed order reference
      `ORD-TEST`. The data check "sum of refunds = refunded" fails at random with sums too high. What is the most
      likely cause and fix?
    options:
      - id: shared-data
        text: Both jobs refund the same payment and count each other's refunds - create a fresh order per journey and scope data checks to its ids
        feedback: Correct - shared test data makes parallel runs interfere; unique data per run removes it.
      - id: psp-bug
        text: SandPay double-counts refunds under load - report it to the provider
        feedback: Possible, but the fixed shared reference explains it directly. Rule out your own test data first.
      - id: serial
        text: Run the jobs one after another
        feedback: It hides the problem and makes CI slower; any manual tester using ORD-TEST breaks it again.
      - id: tolerance
        text: Allow the sum to be up to 10 % higher than refunded
        feedback: An invariant with a tolerance no longer catches the over-refunds it exists for.
    correct: [shared-data]
    solution: |
      **Fresh data per journey.** Each journey creates its own order and records its ids; every data check is scoped to
      them, so parallel runs can't see each other.
