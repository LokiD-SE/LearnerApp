placement:
  - id: place-nothing-parallel
    type: mcq
    concept: junit-parallel-config
    skill: application
    title: Parallel is on, but nothing runs in parallel
    prompt: |
      A suite's `src/test/resources/junit-platform.properties` contains only
      `junit.jupiter.execution.parallel.enabled = true`. Logs show every test on the `main` thread and the
      run time hasn't changed. Why?
    options:
      - id: no-mode
        text: Both execution modes still default to same_thread - a concurrent mode is also needed
        feedback: Correct - enabling parallel execution is only the first step; mode.default or mode.classes.default (or @Execution) must be concurrent.
      - id: wrong-place
        text: The file must be in src/main/resources to be read
        feedback: JUnit reads junit-platform.properties from the root of the test class path - src/test/resources is right for test configuration.
      - id: surefire-needed
        text: Surefire must also set forkCount above 1
        feedback: forkCount starts more JVMs; it isn't needed for Jupiter's threads inside one JVM.
      - id: cores
        text: The runner has only one CPU core
        feedback: The default dynamic strategy would still use at least one thread per core, but the logs show the problem is earlier - nothing is allowed to run concurrently.
    correct: [no-mode]
    solution: |
      **No concurrent mode.** `parallel.enabled` allows parallel execution; `mode.default` /
      `mode.classes.default` (default `same_thread`) or `@Execution(CONCURRENT)` decide what actually runs
      concurrently.

  - id: place-customer-mixup
    type: mcq
    concept: parallel-isolation
    skill: analysis
    title: Another test's order
    prompt: |
      In parallel runs, `refundShowsOnOrderPage` sometimes fails: the order page shows `ORD-run7-1730123`,
      but the test created `ORD-run7-1730124`. Both suffixes are the last digits of `System.currentTimeMillis()`,
      and all tests log in as the same sandbox customer `buyer@example.com`. Which change fixes the cause?
    options:
      - id: unique-customer
        text: Give every test its own customer and order reference - a run id plus an atomic counter
        feedback: Correct - the test is reading another test's order from the shared customer's account; unique data per test removes the overlap.
      - id: sleep
        text: Wait two seconds before opening the order page
        feedback: Timing changes how often it happens, not why - the page still lists the shared customer's orders from other tests.
      - id: retry
        text: Rerun the test once when it fails
        feedback: A rerun would often pass and hide that tests share a customer.
      - id: forks
        text: Run each test class in its own JVM with forkCount
        feedback: Separate JVMs don't separate data in the shop - every fork logs in as the same customer.
    correct: [unique-customer]
    solution: |
      **Shared customer, near-identical ids.** The two orders were created a millisecond apart by different
      tests under one account. Unique data per test - its own customer and a counter-based reference - is the
      fix; forks and retries only change timing.

  - id: place-retry-policy
    type: mcq
    concept: honest-retries
    skill: application
    title: The retry proposal
    prompt: |
      After moving to parallel runs, five tests fail in about one run in ten. A colleague proposes
      `rerunFailingTestsCount=3` for the whole suite "so the pipeline stays green". What is the best response?
    options:
      - id: quarantine-fix
        text: Keep failures visible - track each flaky test, quarantine it with a limit if it blocks the team, and fix the shared state or race behind it
        feedback: Correct - a rerun pass is a flake to investigate, and a payment race may be a real defect.
      - id: accept
        text: Accept - Surefire will still fail the build if a test fails on every run
        feedback: True, but the intermittent failures - the ones caused by races - will pass on a rerun and disappear into a Flakes count.
      - id: sequential
        text: Turn parallel execution off permanently
        feedback: That hides the shared state too, and gives up the speed; isolate the tests instead.
      - id: delete
        text: Delete the five tests
        feedback: That removes coverage of the behaviour, and the shared state remains for the next test that hits it.
    correct: [quarantine-fix]
    solution: |
      **Visible, tracked, fixed.** Surefire marks a rerun pass as a flake and the build succeeds, so blanket
      retries turn races into green builds. Quarantine with a limit protects the pipeline while the cause is
      fixed.
