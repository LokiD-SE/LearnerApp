placement:
  - id: place-scope
    type: mcq
    concept: dependency-scopes
    skill: application
    title: Where does AssertJ go?
    prompt: |
      AssertJ is used only in `src/test/java`. Which scope should it have?
    options:
      - id: test
        text: test
        feedback: Correct - only tests need it, and it shouldn't ship with the application.
      - id: compile
        text: compile
        feedback: It would work, but AssertJ would be packaged with the application and passed on to every project that depends on it.
      - id: provided
        text: provided
        feedback: Provided means the runtime environment supplies it - nothing supplies AssertJ.
      - id: runtime
        text: runtime
        feedback: Runtime scope isn't available when compiling, so the tests wouldn't compile.
    correct: [test]
    solution: |
      **test.**

  - id: place-conflict
    type: mcq
    concept: version-resolution
    skill: application
    title: Two versions requested
    prompt: |
      Your project depends on library A, which depends on X 1.2. It also depends on library B, which depends on
      C, which depends on X 1.5. No dependencyManagement. Which version of X does Maven use?
    options:
      - id: one-two
        text: "1.2 - it is nearer (depth 2 against depth 3)"
        feedback: Correct - nearest wins.
      - id: one-five
        text: "1.5 - Maven uses the newest"
        feedback: Maven doesn't compare versions to mediate; it uses the nearest declaration.
      - id: both
        text: Both, one for each library
        feedback: A classpath has one version of each class - Maven keeps one version per artifact.
      - id: error
        text: The build fails with a conflict error
        feedback: Only if you add a rule such as the Enforcer's dependencyConvergence; by default Maven chooses silently.
    correct: [one-two]
    solution: |
      **1.2, the nearer one.** Pin the version you need in dependencyManagement.

  - id: place-pom-basics
    type: mcq
    concept: pom-and-coordinates
    skill: application
    title: Green with no tests
    prompt: |
      A build prints `Tests run: 0` and `BUILD SUCCESS`, although `src/test/java` contains 40 JUnit 6 tests.
      The surefire line says `maven-surefire-plugin:2.12.4:test`. What is the most likely cause?
    options:
      - id: old-surefire
        text: The surefire version is too old to run JUnit Jupiter tests - pin a current 3.x
        feedback: Correct - 2.12.4 predates JUnit 5; JUnit Platform support arrived with 2.22.0.
      - id: test-names
        text: The test classes are not named *Test
        feedback: Possible in general, but the plugin version shown here is the more fundamental problem - it can't run Jupiter tests at all.
      - id: scope
        text: JUnit is in test scope
        feedback: Test scope is right for JUnit and doesn't stop tests from running.
      - id: skip
        text: Somebody set -DskipTests
        feedback: Skipped tests are reported as skipped (or the test step says tests are skipped), not as zero tests run.
    correct: [old-surefire]
    solution: |
      **An old surefire.** Pin `maven-surefire-plugin` to a current version, and always check the test count.
