id: maven-pom-and-dependencies
title: pom.xml, dependencies and scopes
subject: frameworks
module: maven
level: beginner
status: published
estimatedMinutes: 50
summary: What a pom.xml declares, what Maven fills in for you, which scope a dependency needs, and how Maven picks one version when several are asked for.
tags: [maven, pom, dependencies, scopes, bom, dependencymanagement, version conflict, transitive dependencies, interview]

environment: |
  - **Tools:** Apache Maven 3.8 or later, JDK 17+. The rules come from the Maven documentation
    ("Introduction to the POM", "Introduction to the Dependency Mechanism").
  - **Version-specific, labelled:** plugin versions that Maven binds by default depend on the Maven
    version. Maven 3.8.7 binds `maven-compiler-plugin` 3.1 (seen in this lesson's exercise); newer Maven
    versions bind newer plugins. That difference is the reason to pin plugin versions.
  - **Examples:** the practice projects in this repository - `practice/java`, `practice/framework` (which
    imports the Selenium BOM because the Appium Java client asks for Selenium with a version range) and
    `practice/maven` (the exercises). `com.example` artifacts in examples are fictional.

prerequisites:
  - java-types-and-variables

concepts:
  - id: pom-and-coordinates
    name: The POM and coordinates
    summary: A pom.xml declares the project's coordinates (groupId, artifactId, version), its dependencies and its build; Maven fills in the rest from conventions and the super POM.
  - id: dependency-scopes
    name: Dependency scopes
    summary: compile, test, provided and runtime decide on which classpaths a dependency appears and whether it is passed on; import brings in a BOM.
  - id: version-resolution
    name: Version resolution
    summary: Maven chooses one version per artifact - the nearest declaration wins, then the first; dependencyManagement and BOMs pin versions, and ranges let them float.

objectives:
  - Read a pom.xml and explain what each section does and what Maven adds by convention.
  - Choose the right scope for a dependency and explain the consequence of the wrong one.
  - Explain which version Maven picks in a conflict, find it in the dependency tree, and pin it.
  - Fix a pom that doesn't build, or builds without running its tests.

sections:
  - id: intuition
    kind: intuition
    concepts: [pom-and-coordinates, version-resolution]
    title: The idea in plain language
    body: |
      A `pom.xml` is a **shopping list and a recipe**. The list says which libraries the project needs
      ("JUnit, version 6.1.3, only for tests"); the recipe says how to build it ("compile for Java 17, run
      the tests with this plugin").

      Maven fetches everything on the list - and everything *those* libraries need, and so on. When two
      libraries ask for different versions of the same thing, Maven can only put **one** on the classpath,
      and it chooses by rules, not by which one is newest. Most "it works on my machine" Maven problems are
      about what Maven filled in or chose without being told.

  - id: what
    kind: what
    concepts: [pom-and-coordinates, dependency-scopes]
    title: What a pom.xml contains
    body: |
      ```xml
      <project>
        <modelVersion>4.0.0</modelVersion>
        <groupId>shop</groupId>                 <!-- coordinates: who -->
        <artifactId>receipt-tool</artifactId>   <!--              what -->
        <version>1.0.0</version>                <!--              which -->

        <properties>                            <!-- values used by plugins and ${...} -->
          <maven.compiler.release>17</maven.compiler.release>
        </properties>

        <dependencyManagement>...</dependencyManagement>  <!-- versions, not dependencies -->
        <dependencies>...</dependencies>                  <!-- what the code needs -->
        <build><plugins>...</plugins></build>             <!-- how to build -->
      </project>
      ```

      **Scopes:**

      | Scope | Available when | Passed on to projects that depend on yours | Typical use |
      |---|---|---|---|
      | `compile` (default) | compiling, testing, running | yes | libraries your code uses |
      | `test` | compiling and running tests | no | JUnit, AssertJ, mock libraries |
      | `provided` | compiling and testing; supplied at run time by the environment | no | an API the runtime provides |
      | `runtime` | testing and running, not compiling | yes | a JDBC driver loaded by name |
      | `import` | only in `dependencyManagement`, with `<type>pom</type>` | - | a BOM: a list of managed versions |

      **Conventions:** sources in `src/main/java`, tests in `src/test/java`, output in `target/`. Anything a
      pom doesn't say comes from the **super POM** that every project inherits - including default plugin
      versions, which depend on the Maven version you run.

  - id: why
    kind: why
    concepts: [dependency-scopes, version-resolution]
    title: Why testers need to read poms
    body: |
      - **Test frameworks are Maven projects.** You will add libraries, upgrade Selenium, and wonder why a
        class "isn't there" in CI.
      - **Green builds that test nothing.** A plugin too old for JUnit 5 or 6 reports `Tests run: 0` and
        `BUILD SUCCESS` - the most dangerous kind of green.
      - **Version conflicts look like code bugs.** `NoSuchMethodError` or `ClassNotFoundException` at run
        time usually means Maven chose a different version of a transitive dependency than a library was
        built against.
      - **Scopes decide what ships.** A test library in compile scope ends up in the application; a
        framework's Selenium in test scope can't be used by page objects in `src/main/java`.

  - id: internals
    kind: internals
    concepts: [version-resolution, pom-and-coordinates]
    title: How Maven resolves dependencies
    body: |
      1. **Read the POM** and everything it inherits (parent POMs, the super POM). Interpolate `${...}`
         properties.
      2. **Apply `dependencyManagement`**, including imported BOMs: it doesn't add dependencies, it fixes the
         version (and optionally the scope) of an artifact *wherever* it appears in the tree.
      3. **Build the tree:** your dependencies, their dependencies, and so on (transitive dependencies,
         filtered by scope).
      4. **Mediate conflicts - one version per artifact:** the declaration **nearest** to your project in the
         tree wins; at equal depth, the **first declared** wins. Newest does not win.
      5. **Resolve version ranges** such as `[4.42.0,5.0)` to the highest version available in the
         repositories - so the result can change when a new version is published.
      6. **Download** missing artifacts from the remote repositories (Maven Central by default) into your
         local repository, `~/.m2/repository`.

      **Plugins** are resolved the same way. A plugin without a `<version>` gets the version the running
      Maven binds by default - a different one on another machine with another Maven.

  - id: visual
    kind: visual
    concepts: [version-resolution]
    title: "Diagram: one artifact, three requests"
    body: |
      ```mermaid
      flowchart LR
          P["practice/framework"] --> SJ["selenium-java 4.51.0"]
          P --> AC["java-client 10.1.1"]
          SJ --> SA1["selenium-api 4.51.0"]
          AC --> SA2["selenium-api, range 4.42.0 to below 5.0"]
          BOM["selenium-bom 4.51.0, imported in dependencyManagement"] -.->|pins| SA1
          BOM -.->|pins| SA2
      ```

      Both libraries need `selenium-api`, and the Appium client asks with a **range**. Without the BOM,
      mediation and range resolution decide - and the range can float to a newer Selenium the day one is
      released. With the BOM, every `selenium-*` artifact is 4.51.0, which `mvn dependency:tree` confirms.

  - id: steps
    kind: steps
    concepts: [pom-and-coordinates, version-resolution]
    title: Diagnosing a dependency problem, step by step
    body: |
      1. **Read the first error.** "version is missing", "cannot find symbol", `NoSuchMethodError`,
         `ClassNotFoundException` - each points somewhere different.
      2. **See what Maven really uses:** `mvn dependency:tree` (add `-Dincludes=groupId:artifactId` to
         filter). For the merged configuration, `mvn help:effective-pom`.
      3. **Find who brings the artifact in,** and at which depth - that tells you which declaration won.
      4. **Decide the version you want,** and pin it in `dependencyManagement` (or import the library's BOM)
         instead of adding random direct dependencies.
      5. **Check plugin versions** in the build output (`maven-surefire-plugin:2.12.4:test`) and pin them.
      6. **Re-run the build and the tests,** and check the test count, not only `BUILD SUCCESS`.

  - id: example
    kind: example
    concepts: [version-resolution]
    title: "Real-world example: NoSuchMethodError after adding a reporting library"
    body: |
      A team added a reporting library to their API test suite. Compilation was fine; at run time the
      report step failed with `NoSuchMethodError` inside a JSON library.

      **Evidence from `mvn dependency:tree`:** the API client brought in the JSON library at depth 2 in an
      older version; the reporting library needed a newer one at depth 3. Nearest wins - the older version
      went on the classpath, and the reporting code called a method that didn't exist in it.

      **Fix:** the JSON library's BOM in `dependencyManagement`, pinning the newer version for everyone, and
      a run of the API tests to check the client still worked with it. The team also added the Maven
      Enforcer plugin's `dependencyConvergence` rule, which fails the build when the tree contains
      different versions of the same artifact - so the next conflict is found at build time, not in a
      report.

  - id: code
    kind: code
    concepts: [dependency-scopes, version-resolution, pom-and-coordinates]
    title: "Code: a pom that builds the same everywhere"
    collapsed: true
    body: |
      ```xml
      <properties>
        <maven.compiler.release>17</maven.compiler.release>
        <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
      </properties>

      <dependencyManagement>
        <dependencies>
          <dependency>                          <!-- one version for every JUnit artifact -->
            <groupId>org.junit</groupId>
            <artifactId>junit-bom</artifactId>
            <version>6.1.3</version>
            <type>pom</type>
            <scope>import</scope>
          </dependency>
        </dependencies>
      </dependencyManagement>

      <dependencies>
        <dependency>
          <groupId>org.junit.jupiter</groupId>
          <artifactId>junit-jupiter</artifactId> <!-- version from the BOM -->
          <scope>test</scope>
        </dependency>
      </dependencies>

      <build>
        <plugins>
          <plugin>
            <groupId>org.apache.maven.plugins</groupId>
            <artifactId>maven-compiler-plugin</artifactId>
            <version>3.15.0</version>
          </plugin>
          <plugin>
            <groupId>org.apache.maven.plugins</groupId>
            <artifactId>maven-surefire-plugin</artifactId>
            <version>3.5.6</version>
          </plugin>
        </plugins>
      </build>
      ```

      ```bash
      mvn dependency:tree                                   # what is really on the classpath, and why
      mvn dependency:tree -Dincludes=org.seleniumhq.selenium
      mvn help:effective-pom                                # the POM after inheritance and defaults
      ```

  - id: tests
    kind: tests
    concepts: [pom-and-coordinates, dependency-scopes]
    title: Checks for a healthy build
    body: |
      | ID | Check | Catches |
      |---|---|---|
      | B1 | the test count in the build output matches the number of tests | old or misconfigured test plugins, wrong naming |
      | B2 | build with a different Maven version (or a clean `~/.m2`) | unpinned plugins, versions that only exist in your local repository |
      | B3 | `mvn dependency:tree` shows one version of each important library | conflicts and floating ranges |
      | B4 | test libraries in test scope (`dependency:tree` shows `:test`) | test code shipped with the application |
      | B5 | the Enforcer plugin's `dependencyConvergence` rule | conflicts introduced by a new dependency |

      The coding exercise checks B1 and B4 by running Maven on your fixed project.

  - id: mistakes
    kind: mistakes
    concepts: [dependency-scopes, version-resolution, pom-and-coordinates]
    title: Common mistakes
    body: |
      - **Unpinned plugins** - the build changes with the Maven version that runs it.
      - **An old surefire with JUnit 5 or 6** - `Tests run: 0`, `BUILD SUCCESS`. Native JUnit 5 support came
        with surefire 2.22.0; use a current 3.x.
      - **Test libraries in compile scope**, or a framework's Selenium in test scope while page objects live
        in `src/main/java`.
      - **"Fixing" a conflict by adding a direct dependency** without understanding which version you get.
        Use `dependencyManagement` or a BOM, and look at the tree.
      - **Version ranges and `LATEST`** - unreproducible builds.
      - **Copying versions into every dependency** of a family (JUnit, Selenium, Jackson) instead of
        importing the BOM.
      - **Ignoring "version is missing"** by guessing - check which BOM the project meant to import.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [version-resolution]
    title: Trade-offs
    body: |
      | Choice | Gains | Costs |
      |---|---|---|
      | pin everything (plugins, BOMs) | reproducible builds | upgrades are deliberate work - automate them with an update bot |
      | version ranges | automatic updates | builds change without a commit; hard to reproduce failures |
      | BOM imports | one version per library family | you take the BOM's choices for every artifact in it |
      | `dependencyConvergence` | conflicts fail early | a new dependency may need explicit management before the build passes |
      | `exclusions` on a dependency | removes a transitive artifact entirely | the library may need it - test the paths that use it |

  - id: summary
    kind: summary
    title: Summary and quick reference
    body: |
      - Coordinates: groupId, artifactId, version. Conventions fill in the rest - including default plugin
        versions that vary with the Maven version, so pin plugins.
      - Scopes: compile (default), test, provided, runtime; import for BOMs.
      - One version per artifact: nearest wins, then first declared. Ranges resolve to the newest available.
      - `dependencyManagement` and BOMs pin versions everywhere in the tree.
      - Tools: `mvn dependency:tree`, `mvn help:effective-pom`.
      - A green build that ran no tests is not green - check the count.

exercises:
  - id: coordinates
    type: mcq
    concept: pom-and-coordinates
    skill: recognition
    title: What identifies an artifact?
    prompt: |
      Which elements together identify an artifact in a Maven repository? Select every one that applies.
    options:
      - id: group
        text: "`groupId`"
        feedback: Yes - who publishes it, usually a reversed domain name.
      - id: artifact
        text: "`artifactId`"
        feedback: Yes - the artifact's name within the group.
      - id: version
        text: "`version`"
        feedback: Yes - which release.
      - id: name
        text: "`name`"
        feedback: No - name is a human-readable label for the project; it plays no part in finding the artifact.
      - id: scope
        text: "`scope`"
        feedback: No - scope belongs to a dependency declaration and says where it is used, not what it is.
    correct: [group, artifact, version]
    hints:
      - Think of the folder path under ~/.m2/repository.
    solution: |
      **groupId, artifactId and version** - the coordinates. (Packaging and classifier refine them for
      special files, but GAV identifies the artifact.) In your local repository they become a path:
      `~/.m2/repository/org/junit/jupiter/junit-jupiter/6.1.3/`.
    followUp: |
      Where do you find the coordinates of Selenium's Java bindings, and how would you check which versions
      exist?

  - id: fix-receipt-tool
    type: coding
    concept: pom-and-coordinates
    skill: application
    title: Fix the receipt-tool build
    prompt: |
      `receipt-tool` was copied from an old project. It doesn't build - and once it builds, check whether its
      three tests really run. Fix its `pom.xml` (not the Java code) until the test class is green. Work in
      the project folder with `mvn test` and read the **first** error each time; write down each problem
      and its cause.
    project: maven
    files:
      - src/exercises/projects/receipt-tool/pom.xml
    test: src/test/java/learnerapp/maven/ReceiptToolBuildTest.java
    command: mvn test -Dtest=ReceiptToolBuildTest
    hints:
      - "The first error says a version is missing. The JUnit project publishes a BOM (`org.junit:junit-bom`) for exactly this."
      - The code uses records. Which Java release does the compiler target, and which compiler plugin version does your Maven use by default?
      - "When it builds, read the test output: how many tests ran? Which surefire version ran them?"
      - Which scope should a library have that only tests use?
    modelAnswer: |
      ```xml
      <properties>
        <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
        <maven.compiler.release>17</maven.compiler.release>
      </properties>

      <dependencyManagement>
        <dependencies>
          <dependency>
            <groupId>org.junit</groupId>
            <artifactId>junit-bom</artifactId>
            <version>6.1.3</version>
            <type>pom</type>
            <scope>import</scope>
          </dependency>
        </dependencies>
      </dependencyManagement>

      <dependencies>
        <dependency>
          <groupId>org.junit.jupiter</groupId>
          <artifactId>junit-jupiter</artifactId>
          <scope>test</scope>
        </dependency>
      </dependencies>

      <build>
        <plugins>
          <plugin>
            <groupId>org.apache.maven.plugins</groupId>
            <artifactId>maven-compiler-plugin</artifactId>
            <version>3.15.0</version>
          </plugin>
          <plugin>
            <groupId>org.apache.maven.plugins</groupId>
            <artifactId>maven-surefire-plugin</artifactId>
            <version>3.5.6</version>
          </plugin>
        </plugins>
      </build>
      ```

      The problems, in the order Maven reveals them: the missing JUnit version; a compiler too old for the
      code (Maven 3.8 binds compiler plugin 3.1, which ignores `maven.compiler.release` and fails with "Source
      option 5 is no longer supported"); surefire 2.12.4, which builds green with `Tests run: 0`; and JUnit in
      compile scope.
    rubric:
      - Every test in ReceiptToolBuildTest passes
      - JUnit's version comes from the imported junit-bom, and junit-jupiter is in test scope
      - The compiler and surefire plugins are pinned to current versions
      - Wrote down each problem and its cause, including the build that was green with no tests
    solution: |
      The test class runs `mvn clean test` on your project, counts the tests in the surefire reports (3
      expected) and reads the scope from your pom. A green build with zero tests is the trap: always check
      the count. Reference: `src/solutions/projects/receipt-tool/pom.xml`.
    followUp: |
      Run `mvn dependency:tree` in the fixed project. Which artifacts did junit-jupiter bring in, and in which
      scope?

  - id: framework-scope
    type: mcq
    concept: dependency-scopes
    skill: application
    title: Selenium's scope in a framework
    prompt: |
      In `practice/framework`, page objects live in `src/main/java` and tests in `src/test/java`. Which scope
      must `selenium-java` have?
    options:
      - id: compile
        text: compile (the default)
        feedback: Correct - code in src/main/java uses Selenium, and only compile (or provided) scope is visible there.
      - id: test
        text: test
        feedback: Test scope is invisible to src/main/java - every page object would fail to compile.
      - id: runtime
        text: runtime
        feedback: Runtime scope is missing at compile time - the page objects couldn't import Selenium classes.
      - id: provided
        text: provided
        feedback: Provided means "the environment supplies it at run time" - nothing supplies Selenium to a test run.
    correct: [compile]
    hints:
      - Which code imports Selenium classes, and which scopes can that code see?
    solution: |
      **compile.** Scope follows the code that uses the library: framework code in `src/main/java` needs
      compile scope. In a project where only tests use Selenium, test scope would be right.
    followUp: |
      The framework is published and another team depends on it. Which of its dependencies will that team get
      transitively - Selenium, JUnit, or both?

  - id: nearest-wins
    type: debug
    concept: version-resolution
    skill: analysis
    title: Read the dependency tree
    prompt: |
      The suite fails at run time with `NoSuchMethodError` inside jackson-databind, called from
      `report-core`. Here is `mvn dependency:tree` with verbose output. Click the lines that explain the
      failure.
    language: plaintext
    code: |
      shop:checkout-tests:jar:1.0.0
      +- com.example:payments-client:jar:2.3.0:compile
      |  \- com.fasterxml.jackson.core:jackson-databind:jar:2.15.0:compile
      +- com.example:reporting:jar:5.1.0:compile
      |  \- com.example:report-core:jar:5.1.0:compile
      |     \- (com.fasterxml.jackson.core:jackson-databind:jar:2.18.1:compile - omitted for conflict with 2.15.0)
      \- org.junit.jupiter:junit-jupiter:jar:6.1.3:test
    correctLines: [3, 6]
    lineNotes:
      - line: 7
        note: JUnit in test scope is correct and has nothing to do with this failure.
      - line: 5
        note: report-core is the library that needs the newer version - the problem is the version it gets, shown on line 6.
    hints:
      - Which version of jackson-databind is on the classpath, and which one did report-core expect?
      - Count the depth of each jackson-databind line.
    solution: |
      **Lines 3 and 6.** jackson-databind 2.15.0 (line 3, depth 2) is nearer than 2.18.1 (line 6, depth 3), so
      2.15.0 wins and 2.18.1 is omitted. `report-core` was built against 2.18.1 and calls a method 2.15.0
      lacks. Fix: pin 2.18.1 with `dependencyManagement` (or Jackson's BOM) - and run the payments-client
      tests to check it works with the newer version.
    followUp: |
      Which Maven Enforcer rule would have failed the build when report-core was added, and what would it have
      reported?

  - id: pin-selenium
    type: mcq
    concept: version-resolution
    skill: application
    title: A range from the Appium client
    prompt: |
      `io.appium:java-client` 10.1.1 declares `selenium-api` with the range `[4.42.0, 5.0)`. Your framework
      uses Selenium 4.51.0 and wants exactly that everywhere. What is the best fix?
    options:
      - id: bom
        text: Import `org.seleniumhq.selenium:selenium-bom:4.51.0` in dependencyManagement
        feedback: Correct - every selenium-* artifact, direct or transitive, gets 4.51.0.
      - id: exclusion
        text: Exclude selenium-api from java-client
        feedback: java-client needs selenium-api; excluding it only works by accident (if another dependency brings it in) and hides the requirement.
      - id: nothing
        text: Nothing - nearest wins, so selenium-java's 4.51.0 is used
        feedback: Today, maybe. Ranges resolve against the repository, and mediation results change when the tree changes. Pinning makes it explicit and stable.
      - id: upgrade
        text: Always use the newest java-client
        feedback: A newer client may require a newer Selenium - it moves the problem, it doesn't pin anything.
    correct: [bom]
    hints:
      - Which mechanism fixes a version wherever an artifact appears in the tree?
    solution: |
      **The Selenium BOM in `dependencyManagement`.** That is exactly what `practice/framework/pom.xml` does;
      `mvn dependency:tree -Dincludes=org.seleniumhq.selenium` shows every Selenium artifact at 4.51.0.
    followUp: |
      Upgrading to Selenium 4.52 later: which single line changes, and what do you run to check the result?

  - id: interview-dependency-conflict
    type: interview
    concept: version-resolution
    skill: application
    title: "Interview: a dependency conflict"
    prompt: |
      **Interviewer:** "Your suite throws NoSuchMethodError after someone added a new library. How do you
      investigate and fix it in Maven?"
    hints:
      - The meaning of the error, the tool, the mediation rule, the fix and how you prevent recurrence.
    modelAnswer: |
      - NoSuchMethodError at run time with clean compilation usually means a different version of a class is
        on the classpath than the caller was built against.
      - Run `mvn dependency:tree` (verbose if available, or `-Dincludes=` for the artifact) and find every
        path that brings the artifact in.
      - Maven keeps one version: nearest declaration wins, then first declared - not the newest.
      - Fix by pinning the needed version in `dependencyManagement` or importing the library's BOM; avoid
        random direct dependencies or exclusions without understanding them. Run the tests of every caller.
      - Prevent it: the Enforcer `dependencyConvergence` rule, pinned plugins, no version ranges.
    followUps:
      - What is the difference between dependencies and dependencyManagement?
      - What does a BOM import do?
      - Why can a version range make yesterday's build different from today's?
    rubric:
      - Explained what NoSuchMethodError at run time usually means here
      - Used mvn dependency:tree to find the competing versions
      - Stated the nearest-wins mediation rule
      - Fixed it with dependencyManagement or a BOM, and re-ran the callers' tests
      - Named a prevention such as dependencyConvergence or avoiding ranges
    solution: |
      Strong answers show the **tool, the rule and the evidence** - not "I would update all the libraries".

  - id: scopes-recall
    type: short
    concept: dependency-scopes
    skill: recall
    title: Four scopes
    prompt: |
      In two to four sentences: what do the compile, test, provided and runtime scopes mean?
    hints:
      - For each, ask when the dependency is on the classpath and whether it ships.
    modelAnswer: |
      compile (the default) is available everywhere and passed on to projects that depend on yours. test is
      only for compiling and running tests and is not passed on. provided is available for compiling and
      testing, but the environment supplies it at run time, so it isn't packaged or passed on. runtime isn't
      available for compiling, only for testing and running - for example a driver loaded by name.
    rubric:
      - compile is the default, available everywhere and transitive
      - test is only for test compilation and execution
      - provided is supplied by the runtime environment
      - runtime is not on the compile classpath
    solution: |
      The question to ask for any dependency: **which code uses it, and who supplies it at run time?**

recall:
  - id: recall-gav
    concept: pom-and-coordinates
    prompt: What are Maven coordinates?
    answer: groupId, artifactId and version - together they identify an artifact.
  - id: recall-super-pom
    concept: pom-and-coordinates
    prompt: Why pin plugin versions in a pom?
    answer: Unpinned plugins get the versions the running Maven binds by default, so the build changes with the Maven version - for example an old surefire that runs no JUnit 5 tests.
  - id: recall-test-scope
    concept: dependency-scopes
    prompt: What does test scope mean?
    answer: Available only when compiling and running tests, not packaged, not passed on to dependents.
  - id: recall-import
    concept: dependency-scopes
    prompt: What does scope import do?
    answer: Used in dependencyManagement with type pom, it imports a BOM's managed versions into your project.
  - id: recall-mediation
    concept: version-resolution
    prompt: How does Maven choose between two versions of the same artifact?
    answer: The nearest declaration in the tree wins; at equal depth, the first declared. Not the newest.
  - id: recall-depmgmt
    concept: version-resolution
    prompt: What does dependencyManagement do - and not do?
    answer: It fixes versions (and optionally scopes) wherever the artifact appears; it does not add the dependency.

