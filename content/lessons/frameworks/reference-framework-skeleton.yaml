id: reference-framework-skeleton
title: A small reference framework, and why it is small
subject: frameworks
module: framework-design
level: intermediate
status: published
estimatedMinutes: 45
summary: The layers of a UI-automation framework, the job of each part of the practice framework and the need that justified it, and how to decide what to add next.
tags: [framework design, selenium, junit, extension, configuration, evidence, test architecture, interview]

environment: |
  - **Framework:** `practice/framework` in the LearnerApp repository - Java 17+, Maven, Selenium 4.51,
    JUnit 6 - testing the fictional SandPay Demo Shop (`practice/shop`).
  - **JUnit specifics:** the framework uses the JUnit Jupiter extension API (`BeforeAllCallback`,
    `BeforeEachCallback`, `AfterEachCallback`, `AfterAllCallback`, `ParameterResolver`) and the extension
    context's store. Parallel execution is switched on with the configuration parameter
    `junit.jupiter.execution.parallel.enabled=true` - but the JUnit 6 user guide says that alone still runs
    everything sequentially (`SAME_THREAD`); tests run concurrently only with
    `junit.jupiter.execution.parallel.mode.default=concurrent` (or `@Execution(CONCURRENT)`).
  - **Checked against the code:** every claim about `Config`, `Browser`, `ShopServer`, `ShopExtension`
    and the CI evidence upload was checked against `practice/framework` and `.github/workflows/pages.yml`;
    the extension excerpt matches `ShopExtension.java`, and `mvn test -Dtest=CheckoutJourneyTest
    -Dheadless=true` passes (4 tests, Maven 3.8.7, Java 17). The "real-world example" team is illustrative.
  - **Sources:**
    - [JUnit user guide: Extension Model](https://docs.junit.org/current/extensions/overview.html) and
      [Keeping State in Extensions](https://docs.junit.org/current/extensions/keeping-state-in-extensions.html)
      - lifecycle callbacks, `ParameterResolver`, the store bound to its context's lifecycle, lookups that
      fall back to ancestor contexts, stored `AutoCloseable` values closed when the context ends (5.13+)
    - [JUnit user guide: Parallel Execution](https://docs.junit.org/current/writing-tests/parallel-execution.html)
      - `parallel.enabled`, `parallel.mode.default`, the `dynamic` strategy
    - [Selenium: Page object models](https://www.selenium.dev/documentation/test_practices/encouraged/page_object_models/)
      and [Selenium Manager](https://www.selenium.dev/documentation/selenium_manager/)
  - **Opinion, labelled:** "add a component only when a test needs it" is this course's design rule, shared
    by many practitioners but not a standard. The lesson shows the evidence for each decision so you can
    judge it.

prerequisites:
  - page-objects-done-right
  - maven-pom-and-dependencies

concepts:
  - id: framework-layers
    name: Framework layers
    summary: Tests, page objects and components, and infrastructure (browser, configuration, lifecycle, evidence) - each layer depends only on the ones below it.
  - id: evidence-driven-growth
    name: Growing a framework from evidence
    summary: Every framework component exists because a test or a run needed it; add components when a real need appears, not in advance.

objectives:
  - Describe the layers of a UI-automation framework and what each may and may not depend on.
  - Explain the job of each part of the practice framework and the need that justified it.
  - Spot framework designs that leak state between tests or hide failures, and propose fixes.
  - Decide what to add to a framework next, from evidence, and how to measure whether it helped.

sections:
  - id: intuition
    kind: intuition
    concepts: [evidence-driven-growth, framework-layers]
    title: The idea in plain language
    body: |
      A framework is like a **workshop**. A good one has the tools the work actually needs, each in a
      known place. A bad one was bought from a catalogue on day one: twelve kinds of clamp, a laser
      cutter nobody can use, and still no screwdriver of the right size.

      Automation frameworks often start with a "template" - reporting, BDD, retries, a dozen utility
      classes - before the first real test exists. Every unused part is code to maintain and a concept to
      teach. The practice framework is deliberately **small**: each part is there because a test needed it,
      and you can name the need.

  - id: what
    kind: what
    concepts: [framework-layers]
    title: What is in the practice framework
    body: |
      | Layer | Part | Job |
      |---|---|---|
      | Tests | `CheckoutJourneyTest`, the exercise tests | say what should happen, and assert it |
      | Page objects | `CatalogPage`, `CheckoutPage`, `OrderPage` | the pages' services: locators, waits, intent |
      | Components | `Header`, `SandPayCardFrame` | shared parts and the iframe |
      | Lifecycle | `ShopExtension` (JUnit extension) | shop per class, browser per test, always quit, evidence on failure, parameters |
      | Infrastructure | `Browser`, `ShopServer`, `Config`, `Shop` | start Chrome; serve the shop; read settings; the shop's address |

      **Dependencies point down only.** Tests use page objects and the extension; page objects use
      WebDriver and `Config`; nothing below knows about tests. A page object never imports JUnit.

  - id: why
    kind: why
    concepts: [evidence-driven-growth]
    title: Why small, and why "from evidence"
    body: |
      - **Every part costs.** Code to maintain, upgrade and explain. A part that no test needs is pure cost.
      - **Premature parts are usually wrong.** A reporting layer chosen before anyone reads reports, or a
        retry mechanism added before anyone measured flakiness, solves an imagined problem - and often
        hides the real one.
      - **A reason makes a part defendable.** "We serve the shop from the tests because CI failed whenever
        the shared environment was down" survives a design review and an interview. "Best practice" doesn't.
      - **Interviews ask exactly this:** "walk me through your framework" is followed by "why did you add
        X?". Knowing the need behind each part is the strong answer.

  - id: internals
    kind: internals
    concepts: [framework-layers, evidence-driven-growth]
    title: How the parts work, and the need behind each
    body: |
      | Part | How it works | The need that justified it |
      |---|---|---|
      | `Config` | static methods over system properties: `shop.url`, `shop.dir`, `headless` (default: the `CI` variable), `timeout.seconds` | run the same suite against the local and the published shop, with and without a window, with one timeout |
      | `ShopServer` | the JDK's built-in HTTP server on a free loopback port, serving `practice/shop` | tests must not depend on a shop someone remembered to start, or a port someone else uses |
      | `Browser` | creates ChromeDriver with options; Selenium Manager supplies the driver; no implicit wait | one place for browser options; every test gets a fresh browser |
      | `ShopExtension` | `beforeAll`: start the server (or use `shop.url`); `beforeEach`: start a browser; `afterEach`: save evidence if the test failed, then `quit()` in `finally`; resolves `WebDriver` and `Shop` parameters | no test can leak a browser, cookies or storage into the next; failures are analysable from CI artefacts |
      | Evidence | screenshot and page source to `target/evidence`, uploaded by CI on failure | "it failed in CI" must come with the page as it was |
      | Page objects and components | private locators, waits inside, data out | see [Page objects done right](#/lesson/page-objects-done-right) |

      **State lives in the extension's store**, not in static fields: the server in the test *class's*
      store, the browser in the test *method's* store. JUnit's stores are hierarchical - a lookup that
      misses in the test's store falls back to its ancestors' stores (same namespace), so a test reads the
      shop from its class's store. (Since JUnit 5.13 a stored `AutoCloseable` - `ShopServer` is one - is
      also closed when its context ends; the extension still stops the server explicitly in `afterAll`.) Nothing is shared between tests through static state, which is what
      later makes parallel execution a configuration change rather than a rewrite.

  - id: visual
    kind: visual
    concepts: [framework-layers]
    title: "Diagram: the layers and who depends on whom"
    body: |
      ```mermaid
      flowchart TB
          T["Tests - CheckoutJourneyTest, exercise tests"] --> P["Page objects and components"]
          T --> X["ShopExtension - lifecycle and evidence"]
          X --> B["Browser"]
          X --> S["ShopServer"]
          P --> W["WebDriver - Selenium"]
          B --> W
          P --> C["Config"]
          B --> C
          X --> C
          W --> G["Chrome"]
          S --> F["practice/shop files"]
      ```

      Arrows point to what a part uses. Nothing points back up: infrastructure doesn't know the tests,
      and page objects don't know JUnit.

  - id: when
    kind: when
    concepts: [evidence-driven-growth]
    title: What is not in the framework yet - and when it would be added
    body: |
      | Missing part | Add it when | Evidence to collect first |
      |---|---|---|
      | parallel execution | the suite is too slow for the feedback the team needs | run time per test and in total; CPU and memory headroom on CI |
      | a second browser | a defect or a requirement is browser-specific | which browsers users have; past browser-specific defects |
      | a test-data layer (API calls to prepare state) | UI setup dominates run time, or tests need states the UI can't reach quickly | time spent in setup steps |
      | richer reports | someone outside the team needs to read results | who reads them, and what they need to decide |
      | BDD (Gherkin scenarios) | non-programmers write or review scenarios | who would read and write them |
      | automatic retries | never as a default; temporarily, tracked, for a known external flakiness | failure history per test |

      Each addition gets the same treatment as the existing parts: a test that needs it, and a sentence
      that says why.

  - id: example
    kind: example
    concepts: [evidence-driven-growth]
    title: "Real-world example: the framework nobody could change"
    body: |
      A team inherited a "complete" framework: Cucumber, three reporting libraries, a retry analyser,
      Excel-driven test data, a 2,000-line `BaseTest` with static drivers, and wrappers around every
      Selenium call. Runs took 70 minutes; a third of the failures were retried away; nobody dared touch
      `BaseTest`.

      **What they measured:** 40% of run time was fixed sleeps inside the wrappers; most retried failures
      were two shared-state bugs (a static driver reused across tests); the Cucumber scenarios had no
      non-programmer readers.

      **What they did:** a new, small framework next to the old one - browser per test, no sleeps, page
      objects with waits, evidence on failure - and moved tests over, slowest and flakiest first. Each
      returning feature had to come with a reason. Six months later: 14-minute runs, retries switched off,
      and one reporting format that the release manager actually read.

  - id: code
    kind: code
    concepts: [framework-layers]
    title: "Code: the lifecycle in the JUnit extension"
    collapsed: true
    body: |
      ```java
      public final class ShopExtension
          implements BeforeAllCallback, AfterAllCallback, BeforeEachCallback, AfterEachCallback, ParameterResolver {

          @Override
          public void beforeAll(ExtensionContext context) throws IOException {
              String url = Config.shopUrl();
              if (url.isEmpty()) {
                  ShopServer server = ShopServer.start(Config.shopDir());
                  context.getStore(NAMESPACE).put(ShopServer.class, server);
                  context.getStore(NAMESPACE).put(Shop.class, server.shop());
              } else {
                  context.getStore(NAMESPACE).put(Shop.class, new Shop(url));
              }
          }

          @Override
          public void beforeEach(ExtensionContext context) {
              context.getStore(NAMESPACE).put(WebDriver.class, Browser.start());
          }

          @Override
          public void afterEach(ExtensionContext context) {
              WebDriver driver = context.getStore(NAMESPACE).remove(WebDriver.class, WebDriver.class);
              if (driver == null) return;
              try {
                  if (context.getExecutionException().isPresent()) saveEvidence(driver, context);
              } finally {
                  driver.quit();   // even if saving evidence fails
              }
          }
          // afterAll stops the server; supportsParameter/resolveParameter hand out WebDriver and Shop
      }
      ```

      A test then asks only for what it uses:

      ```java
      @ExtendWith(ShopExtension.class)
      class CheckoutJourneyTest {
          @Test
          void aSuccessfulPaymentCreatesAPaidOrder(WebDriver driver, Shop shop) { ... }
      }
      ```

      Running it:

      ```bash
      cd practice/framework
      mvn test -Dtest=CheckoutJourneyTest                                  # with a Chrome window
      mvn test -Dheadless=true -Dshop.url=https://lokid-se.github.io/LearnerApp/shop/
      ```

  - id: tests
    kind: tests
    concepts: [framework-layers]
    title: Testing the framework itself
    body: |
      | ID | Check | How the practice framework does it |
      |---|---|---|
      | F1 | the journeys pass against a known-good shop | `CheckoutJourneyTest`, in CI |
      | F2 | a failing test leaves evidence | make a journey fail on purpose once, and look in `target/evidence` |
      | F3 | no state leaks between tests | browser per test; run one test alone and the class in any order |
      | F4 | it runs on a clean machine | CI starts from an empty runner: JDK, Chrome, `mvn` - nothing else |
      | F5 | the exercises really test something | `practice/verify.sh`: solutions pass, unsolved exercises fail |
      | F6 | settings work | run with `-Dshop.url` against the published shop, and with `-Dheadless=true` |

  - id: mistakes
    kind: mistakes
    concepts: [framework-layers, evidence-driven-growth]
    title: Common mistakes
    body: |
      - **Static WebDriver** in a `BaseTest` - state leaks between tests, and parallel runs become
        impossible.
      - **One browser for a whole class or suite** "for speed" - the first failure poisons every later test.
      - **No `quit()` in a `finally`** - browsers pile up on CI agents until they run out of memory.
      - **Hard-coded URLs, credentials and timeouts** in tests - configuration exists so tests don't change
        between environments. Credentials come from the environment or a secret store, never the
        repository.
      - **Wrappers around every Selenium call** (`clickElement`, `typeText`) that add sleeps, logging and
        retries - they hide what happens and slow everything down.
      - **Building for imagined needs** - the BDD layer, three report formats and a data-driven engine
        before the first ten tests.
      - **No evidence on failure** - every CI failure becomes "re-run it and see".

  - id: tradeoffs
    kind: tradeoffs
    concepts: [evidence-driven-growth, framework-layers]
    title: Trade-offs
    body: |
      | Choice | Gains | Costs |
      |---|---|---|
      | browser per test | isolation, parallel-ready, failures don't cascade | the time to start Chrome for every test - measure it on your runner |
      | JUnit extension for the lifecycle | composable, no inheritance, parameters | the extension API is one more thing to learn |
      | `BaseTest` superclass | familiar to many teams | single inheritance; grows into a god class; static state creeps in |
      | serving the app under test from the tests | no shared environment to break | only works for apps you can run locally (a static shop, a container) |
      | small framework, grown from tests | every part justified, little to maintain | some parts arrive later than a template would have provided them |

  - id: summary
    kind: summary
    title: Summary and quick reference
    body: |
      - Layers: tests → page objects and components → WebDriver; lifecycle and infrastructure beside them.
        Dependencies point down only.
      - Practice framework: `Config`, `ShopServer`, `Browser`, `ShopExtension` (lifecycle and evidence),
        page objects and components - each with a named need.
      - Browser per test, `quit()` in `finally`, no static drivers, no implicit waits, no sleeps.
      - Evidence on failure, uploaded by CI.
      - Add parts when a test or a measurement needs them - and measure whether they helped.

exercises:
  - id: which-layer
    type: mcq
    concept: framework-layers
    skill: recognition
    title: Which layer?
    prompt: |
      In the practice framework, which of these belong in **infrastructure or lifecycle** code rather than
      in tests or page objects? Select every one that applies.
    options:
      - id: quit
        text: Quitting the browser after every test, even when it failed
        feedback: Yes - the extension's afterEach does it in a finally block.
      - id: shop-url
        text: Deciding whether to serve the shop locally or use -Dshop.url
        feedback: Yes - Config reads the setting and the extension acts on it.
      - id: evidence
        text: Saving a screenshot when a test fails
        feedback: Yes - every test needs it, and no test should have to remember it.
      - id: assert-status
        text: Asserting that the order status is SUCCEEDED
        feedback: No - that is the test's expectation for one scenario.
      - id: pay-locator
        text: The locator of the Pay button
        feedback: No - locators belong to the page object of the page that has the button.
    correct: [quit, shop-url, evidence]
    hints:
      - Which of these are the same for every test, and which depend on the page or the scenario?
    solution: |
      **Quitting the browser, choosing the shop, and saving evidence** - the same for every test, so the
      lifecycle does them once. Expectations belong to tests; locators to page objects.
    followUp: |
      Where would you put a setting for "slow motion" (a pause between actions for demos)? What would you
      have to be careful about?

  - id: base-test-review
    type: debug
    concept: framework-layers
    skill: analysis
    title: Review this BaseTest
    prompt: |
      Every test class in an old suite extends this `BaseTest`. Tests pass one by one and fail at random
      when the whole suite runs. Click every line that causes leaking state, slow runs or environment
      lock-in.
    language: java
    code: |
      public class BaseTest {
          protected static WebDriver driver;

          @BeforeAll
          static void setUp() {
              driver = new ChromeDriver();
              driver.manage().timeouts().implicitlyWait(Duration.ofSeconds(30));
              driver.get("http://192.168.1.24:8080/shop/");
          }

          @AfterEach
          void tearDown() throws Exception {
              Thread.sleep(2000);
          }
      }
    correctLines: [2, 7, 8, 13]
    lineNotes:
      - line: 6
        note: Creating a ChromeDriver is fine in itself. The problem is that one browser is shared by every test of the class through the static field on line 2.
      - line: 4
        note: "@BeforeAll is the right place for class-wide setup such as starting a server - but not for a browser that each test should get fresh."
      - line: 11
        note: An @AfterEach is the right hook - it should save evidence on failure and quit the browser, not sleep.
    hints:
      - Which line lets one test's cookies, storage and half-filled forms reach the next test?
      - Which lines tie the suite to one machine, or add time to every test?
    solution: |
      **Lines 2, 7, 8 and 13.**

      - **2** - a static, shared driver: every test in the class uses one browser, so state leaks and the
        first failure can poison the rest; parallel runs are impossible.
      - **7** - a 30-second implicit wait: every check for an absent element takes 30 s, and explicit waits
        become unpredictable.
      - **8** - a hard-coded address: the suite runs on one network only. Read it from configuration.
      - **13** - a fixed sleep after every test, and no `quit()` or evidence: slow, and browsers leak.

      The practice framework's answer: a browser per test from the extension, no implicit wait, `Config`
      for the address, evidence and `quit()` in `afterEach`.
    followUp: |
      Migrating 300 tests off this BaseTest at once is risky. Describe a step-by-step migration that keeps
      the suite green.

  - id: lifecycle-order
    type: order
    concept: framework-layers
    skill: recall
    title: The lifecycle of a test class
    prompt: |
      A test class using `ShopExtension` has two tests, and the first one fails. Put the events in order.
    items:
      - id: server
        text: Start the shop server and store the shop's address for the class
      - id: browser-one
        text: Start a new browser for the first test
      - id: test-one
        text: Run the first test - it fails
      - id: evidence
        text: Save a screenshot and the page source, then quit the first browser
      - id: browser-two
        text: Start a new browser for the second test
      - id: test-two
        text: Run the second test and quit its browser
      - id: stop
        text: Stop the shop server
    hints:
      - Class-level things happen once, around everything; test-level things happen around each test.
    solution: |
      **Server → browser 1 → test 1 → evidence and quit → browser 2 → test 2 and quit → stop the server.**
      The failure of the first test can't affect the second: it gets a fresh browser.
    followUp: |
      What changes in this order when you run with `-Dshop.url=...`?

  - id: biggest-win
    type: mcq
    concept: evidence-driven-growth
    skill: application
    title: The suite is too slow
    prompt: |
      The suite has 120 UI tests and takes 40 minutes on a CI runner with 4 cores. Measurements show no
      sleeps; each test spends most of its time waiting for the application. Tests already get their own
      browser and their own data. What do you add first?
    options:
      - id: parallel
        text: Parallel execution - JUnit's parallel mode with a few concurrent tests, sized to the runner
        feedback: Correct - the measurements point to waiting, not CPU, and the tests are already isolated, so running several at once is mostly configuration.
      - id: retries
        text: Automatic retries for failed tests
        feedback: Retries add time and do nothing for speed; there is no evidence of flakiness here.
      - id: short-timeouts
        text: Cut every wait timeout to 2 seconds
        feedback: Timeouts only matter when something fails - waits already end as soon as the condition holds. Shorter timeouts mainly add false failures.
      - id: reporting
        text: A richer reporting library
        feedback: Reports don't make runs faster - and nobody has asked for them.
    correct: [parallel]
    hints:
      - What do the measurements say the time is spent on, and what makes parallel runs safe?
    solution: |
      **Parallel execution.** Waiting for the application leaves CPU idle, and isolation (browser and data
      per test, no static state) is what makes parallel runs safe. Turn it on with
      `junit.jupiter.execution.parallel.enabled=true` **and** `junit.jupiter.execution.parallel.mode.default=concurrent`
      (enabled alone still runs everything in the same thread), cap the concurrency with the `fixed`
      strategy, and measure run time and failure rate before and after.
    followUp: |
      Which part of a framework typically breaks first when tests start running in parallel, and how would
      you detect it?

  - id: what-to-add
    type: short
    concept: evidence-driven-growth
    skill: application
    title: The proposal
    prompt: |
      A colleague proposes adding Cucumber, Allure reports, automatic retries and a parallel runner to the
      framework this sprint. In three to five sentences: how do you respond, and what would you ask for
      before adding each?
    hints:
      - For each, what need would justify it, and what evidence would show the need?
      - How would you know afterwards that it helped?
    modelAnswer: |
      I'd ask what problem each one solves for us now. Cucumber only pays off if non-programmers will read
      or write scenarios - do we have those readers? Allure is worth it if someone outside the team needs
      results the CI summary doesn't give. Retries hide failures, so first I'd want the failure history and
      a fix for each flaky cause; at most a tracked, temporary retry for a known external problem.
      Parallel runs are justified if run time is too long and tests are isolated - measure run time now,
      add it, and compare. One change at a time, each with a measurement before and after.
    rubric:
      - Asked for the need behind each proposal instead of accepting or rejecting all
      - Gave a concrete justification condition for at least three of the four
      - Treated retries as hiding failures and asked for the failure history
      - Proposed measuring before and after
      - Suggested introducing changes one at a time
    solution: |
      The habit: **a part enters the framework with a need and a measurement.** It is also the answer to
      the follow-up interview question "why isn't X in your framework?".

  - id: interview-walkthrough
    type: interview
    concept: framework-layers
    skill: application
    title: "Interview: walk me through your framework"
    prompt: |
      **Interviewer:** "Walk me through the automation framework you'd build for a checkout like this one.
      What are its parts, and why is each one there?"
    hints:
      - Layers first, then each part with the need behind it, then what you deliberately left out.
    modelAnswer: |
      - **Layers:** tests that state expectations; page objects and components with locators and waits;
        a lifecycle layer (a JUnit extension) and infrastructure (browser factory, configuration, a way to
        reach the app under test). Dependencies point down only.
      - **Lifecycle:** a fresh browser per test, quit in a finally block; evidence - screenshot, page
        source, URL - on failure, kept by CI.
      - **Configuration:** environment URL, headless, timeouts from system properties or the environment;
        secrets from the environment, never the repository.
      - **Waits:** explicit, inside page objects; no implicit waits, no sleeps.
      - **Left out on purpose:** retries, BDD, extra reporting, parallelism - added when a measured need
        appears; for example parallel runs once run time matters, which is easy because nothing is static.
    followUps:
      - Why a JUnit extension rather than a BaseTest class?
      - How do you keep test data independent between tests?
      - What would you change to run this suite in parallel?
    rubric:
      - Described the layers and the direction of dependencies
      - Explained browser-per-test isolation and quitting in finally
      - Mentioned evidence on failure
      - Mentioned configuration for environment and secrets outside the code
      - Justified parts with needs and named what was deliberately left out
    solution: |
      Strong answers give **a reason for each part** and show judgement about what is *not* there yet.
      Listing tools ("Selenium, TestNG, Cucumber, Allure, Jenkins") without reasons is the weak answer.

recall:
  - id: recall-layers
    concept: framework-layers
    prompt: Name the layers of the practice framework, top to bottom.
    answer: Tests; page objects and components; lifecycle (the JUnit extension) and infrastructure (Browser, ShopServer, Config) - with WebDriver and the browser at the bottom.
  - id: recall-dependencies
    concept: framework-layers
    prompt: Which direction may dependencies point in a framework?
    answer: Down only - tests use page objects and lifecycle code; page objects never import test frameworks; infrastructure knows nothing about tests.
  - id: recall-browser-per-test
    concept: framework-layers
    prompt: Why does every test get its own browser?
    answer: Isolation - no cookies, storage or half-finished state leak between tests, a failure can't poison later tests, and parallel runs become possible.
  - id: recall-static-driver
    concept: framework-layers
    prompt: What is wrong with a static WebDriver in a BaseTest?
    answer: All tests share one browser - state leaks, failures cascade, and tests can't run in parallel.
  - id: recall-growth-rule
    concept: evidence-driven-growth
    prompt: What is the rule for adding a part to the framework?
    answer: Add it when a test or a measurement shows the need - and measure afterwards whether it helped.
  - id: recall-retries
    concept: evidence-driven-growth
    prompt: Why are automatic retries not a default part of the framework?
    answer: They hide real races and real defects. Fix the cause; at most use a tracked, temporary retry for a known external problem.

next:
  - parallel-runs-and-thread-safety
  - ci-quality-gates

placement:
  - id: place-static-driver
    type: mcq
    concept: framework-layers
    skill: application
    title: Random failures in full runs
    prompt: |
      Tests pass one at a time and fail randomly when the whole suite runs. The framework stores the
      WebDriver in a static field of a BaseTest and creates it once per class. What is the most likely cause?
    options:
      - id: shared-state
        text: Tests share one browser, so state from one test (cookies, storage, open pages) affects the next
        feedback: Correct - give each test its own browser and quit it afterwards.
      - id: chrome-bug
        text: A Chrome bug that only appears in long sessions
        feedback: Possible in theory, but shared state explains "alone passes, together fails" directly - check that first.
      - id: timeouts
        text: The explicit wait timeouts are too short for a full run
        feedback: Timeouts don't depend on how many tests ran before - shared state does.
      - id: maven
        text: Maven runs the tests in random order on purpose
        feedback: Order matters here only because the tests share state; with isolated tests the order wouldn't matter.
    correct: [shared-state]
    solution: |
      **Shared state through the shared browser.** "Passes alone, fails together" is the signature of tests
      that are not isolated.

  - id: place-growth
    type: mcq
    concept: evidence-driven-growth
    skill: application
    title: The template framework
    prompt: |
      A team is starting UI automation for a new checkout. Which starting point fits the approach of this
      lesson?
    options:
      - id: template
        text: A complete template with BDD, three report formats, retries and Excel test data, ready for anything
        feedback: Every unused part is code to maintain and a concept to teach, and some (retries) hide failures.
      - id: minimal
        text: A browser per test, configuration, evidence on failure and page objects for the first journeys - then add parts as tests need them
        feedback: Correct - small, isolated, analysable, and every later addition comes with a reason.
      - id: no-framework
        text: No framework at all - raw WebDriver calls in each test until there are 100 tests
        feedback: Locators and waits then spread through every test; page objects and the lifecycle pay off from the first few tests.
      - id: record
        text: Record the journeys with a browser plug-in and keep the generated code
        feedback: Recorded scripts are full of brittle locators and contain no waits or structure.
    correct: [minimal]
    solution: |
      **Start small, with the parts every UI test needs from day one** - isolation, configuration,
      evidence and page objects - and grow from evidence.
