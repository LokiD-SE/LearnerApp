placement:
  - id: place-assertions
    type: mcq
    concept: page-object-responsibilities
    skill: application
    title: A page object that asserts
    prompt: |
      `OrderPage.checkPaid()` asserts that the status is SUCCEEDED. A new test needs to check that a
      declined-later payment ends FAILED. What is the best change?
    options:
      - id: status-getter
        text: Give OrderPage a status() method returning the text, and move the assertions into the tests
        feedback: Correct - the page reports; each test decides what it expects.
      - id: flag
        text: Add a parameter checkPaid(boolean expectFailure)
        feedback: Flags grow with every new scenario and keep the expectation in the page object.
      - id: copy
        text: Add checkFailed() next to checkPaid()
        feedback: It works for now, but every new expectation needs a new page-object method; returning the status serves all of them.
      - id: catch
        text: Call checkPaid() and catch the AssertionError in the new test
        feedback: Using a failure as control flow makes the test hard to read and hides real failures.
    correct: [status-getter]
    solution: |
      **Return the status; assert in the test.** Page objects describe the page; tests own the
      expectations.

  - id: place-shared-part
    type: mcq
    concept: page-components
    skill: application
    title: The same header everywhere
    prompt: |
      Every page of the shop has the same header with a cart count and links. How should the page objects
      model it?
    options:
      - id: component
        text: A Header component that each page object hands out
        feedback: Correct - modelled once, reused by composition.
      - id: copy
        text: Copy the header locators and methods into every page object
        feedback: Every header change then needs the same edit in every page object.
      - id: base-class
        text: A BasePage with the header methods that every page extends
        feedback: It works until pages need different shared parts; deep inheritance trees get rigid. Composition scales better.
      - id: test-locators
        text: Let the tests locate header elements themselves
        feedback: That puts locators back into tests - exactly what page objects exist to prevent.
    correct: [component]
    solution: |
      **A Header component**, handed out by the pages - `catalog.header().cartCount()`.
