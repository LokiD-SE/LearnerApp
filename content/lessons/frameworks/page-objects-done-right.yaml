id: page-objects-done-right
title: Page objects done right
subject: frameworks
module: page-object-model
level: intermediate
status: published
estimatedMinutes: 50
summary: What a page object is responsible for, what it must keep out, how components and iframes fit in, and how to grow page objects from real tests.
tags: [page object model, pom, selenium, components, iframe, test design, framework, interview]

environment: |
  - **Tools:** Selenium 4 with Java; the examples are the practice framework's page objects
    (`practice/framework/src/main/java/learnerapp/framework/pages`), which test the fictional SandPay
    Demo Shop.
  - **Guidance used:** the Selenium documentation says page objects "should never make verifications or
    assertions", with one exception - a check, made when the page object is created, that the page has
    loaded. Martin Fowler writes "I favor having no assertions in page objects" and records the opposite
    view too. Both say methods return other page objects (Fowler: "fundamental types ... or other page
    objects"), and both say a page object need not cover a whole page (components). Teams differ on
    details; the lesson says where. `PageFactory` (`@FindBy`) is in Selenium's `selenium-support` library;
    the Selenium page-object guide doesn't use it.
  - **Sources:**
    - [Selenium documentation: Page object models](https://www.selenium.dev/documentation/test_practices/encouraged/page_object_models/)
      - assertions, the load check, Page Component Objects, the summary rules (including "different results
      for the same action are modelled as different methods")
    - [Martin Fowler, "PageObject" (2013)](https://martinfowler.com/bliki/PageObject.html) - the
      application-specific API, return types, hiding asynchrony, the assertions debate
    - The code: `CheckoutPage`, `OrderPage`, `Header`, `SandPayCardFrame` and `CheckoutJourneyTest` in
      `practice/framework`
  - **Practice project:** `practice/framework` - see the coding exercise.

prerequisites:
  - selenium-waits-and-synchronisation
  - java-oop-pillars

concepts:
  - id: page-object-responsibilities
    name: Page object responsibilities
    summary: A page object offers the page's services in the user's terms, hides locators and waits, returns data or the next page object, and leaves assertions to the tests.
  - id: page-components
    name: Page components
    summary: Parts that repeat across pages or live in their own document - a header, a product card, a payment iframe - become components that pages hand out.

objectives:
  - Explain what belongs in a page object and what belongs in the test, and justify the split.
  - Write a page object whose methods express user intent, wait for their own results and return data or the next page object.
  - Model repeated parts and iframes as components.
  - Spot page-object designs that make tests brittle, slow or hard to read, and refactor them.

sections:
  - id: intuition
    kind: intuition
    concepts: [page-object-responsibilities]
    title: The idea in plain language
    body: |
      Think of a **hotel reception desk**. You say "I'd like to check in" and get a room key. You don't walk
      behind the desk, open drawers and type into the booking system yourself.

      A page object is the reception desk of one page. Tests ask for **services** - "add oat milk to the
      cart", "pay with this card", "what is the total?" - and the page object knows the drawers: the
      locators, the iframes, the spinners, what to wait for.

      When the page's layout changes, you change the desk, not every guest. And because the desk never
      decides whether the guest is happy (no assertions), every test can ask different questions about the
      same page.

  - id: what
    kind: what
    concepts: [page-object-responsibilities, page-components]
    title: What a page object is
    body: |
      A class that represents one page (or one screen) of the application:

      | Inside the page object | Outside - in the test or elsewhere |
      |---|---|
      | locators, as private constants | assertions - what is *right* |
      | methods named after what a user does: `addToCart`, `payAndExpectOrder` | test data creation (API calls, builders) |
      | waits for the page's own asynchronous behaviour | starting and stopping the browser |
      | returning data (`totalMinor()`, `productNames()`) or the next page object | knowledge of other pages' insides |
      | a check that the page has loaded (constructor) | business rules |

      A **component** is the same idea for a part of a page: the `Header` every page shares, the
      `SandPayCardFrame` inside an iframe. Pages hand components out (`catalog.header()`), so each part
      is modelled once.

  - id: why
    kind: why
    concepts: [page-object-responsibilities]
    title: Why page objects
    body: |
      - **One place per page.** When the Pay button's locator changes, one constant changes - not the
        thirty tests that pay.
      - **Tests read like the requirement.** `catalog.addToCart("oat-milk").header().goToCheckout()` says
        what happens; `driver.findElement(By.cssSelector(...)).click()` says how.
      - **Waits are written once,** next to the action that needs them, so no test forgets one.
      - **Interview staple:** almost every automation interview asks about POM. The strong answers are
        about responsibilities and trade-offs, not "a class with locators".

  - id: internals
    kind: internals
    concepts: [page-object-responsibilities, page-components]
    title: How the practice framework's page objects work
    body: |
      - **Locators are private constants.** `private static final By PAY = By.cssSelector(...)`. Elements
        are looked up when a method needs them, so a re-rendered page never leaves a stale element behind.
      - **Constructors check that the page is there.** `CheckoutPage` waits for the URL; `OrderPage` waits
        until a status is shown. A test that lands on the wrong page fails *at the navigation*, with a clear
        message, not three steps later.
      - **Navigation returns the next page object.** `Header.goToCheckout()` returns a `CheckoutPage`;
        `payAndExpectOrder()` returns an `OrderPage`. The test can't call checkout methods on the order page
        by mistake, and the IDE shows what is possible next.
      - **Expected outcomes get their own methods.** `payAndExpectOrder()` and `payAndExpectDecline()` wait
        for different results. The test states which outcome it expects; the page object knows how to
        recognise it. The *assertion* about the outcome (status SUCCEEDED, message text) stays in the test.
      - **Methods return data, not elements.** `totalMinor()` returns a `long`, `productNames()` a
        `List<String>`. Data can't go stale and keeps Selenium out of the tests.
      - **Components hide frames.** `SandPayCardFrame` switches into the iframe and always back
        (`try`/`finally`), so callers never think about frames.

  - id: visual
    kind: visual
    concepts: [page-components, page-object-responsibilities]
    title: "Diagram: tests, page objects, components"
    body: |
      ```mermaid
      flowchart LR
          T["CheckoutJourneyTest - what should happen"] --> C["CatalogPage"]
          C -- "header().goToCheckout()" --> K["CheckoutPage"]
          K -- "payAndExpectOrder()" --> O["OrderPage"]
          C --> H["Header component"]
          K --> F["SandPayCardFrame component"]
          C --> D["WebDriver"]
          K --> D
          O --> D
          H --> D
          F --> D
      ```

      The test talks only to page objects. Page objects return the next page object, use components for
      shared or framed parts, and are the only layer that talks to WebDriver.

  - id: steps
    kind: steps
    concepts: [page-object-responsibilities]
    title: Writing a page object, step by step
    body: |
      1. **Start from a test** that needs the page. Write the test first, in the user's words, calling
         methods that don't exist yet.
      2. **Create the class** with a constructor that takes the driver and checks the page has loaded.
      3. **Add one method per thing the test needs**, named after the user's intent, not the widget
         ("increaseQuantity", not "clickPlusButton").
      4. **Inside each method:** find the elements with private locators, act, and **wait for the visible
         result** before returning.
      5. **Return** data, `this` (same page), or the next page object.
      6. **Keep assertions in the test.** If several tests check the same thing, write a small assertion
         helper in the test code - not in the page object.
      7. **Extract a component** when a second page needs the same part, or when the part lives in a frame.

  - id: example
    kind: example
    concepts: [page-object-responsibilities]
    title: "Real-world example: the page object that tested everything"
    body: |
      A team's `CheckoutPage.pay()` clicked Pay, slept 3 seconds and asserted that the status was PAID.
      Over time it grew flags: `pay(card, expectDecline, skipStatusCheck, retries)`.

      Problems that followed:

      - A test for **declines** had to pass `expectDecline=true` to stop the page object failing the test.
      - A test for the **pending** case couldn't be written at all: the page object insisted on PAID.
      - Failures said `CheckoutPage.java:88 expected PAID` - nothing about which scenario failed.
      - The 3-second sleep ran in more than 200 tests: ten minutes of waiting per run.

      **Refactoring:** `pay()` became `payAndExpectOrder()` and `payAndExpectDecline()`, each waiting for its
      own outcome and returning the next page object or the decline message. Every assertion moved into
      the tests. The flags disappeared, the pending test became three lines, and the suite got ten minutes
      faster.

  - id: code
    kind: code
    concepts: [page-object-responsibilities, page-components]
    title: "Code: a page object and a test that uses it"
    collapsed: true
    body: |
      An excerpt of the practice framework's `CheckoutPage` (the full class also enters the email and the
      card, and reports whether Pay can be used), and a journey test from `CheckoutJourneyTest` (its
      `checkoutWithEspresso` helper written out inline):

      ```java
      public final class CheckoutPage {
          private static final By TOTAL = By.cssSelector("[data-testid='order-total']");
          private static final By PAY = By.cssSelector("[data-testid='pay-button']");
          private static final By ERROR = By.cssSelector("[data-testid='payment-error']");
          private static final By OVERLAY = By.cssSelector("[data-testid='processing-overlay']");

          private final WebDriver driver;
          private final WebDriverWait wait;

          public CheckoutPage(WebDriver driver) {
              this.driver = driver;
              this.wait = new WebDriverWait(driver, Config.timeout());
              wait.until(ExpectedConditions.urlContains("checkout.html"));   // the page has loaded
          }

          public long totalMinor() {
              return Long.parseLong(driver.findElement(TOTAL).getDomAttribute("data-amount-minor"));
          }

          /** Clicks Pay and returns at once, while the payment is still processing. */
          public CheckoutPage pay() {
              wait.until(ExpectedConditions.elementToBeClickable(PAY)).click();
              return this;
          }

          public OrderPage payAndExpectOrder() {
              pay();
              return new OrderPage(driver);              // its constructor waits for the order page
          }

          public String payAndExpectDecline() {
              pay();
              wait.until(ExpectedConditions.invisibilityOfElementLocated(OVERLAY));
              return wait.until(d -> {
                  String message = d.findElement(ERROR).getText().trim();
                  return message.isEmpty() ? null : message;
              });
          }
      }
      ```

      ```java
      @Test
      void aDeclinedCardShowsTheReasonAndCanBeRetried(WebDriver driver, Shop shop) {
          CheckoutPage checkout = CatalogPage.open(driver, shop)
              .addToCart("espresso-beans")
              .header().goToCheckout()
              .enterEmail("learner@example.com")
              .enterCard("sandpay-insufficient-funds", "Asha Rao");

          String message = checkout.payAndExpectDecline();

          assertTrue(message.contains("insufficient funds"), message);   // the test decides what is right
          assertTrue(checkout.canPay(), "the shopper can try another card");
      }
      ```

  - id: tests
    kind: tests
    concepts: [page-object-responsibilities]
    title: How to check a page object
    body: |
      | ID | Check | Why |
      |---|---|---|
      | P1 | no public method returns `WebElement` or `By`; no public fields | Selenium stays inside |
      | P2 | each action is immediately followed by a read in a test - without any wait in the test | the action waited for its own result |
      | P3 | a test landing on the wrong page fails in the constructor | load checks work |
      | P4 | the page object compiles without JUnit or AssertJ imports | no assertions inside |
      | P5 | two different tests (success and failure paths) can use it without flags | outcomes are separate methods |

      The coding exercise's `keepsSeleniumInsideThePageObject` test is check P1, done with reflection;
      `anIncreaseIsVisibleAsSoonAsTheMethodReturns` is check P2.

  - id: mistakes
    kind: mistakes
    concepts: [page-object-responsibilities, page-components]
    title: Common mistakes
    body: |
      - **Assertions inside page objects** - they decide for every test what is right, and fail with the
        page object's line number instead of the test's intent.
      - **Public `WebElement` fields or getters** - tests start clicking elements directly, and elements
        found in the constructor go stale after a re-render.
      - **Methods named after widgets** (`clickButton3`, `setTextField`) instead of intent.
      - **Sleeps** instead of waiting for the result of the action.
      - **Flags that change behaviour** (`pay(card, true, false)`) - write one method per outcome.
      - **One giant page object** for a whole application, or a `BasePage` that every page inherits a
        hundred helpers from - prefer small pages and components (composition) over deep inheritance.
      - **Frames handled by the tests** - forgetting to switch back breaks the next step; a component that
        always switches back can't forget.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [page-object-responsibilities, page-components]
    title: Trade-offs
    body: |
      | Question | Options |
      |---|---|
      | Assertions in page objects? | The Selenium documentation says no, except checking the page loaded; Fowler favours none but notes the other camp's reasons (less duplication, better messages). Some teams allow "verify" methods for very common checks - at the cost of the problems above. Fowler's alternative: shared assertion helpers in the test code. |
      | Fluent chaining (`return this`)? | Readable for flows; can hide which page you are on - return the *next* page object when the page changes. |
      | PageFactory (`@FindBy`)? | Part of Selenium's support library (`selenium-support`); less code for simple pages, but not used in the Selenium page-object guide. Plain `By` constants and lookups when needed keep the timing explicit - the practice framework uses those. |
      | Page objects for every page up front? | No - add pages and methods when a test needs them. Unused methods are untested code. |
      | Screenplay pattern instead? | Models actors, tasks and questions - scales better for very large suites; more concepts to learn. |

  - id: summary
    kind: summary
    title: Summary and quick reference
    body: |
      - A page object = the page's services in the user's terms. Locators private; waits inside.
      - Return data, `this` or the next page object - never `WebElement` or `By`.
      - Constructors check the page loaded; navigation returns the next page object.
      - One method per expected outcome (`payAndExpectOrder`, `payAndExpectDecline`), no flags.
      - Assertions belong to tests.
      - Components for shared parts and iframes; composition over a giant base class.
      - Grow page objects from tests that need them.

exercises:
  - id: belongs-in-page-object
    type: mcq
    concept: page-object-responsibilities
    skill: recognition
    title: What belongs in a page object?
    prompt: |
      Select everything that belongs **inside** a page object.
    options:
      - id: locators
        text: The page's locators, as private constants
        feedback: Yes - one place to change when the markup changes.
      - id: waits
        text: Waiting for the result of its own actions (a spinner, a re-render, a navigation)
        feedback: Yes - the page object knows what its page does after an action; tests shouldn't have to.
      - id: intent
        text: Methods named after what the user does, returning data or the next page object
        feedback: Yes - this is the page object's public face.
      - id: assertions
        text: Assertions that the payment succeeded
        feedback: No - what counts as right depends on the test. A decline test expects the opposite.
      - id: test-data
        text: Creating the customer and the cart through the API before the test
        feedback: No - test data setup belongs in fixtures or data helpers, not in a page's representation.
      - id: driver
        text: Starting ChromeDriver
        feedback: No - creating and closing browsers is infrastructure (the practice framework's Browser and ShopExtension).
    correct: [locators, waits, intent]
    hints:
      - Ask of each - does it describe the page, or does it describe the test?
    solution: |
      **Locators, waits for its own actions, and intent methods.** Assertions, data setup and browser
      management describe the test or the infrastructure, not the page.
    followUp: |
      The Selenium documentation allows one kind of check inside page objects. Which one, and where does
      the practice framework do it?

  - id: page-object-smells
    type: debug
    concept: page-object-responsibilities
    skill: analysis
    title: Review this page object
    prompt: |
      Click every line that breaks a page-object responsibility from this lesson.
    language: java
    code: |
      public class CheckoutPage {
          public WebElement payButton;
          private final WebDriver driver;

          public CheckoutPage(WebDriver driver) {
              this.driver = driver;
              this.payButton = driver.findElement(By.cssSelector("[data-testid='pay-button']"));
          }

          public void payWith(String testCard) throws InterruptedException {
              cardFrame().enter(testCard, "Asha Rao");
              payButton.click();
              Thread.sleep(3000);
              assertEquals("SUCCEEDED", driver.findElement(By.cssSelector("[data-testid='order-status']")).getText());
          }
      }
    correctLines: [2, 7, 13, 14]
    lineNotes:
      - line: 11
        note: Delegating the card fields to a component is good design - the frame handling lives in one place.
      - line: 12
        note: Clicking is the action itself. The problem is which element reference it uses (found once, in the constructor) - see line 7.
      - line: 3
        note: A private driver field is exactly right.
    hints:
      - Look for things that leak out of the class, things that go stale, guesses about time, and decisions about what is right.
    solution: |
      **Lines 2, 7, 13 and 14.**

      - **2** - a public `WebElement`: tests can click it directly, and Selenium leaks into them.
      - **7** - the element is found once, in the constructor; any re-render makes it stale. Use a private
        `By` and look it up when needed.
      - **13** - a sleep instead of waiting for the outcome.
      - **14** - an assertion, about another page's content: a decline test can't use this method.

      Also: `payWith` returns `void`. Split it into `payAndExpectOrder()` returning an `OrderPage` and
      `payAndExpectDecline()` returning the message - as the practice framework does.
    followUp: |
      Rewrite `payWith` as the two methods. Which waits does each need?

  - id: extract-page-object
    type: order
    concept: page-object-responsibilities
    skill: recall
    title: From script to page object
    prompt: |
      A long test script clicks through the cart page with raw `findElement` calls. Put the refactoring
      steps in order.
    items:
      - id: intent
        text: Rewrite the test in the user's terms, calling page-object methods that don't exist yet
      - id: class
        text: Create the page class with a constructor that checks the page has loaded
      - id: methods
        text: Implement each method with private locators, and wait for its visible result
      - id: returns
        text: Return data, this, or the next page object from each method
      - id: assertions
        text: Keep the assertions in the test, reading data the page object returns
      - id: run
        text: Run the tests, then delete the old script code
    hints:
      - Start from what the test needs, not from the page's elements.
    solution: |
      **Intent first, then the class, its methods and return values, assertions in the test, and finally
      prove it and clean up.** Starting from the test keeps the page object free of methods nobody needs.
    followUp: |
      Which of these steps would you skip if the page object already existed and only needed one new
      method?

  - id: cart-page-object
    type: coding
    concept: page-object-responsibilities
    skill: application
    title: Write the cart page object
    prompt: |
      The framework has no page object for the cart page yet, and new tests need one. Implement
      `CartPage`: product names, the quantity of a product, increasing a quantity, removing a product, the
      total, the empty state, and going to the checkout. Each change must wait for the page to show its
      result - the cart "saves on the server" for a moment. The tests also check that no public method
      returns a `WebElement` or a `By`.
    project: framework
    files:
      - src/exercises/java/learnerapp/exercises/pages/CartPage.java
    test: src/test/java/learnerapp/exercises/CartPageTest.java
    command: mvn test -Dtest=CartPageTest
    hints:
      - Open `cart.html` in the shop after adding items, and inspect a cart line - the class's Javadoc lists the test ids.
      - Write a private helper that finds the line for a product name (an `Optional<WebElement>`), and build the other methods on it.
      - "After clicking +, wait until the quantity you read is one more than before; after Remove, wait until the line is gone."
    modelAnswer: |
      ```java
      private static final By LINES = By.cssSelector("[data-testid='cart-line']");
      private static final By LINE_NAME = By.cssSelector("[data-testid='line-name']");
      private static final By LINE_QUANTITY = By.cssSelector("[data-testid='line-quantity']");
      private static final By INCREASE = By.cssSelector("[data-testid='increase']");
      private static final By REMOVE = By.cssSelector("[data-testid='remove']");

      public int quantityOf(String productName) {
          return line(productName)
              .map(line -> Integer.parseInt(line.findElement(LINE_QUANTITY).getText()))
              .orElse(0);
      }

      public CartPage increaseQuantity(String productName) {
          int before = quantityOf(productName);
          requiredLine(productName).findElement(INCREASE).click();
          wait.until(d -> quantityOf(productName) == before + 1);   // the page re-renders after saving
          return this;
      }

      public CartPage remove(String productName) {
          requiredLine(productName).findElement(REMOVE).click();
          wait.until(d -> line(productName).isEmpty());
          return this;
      }

      private Optional<WebElement> line(String productName) {
          return driver.findElements(LINES).stream()
              .filter(line -> line.findElement(LINE_NAME).getText().equals(productName))
              .findFirst();
      }
      ```

      `requiredLine` throws a clear exception naming the products that *are* in the cart; `totalMinor`,
      `isEmpty` and `goToCheckout` follow the same pattern as `CheckoutPage`.
    rubric:
      - Every test in CartPageTest passes
      - Locators are private constants and no public method returns WebElement or By
      - increaseQuantity and remove wait for the page to show their result
      - No assertions and no Thread.sleep inside the page object
      - goToCheckout returns a CheckoutPage
    solution: |
      The tests read the cart right after each change - with no wait in the test - so a page object that
      doesn't wait for its own result fails them. Lines are found fresh on every call, because the page
      re-renders the whole table after each change. The reference solution is in
      `src/solutions/java/learnerapp/exercises/pages/CartPage.java`.
    followUp: |
      Add `decreaseQuantity`. What should it do - and wait for - when the quantity is 1?

  - id: where-the-check-goes
    type: mcq
    concept: page-object-responsibilities
    skill: application
    title: Where does the total check go?
    prompt: |
      A test must check that the cart total is 40.47 EUR after adding two espresso beans and one oat milk.
      Where should the comparison with 4047 live?
    options:
      - id: in-test
        text: "In the test: `assertEquals(4047, cart.totalMinor())`"
        feedback: Correct - the page object reports the total; the test knows what this scenario expects.
      - id: verify-method
        text: "In the page object: `cart.verifyTotal(4047)`"
        feedback: Some teams do this for very common checks, but it moves the test's expectation into the page object and points failures at the page object, not the test. The Selenium documentation advises against it.
      - id: constructor
        text: In the CartPage constructor, which checks the total when the page opens
        feedback: Constructors should check that the page loaded - not business values that differ per test.
      - id: base-test
        text: In a BaseTest @AfterEach method that checks every cart
        feedback: A hidden after-each check runs for tests that expect a different total, and fails far from the cause.
    correct: [in-test]
    hints:
      - Which part knows that 4047 is the right number for this scenario?
    solution: |
      **In the test.** Page objects return data (`totalMinor()`); tests decide whether that data is right.
      If many tests need the same check, a small assertion helper in the test code keeps it in one place.
    followUp: |
      Five tests compare the cart against a list of expected lines. Design a helper for that, and say where
      it lives.

  - id: frame-component
    type: mcq
    concept: page-components
    skill: analysis
    title: The SandPay iframe
    prompt: |
      Card fields live in a SandPay iframe on the checkout page - and soon on a "saved cards" page too. A
      test sometimes fails after entering the card, with `NoSuchElementException` for the Pay button, which
      is clearly visible on the screenshot. Which design removes the cause?
    options:
      - id: component
        text: A SandPayCardFrame component whose methods switch into the frame and always switch back (try/finally); both pages hand it out
        feedback: Correct - the frame handling lives in one place and can't forget to switch back, and both pages reuse it.
      - id: test-switches
        text: Let each test switch into the frame and back itself
        feedback: That is where the bug comes from - one forgotten switchTo().defaultContent() leaves later lookups searching inside the frame.
      - id: base-page
        text: Put switchToCardFrame() and switchBack() in a BasePage that every page inherits
        feedback: Every page inherits frame methods it doesn't need, and callers still have to pair the calls correctly.
      - id: implicit-wait
        text: Add an implicit wait so the Pay button is found eventually
        feedback: The button is never found while the driver is still inside the iframe - waiting longer doesn't help.
    correct: [component]
    hints:
      - Where is the driver looking for the Pay button if nobody switched back from the iframe?
    solution: |
      **A component that switches in and always back.** The failure is a lookup in the wrong browsing
      context: after `switchTo().frame(...)` every `findElement` searches the iframe until someone calls
      `switchTo().defaultContent()`. A component with `try`/`finally` makes that impossible to forget -
      exactly what `SandPayCardFrame.inFrame` does.
    followUp: |
      The header appears on every shop page. Why is a `Header` component better than header methods copied
      into each page object?

  - id: interview-pom
    type: interview
    concept: page-object-responsibilities
    skill: application
    title: "Interview: the Page Object Model"
    prompt: |
      **Interviewer:** "Explain the Page Object Model. What makes a page object good, and what makes one
      bad?"
    hints:
      - Purpose, responsibilities, what stays out, components, and a concrete example.
    modelAnswer: |
      - A page object represents a page and offers its services to tests in the user's terms, hiding
        locators, frames and waits.
      - Good: private locators; intent methods that wait for their own results; return data or the next
        page object; a load check in the constructor; components for shared parts and iframes; small,
        grown from real tests.
      - Bad: assertions inside; public WebElements; sleeps; flags that change behaviour; one giant class or
        a deep BasePage hierarchy.
      - Example: `payAndExpectOrder()` returns an OrderPage, `payAndExpectDecline()` returns the message;
        the tests assert on status and message.
      - Benefit: one place to change when the UI changes, readable tests, and waits written once.
    followUps:
      - Should page objects contain assertions? Defend your answer.
      - How do you model a component that appears on many pages?
      - How do you stop page objects from growing into "god classes"?
    rubric:
      - Explained the purpose - the page's services in user terms, hiding mechanics
      - Named good practices - private locators, waits inside, returning data or next page objects
      - Kept assertions out of page objects, with the reason
      - Mentioned components for shared parts or iframes
      - Named at least two anti-patterns
    solution: |
      Strong answers talk about **responsibilities and trade-offs** with an example. Weak answers stop at
      "a class per page that holds the locators".

  - id: why-components
    type: short
    concept: page-components
    skill: recall
    title: Why components?
    prompt: |
      In two to four sentences: what is a page component, and why does the practice framework model the
      header and the SandPay iframe as components?
    hints:
      - Think about duplication and about frames.
    modelAnswer: |
      A component is a page object for part of a page. The header appears on every page, so modelling it
      once (`Header`) avoids copying its locators and methods into each page object, and pages simply hand
      it out. The SandPay fields live in an iframe; the `SandPayCardFrame` component switches into the frame
      and always back, so no caller can forget the switch.
    rubric:
      - Defined a component as a page object for part of a page
      - Gave avoiding duplication across pages as a reason
      - Gave hiding the iframe switching as a reason
    solution: |
      Components are composition: pages *have* a header, they don't *inherit* one.

recall:
  - id: recall-po-inside
    concept: page-object-responsibilities
    prompt: What belongs inside a page object?
    answer: Private locators, intent methods that wait for their own results, data getters, navigation that returns the next page object, and a check that the page loaded.
  - id: recall-po-outside
    concept: page-object-responsibilities
    prompt: What stays out of a page object?
    answer: Assertions, test data setup, browser creation, and knowledge of other pages' insides.
  - id: recall-return
    concept: page-object-responsibilities
    prompt: What should page object methods return?
    answer: Data (strings, numbers, lists), this when the page stays the same, or the next page object - never WebElement or By.
  - id: recall-outcomes
    concept: page-object-responsibilities
    prompt: How do you handle actions with different expected outcomes, like a payment that can succeed or be declined?
    answer: One method per expected outcome (payAndExpectOrder, payAndExpectDecline), each waiting for its own result - no flags.
  - id: recall-component
    concept: page-components
    prompt: What is a page component, and when do you create one?
    answer: A page object for part of a page - when a part repeats across pages or lives in its own document such as an iframe.
  - id: recall-frame
    concept: page-components
    prompt: How should a component handle an iframe?
    answer: Switch into the frame inside each method and always switch back in a finally block, so callers never deal with frames.

