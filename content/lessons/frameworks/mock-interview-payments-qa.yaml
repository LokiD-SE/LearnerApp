placement:
  - id: place-round-purpose
    type: mcq
    concept: payments-interview-loop
    skill: application
    title: What is this round for?
    prompt: |
      "Tell me about a time a release decision went against your recommendation." In which round would you expect
      this question, and what is it mainly assessing?
    options:
      - id: behavioural-judgement
        text: Behavioural or hiring manager - judgement, collaboration and how you handle disagreement, told from a real past situation
        feedback: Correct - "tell me about a time" asks for past behaviour, and the theme is judgement and collaboration.
      - id: domain
        text: Domain deep dive - knowledge of release processes
        feedback: Domain rounds test accurate knowledge connected to tests; this question asks for a past situation, not knowledge.
      - id: test-design-round
        text: Test design - how you prioritise test cases before a release
        feedback: Test design asks you to design coverage now; "tell me about a time" is the behavioural signature.
      - id: online
        text: Online assessment - fast recall under time pressure
        feedback: Online assessments are auto-graded multiple choice or small tasks; an open story can't be graded that way.
    correct: [behavioural-judgement]
    solution: |
      **Behavioural or hiring manager.** "Tell me about a time" is a behavioural question - past behaviour as a
      predictor of future behaviour - so answer with STAR and put your own actions in the centre.

  - id: place-debug-order
    type: order
    concept: structured-interview-answers
    skill: application
    title: Order a debugging answer
    prompt: |
      **Interviewer:** "Some customers were charged twice yesterday." Put the parts of a strong answer in order.
    items:
      - id: scope
        text: Restate the symptom and ask how many customers, since when, and on which channel
      - id: evidence
        text: Ask for order ids, provider payment records, idempotency keys and request logs
      - id: hypotheses
        text: List hypotheses - client retry with a new key, double submit, server-side race on one key - with a check for each
      - id: confirm
        text: Run the cheapest discriminating check first and confirm the cause both ways
      - id: contain
        text: Refund or void the duplicates and find every affected order by query
      - id: prevent
        text: Fix the cause and add a test or monitor that would catch a repeat
    solution: |
      **Scope → evidence → hypotheses with checks → confirm → contain and repair → prevent.** Jumping to "it's the
      retry logic" skips the evidence and the check - the most common reason debugging answers score 2.

  - id: place-strong-answer
    type: mcq
    concept: interview-signals-rubric
    skill: analysis
    title: Which answer meets the bar?
    prompt: |
      **Question:** "How do you test a webhook consumer?" Which answer would a rubric score highest?
    options:
      - id: tools
        text: "I use Postman to send the webhook and check that the response is 200, then I automate it in RestAssured."
        feedback: Tools without risks - no duplicates, ordering or signatures, and a 200 response proves little about the order's state.
      - id: risks-and-evidence
        text: Events can arrive twice, late or out of order and must be authentic, so I test duplicates, an older event after a newer one and bad signatures, and check the order's status and the number of status changes each time.
        feedback: Correct - the delivery risks, authenticity, concrete cases and evidence beyond the response code.
      - id: happy-path
        text: I trigger a payment in the sandbox and check the order becomes paid when the webhook arrives.
        feedback: A valid happy-path test, but it misses the delivery properties that cause real webhook defects.
      - id: defensive
        text: Webhooks are unreliable, so I'd recommend the team doesn't use them and polls instead.
        feedback: Avoids the question; polling is a back-up, and most providers report final status by webhook.
    correct: [risks-and-evidence]
    solution: |
      Rubrics reward **risks, cases and evidence** - at-least-once, unordered delivery and signatures, checked
      against the order's state. Tool names alone score 1-2.
