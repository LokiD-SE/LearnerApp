id: mock-interview-payments-qa
title: Mock interview - payments QA engineer
subject: frameworks
module: capstone
level: expert
status: published
estimatedMinutes: 110
summary: A full interview simulation for a payments QA role - the rounds of a typical loop, how to structure each kind of answer, the rubric interviewers score against - then one round after another on idempotency, unknown outcomes, refunds, webhooks, 3-D Secure, reconciliation, PCI DSS, framework design, flaky tests and a behavioural story, each with follow-ups.
tags: [interview, mock interview, payments, qa, sdet, star, test design, debugging, rubric, behavioural, capstone]

environment: |
  - **What this is:** a practice simulation. The questions are **written for this course in the style of each round**;
    they are **not** any company's real or leaked questions, and no company's loop is described here. For loops that
    candidates have publicly reported, with sources, use [Interview practice](#/interview).
  - **Loop shape:** the rounds below (screen, domain, test design, automation, debugging, behavioural or hiring
    manager) are the round types in this app's interview profiles, compiled from public candidate reports - for
    example the *Mid-market product companies (SDET)* profile. Real loops vary by company, team, level and year;
    confirm the format with your recruiter.
  - **Answer structures - sources:** STAR (Situation, Task, Action, Result) and the advice to spend most of the answer
    on *your* actions and end with a measurable result -
    [MIT CAPD - Using the STAR method for your next behavioral interview](https://capd.mit.edu/resources/the-star-method-for-behavioral-interviews/).
    Structured interviews - the same questions and probes for every candidate, answers scored against benchmarks of
    proficiency, behavioural ("describe a past behaviour") and situational ("what would you do") questions -
    [U.S. OPM - Structured Interviews](https://www.opm.gov/policy-data-oversight/assessment-and-selection/other-assessment-methods/structured-interviews/)
    and [Google re:Work - A guide to structured interviewing](https://rework.withgoogle.com/intl/en/guides/a-guide-to-structured-interviewing-for-better-hiring-practices),
    which describes scoring with standardised rubrics and detailed interviewer notes. Hypothesis-driven debugging
    follows Zeller, *Why Programs Fail*, as taught in [Scientific debugging](#/lesson/scientific-debugging).
  - **Opinion, labelled:** "clarify - assume - structure - prioritise" for test-design answers and the 1-4 rubric in
    this lesson are this course's practice aids, modelled on structured-interview scoring. They are not a standard and
    not any employer's scoring sheet.
  - **Payments facts** come from the course lessons each answer links to; standards are cited there - RFC 9110 and
    the IETF Idempotency-Key draft, EMVCo 3-D Secure, PCI DSS v4.0.1, ISO 20022 camt.053.
  - **Fictional:** SandPay (`https://api.sandpay.example`), its endpoints, events and every scenario. **No card numbers
    appear in this lesson.**

prerequisites:
  - e2e-payment-capstone
  - idempotency-keys
  - webhooks-and-async-status
  - declines-timeouts-unknown-outcomes
  - partial-refunds-and-invariants
  - scientific-debugging

concepts:
  - id: payments-interview-loop
    name: The payments QA interview loop
    summary: The rounds of a typical payments QA or SDET loop - screen, domain, test design, automation, debugging, behavioural or hiring manager - and what each one is there to find out.
  - id: structured-interview-answers
    name: Structured interview answers
    summary: STAR for past situations, clarify-assume-structure-prioritise for test design, and hypothesis-evidence-confirmation for debugging - shapes that let an interviewer find the signal quickly.
  - id: interview-signals-rubric
    name: Interview signals and the scoring rubric
    summary: Interviewers score answers against benchmarks - precise domain terms, risk and invariants, evidence, trade-offs, ownership - and follow-ups probe whether the answer is understood or memorised.

objectives:
  - Name the rounds of a payments QA interview loop and what each round assesses.
  - Structure a behavioural answer with STAR, a test-design answer with clarify-assume-structure-prioritise, and a debugging answer with hypotheses and evidence.
  - Score an answer against a rubric and explain which signals raise or lower the score.
  - Answer payments questions - double charges, unknown outcomes, refunds, webhooks, 3-D Secure, reconciliation, PCI DSS - out loud, with precise terms, tests and evidence, and handle the follow-ups.

sections:
  - id: intuition
    kind: intuition
    concepts: [payments-interview-loop, structured-interview-answers]
    title: The idea in plain language
    body: |
      An interview loop is like a **driving test with several examiners**. One checks you know the rules, one
      watches you plan a route, one sees how you react when something goes wrong, and one asks how you have driven
      in the past. Each fills in a sheet with fixed boxes. Brilliant driving that never lands in a box doesn't count.

      So two things matter: **knowing the domain** - the earlier lessons of this course - and **answering in a shape
      the examiner can score**. This lesson rehearses both. Read the first sections once, then work through the
      exercises as a mock loop: one round at a time, answering **out loud** before you open the model answer.

  - id: what
    kind: what
    concepts: [payments-interview-loop]
    title: What a payments QA loop usually looks like
    body: |
      Public candidate reports describe loops for QA and SDET roles that combine these round types (see the
      profiles in [Interview practice](#/interview)). The payments flavour comes from the questions, not from
      special rounds.

      | Round | Typical length | What it is there to find out | Payments flavour |
      |---|---|---|---|
      | **Screen** (recruiter or hiring team) | 20-30 min | your story, motivation, logistics | why payments; one product you know |
      | **Domain deep dive** | about 45 min | accurate knowledge connected to tests | lifecycle, idempotency, unknown outcomes, webhooks, 3DS, PCI DSS |
      | **Test design** | about 45 min | clarifying, coverage, priorities, evidence | "test partial refunds", "test a 3DS checkout" |
      | **Automation / framework** | about 50 min | code and design that survive in a real suite | API + web framework, test data, parallel runs |
      | **Debugging and RCA** | about 45 min | evidence before conclusions | duplicate charges, reconciliation breaks, flaky tests |
      | **Behavioural / hiring manager** | about 45 min | ownership, judgement, collaboration, measurable results | "a bug that mattered", a release decision |

      Some loops add an online test or a take-home; some merge domain and test design. The lengths are the usual
      ones in this app's round types - **confirm the real format with your recruiter**.

  - id: visual
    kind: visual
    concepts: [payments-interview-loop]
    title: "Diagram: the mock loop in this lesson"
    body: |
      ```mermaid
      flowchart LR
          S["Screen - story and motivation"] --> D["Domain - idempotency, timeouts, webhooks, 3DS, PCI DSS"]
          D --> T["Test design - partial refunds, 3DS checkout"]
          T --> A["Automation - framework, flaky parallel test"]
          A --> R["Debugging - reconciliation mismatch"]
          R --> B["Behavioural - a bug that mattered"]
          B --> H{"Debrief - each interviewer scores against the rubric"}
      ```

      Notice the last box: every interviewer writes notes and scores **independently**, and the decision is made
      from those scores. One brilliant round rarely rescues a weak one, so prepare every round.

  - id: why
    kind: why
    concepts: [structured-interview-answers, interview-signals-rubric]
    title: Why structure and rubrics decide the outcome
    body: |
      - **Interviews are increasingly structured.** The U.S. Office of Personnel Management describes structured
        interviews as the same pre-defined questions and probes for every candidate, scored against benchmarks of
        proficiency; it reports that more structure goes with higher validity. Google's re:Work guide describes
        standardised rubrics and detailed notes so that every reviewer judges answers the same way.
      - **A rubric rewards specific things.** If the benchmark for "unknown outcomes" says *"looks up status or
        retries with the same idempotency key before reporting failure"*, an answer that only says "I'd retry" scores
        low, however confident it sounds.
      - **Structure makes the signal easy to find.** An interviewer has minutes to write notes. A STAR story with a
        clear *Action* and a number in the *Result*, or a test design that says "P0 first", lands in the boxes.
      - **Follow-ups test depth.** Structured interviews pre-define probes too. The follow-ups in the exercises are
        the kind that separate a memorised term from understanding.

  - id: steps
    kind: steps
    concepts: [structured-interview-answers]
    title: Three answer shapes
    body: |
      **1. Behavioural ("Tell me about a time...") - STAR.** MIT's careers service suggests roughly: Situation 20%,
      Task 10%, **Action 60%**, Result 10% - most of the answer on what *you* did, in "I" statements, with a
      quantified result and what you learned. Add one line on what changed afterwards.

      **2. Test design ("How would you test...") - clarify, assume, structure, prioritise** (this course's aid):

      1. **Clarify** - two or three questions that change the design: which methods and channels, sync or async,
         who can trigger it, limits.
      2. **Assume** - say out loud what you will assume if there is no answer.
      3. **Structure** - name the risks and **invariants** first, then groups: happy path, negative, boundaries,
         state and sequence, concurrency and duplicates, failures and async, security and data.
      4. **Prioritise** - P0 cases first, each with its **evidence** (API response, provider record, ledger,
         event); then what you would automate and at which level.

      **3. Debugging ("This happened - what do you do?") - hypothesis and evidence.** Restate the symptom and its
      scope; ask for ids, logs and timings; list two or three **hypotheses**, each with the evidence that would
      confirm or reject it; run the cheapest discriminating check first; confirm the cause both ways; then the fix,
      the data repair and the test or monitor that stops a repeat. Say "plausible" until it is confirmed.

  - id: internals
    kind: internals
    concepts: [interview-signals-rubric]
    title: How answers are scored - the rubric used in this lesson
    body: |
      Each exercise below has a rubric of points interviewers listen for. To score a whole round, use this 1-4
      scale per question (a practice aid modelled on structured-interview benchmarks, not an employer's form):

      | Score | Label | What the answer showed |
      |---|---|---|
      | 1 | No evidence | vague or wrong; buzzwords without a test, a fact or an example |
      | 2 | Partial | correct idea, but missing the key risk, the evidence or the "why"; collapses at the first follow-up |
      | 3 | Meets the bar | correct and structured; risks, invariants and evidence named; survives follow-ups |
      | 4 | Strong | as 3, plus trade-offs, limits ("this is provider-specific - I'd check the docs"), prevention and measurable results |

      **Signals that raise a score:** precise terms (*unknown outcome*, not *failed*); invariants (*refunded ≤
      captured*); naming the evidence and where it comes from; separating a confirmed cause from a plausible one;
      saying what you would **not** test and why; "I" with numbers in stories.

      **Signals that lower it:** listing tools instead of reasons; "I'd retry" with no idempotency; trusting the
      browser redirect; a story about "we" with no result; guessing a cause without a check; claiming a provider's
      behaviour as universal.

  - id: example
    kind: example
    concepts: [interview-signals-rubric, structured-interview-answers]
    title: "Example: the same question, scored 2 and 4"
    body: |
      **Question:** "A customer says they were charged twice. What do you do?"

      **Answer scored 2:** "I'd check the logs, reproduce it, and raise a bug. Probably the retry logic. We should add
      idempotency."
      *Right words, no structure: which logs, what evidence, which layer? "Probably" without a check.*

      **Answer scored 4:** "First, is it two charges or an authorisation shown twice? I'd get the order id and pull
      the provider's payments for it. If there are two, I compare their idempotency keys. **Different keys** - our
      client created a second payment, so I look for a retry that generated a new key or a double submit. **Same
      key, two charges** - the server side failed to deduplicate, maybe a race. I'd confirm by replaying the request
      with the same key in a test environment. Then: refund or void the duplicate, find every affected order with a
      query, and add a concurrency test with two requests on one key."
      *Evidence first, two hypotheses with a check each, containment and prevention.* See
      [Idempotency keys](#/lesson/idempotency-keys).

  - id: when
    kind: when
    concepts: [payments-interview-loop]
    title: How to run this mock loop
    body: |
      - **One round per sitting**, in the loop order of the diagram. Set a timer: about 5-8 minutes per question.
      - **Answer out loud or in writing first**, then open the model answer and tick the rubric honestly.
      - **Then the follow-ups** - answer each in a sentence or two. Weak follow-up answers show what to revise.
      - **Score each question 1-4** and revise the linked lesson for anything below 3.
      - For timed rounds with questions picked for you, and company profiles, use [Interview practice](#/interview).

  - id: mistakes
    kind: mistakes
    concepts: [structured-interview-answers, interview-signals-rubric]
    title: Common mistakes
    body: |
      - **Listing test cases before clarifying.** Ten cases for the wrong feature score less than three questions and
        five well-chosen P0s.
      - **"We" stories.** The interviewer can't score the team. Say what *you* did.
      - **No result, or a result without a number.** "It went well" - instead: "no duplicate charges in the six months
        since; the test runs on every build".
      - **Memorised definitions.** "Idempotency means same result" fails the follow-up "so what does the server store?".
      - **Universal claims about provider behaviour.** Header names, retention, error codes and event names are
        provider-specific - say so.
      - **Guessing the root cause.** Name hypotheses and the check for each; "confirmed" only when the check held.
      - **Real card numbers or real company "leaked" questions** in your preparation material - neither belongs in an
        interview, and the first is a PCI DSS problem.

  - id: summary
    kind: summary
    title: Summary and quick reference
    body: |
      - Loop: **screen → domain → test design → automation → debugging → behavioural / hiring manager**; each
        interviewer scores independently.
      - Behavioural: **STAR**, most of it on your **Action**, a measured **Result**, what changed.
      - Test design: **clarify → assume → structure (risks, invariants, groups) → prioritise (P0 + evidence)**.
      - Debugging: **symptom and scope → evidence → hypotheses with checks → confirm → fix, repair, prevent**.
      - Rubric 1-4: vague → partial → meets (risks, evidence, survives follow-ups) → strong (trade-offs, limits,
        prevention, numbers).
      - Payments must-says: unknown ≠ failed; same idempotency key on retries; refunded ≤ captured; webhooks at least
        once and unordered; never trust the 3DS return; never log a PAN or verification code.

exercises:
  - id: which-round
    type: mcq
    concept: payments-interview-loop
    skill: application
    title: Which round is this?
    prompt: |
      An interviewer shares a log excerpt: two SandPay `payment.succeeded` events for one order, a settlement report
      with one payment, and an order marked unpaid. "Walk me through what you'd check." Which round is this, and what
      is it mainly assessing?
    options:
      - id: debugging
        text: Debugging and RCA - evidence before conclusions, hypotheses and how to test them
        feedback: Correct - you are given symptoms and evidence and asked how you would find the cause.
      - id: test-design
        text: Test design - coverage of positive, negative and boundary cases
        feedback: Test design asks you to design cases for a feature before anything has failed; here something already went wrong.
      - id: screen
        text: Screen - motivation and communication
        feedback: A screen stays at the level of your story and fit; it doesn't hand you logs to analyse.
      - id: behavioural
        text: Behavioural - a past situation told with STAR
        feedback: Behavioural questions ask about your past ("tell me about a time"); this is a present, hypothetical incident.
    correct: [debugging]
    hints:
      - Is the interviewer asking you to design, to recall the past, or to explain something that already happened?
    solution: |
      **Debugging and RCA.** The tell is evidence plus "what would you check". Answer with the hypothesis-evidence
      shape: restate the symptom, list hypotheses (duplicate event not de-duplicated, status update from an older
      event, a mapping bug), name the evidence for each, check the cheapest first.
    followUp: |
      "Design the tests that would have caught this before release" - which round does that follow-up move you into,
      and how does your answer shape change?

  - id: order-test-design-answer
    type: order
    concept: structured-interview-answers
    skill: application
    title: Order a test-design answer
    prompt: |
      **Interviewer:** "How would you test SandPay partial refunds?" Put the parts of a strong answer in the order you
      would say them.
    items:
      - id: clarify
        text: Ask whether refunds can be partial and repeated, who can trigger them, and whether the result is synchronous
      - id: assume
        text: State assumptions - several partial refunds allowed, result confirmed by a webhook
      - id: invariants
        text: Name the invariant - total refunded never above captured - and the risks around it
      - id: groups
        text: Group the cases - happy path, boundaries, sequences, concurrency, failures and duplicates, async status
      - id: prioritise
        text: Mark the P0 cases and the evidence for each - API response, provider record, ledger entry, event
      - id: automate
        text: Say which cases you would automate, at which level, and what you would not test
    hints:
      - Questions before answers; risks before cases; priorities after you know the cases.
    solution: |
      **Clarify → assume → invariant and risks → groups → P0 with evidence → automation and exclusions.** Clarifying
      first stops you designing for the wrong feature; the invariant gives every case an oracle; prioritising shows
      judgement.
    followUp: |
      Reorder the parts for a debugging question about a refund that went through twice. What replaces "groups" and
      "prioritise"?

  - id: score-the-answer
    type: mcq
    concept: interview-signals-rubric
    skill: analysis
    title: Score the answer
    prompt: |
      **Question:** "Our checkout timed out calling SandPay. What should happen next?" Which answer would score
      highest on the rubric?
    options:
      - id: fail-and-retry
        text: Mark the payment failed and ask the customer to pay again - a timeout means the provider didn't answer
        feedback: This treats an unknown outcome as a failure - the first request may have succeeded, so the customer can be charged twice.
      - id: lookup-same-key
        text: Treat it as unknown - look up the payment by reference or retry with the same idempotency key, show "confirming" meanwhile, and only report failure once the provider confirms no payment exists
        feedback: Correct - precise term, the safe recovery actions, the customer view and the evidence that ends the uncertainty.
      - id: longer-timeout
        text: Increase the timeout to 120 seconds so it doesn't happen again
        feedback: Longer timeouts reduce how often it happens but never remove it, and say nothing about what to do with the order now.
      - id: retry-new-request
        text: Retry the request up to three times, then show an error
        feedback: A retry is only safe with the same idempotency key - "retry" alone is the classic double-charge answer.
    correct: [lookup-same-key]
    hints:
      - Which answer uses the right term for "we don't know whether money moved"?
    solution: |
      **Look up or retry with the same key, and stay "confirming".** It names the outcome correctly (unknown),
      the recovery that cannot double-charge, and what the customer sees. See
      [Declines, timeouts and unknown outcomes](#/lesson/declines-timeouts-unknown-outcomes).
    followUp: |
      Write the follow-up an interviewer would ask the "retry three times" candidate to test whether they
      understand idempotency.

  - id: iv-screen-story
    type: interview
    concept: payments-interview-loop
    skill: application
    title: "Round 1 - screen: why payments QA?"
    prompt: |
      **Interviewer:** "Walk me through your background in about two minutes, and tell me why a payments QA role is
      the right next step for you."
    hints:
      - Past, present, why this role - and one concrete thing about payments that interests you.
      - Keep it short enough to invite follow-ups.
    modelAnswer: |
      - **Past (20 s):** "I started in manual testing on an e-commerce checkout, then moved to API and UI
        automation in Java."
      - **Present (40 s):** "For the last two years I've owned automation for an order service - about 300 API
        tests and 40 UI journeys in CI, with evidence on failure."
      - **Why payments (40 s):** "The bugs I found most valuable were around money - a duplicate order after a
        timeout, rounding in refunds. Payments has hard correctness rules - invariants, unknown outcomes, async
        status - and I want to test where those matter most."
      - **Close (20 s):** one sentence on what you know about their product and a question back.
    rubric:
      - Kept to about two minutes with a clear past - present - why structure
      - Gave concrete scope (systems, numbers) rather than a list of tools
      - Connected the motivation to something specific about payments
      - Ended in a way that invites the next question
    solution: |
      The screen checks **communication and motivation**. A short, concrete story with one real payments interest
      beats a CV read aloud. Prepare it, time it, and keep the numbers honest - every one can be probed later.
    followUps:
      - What is one payments concept you have tested, and how?
      - What do you know about how our customers pay?
      - What are you looking for in your next team that you don't have now?

  - id: iv-double-charge
    type: interview
    concept: interview-signals-rubric
    skill: application
    title: "Round 2 - domain: idempotency and the double charge"
    prompt: |
      **Interviewer:** "Explain how a payment API prevents double charges when the client retries. Then tell me how
      you would test it."
    hints:
      - Why is `POST` not enough on its own? What does the client send, and what does the server store?
      - Tests - same key, same key with a different body, two at once.
    modelAnswer: |
      - **Why:** `POST` is not idempotent by definition (RFC 9110), and after a timeout the client doesn't know
        whether the first request succeeded - so retries are normal and dangerous.
      - **How:** the client sends an idempotency key per **logical operation** and reuses it on every retry. The
        server validates it, fingerprints the request, **atomically reserves** the key, processes, stores the
        result and replays it for repeats; same key with a different body is rejected; a request still in
        progress gets a conflict or a wait. Header names, retention and codes are provider-specific.
      - **Tests:** same key twice → one payment, identical replayed response; same key, different amount →
        rejected; two parallel requests with one key → exactly one payment; key reused after expiry → documented
        behaviour; new key per retry in the client → caught by a client-side test.
      - **Evidence:** count of payments in the provider's records for the order, not just the responses.
    rubric:
      - Explained why a retry after a timeout can charge twice
      - Described the key per logical operation, reused on retries
      - Mentioned atomic reservation or the race between concurrent requests
      - Covered the different-body case and the in-progress case
      - Named the provider's records as evidence and said details are provider-specific
    solution: |
      The scoring signal is the **server mechanism plus the concurrency test** - most weak answers stop at "send a
      unique key". See [Idempotency keys](#/lesson/idempotency-keys).
    followUps:
      - Where should the key be generated - browser, app or backend - and when?
      - Two requests with the same key arrive 5 ms apart. What must the server do, and how do you test it?
      - A duplicate charge has two different keys. Where do you look?

  - id: iv-unknown-outcome
    type: interview
    concept: interview-signals-rubric
    skill: application
    title: "Round 2 - domain: the timeout nobody can explain"
    prompt: |
      **Interviewer:** "A customer's app lost its connection after they tapped Pay. The order shows 'payment
      failed'. Was that the right status? How would you test this area?"
    hints:
      - How many kinds of result are there, and which one is this?
      - Who resolves the uncertainty, and how?
    modelAnswer: |
      - **Probably not.** A lost connection is an **unknown** outcome, not a failure - money may or may not have
        moved. "Failed" invites a second payment.
      - **Right handling:** a "confirming" state; the backend looks up the payment by id or merchant reference, or
        retries with the same idempotency key; the webhook can also settle it; failure is reported only when the
        provider confirms there is no payment.
      - **Tests:** a delay beyond the client timeout, a dropped response after the provider succeeded, the app
        killed during the call, the lookup failing too (stays confirming, retries later), and the customer paying
        again from another device. Check the provider's records for the number of payments every time.
    rubric:
      - Named the outcome as unknown rather than failed
      - Gave the recovery - lookup or same-key retry - before telling the customer
      - Described what the customer sees meanwhile
      - Designed tests that inject delays, dropped responses and app death
      - Used the provider's record count as the oracle
    solution: |
      The single most important word is **unknown**. See
      [Declines, timeouts and unknown outcomes](#/lesson/declines-timeouts-unknown-outcomes).
    followUps:
      - Is a `502` from the provider a decline, an error or unknown?
      - How long would you keep an order in "confirming", and what then?
      - How do you simulate "the provider succeeded but the response was lost" in a test environment?

  - id: iv-partial-refunds
    type: interview
    concept: structured-interview-answers
    skill: application
    title: "Round 3 - test design: partial refunds"
    prompt: |
      **Interviewer:** "SandPay supports partial refunds on captured payments. Design the tests. Talk me through
      your approach before listing cases."
    hints:
      - Clarify and assume first. Which totals must always hold?
      - Two support agents refund at the same moment - what happens?
    modelAnswer: |
      - **Clarify:** several partial refunds allowed? Refunds on partially captured payments? Sync or confirmed by
        webhook? Who can refund - API, support tool?
      - **Assume:** repeated partial refunds, final status by webhook.
      - **Invariant:** **refunded ≤ captured ≤ authorised**, the sum of refund records equals the refunded total,
        status matches amounts, one currency.
      - **Groups:** happy path (one partial, then the rest → `refunded`); boundaries (exactly the remainder, 0.01
        over, zero, negative, more decimals than the currency has); sequences (refund after partial capture,
        refund on a voided payment); **concurrency** (two refunds of 60 on 100 at once → exactly one succeeds);
        duplicates (same idempotency key twice); failures (provider timeout on refund); async (webhook late or
        duplicated).
      - **P0 with evidence:** the boundary over the remainder, the concurrent pair, the duplicate key - each
        checked against the provider record, the ledger and the order.
      - **Automation:** API level for most; a property-based test that generates refund sequences and asserts the
        invariant after each step.
    rubric:
      - Clarified and stated assumptions before listing cases
      - Named the refund invariant and used it as the oracle
      - Included boundaries and invalid amounts
      - Included concurrent refunds and duplicate requests
      - Prioritised P0 cases and named evidence for each
    solution: |
      Strong answers make the **invariant** the centre and include the **parallel refund** case. See
      [Partial refunds and financial invariants](#/lesson/partial-refunds-and-invariants).
    followUps:
      - How would you make two refunds arrive at the server at the same moment in a test?
      - What guards against the race on the server - and how would you tell which one is used?
      - What would a property-based test generate, and what does shrinking give you?

  - id: iv-webhooks
    type: interview
    concept: interview-signals-rubric
    skill: application
    title: "Round 2 - domain: webhooks and async status"
    prompt: |
      **Interviewer:** "Our order service learns final payment status from SandPay webhooks. What can go wrong, and
      how do you test the consumer?"
    hints:
      - Delivery guarantees - how often, in what order?
      - Who sent this event, and how do you know?
    modelAnswer: |
      - **Delivery:** typical webhooks are **at least once, unordered, and retried** until the consumer answers
        `2xx`. So: duplicates, out-of-order events, and late events.
      - **Authenticity:** verify the signature before parsing - timestamp within tolerance, HMAC over the **raw**
        body, constant-time comparison. (SandPay's scheme is fictional; real schemes are provider-specific.)
      - **Correctness:** de-duplicate by event id and still answer `2xx`; forward-only status transitions so an
        older event can't move status backwards; re-fetch status when in doubt; answer fast and process from a
        queue; reconciliation or polling as a back-up for missed events.
      - **Tests:** duplicate event → one status change; `succeeded` then an older `pending` → stays succeeded;
        bad signature, stale timestamp, re-serialised body → rejected; consumer down for an hour → caught up by
        retries or reconciliation.
    rubric:
      - Stated at-least-once, unordered delivery
      - Described signature verification on the raw body with a timestamp check
      - De-duplication by event id and forward-only transitions
      - A back-up for missed events (polling or reconciliation)
      - Concrete tests with expected results
    solution: |
      See [Webhooks, signatures and asynchronous status](#/lesson/webhooks-and-async-status). Interviewers listen for
      **"at least once"** and **"raw body"** - two phrases that show you have tested this for real.
    followUps:
      - Why must the signature be checked on the raw body rather than the parsed JSON?
      - What should the consumer answer for an event it has already processed, and why?
      - How would you test that status never moves backwards?

  - id: iv-three-ds
    type: interview
    concept: structured-interview-answers
    skill: application
    title: "Round 3 - test design: a 3-D Secure checkout"
    prompt: |
      **Interviewer:** "Our checkout now sends card payments through 3-D Secure. How would you test it, especially
      the redirect out to the bank's page and back?"
    hints:
      - Frictionless and challenge, and the status values in between.
      - What can the customer, the browser or the network do to the return?
    modelAnswer: |
      - **Clarify:** which EMV 3DS version and flows does SandPay's sandbox support; which test triggers give
        frictionless, challenge, failed and unavailable results; are exemptions requested?
      - **Flows:** frictionless (`transStatus` Y) → authorisation; challenge (C) passed and failed; rejected (R),
        not authenticated (N), unavailable (U) - each with the expected payment and order state.
      - **Return:** **never trust the return** - read the status from the provider; tampered return parameters;
        return with no session (new tab, app switch); double return (back and forward, refresh); abandonment
        (customer closes the challenge) → order stays unpaid, payment cancelled or expired per the PSP, cart kept; webhook arriving before the return.
      - **Evidence:** provider status, order state, the customer's page, events - and no card data in the HAR or
        screenshots.
    rubric:
      - Covered frictionless and challenge flows and failed authentication
      - Treated the return redirect as untrusted and read the status from the provider
      - Included session loss, double return and abandonment
      - Handled the webhook-before-return race
      - Named evidence and kept card data out of it
    solution: |
      The strong signal is **"never trust the return"** plus the interruption cases. See
      [3-D Secure, redirects and return flows](#/lesson/three-d-secure-and-redirects).
    followUps:
      - Who decides whether an SCA exemption is granted?
      - What does `transStatus` A mean, and what would you expect next?
      - The customer completes the challenge but the return page shows an error. What is the order's state, and what should it be?

  - id: iv-pci-logs
    type: interview
    concept: interview-signals-rubric
    skill: application
    title: "Round 2 - domain: a card number in the logs"
    prompt: |
      **Interviewer:** "While testing, you notice the checkout service logs the full request body to the payment
      provider, including the card number and security code - in the test environment, with provider test cards.
      Is that a problem? What do you do?"
    hints:
      - Test data today - what does the same code path do in production?
      - Which PCI DSS requirements are involved, and who decides what happens next?
    modelAnswer: |
      - **Yes, a security defect.** The data is test data, but the **code path** would log real cards in
        production. PCI DSS v4.0.1 says sensitive authentication data such as the security code must not be kept
        after authorisation (3.3.1), and a PAN must be unreadable wherever stored (3.5.1); logs count.
      - **Do:** report it as a security defect with a cleaned excerpt - **never paste the values** into the ticket;
        check whether the same logging is enabled anywhere in production and escalate to the security team if so;
        ask for the logging to be removed or masked (brand and last four at most).
      - **Prevent:** a test that searches logs, error tracking and queues for PAN-like values after a checkout run;
        a review rule against logging request bodies on payment paths.
    rubric:
      - Recognised the code path as the risk, not only the test data
      - Named the relevant PCI DSS requirements or principles correctly
      - Kept card data out of the bug report and evidence
      - Escalated appropriately if production could be affected
      - Proposed an automated check to prevent recurrence
    solution: |
      Interviewers want **judgement and calm escalation**, plus clean evidence. See
      [PCI DSS awareness for testers](#/lesson/pci-dss-awareness).
    followUps:
      - Which parts of a card number may be displayed?
      - Why can't you use a real card "just once" in a test environment?
      - How does a hosted payment page change what your team's systems are in scope for?

  - id: iv-framework
    type: interview
    concept: payments-interview-loop
    skill: application
    title: "Round 4 - automation: a framework for payment journeys"
    prompt: |
      **Interviewer:** "Design the automation for SandPay checkout - API and web. What are the parts, how do tests
      get their data, and how do you handle the asynchronous parts?"
    hints:
      - Layers first, each with the need behind it.
      - Where does a test get a paid order from, and how does it wait for a webhook without sleeping?
    modelAnswer: |
      - **Layers:** tests that state expectations; page objects for the web journeys; an API client for SandPay
        and the shop; a lifecycle layer (browser per test, quit in `finally`, evidence on failure); configuration
        from the environment, secrets outside the repository. Dependencies point down only.
      - **Data:** each test creates its own orders and payments through the API with unique references - no shared
        "test customer" - so tests can run in any order and in parallel.
      - **Async:** poll the order status or the provider's record with a timeout and a clear failure message, never
        a fixed sleep; for webhook tests, send signed fixture events to the consumer directly.
      - **Levels:** most cases at API level; a few web journeys end to end; contract tests for the provider API.
      - **Left out until needed:** retries, BDD, extra reporting - added with a measured reason.
    rubric:
      - Described layers and the direction of dependencies
      - Gave each test its own data and explained why
      - Waited for async status by polling with a timeout, not sleeping
      - Put most cases at API level and justified the few UI journeys
      - Justified parts with needs and named what was left out
    solution: |
      Reasons for each part, data per test, and a correct approach to async waits are the signals. See
      [A small reference framework](#/lesson/reference-framework-skeleton).
    followUps:
      - How would you test the webhook consumer without the real provider calling you?
      - What would you need to change to run this suite in parallel?
      - How do you stop test payments piling up in the sandbox?

  - id: iv-flaky-parallel
    type: interview
    concept: structured-interview-answers
    skill: analysis
    title: "Round 4 - automation: the test that fails only in parallel"
    prompt: |
      **Interviewer:** "After you switched the suite to run four tests in parallel, `refundTest` fails about one run
      in ten with 'expected 1 refund but found 2'. It always passes alone. How do you find the cause?"
    hints:
      - '"Passes alone, fails in parallel" points at one family of causes. What is shared?'
      - Which evidence would separate a test-data clash from a real product race?
    modelAnswer: |
      - **Symptom and scope:** only in parallel, roughly 10%, a count assertion - so likely **shared state**.
      - **Hypotheses and checks:**
        1. *Shared test data* - two tests use the same order or customer, and the count includes the other
           test's refund. Check: log the order ids per test; are they the same?
        2. *Shared framework state* - a static driver, client or "last payment id" field. Check: grep for static
           mutable fields; run two instances of the test with distinct data.
        3. *A real product race* - two refunds created for one request. Check: provider records and idempotency
           keys for the order; can it be reproduced with two parallel API calls outside the suite?
      - **Confirm:** remove the suspected sharing → failures stop; restore → they come back.
      - **Fix:** unique data per test, no static state; if it is hypothesis 3, a product defect with evidence.
        **Never** a retry to make it green.
    rubric:
      - Recognised "passes alone, fails in parallel" as shared state
      - Listed more than one hypothesis, including a real product race
      - Gave a concrete check for each hypothesis
      - Confirmed the cause both ways before fixing
      - Rejected retries as a fix
    solution: |
      This is the **hypothesis-evidence** shape applied to automation. The best answers keep the possibility that
      the test found a **real** race. See [Scientific debugging](#/lesson/scientific-debugging) and
      [Java concurrency basics](#/lesson/java-concurrency-basics).
    followUps:
      - How would you measure the flaky-failure rate before and after the fix?
      - Your team lead wants to add an automatic retry and move on. What do you say?
      - What is wrong with a `ThreadLocal` driver that is never removed?

  - id: iv-recon-rca
    type: interview
    concept: structured-interview-answers
    skill: analysis
    title: "Round 5 - debugging: a reconciliation mismatch"
    prompt: |
      **Interviewer:** "Yesterday's SandPay payout is 1,250.00 lower than the total of yesterday's paid orders in
      our database. Finance asks whether money is missing. Walk me through your investigation."
    hints:
      - Which differences are normal before any of it is a break?
      - Match record by record - by which ids?
    modelAnswer: |
      - **Restate and scope:** the payout is lower than our paid orders by 1,250.00 - one day, one currency? Ask
        for the settlement report and the payout id.
      - **Normal differences first:** **fees**; **timing** (late captures settle in the next batch); **refunds**
        and **disputes** netted in the batch; currency; reserves. The payout is the sum of gross amounts and fees
        over every item in the batch, not the sum of orders.
      - **Match line by line** by payment id and order id: orders without a provider payment (missing),
        payments settled twice (duplicate), amount differences, status differences.
      - **Hypotheses** from what remains, each with a check - for example, orders marked paid whose payment
        actually failed: compare order status with the provider status for those ids.
      - **Report:** explained differences with evidence, real breaks with owners, and whether any customer or
        money is affected. Then a test: a fixture day with known fees, a late capture and a refund, expected
        results written in advance.
    rubric:
      - Separated normal differences (fees, timing, refunds, disputes) from breaks
      - Recomputed the payout from the batch rather than from orders
      - Matched record by record using ids
      - Formed hypotheses for remaining breaks with checks
      - Reported with evidence and proposed a regression test
    solution: |
      "Money is missing" is a conclusion; the strong answer **explains the difference** item by item first. See
      [Reconciliation for testers](#/lesson/reconciliation-for-testers) and
      [Inconsistent payment status incidents](#/lesson/inconsistent-status-incidents).
    followUps:
      - Which system is the source of truth for whether money moved?
      - How would you find every affected order if the cause turns out to be a status-mapping bug?
      - What does a bank statement in camt.053 add to this investigation?

  - id: iv-bug-that-mattered
    type: interview
    concept: structured-interview-answers
    skill: application
    title: "Round 6 - behavioural: a bug that mattered"
    prompt: |
      **Interviewer:** "Tell me about a bug you found that really mattered. What did you do, and what happened?"
    hints:
      - STAR - most of the time on your actions.
      - End with a number and what changed afterwards.
    modelAnswer: |
      Shape (use your own real story):

      - **Situation (short):** "Two weeks before a release of a new mobile checkout, I was testing payment on a poor
        network."
      - **Task:** "I owned payment testing for the release."
      - **Action (most of it):** "I saw that when the app was killed during the call, reopening it started a new
        payment. I reproduced it five times, captured the request ids, and showed that the retry used a new
        idempotency key. I checked the provider records - two charges each time. I estimated impact from the
        crash and timeout rates, wrote it up with evidence, and proposed two options to the product owner: delay,
        or ship with the retry disabled. I then wrote the automated test that kills the app mid-payment."
      - **Result:** "We fixed it before release - the key is now stored with the order. In the next six months
        support logged no duplicate-charge complaints from the app, and the test runs on every build."
      - **Learning:** "I now include process death in every payment test plan."
    rubric:
      - A specific, real situation with stakes
      - Most of the answer on their own actions, in "I"
      - Evidence and impact assessment, not just "I found it"
      - A measurable result
      - What changed afterwards - a test, a process, a habit
    solution: |
      MIT's STAR guidance puts about 60% of the answer on **Action** and asks for a quantified result. The signal is
      **ownership with judgement**: how you made the risk visible and helped decide. Never invent a story - the
      follow-ups will find it.
    followUps:
      - Why wasn't it caught earlier, and what did you change so it would be?
      - Who disagreed with you, and how did you handle it?
      - What would you do differently now?

recall:
  - id: recall-rounds
    concept: payments-interview-loop
    prompt: Name the rounds of a typical payments QA loop, in order.
    answer: Screen, domain deep dive, test design, automation or framework, debugging and RCA, behavioural or hiring manager - formats vary, so confirm with the recruiter.
  - id: recall-star
    concept: structured-interview-answers
    prompt: What does STAR stand for, and where should most of the answer go?
    answer: Situation, Task, Action, Result - most of it (MIT suggests about 60%) on your own Actions, with a quantified Result.
  - id: recall-test-design-shape
    concept: structured-interview-answers
    prompt: What are the four steps of a test-design answer in this course?
    answer: Clarify, assume, structure (risks, invariants, groups of cases), prioritise (P0 with evidence).
  - id: recall-debug-shape
    concept: structured-interview-answers
    prompt: How do you structure a debugging answer?
    answer: Restate symptom and scope, gather evidence, list hypotheses each with a check, confirm the cause both ways, then fix, repair data and add a test or monitor.
  - id: recall-rubric-4
    concept: interview-signals-rubric
    prompt: What separates a "strong" (4) answer from one that "meets the bar" (3)?
    answer: Trade-offs, limits (what is provider-specific or out of scope), prevention, and measurable results - on top of correct risks, evidence and surviving follow-ups.
  - id: recall-must-says
    concept: interview-signals-rubric
    prompt: Name four payments facts a strong candidate states without being asked.
    answer: A timeout is unknown, not failed; retries reuse the same idempotency key; refunded ≤ captured; webhooks are at least once and unordered; never trust the 3DS return; never log a PAN or security code.

