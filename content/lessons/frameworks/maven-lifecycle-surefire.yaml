id: maven-lifecycle-surefire
title: The Maven lifecycle and running tests with Surefire
subject: frameworks
module: maven
level: intermediate
status: published
estimatedMinutes: 50
summary: Phases and goals, which tests Surefire and Failsafe run and when they fail the build, choosing tests from the command line, and the flags that make builds green for the wrong reasons.
tags: [maven, lifecycle, surefire, failsafe, integration tests, junit tags, ci, build troubleshooting, interview]

environment: |
  - **Tools:** Apache Maven 3.8 or later; maven-surefire-plugin and maven-failsafe-plugin 3.5.6 (as in the
    practice projects); JUnit 6. Sources: the Maven "Introduction to the Build Lifecycle" and the Surefire
    and Failsafe plugin documentation.
  - **Version-specific, labelled:** native JUnit Platform (JUnit 5+) support arrived in Surefire 2.22.0;
    older Surefire versions run no Jupiter tests. Default include patterns are those of Surefire and
    Failsafe 3.x.
  - **Practice project:** `practice/maven` - the `checkout-suite` exercise.

prerequisites:
  - maven-pom-and-dependencies

concepts:
  - id: lifecycle-phases
    name: Lifecycle phases and goals
    summary: Phases run in order - validate, compile, test, package, verify, install, deploy - and invoking a phase runs every phase before it; plugin goals do the work, bound to phases.
  - id: surefire-and-failsafe
    name: Surefire and Failsafe
    summary: Surefire runs unit tests in the test phase and fails at once; Failsafe runs integration tests in integration-test and fails the build in verify, after clean-up has run.
  - id: test-selection
    name: Choosing which tests run
    summary: -Dtest, JUnit tags with groups and excludedGroups, include patterns and skip flags - and properties the command line can override.

objectives:
  - Explain which phases and goals a Maven command runs, and predict whether tests run for package, verify and install.
  - Configure Surefire and Failsafe so unit and integration tests run in the right phases and failures fail the build.
  - Select tests by class, method or tag from the command line and in the pom.
  - Spot configurations that make a build green while tests fail or don't run.

sections:
  - id: intuition
    kind: intuition
    concepts: [lifecycle-phases, surefire-and-failsafe]
    title: The idea in plain language
    body: |
      Maven's build is an **assembly line with fixed stations**: compile, test, package, verify, install,
      deploy. Asking for a station means running every station before it - you can't package what hasn't
      been compiled and tested.

      Two workers test the product at different stations:

      - **Surefire** checks parts on the line (unit tests). A bad part stops the line immediately.
      - **Failsafe** tests the assembled product with real connections (integration tests). It writes down
        failures, lets the line **tidy up** (stop servers, remove test data), and only then stops the line -
        in `verify`.

  - id: what
    kind: what
    concepts: [lifecycle-phases, test-selection]
    title: What the lifecycle is
    body: |
      **The default lifecycle** (main phases, in order):

      `validate` → `compile` → `test-compile` → `test` → `package` → `pre-integration-test` →
      `integration-test` → `post-integration-test` → `verify` → `install` → `deploy`

      Separate lifecycles: **clean** (`clean` deletes `target/`) and **site** (documentation).

      | Command | Runs |
      |---|---|
      | `mvn test` | everything up to and including unit tests |
      | `mvn package` | + builds the jar (unit tests run first) |
      | `mvn verify` | + integration tests and checks - the usual CI command |
      | `mvn install` | + copies the artifact to `~/.m2/repository` |
      | `mvn clean verify` | deletes `target/` first, then all of the above |
      | `mvn surefire:test` | only that goal - no compiling |

      **Choosing tests:**

      | Option | Effect |
      |---|---|
      | `-Dtest=CheckoutTest` / `-Dtest=CheckoutTest#addsTheFee` / `-Dtest='*Checkout*'` | only matching classes or methods (Surefire) |
      | `-Dit.test=CheckoutIT` | the same for Failsafe |
      | `-Dgroups=fast` / `-DexcludedGroups=slow` | by JUnit tag |
      | `-DskipTests` | compile tests, don't run them (Surefire and Failsafe) |
      | `-DskipITs` | skip only Failsafe's integration tests |
      | `-Dmaven.test.skip=true` | don't even compile the tests |

      **Default patterns** (3.x): Surefire runs `**/Test*.java`, `**/*Test.java`, `**/*Tests.java`,
      `**/*TestCase.java`; Failsafe runs `**/IT*.java`, `**/*IT.java`, `**/*ITCase.java`.

  - id: why
    kind: why
    concepts: [surefire-and-failsafe, test-selection]
    title: Why testers need to know this
    body: |
      - **CI runs your tests through Maven.** Whether a test runs, whether its failure turns the build red,
        and where its report lands are all Maven configuration.
      - **Silent gaps are common:** integration tests named `*IT` that never run because Failsafe isn't
        configured; Failsafe configured without its `verify` goal, so failures don't fail the build;
        `testFailureIgnore` left on from a debugging session.
      - **Fast feedback needs selection:** run one test while fixing it, keep slow suites out of every
        commit build, run them nightly.

  - id: internals
    kind: internals
    concepts: [lifecycle-phases, surefire-and-failsafe]
    title: How phases, goals and the test plugins work
    body: |
      - **Phases do nothing by themselves.** Plugin **goals** are bound to them. For a jar project:
        `compile` → `compiler:compile`, `test-compile` → `compiler:testCompile`, `test` → `surefire:test`,
        `package` → `jar:jar`, `install` → `install:install`, `deploy` → `deploy:deploy`. Failsafe's goals
        run only if you add the plugin with its executions.
      - **Surefire** forks a JVM, runs the test classes matching its patterns through the JUnit Platform,
        writes `target/surefire-reports/TEST-*.xml`, and fails the build at the end of the `test` phase if
        any test failed (unless `testFailureIgnore` is set).
      - **Failsafe's two goals:** `integration-test` runs the tests and records results in
        `target/failsafe-reports` **without failing**; `verify` reads those results and fails the build. Between
        them, `post-integration-test` runs - for example stopping a server started in `pre-integration-test`.
        Configure only `integration-test`, and failures never fail the build.
      - **Properties and the command line:** many plugin parameters have a user property (`excludedGroups`,
        `skipTests`, `test`). A value set as a `<properties>` entry can be overridden with `-D...`; a value
        written directly inside the plugin's `<configuration>` cannot.

  - id: visual
    kind: visual
    concepts: [lifecycle-phases, surefire-and-failsafe]
    title: "Diagram: phases and the goals bound to them"
    body: |
      ```mermaid
      flowchart LR
          C["compile: compiler:compile"] --> TC["test-compile: compiler:testCompile"]
          TC --> T["test: surefire:test - fails here"]
          T --> P["package: jar:jar"]
          P --> PRE["pre-integration-test: start services"]
          PRE --> IT["integration-test: failsafe:integration-test - records"]
          IT --> POST["post-integration-test: stop services"]
          POST --> V["verify: failsafe:verify - fails here"]
          V --> I["install: install:install"]
      ```

      Surefire fails the build in `test`. Failsafe deliberately waits until `verify`, so the clean-up phase
      between them still runs after a failing integration test.

  - id: steps
    kind: steps
    concepts: [test-selection, surefire-and-failsafe]
    title: Setting up unit and integration tests, step by step
    body: |
      1. **Name tests by kind:** unit tests `*Test`, integration tests `*IT`.
      2. **Pin Surefire** (3.x) - it runs `*Test` in `mvn test`.
      3. **Add Failsafe** with both goals, `integration-test` and `verify`.
      4. **Tag slow tests** (`@Tag("slow")`) and exclude the tag through a property -
         `<excludedGroups>slow</excludedGroups>` in `<properties>` - so `-DexcludedGroups=` can include them
         again.
      5. **CI commit build:** `mvn -B clean verify`. **Nightly:** `mvn -B clean verify -DexcludedGroups=`.
      6. **Check the test counts** in the output and keep `target/*-reports` as CI artefacts.

  - id: example
    kind: example
    concepts: [surefire-and-failsafe]
    title: "Real-world example: three months of integration tests that never ran"
    body: |
      A team wrote integration tests for their payments API - `RefundIT`, `WebhookIT`, `SettlementIT` - and
      CI stayed green. When a refund defect reached production, someone looked for the integration test that
      should have caught it. It existed, but it had never run: the project had no Failsafe configuration, and
      Surefire's default patterns don't include `*IT`.

      **Evidence:** `target/failsafe-reports` didn't exist; the CI log showed only the unit test count; running
      `mvn verify -Dit.test=RefundIT` locally did nothing.

      **Fix:** Failsafe with both goals - and when it first ran, two of the eleven tests failed. A CI check was
      added that compares the number of `*IT` classes with the number of Failsafe reports, so a test that is
      silently skipped is noticed. You set up the same build in the coding exercise.

  - id: code
    kind: code
    concepts: [surefire-and-failsafe, test-selection]
    title: "Code: Surefire, Failsafe and tags"
    collapsed: true
    body: |
      ```xml
      <properties>
        <!-- a property, so the command line can override it: -DexcludedGroups= -->
        <excludedGroups>slow</excludedGroups>
      </properties>

      <build>
        <plugins>
          <plugin>
            <groupId>org.apache.maven.plugins</groupId>
            <artifactId>maven-surefire-plugin</artifactId>
            <version>3.5.6</version>
          </plugin>
          <plugin>
            <groupId>org.apache.maven.plugins</groupId>
            <artifactId>maven-failsafe-plugin</artifactId>
            <version>3.5.6</version>
            <executions>
              <execution>
                <goals>
                  <goal>integration-test</goal>
                  <goal>verify</goal>          <!-- without it, failures never fail the build -->
                </goals>
              </execution>
            </executions>
          </plugin>
        </plugins>
      </build>
      ```

      ```bash
      mvn test -Dtest=CheckoutTest#addsTheFee      # one method while you fix it
      mvn verify -Dit.test=CheckoutIT              # one integration test class
      mvn test -DexcludedGroups=                   # include the slow tests too
      mvn verify -DskipITs                         # unit tests only, faster
      mvn -B clean verify                          # what CI should run
      ```

  - id: tests
    kind: tests
    concepts: [surefire-and-failsafe, test-selection]
    title: Checking the build itself
    body: |
      | ID | Check | Catches |
      |---|---|---|
      | M1 | unit and integration test counts in the output match the code | unconfigured Failsafe, wrong names, old Surefire |
      | M2 | make a test fail on purpose: the build must go red | `testFailureIgnore`, Failsafe without `verify` |
      | M3 | `mvn test` doesn't run tests tagged `slow`; `-DexcludedGroups=` does | selection in the pom that the command line can't override |
      | M4 | reports exist in `target/surefire-reports` and `target/failsafe-reports` and are kept by CI | missing evidence after a failure |
      | M5 | the build passes from a clean state (`clean`, fresh CI agent) | dependence on leftovers in `target/` or `~/.m2` |

      The coding exercise's test class does M1 to M3 by running Maven on your project four times.

  - id: mistakes
    kind: mistakes
    concepts: [surefire-and-failsafe, test-selection, lifecycle-phases]
    title: Common mistakes and how to troubleshoot
    body: |
      - **Integration tests named `*IT` with no Failsafe** - they never run.
      - **Failsafe without the `verify` goal** - failures are recorded, the build stays green.
      - **`testFailureIgnore` or `-Dmaven.test.failure.ignore=true` left on** - red tests, green build.
      - **`-Dmaven.test.skip=true` where `-DskipTests` was meant** - test classes aren't compiled, so a test
        compile error goes unnoticed.
      - **Selection hard-coded inside `<configuration>`** that the command line can't change.
      - **`mvn install` in CI when `verify` is enough** - it writes to the agent's local repository, which
        other builds may then pick up.
      - **Automatic re-runs of failing tests** (Surefire's `rerunFailingTestsCount`) used to make flaky tests
        pass instead of fixing them.

      **Troubleshooting:** read the plugin lines in the output (`maven-surefire-plugin:3.5.6:test`) to see
      which plugin and version ran; read `target/surefire-reports/*.txt` for the failure; add `-e` for stack
      traces or `-X` for debug output; `mvn help:effective-pom` shows the configuration Maven actually used.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [test-selection, surefire-and-failsafe]
    title: Trade-offs
    body: |
      | Choice | Gains | Costs |
      |---|---|---|
      | integration tests in the same module (Failsafe) | one build, one command | longer builds; needs services available |
      | a separate test module or project | independent schedule and dependencies | versions to keep in step |
      | tags (`slow`, `smoke`) | flexible selection without renaming | tags drift unless reviewed |
      | `-DskipITs` in commit builds, ITs nightly | fast feedback | defects found later; nightly failures need owners |
      | re-running failed tests | fewer red builds from known external flakiness | hides real races - track every re-run |

  - id: summary
    kind: summary
    title: Summary and quick reference
    body: |
      - A phase runs every earlier phase; goals do the work. CI: `mvn -B clean verify`.
      - Surefire: `*Test`, `test` phase, fails immediately. Failsafe: `*IT`, `integration-test` records,
        `verify` fails - configure **both** goals.
      - Select: `-Dtest=Class#method`, `-Dit.test=...`, `-Dgroups` / `-DexcludedGroups`, `-DskipITs`.
      - `-DskipTests` compiles tests; `-Dmaven.test.skip=true` doesn't.
      - Never leave `testFailureIgnore` on. Check test counts and keep the reports.

exercises:
  - id: lifecycle-order
    type: order
    concept: lifecycle-phases
    skill: recall
    title: The default lifecycle
    prompt: |
      Put these phases of Maven's default lifecycle in order.
    items:
      - id: compile
        text: "`compile`"
      - id: test
        text: "`test`"
      - id: package
        text: "`package`"
      - id: integration-test
        text: "`integration-test`"
      - id: verify
        text: "`verify`"
      - id: install
        text: "`install`"
    hints:
      - You can't test what isn't compiled, or package what isn't tested.
    solution: |
      **compile → test → package → integration-test → verify → install** (then deploy). Integration tests
      come after package because they test the packaged artifact.
    followUp: |
      Where do `pre-integration-test` and `post-integration-test` fit, and what would you do in each?

  - id: what-package-runs
    type: mcq
    concept: lifecycle-phases
    skill: application
    title: What does mvn package do?
    prompt: |
      In a project with Surefire and Failsafe configured, you run `mvn package`. What happens? Select every
      one that applies.
    options:
      - id: compiles
        text: The main and test code are compiled
        feedback: Yes - compile and test-compile come before package.
      - id: unit-tests
        text: The unit tests run
        feedback: Yes - the test phase comes before package.
      - id: its
        text: The integration tests run
        feedback: No - integration-test comes after package. Run verify for those.
      - id: m2
        text: The jar is copied to ~/.m2/repository
        feedback: No - that is the install phase.
    correct: [compiles, unit-tests]
    hints:
      - List the phases up to and including package.
    solution: |
      **Compilation and unit tests**, then the jar is built in `target/`. Integration tests need `verify`;
      copying to the local repository needs `install`.
    followUp: |
      A teammate uses `mvn package -DskipTests` to "build faster" before running integration tests. What does
      that skip, and is it what they meant?

  - id: checkout-suite-build
    type: coding
    concept: surefire-and-failsafe
    skill: application
    title: Set up the checkout-suite build
    prompt: |
      Configure `checkout-suite`'s pom so that `mvn test` runs only the fast unit tests (not the test tagged
      `slow`), `mvn test -DexcludedGroups=` runs every unit test, `mvn verify` also runs the integration test
      `CheckoutIT`, and a failing integration test fails the build. The test class runs Maven on your project
      four times to check all of it. Change only the pom.
    project: maven
    files:
      - src/exercises/projects/checkout-suite/pom.xml
    test: src/test/java/learnerapp/maven/CheckoutSuiteBuildTest.java
    command: mvn test -Dtest=CheckoutSuiteBuildTest
    hints:
      - "Surefire's `excludedGroups` parameter reads the `excludedGroups` property - set it in `<properties>`, so `-DexcludedGroups=` can override it."
      - Which plugin runs classes ending in IT, and in which phase?
      - "That plugin has two goals. Which one actually fails the build? Try `mvn verify -Dcheckout.it.fail=true` in the project."
    modelAnswer: |
      ```xml
      <properties>
        ...
        <excludedGroups>slow</excludedGroups>
      </properties>
      ...
      <plugin>
        <groupId>org.apache.maven.plugins</groupId>
        <artifactId>maven-failsafe-plugin</artifactId>
        <version>3.5.6</version>
        <executions>
          <execution>
            <goals>
              <goal>integration-test</goal>
              <goal>verify</goal>
            </goals>
          </execution>
        </executions>
      </plugin>
      ```
    rubric:
      - Every test in CheckoutSuiteBuildTest passes
      - The slow tag is excluded through a property the command line can override
      - Failsafe is configured with both the integration-test and verify goals
      - Explained why a failing integration test didn't fail the build with integration-test alone
    solution: |
      The checks: `mvn test` runs 2 tests and not `ReportExportTest`; `-DexcludedGroups=` runs 3; `mvn verify`
      produces a Failsafe report for `CheckoutIT`; `-Dcheckout.it.fail=true` makes `verify` fail. Reference:
      `src/solutions/projects/checkout-suite/pom.xml`.
    followUp: |
      Add a `nightly` Maven profile that runs everything, including slow tests, and say which command CI would
      use at night.

  - id: green-but-failing
    type: debug
    concept: surefire-and-failsafe
    skill: analysis
    title: Red tests, green build
    prompt: |
      CI is green, but the reports show failing unit tests **and** failing integration tests. Click the lines
      responsible.
    language: xml
    code: |
      <plugin>
        <artifactId>maven-surefire-plugin</artifactId>
        <version>3.5.6</version>
        <configuration>
          <testFailureIgnore>true</testFailureIgnore>
        </configuration>
      </plugin>
      <plugin>
        <artifactId>maven-failsafe-plugin</artifactId>
        <version>3.5.6</version>
        <executions>
          <execution>
            <goals>
              <goal>integration-test</goal>
            </goals>
          </execution>
        </executions>
      </plugin>
    correctLines: [5, 14]
    lineNotes:
      - line: 3
        note: A pinned, current Surefire is right.
      - line: 10
        note: The Failsafe version is fine - the problem is which of its goals run.
    hints:
      - Which setting tells Surefire to carry on after failures?
      - Which Failsafe goal turns recorded failures into a failed build?
    solution: |
      **Lines 5 and 14.** `testFailureIgnore` makes Surefire report failures and carry on. Failsafe runs only
      `integration-test`, which records failures without failing; the `verify` goal is missing. Remove line 5,
      and add `<goal>verify</goal>` after line 14.
    followUp: |
      Somebody added `testFailureIgnore` "temporarily" to unblock a release. What process or check would stop
      that from staying in the pom?

  - id: run-one-method
    type: mcq
    concept: test-selection
    skill: application
    title: Run one test method
    prompt: |
      You are fixing `CheckoutTest.addsTheFee` and want to run only that method. Which command?
    options:
      - id: hash
        text: "`mvn test -Dtest=CheckoutTest#addsTheFee`"
        feedback: Correct - Class#method selects a single method.
      - id: dot
        text: "`mvn test -Dtest=CheckoutTest.addsTheFee`"
        feedback: The separator for a method is #, not a dot.
      - id: groups
        text: "`mvn test -Dgroups=addsTheFee`"
        feedback: groups selects by JUnit tag, not by method name.
      - id: surefire-goal
        text: "`mvn surefire:test -Dtest=CheckoutTest#addsTheFee` with no earlier compile"
        feedback: Running only the goal skips compilation - it runs whatever was compiled last, which may not include your change.
    correct: [hash]
    hints:
      - Surefire's test parameter accepts Class#method.
    solution: |
      **`mvn test -Dtest=CheckoutTest#addsTheFee`.** Patterns work too: `-Dtest='Checkout*'`.
    followUp: |
      How would you run one integration test method with Failsafe?

  - id: skip-flags
    type: mcq
    concept: test-selection
    skill: application
    title: Skip running, keep compiling
    prompt: |
      For a quick packaging check you want to skip running every test, but still find out if the test code
      compiles. Which option?
    options:
      - id: skip-tests
        text: "`-DskipTests`"
        feedback: Correct - test classes are compiled; Surefire and Failsafe don't run them.
      - id: maven-test-skip
        text: "`-Dmaven.test.skip=true`"
        feedback: That also skips compiling the tests - a compile error in test code would go unnoticed.
      - id: skip-its
        text: "`-DskipITs`"
        feedback: That skips only Failsafe's integration tests; unit tests still run.
      - id: test-none
        text: "`-Dtest=none`"
        feedback: Surefire fails when no test matches the pattern (unless told otherwise) - and it isn't the documented way to skip.
    correct: [skip-tests]
    hints:
      - One option skips running; another skips compiling as well.
    solution: |
      **`-DskipTests`.** Keep `-Dmaven.test.skip=true` for the rare case where test code must not even be
      compiled.
    followUp: |
      Should a CI pipeline ever use `-DskipTests`? Give one case where it is reasonable and one where it isn't.

  - id: interview-maven-ci
    type: interview
    concept: surefire-and-failsafe
    skill: application
    title: "Interview: unit and integration tests in Maven"
    prompt: |
      **Interviewer:** "How do you organise unit tests and integration tests in a Maven project, and what do
      you run in CI?"
    hints:
      - Naming, plugins and their phases, failing the build, selection and reports.
    modelAnswer: |
      - Unit tests named `*Test`, run by Surefire in `test`; integration tests named `*IT`, run by Failsafe.
      - Failsafe with both goals: `integration-test` runs them, `verify` fails the build - so
        `post-integration-test` clean-up still runs after a failure.
      - Slow suites tagged and excluded by default through a property; included nightly with
        `-DexcludedGroups=`.
      - CI: `mvn -B clean verify`; keep `target/surefire-reports` and `target/failsafe-reports`; check test
        counts; no `testFailureIgnore`.
      - Locally: `-Dtest=Class#method`, `-Dit.test=...`, `-DskipITs` for speed.
    followUps:
      - Why does Failsafe fail the build in verify and not in integration-test?
      - What is the difference between -DskipTests and -Dmaven.test.skip=true?
      - How would you notice that an integration test silently stopped running?
    rubric:
      - Named Surefire for unit tests and Failsafe for integration tests with their naming conventions
      - Explained Failsafe's integration-test and verify goals
      - Described a selection strategy such as tags and excludedGroups
      - Gave a CI command and kept the reports
      - Mentioned guarding against green builds with skipped or ignored tests
    solution: |
      Strong answers explain **why Failsafe waits until verify** and how they make sure tests that should run
      actually do.

recall:
  - id: recall-phase-runs-earlier
    concept: lifecycle-phases
    prompt: What does running a phase such as mvn verify do?
    answer: It runs every phase before verify in the default lifecycle, in order, then verify.
  - id: recall-goals
    concept: lifecycle-phases
    prompt: What is the difference between a phase and a goal?
    answer: A phase is a step in the lifecycle; a goal is a plugin task. Goals are bound to phases and do the actual work.
  - id: recall-failsafe-goals
    concept: surefire-and-failsafe
    prompt: Why does Failsafe have two goals?
    answer: integration-test runs the tests and records failures without failing, so post-integration-test clean-up can run; verify then fails the build.
  - id: recall-patterns
    concept: surefire-and-failsafe
    prompt: Which classes do Surefire and Failsafe run by default?
    answer: Surefire - Test*, *Test, *Tests, *TestCase. Failsafe - IT*, *IT, *ITCase.
  - id: recall-one-method
    concept: test-selection
    prompt: How do you run a single test method with Surefire?
    answer: mvn test -Dtest=ClassName#methodName
  - id: recall-skip
    concept: test-selection
    prompt: -DskipTests or -Dmaven.test.skip=true?
    answer: -DskipTests compiles the tests and doesn't run them; -Dmaven.test.skip=true doesn't compile them either.

