placement:
  - id: place-it-not-running
    type: mcq
    concept: surefire-and-failsafe
    skill: application
    title: The integration tests never run
    prompt: |
      A project has `RefundIT` and `WebhookIT` in `src/test/java`. `mvn verify` passes, but there is no
      `target/failsafe-reports` folder. What is missing?
    options:
      - id: failsafe
        text: The maven-failsafe-plugin with its integration-test and verify goals
        feedback: Correct - nothing runs *IT classes without it.
      - id: rename
        text: The classes must be renamed to *Test
        feedback: That would make Surefire run them as unit tests in the test phase - not what integration tests need.
      - id: install
        text: Integration tests only run with mvn install
        feedback: They run in integration-test, which verify already includes - once Failsafe is configured.
      - id: tags
        text: They need a JUnit tag
        feedback: Tags select tests; they don't make an unconfigured plugin run.
    correct: [failsafe]
    solution: |
      **Failsafe**, with both goals.

  - id: place-package
    type: mcq
    concept: lifecycle-phases
    skill: application
    title: Do tests run?
    prompt: |
      Does `mvn package` run the unit tests?
    options:
      - id: unit-yes
        text: Yes - test comes before package
        feedback: Correct.
      - id: unit-no
        text: No - only mvn test runs tests
        feedback: Running a phase runs every earlier phase, including test.
      - id: install-only
        text: Only if you also run install
        feedback: install comes after package; tests have already run by then.
      - id: flag
        text: Only with -DrunTests=true
        feedback: There is no such flag - tests run by default and are skipped with -DskipTests.
    correct: [unit-yes]
    solution: |
      **Yes.** Every phase up to `package` runs, including `test`.

  - id: place-override
    type: mcq
    concept: test-selection
    skill: application
    title: Excluding slow tests
    prompt: |
      Tests tagged `slow` must be excluded by default but included at night with `-DexcludedGroups=`. Where
      should the exclusion be set?
    options:
      - id: property
        text: As the excludedGroups property in the pom's properties
        feedback: Correct - the plugin reads the property, and a command-line -D overrides it.
      - id: configuration
        text: Inside the surefire plugin's configuration element
        feedback: A value written inside the plugin's configuration takes precedence over the command-line property, so the night build couldn't include the slow tests.
      - id: rename
        text: Rename slow tests to *SlowTest and exclude by pattern
        feedback: Possible, but renaming is clumsier than a tag and still needs a way to switch it at night.
      - id: comment
        text: Comment out the slow tests during the day
        feedback: That is a code change per run - and slow tests get forgotten.
    correct: [property]
    solution: |
      **A property.** Command-line `-D` values override properties, not values hard-coded in a plugin's
      configuration.
