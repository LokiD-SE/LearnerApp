placement:
  - id: place-route
    type: mcq
    concept: network-interception
    skill: application
    title: An error state on demand
    prompt: |
      How do you make the catalog show its error state in a test, without changing the server?
    options:
      - id: route
        text: "`page.route('**/products.json', r => r.fulfill({ status: 503 }))` before goto"
        feedback: Correct.
      - id: edit
        text: Ask the team to break the staging server during the test
        feedback: Slow, disruptive and not repeatable.
      - id: evaluate
        text: Use page.evaluate to show the error element
        feedback: That fakes the outcome instead of testing the page's handling.
      - id: offline
        text: Turn the whole context offline
        feedback: That also stops the page itself loading, unless done after it loads - and is less precise than a route.
    correct: [route]
    solution: |
      **A route registered before navigation.**

  - id: place-api
    type: mcq
    concept: api-testing-with-playwright
    skill: application
    title: Fast test data
    prompt: |
      A UI test about refunds needs a paid order. Creating one through the UI takes 25 seconds. What is the usual
      better approach?
    options:
      - id: api-fixture
        text: Create the paid order through the API (request fixture) in a fixture, then test the refund in the UI
        feedback: Correct - fast setup, and the UI test focuses on what it is about.
      - id: ui-anyway
        text: Keep creating it through the UI so it is realistic
        feedback: The order-creation UI has its own tests; repeating it here costs time and adds failure points.
      - id: shared-order
        text: Reuse one order for every refund test
        feedback: Refunds change the order - tests would interfere with each other.
      - id: mock-everything
        text: Mock every request of the refund page
        feedback: Then nothing real is refunded; that tests only the UI's handling of fake responses.
    correct: [api-fixture]
    solution: |
      **API setup in a fixture.**

  - id: place-trace
    type: mcq
    concept: debugging-with-traces
    skill: application
    title: Evidence from CI
    prompt: |
      Retries are off in CI. Which setting keeps a detailed trace of every failing test without storing traces
      for the passing ones?
    options:
      - id: retain
        text: "`trace: 'retain-on-failure'`"
        feedback: Correct.
      - id: on
        text: "`trace: 'on'` for every test"
        feedback: Records and keeps every test's trace, passing ones included - large artefacts; the docs call it resource-heavy.
      - id: off
        text: "`trace: 'off'` and screenshots only"
        feedback: A screenshot shows one moment; the trace shows the steps leading to it.
      - id: video
        text: "`video: 'on'` for every test"
        feedback: Video shows what happened on screen, but not the DOM, network or console - and costs more.
    correct: [retain]
    solution: |
      **`retain-on-failure`** - it records every test and keeps only the failures' traces. With retries enabled,
      `on-first-retry` (the docs' CI recommendation) records only the retried runs.
