placement:
  - id: place-missing-await
    type: mcq
    concept: promises-and-async-await
    skill: application
    title: A test that ends early
    prompt: |
      `expect(page.getByTestId('order-status')).toHaveText('SUCCEEDED');` - written without `await` as the last
      line of a test. What happens when the status is wrong?
    options:
      - id: passes
        text: The test can pass - it ends before the assertion has finished
        feedback: Correct - web-first assertions are async; an un-awaited one isn't waited for.
      - id: fails
        text: The test fails as usual
        feedback: Only if the assertion finishes before the test does - which nothing guarantees.
      - id: compile
        text: TypeScript refuses to compile it
        feedback: It is valid TypeScript; only lint rules such as no-floating-promises flag it.
      - id: hang
        text: The test hangs until the timeout
        feedback: Nothing waits for the promise, so nothing hangs.
    correct: [passes]
    solution: |
      **It can pass.** Await every Playwright action and assertion.

  - id: place-combinator
    type: mcq
    concept: promise-combinators
    skill: application
    title: Every outcome
    prompt: |
      You need the result of every one of five independent checks, including the failed ones, as fast as
      possible. Which combinator?
    options:
      - id: allsettled
        text: Promise.allSettled
        feedback: Correct.
      - id: all
        text: Promise.all
        feedback: It stops at the first rejection.
      - id: any
        text: Promise.any
        feedback: It settles with the first success.
      - id: race
        text: Promise.race
        feedback: It settles with the first to finish.
    correct: [allsettled]
    solution: |
      **Promise.allSettled.**

  - id: place-types
    type: mcq
    concept: typescript-for-tests
    skill: application
    title: Data from an API
    prompt: |
      Which type should a helper use for `await response.json()` before it has validated the data?
    options:
      - id: unknown
        text: "`unknown` - then narrow it with checks"
        feedback: Correct - the compiler forces you to check before you use it.
      - id: any
        text: "`any`"
        feedback: any switches the checks off - a typo in a property name compiles and fails at run time.
      - id: cast
        text: "Cast it straight to `Product[]`"
        feedback: A cast tells the compiler to trust you; nothing checks the data really is a list of products.
      - id: object
        text: "`object`"
        feedback: Too vague to use, and doesn't help you check the shape.
    correct: [unknown]
    solution: |
      **`unknown`**, then check its shape (the practice project's `fetchProducts` does exactly that).
