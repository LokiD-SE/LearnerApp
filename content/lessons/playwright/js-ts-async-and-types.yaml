id: js-ts-async-and-types
title: "JavaScript and TypeScript for testers: async, promises and types"
subject: playwright
module: js-ts-basics
level: intermediate
estimatedMinutes: 55
status: published
summary: The parts of JavaScript and TypeScript that Playwright tests live on - promises, async/await, running work concurrently, and types that catch mistakes before a test runs.
tags: [javascript, typescript, async, await, promises, promise.all, allsettled, generics, playwright, interview]

environment: |
  - **Languages:** modern JavaScript (ES2022+) and TypeScript 6 in strict mode, on Node.js 20 or later
    (LearnerApp uses Node 24). Promise combinators (`Promise.all`, `allSettled`, `race`, `any`) are
    standard JavaScript - documented on MDN.
  - **Playwright specifics, labelled:** Playwright runs TypeScript test files directly by transpiling them,
    but it **does not type-check** them; run `tsc --noEmit` (the practice project's `npm run typecheck`).
  - **Practice project:** `practice/playwright` - `check-all.js` is plain JavaScript with JSDoc types,
    `poll-until.ts` is TypeScript. Both tests run under Playwright Test without a browser.
  - **Examples:** SandPay and its statuses are fictional.

prerequisites:
  - java-types-and-variables

concepts:
  - id: promises-and-async-await
    name: Promises and async/await
    summary: An async function returns a promise at once; await pauses that function - not the program - until the promise settles. An un-awaited promise runs on without anyone waiting for it.
  - id: promise-combinators
    name: Running async work together
    summary: Promise.all waits for every promise and fails fast, allSettled waits for every outcome, race takes the first to settle, any the first to succeed - and starting promises before awaiting them is what makes work concurrent.
  - id: typescript-for-tests
    name: TypeScript for test code
    summary: Types, interfaces, unions and generics catch wrong arguments and missing awaits before a test runs - if something actually type-checks the code.

objectives:
  - Predict the order in which async code runs, and spot missing awaits in test code.
  - Run independent async steps concurrently with the right combinator, and collect failures without losing them.
  - Write typed helpers with interfaces and generics, and type-check a Playwright project.
  - Explain the differences a Java tester meets in JavaScript and TypeScript.

sections:
  - id: intuition
    kind: intuition
    concepts: [promises-and-async-await, promise-combinators]
    title: The idea in plain language
    body: |
      A **promise** is a receipt for something that isn't ready yet - like the ticket a coffee shop gives you.
      `await` means "stand at the counter until my coffee comes". Other customers are still served while you
      wait: JavaScript runs one thing at a time, but it never blocks on waiting - it moves on to whatever else
      is ready.

      - Forget to `await` and you walk away with the ticket - the coffee is still made, but nobody picks it up,
        and if something goes wrong nobody hears about it.
      - Ordering three coffees, then waiting for all three (`Promise.all`), is faster than ordering one,
        waiting, ordering the next.

      **TypeScript** is the barista checking your order before it's made: "you asked for a size that doesn't
      exist". It catches mistakes while you write the code - but only if someone actually checks.

  - id: what
    kind: what
    concepts: [promises-and-async-await, promise-combinators, typescript-for-tests]
    title: What you need to know
    body: |
      **Promises and async functions**

      - A `Promise<T>` will either **fulfil** with a value of type `T` or **reject** with an error.
      - An `async` function always returns a promise - even `async () => 42` returns `Promise<number>`.
      - `await p` pauses the async function until `p` settles, then gives the value or throws the error -
        so `try`/`catch` works around `await`.
      - Every Playwright action and assertion is async: `await page.goto(...)`, `await
        expect(locator).toBeVisible()`.

      **Combinators**

      | Call | Resolves when | Rejects when |
      |---|---|---|
      | `Promise.all(ps)` | all fulfil - with their values, in input order | the **first** rejects |
      | `Promise.allSettled(ps)` | all settle - with `{ status, value or reason }`, in input order | never |
      | `Promise.race(ps)` | the first settles (fulfils or rejects) | the first to settle rejects |
      | `Promise.any(ps)` | the first fulfils | all reject (`AggregateError`) |

      **TypeScript essentials for test code**

      | Feature | Example |
      |---|---|
      | annotations | `function totalMinor(lines: Line[]): number` |
      | interfaces and type aliases | `interface Product { sku: string; price: number }` |
      | unions and literal types | `type Status = 'PENDING' \| 'SUCCEEDED' \| 'FAILED'` |
      | generics | `function pollUntil<T>(read: () => Promise<T>, isDone: (value: T) => boolean): Promise<T>` |
      | `unknown` | for data from outside (JSON, errors) - check before use |
      | type-only imports | `import type { Page } from '@playwright/test'` |

  - id: why
    kind: why
    concepts: [promises-and-async-await, typescript-for-tests]
    title: Why testers trip over async code
    body: |
      - **A missing `await` doesn't fail loudly.** The test continues before the click, the assertion or the
        API call has finished. It may pass, fail somewhere unrelated, or fail only on slow machines.
      - **`forEach` with an async callback** fires every callback and returns immediately - a classic way to
        "check" a list of items without checking anything.
      - **Sequential awaits are slow.** Ten independent API checks awaited one by one take ten times as long
        as awaiting them together.
      - **Coming from Java:** there are no threads to block and no checked exceptions; errors travel inside
        promises; types are erased at run time; `==` converts types (use `===`).

  - id: internals
    kind: internals
    concepts: [promises-and-async-await, promise-combinators]
    title: How the event loop runs async code
    body: |
      JavaScript runs on **one thread** with an **event loop**:

      1. Run the current synchronous code to the end.
      2. Run all queued **microtasks** - the continuations of settled promises (the code after an `await`).
      3. Take the next **task** - a timer that fired, a network response, a message - and run it; go to step 2.

      Consequences:

      - Code after `await` runs **later**, as a microtask - even if the promise was already settled.
      - A `setTimeout(fn, 0)` callback runs after all pending microtasks.
      - **Concurrency without threads:** `const a = fetchA(); const b = fetchB(); await a; await b;` starts both
        requests before waiting - they overlap. `await fetchA(); await fetchB();` doesn't start B until A is done.
      - **Unhandled rejections:** a rejected promise that nobody awaits or catches is reported as an unhandled
        rejection - by then the code that started it has moved on.

      **TypeScript** compiles to JavaScript and its types disappear at run time. A tool that only *transpiles*
      (as Playwright does for test files) removes the types without checking them - so type errors don't stop
      the test run. `tsc --noEmit` is the check.

  - id: visual
    kind: visual
    concepts: [promises-and-async-await]
    title: "Sequence: what really happens with forEach(async ...)"
    body: |
      ```mermaid
      sequenceDiagram
          participant T as Test code
          participant F as forEach
          participant C as Each check
          T->>F: checks.forEach(async check => ...)
          F->>C: start check 1 - returns a promise, ignored
          F->>C: start check 2 - returns a promise, ignored
          F-->>T: forEach returns undefined at once
          T->>T: return summary - still empty
          C-->>C: the checks finish later - nobody is waiting
      ```

      `forEach` calls the callback and ignores what it returns. With `await Promise.allSettled(checks.map(...))`
      the test waits for every check and keeps their results in order.

  - id: when
    kind: when
    concepts: [promise-combinators]
    title: Which combinator, when
    body: |
      | Situation | Use |
      |---|---|
      | steps that depend on each other (log in, then open the cart) | sequential `await` |
      | independent steps, and any failure should stop everything | `Promise.all` |
      | independent checks where you need every outcome (a smoke-check report) | `Promise.allSettled` |
      | a timeout around an operation | `Promise.race` with a timer - or the library's own timeout option |
      | "whichever mirror answers first" | `Promise.any` |
      | many items with a limit on how many run at once | batches of `Promise.all`, or a small concurrency helper |

      In Playwright tests, keep page actions **sequential** - one page does one thing at a time. Concurrency
      pays off for API calls and data setup.

  - id: example
    kind: example
    concepts: [promises-and-async-await]
    title: "Real-world example: the smoke check that always passed"
    body: |
      A post-deployment smoke script checked twelve SandPay endpoints:

      ```js
      const failures = [];
      endpoints.forEach(async (url) => {
        const response = await fetch(url);
        if (!response.ok) failures.push(url);
      });
      if (failures.length) process.exit(1);
      ```

      It never failed - including the day the payments API was down. **Evidence:** adding a log line inside the
      callback showed the "failed" messages printed *after* the script had already exited with success.

      **Fix:** `const results = await Promise.allSettled(endpoints.map(check))`, then decide from the results.
      The team also enabled the `@typescript-eslint/no-floating-promises` lint rule (it needs type information),
      which flags promises that are neither awaited nor handled.

  - id: code
    kind: code
    concepts: [promises-and-async-await, promise-combinators, typescript-for-tests]
    title: "Code: async patterns and types for tests"
    collapsed: true
    body: |
      ```ts
      import type { APIRequestContext } from '@playwright/test';

      type Status = 'PENDING' | 'SUCCEEDED' | 'FAILED';

      interface Payment {
        id: string;
        status: Status;
        amountMinor: number;
      }

      // sequential: the second call needs the first one's result
      const created = await request.post('payments', { data: { amountMinor: 1999 } });
      const payment = (await created.json()) as Payment;

      // concurrent: start everything, then wait for everything
      const [refunds, events] = await Promise.all([
        request.get(`payments/${payment.id}/refunds`),
        request.get(`payments/${payment.id}/events`),
      ]);

      // every outcome, in order - failures included
      const results = await Promise.allSettled(checks.map((check) => check.run()));
      const failed = results.filter((r) => r.status === 'rejected');

      // a generic helper keeps the caller's types
      async function pollUntil<T>(read: () => Promise<T>, isDone: (value: T) => boolean): Promise<T> {
        for (;;) {
          const value = await read();
          if (isDone(value)) return value;
          await new Promise((resolve) => setTimeout(resolve, 250));
        }
      }
      const status = await pollUntil(readStatus, (s) => s !== 'PENDING');   // status: Status

      // errors from outside are unknown until checked
      try {
        await submit();
      } catch (error: unknown) {
        const message = error instanceof Error ? error.message : String(error);
      }
      ```

      ```bash
      npx tsc --noEmit        # type-check - Playwright itself only transpiles
      ```

  - id: tests
    kind: tests
    concepts: [promises-and-async-await, promise-combinators]
    title: Testing async helpers
    body: |
      | ID | Test | Catches |
      |---|---|---|
      | P1 | a step that finishes late sets a flag; assert the flag after `await helper()` | helpers that resolve before their work is done |
      | P2 | several slow steps; assert the total time is close to one step, not the sum | accidental sequential awaits |
      | P3 | one step rejects; assert the others still ran and the failure is reported | `Promise.all` where every outcome was needed; swallowed errors |
      | P4 | results come back in input order even when steps finish in another order | ordering by completion |
      | P5 | a value that is never ready; assert a timeout error with useful text | missing deadlines |
      | P6 | count concurrent calls; assert at most one at a time where required | overlapping polls |

      The practice exercises' tests use exactly these patterns.

  - id: mistakes
    kind: mistakes
    concepts: [promises-and-async-await, promise-combinators, typescript-for-tests]
    title: Common mistakes
    body: |
      - **Missing `await`** before a Playwright action or `expect(...)`.
      - **`forEach(async ...)`** - use `for ... of` with `await` (sequential) or `Promise.all(items.map(...))`.
      - **`Promise.all` when every outcome matters** - one rejection hides the rest; use `allSettled`.
      - **Starting work inside `await` one by one** when it could overlap.
      - **`catch (e) { console.log(e) }`** and carrying on - the test passes with a broken step.
      - **`any` everywhere** in TypeScript - it switches the checks off. Use `unknown` for outside data.
      - **Never running `tsc`** - type errors stay invisible because Playwright only transpiles.
      - **`==` instead of `===`** - `'0' == 0` is true.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [typescript-for-tests]
    title: "Trade-offs: JavaScript or TypeScript for tests?"
    body: |
      | | JavaScript (with JSDoc types) | TypeScript |
      |---|---|---|
      | Setup | nothing extra | a `tsconfig.json`, and `tsc` in CI |
      | Feedback | at run time | in the editor and at type-check time |
      | Refactoring page objects | risky - renames may miss callers | safe - the compiler finds every caller |
      | Learning curve | lower | generics and types take time |
      | Playwright support | full | full - and its API is typed |

      JSDoc comments plus `checkJs` give JavaScript projects much of TypeScript's checking without a compile
      step - the practice project's `check-all.js` is written that way.

  - id: summary
    kind: summary
    title: Summary and quick reference
    body: |
      - `async` functions return promises; `await` pauses the function, not the program.
      - Await every Playwright action and `expect`.
      - Concurrent: start first, then `await Promise.all` / `allSettled`. Never `forEach(async ...)`.
      - `all` fails fast; `allSettled` keeps every outcome; `race` first settled; `any` first fulfilled.
      - TypeScript: interfaces, unions, generics, `unknown` for outside data; run `tsc --noEmit` - Playwright
        doesn't type-check.

exercises:
  - id: log-order
    type: mcq
    concept: promises-and-async-await
    skill: recognition
    title: In which order?
    prompt: |
      ```js
      async function pay() {
        console.log('B');
        await Promise.resolve();
        console.log('D');
      }
      console.log('A');
      pay();
      console.log('C');
      ```

      What is printed?
    options:
      - id: abcd
        text: "`A B C D`"
        feedback: Correct - pay runs synchronously until its first await, then the caller continues (C); the rest of pay (D) runs later as a microtask.
      - id: abdc
        text: "`A B D C`"
        feedback: Code after an await always runs later, even if the promise is already resolved - the caller's C comes first.
      - id: acbd
        text: "`A C B D`"
        feedback: Calling an async function runs its body immediately up to the first await - B is printed before pay() returns.
      - id: abc
        text: "`A B C` - D never prints because pay() isn't awaited"
        feedback: Not awaiting a promise doesn't cancel it - D still prints, just later.
    correct: [abcd]
    hints:
      - Where does an async function stop and hand control back to its caller?
    solution: |
      **`A B C D`.** An async function runs synchronously up to its first `await`; the rest is scheduled as a
      microtask after the current code - so `C` (the caller) comes before `D`.
    followUp: |
      Add `await` before `pay()` (inside an async function). What changes in the output, and why?

  - id: missing-awaits
    type: debug
    concept: promises-and-async-await
    skill: analysis
    title: The test that finishes too early
    prompt: |
      This Playwright test sometimes passes and sometimes fails at a different line. Click the lines with a
      missing `await`.
    language: typescript
    code: |
      test('pays with a declined card', async ({ page }) => {
        await page.goto('checkout.html');
        page.getByLabel('Email for the receipt').fill('learner@example.com');
        await page.frameLocator('[data-testid="sandpay-frame"]').getByLabel('Test card').fill('sandpay-card-declined');
        await page.frameLocator('[data-testid="sandpay-frame"]').getByLabel('Name on card').fill('Asha Rao');
        await page.getByTestId('pay-button').click();
        expect(page.getByTestId('payment-error')).toContainText('declined');
      });
    correctLines: [3, 7]
    lineNotes:
      - line: 6
        note: Awaiting the click is right - Playwright waits until the button is enabled, then clicks.
      - line: 2
        note: Navigation is awaited correctly.
    hints:
      - Which calls return promises? (Every Playwright action and every web-first assertion.)
    solution: |
      **Lines 3 and 7.** Line 3's `fill` races the following steps - sometimes the email isn't filled when Pay
      is clicked. Line 7's web-first assertion returns a promise; without `await` the test ends before the
      assertion has run, so a wrong message would never fail the test. Lint rules such as
      `@typescript-eslint/no-floating-promises` catch both.
    followUp: |
      Why can a missing `await` on an `expect(...)` make a test pass that should fail - and fail a *different*
      test later?

  - id: check-all
    type: coding
    concept: promise-combinators
    skill: analysis
    title: Run every check, lose nothing (JavaScript)
    prompt: |
      `checkAll` is plain JavaScript with JSDoc types. It should run every check at the same time and report
      which passed and which failed, in the order given. It returns before any check has finished. Run the
      tests, explain the failure, and fix it.
    project: playwright
    files:
      - exercises/async/check-all.js
    test: tests/check-all.spec.ts
    command: npx playwright test tests/check-all.spec.ts
    hints:
      - What does forEach do with the promise its callback returns?
      - "`checks.map((check) => check.run())` gives you the promises; which combinator waits for all of them without stopping at the first rejection?"
      - "`Promise.allSettled` results are in input order: `{ status: 'fulfilled' }` or `{ status: 'rejected', reason }`."
    modelAnswer: |
      ```js
      export async function checkAll(checks) {
        const results = await Promise.allSettled(checks.map((check) => check.run()));
        /** @type {Summary} */
        const summary = { passed: [], failed: [] };
        results.forEach((result, index) => {
          const name = checks[index].name;
          if (result.status === 'fulfilled') summary.passed.push(name);
          else {
            const error = result.reason;
            summary.failed.push({ name, message: error instanceof Error ? error.message : String(error) });
          }
        });
        return summary;
      }
      ```
    rubric:
      - Every test in check-all.spec.ts passes
      - Uses Promise.allSettled (or an equivalent that waits for every outcome)
      - Results keep the input order, not the completion order
      - Explained why the forEach version returned an empty summary
    solution: |
      The tests check that the helper waits, keeps order, reports failures without stopping, and runs the
      checks concurrently (five 200 ms checks in well under a second). Reference:
      `solutions/async/check-all.js`.
    followUp: |
      Limit the helper to at most three checks running at once. How would you test that limit?

  - id: poll-until
    type: coding
    concept: typescript-for-tests
    skill: application
    title: A typed polling helper (TypeScript)
    prompt: |
      Implement `pollUntil<T>` in TypeScript: call `read` until `isDone(value)` is true and resolve with that
      value; wait `interval` ms between calls, never overlap calls, and reject with an error containing "timed
      out" and the last value once `timeout` ms have passed. Then run `npm run typecheck`.
    project: playwright
    files:
      - exercises/async/poll-until.ts
    test: tests/poll-until.spec.ts
    command: npx playwright test tests/poll-until.spec.ts
    hints:
      - "A `for (;;)` loop with `await read()` inside never overlaps calls."
      - "Compute a deadline first: `Date.now() + options.timeout`."
      - "Sleep with `await new Promise((resolve) => setTimeout(resolve, options.interval))`."
    modelAnswer: |
      ```ts
      export async function pollUntil<T>(
        read: () => Promise<T>,
        isDone: (value: T) => boolean,
        options: PollOptions,
      ): Promise<T> {
        const deadline = Date.now() + options.timeout;
        for (;;) {
          const value = await read();
          if (isDone(value)) return value;
          if (Date.now() + options.interval > deadline) {
            throw new Error(`pollUntil timed out after ${options.timeout} ms; last value: ${JSON.stringify(value)}`);
          }
          await new Promise((resolve) => setTimeout(resolve, options.interval));
        }
      }
      ```
    rubric:
      - Every test in poll-until.spec.ts passes and npm run typecheck is clean
      - The generic type T flows from read to isDone to the result
      - Calls never overlap and there is a pause between them
      - The timeout error includes the last value read
    solution: |
      Playwright has this built in for tests - `expect.poll(() => read()).toBe('SUCCEEDED')` and
      `expect(...).toPass()` - but writing it once shows what they do. Reference:
      `solutions/async/poll-until.ts`.
    followUp: |
      Rewrite one of the tests with `expect.poll`. What do you gain, and when would you still use your own
      helper?

  - id: all-or-allsettled
    type: mcq
    concept: promise-combinators
    skill: application
    title: Ten independent API checks
    prompt: |
      A smoke suite runs ten independent API checks after a deployment. The report must list **every** failing
      check, and the run should take about as long as the slowest check. Which approach fits?
    options:
      - id: allsettled
        text: "`await Promise.allSettled(checks.map(run))`, then build the report from the results"
        feedback: Correct - concurrent, and every outcome is kept, in order.
      - id: all
        text: "`await Promise.all(checks.map(run))` inside try/catch"
        feedback: Concurrent, but it rejects at the first failure - the report would miss the others.
      - id: sequential
        text: A `for ... of` loop with `await run(check)` and try/catch around each
        feedback: Every outcome is kept, but the checks run one after another - ten times slower.
      - id: race
        text: "`await Promise.race(checks.map(run))`"
        feedback: race settles with the first check to finish and ignores the rest.
    correct: [allsettled]
    hints:
      - Two requirements - concurrency and every outcome.
    solution: |
      **`Promise.allSettled`.** Use `Promise.all` when one failure should stop everything, and a sequential loop
      when each step needs the previous one's result.
    followUp: |
      The checks call a rate-limited API that allows three requests at a time. What changes?

  - id: event-loop-order
    type: order
    concept: promises-and-async-await
    skill: recall
    title: One turn of the event loop
    prompt: |
      Put the steps of the JavaScript event loop in order.
    items:
      - id: sync
        text: Run the current synchronous code to the end
      - id: microtasks
        text: Run all queued microtasks - the code after each settled await
      - id: task
        text: Take the next task - a timer, a network response, an event
      - id: run-task
        text: Run that task's callback
      - id: again
        text: Run the microtasks it queued, then repeat
    hints:
      - Microtasks always drain before the next task starts.
    solution: |
      **Synchronous code → microtasks → next task → its callback → its microtasks → repeat.** That is why code
      after `await` runs before a `setTimeout(fn, 0)` callback.
    followUp: |
      A test uses `setTimeout(resolve, 0)` to "let the page catch up". Why is that not a wait for anything in
      the browser?

  - id: interview-async-for-java-devs
    type: interview
    concept: promises-and-async-await
    skill: application
    title: "Interview: async/await for a Java tester"
    prompt: |
      **Interviewer:** "You've written Selenium tests in Java. What changes when you write Playwright tests in
      TypeScript - especially around async code?"
    hints:
      - Execution model, awaits, concurrency, errors, types.
    modelAnswer: |
      - JavaScript runs on one thread with an event loop; Playwright calls return promises, so every action and
        assertion is awaited - unlike Java's blocking calls.
      - A missing await doesn't fail at compile time and makes tests race; lint rules (no-floating-promises) and
        reviews catch it.
      - Concurrency comes from starting promises before awaiting them (Promise.all / allSettled), not from
        threads - useful for API setup, not for steps on one page.
      - Errors travel in rejected promises; try/catch works around await; there are no checked exceptions.
      - TypeScript gives types close to Java's, but they are erased at run time and Playwright doesn't
        type-check - run tsc in CI.
      - Playwright auto-waits and uses retrying web-first assertions, so explicit waits are rarer than in
        Selenium.
    followUps:
      - What happens if you forget await on expect(...)?
      - When would you use Promise.all in a Playwright test?
      - How do you make sure type errors fail the CI build?
    rubric:
      - Explained the event loop or promises versus blocking calls
      - Named the missing-await risk and a way to catch it
      - Explained concurrency with Promise.all or allSettled and where it fits
      - Mentioned that Playwright doesn't type-check and tsc is needed
      - Connected it to Playwright's auto-waiting
    solution: |
      Strong answers translate Java habits into JavaScript ones - **blocking calls become awaits, threads become
      promises, compile errors need `tsc`**.

  - id: why-tsc
    type: short
    concept: typescript-for-tests
    skill: recall
    title: Why run tsc?
    prompt: |
      In two or three sentences: Playwright already runs `.ts` test files. Why does a TypeScript Playwright
      project still need `tsc --noEmit` in CI?
    hints:
      - What does Playwright do with the types when it loads a test file?
    modelAnswer: |
      Playwright transpiles TypeScript - it strips the types and runs the JavaScript - but it doesn't check them,
      so type errors don't stop a test run. `tsc --noEmit` actually checks the types (wrong arguments, missing
      properties, unknown values used unsafely) and fails the build when they are wrong.
    rubric:
      - Said Playwright transpiles without type-checking
      - Said tsc --noEmit performs the type check
      - Gave an example of an error that would otherwise slip through
    solution: |
      In the practice project: `npm run typecheck`, which `npm run verify` and CI run before the tests.

recall:
  - id: recall-async-returns
    concept: promises-and-async-await
    prompt: What does an async function return?
    answer: Always a promise - fulfilled with the returned value, or rejected with the thrown error.
  - id: recall-await
    concept: promises-and-async-await
    prompt: What does await pause?
    answer: Only the async function it is in - the rest of the program keeps running; the code after await runs later as a microtask.
  - id: recall-foreach
    concept: promises-and-async-await
    prompt: Why doesn't forEach with an async callback wait?
    answer: forEach ignores the promises its callback returns. Use for...of with await, or await Promise.all(items.map(...)).
  - id: recall-all-vs-allsettled
    concept: promise-combinators
    prompt: Promise.all or Promise.allSettled?
    answer: all rejects at the first failure (fail fast); allSettled waits for every outcome and never rejects.
  - id: recall-concurrent
    concept: promise-combinators
    prompt: How do you make two independent async calls overlap?
    answer: Start both first (const a = f(); const b = g();), then await them - or await Promise.all([f(), g()]).
  - id: recall-typecheck
    concept: typescript-for-tests
    prompt: Does Playwright type-check TypeScript tests?
    answer: No - it transpiles them. Run tsc --noEmit to check the types.

