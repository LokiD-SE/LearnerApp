id: playwright-locators-and-assertions
title: Playwright locators, auto-waiting and web-first assertions
subject: playwright
module: playwright-test
level: intermediate
estimatedMinutes: 55
status: published
summary: How Playwright finds elements by what users see, why its actions wait by themselves, and how retrying assertions replace the sleeps and explicit waits of older tools.
tags: [playwright, locators, getbyrole, auto-waiting, actionability, web-first assertions, expect, strict mode, flaky tests, interview]

environment: |
  - **Tool:** Playwright Test 1.64 with TypeScript (`practice/playwright` pins `@playwright/test` 1.64.0).
  - **Defaults, labelled (from the docs):** web-first assertions retry for 5 seconds by default ("defaults to
    5000ms"; the practice project sets `expect: { timeout: 10_000 }` because the shop's slowest test card takes
    about 4 s); `expect.toPass` has a timeout of 0 by default, so give it one; `getByTestId` uses the
    `data-testid` attribute unless `testIdAttribute` is configured; role `name` and `getByText` match a
    case-insensitive substring unless `exact: true`.
  - **Actionability, labelled:** the per-action table on the Auto-waiting page - for example `click` checks
    Visible, Stable, Receives Events and Enabled; `fill` checks Visible, Enabled and Editable.
  - **Real output:** the strict-mode error in the exercise was produced by running `getByRole('button', { name:
    'Add to cart' }).click()` against the practice shop with Playwright 1.64 on Chrome.
  - **Practice target:** the SandPay Demo Shop (`practice/shop`), served by the tests; its ids and one CSS
    class change on every load, on purpose.
  - **Sources (playwright.dev):**
    - [Locators](https://playwright.dev/docs/locators) - recommended built-in locators, strictness, filtering,
      frames
    - [Auto-waiting (actionability)](https://playwright.dev/docs/actionability) - the checks per action and
      `force`
    - [Assertions](https://playwright.dev/docs/test-assertions) - auto-retrying versus non-retrying assertions,
      `expect.poll`, `toPass`, the default timeout
    - [Locator API](https://playwright.dev/docs/api/class-locator) - `click` steps, `getByRole` options,
      `isVisible` not waiting
    - [Page API - waitForTimeout](https://playwright.dev/docs/api/class-page#page-wait-for-timeout) - "should
      only be used for debugging"
    - [Isolation (browser contexts)](https://playwright.dev/docs/browser-contexts)

prerequisites:
  - js-ts-async-and-types
  - selenium-locators

concepts:
  - id: playwright-locators
    name: Playwright locators
    summary: Locators describe how to find elements - by role and accessible name, label, text or test id - are evaluated afresh on every use, and are strict, refusing to act when they match several elements.
  - id: auto-waiting-and-web-first-assertions
    name: Auto-waiting and web-first assertions
    summary: Actions wait until the element is actionable, and expect(locator) assertions retry until they pass or time out - so tests wait for states, never for time.

objectives:
  - Choose user-facing locators and test ids, and combine them with filter and chaining.
  - Explain strictness, and fix a strict-mode violation without guessing an index.
  - Explain which checks an action waits for, and which conditions still need an assertion.
  - Replace sleeps and one-shot reads with web-first assertions.

sections:
  - id: intuition
    kind: intuition
    concepts: [playwright-locators, auto-waiting-and-web-first-assertions]
    title: The idea in plain language
    body: |
      A Playwright locator is a **description**, not an element: "the button called Add to cart in the card
      named Oat milk 1 L". Every time you use it, Playwright looks again - so a re-rendered page can't leave you
      holding a stale element.

      And Playwright is **patient by default**. Asked to click, it waits until the button is visible, stops
      moving, is enabled and isn't covered. Asked `expect(status).toHaveText('SUCCEEDED')`, it keeps looking
      until the text appears or time runs out. Your test describes *what should become true*; Playwright does
      the waiting.

  - id: what
    kind: what
    concepts: [playwright-locators, auto-waiting-and-web-first-assertions]
    title: What the tools are
    body: |
      **Built-in locators.** The Playwright docs recommend user-facing ones - role, label, text - first, and
      test ids when there is no good user-facing hook:

      | Locator | Finds by | Example |
      |---|---|---|
      | `getByRole(role, { name })` | ARIA role and accessible name - what a screen reader announces | `getByRole('button', { name: 'Add to cart' })` |
      | `getByLabel(text)` | a form control's label | `getByLabel('Email for the receipt')` |
      | `getByPlaceholder`, `getByAltText`, `getByTitle` | those attributes | `getByPlaceholder('sandpay-success')` |
      | `getByText(text)` | visible text (non-interactive content) | `getByText('Products could not be loaded.')` |
      | `getByTestId(id)` | `data-testid` | `getByTestId('cart-count')` |
      | `locator(css or xpath)` | anything - the escape hatch | `locator('.price')` |

      **Narrowing:** chain locators (`card.getByRole('button')`), `filter({ hasText })`, `filter({ has:
      locator })`, `first()`, `nth(i)` (positions - use rarely). Frames: `page.frameLocator(...)`.

      **Web-first assertions** (retrying, always `await`ed): `toBeVisible`, `toBeHidden`, `toBeEnabled`,
      `toHaveText`, `toContainText`, `toHaveCount`, `toHaveAttribute`, `toHaveValue`, `toHaveURL`,
      `toHaveTitle`. For anything else: `expect.poll(() => value)` or `expect(async () => ...).toPass()`
      (`toPass` doesn't use the expect timeout - its default is 0, so pass `{ timeout }`).

  - id: why
    kind: why
    concepts: [auto-waiting-and-web-first-assertions]
    title: Why this removes most flakiness
    body: |
      The flaky tests from the [Selenium waits lesson](#/lesson/selenium-waits-and-synchronisation) came from
      three sources: acting before the page was ready, reading a value once at the wrong moment, and holding
      elements across re-renders. Playwright addresses each one by default:

      - **actions** wait for actionability;
      - **assertions** retry until they hold;
      - **locators** are re-evaluated on every use.

      What remains is your job: asserting the right *state* (not reading text once and comparing it), choosing
      locators that mean one thing, and never sleeping.

  - id: internals
    kind: internals
    concepts: [auto-waiting-and-web-first-assertions, playwright-locators]
    title: How actions and assertions wait
    body: |
      **Actionability.** Before `click()`, Playwright waits until the locator resolves to an element that is
      **visible**, **stable** (the same bounding box for two animation frames), able to **receive events** (it
      is the hit target - not covered by an overlay) and **enabled**. Each action checks its own subset - `fill`
      checks visible, enabled and **editable**; `hover` skips enabled. If the checks don't pass within the
      action timeout, the action fails with a log of what it was waiting for.

      **Strictness.** A locator that matches more than one element makes an action or a single-element
      assertion fail with a *strict mode violation* listing the matches - instead of silently using the first,
      as Selenium's `findElement` does.

      **Web-first assertions** run the check, and if it fails, run it again - repeatedly - until it passes or the
      `expect` timeout ends. `await expect(locator).toHaveText('SUCCEEDED')` therefore waits for a status that
      changes from PENDING.

      **One-shot reads don't retry.** `expect(await locator.textContent()).toBe('SUCCEEDED')` reads the text once
      and compares a plain string - no retrying. The same goes for `isVisible()`, `count()` and
      `getAttribute()`: they answer for *this* moment.

  - id: visual
    kind: visual
    concepts: [auto-waiting-and-web-first-assertions]
    title: "Flowchart: what happens when you click"
    body: |
      ```mermaid
      flowchart TD
          A["await locator.click()"] --> B{"Exactly one element matches?"}
          B -- No, several --> S["Strict mode violation"]
          B -- None yet --> W["Retry until timeout"]
          B -- Yes --> C{"Visible, stable, enabled, not covered?"}
          C -- Not yet --> W
          C -- Yes --> D["Scroll into view and click"]
          W --> B
      ```

      The same loop - re-evaluate the locator, check, retry - is what makes a web-first assertion wait for a
      state.

  - id: when
    kind: when
    concepts: [playwright-locators]
    title: Which locator, when
    body: |
      | Element | Prefer |
      |---|---|
      | buttons, links, headings, checkboxes | `getByRole` with the accessible name |
      | form fields | `getByLabel` |
      | an item in a list identified by its text | `filter({ has: getByRole('heading', { name, exact: true }) })` on the item |
      | elements with no accessible name or label, or with text that changes (translations) | `getByTestId` |
      | content in an iframe | `page.frameLocator(...)` then the same locators |
      | anything else | `locator(css)` - stable attributes only |

      Role locators double as a small accessibility check: if you can't find a button by role and name, a
      screen-reader user can't either.

  - id: example
    kind: example
    concepts: [auto-waiting-and-web-first-assertions]
    title: "Real-world example: migrating the waits away"
    body: |
      A team moved its checkout suite from Selenium to Playwright and first translated the code line by line:
      `await page.waitForTimeout(2000)` where there had been a `Thread.sleep`, and `expect(await
      status.textContent()).toBe('SUCCEEDED')` where there had been a `getText()` assertion. The suite was just
      as flaky as before - and slower.

      **What fixed it:** deleting every `waitForTimeout` (the Playwright docs say it should only be used for
      debugging) and replacing one-shot reads with web-first assertions (`await
      expect(status).toHaveText('SUCCEEDED')`). Waits for overlays and spinners disappeared entirely - actions
      wait for actionability by themselves. The suite became faster *and* stable.

  - id: code
    kind: code
    concepts: [playwright-locators, auto-waiting-and-web-first-assertions]
    title: "Code: locators and assertions for the demo shop"
    collapsed: true
    body: |
      ```ts
      import { expect, test } from '@playwright/test';

      test('add oat milk to the cart', async ({ page }) => {
        await page.goto('index.html');

        const cards = page.getByTestId('product-card');
        await expect(cards).toHaveCount(6);                            // retries while the list loads

        const oatMilk = cards.filter({ has: page.getByRole('heading', { name: 'Oat milk 1 L', exact: true }) });
        await oatMilk.getByRole('button', { name: 'Add to cart' }).click();   // waits until actionable

        await expect(page.getByTestId('cart-count')).toHaveText('1');  // waits for the "API call"
        await expect(page.getByRole('status')).toContainText('added to your cart');

        await page.getByLabel('Sort by').selectOption({ label: 'Price: high to low' });
        await expect(page.getByTestId('product-name').first()).toHaveText('Hand grinder');
      });

      // not web-first: read once, compared once - no retry
      expect(await page.getByTestId('cart-count').textContent()).toBe('1');

      // for values that aren't on a locator
      await expect.poll(async () => (await request.get('orders/ord_1')).status()).toBe(200);
      ```

  - id: tests
    kind: tests
    concepts: [playwright-locators]
    title: Checking your locators
    body: |
      | ID | Check | Catches |
      |---|---|---|
      | L1 | `await expect(locator).toHaveCount(1)` | locators that match several elements |
      | L2 | the matched element has the expected test id, text or attribute | right count, wrong element |
      | L3 | reload, re-sort, then L1 and L2 again | generated ids, positions |
      | L4 | a name that isn't on the page gives count 0 | partial-text matches |
      | L5 | try it in `npx playwright codegen` or the UI mode's locator picker | quick feedback while writing |

  - id: mistakes
    kind: mistakes
    concepts: [auto-waiting-and-web-first-assertions, playwright-locators]
    title: Common mistakes
    body: |
      - **`page.waitForTimeout`** in tests - only for debugging.
      - **One-shot reads in assertions** (`textContent()`, `isVisible()`, `count()` followed by a plain
        `expect`) - use the matching web-first assertion.
      - **Fixing a strict-mode violation with `.first()`** - make the locator mean one thing instead.
      - **`getByText` for buttons** - prefer `getByRole('button', { name })`.
      - **Partial names by accident** - `name` and `getByText` match substrings unless `exact: true`.
      - **Forgetting `await`** on assertions.
      - **CSS on generated classes** (`.css-1q2w3e`), as in any tool.
      - **Raising timeouts** to hide a wrong condition - read the error's call log to see what it waited for.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [playwright-locators, auto-waiting-and-web-first-assertions]
    title: Trade-offs
    body: |
      | Choice | Gains | Costs |
      |---|---|---|
      | role and label locators | resilient to markup changes; check accessibility | depend on accessible names, which change with copy and translation |
      | test ids | stable, unambiguous | invisible to users; developers must maintain them |
      | auto-waiting | far fewer explicit waits | slow failures if the condition is wrong (it waits the full timeout) |
      | long expect timeouts | fewer false failures on slow environments | slower feedback when something really breaks |
      | `expect.poll` / `toPass` | waits for anything | easy to hide a real defect behind retries - keep them specific |

  - id: summary
    kind: summary
    title: Summary and quick reference
    body: |
      - Locators are descriptions, re-evaluated on every use; strict - one match or an error.
      - Prefer `getByRole` / `getByLabel`, then `getByTestId`; narrow with `filter({ has })` and chaining.
      - `click` waits until the element is visible, stable, receives events and is enabled (other actions check
        their own subset).
      - `await expect(locator).toHaveText(...)` retries; `expect(await locator.textContent())` doesn't.
      - No `waitForTimeout`. `expect.poll` and `toPass` for values that aren't on a locator.

exercises:
  - id: locator-preference
    type: mcq
    concept: playwright-locators
    skill: recognition
    title: The recommended locator
    prompt: |
      The shop's Pay button is a `<button>` with the visible text "Pay €18.99" and `data-testid="pay-button"`.
      The amount changes with the cart. Which locator is the most robust?
    options:
      - id: testid
        text: "`page.getByTestId('pay-button')`"
        feedback: Correct - its accessible name changes with the amount, so the stable test id is the better hook here.
      - id: role-name
        text: "`page.getByRole('button', { name: 'Pay €18.99' })`"
        feedback: A role locator is usually the first choice - but this name changes with every cart total.
      - id: text
        text: "`page.getByText('Pay')`"
        feedback: A partial text match for a button - it could also match other text containing "Pay".
      - id: nth
        text: "`page.locator('button').nth(3)`"
        feedback: A position - it breaks when buttons are added or reordered.
    correct: [testid]
    hints:
      - What happens to the button's accessible name when the cart changes?
    solution: |
      **`getByTestId('pay-button')`.** Role locators are the default recommendation, but not when the accessible
      name changes with data. (`getByRole('button', { name: /^Pay / })` would also work.)
    followUp: |
      Write a role-based locator for the "Sort by" drop-down. Which role does a `<select>` have?

  - id: one-shot-reads
    type: debug
    concept: auto-waiting-and-web-first-assertions
    skill: analysis
    title: The assertions that don't wait
    prompt: |
      After a `sandpay-unknown` payment the order page shows PENDING, then SUCCEEDED about 3 seconds later. This
      test fails at random. Click the lines that check a value once instead of waiting for it.
    language: typescript
    code: |
      const order = await checkout.payAndExpectOrder();
      await page.waitForTimeout(2000);
      expect(await page.getByTestId('order-status').textContent()).toBe('SUCCEEDED');
      await expect(page.getByTestId('order-total')).toHaveText('€18.99');
      expect(await page.getByTestId('order-message').isVisible()).toBe(true);
    correctLines: [3, 5]
    lineNotes:
      - line: 2
        note: A fixed sleep is a problem too - remove it - but it doesn't check anything; the checks that don't wait are on lines 3 and 5.
      - line: 4
        note: A web-first assertion - it retries until the text matches.
    hints:
      - Which lines call a method that returns a plain value, then compare it?
    solution: |
      **Lines 3 and 5.** `textContent()` and `isVisible()` answer for one moment; the plain `expect` then compares
      a string or a boolean once. Use `await expect(status).toHaveText('SUCCEEDED')` and `await
      expect(message).toBeVisible()`, and delete the `waitForTimeout` on line 2.
    followUp: |
      The status should be either SUCCEEDED or FAILED. Write one web-first assertion that accepts both.

  - id: shop-locators-pw
    type: coding
    concept: playwright-locators
    skill: application
    title: Locators for the demo shop (Playwright)
    prompt: |
      Write the five locator functions in `shop-locators.ts`: the cart count, the sort drop-down, all product
      cards, and - by the product's exact visible name - its "Add to cart" button and its price. The tests
      reload and re-sort the page and check each locator finds exactly the right element(s). Try them in
      `npx playwright codegen` first.
    project: playwright
    files:
      - exercises/locators/shop-locators.ts
    test: tests/shop-locators.spec.ts
    command: npx playwright test tests/shop-locators.spec.ts
    hints:
      - The drop-down has a label; the badge and the cards have test ids.
      - "For a product by name: the cards, filtered to the one that `has` a heading with that exact name."
      - "Then chain: `.getByRole('button', { name: 'Add to cart' })` or `.getByTestId('product-price')`."
    modelAnswer: |
      ```ts
      export const cartCount = (page: Page) => page.getByTestId('cart-count');
      export const sortSelect = (page: Page) => page.getByLabel('Sort by');
      export const productCards = (page: Page) => page.getByTestId('product-card');

      const card = (page: Page, name: string) =>
        productCards(page).filter({ has: page.getByRole('heading', { name, exact: true }) });

      export const addToCartButton = (page: Page, name: string) =>
        card(page, name).getByRole('button', { name: 'Add to cart' });
      export const priceOf = (page: Page, name: string) => card(page, name).getByTestId('product-price');
      ```
    rubric:
      - Every test in shop-locators.spec.ts passes
      - Uses user-facing locators or test ids - no generated ids, classes, positions or XPath paths
      - Finds the product by its exact name with filter and has
      - Tried the locators in codegen or the UI mode before running the tests
    solution: |
      Compare with the Selenium version of this exercise: no XPath was needed - `filter({ has })` expresses "the
      card that has this heading". Reference: `solutions/locators/shop-locators.ts`.
    followUp: |
      The shop is translated into German. Which of your locators break, and how would you prepare for it?

  - id: order-status-pw
    type: coding
    concept: auto-waiting-and-web-first-assertions
    skill: application
    title: Wait for the result, not for time (Playwright)
    prompt: |
      `finalStatus` and `processingFinished` sleep for a fixed time. Replace the sleeps with web-first
      assertions: wait until the order status is SUCCEEDED or FAILED (and return it), and until the processing
      overlay is hidden - respecting the `timeout` argument. The tests check they return at once when nothing
      needs waiting for, and give up when the timeout runs out.
    project: playwright
    files:
      - exercises/waits/order-status.ts
    test: tests/order-status.spec.ts
    command: npx playwright test tests/order-status.spec.ts
    hints:
      - "`toHaveText` accepts a regular expression: `/^(SUCCEEDED|FAILED)$/`."
      - Every web-first assertion takes `{ timeout }`.
      - Which assertion waits for an element to be hidden?
    modelAnswer: |
      ```ts
      export async function finalStatus(page: Page, timeout = 10_000): Promise<string> {
        const status = page.getByTestId('order-status');
        await expect(status).toHaveText(/^(SUCCEEDED|FAILED)$/, { timeout });
        return ((await status.textContent()) ?? '').trim();
      }

      export async function processingFinished(page: Page, timeout = 10_000): Promise<void> {
        await expect(page.getByTestId('processing-overlay')).toBeHidden({ timeout });
      }
      ```
    rubric:
      - Every test in order-status.spec.ts passes
      - No waitForTimeout and no one-shot reads used as checks
      - The timeout argument is passed to the assertions
      - Explained why reading textContent after the assertion is safe
    solution: |
      Reading `textContent()` *after* the assertion is fine: the assertion has already waited for a final status,
      so the read returns it. Reference: `solutions/waits/order-status.ts`. Compare with the Selenium version:
      no wait objects, no ignored exceptions - the assertion is the wait.
    followUp: |
      Add `cartCountIs(page, n)` that waits for the badge to show n. Is it worth a helper, or is the assertion
      clear enough on its own?

  - id: strict-mode
    type: mcq
    concept: playwright-locators
    skill: application
    title: A strict mode violation
    prompt: |
      `await page.getByRole('button', { name: 'Add to cart' }).click()` fails with "strict mode violation:
      getByRole('button', { name: 'Add to cart' }) resolved to 6 elements", followed by the six buttons and
      their `getByTestId(...)` alternatives. What is the right fix?
    options:
      - id: scope
        text: Scope the locator to one product first, for example the card that has the product's heading
        feedback: Correct - make the locator describe the one button you mean.
      - id: first
        text: Add `.first()`
        feedback: It silences the error and clicks whichever product happens to be first - the same bug Selenium's findElement has.
      - id: timeout
        text: Increase the timeout so the page can settle
        feedback: Six matches is not a timing problem; waiting longer still finds six.
      - id: force
        text: "Click with `{ force: true }`"
        feedback: force skips actionability checks; it doesn't choose between six elements.
    correct: [scope]
    hints:
      - Which of the six buttons does the test actually mean?
    solution: |
      **Scope it.** Strictness is a feature: it turns "clicked the wrong product" into an error with a list of the
      matches.
    followUp: |
      When is `.first()` legitimate? Give one honest example.

  - id: actionability-order
    type: order
    concept: auto-waiting-and-web-first-assertions
    skill: recall
    title: What click() waits for
    prompt: |
      Put the steps of `await locator.click()` in order.
    items:
      - id: resolve
        text: Resolve the locator to exactly one element
      - id: actionable
        text: Wait until it is visible, stable, enabled and not covered
      - id: scroll
        text: Scroll it into view
      - id: click
        text: Click at its centre
      - id: done
        text: Resolve the promise - the test continues
    hints:
      - Resolving the locator comes before any check on the element.
    solution: |
      **Resolve → actionability → scroll → click → continue.** If any step can't complete before the timeout,
      the error's call log says which one it was waiting for.
    followUp: |
      Which of these steps does `{ force: true }` skip, and why is that rarely what a test should do?

  - id: interview-playwright-vs-selenium
    type: interview
    concept: auto-waiting-and-web-first-assertions
    skill: application
    title: "Interview: why are Playwright tests less flaky?"
    prompt: |
      **Interviewer:** "People say Playwright tests are less flaky than Selenium tests. Why - and how can you
      still write a flaky Playwright test?"
    hints:
      - Actionability, web-first assertions, fresh locators, isolation - then the ways to defeat them.
    modelAnswer: |
      - Actions auto-wait for actionability (for a click: visible, stable, receives events, enabled), so no
        explicit waits before clicks.
      - Web-first assertions retry until the expected state or a timeout, replacing sleeps and wait objects.
      - Locators are re-evaluated on every use - no stale element references - and strict, so ambiguous locators
        fail loudly.
      - Each test gets a fresh browser context, so state doesn't leak.
      - Still flaky with: waitForTimeout, one-shot reads compared with plain expect, missing awaits, .first() on
        ambiguous locators, shared test data or accounts, depending on test order or external services.
    followUps:
      - What is the difference between toHaveText and expect(await locator.textContent())?
      - When do you still need expect.poll?
      - How would you debug a test that fails only in CI?
    rubric:
      - Explained auto-waiting and actionability
      - Explained retrying web-first assertions
      - Mentioned fresh locators or strictness
      - Gave concrete ways to still write flaky tests
      - Mentioned isolation through browser contexts
    solution: |
      Strong answers credit the **design** (waiting is built into actions and assertions) and then show they know
      how to defeat it - which is what interviewers want to hear before trusting you with a suite.

recall:
  - id: recall-locator-order
    concept: playwright-locators
    prompt: Which kinds of Playwright locators does the documentation recommend first, and which last?
    answer: User-facing ones first - getByRole with the accessible name, getByLabel, getByText and similar; getByTestId when there is no good user-facing hook; CSS or XPath as the last resort.
  - id: recall-strict
    concept: playwright-locators
    prompt: What is a strict mode violation?
    answer: An action or single-element assertion on a locator that matches several elements - Playwright refuses and lists them instead of picking one.
  - id: recall-fresh
    concept: playwright-locators
    prompt: Why can't a Playwright locator go stale?
    answer: It is a description that is resolved again every time it is used.
  - id: recall-actionability
    concept: auto-waiting-and-web-first-assertions
    prompt: What does click() wait for?
    answer: For the locator to resolve to one element that is visible, stable, able to receive events (not covered) and enabled.
  - id: recall-web-first
    concept: auto-waiting-and-web-first-assertions
    prompt: What makes an assertion web-first?
    answer: It is awaited and retries the check until it passes or the expect timeout ends - for example await expect(locator).toHaveText('PAID').
  - id: recall-wait-for-timeout
    concept: auto-waiting-and-web-first-assertions
    prompt: When should page.waitForTimeout be used?
    answer: Only for debugging - the Playwright docs say tests that wait on timers are flaky.

