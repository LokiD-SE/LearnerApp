placement:
  - id: place-web-first
    type: mcq
    concept: auto-waiting-and-web-first-assertions
    skill: application
    title: Waiting for a status
    prompt: |
      Which line waits until the order status becomes SUCCEEDED?
    options:
      - id: web-first
        text: "`await expect(page.getByTestId('order-status')).toHaveText('SUCCEEDED')`"
        feedback: Correct - a web-first assertion retries until the text matches.
      - id: one-shot
        text: "`expect(await page.getByTestId('order-status').textContent()).toBe('SUCCEEDED')`"
        feedback: Reads once and compares once - no waiting.
      - id: sleep
        text: "`await page.waitForTimeout(5000)` and then read the text"
        feedback: A guess at the time - slow, and still wrong when the system is slower.
      - id: is-visible
        text: "`await page.getByTestId('order-status').isVisible()`"
        feedback: Answers whether it is visible right now - nothing about the text, and no waiting.
    correct: [web-first]
    solution: |
      **The web-first assertion.**

  - id: place-locator
    type: mcq
    concept: playwright-locators
    skill: application
    title: A labelled field
    prompt: |
      An input has `<label for="email">Email for the receipt</label>` and a generated id. Which locator?
    options:
      - id: label
        text: "`page.getByLabel('Email for the receipt')`"
        feedback: Correct - what the user sees, and stable across loads.
      - id: id
        text: "`page.locator('#email-x8f2k')`"
        feedback: A generated id changes on every load.
      - id: xpath
        text: "`page.locator('//form/div[2]/input')`"
        feedback: A positional path - breaks when the form changes.
      - id: nth
        text: "`page.getByRole('textbox').nth(0)`"
        feedback: A position among all text boxes.
    correct: [label]
    solution: |
      **`getByLabel`.**
