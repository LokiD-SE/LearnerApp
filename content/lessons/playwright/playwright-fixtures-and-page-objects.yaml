placement:
  - id: place-fixture
    type: mcq
    concept: playwright-fixtures
    skill: application
    title: Using a custom fixture
    prompt: |
      A fixtures file exports `test` with a `catalog` fixture. A test file writes `async ({ catalog }) => ...` but
      imports `test` from '@playwright/test'. What happens?
    options:
      - id: unknown
        text: The test fails because catalog is not a known fixture for that test function
        feedback: Correct - import test from the fixtures file.
      - id: works
        text: It works - fixtures are registered globally
        feedback: test.extend returns a new test function; only that one knows the fixture.
      - id: undefined
        text: catalog is undefined, and the test continues
        feedback: Playwright reports the unknown fixture instead of passing undefined.
      - id: compile
        text: It always fails to compile
        feedback: Playwright doesn't type-check, so it is a run-time failure; tsc would also flag it.
    correct: [unknown]
    solution: |
      **Unknown fixture** - import `test` (and `expect`) from the fixtures file.

  - id: place-page-object
    type: mcq
    concept: typescript-page-objects
    skill: application
    title: After removing a line
    prompt: |
      A `CartPage.remove(name)` method clicks Remove. What should it do before resolving?
    options:
      - id: wait-gone
        text: "`await expect(this.line(name)).toHaveCount(0)` - wait until the line is gone"
        feedback: Correct - the caller can rely on the result.
      - id: nothing
        text: Nothing - Playwright auto-waits
        feedback: Auto-waiting covers the click itself, not the page's later update.
      - id: timeout
        text: "`await this.page.waitForTimeout(500)`"
        feedback: A guess at the time.
      - id: assert-total
        text: Assert that the total is correct
        feedback: Business assertions belong in the test; the page object waits for its own result.
    correct: [wait-gone]
    solution: |
      **Wait for its own result** with a web-first assertion.

  - id: place-isolation
    type: mcq
    concept: test-isolation-and-config
    skill: application
    title: Leftovers in the cart
    prompt: |
      Two tests use the built-in `page` fixture. The first adds an item to the cart (stored in sessionStorage).
      What does the second test's cart contain?
    options:
      - id: empty
        text: Nothing - each test has its own browser context and storage
        feedback: Correct.
      - id: item
        text: The first test's item
        feedback: Storage belongs to the browser context, and each test gets a new one.
      - id: depends-order
        text: It depends on the order the tests run in
        feedback: Not with the built-in fixtures - only shared pages or contexts make order matter.
      - id: depends-worker
        text: It depends on whether they run in the same worker
        feedback: Even in the same worker, each test gets a new context.
    correct: [empty]
    solution: |
      **Nothing** - a new browser context per test.
