id: playwright-fixtures-and-page-objects
title: Fixtures and page objects in Playwright Test
subject: playwright
module: playwright-test
level: intermediate
estimatedMinutes: 55
status: published
summary: How Playwright Test gives every test what it needs through fixtures, keeps tests isolated in their own browser context, and how page objects look in TypeScript.
tags: [playwright, fixtures, test.extend, page objects, typescript, browser context, isolation, parallel, config, interview]

environment: |
  - **Tool:** Playwright Test 1.64 with TypeScript. Sources: the Playwright documentation pages "Fixtures",
    "Isolation", "Parallelism" and "Test configuration".
  - **Defaults, labelled:** each test gets a new browser context; tests in one file run in order in one
    worker process unless `fullyParallel` (or `mode: 'parallel'`) is set; fixtures are test-scoped unless
    declared `{ scope: 'worker' }`. The practice project sets `fullyParallel: true`.
  - **Practice project:** `practice/playwright` - given page objects in `framework/pages`, exercises
    `pages/cart-page.ts` and `fixtures/shop-test.ts`.

prerequisites:
  - playwright-locators-and-assertions
  - page-objects-done-right

concepts:
  - id: playwright-fixtures
    name: Fixtures
    summary: A fixture sets something up, hands it to the test with use(), and cleans up afterwards; tests ask for fixtures by name, fixtures can depend on each other, and they run only when needed.
  - id: typescript-page-objects
    name: Page objects in TypeScript
    summary: Classes that keep locators private, offer async methods named after user intent, wait with web-first assertions and return data or the next page object.
  - id: test-isolation-and-config
    name: Isolation, parallelism and configuration
    summary: A fresh browser context per test keeps tests independent; workers run them in parallel; the config sets base URL, projects, retries, reporters and timeouts in one place.

objectives:
  - Write custom fixtures with test.extend, including fixtures that depend on other fixtures.
  - Write page objects as TypeScript classes in the style of the given framework.
  - Explain how browser contexts and workers keep tests isolated, and spot tests that share state.
  - Configure a project - base URL, projects, retries, reporters, web server - and justify each choice.

sections:
  - id: intuition
    kind: intuition
    concepts: [playwright-fixtures, test-isolation-and-config]
    title: The idea in plain language
    body: |
      A fixture is a **stagehand**. Before a scene, the stagehand sets up exactly the props that scene asks for
      - a fresh page, a logged-in user, a cart with espresso beans - hands them over, and clears them away
      afterwards. Scenes never share props, so one can't break the next.

      In Playwright Test, a test **asks** for what it needs by naming it: `async ({ page, catalog }) => ...`. The
      runner works out what to build, in which order, and tears it all down when the test ends. Page objects
      are the props worth reusing: a `CatalogPage` that knows how the catalog works.

  - id: what
    kind: what
    concepts: [playwright-fixtures, test-isolation-and-config]
    title: What the pieces are
    body: |
      **Built-in fixtures**

      | Fixture | Scope | What it is |
      |---|---|---|
      | `page` | test | a new page in this test's own browser context |
      | `context` | test | this test's browser context - cookies, storage, permissions |
      | `request` | test | an API request context using the config's `baseURL` |
      | `browser` | worker | the browser shared by tests in the same worker |
      | `browserName`, `playwright` | worker | which browser runs; the Playwright API object |

      **Custom fixtures** with `test.extend`:

      ```ts
      export const test = base.extend<{ catalog: CatalogPage }>({
        catalog: async ({ page }, use) => {
          const catalog = await CatalogPage.open(page);   // setup
          await use(catalog);                             // the test runs here
          // teardown, if any, goes here
        },
      });
      ```

      Options: `{ scope: 'worker' }` (set up once per worker process), `{ auto: true }` (runs for every test
      even if not named).

      **The config** (`playwright.config.ts`): `testDir`, `use` (baseURL, trace, screenshot, viewport...),
      `projects` (browsers, devices, setup projects), `workers`, `fullyParallel`, `retries`, `reporter`,
      `expect.timeout`, `webServer`.

  - id: why
    kind: why
    concepts: [test-isolation-and-config, playwright-fixtures]
    title: Why fixtures beat base classes and hooks
    body: |
      - **Tests declare what they need,** so a reader sees the setup in the test's signature - not in a
        `beforeEach` three files away.
      - **Only what is used is built.** A test that doesn't ask for `checkoutWithEspresso` doesn't pay for it.
      - **Composition, not inheritance:** fixtures depend on fixtures (`checkoutWithEspresso` asks for `catalog`),
        replacing the `BaseTest` hierarchies from the [framework lesson](#/lesson/reference-framework-skeleton).
      - **Isolation is the default,** which makes parallel runs safe without extra work - as long as tests don't
        share state outside the browser (accounts, data, files).

  - id: internals
    kind: internals
    concepts: [test-isolation-and-config, playwright-fixtures]
    title: How tests, workers and fixtures run
    body: |
      1. Playwright starts **worker processes** (by default about half the CPU cores). Each worker launches a
         browser once.
      2. Test files are distributed over workers. Tests in one file run in order in one worker - unless
         `fullyParallel` lets any test go to any worker.
      3. For each test, Playwright creates the fixtures the test (directly or indirectly) asks for, in
         dependency order: `page` needs `context`, which needs `browser`.
      4. A new **browser context** per test means new cookies, storage and cache - like a fresh incognito
         profile.
      5. After the test, fixtures are torn down in reverse order - the code after `await use(...)` runs - and the
         context is closed.

      Worker-scoped fixtures live as long as the worker; use them for expensive, shareable setup (starting a
      server, creating reference data once), never for state a test changes.

      **A gotcha:** a context you create yourself with `browser.newContext()` doesn't receive the config's `use`
      options such as `baseURL`; the built-in `context` and `page` fixtures do.

  - id: visual
    kind: visual
    concepts: [playwright-fixtures]
    title: "Diagram: a test and the fixtures it pulls in"
    body: |
      ```mermaid
      flowchart LR
          T["test - asks for checkoutWithEspresso"] --> CO["checkoutWithEspresso - adds espresso, goes to checkout"]
          CO --> CA["catalog - opens the catalog page"]
          CA --> P["page - built in"]
          P --> C["context - built in, new for this test"]
          C --> B["browser - built in, once per worker"]
      ```

      Setup runs from the right to the left; teardown in the opposite direction. The test names one fixture
      and gets the whole chain.

  - id: example
    kind: example
    concepts: [test-isolation-and-config]
    title: "Real-world example: the suite that only passed in order"
    body: |
      A team's checkout suite opened one page in `beforeAll`, stored it in a module-level variable and reused it
      in every test "to save time". It passed - until they enabled `fullyParallel` to cut the run time, and half
      the tests failed with an undefined page, while others found items in the cart they never added.

      **Evidence:** the failures moved between runs; running a single failing test alone passed; the trace
      showed carts with leftovers from other tests.

      **Fix:** the built-in `page` per test, and fixtures for the setup they had shared (`catalog`,
      `checkoutWithEspresso`). Setup that was really expensive - creating merchant accounts through the API -
      moved to a worker-scoped fixture that each test only read from. The suite ran in parallel and in any
      order.

  - id: code
    kind: code
    concepts: [typescript-page-objects, playwright-fixtures, test-isolation-and-config]
    title: "Code: a page object, fixtures and the config"
    collapsed: true
    body: |
      ```ts
      // framework/pages/catalog-page.ts (given in the practice project)
      export class CatalogPage {
        readonly header: Header;
        private readonly list: Locator;

        constructor(private readonly page: Page) {
          this.header = new Header(page);
          this.list = page.getByTestId('product-list');
        }

        static async open(page: Page): Promise<CatalogPage> {
          await page.goto('index.html');
          const catalog = new CatalogPage(page);
          await expect(catalog.list).toHaveAttribute('aria-busy', 'false');
          return catalog;
        }

        async addToCart(sku: string): Promise<this> {
          const before = await this.header.cartCount();
          await this.page.getByTestId(`add-to-cart-${sku}`).click();
          await this.header.expectCartCount(before + 1);      // wait for the result
          return this;
        }
      }
      ```

      ```ts
      // fixtures: tests import { test, expect } from here instead of '@playwright/test'
      export const test = base.extend<{ catalog: CatalogPage; checkoutWithEspresso: CheckoutPage }>({
        catalog: async ({ page }, use) => {
          await use(await CatalogPage.open(page));
        },
        checkoutWithEspresso: async ({ catalog }, use) => {
          await catalog.addToCart('espresso-beans');
          await use(await catalog.header.goToCheckout());
        },
      });

      test('a declined card can be retried', async ({ checkoutWithEspresso }) => {
        await checkoutWithEspresso.enterEmail('learner@example.com');
        await checkoutWithEspresso.enterCard('sandpay-insufficient-funds', 'Asha Rao');
        expect(await checkoutWithEspresso.payAndExpectDecline()).toContain('insufficient funds');
      });
      ```

      ```ts
      // playwright.config.ts (excerpt)
      export default defineConfig({
        fullyParallel: true,
        retries: process.env.CI ? 1 : 0,          // a retry is reported as "flaky" - investigate it
        reporter: [['list'], ['html', { open: 'never' }]],
        use: { baseURL: 'http://127.0.0.1:4310/', trace: 'retain-on-failure' },
        projects: [
          { name: 'desktop', use: { ...devices['Desktop Chrome'] } },
          { name: 'phone', use: { ...devices['Pixel 7'] } },
        ],
        webServer: { command: 'node scripts/serve-shop.mjs 4310', url: 'http://127.0.0.1:4310/index.html' },
      });
      ```

  - id: tests
    kind: tests
    concepts: [test-isolation-and-config]
    title: Checking a suite's isolation
    body: |
      | ID | Check | Catches |
      |---|---|---|
      | I1 | run one test alone (`-g "title"`) | dependence on earlier tests |
      | I2 | run with `fullyParallel` and several workers | shared module-level state, shared accounts |
      | I3 | run in a different order, or with `--repeat-each=5` | order dependence and intermittent races |
      | I4 | look for module-level `let` variables in test files and `beforeAll` that creates pages | shared browser state |
      | I5 | every test creates or chooses its own data (unique emails, ids) | collisions between parallel tests |

  - id: mistakes
    kind: mistakes
    concepts: [playwright-fixtures, typescript-page-objects, test-isolation-and-config]
    title: Common mistakes
    body: |
      - **Sharing a page across tests** through `beforeAll` and a module-level variable.
      - **Worker-scoped fixtures with mutable state** that tests change.
      - **Fixtures that never call `use`** (the test never runs) or call it twice.
      - **Forgetting to import `test` from the fixtures file** - the custom fixtures are then "unknown".
      - **Page objects that expose locators everywhere** and tests that click them directly.
      - **Assertions about business outcomes inside page objects** - keep them in tests, as in Java.
      - **`browser.newContext()` in tests** without the config's options.
      - **Turning on retries to make a suite green** - a test that passes on retry is flaky; fix it.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [playwright-fixtures, typescript-page-objects]
    title: Trade-offs
    body: |
      | Choice | Gains | Costs |
      |---|---|---|
      | fixtures | composable, lazy, declared in the test | a new concept for people from JUnit or TestNG |
      | `beforeEach` hooks | familiar | run for every test in scope, whether needed or not |
      | page objects | one place per page, readable tests | another layer; keep them thin |
      | fixtures that return page objects | tests start where they need to be | the setup is hidden from the reader - name fixtures clearly |
      | worker-scoped fixtures | fast expensive setup | must be read-only for tests |
      | `fullyParallel` | fastest runs | needs fully independent tests and data |

  - id: summary
    kind: summary
    title: Summary and quick reference
    body: |
      - Fixtures: `test.extend({ name: async ({ deps }, use) => { setup; await use(value); teardown } })`.
      - Tests ask for fixtures by name; fixtures depend on fixtures; only what's needed is built.
      - Every test: a new browser context. Workers: separate processes. `fullyParallel` for test-level spread.
      - Page objects: private locators, async intent methods, web-first waits, data or next page out.
      - Config holds baseURL, projects, retries, reporters, web server - not the tests.

exercises:
  - id: built-in-fixtures
    type: mcq
    concept: playwright-fixtures
    skill: recognition
    title: Which fixtures are new for every test?
    prompt: |
      Which built-in fixtures are created anew for **every test** by default? Select every one that applies.
    options:
      - id: page
        text: "`page`"
        feedback: Yes - a new page in the test's own context.
      - id: context
        text: "`context`"
        feedback: Yes - a new browser context per test is what isolates tests.
      - id: request
        text: "`request`"
        feedback: Yes - a test-scoped API request context.
      - id: browser
        text: "`browser`"
        feedback: No - the browser is worker-scoped; launching it per test would be slow, and contexts already isolate tests.
    correct: [page, context, request]
    hints:
      - Which one would be expensive to start for every test, and isn't needed for isolation?
    solution: |
      **`page`, `context` and `request`.** `browser` lives as long as the worker; isolation comes from the
      context.
    followUp: |
      A test needs two independent users in one test (a buyer and a merchant). Which fixture would you use to
      create a second, isolated session?

  - id: shop-fixtures-pw
    type: coding
    concept: playwright-fixtures
    skill: application
    title: Custom fixtures for the shop
    prompt: |
      Implement the two fixtures in `shop-test.ts`: `catalog` (the loaded catalog page object) and
      `checkoutWithEspresso` (the checkout page with one espresso beans in the cart). The tests import `test`
      from your file and ask for the fixtures by name.
    project: playwright
    files:
      - exercises/fixtures/shop-test.ts
    test: tests/shop-fixtures.spec.ts
    command: npx playwright test tests/shop-fixtures.spec.ts
    hints:
      - "`CatalogPage.open(page)` gives you the loaded catalog; hand it to the test with `await use(...)`."
      - "`checkoutWithEspresso` can ask for `catalog` instead of `page`."
      - "From the catalog: `addToCart('espresso-beans')`, then `header.goToCheckout()`."
    modelAnswer: |
      ```ts
      export const test = base.extend<ShopFixtures>({
        catalog: async ({ page }, use) => {
          await use(await CatalogPage.open(page));
        },
        checkoutWithEspresso: async ({ catalog }, use) => {
          await catalog.addToCart('espresso-beans');
          await use(await catalog.header.goToCheckout());
        },
      });
      ```
    rubric:
      - Every test in shop-fixtures.spec.ts passes
      - checkoutWithEspresso builds on the catalog fixture instead of repeating its setup
      - Each fixture calls use exactly once
      - Explained why every test still starts with an empty cart
    solution: |
      The third test proves isolation: it also gets a checkout with exactly one espresso - other tests' carts
      live in other browser contexts. Reference: `solutions/fixtures/shop-test.ts`.
    followUp: |
      Add a worker-scoped fixture `products` that loads products.json once per worker with `playwright.request`.
      Why must tests never change it?

  - id: cart-page-pw
    type: coding
    concept: typescript-page-objects
    skill: application
    title: The cart page object in TypeScript
    prompt: |
      Implement `CartPage` in TypeScript in the style of the given page objects: product names, quantity of a
      product, increase, remove, the total, the empty state, and going to the checkout. Every change must wait -
      with a web-first assertion - until the page shows its result.
    project: playwright
    files:
      - exercises/pages/cart-page.ts
    test: tests/cart-page.spec.ts
    command: npx playwright test tests/cart-page.spec.ts
    hints:
      - "Keep `page.getByTestId('cart-line')` as a private locator, and find one line with `filter({ has: ... })` on its line-name."
      - "Exact names: `filter({ hasText: /^Oat milk 1 L$/ })` - escape the name if it contains special characters."
      - After clicking increase or remove, assert the new quantity or that the line is gone (`toHaveCount(0)`).
    modelAnswer: |
      ```ts
      private line(productName: string): Locator {
        return this.lines.filter({ has: this.page.getByTestId('line-name').filter({ hasText: exactly(productName) }) });
      }

      async increaseQuantity(productName: string): Promise<this> {
        const before = await this.quantityOf(productName);
        await this.line(productName).getByTestId('increase').click();
        await expect(this.line(productName).getByTestId('line-quantity')).toHaveText(String(before + 1));
        return this;
      }

      async remove(productName: string): Promise<this> {
        await this.line(productName).getByTestId('remove').click();
        await expect(this.line(productName)).toHaveCount(0);
        return this;
      }
      ```
    rubric:
      - Every test in cart-page.spec.ts passes
      - Locators are private and methods return data or page objects
      - Changes wait with web-first assertions, not timeouts
      - goToCheckout returns the given CheckoutPage
    solution: |
      The tests read the cart right after each change, so a page object that doesn't wait fails them. Reference:
      `solutions/pages/cart-page.ts` - compare it with the Java `CartPage` from the Selenium track.
    followUp: |
      Turn `CartPage` into a fixture `cartWithThreeItems`. Which existing fixture would it build on?

  - id: shared-page
    type: debug
    concept: test-isolation-and-config
    skill: analysis
    title: Tests that depend on each other
    prompt: |
      These tests pass when the file runs on its own and fail with `fullyParallel`, or when run one at a time.
      Click the lines that make them depend on each other.
    language: typescript
    code: |
      let page: Page;

      test.beforeAll(async ({ browser }) => {
        page = await browser.newPage();
        await page.goto('http://127.0.0.1:4310/index.html');
      });

      test('adds oat milk', async () => {
        await page.getByTestId('add-to-cart-oat-milk').click();
        await expect(page.getByTestId('cart-count')).toHaveText('1');
      });

      test('the cart starts empty', async () => {
        await expect(page.getByTestId('cart-count')).toHaveText('0');
      });
    correctLines: [1, 4]
    lineNotes:
      - line: 5
        note: A full URL works here - pages you create yourself don't get the config's baseURL - but the real problem is that this one page is shared by every test.
      - line: 14
        note: The assertion is right for a fresh page; it fails because the page is not fresh.
    hints:
      - How many pages exist for the two tests together?
      - What does each worker process see in the module-level variable?
    solution: |
      **Lines 1 and 4.** One page, created once and stored in a module variable, is shared by every test in the
      worker: the second test sees the first test's cart, and with `fullyParallel` a test in another worker sees
      no page at all. Use the built-in `page` fixture (`async ({ page }) => ...`) and move the navigation into a
      fixture or a `beforeEach` that uses it.
    followUp: |
      Logging in is slow, and every test needs a logged-in user. How do Playwright projects with a setup project
      and `storageState` avoid both repeated logins and shared pages?

  - id: worker-fixture
    type: mcq
    concept: playwright-fixtures
    skill: application
    title: Expensive setup
    prompt: |
      Every test needs a merchant account that takes 20 seconds to create through the API. Tests only read the
      account's details; they never change it. Which design fits?
    options:
      - id: worker-scope
        text: A worker-scoped fixture that creates one account per worker and hands it to the tests
        feedback: Correct - created once per worker process, shared safely because tests only read it.
      - id: test-scope
        text: A test-scoped fixture that creates an account for every test
        feedback: Correct but slow - 20 seconds per test for data nobody changes.
      - id: global-variable
        text: Create it in beforeAll and store it in a module-level variable
        feedback: Works only while all tests run in one worker and in one file - and shares it without the fixture system knowing.
      - id: hard-coded
        text: Hard-code one existing account's credentials in the tests
        feedback: Parallel workers and other teams' runs would share it, and credentials don't belong in test code.
    correct: [worker-scope]
    hints:
      - Who changes the account, and how often must it be created?
    solution: |
      **A worker-scoped fixture.** `{ scope: 'worker' }` creates it once per worker; if tests changed it, they
      would need their own (test-scoped) copies.
    followUp: |
      The account must be deleted afterwards. Where does that code go?

  - id: serial-or-independent
    type: mcq
    concept: test-isolation-and-config
    skill: application
    title: A flow split into tests
    prompt: |
      A file has three tests: "create order", "pay the order", "refund the order" - each uses the order the
      previous one made. With `fullyParallel` they fail. What is the best fix?
    options:
      - id: independent
        text: Make each test create the state it needs (through fixtures or the API), so they run in any order
        feedback: Correct - independent tests can run in parallel, alone, and in any order.
      - id: serial
        text: "Mark the file `test.describe.configure({ mode: 'serial' })`"
        feedback: That makes them run in order and skip the rest after a failure - it works, but it keeps the tests coupled and slow.
      - id: retries
        text: Turn on retries
        feedback: Retries can't fix tests that need other tests to have run first.
      - id: workers-one
        text: Run with one worker
        feedback: Hides the coupling and makes the whole suite slower.
    correct: [independent]
    hints:
      - What would happen if only "refund the order" were run?
    solution: |
      **Independent tests.** Serial mode exists for the rare flows that truly can't be split, but each test
      creating its own state - often quickly through the API - is the healthier default.
    followUp: |
      Write the fixture that gives the refund test a paid order without going through the UI for the payment.

  - id: interview-playwright-framework
    type: interview
    concept: typescript-page-objects
    skill: application
    title: "Interview: structure a Playwright framework"
    prompt: |
      **Interviewer:** "How would you structure a Playwright test framework in TypeScript for a checkout -
      and how is it different from a Selenium/Java framework?"
    hints:
      - Folders and layers, fixtures, page objects, config, isolation, CI.
    modelAnswer: |
      - Layers: tests → fixtures → page objects and components → Playwright; API helpers for setup.
      - Fixtures replace base classes and most hooks: `test.extend` with page objects and prepared states
        (logged-in user, cart with items), worker-scoped fixtures for expensive read-only data.
      - Page objects as TypeScript classes with private locators, async intent methods, web-first waits; no
        business assertions inside.
      - Config: baseURL, projects (desktop, mobile, setup project with storageState), retries reported as flaky,
        trace on failure, webServer for the app.
      - Differences from Selenium: no driver management or explicit waits, isolation per test context by default,
        parallel by default; tsc in CI because Playwright doesn't type-check.
    followUps:
      - How do you handle login for hundreds of tests?
      - Where do API calls belong in a UI suite?
      - What would you put in a worker-scoped fixture, and what never?
    rubric:
      - Described layers with fixtures and page objects
      - Explained custom fixtures and their dependencies
      - Covered configuration such as baseURL, projects and traces
      - Explained isolation through browser contexts and parallel runs
      - Contrasted with a Selenium/Java framework
    solution: |
      Strong answers show that fixtures **replace** the inheritance-heavy parts of older frameworks, and that
      isolation is designed in rather than added later.

recall:
  - id: recall-fixture-shape
    concept: playwright-fixtures
    prompt: What is the shape of a custom fixture?
    answer: async ({ dependencies }, use) => { setup; await use(value); teardown } - defined with test.extend.
  - id: recall-fixture-lazy
    concept: playwright-fixtures
    prompt: When does a fixture run?
    answer: Only when a test (or another fixture it uses) asks for it - unless it is declared auto.
  - id: recall-worker-scope
    concept: playwright-fixtures
    prompt: What is a worker-scoped fixture for?
    answer: Expensive setup shared by the tests in one worker process - and only safe if tests don't change it.
  - id: recall-page-object-ts
    concept: typescript-page-objects
    prompt: How should a TypeScript page object wait after an action?
    answer: With a web-first assertion on the result (await expect(...).toHaveText / toHaveCount / toBeHidden), never a timeout.
  - id: recall-context
    concept: test-isolation-and-config
    prompt: What isolates Playwright tests from each other?
    answer: A new browser context per test - its own cookies, storage and cache.
  - id: recall-fully-parallel
    concept: test-isolation-and-config
    prompt: What does fullyParallel change?
    answer: Tests in the same file may run in different workers at the same time, instead of in order in one worker.

