id: performance-testing-capstone
title: Capstone - a load test engagement for the SandPay API
subject: performance-testing
module: perf-analysis
level: advanced
status: published
estimatedMinutes: 180
summary: A load test engagement is not one clever script - it is a chain of decisions that each have to hold. This capstone runs the whole chain on the local SandPay practice API. You plan the load (a workload mix, requirements written so a run can prove them, the API's ceiling, the users a closed loop needs and the run length the rarest transaction demands), script the same workload in Locust and in JMeter, run both, judge them with the same rules, check that the two tools tell the same story, and write a report whose verdict is pass only when nothing is failing, missing or contradicted. You write the plan, the Locust script and the analysis in Python, and every number shown comes from real runs.
tags:
  [
    capstone,
    load test engagement,
    test plan,
    workload model,
    requirements,
    SLO,
    Little's law,
    capacity ceiling,
    think time,
    closed loop,
    JMeter,
    Locust,
    tool comparison,
    steady state,
    warm-up,
    stress test,
    verdict,
    report,
    evidence,
    caveats,
  ]

environment: |
  - **Runtime:** Python 3.12 in `practice/perf/.venv` with Locust 2.47.0 and pytest, and Apache JMeter 5.6.3 (run with
    JDK 17), on one Linux machine with 14 CPUs. The three runs shown were made on 21 November 2026 by
    `practice/perf/support/pcap_capture.py` against the loopback practice API `support/sandpay_target.py`; every table
    and block below is printed by the solution code (`support/pcap_demo.py`) from the files that run saved in
    `support/pcap_data/`. **Timings, counts and request rates change with the machine and the run**; the way of
    reading them does not. One machine ran the API, the load generator and the analysis, so absolute times are
    optimistic compared with a real network and a separate load generator.
  - **Synthetic data:** SandPay is a fictional payments company (`https://api.sandpay.example`). The practice API
    serves the endpoints used here with a configured service time (20 ms, plus or minus 5 ms of jitter) and eight
    workers. Its source says what each request costs: a read one service time, a payment creation twice that and a
    settlement report ten times (`_service(state, 2.0)` and `_service(state, 10.0)`); the plan reads these factors
    from that source, so they are configuration, not measurements of a real service. Only merchants 1 to 3 have
    seeded payments, which is why the workload uses those three. No card data appears anywhere; amounts are in
    minor units.
  - **Locust 2.47.0 documentation, read on 21 November 2026:**
    [Writing a locustfile](https://docs.locust.io/en/stable/writing-a-locustfile.html) ("Tasks are picked at random,
    but you can give them different weighting"; "When a task has finished executing, the User will then sleep for its
    specified wait time"; a wait time "is applied after task execution"; `name` groups requests) and
    [Configuration](https://docs.locust.io/en/stable/configuration.html) (`--reset-stats`: "Reset statistics once
    spawning has been completed"). From the **Locust 2.47.0 source** installed here: `bucket_response_time` rounds a
    response time "to ~2 significant digits, so that 147 becomes 150", and `runners.py` logs every request into the
    statistics, with an extra error entry when it failed - so the histogram holds failed requests too.
  - **JMeter 5.6.3 documentation, read on 21 November 2026:**
    [Component reference](https://jmeter.apache.org/usermanual/component_reference.html) - the Random Variable Config
    Element ("The number is calculated using the formula minimum+Random.nextInt(maximum-minimum+1)"; "the random
    value is evaluated at the start of each iteration"), the If Controller ("By default, the condition is evaluated
    only once on initial entry, but you have the option to have it evaluated for every runnable element"; the
    recommended option is "Interpret Condition as Variable Expression" with `${__jexl3()}`), the Constant Timer ("If
    you want to have each thread pause for the same amount of time between requests, use this timer"; "To apply a timer
    after a sampler, either add it to the next sampler, or add it as the child of a Flow Control Action Sampler").
  - **Google SRE book, chapter 4**, [Service Level Objectives](https://sre.google/sre-book/service-level-objectives/),
    read on 21 November 2026: "Using percentiles for indicators allows you to consider the shape of the distribution
    and its differing attributes: a high-order percentile, such as the 99th or 99.9th, shows you a plausible
    worst-case value, while using the 50th percentile (also known as the median) emphasizes the typical case."
  - **Earlier lessons**, whose code this one reuses through the reference solutions:
    [Requirements and SLOs](#/lesson/performance-requirements-and-slos) (`slo_spec`, `slo_evaluate`) and
    [Little's law](#/lesson/littles-law-and-workload-models) (`little_calc.users_needed`).
  - **Not run here:** k6 and Gatling, a real network between the load generator and the API, and any system that is
    not the loopback practice API. The worked example's framing is hypothetical.

prerequisites:
  - reading-load-test-results
  - bottleneck-analysis
  - performance-testing-in-ci-cd
  - performance-testing-payment-systems
  - locust-task-sets-and-user-flows
  - jmeter-logic-controllers
  - performance-requirements-and-slos
  - littles-law-and-workload-models

concepts:
  - id: perf-cap-plan
    name: Plan the engagement before any tool runs
    summary: A plan turns a workload mix and a target rate into per-transaction rates, a ceiling (workers divided by the mix-weighted mean service time), a utilisation, the users a closed loop needs (Little's law) and a run length set by the rarest transaction, and it states the requirements at the per-transaction rates the run will really produce.
  - id: perf-cap-script
    name: One workload, two tools
    summary: A Locust file and a JMeter plan are two spellings of the same workload only when the mix, the think time, the sign-in, the request names, the headers and the keys all match; the remaining differences (random mix per iteration, rounded response times, warm-up handling) are known and written down.
  - id: perf-cap-report
    name: Judge, compare and report honestly
    summary: Both tools' results are judged by the same rules (nearest-rank percentile, load reached, enough samples), compared requirement by requirement, and reduced to one call that is pass only when nothing fails, is inconclusive or is contradicted, with the evidence and the caveats printed next to the verdict.

objectives:
  - Turn a workload mix and a target rate into per-transaction rates, estimate the API's ceiling from the mix-weighted service time, and say when the target sits too close to it for a clean pass or fail.
  - Compute the users a closed-loop test needs from Little's law and the run length the rarest transaction needs for a stated number of samples after the warm-up.
  - Write requirements that a run can prove (transaction, percentile, threshold, load) at the rates the plan produces, so a missed load gives "inconclusive" and not a silent pass.
  - Script the same workload in Locust and JMeter, with matching names, weights, think time, sign-in and keys, and list the differences that remain.
  - Judge JMeter samples and Locust totals with the same rules, and explain what Locust's rounding, its failed-request histogram and its warm-up reset change.
  - Compare two tools requirement by requirement, make disagreement a finding, and write a report that cannot say pass over a failing, missing or contradicted result.

sections:
  - id: intuition
    kind: intuition
    concepts: [perf-cap-plan, perf-cap-script, perf-cap-report]
    title: The idea in plain language
    body: |
      The product owner at SandPay asks one question before settlement day: **"Will the API hold?"** A load test
      engagement is the way to turn that into a sentence you can defend. The sentence is not "the average was 40 ms".
      It is closer to this one, which this lesson produces from real runs:

      > At about 60 requests per second - 24 payments, 18 lists, 15 single reads and 3 settlement reports a second -
      > the p95 of every transaction is far inside its requirement (51 ms against 120 ms for payments, 249 ms against
      > 400 ms for the report), in both JMeter and Locust, with no errors. The API's ceiling for this mix is about 216
      > requests per second, so this load uses 28 % of it. With 60 users and no think time the API served 213 requests
      > per second and the p95 of every transaction failed its requirement.

      Every clause of that sentence comes from a decision that could have gone wrong. The 60 requests per second
      came from a plan. The "24 payments a second" came from a workload mix. "In both tools" means two scripts that
      mean the same thing. "Far inside" means requirements that were written before the run so a number could be
      compared with them. "28 % of the ceiling" came from a service time, and the claim "can fail" comes from a run
      that did fail.

      A capstone is the chain, not a new technique. The earlier lessons each taught one link: requirements, workload
      models, Little's law, the two tools, reading results, bottlenecks, payments. The new skill is making the links
      hold together - and reporting honestly when one of them does not.

  - id: what
    kind: what
    concepts: [perf-cap-plan, perf-cap-script, perf-cap-report]
    title: What the engagement consists of
    body: |
      Five stages, each with an artifact you can hand to a colleague.

      | Stage | Question it answers | Artifact in this lesson |
      | ----- | ------------------- | ----------------------- |
      | 1. Plan | Which load, which requirements, how long, how many users? | `pcap_plan.py` and five written requirements |
      | 2. Script | What does one virtual merchant do? | `pcap_locustfile.py` and `pcap_plan.jmx` |
      | 3. Run | What happened under that load? | `jmeter_target`, `locust_target`, `locust_stress` |
      | 4. Analyse | Did each requirement hold, and do the two tools agree? | `pcap_report.py` verdicts and agreement |
      | 5. Report | What can we claim, and what can we not? | a Markdown report with verdict, evidence, caveats |

      **The system under test** is the SandPay practice API on your own machine. The workload is one merchant's
      session: sign in once, read one page of payments to learn some ids, then repeat one transaction at a time with a
      think time of 0.3 seconds between them:

      | Transaction | Weight | Share | What the API charges (service time) |
      | ----------- | ------ | ----- | ----------------------------------- |
      | `POST /v1/payments` | 8 | 40 % | twice the base: 40 ms |
      | `GET /v1/payments` (`?limit=10`) | 6 | 30 % | the base: 20 ms |
      | `GET /v1/payments/{id}` | 5 | 25 % | the base: 20 ms |
      | `GET /v1/reports/settlement` | 1 | 5 % | ten times the base: 200 ms |

      **The requirements** follow the house format from the [requirements lesson](#/lesson/performance-requirements-and-slos);
      each names a transaction, a percentile, a threshold and a load:

      ```text
      p95 of POST /v1/payments < 120 ms at 24 req/s
      p95 of GET /v1/payments < 80 ms at 18 req/s
      p95 of GET /v1/payments/{id} < 80 ms at 15 req/s
      p95 of GET /v1/reports/settlement < 400 ms at 3 req/s
      error rate of POST /v1/payments below 1% at 24 req/s
      ```

      The loads are per transaction because a verdict for the report is only worth something if the report was
      really requested at 3 per second - the next sections show where 24, 18, 15 and 3 come from.

  - id: why
    kind: why
    concepts: [perf-cap-plan, perf-cap-script, perf-cap-report]
    title: Why a capstone, and what fails at the seams
    body: |
      Each skill can be right on its own and the engagement still wrong, because the failures sit between the links.

      - **Plan and script disagree.** The plan says 60 requests per second and the script, with too few users or too
        much think time, produces 52. A requirement stated "at 24 req/s" is then judged on a run that never reached
        24 - which is why a verdict must be `inconclusive` when the load was not reached, not `pass`.
      - **Two tools, two workloads.** JMeter and Locust give different numbers and someone concludes that one tool
        is slow. Often the scripts differ: a different mix, a think time in one and not the other, request names that
        do not line up so the rows cannot be compared.
      - **The report says more than the evidence.** "Pass" printed over a run with a requirement that only had 40
        samples, or over two tools that disagree by a factor of two. A stakeholder reads the one word and stops.
      - **The load never asked the question.** A run at 28 % of the ceiling proves the API holds at 28 %. The sentence
        "the API holds settlement day" needs the stress run too: the API at its ceiling is the evidence of where it stops
        holding.

      A capstone is where these seams show. It is also the shape of the interview question "walk me through a load
      test you ran": the answer is the five stages, with the numbers.

  - id: plan-internals
    kind: internals
    concepts: [perf-cap-plan]
    title: Internals - the plan is arithmetic you can do before any tool runs
    body: |
      **Rates.** The mix weights 8, 6, 5 and 1 sum to 20, so 60 requests per second split into 24, 18, 15 and 3. The
      rarest transaction (the report, 3 per second) sets the problem: to judge a p95 you want enough samples, and 3
      samples per second is slow.

      **Ceiling.** The API has eight workers and a service time per request. The ceiling is the most the workers can
      serve if they are never idle: `workers / mean service time`. The mean has to be **weighted by the mix**. A plain
      average of the four service times (40, 20, 20 and 200 ms) is 70 ms and would put the ceiling at 114 requests per
      second. The weighted mean is `(8*40 + 6*20 + 5*20 + 1*200) / 20 = 37 ms`, which puts it at `8 / 0.037 = 216`
      requests per second. The report is one request in twenty, so it counts one twentieth, not one quarter.

      **Utilisation.** `60 / 216 = 28 %`. Far below the ceiling, so latency at this load is service time plus a
      little queueing - a clean question for a requirement. Near the ceiling (this lesson warns above 70 %) a
      percentile mostly measures the queue, and pass or fail depends on small changes in the load.

      **Users.** The runs are a closed loop: each user sends a request, waits for the answer, thinks, repeats. By
      Little's law (the [workload models lesson](#/lesson/littles-law-and-workload-models)), users =
      `rate * (response time + think time)`. With the 37 ms mean as the response time and 0.3 s of thinking:
      `60 * (0.037 + 0.3) = 20.2`, rounded up to **21 users**. A fraction of a user cannot run, and rounding down
      would miss the load.

      **Run length.** After dropping the warm-up (5 seconds) the report has to give at least 100 samples, the
      minimum the [SLO lesson's](#/lesson/performance-requirements-and-slos) `evaluate` accepts: `100 / 3 + 5 = 38.3`,
      rounded up to **39 seconds**. The runs used 50 s, a margin: `--reset-stats` discards the ramp (the Locust totals
      here span about 47.6 of the 50 seconds) and a requirement judged on 99 samples is inconclusive.

      **Requirements at the produced rates.** The requirement says "at 24 req/s" so the evaluator can check that the
      transaction really ran at about that rate (at least 90 % of it). A latency requirement without a load is a
      statement about nothing in particular.

      **What the plan cannot know.** The service times came from the API's configuration. For a real system they come
      from measurements - the [production workload lesson](#/lesson/workload-modelling-from-production) and a
      calibration run - and the plan is a first estimate that the first runs correct.

  - id: script-internals
    kind: internals
    concepts: [perf-cap-script]
    title: Internals - two spellings of one workload
    body: |
      The Locust file and the JMeter plan have to mean the same thing. This table is the checklist; every row has an
      element in each tool.

      | Part of the workload | Locust (`pcap_locustfile.py`) | JMeter (`pcap_plan.jmx`) |
      | -------------------- | ----------------------------- | ------------------------ |
      | one virtual merchant | an `HttpUser` class | one thread of the thread group |
      | sign in once | `on_start` | Once Only Controller around the sign-in and setup requests |
      | the merchant | `next(_merchants) % 3 + 1` | a JSR223 pre-processor: thread number `% 3 + 1` |
      | the token | `client.headers["Authorization"]` | a JSON Post-Processor and a Header Manager with `Bearer ${token}` |
      | weighted choice 8/6/5/1 | `@task(8)` `@task(6)` `@task(5)` `@task(1)` | Random Variable `slot` (1 to 20) and four If Controllers |
      | think time 0.3 s | `wait_time = constant(THINK)` | Constant Timer, 300 ms |
      | fresh key per payment | `str(uuid.uuid4())` | `${__UUID()}` in a Header Manager |
      | one name for every id | `name="GET /v1/payments/{id}"` | the sampler's label `GET /v1/payments/{id}` |
      | warm-up | `--reset-stats` | drop the first 5 s of samples in the analysis |

      **The weights.** Locust's documentation: "Tasks are picked at random, but you can give them different weighting."
      The JMeter version has no weight field, so the plan draws `slot` between 1 and 20 each iteration (Random
      Variable Config, which "is evaluated at the start of each iteration") and an If Controller runs the transaction
      whose range contains it: slots 1 to 8 create a payment, 9 to 14 list, 15 to 19 read one, slot 20 reads the report.
      The If Controllers use the recommended setting, "Interpret Condition as Variable Expression" with
      `${__jexl3(${slot} <= 8)}`.

      **The think time.** Locust: "When a task has finished executing, the User will then sleep for its specified wait
      time." The Constant Timer is a pause "between requests" and, in JMeter, applies **before** each sampler in its
      scope; it sits inside the per-iteration controller so the sign-in is not delayed. Both tools therefore wait once
      per transaction.

      **The names.** The analysis joins the two tools on the request name. Locust groups requests under `name=`;
      JMeter's label is the sampler name. If one tool recorded `/v1/payments/pay_100123` per id, the rows would not
      line up and the report could not compare them - which is why every id goes under `{id}`.

      **What stays different, on purpose.** The mix in both tools is a **random draw**, so the shares are close to
      40/30/25/5 but not equal - in these runs 38.7/31.8/24.5/4.9 % in JMeter and 40.9/29.4/25.2/4.6 % in Locust. The
      tools time requests differently and Locust **rounds** each response time to two significant digits. Warm-up is
      handled in different places. A report lists these as caveats; it does not pretend the two runs are identical.

  - id: report-internals
    kind: internals
    concepts: [perf-cap-report]
    title: Internals - the same rules for both tools, then one call
    body: |
      **JMeter results** are one row per sample. After dropping the warm-up, the SLO lesson's `evaluate` takes the
      nearest-rank percentile of the elapsed times of **successful** samples, the error rate from all samples, and
      marks a verdict `inconclusive` when there are fewer than 100 samples or the load was not reached.

      **Locust results** are totals: per request name, a count, a failure count, a histogram of rounded response times
      and the first and last request times. `locust_verdicts` applies the same rules to them:

      - the percentile is the nearest rank over the histogram - sort the buckets numerically (as text `"1000"` would
        sort before `"90"`) and stop where the running count reaches `ceil(p/100 * n)`;
      - the rate is requests divided by `last_request_timestamp - start_time`;
      - a load stated in users cannot be checked from totals, so it is `inconclusive`, not a guess.

      Three Locust details change what a number means, all from the 2.47.0 source and documentation. **Rounding**:
      "147 becomes 150", so a p95 of 247 ms in JMeter reads 250 in Locust; the agreement check has a slack for
      that. **Failures**: the histogram holds failed requests too, unlike the JMeter rule, so a latency verdict from
      Locust is read next to its error rate. **Warm-up**: `--reset-stats` resets statistics "once spawning has been
      completed", so the totals start after the ramp.

      **Agreement.** `compare_tools` says `agree` when the two verdicts have the same status and the observed values
      differ by at most `max(10 ms, 30 % of the smaller)`; `differ` when not; `not-comparable` when either tool has no
      observed value. The slack is wide enough for rounding and ordinary run-to-run noise and narrow enough that a
      factor of two is not "agreement".

      **One call.** `final_call` is `fail` if anything fails in any tool. It is `pass` only if every tool has verdicts,
      all of them pass and no comparison says `differ`. Anything else - too few samples, a load not reached, a tool with
      no results, two tools that contradict each other - is `inconclusive`. There is no way to reach `pass` by
      leaving something out.

      **The report** carries the verdict, the plan, the evidence table, the agreement and the caveats, in that order,
      and `render_report` refuses to produce one without caveats. A report that cannot say what it did not measure is
      not finished.

  - id: when
    kind: when
    concepts: [perf-cap-plan, perf-cap-script, perf-cap-report]
    title: When to run a full engagement and when not to
    body: |
      **Run one** before a launch or a known peak (settlement day, a campaign, a migration), when a capacity or cost
      decision depends on the answer, or when a change touches the shared bottleneck (the database, a payment
      provider, the pool). The engagement is worth its cost because it produces a sentence people act on.

      **Run less** when the question is narrow. A regression check on one endpoint belongs in CI with a baseline (the
      [CI lesson](#/lesson/performance-testing-in-ci-cd)); a "did we make it slower?" check is a comparison, not an
      engagement. A single-user timing is a profiling question.

      **Do not run one yet** when the environment is not comparable to production in the way the question needs (see the
      [environments lesson](#/lesson/performance-test-environments-and-data)), when nobody can say what the requirements
      are, or when you cannot own the target. In those cases the first deliverable is the missing input, not a test.

      **Use two tools** when the tool itself is a risk - a protocol one handles badly, a team that must reproduce your
      test, a suspected generator bottleneck - or when you need a cross-check on a number that will be quoted. For a
      routine run one tool is enough; the second tool buys a check on the measurement, at the price of keeping two
      scripts equal.

  - id: visual
    kind: visual
    concepts: [perf-cap-plan, perf-cap-script, perf-cap-report]
    title: The engagement, and how the call is made
    body: |
      ```mermaid
      flowchart LR
        P["Plan: mix, requirements, ceiling, users, run length"] --> S["Script: Locust file and JMeter plan"]
        S --> R["Run: target load in both tools, stress in one"]
        R --> A["Analyse: same rules, then compare the tools"]
        A --> W["Report: verdict, evidence, caveats"]
        A -- "a run was too short or missed its load" --> R
        W -- "the sentence needs more evidence" --> P
      ```

      ```mermaid
      flowchart TD
        V["All verdicts from all tools"] --> F{"Any verdict fails?"}
        F -- "yes" --> FAIL["FAIL - name the failing transactions"]
        F -- "no" --> E{"A tool with no verdicts, or any not-pass verdict?"}
        E -- "yes" --> INC["INCONCLUSIVE - say what blocks a verdict"]
        E -- "no" --> D{"Do the tools differ on any requirement?"}
        D -- "yes" --> INC
        D -- "no" --> PASS["PASS - at the stated load, in every tool"]
      ```

      The first diagram is the engagement and its two loops: a run that was too short goes back to the run (or the plan,
      when the arithmetic was wrong), and a report that cannot support the sentence goes back to the plan for more
      evidence. The second is `final_call`: three ways out, and the only one that says pass needs every check to be
      green.

  - id: code-plan
    kind: code
    concepts: [perf-cap-plan]
    title: The plan in Python
    body: |
      From `practice/perf/solutions/capstone/pcap_plan.py`; the tests are in `tests/capstone/test_pcap_plan.py`.

      ```python
      def transaction_rates(mix, total_rps):
          total = _check_mix(mix)
          return {tx: total_rps * w / total for tx, w in mix.items()}

      def mean_service_ms(mix, service_ms):
          total = _check_mix(mix)
          return sum(service_ms[tx] * w for tx, w in mix.items()) / total

      def ceiling_rps(workers, mean_ms):
          return workers / (mean_ms / 1000)

      def run_seconds(rate_rps, min_samples, warmup_s=5.0):
          return math.ceil(min_samples / rate_rps + warmup_s)

      def engagement_plan(mix, service_ms, workers, target_rps, think_s,
                          min_samples=100, warmup_s=5.0, max_utilisation=0.7):
          rates = transaction_rates(mix, target_rps)
          mean = mean_service_ms(mix, service_ms)
          ceiling = ceiling_rps(workers, mean)
          utilisation = round(target_rps / ceiling, 2)
          rarest = min(rates, key=rates.get)
          warnings = []
          if utilisation > max_utilisation:
              warnings.append(f"utilisation {utilisation:.0%} is above {max_utilisation:.0%}: ...")
          return {"rates": rates, "mean_service_ms": mean, "ceiling_rps": ceiling,
                  "utilisation": utilisation,
                  "users": ref.users_needed(target_rps, mean / 1000, think_s),
                  "run_seconds": run_seconds(rates[rarest], min_samples, warmup_s),
                  "rarest": rarest, "warnings": warnings, "ok": not warnings}
      ```

      `ref.users_needed` is the reference code of the Little's law lesson, loaded by `pcap_fixture.py` under a private
      module name; the capstone reuses it instead of copying the formula, and works whether or not you solved that
      lesson. `_check_mix` rejects an empty mix and a weight of zero or less, and the other functions reject a
      non-positive rate or a service time missing for a transaction.

  - id: code-locust
    kind: code
    concepts: [perf-cap-script]
    title: The workload in Locust
    body: |
      The whole reference solution, `practice/perf/solutions/capstone/pcap_locustfile.py` (docstring left out):

      ```python
      import itertools, os, random, uuid
      from locust import HttpUser, constant, task

      THINK = float(os.environ.get("PCAP_THINK", "0.3"))
      _merchants = itertools.count(0)

      class Merchant(HttpUser):
          wait_time = constant(THINK)

          def on_start(self):
              n = next(_merchants) % 3 + 1
              r = self.client.post("/auth/token",
                                   json={"client_id": f"merchant-{n}", "client_secret": f"secret-{n}"},
                                   name="POST /auth/token")
              self.client.headers["Authorization"] = f"Bearer {r.json()['access_token']}"
              page = self.client.get("/v1/payments", params={"limit": 50},
                                     name="setup: GET /v1/payments")
              self.payment_ids = [p["id"] for p in page.json()["data"]]

          @task(8)
          def create_payment(self):
              self.client.post("/v1/payments",
                               json={"amount_minor": random.randint(100, 5000), "currency": "EUR"},
                               headers={"Idempotency-Key": str(uuid.uuid4())},
                               name="POST /v1/payments")

          @task(6)
          def list_payments(self):
              self.client.get("/v1/payments", params={"limit": 10}, name="GET /v1/payments")

          @task(5)
          def read_payment(self):
              self.client.get(f"/v1/payments/{random.choice(self.payment_ids)}",
                              name="GET /v1/payments/{id}")

          @task(1)
          def settlement_report(self):
              self.client.get("/v1/reports/settlement", name="GET /v1/reports/settlement")
      ```

      The JMeter side is `support/pcap_plan.jmx` (about 250 lines of XML). The two parts that carry the mix and the
      think time are these:

      ```xml
      <RandomVariableConfig testname="slot 1..20">
        <stringProp name="minimumValue">1</stringProp>
        <stringProp name="maximumValue">20</stringProp>
        <stringProp name="variableName">slot</stringProp>
      </RandomVariableConfig>
      <ConstantTimer testname="Think time">
        <stringProp name="ConstantTimer.delay">${__P(think,300)}</stringProp>
      </ConstantTimer>
      <IfController testname="40 % create a payment">
        <stringProp name="IfController.condition">${__jexl3(${slot} &lt;= 8)}</stringProp>
        <boolProp name="IfController.useExpression">true</boolProp>
      </IfController>
      ```

      The XML is shown with its attributes trimmed to the ones that matter; the complete file is the one that was run.

  - id: code-report
    kind: code
    concepts: [perf-cap-report]
    title: The analysis in Python
    body: |
      From `practice/perf/solutions/capstone/pcap_report.py`:

      ```python
      def locust_percentile(response_times, pct):
          buckets = sorted((int(ms), n) for ms, n in response_times.items())
          total = sum(n for _, n in buckets)
          rank = math.ceil(pct / 100 * total)
          seen = 0
          for ms, n in buckets:
              seen += n
              if seen >= rank:
                  return ms

      def locust_verdicts(entries, requirements, min_samples=100):
          by_name = {e["name"]: e for e in entries}
          verdicts = []
          for req in requirements:
              entry = by_name.get(req.transaction)
              n = entry["num_requests"] if entry else 0
              if n < min_samples:                       # "only N samples (need M)"
                  ...
              span = max(entry["last_request_timestamp"] - entry["start_time"], 0.001)
              rate = n / span
              if req.kind == "latency":
                  observed = locust_percentile(entry["response_times"], req.percentile)
                  passed = observed <= req.threshold_ms
              else:
                  observed = round(100 * entry["num_failures"] / n, 2)
                  passed = observed <= req.max_error_percent
              if rate < 0.9 * req.load:                 # inconclusive, observed still filled in
                  ...
              else:
                  ...  # "pass" or "fail"

      def compare_tools(a, b, tolerance=0.30, slack_ms=10.0):
          ...
              gap = abs(x.observed - y.observed)
              limit = max(slack_ms, tolerance * min(x.observed, y.observed))
              out[key] = "agree" if x.status == y.status and gap <= limit else "differ"

      def final_call(by_tool, agreement=None):
          verdicts = [v for vs in by_tool.values() for v in vs]
          if any(v.status == "fail" for v in verdicts):
              return "fail"
          empty = any(not vs for vs in by_tool.values())
          differ = agreement is not None and "differ" in agreement.values()
          if empty or differ or any(v.status != "pass" for v in verdicts):
              return "inconclusive"
          return "pass"
      ```

      The `...` marks lines that only build a `Verdict` record. JMeter samples are judged by the SLO lesson's `evaluate`,
      reached through `ref`, after `steady_samples` has dropped the warm-up. `render_report` then prints the verdict,
      the plan, the evidence table, the agreement and the caveats.

  - id: line-by-line
    kind: line-by-line
    concepts: [perf-cap-plan, perf-cap-script, perf-cap-report]
    title: Line by line - the choices that matter
    body: |
      - **`next(_merchants) % 3 + 1`** - the practice API seeds payments only for merchants 1 to 3. Twenty-one users
        cycle through those three, so `GET /v1/payments/{id}` always finds an id of its own merchant.
      - **`on_start` reads one page once** - the ids for the single-read transaction. It is named `setup: GET
        /v1/payments` so it is a separate row and does not pollute the list transaction's numbers.
      - **`name="GET /v1/payments/{id}"`** - one name for every id. Without it Locust would print one row per payment
        id and the analysis could not find the transaction.
      - **`headers={"Idempotency-Key": str(uuid.uuid4())}`** - a fresh key per payment (see the [payments
        lesson](#/lesson/performance-testing-payment-systems)); a fixed key would turn the run into replays.
      - **`@task(8)` ... `@task(1)`** - the mix. The tasks are picked at random with those weights, so shares are close
        to, not exactly, 40/30/25/5.
      - **`wait_time = constant(THINK)`** - applied after each task, once per transaction; `PCAP_THINK` lets a test or a
        stress run change it without editing the file.
      - **`sorted((int(ms), n) ...)`** - the histogram keys are strings; sorting them as text would put `"1000"` before
        `"90"`.
      - **`span = max(last - start, 0.001)`** - the rate is over the active span; a single request would otherwise divide
        by zero.
      - **`if rate < 0.9 * req.load`** - a run that did not reach the load cannot prove the requirement, however good
        its latency looks.
      - **`any(not vs for vs in by_tool.values())`** - a tool that produced no verdicts is not a tool that passed.

  - id: steps
    kind: steps
    concepts: [perf-cap-plan, perf-cap-script, perf-cap-report]
    title: Steps - run an engagement
    body: |
      1. **Ask what the sentence is.** "Will it hold settlement day" becomes a load, a duration and requirements per
         transaction. Write the requirements in the testable form before anything runs.
      2. **Model the workload.** A mix from production data (or a stated assumption, labelled as one), the think time, the
         number of distinct identities.
      3. **Do the plan arithmetic.** Rates, mean service time, ceiling, utilisation, users, run length. If utilisation is
         above about 70 %, move the target or say the run will be a capacity test.
      4. **Script it once in the main tool.** Names, weights, think time, sign-in, keys. Smoke-test: no 4xx, the mix is
         about right.
      5. **Script it in the second tool, if you use two,** and tick every row of the checklist; then smoke-test it the
         same way.
      6. **Run the target load** in each tool against a fresh target. Note users, think time, duration and the API's own
         counters.
      7. **Run the stress load** (more users, no think time) to find where the requirements stop holding.
      8. **Analyse with the same rules.** Drop the warm-up from JMeter samples; use `--reset-stats` or the equivalent in
         Locust; judge each requirement; compare the tools.
      9. **Reconcile with the API.** Requests per tool against the API's request count; any status that is not expected.
      10. **Write the report.** Verdict, evidence, agreement and caveats. If the call is `inconclusive`, say what would make
          it a pass or a fail and run that.

  - id: example
    kind: example
    concepts: [perf-cap-plan, perf-cap-script, perf-cap-report]
    title: Worked example - the engagement from plan to report
    body: |
      The runs and the numbers are real (21 November 2026, 14 CPUs, everything on one machine); the framing - a
      product owner's question and a reviewer's follow-ups - is hypothetical and invented to show the order of the
      work.

      **1. The plan.** From `pcap_plan.engagement_plan` with the mix above, 8 workers, a target of 60 requests per second
      and a think time of 0.3 s, then the same with a target of 180:

      ```text
      60 {'mean_service_ms': 37.0, 'ceiling_rps': 216.216, 'utilisation': 0.28, 'users': 21, 'run_seconds': 39, 'rarest': 'GET /v1/reports/settlement', 'warnings': [], 'ok': True}
         rates {'POST /v1/payments': 24.0, 'GET /v1/payments': 18.0, 'GET /v1/payments/{id}': 15.0, 'GET /v1/reports/settlement': 3.0}
      180 {'mean_service_ms': 37.0, 'ceiling_rps': 216.216, 'utilisation': 0.83, 'users': 61, 'run_seconds': 17, 'rarest': 'GET /v1/reports/settlement', 'warnings': ['utilisation 83% is above 70%: the target sits too close to the ceiling of 216 req/s for a clean pass/fail'], 'ok': False}
      plain mean of the four service times: 70.0
      ```

      The plain mean (70 ms) is not the weighted mean (37 ms); the plan uses the weighted one.

      **2. The runs.** `pcap_capture.py` ran JMeter and Locust at the planned load (21 users, 0.3 s think time, 50 s) and
      Locust once with 60 users and no think time for 20 s, each against a fresh API. JMeter's 3,040 samples became
      2,720 after dropping the first 5 s. Both tools sent a mix close to the plan:

      ```text
      mix shares JMeter steady: {'POST /v1/payments': '38.7%', 'GET /v1/payments': '31.8%', 'GET /v1/payments/{id}': '24.5%', 'GET /v1/reports/settlement': '4.9%'} of 2720
      mix shares Locust: {'POST /v1/payments': '40.9%', 'GET /v1/payments': '29.4%', 'GET /v1/payments/{id}': '25.2%', 'GET /v1/reports/settlement': '4.6%'} of 2933
      ```

      **3. The verdicts at the target load.**

      ```text
      --- JMeter, target load, steady state
      POST /v1/payments            latency  target   120  observed    51  n=1053  pass         achieved 23.9 req/s
      GET /v1/payments             latency  target    80  observed    27  n=866   pass         achieved 19.7 req/s
      GET /v1/payments/{id}        latency  target    80  observed    26  n=667   pass         achieved 15.2 req/s
      GET /v1/reports/settlement   latency  target   400  observed   249  n=134   pass         achieved 3.1 req/s
      POST /v1/payments            errors   target     1  observed     0  n=1053  pass         achieved 23.9 req/s
      --- Locust, target load
      POST /v1/payments            latency  target   120  observed    53  n=1199  pass         achieved 25.2 req/s
      GET /v1/payments             latency  target    80  observed    29  n=861   pass         achieved 18.1 req/s
      GET /v1/payments/{id}        latency  target    80  observed    28  n=739   pass         achieved 15.5 req/s
      GET /v1/reports/settlement   latency  target   400  observed   250  n=134   pass         achieved 2.9 req/s
      POST /v1/payments            errors   target     1  observed     0  n=1199  pass         achieved 25.2 req/s
      agreement: {('GET /v1/payments', 'latency'): 'agree', ('GET /v1/payments/{id}', 'latency'): 'agree', ('GET /v1/reports/settlement', 'latency'): 'agree', ('POST /v1/payments', 'errors'): 'agree', ('POST /v1/payments', 'latency'): 'agree'}
      ```

      Every requirement passes in both tools and the tools agree. The report's p95 is 249 ms in JMeter and 250 in Locust:
      Locust's rounding to two significant digits, as predicted. Read one detail before celebrating: the report in
      Locust ran at 2.9 requests per second against the required 3, which is above the 90 % the evaluator demands (2.7), so the
      verdict is a pass - but only just, and a run 10 % slower would have been inconclusive.

      **4. The stress run.** Sixty users with no think time:

      ```text
      --- Locust, stress (60 users, no think time)
      POST /v1/payments            latency  target   120  observed   460  n=1615  fail         achieved 86.7 req/s
      GET /v1/payments             latency  target    80  observed   450  n=1160  fail         achieved 62.3 req/s
      GET /v1/payments/{id}        latency  target    80  observed   430  n=1011  fail         achieved 54.3 req/s
      GET /v1/reports/settlement   latency  target   400  observed   620  n=186   fail         achieved 10.0 req/s
      POST /v1/payments            errors   target     1  observed     0  n=1615  pass         achieved 86.7 req/s
      stress: total 213.3 req/s from 60 users with no think time -> N/X = 281 ms per request (ceiling 216.2 req/s, 99% of it)
      ```

      The API served 213 requests per second - 99 % of the 216 the plan predicted - and every request waited about 281 ms
      (Little's law, `N / X`, with no think time). The latency requirements fail; the error requirement still passes,
      because the API queues instead of refusing (its queue limit is 1,000). Comparing this run with the target-load
      JMeter run gives `differ` on every latency requirement and `agree` on the errors: the comparison is meant for two
      runs of the same load, and the report says so.

      **5. The calls and the report.**

      ```text
      final calls: pass fail inconclusive
      ```

      The three calls are, in order: JMeter and Locust at the target load (pass); Locust at stress alone (fail); and the
      same target-load pair with `min_samples=200`, which makes every transaction short of samples (inconclusive). The
      report for the first one starts like this:

      ```text
      # SandPay API - settlement-day load test

      ## Verdict

      **PASS** - every requirement met in every tool at the stated load

      ## Plan

      - Target: 60 req/s with 21 users
      - API ceiling: 216 req/s (utilisation 28%)
      - Run length: at least 39 s
      ```

      followed by the ten-row evidence table, the agreement list and four caveats: one machine for everything and
      optimistic times, Locust's rounding, the closed loop with a think time (a slow API lowers the request rate instead
      of queueing arrivals), and that the service times are configured, not measured. The stress report starts
      `**FAIL** - failed: POST /v1/payments (Locust stress), GET /v1/payments (Locust stress), ...`.

      **6. What the engagement can claim.** At 60 requests per second, 28 % of the API's ceiling, every requirement holds in
      both tools. At the ceiling none of the latency requirements hold. Where between the two the requirement for the
      report starts to fail is **not** known from these runs - a step load would find it - and the report says that.

  - id: tests
    kind: tests
    concepts: [perf-cap-plan, perf-cap-script, perf-cap-report]
    title: How the exercises are tested
    body: |
      Three files under `practice/perf/tests/capstone/` check your three modules.

      - '`test_pcap_plan.py` - rates split by weight, the weighted mean against the plain one, the ceiling, `run_seconds`
        with and without a warm-up, the whole plan at 60 and at 180 requests per second (utilisation, users, warning),
        more think time needing more users, and bad input rejected.'
      - '`test_pcap_locustfile.py` - **one real Locust run** of your file (12 users, 0.05 s think time, six seconds) against
        the practice API: exactly the six request names, one sign-in and one setup read per user, no failures, and a mix
        within wide bounds of 40/30/25/5.'
      - '`test_pcap_report.py` - on the **real captured runs** in `support/pcap_data/` and on small synthetic cases:
        `steady_samples` with epoch and rebased times, `locust_percentile` including the numeric sort, `locust_verdicts`
        for the target run (all pass), the stress run (latency fails, errors pass), too few samples, a missing
        transaction, a load not reached and a load in users, `compare_tools` for every agreement rule, `final_call` for a
        table of cases, and `render_report` for the headings, the verdict wording and the missing-caveats refusal.'

      The tests check **behaviour and counts, never absolute response times**: the captured runs are fixed files, so the
      report tests are deterministic, and the one live run asserts names, counts and wide proportions.

      Run them as the CI does: `PERF_TARGET=solutions .venv/bin/python -m pytest tests/capstone/test_pcap_*.py -q` passes (66 tests);
      against the unsolved exercises each file fails. The JMeter plan and the capture script are not tested here; they
      produced the data, and `.venv/bin/python support/pcap_capture.py` regenerates it (about two minutes).

  - id: mistakes
    kind: mistakes
    concepts: [perf-cap-plan, perf-cap-script, perf-cap-report]
    title: Mistakes to avoid
    body: |
      - **Averaging the service times.** The ceiling needs the mix-weighted mean; a plain average of four service times
        was 70 ms where the weighted one was 37.
      - **Rounding the users down.** `20.2` users means 21; 20 users would produce about 58 requests per second and a
        requirement "at 3 req/s" for the report could slip below its 90 % mark.
      - **Requirements with no load.** "p95 under 400 ms" holds at one request per second; the requirement and its load
        are one sentence.
      - **Passing a short run.** A requirement judged on 40 samples is `inconclusive`. Plan the run length from the
        rarest transaction, not the busiest.
      - **Two scripts that are not the same workload.** Different weights, a think time in one tool, names that do not
        match. Use the checklist and compare the mix shares in the first smoke test.
      - **Reading Locust's p95 as exact.** It is rounded to two significant digits and counts failed requests too.
      - **Comparing runs of different loads.** The stress run and the target run disagree by design; the comparison is for
        two runs of the same load.
      - **A report with only the verdict.** The reader needs the evidence, the load it was reached at and what was not
        measured - the caveats are part of the result.
      - **Letting "pass" mean "nothing failed".** Missing, short or contradicted results are not passes.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [perf-cap-plan, perf-cap-script, perf-cap-report]
    title: Trade-offs
    body: |
      - **Closed loop or open arrivals.** A closed loop with a think time (this lesson) is easy and realistic for
        logged-in users, but a slow API lowers the request rate instead of queueing arrivals, which can flatter the
        result. An arrival-rate model (JMeter's throughput timers, Locust's `constant_throughput`, or an open model)
        keeps the rate fixed. The report states which one it used.
      - **Two tools or one.** Two scripts cross-check the measurement and the tools' own overhead; they double the
        maintenance and invite "which one is right". Use two for the headline run and one for routine ones.
      - **Exact samples or histograms.** JMeter's raw rows allow any analysis; Locust's totals are compact and rounded.
        Know which you have before you quote a percentile.
      - **How near the ceiling.** A target at 28 % of the ceiling gives a clean pass or fail on latency but says little
        about headroom; one at 85 % mostly measures queueing. Run both: a target-load run for the requirements and a
        stress run for the limit.
      - **Statistical weight against time.** 134 report samples are enough to read a p95 of a pass-or-fail kind and not
        enough to see a 5 % change; a longer run costs time and gives more samples for the rarest transaction.
      - **Realistic against reproducible.** Production-shaped mixes and data give relevant numbers; seeded practice data
        gives numbers anyone can reproduce. The capstone chooses the second and says so.

  - id: summary
    kind: summary
    concepts: [perf-cap-plan, perf-cap-script, perf-cap-report]
    title: Summary
    body: |
      - An engagement is five stages - plan, script, run, analyse, report - and the failures sit between them. The
        deliverable is a sentence the evidence supports, not a pile of charts.
      - The plan is arithmetic: rates by weight, the ceiling as workers over the mix-weighted mean service time (216 requests
        per second here), utilisation (28 % at the target), users from Little's law (21), and a run length from the
        rarest transaction (39 s, run for 50).
      - Requirements carry a load (`at 24 req/s`); a run that does not reach 90 % of it gives `inconclusive`, never a pass.
      - Two tools are two spellings of one workload only if the mix, think time, sign-in, names, headers and keys match.
        The remaining differences - a random mix, Locust's rounding and failed requests in its histogram, the warm-up -
        go in the caveats.
      - Judge both tools with the same rules, compare them requirement by requirement, and let disagreement stop a pass.
        In the runs shown, JMeter and Locust agreed at the target load (p95 of the report 249 against 250 ms).
      - The call is `fail` if anything fails, `pass` only if every tool has verdicts, all pass and the tools agree, and
        `inconclusive` otherwise. A report carries the verdict, the evidence, the plan and the caveats, and cannot be
        written without caveats.
      - A target-load run proves the requirements at that load; a stress run shows where they stop holding. At 60 users with
        no think time the API served 213 requests per second, 99 % of the predicted ceiling, and every latency
        requirement failed.

exercises:
  - id: cap-mcq-ceiling
    type: mcq
    concept: perf-cap-plan
    skill: application
    title: The ceiling of the mix
    prompt: |
      The practice API has 8 workers. In the mix the service times are 40 ms for 8 parts in 20, 20 ms for 6, 20 ms for 5
      and 200 ms for 1. Which ceiling should the plan use?
    options:
      - id: weighted
        text: About 216 requests per second - workers divided by the mix-weighted mean service time of 37 ms.
        feedback: Correct - the report is one request in twenty, so it counts one twentieth of the mean.
      - id: plain
        text: About 114 requests per second - workers divided by the plain average of the four service times, 70 ms.
        feedback: That treats the settlement report as a quarter of the traffic, but it is 5 % of it.
      - id: fastest
        text: 400 requests per second - workers divided by the fastest service time, 20 ms.
        feedback: The ceiling has to hold for the mix actually sent, including the slow requests.
      - id: workers
        text: 8 requests per second - one per worker.
        feedback: A worker serves many requests a second; the number is workers over the service time.
    correct: [weighted]
    hints:
      - Weight each service time by how often the transaction occurs.
    solution: |
      (8*40 + 6*20 + 5*20 + 1*200) / 20 = 37 ms; 8 / 0.037 = 216 requests per second.

  - id: cap-mcq-users
    type: mcq
    concept: perf-cap-plan
    skill: application
    title: How many users?
    prompt: |
      The target is 60 requests per second, the mean response time is 37 ms and each user thinks for 0.3 s between
      transactions. How many users does the closed loop need?
    options:
      - id: twentyone
        text: 21 - 60 * (0.037 + 0.3) = 20.2, rounded up.
        feedback: Correct - a fraction of a user cannot run, and rounding down would miss the load.
      - id: eighteen
        text: 18 - 60 * 0.3, because only the think time matters.
        feedback: Each user is also busy for the response time of every request.
      - id: twenty
        text: 20 - the same figure rounded down.
        feedback: 20 users give about 58 requests per second, short of the target, and the rarest transaction slips toward its 90 % mark.
      - id: sixty
        text: 60 - one user per request per second.
        feedback: That is the figure for a user who takes one second per iteration; these users take about 0.34 s.
    correct: [twentyone]
    hints:
      - Little's law - users = rate times (response time plus think time).
    solution: |
      N = X * (R + Z) = 60 * 0.337 = 20.2, so 21 users.

  - id: cap-mcq-length
    type: mcq
    concept: perf-cap-plan
    skill: application
    title: How long to run?
    prompt: |
      The rarest transaction is the report at 3 requests per second. You want at least 100 samples of it after dropping a
      5-second warm-up. What is the shortest run length?
    options:
      - id: thirtynine
        text: 39 seconds - ceil(100 / 3 + 5).
        feedback: Correct - 33.3 seconds of samples plus the warm-up, rounded up.
      - id: thirtyfour
        text: 34 seconds - 100 / 3 rounded up.
        feedback: That forgets the warm-up that the analysis drops.
      - id: five
        text: 5 seconds - once the warm-up is over the steady state is reached.
        feedback: The warm-up is dropped from the run; it does not shorten what you still need after it.
      - id: hundred
        text: 100 seconds - one second per sample.
        feedback: The report arrives three times a second, not once.
    correct: [thirtynine]
    hints:
      - Samples needed divided by the rate, plus the warm-up.
    solution: |
      100 / 3 = 33.3, plus 5, rounded up is 39 seconds. The runs used 50 seconds as a margin.

  - id: cap-mcq-utilisation
    type: mcq
    concept: perf-cap-plan
    skill: analysis
    title: A target close to the ceiling
    prompt: |
      A colleague proposes a target of 180 requests per second against the same API (ceiling about 216). What should the plan
      say?
    options:
      - id: warn
        text: Utilisation is 83 %, above the 70 % the plan allows; at that load a percentile mostly measures queueing, so move the target or call the run a capacity test.
        feedback: Correct - near the ceiling pass or fail depends on small changes in the load.
      - id: fine
        text: It is fine - the API is below its ceiling, so every requirement will pass.
        feedback: Below the ceiling is not the same as far below it; queueing grows quickly as utilisation rises.
      - id: refuse
        text: Refuse - a load test must never exceed 50 % of the ceiling.
        feedback: The 70 % figure is this plan's threshold, not a law; the point is to say what the run can and cannot answer.
      - id: more
        text: Add workers in the plan until utilisation is 28 % again.
        feedback: That changes the system under test instead of describing the load.
    correct: [warn]
    hints:
      - What does latency look like when 83 % of the workers are always busy?
    solution: |
      Utilisation 83 % gives a warning; move the target or label the run a capacity test.

  - id: cap-mcq-requirement
    type: mcq
    concept: perf-cap-plan
    skill: analysis
    title: Which requirement can a run prove?
    prompt: |
      Which of these requirements can the evaluator judge, and say "inconclusive" for when the load is not reached?
    options:
      - id: full
        text: "p95 of GET /v1/reports/settlement < 400 ms at 3 req/s"
        feedback: Correct - transaction, percentile, threshold and a load.
      - id: average
        text: "The average response time of GET /v1/reports/settlement is below 400 ms at 3 req/s"
        feedback: An average hides the tail; state a percentile.
      - id: noload
        text: "p95 of GET /v1/reports/settlement < 400 ms"
        feedback: Without a load the requirement holds at one request an hour; the evaluator rejects it as having no load.
      - id: fast
        text: "GET /v1/reports/settlement should be fast at 3 req/s"
        feedback: '"Fast" has no number or percentile.'
    correct: [full]
    hints:
      - Transaction, percentile, threshold, load.
    solution: |
      Only the first has all four parts.

  - id: cap-mcq-think
    type: mcq
    concept: perf-cap-script
    skill: application
    title: The same think time in both tools
    prompt: |
      The Locust file uses `wait_time = constant(0.3)`. Which JMeter element gives the same think time per transaction?
    options:
      - id: constant
        text: A Constant Timer of 300 ms, placed in the per-iteration controller so the sign-in is not delayed.
        feedback: Correct - it pauses each thread for the same time between requests.
      - id: throughput
        text: A Constant Throughput Timer set to 60 per second.
        feedback: That fixes the rate and makes the loop open-ish; the Locust file is a closed loop with a think time.
      - id: rampup
        text: The ramp-up time of the thread group.
        feedback: Ramp-up spreads the thread start times; it does not pause between requests.
      - id: none
        text: Nothing - JMeter threads wait for the response, which is the same thing.
        feedback: Waiting for the response is the response time; the think time is extra.
    correct: [constant]
    hints:
      - The documentation sentence starts "If you want to have each thread pause for the same amount of time".
    solution: |
      A Constant Timer with 300 ms, inside the controller that holds the per-iteration transactions.

  - id: cap-mcq-names
    type: mcq
    concept: perf-cap-script
    skill: analysis
    title: Why one name for every payment id
    prompt: |
      A teammate removes `name="GET /v1/payments/{id}"` from the Locust file. The run works. What goes wrong in the analysis?
    options:
      - id: rows
        text: Locust records a separate row for every payment id, so no row has the transaction's name and the requirement and the JMeter comparison find nothing.
        feedback: Correct - requests are grouped by their name, and the analysis joins the tools on it.
      - id: slow
        text: The requests become slower because Locust must build a longer name.
        feedback: The name is only a label; it does not change the request.
      - id: fail
        text: The requests fail with a 404.
        feedback: The URL is unchanged; only the statistics key differs.
      - id: nothing
        text: Nothing - Locust picks a sensible name on its own.
        feedback: By default the name is the URL path, which here holds the payment id.
    correct: [rows]
    hints:
      - The documentation example groups `/blog?id=%i` under one name.
    solution: |
      One row per id; the requirement for GET /v1/payments/{id} would be judged on no samples.

  - id: cap-mcq-shares
    type: mcq
    concept: perf-cap-script
    skill: analysis
    title: The mix is not exactly 40/30/25/5
    prompt: |
      The first smoke test shows these shares of the four transactions - JMeter 38.7, 31.8, 24.5 and 4.9 %, Locust 40.9,
      29.4, 25.2 and 4.6 %. The plan says 40, 30, 25 and 5. What is the right reading?
    options:
      - id: random
        text: Both tools pick the transaction at random, so the shares land near the plan with some spread; the script is right, and the report lists the random mix as a caveat.
        feedback: Correct - a few points of difference over about 2,700 requests is what a random draw gives.
      - id: bug
        text: Both scripts are wrong and must be fixed until the shares are exact.
        feedback: A random draw does not produce exact shares; only a fixed cycle would.
      - id: tool
        text: JMeter is the better tool because its shares are closer to the plan on the large transactions.
        feedback: Shares near the plan do not rank tools; the spread is random.
      - id: ignore
        text: The shares do not matter as long as the total rate is right.
        feedback: The rare transaction's rate decides whether its requirement can be judged.
    correct: [random]
    hints:
      - How does each tool choose the next transaction?
    solution: |
      Random draw; a few points of spread is expected; note it in the caveats.

  - id: cap-mcq-rounding
    type: mcq
    concept: perf-cap-report
    skill: analysis
    title: 247 against 250
    prompt: |
      The p95 of the settlement report is 249 ms in JMeter and 250 ms in Locust. A reviewer says "the tools disagree".
      Which answer is right?
    options:
      - id: agree
        text: They agree - Locust rounds response times to two significant digits (147 becomes 150), and the comparison allows 10 ms or 30 % of the smaller value.
        feedback: Correct - the slack is there for rounding and ordinary run-to-run noise.
      - id: differ
        text: They differ, so the call must be inconclusive until the tools match exactly.
        feedback: Exact equality between two tools never happens.
      - id: jmeter
        text: JMeter is right and Locust is wrong, because Locust's value is rounded.
        feedback: Both are right to the precision they keep.
      - id: failures
        text: The difference is caused by failed requests, which Locust leaves out of its histogram.
        feedback: Locust's histogram includes failed requests; and there were none in this run.
    correct: [agree]
    hints:
      - Look at how Locust stores response times.
    solution: |
      Rounding to two significant digits explains it; compare_tools allows max(10 ms, 30 % of the smaller).

  - id: cap-mcq-load-reached
    type: mcq
    concept: perf-cap-report
    skill: analysis
    title: Latency is fine but the load was not reached
    prompt: |
      A requirement says "p95 of GET /v1/reports/settlement < 400 ms at 3 req/s". In a run the p95 is 120 ms but the report
      was requested only 2 times a second. What is the verdict?
    options:
      - id: inconclusive
        text: Inconclusive - 2 is below 90 % of 3 (2.7), so the run did not reach the load the requirement names.
        feedback: Correct - a good latency at a lower load proves nothing about the stated load.
      - id: pass
        text: Pass - 120 ms is far below 400 ms.
        feedback: The requirement is about 3 requests a second; at 2 the API had an easier job.
      - id: fail
        text: Fail - the load was not reached, so the test failed.
        feedback: A missed load makes the test unable to judge; the API did not fail the requirement.
      - id: warn
        text: Pass with a warning in the notes.
        feedback: A pass over a missed load is exactly what the rule prevents.
    correct: [inconclusive]
    hints:
      - Compare the achieved rate with 90 % of the stated load.
    solution: |
      Inconclusive; the 90 % mark is 2.7 requests per second.

  - id: cap-mcq-call
    type: mcq
    concept: perf-cap-report
    skill: analysis
    title: One call from two tools
    prompt: |
      JMeter passes all five requirements. Locust also passes all five. But the observed p95 of POST /v1/payments is 50 ms in
      JMeter and 130 ms in Locust, from the same plan. What should the report's verdict be?
    options:
      - id: inconclusive
        text: Inconclusive - every verdict passes, but the tools contradict each other (130 is not within 10 ms or 30 % of 50), so the measurement itself needs explaining.
        feedback: Correct - two tools that disagree this much say the scripts or the environment differ, not that the API is fine.
      - id: pass
        text: Pass - every verdict passes in both tools.
        feedback: The disagreement is a finding; passing over it hides a problem with the measurement.
      - id: fail
        text: Fail - take the worse of the two.
        feedback: Neither tool failed a requirement; the problem is that they disagree.
      - id: average
        text: Pass - average the two p95 values.
        feedback: Averaging two percentiles from different tools is not a percentile of anything.
    correct: [inconclusive]
    hints:
      - What does compare_tools return for that pair?
    solution: |
      compare_tools gives differ, so final_call is inconclusive.

  - id: cap-order-engagement
    type: order
    concept: perf-cap-plan
    skill: application
    title: The order of an engagement
    prompt: Put the stages of a load test engagement in a sensible order.
    items:
      - id: sentence
        text: Write the sentence you need to support and the requirements, each with a load
      - id: model
        text: Model the workload - the mix, the think time, the identities
      - id: arithmetic
        text: Do the plan arithmetic - rates, ceiling, utilisation, users, run length
      - id: script
        text: Script the workload and smoke-test the mix and the status codes
      - id: run
        text: Run the target load, then a stress load, against fresh targets
      - id: analyse
        text: Judge with the same rules, drop the warm-up and compare the tools
      - id: report
        text: Write the report with the verdict, the evidence and the caveats
    hints:
      - Decide what to prove, plan the load, script, run, judge, report.
    solution: |
      Sentence and requirements, workload model, plan arithmetic, script and smoke test, runs, analysis, report.

  - id: cap-debug-final
    type: debug
    concept: perf-cap-report
    skill: analysis
    title: The call that cannot say inconclusive
    prompt: |
      This function reduces the verdicts to one call. After a run where the Locust run crashed and left no results, the report
      says PASS. Which line is the defect?
    language: python
    code: |
      def final_call(by_tool):
          verdicts = [v for vs in by_tool.values() for v in vs]
          if any(v.status == "fail" for v in verdicts):
              return "fail"
          if all(v.status == "pass" for v in verdicts):
              return "pass"
          return "inconclusive"
    correctLines: [5]
    lineNotes:
      - line: 2
        note: Flattening the verdicts of every tool is right; the defect is what the test does with an empty tool.
      - line: 3
        note: A failure anywhere fails the engagement, which is the right rule.
      - line: 7
        note: Falling back to inconclusive is right; the problem is that the line above lets a missing tool through.
    hints:
      - What does all() return for a tool that contributed no verdicts?
    solution: |
      Line 5 - the all() of an empty list is True, so a tool with no results does not stop a pass. Check that every tool has
      verdicts before saying pass.

  - id: cap-short-stress
    type: short
    concept: perf-cap-report
    skill: analysis
    title: Why run both the target load and a stress load?
    prompt: |
      A stakeholder says "the target-load run passed everything, so skip the stress run to save a day". Give two reasons to
      keep it.
    modelAnswer: |
      The target-load run shows the requirements hold at the planned load, which was 28 % of the API's estimated ceiling, so it
      says nothing about how close the limit is: "it holds at 60 requests per second" does not support "it holds settlement
      day" if settlement day could be three times that. The stress run is the evidence of where the requirements stop holding -
      here the API served 213 requests per second, matching the plan's ceiling of 216, and every latency requirement failed. It
      also checks the plan's own arithmetic: if the stress run reached 120 requests per second instead, the ceiling estimate (and
      so the utilisation claim) was wrong, and the target-load verdict rests on a false picture of headroom.
    rubric:
      - Says the target-load run only proves the requirements at that load.
      - Says the stress run shows where the limit is and what fails first.
      - Says it checks the ceiling estimate in the plan.
    hints:
      - What would you tell the stakeholder about settlement day if volume doubled?
    solution: |
      The target run proves one load; the stress run finds the limit and checks the plan's ceiling.

  - id: cap-testdesign-verdicts
    type: testdesign
    concept: perf-cap-report
    skill: application
    title: Test the judging code before a gate trusts it
    prompt: |
      A CI step will use `locust_verdicts`, `compare_tools` and `final_call` to decide whether a release goes ahead. Design test
      cases for them.
    modelAnswer: |
      Preconditions: Locust `--json-file` entries built by hand and the captured runs.

      1. **Clean run** - the target-load totals. Expected: every verdict `pass`, notes saying the rate achieved. Evidence: the
         returned verdicts.
      2. **Latency above the threshold** - the stress totals. Expected: `fail`, the observed percentile from the histogram.
      3. **Too few samples and a transaction that never ran** - expected `inconclusive`, `observed` None, note "only N samples".
      4. **Load not reached** - a requirement at a higher load than the run produced. Expected `inconclusive`, observed still
         filled in, note starting "load not reached".
      5. **Load stated in users** - expected `inconclusive`; Locust totals cannot show users.
      6. **Histogram edge cases** - percentile exactly at a bucket boundary, keys that sort differently as text and as numbers,
         an empty histogram, a percentile of 0 or above 100. Expected: nearest rank, numeric sort, `ValueError`.
      7. **Agreement boundaries** - a gap of exactly 10 ms, of 11 ms, exactly 30 % and just above, same values with different
         statuses, a value missing in one tool. Expected: `agree`, `differ`, `not-comparable`.
      8. **The call** - a failure in either tool, an inconclusive verdict, a tool with an empty list, a `differ` entry, and a
         `not-comparable` entry that must not block a pass. Expected: fail, inconclusive, inconclusive, inconclusive, pass.
    rubric:
      - Each case has preconditions, input, expected result and evidence.
      - Covers pass, fail and the three reasons for inconclusive.
      - Covers histogram and agreement boundaries.
      - Covers an empty tool and a disagreement in the final call.
    hints:
      - Which cases could let a broken gate pass silently?
    solution: |
      Clean, fail, short, load not reached, users, boundaries, agreement, and the call with an empty tool.

  - id: cap-interview-engagement
    type: interview
    concept: perf-cap-plan
    skill: analysis
    title: 'Interview: walk me through a load test you ran'
    prompt: |
      "Walk me through a load test engagement from the request to the report. What did you decide before you ran anything and how
      did you know the result could be trusted?"
    modelAnswer: |
      I start with the sentence the result must support - for example "at settlement-day load every transaction meets its p95" -
      and write requirements in a testable form: transaction, percentile, threshold and the load it applies to. Then I model
      the workload - a mix with weights, a think time, a number of identities - and do the plan arithmetic before a tool runs:
      per-transaction rates from the mix, the ceiling as workers over the mix-weighted mean service time, utilisation, the users
      a closed loop needs from Little's law, and a run length set by the rarest transaction so it has enough samples. I script
      it once and smoke-test the mix and the status codes, and if the number will be quoted I script it in a second tool with a
      checklist - same mix, think time, sign-in, names, keys. I run the target load, then a stress load to find where it stops
      holding. I judge both tools with the same rules after dropping the warm-up, compare them requirement by requirement and let
      disagreement stop a pass. The verdict is pass only if everything passes; short runs, missed loads and contradictions are
      inconclusive. The report carries the evidence and the caveats - one machine, rounded Locust times, closed loop - and says
      what was not measured.
    rubric:
      - Starts from the claim and testable requirements.
      - Plan arithmetic - rates, ceiling, users, run length.
      - Scripts and checks the workload, with a second tool as a cross-check.
      - Same rules for both tools, comparison and honest verdicts.
      - Report with evidence and caveats; target and stress runs.
    hints:
      - Start with the sentence, end with the caveats.
    solution: |
      Claim and requirements, plan arithmetic, script and cross-check, target and stress runs, same-rule verdicts, an honest report.

  - id: cap-plan-code
    type: coding
    concept: perf-cap-plan
    skill: application
    title: Plan the load
    prompt: |
      Implement `transaction_rates`, `mean_service_ms`, `ceiling_rps`, `run_seconds` and `engagement_plan` in
      `exercises/capstone/pcap_plan.py`. The tests check the plan at 60 and at 180 requests per second.
    project: perf
    files: [exercises/capstone/pcap_plan.py]
    test: tests/capstone/test_pcap_plan.py
    command: .venv/bin/python -m pytest tests/capstone/test_pcap_plan.py
    modelAnswer: |
      See "The plan in Python". Rates split the total by weight, the mean is weighted by the mix, the ceiling is workers over the
      mean in seconds, the run length is the rarest transaction's samples over its rate plus the warm-up, and the plan reuses
      `ref.users_needed`.
    rubric:
      - Every test in tests/capstone/test_pcap_plan.py passes.
      - Weights the mean service time by the mix.
      - Rounds users and run length up.
      - Warns above the utilisation limit and rejects bad input.
    hints:
      - The ceiling is workers divided by the mean service time in seconds.
      - Use `ref.users_needed(target_rps, mean / 1000, think_s)` for the users.
      - The rarest transaction is the one with the smallest rate.
    solution: |
      Five small functions; the care goes into the weighted mean and the rounding up.

  - id: cap-locust-code
    type: coding
    concept: perf-cap-script
    skill: application
    title: The workload in Locust
    prompt: |
      Complete `exercises/capstone/pcap_locustfile.py`: sign in once, read the setup page, then four weighted tasks with
      the exact request names. The test runs it with real Locust against the practice API.
    project: perf
    files: [exercises/capstone/pcap_locustfile.py]
    test: tests/capstone/test_pcap_locustfile.py
    command: .venv/bin/python -m pytest tests/capstone/test_pcap_locustfile.py
    modelAnswer: |
      See "The workload in Locust". `on_start` signs in as merchant N (cycling 1 to 3), sets the bearer header and reads the setup
      page; four `@task` methods carry the weights 8, 6, 5 and 1 and the six request names; payments use a fresh
      `Idempotency-Key`.
    rubric:
      - Every test in tests/capstone/test_pcap_locustfile.py passes.
      - Signs in once and reads the setup page once per user.
      - Uses exactly the six request names, one name for every payment id.
      - Sends a fresh Idempotency-Key per payment and follows the 8/6/5/1 weights.
    hints:
      - '`name=` goes on every request, including the sign-in and the setup read.'
      - Keep the ids from the setup page on `self`.
      - The weights are the argument of `@task`.
    solution: |
      One `on_start` and four tasks; the care goes into the names and the key.

  - id: cap-report-code
    type: coding
    concept: perf-cap-report
    skill: application
    title: Judge, compare and report
    prompt: |
      Implement `steady_samples`, `locust_percentile`, `locust_verdicts`, `compare_tools`, `final_call` and `render_report` in
      `exercises/capstone/pcap_report.py`. The tests run on the real captured runs and on small synthetic cases.
    project: perf
    files: [exercises/capstone/pcap_report.py]
    test: tests/capstone/test_pcap_report.py
    command: .venv/bin/python -m pytest tests/capstone/test_pcap_report.py
    modelAnswer: |
      See "The analysis in Python". The percentile sorts the histogram numerically and stops at the nearest rank; the verdicts
      apply the SLO rules to Locust totals (samples, load reached, then pass or fail); the comparison allows the slack; the call
      is fail, then inconclusive, then pass; the report refuses to be written without caveats.
    rubric:
      - Every test in tests/capstone/test_pcap_report.py passes.
      - Sorts histogram keys as numbers and uses the nearest rank.
      - Gives inconclusive for too few samples, a load not reached and a load in users.
      - Never says pass over a failure, an empty tool or a disagreement.
    hints:
      - Convert histogram keys with `int()` before sorting.
      - The 90 % load rule is `rate < 0.9 * req.load`.
      - '`final_call` checks for a failure first, then for anything that is not a clean pass.'
    solution: |
      Six functions; the care goes into the numeric sort, the rate span and the order of the checks in the call.

placement:
  - id: cap-place-plan
    type: mcq
    concept: perf-cap-plan
    skill: application
    title: Users for a closed loop
    prompt: A closed-loop test must produce 100 requests per second. The mean response time is 50 ms and the think time 0.45 s. How many users does it need?
    options:
      - id: fifty
        text: 50 - 100 * (0.05 + 0.45).
        feedback: Correct - Little's law, users = rate times (response time plus think time).
      - id: forty-five
        text: 45 - only the think time counts.
        feedback: The response time is time each user also spends in the system.
      - id: five
        text: 5 - the response time alone.
        feedback: That ignores the think time.
    correct: [fifty]
    hints:
      - N = X * (R + Z).
    solution: |
      100 * 0.5 = 50 users.

  - id: cap-place-script
    type: mcq
    concept: perf-cap-script
    skill: application
    title: Two scripts, one workload
    prompt: JMeter and Locust report p95 values that differ by a factor of two for the same plan. What do you check first?
    options:
      - id: workload
        text: Whether the scripts are the same workload - the mix, the think time, the sign-in, the request names and the keys - before blaming either tool.
        feedback: Correct - most disagreements are two different workloads.
      - id: tool
        text: Which tool is faster, then use only that one.
        feedback: That hides a difference you do not understand.
      - id: average
        text: Average the two results.
        feedback: An average of two different measurements is not a measurement.
    correct: [workload]
    hints:
      - What would make two scripts send different traffic?
    solution: |
      Compare the workloads first.

  - id: cap-place-report
    type: mcq
    concept: perf-cap-report
    skill: analysis
    title: A report for a short run
    prompt: A requirement was judged on 40 samples and its p95 is within the threshold. What does the report say?
    options:
      - id: inconclusive
        text: Inconclusive - 40 samples are fewer than the minimum, so the run cannot support a verdict; run longer.
        feedback: Correct - a percentile from a handful of samples is not evidence.
      - id: pass
        text: Pass - the number is inside the threshold.
        feedback: A pass needs enough samples and the load reached.
      - id: fail
        text: Fail - there were too few samples.
        feedback: Too few samples means unable to judge, not a failure of the API.
    correct: [inconclusive]
    hints:
      - What does the evaluator do below the minimum number of samples?
    solution: |
      Inconclusive; plan the run length from the rarest transaction.

recall:
  - id: cap-recall-ceiling
    concept: perf-cap-plan
    prompt: How do you estimate the ceiling of a mixed workload?
    answer: Workers divided by the mix-weighted mean service time. Here (8*40 + 6*20 + 5*20 + 1*200) / 20 = 37 ms and 8 / 0.037 = 216 requests per second; a plain average (70 ms) would give 114.
  - id: cap-recall-users
    concept: perf-cap-plan
    prompt: How many users does a closed loop need, and how long must it run?
    answer: Users = rate times (response time plus think time), rounded up - 21 for 60 requests per second with a 37 ms response and 0.3 s think time. Run length = the rarest transaction's samples needed divided by its rate, plus the warm-up - 39 s for 100 report samples at 3 per second.
  - id: cap-recall-requirement
    concept: perf-cap-plan
    prompt: What makes a requirement testable?
    answer: A transaction, a percentile, a threshold and a load, for example "p95 of GET /v1/reports/settlement < 400 ms at 3 req/s". A run that reaches less than 90 % of the load gives inconclusive.
  - id: cap-recall-same
    concept: perf-cap-script
    prompt: When are a Locust file and a JMeter plan the same workload?
    answer: When the mix (weights), the think time, the sign-in, the headers and keys and the request names match. The random mix, Locust's rounding and the warm-up handling remain different and go in the caveats.
  - id: cap-recall-locust
    concept: perf-cap-report
    prompt: What changes when you read Locust totals instead of JMeter samples?
    answer: Response times are rounded to two significant digits (147 becomes 150), the histogram includes failed requests, the rate comes from the first and last request times, and a load stated in users cannot be checked.
  - id: cap-recall-call
    concept: perf-cap-report
    prompt: How is the single call made?
    answer: Fail if any verdict in any tool fails. Pass only if every tool has verdicts, all pass and no comparison says differ. Anything else - too few samples, a load not reached, an empty tool, contradicting tools - is inconclusive.
  - id: cap-recall-stress
    concept: perf-cap-report
    prompt: What does the stress run add to the target-load run?
    answer: It shows where the requirements stop holding and checks the plan's ceiling. With 60 users and no think time the API served 213 requests per second (99 % of the predicted 216) and every latency requirement failed.

