id: jmeter-parameterisation-and-data
title: Parameterisation - CSV data, properties and functions
subject: performance-testing
module: jmeter
level: intermediate
status: published
estimatedMinutes: 135
summary: Give every virtual user its own data and every run its own settings. Use JMeter's CSV Data Set Config to sign each SandPay merchant in exactly once, predict which rows a run will hand out in each sharing mode and at end of file, keep run settings in -J properties read with __P, and make each payment unique with __UUID. Real runs show the traps - a reused Idempotency-Key that JMeter reports as 0% errors while two thirds of the payments were never created, and a UUID in User Defined Variables that is evaluated only once.
