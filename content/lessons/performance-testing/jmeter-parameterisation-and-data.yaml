environment: |
  - **Runs:** Linux, Python 3.12.3, Apache JMeter 5.6.3 on OpenJDK 17.0.21, in CLI mode, against
    `practice/perf/support/sandpay_target.py`, the SandPay practice API on the loopback interface. All runs were
    made on 19 and 20 November 2026. Every output shown was printed by the plan or code shown; console lines keep
    their text but the 13-digit epoch-millisecond timestamps JMeter prints are replaced by `<epoch ms elided>`.
    Which thread gets which row in a shared file depends on scheduling, so your thread names will differ - the
    counts and the rules do not.
  - **SandPay is fictional.** The practice API knows clients `merchant-1` .. `merchant-50` with secrets `secret-1`
    .. `secret-50`; it answers a repeated `Idempotency-Key` (per client) with the first response plus the header
    `Idempotent-Replayed: true`. Tokens, UUIDs and payment ids are synthetic and random per run. Never point a load
    test at a system you do not own or have written permission to test.
  - **JMeter documentation, as documented on 19 November 2026 (the site covers JMeter 5.6.3):**
    [Component Reference](https://jmeter.apache.org/usermanual/component_reference.html) - CSV Data Set Config,
    User Defined Variables, User Parameters;
    [Functions and Variables](https://jmeter.apache.org/usermanual/functions.html) - sections 20.1 to 20.6 and the
    entries for `__counter`, `__threadNum`, `__Random`, `__UUID`, `__property`, `__P`, `__time` and `__V`;
    [Elements of a Test Plan](https://jmeter.apache.org/usermanual/test_plan.html), section 3.11 "Properties and
    Variables" and 3.12 "Using Variables to parameterise tests";
    [Getting Started](https://jmeter.apache.org/usermanual/get-started.html), 1.4.6 "Overriding Properties Via The
    Command Line" and the command-line options;
    [Best Practices](https://jmeter.apache.org/usermanual/best-practices.html), 16.6, 16.7, 16.11 and 16.13.
    Quotations are from those pages.
  - **Read from JMeter 5.6.3 itself, not the manual:** the `.jmx` property names of CSV Data Set Config
    (`filename`, `variableNames`, `ignoreFirstLine`, `recycle`, `stopThread`, `shareMode` with the values
    `shareMode.all`, `shareMode.group`, `shareMode.thread`) from `CSVDataSetResources.properties` in
    `lib/ext/ApacheJMeter_components.jar`, and the results-file properties
    (`jmeter.save.saveservice.output_format`, `requestHeaders`, `responseHeaders`) from `bin/jmeter.properties`.
    That `__P` can set the sharing mode, recycle and stop-thread flags was checked by running the plans, not
    taken from the manual.
  - **Idempotency keys:** the IETF HTTPAPI working group's Internet-Draft
    [The Idempotency-Key HTTP Header Field](https://datatracker.ietf.org/doc/draft-ietf-httpapi-idempotency-key-header/)
    describes the header; on 19 November 2026 the IETF datatracker listed it as an active Internet-Draft, not an
    RFC. The behaviour in this lesson is the practice API's - real
    providers differ, so check their documentation.
  - **Not repeated here:** what an Idempotency-Key is for - [Idempotency keys](#/lesson/idempotency-keys); unique
    data, warm-up and isolation in general - [Test environments and test
    data](#/lesson/performance-test-environments-and-data); extracting the token from a response -
    [Correlation and extractors in JMeter](#/lesson/jmeter-correlation-and-extractors); thread groups and loops -
    [Thread groups, ramp-up and timers](#/lesson/jmeter-thread-groups-and-timers).

prerequisites:
  - jmeter-architecture-and-test-plans
  - jmeter-correlation-and-extractors
  - performance-test-environments-and-data
  - idempotency-keys

concepts:
  - id: perf-jmdata-csv
    name: CSV Data Set Config - rows, sharing and end of file
    summary: A CSV Data Set Config reads one line per thread at the start of each iteration and splits it into variables (named by the Variable Names field, or by the file's header line when that field is empty). In the default "All threads" mode one file pointer serves every thread, so N threads x M iterations consume N*M lines; "Current thread" gives each thread its own copy from line 1. At end of file it recycles, sets every variable to <EOF>, or stops the thread, depending on Recycle and Stop thread.
  - id: perf-jmdata-vars-props
    name: Variables versus properties
    summary: JMeter variables are local to each thread - a thread changes only its own copy - while properties are global to the JMeter process. Run settings such as host, port, threads and loops belong in properties set with -J (or -G for remote servers) and read with __P or __property, so one plan serves every run. User Defined Variables are processed once, at the start, so a function placed there is evaluated once for the whole test.
  - id: perf-jmdata-functions
    name: Functions for unique and varying data
    summary: Functions such as __UUID, __Random, __counter, __threadNum and __time compute a fresh value each time the field that holds them is evaluated, so they belong in the sampler or header that needs the value. They make each request distinct - an Idempotency-Key per payment, a reference per iteration - and the run's results (with request and response headers saved) are the evidence that they did.

objectives:
  - Configure a CSV Data Set Config so each virtual user signs in with its own credentials, and choose the sharing mode, recycle and stop-thread settings a test needs.
  - Predict which rows a run reads in each sharing mode and at end of file, and how many rows a run needs.
  - Explain the difference between JMeter variables and properties, and parameterise a plan with -J properties read by __P.
  - Choose the right function for unique or varying data and place it where it is evaluated per request.
  - Prove from a saved results file that every payment request carried a unique Idempotency-Key and that none was replayed.
  - Diagnose undefined variables, <EOF> values and once-only values from labels, response codes and headers.

sections:
  - id: intuition
    kind: intuition
    concepts: [perf-jmdata-csv, perf-jmdata-vars-props, perf-jmdata-functions]
    title: The idea in plain language
    body: |
      A load test plan is a script that fifty virtual users play at once. If every one of them plays it with the
      same props - the same login, the same order number, the same idempotency key - you are not testing fifty
      merchants, you are testing one merchant fifty times. Caches answer from memory, the database touches the same
      row, and SandPay's payment API politely replays the first payment instead of creating a new one.

      **Parameterisation** gives each performance its own props. JMeter has three tools for it, and they answer
      three different questions:

      - **Who is this user?** Data you prepare in advance - credentials, card tokens, merchant ids - goes in a file.
        A **CSV Data Set Config** hands each iteration the next line, like a stack of name badges by the door.
      - **What kind of run is this?** Settings that stay the same for the whole run but change between runs - host,
        port, number of threads - are **properties**, set on the command line with `-J` and read with `__P`. One
        plan, many runs, no edits.
      - **What must be different every time?** Values that have to be fresh per request - an `Idempotency-Key`, a
        random amount, a timestamp - come from **functions** such as `__UUID` and `__Random`, evaluated where the
        request is built.

      Get them confused and the test still "passes": in the run you will see in this lesson, JMeter reports 0%
      errors while six of nine payments were never created.

  - id: what
    kind: what
    concepts: [perf-jmdata-csv, perf-jmdata-vars-props, perf-jmdata-functions]
    title: Terms you need
    body: |
      | Term | Meaning (JMeter 5.6.3) |
      | --- | --- |
      | **Variable** | A name/value pair **local to one thread**: "JMeter variables are local to each thread. ... If a variable is updated by a thread, only the thread copy of the variable is changed." Referenced as `${name}`. |
      | **Property** | A name/value pair **global to the JMeter process**: "Properties are global to jmeter ... but cannot be used for thread-specific values." Set in `user.properties` or on the command line. |
      | **`-J name=value`** | "defines a local JMeter property" on the command line. |
      | **`-G name=value`** | "defines a JMeter property to be sent to all remote servers" (distributed testing). |
      | **`__P(name, default)`** | "a simplified property function which is intended for use with properties defined on the command line"; with no default it returns `1`. |
      | **`__property(name, var, default)`** | Reads a property, optionally saving it in a variable; with no default it returns the property's *name*. |
      | **Function** | `${__name(args)}` - computed when the field is evaluated. "Each occurrence of a function call in a test plan is handled by a separate function instance." |
      | **CSV Data Set Config** | A config element that "is used to read lines from a file, and split them into variables". |
      | **Sharing mode** | Which threads share one file pointer: *All threads* (default), *Current thread group*, *Current thread*, or an *identifier*. |
      | **Recycle on EOF** | Start again at the first line at end of file (default `true`). |
      | **Stop thread on EOF** | With recycle off, stop the thread at end of file (default `false`). |
      | **`<EOF>`** | The value every variable gets at end of file when recycle and stop thread are both off. |
      | **User Defined Variables (UDV)** | Variables "processed at the start" of the test and copied to every thread. |
      | **User Parameters** | A pre-processor that sets variables per thread at run time, optionally every iteration. |

      Both variables and properties are case-sensitive, and variable references cannot be nested: `${A${N}}` does
      not work; `${__V(A${N})}` does.

  - id: why
    kind: why
    concepts: [perf-jmdata-csv, perf-jmdata-functions]
    title: Why identical data gives you a wrong answer
    body: |
      A load test is only as realistic as its data. Same-data load is easier than real load for reasons that have
      nothing to do with your code being fast:

      - **Caches and hot rows.** One merchant's payments list is served from cache after the first request; fifty
        merchants' lists are not. One database row updated by everyone becomes a lock queue instead.
      - **Business rules short-circuit the work.** SandPay's API treats a repeated `Idempotency-Key` as the *same*
        payment: it stores the first response and returns it again. A replay is a lookup, not a payment - no
        acquirer call, no ledger write.
      - **Sessions collide.** Fifty threads sharing one login share one rate limit, one session and one set of
        server-side locks - or log each other out.

      The worst part is that none of this shows up as an error. Here is the console summary of a real run in which
      every thread reused its key across 3 iterations:

      ```plaintext
      summary =     18 in 00:00:00 =   60.4/s Avg:    10 Min:     1 Max:    47 Err:     0 (0.00%)
      ```

      and here is what the saved request and response headers say about the same nine payment requests:

      ```plaintext
      reused report: {"requests": 9, "unique_keys": 3, "missing_keys": 0, "duplicates": {"order-1": 3, "order-2": 3, "order-3": 3}, "replayed": 6, "created": 3}
      ```

      Nine `201 Created` responses, **three** payments. The timings in that summary describe a lookup, not the
      payment path the requirement was about. JMeter's own guidance is to prepare the data rather than reuse it:
      "Some test plans need to use different values for different users/threads. For example, you might want to test
      a sequence that requires a unique login for each user." (Best Practices 16.6).

  - id: internals-csv
    kind: internals
    concepts: [perf-jmdata-csv]
    title: How CSV Data Set Config hands out rows
    body: |
      The rules, quoted from the component reference:

      - **When:** "Lines are read at the start of each test iteration." One line per thread per iteration, before
        the first sampler runs. "The file name and mode are resolved in the first iteration."
      - **Names:** "JMeter supports CSV files which have a header line defining the column names. To enable this,
        leave the 'Variable Names' field empty." With names filled in and the file still having a header, tick
        "Ignore first line" or the header becomes a row of data.
      - **Who shares the pointer:** "By default, the file is only opened once, and each thread will use a different
        line from the file. However the order in which lines are passed to threads depends on the order in which they
        execute, which may vary between iterations." *Current thread group*: "each file is opened once for each thread
        group in which the element appears". *Current thread*: "each file is opened separately for each thread".
      - **End of file:** "When the end of file (EOF) is reached, and the recycle option is true, reading starts again
        with the first line of the file. If the recycle option is false, and stopThread is false, then all the
        variables are set to <EOF> when the end of file is reached. ... If the Recycle option is false, and Stop
        Thread is true, then reaching EOF will cause the thread to be stopped."
      - **Short lines:** "If there are fewer values on the line than there are variables the remaining variables are
        not updated - so they will retain their previous value (if any)." A short line silently reuses the previous
        row's values.

      So the arithmetic of a shared file is simple: **N threads x M iterations read N x M lines**, in an order you
      cannot predict. With *Current thread*, every thread reads lines 1, 2, 3 ... of its own copy - which means every
      thread uses the **same** data. The manual's recipe for per-thread files is a file per thread:
      "Use the filename test${__threadNum}.csv and set the 'Sharing mode' to 'Current thread'."

      Two practical limits from the same page: "Generating unique random values at run-time is expensive in terms of
      CPU and memory, so just create the data in advance of the test", and for distributed runs "the CSV file must be
      stored on the server host system in the correct relative directory to where the JMeter server is started."

  - id: internals-vars
    kind: internals
    concepts: [perf-jmdata-vars-props, perf-jmdata-functions]
    title: When values are evaluated - variables, properties, UDVs and functions
    body: |
      JMeter builds each thread's variables in a fixed order, and most parameterisation bugs come from forgetting it:

      1. **Properties** exist before the test: `jmeter.properties`, then `user.properties`, then the command line
         ("The command line properties are processed early in startup"). They are global; `__setProperty` can change
         one during a run, which is how threads pass values to each other.
      2. **Test Plan variables and User Defined Variables** are processed once, at the start: "all the UDV elements in
         a test plan - no matter where they are - are processed at the start." Their values are then "copied to each
         thread to provide the initial set of variables".
      3. **Per iteration:** the CSV Data Set Config reads its line; pre-processors such as User Parameters run;
         extractors overwrite variables after each sample - in the current thread only.
      4. **Per evaluation:** a function in a sampler field or header is evaluated each time that element is used.

      Point 2 has a consequence the manual states plainly: "UDVs should not be used with functions that generate
      different results each time they are called. Only the result of the first function call will be saved in the
      variable. However, UDVs can be used with functions such as `__P()`". And because configuration elements "are
      processed by a separate thread", "functions such as `__threadNum` do not work properly in elements such as User
      Defined Variables."

      **The functions this lesson uses** (Functions and Variables, 20.5):

      | Function | Returns | Note |
      | --- | --- | --- |
      | `${__UUID()}` | "a pseudo random type 4 Universally Unique IDentifier" | the usual Idempotency-Key |
      | `${__Random(100,5000)}` | a random number between the two bounds | optional third argument saves it in a variable |
      | `${__counter(TRUE,)}` | 1, 2, 3 ... per thread (`TRUE`) or shared (`FALSE`) | "Multiple `__counter` function calls in the same iteration won't increment the value further." |
      | `${__threadNum}` | the thread's number, 1 .. threads | "only locally unique with respect to their ThreadGroup" |
      | `${__time(YMD,)}` | the current time, formatted | with no format, milliseconds since the epoch; JMeter 5.5 moved from SimpleDateFormat to DateTimeFormatter |
      | `${__P(port,8090)}` | property `port`, or `8090` | no default means `1` |
      | `${__V(A${N})}` | the value of the variable whose name is built from `A` and `N` | the way round "variables cannot currently be nested" |

  - id: when
    kind: when
    concepts: [perf-jmdata-csv, perf-jmdata-vars-props, perf-jmdata-functions]
    title: Which tool for which value
    body: |
      | The value is ... | Use | Example in this lesson |
      | --- | --- | --- |
      | prepared in advance, one per user or per iteration | CSV Data Set Config, *All threads*, enough rows | `client_id`, `client_secret` |
      | the same for the whole run, different between runs | a property, `-J` on the command line, `__P` in the plan | `port`, `threads`, `loops`, `csv` |
      | a run-wide constant used in many places | a UDV whose value is `${__P(...)}` | `HOST ${__P(host,localhost)}` (the manual's example) |
      | fresh for every request | a function in the sampler or header | `Idempotency-Key: ${__UUID()}` |
      | varying per thread, set at run time | User Parameters pre-processor, or `__threadNum` in the sampler | `merchant-${__threadNum}` in the payments plan |
      | shared between threads during the run | a property set with `__setProperty` | (not needed here) |

      **What parameterisation does not replace:** realistic data *distributions* (hot merchants, big and small
      lists) - see [Workload modelling from production data](#/lesson/workload-modelling-from-production); and values
      the server gives you, such as tokens and ids - those are extracted from responses, not invented, see
      [Correlation and extractors in JMeter](#/lesson/jmeter-correlation-and-extractors).

      **When not to generate data at run time:** large volumes of random data. "If your test needs large amounts of
      data - particularly if it needs to be randomised - create the test data in a file that can be read with CSV
      Dataset. This avoids wasting resources at run-time." (Best Practices 16.7).

  - id: visual
    kind: visual
    concepts: [perf-jmdata-csv]
    title: One file, three sharing modes
    body: |
      ```mermaid
      flowchart LR
        F["merchants.csv: m1 m2 m3 m4"]
        F -- "All threads: one pointer" --> A["T1: m1, m4 / T2: m2, m3 / then EOF"]
        F -- "Current thread: a copy each" --> C["T1: m1, m2, m3 / T2: m1, m2, m3 / T3: m1, m2, m3"]
        F -- "Identifier: groups sharing an id share a pointer" --> I["like All threads, but only within the id"]
      ```

      Notice that only the shared pointer gives different threads different rows. *Current thread* looks
      per-user, but every thread starts at line 1 - per-thread data needs a file per thread
      (`test${__threadNum}.csv`). The first two lines follow the real two-group run in the next section,
      shortened (the run used 5 iterations).

  - id: code
    kind: code
    concepts: [perf-jmdata-csv, perf-jmdata-vars-props]
    title: "Real runs: one merchant per iteration from a file"
    body: |
      The credentials file, written by `write_credentials(path, 6)` from the exercise - a header line, then one
      merchant per row:

      ```plaintext
      client_id,client_secret
      merchant-1,secret-1
      merchant-2,secret-2
      merchant-3,secret-3
      merchant-4,secret-4
      merchant-5,secret-5
      merchant-6,secret-6
      ```

      The CSV Data Set Config in `solutions/jmeter/jm_data_login.jmx`, as JMeter saves it. The empty `variableNames`
      makes the header line name the variables; the file name is a property so each run can pass its own file:

      ```xml
      <CSVDataSet guiclass="TestBeanGUI" testclass="CSVDataSet" testname="merchants.csv">
        <stringProp name="filename">${__P(csv,merchants.csv)}</stringProp>
        <stringProp name="fileEncoding">UTF-8</stringProp>
        <stringProp name="variableNames"></stringProp>
        <boolProp name="ignoreFirstLine">false</boolProp>
        <stringProp name="delimiter">,</stringProp>
        <boolProp name="quotedData">false</boolProp>
        <boolProp name="recycle">false</boolProp>
        <boolProp name="stopThread">true</boolProp>
        <stringProp name="shareMode">shareMode.all</stringProp>
      </CSVDataSet>
      ```

      The sign-in sampler's body uses the two variables, and each sampler's **label ends with `${client_id}`**, so the
      results file shows which row each request used:

      ```plaintext
      POST /auth/token ${client_id}      body: {"client_id": "${client_id}", "client_secret": "${client_secret}"}
      GET /v1/payments ${client_id}      header: Authorization: Bearer ${token}   (token from a JSON Extractor)
      ```

      Run with 5 threads x 2 iterations - 10 iterations wanted, 6 rows available, stop thread on EOF:

      ```bash
      jmeter -n -t jm_data_login.jmx -l results.jtl -Jport=8090 -Jcsv=merchants.csv -Jthreads=5 -Jloops=2
      ```

      ```plaintext
      Created the tree successfully using solutions/jmeter/jm_data_login.jmx
      Starting standalone test @ 2026 Nov 20 07:09:21 IST (<epoch ms elided>)
      summary =     12 in 00:00:00 =   31.2/s Avg:    28 Min:     3 Max:    64 Err:     0 (0.00%)
      Tidying up ...    @ 2026 Nov 20 07:09:22 IST (<epoch ms elided>)
      ... end of run
      ```

      The results file, thread name, label and response code:

      ```plaintext
      Merchants 1-1 POST /auth/token merchant-5    200
      Merchants 1-3 POST /auth/token merchant-4    200
      Merchants 1-2 POST /auth/token merchant-3    200
      Merchants 1-4 POST /auth/token merchant-2    200
      Merchants 1-5 POST /auth/token merchant-1    200
      Merchants 1-5 GET /v1/payments merchant-1    200
      Merchants 1-3 GET /v1/payments merchant-4    200
      Merchants 1-4 GET /v1/payments merchant-2    200
      Merchants 1-2 GET /v1/payments merchant-3    200
      Merchants 1-1 GET /v1/payments merchant-5    200
      Merchants 1-3 POST /auth/token merchant-6    200
      Merchants 1-3 GET /v1/payments merchant-6    200
      logins_by_client: {'merchant-1': 1, 'merchant-2': 1, 'merchant-3': 1, 'merchant-4': 1, 'merchant-5': 1, 'merchant-6': 1}
      data_problems: []
      ```

      Twelve samples, not twenty: thread 3 got row 6 in its second iteration; the other four threads reached end of
      file and stopped before sending anything. Thread 1 got `merchant-5`, not `merchant-1` - in a shared file the
      order follows scheduling, exactly as the manual warns.

      **The same plan with stop thread off** (recycle still off) runs all 10 iterations; the four that start after
      the last row get `<EOF>` in every variable:

      ```plaintext
      summary =     20 in 00:00:00 =   53.5/s Avg:    15 Min:     2 Max:    50 Err:     8 (40.00%)

      Merchants 1-3 POST /auth/token merchant-6    200
      Merchants 1-1 POST /auth/token <EOF>         401
      Merchants 1-4 POST /auth/token <EOF>         401
      Merchants 1-5 POST /auth/token <EOF>         401
      Merchants 1-2 POST /auth/token <EOF>         401
      Merchants 1-4 GET /v1/payments <EOF>         401
      ...
      ```

      (Five earlier sign-ins and lists, all 200, are left out.) The literal text `<EOF>` went to the API as a client
      id - and the label shows it, because the label contains `${client_id}`.

  - id: code-sharing
    kind: code
    concepts: [perf-jmdata-csv]
    title: "A real run in two sharing modes, against the model"
    body: |
      `tests/jmeter/fixtures/jm_data_share.jmx` has two thread groups reading the same four-row file. *PerThread*
      uses *Current thread* with recycle on (3 threads x 5 iterations); *Shared* uses *All threads* with recycle and
      stop thread off (2 threads x 5 iterations). The exercise's `plan_reads` predicts each:

      ```plaintext
      real PerThread: {1: ['merchant-1', 'merchant-2', 'merchant-3', 'merchant-4', 'merchant-1'], 2: ['merchant-1', 'merchant-2', 'merchant-3', 'merchant-4', 'merchant-1'], 3: ['merchant-1', 'merchant-2', 'merchant-3', 'merchant-4', 'merchant-1']}
      model         : {1: ['merchant-1', 'merchant-2', 'merchant-3', 'merchant-4', 'merchant-1'], 2: ['merchant-1', 'merchant-2', 'merchant-3', 'merchant-4', 'merchant-1'], 3: ['merchant-1', 'merchant-2', 'merchant-3', 'merchant-4', 'merchant-1']}
      real Shared   : {'<EOF>': 6, 'merchant-1': 1, 'merchant-2': 1, 'merchant-3': 1, 'merchant-4': 1}  by thread: {1: ['merchant-1', 'merchant-4', '<EOF>', '<EOF>', '<EOF>'], 2: ['merchant-2', 'merchant-3', '<EOF>', '<EOF>', '<EOF>']}
      model         : {'<EOF>': 6, 'merchant-1': 1, 'merchant-2': 1, 'merchant-3': 1, 'merchant-4': 1}
      rows_needed(50, 20): 1000  thread mode: 20
      ```

      *Current thread* is fully predictable - and every thread signs in as `merchant-1` first. *All threads* is
      predictable only as counts: which thread got `merchant-4` is up to the scheduler. To give 50 threads x 20
      iterations a different merchant each time you need 1,000 rows in a shared file; in *Current thread* mode 20
      rows suffice, but all 50 threads use the same 20.

  - id: line-by-line
    kind: line-by-line
    concepts: [perf-jmdata-functions, perf-jmdata-vars-props]
    title: The payments plan, line by line
    body: |
      The payment sampler and its header manager from `solutions/jmeter/jm_data_payments.jmx`, shortened to the
      parameterised fields:

      ```xml
      <stringProp name="ThreadGroup.num_threads">${__P(threads,5)}</stringProp>
      <stringProp name="LoopController.loops">${__P(loops,2)}</stringProp>
      <stringProp name="HTTPSampler.port">${__P(port,8090)}</stringProp>
      <stringProp name="Argument.value">{"client_id": "merchant-${__threadNum}", "client_secret": "secret-${__threadNum}"}</stringProp>
      <stringProp name="Argument.value">{"amount_minor": ${__Random(100,5000)}, "currency": "EUR", "merchant_ref": "t${__threadNum}-${__counter(TRUE,)}"}</stringProp>
      <stringProp name="Header.value">Bearer ${token}</stringProp>
      <stringProp name="Header.value">${__UUID()}</stringProp>
      ```

      - **`num_threads` and `loops` are `stringProp`, not `intProp`.** A field that holds a function must be saved as
        a string; JMeter refused an `intProp` holding `${__P(...)}` when the plan was first written.
      - **`${__P(port,8090)}`** - a property with a default, so the plan runs as is and every test can point it at
        its own port with `-Jport=...`. `__P` without a default would return `1`.
      - **`merchant-${__threadNum}`** - one merchant per thread without a file. Fine for up to 50 threads here;
        `__threadNum` is only unique within one thread group.
      - **`${__Random(100,5000)}`** - a different amount each request. Randomness is fine for amounts; it is not a
        substitute for uniqueness, which is why the key does not use it.
      - **`${__counter(TRUE,)}`** - 1, 2, 3 per thread, so `merchant_ref` reads like `t2-3` (thread 2, iteration 3):
        a reference you can trace back to a sample.
      - **`${__UUID()}` in the header** - evaluated every time the sampler runs, so every request gets a new type 4
        UUID. Put the same function in User Defined Variables and it is evaluated once for the whole test (see
        *mistakes*).

      To check what was actually sent, save the run as XML with headers - three properties from
      `bin/jmeter.properties`, passed with `-J`:

      ```bash
      jmeter -n -t jm_data_payments.jmx -l results.jtl -Jport=8090 -Jthreads=3 -Jloops=3 \
        -Jjmeter.save.saveservice.output_format=xml \
        -Jjmeter.save.saveservice.requestHeaders=true \
        -Jjmeter.save.saveservice.responseHeaders=true
      ```

      ```plaintext
      uuid report: {"requests": 9, "unique_keys": 9, "missing_keys": 0, "duplicates": {}, "replayed": 0, "created": 9}
      first keys: ['19001ea5-24a8-4a42-bf72-e741fada7bcf', 'f0d24667-de83-42b7-bbcb-18fb8f4717d8', 'fd589e9f-1395-459c-861e-377b09dfc0be']
      ```

      XML with headers is for proving the data on a short run; for the load itself the manual's advice stands:
      "Use CSV output rather than XML. Only save the data that you need" (Best Practices 16.7).

  - id: steps
    kind: steps
    concepts: [perf-jmdata-csv, perf-jmdata-vars-props, perf-jmdata-functions]
    title: Parameterising a plan, step by step
    body: |
      1. **List every value in the plan** and sort it: prepared per user (file), fixed per run (property), fresh per
         request (function), returned by the server (extractor).
      2. **Move run settings to properties.** Replace literal host, port, threads, loops and file names with
         `${__P(name,default)}`. Pick defaults that make the plan run safely as is.
      3. **Prepare the data file.** Header line with the variable names, one row per user or per iteration. Count:
         a shared file needs threads x iterations rows if no row may repeat.
      4. **Add the CSV Data Set Config** at the top of the thread group: file name from a property, Variable Names
         empty (header line), sharing mode *All threads*, and decide end of file - recycle on only if reuse is
         harmless; otherwise recycle off and stop thread on.
      5. **Use the variables** in sampler bodies and headers, and put the identifying one in the **label** so the
         results show who sent what.
      6. **Put per-request functions where the request is built** - `${__UUID()}` in the header, not in a UDV.
      7. **Prove it on a short run:** XML results with request and response headers; check every key is unique, no
         `Idempotent-Replayed`, no `${...}` or `<EOF>` in labels, every user signed in once.
      8. **Switch back to CSV results for the load run**, and keep the proof run's results with the test evidence.

  - id: example
    kind: example
    concepts: [perf-jmdata-functions, perf-jmdata-csv]
    title: "Example: a fast payment API that was not making payments"
    body: |
      A SandPay team is asked to show that payment creation stays under 200 ms at p95 for 50 merchants. The first run
      is spectacular: p95 of 12 ms, 0% errors. A tester reviewing the plan notices the header manager:

      ```plaintext
      Idempotency-Key: order-${__threadNum}
      ```

      That key is unique per thread but **reused every iteration**, so after each thread's first payment the API
      replays. The tester reruns 3 threads x 3 iterations with headers saved and gets the report you saw in *why*:
      9 requests, 3 unique keys, 6 replayed, 3 created. The 12 ms was the replay path.

      What the tester checks before signing anything off:

      - **Labels:** no `${...}` (an undefined variable) and no `<EOF>` (an exhausted file).
      - **Identity:** each merchant signed in the expected number of times - `logins_by_client` on the results.
      - **Uniqueness:** every payment request carried a key no other request used - `key_report` on an XML run.
      - **Effect on the system:** payments created equal payment requests sent - counted where payments live (the
        database or ledger), not from responses. The practice API's own `/metrics` counted 18 `201` responses for
        the two runs' 18 payment requests, replays included: even the server's response counter cannot tell a
        replay from a payment.
      - **Volume:** the data file has at least threads x iterations rows, or the end-of-file setting is deliberate.

      The fix is one header value, `${__UUID()}`; the second run's p95 is the number that answers the requirement.

  - id: tests
    kind: tests
    concepts: [perf-jmdata-csv, perf-jmdata-vars-props, perf-jmdata-functions]
    title: Tests for a parameterised plan
    body: |
      | # | Case | Steps | Expected | Evidence |
      | - | ---- | ----- | -------- | -------- |
      | 1 | One sign-in per merchant | 6-row file, 5 threads x 2 iterations, shared, stop on EOF | 6 sign-ins, each merchant once, all 200; 12 samples | labels and codes in the JTL; `logins_by_client` |
      | 2 | Exhausted file is loud | same, stop thread off | `<EOF>` labels and 401s appear | labels; error count 8 of 20 |
      | 3 | Undefined variable | remove the CSV Data Set Config | labels show `${client_id}`, 401 on every sample | labels |
      | 4 | Sharing mode model | 4 rows, *Current thread*, 3 x 5, recycle on | each thread reads 1, 2, 3, 4, 1 | per-thread sequences vs `plan_reads` |
      | 5 | Properties override defaults | run with `-Jport`, `-Jthreads`, `-Jloops` | the plan hits the right port with that many threads | thread names, sample count |
      | 6 | Unique keys | payments plan, 3 x 3, XML with headers | 9 keys, all different, no `Idempotent-Replayed` | `key_report` |
      | 7 | Reused key is caught | fixture with `order-${__threadNum}` | 6 replays, 3 created, 3 keys used 3 times | `key_report` |
      | 8 | Once-only value | `${__UUID()}` in a UDV, header `${KEY}` | 1 key for all 9 requests | `key_report` |

      Negative cases (2, 3, 7, 8) matter as much as the positive ones: a check that has never seen the failure it is
      meant to catch has not been tested. The practice tests run cases 1, 4, 6 and 7 against real JMeter.

  - id: mistakes
    kind: mistakes
    concepts: [perf-jmdata-csv, perf-jmdata-vars-props, perf-jmdata-functions]
    title: Common mistakes and how to find them
    body: |
      - **A random function in User Defined Variables.** Real run: `KEY ${__UUID()}` in the Test Plan's variables and
        `Idempotency-Key: ${KEY}` in the header, 3 threads x 3 iterations:

        ```plaintext
        {"requests": 9, "unique_keys": 1, "missing_keys": 0, "duplicates": {"<one uuid>": [9]}, "replayed": 6, "created": 3}
        ['c805101e-1b55-498e-ad26-5844c4a1e1c5']
        ```

        One key for the whole test. Three payments were still created only because the practice API scopes keys per
        merchant and there were three merchants. "Only the result of the first function call will be saved in the
        variable."
      - **Reading the CSV in *Current thread* mode and expecting different users.** Every thread starts at line 1, so
        50 threads sign in as the same merchant. Use *All threads*, or a file per thread.
      - **Header line read as data.** Variable Names filled in and the file has a header: the first iteration signs
        in as `client_id`. Empty Variable Names, or tick "Ignore first line".
      - **Too few rows, recycle on.** Data silently repeats; the run looks fine. Count rows against threads x
        iterations, or turn recycle off so the shortage shows.
      - **`__P` without a default** returns `1` - a port of 1, a host called `1`. Always give a default.
      - **`__threadNum` across thread groups** - "thread #1 in one threadgroup is indistinguishable from thread #1 in
        another"; two groups both sign in as `merchant-1`.
      - **Relative file names in distributed runs** - the file must exist on every server, at the path relative to
        where the server started.
      - **Trusting status codes for uniqueness** - replays return the original status. Check headers or the
        system's own counts.

      **Debugging method:** put the identifying variable in the sampler label, run 1-2 threads for 2-3 iterations
      in CLI mode, and read the labels first. `${name}` means undefined, `<EOF>` means the file ran out, a repeated
      value means sharing or recycle is wrong. For values not in labels, save request headers (XML) on that short
      run, or add a Debug Sampler while scripting - never in the load run.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [perf-jmdata-csv, perf-jmdata-vars-props, perf-jmdata-functions]
    title: Trade-offs and alternatives
    body: |
      - **File versus function.** A file is cheap at run time, reviewable and repeatable - but it must be big enough
        and kept in step with the system's data. A function needs no preparation - but costs CPU per call and cannot
        create data that must already exist on the server (a merchant account, a card token).
      - **Recycle on versus off.** Recycling lets a long soak test run on a small file at the price of repeated data;
        stop-on-EOF makes the shortage visible but ends the threads early and changes the load shape. Choose
        deliberately and say which in the report.
      - **Unique versus random.** `__Random` values can repeat; use it for amounts, not for keys or references that
        must be unique. `__UUID` and `__counter` with a run prefix are unique.
      - **XML results versus CSV.** XML with headers proves the data and is expensive; run it on a short proof run,
        then load with CSV.
      - **User Parameters versus CSV.** User Parameters assigns values per thread from a short list in the plan;
        the manual points to "the CSV Data Set Config element, which is more suitable for large numbers of
        parameters".
      - **Properties files.** Many related properties change together? "one way to achieve this is to use a set of
        property files", passed with `-q` (Best Practices 16.11).
      - **Other tools.** Locust handles the same needs in Python - per-user data in `on_start`, a shared queue of
        rows, `uuid.uuid4()` per request - see [Locust task sets and user
        flows](#/lesson/locust-task-sets-and-user-flows).

  - id: summary
    kind: summary
    concepts: [perf-jmdata-csv, perf-jmdata-vars-props, perf-jmdata-functions]
    title: Quick reference
    body: |
      - Lines are read at the start of each iteration; *All threads* shares one pointer (threads x iterations lines),
        *Current thread* gives each thread its own copy from line 1.
      - Empty Variable Names = header line names the variables. Fewer values than names = the rest keep old values.
      - End of file: recycle on - start again; recycle off, stop off - `<EOF>`; recycle off, stop on - thread stops.
      - Variables are per thread; properties are global. Set run settings with `-J` (`-G` for remote servers), read
        with `${__P(name,default)}` - no default means `1`.
      - UDVs are evaluated once at the start - never put `__UUID`, `__Random` or `__threadNum` there.
      - Fresh per request: `${__UUID()}`, `${__Random(a,b)}`, `${__counter(TRUE,)}`, in the sampler or header.
      - Put the identifying variable in the label; prove uniqueness with XML results and headers on a short run.
      - A replayed request looks like a success - judge by headers and the system's own counts.

exercises:
  - id: jm-data-mcq-rows
    type: mcq
    concept: perf-jmdata-csv
    skill: application
    title: How many rows?
    prompt: |
      A thread group has 20 threads and 50 iterations. A CSV Data Set Config in *All threads* mode, recycle off, must
      give every iteration a different merchant. How many data rows does the file need?
    options:
      - id: r1000
        text: 1,000
        feedback: Correct - one shared pointer, one line per thread per iteration, 20 x 50.
      - id: r50
        text: '50'
        feedback: That is the per-thread count - right for *Current thread* mode, but there every thread would use the same 50 rows.
      - id: r20
        text: '20'
        feedback: One row per thread would be enough only if each thread read once; lines are read every iteration.
      - id: r70
        text: '70'
        feedback: Threads and iterations multiply, they do not add.
    correct: [r1000]
    hints:
      - When are lines read?
      - In *All threads* mode, how many pointers are there?
    solution: |
      "Lines are read at the start of each test iteration", and in *All threads* mode one pointer serves every
      thread, so the run reads 20 x 50 = 1,000 lines.

  - id: jm-data-mcq-current-thread
    type: mcq
    concept: perf-jmdata-csv
    skill: analysis
    title: Fifty threads, one merchant
    prompt: |
      A plan reads `merchants.csv` (100 rows) with sharing mode *Current thread*. With 50 threads, the server logs
      show only one merchant signing in during the first iteration. Why?
    options:
      - id: copy
        text: Each thread opens its own copy of the file, so every thread reads line 1 first
        feedback: Correct - "each file is opened separately for each thread".
      - id: recycle
        text: Recycle on EOF is on
        feedback: Recycle matters only at the end of the file; 100 rows are not exhausted in one iteration.
      - id: header
        text: The header line was read as data
        feedback: That would make one request use the column names, not make all threads the same merchant.
      - id: cache
        text: The server caches sign-ins
        feedback: The requests themselves carry the same client id - check the labels or request bodies.
    correct: [copy]
    hints:
      - What does *Current thread* do to the file pointer?
    solution: |
      In *Current thread* mode every thread reads its own copy from the first line. Use *All threads* for different
      rows per thread, or one file per thread (`test${__threadNum}.csv`).

  - id: jm-data-mcq-eof
    type: mcq
    concept: perf-jmdata-csv
    skill: application
    title: What happens at the end of the file?
    prompt: |
      Recycle on EOF is **false** and Stop thread on EOF is **false**. A thread starts an iteration after the last
      row has been used. What does the sign-in request send?
    options:
      - id: eof
        text: The text <EOF> in every CSV variable
        feedback: Correct - "all the variables are set to <EOF> when the end of file is reached".
      - id: last
        text: The last row again
        feedback: Variables keep old values only when a line has too few values; at end of file they are set to <EOF>.
      - id: first
        text: The first row again
        feedback: That is recycle on.
      - id: stop
        text: Nothing - the thread stops
        feedback: That needs Stop thread on EOF set to true.
    correct: [eof]
    hints:
      - Which setting stops the thread?
    solution: |
      With both off, the variables become `<EOF>` (changeable with the property `csvdataset.eofstring`), and the
      requests carry it - in the real run, four sign-ins sent `<EOF>` and got 401.

  - id: jm-data-mcq-header
    type: mcq
    concept: perf-jmdata-csv
    skill: analysis
    title: The merchant called client_id
    prompt: |
      Variable Names is set to `client_id,client_secret`, Ignore first line is unticked, and the file starts with
      the line `client_id,client_secret`. The first sign-in fails with 401. What did it send?
    options:
      - id: header-as-data
        text: client_id as the client id and client_secret as the secret
        feedback: Correct - with names filled in, the header line is just the first row of data.
      - id: empty
        text: Empty values
        feedback: The line has two values, so both variables are set - to the header text.
      - id: undefined
        text: The literal ${client_id}
        feedback: The variables are defined; their values are wrong.
      - id: eof2
        text: <EOF>
        feedback: The file is not at its end on the first read.
    correct: [header-as-data]
    hints:
      - When does JMeter treat the first line as names?
    solution: |
      The header is used as names only when Variable Names is empty; otherwise tick "Ignore first line". Leave the
      field empty and the header names the variables, as in the lesson's plan.

  - id: jm-data-mcq-scope
    type: mcq
    concept: perf-jmdata-vars-props
    skill: recall
    title: Variable or property?
    prompt: |
      A JSON Extractor in thread 7 sets `token`. Which statement is true?
    options:
      - id: local
        text: Only thread 7's copy of token changes
        feedback: Correct - "If a variable is updated by a thread, only the thread copy of the variable is changed."
      - id: all
        text: All threads see the new token
        feedback: That is how properties behave, not variables.
      - id: group
        text: All threads in the same thread group see it
        feedback: Variables are per thread, not per group.
      - id: after
        text: Other threads see it from their next iteration
        feedback: Variables are never shared between threads; use a property to pass values.
    correct: [local]
    hints:
      - Where do JMeter variables live?
    solution: |
      Variables are local to each thread, which is exactly why each thread can hold its own token. To share a value,
      set a property (`__setProperty`).

  - id: jm-data-mcq-p-default
    type: mcq
    concept: perf-jmdata-vars-props
    skill: application
    title: A port of 1
    prompt: |
      A sampler's port field is `${__P(port)}`. The run is started without `-Jport`. Every request fails to connect.
      Why?
    options:
      - id: one
        text: '__P with no default returns 1, so the requests go to port 1'
        feedback: Correct - "if no default value is supplied, it is assumed to be 1".
      - id: name
        text: __P returns the property name, port
        feedback: That is __property; __P returns 1.
      - id: empty
        text: __P returns an empty string and JMeter uses port 80
        feedback: The manual gives 1 as the default.
      - id: error
        text: JMeter refuses to start the test
        feedback: It starts; the value is just wrong.
    correct: [one]
    hints:
      - Look up what __P returns without a default.
    solution: |
      "The value of 1 was chosen because it is valid for common test variables such as loops, thread count, ramp up
      etc." - and wrong for a port. Write `${__P(port,8090)}`.

  - id: jm-data-mcq-remote
    type: mcq
    concept: perf-jmdata-vars-props
    skill: recall
    title: Properties for remote servers
    prompt: |
      In a distributed run, which command-line option sends a property to every remote JMeter server?
    options:
      - id: g
        text: -Gname=value
        feedback: Correct - "defines a JMeter property to be sent to all remote servers".
      - id: j
        text: -Jname=value
        feedback: That defines a local JMeter property only.
      - id: d
        text: -Dname=value
        feedback: That defines a Java system property.
      - id: q
        text: -q file
        feedback: That adds a local property file.
    correct: [g]
    hints:
      - Local versus global.
    solution: |
      `-J` is local; `-G` (or `-G` with a properties file) goes to all remote servers. The CSV files must still be on
      each server.

  - id: jm-data-mcq-udv
    type: mcq
    concept: perf-jmdata-functions
    skill: analysis
    title: One UUID for the whole run
    prompt: |
      The Test Plan defines `KEY ${__UUID()}` and the payment header is `Idempotency-Key: ${KEY}`. A 3 x 3 run saved
      with headers shows 1 unique key across 9 requests. Why?
    options:
      - id: once
        text: UDVs are processed once at the start, so the function is evaluated once
        feedback: Correct - "Only the result of the first function call will be saved in the variable."
      - id: uuid-bug
        text: __UUID returns the same value until JMeter restarts
        feedback: Each call returns a new UUID; it was called only once.
      - id: per-thread
        text: The key is unique per thread, so there should be 3 keys
        feedback: UDVs are copied to every thread, so all threads share the one value.
      - id: cache
        text: The HTTP Header Manager caches header values
        feedback: Header values are evaluated per sample; the variable already held one value.
    correct: [once]
    hints:
      - When are User Defined Variables processed?
    solution: |
      Put `${__UUID()}` directly in the header value, where it is evaluated each time the sampler runs. Keep UDVs for
      constants and `__P` look-ups.

  - id: jm-data-mcq-function-choice
    type: mcq
    concept: perf-jmdata-functions
    skill: application
    title: The right function for a payment reference
    prompt: |
      Each payment needs a `merchant_ref` that is unique within the run and tells you which thread and iteration sent
      it. Which value fits best?
    options:
      - id: counter
        text: t${__threadNum}-${__counter(TRUE,)}
        feedback: Correct - thread number plus a per-thread counter is unique within one thread group and traceable.
      - id: random
        text: ref-${__Random(1,1000)}
        feedback: Random values can repeat, and they say nothing about who sent them.
      - id: time
        text: ref-${__time(HMS,)}
        feedback: Many requests share the same second.
      - id: global-counter
        text: ref-${__counter(FALSE,)}
        feedback: Unique, but it no longer tells you which thread sent it.
    correct: [counter]
    hints:
      - Unique and traceable.
    solution: |
      `__threadNum` identifies the thread (within its group) and `__counter(TRUE,)` counts that thread's iterations.
      Add a run prefix (from a property) if references must be unique across runs, or use `__UUID` when
      traceability does not matter.

  - id: jm-data-mcq-replay
    type: mcq
    concept: perf-jmdata-functions
    skill: analysis
    title: 0% errors, three payments
    prompt: |
      A 3-thread x 3-iteration run reports `Err: 0 (0.00%)`. The saved headers show `Idempotency-Key: order-1`,
      `order-2`, `order-3`, each three times, and six responses with `Idempotent-Replayed: true`. How many payments
      did the run create?
    options:
      - id: three
        text: '3'
        feedback: Correct - one per key; the other six requests were answered with the stored first response.
      - id: nine
        text: '9'
        feedback: Nine 201 responses, but six were replays - JMeter cannot tell.
      - id: six
        text: '6'
        feedback: Six is the number of replays, not of payments.
      - id: one
        text: '1'
        feedback: Keys differ between threads, so each thread created one.
    correct: [three]
    hints:
      - Count the distinct keys.
    solution: |
      Replays keep the original status, so they count as successes. The run measured three payments and six
      look-ups - report it as invalid and rerun with `${__UUID()}`.

  - id: jm-data-order
    type: order
    concept: perf-jmdata-csv
    skill: application
    title: Prove a parameterised plan before the load run
    prompt: Put the steps in order.
    items:
      - id: sort-values
        text: List every value in the plan as file data, run setting, per-request value or server-returned value
      - id: properties
        text: Replace run settings with __P properties that have safe defaults
      - id: file
        text: Write the data file with a header line and enough rows for threads x iterations
      - id: csv-element
        text: Add the CSV Data Set Config (shared, end-of-file behaviour chosen) and use its variables in bodies and labels
      - id: functions
        text: Put per-request functions such as __UUID in the sampler or header
      - id: proof-run
        text: Run 2-3 threads briefly with XML results and headers, and check labels, sign-ins and keys
      - id: load-run
        text: Run the load with CSV results only
    hints:
      - You can only check what you have built; the expensive XML run comes before the load, not during it.
    solution: |
      Classify, parameterise settings, prepare data, wire the CSV element, add per-request functions, prove on a
      short run, then load with lean results.

  - id: jm-data-debug
    type: debug
    concept: perf-jmdata-csv
    skill: analysis
    title: Every thread is merchant-1
    prompt: |
      This CSV Data Set Config should give each of 50 threads a different merchant from a 1,000-row file. The
      results show all 50 threads signing in as `merchant-1` in their first iteration. Which line is the defect?
    language: xml
    code: |
      <CSVDataSet guiclass="TestBeanGUI" testclass="CSVDataSet" testname="merchants.csv">
        <stringProp name="filename">${__P(csv,merchants.csv)}</stringProp>
        <stringProp name="fileEncoding">UTF-8</stringProp>
        <stringProp name="variableNames"></stringProp>
        <boolProp name="ignoreFirstLine">false</boolProp>
        <stringProp name="delimiter">,</stringProp>
        <boolProp name="quotedData">false</boolProp>
        <boolProp name="recycle">false</boolProp>
        <boolProp name="stopThread">true</boolProp>
        <stringProp name="shareMode">shareMode.thread</stringProp>
      </CSVDataSet>
    correctLines: [10]
    lineNotes:
      - line: 4
        note: Empty Variable Names is right - the header line names the variables.
      - line: 5
        note: With Variable Names empty, Ignore first line is not used; the header is read as names.
      - line: 8
        note: Recycle off and stop thread on make a shortage visible; they do not make threads share rows.
    hints:
      - Which setting decides who shares the file pointer?
    solution: |
      `shareMode.thread` opens the file separately for each thread, so every thread starts at line 1. Use
      `shareMode.all` (the default) for one shared pointer.

  - id: jm-data-short
    type: short
    concept: perf-jmdata-vars-props
    skill: analysis
    title: Why the soak test reused data
    prompt: |
      A 4-hour soak test uses a 2,000-row merchant file, 40 threads and recycle on. After about 25 minutes the
      database's buffer-cache hit ratio rises and payment latency drops. Explain what probably happened, how to
      confirm it from the results, and two ways to fix it.
    modelAnswer: |
      In *All threads* mode the run consumes one row per thread per iteration. 40 threads exhaust 2,000 rows after
      50 iterations each; with recycle on, JMeter starts again at line 1, so from then on every merchant's data is
      already warm in caches - the test measures a hotter system than production. Confirm it by putting
      `${client_id}` in the label and counting sign-ins per merchant over time (each merchant appears more than
      once after the wrap), or by computing when threads x iterations passed 2,000. Fixes: generate enough rows for
      the whole soak (rate x duration), or turn recycle off with stop thread on so the shortage is visible, or add a
      run-specific component to data that may repeat (for example a key prefix from a property) where reuse is
      acceptable for the system but not for its caches.
    rubric:
      - Explains that the file was exhausted and recycled, so data repeated.
      - Links repeated data to warmer caches and lower latency.
      - Confirms with labels or counts per merchant over time, or the threads x iterations arithmetic.
      - Proposes enough rows, recycle off with stop thread, or another way to keep data fresh.
    hints:
      - How many rows does 40 threads x 50 iterations consume?
    solution: |
      The file ran out and recycled; repeated merchants hit warm caches. Size the file to the run or make the
      shortage visible.

  - id: jm-data-testdesign
    type: testdesign
    concept: perf-jmdata-functions
    skill: application
    title: Test plan for the payment plan's data
    prompt: |
      Before a 50-merchant payment load test, design the checks that prove the plan's data is right. Give
      preconditions, steps, expected results and evidence for each.
    modelAnswer: |
      Preconditions: practice API on loopback, a 50-row credentials file, the plan with properties for port, threads,
      loops and file.

      1. **Sign-ins** - 5 threads x 2 iterations, 10-row file. Expected: 10 sign-ins, each merchant once, all 200.
         Evidence: labels with `${client_id}`, `logins_by_client`.
      2. **End of file is visible** - same with a 6-row file, stop thread on. Expected: 6 sign-ins, threads stop, no
         `<EOF>`. Evidence: sample count, labels.
      3. **Undefined variables** - scan labels. Expected: no `${`. Evidence: labels.
      4. **Unique keys** - 3 x 3 payments, XML with request and response headers. Expected: 9 keys, all different, no
         `Idempotent-Replayed`. Evidence: `key_report`.
      5. **Negative control** - a fixture plan with `order-${__threadNum}`. Expected: the check reports 6 replays and
         3 duplicate keys. Evidence: `key_report` output kept with the run.
      6. **Properties** - run with `-Jport` and `-Jthreads` set. Expected: requests reach that port with that many
         threads. Evidence: thread names, server metrics.
      7. **System effect** - compare payments created on the server with payment requests sent. Expected: equal.
         Evidence: server metrics or database count.
    rubric:
      - Each case has preconditions, steps, expected result and evidence.
      - Covers distinct sign-ins and end-of-file behaviour.
      - Proves key uniqueness from request or response headers, not status codes.
      - Includes a negative control showing the check catches a reused key.
      - Checks the effect on the system (payments created), not only JMeter's view.
    hints:
      - Which failures would JMeter report as success?
    solution: |
      Check identity, end of file, undefined variables, key uniqueness (with a negative control) and the system's own
      count - from labels, headers and server metrics, not status codes.

  - id: jm-data-interview
    type: interview
    concept: perf-jmdata-vars-props
    skill: analysis
    title: "Interview: how do you parameterise a JMeter test?"
    prompt: |
      "Walk me through how you parameterise a JMeter test plan so it runs against different environments and every
      virtual user is a different customer."
    modelAnswer: |
      I sort every value first. Run settings - host, port, threads, loops, file names - become properties read with
      `${__P(name,default)}` and set with `-J` on the command line, or `-G` for remote servers, so the same plan runs
      in every environment without edits. Properties are global; variables are per thread, which is what I want for
      user data.

      User data I prepare in advance in a CSV file with a header line, read by a CSV Data Set Config in *All threads*
      mode - one shared pointer, so threads x iterations rows if nothing may repeat. I decide end of file
      explicitly: recycle only if reuse is harmless, otherwise stop the thread so a shortage shows. I know
      *Current thread* mode gives every thread the same rows.

      Values that must be fresh per request - an Idempotency-Key, a reference - come from functions like `__UUID`
      or `__counter` placed in the sampler or header, never in User Defined Variables, which are evaluated once.

      Then I prove it on a short run: the identifying variable in the label, XML results with request and response
      headers, and checks for undefined variables, `<EOF>`, duplicate keys and replays - because a replayed payment
      returns 201 and JMeter counts it as a success.
    rubric:
      - Separates run settings (properties, -J/-G, __P with defaults) from user data (CSV).
      - Explains variables are per thread and properties global.
      - Describes CSV sharing mode and end-of-file choices with row arithmetic.
      - Places per-request functions correctly and warns about UDVs.
      - Proves the data with labels and headers, not status codes.
    followUps:
      - How would you give each thread its own file?
      - What changes in a distributed test?
      - How would you keep data unique across several runs of the same plan?
    hints:
      - Answer in three parts - settings, user data, per-request values - then how you prove it.
    solution: |
      Properties for run settings, CSV for user data with deliberate sharing and end-of-file choices, functions in
      samplers for per-request values, and a short proof run with headers.

  - id: jm-data-code-login
    type: coding
    concept: perf-jmdata-csv
    skill: application
    title: One merchant per iteration from a CSV file
    prompt: |
      Two parts. In `exercises/jmeter/jm_data_credentials.py`, implement `write_credentials` (header line, then
      `merchant-<n>,secret-<n>` rows; refuse merchants outside 1..50), `logins_by_client` and `data_problems`.
      In `exercises/jmeter/jm_data_login.jmx`, add the CSV Data Set Config where the TODO comment is - in a text
      editor or in the JMeter GUI. The test runs your plan with a 6-row file, 5 threads x 2 iterations, and expects
      every merchant to sign in exactly once, threads to stop at end of file, and no `${...}` or `<EOF>` in labels.
    project: perf
    files:
      - exercises/jmeter/jm_data_credentials.py
      - exercises/jmeter/jm_data_login.jmx
    test: tests/jmeter/test_jm_data_login.py
    command: .venv/bin/python -m pytest tests/jmeter/test_jm_data_login.py
    hints:
      - Without the CSV element the labels show ${client_id} - that is the first failure to fix.
      - Leave Variable Names empty so the header line names the variables.
      - Ten iterations, six rows - which end-of-file setting gives exactly six sign-ins?
    modelAnswer: |
      ```xml
      <CSVDataSet guiclass="TestBeanGUI" testclass="CSVDataSet" testname="merchants.csv">
        <stringProp name="filename">${__P(csv,merchants.csv)}</stringProp>
        <stringProp name="fileEncoding">UTF-8</stringProp>
        <stringProp name="variableNames"></stringProp>
        <boolProp name="ignoreFirstLine">false</boolProp>
        <stringProp name="delimiter">,</stringProp>
        <boolProp name="quotedData">false</boolProp>
        <boolProp name="recycle">false</boolProp>
        <boolProp name="stopThread">true</boolProp>
        <stringProp name="shareMode">shareMode.all</stringProp>
      </CSVDataSet>
      <hashTree/>
      ```

      ```python
      def write_credentials(path, count, first=1):
          if count < 1:
              raise ValueError("count must be at least 1")
          last = first + count - 1
          if first not in KNOWN_CLIENTS or last not in KNOWN_CLIENTS:
              raise ValueError(f"merchants {first}..{last} are not all known to the practice API (1..50)")
          with Path(path).open("w", newline="") as f:
              writer = csv.writer(f, lineterminator="\n")
              writer.writerow(HEADER)
              for n in range(first, last + 1):
                  writer.writerow((f"merchant-{n}", f"secret-{n}"))
          return Path(path)
      ```

      Shared mode gives each iteration a new row; recycle off with stop thread on ends the run after the sixth row
      instead of sending `<EOF>`. `data_problems` checks labels in order - undefined variable, end of file, failed
      sample - then reports merchants with more than one sign-in.
    rubric:
      - Every test in tests/jmeter/test_jm_data_login.py passes.
      - The CSV element uses the header line, shared mode and a deliberate end-of-file setting.
      - The file name comes from a property, not a hard-coded path.
      - Can explain why the run has 12 samples, not 20.
    solution: |
      A shared CSV Data Set Config with recycle off and stop thread on gives six distinct sign-ins and stops; the
      Python helpers make that provable from the results.

  - id: jm-data-code-sharing
    type: coding
    concept: perf-jmdata-csv
    skill: analysis
    title: Predict which rows a run reads
    prompt: |
      In `exercises/jmeter/jm_data_sharing.py`, implement `plan_reads(rows, threads, iterations, share, recycle,
      stop_thread)` and `rows_needed`. The tests check the manual's rules - one shared pointer, a copy per thread,
      recycle, `<EOF>`, stop thread - and then run a real two-thread-group JMeter plan and compare its results with
      your predictions.
    project: perf
    files:
      - exercises/jmeter/jm_data_sharing.py
    test: tests/jmeter/test_jm_data_sharing.py
    command: .venv/bin/python -m pytest tests/jmeter/test_jm_data_sharing.py
    hints:
      - Write one helper that produces the sequence for a given number of reads; both modes use it.
      - In shared modes the number of reads is threads x iterations; in thread mode it is iterations per thread.
      - Stop thread matters only when recycle is off, and the iteration that hits end of file sends nothing.
    modelAnswer: |
      ```python
      def _sequence(rows, reads, recycle, stop_thread):
          out = []
          for i in range(reads):
              if i < len(rows):
                  out.append(rows[i])
              elif recycle:
                  out.append(rows[i % len(rows)])
              elif stop_thread:
                  break
              else:
                  out.append(EOF_VALUE)
          return out

      def plan_reads(rows, threads, iterations, share="all", recycle=True, stop_thread=False):
          # ... validate share, rows, threads, iterations ...
          if share == "thread":
              per_thread = {t: _sequence(rows, iterations, recycle, stop_thread) for t in range(1, threads + 1)}
              values = Counter()
              for seq in per_thread.values():
                  values.update(seq)
              return Reads(per_thread, values, sum(len(s) for s in per_thread.values()))
          seq = _sequence(rows, threads * iterations, recycle, stop_thread)
          return Reads(None, Counter(seq), len(seq))
      ```

      A shared file predicts counts but not order, so `per_thread` is `None` there.
    rubric:
      - Every test in tests/jmeter/test_jm_data_sharing.py passes.
      - Shared and per-thread modes reuse one sequence rule.
      - Does not pretend to predict the order of a shared file.
      - Can state how many rows a given run needs in each mode.
    solution: |
      One sequence rule (rows, then recycle, stop or <EOF>) applied once per thread or once for the shared pointer
      reproduces the real run.

  - id: jm-data-code-keys
    type: coding
    concept: perf-jmdata-functions
    skill: application
    title: A fresh Idempotency-Key per payment, proved
    prompt: |
      Two parts. In `exercises/jmeter/jm_data_payments.jmx`, the Idempotency-Key header is the fixed text `order-1`;
      change it so every request gets its own key. In `exercises/jmeter/jm_data_keys.py`, implement
      `payment_samples` (read an XML results file with saved headers) and `key_report`. The tests run your plan
      (3 threads x 3 iterations, XML with headers) and expect 9 different keys and no replays, and run a fixture
      plan that reuses a key per thread, where your report must find 6 replays and 3 duplicate keys.
    project: perf
    files:
      - exercises/jmeter/jm_data_payments.jmx
      - exercises/jmeter/jm_data_keys.py
    test: tests/jmeter/test_jm_data_keys.py
    command: .venv/bin/python -m pytest tests/jmeter/test_jm_data_keys.py
    hints:
      - Which function returns a new type 4 UUID each time it is evaluated?
      - In the XML file, each sample is an httpSample element with requestHeader and responseHeader children.
      - A header line is "Name - colon - value"; compare names case-insensitively.
    modelAnswer: |
      ```xml
      <stringProp name="Header.name">Idempotency-Key</stringProp>
      <stringProp name="Header.value">${__UUID()}</stringProp>
      ```

      ```python
      def payment_samples(xml_jtl, label="POST /v1/payments"):
          root = ET.parse(xml_jtl).getroot()
          out, saw_headers = [], False
          for sample in root.iter("httpSample"):
              if sample.get("lb") != label:
                  continue
              request = sample.findtext("requestHeader")
              response = sample.findtext("responseHeader") or ""
              saw_headers = saw_headers or request is not None
              out.append({"thread": sample.get("tn"), "code": sample.get("rc"),
                          "key": _header(request or "", "Idempotency-Key"),
                          "replayed": (_header(response, "Idempotent-Replayed") or "").lower() == "true"})
          if out and not saw_headers:
              raise ValueError("no request headers in the results file")
          return out
      ```

      `key_report` counts requests, distinct keys, missing keys, keys used more than once, replays, and 201s that
      were not replays - the payments that really exist.
    rubric:
      - Every test in tests/jmeter/test_jm_data_keys.py passes.
      - The key is generated in the header, per request - not in User Defined Variables.
      - The report proves uniqueness from headers, not from status codes.
      - Refuses to report on a results file saved without request headers.
    solution: |
      `${__UUID()}` in the header gives every request its own key; the XML report proves it and catches the
      reused-key fixture.

placement:
  - id: jm-data-place-rows
    type: mcq
    concept: perf-jmdata-csv
    skill: application
    title: Enough data?
    prompt: |
      10 threads x 30 iterations read a 100-row file in *All threads* mode with recycle **on**. What happens?
    options:
      - id: repeat
        text: Every row is used 3 times; the run gives no warning
        feedback: Correct - 300 reads from 100 rows, recycled silently.
      - id: eof3
        text: The last 200 reads get <EOF>
        feedback: That needs recycle off.
      - id: stop3
        text: Threads stop after 100 reads
        feedback: Stop thread applies only when recycle is off.
      - id: per-thread3
        text: Each thread reads rows 1 to 30
        feedback: That is *Current thread* mode.
    correct: [repeat]
    hints:
      - Reads = threads x iterations.
    solution: |
      300 reads, 100 rows, recycle on: each row is used three times and nothing tells you. Size the file or turn
      recycle off.

  - id: jm-data-place-props
    type: mcq
    concept: perf-jmdata-vars-props
    skill: application
    title: Same plan, different environment
    prompt: |
      You want to run one plan against staging on port 8443 with 200 threads, without editing it. What should the
      plan and command contain?
    options:
      - id: p-and-j
        text: 'Fields such as ${__P(port,8090)} and ${__P(threads,5)}; run with -Jport=8443 -Jthreads=200'
        feedback: Correct - properties with defaults, set on the command line.
      - id: udv
        text: User Defined Variables PORT=8443 and THREADS=200 in the plan
        feedback: That edits the plan for every environment.
      - id: csv-settings
        text: A CSV file with port and threads in it
        feedback: CSV rows are read per iteration - too late for thread counts.
      - id: d-flag
        text: Run with -Dport=8443 -Dthreads=200
        feedback: -D sets Java system properties; __P reads JMeter properties set with -J.
    correct: [p-and-j]
    hints:
      - Which option defines a local JMeter property?
    solution: |
      `${__P(name,default)}` in the plan, `-Jname=value` on the command line (`-G` for remote servers).

  - id: jm-data-place-uuid
    type: debug
    concept: perf-jmdata-functions
    skill: analysis
    title: Where is the key evaluated?
    prompt: |
      Every payment in a run carried the same Idempotency-Key. Which line of this plan excerpt causes it?
    language: plaintext
    code: |
      Test Plan
        User Defined Variables:  HOST = ${__P(host,localhost)}
        User Defined Variables:  KEY = ${__UUID()}
        Thread Group (threads = ${__P(threads,5)})
          POST /v1/payments
            Header: Idempotency-Key = ${KEY}
            Body: {"amount_minor": ${__Random(100,5000)}, "currency": "EUR"}
    correctLines: [3]
    lineNotes:
      - line: 2
        note: __P in a UDV is the manual's own example - a run-wide constant is exactly what UDVs are for.
      - line: 6
        note: The header only reads KEY; the value was fixed before the first sample.
      - line: 7
        note: __Random in the body is evaluated per request.
    hints:
      - When are User Defined Variables processed?
    solution: |
      UDVs are evaluated once at the start, so `KEY` holds one UUID for the whole test. Put `${__UUID()}` in the
      header itself.

recall:
  - id: jm-data-recall-when
    concept: perf-jmdata-csv
    prompt: When does a CSV Data Set Config read a line?
    answer: At the start of each iteration of each thread.
  - id: jm-data-recall-modes
    concept: perf-jmdata-csv
    prompt: What is the difference between All threads and Current thread sharing modes?
    answer: All threads shares one file pointer (threads x iterations lines in total, order unpredictable); Current thread opens the file separately for each thread, so every thread starts at line 1.
  - id: jm-data-recall-eof
    concept: perf-jmdata-csv
    prompt: Name the three end-of-file behaviours and their settings.
    answer: Recycle on - start again at line 1; recycle off and stop thread off - every variable becomes <EOF>; recycle off and stop thread on - the thread stops.
  - id: jm-data-recall-scope
    concept: perf-jmdata-vars-props
    prompt: How do JMeter variables and properties differ in scope?
    answer: Variables are local to each thread; properties are global to the JMeter process.
  - id: jm-data-recall-p
    concept: perf-jmdata-vars-props
    prompt: What does ${__P(threads)} return when -Jthreads is not set?
    answer: 1 - __P's default when none is given. Always pass a default.
  - id: jm-data-recall-udv
    concept: perf-jmdata-functions
    prompt: Why must __UUID not go in User Defined Variables?
    answer: UDVs are processed once at the start, so only the first result is saved and every request shares it.
  - id: jm-data-recall-proof
    concept: perf-jmdata-functions
    prompt: How do you prove every payment request had a unique Idempotency-Key?
    answer: Save a short run as XML with request and response headers, then check every key is distinct and no response says Idempotent-Replayed - status codes cannot show it.

