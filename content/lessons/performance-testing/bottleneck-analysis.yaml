    hints:
      - The generator check invalidates everything after it if it fails.
    solution: |
      Symptom, generator and status codes, step load, USE table, what-if, one change, re-run.

  - id: use-debug
    type: debug
    concept: perf-bn-use-red
    skill: analysis
    title: Four defects in a USE reading
    prompt: |
      This function should turn samples of `{"in_flight": n, "waiting": m}` from the practice target into USE findings. Click every line that is a defect.
    language: python
    code: |
      def use_row(samples, capacity, errors):
          util = max(s["in_flight"] for s in samples) / capacity
          sat = sum(s["waiting"] for s in samples)
          findings = []
          if util == 1.0:
              findings.append("high-utilization")
          if sat > 0:
              findings.append("saturated")
          if errors:
              findings.append("errors")
          return findings
    correctLines: [2, 3, 5, 7]
    lineNotes:
      - line: 2
        note: A maximum over many samples reaches 1.0 in almost any run, loaded or not. Utilization is the mean of the busy fraction.
      - line: 3
        note: A sum grows with how long you sampled. A queue length is the mean (or a percentile) of the waiting counts.
      - line: 5
        note: Only exactly 1.0 counts. Gregg's rule is a place to start looking from about 70 %, and a mean of busy workers is rarely exactly 1.0.
      - line: 7
        note: Any non-zero sampled mean fires on a request caught between arriving and starting. The lesson's code asks for at least half a request on average.
      - line: 9
        note: Fine - a non-zero error count is worth investigating.
      - line: 4
        note: Fine.
    hints:
      - Which statistic of the samples is utilization?
      - Does the saturation value depend on how many samples you took?
      - Is the sampled queue ever exactly zero on a loaded pool?
    solution: |
      Line 2: use the mean of in_flight over the samples. Line 3: use the mean of waiting. Line 5: compare with a threshold such as 0.70. Line 7: compare with a small floor (0.5) so sampling noise is not a finding.

  - id: quiet-short
    type: short
    concept: perf-bn-signature
    skill: analysis
    title: Why "add workers" is the wrong answer
    prompt: |
      A step load shows 33 requests per second at 16 clients and at 32 clients, with a mean latency of 147 ms at 16 and 300 ms at 32. The target's USE table at 32 clients reads utilization 28 %, queue 0.0, errors 0. A teammate says "the API is saturated, add workers". Explain what is wrong, what you would check next, and how you would prove your explanation.
    modelAnswer: |
      The target is clear - 28 % utilization, no queue, no errors - so it is not saturated, and more workers would change
      nothing. Flat throughput with a quiet target is the signature of a load generator that cannot send faster, and the
      generator's own queueing inflates the latency it measures (147 ms at 16 clients, 300 ms at 32, while the target does 20 ms
      of work per request). Next check the generator machine's CPU, its connection count and the tool's warnings.

      To prove it, move the same script to a second generator machine or lighten the script, and run the same step load again:
      if the ceiling rises and the target's utilization rises with it, the generator was the limit.
    rubric:
      - Reads the USE table of the target as clear and says that adding workers would not help.
      - Names the load generator as the likely limit and notes that it inflates the measured latency.
      - Names what to check - the generator's CPU, connections and tool warnings.
      - Gives a proof - a second generator or a lighter script, with the ceiling and the target's utilization rising together.
    hints:
      - What does a quiet target say about where the limit is?
    solution: |
      The target is clear, so the generator is the likely limit; check its CPU and connections and prove it by moving or lightening the load script.

  - id: payments-testdesign
    type: testdesign
    concept: perf-bn-laws
    skill: application
    title: A bottleneck investigation for the settlement API
    prompt: |
      SandPay's `POST /v1/payments` has p95 380 ms against a 300 ms requirement at 300 concurrent users in the test environment (a hypothetical situation). Design the investigation: what you measure first, how you tell the generator, the queue bounds and the real limit apart, what table you build, what you compute before changing anything, and how you confirm the fix.
    modelAnswer: |
      **Symptom (RED):** record rate, error rate by status code (429, 503, 5xx) and duration percentiles of successes and errors separately for the 300-user run. Note the requirement and the environment.

      **Rule out the test:** generator CPU, connections and tool warnings; if above about 70 %, add a generator or lighten the script and repeat. Check that the data, the environment and the version are the ones the requirement is written for.

      **Find the level:** a step load (for example 50, 100, 200, 300, 400 users) at the workload's pacing; the knee, the ceiling, the wait share, and ceiling x service time as a consistency check.

      **Build the USE table** for every resource on the path - load balancer, application workers, database connections, database CPU and I/O, memory, network, the payment-provider sandbox - sampled each second during the plateau, with "no data" where a metric is missing (a blind spot to close). Name the limiting resource by the longest queue, then the highest utilization; say what would make that wrong.

      **Predict:** D_k = U_k / X for each resource; the bottleneck bound 1 / D_max and the what-if for each candidate fix (a bigger pool, an index, a cache). Choose the fix whose predicted gain is largest per effort, and write the expected new knee.

      **Confirm:** change one thing, re-run the same step load, compare the knee and the p95 with the prediction, and look for the next bottleneck. If the knee did not move, the demand was not constant (locks, retries) - revisit the model.
    rubric:
      - Starts with the symptom in RED terms and separates successes from errors.
      - Checks the load generator and status codes before blaming a resource.
      - Uses a step load to find the knee and a USE table across resources to name the limiting one.
      - Computes demands and a what-if before changing anything, and changes one thing at a time.
      - Re-runs the same load and looks for the next bottleneck.
    hints:
      - What would you check before you trust the curve at all?
    solution: |
      Symptom with RED, generator and status codes, step load, USE table, demands and what-if, one change, re-run for the next bottleneck.

  - id: bottleneck-interview
    type: interview
    concept: perf-bn-signature
    skill: analysis
    title: 'Interview: throughput is flat and latency is climbing - now what?'
    prompt: |
      "In a load test the throughput stops growing at some number of users and the response times keep climbing. How do you find out what the bottleneck is?"
    modelAnswer: |
      I first check that the flat line is the system's and not the test's: the load generator's CPU and connections, the tool's warnings and the status codes - 429 means a rate limit, 503 a bounded queue, 5xx real failures. A generator at its limit leaves the target quiet, and fast refusals can even make the mean latency fall, so I report successes and errors separately.

      Then I describe the symptom with RED and go resource by resource with USE: for each of the load balancer, the application workers, the database connections, CPU, memory, disk, network and the queues, I read utilization, saturation and errors, sampled every second or so during the plateau, because a long average hides bursts. The resource with a queue - or, with none, the one near 100 % - is the candidate. A thread or connection pool counts: busy workers are utilization, waiting requests are saturation.

      Before I change anything I compute the service demand of each resource, D = U / X, and apply the bottleneck bound: throughput cannot exceed 1 / D_max, so a fix elsewhere pays nothing, and a fix to the bottleneck pays until the next-largest demand takes over. That gives me the expected gain and the next bottleneck. I then change one thing, re-run the same step load, and check that the knee moved where I predicted; if it did not, the demand was not constant - locks or retries - and I revisit the model.
    rubric:
      - Checks the load generator and the status codes before blaming the system.
      - Uses USE per resource, with a short sampling interval, and counts pools as resources.
      - Knows the bottleneck is the largest service demand and that throughput is at most 1 / D_max.
      - Predicts the effect of a fix, changes one thing and re-runs to confirm.
      - Expects the next bottleneck and mentions the assumption of constant demand.
    followUps:
      - How would you tell a slow load generator from a saturated server?
      - What would you do if the USE table showed no saturated resource at all?
      - Why can the mean latency go down while the system is failing?
    hints:
      - Start with whether the flat line belongs to the system or to the test.
    solution: |
      Rule out the generator and the status codes, USE per resource at a fine interval, demands and the bottleneck bound, change one thing and re-run.

  - id: use-code
    type: coding
    concept: perf-bn-use-red
    skill: application
    title: A USE reading of the worker pool
    prompt: |
      Implement `analysis/bn_use.py`: `utilization(samples, capacity)` (mean busy fraction), `saturation(samples)` (mean queue
      length), `use_findings(util, sat, errors)` (a list in the order errors, saturated, high-utilization, with the 70 % line and
      a queue noise floor of half a request) and `limiting(resources)` (the name of the resource that limits throughput, or
      `None`). The tests run on small tables and against the real practice target, including a load generator that burns CPU
      and a target whose queue is bounded.
    project: perf
    files:
      - exercises/analysis/bn_use.py
    test: tests/analysis/test_bn_use.py
    command: .venv/bin/python -m pytest tests/analysis/test_bn_use.py
    modelAnswer: |
      ```python
      def utilization(samples, capacity):
          if not samples:
              return 0.0
          return round(sum(s["in_flight"] for s in samples) / len(samples) / capacity, 3)

      def saturation(samples):
          if not samples:
              return 0.0
          return round(sum(s["waiting"] for s in samples) / len(samples), 2)

      def use_findings(util, sat, errors):
          findings = []
          if errors > 0:
              findings.append("errors")
          if sat >= 0.5:
              findings.append("saturated")
          if util >= 0.70:
              findings.append("high-utilization")
          return findings

      def limiting(resources):
          candidates = []
          for name, r in resources.items():
              findings = use_findings(r["utilization"], r["saturation"], r["errors"])
              if "saturated" in findings or "high-utilization" in findings:
                  candidates.append((-r["saturation"], -r["utilization"], name))
          return min(candidates)[2] if candidates else None
      ```

      A tuple of negated numbers and the name makes `min` pick the longest queue, then the highest utilization, then the first
      name. The generator test passes because the target's table stays clear however slow the clients are.
    rubric:
      - Every test in tests/analysis/test_bn_use.py passes.
      - Utilization and saturation are means over the samples, and an empty list gives 0.0.
      - Findings are in the order errors, saturated, high-utilization, with 0.70 and 0.5 as thresholds.
      - limiting() ignores a resource that has only errors and returns None when nothing is busy or saturated.
    hints:
      - Utilization is the mean of in_flight over the capacity.
      - A threshold of exactly 0.70 counts; a queue of exactly 0.5 counts.
      - Negate the numbers you want the largest of, then use min().
    solution: |
      Means over the samples, three threshold checks in the order errors, saturated, high-utilization, and a min() over (-queue, -utilization, name) for the candidates.

  - id: knee-code
    type: coding
    concept: perf-bn-signature
    skill: analysis
    title: Read a step load
    prompt: |
      Implement `analysis/bn_knee.py` on the steps a level run returns (dicts with `clients`, `throughput` and `mean_ms`):
      `find_knee(steps, min_gain=0.10)` (the client count whose next step gains less than `min_gain`, or `None`),
      `wait_share(step, service_ms)` (the part of the mean latency that is waiting) and `implied_slots(steps, service_ms)` (the
      highest throughput times the service time). The tests use a real step load captured on 21 November 2026 and a fresh run
      against the practice target.
    project: perf
    files:
      - exercises/analysis/bn_knee.py
    test: tests/analysis/test_bn_knee.py
    command: .venv/bin/python -m pytest tests/analysis/test_bn_knee.py
    modelAnswer: |
      ```python
      def find_knee(steps, min_gain=0.10):
          ordered = sorted(steps, key=lambda s: s["clients"])
          for current, following in zip(ordered, ordered[1:]):
              if following["throughput"] < current["throughput"] * (1 + min_gain):
                  return current["clients"]
          return None

      def wait_share(step, service_ms):
          return round(max(0.0, (step["mean_ms"] - service_ms) / step["mean_ms"]), 3)

      def implied_slots(steps, service_ms):
          ceiling = max(s["throughput"] for s in steps)
          return round(ceiling * service_ms / 1000, 1)
      ```

      On the captured steps the knee is 4 clients, the wait share at 16 clients is 0.748, and the ceiling of 191.5 requests per
      second times 20 ms gives 3.8 slots - the pool of 4.
    rubric:
      - Every test in tests/analysis/test_bn_knee.py passes.
      - The steps are sorted by clients, and the knee is the last step that still paid (the next one gained less than min_gain).
      - find_knee returns None when no step saturated or there is a single step.
      - wait_share never goes below 0, and implied_slots uses the highest throughput.
    hints:
      - Sort first - the steps may arrive in any order.
      - Compare each step with the one after it.
      - Throughput is per second and the service time in milliseconds.
    solution: |
      Sort by clients, return the first step whose successor gains less than min_gain; wait share is (mean - service) / mean floored at 0; slots are the best throughput x service seconds.

  - id: laws-code
    type: coding
    concept: perf-bn-laws
    skill: application
    title: Service demands, the bound and the what-if
    prompt: |
      Implement `analysis/bn_laws.py` (seconds per request): `demand(utilization, throughput)`, `bottleneck(demands)`,
      `max_throughput(demands)`, `knee_population(demands, think_s)`, `throughput_bounds(demands, think_s, n)` (a lower and an
      upper bound) and `what_if(demands, name, factor)`, which returns the new bottleneck and ceiling without changing its
      input. The tests use a hypothetical request path and the practice target's measured ceiling.
    project: perf
    files:
      - exercises/analysis/bn_laws.py
    test: tests/analysis/test_bn_laws.py
    command: .venv/bin/python -m pytest tests/analysis/test_bn_laws.py
    modelAnswer: |
      ```python
      def demand(utilization, throughput):
          return utilization / throughput

      def bottleneck(demands):
          top = max(demands.values())
          return min(name for name, d in demands.items() if d == top)

      def max_throughput(demands):
          return 1 / max(demands.values())

      def knee_population(demands, think_s):
          return (sum(demands.values()) + think_s) / max(demands.values())

      def throughput_bounds(demands, think_s, n):
          total = sum(demands.values())
          return n / (n * total + think_s), min(1 / max(demands.values()), n / (total + think_s))

      def what_if(demands, name, factor):
          changed = {**demands, name: demands[name] * factor}
          return bottleneck(changed), max_throughput(changed)
      ```

      For the hypothetical path (4, 12 and 25 ms) the ceiling is 40 requests per second; halving the web demand leaves it
      unchanged, and cutting the database demand to 10 ms moves the bottleneck to the application tier at 83 requests per second.
    rubric:
      - Every test in tests/analysis/test_bn_laws.py passes.
      - The bottleneck is the largest demand, ties going to the first name, and the ceiling is 1 / D_max.
      - The knee population and the throughput bounds follow N* = (D + Z) / D_max and X between N / (N D + Z) and min(1 / D_max, N / (D + Z)).
      - what_if works on a copy and reuses bottleneck and max_throughput.
    hints:
      - D is the sum of the demands in the knee and the bounds.
      - Python's min() over names gives the alphabetical tie-break.
      - 'Build the changed dict with {**demands, name: ...}.'
    solution: |
      One-line formulas for the demand law, the ceiling and the knee; the bounds from the book's two expressions; what_if as a changed copy fed to bottleneck and max_throughput.

placement:
  - id: place-use-red
    type: mcq
    concept: perf-bn-use-red
    skill: application
    title: Which signal is which
    prompt: |
      A report says: "the database connection pool is 100 % utilized and 12 requests are waiting for a connection." Which USE letters are those, and what do they suggest?
    options:
      - id: us
        text: Utilization (100 %) and saturation (12 waiting) - the pool is a likely bottleneck
        feedback: Correct. Busy workers are utilization, requests waiting for one are saturation, and the two together are the classic bottleneck signature.
      - id: ue
        text: Utilization and errors - the pool is failing
        feedback: Nothing in the report is an error count.
      - id: ss
        text: Saturation twice - both numbers measure the queue
        feedback: Utilization is how busy the pool is; saturation is the work waiting beyond it.
      - id: none
        text: Neither - a connection pool is not a USE resource
        feedback: Gregg's page lists thread pools and similar software resources.
    correct: [us]
    solution: |
      100 % busy is utilization, 12 waiting is saturation: a likely bottleneck.

  - id: place-signature
    type: mcq
    concept: perf-bn-signature
    skill: application
    title: Reading a step load
    prompt: |
      A step load (no think time) gives 100, 200, 390, 410 and 405 requests per second at 1, 2, 4, 8 and 16 clients, with the mean latency staying near 10 ms until 4 clients and then growing. Where is the knee?
    options:
      - id: four
        text: At 4 clients - the next step gains about 5 %, less than the 10 % bar
        feedback: Correct. The ceiling is about 400 requests per second, and from 4 clients on the extra clients only wait.
      - id: one
        text: At 1 client - throughput is highest per client there
        feedback: Throughput per client is the same up to the knee; the question is where the total stops growing.
      - id: sixteen
        text: At 16 clients - the last step
        feedback: The last step did not gain anything; the knee is where it stopped paying.
      - id: eight
        text: At 8 clients - the highest throughput
        feedback: The highest throughput is a ceiling reached earlier; the knee is the last step after which the next one does not pay.
    correct: [four]
    solution: |
      From 4 to 8 clients throughput grows by about 5 % (390 to 410): the knee is at 4.

  - id: place-laws
    type: mcq
    concept: perf-bn-laws
    skill: analysis
    title: Which fix pays
    prompt: |
      A request needs 10 ms at the application tier and 30 ms at the database. Which change raises the throughput ceiling most?
    options:
      - id: db
        text: Halving the database demand (to 15 ms) - the ceiling rises from about 33 to 67 requests per second
        feedback: Correct. The database is the bottleneck; at 15 ms the ceiling is 1 / 0.015.
      - id: app
        text: Halving the application demand (to 5 ms)
        feedback: The ceiling stays at 1 / 0.030 - the largest demand is unchanged.
      - id: both
        text: Both are equal - the sum of the demands is what matters
        feedback: The sum bounds the latency of a single request; the ceiling depends on the largest demand.
      - id: neither
        text: Neither - throughput does not depend on service demand
        feedback: 'It does: X <= 1 / D_max.'
    correct: [db]
    solution: |
      Only the bottleneck's demand sets the ceiling: halving the database demand doubles it (33 to 67 requests per second).

recall:
  - id: recall-use
    concept: perf-bn-use-red
    prompt: What does the USE Method ask for every resource?
    answer: Utilization (the average time it was busy), saturation (extra work it cannot service, often a queue length) and errors (a count of error events).
  - id: recall-red
    concept: perf-bn-use-red
    prompt: What are RED and the four golden signals?
    answer: RED = Rate, Errors, Duration, per service. Golden signals = latency, traffic, errors and saturation (RED plus saturation).
  - id: recall-rules
    concept: perf-bn-use-red
    prompt: What are Gregg's reading rules for USE?
    answer: 100 % utilization usually means a bottleneck; beyond about 70 % queueing starts to hurt; any saturation can be a problem; non-zero errors deserve a look; a long-interval average can hide bursts.
  - id: recall-knee
    concept: perf-bn-signature
    prompt: What does a bottleneck look like in a step load with no think time?
    answer: Throughput grows with the clients up to a knee, then flattens at a ceiling; above the knee latency grows in proportion to the clients and the wait share climbs towards 1.
  - id: recall-impostors
    concept: perf-bn-signature
    prompt: Name three look-alikes of a saturated server.
    answer: A load generator that is the limit (flat curve, target quiet), a bounded queue (fast 503s, mean latency can fall) and a policy limit (429).
  - id: recall-demand
    concept: perf-bn-laws
    prompt: How do you get a service demand, and what does it give you?
    answer: D = U / X (utilization over throughput). The largest D is the bottleneck, throughput is at most 1 / D_max, and the knee population is N* = (D + Z) / D_max.
  - id: recall-whatif
    concept: perf-bn-laws
    prompt: What happens if you speed up a resource that is not the bottleneck, and if you speed up the bottleneck?
    answer: Nothing changes for a non-bottleneck. Speeding up the bottleneck raises the ceiling until the next-largest demand becomes the limit - so the bottleneck moves.

