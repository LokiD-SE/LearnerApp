id: performance-testing-mock-interview
title: Performance testing mock interview
subject: performance-testing
module: perf-analysis
level: advanced
status: published
estimatedMinutes: 120
summary: Rehearse the three kinds of question a performance testing interview asks - explain, design and debug - with a fixed method for each. Size a load test with numbers you can say aloud (the peak rate, Little's law for the users, a utilisation target for the workers), check the estimate with a short real run, and debug a suspicious result by checking the run before the application - sample count, load generator health, the load that actually arrived, fast failures that flatter latency, and warm-up. Every number shown was printed by the code shown, from real runs against the SandPay practice API.
tags:
  [
    mock interview,
    performance testing interview,
    load testing interview,
    performance test design,
    back-of-the-envelope estimation,
    Little's law,
    closed model,
    virtual users,
    think time,
    pacing,
    utilisation,
    workload model,
    percentiles,
    result validity,
    load generator saturation,
    fast failures,
    warm-up,
    below plan,
    bottleneck,
    USE method,
    debugging,
  ]

environment: |
  - **Runs:** Linux, Python 3.12.3 in `practice/perf/.venv`, the SandPay practice API (`support/sandpay_target.py`)
    on the loopback interface, started in its own process. Every output in this lesson was printed by
    `practice/perf/support/pmi_demo.py` and by the code shown, on 21 November 2026. The load generator is a small
    closed-model client written for this lesson (`support/pmi_fixture.py`, standard library only): `clients` threads
    that each send a request, wait for the reply, think, and repeat. Timings depend on the machine - the verdicts, not
    the milliseconds, are what transfers.
  - **Captured runs:** the five runs behind the result-smell table were captured once by `support/pmi_capture.py` and
    saved in `support/pmi_data/runs.json`, so the tests give the same verdicts on every machine. The warm-up case in the
    exercises is a hand-made summary, not a measured run; the lesson says so where it is used.
  - **SandPay is fictional.** The practice API, its merchants and the traffic figures (2,000,000 requests a day, a 4x
    peak, 0.25 s response, 3 s think time) were made up for practice. Never point a load test at a system you do not own
    or have written permission to test.
  - **Sources, as documented on 21 November 2026:** Google's *Site Reliability Engineering* book, [chapter 6, "Monitoring
    Distributed Systems"](https://sre.google/sre-book/monitoring-distributed-systems/) (the four golden signals; the
    advice to distinguish the latency of successful and failed requests is quoted) and [chapter 4, "Service Level
    Objectives"](https://sre.google/sre-book/service-level-objectives/) (metrics as distributions, "a simple average can
    obscure these tail latencies"); the [Locust 2.47.0 documentation, "Writing a
    locustfile"](https://docs.locust.io/en/2.47.0/writing-a-locustfile.html) (`wait_time`, `constant_throughput`, the
    500 iterations per second example); the [Apache JMeter component
    reference](https://jmeter.apache.org/usermanual/component_reference.html) (Constant Throughput Timer).
  - **Not repeated here:** Little's law and the open and closed workload models - [Little's law and workload
    models](#/lesson/littles-law-and-workload-models); percentiles - [Performance metrics and
    percentiles](#/lesson/performance-metrics-and-percentiles); warm-up, noise and coordinated omission - [Reading load
    test results honestly](#/lesson/reading-load-test-results); USE and RED - [Bottleneck analysis with the USE and RED
    methods](#/lesson/bottleneck-analysis).
  - **Interview format:** the round types are the ones LearnerApp's interview practice uses. Companies differ; nothing here
    is a real or leaked question from any company. The thresholds in the smell checker (100 samples, 80% generator CPU, a 1%
    error rate, 90% of the planned rate, a first third 1.5 times slower than the last) are this lesson's example policy,
    not a standard.

prerequisites:
  - littles-law-and-workload-models
  - performance-metrics-and-percentiles
  - reading-load-test-results
  - bottleneck-analysis

concepts:
  - id: perf-iv-answer-structure
    name: Answering explain, design and debug questions with a fixed method
    summary: 'Explain questions - definition, mechanism, how it misleads, how you would check it. Design questions - clarify the goal and the traffic, build a workload model, size the load with numbers, order the test types, protect result quality, report headroom. Debug questions - make the comparison fair, check the run before the application, find the resource that limits throughput, confirm by changing one thing, add a regression check. The method shows judgement even when you do not know a detail.'
  - id: perf-iv-sizing
    name: Sizing a load test on a whiteboard and checking it with a run
    summary: 'The peak rate is the daily average times a peak factor. In a closed model the users needed are throughput x (response time + think time), rounded up (Little''s law). The workers needed are the offered load, rate x service time, divided by a utilisation target, rounded up. One user''s pacing interval is users / target rate. A short real run then confirms or breaks the estimate - the measured rate within a tolerance of the prediction, below it (queueing, a slow generator, a longer real response time) or above it (a model input that is too high, or requests failing fast).'
  - id: perf-iv-result-smells
    name: Debugging a suspicious result - check the run before the application
    summary: 'Before arguing about the application, look for run smells in a fixed order - too few samples, a load generator out of CPU, fast failures that flatter the median, a rate below the plan, a slow first third. Each smell has its own next step; a run with a smell is evidence about the test, so rerun it. A generator out of CPU comes before a rate below plan because it explains it. Only a clean run is worth the next question - which resource saturates first.'

objectives:
  - Answer an explain question in four parts - definition, mechanism, how it misleads and how to check it.
  - Run a design round in a fixed order and justify each test type with a requirement or a number.
  - Estimate the peak rate, the virtual users for a closed model, the workers for a utilisation target and the pacing interval.
  - Check an estimate with a short run and read the three outcomes - as predicted, below, above.
  - List the smells that make a load-test result untrustworthy, in priority order, and give the next step for each.
  - Explain why a generator out of CPU is reported before a rate below plan, and why fast failures flatter the median.

sections:
  - id: intuition
    kind: intuition
    concepts: [perf-iv-answer-structure, perf-iv-sizing, perf-iv-result-smells]
    title: The idea in plain language
    body: |
      A performance testing interview is not a quiz on tool menus. The interviewer wants to see how you think when the
      numbers are strange: do you put a figure on the load before you build it, and do you doubt your own result before
      you blame the application?

      Think of a bathroom scale. Before you decide you have gained weight, you check that the scale is on a flat floor,
      that you are not holding something, and that it reads zero when nobody stands on it. A load test needs the same
      habit. A slow result might be the application - or the machine that produced the load was out of CPU, or the run
      was only half a second long, or most requests failed instantly and made the average look wonderful.

      This lesson gives you three checklists - for **explain**, **design** and **debug** questions - and three small
      tools you build yourself: a sizing helper (users, workers, pacing), a check that compares an estimate with a real
      run, and a smell checker that decides whether a result is worth reading at all. Then you rehearse with SandPay's
      checkout.

  - id: what
    kind: what
    concepts: [perf-iv-answer-structure, perf-iv-sizing, perf-iv-result-smells]
    title: Terms you need
    body: |
      | Term | Meaning |
      | --- | --- |
      | **Explain question** | "What is a percentile? What does Little's law say?" |
      | **Design question** | "Plan the performance testing for this release" |
      | **Debug question** | "The p95 doubled / throughput is flat - what do you do?" |
      | **Peak factor** | how many times the daily-average rate the busiest period reaches (a number you take from logs, 1 or more) |
      | **Closed model** | each virtual user waits for its reply, thinks, then sends the next request |
      | **Think time (Z)** | the pause a user takes between getting a reply and the next request |
      | **Utilisation** | the share of a worker's time spent busy - offered load divided by capacity |
      | **Pacing** | the interval between the starts of one user's iterations, used to hold a target rate |
      | **Run smell** | a property of the run (not the application) that makes its numbers untrustworthy |
      | **Generator saturation** | the machine producing the load is out of CPU, memory or network, so the load that arrives is less than planned |
      | **Fast failure** | a failed request that returns quickly (for example HTTP 503 from a full queue) and pulls latency statistics down |
      | **Below plan** | the achieved request rate is clearly lower than the rate the test plan promised |
      | **Warm-up** | the slow start (empty caches, new connections) that should be kept out of the measurement window |

  - id: why
    kind: why
    concepts: [perf-iv-answer-structure, perf-iv-sizing]
    title: Why interviewers care about method more than tool names
    body: |
      Most bad load tests are bad before the first request is sent, and most surprising results are surprising for
      reasons that have nothing to do with the code under test. Good interviewers probe for exactly that experience.

      - **Numbers decide the design.** "How many users?" has an answer you can reach in a minute on a whiteboard:
        the rate at the peak, then Little's law. A candidate who says "a few hundred, I'd try it" shows they have not
        owned a test.
      - **Averages mislead.** Google's SRE book says "Most metrics are better thought of as distributions rather than
        averages" and that "a simple average can obscure these tail latencies, as well as changes in them."
      - **Failures are not fast successes.** The same book, on the latency signal: "It's important to distinguish
        between the latency of successful requests and the latency of failed requests. For example, an HTTP 500 error
        triggered due to loss of connection to a database or other critical backend might be served very quickly;
        however, as an HTTP 500 error indicates a failed request, factoring 500s into your overall latency might result
        in misleading calculations."
      - **A setting is not a result.** A Constant Throughput Timer or a Locust `wait_time` limits the rate; neither raises
        it. JMeter's manual says the throughput "will be lower if the server is not capable of handling it", and Locust's
        documentation says "Wait time can only constrain the throughput, not launch new Users to reach the target."
        Always read the achieved rate.
      - **Say what you do not know.** "I don't remember that property's name, here is how I would find it and test it"
        scores better than an invented detail - the same accuracy rule this app follows.

  - id: method
    kind: steps
    concepts: [perf-iv-answer-structure]
    title: Three checklists - explain, design, debug
    body: |
      **Explain (2-4 minutes)**

      1. **Definition** in one sentence, in plain words.
      2. **Mechanism** - how it works, with one small number.
      3. **How it misleads** - the usual wrong reading (an average, a rate that was only a setting).
      4. **How you would check it** - the run, the metric, the comparison.

      **Design (35-45 minutes)**

      1. **Clarify** the goal (no errors? a percentile under a limit?), the users, the peak, what is changing, the
         environment and the data you may use.
      2. **Workload model** - the endpoint mix and arrival pattern, from access logs or analytics, not from guesses.
      3. **Size it** - peak rate, virtual users or pacing, workers; write the assumptions down.
      4. **Order the tests** - smoke, baseline, load at the expected peak, stress past it, spike, soak - each with the
         question it answers.
      5. **Protect result quality** - generator health, percentiles by request, errors reported separately, system
         metrics beside the load numbers.
      6. **Report** - the knee, the headroom over the expected peak, the risks, the first change to make.
      7. **Keep it** - a pipeline job with a baseline so the result does not rot.

      **Debug (10-15 minutes)**

      1. **Make the comparison fair** - same load, data, environment and window; is the change larger than the noise?
      2. **Check the run first** - samples, generator, errors, the load that arrived, warm-up.
      3. **Find the wait** - which resource is saturated or queueing (USE per resource, RED per endpoint, traces).
      4. **Confirm by changing one thing** - a pool size, a rollback, a flag - and measuring again.
      5. **Add a regression check** so it cannot return unnoticed.

  - id: sizing-internals
    kind: internals
    concepts: [perf-iv-sizing]
    title: Sizing a load test on a whiteboard
    body: |
      SandPay's checkout handles 2,000,000 requests a day. The busiest hour is about four times the daily average.
      A request takes 0.25 s to answer and a shopper thinks for 3 s before the next click; each request needs 0.08 s of
      work on a worker, and you want workers at most 70% busy. These figures are assumptions made up for practice.

      ```python
      from capstone.pmi_sizing import arrival_rate, pacing_interval, throughput_for_users, users_for_throughput, workers_needed

      rate = arrival_rate(2_000_000, peak_factor=4)
      users = users_for_throughput(rate, 0.25, 3.0)
      print(f"peak rate     : {rate:.1f} requests/s")
      print(f"users needed  : {users} (closed model, N = X * (R + Z))")
      print(f"workers       : {workers_needed(rate, 0.08)} at 0.08 s of service time and 70% utilisation")
      print(f"pacing        : one iteration every {pacing_interval(users, rate):.2f} s per user")
      print(f"sanity check  : {throughput_for_users(users, 0.25, 3.0):.1f} requests/s offered")
      ```

      ```plaintext
      peak rate     : 92.6 requests/s
      users needed  : 301 (closed model, N = X * (R + Z))
      workers       : 11 at 0.08 s of service time and 70% utilisation
      pacing        : one iteration every 3.25 s per user
      sanity check  : 92.6 requests/s offered
      ```

      How to say it in the room:

      - "2,000,000 a day is about 23 a second; four times that is 92.6 at the peak."
      - "Each shopper's cycle is 0.25 s waiting plus 3 s thinking - 3.25 s. Little's law: users = throughput x cycle =
        92.6 x 3.25 = 301, rounded up, because you cannot run 300.9 users and rounding down under-delivers."
      - "Each request keeps a worker busy for 0.08 s, so the average load is 92.6 x 0.08 = 7.4 busy workers. At 70%
        utilisation I want 7.4 / 0.7 = 10.6, so 11 workers - the headroom is what keeps queues short."
      - "If I would rather hold the rate than the user count, pacing does it: 301 users, one iteration every 3.25 s each."

      Each number is a lever and each has an assumption behind it. The peak factor comes from logs, the 0.25 s is today's
      response time (and grows under load - see the check below), the think time is a model of real shoppers, and the 70%
      is a policy. Say them aloud; that is the part interviewers listen for.

  - id: validate-internals
    kind: internals
    concepts: [perf-iv-sizing]
    title: Checking the estimate with a short run
    body: |
      An estimate is a prediction, and a prediction needs a test. Here eight closed-model users, each thinking for
      0.05 s, load the practice API whose service time is 20 ms. The plan predicts 8 / (0.02 + 0.05) = 114.3 requests per
      second. The same run is made twice: once with 16 workers on the target, once with a single worker.

      ```python
      plan = throughput_for_users(8, 0.02, 0.05)
      for label, workers in (("16 workers", 16), ("1 worker", 1)):
          with serve_separately(latency_ms=20, capacity=workers) as base:
              run = run_closed(base, 8, 2.5, think_s=0.05)
          by_plan = compare(plan, run["achieved_rps"], tolerance=0.2)
          by_run = compare(throughput_for_users(8, run["mean_ms"] / 1000, 0.05), run["achieved_rps"], tolerance=0.15)
          print(f"{label:10}: measured {run['achieved_rps']:5.1f}/s, mean {run['mean_ms']:5.1f} ms -> plan {by_plan}, measured response {by_run}")
          print(f"            {explain(by_plan)}")
      ```

      ```plaintext
      the plan predicts 114.3 requests/s
      16 workers: measured 110.3/s, mean  22.3 ms -> plan as_predicted, measured response as_predicted
                  The model holds for this run: the response time and think time you assumed are the ones you got.
      1 worker  : measured  47.4/s, mean 113.8 ms -> plan below_prediction, measured response as_predicted
                  Users spent longer waiting than you assumed: the system queued (saturation), the generator is too slow, or the real response time is above the plan.
      ```

      Read it like an interviewer would:

      - With room on the target, the plan is met: the 20 ms the plan assumed is the 22 ms that happened (plain HTTP over
        loopback adds a little).
      - With one worker, the eight users queue behind each other. The mean response time is 113.8 ms, not 20 ms, so the
        users spend longer per cycle and the rate falls to 47.4 - **below the prediction**. The model is not wrong: plug in
        the response time that was measured (113.8 ms) and Little's law predicts the measured rate again
        (`measured response as_predicted`). What was wrong was the premise - the plan's response time.
      - So the three verdicts point somewhere different. *As predicted* - the premises hold. *Below* - users waited longer
        than assumed (queueing, a slow generator, a real response time above the plan). *Above* - users cycled faster than
        assumed (think time or response time too high in the model, or requests failing fast).

  - id: smells-internals
    kind: internals
    concepts: [perf-iv-result-smells]
    title: Is this result worth reading? Five run smells
    body: |
      Five real runs were captured against the practice API (`pmi_capture.py`) and summarised. The checker reads one
      summary at a time and returns the smells it finds, most important first:

      ```python
      for name, run in load_runs().items():
          found = smells(run)
          print(f"{name:15} samples={run['samples']:5} errors={run['errors']:5} rps={run['achieved_rps']:6.1f} "
                f"plan={run['planned_rps']} cpu={run['generator_cpu_pct']} -> {found or 'none'} {verdict(found)}")
      print("advice for slow_generator:", next_step(smells(load_runs()["slow_generator"])))
      print("advice for fast_failures :", next_step(smells(load_runs()["fast_failures"])))
      ```

      ```plaintext
      healthy         samples=  448 errors=    0 rps= 110.6 plan=114.3 cpu=7.0 -> none trust
      too_short       samples=   12 errors=    0 rps=  27.7 plan=28.6 cpu=2.0 -> ['too_few_samples'] rerun
      slow_generator  samples=  225 errors=    0 rps=  54.9 plan=114.3 cpu=87.0 -> ['generator_saturated', 'below_plan'] rerun
      below_plan      samples=  392 errors=    0 rps=  96.2 plan=200.0 cpu=6.0 -> ['below_plan'] rerun
      fast_failures   samples= 1121 errors=  855 rps= 372.3 plan=None cpu=20.0 -> ['fast_failures_flatter_latency'] rerun
      advice for slow_generator: The load generator is out of CPU: add generator machines or lighten the script, then rerun.
      advice for fast_failures : Failures return fast and pull the median down: report latency for successes separately and fix the errors before reading any latency number.
      ```

      What each row teaches:

      - `healthy` - 448 samples, no errors, 110.6 requests per second against a plan of 114.3, the generator at 7% CPU.
        No smell: now the percentiles are worth reading.
      - `too_short` - half a second, 12 samples. A p95 of 12 samples is the second-slowest request; any number is noise.
      - `slow_generator` - the run delivered 54.9 requests per second against 114.3 planned, with response times that
        looked acceptable. The generator process was at 87% CPU. The application was never asked for more. Both
        `generator_saturated` and `below_plan` fire; the first is reported first because it **explains** the second.
      - `below_plan` - the target had two workers for eight users and a plan of 200 requests per second; it delivered 96.2
        with the generator at 6% CPU. This one is real: the system queued, so look for saturation.
      - `fast_failures` - 855 of 1,121 requests failed, all of them HTTP 503 from a full queue. The median of the whole
        run was 1.1 ms while successful requests took 21.4 ms. A report that quotes "median 1.1 ms" is wrong in a way the
        SRE book warns about.

      A run with a smell is not a verdict on the application. It is a note to fix the test and rerun.

  - id: visual
    kind: visual
    concepts: [perf-iv-result-smells, perf-iv-answer-structure]
    title: The order of questions for a suspicious result
    body: |
      ```mermaid
      flowchart TD
        A["result looks odd"] --> B{"enough samples?"}
        B -- "no" --> R1["too_few_samples: run longer"]
        B -- "yes" --> C{"generator below 80% CPU?"}
        C -- "no" --> R2["generator_saturated: fix the test, rerun"]
        C -- "yes" --> D{"failures fast and many?"}
        D -- "yes" --> R3["report successes separately, fix errors"]
        D -- "no" --> E{"rate near the plan?"}
        E -- "no" --> R4["below_plan: look for saturation"]
        E -- "yes" --> F{"first third much slower?"}
        F -- "yes" --> R5["warm-up: choose the window"]
        F -- "no" --> OK["trust the run: find the limiting resource"]
      ```

      The order is the priority order of the code: too little data makes everything else noise; a generator out of CPU
      explains a rate below plan; failures must be separated before any latency is read; a rate below plan is only
      interesting once the generator is cleared; and warm-up is the last thing you subtract before you compare runs.

  - id: smells-code
    kind: code
    concepts: [perf-iv-result-smells]
    title: The smell checker
    collapsed: true
    body: |
      From `practice/perf/solutions/capstone/pmi_smells.py`:

      ```python
      MIN_SAMPLES = 100
      GENERATOR_CPU_PCT = 80.0
      ERROR_RATE = 0.01
      FLATTER_RATIO = 0.5
      BELOW_PLAN = 0.9
      WARMUP_RATIO = 1.5

      #: Checked in this order. A generator that is out of CPU explains a rate below the plan, so it comes first;
      #: a run too short to measure anything comes before everything, because every other number is noise.
      PRIORITY = ("too_few_samples", "generator_saturated", "fast_failures_flatter_latency", "below_plan",
                  "warmup_included")

      ADVICE = {
          "too_few_samples": "Run longer or with more load: under %d samples a percentile is a guess." % MIN_SAMPLES,
          "generator_saturated": "The load generator is out of CPU: add generator machines or lighten the script, then rerun.",
          "fast_failures_flatter_latency": "Failures return fast and pull the median down: report latency for successes "
                                           "separately and fix the errors before reading any latency number.",
          "below_plan": "The system could not take the planned rate: look for saturation (queues, pools, CPU) "
                        "or an open/closed model mismatch.",
          "warmup_included": "The first third is much slower than the last: cut the warm-up from the measurement "
                             "window or lengthen the run.",
      }

      REQUIRED = ("samples", "errors", "duration_s", "achieved_rps", "p50_all_ms", "p50_ok_ms", "first_third_p95_ms",
                  "last_third_p95_ms")


      def smells(summary: dict) -> list[str]:
          """The smells found in one run summary, most important first. An empty list means no smell was found."""
          missing = [k for k in REQUIRED if k not in summary]
          if missing:
              raise ValueError(f"summary is missing: {', '.join(missing)}")
          found = set()
          n = summary["samples"]
          if n < MIN_SAMPLES:
              found.add("too_few_samples")
          cpu = summary.get("generator_cpu_pct")
          if cpu is not None and cpu >= GENERATOR_CPU_PCT:
              found.add("generator_saturated")
          if n and summary["errors"] / n > ERROR_RATE and summary["p50_all_ms"] < FLATTER_RATIO * summary["p50_ok_ms"]:
              found.add("fast_failures_flatter_latency")
          planned = summary.get("planned_rps")
          if planned and summary["achieved_rps"] < BELOW_PLAN * planned:
              found.add("below_plan")
          if summary["last_third_p95_ms"] > 0 and summary["first_third_p95_ms"] > WARMUP_RATIO * summary["last_third_p95_ms"]:
              found.add("warmup_included")
          return [s for s in PRIORITY if s in found]


      def verdict(found: list[str]) -> str:
          """``trust`` when nothing smelled, otherwise ``rerun``: a run with a smell is evidence about the test."""
          return "rerun" if found else "trust"


      def next_step(found: list[str]) -> str:
          """The advice for the first (highest-priority) smell."""
          if not found:
              return "No smell found: read the percentiles, then compare with the baseline."
          return ADVICE[found[0]]
      ```

  - id: line-by-line
    kind: line-by-line
    concepts: [perf-iv-result-smells, perf-iv-sizing]
    title: Why the important lines are written that way
    body: |
      - `PRIORITY = (...)` - the order is a design decision, not a detail. A summary with several smells reports the
        first one, because the later ones are often consequences (a saturated generator causes a rate below plan).
      - `found` is a set and the return value is `[s for s in PRIORITY if s in found]` - rules can fire in any order, the
        report order is always the same.
      - `cpu is not None` - a generator CPU that was not measured is not evidence of a healthy generator. The checker does
        not raise a smell for "unknown", but a good report says which things were not checked.
      - `summary["errors"] / n > ERROR_RATE and p50_all < FLATTER_RATIO * p50_ok` - many errors alone are a problem, not a
        flattering one. The smell fires only when failures were also **faster** than successes, because only then is the
        median pulled down. The test `test_many_errors_that_are_not_faster_do_not_flatter` pins that.
      - `if planned and ...` - a run with no plan cannot be below plan. `fast_failures` has `planned_rps=None` on purpose.
      - `ValueError` for a missing key - a summary without `samples` or `errors` should stop the checker, not pass as clean.
      - In the sizing helper, `users_for_throughput` rounds **up** with `math.ceil`, `arrival_rate` rejects a peak factor
        below 1 (a peak is never below the average), and `throughput_for_users` rejects a cycle time of zero - with no
        waiting at all the rate is unbounded, and a function that returned infinity would be a bug waiting to happen.

  - id: choose-test
    kind: when
    concepts: [perf-iv-answer-structure, perf-iv-sizing]
    title: Choosing the test and the model - the question decides
    body: |
      | If the question is... | Run | Load model | Read |
      | --- | --- | --- | --- |
      | "does the script and the environment work?" | a smoke test, a few users for a minute | closed is fine | errors and the response codes |
      | "what is normal today?" | a baseline at today's load | closed or paced | percentiles by request, the achieved rate |
      | "can we take the expected peak?" | a load test held past warm-up | an arrival rate (paced or open) when the target is a rate | percentiles, error rate, headroom |
      | "where does it break and how?" | a stress test, stepping up | stepped users or rate | the knee, the first saturated resource, recovery |
      | "what if traffic jumps?" | a spike test | an abrupt step | errors and recovery time |
      | "does it degrade over hours?" | a soak test at normal load | steady | memory, connections, disk, drift over time |

      The model matters because a closed test eases off when the server slows down - each user waits for its reply, so the
      test sends fewer requests exactly when the system struggles. When the requirement is an arrival rate ("300 requests a
      second at the sale peak"), pace the load or use an open model, and check the **achieved** rate. [Little's law and
      workload models](#/lesson/littles-law-and-workload-models) shows the same server slowing tenfold under both models.
      Tool settings do not change that: JMeter's Constant Throughput Timer and Locust's `constant_throughput` hold a rate
      **down**; neither makes a slow server go faster or starts more users.

  - id: example
    kind: example
    concepts: [perf-iv-answer-structure, perf-iv-sizing, perf-iv-result-smells]
    title: "A mock design round: the SandPay sale"
    body: |
      **Interviewer:** "SandPay's merchants run a big sale in three weeks and expect three times the usual checkout
      traffic. Plan the performance testing."

      **Candidate (clarify, 4 min):** "What is the goal - no errors, p95 under a limit? Today's peak rate and the endpoint
      mix? Is the sale traffic mostly checkout, or browsing? What is changing in the release? Which environment may I use
      and with what data?" *Interviewer: p95 under 800 ms and under 0.1% errors at three times today's peak; a staging
      environment sized at half of production; synthetic data.*

      **Workload model (4 min):** "From the access logs I would take the endpoint mix and the arrival pattern of the busiest
      hour - say 30 reads for every payment creation, with a sharp rise when a sale opens. For shoppers I would model think
      time from analytics, not guess it."

      **Sizing (5 min):** "Say today's peak is 31 requests a second; three times is 93 a second. In a closed model with a
      0.25 s response and 3 s of thinking that is about 300 users, and I would check the achieved rate in a short run, because
      the response time grows under load. Staging is half of production, so I would not read headroom off it directly - I
      would test whether it scales and then extrapolate with care." *(These figures are the lesson's assumptions.)*

      **Tests in order (8 min):** "A smoke run to prove the script. A baseline at today's load. A load test at 93 a second held
      past warm-up. A stress test, stepping up, to find the knee and see how it fails - errors, queues, recovery. A spike for
      the moment the sale opens. A soak at normal load for leaks."

      **Payment traps (4 min):** "A unique idempotency key per payment - a fixed key measures cached replays. A retry scenario
      to see that a timeout followed by a retry with the same key does not create two payments. Rate limits will answer 429, so
      I report them apart from errors. A reconciliation after the run - payments created against payments confirmed."

      **Result quality (4 min):** "Percentiles per endpoint, errors reported separately, the generator's CPU and network on
      the same dashboard, and system metrics - USE per resource, RED per endpoint - so a slow result comes with a cause. A
      run with a smell is rerun, not reported."

      **Report and keep (3 min):** "The knee, the headroom over 93 a second, the risks and the first change I would make; then
      the test goes into the pipeline with a baseline."

      What the interviewer heard: a goal, a model from data, numbers with assumptions, the test types in a reasoned order, the
      payment-specific traps, and a refusal to trust a result before checking the run.

  - id: tests
    kind: tests
    concepts: [perf-iv-sizing, perf-iv-result-smells]
    title: Tests you would promise for your own estimator and checker
    body: |
      | Case | Steps | Expected | Evidence |
      | --- | --- | --- | --- |
      | Peak below average | `arrival_rate(1000, peak_factor=0.5)` | `ValueError` - a peak is never below the average | the exception |
      | Round up | `users_for_throughput(10, 0.22, 1.0)` | 13, not 12 | the return value |
      | No waiting at all | `throughput_for_users(5, 0, 0)` | `ValueError`, not infinity | the exception |
      | Estimate and run agree | 8 users, 16 workers, the measured mean response in the formula | `as_predicted` within 15% | `run_closed` summary and `compare` |
      | Estimate and plan disagree | the same users with one worker, the planned response in the formula | `below_prediction` | the same run |
      | Healthy run | `smells` on the captured healthy run | an empty list | `runs.json` |
      | Generator before rate | `smells` on the slow-generator run | `generator_saturated`, then `below_plan` | the order of the list |
      | Boundary | 100 samples, 79.9% CPU, 90% of plan, a first third 1.5 times the last | no smell | the empty list |
      | One step over | 99 samples, 80% CPU, 89.9% of plan | one smell each | the lists |
      | Errors that are not faster | 200 errors with equal medians | no flattering smell | the empty list |
      | Missing key | a summary without `errors` | `ValueError` naming `errors` | the exception message |

  - id: mistakes
    kind: mistakes
    concepts: [perf-iv-answer-structure, perf-iv-sizing, perf-iv-result-smells]
    title: Common mistakes and how to recover
    body: |
      - **No numbers.** "A few hundred users" is not an answer. Do the arithmetic aloud and state the assumptions.
      - **Forgetting think time.** Users = throughput x response time counts only the users inside the server. With think
        time it is throughput x (response time + think time). Recover with "let me redo that with the whole cycle".
      - **Rounding down.** 12.2 users or workers is 13. Rounding down under-provisions exactly at the peak.
      - **Sizing for the average.** The test must offer the peak rate; the daily average is a long way below it.
      - **Treating a setting as a result.** A timer or `wait_time` at 600 per minute does not mean 600 per minute happened.
        Read the achieved rate in the results.
      - **One average.** Quote percentiles and the error rate. "Average 180 ms" can hide a tail that users feel.
      - **Counting failures as fast successes.** A failed request can be very quick; report latency for successes
        separately, and the error rate first.
      - **Blaming the application first.** A generator at 90% CPU, a run of a few hundred milliseconds or a first third full of
        warm-up produce strange numbers with no application defect. Check the run, then the system.
      - **Changing two things at once.** To confirm a bottleneck, change one variable (a pool size, a rollback) and measure
        again; otherwise you cannot say which change mattered.
      - **Reading too much into one run.** One run is a sample. Compare against a baseline with a noise estimate - see
        [Performance testing in CI/CD](#/lesson/performance-testing-in-ci-cd).

      **Debugging method for the debug round:** fair comparison, check the run, find the wait, change one thing, add a
      regression check.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [perf-iv-answer-structure, perf-iv-sizing, perf-iv-result-smells]
    title: Trade-offs and limits of this method
    body: |
      - **Breadth versus depth.** The design checklist covers everything thinly; interviewers often want one deep dive.
        Offer one ("I can go deeper on workload modelling or on diagnosing a knee") and follow their lead.
      - **The closed formula is an average.** N = X x (R + Z) gives the average user count for a steady state. Real
        shoppers arrive in bursts; for a rate target, pace or use an open model and check the achieved rate.
      - **The checker's thresholds are a policy.** 100 samples, 80% CPU, 1% errors, 90% of plan and a 1.5 times first third
        are this lesson's example values. Real teams set them from their own noise (see the CI/CD lesson) and from how
        expensive a rerun is.
      - **A smell is not a proof.** A saturated generator does not prove the application is fine; it means the run cannot
        tell. Rerun with a healthy generator before concluding anything either way.
      - **Generator CPU measured in-process is crude.** The fixture reads the process's own CPU time; a real test would watch the
        machine (and its network) from outside, and would run several generators for a big load.
      - **Fixed methods can sound scripted.** Use the checklist to structure your thinking, not as a recitation.

  - id: summary
    kind: summary
    concepts: [perf-iv-answer-structure, perf-iv-sizing, perf-iv-result-smells]
    title: Quick reference
    body: |
      - Explain - definition, mechanism, how it misleads, how you would check it.
      - Design - clarify, workload model, size it, order the tests, protect result quality, report, keep it in the pipeline.
      - Debug - fair comparison, check the run, find the wait, change one thing, add a regression check.
      - Peak rate = requests per day / 86,400 x peak factor. Users (closed) = rate x (response time + think time), round up.
        Workers = rate x service time / utilisation target, round up. Pacing interval = users / rate.
      - An estimate is a prediction: check it with a short run - as predicted, below (waiting longer than assumed) or above
        (cycling faster than assumed).
      - Run smells in order - too few samples, generator saturated, fast failures flatter latency, below plan, warm-up
        included. A run with a smell is rerun, not reported.
      - Timers and `wait_time` hold a rate down; they never raise it. Read the achieved rate.
      - Averages hide tails; failures are not fast successes. Say "assumed" and "I would check" when you are unsure.

exercises:
  - id: explain-opening
    type: mcq
    concept: perf-iv-answer-structure
    skill: application
    title: Opening an explain answer
    prompt: |
      The interviewer asks: "Explain what p95 means." Which opening best follows the explain checklist?
    options:
      - id: definition-then-example
        text: '"It is the response time that 95% of requests beat - if p95 is 800 ms, one request in twenty took longer. An average blends them, so a long tail can grow without moving it..."'
        feedback: Correct - a plain definition, then a concrete number and the way the common alternative misleads, leaving room to say how you would check it.
      - id: formula-first
        text: '"Sort all response times and take the value at index 0.95 x n, with interpolation depending on the method..."'
        feedback: Precise, but the interviewer waits for the point; start with what it means for a request, then the method.
      - id: tool-first
        text: '"JMeter shows it in the Aggregate Report."'
        feedback: A place to find a number is not an explanation of it, and it invites follow-ups you have not prepared.
      - id: average
        text: '"It is basically the average but a bit higher."'
        feedback: That is wrong - a percentile is a position in the sorted list, not an average.
    correct: [definition-then-example]
    hints:
      - The checklist has four parts. Which comes first?
    solution: |
      Definition in plain words with a number, then the mechanism and how it misleads, then how you would check it.

  - id: users-for-peak
    type: mcq
    concept: perf-iv-sizing
    skill: application
    title: Users for the peak
    prompt: |
      A service handles 864,000 requests a day with a 3x peak. A closed-model shopper waits 0.4 s for a reply and thinks
      for 1.6 s. How many virtual users do you plan for?
    options:
      - id: u60
        text: 60 - the peak is 30 requests per second, and the cycle is 2.0 s, so 30 x 2.0.
        feedback: Correct - 864,000 / 86,400 = 10 per second on average, 30 at the peak, and users = 30 x (0.4 + 1.6) = 60.
      - id: u12
        text: 12 - 30 x 0.4.
        feedback: That counts only the users waiting for a reply; the thinking users are part of the test too.
      - id: u20
        text: 20 - 10 x 2.0.
        feedback: That sizes the average, not the peak.
      - id: u180
        text: 180 - 30 x 6.
        feedback: There is no factor of 6 anywhere; check the units and the cycle time.
    correct: [u60]
    hints:
      - Per day to per second, then the peak, then multiply by the whole cycle.
    solution: |
      10 per second on average, 30 at the 3x peak, 2.0 s per cycle: 60 users. See [Little's law and workload
      models](#/lesson/littles-law-and-workload-models).

  - id: workers-for-load
    type: mcq
    concept: perf-iv-sizing
    skill: application
    title: Workers at 70% utilisation
    prompt: |
      Requests arrive at 100 per second and each keeps a worker busy for 0.05 s. You want workers at most 70% busy. How
      many workers?
    options:
      - id: w8
        text: 8 - the load is 5 busy workers on average, and 5 / 0.7 = 7.1, rounded up.
        feedback: Correct - the headroom keeps queues short, and you round up because a fraction of a worker does not exist.
      - id: w5
        text: 5 - the average load.
        feedback: At 5 workers every one is busy all the time (100% utilisation) and queues grow at every burst.
      - id: w7
        text: 7 - 5 / 0.7 rounded down.
        feedback: Rounding down leaves utilisation above the 70% target.
      - id: w14
        text: 14 - double the average plus a margin.
        feedback: Not derived from anything; say the number from the target utilisation instead.
    correct: [w8]
    hints:
      - Offered load = rate x service time. Divide by the target utilisation.
    solution: |
      100 x 0.05 = 5 busy workers; 5 / 0.7 = 7.14; round up to 8.

  - id: estimate-below
    type: mcq
    concept: perf-iv-sizing
    skill: analysis
    title: The estimate says 114, the run says 47
    prompt: |
      Eight closed-model users with 0.05 s think time against a 20 ms service were planned at 114 requests per second. The
      run delivers 47 with a mean response time of 114 ms, and the load generator is idle. What is the most likely cause?
    options:
      - id: queueing
        text: The target queues - it has too few workers for eight users, so each user waits longer than the 20 ms the plan assumed. Little's law with the measured response time predicts the measured rate.
        feedback: Correct - the model holds; the plan's response-time premise was wrong, and the mean response time is the evidence.
      - id: generator
        text: The load generator is saturated.
        feedback: The generator is idle, which rules this out.
      - id: think
        text: The think time was set to zero.
        feedback: Zero think time would raise the rate, not lower it.
      - id: wrong-law
        text: Little's law does not apply to closed models.
        feedback: It applies to any stable system, including a closed loop, which is how the user count was derived.
    correct: [queueing]
    hints:
      - Plug the measured response time into N / (R + Z).
    solution: |
      8 / (0.114 + 0.05) = 48.8 requests per second, close to the 47 measured: the response time was the problem, so look for
      saturation on the target.

  - id: generator-first
    type: mcq
    concept: perf-iv-result-smells
    skill: analysis
    title: Which smell comes first?
    prompt: |
      A run delivered 55 requests per second against a plan of 114, with the generator at 87% CPU. Both `generator_saturated`
      and `below_plan` apply. Which do you report first, and why?
    options:
      - id: generator-first
        text: generator_saturated - it explains the low rate, so the application was never asked for the planned load; fix the test and rerun.
        feedback: Correct - reporting below_plan first would send the team looking for a bottleneck that is in the test machine.
      - id: below-first
        text: below_plan - the rate is the headline number.
        feedback: The rate is the symptom; the generator is the cause you can already see.
      - id: both
        text: Neither - the run is valid because response times were acceptable.
        feedback: Acceptable response times of the few requests that arrived say nothing about the load that did not.
      - id: app
        text: Open a defect against the application.
        feedback: Nothing here points at the application yet.
    correct: [generator-first]
    hints:
      - Which of the two could be the consequence of the other?
    solution: |
      The generator first. Priority follows cause before effect, and a run with a smell is rerun.

  - id: fast-failures
    type: mcq
    concept: perf-iv-result-smells
    skill: analysis
    title: Median 1 ms under stress
    prompt: |
      In a stress run 76% of the requests failed with HTTP 503 and the median of the whole run is 1.1 ms; successful
      requests took 21.4 ms. What should the report say?
    options:
      - id: separate
        text: The error rate first, then latency for successful requests separately - the 1.1 ms is mostly the time it takes the server to say it is busy.
        feedback: Correct - a failed request can be quick, and counting it in overall latency gives misleading numbers.
      - id: improved
        text: Latency improved under stress - median 1.1 ms.
        feedback: The rejected requests did no work; they say nothing about how fast a payment is created.
      - id: p99
        text: Quote only the p99 of the whole run.
        feedback: That still mixes failures with successes.
      - id: drop
        text: Drop the failed requests from the data and report the rest as the result.
        feedback: Dropping them silently hides the most important fact of the run.
    correct: [separate]
    hints:
      - What does a 503 from a full queue cost the server?
    solution: |
      Error rate first, latency of successes separately. Source - Google SRE book, "Monitoring Distributed Systems", the latency
      signal.

  - id: warm-up-window
    type: mcq
    concept: perf-iv-result-smells
    skill: application
    title: The slow first third
    prompt: |
      A ten-minute run's first third has a p95 of 120 ms and its last third 30 ms, and the cause is warm-up. How do you handle
      the result?
    options:
      - id: window
        text: Report the steady-state window after the warm-up, state its start, and keep the whole timeline visible.
        feedback: Correct - the comparison needs steady state and a reader needs to see what you cut.
      - id: average
        text: Report the average of the thirds.
        feedback: That blends two behaviours into a number that describes neither.
      - id: hide
        text: Cut the first third silently.
        feedback: Silent cuts make the result impossible to audit.
      - id: fail
        text: Fail the run and ask for a faster application.
        feedback: A warm-up is not a defect in the application; it is a property of the first minutes of any run.
    correct: [window]
    hints:
      - What would a reader need to reproduce your number?
    solution: |
      Steady-state window, stated, with the timeline shown. See [Reading load test results honestly](#/lesson/reading-load-test-results).

  - id: timer-setting
    type: mcq
    concept: perf-iv-answer-structure
    skill: recall
    title: A throughput setting
    prompt: |
      A JMeter Constant Throughput Timer is set to 600 samples per minute but the server handles only 400. What rate does the
      test achieve, and what do you check?
    options:
      - id: lower
        text: About 400. The timer only adds pauses to hold a rate down; check the achieved throughput in the results, not the setting.
        feedback: Correct - the manual says the throughput "will be lower if the server is not capable of handling it".
      - id: target
        text: 600, because the timer enforces it.
        feedback: The timer cannot make a server answer faster or add threads.
      - id: error
        text: The test fails with an error.
        feedback: JMeter simply produces less load; it does not stop.
      - id: more
        text: More than 600 to catch up.
        feedback: The timer never exceeds its target.
    correct: [lower]
    hints:
      - The timer adds pauses. Can pauses make anything faster?
    solution: |
      The achieved rate is what the results show. Source - Apache JMeter component reference, Constant Throughput Timer.

  - id: locust-users
    type: mcq
    concept: perf-iv-sizing
    skill: application
    title: Locust, 500 iterations per second
    prompt: |
      You want 500 task iterations per second at peak with Locust and `wait_time = constant_throughput(0.1)`. How many users
      do you start?
    options:
      - id: u5000
        text: 5000 - each user runs at most 0.1 iterations per second, so 500 / 0.1; the rate is lower if an iteration takes longer than 10 s.
        feedback: Correct - this is the worked example in Locust's documentation; the wait time cannot start more users.
      - id: u50
        text: '50 users.'
        feedback: That divides by 10 instead of 0.1.
      - id: u500
        text: '500 users.'
        feedback: That would be right for constant_throughput(1).
      - id: any
        text: Any number - Locust adds users until it reaches the rate.
        feedback: Locust does not launch users to reach a target.
    correct: [u5000]
    hints:
      - How often does one user run an iteration at 0.1 per second?
    solution: |
      5000 users x 0.1 = 500 iterations per second at most. Source - Locust 2.47 documentation, "Writing a locustfile".

  - id: design-order
    type: mcq
    concept: perf-iv-answer-structure
    skill: application
    title: The first design move
    prompt: |
      "Plan the performance testing for the new refund API." After the clarifying questions, what do you propose first?
    options:
      - id: workload-model
        text: A workload model from production data (the endpoint mix, arrival pattern and think time), then sizing from it.
        feedback: Correct - the model decides what to script and what rate to offer; without it every later number is a guess.
      - id: stress
        text: A stress test to find the breaking point.
        feedback: Possibly later, but without a model of normal traffic you cannot interpret where it breaks.
      - id: tool
        text: Choose JMeter or Locust.
        feedback: The tool follows the plan; choosing it first answers no question.
      - id: environment
        text: Ask for a production-sized environment and wait for it.
        feedback: Ask, yes - but the model and sizing can start now, and the environment question belongs to clarifying.
    correct: [workload-model]
    hints:
      - What do you need before you can say how many users or what rate?
    solution: |
      Clarify, then build the workload model, then size, then order the test types.

  - id: design-round-order
    type: order
    concept: perf-iv-answer-structure
    skill: recall
    title: The design round, in order
    prompt: Put the steps of a performance test design answer in order.
    items:
      - id: clarify
        text: Clarify the goal, the traffic, what is changing, the environment and the data
      - id: model
        text: Build the workload model from logs or analytics
      - id: size
        text: Size it - peak rate, users or pacing, workers - and write the assumptions down
      - id: order-tests
        text: Order the tests - smoke, baseline, load, stress, spike, soak
      - id: quality
        text: Protect result quality - generator health, percentiles, errors separate, system metrics
      - id: report
        text: Report the knee, the headroom and the risks
      - id: keep
        text: Keep the test in the pipeline with a baseline
    hints:
      - You cannot size what you have not modelled, nor model before you know the goal.
    solution: |
      Clarify, model, size, order the tests, protect result quality, report, keep. Interviewers may jump ahead; answer, then
      return to the order.

  - id: sizing-debug
    type: debug
    concept: perf-iv-sizing
    skill: analysis
    title: A sizing helper that under-delivers
    prompt: |
      This helper planned 12 users for a checkout test; at the sale peak the test offered a fraction of the intended rate.
      Click **every** line that makes the estimate too low.
    language: python
    code: |
      import math

      def users_needed(requests_per_day, response_s, think_s, peak_factor=4):
          per_second = requests_per_day / 86_400
          users = per_second * response_s
          return math.floor(users)
    correctLines: [5, 6]
    lineNotes:
      - line: 4
        note: Converting per day to per second with 86,400 is right.
      - line: 3
        note: The default peak factor is reasonable; the bug is that it is never used.
    hints:
      - Are `peak_factor` and `think_s` used anywhere?
      - What happens to 12.2 users?
    solution: |
      Line 5 ignores `peak_factor` and `think_s` - it sizes the daily average and only the users inside the server; line 6 rounds
      down. Use `per_second * peak_factor * (response_s + think_s)` and `math.ceil`.

  - id: explain-littles-law
    type: short
    concept: perf-iv-sizing
    skill: application
    title: Explain Little's law with a number
    prompt: |
      Explain Little's law and use it once: 120 requests per second arrive and each spends 0.5 s in the system - how many are
      inside?
    modelAnswer: |
      Little's law says that the average number of items in a stable system equals their arrival rate times the average time
      each spends in it: L = lambda x W. Here 120 x 0.5 = 60 requests are inside on average, so the service needs at least
      60 concurrent slots or it queues. I use it two ways: to size a test (users = throughput x (response time + think time)
      for a closed model) and to check a run, because if a run's numbers do not satisfy it my measurement window or counting
      is wrong.
    rubric:
      - States the law correctly (items = arrival rate x time in system).
      - Computes 60 for the example.
      - Uses it for sizing or for checking a run.
      - Adds the closed-model form with think time.
    hints:
      - Rate times time.
    solution: |
      L = lambda x W gives 60; use it to size users and slots and to sanity-check a result. See [Little's law and workload
      models](#/lesson/littles-law-and-workload-models).

  - id: release-testdesign
    type: testdesign
    concept: perf-iv-result-smells
    skill: application
    title: Acceptance tests for a load-test report
    prompt: |
      Before a load-test report goes to the release board, design the checks you would run on the **run itself**. Give
      preconditions, steps, expected results and evidence for each.
    modelAnswer: |
      Preconditions - the raw results, the test plan with its planned rate, the generator's CPU and network history, and the
      baseline of recent runs.

      1. **Sample count** - count the samples per request in the measurement window. Expected - enough for the highest
         percentile reported (at least a few hundred for a p95, more for a p99). Evidence - the counts.
      2. **Generator health** - read the generator's CPU and network over the run. Expected - below the agreed limit (for
         example 80% CPU). Evidence - the generator dashboard.
      3. **Achieved against planned rate** - compare. Expected - within a few percent, or an explanation. Evidence - the
         achieved-rate series next to the plan.
      4. **Errors** - report the error rate first and latency for successes separately. Expected - latency for successes only,
         with fast failures called out. Evidence - the split table.
      5. **Warm-up** - plot percentiles over time. Expected - the window starts after warm-up and says so. Evidence - the
         time series with the window marked.
      6. **Noise** - compare with the baseline's spread. Expected - differences larger than the noise. Evidence - baseline
         median and spread.
      7. **Reproducibility** - environment, data and version recorded. Expected - another person can rerun it. Evidence - the
         run record.
    rubric:
      - Each case has preconditions, steps, expected result and concrete evidence.
      - Covers sample count, generator health, achieved against planned rate, errors and warm-up.
      - Compares with a baseline noise estimate.
      - Records what is needed to reproduce the run.
    hints:
      - Think of the five smells, then noise and reproducibility.
    solution: |
      Checks on the run before the report: samples, generator, achieved rate, errors, warm-up, noise and reproducibility - each with
      evidence you could attach.

  - id: interview-sale
    type: interview
    concept: perf-iv-answer-structure
    skill: analysis
    title: 'Interview: plan the testing for a sale'
    prompt: |
      "SandPay's merchants expect three times the usual checkout traffic during a sale in three weeks. Plan the performance
      testing and tell me how many virtual users you would run."
    modelAnswer: |
      I would clarify the goal (for example p95 under a limit and an error budget at three times today's peak), what today's peak
      rate and endpoint mix are, what is changing, and which environment and data I may use. From access logs I would build a
      workload model and size the load: if today's peak is 31 requests per second, three times is 93; with a 0.25 s response time
      and 3 s of think time a closed model needs 93 x 3.25, about 300 users - I would state those as assumptions and check the
      achieved rate in a short run.

      Tests in order: smoke, baseline, load at the expected peak held past warm-up, stress to find the knee and the way it fails,
      spike for the sale opening, soak for leaks. For payments I use a unique idempotency key per payment, a retry scenario, rate
      limits reported apart from errors and a reconciliation after the run. I protect the result - generator health, percentiles by
      request, errors separate, system metrics - and rerun any run with a smell. The report gives the knee, the headroom and the
      risks, and the test goes into the pipeline with a baseline.
    rubric:
      - Clarifies the goal, traffic, environment and data.
      - Sizes the load with stated assumptions and arithmetic (about 300 users for the example).
      - Orders the test types with reasons.
      - Covers payment traps and result quality.
    followUps:
      - Staging is half the size of production - what can you conclude?
      - What would make you stop a run?
    hints:
      - Follow the design checklist out loud.
    solution: |
      Goal, workload model, sizing with assumptions, test types in order, payment traps, result quality, report and pipeline.

  - id: interview-flat-throughput
    type: interview
    concept: perf-iv-result-smells
    skill: analysis
    title: 'Interview: the run that does not add up'
    prompt: |
      "A colleague's load test shows a p95 of 90 ms and an average of 40 ms, and says the API is fine at 200 users. The planned
      rate was 120 requests per second and the report says it achieved 55. What do you ask?"
    modelAnswer: |
      Before we talk about the API I want to know whether the run is valid. 55 against a plan of 120 is far below plan, so the
      load the application saw was less than the load the report claims. I would ask for the generator's CPU and network over
      the run - a saturated generator is the first suspect, because it would explain the missing rate and still produce
      acceptable response times for the requests that did arrive. I would ask how many samples stand behind the p95, whether the
      errors were counted and whether failures were fast, whether a warm-up is in the window, and whether the plan was a rate
      or a user count in a closed model.

      If the generator is healthy, below plan becomes interesting - the system queued and I would look for the saturated
      resource. Either way the 200-user claim is unproven until a run with a clean bill of health reaches the planned rate.
    rubric:
      - Notices that the achieved rate is far below the plan, so the claim is unproven.
      - Checks generator health before the application.
      - Asks about sample count, errors and warm-up.
      - Says what changes if the generator is healthy (look for saturation).
    followUps:
      - How would you prove the generator was the problem?
      - What if the generator was fine and errors were low?
    hints:
      - What load did the application actually see?
    solution: |
      Check the run first - achieved against planned rate, generator health, samples, errors, warm-up - then, if it is clean, look for
      the saturated resource.

  - id: sizing-coding
    type: coding
    concept: perf-iv-sizing
    skill: application
    title: The whiteboard sizing helper
    prompt: |
      In `pmi_sizing.py`, implement `arrival_rate`, `users_for_throughput`, `throughput_for_users`, `workers_needed` and
      `pacing_interval`.
    project: perf
    files:
      - exercises/capstone/pmi_sizing.py
    test: tests/capstone/test_pmi_sizing.py
    command: .venv/bin/python -m pytest tests/capstone/test_pmi_sizing.py
    hints:
      - Per day to per second needs 86,400; the peak multiplies it.
      - Users need the whole cycle, response time plus think time, and round up.
      - A rate with no waiting at all is unbounded - raise instead of returning infinity.
    modelAnswer: |
      ```python
      def users_for_throughput(target_rps, response_s, think_s):
          if target_rps < 0 or response_s < 0 or think_s < 0:
              raise ValueError("target_rps, response_s and think_s must be >= 0")
          return math.ceil(target_rps * (response_s + think_s))

      def workers_needed(rate_rps, service_s, max_utilisation=0.7):
          if rate_rps < 0 or service_s < 0:
              raise ValueError("rate_rps and service_s must be >= 0")
          if not 0 < max_utilisation <= 1:
              raise ValueError("max_utilisation must be in (0, 1]")
          return math.ceil(rate_rps * service_s / max_utilisation)
      ```

      `arrival_rate` multiplies the daily average by the peak factor (and rejects a factor below 1); `pacing_interval` is
      `users / target_rps`.
    rubric:
      - Every test in tests/capstone/test_pmi_sizing.py passes.
      - Users and workers round up, not down.
      - The peak, not the average, drives the rate.
      - Invalid inputs raise ValueError instead of returning nonsense.
    solution: |
      Little's law for users, offered load over a utilisation target for workers, ceilings everywhere, and errors for nonsense inputs.

  - id: validate-coding
    type: coding
    concept: perf-iv-sizing
    skill: application
    title: Compare an estimate with a run
    prompt: |
      In `pmi_validate.py`, implement `compare` (as predicted, below or above within a tolerance) and `explain`. The tests also run
      two short real loads against the practice API and check that the plan is met with room on the target and missed when the
      target has a single worker.
    project: perf
    files:
      - exercises/capstone/pmi_validate.py
    test: tests/capstone/test_pmi_validate.py
    command: .venv/bin/python -m pytest tests/capstone/test_pmi_validate.py
    hints:
      - Use the ratio measured / predicted and compare it with 1 - tolerance and 1 + tolerance.
      - Each verdict needs its own sentence; check what the tests look for in the below case.
    modelAnswer: |
      ```python
      def compare(predicted_rps, measured_rps, tolerance=0.1):
          if predicted_rps <= 0:
              raise ValueError("predicted_rps must be > 0")
          if measured_rps < 0 or not 0 <= tolerance < 1:
              raise ValueError("measured_rps must be >= 0 and tolerance in [0, 1)")
          ratio = measured_rps / predicted_rps
          if ratio < 1 - tolerance:
              return "below_prediction"
          if ratio > 1 + tolerance:
              return "above_prediction"
          return "as_predicted"
      ```

      `explain` looks the verdict up in a table and raises for an unknown one.
    rubric:
      - Every test in tests/capstone/test_pmi_validate.py passes.
      - The comparison uses a ratio with a tolerance in both directions.
      - Each verdict has its own explanation.
      - Can explain why plugging in the measured response time makes the law hold again.
    solution: |
      A ratio against 1 plus or minus the tolerance, three verdicts, and an explanation for each.

  - id: smells-coding
    type: coding
    concept: perf-iv-result-smells
    skill: application
    title: Is this result worth reading?
    prompt: |
      In `pmi_smells.py`, implement `smells`, `verdict` and `next_step` so a run summary yields the smells in priority order. The
      tests use five real captured runs and a few hand-made summaries.
    project: perf
    files:
      - exercises/capstone/pmi_smells.py
    test: tests/capstone/test_pmi_smells.py
    command: .venv/bin/python -m pytest tests/capstone/test_pmi_smells.py
    hints:
      - Collect the smells in a set and return them in PRIORITY order.
      - The fast-failure smell needs both many errors and a lower median for the whole run than for successes.
      - A missing generator CPU or plan is not a smell.
    modelAnswer: |
      ```python
      def smells(summary):
          missing = [k for k in REQUIRED if k not in summary]
          if missing:
              raise ValueError(f"summary is missing: {', '.join(missing)}")
          found = set()
          n = summary["samples"]
          if n < MIN_SAMPLES:
              found.add("too_few_samples")
          cpu = summary.get("generator_cpu_pct")
          if cpu is not None and cpu >= GENERATOR_CPU_PCT:
              found.add("generator_saturated")
          if n and summary["errors"] / n > ERROR_RATE and summary["p50_all_ms"] < FLATTER_RATIO * summary["p50_ok_ms"]:
              found.add("fast_failures_flatter_latency")
          planned = summary.get("planned_rps")
          if planned and summary["achieved_rps"] < BELOW_PLAN * planned:
              found.add("below_plan")
          if summary["last_third_p95_ms"] > 0 and summary["first_third_p95_ms"] > WARMUP_RATIO * summary["last_third_p95_ms"]:
              found.add("warmup_included")
          return [s for s in PRIORITY if s in found]
      ```
    rubric:
      - Every test in tests/capstone/test_pmi_smells.py passes.
      - Smells come back in PRIORITY order, so a generator is reported before a rate below plan.
      - Boundaries are handled exactly (100 samples, 80% CPU, 90% of plan are the lines).
      - Can explain why many errors alone do not flatter latency.
    solution: |
      Required keys, five rules, the PRIORITY order, trust or rerun, and one sentence of advice per smell.

placement:
  - id: place-design-first
    type: mcq
    concept: perf-iv-answer-structure
    skill: application
    title: The first design move
    prompt: |
      In a design round you have clarified the goal and the traffic. What comes next?
    options:
      - id: model
        text: A workload model from logs or analytics, then sizing from it.
        feedback: Correct - the model says what to script and at what rate.
      - id: tool
        text: Pick a tool.
        feedback: The tool follows the plan.
      - id: stress
        text: Start with a stress test.
        feedback: Stress is a later step; first you need a model of normal traffic.
      - id: report
        text: Draft the report.
        feedback: The report comes last.
    correct: [model]
    hints:
      - What do you need before you can size anything?
    solution: |
      The workload model comes next, then sizing, then the tests in order.

  - id: place-size-users
    type: mcq
    concept: perf-iv-sizing
    skill: application
    title: Users from throughput
    prompt: |
      You must offer 50 requests per second. A reply takes 0.2 s and users think for 0.8 s. How many closed-model users?
    options:
      - id: u50
        text: 50 - throughput x (0.2 + 0.8) = 50 x 1.0.
        feedback: Correct - the cycle is 1.0 s, so one user gives one request per second.
      - id: u10
        text: 10 - throughput x 0.2.
        feedback: That counts only the users waiting for a reply.
      - id: u250
        text: 250 - throughput x 5.
        feedback: There is no factor of 5 in the cycle.
      - id: u40
        text: 40 - throughput x 0.8.
        feedback: That counts only the thinking time.
    correct: [u50]
    hints:
      - The cycle is the reply plus the think time.
    solution: |
      N = X x (R + Z) = 50 x 1.0 = 50 users.

  - id: place-smell
    type: mcq
    concept: perf-iv-result-smells
    skill: analysis
    title: A run of a few hundred milliseconds
    prompt: |
      A smoke run lasted half a second and produced 12 samples; its p95 is 22 ms. May you report "p95 22 ms"?
    options:
      - id: no
        text: No - 12 samples is too few for a percentile; run longer or with more load and rerun.
        feedback: Correct - a p95 of 12 samples is the second-slowest request, which is noise.
      - id: yes
        text: Yes - it is below the target.
        feedback: A number from 12 samples says almost nothing about the 95th percentile.
      - id: both
        text: Yes, if you add the word "approximately".
        feedback: A qualifier does not repair a missing sample.
      - id: average
        text: Report the average instead.
        feedback: The average of 12 samples is no more reliable.
    correct: [no]
    hints:
      - How many requests stand behind the number?
    solution: |
      Too few samples: rerun with enough samples for the percentile you report.

recall:
  - id: recall-explain
    concept: perf-iv-answer-structure
    prompt: What are the four parts of an explain answer in a performance interview?
    answer: Definition in plain words, mechanism with one number, how it misleads, and how you would check it.
  - id: recall-design
    concept: perf-iv-answer-structure
    prompt: What is the order of a performance test design answer?
    answer: Clarify, workload model, size it, order the tests, protect result quality, report, keep it in the pipeline.
  - id: recall-users
    concept: perf-iv-sizing
    prompt: How many closed-model users offer a target rate?
    answer: Little's law - throughput x (response time + think time), rounded up; the throughput is the peak rate, not the average.
  - id: recall-workers
    concept: perf-iv-sizing
    prompt: How many workers keep utilisation at a target?
    answer: Rate x service time (the offered load) divided by the utilisation target, rounded up.
  - id: recall-below
    concept: perf-iv-sizing
    prompt: The measured rate is below the estimate. What does that tell you?
    answer: Users waited longer than assumed - queueing, a slow generator or a real response time above the plan; the law still holds with the measured response time.
  - id: recall-smells
    concept: perf-iv-result-smells
    prompt: Name the run smells in priority order.
    answer: Too few samples, generator saturated, fast failures flatter latency, below plan, warm-up included - and rerun any run that has one.

