id: locust-fundamentals
title: Locust fundamentals - users, tasks and wait time
subject: performance-testing
module: locust
level: beginner
status: published
estimatedMinutes: 130
summary: 'Write a locustfile - an HttpUser class with weighted @task methods, an on_start login and a wait_time - run it headless with -u, -r and -t, and read the statistics it leaves behind: the console summary, the --csv files and the --json-file output. Real Locust 2.47.0 runs against the SandPay practice API show what each piece does, including what goes wrong without a login, without a wait time and without request names.'
tags:
  [
    Locust,
