      ```

      The tests count queries with `CountingConn`: `1` for the JOIN at any limit, `1` for the batched totals at any list length, `0` for an empty
      list. The placeholders are built from the count of ids (the SQL text must not contain the ids), and the absent
      merchants are filled in with `(0, 0)` in code, because `GROUP BY` returns no row for them.
    rubric:
      - Every test in tests/analysis/test_db_queries.py passes.
      - latest_payments uses a JOIN and sends exactly one query whatever the limit.
      - totals_for sends one query for any list, none for an empty list, and uses placeholders and parameters.
      - Merchants without captured payments appear as (0, 0).
    hints:
      - The JOIN condition is m.id = p.merchant_id.
      - One placeholder per id, built from the number of ids, and the ids as the parameter list.
      - GROUP BY returns no row for a merchant that has no matching payments.
    solution: |
