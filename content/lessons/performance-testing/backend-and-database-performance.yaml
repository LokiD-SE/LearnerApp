  - id: ceiling-mcq
    type: mcq
    concept: perf-db-pool-cache
    skill: application
    title: The ceiling of a pool
    prompt: |
      A pool has 10 connections and every request holds a connection for 50 ms. What is the most requests per second it can
      serve?
    options:
      - id: c200
        text: 200 - 10 / 0.050
        feedback: Correct. Connections in use = throughput x hold, so throughput = connections / hold.
      - id: c500
        text: 500 - 10 x 50
        feedback: Multiplying counts the milliseconds, not the rate. The hold time is 0.050 s.
      - id: c20
        text: 20 - 1 / 0.050
        feedback: That is the rate of one connection; there are ten.
      - id: c10
        text: 10 - one request per connection per second
        feedback: A connection that is held 50 ms can serve 20 requests per second, not one.
    correct: [c200]
    hints:
      - One connection serves 1 / hold requests per second.
    solution: |
      10 connections x (1 / 0.050 s) = 200 requests per second.

  - id: queue-mcq
    type: mcq
    concept: perf-db-pool-cache
    skill: analysis
    title: Flat throughput, low database CPU
    prompt: |
      Adding virtual users does not increase throughput, response time rises in proportion to the number of users, and the
      database's CPU is at 15%. What is the most likely place where requests are waiting?
    options:
      - id: pool
        text: In front of the database, for a free connection in the application's pool
        feedback: Correct. The ceiling P / hold is reached; the extra requests queue, and the database sits idle.
      - id: db
        text: Inside the database, because its CPU is saturated
        feedback: At 15% it is not saturated.
      - id: gen
        text: Nowhere - throughput is just random
        feedback: A plateau with response times growing linearly is the signature of a queue.
      - id: disk
        text: In the browser
        feedback: Load generators do not run a browser here, and a browser would not cause a server-side plateau.
    correct: [pool]
    hints:
      - Where can requests queue without making the database busy?
    solution: |
      In the connection pool's wait queue; confirm with the pool metrics (in use = size, requests waiting).

  - id: bigpool-mcq
    type: mcq
    concept: perf-db-pool-cache
    skill: analysis
    title: Should the pool be bigger?
    prompt: |
      Requests queue for connections and the database CPU is already near 90%. A developer proposes doubling the pool. What
      is the best response, according to the HikariCP guidance quoted in the lesson?
    options:
      - id: small
        text: Do not; the database can only work on about (cores x 2) + spindles queries at once, so more connections add contention - shorten the hold time and check the size with a load test
        feedback: Correct. "You want a small pool, saturated with threads waiting for connections."
      - id: yes
        text: Do; more connections always mean more throughput
        feedback: Past the database's capacity, more connections add context switching and the throughput falls.
      - id: unlimited
        text: Remove the pool and open a connection per request
        feedback: Opening connections is slow, and the database cannot serve them all at once.
      - id: ignore
        text: Ignore the queue; it is normal for requests to wait
        feedback: A queue is a symptom of a limit; it still has to be explained.
    correct: [small]
    hints:
      - What does the database do with more concurrent queries than it has cores?
    solution: |
      Keep the pool small, shorten the hold time (fewer or faster queries), and test the size under load.

