  - id: plans-code
    type: coding
    concept: perf-db-indexes
    skill: application
    title: Read plans and choose the index
    prompt: |
      Implement `explain`, `access_paths`, `full_scans` and `index_ddl` in `analysis/db_plans.py`. `explain` returns the
      `detail` strings of `EXPLAIN QUERY PLAN`; `access_paths` returns `(kind, table, index)` for every SCAN or SEARCH line
      (index is the name after `INDEX`, else `None`; skip other lines); `full_scans` returns the tables read with a SCAN
      (even a scan that walks an index); `index_ddl` builds the `CREATE INDEX` statement with the equality columns first and
      then the range columns, named `idx_<table>_<columns joined by _>`.
    project: perf
    files:
      - exercises/analysis/db_plans.py
    test: tests/analysis/test_db_plans.py
    command: .venv/bin/python -m pytest tests/analysis/test_db_plans.py
    modelAnswer: |
      ```python
      import re

      _PATH = re.compile(r"^(SCAN|SEARCH)\s+(?:TABLE\s+)?(\S+)(?:\s+AS\s+\S+)?(.*)$")
      _INDEX = re.compile(r"USING (?:COVERING )?INDEX (\S+)")


      def explain(conn, sql, params=()):
          return [row[3] for row in conn.execute("EXPLAIN QUERY PLAN " + sql, params).fetchall()]


      def access_paths(conn, sql, params=()):
          paths = []
          for detail in explain(conn, sql, params):
              match = _PATH.match(detail)
              if not match:
                  continue
              kind, table, rest = match.groups()
              index = _INDEX.search(rest)
              paths.append((kind, table, index.group(1) if index else None))
          return paths


      def full_scans(conn, sql, params=()):
          return [table for kind, table, _ in access_paths(conn, sql, params) if kind == "SCAN"]


      def index_ddl(table, equality, range_columns=()):
          columns = [*equality, *range_columns]
          return f"CREATE INDEX idx_{table}_{'_'.join(columns)} ON {table} ({', '.join(columns)})"
      ```

      The tests run your functions against real plans of a 20,000-row table: a SCAN before the index, a SEARCH naming your
      index after it, the narrower search from the equality-first order, and a SCAN that stays when a function wraps the
      column.
    rubric:
      - Every test in tests/analysis/test_db_plans.py passes.
      - access_paths skips lines that are not SCAN or SEARCH and reads the index name after INDEX or COVERING INDEX.
      - full_scans counts a scan that walks an index as a scan.
      - index_ddl puts the equality columns before the range columns and names the index as specified.
    hints:
      - The detail text is the fourth column of each EXPLAIN QUERY PLAN row.
      - 'A line starts with SCAN or SEARCH; the table name follows, and "USING INDEX x" or "USING COVERING INDEX x" may come after it.'
      - A scan that names an index is still a SCAN.
    solution: |
      Keep row[3]; parse SCAN/SEARCH with a regular expression and an index pattern; filter SCAN for full_scans; equality
      columns first in the DDL.

  - id: pool-code
    type: coding
    concept: perf-db-pool-cache
    skill: application
    title: Pool and cache arithmetic
    prompt: |
      Implement `max_throughput`, `pool_size_for`, `starting_pool_size`, `simulate_pool`, `lru_hit_ratio` and `database_load`
      in `analysis/db_pool.py`. The pool ceiling is `pool_size / hold_s`; the size for a throughput rounds
      `throughput x hold / utilisation` up (and is at least 1); `simulate_pool` returns each request's wait for a connection
      with FIFO service; `lru_hit_ratio` simulates an LRU cache; `database_load` is the misses per second.
    project: perf
    files:
      - exercises/analysis/db_pool.py
    test: tests/analysis/test_db_pool.py
    command: .venv/bin/python -m pytest tests/analysis/test_db_pool.py
    modelAnswer: |
      ```python
      import heapq
      import math
      from collections import OrderedDict


      def max_throughput(pool_size, hold_s):
          if pool_size < 1 or hold_s <= 0:
              raise ValueError("pool_size must be at least 1 and hold_s positive")
          return pool_size / hold_s


      def pool_size_for(throughput_per_s, hold_s, utilisation=0.8):
          if throughput_per_s < 0 or hold_s <= 0 or not 0 < utilisation <= 1:
              raise ValueError("throughput >= 0, hold_s > 0, 0 < utilisation <= 1")
          return max(1, math.ceil(round(throughput_per_s * hold_s / utilisation, 9)))


      def starting_pool_size(cores, effective_spindles=0):
          return cores * 2 + effective_spindles


      def simulate_pool(arrival_times, hold_s, pool_size):
          free_at = [0.0] * pool_size
          heapq.heapify(free_at)
          waits = []
          for arrival in arrival_times:
              earliest = heapq.heappop(free_at)
              start = max(arrival, earliest)
              waits.append(start - arrival)
              heapq.heappush(free_at, start + hold_s)
          return waits


      def lru_hit_ratio(keys, capacity):
          keys = list(keys)
          if not keys:
              return 0.0
          cache, hits = OrderedDict(), 0
          for key in keys:
              if key in cache:
                  hits += 1
                  cache.move_to_end(key)
              else:
                  cache[key] = True
                  if len(cache) > capacity:
                      cache.popitem(last=False)
          return hits / len(keys)


      def database_load(requests_per_s, hit_ratio):
          if not 0 <= hit_ratio <= 1:
              raise ValueError("hit_ratio must be between 0 and 1")
          return requests_per_s * (1 - hit_ratio)
      ```

      The details the tests check: rounding the float noise away before `ceil` (7 x 0.1 / 0.7 comes out a hair above 1), a hit
      that makes a key the newest, a loop one entry longer than the cache never hitting under LRU, and a burst being served
      in waves of `pool_size`.
    rubric:
      - Every test in tests/analysis/test_db_pool.py passes.
      - max_throughput is pool_size / hold_s and rejects nonsense input.
      - pool_size_for rounds up, is at least 1, and is not fooled by floating-point noise.
      - simulate_pool serves requests FIFO with a heap of connection free-times.
      - lru_hit_ratio moves a hit to the most-recent end and evicts the least recently used entry.
    hints:
      - A pool of P connections serves P / hold requests per second.
      - Keep a heap of the times at which the connections become free; the next request takes the earliest.
      - 'OrderedDict has move_to_end and popitem(last=False).'
    solution: |
      Division for the ceiling; ceil of round(x, 9) for the size; a heap for the pool; an OrderedDict for the LRU; a
      multiplication by the miss ratio.

placement:
  - id: place-nplus1
    type: mcq
    concept: perf-db-roundtrips
    skill: application
    title: Count the queries
    prompt: |
      A page lists 25 invoices, and for each one the code reads its customer, then the customer's country. Each read is a
      separate query. How many queries does the page send?
    options:
      - id: q51
        text: 51 - one for the list, then two queries for each of the 25 invoices
        feedback: Correct. 1 + 25 x 2 = 51, and it grows with the number of invoices.
      - id: q50
        text: 50 - two for each invoice; the list query is not counted
        feedback: The list query is a query too.
      - id: q26
        text: 26 - the list and one per invoice
        feedback: That counts one lookup per invoice; this code does two (the customer, then the country).
      - id: q2
        text: 2 - the database batches the reads
        feedback: Nothing batches separate execute calls.
    correct: [q51]
    solution: |
      1 + 25 x 2 = 51 queries.

  - id: place-plan
    type: mcq
    concept: perf-db-indexes
    skill: application
    title: Which plan is the problem
    prompt: |
      A query on a table of 30 million rows shows `SCAN payments`; the same query on a test table of 3,000 rows is also `SCAN
      payments` and finishes instantly. What is the correct conclusion?
    options:
      - id: scan
        text: Both are full scans; the test hides the problem because the cost grows with the table
        feedback: Correct. The plan is the same, the cost is not.
      - id: fine
        text: It is fine - the test passed
        feedback: The test table is too small to show the cost of a scan.
      - id: index
        text: The index on the test table is better
        feedback: Both plans say SCAN; neither uses an index.
      - id: cache
        text: The test table is cached and the production table is not
        feedback: That might add to the difference, but the plan line already shows what the database does with both.
    correct: [scan]
    solution: |
      The same scan, tiny cost on 3,000 rows and large cost on 30 million.

  - id: place-pool
    type: mcq
    concept: perf-db-pool-cache
    skill: application
    title: What a pool allows
    prompt: |
      A pool of 8 connections; each request holds one for 40 ms. A test offers 300 requests per second. What happens?
    options:
      - id: queue
        text: The pool serves at most 8 / 0.040 = 200 per second; the rest queue, so throughput plateaus near 200 and response time grows
        feedback: Correct.
      - id: all
        text: All 300 are served, because requests overlap
        feedback: Overlap is limited to 8 at a time.
      - id: half
        text: Throughput falls to 100 because connections are wasted
        feedback: Connections serve at their ceiling; they are not wasted by queueing.
      - id: err
        text: Every request fails at once
        feedback: Requests queue; they fail only when an acquire timeout is exceeded.
    correct: [queue]
    solution: |
      The ceiling is 200 requests per second; the excess waits.

recall:
  - id: recall-nplus1
    concept: perf-db-roundtrips
    prompt: What is the N+1 problem, how do you prove it, and how do you fix it?
    answer: One query for a list plus one per row, so 1 + N round trips that grow with the page size. Prove it with queries per request from a statement log at different page sizes. Fix it with a JOIN or one batched IN / GROUP BY query so the count no longer depends on N.
  - id: recall-scan
    concept: perf-db-indexes
    prompt: In SQLite, what do SCAN and SEARCH mean in a query plan?
    answer: SCAN is a full-table scan, even when it walks an index in order; SEARCH visits only a subset of the rows. Look for the scan first on any database (PostgreSQL says Seq Scan versus Index Scan).
  - id: recall-defeat
    concept: perf-db-indexes
    prompt: Name two reasons an existing index is not used.
    answer: A function on the column in the condition (CAST, arithmetic), and a composite index whose column order does not match the filter (equality columns must come before the range column). Also low selectivity, where the planner prefers a scan.
  - id: recall-price
    concept: perf-db-indexes
    prompt: What does an index cost?
    answer: Every insert, update and delete must keep each index in step with the table - the lesson's run took about 136, 240 and 454 ms for 100,000 inserts with 0, 1 and 3 indexes - plus disk and memory.
  - id: recall-ceiling
    concept: perf-db-pool-cache
    prompt: What is the throughput ceiling of a connection pool?
    answer: pool size / hold time, from Little's law (connections in use = throughput x hold time). Above it, requests queue; with C clients each waits about (C - P) / P holds.
  - id: recall-idle
    concept: perf-db-pool-cache
    prompt: Why can the database look idle when it is the limit of the system?
    answer: The queue is in the application's connection pool, in front of the database. The database serves only as many queries as the pool allows, each quickly, so its CPU and slow-query log look fine. Measure the pool - in use, waiting, wait time, timeouts.
  - id: recall-cache
    concept: perf-db-pool-cache
    prompt: How much load does a cache leave on the database, and what drives the hit ratio?
    answer: requests x (1 - hit ratio). The hit ratio depends on the traffic's skew and the cache size - in the run, 100 entries gave 57.8% for skewed traffic and 10.2% for uniform.

