  - id: scan-short
    type: short
    concept: perf-db-indexes
    skill: analysis
    title: Fast in test, slow in production
    prompt: |
      A lookup `WHERE merchant_id = ?` returns in 2 ms on the test database (5,000 payments) and takes 400 ms on production
      (many millions). The code is identical. Explain what is probably happening, how you would prove it, and what you would
      change about the test.
    modelAnswer: |
      Most likely a full-table scan: with no usable index the database reads every row, so the time grows with the table -
      trivial at 5,000 rows, large at millions ("if the table contained 7 million rows, a full table scan might read megabytes
      of content in order to find a single 8-byte number"). To prove it: run EXPLAIN on that statement, with a real parameter,
      against production-sized data (or a copy of it), and look for SCAN / Seq Scan versus SEARCH / Index Scan; also confirm
      the index exists and that the condition does not put a function on the column. I would also run the lookup at two table
      sizes and show the time rising with the size. For the test: use production-like data volume and distribution, so the
      plan in the test environment is the plan in production, and add a plan check for the critical statements.
    rubric:
      - Names a full-table scan whose cost grows with the table as the likely cause.
      - Proves it with EXPLAIN on production-sized data and a real parameter - SCAN versus SEARCH.
      - Checks that the index exists and that the condition does not wrap the column in a function.
      - Changes the test to production-like data volume and distribution, with a plan check for critical statements.
    hints:
      - What grows with the table, and not with the number of rows returned?
      - What does EXPLAIN show for the two cases?
    solution: |
      A scan that grows with the table. Prove it with EXPLAIN on production-sized data; fix the test by using production-like
      volume.

  - id: orders-testdesign
    type: testdesign
    concept: perf-db-pool-cache
    skill: application
    title: A load test that finds the database limit
    prompt: |
      SandPay's merchant dashboard lists recent orders and shows totals. Design the load test and the extra measurements that
      would tell you whether the first limit you hit is N+1 queries, a missing index, the connection pool or the database
      itself. State the data, the load profile, what you record on the database and the pool, and how you decide.
    modelAnswer: |
      **Data:** production-like volumes - the same row counts, the same spread of orders per merchant (a few merchants with
      many orders), indexes as in production, warm database. **Load profile:** a step load to find where the curve bends
      (see Load shapes in Locust), plus a fixed-load run at page sizes 10, 50 and 100 and a run with the table at two sizes.
      **Record on the load side:** response time percentiles, throughput and errors per step. **Record on the database and the
      pool, at the same time:** statements per request (statement log for a short window), the top statements by total time, the
      plan of each suspect, pool connections in use / waiting / wait time / timeouts, database CPU, cache hit ratio.
      **Decide:** statements per request that grow with page size mean N+1; a SCAN on a large table in the top statements means
      an index or a rewrite; connections in use equal to the pool size with waiting requests and a low database CPU mean a pool
      limit, usually caused by a long hold time; high database CPU with flat throughput means the database itself. Report the
      hypothesis with the evidence and the measurement that would reject it, then re-test the fix on the same data.
    rubric:
      - Uses production-like data - volume, spread of orders per merchant, indexes, warm database.
      - Varies the page size, the table size and the users, not only one load level.
      - Records queries per request, top statements, plans, pool in use and waiting, database CPU and hit ratio alongside the response times.
      - Maps each observation to a cause - N+1, scan, pool, database - and says what would reject it.
      - Re-tests the fix on the same data and load.
    hints:
      - One load-side measurement is not enough to separate the four causes.
    solution: |
      Production-like data; a step load plus page-size and table-size runs; record statements per request, top statements,
      plans, pool in use / waiting, database CPU and hit ratio alongside the response times; decide from those.

  - id: db-interview
    type: interview
    concept: perf-db-roundtrips
    skill: analysis
    title: 'Interview: the API is slow under load - how do you tell whether it is the database?'
    prompt: |
      "A payments API gets slow when we load-test it. How would you work out whether the database is responsible, and what is
      wrong?"
    modelAnswer: |
      I would not guess from the response times alone - they only say the whole path is slow. I add a measurement for each
      place time can go. First, queries per request from the statement log, at different page sizes: if it grows as 1 + N,
      it is an N+1, and the fix is a JOIN or one batched query. Second, the top statements by total time and their plans on
      production-sized data: a SCAN on a big table means a missing or unusable index - a function on the column, or a
      composite index in the wrong order - and I would also weigh the write cost of the new index. Third, the connection pool:
      if throughput is flat, response time grows with the users and the database CPU is low, requests are queuing for
      connections; by Little's law the pool can serve at most pool size divided by hold time, so I would look at why the hold
      time is long before suggesting a bigger pool, and size the pool from the database's capacity. Fourth, the cache hit
      ratio, because a cache changes what the database sees. I would check the test data is production-like, otherwise scans and
      N+1 do not show up, and I would report the hypothesis with its evidence and the measurement that would reject it, then
      repeat the same test after the fix.
    rubric:
      - Separates the causes - queries per request, plan, pool, cache - rather than blaming "the database" in general.
      - Uses counts and plans as evidence, not only timings.
      - Applies Little's law to the pool and does not simply raise the pool size.
      - Insists on production-like data, and re-tests the fix.
      - Presents a hypothesis with the measurement that would reject it.
    followUps:
      - How would you prove an N+1 from a load test alone?
      - Why can the database CPU be low while the system is database-limited?
      - What can go wrong after you add an index?
    hints:
      - Name the measurements you would add to the load test.
    solution: |
      Queries per request, plans of the top statements, pool metrics and cache hit ratio, on production-like data, each with a
      stated way to reject it; Little's law for the pool; re-test after the fix.

  - id: queries-code
    type: coding
    concept: perf-db-roundtrips
    skill: application
    title: One query instead of N+1
    prompt: |
      Implement `latest_payments` and `totals_for` in `analysis/db_queries.py`. `latest_payments(conn, limit)` returns the
      same `(payment id, merchant name, amount_cents)` rows as the given `latest_payments_n_plus_one`, newest first, with
      exactly one query. `totals_for(conn, merchant_ids)` returns `{merchant_id: (captured payments, their total cents)}` for
      every id, with one query for the whole list (and none for an empty list), `(0, 0)` for a merchant without captured
      payments, and the ids passed as parameters, never inside the SQL text.
    project: perf
    files:
      - exercises/analysis/db_queries.py
    test: tests/analysis/test_db_queries.py
    command: .venv/bin/python -m pytest tests/analysis/test_db_queries.py
    modelAnswer: |
      ```python
      def latest_payments(conn, limit):
          return conn.execute(
              "SELECT p.id, m.name, p.amount_cents FROM payments p JOIN merchants m ON m.id = p.merchant_id "
              "ORDER BY p.id DESC LIMIT ?",
              (limit,),
          ).fetchall()


      def totals_for(conn, merchant_ids):
          ids = list(merchant_ids)
          if not ids:
              return {}
          placeholders = ", ".join("?" for _ in ids)
          rows = conn.execute(
              f"SELECT merchant_id, count(*), sum(amount_cents) FROM payments "
              f"WHERE status = 'captured' AND merchant_id IN ({placeholders}) GROUP BY merchant_id",
              ids,
          ).fetchall()
