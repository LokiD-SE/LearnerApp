      You must find out whether response times degrade after a normal load has run for eight hours. Which profile?
    options:
      - id: soak
        text: A soak - one long stage at a moderate user count, with server-side monitoring
        feedback: Correct - drift and leaks need time at a normal load.
      - id: spike
        text: A spike - a short burst well above normal
        feedback: A spike tests the reaction to a sudden burst, not slow degradation.
      - id: step
        text: A step load with a new step every minute
        feedback: A step load finds the breakpoint; it does not hold a normal load for hours.
      - id: ramp
        text: A single fast ramp to the maximum user count
        feedback: That is a stress or capacity probe.
    correct: [soak]
    solution: |
      Soak: moderate count, long duration, and monitoring on the server side to catch leaks.

  - id: place-ramp
    type: mcq
    concept: perf-lcshape-ramp-reading
    skill: analysis
    title: The stage that did not reach its users
    prompt: |
      A stage asks for 30 users at a spawn rate of 3 per second and lasts 6 seconds; the next stage asks for 5 users. About
      how many users will the first stage have started when the second replaces it?
    options:
      - id: eighteen
        text: About 18 - the ramp needs 30 / 3 = 10 seconds and only 6 are available
        feedback: Correct - 3 users per second for 6 seconds, so the target of 30 is never reached.
      - id: thirty
        text: 30 - Locust waits for the ramp
        feedback: The next stage replaced the ramp in the real slow-ramp run.
      - id: six
        text: 6 - one user per second of the stage
        feedback: The rate is 3 users per second, not 1.
      - id: five
        text: 5 - the next stage's target applies from the start
        feedback: The next stage starts only after this one ends.
    correct: [eighteen]
    solution: |
      Users started = spawn rate x stage length = 3 x 6 = 18 (about; ticks and start-up add noise).

recall:
  - id: recall-tick
    concept: perf-lcshape-tick
    prompt: What does tick() return, and how often is it called?
    answer: '(user_count, spawn_rate), optionally with a list of User classes as a third element, or None to stop the test. About once per second.'
  - id: recall-options
    concept: perf-lcshape-tick
    prompt: What happens to -u, -r and -t when a LoadTestShape is present?
    answer: Locust logs a warning and ignores them (unless the shape sets use_common_options). The shape decides the users and the length; a shape that never returns None never ends.
  - id: recall-stage
    concept: perf-lcshape-profiles
    prompt: 'What is "duration" in a stage {"duration": 120, "users": 20, "spawn_rate": 5}?'
    answer: The end of the stage in seconds since the test started (cumulative), not its length. Writing lengths makes later stages unreachable.
  - id: recall-profiles
    concept: perf-lcshape-profiles
    prompt: Step, spike, soak - what does each profile ask?
    answer: Step - at what user count does it degrade? Spike - how does it take a sudden burst and recover (high spawn rate)? Soak - does it degrade over hours at a normal load?
  - id: recall-ramp
    concept: perf-lcshape-ramp-reading
    prompt: How long does a ramp from a to b users take, and what if the stage is shorter?
    answer: '|b - a| / spawn_rate seconds. If the stage is shorter, the next stage replaces the ramp and the target is never reached - check the plan and look for "All users spawned".'
  - id: recall-wait
    concept: perf-lcshape-ramp-reading
    prompt: How can a stage start its clock only when its users are running?
    answer: Compare get_current_user_count() with the stage's users and start the hold timer when they match (with a timeout). The total length of the test is then no longer fixed.
  - id: recall-window
    concept: perf-lcshape-ramp-reading
    prompt: Why not read a short spike's rate from the Requests/s column of the history CSV?
    answer: Requests/s and the percentile columns are a 10-second sliding window, so they lag and smear. Use the growth of Total Request Count per phase for the rate.

