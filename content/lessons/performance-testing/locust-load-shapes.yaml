  - id: shape-interview
    type: interview
    concept: perf-lcshape-tick
    skill: analysis
    title: 'Interview: how do you model a traffic spike in Locust?'
    prompt: |
      "We expect a sudden burst of traffic after a marketing email. How would you model that in Locust, and how would you
      know the test did what you intended?"
    modelAnswer: |
      A spike is a shape, not a `-u -r -t` run. I write a `LoadTestShape` whose `tick()` - called about once a second -
      follows a list of stages: a baseline, a jump to a multiple of the baseline with a high spawn rate so the burst builds
      in a second or two, and a return to the baseline so I can see recovery. `duration` is the cumulative end time; the
      shape returns `None` after the last stage, which is what ends the test, because with a shape `-u -r -t` are ignored.

      To know the test did what I intended: I check the plan before the run - end times increasing, and for each stage
      `|users - previous| / spawn_rate` shorter than the stage, since a ramp that cannot finish is replaced by the next
      stage and the peak is lower than planned. In the run I look for the `All users spawned` line for the peak, and in the
      history CSV for the user counts of the plan in order. I read each phase from the growth of the running request
      total, not from `Requests/s` or the percentile columns, which are a 10-second window and smear a short spike. I judge
      errors, latency during the burst and time to recover, and I check the load generator is not the bottleneck.
    rubric:
      - Uses a LoadTestShape with stages, a high spawn rate for the jump and a baseline before and after.
      - Knows that tick() returning None ends the test and that -u -r -t are ignored.
      - Checks that the ramp fits the stage, and verifies the peak in the log and history.
      - Reads phases from the running total and knows the 10-second window.
      - Judges errors, latency during the burst and recovery, and the generator's capacity.
    followUps:
      - What would you change to model a slow climb instead of a spike?
      - How do you stop a stage from losing time to a slow ramp?
      - What breaks if the shape never returns None?
    hints:
      - Start with what a spike is made of - a baseline, a jump, a return.
    solution: |
      A LoadTestShape with stages and a high spawn rate, a plan check, proof from the log and history, per-phase numbers,
      and recovery time as the result.

  - id: stages-code
    type: coding
    concept: perf-lcshape-profiles
    skill: application
    title: Stage plans as plain functions
    prompt: |
      Implement `locust/lc_shape_stages.py` (plain Python, no Locust import): `tick(stages, run_time)`, which returns the
      `(users, spawn_rate)` of the stage running now or `None` after the last one; `from_steps(...)`, which builds a
      step-load plan with cumulative end times; `ramp_seconds(from_users, to_users, spawn_rate)`; and `stage_problems(stages)`,
      which returns `(index, "not-increasing" | "ramp-too-slow")` for every stage that cannot work, judging each stage from
      the previous *live* stage's end and users, starting from 0 users at second 0.
    project: perf
    files:
      - exercises/locust/lc_shape_stages.py
    test: tests/locust/test_lc_shape_stages.py
    command: .venv/bin/python -m pytest tests/locust/test_lc_shape_stages.py
    modelAnswer: |
      ```python
      def tick(stages, run_time):
          for stage in stages:
              if run_time < stage["duration"]:
                  return stage["users"], stage["spawn_rate"]
          return None

      def ramp_seconds(from_users, to_users, spawn_rate):
          if spawn_rate <= 0:
              raise ValueError("spawn_rate must be positive")
          return abs(to_users - from_users) / spawn_rate

      def stage_problems(stages):
          problems, previous_end, previous_users = [], 0.0, 0
          for index, stage in enumerate(stages):
              length = stage["duration"] - previous_end
              if length <= 0:
                  problems.append((index, "not-increasing"))
                  continue                                  # a dead stage does not move the baseline
              if ramp_seconds(previous_users, stage["users"], stage["spawn_rate"]) > length:
                  problems.append((index, "ramp-too-slow"))
              previous_end, previous_users = stage["duration"], stage["users"]
          return problems
      ```

      `from_steps` is a list comprehension: stage `i` ends at `(i + 1) * step_seconds` and has `first_users + i * step_users`
      users. The details the tests check: a stage ends *before* its end second (`<`), a ramp exactly as long as its stage is
      fine, and a stage that is not increasing is skipped when the next stages are judged.
    rubric:
      - Every test in tests/locust/test_lc_shape_stages.py passes.
      - tick() uses strictly less than the end second and returns None after the last stage.
      - stage_problems judges each ramp against the stage length and ignores dead stages when moving the baseline.
      - ramp_seconds works downwards too and refuses a spawn rate that is not positive.
    hints:
      - '`run_time < stage["duration"]` - strictly less.'
      - The ramp from 10 to 4 users also takes time.
      - After a "not-increasing" stage, `continue` without updating the previous end and users.
    solution: |
      A first-match loop for `tick`, a comprehension for `from_steps`, `abs(b - a) / rate` for the ramp, and a walk over the stages
      that keeps the previous live stage's end and users.

  - id: shape-code
    type: coding
    concept: perf-lcshape-tick
    skill: application
    title: A step-load shape that ends itself
    prompt: |
      Complete `StepShape.tick` in `locust/lc_shape_locustfile.py`. The test must hold 1 user for 3 seconds, then 3 users for
      3 seconds, then 5 users for 3 seconds (all at 10 users per second) and stop on its own, with no `-u`, `-r` or `-t`. The
      test runs your file with real Locust against the practice API, reads the history CSV, and checks that the user count
      climbed 1, 3, 5, that every user logged in once and that the run ended long before the 60 seconds `-t` was given.
    project: perf
    files:
      - exercises/locust/lc_shape_locustfile.py
    test: tests/locust/test_lc_shape_locustfile.py
    command: .venv/bin/python -m pytest tests/locust/test_lc_shape_locustfile.py
    modelAnswer: |
      See "The code: a step-load shape in a locustfile". The part the tests check:

      ```python
      def tick(self):
          run_time = self.get_run_time()
          for stage in self.stages:
              if run_time < stage["duration"]:
                  return stage["users"], stage["spawn_rate"]
          return None
      ```

      - `self.get_run_time()` is the clock; the stage list holds end times (3, 6, 9).
      - `return None` after the last stage is what ends the run in about 10 seconds - without it the test times out.
      - Five logins mean no user was restarted between stages: the same tuple is not returned again with a different
        count, and the count only grows.
    rubric:
      - Every test in tests/locust/test_lc_shape_locustfile.py passes.
      - tick() uses get_run_time() and cumulative end times, and returns None after the last stage.
      - The test ends by itself - no -t is needed.
      - You can explain why -u -r -t were ignored in this run.
    hints:
      - The stages are already listed on the class.
      - The first stage whose end time is after the run time is the one running now.
      - Falling off the end of the loop must return None explicitly.
    solution: |
      Loop over `self.stages`, return the first stage's `(users, spawn_rate)` whose end is after `self.get_run_time()`, and
      return `None` after the loop.

  - id: history-code
    type: coding
    concept: perf-lcshape-ramp-reading
    skill: analysis
    title: Read a run by phase
    prompt: |
      Implement `locust/lc_shape_history.py` on the rows of a Locust `_stats_history.csv` (dicts with `"User Count"` and
      `"Total Request Count"` as strings): `phases(rows)` groups consecutive rows with the same user count and returns
      `{"users", "seconds", "requests", "rps"}` with the requests taken from the growth of the running total;
      `peak_users(rows)`; and `missed_targets(rows, targets)`, the plan's user counts that never appeared. The tests run on
      the real history of a spike run and a slow-ramp run.
    project: perf
    files:
      - exercises/locust/lc_shape_history.py
    test: tests/locust/test_lc_shape_history.py
    command: .venv/bin/python -m pytest tests/locust/test_lc_shape_history.py
    modelAnswer: |
      ```python
      def phases(rows):
          result, previous_total = [], 0
          for row in rows:
              users, total = int(row["User Count"]), int(row["Total Request Count"])
              if result and result[-1]["users"] == users:
                  result[-1]["seconds"] += 1
                  result[-1]["requests"] += total - previous_total
              else:
                  result.append({"users": users, "seconds": 1, "requests": total - previous_total})
              previous_total = total
          for phase in result:
              phase["rps"] = round(phase["requests"] / phase["seconds"], 1)
          return result

      def missed_targets(rows, targets):
          seen = {int(row["User Count"]) for row in rows}
          return sorted(t for t in set(targets) if t not in seen)
      ```

      The spike run gives 26.7, 193.1 and 26.9 requests per second; `missed_targets(slow_ramp, [10, 4, 2])` is `[10]` - the
      stage whose users were never reached. A user count that comes back later is a **new** phase, not a merge.
    rubric:
      - Every test in tests/locust/test_lc_shape_history.py passes.
      - The rate comes from the growth of Total Request Count, not from a Requests/s column.
      - Consecutive rows are grouped; a repeated user count later is a separate phase.
      - missed_targets is sorted and ignores duplicates in the plan.
    hints:
      - Keep the previous row's total; the first row grows from 0.
      - Group only while the user count equals the last phase's.
      - '`set()` removes duplicate targets; `sorted()` orders them.'
    solution: |
      Walk the rows once with the previous total, merge a row into the last phase when the user count is the same,
      and compute `rps` at the end. `missed_targets` is a set difference.

