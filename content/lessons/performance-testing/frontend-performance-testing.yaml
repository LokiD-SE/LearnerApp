id: frontend-performance-testing
title: Frontend performance testing
subject: performance-testing
module: perf-analysis
level: intermediate
status: published
estimatedMinutes: 150
summary: A load test asks how many users the servers can carry; a frontend performance test asks what one user's browser goes through to get a usable page. This lesson covers the three Core Web Vitals (LCP, INP, CLS) and their thresholds, why a lab run and the field data about real users are different measurements, how to take a page apart with a HAR waterfall, the four parts of LCP, total blocking time and a performance budget, and why none of it replaces a load test. You write the vitals, HAR and lab-analysis code in Python and run it on real Chrome 157 runs of a slow and a fixed version of a local SandPay checkout page.
tags:
  [
    frontend performance,
    Core Web Vitals,
    LCP,
    INP,
    CLS,
    TBT,
    FCP,
    TTFB,
    lab data,
    field data,
    RUM,
    75th percentile,
    Lighthouse,
    HAR,
    waterfall,
    performance budget,
    layout shift,
    long task,
    render blocking,
    not load testing,
  ]

environment: |
  - **Runtime:** Python 3.12.3 in `practice/perf/.venv` with pytest; Google Chrome 157.0.8103.78 driven by Playwright
    1.64.0 (headless, 1280 x 720, no network or CPU throttling) on one Linux machine. Every browser run shown was
    made on 21 November 2026 by `practice/perf/support/fe_capture.py` and saved in `support/fe_data/`; the tables
    are printed by the solution code on those files (`support/fe_demo.py`). The tests read the saved files and never
    start a browser. **Timings change with the machine, the browser version and the run**; the way of reading them
    does not.
  - **The page:** SandPay is a fictional payments company. `support/fe_fixture.py` serves a checkout page on
    `127.0.0.1` in two versions (`/slow/` and `/fixed/`) with fixed server-side delays on its files (the hero image
    takes 600 ms, the stylesheet 300 ms), so the shape of the numbers repeats on any machine. Because it runs on
    loopback with no throttling, **the absolute numbers are far smaller than a real visitor on a phone would see**;
    only the comparisons are meaningful. The "backend" is `/api/quote`: two requests at a time, 40 ms each.
  - **Synthetic field data:** the 400 "real-user visits" in `field_samples.json` are **made up** from a seeded random
    generator (40 % mobile, slower and shifting more by construction). They stand in for what a real-user
    monitoring tool or the Chrome User Experience Report would collect. No statement in this lesson about how real
    sites are distributed comes from them.
  - **Core Web Vitals, as documented on web.dev on 21 November 2026:** [Web Vitals](https://web.dev/articles/vitals)
    (the three metrics and the targets of 2.5 seconds, 200 milliseconds and 0.1; "a good threshold to measure is the
    75th percentile of page loads, segmented across mobile and desktop devices"; a page passes when it meets the
    targets "at the 75th percentile for all three"); [LCP](https://web.dev/articles/lcp);
    [INP](https://web.dev/articles/inp) (good at 200 ms or less, poor above 500 ms; "Total Blocking Time (TBT) may be
    a reasonable proxy metric for INP, but it's not a substitute for INP in and of itself");
    [CLS](https://web.dev/articles/cls) (good at 0.1 or less, poor above 0.25; the session window of "less than
    1-second in between each shift and a maximum of 5 seconds for the total window duration"; shifts within 500 ms
    of user input are flagged `hadRecentInput`); [Why lab and field data can be different](https://web.dev/articles/lab-and-field-data-differences)
    (field data "is not just one number, it's a distribution"; lab data comes from "a single device ... connected to
    a single network ... run from a single geographic location"; the example with 88 %, 8 % and 4 % of visits and the
    4-second poor limit for LCP); [Optimize LCP](https://web.dev/articles/optimize-lcp) (the four LCP subparts and the
    "~40 %, <10 %, ~40 %, <10 %" guide); [Total Blocking Time](https://web.dev/articles/tbt) (long tasks are over
    50 ms; blocking time is the excess); [Performance budgets 101](https://web.dev/articles/performance-budgets-101).
  - **Lighthouse and the HAR format, as documented on 21 November 2026:** [Introduction to
    Lighthouse](https://developer.chrome.com/docs/lighthouse/overview) (an open-source tool; Chrome DevTools,
    command line or Node module; Lighthouse CI "to prevent regressions");
    [Lighthouse performance scoring](https://developer.chrome.com/docs/lighthouse/performance/performance-scoring)
    (the weights for Lighthouse 10: FCP 10 %, Speed Index 10 %, LCP 25 %, TBT 30 %, CLS 25 %; "think of your site
    performance as a distribution of scores, rather than a single number"); Lighthouse [score
    variability](https://github.com/GoogleChrome/lighthouse/blob/main/docs/variability.md) ("Run Lighthouse multiple
    times and beware of variability before drawing conclusions"); the [HAR 1.2
    specification](https://w3c.github.io/web-performance/specs/HAR/Overview.html) (the `timings` fields, "Use -1 if
    the timing does not apply to the current request", the `time` field as the sum of the timings that are not -1).
  - **Load tools:** the [Apache JMeter home page](https://jmeter.apache.org/) ("JMeter is not a browser, it works at
    protocol level ... does not execute the Javascript found in HTML pages. Nor does it render the HTML pages as a
    browser does").
  - **Not run here:** Lighthouse itself, PageSpeed Insights, the Chrome User Experience Report, WebPageTest, a real
    RUM script and a mobile device. Statements about them come from the pages above or are left out. **A quirk seen
    in the saved HAR:** the `ssl` timing is non-zero on these plain-HTTP requests, and the entry `time` equals the sum
    that includes it; the cause was not investigated.

prerequisites:
  - performance-testing-types
  - performance-metrics-and-percentiles
  - reading-load-test-results

concepts:
  - id: perf-fe-vitals
    name: Core Web Vitals and the 75th percentile
    summary: LCP (loading), INP (responsiveness) and CLS (visual stability) have documented thresholds; a page passes when all three are good at the 75th percentile of its page loads, and CLS is the largest session window of layout shifts, not the sum of all of them.
  - id: perf-fe-labfield
    name: Lab data, field data and what each can tell you
    summary: A lab run is one controlled load that is repeatable and explains causes; field data is a distribution of real visits that says how many users have a problem. They disagree for good reasons, INP needs interaction, and a lab run is a sample you repeat and compare against its spread.
  - id: perf-fe-waterfall
    name: Waterfalls, LCP parts, blocking time and budgets
    summary: A HAR waterfall shows when each resource was requested and how long it took; LCP splits into TTFB, load delay, load duration and render delay; total blocking time counts the long tasks after first paint; a budget turns the findings into a limit a build can check. None of this says how the servers behave under many users.

objectives:
  - Name the three Core Web Vitals, what each measures and its good and poor thresholds, and apply the 75th-percentile rule to decide whether a page passes.
  - Compute CLS from layout-shift entries with session windows, ignoring shifts that follow user input.
  - Explain why lab and field data differ, what a distribution tells you that one number does not, and why INP is hard to get from a lab run.
  - Read a HAR file - phases, sizes by type, a waterfall - and find the late request that delays the largest element.
  - Split LCP into its four parts and say which one to attack, and compute total blocking time for a window.
  - Turn the findings into a performance budget a CI step can check, and say why a frontend test does not replace a load test.

sections:
  - id: intuition
    kind: intuition
    concepts: [perf-fe-vitals, perf-fe-labfield, perf-fe-waterfall]
    title: The idea in plain language
    body: |
      The SandPay checkout page answers its API in 40 ms and the load test is green. A merchant still says "your
      page is slow". Who is right?

      Both. A load test measures **how the servers cope when many users arrive**. The merchant is describing
      **what one browser goes through** to turn the server's bytes into something usable: fetch a stylesheet that
      blocks the first paint, run a script that freezes the page, discover the big banner image late, and then watch
      the text jump down when that image finally appears. None of that shows up in a server-side response time. A
      browser has to download, parse, run and draw.

      In a real Chrome run of our slow checkout page, the first paint happens at **404 ms**, the large banner
      appears at **1000 ms**, the main thread is blocked for **200 ms in one piece** after first paint, the text
      **jumps** by a layout-shift score of **0.158**, and one click takes **128 ms** to draw its response. The same
      page with a handful of fixes shows **44 ms**, **644 ms**, no blocking task, a shift of **0**, and **32 ms**.
      Same server, same bytes (nearly), very different experience.

      A second surprise: the page looked fine in the lab, yet customers on phones complain. A lab run is **one**
      device on **one** network; your customers are a **distribution**. The honest report says what the lab shows,
      what the field shows, and where each is blind.

      This lesson is about measuring the page, not the server: the numbers browsers report, the difference between
      lab and field, how to take the page apart, and where a frontend test ends and a load test begins.

  - id: what
    kind: what
    concepts: [perf-fe-vitals, perf-fe-labfield, perf-fe-waterfall]
    title: What frontend performance testing is
    body: |
      **Frontend performance testing** measures how fast a page *feels* and *behaves* in a browser: when content
      shows up, how soon the page reacts to input, and whether it stays still. It runs a real (or real-engine)
      browser, so it sees what a protocol-level load tool cannot.

      - **Core Web Vitals** are three user-centred metrics that web.dev recommends every site measure:
        **LCP** (Largest Contentful Paint - loading: when the largest content element is drawn),
        **INP** (Interaction to Next Paint - responsiveness: how long the page takes to show the result of an
        interaction) and **CLS** (Cumulative Layout Shift - visual stability: how much content moves around).
        Each has a "good" limit, and the **75th percentile** of page loads is what is compared with it.
      - **Lab data** comes from loading the page in a controlled setup (Lighthouse, a scripted Chrome): repeatable,
        and you can look inside. **Field data** (real-user monitoring, RUM, or the Chrome User Experience Report)
        comes from real visits: it shows who is affected, and you cannot look inside.
      - **Diagnostics** explain the numbers: the **network waterfall** (a HAR file), the four **parts of LCP**,
        **long tasks** and **total blocking time (TBT)**, request counts and bytes by type.
      - A **performance budget** is "a set of limits imposed on metrics that affect site performance" (web.dev):
        page weight, number of requests, a milestone timing. A budget lets a build fail when a change breaks it.

      What it is **not**: a load test. It measures one browser loading one page. It says nothing about how the
      servers behave when 500 browsers do that at once, and a load tool does not draw the page at all. The two answer
      different questions and a real engagement uses both.

  - id: why
    kind: why
    concepts: [perf-fe-vitals, perf-fe-labfield, perf-fe-waterfall]
    title: Why it matters
    body: |
      **The server can be fast and the page slow.** In the capture below, the quote API answers in 43 ms and the HTML
      in 3 ms; the page still shows its main image after a second, because the image was asked for 370 ms late and
      the server takes 600 ms to send it. A load test sees none of that.

      **A load test can be green while users wait.** Response time is measured to the last byte; a browser needs the
      page to be *rendered*, and that depends on the order of requests, blocking scripts and layout.

      **Frontend problems are cheap to find and cheap to keep out.** A budget check in the build costs seconds; the
      same problem found in production costs a release.

      **The check on real users is different from the check in the lab.** Lab: "my page loads in 644 ms". Field:
      "a quarter of mobile visits take over 3.1 seconds". Without both you either miss the problem (lab only) or
      cannot find its cause (field only).

      **The two kinds of test fail differently.** On our fixed page, with 24 clients keeping the quote API busy, the
      browser's LCP does not move (644 ms to 648 ms median) while the quote that the page fetches takes **2.4 times as
      long** to appear (284 ms to 672 ms). A frontend test alone would call this fine; a load test alone would not
      know what the page does with the slow answer. Together they tell the story.

  - id: vitals-internals
    kind: internals
    concepts: [perf-fe-vitals]
    title: Internals - the three metrics, the thresholds and the 75th percentile
    body: |
      ### The thresholds

      As documented on web.dev (21 November 2026):

      | Metric | Measures | Good | Needs improvement | Poor |
      | --- | --- | --- | --- | --- |
      | LCP | loading | 2.5 s or less | between | more than 4 s |
      | INP | responsiveness | 200 ms or less | between | more than 500 ms |
      | CLS | visual stability | 0.1 or less | between | more than 0.25 |

      The LCP "poor" limit of 4 seconds is the one shown in web.dev's lab-and-field article (the 88 % / 8 % / 4 %
      example); the INP and CLS pages state theirs directly. A value **exactly on the good limit is good**; the
      code in this lesson treats the limits that way.

      ### The 75th percentile

      A page is not rated by its average or its median. web.dev: "a good threshold to measure is the 75th percentile
      of page loads, segmented across mobile and desktop devices", and "a page [passes] if it meets the recommended
      targets at the 75th percentile for all three of the Core Web Vitals metrics". Read it as: **three out of four
      visits must be at least that good, for every one of the three metrics**. The code takes the nearest rank:
      sort, then element number `ceil(0.75 x n)`.

      Segmenting matters because the blend can hide a group. In the synthetic field data of this lesson the
      blended LCP at the 75th percentile is 2518 ms (needs improvement, by 18 ms), desktop alone is 2044 ms (good),
      and mobile alone is 3146 ms (needs improvement). Neither number is "the" answer; the segments are.

      ### LCP, INP and CLS in a sentence each

      - **LCP** is the render time of the largest image or text block in the viewport, as the page loads. The LCP
        element can differ between visits (screen size, logged-in content, an A/B test), which is one reason lab
        and field disagree.
      - **INP** looks at the interactions during a visit (clicks, taps, key presses) and reports a value close to
        the slowest one: the time from the input until the next frame is drawn. It needs interaction, which a
        passive lab load does not have.
      - **CLS** adds up the movement of content between frames. Each shift scores *impact fraction x distance
        fraction*. Since the metric was revised the page's CLS is the **largest session window**: shifts that
        occur "with less than 1-second in between each shift and a maximum of 5 seconds for the total window
        duration" form a window, and the biggest window wins. Shifts within 500 ms of user input are flagged
        `hadRecentInput` and not counted.

      ### Related, not core

      **FCP** (first contentful paint) and **TTFB** (time to first byte) are diagnostic. **TBT** (total blocking
      time) is a lab-only measure: the sum of the part over 50 ms of each long task after FCP. web.dev says it
      "may be a reasonable proxy metric for INP, but it's not a substitute for INP in and of itself".

  - id: labfield-internals
    kind: internals
    concepts: [perf-fe-labfield]
    title: Internals - lab and field, and why they disagree
    body: |
      ### Two kinds of data

      - **Lab data:** "data collected in a controlled environment with predefined device and network settings"
        (web.dev). A lab test is "a single device ... connected to a single network ... run from a single
        geographic location". Its purpose is to "control for as many factors as you can, so the results are (as
        much as possible) consistent and reproducible from run to run". Lighthouse is the best-known tool; it
        "runs a series of audits against the page" and can run in Chrome DevTools, from the command line or as a
        Node module (from the docs, not run here).
      - **Field data** (RUM): the measurements of "all users who visit a page", reflecting "the actual devices,
        network conditions, and geographic locations of your users". web.dev stresses that it "is not just one
        number, it's a distribution of numbers". The Chrome User Experience Report shows such a distribution
        over 28 days; tools that report a single field score use the 75th percentile.

      ### Why the numbers differ

      - The **population** differs: a lab run is one point in the distribution, and "may or may not accurately
        represent the 75th percentile". In our data the lab says 644 ms for the fixed page and the synthetic
        mobile field p75 is 3146 ms; a lab ratio of 0.2 is not a contradiction, it is a fast machine on loopback
        with no throttling.
      - The **LCP element** can differ (screen size, personalisation, A/B tests, fonts, URL fragments).
      - **INP** needs interaction. web.dev: some lab tools "won't report a page's INP because they only observe
        the loading of a page without any interactions". You can script a click, as the capture in this lesson
        does, but it is one interaction you chose, not what users do.
      - **CLS and others** in the field include behaviour a lab load never has (scrolling, late content, back/forward
        cache).

      ### A lab run is a sample

      Lighthouse's own variability notes list the sources: "page nondeterminism", local network variability,
      client hardware, resource contention, browser nondeterminism. Its advice: "Run Lighthouse multiple times and
      beware of variability before drawing conclusions". That is the lesson of [Reading load test
      results](reading-load-test-results) again: repeat the run, look at the spread, compare against it. In our
      five runs of the same page the LCP spread was 1.2 % - tiny, because the page is deterministic and the machine
      was quiet. A real site with ads and A/B tests will not be that calm.

      ### What each is for

      | Question | Use |
      | --- | --- |
      | Do real users have a problem, and how many? | field data, segmented |
      | Why is this page slow, and did my fix work? | lab runs, repeated |
      | Will this change make the page worse? | lab runs in CI against a baseline and a budget |
      | Which interactions are slow for real people? | field INP, then reproduce in the lab |

  - id: waterfall-internals
    kind: internals
    concepts: [perf-fe-waterfall]
    title: Internals - the waterfall, the parts of LCP, blocking time and budgets
    body: |
      ### The HAR file

      A **HAR** (HTTP Archive, version 1.2) records every request of a page load. Each entry has a start time, a
      total `time` in milliseconds and a `timings` object: `blocked`, `dns`, `connect`, `ssl`, `send`, `wait`
      (waiting for the server's first byte) and `receive`. The specification says each is milliseconds and "use -1
      if the timing does not apply to the current request"; the entry `time` is "the sum of all timings available in
      the timings object (i.e. not including -1 values)". Sizes are in `response.bodySize` (`-1` if unknown) and
      `response.content.size`; Playwright adds a `_transferSize`. Subtract the page's start from each entry's
      start and you have a **waterfall**: which request began when, and what each waited for.

      Two reads matter most: **what started late** (a request that begins only after a script ran) and **what is
      big or slow** (`wait` is the server, `receive` is the size over the network).

      ### The four parts of LCP

      When the LCP element is an image, web.dev splits LCP into four parts "with no overlap or gap":

      | Part | Time between | Healthy share |
      | --- | --- | --- |
      | TTFB | page start and the first byte of the HTML | about 40 % |
      | Resource load delay | first byte and the start of the image request | under 10 % |
      | Resource load duration | the image request, start to end | about 40 % |
      | Element render delay | the image finished and the element drawn | under 10 % |

      The two with "delay" in their names should be close to zero; the other two are real network work. web.dev
      warns that fixing one part can just move time to another: shrinking the image shortens the load duration
      but, on a page that hides the element until a script runs, the render delay grows by the same amount.

      On our slow page the parts are 4.4 ms, **366.4 ms**, 602.5 ms and 26.7 ms (total 1000 ms): a large load
      delay, because the image is created by a script that runs late. On the fixed page they are 2.9, 19.2, 602.3
      and 19.6 ms (total 644 ms). The load **duration** is the same 600 ms in both: that is the server's delay on
      the image, and no frontend change touches it. The next fix is on the server or a CDN.

      ### Long tasks and total blocking time

      A **long task** keeps the main thread busy for more than 50 ms; during it the page cannot respond. The
      **blocking time** of a task is its duration over 50 ms, and **total blocking time** is the sum for the long
      tasks "after FCP". web.dev's example: three tasks of 51 ms give a TBT of 3 ms, one task of 10 seconds gives
      9950 ms. Tasks before first paint are not in TBT (but they delay the paint itself); the window usually ends
      at the point the page is interactive or loaded.

      ### Budgets

      web.dev separates **quantity-based** budgets (bytes, requests, number of fonts) from **milestone timings**
      (FCP, LCP, TBT). Quantities are easy to check and explain but "don't tell you much about the user
      experience": two pages of the same weight can render differently depending on the order of requests. A good
      budget has both kinds, and its numbers come from a baseline you measured, not from a wish.

  - id: when
    kind: when
    concepts: [perf-fe-vitals, perf-fe-labfield, perf-fe-waterfall]
    title: When to use each tool
    body: |
      - **Field data / RUM** - to know whether real users have a problem and which segments (device, country,
        page). Needed for INP and for the 75th-percentile verdict. Start here when a complaint arrives.
      - **A scripted lab run (Lighthouse or a Playwright script)** - to find causes and to check a fix. Run it
        several times on the same machine and compare with the spread.
      - **A HAR waterfall** - when a page feels slow and you need to know *what started late or took long*.
      - **LCP parts** - when LCP is poor and you need to know which part to attack.
      - **TBT** - as a lab stand-in when you cannot measure INP; with the caveat that it is not INP.
      - **A budget in CI** - to keep a regression from shipping; use bytes and requests for early warning and a
        milestone timing for the user experience.
      - **A load test** - when the question is about the *servers* under many users. For a page that depends on a
        slow API, run the load and a browser measurement together.

      Do **not** use a lab number as "the" performance of the page, do **not** call a page fast from one
      localhost run, and do **not** drive a load test with a real browser per virtual user unless you need
      rendering at that scale - it is costly and usually unnecessary.

  - id: visual
    kind: visual
    concepts: [perf-fe-vitals, perf-fe-labfield, perf-fe-waterfall]
    title: How the pieces fit
    body: |
      ```mermaid
      flowchart TD
        C["Complaint: the page is slow"] --> F["Field data, segmented: who, how many, which metric at the 75th percentile"]
        F --> L["Lab runs, repeated: reproduce on a controlled setup, note the spread"]
        L --> W["HAR waterfall: what started late, what was big or slow"]
        W --> P["LCP parts, long tasks and TBT, layout shifts"]
        P --> X["Fix one thing, repeat the lab runs"]
        X --> B["Budget in CI: bytes, requests, a milestone timing"]
        B --> R["Load test the backend if the page waits on slow APIs"]
      ```

      ```mermaid
      flowchart LR
        A["Page start"] -- "TTFB 4 ms" --> B["First byte"]
        B -- "load delay 366 ms" --> C["Image requested"]
        C -- "load duration 603 ms" --> D["Image downloaded"]
        D -- "render delay 27 ms" --> E["LCP at 1000 ms"]
      ```

      The flowchart is the order of work; the second diagram is the slow page's LCP as four parts. On the fixed
      page the second arrow shrinks from 366 ms to 19 ms - that is the whole improvement.

  - id: code-vitals
    kind: code
    concepts: [perf-fe-vitals]
    title: Rating, percentile, CLS windows and a verdict in Python
    body: |
      The reference solution of `analysis/fe_vitals.py`, trimmed to the functions (the exercise has the full
      docstring):

      ```python
      import math

      THRESHOLDS = {"lcp": (2500, 4000), "inp": (200, 500), "cls": (0.1, 0.25)}


      def rate(metric, value):
          if metric not in THRESHOLDS:
              raise ValueError(f"unknown metric {metric!r}")
          if value < 0:
              raise ValueError("a metric value cannot be negative")
          good, poor = THRESHOLDS[metric]
          if value <= good:
              return "good"
          if value > poor:
              return "poor"
          return "needs improvement"


      def percentile(values, pct):
          if not values:
              raise ValueError("no values")
          data = sorted(values)
          return data[math.ceil(pct / 100 * len(data)) - 1]


      def cls(shifts):
          kept = sorted((s for s in shifts if not s["hadRecentInput"]), key=lambda s: s["startTime"])
          best = total = 0.0
          first = last = None
          for s in kept:
              t = s["startTime"]
              if first is not None and t - last < 1000 and t - first < 5000:
                  total += s["value"]
              else:
                  total, first = s["value"], t
              last = t
              best = max(best, total)
          return best


      def assess(samples):
          out = {}
          for metric in THRESHOLDS:
              values = [s[metric] for s in samples if s.get(metric) is not None]
              if values:
                  p75 = percentile(values, 75)
                  out[metric] = {"p75": p75, "rating": rate(metric, p75), "n": len(values)}
              else:
                  out[metric] = {"p75": None, "rating": None, "n": 0}
          out["passes"] = all(out[m]["rating"] == "good" for m in THRESHOLDS)
          return out
      ```

      And the HAR and lab helpers from `fe_har.py` and `fe_lab.py`:

      ```python
      def waterfall(har):
          page_start = datetime.fromisoformat(har["log"]["pages"][0]["startedDateTime"])
          rows = []
          for e in har["log"]["entries"]:
              start = (datetime.fromisoformat(e["startedDateTime"]) - page_start).total_seconds() * 1000
              rows.append({"path": _path(e), "start": round(start, 1), "end": round(start + total_time(e), 1)})
          return sorted(rows, key=lambda r: r["start"])


      def lcp_parts(ttfb, request_start, response_end, lcp):
          if not (0 <= ttfb <= request_start <= response_end <= lcp):
              raise ValueError("expected 0 <= ttfb <= request_start <= response_end <= lcp")
          return {
              "ttfb": round(ttfb, 1),
              "load_delay": round(request_start - ttfb, 1),
              "load_duration": round(response_end - request_start, 1),
              "render_delay": round(lcp - response_end, 1),
          }


      def total_blocking_time(tasks, fcp, until=None):
          total = 0.0
          for t in tasks:
              if t["startTime"] < fcp or (until is not None and t["startTime"] >= until):
                  continue
              if t["duration"] > 50:
                  total += t["duration"] - 50
          return total
      ```

  - id: line-by-line
    kind: line-by-line
    concepts: [perf-fe-vitals, perf-fe-labfield, perf-fe-waterfall]
    title: Line by line - the choices that matter
    body: |
      **`rate`**

      - '`value <= good` and `value > poor` - the good limit is inclusive and the poor limit is exclusive, as the'
        thresholds are written ("200 milliseconds or less", "greater than 500 milliseconds"). A test pins both
        edges.
      - 'The `ValueError` for an unknown metric stops `rate("fid", 50)` from silently rating a retired metric.'

      **`percentile`**

      - '`ceil(pct / 100 * n) - 1` - the nearest-rank index. For four values the 75th percentile is the **third**,
        not the fourth: `int(0.75 * 4)` is 3, which would pick the largest. That off-by-one is the bug in the debug
        exercise.'

      **`cls`**

      - '`not s["hadRecentInput"]` - shifts right after input are expected and do not count.'
      - '`t - last < 1000 and t - first < 5000` - both conditions must hold to stay in the window: a shift less than
        a second after the previous one, and less than five seconds after the window started. Either failing opens
        a new window, which restarts `total`.'
      - '`best = max(best, total)` - CLS is the **largest** window, not the sum of all shifts. A page that shifts a
        little every ten seconds scores the worst single burst.'

      **`assess`**

      - '`s.get(metric) is not None` - a visit with no interaction has no INP; it is skipped, not counted as 0
        (which would make INP look better than it is).'
      - 'A metric with no values gives `rating: None` and the page does **not** pass: not measuring a metric is
        not the same as passing it.'

      **`waterfall`, `lcp_parts`, `total_blocking_time`**

      - 'The start offset is the entry start minus the **page** start, so offsets from different pages are not
        comparable. In our HAR the page start is about 7 ms before the browser reports its own navigation start;
        the HAR hero request starts at 378 ms and the browser timing says 371 ms.'
      - 'The `ValueError` in `lcp_parts` catches inputs that cannot be a real run (an image that finished before
        it started); the four parts are only a true split when the milestones are in order.'
      - '`t["duration"] > 50` - a task of exactly 50 ms is not long. `t["startTime"] < fcp` - tasks before first
        paint are skipped, and `until` keeps the long task a later click causes out of a page-load number.'

  - id: steps
    kind: steps
    concepts: [perf-fe-vitals, perf-fe-labfield, perf-fe-waterfall]
    title: Steps - investigating a slow page
    body: |
      1. **Start with the field, segmented.** For each of mobile and desktop, get LCP, INP and CLS at the 75th
         percentile and the share of good, needs improvement and poor visits. Say which metric and which segment
         fails. If you have no field data, say so, and treat everything below as lab-only.
      2. **Reproduce in the lab.** One scripted run per fix is not enough: run each version at least 5 times on the
         same machine, same browser version, same throttling. Record the spread.
      3. **Take the page apart.** Save a HAR. Summarise requests and bytes by type, list the waterfall, and find
         what started late and what was big or slow.
      4. **Split LCP into its four parts** and find the largest one that should be small. A large load delay is
         a discovery problem (late request); a large load duration is size or the server; a large render delay is
         blocking.
      5. **Look at the main thread.** List the long tasks and compute TBT for a stated window. Note which ones fall
         before first paint.
      6. **Check layout shifts.** Compute CLS from the shift entries; find what moved (usually an image or embed
         without a size, or content inserted above existing content).
      7. **Change one thing, repeat the runs, compare with the spread** - the same discipline as a load test.
      8. **Write the budget** from the fixed page (requests, bytes, one milestone timing) and run the check in CI.
      9. **If the page waits on APIs, load the backend** and measure the page again while it is busy.
      10. **Report** the field and lab numbers separately, with the machine, browser version and number of runs.

  - id: example
    kind: example
    concepts: [perf-fe-vitals, perf-fe-labfield, perf-fe-waterfall]
    title: Worked example - the SandPay checkout page
    body: |
      Real Chrome 157 runs of the two local versions, five each, 21 November 2026 (median and [min-max]):

      ```
      page   FCP ms        LCP ms           CLS            TBT ms     one click ms   quote shown ms
      slow   404 [388-408]  1000 [996-1008]  0.158 [same]   150 [same]  128 [same]     414.5 [411.8-419.6]
      fixed   44 [40-48]    644 [644-652]    0     [same]     0 [same]   32 [24-32]    284.1 [281.8-290.3]
      ```

      *"One click" is the longest event-timing duration of a single scripted click, a proxy for one interaction -
      not a field INP. "Quote shown" is when the page's own script displayed the API answer.*

      **Field first (synthetic).** The 400 made-up visits give, at the 75th percentile:

      ```
      mobile  (163 visits)  LCP 3146 ms needs improvement  INP 282 ms needs improvement  CLS 0.223 needs improvement  passes False
      desktop (237 visits)  LCP 2044 ms good               INP 122 ms good               CLS 0.037 good               passes True
      blended               LCP 2518 ms needs improvement  INP 186 ms good               CLS 0.109 needs improvement  passes False
      ```

      Mobile fails all three and desktop passes; the blend fails LCP by 18 ms and CLS by 0.009, which would hide
      that desktop is fine. Of mobile LCP visits 54.6 % are good, 33.1 % need improvement and 12.3 % are poor.

      **Lab: the lab is far faster than the field.** `lab_vs_field` on the fixed page's five LCP runs against the
      mobile field p75 gives a median of 644 ms, a spread of 0.012, a ratio of 0.2 and the verdict **"lab faster"**.
      That is exactly what a loopback run with no throttling should say; it does not mean mobile users are fine. The
      lab is for comparing versions and finding causes, not for predicting the field number.

      **The waterfall of the slow page** (`har_slow.json`, ms from the page start):

      ```
      /slow/                 11.0 -   14.5
      /static/app.css        24.0 -  334.2
      /static/vendor.js      24.0 -  141.4
      /static/app.js         24.0 -  138.8
      /static/analytics.js   24.0 -  192.7
      /api/quote            378.0 -  421.1
      /static/hero.svg      378.0 -  981.7
      ```

      The hero image is the slowest request (600 ms of server time) and it starts at **378 ms**, after
      `app.js` has run and created the `<img>`. On the fixed page it starts at **18 ms** (a preload and the image in
      the HTML) and ends at 621 ms. The slow page also makes 7 requests and 351 929 bytes against 5 and 332 576:
      `analytics.js` and the stylesheet are extra, and the fixed page inlines its CSS.

      **LCP in parts** (first run): slow 4.4 + **366.4** + 602.5 + 26.7 = 1000 ms; fixed 2.9 + 19.2 + 602.3 + 19.6 =
      644 ms. The fix removed 347 ms of load delay. What is left is the 600 ms the server takes to send the image;
      no frontend change can touch that.

      **Main thread and layout:** the slow run has two long tasks, 200 ms at 668 ms (a "late widget") and 121 ms at
      1715 ms (the click handler). With the window from first paint to the load event, TBT is **150 ms**; with no
      window it is **221 ms**, because the click's task is counted too. The single layout shift is 0.158 at 985 ms,
      when the image finally appears and pushes the text down. The fixed page reserves the space with `width` and
      `height`.

      **A budget** of at most 6 requests, 290 000 JavaScript bytes and 340 000 bytes in total fails the slow page on
      all three (`bytes: 351929 > 340000`, `js_bytes: 298719 > 290000`, `requests: 7 > 6`) and passes the fixed one.

      **Not load testing.** The same fixed page was loaded five more times while 24 clients kept calling `/api/quote`
      (a backend that serves about 50 requests per second): LCP median 648 ms (was 644), quote shown **672.5 ms** (was
      284.1). A frontend metric did not move; the backend's answer took 2.4 times as long.

      *Hypothetical, to show the thinking; figures invented for the story.* SandPay's real checkout is reported
      "slow on phones". The team sees field LCP of 3.4 s at the 75th percentile on mobile, finds in the waterfall that
      the banner is injected by a script, moves it into the HTML with a size and `fetchpriority`, and sees lab LCP
      drop by a third. They add a request-count and an LCP budget to CI, and ask the performance team to run the
      quote API under load, since the checkout waits on it.

  - id: tests
    kind: tests
    concepts: [perf-fe-vitals, perf-fe-labfield, perf-fe-waterfall]
    title: How the exercises are tested
    body: |
      Three files under `practice/perf/tests/analysis/` check your three modules with hand-made data and then the
      saved real runs. **No test starts a browser**, so they are quick and run anywhere.

      - '`test_fe_vitals.py` (14 tests) - the limits of each metric with the edge values on both sides; unknown'
        metric and negative values; nearest-rank percentile; CLS with no shifts, shifts after input, shifts under a
        second apart, two windows (largest wins), a window closed at five seconds, unsorted input; `assess` with a
        missing INP, a metric nobody measured, and the pass rule; `distribution`; the synthetic field data split by
        device (desktop passes, mobile does not, the blend lies between); and the real slow and fixed runs (CLS
        "needs improvement" against zero).
      - '`test_fe_har.py` (10 tests) - `-1` and missing timings, the sum, the size fallbacks (including a cached'
        body of 0), mime types, summary, waterfall order and offsets, budget edges; then the real HARs (7 requests
        against 5, the hero image more than 200 ms later on the slow page, a budget built from the fixed page
        catching the slow one, and each entry's `time` equal to the sum of its timings).
      - '`test_fe_lab.py` (12 tests) - the LCP parts add up and bad orders raise; `dominant`; the web.dev TBT'
        examples, the 50 ms edge, the `fcp` and `until` edges; `lab_vs_field` verdicts and the tolerance edges; then
        the real runs (load delay over 250 ms on the slow page and under 50 ms on the fixed, TBT between 140 and 160
        ms against 0, the fast lab against the mobile field).

      The tests check **behaviour and shape**, never absolute timings, because the saved numbers come from one
      machine. Regenerate them with `support/fe_capture.py` (needs Node from `.nvmrc` and Chrome); the tests keep
      passing as long as the story holds.

      Run them as the CI does: `PERF_TARGET=solutions .venv/bin/python -m pytest tests/analysis/test_fe_*.py -q`
      passes (36 tests); against the unsolved exercises every test fails.

  - id: mistakes
    kind: mistakes
    concepts: [perf-fe-vitals, perf-fe-labfield, perf-fe-waterfall]
    title: Common mistakes
    body: |
      - **Calling a page fast from one lab run on a developer machine.** Unthrottled, local, warm - the
        field p75 may be five times worse. Use the lab to compare and explain, not to predict.
      - **Using the average or the median instead of the 75th percentile** for the Core Web Vitals verdict.
      - **Blending mobile and desktop** (or countries). Segment before you judge; one segment can fail while the
        blend passes, or the reverse.
      - **Treating the field number as one number.** It is a distribution; show the shares of good, needs
        improvement and poor visits.
      - **Expecting INP from a passive lab load.** Without interaction there is no INP; TBT is a proxy, not a
        substitute.
      - **One run per version.** Repeat at least five times and look at the spread before saying "faster".
      - **Optimising one part of LCP and not checking where the time went.** Shrinking an image can move time to the
        render delay instead of removing it.
      - **Optimising the load duration when the problem is the load delay** (or the server). Split LCP first.
      - **Summing every layout shift for CLS.** CLS is the largest session window and ignores shifts after input.
      - **Counting a long task from before first paint in TBT** - or forgetting to bound the window and counting
        the task a later click causes.
      - **Writing a budget from a wish.** Take it from a measured, healthy baseline; a budget on bytes alone says
        nothing about the experience.
      - **Believing a green frontend test means the backend is fine** - or the reverse. They answer different
        questions.
      - **Driving a load test with a browser per user** by default. JMeter's own page says it "is not a browser,
        it works at protocol level" and "does not execute the Javascript found in HTML pages"; that is what makes it
        cheap to run thousands of users, and why it never sees the effects in this lesson.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [perf-fe-vitals, perf-fe-labfield, perf-fe-waterfall]
    title: Trade-offs
    body: |
      - **Lab versus field:** the lab is repeatable and explains causes but represents one setup; the field is real
        and covers everyone but needs a monitoring script, takes days to collect and cannot tell you why. Use field
        to find the problem and the lab to fix it.
      - **Throttling:** simulating a slow phone and network makes the lab closer to the field and the numbers larger;
        it also adds variability and choices to argue about. No throttling (as here) is repeatable but optimistic;
        state which you used.
      - **Number of lab runs:** five gives a spread you can believe; more costs CI time. Lighthouse's advice is to
        run it multiple times; a noisy page needs more.
      - **Budget kinds:** bytes and request counts are stable, quick and easy to explain but blind to order; a timing
        budget reflects experience but is noisier. Use both, and make the timing budget a margin over a baseline.
      - **Real browser versus protocol-level load:** a browser shows what users see and is expensive per virtual
        user; a protocol-level tool scales cheaply and sees only the server. Run the browser at low scale
        (one or a few) while the protocol tool puts the load on.
      - **A proxy (TBT) versus the real thing (INP):** TBT is available in the lab and easy to gate on; INP is what
        users feel but needs field data. Gate on TBT, monitor INP.

  - id: summary
    kind: summary
    concepts: [perf-fe-vitals, perf-fe-labfield, perf-fe-waterfall]
    title: Summary
    body: |
      - Frontend performance testing measures what one browser goes through to render a page. A fast server does
        not make a fast page: on the slow checkout page the API answered in 43 ms and the main image still
        appeared at 1000 ms.
      - The Core Web Vitals are LCP (good at 2.5 s or less, poor above 4 s), INP (200 ms, 500 ms) and CLS (0.1, 0.25).
        A page passes when all three are good at the **75th percentile**, per segment. Exactly on the good limit is
        good.
      - CLS is the **largest session window** of layout shifts (gaps under 1 s, window under 5 s), ignoring shifts
        after input - not the sum of all shifts.
      - Lab data is one controlled, repeatable load that explains causes; field data is a distribution of real
        visits that says who is affected. They differ by design (population, LCP element, interaction), so the
        fixed page's 644 ms in the lab and 3146 ms mobile p75 in the synthetic field are not a contradiction.
      - INP needs interaction; lab tools may not report it, and TBT is a proxy, not a substitute.
      - A HAR waterfall shows what started late; LCP splits into TTFB, load delay, load duration and render delay.
        Our slow page lost 347 ms to a late request (load delay 366 ms against 19 ms), and the remaining 600 ms was
        the server's.
      - TBT is the part over 50 ms of each long task after first paint, for a stated window: 150 ms on the slow page,
        0 on the fixed one.
      - A budget (requests, bytes by type, a milestone timing) from a healthy baseline lets CI catch a regression.
      - A frontend test is not a load test: with 24 clients on the quote API the browser's LCP stayed at 648 ms
        while the quote took 672 ms instead of 284 ms. Use both.

exercises:
  - id: fe-three-metrics
    type: mcq
    concept: perf-fe-vitals
    skill: recognition
    title: What the three vitals measure
    prompt: Which pairing of Core Web Vital and what it measures is correct?
    options:
      - id: right
        text: LCP measures loading, INP measures responsiveness and CLS measures visual stability.
        feedback: Correct - these are the three aspects web.dev lists, and each has a good limit (2.5 s, 200 ms and 0.1).
      - id: swap
        text: LCP measures responsiveness, INP measures loading and CLS measures server speed.
        feedback: INP is the interaction metric and LCP the loading metric; none of the three measures the server directly.
      - id: tti
        text: LCP is the time until the page can be used, INP is the time to first byte and CLS is the page weight.
        feedback: TTFB is a separate diagnostic metric, and CLS is about content moving around, not bytes.
      - id: fid
        text: INP is the old name of First Input Delay.
        feedback: INP replaced FID as the stable responsiveness metric in 2024, and it considers the whole interaction, not just the delay before it starts.
    correct: [right]
    hints:
      - Think of loading, interactivity and visual stability.
    solution: |
      LCP is loading, INP is responsiveness, CLS is visual stability.

  - id: fe-passes
    type: mcq
    concept: perf-fe-vitals
    skill: application
    title: When does a page pass?
    prompt: A page has LCP 2.0 s, INP 150 ms and CLS 0.3, all at the 75th percentile of its mobile page loads. What does the Core Web Vitals assessment say?
    options:
      - id: fail
        text: It does not pass, because CLS at the 75th percentile is above the good limit of 0.1 (and above the poor limit of 0.25), even though the other two are good.
        feedback: Correct - all three metrics must be good at the 75th percentile.
      - id: pass
        text: It passes, because two of the three metrics are good.
        feedback: The rule is all three, not a majority.
      - id: average
        text: It passes if the average of the three scores is good.
        feedback: The metrics have different units and are never averaged; each is checked against its own limit.
      - id: median
        text: It depends on the median visit, not the 75th percentile.
        feedback: web.dev uses the 75th percentile so that most visits, not half, meet the target.
    correct: [fail]
    hints:
      - How many metrics must be good, and at which percentile?
    solution: |
      All three must be good at the 75th percentile; CLS 0.3 is poor, so the page fails.

  - id: fe-field-distribution
    type: mcq
    concept: perf-fe-labfield
    skill: analysis
    title: A distribution, not a number
    prompt: A field report shows LCP at the 75th percentile of 1.8 s, and 4 % of visits above 4 s. A lab run says 3.0 s. What is the best reading?
    options:
      - id: both
        text: Both are valid points of different things - the lab is one controlled load, the field a distribution; the lab value is one of the many loads that make up the field, and you would investigate why this lab setup is slower.
        feedback: Correct - this is web.dev's own example (1.8 s field p75, 3.0 s lab), and the advice is to understand the difference, not to pick a winner.
      - id: lab
        text: The lab is right and the field data is wrong, because the lab is controlled.
        feedback: Control makes a lab repeatable, not representative of real users.
      - id: field
        text: The field is right, so the lab can be ignored.
        feedback: The lab is where you can see inside the page and test a fix; it is just not a prediction of the field number.
      - id: avg
        text: Average the two to get the true LCP.
        feedback: Averaging a single lab load with a distribution has no meaning.
    correct: [both]
    hints:
      - Which one is one run and which one is many visits?
    solution: |
      Different things: one controlled load against a distribution of real visits; investigate the gap.

  - id: fe-lab-inp
    type: mcq
    concept: perf-fe-labfield
    skill: recognition
    title: INP in the lab
    prompt: A lab tool loads your page and reports LCP and CLS but no INP. Why, and what is a reasonable lab stand-in?
    options:
      - id: interaction
        text: INP needs user interactions and a passive page load has none; Total Blocking Time is a reasonable proxy, though not a substitute, and you can script a click to reproduce a slow interaction.
        feedback: Correct - this follows the INP page; field data is the best source of INP.
      - id: broken
        text: The tool is broken; every lab tool must report INP.
        feedback: Some lab tools only observe loading and do not report it.
      - id: lcp
        text: LCP is a good substitute for INP.
        feedback: LCP is about when content is drawn, not how the page responds to input.
      - id: zero
        text: INP is 0 when nobody interacts, so the page passes.
        feedback: No interactions means no INP value, which is not the same as a good one.
    correct: [interaction]
    hints:
      - What does INP need that a page load does not provide?
    solution: |
      INP needs interactions; use field INP, script interactions in the lab, and TBT only as a proxy.

  - id: fe-lcp-parts
    type: mcq
    concept: perf-fe-waterfall
    skill: analysis
    title: Which part of LCP to attack
    prompt: 'A page''s LCP is 2.4 s. Its parts are TTFB 0.2 s, load delay 1.1 s, load duration 0.9 s and render delay 0.2 s. Where should you look first?'
    options:
      - id: delay
        text: The load delay - the image is requested 1.1 s after the first byte, so find out why the browser discovers it late (injected by script, lazy-loaded, background image) and make it discoverable in the HTML or preload it.
        feedback: Correct - the load delay should be close to zero, and here it is the largest avoidable part.
      - id: image
        text: Compress the image, because the load duration is the largest part.
        feedback: The load duration is a real network cost; the load delay is avoidable waiting and is larger.
      - id: server
        text: Speed up the server, because TTFB matters most.
        feedback: TTFB is 0.2 s here, about 8 % of LCP.
      - id: render
        text: Reduce the render delay, because it is the last step.
        feedback: At 0.2 s it is already small; being last does not make it the biggest.
    correct: [delay]
    hints:
      - Which parts have the word delay, and what should they be?
    solution: |
      The load delay: the image is asked for far too late.

  - id: fe-cls-cause
    type: mcq
    concept: perf-fe-vitals
    skill: application
    title: Why did the text jump?
    prompt: On the slow checkout page, a banner image is added by a script without width or height, and 0.158 of layout shift is recorded when it arrives. What fixes it?
    options:
      - id: size
        text: Reserve the space - give the image width and height (or an aspect ratio) in the HTML so the layout does not change when it loads.
        feedback: Correct - the fixed page does this and its CLS is 0.
      - id: faster
        text: Make the image load faster, so the shift is shorter.
        feedback: A faster image still shifts the text when it arrives; the shift is the size of the move, not its duration.
      - id: hide
        text: Hide the text until the image has loaded.
        feedback: That moves the problem into a delayed paint and hurts LCP and FCP.
      - id: input
        text: Make the user click first, because shifts after input are not counted.
        feedback: Only shifts within 500 ms of an input are excluded, and forcing a click is not a fix.
    correct: [size]
    hints:
      - What does the browser know about the image's size before it arrives?
    solution: |
      Reserve the space with width and height.

  - id: fe-not-load
    type: mcq
    concept: perf-fe-waterfall
    skill: analysis
    title: Why not just use the load tool?
    prompt: A teammate says "we load test with JMeter, so our frontend performance is covered". What is the best answer?
    options:
      - id: protocol
        text: JMeter works at protocol level - it does not execute JavaScript or render the page, so it cannot see render-blocking files, late-discovered images, long tasks or layout shifts; it answers a different question (how the servers cope with many users).
        feedback: Correct - this is the JMeter home page's own statement.
      - id: yes
        text: They are right; response time to the last byte is the page load time.
        feedback: A browser still has to parse, run scripts and render after the last byte.
      - id: replace
        text: Replace JMeter with a real browser for every virtual user.
        feedback: That is costly and usually unnecessary; use a browser at low scale and the protocol tool for load.
      - id: nothing
        text: Frontend performance does not matter if the API is fast.
        feedback: The slow page in this lesson had a 43 ms API and a 1000 ms LCP.
    correct: [protocol]
    hints:
      - What does a protocol-level tool not do?
    solution: |
      It does not run scripts or render, so it cannot see frontend effects; the two kinds of test answer different questions.

  - id: fe-under-load
    type: mcq
    concept: perf-fe-waterfall
    skill: analysis
    title: LCP did not change under load
    prompt: With 24 clients hammering the quote API, a browser run of the page shows LCP 648 ms (idle 644 ms) but the quote text appears at 672 ms instead of 284 ms. What is the right conclusion?
    options:
      - id: both
        text: LCP does not depend on the quote here (the hero image is the LCP element), so it is blind to the backend slowing down; the page's own quote timing shows the effect, so measure the elements and API-dependent moments you care about, not just the vitals.
        feedback: Correct - a vital is only as informative as the page's LCP element; add your own marks for what users wait for.
      - id: fine
        text: The page is fine under load because LCP did not move.
        feedback: The quote that customers need took 2.4 times as long.
      - id: broken
        text: The browser test is wrong; LCP must change when the backend slows.
        feedback: LCP follows the largest element, which here is an image that does not call the API.
      - id: ignore
        text: Ignore the quote timing; only the Core Web Vitals count.
        feedback: The vitals are a starting set; business-critical moments deserve their own measurement.
    correct: [both]
    hints:
      - Which element is the LCP element, and does it use the API?
    solution: |
      LCP is blind to this; add a custom mark for the quote and measure it while the backend is loaded.

  - id: fe-tbt-window
    type: mcq
    concept: perf-fe-waterfall
    skill: application
    title: Which long tasks count?
    prompt: 'A run has long tasks of 200 ms at 100 ms, 120 ms at 500 ms and 80 ms at 900 ms. First contentful paint was at 400 ms. What is the total blocking time from first paint with no end bound?'
    options:
      - id: hundred
        text: '100 ms - the 200 ms task started before first paint and is skipped; the others block for 70 ms and 30 ms.'
        feedback: Correct - blocking time is duration over 50 ms for long tasks after FCP.
      - id: all
        text: '250 ms - the sum of all three tasks over 50 ms.'
        feedback: The first task started before first paint and is not counted.
      - id: total
        text: '400 ms - the sum of the three durations.'
        feedback: Only the excess over 50 ms counts, and only after FCP.
      - id: one
        text: '70 ms - only the largest task after FCP counts.'
        feedback: Every long task after FCP counts, so the 80 ms task adds its 30 ms.
    correct: [hundred]
    hints:
      - Skip tasks starting before FCP, then subtract 50 ms from each of the others.
    solution: |
      (120 - 50) + (80 - 50) = 100 ms.

  - id: fe-lab-spread
    type: mcq
    concept: perf-fe-labfield
    skill: application
    title: One Lighthouse run
    prompt: Last build's single lab run had LCP 1.9 s and this build's has 2.2 s, so the team wants to roll back. What do Lighthouse's own docs advise?
    options:
      - id: repeat
        text: Run it multiple times and beware of variability before drawing conclusions - repeat each build, compare the spread, and then decide.
        feedback: Correct - this is the advice in Lighthouse's variability documentation.
      - id: rollback
        text: Roll back; 300 ms is a regression.
        feedback: Without the run-to-run spread you cannot tell a regression from noise.
      - id: ignore
        text: Ignore lab runs altogether.
        feedback: Lab runs are the right tool once repeated and compared to their spread.
      - id: field
        text: Wait for the field data and never use lab data.
        feedback: Field data is slow to arrive and cannot say why; the lab is how you test a fix.
    correct: [repeat]
    hints:
      - How much does the number move when nothing changes?
    solution: |
      Repeat the runs and compare against the spread.

  - id: fe-late-hero
    type: mcq
    concept: perf-fe-waterfall
    skill: analysis
    title: The late hero image
    prompt: In the waterfall of the slow page the hero image starts at 378 ms although the HTML arrived at 14 ms, and an 'app.js' request finished at 139 ms. What is the likeliest cause and the first fix?
    options:
      - id: script
        text: A script creates the image element after it has run, so the browser cannot discover the image earlier; put the image in the HTML (with a size and a high fetch priority) or preload it.
        feedback: Correct - the fixed page does exactly this and the image starts at 18 ms.
      - id: server
        text: The server is slow to start sending the image; add a cache in front.
        feedback: The request itself begins late; the server's time shows up in the wait phase after it starts.
      - id: compress
        text: The image is too big; compress it.
        feedback: Size affects how long the request takes, not when it starts.
      - id: dns
        text: DNS lookup is slow.
        feedback: The timings show no DNS delay for this local page.
    correct: [script]
    hints:
      - What does the browser need before it can ask for an image?
    solution: |
      Late discovery: the script that inserts the image runs first. Make it discoverable in the HTML or preload it.

  - id: fe-order-diagnose
    type: order
    concept: perf-fe-labfield
    skill: application
    title: Investigating a slow page
    prompt: Put the steps for investigating a slow page in a sensible order.
    items:
      - id: field
        text: Read field data, segmented by device, at the 75th percentile
      - id: repro
        text: Reproduce in the lab with repeated runs and note the spread
      - id: har
        text: Save a HAR and find what started late or was big or slow
      - id: parts
        text: Split LCP into parts and check long tasks and layout shifts
      - id: fix
        text: Change one thing and repeat the runs
      - id: budget
        text: Add a budget check to CI from the measured baseline
      - id: load
        text: Load the backend if the page waits on slow APIs
    hints:
      - Who has the problem, then why, then the fix, then keeping it fixed.
    solution: |
      Field, lab reproduction, HAR, LCP parts and main thread, one change and repeat, budget, backend load.

  - id: fe-debug-percentile
    type: debug
    concept: perf-fe-vitals
    skill: analysis
    title: A pass that should have been a pass
    prompt: |
      This function should say whether a page's LCP is good at the 75th percentile. For the four visits 1000, 2000,
      2400 and 9000 ms it returns False, but the nearest-rank 75th percentile is 2400 ms and the page should pass.
      Which line is the defect?
    language: python
    code: |
      def lcp_is_good(samples):
          values = sorted(s["lcp"] for s in samples)
          index = int(0.75 * len(values))
          return values[index] <= 2500
    correctLines: [3]
    lineNotes:
      - line: 2
        note: Sorting the values is correct; the percentile needs them in order.
      - line: 4
        note: The comparison is right - exactly 2500 ms is still good.
    hints:
      - For four values, which index does `int(0.75 * 4)` give, and which element is that?
    solution: |
      Line 3. `int(0.75 * 4)` is 3, the last element (9000 ms). Nearest rank takes element `ceil(0.75 * n)` counting
      from 1, so the index is `ceil(0.75 * len(values)) - 1` = 2, the third value (2400 ms).

  - id: fe-short-lab-field
    type: short
    concept: perf-fe-labfield
    skill: analysis
    title: The lab says fast, customers say slow
    prompt: |
      Your lab run says the checkout page's LCP is 700 ms, but a merchant on a mid-range phone reports it as slow.
      Give two reasons both can be true and say what you would measure next.
    modelAnswer: |
      A lab run is one device, one network and one location, usually a fast machine with no throttling, so it is one
      point in a distribution; the merchant's phone and network sit far out in the slow tail. The LCP element can
      also differ (screen size, logged-in content), and real visits include things a lab load does not (cache state,
      third-party content, device contention). Next I would look at field data for the mobile segment at the 75th
      percentile and the shares of good, needs improvement and poor visits, then reproduce in the lab with mobile
      throttling and a repeated run, take a HAR and split LCP into its parts.
    rubric:
      - Says a lab run is one setup (device, network, location) and the field is a distribution.
      - Gives a second reason such as a different LCP element or behaviour the lab does not have.
      - Proposes field data segmented by device at the 75th percentile.
      - Proposes reproducing in the lab with throttling and repeated runs, and a waterfall or LCP parts.
    hints:
      - Is 700 ms one visit or all visits?
    solution: |
      Different populations and setups; check mobile field p75, then reproduce with throttling and take a waterfall.

  - id: fe-testdesign-budget
    type: testdesign
    concept: perf-fe-waterfall
    skill: application
    title: Test a budget check before CI trusts it
    prompt: |
      A CI step will fail the build when a page's request count, JavaScript bytes or total bytes exceed a budget
      taken from a HAR. Design test cases for the checker before it goes live.
    modelAnswer: |
      Preconditions: hand-made HAR files and one real HAR from a healthy build and one from a regressed build.

      1. **Within budget** - a HAR whose values equal the limits. Expected: pass (a limit equal to the value is
         allowed). Evidence: empty violation list and exit code 0.
      2. **Each limit alone** - exceed requests only, then JavaScript bytes only, then total bytes only. Expected: one
         violation each, naming the metric, value and limit. Evidence: the message text.
      3. **Several at once** - exceed two limits. Expected: both listed, in a stable order. Evidence: sorted list.
      4. **Missing kinds** - a page with no images or no scripts. Expected: the byte budget for that kind is 0, not a
         crash. Evidence: no exception.
      5. **Unknown sizes** - entries with `bodySize` of -1 and no transfer size. Expected: falls back to the content
         size and does not undercount. Evidence: the total equals the sum of the content sizes.
      6. **Cached responses** - a body size of 0 from a 304. Expected: counts as 0 bytes transferred, as the
         specification defines. Evidence: the byte total.
      7. **Real baseline** - the HAR of the healthy build with a budget taken from it. Expected: passes; the
         regressed HAR fails. Evidence: both results.
      8. **Empty or broken HAR** - no entries, or a missing `pages` list. Expected: fail loudly rather than pass.
         Evidence: non-zero exit and a message.
    rubric:
      - Each case has preconditions, input, expected result and evidence.
      - Covers the boundary (equal to the limit), each limit alone and several at once.
      - Covers missing kinds, unknown sizes and cached responses.
      - Uses a real healthy and a regressed HAR.
      - Covers an empty or broken HAR failing the build rather than passing.
    hints:
      - Which inputs would let a broken checker pass a bad page?
    solution: |
      Boundary, each limit, combinations, missing kinds, unknown and cached sizes, real healthy and regressed HARs,
      and broken input that must fail.

  - id: fe-interview-labfield
    type: interview
    concept: perf-fe-labfield
    skill: analysis
    title: 'Interview: Lighthouse is green but users complain'
    prompt: |
      "Our Lighthouse score is 95 but customers say the checkout page feels slow, and the load test passes. How would
      you find out what is wrong?"
    modelAnswer: |
      I would first separate three things. A Lighthouse score is one lab run on one simulated device, so I would
      check the field data - real-user monitoring or CrUX - for the checkout page, segmented by mobile and desktop at
      the 75th percentile for LCP, INP and CLS, and look at the shares of good, needs improvement and poor visits.
      INP in particular needs field data because a passive lab load has no interaction. Then I would reproduce in the
      lab with mobile throttling, run it several times and note the spread, take a HAR waterfall, split LCP into its
      four parts, list long tasks and compute total blocking time, and check layout shifts. The load test passing is
      not evidence about the page: a protocol-level tool does not run JavaScript or render. If the page waits on
      slow APIs I would measure the page in a browser while the load test runs. Finally I would put a budget and a
      TBT or LCP check in CI to keep the fix.
    rubric:
      - Explains that a Lighthouse score is one lab sample and asks for field data segmented at the 75th percentile.
      - Mentions that INP needs field data or a scripted interaction.
      - Reproduces in the lab with throttling and repeated runs, and uses a waterfall, LCP parts or TBT.
      - Says why a protocol-level load test does not cover frontend behaviour.
      - Proposes measuring the page while the backend is under load, and a CI budget.
    followUps:
      - How would you decide how many lab runs to do?
      - What would you do if field INP is poor but lab TBT is zero?
      - What would you put in the budget?
    hints:
      - Start with who is affected, then why, then how to keep it fixed.
    solution: |
      Field data by segment first, lab reproduction with spread, waterfall and LCP parts, the load-test gap, then a
      budget in CI.

  - id: fe-vitals-code
    type: coding
    concept: perf-fe-vitals
    skill: application
    title: Rate, percentile, CLS and a page verdict
    prompt: |
      Implement `rate`, `percentile`, `cls`, `assess`, `segment` and `distribution` in `exercises/analysis/fe_vitals.py`.
      The tests use hand-made values, real layout-shift entries from Chrome runs and synthetic field data; no browser
      is needed.
    project: perf
    files: [exercises/analysis/fe_vitals.py]
    test: tests/analysis/test_fe_vitals.py
    command: .venv/bin/python -m pytest tests/analysis/test_fe_vitals.py
    modelAnswer: |
      See "Rating, percentile, CLS windows and a verdict in Python". Key points - the good limit is inclusive and the
      poor limit exclusive; nearest rank is element `ceil(0.75 n)`; CLS is the largest session window and ignores
      `hadRecentInput`; `None` values are skipped and a metric with no values does not pass.
    rubric:
      - Every test in tests/analysis/test_fe_vitals.py passes.
      - Treats exactly the good limit as good and anything above the poor limit as poor.
      - Computes CLS as the largest session window, ignoring shifts after input.
      - Skips missing INP values and never passes a page with an unmeasured metric.
    hints:
      - Write `rate` and `percentile` first; the rest builds on them.
      - In `cls`, a shift joins the window only when both gaps are under their limits.
      - A visit without an interaction has `inp` of None; skip it.
    solution: |
      Six short functions; the care goes into the limits, the nearest-rank index and the session-window rule.

  - id: fe-har-code
    type: coding
    concept: perf-fe-waterfall
    skill: application
    title: Read a HAR and check a budget
    prompt: |
      Implement `phases`, `total_time`, `size`, `kind`, `summarise`, `waterfall` and `check_budget` in
      `exercises/analysis/fe_har.py`. The tests use hand-made entries and two real HAR files of the local checkout
      page; no browser is needed.
    project: perf
    files: [exercises/analysis/fe_har.py]
    test: tests/analysis/test_fe_har.py
    command: .venv/bin/python -m pytest tests/analysis/test_fe_har.py
    modelAnswer: |
      See the waterfall and budget helpers in the lesson. Key points - `-1` and missing timings are 0; size falls
      back from `_transferSize` to `bodySize` to `content.size`; waterfall offsets are from the page start; a budget
      limit equal to the value passes.
    rubric:
      - Every test in tests/analysis/test_fe_har.py passes.
      - Treats -1 and missing timings as zero and sums the rest.
      - Chooses the size from the right field and handles a cached body size of 0.
      - Gives waterfall offsets from the page start, sorted, rounded to one decimal.
      - Returns sorted, readable budget violations and allows a value equal to its limit.
    hints:
      - '`datetime.fromisoformat` reads the timestamps, including the trailing Z.'
      - A cached response has a body size of 0, which is not negative.
      - Build the budget actuals in one dict and compare each limit.
    solution: |
      Small helpers over the HAR dict; the waterfall subtracts the page start and the budget compares per limit.

  - id: fe-lab-code
    type: coding
    concept: perf-fe-labfield
    skill: application
    title: LCP parts, blocking time and lab against field
    prompt: |
      Implement `lcp_parts`, `dominant`, `total_blocking_time` and `lab_vs_field` in `exercises/analysis/fe_lab.py`.
      The tests use the web.dev TBT examples, hand-made values, real Chrome runs and synthetic field data; no
      browser is needed.
    project: perf
    files: [exercises/analysis/fe_lab.py]
    test: tests/analysis/test_fe_lab.py
    command: .venv/bin/python -m pytest tests/analysis/test_fe_lab.py
    modelAnswer: |
      See `lcp_parts` and `total_blocking_time` in the lesson. Key points - the four parts add up to LCP and the
      milestones must be in order; only tasks over 50 ms that start at or after FCP (and before `until`) count; the
      lab verdict compares the median of the runs with the field p75 using a tolerance.
    rubric:
      - Every test in tests/analysis/test_fe_lab.py passes.
      - The four LCP parts add up to the LCP and out-of-order milestones raise ValueError.
      - A task of exactly 50 ms is not long, a task at FCP counts, a task at until does not.
      - lab_vs_field uses the median, the spread, a ratio and inclusive tolerance edges.
    hints:
      - Subtract the milestones in order; the last part ends at the LCP.
      - Skip a task before skipping its duration check, or the other way round, but check both.
      - Use `statistics.median` for the lab runs.
    solution: |
      Four small functions; the care goes into the order of milestones, the edges of the TBT window and the tolerance.

placement:
  - id: fe-place-vitals
    type: mcq
    concept: perf-fe-vitals
    skill: application
    title: Mobile fails, desktop passes
    prompt: A site's blended 75th-percentile LCP is 2.4 s (good), but mobile visits alone have 3.2 s at the 75th percentile. How should you report it?
    options:
      - id: segment
        text: Report by segment - desktop good, mobile needs improvement - because the blend hides a group that fails.
        feedback: Correct - web.dev recommends measuring at the 75th percentile segmented across mobile and desktop.
      - id: blend
        text: Report the blended 2.4 s; it is the site's LCP.
        feedback: The blend can hide a failing segment.
      - id: worst
        text: Report only the mobile number and ignore desktop.
        feedback: Both segments are information; the report should show both.
    correct: [segment]
    hints:
      - Which segment would the blend hide?
    solution: |
      Segment the report; mobile needs improvement.

  - id: fe-place-labfield
    type: mcq
    concept: perf-fe-labfield
    skill: application
    title: Which data answers which question
    prompt: You changed how the hero image loads and want to know whether it helped. Which data is the right first check?
    options:
      - id: lab
        text: Repeated lab runs of before and after on the same machine, compared with their spread.
        feedback: Correct - the lab is repeatable and shows the effect of one change quickly.
      - id: field
        text: Field data from the next 28 days only.
        feedback: Field data is slow and mixes everything that changed; it confirms later but is a poor first check.
      - id: one
        text: A single Lighthouse run of each version.
        feedback: One run per version cannot be compared against the noise.
    correct: [lab]
    hints:
      - Which data is quick and repeatable?
    solution: |
      Repeated lab runs of both versions, compared with the spread.

  - id: fe-place-waterfall
    type: mcq
    concept: perf-fe-waterfall
    skill: analysis
    title: Reading a waterfall
    prompt: A waterfall shows the LCP image requested late but downloaded quickly. Which LCP part is large, and what is the usual fix?
    options:
      - id: delay
        text: The resource load delay - make the image discoverable early in the HTML or preload it.
        feedback: Correct - the wait before the request starts is the delay, and discovery is the usual cause.
      - id: duration
        text: The resource load duration - compress the image.
        feedback: The download was quick, so the duration is small.
      - id: ttfb
        text: TTFB - add a CDN.
        feedback: The late start is after the first byte; TTFB is a separate part.
    correct: [delay]
    hints:
      - Which part is the time before the image request starts?
    solution: |
      The load delay; make the image discoverable early.

recall:
  - id: fe-recall-thresholds
    concept: perf-fe-vitals
    prompt: What are the good thresholds of LCP, INP and CLS, and how is a page judged?
    answer: LCP 2.5 s or less, INP 200 ms or less, CLS 0.1 or less (poor above 4 s, 500 ms and 0.25). A page passes when all three are good at the 75th percentile of page loads, segmented by device.
  - id: fe-recall-cls
    concept: perf-fe-vitals
    prompt: How is CLS computed?
    answer: Layout shifts (ignoring those within 500 ms of input) are grouped into session windows - gaps under 1 s and under 5 s in total - and CLS is the largest window's total, not the sum of all shifts.
  - id: fe-recall-labfield
    concept: perf-fe-labfield
    prompt: Why can lab and field data disagree?
    answer: A lab run is one device, network and location with a controlled load; field data is a distribution of real visits. The LCP element can differ, INP needs interaction, and the lab is one point in the field's distribution.
  - id: fe-recall-inp
    concept: perf-fe-labfield
    prompt: What is a lab stand-in for INP, and what is its limit?
    answer: Total Blocking Time (the part over 50 ms of each long task after FCP) is a reasonable proxy but not a substitute; INP needs real or scripted interactions and is best from field data.
  - id: fe-recall-lcpparts
    concept: perf-fe-waterfall
    prompt: What are the four parts of LCP and which should be near zero?
    answer: TTFB, resource load delay, resource load duration and element render delay. The two delays should be close to zero (under 10 % each); TTFB and load duration are about 40 % each on a well-optimised page.
  - id: fe-recall-har
    concept: perf-fe-waterfall
    prompt: What do you look for in a HAR waterfall?
    answer: What started late (a request begun only after a script ran) and what was big or slow (wait is the server, receive is size over the network), plus request counts and bytes by type.
  - id: fe-recall-notload
    concept: perf-fe-waterfall
    prompt: Why is a frontend test not a load test?
    answer: It measures one browser loading one page and says nothing about the servers under many users; a protocol-level load tool such as JMeter does not execute JavaScript or render the page. Use both, and watch the page while the backend is loaded.

