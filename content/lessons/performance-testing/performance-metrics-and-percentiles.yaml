environment: |
  - **Runtime:** Python 3.12.3 in `practice/perf/.venv` with Locust 2.47.0 and pytest 9.2.0; Apache JMeter 5.6.3
    (non-GUI mode) on OpenJDK 17. Every run shown was made on Linux on 19 November 2026 against
    `practice/perf/support/metrics_fixture.py`, a local SandPay "quote" service whose service time comes from a
    seeded sequence: about 90 % of requests take 10-30 ms, 9 % take 80-150 ms and 1 % take 400-600 ms.
    **Timings, counts and throughput change with the machine and the run**; the definitions, and the fact that
    your code reproduces the tools' numbers from the same samples, do not.
  - **Synthetic data:** SandPay is a fictional payments company; the quote service, its labels and its
    responses were invented for this lesson.
  - **JMeter, from the user manual as documented on 18 November 2026:**
    [Glossary](https://jmeter.apache.org/usermanual/glossary.html) (elapsed time, latency, connect time,
    median, 90% line, throughput, population standard deviation);
    [Generating Report Dashboard](https://jmeter.apache.org/usermanual/generating-dashboard.html) (Apdex
    thresholds, `aggregate_rpt_pct1..3`, `statistic_window`);
    [Properties reference](https://jmeter.apache.org/usermanual/properties_reference.html)
    (`backend_metrics_percentile_estimator`).
  - **JMeter source, tag `rel/v5.6.3` on github.com/apache/jmeter** (read to confirm what the manual does not
    say): `ApdexSummaryConsumer.java` (failed samples count in the total but in no zone; `elapsed <= T`
    satisfied, `<= F` tolerating), `PercentileAggregator.java` and `DescriptiveStatisticsFactory.java` (the
    dashboard uses Apache Commons Math `Percentile` with estimation type `LEGACY` by default), and jorphan
    `StatCalculator.java` (`getPercentPoint`, used by the Aggregate Report through `SamplingStatCalculator`).
    The Aggregate Report is a GUI listener and was **not run here**; its definition is from the source.
  - **Apache Commons Math 3.6.1**
    [`Percentile.EstimationType`](https://commons.apache.org/proper/commons-math/javadocs/api-3.6.1/org/apache/commons/math3/stat/descriptive/rank/Percentile.EstimationType.html)
    (LEGACY: index (N+1)p). The interpolation shown in this lesson was confirmed by reproducing JMeter's
    `statistics.json` exactly from the same JTL.
  - **Locust 2.47.0:** [Configuration - customization of statistics settings and response time
    bucketing](https://docs.locust.io/en/stable/configuration.html) and the installed source
    `locust/stats.py` (`bucket_response_time`, `calculate_response_time_percentile`, `StatsCSVFileWriter`) and
    `locust/main.py` (`--json-file` is written at shutdown).
  - **Apdex:** Apdex Alliance, [Application Performance Index - Apdex Technical Specification, version
    1.1](https://www.apdex.org/wp-content/uploads/2020/09/ApdexTechnicalSpecificationV11_000.pdf) (22 January
    2007): zones, the formula, F = 4T, exceptions, reporting rules and ratings.
  - **Google SRE book:** [Service Level Objectives](https://sre.google/sre-book/service-level-objectives/) and
    [Monitoring Distributed Systems](https://sre.google/sre-book/monitoring-distributed-systems/) (the four
    golden signals, "Worrying About Your Tail", histogram buckets).
  - **Python:** [`statistics.quantiles`](https://docs.python.org/3.12/library/statistics.html) (methods
    "exclusive" and "inclusive"), used as an independent cross-check.
  - **Not repeated here:** what load profiles to run - [Types of performance
    testing](#/lesson/performance-testing-types); turning percentiles into targets - [Performance requirements
    and SLOs](#/lesson/performance-requirements-and-slos); queues and concurrency - [Little's law and workload
    models](#/lesson/littles-law-and-workload-models); reading results over time, warm-up and coordinated
    omission - [Reading load test results honestly](#/lesson/reading-load-test-results).

prerequisites:
  - performance-testing-types
  - http-request-response-anatomy

concepts:
  - id: perf-metrics-timing
    name: What a response time measures
    summary: Elapsed time, latency (time to first byte) and connect time as JMeter defines them, waiting versus service time, and the measurement artefacts that hide in them.
  - id: perf-metrics-percentiles
    name: Percentiles and how tools compute them
    summary: Percentiles describe the shape of the response time distribution; nearest-rank, interpolated and bucketed definitions give different numbers from the same samples.
  - id: perf-metrics-summary
    name: Throughput, error rate and Apdex
    summary: Summarising a run per label - counts, error rate, throughput over the run's span, percentiles and the Apdex satisfaction index - without letting averages or fast errors hide problems.

objectives:
  - Explain the difference between JMeter's elapsed time, latency and connect time, and between waiting time and service time.
  - Calculate a percentile by nearest rank and by interpolation, and predict which definition JMeter's dashboard, JMeter's Aggregate Report and Locust use.
  - Explain with a real distribution why the mean and the maximum are poor summaries of response time, and read a histogram instead.
  - Write code that summarises a JTL per label - samples, errors, error percentage, mean, percentiles and throughput - and reproduces JMeter's statistics.json.
  - Calculate Apdex as the specification and JMeter define it, including how failed samples count, and report it in the specification's uniform output.
  - Spot measurement artefacts (a lagging CSV, a 40 ms keep-alive floor, a sliding percentile window) before they reach a report.

sections:
  - id: intuition
    kind: intuition
    concepts: [perf-metrics-timing, perf-metrics-percentiles, perf-metrics-summary]
    title: The idea in plain language
    body: |
      SandPay's checkout asks a pricing service for a fee quote before every card payment. A load test sends 200
      quote requests and the report says **"average response time 32 ms"**. Is that good?

      Imagine the 200 customers queueing at a shop and timing how long each waits. Most are served in about 20
      ms; a handful wait 100-150 ms; one waits half a second. The average blends all of them into one number
      that describes **nobody** - in the real run below, almost 90 % of customers were faster than the average,
      and the slowest one was 15 times slower. The single slowest wait (the maximum) is no better: it describes
      one unlucky customer and changes completely if you run the test again.

      What you want to say is "**95 % of customers waited at most 117 ms**" and "**1 in 100 waited 145 ms or
      more**". Those are **percentiles**: line all the times up from fastest to slowest and read off the value at
      a given position. They tell you about the typical customer (the 50th percentile, or median) and about the
      unlucky ones in the **tail** (the 95th, 99th), and they hold steady from run to run far better than the
      maximum.

      Three more numbers complete the picture. **Throughput** is how many requests per second the system got
      through. **Error rate** is the share that failed - and a fast error is not a good response, so errors must
      never be quietly mixed into "response time". **Apdex** squeezes satisfaction into one score from 0 to 1 by
      counting how many responses were fast enough to satisfy, slow but tolerable, or frustrating.

      This lesson is about measuring all of that **honestly**: knowing what the tool's clock actually measured,
      which of several percentile definitions it used, and how to recompute its numbers yourself.

  - id: what
    kind: what
    concepts: [perf-metrics-timing, perf-metrics-percentiles, perf-metrics-summary]
    title: Terms you need
    body: |
      | Term | Meaning | Source |
      | --- | --- | --- |
      | **Elapsed time** (JMeter), **response time** (Locust) | from just before the request is sent to just after the **last** byte of the response arrives | JMeter Glossary |
      | **Latency** (JMeter) | from just before sending to just after the **first** byte of the response - often called time to first byte | JMeter Glossary |
      | **Connect time** (JMeter) | time to establish the connection, including the TLS handshake; "not automatically subtracted from latency" | JMeter Glossary |
      | **Service time** | the time the server spends actually working on a request | queueing theory |
      | **Waiting (queueing) time** | time a request spends waiting for a free worker before service starts; response time = waiting + service + network | queueing theory |
      | **Throughput** | requests completed per unit of time. JMeter: "(number of requests) / (total time)", total time "from the start of the first sample to the end of the last sample" | JMeter Glossary |
      | **Error rate** | failed requests / all requests, usually as a percentage | SRE book, golden signals |
      | **Percentile p** | the value below which p % of the samples fall; the **median** is the 50th | JMeter Glossary ("90% Line") |
      | **Tail latency** | the high percentiles (p95, p99, p99.9) - the slow minority | SRE book |
      | **Histogram** | counts of samples per response time range (bucket) | SRE book |
      | **Apdex** | (satisfied + tolerating / 2) / total samples, with zones set by thresholds T and F | Apdex specification 1.1 |
      | **Label** (JMeter), **name** (Locust) | the name results are grouped under - one per request type | tool docs |
      | **JTL** | JMeter's results file; CSV by default in non-GUI mode, one row per sample | JMeter manual |

      In the SRE book's words, latency is "the time it takes to service a request", and the four golden signals
      are **latency, traffic, errors and saturation**. A load test report covers the first three directly; the
      fourth (saturation) needs server-side metrics and is the subject of
      [Bottleneck analysis](#/lesson/bottleneck-analysis).

  - id: why
    kind: why
    concepts: [perf-metrics-percentiles, perf-metrics-summary]
    title: Why averages and maximums mislead
    body: |
      The SRE book puts it directly: "a simple average can obscure these tail latencies, as well as changes in
      them", and "Using percentiles for indicators allows you to consider the shape of the distribution [...] a
      high-order percentile, such as the 99th or 99.9th, shows you a plausible worst-case value, while using the
      50th percentile (also known as the median) emphasizes the typical case."

      Here is the real run used throughout this lesson - 200 successful `GET quote` samples from JMeter:

      | Statistic | Value |
      | --- | --- |
      | mean | 32.33 ms |
      | median (p50) | 24 ms |
      | p90 | 33 ms |
      | p95 | 116.8 ms |
      | p99 | 144.97 ms |
      | max | 497 ms |
      | share of samples **slower than the mean** | 0.105 (10.5 %) |

      Only **one sample in ten** was slower than the "average" - the mean sits far above the typical request
      because a few very slow requests pull it up. And it hides the jump between p90 (33 ms) and p95 (117 ms):
      one in ten requests is three to four times slower than the rest, which is exactly the kind of change the
      SRE book warns averages hide. The maximum (497 ms) is one sample; run the test again and it may be 420 or
      580.

      Why the tail matters for SandPay: one checkout calls the quote service, the fraud service and the
      acquirer. The SRE book: "If your users depend on several such web services to render their page, the 99th
      percentile of one backend can easily become the median response of your frontend." The slow 1 % of each
      dependency adds up to a much larger share of slow checkouts.

      **Errors are a separate signal.** "An HTTP 500 error [...] might be served very quickly [...] factoring
      500s into your overall latency might result in misleading calculations. On the other hand, a slow error is
      even worse than a fast error!" In this run the `GET quote (pricing down)` requests failed in 2-3 ms; mixed
      into the total they make the overall median *faster* (23 ms against 24 ms for the successes alone).

  - id: timing-internals
    kind: internals
    concepts: [perf-metrics-timing]
    title: What the clock in a load tool actually measures
    body: |
      JMeter's glossary is precise. **Elapsed** runs "from just before sending the request to just after the last
      response has been received", and "JMeter does not include the time needed to render the response, nor does
      JMeter process any client code, for example Javascript." **Latency** stops "just after the first response
      has been received", which "in general will be longer than one byte". **Connect time** "is not automatically
      subtracted from latency" and "is only computed for TCP Sampler, HTTP Request and JDBC Request".

      The first three rows of the real JTL (CSV) show all three:

      ```plaintext
      timeStamp      elapsed  label      responseCode  success  Latency  Connect
      …063383175     67       GET quote  200           true     66       33
      …063383175     67       GET quote  200           true     59       33
      …063383175     67       GET quote  200           true     59       33
      ```

      (`timeStamp` is shortened here: the real value is a 13-digit epoch-millisecond number.) These are first
      requests of three of the four threads: 33 ms of each went on opening a connection. In the
      whole run only 4 of 204 samples - one per thread - have a non-zero `Connect`; later samples reuse the
      **keep-alive** connection and show `Connect` 0.
      `timeStamp` is when the sample **started** (epoch milliseconds) - that matters for the throughput
      formula below.

      A load tool measures **from the client**, so its response time is

      ```plaintext
      response time = connect (if a new connection) + send + network + waiting in the server's queue
                      + service time + network + receive
      ```

      The server's own logs usually record only service time (sometimes plus queueing inside the
      application). When the two disagree, the gap is waiting, the network or the client itself - see
      [Logs, metrics and traces](#/lesson/logs-metrics-traces). A load generator that is short of CPU adds its
      own delay to every number it reports.

      **Measurement artefacts are real numbers too.** Python's `http.server` writes the headers and the body of
      a response in two separate TCP writes. On a keep-alive connection, Nagle's algorithm on the server plus
      delayed acknowledgements on the client can hold the second write for roughly 40 ms. The quote fixture has
      a switch for it; 50 requests on one keep-alive connection, the same seeded service times each time:

      ```plaintext
      disable_nagle=True: median 22.8 ms, min 11.6 ms, max 495.2 ms
      disable_nagle=False: median 62.5 ms, min 22.8 ms, max 535.9 ms
      ```

      About 40 ms was added to **every** response by the transport, not by the service. A load test against a
      stub or a test server shows such a floor; the fix (`disable_nagle_algorithm = True`, which sets
      `TCP_NODELAY`) belongs to the server, and the lesson is to sanity-check the fastest possible response
      before trusting any number.

  - id: percentile-internals
    kind: internals
    concepts: [perf-metrics-percentiles]
    title: Four definitions of "the 95th percentile"
    body: |
      With 10 samples `12, 15, 20, 22, 25, 30, 95, 140, 480, 510` ms there is no sample exactly at 95 % - so
      every tool has to choose a rule. There are many textbook rules; the four that matter for this track:

      **1. Nearest rank.** Rank = ceil(p/100 × n); take the value at that rank (counting from 1). Always an
      observed value. p50 → rank 5 → **25**; p90 → rank 9 → **480**; p95 → rank 10 → **510**.

      **2. JMeter's HTML dashboard** (`statistics.json`, the "Statistics" table). The report generator uses
      Apache Commons Math `Percentile` with the `LEGACY` estimation type (`DescriptiveStatisticsFactory`, property
      `backend_metrics_percentile_estimator`, default `LEGACY`). Position = (n + 1) × p / 100, interpolate
      linearly between the neighbours, clamp to the minimum below position 1 and to the maximum at or beyond
      position n. p50 → position 5.5 → halfway between 25 and 30 = **27.5**; p90 → position 9.9 → 480 + 0.9 ×
      30 = **507**; p95 → position 10.45 ≥ 10 → **510** (the maximum).

      This is the same rule as Python's `statistics.quantiles(..., method="exclusive")` ("The portion of the
      population falling below the i-th of m sorted data points is computed as i / (m + 1)") **inside the
      range** - but Python extrapolates past the end (523.5 for p95 here) where Commons Math clamps.

      **3. JMeter's Aggregate Report** (the GUI listener; `StatCalculator.getPercentPoint`): if p ≥ 100 return
      the maximum; otherwise target = Java `Math.round(n × p / 100)` and walk the sorted values until target
      values are counted. p50 → round(5.0) = 5 → **25**; p94 → round(9.4) = 9 → **480**; p95 → round(9.5) = 10
      (Java rounds half up) → **510**.

      **4. Locust 2.47.** Each response time is first rounded into a bucket - in the docs' words, "By default,
      Locust rounds to approximately 2 significant digits (e.g. 147 becomes 150, 3432 becomes 3400)" - then
      `calculate_response_time_percentile` walks the buckets **from the slowest down** until no more than
      `int(n × p)` requests remain faster. p50 → `int(10 × 0.5)` = 5 → **30**. Python's `round` rounds halves to
      even, so 145 ms lands in the **140** bucket.

      | Definition | p50 | p90 | p95 |
      | --- | --- | --- | --- |
      | nearest rank | 25 | 480 | 510 |
      | JMeter dashboard (LEGACY) | 27.5 | 507 | 510 |
      | JMeter Aggregate Report | 25 | 480 | 510 |
      | Locust | 30 | 510 | 510 |

      With 10 samples the definitions disagree wildly; with 200 they agree closely except in the tail, where few
      samples decide the answer:

      ```plaintext
      p50: nearest=24 dashboard=24.0 aggregate=24 locust=24
      p90: nearest=33 dashboard=33.0 aggregate=33 locust=33
      p95: nearest=113 dashboard=116.8 aggregate=113 locust=120
      p99: nearest=142 dashboard=144.97 aggregate=142 locust=140
      p99.9: nearest=497 dashboard=497.0 aggregate=497 locust=500
      ```

      Two more details from the sources:

      - JMeter's dashboard computes percentiles over a **sliding window** of `statistic_window` samples, default
        20000: "higher value provides a better accuracy but needs more memory". A label with more samples than
        that gets percentiles of its **last** 20000 samples.
      - Locust's percentiles are only as fine as its buckets: at 3400 ms a bucket is 100 ms wide, so a "p99 of
        3400" means somewhere around 3350-3450 ms.

      **Rule for reports:** say which tool and which percentile, compare like with like, and never compare a p95
      from one tool with a p95 from another to the millisecond.

  - id: when
    kind: when
    concepts: [perf-metrics-percentiles, perf-metrics-summary]
    title: Which number to use for which question
    body: |
      | Question | Use | Not |
      | --- | --- | --- |
      | What does a typical customer experience? | median (p50) | mean |
      | How bad is it for the unlucky ones? | p95, p99 (p99.9 with many samples) | max |
      | Did this release get slower? | the same percentiles, same tool, same load, run against run | a single run's max |
      | Can the system keep up? | throughput against the arrival rate you sent, plus error rate | throughput alone |
      | Is anything failing? | error rate per label, and failure messages | response times |
      | One number for a dashboard tile | Apdex, with T stated | the mean |
      | Capacity planning (cost per request) | mean service time and throughput | percentiles |

      The **mean is the right tool** for some sums: total work (mean service time × requests = busy time),
      Little's law (mean concurrency = arrival rate × mean time in the system - see [Little's law and workload
      models](#/lesson/littles-law-and-workload-models)) and cost. It is the wrong tool for describing what users
      experience.

      **Percentiles need enough samples.** A p99 from 50 samples is decided by the single slowest one; the Apdex
      specification likewise treats fewer than 100 samples as a "small group" that must be flagged. Run long
      enough that each label you report has hundreds of samples, or report fewer percentiles.

      **Percentiles do not average.** The mean of four per-minute p95s is not the p95 of the four minutes;
      combine raw samples or histograms, not percentiles.

  - id: visual
    kind: visual
    concepts: [perf-metrics-timing, perf-metrics-percentiles]
    title: Where each number comes from
    body: |
      ```mermaid
      flowchart LR
        S["Samples: one row per request (JTL row / Locust request event)"] --> E["Errors: success = false"]
        S --> OK["Successful samples"]
        OK --> H["Histogram: counts per range"]
        OK --> P["Percentiles: sort and read a position"]
        OK --> M["Mean, min, max"]
        S --> T["Throughput: count / span of the run"]
        OK --> A["Apdex zones: satisfied, tolerating, frustrated"]
        E --> A
        E --> R["Error rate per label"]
      ```

      Notice that every summary is computed **from the raw samples**. A tool's report is one view of them; with
      the JTL (or Locust's per-request events) you can recompute any number, with any definition, and check the
      report.

  - id: code-percentiles
    kind: code
    concepts: [perf-metrics-percentiles]
    title: The four percentile definitions in Python
    body: |
      The reference solution of the exercise `fundamentals/metrics_percentiles.py` (docstrings shortened):

      ```python
      import math
      from collections import Counter


      def _check(values, pct):
          data = sorted(values)
          if not data:
              raise ValueError("no response times")
          if not 0 < pct <= 100:
              raise ValueError(f"pct must be in (0, 100], got {pct}")
          return data


      def nearest_rank(values, pct):
          data = _check(values, pct)
          rank = math.ceil(pct / 100 * len(data))
          return data[max(rank, 1) - 1]


      def dashboard_percentile(values, pct):  # JMeter HTML dashboard: Commons Math LEGACY
          data = _check(values, pct)
          n = len(data)
          pos = (n + 1) * pct / 100
          if pos < 1:
              return float(data[0])
          if pos >= n:
              return float(data[-1])
          lower = math.floor(pos)
          fraction = pos - lower
          return data[lower - 1] + fraction * (data[lower] - data[lower - 1])


      def aggregate_report_percentile(values, pct):  # JMeter Aggregate Report: StatCalculator
          data = _check(values, pct)
          if pct >= 100:
              return data[-1]
          target = math.floor(len(data) * pct / 100 + 0.5)  # Java Math.round
          for value, count in sorted(Counter(data).items()):
              target -= count
              if target <= 0:
                  return value
          return data[-1]


      def locust_bucket(response_time_ms):  # Locust 2.47 bucket_response_time
          if response_time_ms < 100:
              return round(response_time_ms)
          if response_time_ms < 1000:
              return int(round(response_time_ms, -1))
          if response_time_ms < 10000:
              return int(round(response_time_ms, -2))
          return int(round(response_time_ms, -3))


      def locust_percentile(values, pct):  # Locust 2.47 calculate_response_time_percentile
          data = _check(values, pct)
          buckets = Counter(locust_bucket(v) for v in data)
          n = len(data)
          wanted = int(n * (pct / 100))
          processed = 0
          for bucket in sorted(buckets, reverse=True):
              processed += buckets[bucket]
              if n - processed <= wanted:
                  return bucket
          return 0
      ```

  - id: line-by-line
    kind: line-by-line
    concepts: [perf-metrics-percentiles]
    title: The lines that decide the answer
    body: |
      - `rank = math.ceil(pct / 100 * len(data))` - nearest rank rounds **up**: with 10 samples, p91 and p100
        both mean rank 10. `max(rank, 1)` guards very small `pct`.
      - `pos = (n + 1) * pct / 100` - the `n + 1` is the LEGACY (and Python "exclusive") convention: it assumes
        the population can be more extreme than the sample, so the sample maximum sits at the 100·n/(n+1)th
        percentile, not the 100th.
      - `if pos >= n: return float(data[-1])` - Commons Math clamps; Python's `statistics.quantiles` does not.
        This is exactly where hand-rolled spreadsheet formulas and the JMeter dashboard disagree.
      - `math.floor(len(data) * pct / 100 + 0.5)` - Java's `Math.round` rounds halves **up**. Python's
        `round(9.5)` is 10 but `round(8.5)` is 8 (halves to even), so `round()` would be wrong here.
      - `round(response_time_ms, -1)` in `locust_bucket` **is** Python's `round`, because Locust is Python: 145
        → 140, 155 → 160. Copying a tool's behaviour means copying its quirks.
      - `wanted = int(n * (pct / 100))` - Locust stores percentiles as fractions (0.95) and multiplies; dividing
        first reproduces its floating-point result exactly.
      - `for bucket in sorted(buckets, reverse=True)` - Locust walks from the slowest bucket down, which is why
        its p50 of 10 samples is the **6th** value (30), not the 5th.

  - id: code-summary
    kind: code
    concepts: [perf-metrics-summary]
    title: Summarising a JTL like the dashboard
    body: |
      The reference solution of `fundamentals/metrics_summary.py`; `rows` come from `csv.DictReader` over a CSV
      JTL, so every value is a string:

      ```python
      from fundamentals.metrics_percentiles import dashboard_percentile


      def _stats(rows, percentiles):
          elapsed = [int(r["elapsed"]) for r in rows]
          errors = sum(1 for r in rows if r["success"] != "true")
          start = min(int(r["timeStamp"]) for r in rows)
          end = max(int(r["timeStamp"]) + int(r["elapsed"]) for r in rows)
          duration_s = (end - start) / 1000
          out = {
              "samples": len(rows),
              "errors": errors,
              "error_pct": 100 * errors / len(rows),
              "mean_ms": sum(elapsed) / len(elapsed),
              "min_ms": min(elapsed),
              "max_ms": max(elapsed),
              "median_ms": dashboard_percentile(elapsed, 50),
              "throughput_per_s": len(rows) / duration_s if duration_s > 0 else 0.0,
          }
          for p in percentiles:
              out[f"p{p:g}_ms"] = dashboard_percentile(elapsed, p)
          return out


      def summarise(rows, percentiles=(90, 95, 99)):
          if not rows:
              raise ValueError("no samples")
          labels = sorted({r["label"] for r in rows})
          summary = {label: _stats([r for r in rows if r["label"] == label], percentiles) for label in labels}
          summary["Total"] = _stats(rows, percentiles)
          return summary
      ```

      Its output for the real run (floats printed rounded to two decimals), next to JMeter's own `statistics.json` for the same JTL (generated with
      `jmeter -g results.jtl -o dashboard`):

      ```plaintext
      GET quote {'samples': 200, 'errors': 0, 'error_pct': 0.0, 'mean_ms': 32.33, 'min_ms': 12, 'max_ms': 497, 'median_ms': 24.0, 'throughput_per_s': 107.3, 'p90_ms': 33.0, 'p95_ms': 116.8, 'p99_ms': 144.97}
      GET quote (pricing down) {'samples': 4, 'errors': 4, 'error_pct': 100.0, 'mean_ms': 2.75, 'min_ms': 2, 'max_ms': 3, 'median_ms': 3.0, 'throughput_per_s': 1333.33, 'p90_ms': 3.0, 'p95_ms': 3.0, 'p99_ms': 3.0}
      Total {'samples': 204, 'errors': 4, 'error_pct': 1.96, 'mean_ms': 31.75, 'min_ms': 2, 'max_ms': 497, 'median_ms': 23.0, 'throughput_per_s': 109.44, 'p90_ms': 33.0, 'p95_ms': 116.0, 'p99_ms': 144.85}
      dashboard Total: {'sampleCount': 204, 'errorCount': 4, 'errorPct': 1.9607843, 'meanResTime': 31.75, 'medianResTime': 23.0, 'pct1ResTime': 33.0, 'pct2ResTime': 116.0, 'pct3ResTime': 144.85, 'throughput': 109.4421}
      ```

      (Floats rounded to four decimals for display.) Every number matches. Notice the `pricing down` label's throughput of 1333 per second: four samples that
      ran within 3 ms of each other. Throughput over a tiny span means nothing - read it only for labels that
      ran for the whole test.

      **Locust's numbers** come from its own statistics. `--csv` writes `<prefix>_stats.csv`, but the writer
      rewrites it **once a second during the run** and nothing rewrites it at shutdown, so it can miss the last
      second. A real 3-second, 4-user run:

      ```plaintext
      locust final requests 326 csv requests 241 percentiles {50: 23, 66: 27, 75: 29, 90: 33, 95: 110, 99: 140, 100: 500}
      ```

      The final statistics (from `--json-file`, which Locust writes on shutdown, and from the summary it prints)
      counted 326 requests; the CSV stopped at 241. For short runs, or exact counts, use `--json-file` or the
      printed summary.

  - id: apdex
    kind: internals
    concepts: [perf-metrics-summary]
    title: Apdex - one satisfaction score, defined precisely
    body: |
      The Apdex specification 1.1 defines three zones with a target threshold **T**: "Satisfied Zone = zero to
      T. Tolerating Zone = Greater than T to F. Frustrated Zone = Greater than F", and "The value of F is four
      times the value T". Then

      ```plaintext
      Apdex_T = (satisfied count + tolerating count / 2) / total samples
      ```

      "measurements in the frustrated zone are counted in the number of total user samples in the denominator",
      and errors are frustrated: "If the tool can detect Task errors, then these application errors (e.g. Web
      page 404 replies) are counted as frustrated samples." The specification's own example: 80 % satisfied, 10
      % tolerating, 10 % frustrated gives 0.85.

      **JMeter's dashboard** (`ApdexSummaryConsumer`, 5.6.3) follows that: it adds every sample to the total,
      but only a **successful** sample can be satisfied (`elapsed <= T`) or tolerating (`elapsed <= F`).
      Its defaults are `apdex_satisfied_threshold` **500 ms** and `apdex_tolerated_threshold` **1500 ms** - F =
      3T, not the specification's 4T, so set both explicitly when you compare with another tool.

      With T = 25 ms and F = 100 ms (low thresholds so this fast fixture lands in all three zones), the real run:

      ```plaintext
      apdex mine {'GET quote': 0.7675, 'GET quote (pricing down)': 0.0, 'Total': 0.7525} dashboard {'Total': 0.7525, 'GET quote': 0.7675, 'GET quote (pricing down)': 0.0}
      ```

      The pricing-down label scores **0.0** although every answer took 2-3 ms: they all failed.

      **Reporting rules** (specification section 5): two decimals, rounded arithmetically ("results equal to or
      greater than 0.995 round to 1.00"); T shown in seconds, for example `0.85 [4.0]`; `NS [4.0]` for no
      samples; an asterisk for a "small group" of 1-99 samples (`0.80 [4.0]*`). T itself is "a positive decimal
      value in seconds" set to a tenth of a second below 10 s - so the 25 ms used above is a teaching threshold
      finer than the specification allows. Ratings (table 3): 0.94-1.00 Excellent, 0.85-0.93 Good, 0.70-0.84
      Fair, 0.50-0.69 Poor, 0.00-0.49 Unacceptable.

      Apdex is a summary for dashboards and trends; it hides which requests were slow. Report it **with** T and
      with the percentiles, never instead of them.

  - id: steps
    kind: steps
    concepts: [perf-metrics-timing, perf-metrics-percentiles, perf-metrics-summary]
    title: Summarising a load test run, step by step
    body: |
      1. **Sanity-check the floor.** Send a handful of single requests to the cheapest endpoint; if nothing is
         faster than about 40 ms on a local service, suspect the transport (Nagle, connection setup), not the
         service.
      2. **Keep raw samples.** JMeter: write a JTL (`-l results.jtl`). Locust: keep the final statistics
         (`--json-file`) and, if you need per-request data, a `request` event listener.
      3. **Split by label** and **separate errors**: count them, give the error percentage per label, and look
         at their messages before reading any response time.
      4. **Throughput** per label over the span the label actually ran (first start to last end) - and compare it
         with the rate you meant to send.
      5. **Percentiles** of the successful samples: p50, p90, p95, p99 (and p99.9 with thousands of samples).
         Say which tool and definition produced them.
      6. **Histogram** to see the shape: one hump or two? A second hump (in this run, 80-150 ms) is a second
         behaviour - a slow path, a cache miss, a lock - worth explaining.
      7. **Apdex**, if your team uses it, with T and F stated and errors counted as frustrated.
      8. **Compare like with like**: same tool, same definition, same load profile, enough samples - then the
         percentiles can be compared run against run.

  - id: example
    kind: example
    concepts: [perf-metrics-percentiles, perf-metrics-summary]
    title: "Example: the quote service report"
    body: |
      SandPay's team must decide whether the quote service is fine for the checkout, whose requirement is "95 % of
      quotes within 150 ms, error rate below 1 %". The run above gives:

      - **Errors:** the `GET quote` label had 0 errors in 200; the 4 failures were the deliberate
        `pricing down` requests, reported separately. Total error rate 1.96 % - but only because the test
        **injected** those errors. Report the real label's 0 %, and state that the injected ones exist.
      - **p95 = 116.8 ms** (JMeter dashboard), so the requirement holds - with only 200 samples, the p95 rests
        on the slowest 10 of them. A tester asks for a longer run before signing off.
      - **Shape:** the histogram of the 200 successes (up to 30 ms: 163; 31-100 ms: 24; 101-300 ms: 12; over 300
        ms: 1) shows a second group of slower requests. The p90-p95 jump from 33 to 117 ms is that group. Ask the
        developers what those requests do differently; a requirement at p90 would pass with room to spare, one
        at p95 only just.
      - **Mean 32 ms** - quoted nowhere in the conclusion, because 89.5 % of requests were faster than it.
      - **Locust cross-check:** the Locust run gave p95 110 and p99 140 on its own run; these are buckets (110 is
        "about 105-115 ms"), from a different run, by a different definition - consistent, not identical.

      Evidence attached to the report: the JTL, the dashboard folder, the Locust `--json-file`, and the commands
      that produced them.

  - id: tests
    kind: tests
    concepts: [perf-metrics-percentiles, perf-metrics-summary]
    title: Testing your metrics code
    body: |
      The practice tests check the definitions against hand-worked data **and** against the tools' own output
      for the same samples:

      | Case | Input | Expected | Evidence |
      | --- | --- | --- | --- |
      | nearest rank | the 10 samples above, p50 / p90 / p95 | 25 / 480 / 510 | assertion |
      | dashboard interpolation | same, p50 / p90 | 27.5 / 507, equal to `statistics.quantiles(method="exclusive")` | assertion |
      | dashboard clamp | same, p95 | 510, while Python extrapolates above 510 | assertion |
      | Java rounding | p95 of 10 samples in the Aggregate Report | target round(9.5) = 10 → 510 | assertion |
      | Locust buckets | 147, 145, 3432 ms | 150, 140, 3400 | assertion |
      | real JMeter run | JTL rows per label | equal to `statistics.json` median and pct1-3 | dashboard file |
      | real Locust run | raw response times | equal to Locust's own `calculate_response_time_percentile` on its final histogram | `--json-file` |
      | summary | JTL | samples, errors, error %, mean, min, max, percentiles and throughput equal `statistics.json` | dashboard file |
      | Apdex zones | elapsed = T, = F, F + 1, a 3 ms failure | satisfied, tolerating, frustrated, frustrated | assertion |
      | Apdex real run | JTL with T = 25, F = 100 | equal to the dashboard's Apdex table | `dashboard.js` |
      | bad input | no samples, pct 0 or 101, T > F | `ValueError` | assertion |

      Testing against the tool's output on **the same samples** is the point: your summary code is now a
      checked oracle you can run on any JTL, for example to compare two runs in CI.

  - id: mistakes
    kind: mistakes
    concepts: [perf-metrics-timing, perf-metrics-percentiles, perf-metrics-summary]
    title: Common mistakes and a debugging method
    body: |
      | Mistake | Consequence | Instead |
      | --- | --- | --- |
      | Reporting the mean response time | describes almost nobody; hides the tail | median and p95/p99 |
      | Reporting the maximum as "worst case" | one sample, changes every run | p99 / p99.9 with enough samples |
      | Mixing errors into response times | fast errors make the system look faster | separate error rate; percentiles of successes; track error latency too |
      | Averaging percentiles across labels or minutes | not a percentile of anything | recompute from samples or merged histograms |
      | Comparing p95 across tools to the millisecond | different definitions and buckets | same tool and definition run against run |
      | p99 from 50 samples | decided by one request | more samples, or report p90 |
      | Reading `_stats.csv` of a short Locust run as final | misses up to the last second | `--json-file` or the printed summary |
      | Trusting a 40 ms floor on a local stub | measures Nagle and delayed ACK, not the service | check the fastest response first; `TCP_NODELAY` on the server |
      | Quoting latency (first byte) as response time | ignores the body transfer | elapsed for response time; latency to separate server wait from download |
      | Throughput of a label that ran for a moment | meaningless (1333 per second from 4 samples) | per label, over its real span, with enough samples |
      | JMeter dashboard percentiles on more than 20000 samples per label | only the last 20000 counted | raise `jmeter.reportgenerator.statistic_window`, or compute from the JTL |

      **Debugging a number you don't believe:** (1) find the raw samples behind it (JTL rows, request events);
      (2) count them - is it the run, the label and the time span you think? (3) recompute it with a known
      definition, as in this lesson; (4) if your number and the tool's differ, it is the definition, the window
      or the data - check in that order; (5) if both agree and still look wrong, suspect the measurement: the
      client, the network or a transport artefact.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [perf-metrics-percentiles, perf-metrics-summary]
    title: Trade-offs and alternatives
    body: |
      - **Exact percentiles versus histograms.** Keeping every sample is exact but costs memory; JMeter's
        dashboard keeps a sliding window, Locust keeps ~2-significant-digit buckets so its distributed workers
        can send small histograms to the master. Monitoring systems use bucketed histograms for the same reason
        (the SRE book suggests buckets growing "by factors of roughly 3"). Precision is traded for scale.
      - **Interpolated versus observed values.** Interpolation (the dashboard) gives smoother numbers from small
        samples but can report a time no request took; nearest-rank and Locust always report something seen (or
        its bucket).
      - **Apdex versus percentiles.** Apdex gives one comparable score and needs agreement on T; percentiles keep
        the shape but need several numbers. Teams often show both.
      - **Client-side versus server-side timing.** The load tool sees what a client sees, including the network
        and its own overhead; server metrics see service time per component. You need both to tell "slow" from
        "slow where" - see [Observability for web apps](#/lesson/observability-for-web-apps).

  - id: summary
    kind: summary
    concepts: [perf-metrics-timing, perf-metrics-percentiles, perf-metrics-summary]
    title: Quick reference
    body: |
      - JMeter **elapsed** = send to last byte; **latency** = send to first byte; **connect** = connection
        setup, not subtracted from latency.
      - Response time = waiting + service + network (+ connect on a new connection).
      - Report **p50, p95, p99** of successful samples, the **error rate** per label and **throughput** over the
        run's span; not the mean, not the max.
      - Definitions: nearest rank = ceil(np); JMeter dashboard = Commons Math LEGACY, position (n+1)p,
        interpolated, clamped; JMeter Aggregate Report = walk to `Math.round(np)`; Locust = ~2-significant-digit
        buckets walked from the top.
      - JMeter throughput = samples / (end of last sample - start of first).
      - Apdex = (satisfied + tolerating / 2) / total; errors are frustrated; spec F = 4T, JMeter defaults 500 /
        1500 ms; report as `0.85 [4.0]`, `*` under 100 samples.
      - Artefacts: Locust's `_stats.csv` lags a second; the dashboard's percentile window is 20000 samples;
        Nagle + delayed ACK can add ~40 ms per response on keep-alive.

exercises:
  - id: elapsed-vs-latency
    type: mcq
    concept: perf-metrics-timing
    skill: recall
    title: Elapsed or latency?
    prompt: |
      A JTL row has `elapsed` 480 and `Latency` 40 for `GET /v1/reports/settlement`, which returns a 2 MB
      CSV. What does it tell you?
    options:
      - id: download
        text: The server started answering after about 40 ms; most of the 480 ms went on transferring the response body.
        feedback: Correct - latency stops at the first byte, elapsed at the last. A large gap points at the body transfer (size, bandwidth, streaming), not at server think time.
      - id: server-slow
        text: The server spent 480 ms computing the report before sending anything.
        feedback: Then the first byte would also arrive late, so latency would be close to 480 ms. Latency stops "just after the first response has been received".
      - id: subtract
        text: The real response time is 480 - 40 = 440 ms; JMeter double counts latency.
        feedback: Elapsed already includes the time to first byte. There is nothing to subtract; the two measure different end points from the same start.
      - id: connect
        text: The 40 ms is connection setup, which JMeter excludes from elapsed.
        feedback: That is the Connect column. Connect time is not subtracted from latency, and elapsed runs from before sending to the last byte.
    correct: [download]
    hints:
      - Both clocks start at the same moment. Where does each one stop?
    solution: |
      Latency ends at the first byte, elapsed at the last. 40 ms to start answering and 440 ms more to finish says the
      body transfer dominates - check the response size and whether the server streams it.

  - id: nagle-floor
    type: mcq
    concept: perf-metrics-timing
    skill: analysis
    title: Nothing is faster than 41 ms
    prompt: |
      Against a local stub that returns `{"status": "ok"}` immediately, every sample in a JMeter run with
      keep-alive takes 41-45 ms. The stub's own log says each request took under 1 ms. What is the most likely
      explanation?
    options:
      - id: nagle
        text: A transport artefact - the server's response leaves in two writes and Nagle's algorithm plus delayed ACK holds the second.
        feedback: Correct - a constant floor of about 40 ms on keep-alive with near-zero service time is the classic Nagle and delayed ACK interaction. Setting TCP_NODELAY on the server removes it; confirm by measuring before and after.
      - id: jmeter-overhead
        text: JMeter always adds about 40 ms of overhead per sample.
        feedback: JMeter's overhead is far smaller; on a fixed server the same plan measures single-digit milliseconds. A constant floor points at the transport.
      - id: connect-time
        text: Each request opens a new connection, and connecting takes 40 ms.
        feedback: With keep-alive, only the first request on each connection connects - the Connect column would show 0 for later rows.
      - id: gc
        text: Garbage collection pauses in the stub.
        feedback: Pauses would be occasional, not on every request at the same length, and the stub's own timing says it answered in under 1 ms.
    correct: [nagle]
    hints:
      - The server measured under 1 ms; the client measured over 40 ms - where else can time go?
      - Is the extra time random or constant?
    solution: |
      A constant floor with negligible service time is the transport. In this lesson's fixture, the same seeded service
      times measured a 22.8 ms median with TCP_NODELAY and 62.5 ms without it.

  - id: mean-vs-median
    type: mcq
    concept: perf-metrics-percentiles
    skill: application
    title: The average checkout quote
    prompt: |
      200 quote requests: mean 32.33 ms, median 24 ms, p95 116.8 ms, max 497 ms. Your manager wants one
      sentence for the release note. Which is most accurate?
    options:
      - id: median-p95
        text: Half of the quotes took 24 ms or less, and 95 % took at most about 117 ms.
        feedback: Correct - the typical case and the tail, both stated as what share of requests they cover.
      - id: average
        text: Quotes take 32 ms on average.
        feedback: True arithmetic, but in this run only about 1 in 10 requests was slower than the mean - it describes almost no one and hides the slow tenth.
      - id: max
        text: Quotes take at most 497 ms.
        feedback: That is one sample from one run; the next run's max may be very different, and "at most" will not hold in production.
      - id: p95-only
        text: Quotes take 117 ms.
        feedback: That reads like a typical time; most quotes were five times faster. Say what the number covers - 95 % at most.
    correct: [median-p95]
    hints:
      - A good summary says what share of requests a number covers.
    solution: |
      Percentiles are statements about a share of requests ("95 % at most X"); the mean and the max are not. Quote the
      median for the typical case and a high percentile for the tail.

  - id: nearest-rank-calc
    type: mcq
    concept: perf-metrics-percentiles
    skill: application
    title: Nearest rank by hand
    prompt: |
      Twenty response times sorted ascending; the 17th to 20th are 90, 110, 130 and 900 ms. What is the
      nearest-rank 90th percentile?
    options:
      - id: r18
        text: 110 ms
        feedback: Correct - rank = ceil(0.9 × 20) = 18; the 18th value is 110 ms.
      - id: r19
        text: 130 ms
        feedback: That is rank 19. ceil(0.90 × 20) is exactly 18.
      - id: interp
        text: 112 ms
        feedback: That is an interpolated value; nearest rank always returns an observed sample.
      - id: r17
        text: 90 ms
        feedback: That is rank 17 - 85 % of the samples, not 90 %.
    correct: [r18]
    hints:
      - Rank = ceil(p/100 × n), counted from 1.
    solution: |
      ceil(0.9 × 20) = 18, so the 18th value: 110 ms. Interpolating definitions would give a value between two samples.

  - id: dashboard-vs-aggregate
    type: mcq
    concept: perf-metrics-percentiles
    skill: analysis
    title: Two JMeter numbers for the same p95
    prompt: |
      For the same JTL, JMeter's HTML dashboard shows a p95 of 116.8 ms while a colleague's Aggregate Report in
      the GUI shows 113 ms. What explains it?
    options:
      - id: definitions
        text: Different percentile definitions - the dashboard interpolates at position (n+1)p, the Aggregate Report returns an observed value at Math.round(np).
        feedback: Correct - 200 samples, p95 is position 190.95 in the dashboard (between the 190th and 191st values) and the 190th value in the Aggregate Report. Both are right by their own definition.
      - id: bug
        text: One of them is a bug; JMeter should give one p95.
        feedback: Both follow their documented code - Commons Math LEGACY for the dashboard, StatCalculator for the Aggregate Report. The properties reference even names an estimator setting to make them comparable.
      - id: errors
        text: The dashboard includes failed samples and the Aggregate Report does not.
        feedback: Both include all samples of the label; with no failed samples in the label, that cannot explain the gap.
      - id: window
        text: The dashboard only uses the last 20000 samples.
        feedback: True for big runs (statistic_window), but this label has 200 samples - the window holds them all.
    correct: [definitions]
    hints:
      - Is 116.8 a value any sample could have had?
    solution: |
      An interpolated percentile can fall between two samples (116.8); an observed one cannot (113). Name the tool and
      definition with every percentile you report.

  - id: locust-bucket-q
    type: mcq
    concept: perf-metrics-percentiles
    skill: recall
    title: Locust's p99 of 3400 ms
    prompt: Locust reports p99 = 3400 ms. What does that number mean, given how Locust stores response times?
    options:
      - id: bucket
        text: The 99th percentile falls in the bucket around 3400 ms - roughly 3350-3450 ms - because Locust keeps about two significant digits.
        feedback: Correct - from 1000 to 9999 ms Locust rounds to the nearest 100 ms before counting.
      - id: exact
        text: Exactly 1 % of requests took longer than 3400.0 ms.
        feedback: Locust only stores the rounded value, so it cannot know which requests in the 3400 bucket were above 3400.0.
      - id: avg
        text: The average of the slowest 1 % of requests.
        feedback: A percentile is a position in the sorted data, not an average of the tail.
      - id: sampled
        text: Locust samples 1 % of requests and reports their maximum.
        feedback: Locust counts every request; it just rounds each one into a bucket.
    correct: [bucket]
    hints:
      - '147 becomes 150 and 3432 becomes 3400 - what happens to precision?'
    solution: |
      Locust buckets to about two significant digits (bucket_response_time), so percentiles are bucket values - precise
      enough for load tests, but not to the millisecond.

  - id: throughput-formula
    type: mcq
    concept: perf-metrics-summary
    skill: application
    title: JMeter's throughput
    prompt: |
      A label's first sample started at timeStamp 1000 (ms); its last sample started at 2450 and took 50 ms.
      There were 300 samples. What throughput does JMeter report?
    options:
      - id: correct-200
        text: 200 per second
        feedback: Correct - the span is from the start of the first sample (1000) to the end of the last (2450 + 50 = 2500), 1.5 s, and 300 / 1.5 = 200.
      - id: start-to-start
        text: About 206.9 per second
        feedback: That uses the last sample's start (1.45 s) - JMeter counts "to the end of the last sample".
      - id: mean-based
        text: It depends on the mean response time.
        feedback: JMeter's throughput formula is (number of requests) / (total time); response times only enter through the end of the last sample.
      - id: per-thread
        text: 200 per second per thread
        feedback: Throughput is for the label across all threads, not per thread.
    correct: [correct-200]
    hints:
      - Where does "total time" start and end in the JMeter glossary?
    solution: |
      Total time = end of last sample - start of first = 2500 - 1000 = 1500 ms; 300 / 1.5 s = 200 per second.

  - id: fast-errors
    type: mcq
    concept: perf-metrics-summary
    skill: analysis
    title: The release that got faster
    prompt: |
      After a release, the overall median response time fell from 120 ms to 60 ms. The error rate rose from 0.1 %
      to 40 %. What happened?
    options:
      - id: fast-fail
        text: Many requests now fail fast (for example an immediate 500), and those fast errors pull the overall response times down.
        feedback: Correct - as the SRE book warns, a quickly served 500 makes latency look better. Look at the percentiles of successful requests and at the errors separately.
      - id: optimised
        text: The release optimised the service; the errors are a separate problem.
        feedback: With 40 % errors the response time of the mix mostly describes failures - you cannot conclude anything about successes from it.
      - id: tool
        text: The load tool sent fewer requests.
        feedback: A lower rate can change response times, but that would not explain a 400-fold error increase.
      - id: cache
        text: A cache was added.
        feedback: A cache would not cause 40 % errors.
    correct: [fast-fail]
    hints:
      - How long does a request that fails immediately take?
    solution: |
      Separate the signals: error rate per label, and percentiles of successful requests (plus error latency).
      Never judge speed from a mix that is 40 % failures.

  - id: apdex-calc
    type: mcq
    concept: perf-metrics-summary
    skill: application
    title: Apdex by hand
    prompt: |
      JMeter defaults (T = 500 ms, F = 1500 ms). 100 samples: 70 successful under 500 ms, 20 successful between
      500 and 1500 ms, 5 successful over 1500 ms, and 5 failures that took 30 ms. What Apdex does JMeter report?
    options:
      - id: a80
        text: '0.80'
        feedback: Correct - (70 + 20 / 2) / 100 = 0.80. The 5 slow ones and the 5 failures are frustrated, and all 100 are in the denominator.
      - id: a85
        text: '0.85'
        feedback: That counts the 5 fast failures as satisfied. JMeter only lets successful samples be satisfied or tolerating.
      - id: a84
        text: '0.84'
        feedback: That drops the failures from the denominator (80 / 95). Failures count in the total.
      - id: a90
        text: '0.90'
        feedback: Tolerating samples count half, not full.
    correct: [a80]
    hints:
      - Which zone does a failed sample land in, however fast it was?
      - Tolerating counts half.
    solution: |
      Satisfied 70, tolerating 20 (count half), frustrated 10 (5 slow, 5 failed). (70 + 10) / 100 = 0.80 - "Fair".

  - id: csv-lag
    type: mcq
    concept: perf-metrics-summary
    skill: analysis
    title: The Locust CSV is missing requests
    prompt: |
      A 3-second headless Locust run printed a final summary with 326 requests, but `locust_stats.csv` says 241.
      Why?
    options:
      - id: interval
        text: The CSV writer rewrites the file once a second during the run, and nothing rewrites it at shutdown, so it missed the last second.
        feedback: Correct - in Locust 2.47 StatsCSVFileWriter.stats_writer loops with CSV_STATS_INTERVAL_SEC = 1. Use --json-file (written at shutdown) or the printed summary for exact totals.
      - id: failures
        text: The CSV excludes failed requests.
        feedback: The stats CSV has a Failure Count column and counts failures in Request Count.
      - id: workers
        text: Requests from other workers were not merged.
        feedback: This was a single-process headless run - there are no workers.
      - id: sampling
        text: Locust samples requests for the CSV.
        feedback: Locust counts every request; the difference is timing of the write.
    correct: [interval]
    hints:
      - 241 at about 120 requests per second is how many seconds of traffic?
    solution: |
      241 ≈ 2 seconds of traffic: the last periodic write. Short runs need the final statistics - --json-file or the
      printed summary.

  - id: order-summary
    type: order
    concept: perf-metrics-summary
    skill: application
    title: Summarise a run
    prompt: Put the steps for summarising a load test run in a sensible order.
    items:
      - id: floor
        text: Sanity-check the fastest possible response for measurement artefacts
      - id: raw
        text: Keep the raw samples (JTL or final statistics)
      - id: labels
        text: Split the samples by label and count errors per label
      - id: throughput
        text: Compute throughput per label over the span it really ran
      - id: pct
        text: Compute p50, p95 and p99 of the successful samples
      - id: shape
        text: Look at the histogram for a second hump or a long tail
      - id: report
        text: Report with the tool, definition, load and sample counts stated
    hints:
      - You cannot recompute anything you did not keep.
    solution: |
      Trust the measurement first, keep the data, separate errors before reading speeds, then throughput, percentiles
      and shape, and report with enough context to compare runs.

  - id: debug-percentile
    type: debug
    concept: perf-metrics-percentiles
    skill: analysis
    title: An Aggregate Report clone that is sometimes off by one
    prompt: |
      This port of JMeter's Aggregate Report percentile disagrees with JMeter for some sample counts (for
      example p85 of 10 values). Which line is the defect?
    language: python
    code: |
      def aggregate_report_percentile(values, pct):
          data = sorted(values)
          if not data:
              raise ValueError("no response times")
          if pct >= 100:
              return data[-1]
          target = round(len(data) * pct / 100)
          for value in data:
              target -= 1
              if target <= 0:
                  return value
          return data[-1]
    correctLines: [7]
    lineNotes:
      - line: 8
        note: Walking the sorted values one at a time counts duplicates individually, which is what JMeter's per-value counts do.
      - line: 5
        note: JMeter also returns the maximum for 100 % and above.
    hints:
      - What is round(8.5) in Python, and Math.round(8.5) in Java?
    solution: |
      Line 7 uses Python's round, which rounds halves to even (round(8.5) = 8). Java's Math.round rounds halves up (9).
      Use math.floor(len(data) * pct / 100 + 0.5).

  - id: short-tail
    type: short
    concept: perf-metrics-percentiles
    skill: analysis
    title: Why does the tail matter for checkout?
    prompt: |
      SandPay's checkout calls three services in sequence: quote, fraud and acquirer. Each has p99 = 300 ms and
      p50 = 30 ms. A product manager says "only 1 % of calls are slow, so only 1 % of checkouts are slow".
      Explain why that is wrong, and what you would measure instead.
    modelAnswer: |
      Each checkout makes three calls, so it is slow if any of them is slow. If the slow calls are independent, the
      share of checkouts with at least one call above 300 ms is 1 - 0.99^3 ≈ 3 %, not 1 % - and pages that fan out
      to more services make it worse; the SRE book notes that one backend's 99th percentile "can easily become the
      median response of your frontend". I would measure the checkout end to end (a transaction around the three
      calls) and report its percentiles, plus each dependency's percentiles to find which contributes the tail.
    rubric:
      - Shows that the chance of at least one slow call grows with the number of calls (about 3 % for three).
      - Notes the independence assumption, or that correlated slowness behaves differently.
      - Proposes measuring the end-to-end transaction's percentiles.
      - Keeps per-dependency percentiles to locate the tail.
    hints:
      - What is the probability that none of three calls is slow?
    solution: |
      Tail latency compounds across calls: about 3 % of checkouts hit at least one p99 call. Measure the end-to-end
      transaction as well as each dependency.

  - id: testdesign-metrics
    type: testdesign
    concept: perf-metrics-summary
    skill: application
    title: Test a results summariser
    prompt: |
      Your team is adding a CI step that reads a JMeter JTL and fails the build when p95 > 300 ms or the error
      rate > 1 %. Design test cases for the summariser and the gate before it goes live.
    modelAnswer: |
      Preconditions: small hand-written JTLs (CSV, header row) plus one real JTL with JMeter's own dashboard
      generated from it.

      1. **Hand-checked percentiles** - 10 known values. Expected: the p95 the chosen definition gives (dashboard:
         510 for the example set). Evidence: assertion with the worked calculation in the test.
      2. **Equals the tool** - the real JTL. Expected: samples, errors, percentiles and throughput equal
         statistics.json. Evidence: the dashboard folder attached to the test.
      3. **Errors separated** - rows with success=false and 3 ms elapsed. Expected: they raise the error rate and
         do not lower the success percentiles. Evidence: two assertions.
      4. **Boundary** - error rate exactly 1.00 % and p95 exactly 300 ms. Expected: the gate's documented
         inclusive or exclusive behaviour. Evidence: assertions on both sides of each boundary.
      5. **Labels** - two labels, one failing. Expected: the gate names the label. Evidence: the failure message.
      6. **Empty or truncated JTL** - no rows, or a cut-off last line. Expected: the gate fails loudly, not "pass".
         Evidence: non-zero exit code and message.
      7. **Small sample** - 20 samples. Expected: a warning that p95 rests on one sample. Evidence: message.
    rubric:
      - Each case has preconditions, input, expected result and evidence.
      - Checks the summariser against the tool's own output on the same JTL.
      - Covers errors kept out of the response-time percentiles.
      - Covers boundaries of both thresholds.
      - Covers empty or broken input failing the build rather than passing it.
    hints:
      - Which inputs would make a broken gate pass silently?
    solution: |
      Hand-checked values, the tool's own output, errors, both thresholds' boundaries, labels and broken input - and a
      gate that never passes on missing data.

  - id: interview-metrics
    type: interview
    concept: perf-metrics-percentiles
    skill: analysis
    title: 'Interview: which numbers go in a load test report?'
    prompt: |
      "You've just run a load test against our payments API. Which metrics do you put in the report, and how do
      you make sure they're right?"
    modelAnswer: |
      Per transaction label: the number of samples, the error rate (with the failure reasons), throughput compared
      with the rate we meant to send, and response time percentiles of the successful requests - median for the
      typical case, p95 and p99 for the tail - over the steady-state part of the run. I'd add a histogram if the
      shape is odd, and Apdex if the team uses it, with T stated. I would not lead with the average: in long-tailed
      data most requests are faster than the mean, and it hides tail changes.

      To make sure they're right: I keep the raw samples (the JTL), I say which tool and percentile definition I
      used - JMeter's dashboard interpolates, its Aggregate Report and Locust don't, and Locust buckets - and I
      sanity-check the measurement itself: the fastest response, connection setup, whether the load generator
      was overloaded, and artefacts like a ~40 ms keep-alive floor. Errors are reported separately, because fast
      500s make response times look better.
    rubric:
      - Names per-label samples, error rate, throughput against target and percentiles of successes.
      - Explains why the mean (and max) are not the headline numbers.
      - Mentions that percentile definitions differ between tools.
      - Mentions keeping raw data and sanity-checking the measurement (client, artefacts).
      - Separates errors from response times.
    followUps:
      - Why is a p99 from 50 samples not very useful?
      - Can you average p95 values from four test agents?
      - How would you compare this run with last week's?
    hints:
      - Structure the answer as what you report, then how you trust it.
    solution: |
      Report per label: samples, errors, throughput against target, p50/p95/p99 of successes; then show how you trust
      them - raw data, named definitions, measurement checks.

  - id: metrics-percentiles-code
    type: coding
    concept: perf-metrics-percentiles
    skill: application
    title: Percentiles four ways
    prompt: |
      Implement `nearest_rank`, `dashboard_percentile`, `aggregate_report_percentile`, `locust_bucket` and
      `locust_percentile` in `exercises/fundamentals/metrics_percentiles.py`. The tests check hand-worked data,
      then compare your functions with JMeter's `statistics.json` and with Locust's own percentile function on
      real runs against the local quote service (JMeter must be installed: `scripts/get-jmeter.sh`).
    project: perf
    files: [exercises/fundamentals/metrics_percentiles.py]
    test: tests/fundamentals/test_metrics_percentiles.py
    command: .venv/bin/python -m pytest tests/fundamentals/test_metrics_percentiles.py
    modelAnswer: |
      See the section "The four percentile definitions in Python". The key lines: rank = ceil(np) for nearest
      rank; position (n+1)p with interpolation and clamping for the dashboard; floor(np + 0.5) (Java Math.round)
      then a walk for the Aggregate Report; Python round into ~2-significant-digit buckets and a walk from the top
      for Locust.
    rubric:
      - Every test in tests/fundamentals/test_metrics_percentiles.py passes.
      - Raises ValueError for no values and for pct outside (0, 100].
      - Uses Java-style rounding for the Aggregate Report and Python's round for Locust buckets, and can say why.
      - Can explain why the four functions give different p95s for the same 10 values.
    hints:
      - Start with nearest_rank - it is two lines after sorting.
      - For the dashboard, write out position (n + 1) × p / 100 for p50 of 10 values and check it gives 27.5.
      - For Locust, divide pct by 100 before multiplying by n.
    solution: |
      Four small functions; the hard part is copying each tool's exact rounding rule. Your code now reproduces the
      tools' numbers from raw samples.

  - id: metrics-summary-code
    type: coding
    concept: perf-metrics-summary
    skill: application
    title: Summarise a JTL like the dashboard
    prompt: |
      Implement `summarise` and `share_slower_than_mean` in `exercises/fundamentals/metrics_summary.py` (solve
      `metrics_percentiles.py` first - `summarise` uses its `dashboard_percentile`). The tests compare your
      summary of a real JTL with JMeter's `statistics.json` for every label and the Total.
    project: perf
    files: [exercises/fundamentals/metrics_summary.py]
    test: tests/fundamentals/test_metrics_summary.py
    command: .venv/bin/python -m pytest tests/fundamentals/test_metrics_summary.py
    modelAnswer: |
      Group rows by label (plus all rows as Total). Per group: count, errors (success != "true"), error percentage,
      mean/min/max of int(elapsed), dashboard percentiles, and throughput = count / ((max(timeStamp + elapsed) -
      min(timeStamp)) / 1000). share_slower_than_mean counts values strictly above the mean.
    rubric:
      - Every test in tests/fundamentals/test_metrics_summary.py passes.
      - Throughput uses the start of the first sample and the end of the last.
      - Converts the JTL's strings (elapsed, timeStamp, success) explicitly.
      - Can explain why the tiny "pricing down" label's throughput is meaningless.
    hints:
      - Every JTL value is a string, including "true" and "false".
      - The end of a sample is timeStamp + elapsed.
    solution: |
      With your summariser you can check, compare or gate any JTL without the GUI - and it agrees with JMeter's own
      dashboard.

  - id: metrics-apdex-code
    type: coding
    concept: perf-metrics-summary
    skill: application
    title: Apdex as the specification and JMeter define it
    prompt: |
      Implement `classify`, `apdex`, `apdex_by_label`, `uniform_output` and `rating` in
      `exercises/fundamentals/metrics_apdex.py`. The tests use the specification's own example, its reporting
      rules and a real run compared with JMeter's dashboard Apdex table.
    project: perf
    files: [exercises/fundamentals/metrics_apdex.py]
    test: tests/fundamentals/test_metrics_apdex.py
    command: .venv/bin/python -m pytest tests/fundamentals/test_metrics_apdex.py
    modelAnswer: |
      classify: failure → frustrated; elapsed <= T satisfied; <= F tolerating; else frustrated. apdex: (satisfied +
      tolerating / 2) / total, ValueError for no samples or bad thresholds. uniform_output: Decimal quantize with
      ROUND_HALF_UP to two places, T to one decimal below 10 s, "NS" for no samples, "*" for 1-99 samples, and
      ValueError below 0.1 s. rating: the specification's table 3 bands on the rounded value.
    rubric:
      - Every test in tests/fundamentals/test_metrics_apdex.py passes.
      - Failed samples are frustrated and stay in the denominator.
      - Rounds half up with Decimal rather than round().
      - Can explain why JMeter's defaults (500 / 1500 ms) differ from the specification's F = 4T.
    hints:
      - Classify each sample first, then count zones.
      - round(0.855, 2) in Python is not 0.86 - why?
    solution: |
      Apdex is simple arithmetic; the precision is in the edges - inclusive thresholds, failures as frustrated and
      arithmetic rounding in reports.

placement:
  - id: place-latency
    type: mcq
    concept: perf-metrics-timing
    skill: application
    title: First byte at 50 ms, last at 900 ms
    prompt: In a JTL row, Latency is 50 and elapsed is 900. Which is true?
    options:
      - id: body
        text: The first byte arrived after 50 ms; receiving the rest of the response took most of the time.
        feedback: Correct - latency ends at the first byte, elapsed at the last.
      - id: server
        text: The server computed for 900 ms.
        feedback: Then the first byte would also be late; latency would be near 900.
      - id: subtract
        text: The response time is 850 ms.
        feedback: Elapsed already is the response time from send to last byte; nothing is subtracted.
    correct: [body]
    hints:
      - Where does each clock stop?
    solution: |
      Latency = to first byte, elapsed = to last byte. A big gap means a long body transfer, not slow server thinking.

  - id: place-percentile
    type: mcq
    concept: perf-metrics-percentiles
    skill: application
    title: The p50 of ten values
    prompt: |
      Values `12, 15, 20, 22, 25, 30, 95, 140, 480, 510` ms. JMeter's HTML dashboard interpolates at position
      (n + 1) × p / 100. What median does it show?
    options:
      - id: m275
        text: 27.5 ms
        feedback: Correct - position 5.5, halfway between the 5th (25) and 6th (30) values.
      - id: m25
        text: 25 ms
        feedback: That is the nearest-rank median; the dashboard interpolates.
      - id: m1349
        text: 134.9 ms
        feedback: That is the mean, pulled up by the two slowest values.
    correct: [m275]
    hints:
      - Compute 11 × 0.5.
    solution: |
      (10 + 1) × 0.5 = 5.5 → between 25 and 30 → 27.5. Other tools report 25 or 30 for the same data.

  - id: place-apdex
    type: mcq
    concept: perf-metrics-summary
    skill: application
    title: Apdex with fast failures
    prompt: |
      T = 500 ms, F = 1500 ms. 10 samples: 8 successful at 100 ms and 2 failures at 5 ms. What Apdex does JMeter
      report?
    options:
      - id: a08
        text: '0.80'
        feedback: Correct - failures are frustrated, however fast, and stay in the denominator.
      - id: a10
        text: '1.00'
        feedback: That counts the fast failures as satisfied; JMeter only lets successful samples be satisfied.
      - id: a09
        text: '0.90'
        feedback: Failures are not tolerating (half); they are frustrated (zero).
    correct: [a08]
    hints:
      - Which zone is a failed sample in?
    solution: |
      8 satisfied, 2 frustrated: 8 / 10 = 0.80. Errors are frustrated in the specification and in JMeter.

recall:
  - id: recall-elapsed-latency
    concept: perf-metrics-timing
    prompt: What do JMeter's elapsed time, latency and connect time measure?
    answer: Elapsed - from just before sending to the last byte received. Latency - to the first byte. Connect - connection setup including TLS; it is not subtracted from latency.
  - id: recall-mean
    concept: perf-metrics-percentiles
    prompt: Why is the mean a poor summary of response times?
    answer: Long tails pull it up, so it describes almost no request (in the lesson's run only 10.5 % were slower than the mean) and it hides tail changes.
  - id: recall-dashboard-pct
    concept: perf-metrics-percentiles
    prompt: How does JMeter's HTML dashboard compute percentiles?
    answer: Apache Commons Math Percentile, LEGACY estimation - position (n+1)p, linear interpolation, clamped to min and max - over a sliding window of statistic_window samples (default 20000).
  - id: recall-locust-pct
    concept: perf-metrics-percentiles
    prompt: How does Locust compute percentiles?
    answer: It rounds each response time into a bucket of about two significant digits, then walks the buckets from the slowest down until no more than int(n × p) requests remain faster.
  - id: recall-throughput
    concept: perf-metrics-summary
    prompt: How does JMeter compute throughput?
    answer: Number of samples divided by the time from the start of the first sample to the end of the last.
  - id: recall-apdex
    concept: perf-metrics-summary
    prompt: What is the Apdex formula, and how are errors counted?
    answer: (satisfied + tolerating / 2) / total samples; errors are frustrated but stay in the total. The spec sets F = 4T; JMeter defaults to 500 / 1500 ms.
  - id: recall-csv-lag
    concept: perf-metrics-summary
    prompt: Why can Locust's _stats.csv show fewer requests than the run made?
    answer: The CSV writer rewrites it once a second during the run and nothing rewrites it at shutdown; use --json-file or the printed summary for exact totals.

