id: performance-metrics-and-percentiles
title: Performance metrics and percentiles
subject: performance-testing
module: perf-fundamentals
level: beginner
status: published
estimatedMinutes: 150
summary: Response time, latency and connect time as JMeter measures them, throughput, error rate, histograms, percentiles and Apdex - and why the average and the maximum mislead. You compute percentiles the four ways the tools do (nearest rank, JMeter's dashboard, JMeter's Aggregate Report, Locust) and check your code against real JMeter and Locust runs on the same samples.
