id: performance-testing-in-ci-cd
title: Performance testing in CI/CD
subject: performance-testing
module: perf-analysis
level: advanced
status: published
estimatedMinutes: 150
summary: >-
  A load test that nobody reads protects nothing, and a gate that fails at random gets switched off. This lesson turns
  a load test into a pipeline step you can trust - a baseline of recent runs with a noise measure (median and MAD)
  instead of a fixed percentage, a regression gate with three exit codes (pass, fail, and "this run cannot be judged"),
  error and budget checks that a p95 comparison alone would miss, and a placement plan (a short smoke on pull requests,
  the real test nightly and before release) checked with a small linter against the repository's own workflow. You
  write the baseline store, the gate and the linter in Python and try them on real Locust runs against the SandPay
  practice API.
tags:
  [
    performance testing,
    CI/CD,
    regression gate,
    baseline,
    noise,
    median absolute deviation,
    MAD,
    exit codes,
    fail closed,
    performance budget,
    error rate,
    baseline drift,
    smoke test,
    nightly run,
    GitHub Actions,
    timeout-minutes,
    concurrency,
    continue-on-error,
    schedule,
    artifacts,
    Locust,
    k6 thresholds,
  ]

environment: |
  - **Runtime:** Python 3.12.3 in `practice/perf/.venv` with Locust 2.47.0 and pytest, on one Linux development
    machine that was also doing other work while the runs were made. Every run shown was made on 21 November 2026 by
    `practice/perf/support/pci_capture.py`: 8 Locust users for 4 seconds against the SandPay practice API
    (`support/sandpay_target.py`, 4 workers), reduced to one **run summary** per run (samples, errors, p50, p95, p99,
    machine CPU) in `support/pci_data/history.json`. The summary describes the **payment-creation** requests, the ones
    that can fail. The tables below are printed by the reference solutions (`support/pci_demo.py`) on those files.
    **Timings, sample counts and CPU readings change with the machine and the run**; the method does not. The
    `generator_cpu_max` field is whole-machine CPU, sampled every half second with `psutil`, so on this shared machine it
    includes other work - that is what a CI runner looks like too.
  - **Synthetic builds:** SandPay is a fictional payments company. The "builds" are four configurations of the practice
    API, not real code changes: the baseline (service time 20 ms), "same" (the same configuration again), "small"
    (22 ms, a service time 10 % longer), "slower" (26 ms) and "failing" (20 ms, with 20 % of payment creations answered
    with HTTP 500). The 4-second runs are deliberately short, so each holds only 64-147 samples - small enough that the
    noise is easy to see. A real nightly run is minutes long.
  - **Drift demonstration:** the "drift" section of the lesson is a **simulation** built on the captured baseline (each run
    a fixed percentage slower than the last). It is labelled as such and is not a measurement.
  - **GitHub Actions, from the documentation as read on 21 November 2026** (the Markdown sources of docs.github.com in the
    github/docs repository): [Workflow syntax - `jobs.<job_id>.timeout-minutes`](https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax)
    ("The maximum number of minutes to let a job run before GitHub automatically cancels it. Default: 360"),
    `jobs.<job_id>.steps[*].continue-on-error` ("Prevents a job from failing when a step fails. Set to `true` to allow a
    job to pass when this step fails."), `concurrency` ("Use `concurrency` to ensure that only a single job or workflow
    using the same concurrency group will run at a time."), and [Events that trigger workflows - `schedule`](https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows)
    ("The `schedule` event can be delayed during periods of high loads of GitHub Actions workflow runs. High load times
    include the start of every hour. If the load is sufficiently high enough, some queued jobs may be dropped. To decrease
    the chance of delay, schedule your workflow to run at a different time of the hour." and "Scheduled workflows will only
    run on the default branch."). The repository's own workflow is `.github/workflows/pages.yml`, converted to JSON on
    21 November 2026 as `support/pci_data/pages.workflow.json`.
  - **Locust 2.47.0:** [Running without the web UI - controlling the exit code](https://docs.locust.io/en/2.47.0/running-without-web-ui.html)
    ("By default the locust process will give an exit code of 1 if there were any failed samples (use the
    --exit-code-on-error to change that behaviour). You can also manually control the exit code in your test scripts by
    setting the process_exit_code of the Environment instance.") and the example on that page that sets a non-zero exit
    code when more than 1 % of requests failed, the average is above 200 ms or the 95th percentile is above 800 ms.
  - **k6, from the documentation (not run here):** [Thresholds](https://grafana.com/docs/k6/latest/using-k6/thresholds/) ("Thresholds
    are the pass/fail criteria that you define for your test metrics."; a failed threshold makes k6 "exit with a non-zero
    exit code"; `abortOnFail` and `delayAbortEval` stop a run early). k6 is not installed here.
  - **Median absolute deviation:** NIST, Dataplot reference manual,
    [MEDIAN ABSOLUTE DEVIATION](https://www.itl.nist.gov/div898/software/dataplot/refman2/auxillar/mad.htm) ("a robust
    alternative to the standard deviation as a measure of scale"; "The scaled MAD is defined as MADN = MAD/0.6745. For
    normally distributed data, the scaled MAD is approximately equal to the standard deviation.").
  - **Comparing at the same time:** Google, *Site Reliability Engineering Workbook*, chapter 16
    [Canarying Releases](https://sre.google/workbook/canarying-releases/) (the passage on comparing a business day with a
    weekend: "introducing a large amount of noise").
  - **Not run here:** k6, Gatling, a real GitHub Actions runner, a dedicated performance environment and a scheduled
    workflow. The tolerance rule (3 scaled MADs, with a 5 % floor), the exit codes 0, 1 and 2, the minimum of 80 samples,
    the 80 % CPU limit, the 1 % error allowance and the 15-minute pull request budget are **this lesson's example
    policy**, not a standard. Choose your own from your own history.

prerequisites:
  - reading-load-test-results
  - performance-requirements-and-slos
  - locust-distributed-and-ci
  - ci-quality-gates

concepts:
  - id: perf-ci-baseline
    name: Baselines and noise
    summary: A pipeline compares each run with a baseline made of recent runs of the same environment; the baseline is a median with a measured spread (MAD), so the tolerance comes from how much identical runs really differ instead of a percentage somebody guessed.
  - id: perf-ci-gate
    name: The regression gate
    summary: A gate returns three different answers - pass, fail, and "this run cannot be judged" - checks errors and a budget as well as the p95 comparison, fails closed on broken input, and records only passing runs into the baseline.
  - id: perf-ci-placement
    name: Where performance tests run
    summary: A short smoke belongs on pull requests, the long test nightly and before release on a stable environment; timeouts, concurrency, evidence on failure, a gate that can really fail and a schedule off the hour are properties of the workflow you can check with a linter.

objectives:
  - Explain why a fixed percentage threshold on a single run flaps, and replace it with a baseline median and a tolerance measured from the history (MAD with a floor).
  - Keep a baseline history safely - atomic writes, a bounded window, and never silently starting a new history when the file is damaged.
  - Write a gate with three exit codes that separates "slower or failing" (1) from "cannot be judged" (2), checks errors and an absolute budget, and records only passing runs.
  - Say why p95 alone misses a build that fails 20 % of its requests, why p99 over about a hundred samples is not a gate, and how a rolling baseline lets slow drift through.
  - Choose what runs on a pull request, what runs nightly and what runs before release, and say why.
  - Lint a GitHub Actions workflow for timeouts, pull request duration, a gate that cannot fail, evidence on failure, overlapping runs and a schedule on the hour.

sections:
  - id: intuition
    kind: intuition
    concepts: [perf-ci-baseline, perf-ci-gate, perf-ci-placement]
    title: The idea in plain language
    body: |
      A SandPay team adds a load test to the pipeline with one rule: **fail the build if p95 is more than 5 % worse than
      last time**. On Monday it fails a harmless change. On Tuesday it passes a build that returns an error for one payment
      in five. By Friday the team has added `continue-on-error: true` "until we sort out the flaky perf job", and the
      load test now runs on every commit and protects nothing.

      Every part of that story is avoidable, and the lesson takes the three causes in turn.

      **Noise.** Twelve runs of the *same* build in this lesson gave p95 values between 60 and 68 ms (one slow start
      gave 82 ms). A rule that compares one run with one run at 5 % fires on an unchanged build about one run in seven.
      The fix is to measure how much runs differ when nothing changed and to compare against **that**.

      **A number that cannot answer the question.** The build that failed 20 % of payment creations had a p95 of 61 ms
      - *better* than the baseline's 64 ms - because failed requests are fast. A gate that reads only p95 passes it. A
      gate needs to check errors too, and it needs to know when a run is **not worth judging** (too few samples, a
      load generator that ran out of CPU) so that it says "I cannot tell" instead of guessing.

      **Placement.** A 30-minute load test cannot run on every pull request, and a 4-second one cannot catch a memory
      leak. Each kind of test has a place, a timeout, somewhere to leave evidence when it fails, and a way of not
      overlapping with the next run. Those are properties of the workflow file, and a ten-line linter can check them.

      This lesson builds the three pieces - a baseline, a gate, a workflow linter - and runs them on real Locust runs.

  - id: what
    kind: what
    concepts: [perf-ci-baseline, perf-ci-gate, perf-ci-placement]
    title: What a pipeline performance test is made of
    body: |
      - **A run summary.** The few numbers kept from a load test: samples, errors, p50, p95, p99, throughput and how
        busy the load generator was. The full results (a JTL or Locust's CSV and JSON) go into an artifact for people;
        the summary goes into the history for machines.
      - **A baseline.** The summary numbers of the last several *passing* runs on the same environment, reduced to a
        **median** (the typical value) and a **MAD** (median absolute deviation: the median of how far each run is from
        that median - a spread that one bad run cannot distort).
      - **A tolerance.** How far from the baseline median a run may be before it counts as a change. Here
        `max(5 %, 3 x scaled MAD / median)`: never tighter than 5 %, and wider when the baseline itself is noisy.
      - **A gate.** The code that turns a run summary and a history into an **exit code**: 0 (pass), 1 (the build is
        slower or failing) or 2 (the run cannot be judged). The pipeline fails the job on any non-zero code.
      - **A budget.** An absolute limit (for example p95 below 200 ms) that does not depend on any baseline. It is the
        requirement; the baseline is the regression detector.
      - **A place in the pipeline.** Which trigger runs the test (pull request, merge, nightly, release), on which
        environment, with which timeout, and what is kept when it fails.

      A **smoke** run is a short, small load that proves the test and the build still work together (does the scenario
      run, are there errors, did anything collapse). A **full** run is the real test. They answer different questions and
      belong in different places.

  - id: why
    kind: why
    concepts: [perf-ci-baseline, perf-ci-gate, perf-ci-placement]
    title: Why this takes more than a threshold
    body: |
      **Performance regressions are gradual and silent.** A functional bug fails a test the day it is introduced. A
      slow query, an extra network call or a smaller pool makes everything a few percent slower, and nobody notices
      until the combined effect is a complaint. A gate on every merge turns "who made it slow?" into "which commit?".

      **A flapping gate costs more than no gate.** Once a check fails for no reason, people re-run it until it goes green,
      then mute it. A gate must therefore be *quiet when nothing changed* (measure the noise) and *loud when it
      does* (check what the p95 cannot see).

      **A result that is not a result must not look like one.** If the load generator was at 95 % CPU, the numbers
      describe the generator. If only 64 requests were made, the percentile is one request. Returning "pass" for those runs
      hides a hole; returning "fail" blames the build for a problem in the test. A third answer - **cannot be judged** -
      sends the right person to the right problem. Locust's own exit-code documentation makes the same point for failures:
      it gives 1 "if there were any failed samples" by default, and lets a script set the code itself.

      **The pipeline is shared, noisy infrastructure.** Hosted CI machines are shared and vary; GitHub says scheduled
      workflows "can be delayed during periods of high loads". The way to live with that is to measure (the baseline's
      MAD), to run the long tests where the environment is stable, and to keep what failed for later reading.

      **Money and attention.** A load test costs minutes of runner time and an environment slot. Spending them on the
      right trigger - a smoke on every pull request, the full test nightly - is the difference between a test that runs
      and a test that is skipped "because it takes too long".

  - id: baseline-internals
    kind: internals
    concepts: [perf-ci-baseline]
    title: Internals - the baseline, the MAD and the tolerance
    body: |
      ### The history file

      The CI job restores a JSON file of earlier run summaries (from an artifact, a cache or a branch), appends the new
      run **if it passed**, and saves it again. Three details make that safe:

      - **Atomic write.** Write `history.json.tmp` and `os.replace` it over the real file, so a job killed half-way never
        leaves a half-written history.
      - **A bounded window.** Keep the newest 30 runs and read the last 10: old runs describe an old environment, and the
        baseline should follow real, accepted changes.
      - **Fail loudly on a damaged file.** A history that does not parse is an error, **not** an empty history. Starting
        silently from nothing means the next run has nothing to be compared with, so it passes - and so does every run
        until five new ones exist.

      ### Median and MAD

      For the last ten p95 values the **median** is the middle one when they are sorted. The **MAD** is the median of
      `|value - median|`. One freak run moves the mean and the standard deviation a lot and the median and MAD hardly
      at all, which is why they suit a baseline built from a handful of noisy runs. The captured baseline (12 runs, the
      last 10 used):

      ```text
      p95 values : 82, 64, 64, 60, 65, 64, 68, 64, 63, 60, 64, 62
      last 10    : 64, 60, 65, 64, 68, 64, 63, 60, 64, 62   median 64   MAD 1
      deviations : 0, 4, 1, 0, 4, 0, 1, 4, 0, 2   (sorted 0, 0, 0, 0, 1, 1, 2, 4, 4, 4: the middle two are 1 and 1)
      ```

      The slow start (82 ms, only 64 samples) is outside the window of ten, and would have hardly moved the median or the
      MAD if it had been inside. The NIST reference manual defines the **scaled MAD** as MAD / 0.6745 and says that "for
      normally distributed data, the scaled MAD is approximately equal to the standard deviation" - so
      `3 x scaled MAD` plays the part of the familiar "three standard deviations", without the outlier sensitivity.
      Whether run-to-run noise is normally distributed is an assumption; the floor and a budget back it up.

      ### A fixed percentage, measured

      To see what a fixed rule does, take the 15 runs of the unchanged build (12 baseline runs plus 3 more) and compare each
      with the median of the other 14 (`support/pci_demo.py`, 21 November 2026):

      ```text
      p95 of the 15 runs: [82, 64, 64, 60, 65, 64, 68, 64, 63, 60, 64, 62, 62, 60, 62]
      fixed 2% threshold: 3 of 15 identical-build runs flagged
      fixed 5% threshold: 2 of 15 identical-build runs flagged
      fixed 10% threshold: 1 of 15 identical-build runs flagged
      ```

      Nothing changed between those runs, and a 10 % rule still flagged one of them (the slow start, 82 ms).

      ### The tolerance

      `tolerance = max(floor, k x (MAD / 0.6745) / median)` with `floor = 5 %` and `k = 3`:

      - With MAD 1 and median 64: `3 x 1.4826 / 64 = 6.95 %`.
      - On a very quiet baseline (MAD 0) the floor of 5 % applies, so a measurement that happens to be identical ten
        times does not make the gate hypersensitive.
      - On a noisy baseline the tolerance grows, which is the honest answer: the test cannot see a change smaller than
        its own noise.

      A run is a **regression** if `(value - median) / median` is greater than the tolerance, an **improvement** if it is
      below minus the tolerance, and **within noise** otherwise (exactly at the tolerance is still noise).

      ### Which metric

      The captured runs make a point about metrics. Across the 12 baseline runs the **p50** was 45-48 ms (the
      slow start included), while the **p95** was 60-82 ms and the **p99** 62-120 ms. With 113-140 samples the top 1 % is
      one or two requests, so a p99 is decided by one or two requests. The baseline of p99 has a MAD of 6 on a median of
      78 - a tolerance of 34 %, wide enough to hide a real regression. Gate on p95 (with enough samples), watch p50 as the
      steadier signal for small changes, and treat p99 as something to chart, not to gate on, unless the runs are long.

  - id: gate-internals
    kind: internals
    concepts: [perf-ci-gate]
    title: Internals - three exit codes and the order of the checks
    body: |
      ### Exit codes

      A CI step fails when its command exits with a non-zero code, and the pipeline can only branch on what it is told.
      The gate uses three:

      | code | meaning | who looks |
      | ---- | ------- | --------- |
      | 0 | pass (including "building the baseline") | nobody |
      | 1 | the build is slower or failing | the developer of the change |
      | 2 | the run cannot be judged | whoever owns the test or the environment |

      Locust and k6 give you the raw ingredients: Locust's default exit code is 1 "if there were any failed samples", and
      a script can set `process_exit_code` on the environment from a `quitting` listener; k6's thresholds make "the test
      finish with a failed status" and a non-zero exit code. This gate is the same idea one level up, with a history.

      ### The order of the checks

      1. **Validity first.** Too few samples (under 80 here), the generator's machine CPU above 80 %, or no p95 in the
         summary: the run is **invalid** (exit 2) and **nothing else is checked** - a verdict about the build from a
         broken measurement is worse than none.
      2. **Failure reasons**, all collected so the report is complete: the **error rate** above 1 %, the p95 above an
         absolute **budget** (when one is set), and the p95 more than the **tolerance** above the baseline median (when
         there are at least five runs of history). Any of them is exit 1.
      3. **Otherwise pass.** With fewer than five runs of history the gate still passes - nothing to compare with - but says
         `building baseline (3 of 5 runs)`, and the error and budget checks have still run.

      ### Why errors are a separate check

      A failed request is usually *fast*: the server gives up straight away. The build that failed 20 % of its payment
      creations answered the ones that worked as quickly as the baseline, so its p95 (61 ms) was *below* the baseline median
      (64 ms). Percentiles of successful requests, or of all requests, can both look fine. The error rate is a separate
      signal and needs its own limit.

      ### Record only what passed

      The history is the definition of "normal". If a failing run is appended, it widens the MAD and drags the median,
      and the next failure looks like normal. If an invalid run is appended, the baseline now contains a measurement of
      a busy CI machine. The gate records a run **only when it returns 0**, and only when asked (`--record`), so a
      pull request job can judge a run without ever changing the baseline.

      ### The limits of a rolling baseline

      A baseline built from recent *passing* runs moves with them. If each run is a little slower than the last and
      each is inside the tolerance of the window it joins, nothing ever fails. Two defences:

      - an **absolute budget** that does not move (the requirement, from `performance-requirements-and-slos`), and
      - a **pinned baseline** - compare also with the last release, not only with the last ten runs.

      The simulation (`support/pci_demo.py`, **not measured**: every passing run is recorded and each run is a fixed
      percentage slower than the one before, starting from the captured baseline median of 64 ms) shows the effect:

      ```text
      1% per run: never failed in 60 runs; p95 reached 116.3 ms = +82% on the original 64 ms
      2% per run: never failed in 60 runs; p95 reached 210.0 ms = +228% on the original 64 ms
      3% per run: never failed in 60 runs; p95 reached 377.1 ms = +489% on the original 64 ms
      a fixed budget of 74 ms (15% above the original 64 ms) would stop the 1% drift at run 15
      ```

      The tolerance even **widens** as the window fills with drifting values, because the MAD grows. A compounding slide for
      sixty runs is an exaggeration, but the mechanism is real: nothing in a rolling baseline remembers what normal used to be.

  - id: placement-internals
    kind: internals
    concepts: [perf-ci-placement]
    title: Internals - what runs where, and what the workflow must say
    body: |
      ### Three places, three questions

      | when | what | length | question it answers |
      | ---- | ---- | ------ | ------------------- |
      | every pull request | a **smoke**: the scenario at a few users | seconds to a few minutes | does the test still run, are there errors, did anything collapse? |
      | after merge / **nightly** | the **full** test on a stable environment | minutes to an hour | did p95, errors or throughput move compared with the baseline? |
      | **before release** | the full test plus the longer ones (soak, spike, stress) | as long as the plan says | does the release meet the SLOs under the planned load? |

      The pull request smoke is a **functional** check of the performance test, with generous limits (errors, a
      collapse). It is not a regression gate, because a 30-second run on a shared runner cannot see 5 %. The repository
      this app lives in does exactly that: its `practice` job runs `practice/verify.sh perf`, which starts real JMeter and
      Locust, but its tests check *behaviour* (which requests ran, which failed, how a model scales), never absolute
      response times.

      ### Properties of the workflow that can be checked

      Each of these is a line in the YAML and a rule in the linter:

      - **`timeout-minutes`.** GitHub's documented default is 360 minutes: a hung load test would hold a runner for six
        hours. Every performance job sets one.
      - **A budget for pull requests.** A performance job triggered by `pull_request` should be short (15 minutes in this
        lesson's policy).
      - **A gate that can fail.** `continue-on-error: true` "allows a job to pass when this step fails" - on the load
        test step it turns the gate into a report nobody reads.
      - **Evidence when it fails.** An `actions/upload-artifact` step with `if: always()` (or `failure()`) keeps the
        results of the run that failed, which is exactly the run someone needs to read.
      - **No overlap on a shared environment.** `concurrency` ensures "only a single job or workflow using the same
        concurrency group will run at a time". Two load tests against one staging environment measure each other.
      - **A schedule off the hour.** GitHub says high load "include[s] the start of every hour" and advises running "at a
        different time of the hour"; `17 2 * * *` rather than `0 2 * * *`. Scheduled workflows also run only on the default
        branch.

      ### Same time, same place

      When you compare two builds, run them in the same environment at about the same time. The SRE Workbook's chapter on
      canaries makes the point with a release compared across a weekend: it introduces "a large amount of noise". A load
      test comparison with yesterday's run on a different runner has the same problem; a fresh run of the **baseline build
      next to the candidate** (alternating) removes most of it, at the price of doubling the run time.

  - id: when
    kind: when
    concepts: [perf-ci-baseline, perf-ci-gate, perf-ci-placement]
    title: When to use each piece
    body: |
      - **A pull request smoke** - always, as soon as a load test exists. Keep it under a few minutes, give it
        generous limits (errors, a collapse), and do not compare it with a baseline.
      - **A nightly baseline gate** - when the service has a stable test environment and the test is long enough
        (hundreds to thousands of samples per run). Start by running it for two weeks *without* failing the build, to see
        the spread, then turn the gate on.
      - **An absolute budget** - always, next to the baseline. The baseline finds regressions; the budget is the
        requirement and also catches drift.
      - **Exit code 2 (cannot be judged)** - whenever the gate is automatic. Decide who is told, and whether the pipeline
        retries once on a new runner.
      - **A pinned baseline** (the last release) - when releases are far apart or the service changes often; it is the
        defence against drift.
      - **The workflow linter** - in the repository's checks, so a new performance job cannot be added without a timeout
        and evidence.

      Do **not** gate pull requests on a 5 % regression from a 30-second run. Do **not** gate on p99 with a hundred samples.
      Do **not** let a failing run into the baseline to make the next run pass.

  - id: visual
    kind: visual
    concepts: [perf-ci-baseline, perf-ci-gate, perf-ci-placement]
    title: How the pieces fit together
    body: |
      ```mermaid
      flowchart TD
        R["Run summary: samples, errors, p95, CPU"] --> V{"Can the run be judged?"}
        V -- "no: few samples, busy generator" --> I["Exit 2 - invalid, tell the test owner"]
        V -- "yes" --> F{"Errors, budget, baseline"}
        F -- "any limit broken" --> X["Exit 1 - fail, tell the author"]
        F -- "none" --> P["Exit 0 - pass"]
        P --> H["Record in history - only with --record"]
        H --> B["Next run's baseline: median and MAD of the last 10"]
        B --> F
      ```

      ```mermaid
      flowchart LR
        PR["Pull request"] --> S["Smoke: seconds, loose limits"]
        S --> M["Merge to main"]
        M --> N["Nightly: full test, baseline gate"]
        N --> REL["Release: full test plus soak and stress"]
        N --> A["Artifact: results kept even when it fails"]
      ```

      The first diagram is the gate; the history it records feeds the next run. The second is the plan for where each
      kind of test lives.

  - id: code-baseline
    kind: code
    concepts: [perf-ci-baseline]
    title: The baseline store and the comparison in Python
    body: |
      The reference solution of `analysis/pci_baseline.py`, trimmed to the functions (the exercise has the full
      docstring):

      ```python
      import json
      import os
      import statistics
      from pathlib import Path

      MIN_RUNS = 3
      MAD_SCALE = 0.6745


      def load_history(path):
          p = Path(path)
          if not p.exists():
              return []
          try:
              data = json.loads(p.read_text())
          except json.JSONDecodeError as err:
              raise ValueError(f"{p} is not valid JSON: {err}") from err
          if not isinstance(data, list):
              raise ValueError(f"{p} must hold a JSON list of runs")
          return data


      def save_run(path, run, keep=30):
          history = (load_history(path) + [run])[-keep:]
          p = Path(path)
          tmp = p.with_name(p.name + ".tmp")
          tmp.write_text(json.dumps(history, indent=1) + "\n")
          os.replace(tmp, p)
          return history


      def baseline(history, metric="p95_ms", window=10):
          values = [r[metric] for r in history[-window:] if metric in r]
          if len(values) < MIN_RUNS:
              return None
          median = statistics.median(values)
          mad = statistics.median(abs(v - median) for v in values)
          return {"median": median, "mad": mad, "n": len(values)}


      def tolerance(base, floor=0.05, k=3.0):
          if base["median"] <= 0:
              return floor
          return max(floor, k * (base["mad"] / MAD_SCALE) / base["median"])


      def compare(base, value, floor=0.05, k=3.0):
          if base["median"] <= 0:
              raise ValueError("the baseline median must be positive")
          change = (value - base["median"]) / base["median"]
          tol = tolerance(base, floor, k)
          status = "regression" if change > tol else "improvement" if change < -tol else "within noise"
          return {"change": round(change, 4), "tolerance": round(tol, 4), "status": status}
      ```

      Driver (`support/pci_demo.py` prints this and the other tables), run on the 12 captured baseline runs and the runs
      of the other builds, 21 November 2026:

      ```python
      from pci_fixture import history
      from analysis.pci_baseline import baseline, compare, tolerance

      runs = history()
      base = baseline(runs["main"])            # the last 10 of the 12 runs
      print(base, round(tolerance(base), 4))
      for name in ("same", "small", "slower", "failing"):
          print(name, [(r["p95_ms"], compare(base, r["p95_ms"])["status"]) for r in runs[name]])
      ```

      ```text
      {'median': 64, 'mad': 1, 'n': 10} 0.0695
      same [(62, 'within noise'), (60, 'within noise'), (62, 'within noise')]
      small [(67, 'within noise'), (69, 'regression'), (70, 'regression')]
      slower [(84, 'regression'), (97, 'regression'), (86, 'regression')]
      failing [(61, 'within noise'), (61, 'within noise'), (61, 'within noise')]
      ```

      Read it carefully. The **same** build is within noise three times out of three. The **slower** build (26 ms service time) is
      a regression three times out of three. The **small** build, a service time 10 % longer, is caught on two runs and
      missed on one: its p95 of 67 ms is 4.7 % above the median and the tolerance is 6.95 %. A single run cannot reliably see a 10 %
      change at this noise level - which is why a failing gate should be **re-run once** before anybody is blamed (see the
      trade-offs). And the **failing** build, with a fifth of its payment creations returning errors, is "within noise" on
      p95 every time.

  - id: code-gate
    kind: code
    concepts: [perf-ci-gate]
    title: The gate and its exit codes in Python
    body: |
      The reference solution of `analysis/pci_gate.py`, trimmed (the exercise has the full docstring and the
      command-line `main`):

      ```python
      from analysis.pci_baseline import baseline, compare, load_history, save_run

      EXIT_PASS, EXIT_REGRESSION, EXIT_INVALID = 0, 1, 2


      def validity_problems(run, min_samples=80, max_cpu=80):
          problems = []
          samples = run.get("samples", 0)
          if samples < min_samples:
              problems.append(f"only {samples} samples (need {min_samples})")
          cpu = run.get("generator_cpu_max", 0)
          if cpu > max_cpu:
              problems.append(f"generator CPU reached {cpu}% (limit {max_cpu}%)")
          if "p95_ms" not in run:
              problems.append("p95_ms is missing")
          return problems


      def evaluate(run, history, budget_p95=None, max_error_rate=0.01, min_runs=5, floor=0.05, k=3.0,
                   min_samples=80, max_cpu=80):
          problems = validity_problems(run, min_samples, max_cpu)
          if problems:
              return {"code": EXIT_INVALID, "status": "invalid", "reasons": problems}
          reasons = []
          rate = run.get("errors", 0) / run["samples"]
          if rate > max_error_rate:
              reasons.append(f"error rate {rate:.1%} is above {max_error_rate:.1%}")
          if budget_p95 is not None and run["p95_ms"] > budget_p95:
              reasons.append(f"p95 {run['p95_ms']} ms is above the budget {budget_p95} ms")
          base = baseline(history)
          building = base is None or base["n"] < min_runs
          if not building:
              result = compare(base, run["p95_ms"], floor, k)
              if result["status"] == "regression":
                  reasons.append(f"p95 {run['p95_ms']} ms is {result['change']:.1%} above the baseline median "
                                 f"{base['median']:g} ms (tolerance {result['tolerance']:.1%})")
          if reasons:
              return {"code": EXIT_REGRESSION, "status": "fail", "reasons": reasons}
          note = []
          if building:
              have = 0 if base is None else base["n"]
              note = [f"building baseline ({have} of {min_runs} runs)"]
          return {"code": EXIT_PASS, "status": "pass", "reasons": note}
      ```

      Driver: each captured run judged against the last 10 baseline runs (printed by `support/pci_demo.py`,
      21 November 2026; `cpu` is whole-machine CPU during the run):

      ```text
      main-01    samples  64 errors  0 p95 82 ms cpu 44% -> exit 2 invalid ['only 64 samples (need 80)']
      same-01    samples 113 errors  0 p95 62 ms cpu 27% -> exit 0 pass []
      small-01   samples  95 errors  0 p95 67 ms cpu 57% -> exit 0 pass []
      small-02   samples 112 errors  0 p95 69 ms cpu 46% -> exit 1 fail ['p95 69 ms is 7.8% above the baseline median 64 ms (tolerance 7.0%)']
      slower-01  samples  84 errors  0 p95 84 ms cpu 90% -> exit 2 invalid ['generator CPU reached 90% (limit 80%)']
      slower-02  samples 102 errors  0 p95 97 ms cpu 76% -> exit 1 fail ['p95 97 ms is 51.6% above the baseline median 64 ms (tolerance 7.0%)']
      failing-01 samples 127 errors 25 p95 61 ms cpu 46% -> exit 1 fail ['error rate 19.7% is above 1.0%']
      busy       (the same run with CPU 95%) -> {'code': 2, 'status': 'invalid', 'reasons': ['generator CPU reached 95% (limit 80%)']}
      budget     same run, budget 50 ms, no history -> {'code': 1, 'status': 'fail', 'reasons': ['p95 62 ms is above the budget 50 ms']}
      new        same run, empty history -> {'code': 0, 'status': 'pass', 'reasons': ['building baseline (0 of 5 runs)']}
      ```

      Two of the captured runs are real examples of **exit 2**: the very first run of the batch made only 64 samples (a slow
      start), and one of the "slower" runs was made while whole-machine CPU reached 90 %. Judging either of them would have
      measured the test, not the build.

  - id: code-workflow
    kind: code
    concepts: [perf-ci-placement]
    title: Linting a workflow in Python
    body: |
      The reference solution of `analysis/pci_workflow.py`, trimmed to the parts that carry the ideas:

      ```python
      import re

      MARKERS = re.compile(r"\b(locust|jmeter|k6|gatling)\b|verify\.sh perf", re.IGNORECASE)


      def triggers(workflow):
          value = None
          for key in ("on", True, "true"):       # YAML 1.1 turns an unquoted `on` into True
              if key in workflow:
                  value = workflow[key]
                  break
          if value is None:
              return set()
          return {value} if isinstance(value, str) else set(value)


      def perf_jobs(workflow):
          return [job_id for job_id, job in workflow.get("jobs", {}).items()
                  if any(isinstance(s.get("run"), str) and MARKERS.search(s["run"]) for s in job.get("steps", []))]
      ```

      and, inside `lint`, one block per rule, for example:

      ```python
      timeout = job.get("timeout-minutes")
      has_timeout = isinstance(timeout, int) and not isinstance(timeout, bool)
      if not has_timeout:
          add("no-timeout", job_id, "no timeout-minutes; the default is 360 minutes")
      effective = timeout if has_timeout else 360
      if "pull_request" in events and effective > pr_budget_minutes:
          add("pr-too-long", job_id, f"runs on pull_request with a {effective}-minute timeout "
              f"(budget {pr_budget_minutes})")
      ```

      The practice project has no YAML library, so the workflow arrives as a `dict`; the repository's own
      `.github/workflows/pages.yml` was converted to JSON with the `yaml` npm package (JSON is valid YAML, and the real
      file uses `on:` as the documentation does). Driver, on that file (21 November 2026):

      ```text
      triggers: ['pull_request', 'push', 'workflow_dispatch']
      performance jobs: ['practice']
      timeouts: {'check': 30, 'practice': 40, 'deploy': None}
      {'rule': 'pr-too-long', 'job': 'practice', 'message': 'runs on pull_request with a 40-minute timeout (budget 15)'}
      with a 45-minute budget: []
      ```

      One finding, and it is a judgement call, not a bug: the `practice` job is one job for **all** the practice projects
      (Java, Playwright, AI, performance, security), so its 40 minutes are not a load test, and the performance part
      asserts behaviour rather than speed. The linter's 15-minute figure is this lesson's policy; the finding tells you
      to look, and the answer here is either "split the performance project into its own job" or "accept it and raise the
      budget". Now a nightly job written to pass, and the same job with five mistakes added:

      ```text
      findings: []
      schedule-on-the-hour         cron '0 2 * * *' starts on the hour, when scheduled runs can be delayed
      gate-cannot-fail       load  continue-on-error lets the performance step fail without failing the build
      no-concurrency         load  no concurrency group; two runs can overlap on a shared environment
      no-evidence            load  no upload-artifact step that runs when the job fails
      pr-too-long            load  runs on pull_request with a 45-minute timeout (budget 15)
      ```

  - id: line-by-line
    kind: line-by-line
    concepts: [perf-ci-baseline, perf-ci-gate, perf-ci-placement]
    title: Line by line - the choices that matter
    body: |
      **`load_history` and `save_run`**

      - '`if not p.exists(): return []` - the first run ever has no file; that is the one case where an empty history is
        right.'
      - '`raise ValueError` on bad JSON or a non-list - a damaged baseline is an incident, not a fresh start. A test
        checks that `save_run` leaves a damaged file untouched for a person to look at.'
      - '`[-keep:]` after appending - the newest runs survive; the window for the baseline (10) is smaller than the store
        (30).'
      - '`tmp` then `os.replace` - the file is either the old history or the new one, never half of each.'

      **`baseline`**

      - '`history[-window:]` before `if metric in r` - the window counts runs, not runs that happen to have the metric.'
      - '`len(values) < MIN_RUNS` returns `None` - with two runs there is no spread to speak of. The gate needs five.'
      - 'Median of `abs(v - median)` - the MAD. It is `0.5` or `1` on the captured runs, because most runs are close and one or
        two are not.'

      **`tolerance` and `compare`**

      - '`max(floor, ...)` - the floor stops a lucky run of identical values from making the gate hair-trigger.'
      - '`change > tol` is strict - a change exactly at the tolerance is noise. A test pins both edges.'
      - '`round(change, 4)` - the reported number is stable, which keeps messages and tests exact.'

      **`validity_problems` and `evaluate`**

      - '`run.get("samples", 0)` - a missing key counts as zero, so a summary missing its sample count is invalid rather
        than an exception.'
      - 'Validity is checked **before** anything else and returns early - a verdict from a broken measurement is withheld.'
      - '`rate > max_error_rate` is `>`, not `>=` - one error in 127 samples (0.8 %) is inside a 1 % allowance.'
      - '`building = base is None or base["n"] < min_runs` - fewer than five runs means no comparison, but the error rate
        and the budget have already been checked; the gate passes with a visible note.'

      **`main`** (in the exercise)

      - 'A run file that cannot be read returns 2 - failing closed: a missing result is not a pass.'
      - '`--record` writes only when the code is 0 - a failing or invalid run never becomes part of "normal".'

      **`lint`**

      - '`isinstance(timeout, bool)` guard - in Python `True` is an `int`; a `timeout-minutes: true` must not count.'
      - 'A job is a **performance** job because a `run` step names a tool, not because of its name - `verify.sh perf` counts,
        `verify.sh security` does not.'
      - 'The sort by `(job, rule)` - the same workflow always gives the same report, which makes it diffable in review.'

  - id: steps
    kind: steps
    concepts: [perf-ci-baseline, perf-ci-gate, perf-ci-placement]
    title: Steps - putting a load test into the pipeline
    body: |
      1. **Write the smoke first.** A few users, a few seconds to minutes, generous limits (error rate, no collapse).
         Run it on every pull request. Give the job a `timeout-minutes`.
      2. **Make the full test produce a run summary** (samples, errors, p50, p95, throughput, generator CPU) and keep the
         full results as an artifact with `if: always()`.
      3. **Collect a baseline without a gate.** Run the full test nightly for two weeks, appending every run to the history
         but failing nothing. Look at the spread of p95, and of the other metrics, and decide what you can gate on.
      4. **Choose the policy and write it down:** the window (10 runs), the tolerance (here 3 scaled MADs, floor 5 %), the
         minimum samples, the CPU limit, the error allowance, the absolute budget from the SLO, the number of runs needed.
      5. **Turn the gate on** with `--record` on the main branch only. Pull requests judge, they never record.
      6. **Decide what exit 2 does:** who is notified, and whether the job reruns once.
      7. **Re-run once on a failure** before blaming a change; require two consecutive failures to block a release if the
         test is short.
      8. **Pin a baseline** (the last release) and compare against it in the release run.
      9. **Lint the workflow** in the repository's checks so every performance job keeps its timeout, evidence and
         concurrency group.
      10. **Review the policy** after a month: how many failures were real, how many were noise, how many exit 2?

  - id: example
    kind: example
    concepts: [perf-ci-baseline, perf-ci-gate, perf-ci-placement]
    title: Worked example - the nightly that cried wolf
    body: |
      *Hypothetical, to show the order of reasoning; the figures are invented for the story and are not
      measurements.*

      SandPay's nightly job compares each run's p95 with the previous night's and fails above +5 %. Over four weeks it
      fails nine times; two were real regressions, seven were noise. The team has started to re-run it until it passes.

      1. **Count the noise.** They collect the p95 of the last 30 nightly runs of unchanged code. The median is 118 ms and the
         MAD is 6 ms: three scaled MADs is 15 % of the median, three times the threshold they had.
      2. **Change the question.** The gate now compares with the median of the last 10 passing runs and allows
         `max(5 %, 15 %)`. A real +9 % regression would still hide, so they also set a budget at 140 ms taken from the
         SLO, and the error rate limit at 1 %.
      3. **Name the third outcome.** Four of the nine failures happened on nights when the runner's CPU was above 85 %.
         Those runs are now exit 2 and go to the platform team, not to the author of the last commit.
      4. **Stop the leak.** The job used to append every run to the history, including failures. It now records only
         on exit 0.
      5. **Move the smoke.** The 25-minute load test also ran on pull requests. It is replaced there by a 2-minute smoke
         with an error limit, and the workflow linter keeps it that way.

      The next four weeks produce two failures; both are real and both name the commit. Nothing about the application
      changed - only the way the numbers were read.

  - id: tests
    kind: tests
    concepts: [perf-ci-baseline, perf-ci-gate, perf-ci-placement]
    title: How the exercises are tested
    body: |
      Three files under `practice/perf/tests/analysis/` check your three modules. Each has hand-made values with the
      answer worked out in a comment, then the captured data:

      - '`test_pci_baseline.py` - a missing file is an empty history, a broken one is an error; `save_run` appends, trims,'
        leaves no temporary file and never overwrites a damaged file; the median and MAD by hand; the floor and `k`; the
        edges of `compare`; then the 12 captured runs (median 64, MAD 1, tolerance about 6.95 %), the same build as noise,
        the 26 ms build as a regression, the 22 ms build caught on two runs of three, and the failing build hiding in p95.
      - '`test_pci_gate.py` - the exit codes, the order of the validity messages, a run that passes, a slower build, a failing
        build with a fine p95, invalid runs (including the two real ones), the budget without a baseline, "building
        baseline", the order of the failure reasons, `main` (output, exit code, `--budget-p95`, `--min-runs`), an
        unreadable run file, and that only a passing run is recorded. One test makes **one fresh real Locust run**
        (3 seconds, 90 % of payment creations failing) and sends it through the gate with the machine-dependent limits
        switched off, expecting exit 1 with an error-rate reason.'
      - '`test_pci_workflow.py` - the shapes of `on`, the YAML 1.1 spelling, which jobs count as performance jobs, one test
        per rule, sorting, and the repository'"'"'s own `pages.yml` giving exactly one finding.'

      The tests check **behaviour and shape**, not absolute response times: the only fresh run asserts an error reason, which
      does not depend on how fast the machine is.

      Run them as the CI does: `PERF_TARGET=solutions .venv/bin/python -m pytest tests/analysis -q` passes (the three
      files hold 14, 15 and 12 tests, in that order); against the unsolved exercises each file fails.

  - id: mistakes
    kind: mistakes
    concepts: [perf-ci-baseline, perf-ci-gate, perf-ci-placement]
    title: Common mistakes
    body: |
      - **A fixed percentage on a single run.** Fifteen runs of identical builds: a 5 % rule against the others'
        median flagged two of them, a 2 % rule three. Measure the spread and compare against it.
      - **Gating on p99 over a hundred samples.** The top 1 % is one or two requests. On the captured baseline the p99
        tolerance came out at 34 %.
      - **Gating on p95 alone.** A build that fails a fifth of its payment creations had a *better* p95. Check errors,
        and check that the run made enough requests.
      - **Judging a run you should not trust.** A run with 64 samples, or made while the machine was at 90 % CPU, says
        something about the test. Return "cannot be judged" and do not compare it.
      - **Starting a new history when the file is damaged.** The next runs pass because there is nothing to compare
        with. A damaged baseline should stop the job.
      - **Recording failing runs in the baseline.** The failure becomes normal and the MAD grows.
      - **Only a rolling baseline.** Drift gets through (see the simulation). Keep an absolute budget and a pinned
        baseline.
      - **`continue-on-error: true` "for now".** The gate cannot fail, so it will not.
      - **No timeout.** The documented default is 360 minutes.
      - **A schedule at minute 0.** GitHub documents delays and dropped jobs at the start of every hour.
      - **Two load tests on one environment at the same time.** Use a `concurrency` group, or separate environments.
      - **Throwing away the evidence.** If the failing run's results are not uploaded when the job fails, the next
        person reruns it and gets different numbers.
      - **Putting a 30-minute load test on every pull request.** It will be skipped, cancelled or made optional.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [perf-ci-baseline, perf-ci-gate, perf-ci-placement]
    title: Trade-offs
    body: |
      - **Window length.** A window of 10 follows real changes quickly and is noisier; 30 is steadier and reacts
        slowly. Whatever you choose, an accepted, intended slowdown needs a way to reset the baseline.
      - **Tolerance.** `k = 3` and a 5 % floor are an example. A wider tolerance means fewer false alarms and lets a
        real 7-8 % regression through; on the captured data a 22 ms (10 % slower) build was caught on two runs out of three.
      - **Rerun on failure.** Re-running once and failing only if both runs fail removes most noise at the price of
        another run and a slower pipeline. For a 4-second test it is cheap; for a one-hour test it is not.
      - **p50, p95 or both.** On the captured runs p50 (45-48 ms) is much steadier than p95 (60-82 ms) and also showed the
        10 % slowdown (51 ms on all three runs), while p95 caught it only on two of three. p95 is closer to what users feel.
        A gate may check both.
      - **Compare with yesterday or run both builds now.** The history is free; running the baseline build next to the
        candidate removes environment noise but doubles the cost.
      - **Hosted runners or a dedicated environment.** Hosted runners are convenient and noisy; a dedicated environment is
        quiet and must be looked after. Smokes suit the first; regression gates suit the second.
      - **Strict budget or trend.** A budget is simple and blunt; a trend over weeks catches drift and needs charting.
        Use the budget as the guard and the baseline as the detector.

  - id: summary
    kind: summary
    concepts: [perf-ci-baseline, perf-ci-gate, perf-ci-placement]
    title: Summary
    body: |
      - A pipeline load test needs a **baseline of recent passing runs**, a **tolerance from the measured noise**
        (median and MAD, with a floor) and a **gate with exit codes**. A fixed percentage on one run flags unchanged
        builds: on 15 identical-build runs, 5 % flagged two and 2 % flagged three.
      - The captured baseline: p95 median 64 ms, MAD 1, tolerance about 6.95 %. The same build was within noise 3 of 3
        times, the 26 ms build was a regression 3 of 3, the 22 ms build (10 % slower service) was caught 2 of 3.
      - **Exit 0 pass, 1 slower or failing, 2 cannot be judged.** Judge validity first (samples, generator CPU), then
        errors, an absolute budget and the baseline comparison. A missing or unreadable result is exit 2, never a pass.
      - **p95 alone misses errors:** the build that failed 20 % of payment creations had p95 61 ms against a baseline of 64.
        p99 over about a hundred samples is one or two requests and carried a 34 % tolerance.
      - **Record only passing runs**, with `--record`, on the main branch. A rolling baseline lets slow drift through:
        keep an absolute budget and a pinned baseline.
      - **Place tests by question:** a short smoke on pull requests, the full test nightly on a stable environment, the
        long tests before release. Every performance job sets `timeout-minutes` (default 360), keeps evidence with
        `if: always()`, has a `concurrency` group, no `continue-on-error` on the gate, and a schedule off the hour.
      - The repository's own `pages.yml` gave one finding with the linter - a 40-minute job on `pull_request`, shared with
        other projects, whose performance tests check behaviour and not speed.

exercises:
  - id: pci-fixed-threshold
    type: mcq
    concept: perf-ci-baseline
    skill: analysis
    title: The 5 % rule that cries wolf
    prompt: |
      A pipeline fails the build when p95 is more than 5 % above the previous run. Over a month it fails on code that did
      not change in a way anyone can find. Fifteen runs of an identical build had p95 values between 60 and 68 ms, with
      one slow start at 82 ms. What is the most useful change?
    options:
      - id: spread
        text: Measure how much runs of an unchanged build differ (median and MAD of the last runs) and compare against a tolerance that comes from that spread, with a floor.
        feedback: Correct - the tolerance should reflect the noise the test really has, and it widens or narrows with it.
      - id: tighter
        text: Lower the threshold to 2 % so that real regressions are not missed.
        feedback: A tighter threshold flags more unchanged builds - three of the fifteen in the captured data.
      - id: ignore
        text: Add continue-on-error so that the job never blocks a merge.
        feedback: A gate that cannot fail is a report nobody reads. Fix the rule instead.
      - id: mean
        text: Use the mean of the last three runs as the baseline.
        feedback: Three runs say little about the spread, and the mean is pulled by one slow start. A median of about ten runs with a MAD is steadier.
    correct: [spread]
    hints:
      - What does the threshold know about how much an unchanged build varies?
    solution: |
      Replace the guessed percentage with a tolerance measured from the history (median and MAD), keeping a floor.

  - id: pci-median-mad
    type: mcq
    concept: perf-ci-baseline
    skill: application
    title: Why median and MAD
    prompt: |
      The last ten p95 values are 64, 60, 65, 64, 68, 64, 63, 60, 64 and 62 ms. An eleventh run, a slow start, adds 82 ms. Which
      statement about the baseline is correct?
    options:
      - id: robust
        text: The median stays near 64 and the MAD near 1, so one slow start hardly changes the baseline or the tolerance; a mean and standard deviation would both move much more.
        feedback: Correct - this robustness is why the median and the MAD suit a baseline made of a handful of noisy runs.
      - id: mean
        text: The mean is better, because it uses every value.
        feedback: 'Using every value is exactly the problem: one 82 ms run moves the mean and the standard deviation noticeably.'
      - id: drop
        text: The slow start must be deleted from the history before computing anything.
        feedback: Never edit history by hand; a robust statistic makes that unnecessary. (A run that cannot be judged is simply never recorded.)
      - id: max
        text: The baseline should be the maximum of the last ten runs, to be safe.
        feedback: The maximum is the least stable statistic of all, and a gate based on it would never fail.
    correct: [robust]
    hints:
      - Which statistics are decided by the middle of the sorted values?
    solution: |
      The median and the MAD are decided by the middle of the sorted values, so one extreme run barely moves them.

  - id: pci-record-what
    type: mcq
    concept: perf-ci-baseline
    skill: application
    title: What goes into the history
    prompt: |
      A nightly gate returned exit 1 (a regression) on Tuesday, and the author of the change pushed a fix on Wednesday.
      Should Tuesday's run be appended to the baseline history?
    options:
      - id: no
        text: No - only passing runs are recorded, so a failing run cannot widen the tolerance or become "normal"; the failed results stay in the artifact for people to read.
        feedback: Correct - the history defines normal, so it should contain only runs that passed the gate.
      - id: yes
        text: Yes - every run is data, and the median will absorb it.
        feedback: A failing run drags the median and widens the MAD; repeated failures would move the baseline until they pass.
      - id: edit
        text: Yes, but with its p95 replaced by the budget so that it does no harm.
        feedback: Never edit measurements. Leave it out and keep the real results as evidence.
      - id: half
        text: Only if the error rate was zero.
        feedback: A p95 regression is a regression even with zero errors; it should not be recorded either.
    correct: [no]
    hints:
      - What does the history mean to the next run?
    solution: |
      No. The baseline records what normal looks like; failing and invalid runs are kept as artifacts, not as history.

  - id: pci-exit-two
    type: mcq
    concept: perf-ci-gate
    skill: analysis
    title: Exit 1 or exit 2?
    prompt: |
      A nightly run made 64 requests instead of about 130, and the machine's CPU reached 90 % during it. Its p95 is 82 ms
      against a baseline median of 64 ms. What should the gate return?
    options:
      - id: two
        text: 2 - the run cannot be judged (too few samples, a busy generator); the p95 is not compared and the owner of the test or environment is told.
        feedback: Correct - blaming the build for a measurement problem sends the wrong person to the wrong place.
      - id: one
        text: 1 - 82 ms is above 64 ms, so the build is slower.
        feedback: The number comes from a run that measured the test machine as much as the build; a verdict from it is not reliable.
      - id: zero
        text: 0 - a run with so few samples cannot fail anything.
        feedback: Passing a run that cannot be judged hides the hole; the gate should say it could not tell.
      - id: retry
        text: Silently re-run until the p95 comes out below 64 ms.
        feedback: Re-running until a number looks good is not a measurement. A retry is fine, but both results must be kept and the rule fixed in advance.
    correct: [two]
    hints:
      - Who should look at this failure - the author of the commit, or the owner of the test?
    solution: |
      Exit 2: invalid run. Do not compare it; tell whoever owns the test environment.

  - id: pci-errors-fast
    type: mcq
    concept: perf-ci-gate
    skill: analysis
    title: The build with the better p95
    prompt: |
      A candidate build has p95 = 61 ms against a baseline median of 64 ms, and 25 of its 127 payment creations returned HTTP
      500. The gate reads only p95. What does it do, and what is the fix?
    options:
      - id: pass
        text: It passes the build, because failed requests are answered quickly; add an error-rate limit (here 1 %) as a separate check that returns exit 1.
        feedback: Correct - the error rate is a separate signal and needs its own limit.
      - id: fail
        text: It fails the build, because anything above the baseline minimum is a regression.
        feedback: 61 ms is below the baseline median; a p95-only gate has nothing to complain about.
      - id: p99
        text: It passes, and the fix is to gate on p99 instead.
        feedback: Failed requests are fast at every percentile; p99 would pass too.
      - id: ignore
        text: It passes, and that is fine because errors are the functional tests' job.
        feedback: Errors under load (timeouts, 500s, pool exhaustion) often appear only under load; a load test gate should check them.
    correct: [pass]
    hints:
      - How long does a request that fails immediately take?
    solution: |
      The p95-only gate passes it. Add an error-rate check; a build that fails 20 % of its requests should return exit 1.

  - id: pci-p99-samples
    type: mcq
    concept: perf-ci-gate
    skill: application
    title: A p99 gate on a short run
    prompt: |
      A short nightly run makes about 130 requests. A colleague wants the gate to fail when p99 grows by more than 10 %.
      What is the best response?
    options:
      - id: few
        text: With about 130 samples the top 1 % is one or two requests, so the p99 is noise - on the captured runs its tolerance was 34 %. Gate on p95 (or p50), chart the p99, and make the run longer if the tail matters.
        feedback: Correct - a percentile needs enough samples above it to mean something.
      - id: fine
        text: Good idea; p99 is closer to what the slowest users feel, so it is the best gate.
        feedback: It is closer to the tail - and decided by one or two requests here.
      - id: lower
        text: Use p99.9 instead; it is even closer to the tail.
        feedback: With 130 samples p99.9 is the single slowest request.
      - id: mean
        text: Use the mean of the slowest 10 requests.
        feedback: That is a different statistic with the same small-sample problem.
    correct: [few]
    hints:
      - How many requests are in the slowest 1 % of 130?
    solution: |
      The slowest 1 % of 130 requests is one or two requests; a p99 gate would flap. Gate on a steadier metric or lengthen the run.

  - id: pci-where
    type: mcq
    concept: perf-ci-placement
    skill: application
    title: Which test on which trigger
    prompt: |
      SandPay has a 25-minute load test and a shared hosted runner. Which plan is the best fit?
    options:
      - id: tiers
        text: A 2-minute smoke with loose limits on every pull request; the 25-minute test nightly on a stable environment with the baseline gate; the long tests before release.
        feedback: Correct - each test runs where its question can be answered and where its cost is acceptable.
      - id: every
        text: Run the 25-minute test on every pull request, so that no regression is ever merged.
        feedback: It will be skipped, cancelled or made optional - and on a shared runner it cannot see a 5 % change anyway.
      - id: release
        text: Run it only before release.
        feedback: Regressions would be found a month after the commit that caused them.
      - id: never
        text: Do not run load tests in CI; run them by hand when someone asks.
        feedback: Hand-run tests are the ones that are not run when the deadline is near.
    correct: [tiers]
    hints:
      - Which question can a short run on a noisy runner answer?
    solution: |
      A short smoke on pull requests, the full test nightly, the long tests before release.

  - id: pci-continue
    type: mcq
    concept: perf-ci-placement
    skill: recognition
    title: What continue-on-error does to a gate
    prompt: |
      A load-test step has `continue-on-error: true` "until the job is stable". GitHub's documentation says it "Prevents a
      job from failing when a step fails". What is the effect on the gate?
    options:
      - id: cannot
        text: The step's failure no longer fails the job, so the gate cannot block anything; it is a report, and in practice nobody reads it.
        feedback: Correct - if the gate must stay in place while it is tuned, run it as a separate non-required job or workflow, not by turning off failure.
      - id: nothing
        text: Nothing - the job still fails when the exit code is non-zero.
        feedback: The point of the setting is that the job passes when the step fails.
      - id: retry
        text: It retries the step once.
        feedback: That is a different feature; continue-on-error does not retry.
      - id: faster
        text: It makes the step run faster because failures are not reported.
        feedback: It does not change the run time.
    correct: [cannot]
    hints:
      - What does the job report if the step exits with 1?
    solution: |
      The job passes when the step fails, so the gate cannot block anything.

  - id: pci-schedule-hour
    type: mcq
    concept: perf-ci-placement
    skill: recognition
    title: A nightly at midnight on the dot
    prompt: |
      A nightly performance workflow uses `cron: '0 0 * * *'`. What does the GitHub documentation say about this choice?
    options:
      - id: hour
        text: High load times include the start of every hour, so scheduled runs may be delayed and some queued jobs may be dropped; schedule at a different time of the hour, for example minute 17.
        feedback: Correct - and scheduled workflows run only on the default branch.
      - id: fine
        text: Nothing - midnight is the best time because nobody is working.
        feedback: The documentation warns about the start of every hour regardless of the time of day.
      - id: utc
        text: Cron times are local time, so midnight is the quietest time on the runner.
        feedback: The documentation does not make that claim; the point is the load at the start of the hour.
      - id: never
        text: Scheduled workflows cannot start a load test.
        feedback: They can; the concern is delay and dropped jobs, not capability.
    correct: [hour]
    hints:
      - Which part of the cron expression does the documentation warn about?
    solution: |
      Avoid minute 0: scheduled runs can be delayed at the start of every hour; use a different minute.

  - id: pci-drift
    type: mcq
    concept: perf-ci-gate
    skill: analysis
    title: A slow slide that never fails
    prompt: |
      In a simulation on the captured baseline, every passing run was recorded and each run was 1 % slower than the last. After
      60 runs the p95 had reached about 116 ms against an original 64 ms, and the gate had never failed. Why, and what
      stops it?
    options:
      - id: rolling
        text: Each run is compared with the median of the last ten passing runs, which has moved with the drift, and the MAD grows as the window fills with different values; an absolute budget and a pinned baseline (the last release) do not move and stop it.
        feedback: Correct - in the simulation a budget 15 % above the original (74 ms) would have stopped it at run 15.
      - id: bug
        text: There is a bug in the median calculation.
        feedback: The calculation is right; the design lets the baseline follow the drift.
      - id: floor
        text: The 5 % floor is too high; set it to zero.
        feedback: A zero floor would make the gate hair-trigger on quiet baselines and would still follow the drift.
      - id: window
        text: A window of 100 runs fixes it.
        feedback: A longer window slows the drift's effect on the median but does not stop a rolling baseline from following it.
    correct: [rolling]
    hints:
      - What does the baseline contain after twenty slightly slower runs?
    solution: |
      A rolling baseline made of passing runs follows slow drift. Add an absolute budget and compare with a pinned baseline.

  - id: pci-order-pipeline
    type: order
    concept: perf-ci-gate
    skill: application
    title: The gate, in order
    prompt: Put the steps a performance gate takes for one run in a sensible order.
    items:
      - id: load
        text: Read the run summary and the history (a broken history stops the job)
      - id: valid
        text: Check the run can be judged (samples, generator CPU, required fields) - exit 2 if not
      - id: errors
        text: Check the error rate against its limit
      - id: budget
        text: Check p95 against the absolute budget
      - id: compare
        text: Compare p95 with the baseline median and tolerance (when there is enough history)
      - id: exit
        text: Return 1 if any limit broke, otherwise 0
      - id: record
        text: Record the run in the history only if it passed and recording was requested
    hints:
      - Trust the measurement before you judge the build, and judge before you remember.
    solution: |
      Load, validity, errors, budget, baseline comparison, exit code, then record only a passing run.

  - id: pci-debug-record
    type: debug
    concept: perf-ci-gate
    skill: analysis
    title: A gate that teaches the baseline to accept failures
    prompt: |
      This gate returns 1 for a regression. After a week of failing nights it starts to pass. Which line is the defect?
    language: python
    code: |
      def gate(run, history_path):
          history = load_history(history_path)
          save_run(history_path, run)
          base = baseline(history)
          if base and compare(base, run["p95_ms"])["status"] == "regression":
              return 1
          return 0
    correctLines: [3]
    lineNotes:
      - line: 2
        note: Loading the history is right, and a damaged file should raise here rather than return an empty list.
      - line: 5
        note: A comparison against the median of the last runs is the right idea; the defect is not in the comparison.
      - line: 6
        note: Returning 1 for a regression is correct.
    hints:
      - When is the run appended to the file, compared with when it is judged?
    solution: |
      Line 3 saves the run before it is judged, so failing runs enter the history and widen the baseline for the next night.
      Judge first, then call `save_run` only when the result is 0.

  - id: pci-short-gate
    type: short
    concept: perf-ci-gate
    skill: analysis
    title: Why not just fail on any slower run?
    prompt: |
      A colleague says "keep it simple: fail the build whenever p95 is above yesterday's". Give two problems and say what
      you would do instead.
    modelAnswer: |
      Runs of an unchanged build differ - on the captured data the p95 of identical runs ranged from 60 to 68 ms - so about
      half of all runs would be "above yesterday's" and the gate would fail at random, until somebody sets
      continue-on-error. Yesterday's single run is also a poor baseline: one slow or lucky run decides today's verdict, and a
      failing run would become tomorrow's baseline. It also ignores things p95 cannot see - errors, too few samples, a busy
      load generator. Instead I would build a baseline of the median of the last ten passing runs, take a tolerance from the
      MAD with a floor, add an absolute budget and an error-rate limit, return a separate code for runs that cannot be judged,
      and record only passing runs.
    rubric:
      - Says unchanged builds differ so the rule fails at random.
      - Says one previous run is a poor baseline, or that failing runs would contaminate it.
      - Mentions what p95 cannot see (errors, sample count, generator health).
      - Proposes a median baseline with a tolerance from the spread, plus a budget.
    hints:
      - What would happen on a day when nothing changed?
    solution: |
      Noise makes it flap; one run is a poor baseline. Use a median baseline with a measured tolerance, errors, a budget and exit 2.

  - id: pci-testdesign-gate
    type: testdesign
    concept: perf-ci-gate
    skill: application
    title: Test the gate before it blocks a release
    prompt: |
      A performance gate will soon fail release builds. Design test cases for the gate itself.
    modelAnswer: |
      Preconditions: hand-written run summaries and a history file in a temporary folder, plus captured real summaries.

      1. **Pass** - a run inside the tolerance with enough history. Expected: exit 0, no reasons. Evidence: the exit code and output.
      2. **Regression** - p95 clearly above median plus tolerance. Expected: exit 1 and a reason with the percentage and the tolerance.
      3. **Boundary** - a change exactly at the tolerance and p95 exactly at the budget. Expected: the documented behaviour on each side.
      4. **Errors with a fine p95** - 20 % errors, p95 below the baseline. Expected: exit 1 with an error-rate reason only.
      5. **Invalid runs** - too few samples, generator CPU above the limit, missing p95. Expected: exit 2, the baseline is not consulted.
      6. **Not enough history** - fewer than five runs. Expected: exit 0 with "building baseline", while the budget still fails an over-budget run.
      7. **Damaged history file** - invalid JSON, or a JSON object not a list. Expected: an error, the file untouched, no pass.
      8. **Unreadable run file** - missing or truncated. Expected: exit 2.
      9. **Recording** - with `--record`, a passing run is appended; a failing and an invalid run are not; without `--record` nothing is written.
      10. **Atomic save** - the history file after a save has no temporary file next to it.
    rubric:
      - Each case has preconditions, input, expected result and evidence.
      - Covers pass, regression, a boundary and an error rate with a fine p95.
      - Covers invalid runs returning a different code from a regression.
      - Covers a damaged history and an unreadable run failing closed.
      - Covers what is and is not recorded into the history.
    hints:
      - Which inputs would make a broken gate pass silently?
    solution: |
      Pass, regression, boundaries, errors with a good p95, invalid runs, little history, damaged inputs and recording rules.

  - id: pci-interview-ci
    type: interview
    concept: perf-ci-placement
    skill: analysis
    title: 'Interview: a performance test the team ignores'
    prompt: |
      "Our nightly performance test fails about every third night and nobody trusts it any more. How would you fix it
      without just turning it off?"
    modelAnswer: |
      First I would find out why it fails, not assume it is flaky. I would collect the results of a few weeks of runs and
      sort the failures: real regressions, noise, and runs where the measurement itself was poor - too few samples, a busy
      load generator, a shared environment. For the noise I would stop using a fixed percentage against the last run and
      compare with the median of the last ten passing runs, with a tolerance taken from their spread (MAD) and a floor, so
      the gate is quiet when nothing changed. I would add an error-rate limit and an absolute budget from the SLO, because
      a p95 comparison misses a build that fails requests and cannot see slow drift. Runs that cannot be judged would
      return a different exit code and go to whoever owns the environment, not to the author of the last commit. I would
      record only passing runs in the history, upload the results as an artifact when the job fails, give the job a timeout,
      a concurrency group and a schedule off the hour, and move anything long off the pull requests in favour of a short
      smoke. Finally I would run the new gate in report-only mode for a while, then switch it on and review the failures after a month.
    rubric:
      - Starts by classifying the failures with data rather than disabling the test.
      - Replaces a fixed threshold with a baseline and a tolerance from the measured spread.
      - Adds an error-rate limit and a budget, and mentions drift.
      - Separates "cannot be judged" from "regression" and records only passing runs.
      - Mentions workflow hygiene (timeout, evidence, concurrency, schedule) and where tests run.
    followUps:
      - What would you do about a team that wants it to block every pull request?
      - How would you tell a real 5 % regression from noise?
      - What do you do when the environment is shared with other teams?
    hints:
      - Start with what the failures actually were.
    solution: |
      Classify the failures; use a median and MAD baseline, errors and a budget; add exit 2 and record only passing runs; fix
      the workflow's hygiene and the placement of tests.

  - id: pci-baseline-code
    type: coding
    concept: perf-ci-baseline
    skill: application
    title: A baseline store and a comparison with a noise tolerance
    prompt: |
      Implement `load_history`, `save_run`, `baseline`, `tolerance` and `compare` in `exercises/analysis/pci_baseline.py`.
      The tests use hand-made values, temporary files and the run summaries of real Locust runs captured by
      `support/pci_capture.py`.
    project: perf
    files: [exercises/analysis/pci_baseline.py]
    test: tests/analysis/test_pci_baseline.py
    command: .venv/bin/python -m pytest tests/analysis/test_pci_baseline.py
    modelAnswer: |
      See "The baseline store and the comparison in Python". Key points: a missing file is an empty history but a damaged one
      raises; `save_run` appends, keeps the newest runs and writes through a temporary file and `os.replace`; the baseline is
      the median and MAD of the last runs that have the metric, or `None` below three; the tolerance is
      `max(floor, k x scaled MAD / median)` with the scale 0.6745; `compare` is strict on both sides.
    rubric:
      - Every test in tests/analysis/test_pci_baseline.py passes.
      - A damaged history file raises ValueError and is never overwritten.
      - The baseline uses the median and MAD, not the mean.
      - The tolerance has a floor, and a change exactly at the tolerance is within noise.
    hints:
      - '`statistics.median` does the sorting; the MAD is the median of `abs(v - median)`.'
      - Write the temporary file next to the real one so `os.replace` stays on one filesystem.
      - Compare with `>` and `<`, not `>=` and `<=`.
    solution: |
      Median and MAD of the last runs, a tolerance with a floor, an atomic save, and a loader that fails loudly.

  - id: pci-gate-code
    type: coding
    concept: perf-ci-gate
    skill: application
    title: A gate with three exit codes
    prompt: |
      Implement `validity_problems`, `evaluate` and `main` in `exercises/analysis/pci_gate.py` (solve `pci_baseline` first;
      the gate imports it). The tests use hand-made summaries, real captured summaries, temporary files, and one fresh
      Locust run of a build that fails most payment creations (a few seconds; Locust is in the project's virtual environment).
    project: perf
    files: [exercises/analysis/pci_gate.py]
    test: tests/analysis/test_pci_gate.py
    command: .venv/bin/python -m pytest tests/analysis/test_pci_gate.py
    modelAnswer: |
      See "The gate and its exit codes in Python". Key points: validity is checked first and returns 2 without any comparison;
      the failure reasons are collected in the order error rate, budget, baseline regression and give 1; fewer than five runs of
      history skips the comparison but not the error and budget checks; `main` fails closed on an unreadable run file and records
      the run only when the code is 0 and `--record` was given.
    rubric:
      - Every test in tests/analysis/test_pci_gate.py passes.
      - An invalid run returns 2 and is not compared with the baseline.
      - A failing build with a good p95 is caught by the error-rate check.
      - Only a passing run is recorded, and only with --record.
    hints:
      - Return early from `evaluate` when `validity_problems` is not empty.
      - Format the percentages with `f"{x:.1%}"`.
      - '`main` returns the code; the test calls it with `out=lines.append` to capture the output.'
    solution: |
      Validity first, then error rate, budget and baseline comparison, then the exit code, and record only a passing run.

  - id: pci-workflow-code
    type: coding
    concept: perf-ci-placement
    skill: application
    title: A linter for performance jobs in a workflow
    prompt: |
      Implement `triggers`, `perf_jobs` and `lint` in `exercises/analysis/pci_workflow.py`. The workflow is a dict; the tests
      include the repository's own `.github/workflows/pages.yml` converted to JSON.
    project: perf
    files: [exercises/analysis/pci_workflow.py]
    test: tests/analysis/test_pci_workflow.py
    command: .venv/bin/python -m pytest tests/analysis/test_pci_workflow.py
    modelAnswer: |
      See "Linting a workflow in Python". Key points: the `on` key can be `"on"`, `True` or `"true"` and its value a string, a list or
      a mapping; a performance job is one with a `run` step naming a tool; each rule is one condition on the job or workflow;
      the findings are sorted by `(job, rule)`.
    rubric:
      - Every test in tests/analysis/test_pci_workflow.py passes.
      - Handles every spelling of the on key and every shape of its value.
      - Finds performance jobs from the run steps, not from job names.
      - Reports the six rules with the stated conditions and sorts the findings.
    hints:
      - Start with `triggers` and `perf_jobs`; the rules are short conditions after them.
      - A boolean is an int in Python - check for `bool` before treating `timeout-minutes` as a number.
      - '`schedule` lives inside the `on` mapping, not at the top of the workflow.'
    solution: |
      Normalise the triggers, find the performance jobs, then add one finding per broken rule.

placement:
  - id: pci-place-baseline
    type: mcq
    concept: perf-ci-baseline
    skill: application
    title: One run against one run
    prompt: A gate compares tonight's p95 (67 ms) with last night's single run (62 ms) and fails the build at +5 %. The previous five identical-build runs ranged from 60 to 68 ms. What is wrong?
    options:
      - id: noise
        text: The rule ignores the run-to-run noise; a baseline of recent runs with a tolerance from their spread would not fail for a 5 ms difference that unchanged builds produce.
        feedback: Correct - 62 to 67 is inside the range of unchanged builds.
      - id: fine
        text: Nothing - 8 % is a clear regression.
        feedback: Unchanged builds range from 60 to 68 ms, so 67 ms is not evidence.
      - id: lower
        text: The threshold is too loose; use 1 %.
        feedback: That makes the gate flap even more.
    correct: [noise]
    hints:
      - How much does p95 move when nothing changes?
    solution: |
      Compare with a baseline of several runs and a tolerance from their spread.

  - id: pci-place-gate
    type: mcq
    concept: perf-ci-gate
    skill: application
    title: Few samples and a busy generator
    prompt: A run made 70 requests (usually about 130) while the CI machine's CPU peaked at 92 %. Its p95 looks 20 % worse than the baseline. What should a good gate do?
    options:
      - id: invalid
        text: Return a separate "cannot be judged" code without comparing, and tell whoever owns the test environment.
        feedback: Correct - the measurement is not trustworthy, so the verdict is withheld.
      - id: fail
        text: Fail the build; 20 % is clearly a regression.
        feedback: The number comes from a run that mostly measured the generator and a handful of requests.
      - id: pass
        text: Pass it; with so few samples nothing can be proven.
        feedback: A silent pass hides the hole.
    correct: [invalid]
    hints:
      - Who should look at this failure?
    solution: |
      Exit 2, invalid run; do not compare it.

  - id: pci-place-workflow
    type: mcq
    concept: perf-ci-placement
    skill: application
    title: A load test in a pull request workflow
    prompt: 'A workflow runs a 35-minute Locust test on every pull request, with no timeout, `continue-on-error: true` on the load step, and no artifact upload. Which is the best first fix?'
    options:
      - id: move
        text: 'Replace it on pull requests with a short smoke and run the full test nightly; give every performance job a timeout, remove continue-on-error from the gate step and upload results with `if: always()`.'
        feedback: Correct - the workflow has several separate problems and each is a line you can check.
      - id: timeout
        text: Only add a timeout of 360 minutes.
        feedback: That is the documented default; it changes nothing.
      - id: keep
        text: Leave it; slow tests are the price of performance testing.
        feedback: A test that takes 35 minutes per pull request will be skipped or made optional.
    correct: [move]
    hints:
      - Count the separate problems in the description.
    solution: |
      Short smoke on pull requests, full test nightly, a timeout, a gate that can fail and evidence on failure.

recall:
  - id: pci-recall-baseline
    concept: perf-ci-baseline
    prompt: How does the lesson build a baseline and a tolerance?
    answer: Median and MAD of the last 10 passing runs' p95; tolerance = max(5 %, 3 x MAD/0.6745 / median). A run above median x (1 + tolerance) is a regression; exactly at the tolerance is noise.
  - id: pci-recall-flap
    concept: perf-ci-baseline
    prompt: Why does a fixed percentage on one run flap?
    answer: Identical builds differ run to run (p95 60-68 ms here, one slow start 82 ms), so a 5 % rule flags unchanged builds; measure the spread and compare against it.
  - id: pci-recall-codes
    concept: perf-ci-gate
    prompt: What are the three exit codes of the gate?
    answer: 0 pass (including building the baseline), 1 the build is slower or failing (error rate, budget, baseline regression), 2 the run cannot be judged (too few samples, busy generator, missing p95, unreadable run file).
  - id: pci-recall-errors
    concept: perf-ci-gate
    prompt: Why check errors separately from p95?
    answer: Failed requests are fast, so a build that fails a fifth of its requests can have a better p95 (61 ms against 64 ms here). The error rate needs its own limit.
  - id: pci-recall-record
    concept: perf-ci-gate
    prompt: What goes into the history, and what defence do you need against drift?
    answer: Only runs that passed (exit 0), recorded only with --record on the main branch. A rolling baseline follows slow drift, so keep an absolute budget and a pinned baseline such as the last release.
  - id: pci-recall-placement
    concept: perf-ci-placement
    prompt: Which tests run on a pull request, nightly and before release?
    answer: A short smoke with loose limits on pull requests; the full test with the baseline gate nightly on a stable environment; the full test plus soak, spike and stress before release.
  - id: pci-recall-workflow
    concept: perf-ci-placement
    prompt: Which workflow properties does the linter check for a performance job?
    answer: timeout-minutes set (default 360), a short budget on pull_request, no continue-on-error on the gate, an upload-artifact step with if always() or failure(), a concurrency group, and a schedule not at minute 0.

