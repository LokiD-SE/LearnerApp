id: performance-testing-types
title: Types of performance testing
subject: performance-testing
module: perf-fundamentals
level: beginner
status: published
estimatedMinutes: 120
summary: Load, stress, spike, soak (endurance), scalability, capacity, concurrency and breakpoint tests - the question each one answers, the load profile that answers it and what a pass looks like. Definitions come from the ISTQB Performance Testing syllabus; every run shown is a real Locust run against the local SandPay practice API, which sheds load with 503 once more than 8 requests are in the system.
tags:
  [
    performance testing,
    load testing,
    stress testing,
    spike testing,
    soak testing,
    endurance testing,
    scalability testing,
    capacity testing,
    concurrency testing,
    breakpoint testing,
    smoke test,
    volume testing,
    load profile,
    ramp-up,
    steady state,
    LoadTestShape,
    Locust,
    ISTQB CT-PT,
    "503",
    load shedding,
  ]

environment: |
  - **Runtime:** Python 3.12.3 and Locust 2.47.0 in `practice/perf/.venv`; pytest 9.2.0 for the exercises. Every
    Locust run shown was made on Linux on 19 November 2026 against `practice/perf/support/sandpay_target.py`
    (the local SandPay practice API) configured with `latency_ms=50, capacity=4, queue_limit=4`: it serves 4
    requests at once, queues 4 more and answers `503` with `Retry-After: 1` to anything beyond that.
    **Request counts and timings depend on the machine**; the pattern (no failures up to 8 users, failures
    from 11) does not, because it follows from the target's configuration.
  - **Synthetic data:** SandPay is a fictional payments company. Merchants `merchant-1` .. `merchant-50` and
    their payments exist only in the practice API.
  - **Definitions:** ISTQB [Certified Tester Foundation Level Specialist - Performance Testing
    syllabus](https://istqb.org/certifications/certified-tester-performance-testing-ct-pt/), version 2018
    (downloaded 18 November 2026): section 1.2 "Types of Performance Testing" (performance, load, stress,
    scalability, spike, endurance, concurrency and capacity testing) and section 4.2.4 "Creating Load
    Profiles". Quotations are from that text.
  - **Provider documentation (k6 by Grafana Labs, a different tool - quoted for its names and its cheat sheet,
    not run here):** [Load test types](https://grafana.com/docs/k6/latest/testing-guides/test-types/), as
    documented on 18 November 2026 - the source of the names "smoke", "average-load" and "breakpoint" test,
    which the ISTQB syllabus does not use.
  - **Locust:** [Configuration - Custom load
    shapes](https://docs.locust.io/en/stable/configuration.html) (`LoadTestShape`, `tick()`) and [Running
    without the web UI](https://docs.locust.io/en/stable/running-without-web-ui.html) (`--headless`, `-u`,
    `-r`, `-t`, exit codes), as documented on 18 November 2026. That the percentiles in
    `--csv-full-history` rows cover roughly the last 10 seconds is read from Locust 2.47.0's source
    (`stats.py`, `get_current_response_time_percentile`, `CURRENT_RESPONSE_TIME_PERCENTILE_WINDOW = 10`).
  - **Not repeated here:** percentiles and why averages mislead - [Performance metrics and
    percentiles](#/lesson/performance-metrics-and-percentiles); how many users you need -
    [Little's law and workload models](#/lesson/littles-law-and-workload-models).

prerequisites:
  - client-server-request-flow
  - status-codes-and-errors

concepts:
  - id: perf-types-questions
    name: Each test type answers one question
    summary: Performance testing is the umbrella; each type is defined by the question it answers. Load - does it meet its requirements at the anticipated load? Stress - what happens at or beyond the limits, or with fewer resources? Spike - does it survive a sudden burst and return to a steady state? Endurance (soak) - is it stable over a long period (leaks, pools)? Scalability - can it grow without breaking its requirements? Capacity - how many users or transactions can it support while meeting its objectives? Concurrency - what happens when the same action happens at once? Smoke and breakpoint tests (k6 names) check the script and find the upper limit. Names vary between sources, so agree the question, not the label.
  - id: perf-types-load-profiles
    name: Load profiles - ramps, steps, spikes and holds
    summary: A load profile says how many virtual users run which operational profiles over time. ISTQB lists ramp-ups, ramp-downs, steps and predefined distributions. The type of test is mostly the shape of its profile - a hold at the expected load (load), a hold above it (stress), a short burst with calm before and after (spike), hours at a normal load (soak), a staircase that keeps rising (breakpoint). In Locust a LoadTestShape returns (users, spawn rate) from tick() about once a second, or None to stop.
  - id: perf-types-pass-criteria
    name: Pass criteria and reading the result
    summary: Each type passes on a different criterion - SLO met at the expected load (load), graceful degradation and recovery (stress), the burst absorbed or shed cleanly and a return to steady state (spike), flat response times and resource use over hours (soak), the first load that breaks the SLO plus the limiting resource (breakpoint and capacity). Read results per step or per phase, never as one average over the whole run, and treat fast clean errors such as 503 with Retry-After as a deliberate behaviour to verify, not just as failures.

objectives:
  - Name the question each performance test type answers, using the ISTQB definitions, and map the k6 names (smoke, average-load, breakpoint) onto them.
  - Choose a test type for a stated risk and justify it by the question it answers.
  - Design the load profile for each type as stages of users over time, and implement it as a Locust LoadTestShape.
  - Write pass criteria that fit the type, including recovery after a spike and stability over a soak.
  - Run a stepped stress test, split its results per step and find the first step that breaks the criteria.

sections:
  - id: intuition
    kind: intuition
    concepts: [perf-types-questions, perf-types-load-profiles]
    title: The idea in plain language
    body: |
      Think of the SandPay checkout as a bridge. Before you open it you want to know different things, and each
      needs a different experiment:

      - Will it carry **normal rush-hour traffic** comfortably? Drive the expected number of cars over it and
        measure. That is a **load test**.
      - What happens with **more cars than it was built for** - does it sag, crack, or close a lane? That is a
        **stress test**.
      - What if **a stadium empties onto it all at once**, and does traffic flow normally afterwards? That is a
        **spike test**.
      - Does it stay sound after **weeks of normal traffic**, or do small cracks grow? That is a **soak**
        (endurance) test.
      - **How many cars** can it take before it no longer meets its rules? That is a **capacity** or
        **breakpoint** test.

      Same bridge, same cars - but different questions, so different traffic patterns over time and different
      definitions of "passed". A performance tester's first job is to ask which question matters for this
      release, and only then to pick the test.

      Payments make the questions concrete: a merchant's flash sale is a spike, Black Friday is a long stress
      period, the nightly settlement report adds load on top of normal traffic, and a memory leak in the
      payment service only shows after hours - a soak problem that no 10-minute test will find.

  - id: what
    kind: what
    concepts: [perf-types-questions]
    title: The types, as the ISTQB syllabus defines them
    body: |
      The ISTQB Performance Testing syllabus (CT-PT, version 2018, section 1.2) defines an umbrella and seven
      types. The question column is the short form to remember.

      | Type | ISTQB definition (quoted) | The question it answers |
      | --- | --- | --- |
      | **Performance testing** | "an umbrella term including any kind of testing focused on performance (responsiveness) of the system or component under different volumes of load" | - |
      | **Load** | "the ability of a system to handle increasing levels of anticipated realistic loads resulting from transaction requests generated by controlled numbers of concurrent users or processes" | Does it meet its requirements at the load we expect? |
      | **Stress** | "the ability of a system or component to handle peak loads that are at or beyond the limits of its anticipated or specified workloads" - and also "reduced availability of resources such as accessible computing capacity, available bandwidth, and memory" | What happens at and beyond the limits, or with less hardware? |
      | **Scalability** | "the ability of a system to meet future efficiency requirements which may be beyond those currently required" - for example "more users, larger amounts of data stored" | Can it grow without breaking its requirements? |
      | **Spike** | "the ability of a system to respond correctly to sudden bursts of peak loads and return afterwards to a steady state" | Does it survive a sudden burst, and recover? |
      | **Endurance** | "the stability of the system over a time frame specific to the system's operational context" - no "resource capacity problems (e.g., memory leaks, database connections, thread pools)" | Is it stable over hours or days? |
      | **Concurrency** | "the impact of situations where specific actions occur simultaneously (e.g., when large numbers of users log in at the same time)" | What breaks when the same thing happens at once? |
      | **Capacity** | "how many users and/or transactions a given system will support and still meet the stated performance objectives" | How much can it take while still meeting its objectives? |

      **Other names you will meet.** The k6 documentation (Grafana Labs - a tool vendor, not a standard) uses
      **smoke** tests ("validate that your script works and that the system performs adequately under minimal
      load"), **average-load** tests (the ISTQB load test), **soak** tests (endurance) and **breakpoint** tests
      ("gradually increase load to identify the capacity limits of the system"). It also warns that "no
      consensus even exists about the names of these test types". **Volume testing** is a common name for
      testing with large amounts of *data* rather than many users; the ISTQB syllabus covers that inside
      scalability ("larger amounts of data stored") and capacity ("data volumes resulting from the
      transactions") rather than as a separate type.

      **Load profile** (section 4.2.4): "the activity which a component or system being tested may experience in
      production. It consists of a designated number of instances that will perform the actions of predefined
      operational profiles over a specified time period." Those instances are usually **virtual users**.

  - id: why
    kind: why
    concepts: [perf-types-questions, perf-types-pass-criteria]
    title: Why the type matters before the tool
    body: |
      "Run a performance test" is not a test objective. Without a type you cannot say how much load to apply,
      for how long, or what counts as a pass - so the result is a pile of numbers nobody can act on.

      Three failures come from skipping this step:

      1. **The wrong question gets answered.** A 15-minute load test passes; the release goes out; the payment
         service runs out of database connections after six hours. The risk was a *leak*, which only an
         endurance test answers.
      2. **The right result is read the wrong way.** A stress test that ends with 40% errors may be a pass if the
         errors are fast, clean `503` responses that tell clients to retry and the system recovers when load
         drops - that is graceful degradation. The same 40% in a load test at the expected traffic is a clear
         fail.
      3. **Nobody agrees on the words.** One team's "stress test" is another's "load test" (k6: "A stress test
         for one application is an average-load test for another"). Writing down the question, the profile and
         the pass criteria avoids the argument.

      In interviews, "what is the difference between load and stress testing?" is one of the most common
      performance questions. The good answer is not two definitions but two questions, two profiles and two
      pass criteria.

  - id: internals
    kind: internals
    concepts: [perf-types-load-profiles]
    title: What changes between types - the profile
    body: |
      Most types use the same script (the same user journey) and differ only in the **load profile**: how many
      virtual users run, and how that changes over time. ISTQB section 4.2.4 lists the building blocks:

      - **Ramp-ups** - "Steadily increasing load (e.g., add one virtual user per minute)"
      - **Ramp-downs** - "Steadily decreasing load"
      - **Steps** - "Instantaneous changes in load (e.g., add 100 virtual users every five minutes)"
      - **Predefined distributions** - "volume mimics daily or seasonal business cycles"

      Put together, with E = the expected (specified) peak number of users:

      | Type | Typical profile | Duration (k6 cheat sheet, as guidance) |
      | --- | --- | --- |
      | smoke | a handful of users, constant | "seconds or minutes" |
      | load | ramp up to E, hold, ramp down | "5-60 minutes" |
      | stress | ramp up above E, hold, ramp down | "5-60 minutes" |
      | spike | E or less, a sudden jump far above E, back to E or less | "a few minutes" |
      | soak / endurance | ramp to about E, hold for hours | "hours" |
      | breakpoint / capacity | steps that keep rising until a criterion breaks | "as long as necessary" |

      The k6 page adds advice worth keeping whatever tool you use: "Stick to simple load patterns ... ramp-up,
      plateau, ramp-down", and avoid "rollercoaster" profiles where load rises and falls several times, because
      they "make it hard to isolate issues".

      **Two quieter variants.** A *stress* test can also reduce resources instead of adding users - ISTQB:
      "reduced availability of resources such as accessible computing capacity, available bandwidth, and memory"
      (for example, run the same load with one of two service instances stopped). A *concurrency* test aims
      many users at the same action at the same moment, such as a payment retried by two workers at once - its
      profile is short and synchronised rather than long and smooth.

      **In Locust** a profile is a `LoadTestShape`. The documentation: "you define a tick() method that returns
      a tuple with the desired user count and spawn rate (or None to stop the test). Locust will call the tick()
      method approximately once per second." `get_run_time()` gives the seconds since the test started. The
      practice exercise keeps a profile as stages `(end_s, users, spawn_rate)` - the "time based stages" style
      from the Locust examples - and `users_at(stages, t)` turns it into what `tick()` needs.

  - id: when
    kind: when
    concepts: [perf-types-questions]
    title: Which test for which risk
    body: |
      Start from the risk, not the type:

      | Risk or question from the business | Test |
      | --- | --- |
      | "Will checkout meet its SLO on a normal busy day?" | load at the expected peak |
      | "We expect 3x traffic in the sale - what happens?" | stress (and a capacity estimate) |
      | "A marketing email goes to 2 million merchants at 10:00" | spike |
      | "The service is restarted only weekly - does it degrade?" | soak / endurance |
      | "How many merchants can one cluster serve?" | capacity / breakpoint |
      | "What if one of the two database replicas is down?" | stress with reduced resources |
      | "Two refunds for the same payment arrive at once" | concurrency (and a functional check) |
      | "Settlement data doubles next year" | scalability with larger data volumes |
      | "Did the new build break the script or the environment?" | smoke, before anything else |

      **What these tests do not replace.** They are not functional tests: a load test that only checks status
      codes can pass while every response has the wrong amount - validate the response content (see the
      Locust and JMeter lessons on assertions). They also do not replace production monitoring: a test
      environment is never identical to production, so results are evidence, not a guarantee - see
      [Test environments and test data](#/lesson/performance-test-environments-and-data).

      **Order of work** that keeps runs cheap: smoke (does the script work?), then load (do we meet the SLO?),
      then stress or spike (what happens beyond?), then soak (does it last?). The k6 page says the same:
      "Start with smoke tests, then progress to higher loads and longer durations."

  - id: visual
    kind: visual
    concepts: [perf-types-load-profiles]
    title: The profiles side by side
    body: |
      Users over time for four types against the same expected peak E = 100 users. Notice that only the shape
      changes - the script is the same.

      ```mermaid
      flowchart LR
        subgraph Load
          L1["ramp 0 to 100"] --> L2["hold 100 for 30 min"] --> L3["ramp down"]
        end
        subgraph Stress
          S1["ramp 0 to 150"] --> S2["hold 150 for 30 min"] --> S3["ramp down, watch recovery"]
        end
        subgraph Spike
          P1["hold 80"] --> P2["jump to 300 for 2 min"] --> P3["back to 80, watch recovery"]
        end
        subgraph Breakpoint
          B1["50"] --> B2["100"] --> B3["150"] --> B4["200 ... until the SLO breaks"]
        end
      ```

      A soak test looks like the load test with the hold stretched to hours; a smoke test is a flat line at a
      handful of users for a minute.

  - id: code-shape
    kind: code
    concepts: [perf-types-load-profiles]
    title: A profile as stages, and a Locust shape that follows it
    body: |
      From the practice exercise `fundamentals/types_profiles.py` (reference solution, docstrings shortened):

      ```python
      Stage = tuple[float, int, float]  # (end_s, users, spawn_rate)

      def users_at(stages: list[Stage], t: float) -> int | None:
          if t < 0:
              raise ValueError("t must be >= 0")
          for end_s, users, _ in stages:
              if t < end_s:
                  return users
          return None

      def spike(base: int, peak: int, before_s: float, spike_s: float, after_s: float) -> list[Stage]:
          if not 0 < base < peak:
              raise ValueError("need 0 < base < peak")
          if before_s <= 0 or spike_s <= 0 or after_s <= 0:
              raise ValueError("durations must be positive")
          burst = float(peak - base)  # reach the peak within one second: that is what makes it a spike
          return [(before_s, base, float(base)), (before_s + spike_s, peak, burst),
                  (before_s + spike_s + after_s, base, burst)]
      ```

      And a locustfile whose `LoadTestShape` follows any list of stages (the demo used for the runs below; the
      stages come in as JSON in an environment variable):

      ```python
      class StagesShape(LoadTestShape):
          stages = [tuple(s) for s in json.loads(os.environ["STAGES"])]

          def tick(self):
              users = users_at(self.stages, self.get_run_time())
              if users is None:
                  return None
              rate = next(r for end, u, r in self.stages if self.get_run_time() < end)
              return (users, rate)
      ```

      The user class is the same for every profile: each virtual user signs in once in `on_start` (and signs in
      again on its next turn if that sign-in was shed), then lists payments with `wait_time = constant(0)`, so
      every user keeps exactly one request in flight - and sends the next one as soon as the last one returns.

  - id: code-runs
    kind: code
    concepts: [perf-types-load-profiles, perf-types-pass-criteria]
    title: Real runs - a load profile and a spike against the same target
    body: |
      Both runs: the local practice API with `latency_ms=50, capacity=4, queue_limit=4`, Locust 2.47.0
      headless, results split per stage with `per_step()` from the stress exercise. Run on 19 November 2026.

      ```plaintext
      == load: stages [(1.0, 2, 4.0), (2.0, 3, 4.0), (8.0, 4, 4.0)]
         classify(as (duration, users), expected_users=8): load
         locust exit code 0
         users requests failures  error%
             2       34        0    0.0%
             3       56        0    0.0%
             4      438        0    0.0%
      == spike: stages [(9, 2, 2.0), (11, 16, 14.0), (20, 2, 14.0)]
         classify(as (duration, users), expected_users=8): spike
         locust exit code 1
         users requests failures  error%
             2      327        0    0.0%
            16     1912     1757   91.9%
             2      351       20    5.7%
      ```

      What to read from it:

      - **Load:** 4 users never exceed the target's 4 workers, so nothing even queues - 0 failures and exit code
        0 (Locust: "By default the locust process will give an exit code of 1 if there were any failed
        samples").
      - **Spike:** 16 users is twice the 8 requests the target will hold (4 serving + 4 queued). Everything
        beyond is answered `503` at once - and because a rejected user sends its next request immediately, the
        burst produced 1,912 requests in 2 seconds, 92% of them rejected. That flood is itself a finding: clients
        that retry a `503` without waiting (this script ignores `Retry-After`) multiply the load exactly when
        the system is full.
      - **After the burst:** all 20 failures of the after phase fell in its first second (the per-second history
        shows the cumulative failure count stuck at 1,777 from then on), and the request rate went back to the
        before-phase level - about 36 a second for 2 users. That is the spike test's real question - **did it
        return to a steady state?** - and here it did, within a second.

  - id: code-stress
    kind: code
    concepts: [perf-types-pass-criteria]
    title: A stepped stress test and its breaking point
    body: |
      The stress exercise's locustfile with `STEP_START=2 STEP_SIZE=3 STEP_SECONDS=3 STEP_COUNT=5`, so 2, 5, 8,
      11 and 14 users for 3 seconds each, against the same target, then `per_step()` and
      `breaking_point(steps, 0.01, 1000)` (more than 1% errors, or a p95 over 1000 ms). Run on 19 November 2026:

      ```plaintext
      exit code 1
      users requests failures  error%  p95 ms
          2      108        0    0.0%    55.0
          5      237        0    0.0%    93.0
          8      237        0    0.0%   100.0
         11     3032     2796   92.2%   100.0
         14     2623     2383   90.9%   100.0
      breaking point: StepResult(users=11, requests=3032, failures=2796, p95_ms=100.0)
      ```

      The same run's `stress_failures.csv` (Method, Name, Error, Occurrences, First Seen, Last Seen) - every
      failure was the target shedding load, none was a script error:

      ```plaintext
      Method,Name,Error,Occurrences,First Seen,Last Seen
      POST,/auth/token,HTTPError('503 Server Error: Service Unavailable for url: /auth/token'),52,2026-11-19T04:44:35Z,2026-11-19T04:44:38Z
      GET,/v1/payments,HTTPError('503 Server Error: Service Unavailable for url: /v1/payments'),5127,2026-11-19T04:44:35Z,2026-11-19T04:44:41Z
      ```

      52 + 5,127 = 5,179 = 2,796 + 2,383, the failures of the last two steps. Counts differ from run to run; the
      pattern (none up to 8 users, most requests rejected from 11) does not.

      Three things to read:

      - **Throughput stopped growing at 5 users.** 5 and 8 users both completed about 237 requests in 3
        seconds: 4 workers at 50 ms each is about 80 requests a second, whatever the user count. Adding users
        beyond that only adds waiting.
      - **The request count exploded at 11 users** - not because the target served more (successes stayed at
        about 236 per step) but because rejections return at once and a user with no think time sends the next
        request immediately. Closed-loop users with zero wait time turn shedding into a flood; real clients
        should back off (`Retry-After: 1`).
      - **The response time of the successes barely moved** - p95 stayed at about 100 ms (two 50 ms service
        times: one waiting in the queue, one being served) - while the error rate jumped from 0 to 92%.
      This target protects its latency by rejecting work it cannot queue. A system without a queue limit would
      show the opposite: no errors for a while, but response times growing with every step as the queue grows.
      Either behaviour can be acceptable; the stress test's job is to show which one you have and whether it
      matches what was designed.

      Between 8 and 11 users the limit was crossed - so the capacity, by the criterion "no more than 1%
      errors", lies somewhere between 8 and 11 concurrent requests. A breakpoint test would now step more
      finely in that range.

  - id: line-by-line
    kind: line-by-line
    concepts: [perf-types-load-profiles, perf-types-pass-criteria]
    title: The stress test, line by line
    body: |
      ```python
      class StepShape(LoadTestShape):
          start = int(os.environ.get("STEP_START", "2"))
          size = int(os.environ.get("STEP_SIZE", "2"))
          seconds = float(os.environ.get("STEP_SECONDS", "10"))
          count = int(os.environ.get("STEP_COUNT", "5"))

          def tick(self):
              step = int(self.get_run_time() // self.seconds)
              if step >= self.count:
                  return None
              users = self.start + self.size * step
              return (users, users)  # spawn the whole step within a second
      ```

      - **Settings from the environment** - the same file runs a 15-second check in CI and a one-hour run by
        hand; only the numbers change.
      - **`step = run_time // seconds`** - integer division turns elapsed time into a step number, so the shape
        has no state to get wrong.
      - **`return None`** - the documented way to stop a shaped test. Without it the test runs until `-t` or
        Ctrl+C.
      - **`(users, users)`** - the spawn rate equals the step size, so each new step is reached within about a
        second and the step measures the new load rather than a slow ramp into it.

      ```python
      def per_step(rows):
          agg = [r for r in rows if r.get("Name") == "Aggregated"]
          ...
              end_req, end_fail = int(agg[j]["Total Request Count"]), int(agg[j]["Total Failure Count"])
              if users > 0:
                  ...
                  results.append(StepResult(users, end_req - prev_req, end_fail - prev_fail, ...))
              prev_req, prev_fail = end_req, end_fail
      ```

      - **Only `Aggregated` rows** - with `--csv-full-history`, Locust writes one row per request name per
        second plus an `Aggregated` row; counting both would double the numbers.
      - **Differences of cumulative counts** - `Total Request Count` grows over the whole test, so the work in
        one step is its last row minus the row before the step. Averaging over the whole run would blur the
        2-user and 14-user steps into one meaningless number.
      - **Consecutive rows, not a dictionary by user count** - a spike profile visits 2 users twice; grouping by
        user count would merge "before" and "after", which is exactly the comparison a spike test needs.
      - **p95 per step is approximate** - the percentiles in history rows cover about the last 10 seconds
        (Locust 2.47.0 source), so with 3-second steps they include earlier steps. For short steps, judge on
        the error rate; for latency, use steps much longer than 10 seconds.

  - id: steps
    kind: steps
    concepts: [perf-types-questions, perf-types-load-profiles, perf-types-pass-criteria]
    title: Planning a performance test, step by step
    body: |
      1. **Write the question** in one sentence, in business words: "Will refunds still complete within 2
         seconds for 95% of requests during the January sale (3x normal traffic)?"
      2. **Pick the type** that answers it (stress, here) and write it down with the question - this is what
         stops the naming argument later.
      3. **Define the expected load E** from production data or a forecast - see [Workload modelling from
         production data](#/lesson/workload-modelling-from-production).
      4. **Draw the profile** as stages: ramp, hold, steps or burst, with users and durations. Keep it simple.
      5. **Write the pass criteria** that fit the type (next section) - percentiles, error rates, recovery,
         resource trends - with numbers.
      6. **Smoke test first** with a few users for a minute: the script works, the data is valid, the
         environment answers.
      7. **Run, then read results per phase** - per step, before and after a spike, hour by hour in a soak.
      8. **Report against the question**, with evidence: the profile used, the per-phase table, the criterion
         that failed (if any) and the resource that limited throughput.

  - id: example
    kind: example
    concepts: [perf-types-questions, perf-types-pass-criteria]
    title: "Example: the SandPay flash-sale release"
    body: |
      SandPay's merchants run flash sales announced by email. Production data says checkout peaks at about 120
      concurrent payment requests on a normal day; the last flash sale reached 400 within a minute of the email.
      The release adds a new fraud check to every payment.

      The tester proposes three tests, each tied to a question:

      | Question | Type | Profile | Pass criteria |
      | --- | --- | --- | --- |
      | Does the fraud check keep normal days within the SLO? | load | ramp to 120 over 5 min, hold 30 min | p95 payment latency within the SLO; errors under 0.1%; no failed payment that should have succeeded |
      | Does a flash sale hurt everybody? | spike | 100, then 400 for 3 min, then 100 for 15 min | during the burst, excess work is rejected with 503 and Retry-After or queued within a stated time; within 2 minutes after the burst p95 and errors are back at the load-test level; no duplicate charges |
      | Does the new check leak? | soak | 100 for 8 hours | p95 in the last hour within 10% of the first hour; memory and database connections flat |

      Before any of it: a smoke run with 2 users for a minute, to prove the script, the test merchants and the
      environment work.

      What the tester checks besides the numbers: the payments created are real and correct (amounts, one
      payment per idempotency key - see [Idempotency keys](#/lesson/idempotency-keys)), the load generator itself
      was not the bottleneck (its CPU), and the environment matched what was agreed. A breakpoint test is left
      out on purpose: nobody asked how far beyond 400 it goes, and it would cost a day of environment time.

  - id: tests
    kind: tests
    concepts: [perf-types-pass-criteria]
    title: Checks that make each type a real test
    body: |
      | Type | Check | Expected result | Evidence |
      | --- | --- | --- | --- |
      | all | the script and data work at low load (smoke) | every request succeeds, every step of the journey runs | per-request table with zero failures |
      | load | percentile latency at the hold | within the SLO | per-phase percentiles, not a whole-run average |
      | load | functional correctness under load | response content validated, not only the status code | assertion failures counted separately |
      | stress | behaviour above E | errors are fast and explicit (503 + Retry-After) or latency grows within a stated bound; no crashes, no wrong data | per-step table; error report by type |
      | stress / spike | recovery | after load drops, latency and errors return to the pre-stress level within a stated time | the "after" phase compared with the "before" phase |
      | soak | stability over time | percentiles and resource use (memory, connections, threads) flat across the hours | hour-by-hour table and server metrics |
      | breakpoint / capacity | the limit | the first step that breaks the criterion, and the resource that limits it | per-step table; server metrics at that step |
      | concurrency | same action at once | no duplicates, no lost updates, no deadlocks | database state after the run |

      **Negative checks on the test itself:** the load generator's CPU stayed below its own limit (otherwise
      you measured the generator), the error report is read (a "failure" may be a script bug such as a missing
      token), and the profile actually reached the planned users (compare `User Count` with the plan).

  - id: mistakes
    kind: mistakes
    concepts: [perf-types-questions, perf-types-load-profiles, perf-types-pass-criteria]
    title: Common mistakes and a debugging method
    body: |
      - **Calling every test a "load test".** Then nobody knows what was asked. Write the question.
      - **One number for the whole run.** An average over ramp, hold and ramp-down hides the hold. Read per
        phase or per step.
      - **A spike test without an "after" phase.** Surviving the burst is half the definition; "return
        afterwards to a steady state" is the other half.
      - **A soak test that is just long.** Without resource trends (memory, connections, threads) you cannot see
        the leak it is meant to find; latency often stays fine until the moment it falls over.
      - **Treating all errors as equal.** A fast `503` with `Retry-After` at 3x load can be the designed
        behaviour; a `500` with a stack trace, or a timeout after 30 seconds, is not.
      - **Stepping too fast to read.** If a step is shorter than the percentile window or the system's warm-up,
        its numbers mix with the previous step.
      - **A rollercoaster profile.** Load up and down several times makes it impossible to say which change
        caused what.
      - **Skipping the smoke test.** A wrong token in the script makes a "stress test" with 100% errors at
        every load.

      **Debugging method when a result looks wrong:**

      1. Check the **plan was executed**: users per step from the history file against the profile.
      2. Read the **error report** before the percentiles: which status codes and messages, from which
         requests?
      3. Separate **phases** and compare before / during / after.
      4. Check the **generator** (CPU, network) and then the **system's resources** at the moment things
         changed.
      5. Re-run the **smallest profile that shows the problem**, to confirm it is repeatable.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [perf-types-questions, perf-types-pass-criteria]
    title: Trade-offs and limits
    body: |
      - **Time and environment cost.** A soak test blocks an environment for hours; a breakpoint test may need
        an environment as large as production. Pick the types the risks justify, not all of them.
      - **Test environment versus production.** A capacity measured on a smaller environment does not scale
        linearly to production; say so in the report.
      - **Closed versus open load.** Virtual users that wait for each response (as here) slow down when the
        system slows down, which can hide how bad things would be with real traffic that keeps arriving. That
        is covered in [Little's law and workload models](#/lesson/littles-law-and-workload-models).
      - **Shedding versus queuing.** A system that rejects early looks worse in error rate and better in
        latency than one that queues; neither is "better" without the requirement.
      - **Names.** Use the organisation's names if it has them; if not, the ISTQB ones, with the question
        written next to each.

  - id: summary
    kind: summary
    concepts: [perf-types-questions, perf-types-load-profiles, perf-types-pass-criteria]
    title: Quick reference
    body: |
      - **Load:** expected load, meet the requirements. **Stress:** at or beyond the limits, or with fewer
        resources. **Spike:** sudden burst, then a steady state again. **Endurance / soak:** stable over
        hours. **Scalability:** grows without breaking requirements. **Capacity / breakpoint:** how much it
        takes while meeting objectives. **Concurrency:** the same action at once. **Smoke:** the script works.
      - The type is mostly the **profile**: ramps, steps, bursts and holds (ISTQB 4.2.4).
      - Locust: `LoadTestShape.tick()` returns `(users, spawn_rate)` about once a second, or `None` to stop.
      - Pass criteria differ per type; recovery and resource trends are part of them.
      - Read results **per phase or per step**, from cumulative counts - never as one average.
      - Smoke first; simple shapes; write the question down.

exercises:
  - id: mcq-load-vs-stress
    type: mcq
    concept: perf-types-questions
    skill: recall
    title: Load or stress?
    prompt: |
      By the ISTQB definitions, what separates a stress test from a load test?
    options:
      - id: limits
        text: A stress test applies load at or beyond the anticipated or specified limits (or reduces resources); a load test applies the anticipated realistic load
        feedback: Correct - same script, different question and profile.
      - id: duration
        text: A stress test runs longer than a load test
        feedback: Duration is what separates endurance (soak) tests; a stress test can be short.
      - id: users
        text: A stress test uses real users and a load test uses virtual users
        feedback: Both use generated load; the difference is how much relative to what is expected.
      - id: errors
        text: A stress test passes only if there are no errors
        feedback: Above the limits, fast explicit errors can be the designed behaviour; recovery and graceful degradation are the criteria.
    correct: [limits]
    hints:
      - Look at the words "anticipated" and "beyond" in the definitions.
    solution: |
      Load: anticipated realistic load. Stress: "at or beyond the limits of its anticipated or specified
      workloads", or reduced resources. The script can be identical.

  - id: mcq-spike-definition
    type: mcq
    concept: perf-types-questions
    skill: recall
    title: The second half of a spike test
    prompt: |
      ISTQB: spike testing focuses on the ability of a system to respond correctly to sudden bursts of peak
      loads **and ...**?
    options:
      - id: steady
        text: return afterwards to a steady state
        feedback: Correct - recovery is half of the definition.
      - id: scale
        text: add servers automatically during the burst
        feedback: Auto-scaling may be how a system copes, but it is not part of the definition.
      - id: zero-errors
        text: serve every request in the burst without errors
        feedback: The definition says "respond correctly", which can include rejecting excess work cleanly.
      - id: longer
        text: sustain the peak load for several hours
        feedback: That is closer to a stress or soak test; a spike is sudden and short.
    correct: [steady]
    hints:
      - What happens after the burst matters.
    solution: |
      "...and return afterwards to a steady state." So a spike profile needs a phase after the burst, and the
      pass criteria compare it with the phase before.

  - id: mcq-leak
    type: mcq
    concept: perf-types-questions
    skill: application
    title: The weekly restart
    prompt: |
      SandPay's settlement service is restarted only during the Sunday maintenance window. Last month it became
      slow every Saturday, and memory was high. Which test is designed to find this before release?
    options:
      - id: endurance
        text: An endurance (soak) test at normal load over many hours, watching memory, connections and threads
        feedback: Correct - this is the resource-capacity problem the definition names, such as memory leaks.
      - id: stress
        text: A stress test at 3x the expected load for 30 minutes
        feedback: More load for a short time may not show a slow leak; the problem appears with time, not load.
      - id: spike
        text: A spike test with a sudden burst on Saturday traffic
        feedback: The symptom grows over days at normal load; a burst tests something else.
      - id: smoke
        text: A smoke test after every deployment
        feedback: A smoke test only proves the script and system work at minimal load.
    correct: [endurance]
    hints:
      - What changes between Monday and Saturday - the load, or the time since the restart?
    solution: |
      Degradation with time since restart points to a leak or exhausted pool; endurance testing "verifies that
      there are no resource capacity problems (e.g., memory leaks, database connections, thread pools)".

  - id: mcq-capacity-vs-scalability
    type: mcq
    concept: perf-types-questions
    skill: application
    title: How many merchants per cluster?
    prompt: |
      Product asks: "How many concurrent payment requests can one SandPay cluster handle while p95 stays under
      the SLO?" Which type answers exactly that question?
    options:
      - id: capacity
        text: Capacity testing (found with a breakpoint-style rising profile)
        feedback: Correct - "how many users and/or transactions a given system will support and still meet the stated performance objectives".
      - id: scalability
        text: Scalability testing
        feedback: Scalability asks whether the system can grow (more users or data, more hardware) without breaking requirements; the question here is the limit of one fixed cluster.
      - id: load
        text: Load testing at today's peak
        feedback: That checks the requirement at the expected load; it does not find the maximum.
      - id: concurrency
        text: Concurrency testing
        feedback: Concurrency testing looks at specific actions happening simultaneously, not at maximum throughput.
    correct: [capacity]
    hints:
      - The question contains "how many" and "while still meeting".
    solution: |
      Capacity: the maximum while still meeting the objectives. A breakpoint profile (rising steps until the
      criterion breaks) is the usual way to find it.

  - id: mcq-k6-names
    type: mcq
    concept: perf-types-questions
    skill: recognition
    title: Mapping vendor names
    prompt: |
      A teammate who uses k6 says "average-load test" and "soak test". Which ISTQB terms match?
    options:
      - id: load-endurance
        text: Load testing and endurance testing
        feedback: Correct - average-load is the anticipated load; soak is the long, stable run.
      - id: stress-spike
        text: Stress testing and spike testing
        feedback: Those are above-normal loads; average-load is normal load.
      - id: smoke-capacity
        text: Smoke testing and capacity testing
        feedback: Smoke is minimal load; average-load is the expected load.
      - id: no-match
        text: They have no equivalent in the ISTQB syllabus
        feedback: The names differ but the questions are the same; k6's own page says no consensus exists on names.
    correct: [load-endurance]
    hints:
      - Compare the load level and duration each name implies.
    solution: |
      average-load = load (expected load, minutes); soak = endurance (normal load, hours). Smoke and breakpoint
      are the two k6 names without a separate ISTQB type.

  - id: mcq-reduced-resources
    type: mcq
    concept: perf-types-load-profiles
    skill: application
    title: Stress without more users
    prompt: |
      You run the normal expected load while one of the two payment-service instances is stopped. Which type of
      test is this, by the ISTQB definitions?
    options:
      - id: stress
        text: Stress testing - "reduced availability of resources such as accessible computing capacity"
        feedback: Correct - stress covers fewer resources as well as more load.
      - id: load
        text: Load testing, because the load is the expected one
        feedback: The load is normal, but the system is deliberately below its specified resources; the definition puts that under stress.
      - id: scalability
        text: Scalability testing, because the number of instances changed
        feedback: Scalability asks about growing to meet future needs; this removes capacity.
      - id: spike
        text: Spike testing
        feedback: There is no sudden burst of load.
    correct: [stress]
    hints:
      - Read the second sentence of the stress definition.
    solution: |
      ISTQB: "Stress testing is also used to evaluate a system's ability to handle reduced availability of
      resources such as accessible computing capacity, available bandwidth, and memory."

  - id: mcq-shape-tick
    type: mcq
    concept: perf-types-load-profiles
    skill: recall
    title: What tick() returns
    prompt: |
      In a Locust `LoadTestShape`, what does `tick()` return, and how often is it called?
    options:
      - id: tuple
        text: A tuple (user count, spawn rate) - optionally user classes - or None to stop; about once per second
        feedback: Correct - as the Locust documentation describes.
      - id: rps
        text: The number of requests per second to send; once per request
        feedback: A shape controls users, not requests; how many requests they send depends on wait_time and response times.
      - id: bool
        text: True to continue or False to stop; once per user
        feedback: It returns the target users and spawn rate, and None (not False) stops the test.
      - id: list
        text: The whole list of stages; once at the start
        feedback: Locust calls tick() repeatedly; the shape decides the target at each call.
    correct: [tuple]
    hints:
      - The shape controls how many users run and how fast they start.
    solution: |
      "a tuple with the desired user count and spawn rate (or None to stop the test). Locust will call the
      tick() method approximately once per second."

  - id: mcq-spike-shape
    type: mcq
    concept: perf-types-load-profiles
    skill: analysis
    title: Is this a spike?
    prompt: |
      Expected peak E = 100 users. Profile: 80 users for 10 minutes, 300 users for 10 minutes, 80 users for
      10 minutes. A colleague calls it a spike test. Using this lesson's rules, what is it - and why?
    options:
      - id: stress
        text: A stress test - the burst is a third of the run, not sudden and short
        feedback: Correct - a spike is a short burst; holding 3x load for a third of the run is a stress period.
      - id: spike
        text: A spike test - it goes from 80 to 300 and back
        feedback: The shape goes up and down, but a 10-minute plateau is not a burst; the exercise rule allows at most 10% of the run.
      - id: load
        text: A load test - the average is close to E
        feedback: The average hides a 10-minute period at 3x the expected load.
      - id: breakpoint
        text: A breakpoint test - load rises
        feedback: Load also falls again; a breakpoint test only rises until something breaks.
    correct: [stress]
    hints:
      - How long is the burst compared with the whole run?
    solution: |
      Shape matters, and so does proportion: a spike is sudden and short with a return to normal. Here the high
      phase lasts as long as the others - it tests sustained overload.

  - id: mcq-503
    type: mcq
    concept: perf-types-pass-criteria
    skill: analysis
    title: 92% errors at 11 users
    prompt: |
      In the stepped stress run, the error rate jumped from 0% at 8 users to 92% at 11, all `503` with
      `Retry-After: 1`, while p95 stayed at about 100 ms. The design says the API protects latency by shedding
      work above 8 requests in flight. What is the right reading?
    options:
      - id: designed
        text: The system behaves as designed above its limit - fast explicit rejections, latency protected - so the stress criterion "degrade gracefully" holds; next check recovery
        feedback: Correct - compare the behaviour with the design, then check the after phase.
      - id: fail
        text: The test failed - any error rate over 1% is a fail
        feedback: That criterion fits a load test at expected traffic; above the limit the question is how it degrades.
      - id: generator
        text: The load generator is overloaded, so the results are invalid
        feedback: The errors are server responses (503 with Retry-After), and the step pattern matches the server's configured limit.
      - id: latency
        text: Latency is fine, so the errors do not matter
        feedback: The errors matter - they are the mechanism; you verify they are the designed kind and that clients retry well.
    correct: [designed]
    hints:
      - Is 11 users above or below the designed limit?
    solution: |
      Above the designed capacity, a fast 503 with Retry-After is graceful degradation. Confirm the error type,
      that no wrong data was produced, and that the system recovers when load drops.

  - id: mcq-per-phase
    type: mcq
    concept: perf-types-pass-criteria
    skill: analysis
    title: The comforting average
    prompt: |
      A spike run reports "error rate 69% for the whole test". The before phase had 0%, the burst 92% and the
      after phase 5.7% - all of it in the first second after the burst. Why is 69% the wrong number to report?
    options:
      - id: phases
        text: It mixes three phases with different questions; the spike test is judged on the burst behaviour and on recovery after it
        feedback: Correct - report per phase.
      - id: too-high
        text: It is too high; the real error rate is the after-phase 5.7%
        feedback: The after phase is one of the answers, not the whole answer; the burst behaviour matters too.
      - id: percentile
        text: Error rate should be a percentile, not a percentage
        feedback: Error rate is a ratio; the problem is averaging across phases.
      - id: requests
        text: Error rate should be measured per user, not per request
        feedback: The issue is time phases, not the unit.
    correct: [phases]
    hints:
      - What does the spike definition ask about?
    solution: |
      A whole-run figure depends mostly on how long each phase lasted. Report before / during / after
      separately and compare after with before.

  - id: order-plan
    type: order
    concept: perf-types-questions
    skill: application
    title: Plan a performance test
    prompt: |
      Put the steps of planning and running a performance test in order.
    items:
      - id: question
        text: Write the question in business terms
      - id: type
        text: Choose the test type that answers it
      - id: expected
        text: Establish the expected load from production data or a forecast
      - id: profile
        text: Design the load profile as stages of users over time
      - id: criteria
        text: Write pass criteria that fit the type, with numbers
      - id: smoke
        text: Run a smoke test with a few users
      - id: run
        text: Run the test and read results per phase or step
      - id: report
        text: Report against the question with the evidence
    hints:
      - You cannot choose a profile before you know the expected load.
      - Criteria come before any run, so the result cannot bend them.
    solution: |
      Question, type, expected load, profile, criteria, smoke, run, report. Criteria are fixed before the first
      run so nobody adjusts them to fit the result.

  - id: debug-step-shape
    type: debug
    concept: perf-types-load-profiles
    skill: analysis
    title: The staircase that never ends
    prompt: |
      This shape should run 5 steps of 10 seconds - 2, 4, 6, 8 and 10 users - and stop. Instead it runs until
      someone presses Ctrl+C, and the first step already starts 4 users. Click **every** line that causes a
      defect.
    language: python
    code: |
      class StepShape(LoadTestShape):
          start = 2
          size = 2
          seconds = 10
          count = 5

          def tick(self):
              step = int(self.get_run_time() // self.seconds) + 1
              if step > self.count + 1:
                  return False
              users = self.start + self.size * step
              return (users, users)
    correctLines: [8, 10]
    lineNotes:
      - line: 9
        note: Once line 8 is fixed this comparison must become step >= self.count; it is part of the same off-by-one, but the line that stops the test wrongly is line 10.
      - line: 12
        note: Spawning the whole step within a second (spawn rate = users) is intended.
      - line: 11
        note: start + size * step is right when step starts at 0.
    hints:
      - What is step during the first 10 seconds?
      - What does Locust treat as the signal to stop?
    solution: |
      Line 8 adds 1, so the first step is step 1 (4 users) - steps must start at 0 (and line 9 then becomes
      `step >= self.count`). Line 10 returns False; the documented stop signal is `None`, so the test never ends.

  - id: short-recovery
    type: short
    concept: perf-types-pass-criteria
    skill: analysis
    title: What "recovered" means
    prompt: |
      Write pass criteria for the after phase of a spike test on SandPay's payment API. What do you compare, over
      what time, and what evidence would make you say it has **not** recovered even though the error rate is
      back to zero?
    modelAnswer: |
      Compare the after phase with the before phase at the same load: p95 and p99 latency, error rate and
      throughput must return to within an agreed margin (for example 10%) within an agreed time (for example 2
      minutes after the burst ends). Also compare server resources - queue length, connection pool use, memory,
      CPU - because a system can answer quickly again while still draining a backlog or holding leaked
      connections. Evidence of no recovery despite zero errors: latency still above the before phase, a queue or
      backlog still draining, connections or memory not returning to their earlier level, or payments created
      twice (retries during the burst that were not idempotent).
    rubric:
      - Compares after with before at the same load, with a margin and a time limit.
      - Looks at latency percentiles and throughput, not only the error rate.
      - Includes server resources (queues, pools, memory).
      - Mentions data correctness after the burst, such as duplicate payments.
    hints:
      - A system can stop failing and still be slow or leaking.
    solution: |
      Recovery = after-phase percentiles, throughput and resources back within a margin of the before phase
      within a set time, and no wrong data from the burst.

  - id: testdesign-flash-sale
    type: testdesign
    concept: perf-types-pass-criteria
    skill: application
    title: Performance tests for a flash sale
    prompt: |
      A merchant tells SandPay they will email 500,000 customers at 10:00 for a one-hour flash sale. Normal
      checkout peak is 120 concurrent payment requests; last year's sale reached 400 within a minute and stayed
      near 250 for the hour. Design the performance tests: for each, give the question, type, profile, pass
      criteria and the evidence you will collect.
    modelAnswer: |
      Preconditions: an environment sized like production (or the ratio documented), test merchants and cards
      from the sandbox, monitoring on the payment service, database and load generator.

      1. **Smoke** - question: does the script work? Profile: 2 users, 1 minute. Pass: zero failures, every step
         of the checkout runs. Evidence: per-request table.
      2. **Load** - question: does normal traffic meet the SLO with this release? Profile: ramp to 120 over 5
         minutes, hold 30 minutes. Pass: p95 within the SLO, errors under 0.1%, responses validated. Evidence:
         per-phase percentiles, assertion results.
      3. **Spike** - question: does the 10:00 burst hurt everyone, and do we recover? Profile: 120, jump to 400
         within a minute, hold 3 minutes, then 250. Pass: during the burst excess work is rejected with 503 and
         Retry-After or queued within a stated time; no 5xx other than 503; within 2 minutes p95 at the 250 level
         is within the SLO. Evidence: before/during/after table, error report by status code.
      4. **Stress (sustained)** - question: can we hold the sale for an hour? Profile: 250 for 60 minutes. Pass:
         p95 within the SLO through the hour, no upward trend, resources flat. Evidence: per-10-minute table,
         server metrics.
      5. **Data checks after every run** - one payment per idempotency key, amounts correct, no stuck
         authorisations. Evidence: database queries.
    rubric:
      - Each test has a question, a type, a profile, pass criteria and evidence.
      - Includes a smoke test first and a load test at the normal peak.
      - The spike test has a recovery phase and criteria for it.
      - The sustained phase checks for trends and resources, not only averages.
      - Checks data correctness (duplicates, amounts), not only latency.
    hints:
      - The sale has two shapes - the first minute and the following hour.
      - Which checks prove that no payment was charged twice?
    solution: |
      Smoke, load at 120, spike to 400 with recovery to 250, a one-hour sustained run at 250, and data checks
      after each - every test tied to a question with type-specific criteria.

  - id: interview-types
    type: interview
    concept: perf-types-questions
    skill: analysis
    title: "Interview: load, stress, spike and soak"
    prompt: |
      "What's the difference between load, stress, spike and soak testing? When would you use each on a payments
      API?"
    modelAnswer: |
      They answer different questions with the same script and different load profiles. A **load** test checks
      the system meets its requirements at the anticipated load - ramp to the expected peak, hold, read the
      percentiles against the SLO. A **stress** test goes at or beyond the limits - or removes resources, like
      stopping an instance - to see how it degrades and whether it recovers; fast 503s with Retry-After can be a
      pass there. A **spike** test is a sudden short burst with calm before and after; the key criterion is that
      it returns to a steady state. A **soak** or endurance test runs normal load for hours to find leaks -
      memory, database connections, thread pools - so I watch resource trends, not just latency.

      On a payments API: load for the normal daily peak on every release; spike before a merchant's flash sale;
      stress for a seasonal peak like Black Friday, and with one replica down; soak because services that leak
      fail at 3 a.m. on a Saturday. Before any of them, a smoke test to prove the script works. I also check
      correctness under load - no duplicate charges, one payment per idempotency key - because performance
      tests that only look at status codes can pass while money is wrong. Names vary between tools, so I write
      down the question and the pass criteria with each test.
    rubric:
      - Frames each type as a question, not just a definition.
      - Describes the load profile of each.
      - Gives type-specific pass criteria (recovery for spike, resource trends for soak, graceful degradation for stress).
      - Maps them to concrete payment scenarios.
      - Mentions correctness under load or the naming problem.
    followUps:
      - How would you decide the expected load for the load test?
      - Your stress test shows 40% errors. Is that a fail?
      - How long should a soak test run?
    hints:
      - Question, profile, pass criteria - for each type.
    solution: |
      Four questions: meets SLO at expected load; behaviour beyond limits; burst and recovery; stability over
      hours - each with its own profile and criteria, tied to payment scenarios.

  - id: classify-code
    type: coding
    concept: perf-types-questions
    skill: application
    title: Name the test a profile implements
    prompt: |
      In `fundamentals/types_classify.py`, implement `classify(stages, expected_users)`. It returns one of
      `smoke`, `breakpoint`, `spike`, `soak`, `stress` or `load` by applying the rules in the module docstring
      in order (the first match wins). Raise `ValueError` for an empty profile or a non-positive
      `expected_users`.
    project: perf
    files:
      - exercises/fundamentals/types_classify.py
    test: tests/fundamentals/test_types_classify.py
    command: .venv/bin/python -m pytest tests/fundamentals/test_types_classify.py
    hints:
      - Compute users, durations, the total time and the peak first.
      - The spike rule looks at a stage AND its neighbours - loop over the inner stages only.
      - Order matters - a tiny rising staircase is a smoke test, not a breakpoint test.
    modelAnswer: |
      ```python
      def classify(stages, expected_users):
          if not stages:
              raise ValueError("a profile needs at least one stage")
          if expected_users <= 0:
              raise ValueError("expected_users must be positive")
          users = [u for _, u in stages]
          durations = [d for d, _ in stages]
          total, peak = sum(durations), max(users)
          if peak <= max(1, expected_users * 0.1) and total <= 300:
              return "smoke"
          if len(stages) >= 4 and all(b > a for a, b in zip(users, users[1:])):
              return "breakpoint"
          for i in range(1, len(stages) - 1):
              if (users[i] >= 2 * expected_users and durations[i] <= 0.1 * total
                      and users[i - 1] <= expected_users and users[i + 1] <= expected_users):
                  return "spike"
          if total >= 14_400 and peak <= expected_users:
              return "soak"
          if peak > expected_users:
              return "stress"
          return "load"
      ```

      The rules are a teaching simplification: real profiles have ramps, and a team's own definitions win.
    rubric:
      - Every test in tests/fundamentals/test_types_classify.py passes.
      - The rules are applied in the documented order.
      - The spike rule checks the stages before and after the burst.
      - You can explain why a long run above the expected load is stress, not soak.
    solution: |
      Compute the profile's features once, then test the rules in order; the spike rule needs both neighbours
      at or below the expected load.

  - id: profiles-code
    type: coding
    concept: perf-types-load-profiles
    skill: application
    title: Build load profiles as stages
    prompt: |
      In `fundamentals/types_profiles.py`, implement `users_at`, `ramp_hold`, `steps`, `spike` and
      `expected_users_series`. Stages are `(end_s, users, spawn_rate)`; `users_at` returns `None` after the
      last stage - the value a Locust `LoadTestShape.tick()` returns to stop the test.
    project: perf
    files:
      - exercises/fundamentals/types_profiles.py
    test: tests/fundamentals/test_types_profiles.py
    command: .venv/bin/python -m pytest tests/fundamentals/test_types_profiles.py
    hints:
      - "users_at: the first stage whose end_s is greater than t."
      - "ramp_hold: one stage per ramp second, users = ceil(users * second / (ramp_s + 1))."
      - "spike: the burst and the return use spawn_rate = peak - base."
    modelAnswer: |
      ```python
      def users_at(stages, t):
          if t < 0:
              raise ValueError("t must be >= 0")
          for end_s, users, _ in stages:
              if t < end_s:
                  return users
          return None

      def ramp_hold(users, ramp_s, hold_s):
          if users <= 0 or ramp_s < 0 or hold_s <= 0:
              raise ValueError("users and hold_s must be positive, ramp_s >= 0")
          stages = [(float(s), math.ceil(users * s / (ramp_s + 1)), float(users)) for s in range(1, ramp_s + 1)]
          return stages + [(float(ramp_s + hold_s), users, float(users))]

      def steps(start, step, every_s, count):
          if start <= 0 or step <= 0 or every_s <= 0 or count <= 0:
              raise ValueError("start, step, every_s and count must be positive")
          return [(every_s * (i + 1), start + step * i, float(step)) for i in range(count)]
      ```

      `spike` builds three stages with `spawn_rate = peak - base` for the burst and the return, and
      `expected_users_series` is `[users_at(stages, t) for t in range(seconds)]`.
    rubric:
      - Every test in tests/fundamentals/test_types_profiles.py passes.
      - Invalid inputs raise ValueError instead of producing a strange profile.
      - users_at returns None, not 0, after the last stage - and you can say why.
    solution: |
      A profile is data; users_at turns it into what tick() returns, with None as the stop signal.

  - id: stress-code
    type: coding
    concept: perf-types-pass-criteria
    skill: application
    title: Run a stepped stress test and find where it breaks
    prompt: |
      Two files. In `fundamentals/types_stress_locustfile.py`, write `StepShape.tick()` - step k (from 0) runs
      `start + size * k` users for `seconds` seconds, and the test stops after `count` steps. In
      `fundamentals/types_stress.py`, implement `per_step` (split Locust's `--csv-full-history` rows into steps
      of consecutive `Aggregated` rows with the same user count, using differences of the cumulative counts)
      and `breaking_point`. The test runs your locustfile with real Locust against the practice API with
      capacity 4 and queue 4, and expects no failures at 2, 5 and 8 users and the breaking point at 11.
    project: perf
    files:
      - exercises/fundamentals/types_stress_locustfile.py
      - exercises/fundamentals/types_stress.py
    test: tests/fundamentals/test_types_stress.py
    command: .venv/bin/python -m pytest tests/fundamentals/test_types_stress.py
    hints:
      - "tick(): step = int(self.get_run_time() // self.seconds); return None once step >= self.count."
      - "per_step: walk the Aggregated rows; a step ends where the User Count changes."
      - Work done in a step = cumulative count on its last row minus the count on the row before it.
    modelAnswer: |
      ```python
      def tick(self):
          step = int(self.get_run_time() // self.seconds)
          if step >= self.count:
              return None
          users = self.start + self.size * step
          return (users, users)

      def per_step(rows):
          agg = [r for r in rows if r.get("Name") == "Aggregated"]
          results, prev_req, prev_fail, i = [], 0, 0, 0
          while i < len(agg):
              users = int(agg[i]["User Count"])
              j = i
              while j + 1 < len(agg) and int(agg[j + 1]["User Count"]) == users:
                  j += 1
              end_req, end_fail = int(agg[j]["Total Request Count"]), int(agg[j]["Total Failure Count"])
              if users > 0:
                  p95s = [v for v in (_num(r["95%"]) for r in agg[i:j + 1]) if v is not None]
                  results.append(StepResult(users, end_req - prev_req, end_fail - prev_fail,
                                            max(p95s) if p95s else None))
              prev_req, prev_fail = end_req, end_fail
              i = j + 1
          return results

      def breaking_point(steps, max_error_rate, max_p95_ms):
          for s in steps:
              if s.requests == 0:
                  continue
              if s.error_rate > max_error_rate or (s.p95_ms is not None and s.p95_ms > max_p95_ms):
                  return s
          return None
      ```
    rubric:
      - Every test in tests/fundamentals/test_types_stress.py passes.
      - The shape stops with None after the last step.
      - per_step uses cumulative counts and keeps repeated user counts (as in a spike) apart.
      - You can explain why 8 users never fail and 11 always do against this target.
    solution: |
      The shape steps users; the analysis works per step from cumulative counts; with 4 workers and 4 queue
      places, the 9th concurrent request is the first one shed, so the break appears at 11 users.

placement:
  - id: place-type-for-risk
    type: mcq
    concept: perf-types-questions
    skill: application
    title: Connections run out on Friday
    prompt: |
      The refund service is deployed every Monday. By Friday its database connection pool is often exhausted,
      although traffic is no higher than on Monday. Which test reproduces this before release?
    options:
      - id: endurance
        text: An endurance test at normal load for many hours, tracking pool use
        feedback: Correct - the problem grows with time at normal load.
      - id: stress
        text: A stress test at twice the Friday load for 30 minutes
        feedback: Traffic is not higher on Friday; more load for a short time may not reproduce a slow leak.
      - id: spike
        text: A spike test
        feedback: There is no burst in the symptoms.
      - id: capacity
        text: A capacity test to find the maximum users
        feedback: The question is about stability over time, not maximum load.
    correct: [endurance]
    solution: |
      Degradation with time at constant load is the endurance (soak) question - "database connections, thread
      pools" are named in its definition. Track the pool over hours.

  - id: place-shape-stop
    type: debug
    concept: perf-types-load-profiles
    skill: analysis
    title: The shape that ignores its end
    prompt: |
      This shape should hold 10 users for 60 seconds and then stop the test. Click the line that stops it from
      ending.
    language: python
    code: |
      class HoldShape(LoadTestShape):
          def tick(self):
              if self.get_run_time() < 60:
                  return (10, 10)
              return (0, 10)
    correctLines: [5]
    lineNotes:
      - line: 3
        note: Comparing the run time with 60 seconds is correct.
      - line: 4
        note: Holding 10 users with spawn rate 10 is intended.
    solution: |
      Returning `(0, 10)` stops all users but keeps the test running with zero users; `tick()` must return
      `None` to stop the test.

  - id: place-spike-result
    type: mcq
    concept: perf-types-pass-criteria
    skill: analysis
    title: Did the spike test pass?
    prompt: |
      A spike run on an API designed to shed load above its limit shows: before the burst 0% errors and p95
      100 ms; during the burst 60% errors, all 503 with Retry-After, p95 110 ms; five minutes after, 0% errors
      but p95 900 ms and a growing queue. Did it pass?
    options:
      - id: no-recovery
        text: No - the burst was handled as designed, but the system did not return to its steady state
        feedback: Correct - recovery is half the spike criterion.
      - id: pass
        text: Yes - errors are back to 0%
        feedback: Latency is 9x the before phase and a queue is still growing; it has not recovered.
      - id: fail-errors
        text: No - 60% errors during the burst is a failure
        feedback: The shed errors are the designed behaviour above the limit; the failure is the after phase.
      - id: invalid
        text: The run is invalid because it has errors
        feedback: Errors are part of what a spike test observes.
    correct: [no-recovery]
    solution: |
      Judge each phase against its own criterion: the burst behaved as designed; the after phase did not return
      to the before phase. Investigate what holds the queue (a backlog, retries, a pool).

recall:
  - id: recall-load-stress
    concept: perf-types-questions
    prompt: Load versus stress test in one sentence each?
    answer: Load - does the system meet its requirements at the anticipated realistic load? Stress - how does it behave at or beyond its limits, or with fewer resources (and does it recover)?
  - id: recall-spike-soak
    concept: perf-types-questions
    prompt: What are the two halves of a spike test, and what does a soak test look for?
    answer: Spike - handle a sudden burst correctly and return afterwards to a steady state. Soak (endurance) - stability over a long period, for example memory leaks, database connections and thread pools.
  - id: recall-capacity
    concept: perf-types-questions
    prompt: Capacity versus scalability?
    answer: Capacity - how many users or transactions the system supports while still meeting its objectives. Scalability - whether it can grow (more users, more data, more hardware) to meet future requirements without violating them.
  - id: recall-profile
    concept: perf-types-load-profiles
    prompt: What are the building blocks of a load profile (ISTQB)?
    answer: Ramp-ups, ramp-downs, steps (instantaneous changes) and predefined distributions such as daily or seasonal cycles - applied to virtual users running operational profiles over time.
  - id: recall-tick
    concept: perf-types-load-profiles
    prompt: How does a Locust LoadTestShape control a test?
    answer: Locust calls tick() about once a second; it returns (user count, spawn rate), optionally with user classes, or None to stop the test. get_run_time() gives the elapsed seconds.
  - id: recall-per-phase
    concept: perf-types-pass-criteria
    prompt: Why read results per phase or per step?
    answer: Each phase answers a different question (before, burst, after; each step of a staircase). A whole-run average mixes them and mostly reflects how long each phase lasted.

