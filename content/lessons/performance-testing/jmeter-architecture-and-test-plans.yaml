id: jmeter-architecture-and-test-plans
title: JMeter architecture and test plans
subject: performance-testing
module: jmeter
level: beginner
status: published
estimatedMinutes: 135
summary: 'Read a JMeter test plan the way JMeter does - a tree of ten kinds of element, saved as a .jmx file in which every element is followed by a hashTree of its children. Learn which elements apply to which sampler (scoping), the order JMeter runs them in for each sampler (execution order, including what the manual does not say about nested levels, measured on JMeter 5.6.3), and why plans are built in the GUI but run in CLI mode with -n -t -l -j -J. Every run shown is a real JMeter 5.6.3 run against the SandPay practice API.'
tags:
