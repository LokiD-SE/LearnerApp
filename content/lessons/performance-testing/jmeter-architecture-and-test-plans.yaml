environment: |
  - **Tools:** Apache JMeter **5.6.3** (the current release, downloaded by `practice/perf/scripts/get-jmeter.sh`
    and checked against Apache's SHA-512), run with OpenJDK 17 on Linux; Python 3.12.3 with pytest 9.2.0 for the
    exercises. Every JMeter run in this lesson is real and was made on 19-20 November 2026 against
    `practice/perf/support/sandpay_target.py`, the SandPay practice API on `127.0.0.1` - never against anybody
    else's system. Response times depend on the machine; the element order, response codes and counts do not.
  - **Elided output:** JMeter prints and saves epoch timestamps in milliseconds (13 digits). They are replaced by
    `(epoch ms)` in the console output and left out of the JTL rows shown; nothing else is changed.
  - **Source, quoted:** the Apache JMeter User's Manual, as documented on 19 November 2026 -
    [Elements of a Test Plan](https://jmeter.apache.org/usermanual/test_plan.html) (sections 3.0-3.12, including
    3.9 Execution order and 3.10 Scoping Rules) and [Getting Started](https://jmeter.apache.org/usermanual/get-started.html)
    (1.0.2 Load Test running, 1.4 Running JMeter, 1.4.4 CLI Mode and the command-line option list).
  - **Measured, not documented:** the manual defines execution order only among elements at one level. The order
    across nested levels (thread group, controller, sampler) and for elements placed directly under the Test Plan
    was **observed** with this lesson's probe (`practice/perf/support/jm_arch_fixture.py`: every element is a
    JSR223 Groovy element that writes its name to `jmeter.log`). It is labelled as observed behaviour of 5.6.3 -
    do not build a plan that depends on it.
  - **The .jmx format** is not specified in the manual; the structure shown (element followed by its
    `<hashTree>`) is what JMeter 5.6.3 reads and what its bundled templates (`bin/templates/*.jmx`) contain. Writing
    .jmx by hand is done here to learn the structure; in real work you build plans in the GUI.
  - **Fictional:** SandPay, its merchants (`merchant-1` .. `merchant-50`, secret `secret-<n>`) and all data.
  - **Not repeated here:** percentiles and what JMeter reports - [Performance metrics and
    percentiles](#/lesson/performance-metrics-and-percentiles); thread counts and timers in depth - [Thread groups,
    ramp-up and timers](#/lesson/jmeter-thread-groups-and-timers); extractors -
    [Correlation and extractors in JMeter](#/lesson/jmeter-correlation-and-extractors).

prerequisites:
  - performance-testing-types
  - performance-metrics-and-percentiles
  - http-request-response-anatomy

concepts:
  - id: perf-jm-elements
    name: The elements of a JMeter test plan
    summary: A test plan is a tree. The Test Plan holds thread groups; thread groups hold samplers (which send requests) and logic controllers (which decide which samplers run, in what order, how often); configuration elements, pre-processors, post-processors, timers, assertions and listeners attach to the tree to modify, delay, check and record samples. A .jmx file stores the tree as XML in which every element is followed by a hashTree holding its children.
  - id: perf-jm-scope-order
    name: Scoping rules and execution order
    summary: Controllers and samplers are ordered - they run top to bottom. Config elements, pre-processors, post-processors, timers, assertions and listeners are hierarchical - they apply to the sampler they are a child of, or to every sampler under the controller or thread group they are a child of, wherever they sit among their siblings. For each sampler JMeter runs config elements, pre-processors, timers, the sampler, post-processors, assertions and listeners, and runs nothing hierarchical that has no sampler in scope.
  - id: perf-jm-cli-runs
    name: Building in the GUI, running in CLI mode
    summary: The GUI is for building and debugging a plan; load tests run in CLI mode - jmeter -n -t plan.jmx -l results.jtl -j jmeter.log - with values passed as properties (-Jname=value, read with ${__P(name,default)}) so one plan serves every environment, and the HTML dashboard generated with -e -o. The JTL file is the evidence; the console summary is only a progress line.

objectives:
  - Name the ten kinds of element in a JMeter test plan and say what each one does, in the manual's terms.
  - Read a .jmx file as a tree by pairing each element with the hashTree that follows it.
  - Work out which config elements, pre-processors, post-processors, timers, assertions and listeners apply to a given sampler.
  - Predict the order in which JMeter runs the elements around each sampler, and say which parts of that order are documented and which were only observed.
  - Run a plan in CLI mode with -n -t -l -j -J (and -e -o for the dashboard) and read the JTL file it writes.
  - Diagnose a misplaced element (for example an extractor at the wrong level) from the JTL evidence.

sections:
  - id: intuition
    kind: intuition
    concepts: [perf-jm-elements, perf-jm-scope-order]
    title: The idea in plain language
    body: |
      Picture a SandPay merchant's morning: sign in once, then look at the latest payments a few times. To load
      test that, you need a **script** for one merchant and a way to run it for many merchants at once. A JMeter
      **test plan** is that script, drawn as a tree:

      - the **thread group** is the crowd - how many merchants (threads), how fast they arrive, how many times each
        repeats the script;
      - **samplers** are the actions - each one sends a request and records what came back;
      - **logic controllers** are the stage directions - "only the first time", "three times", "one of these";
      - **configuration elements** are the shared props everyone uses - the server address, the headers, the
        cookie jar;
      - **pre- and post-processors** prepare a request or pick something out of a response - such as the token
        returned by sign-in;
      - **timers** are pauses before a request;
      - **assertions** are the checks - was it really a 200?;
      - **listeners** are the notebook - where the results go.

      The tree's shape is the whole trick. Actions and stage directions run **top to bottom**. Everything else
      applies by **where it hangs**: a check hung under one request checks only that request; a check hung under
      the thread group checks every request. Get the shape right and JMeter does the rest; hang an element one
      level too high and it quietly applies to requests you never meant - the debug exercise in this lesson is a
      real example in which that turns 2 of 3 payment calls into 401s.

  - id: what
    kind: what
    concepts: [perf-jm-elements]
    title: The ten kinds of element, in the manual's words
    body: |
      The manual's chapter "Elements of a Test Plan" starts: "A minimal test will consist of the Test Plan, a
      Thread Group and one or more Samplers."

      | Element | What the manual says | Examples (JMeter class) |
      | --- | --- | --- |
      | **Test Plan** | the root; its "Functional Testing" box "will cause JMeter to record the data returned from the server for each sample" - "off if you are doing stress-testing" | `TestPlan` |
      | **Thread Group** | "the beginning points of any test plan. All controllers and samplers must be under a thread group"; it sets the number of threads, the ramp-up period and the loop count | `ThreadGroup`, `SetupThreadGroup`, `PostThreadGroup` |
      | **Sampler** | "Samplers tell JMeter to send requests to a server and wait for a response. They are processed in the order they appear in the tree." | `HTTPSamplerProxy` (HTTP Request), `JSR223Sampler`, `JDBCSampler` |
      | **Logic Controller** | "let you customize the logic that JMeter uses to decide when to send requests" - they "can change the order of requests coming from their child elements" | `OnceOnlyController`, `LoopController`, `GenericController` (Simple), `TransactionController` |
      | **Configuration Element** | "Although it does not send requests ... it can add to or modify requests"; "accessible from only inside the tree branch where you place the element" | `ConfigTestElement` (HTTP Request Defaults), `HeaderManager`, `CookieManager`, `CSVDataSet` |
      | **Pre-Processor** | "executes some action prior to a Sampler Request being made" | `JSR223PreProcessor`, `UserParameters` |
      | **Post-Processor** | "executes some action after a Sampler Request has been made ... most often used to process the response data, often to extract values from it" | `JSONPostProcessor` (JSON Extractor), `RegexExtractor`, `BoundaryExtractor` |
      | **Timer** | "will cause JMeter to delay a certain amount of time before each sampler which is in its scope" | `ConstantTimer`, `UniformRandomTimer` |
      | **Assertion** | "allow you to assert facts about responses received from the server being tested"; failed assertions "count towards the error %age" | `ResponseAssertion`, `DurationAssertion`, `JSR223Assertion` |
      | **Listener** | "provide access to the information JMeter gathers about the test cases"; "They will collect data only from elements at or below their level" | `ResultCollector` (View Results Tree, Summary Report...), `BackendListener` |

      Two more terms you will meet: a **Test Fragment** is a controller that "is not executed unless it is referenced
      by either a Module Controller or an Include_Controller" (re-use), and **properties** versus **variables** -
      "Properties are global to jmeter"; "JMeter variables are local to each thread" (section 3.11).

      A **.jmx file** is the plan saved as XML. Its rule is simple and strict: every element is followed by a
      `<hashTree>` that holds that element's children - an empty `<hashTree/>` when it has none.

  - id: why
    kind: why
    concepts: [perf-jm-scope-order, perf-jm-cli-runs]
    title: Why the structure matters to a tester
    body: |
      Three kinds of wrong result come from not knowing the structure, and none of them crashes - JMeter runs
      happily and reports numbers:

      1. **An element applies to the wrong samplers.** An extractor, timer or assertion one level too high runs for
         every sampler below it. The extractor case is in the debug exercise: real run, 1 success then 2 × 401. A
         timer one level too high adds think time to requests that should have none, and the throughput you
         measure is lower than the workload model.
      2. **An element never runs.** "Timers, Assertions, Pre- and Post-Processors are only processed if there is a
         sampler to which they apply." An assertion under an empty controller, or under a disabled one, checks
         nothing - and the run looks clean.
      3. **The load generator, not the server, is measured.** The manual is blunt: "Don't run load test using GUI
         mode !" and "GUI mode should only be used for creating the test script, CLI mode (NON GUI) must be used for
         load testing". The GUI and its result listeners compete with the threads for CPU and memory.

      Knowing the tree also lets you **review a plan in code review**: a .jmx is text in git, and a reviewer who can
      read the hashTree pairs can spot a misplaced extractor in a diff without opening the GUI.

  - id: jmx-structure
    kind: internals
    concepts: [perf-jm-elements]
    title: Inside a .jmx file - elements and their hashTrees
    body: |
      This is the outline of `practice/perf/solutions/jmeter/jm_arch_plan.jmx`, the plan you complete in the
      exercises (properties trimmed):

      ```xml
      <jmeterTestPlan version="1.2" properties="5.0" jmeter="5.6.3">
        <hashTree>                                     <!-- children of the document: the Test Plan -->
          <TestPlan testclass="TestPlan" testname="SandPay merchant smoke"/>
          <hashTree>                                   <!-- children of the Test Plan -->
            <ThreadGroup testclass="ThreadGroup" testname="Merchants"/>
            <hashTree>                                 <!-- children of the thread group -->
              <ConfigTestElement testclass="ConfigTestElement" testname="HTTP Request Defaults"/>
              <hashTree/>                              <!-- no children -->
              <HeaderManager testclass="HeaderManager" testname="JSON and bearer token"/>
              <hashTree/>
              <OnceOnlyController testclass="OnceOnlyController" testname="Sign in once per thread"/>
              <hashTree>
                <HTTPSamplerProxy testclass="HTTPSamplerProxy" testname="POST /auth/token"/>
                <hashTree>                             <!-- children of the sign-in sampler -->
                  <JSONPostProcessor testclass="JSONPostProcessor" testname="Extract token"/>
                  <hashTree/>
                </hashTree>
              </hashTree>
              <HTTPSamplerProxy testclass="HTTPSamplerProxy" testname="GET /v1/payments"/>
              <hashTree>
                <ResponseAssertion testclass="ResponseAssertion" testname="Status is 200"/>
                <hashTree/>
              </hashTree>
            </hashTree>
          </hashTree>
        </hashTree>
      </jmeterTestPlan>
      ```

      Read any `<hashTree>` as a list of **pairs**: (element, its hashTree), (element, its hashTree)... The element's
      `testclass` says what it is, `testname` is the label you see in the GUI and in the results, and
      `enabled="false"` switches it (and, for a controller, everything under it) off without deleting it.

      Two details that trip people up when they read or diff .jmx files:

      - **Numbers that hold expressions are strings.** A thread count of `${__P(threads,2)}` must be saved as
        `<stringProp name="ThreadGroup.num_threads">`; written as `<intProp>`, JMeter 5.6.3 refuses to load the plan
        (this happened while building this track's practice plans - the error names the XML path of the bad
        property).
      - **Odd names are real.** The Response Assertion stores its patterns in `collectionProp
        name="Asserion.test_strings"` - spelled that way in JMeter's own saved files. Don't "fix" it.

  - id: order-internals
    kind: internals
    concepts: [perf-jm-scope-order]
    title: Scope and order - the documented rules and what a real run shows
    body: |
      **Scoping (section 3.10).** "Some elements in the test trees are strictly hierarchical (Listeners, Config
      Elements, Post-Processors, Pre-Processors, Assertions, Timers), and some are primarily ordered (controllers,
      samplers)." For an assertion: "If its parent is a request, then it is applied to that request. If its parent is
      a Controller, then it affects all requests that are descendants of that Controller." And about a timer placed
      after the requests: "notice how order is irrelevant for hierarchical elements". The manual's mental model:
      "imagine each Request being passed up the tree branches, to its parent, then to its parent's parent, etc., and
      each time collecting all the configuration elements of that parent".

      Config elements have one more rule (3.6): "a configuration element inside a tree branch has higher precedence
      than the same element in a 'parent' branch" - and managers are special (3.10): "If more than one Manager is in
      the scope of a Sampler, only one Manager is used, but there is currently no way to specify which is used."

      **Execution order (section 3.9)**, for each sampler:

      ```plaintext
      Configuration elements
      Pre-Processors
      Timers
      Sampler
      Post-Processors (unless SampleResult is null)
      Assertions (unless SampleResult is null)
      Listeners (unless SampleResult is null)
      ```

      "[Within a type, elements are processed in the order in which they appear in the tree]." The manual's own
      example puts eight elements under one controller. This lesson's probe built exactly that tree with JSR223
      elements that log their names, and real JMeter 5.6.3 printed the manual's order:

      ```plaintext
      Pre-Processor 1, Timer 1, Timer 2, Sampler 1, Post-Processor 1, Post-Processor 2, Assertion 1,
      Pre-Processor 1, Timer 1, Timer 2, Sampler 2, Post-Processor 1, Post-Processor 2, Assertion 1
      ```

      **Across levels the manual is silent - so we measured.** One element of each type at thread group level (TG),
      controller level (C) and as children of sampler S1, plus a second sampler S2 directly under the thread group:

      ```plaintext
      Pre TG, Pre C, Pre S1, Timer S1, Timer C, Timer TG, S1,
      Post TG, Post C, Post S1, Assert TG, Assert C, Assert S1,
      Pre TG, Timer TG, S2, Post TG, Assert TG
      ```

      Pre-processors, post-processors and assertions ran from the **outermost** level inwards; timers from the
      **innermost** level outwards (two timers per level kept their tree order within the level). Elements placed
      **directly under the Test Plan** broke the pattern: a Test Plan pre-processor ran *after* the thread group's
      pre-processors, and a Test Plan timer ran last. Timers' delays are summed, so their order rarely matters; the
      order of extractors and assertions at different levels can. These are observations of 5.6.3, not promises -
      if two elements depend on each other, put them at the same level, where the manual guarantees tree order.

  - id: when
    kind: when
    concepts: [perf-jm-cli-runs, perf-jm-elements]
    title: GUI or CLI, and where to put each element
    body: |
      | Task | Use |
      | --- | --- |
      | build or change a plan, try one thread once, look at responses | the GUI, with View Results Tree |
      | any load test, any CI run, anything whose numbers you will report | CLI mode: `jmeter -n -t ... -l ... -j ...` |
      | the same plan against another host, port, thread count | properties: `-Jport=8090` read as `${__P(port,8090)}` |
      | an HTML report after the run | `-e -o <empty folder>` (or `-g results.jtl -o <folder>` later) |
      | review a plan change | the .jmx diff in git - read it as element/hashTree pairs |

      Placement rules of thumb, all following from scoping:

      - **One sampler only?** Make it the sampler's child: extractors for that response, assertions specific to it.
      - **Every sampler in the thread group?** A child of the thread group: HTTP Request Defaults, the Cookie Manager
        ("A Cookie Manager should be added to all web tests - otherwise JMeter will ignore cookies"), a generic
        "status is not 5xx" assertion, think time.
      - **A group of samplers?** Put them under a controller (a Simple Controller groups without changing logic) and
        hang the shared element there.
      - **Listeners** in a load test: none that render in the GUI; the `-l` file is the record (the next lessons
        cover listener cost).

      What the structure does **not** replace: a workload model (how many threads, what mix - [Workload
      modelling](#/lesson/workload-modelling-from-production)) and pass criteria ([Performance requirements and
      SLOs](#/lesson/performance-requirements-and-slos)). A perfect tree with the wrong numbers still answers the
      wrong question.

  - id: visual
    kind: visual
    concepts: [perf-jm-scope-order]
    title: What happens around one sampler
    body: |
      For each sampler, JMeter collects the hierarchical elements in scope (its own children and those of every
      controller and thread group above it) and runs them in this order. Notice that post-processors run **before**
      assertions, and that nothing hierarchical runs at all if no sampler is in its scope.

      ```mermaid
      flowchart LR
        A["Config elements merged<br/>(inner overrides outer)"] --> B["Pre-Processors<br/>outermost level first"]
        B --> C["Timers<br/>delays summed"]
        C --> D["Sampler sends<br/>the request"]
        D --> E["Post-Processors<br/>e.g. JSON Extractor"]
        E --> F["Assertions<br/>mark failed samples"]
        F --> G["Listeners<br/>-l results.jtl"]
      ```

  - id: plan-code
    kind: code
    concepts: [perf-jm-cli-runs, perf-jm-elements]
    title: The SandPay smoke plan, run in CLI mode
    body: |
      The completed plan (`solutions/jmeter/jm_arch_plan.jmx`) as a tree:

      ```plaintext
      SandPay merchant smoke (Test Plan)
      └─ Merchants (Thread Group: ${__P(threads,2)} threads, ${__P(loops,3)} loops)
         ├─ HTTP Request Defaults (http, 127.0.0.1, ${__P(port,8090)})
         ├─ JSON and bearer token (Header Manager: Content-Type, Authorization: Bearer ${token})
         ├─ Sign in once per thread (Once Only Controller)
         │  └─ POST /auth/token (HTTP Request, body {"client_id": "merchant-${__threadNum}", ...})
         │     └─ Extract token (JSON Extractor: $.access_token -> token, default NO_TOKEN)
         └─ GET /v1/payments (HTTP Request, /v1/payments?limit=5)
            └─ Status is 200 (Response Assertion: response code equals 200)
      ```

      Start the practice API, then run the plan in CLI mode (from `practice/perf`):

      ```bash
      .venv/bin/python support/sandpay_target.py --port 8090 --latency-ms 5 &
      tools/apache-jmeter-5.6.3/bin/jmeter -n -t solutions/jmeter/jm_arch_plan.jmx \
        -l run/results.jtl -j run/jmeter.log -Jport=8090 -Jthreads=2 -Jloops=3 -e -o run/report
      ```

      Real output (20 November 2026; the four `WARN StatusConsoleListener` lines are JMeter 5.6.3's logging
      library warning about its own configuration, not your plan):

      ```plaintext
      WARN StatusConsoleListener The use of package scanning to locate plugins is deprecated and will be removed in a future release
      (the same warning three more times)
      Creating summariser <summary>
      Created the tree successfully using solutions/jmeter/jm_arch_plan.jmx
      Starting standalone test @ 2026 Nov 20 07:07:26 IST (epoch ms)
      Waiting for possible Shutdown/StopTestNow/HeapDump/ThreadDump message on port 4446
      summary =      8 in 00:00:00 =   17.1/s Avg:    36 Min:     9 Max:    73 Err:     0 (0.00%)
      Tidying up ...    @ 2026 Nov 20 07:07:27 IST (epoch ms)
      ... end of run
      ```

      Eight samples: 2 sign-ins (once per thread) + 2 threads × 3 loops of the list. The first lines of the JTL
      (the timestamp column left out):

      ```plaintext
      elapsed,label,responseCode,responseMessage,threadName,dataType,success,failureMessage,bytes,sentBytes,grpThreads,allThreads,URL,Latency,IdleTime,Connect
      73,POST /auth/token,200,OK,Merchants 1-1,text,true,,232,272,2,2,http://127.0.0.1:8090/auth/token,65,0,42
      73,POST /auth/token,200,OK,Merchants 1-2,text,true,,232,272,2,2,http://127.0.0.1:8090/auth/token,65,0,42
      14,GET /v1/payments,200,OK,Merchants 1-1,text,true,,731,220,2,2,http://127.0.0.1:8090/v1/payments?limit=5,14,0,0
      ```

      `run/report` now holds `index.html`, `content/`, `sbadmin2-1.0.7/` and `statistics.json` - the HTML dashboard,
      covered in [The JMeter HTML dashboard and CI runs](#/lesson/jmeter-html-dashboard-and-ci). Note the first
      requests' 42 ms `Connect`: new connections on a cold JVM. One short run is a smoke test, not a measurement.

  - id: line-by-line
    kind: line-by-line
    concepts: [perf-jm-scope-order, perf-jm-cli-runs]
    title: Why the plan is written this way
    body: |
      - **`HTTP Request Defaults` holds the protocol, host and port; the samplers hold only paths.** The manual: "It
        is extremely useful in web testing to leave the DOMAIN field blank in all your HTTP Sampler elements, and
        instead, put that information into an HTTP default request element ... you can test your application on a
        different server simply by changing one field". One exercise test fails if a sampler hard-codes a domain.
      - **`${__P(port,8090)}`, `${__P(threads,2)}`, `${__P(loops,3)}`.** The manual's section 3.12 suggests exactly this
        so you can "change some or all of the values on the command-line" - here `-Jport=8090 -Jthreads=2 -Jloops=3`.
      - **The Header Manager is at thread group level** so both requests carry `Content-Type`, and the list carries
        `Authorization: Bearer ${token}`. `${token}` is a **variable** - "local to each thread" - so each merchant
        sends its own token.
      - **The Once Only Controller** around sign-in: "the login request will be executed only the first time
        through. Subsequent iterations will skip it." Two threads, so two sign-ins, which the practice API's
        `/metrics` confirms.
      - **`merchant-${__threadNum}`** gives each thread its own credentials (thread 1 is `merchant-1`), so the two
        threads are two merchants, not one merchant twice.
      - **The JSON Extractor is a child of `POST /auth/token`.** A post-processor whose "parent is a request" applies
        to that request only. One level higher and it runs after every request - the debug exercise.
      - **`defaultValues` = `NO_TOKEN`.** When the path matches nothing the variable gets a value that is obviously
        wrong in the logs and the server's answer, instead of silently keeping a stale token.
      - **The Response Assertion is a child of the list request** and checks the response code equals 200. Without it,
        a 401 is still a recorded sample - HTTP Request marks 4xx/5xx as failures by default, but an assertion makes
        the requirement explicit and also catches a "200 with the wrong body" when you add content checks.

  - id: steps
    kind: steps
    concepts: [perf-jm-elements, perf-jm-cli-runs]
    title: Building and running a plan, step by step
    body: |
      1. **Write down the script for one user** - the requests, which values pass from one response to the next
         request, and what "success" means for each.
      2. **In the GUI**, add a Thread Group (one thread, one loop while building), HTTP Request Defaults and a Cookie
         Manager (or Header Manager) at thread group level.
      3. **Add the samplers in order**, with only the path in each; wrap one-off steps (sign-in) in a Once Only
         Controller and groups in Simple Controllers.
      4. **Attach extractors and assertions as children** of the sampler they belong to; promote one to a higher level
         only when it should really apply to every sampler below.
      5. **Replace constants with properties** - `${__P(name,default)}` for host, port, threads, loops, duration.
      6. **Debug with one thread** and View Results Tree in the GUI: requests, responses, extracted variables.
      7. **Disable or remove GUI listeners**, save the .jmx and commit it.
      8. **Run in CLI mode**: `jmeter -n -t plan.jmx -l results.jtl -j jmeter.log -J...`, with `-e -o report` for the
         dashboard; read the JTL (labels, codes, `success`) before you read any average.
      9. **Check the count**: expected samples = threads × loops × samplers per iteration (+ once-only samplers per
         thread). If the count is off, the tree is not doing what you think.

  - id: example
    kind: example
    concepts: [perf-jm-scope-order]
    title: 'Example: the token that disappeared after the first call'
    body: |
      A colleague's SandPay plan passes in the GUI with one loop, but the nightly CLI run with three loops reports
      67 % errors. The JTL for one thread (from a real run of the plan below):

      ```plaintext
      label,responseCode,success
      POST /auth/token,200,true
      GET /v1/payments,200,true
      GET /v1/payments,401,false
      GET /v1/payments,401,false
      ```

      The first list call works and the next ones are unauthorised - so the token was valid once and then changed.
      In the .jmx diff, the JSON Extractor sits at **thread group level**, next to the Once Only Controller instead of
      inside the sign-in sampler's hashTree. By the scoping rules it now applies to **every** sampler: after
      `GET /v1/payments` it looks for `$.access_token`, finds none, and sets `token` to its default `NO_TOKEN`. The
      next list call sends `Bearer NO_TOKEN`.

      What a tester checks to confirm before touching the plan: `jmeter.log` or a Debug Sampler shows `token` before
      and after each request; the request headers of the 401 (View Results Tree, one thread) show `Bearer NO_TOKEN`.
      The fix is to move the extractor into the sign-in sampler's hashTree; the evidence that it worked is a JTL with
      every list call `200`, and the server's own count of requests matching threads × loops.

  - id: tests
    kind: tests
    concepts: [perf-jm-scope-order, perf-jm-cli-runs]
    title: Testing a plan before trusting its numbers
    body: |
      | # | Check | Expected result | Evidence |
      | --- | --- | --- | --- |
      | 1 | run with `-Jthreads=2 -Jloops=3` | 2 sign-ins + 6 lists = 8 samples | JTL row count by label; server `/metrics` routes |
      | 2 | every list call is authorised | all `GET /v1/payments` rows `200`, `success=true` | JTL `responseCode`, `success` |
      | 3 | the extractor runs only after sign-in | the JSON Extractor's parent in the .jmx is `POST /auth/token` | hashTree pairing (`test_jm_arch_plan.py` checks it) |
      | 4 | no hard-coded server in samplers | `HTTPSampler.domain` empty in every sampler | the .jmx |
      | 5 | negative: point at a wrong port | connection errors, `success=false` on every row, run still ends | JTL `responseCode`/`failureMessage` |
      | 6 | negative: an assertion that must fail | change the expected code to `201`: list rows fail with the assertion message | `failureMessage` "code expected to equal" |
      | 7 | order assumption | probe with JSR223 elements that log their names | `jmeter.log` order (this lesson's fixture) |

      Check 6 is worth doing once for every new assertion: an assertion you have never seen fail may not be checking
      anything. The unsolved exercise plan produces exactly that message - the real `failureMessage` for its 401s
      was `Test failed: code expected to equal / ****** received : [[[401]]] ****** comparison: [[[200]]] /`.

  - id: mistakes
    kind: mistakes
    concepts: [perf-jm-scope-order, perf-jm-cli-runs, perf-jm-elements]
    title: Common mistakes and a debugging method
    body: |
      - **Running the load test in the GUI.** "Don't run load test using GUI mode !" Use `-n`.
      - **An extractor or assertion one level too high.** It runs for every sampler below - the token example.
      - **An element with no sampler in scope.** An assertion under an empty or disabled controller never runs; the
        run looks clean.
      - **Depending on order across levels.** The manual only guarantees tree order within one level; the nested
        order above is what 5.6.3 did, not a contract.
      - **Two managers in scope.** "only one Manager is used, but there is currently no way to specify which" - keep
        one Header Manager per scope, or merge them.
      - **Hard-coded hosts and thread counts.** Every environment change becomes an edit; use HTTP Request Defaults
        and `${__P(...)}`.
      - **Writing numeric fields as `intProp` when they hold `${...}`.** JMeter refuses to load the plan.
      - **Reading only the console summary.** `Err: 0` can hide a plan that never sent the request you care about;
        count samples per label in the JTL.

      **Debugging method:** (1) count the samples per label against threads × loops; (2) find the first failed row
      and its `failureMessage`; (3) run one thread in the GUI with View Results Tree to see the request actually
      sent; (4) read the .jmx as hashTree pairs and ask, for the failing sampler, "what is in scope?"; (5) change one
      thing and re-run.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [perf-jm-cli-runs, perf-jm-elements]
    title: Trade-offs and alternatives
    body: |
      - **GUI-built XML vs code.** JMeter plans are built visually and saved as verbose XML; reviews need care, and
        merges of two people's changes to one .jmx are hard. Code-first tools (Locust in Python - [Locust
        fundamentals](#/lesson/locust-fundamentals); others compared in [JMeter, Locust and other tools
        compared](#/lesson/load-testing-tools-compared)) diff and merge like any code, but need programming.
      - **Many protocols, one tool.** The manual's sampler list includes HTTP, JDBC, JMS, LDAP, FTP, TCP and more; a
        code-first HTTP tool may need custom clients for the same breadth.
      - **Thread per user.** Each JMeter virtual user is a thread, which is simple to reason about but uses memory
        ("By default JMeter runs with a heap of 1 GB, this might not be enough"); see [Test environments and test
        data](#/lesson/performance-test-environments-and-data) for load generator limits.
      - **Hand-editing .jmx.** Useful to learn the format, to script small changes and to review diffs; for building
        plans the GUI is safer because it writes every property JMeter expects.

  - id: summary
    kind: summary
    concepts: [perf-jm-elements, perf-jm-scope-order, perf-jm-cli-runs]
    title: Quick reference
    body: |
      - **Minimal plan:** Test Plan, a Thread Group and one or more Samplers.
      - **Ten element kinds:** test plan, thread group, sampler, logic controller, config, pre-processor,
        post-processor, timer, assertion, listener.
      - **.jmx:** every element is followed by a `<hashTree>` of its children; read hashTrees as pairs.
      - **Ordered:** controllers and samplers, top to bottom. **Hierarchical:** config, pre, post, timers, assertions,
        listeners - apply to the parent sampler, or to every sampler under the parent controller/thread group.
      - **Per sampler:** config, pre-processors, timers, sampler, post-processors, assertions, listeners; within a type,
        tree order; nothing hierarchical runs without a sampler in scope.
      - **Across levels (observed in 5.6.3, not documented):** pre/post/assertions outermost first, timers innermost
        first; Test Plan level is different again - don't depend on it.
      - **Run:** `jmeter -n -t plan.jmx -l results.jtl -j jmeter.log -Jname=value [-e -o report]`; read values with
        `${__P(name,default)}`.
      - **Check:** samples per label = threads × loops (+ once-only per thread); first failure's `failureMessage`.

exercises:
  - id: jm-arch-minimal-plan
    type: mcq
    concept: perf-jm-elements
    skill: recall
    title: The smallest runnable plan
    prompt: According to the JMeter manual, what is the minimum a test plan needs to run a test?
    options:
      - id: plan-tg-sampler
        text: The Test Plan, a Thread Group and one or more Samplers
        feedback: Correct - the manual's first line on test plan elements. Listeners, assertions and config are optional.
      - id: plan-sampler
        text: The Test Plan and one Sampler
        feedback: '"All controllers and samplers must be under a thread group" - a sampler directly under the Test Plan has no thread to run it.'
      - id: plan-listener
        text: A Thread Group, a Sampler and a Listener
        feedback: A listener only presents or saves results; in CLI mode the -l option records samples without one.
      - id: plan-defaults
        text: A Thread Group, HTTP Request Defaults and a Sampler
        feedback: HTTP Request Defaults is a convenience; a sampler can hold its own host and port.
    correct: [plan-tg-sampler]
    hints:
      - Which element actually runs the requests, and which element sends them?
    solution: |
      Test Plan, Thread Group, Sampler. The thread group supplies the threads; samplers send the requests.

  - id: jm-arch-kind
    type: mcq
    concept: perf-jm-elements
    skill: recognition
    title: What kind of element is a JSON Extractor?
    prompt: You need the token from the sign-in response for later requests. Which kind of element does that job?
    options:
      - id: post
        text: A post-processor, such as the JSON Extractor
        feedback: Correct - "A Post-Processor is most often used to process the response data, often to extract values from it."
      - id: pre
        text: A pre-processor
        feedback: A pre-processor runs before the request is sent, when there is no response yet to read.
      - id: assertion
        text: An assertion
        feedback: Assertions check facts about a response and mark samples failed; they do not store values for later requests.
      - id: config
        text: A configuration element
        feedback: Config elements add to or modify requests (defaults, headers, cookies); they do not read responses.
    correct: [post]
    hints:
      - The value exists only after the response arrives.
    solution: |
      A post-processor. It runs after its sampler and can store part of the response in a variable.

  - id: jm-arch-hashtree
    type: mcq
    concept: perf-jm-elements
    skill: application
    title: Reading the pairs
    prompt: |
      In a .jmx file you see, inside a thread group's `<hashTree>`:

      ```xml
      <HTTPSamplerProxy testname="GET /v1/payments"/>
      <hashTree/>
      <ResponseAssertion testname="Status is 200"/>
      <hashTree/>
      ```

      What does the assertion apply to?
    options:
      - id: all
        text: Every sampler under the thread group - it is a child of the thread group, not of the sampler
        feedback: Correct - the sampler's hashTree is empty, so the assertion is the sampler's sibling and its parent is the thread group.
      - id: previous
        text: Only GET /v1/payments, because it comes straight after it
        feedback: Position next to a sampler means nothing; only being inside the sampler's hashTree makes it the sampler's child.
      - id: next
        text: Only the next sampler in the thread group
        feedback: Hierarchical elements ignore order among siblings - "order is irrelevant for hierarchical elements".
      - id: none
        text: Nothing - an assertion must be inside a sampler's hashTree to run
        feedback: An assertion under a controller or thread group applies to all samplers below it.
    correct: [all]
    hints:
      - Which hashTree contains the assertion?
    solution: |
      Pair each element with the hashTree that follows it. The sampler's hashTree is empty, so the assertion sits in
      the thread group's hashTree and applies to every sampler in the thread group.

  - id: jm-arch-scope-timer
    type: mcq
    concept: perf-jm-scope-order
    skill: application
    title: A timer below the request
    prompt: |
      A Loop Controller contains, in this order: a Header Manager, `GET /v1/payments/{id}`, then a Uniform Random
      Timer "Read the payment". Which requests does the timer delay?
    options:
      - id: the-get
        text: GET /v1/payments/{id}, before each time it runs
        feedback: Correct - a timer delays "each sampler which is in its scope", and order among siblings is irrelevant for hierarchical elements.
      - id: after
        text: The request after the loop, because the timer comes after the GET
        feedback: Timers apply to samplers in their scope (here, the loop's samplers), and always before the sampler.
      - id: none
        text: None - a timer placed after the last sampler has nothing left to delay
        feedback: The manual's own example has a timer after the requests that still applies to them.
      - id: everything
        text: Every sampler in the thread group
        feedback: Its parent is the Loop Controller, so only samplers under that controller are in scope.
    correct: [the-get]
    hints:
      - Does a hierarchical element's position among its siblings matter?
    solution: |
      The GET. Scope comes from the parent (the Loop Controller); the timer runs before each sampler in that scope.

  - id: jm-arch-order-manual
    type: mcq
    concept: perf-jm-scope-order
    skill: recall
    title: Post-processor or assertion first?
    prompt: A sampler has a JSON Extractor and a Response Assertion as children. In which order do they run after the sampler?
    options:
      - id: post-first
        text: The JSON Extractor (post-processor), then the assertion
        feedback: Correct - section 3.9 lists Post-Processors before Assertions, regardless of their order in the tree.
      - id: tree-order
        text: Whichever comes first in the tree
        feedback: Tree order decides only within one type; across types the 3.9 order applies.
      - id: assert-first
        text: The assertion, so failed responses are not extracted
        feedback: The manual's order is the opposite; an extractor on a failed response still runs (and may set its default value).
      - id: parallel
        text: Both at the same time
        feedback: Within a thread, elements run one after the other in a defined order.
    correct: [post-first]
    hints:
      - Recall the list in section 3.9, from configuration elements to listeners.
    solution: |
      Post-processors, then assertions. An assertion can therefore check a variable an extractor just set.

  - id: jm-arch-no-sampler
    type: mcq
    concept: perf-jm-scope-order
    skill: analysis
    title: The assertion that never failed
    prompt: |
      A "response time under 500 ms" Duration Assertion sits under a Simple Controller called "Reports". The JTL shows
      many samples over 500 ms, none failed. The Reports controller contains only a disabled HTTP Request. Why?
    options:
      - id: no-sampler
        text: There is no enabled sampler in the assertion's scope, so it never runs
        feedback: Correct - assertions "are only processed if there is a sampler to which they apply".
      - id: duration-off
        text: Duration Assertions are ignored in CLI mode
        feedback: Assertions run in CLI mode; the problem is scope, not the mode.
      - id: averages
        text: The assertion compares the average, not each sample
        feedback: A Duration Assertion checks each sample in its scope; it has no samples here.
      - id: listener
        text: The assertion needs a listener to report failures
        feedback: Failed assertions mark the sample failed in the JTL with or without a GUI listener.
    correct: [no-sampler]
    hints:
      - Which samplers are under the Reports controller and enabled?
    solution: |
      Scope is empty, so the assertion never runs. Move it to the level whose samplers it should check.

  - id: jm-arch-nested-order
    type: mcq
    concept: perf-jm-scope-order
    skill: analysis
    title: What is documented?
    prompt: |
      A thread group has a pre-processor P1; a controller inside it has a pre-processor P2; a sampler inside the
      controller has a pre-processor P3. Which statement is accurate?
    options:
      - id: observed
        text: The manual defines order only within one level; JMeter 5.6.3 was observed running P1, P2, P3, but you should not rely on it
        feedback: Correct - this lesson measured outermost-first for pre-processors, and the manual says nothing about order across levels.
      - id: documented
        text: The manual guarantees P1, P2, P3 because of tree order
        feedback: '"Within a type, elements are processed in the order in which they appear in the tree" is about one scope; nested levels are not covered.'
      - id: innermost
        text: P3 runs first because the sampler's own children have priority
        feedback: That was observed for timers (innermost first), not for pre-processors.
      - id: only-p3
        text: Only P3 runs; outer pre-processors are overridden
        feedback: Override applies to config elements of the same kind; every pre-processor in scope runs.
    correct: [observed]
    hints:
      - Look at the exact wording of section 3.9, and at what the probe measured.
    solution: |
      Undocumented across levels. Observed in 5.6.3: pre-processors outermost first, timers innermost first. Put
      dependent elements at the same level.

  - id: jm-arch-cli
    type: mcq
    concept: perf-jm-cli-runs
    skill: application
    title: The right command
    prompt: Which command runs `plan.jmx` as a load test, saves the samples and the run log, and sets the port property to 8090?
    options:
      - id: right
        text: jmeter -n -t plan.jmx -l results.jtl -j jmeter.log -Jport=8090
        feedback: Correct - -n CLI mode, -t test plan, -l samples log (JTL), -j run log, -J property.
      - id: no-n
        text: jmeter -t plan.jmx -l results.jtl -Jport=8090
        feedback: Without -n JMeter starts the GUI with the plan loaded - not for load tests.
      - id: d-flag
        text: jmeter -n -t plan.jmx -l results.jtl -Dport=8090
        feedback: -D sets a Java system property; ${__P(port)} reads a JMeter property, set with -J.
      - id: swapped
        text: jmeter -n -t plan.jmx -j results.jtl -l jmeter.log -Jport=8090
        feedback: -l is "the file to log samples to" and -j the "jmeter run log file" - swapped here.
    correct: [right]
    hints:
      - Which option names the JTL and which the run log?
    solution: |
      `-n -t plan.jmx -l results.jtl -j jmeter.log -Jport=8090`, read in the plan as `${__P(port,8090)}`.

  - id: jm-arch-dashboard
    type: mcq
    concept: perf-jm-cli-runs
    skill: recall
    title: The dashboard folder
    prompt: You add `-e -o run/report` to a CLI run and it refuses to start. The folder exists from yesterday's run. Why?
    options:
      - id: not-empty
        text: The output folder "must not exist or be empty"
        feedback: Correct - the manual's wording for -o. Use a new folder, or -f to "force delete existing results files and web report folder".
      - id: needs-gui
        text: The dashboard can only be generated from the GUI
        feedback: -e "generate report dashboard after load test" is a CLI option.
      - id: needs-xml
        text: The dashboard needs an XML JTL
        feedback: The dashboard is generated from the CSV results file JMeter writes by default.
      - id: needs-g
        text: -e only works together with -g
        feedback: -g generates a dashboard from an existing results file without running a test; -e does it after a run.
    correct: [not-empty]
    hints:
      - Read the manual's description of -o.
    solution: |
      The -o folder must not exist or must be empty. Use a fresh folder per run (or -f).

  - id: jm-arch-property-variable
    type: mcq
    concept: perf-jm-cli-runs
    skill: application
    title: Property or variable?
    prompt: Each thread signs in and must send its own token in later requests. Where should the token live?
    options:
      - id: variable
        text: In a JMeter variable (for example set by a JSON Extractor), because variables are local to each thread
        feedback: Correct - "JMeter variables are local to each thread"; each merchant keeps its own token.
      - id: property
        text: In a JMeter property, so every thread can read it
        feedback: '"Properties are global to jmeter" - one thread''s token would overwrite another''s.'
      - id: udv
        text: In User Defined Variables on the Test Plan
        feedback: UDVs are set at start-up and copied to each thread; they cannot hold a value that only exists after sign-in.
      - id: j-flag
        text: Passed on the command line with -Jtoken=...
        feedback: That is one value for the whole run, and tokens expire; extract them during the run.
    correct: [variable]
    hints:
      - Which of the two is per thread?
    solution: |
      A variable. Properties are global, so they suit run settings (host, port, threads), not per-user values.

  - id: jm-arch-build-order
    type: order
    concept: perf-jm-cli-runs
    skill: application
    title: From an empty plan to evidence
    prompt: Put the steps of building and running a new JMeter load test in order.
    items:
      - id: script
        text: Write down one user's requests, the values passed between them and what success means
      - id: skeleton
        text: In the GUI, add a Thread Group with HTTP Request Defaults and a Cookie or Header Manager
      - id: samplers
        text: Add the samplers in order and attach extractors and assertions as children of their samplers
      - id: properties
        text: Replace host, port, threads and loops with ${__P(name,default)} properties
      - id: debug
        text: Debug with one thread and View Results Tree, then disable GUI listeners and save the .jmx
      - id: run
        text: Run with jmeter -n -t plan.jmx -l results.jtl -j jmeter.log -J... (and -e -o for the dashboard)
      - id: check
        text: Check samples per label against threads x loops and read the first failure before any average
    hints:
      - The GUI comes before the CLI; the evidence check comes last.
    solution: |
      Design, skeleton, samplers with children in the right scope, properties, debug in the GUI, run in CLI mode,
      then check the counts and first failure.

  - id: jm-arch-debug-extractor
    type: debug
    concept: perf-jm-scope-order
    skill: analysis
    title: 'One 200, then 401s'
    prompt: |
      A real run of this plan (1 thread, 3 loops) gave: `POST /auth/token 200`, `GET /v1/payments 200`,
      `GET /v1/payments 401`, `GET /v1/payments 401`. The Header Manager sends `Authorization: Bearer ${token}`.
      This is the thread group's hashTree (properties trimmed). Which line is the defect?
    language: xml
    code: |
      <hashTree>
        <HeaderManager testclass="HeaderManager" testname="JSON and bearer token"/>
        <hashTree/>
        <OnceOnlyController testclass="OnceOnlyController" testname="Sign in once per thread"/>
        <hashTree>
          <HTTPSamplerProxy testclass="HTTPSamplerProxy" testname="POST /auth/token"/>
          <hashTree/>
        </hashTree>
        <JSONPostProcessor testclass="JSONPostProcessor" testname="Extract token">
          <stringProp name="JSONPostProcessor.referenceNames">token</stringProp>
          <stringProp name="JSONPostProcessor.jsonPathExprs">$.access_token</stringProp>
          <stringProp name="JSONPostProcessor.defaultValues">NO_TOKEN</stringProp>
        </JSONPostProcessor>
        <hashTree/>
        <HTTPSamplerProxy testclass="HTTPSamplerProxy" testname="GET /v1/payments"/>
        <hashTree/>
      </hashTree>
    correctLines: [9]
    lineNotes:
      - line: 7
        note: This empty hashTree is where the extractor belongs - moving it here is the fix. The defect is where line 9 puts it.
      - line: 12
        note: The default value is not the bug; it is what makes the bug visible. Without it, a stale token would hide the problem.
      - line: 4
        note: Once Only is correct - sign in once per thread, keep the token.
    hints:
      - The first list call works, so sign-in and the header are fine at least once. What changes the token after it?
      - Which samplers does an extractor at thread group level run after?
    solution: |
      Line 9 puts the JSON Extractor in the thread group's hashTree, so it runs after **every** sampler. After the
      first `GET /v1/payments` it finds no `$.access_token` and sets `token` to `NO_TOKEN`; the next calls send
      `Bearer NO_TOKEN` and get 401. Confirm with one thread in the GUI (the 401's request header), then move the
      extractor into the sign-in sampler's hashTree (line 7) and re-run: every list call 200.
    followUp: |
      A Response Assertion "status is 200" is added next to the extractor at thread group level. Which samples will it
      check, and is that what you want?

  - id: jm-arch-short-gui
    type: short
    concept: perf-jm-cli-runs
    skill: analysis
    title: '"It ran fine in the GUI"'
    prompt: |
      A teammate ran 200 threads from the GUI with View Results Tree open and reports p95 = 2.4 s. In CLI mode with
      no listeners the same plan gives p95 = 0.6 s. Explain the difference and what you would report.
    modelAnswer: |
      In GUI mode the load generator itself is the bottleneck: drawing the tree and holding every response in View
      Results Tree compete with 200 threads for CPU and heap, so requests are sent late and timings include JMeter's
      own delays. The manual says GUI mode "should only be used for creating the test script, CLI mode (NON GUI) must
      be used for load testing". Report the CLI run (with the JTL and the load generator's CPU and memory during the
      run, to show it was not saturated), and treat the GUI number as invalid, not as a second measurement.
    rubric:
      - Says the GUI and its listener consume the load generator's CPU and memory.
      - Quotes or paraphrases the manual's rule that load tests run in CLI mode.
      - Reports the CLI result with evidence that the load generator was not saturated.
      - Does not average or compare the two numbers as if both were valid.
    hints:
      - Which machine was measured in the GUI run - the server or JMeter?
    solution: |
      The GUI run measured JMeter as much as the server. Use the CLI run, with load-generator resource evidence.

  - id: jm-arch-testdesign
    type: testdesign
    concept: perf-jm-scope-order
    skill: application
    title: Test plan for a reviewed .jmx change
    prompt: |
      A pull request changes the SandPay smoke plan: it adds a "Get one payment" sampler that uses an id extracted
      from the list response, and moves the Response Assertion from the list sampler up to thread group level. Design
      the checks you would run before approving it. For each: preconditions, steps, expected result and evidence.
    modelAnswer: |
      Preconditions for all: the practice API on a known port, the plan run in CLI mode with `-Jthreads=2 -Jloops=3`,
      JTL and jmeter.log kept.

      1. **Sample counts.** Steps: run; count rows per label. Expected: 2 sign-ins, 6 lists, 6 "Get one payment".
         Evidence: JTL counts and the server's `/metrics` routes.
      2. **The new extractor's scope.** Steps: read the .jmx pairs. Expected: the id extractor is a child of the list
         sampler only. Evidence: the hashTree around it; a JSR223 probe or Debug Sampler showing the id before the
         new request.
      3. **The moved assertion now applies to all samplers.** Steps: read the scope; run. Expected: sign-in and get
         one payment are now also checked for 200 - confirm the author intended that (sign-in returns 200, so fine;
         a 201 endpoint would now fail). Evidence: JTL `success` per label.
      4. **Negative: the assertion still fails when it should.** Steps: point "Get one payment" at an unknown id.
         Expected: 404 rows with `success=false` and the assertion message. Evidence: `failureMessage`.
      5. **Negative: extractor no match.** Steps: make the list return no payments (a merchant with none, or a fixture).
         Expected: the default value appears in the get request and the run shows clear failures, not a silent pass.
         Evidence: JTL and jmeter.log.
      6. **No hard-coded host.** Expected: the new sampler has only a path. Evidence: the .jmx.
    rubric:
      - Each check has preconditions, steps, expected result and concrete evidence (JTL, .jmx pairs, metrics, logs).
      - Verifies sample counts per label against threads and loops.
      - Checks the new extractor's scope and the moved assertion's new scope explicitly.
      - Includes negative checks that prove the assertion and the extractor fail visibly.
    hints:
      - Which samplers does the assertion apply to after the move?
      - How do you prove an assertion can fail?
    solution: |
      Counts per label, both elements' scope read from the .jmx and confirmed in a run, and negative runs that make
      the assertion and the extractor fail visibly.

  - id: jm-arch-interview
    type: interview
    concept: perf-jm-elements
    skill: analysis
    title: 'Interview: walk me through a JMeter test plan'
    prompt: '"Walk me through how you structure a JMeter test plan for an API, and how you run it."'
    modelAnswer: |
      A plan is a tree. Under the Test Plan I put a Thread Group per user type, sized from the workload model.
      At thread group level go the things every request shares: HTTP Request Defaults with the host and port as
      properties, a Header Manager, a Cookie Manager if the API uses cookies, and a generic assertion if every response
      should be, say, under 400. Then the samplers in order - sign-in in a Once Only Controller, the business requests
      after it - each with only a path. Extractors and request-specific assertions are children of their sampler,
      because config, pre- and post-processors, timers, assertions and listeners are hierarchical: they apply to every
      sampler below their parent. For each sampler JMeter runs config, pre-processors, timers, the sampler,
      post-processors, assertions, listeners.

      I debug with one thread in the GUI, then run in CLI mode - `jmeter -n -t plan.jmx -l results.jtl -j jmeter.log
      -Jhost=... -Jthreads=...`, with `-e -o` for the dashboard - because the GUI distorts results. Before reading any
      percentile I check samples per label against threads × loops and the first failure in the JTL.
    rubric:
      - Describes the tree - thread groups, samplers in order, shared elements at thread group level.
      - Explains scoping - hierarchical elements apply to samplers below their parent - and places extractors correctly.
      - States the per-sampler order (pre-processors, timers, sampler, post-processors, assertions).
      - Runs in CLI mode with properties and keeps the JTL as evidence.
      - Validates the run (counts, first failure) before reading statistics.
    followUps:
      - Where would you put a timer for think time, and why?
      - How would you make the same plan run against staging and a local stub?
      - What happens if two Header Managers are in scope of one sampler?
    hints:
      - Structure, scope, order, run, check.
    solution: |
      Tree with shared elements high and specific ones as sampler children; per-sampler order; CLI run with
      properties; count and inspect failures before statistics.

  - id: jm-arch-tree-code
    type: coding
    concept: perf-jm-elements
    skill: application
    title: Read a .jmx as a tree and work out scope
    prompt: |
      In `exercises/jmeter/jm_arch_tree.py`, implement `classify(testclass)`, `parse_jmx(path)` and `scope(plan)`.
      `parse_jmx` pairs every element with the `<hashTree>` after it and raises `ValueError` for broken pairs or a file
      that is not a test plan. `scope` returns, for every enabled sampler, the enabled config elements,
      pre-processors, timers, post-processors, assertions and listeners that apply to it. The tests use
      `tests/jmeter/fixtures/jm_arch_shop.jmx`, which has elements at three levels, a timer after its sampler, a
      disabled assertion and a disabled controller.
    project: perf
    files:
      - exercises/jmeter/jm_arch_tree.py
    test: tests/jmeter/test_jm_arch_tree.py
    command: .venv/bin/python -m pytest tests/jmeter/test_jm_arch_tree.py
    hints:
      - Inside a hashTree, take the children two at a time - list(hash_tree)[i] and [i + 1].
      - For scope, pass down what you have collected at each level and add the current node's hierarchical children before visiting its samplers and controllers.
      - A disabled controller removes its whole subtree; a disabled element only itself.
    modelAnswer: |
      ```python
      def _children(hash_tree):
          items = list(hash_tree)
          nodes = []
          for i in range(0, len(items), 2):
              element = items[i]
              if element.tag == "hashTree":
                  raise ValueError("a hashTree without an element before it - the pairs are out of step")
              sub = items[i + 1] if i + 1 < len(items) else None
              if sub is None or sub.tag != "hashTree":
                  raise ValueError(f"element {element.get('testname')!r} has no hashTree after it")
              testclass = element.get("testclass", element.tag)
              nodes.append(Node(classify(testclass), testclass, element.get("testname", ""),
                                element.get("enabled", "true") != "false", _children(sub)))
          return nodes

      def scope(plan):
          result = {}
          def walk(node, inherited):
              here = {k: list(v) for k, v in inherited.items()}
              for child in node.children:
                  if child.enabled and child.kind in HIERARCHICAL:
                      here[child.kind].append(child.name)
              for child in node.children:
                  if not child.enabled:
                      continue
                  if child.kind == "sampler":
                      own = {k: list(v) for k, v in here.items()}
                      for g in child.children:
                          if g.enabled and g.kind in HIERARCHICAL:
                              own[g.kind].append(g.name)
                      result[child.name] = own
                  elif child.kind in ("thread-group", "controller"):
                      walk(child, here)
          walk(plan, {k: [] for k in HIERARCHICAL})
          return result
      ```

      Collecting a level's hierarchical children **before** visiting its samplers is what makes a timer placed after
      its sampler still apply - the scoping rule, not the tree order.
    rubric:
      - Every test in tests/jmeter/test_jm_arch_tree.py passes.
      - Pairs elements and hashTrees strictly and raises ValueError on broken pairs instead of guessing.
      - Applies hierarchical elements by parent, not by position among siblings.
      - Leaves out disabled elements and the whole subtree of a disabled controller.
    solution: |
      Pair strictly, collect each level's hierarchical children before its samplers, pass them down.

  - id: jm-arch-order-code
    type: coding
    concept: perf-jm-scope-order
    skill: analysis
    title: Predict the execution order, then check it against JMeter
    prompt: |
      In `exercises/jmeter/jm_arch_order.py`, implement `predict_order(tree)` for a plan with one thread group (one
      thread, one iteration) written as nested tuples. Two tests use the manual's 3.9 example and a hand-worked nested
      tree; two build real plans whose elements log their names (`support/jm_arch_fixture.py`), run them with JMeter
      5.6.3 and compare its order with yours.
    project: perf
    files:
      - exercises/jmeter/jm_arch_order.py
    test: tests/jmeter/test_jm_arch_order.py
    command: .venv/bin/python -m pytest tests/jmeter/test_jm_arch_order.py
    hints:
      - Keep a list of "levels" - the children of the thread group, then of each enclosing controller, then the sampler's own children.
      - Pre-processors, post-processors and assertions go through the levels outermost first; timers innermost first.
      - Refuse anything but a single thread group at the top - the Test Plan level behaves differently.
    modelAnswer: |
      ```python
      def predict_order(tree):
          groups = [n for n in tree if n[0] == "thread-group"]
          if len(groups) != 1 or len(tree) != 1:
              raise ValueError("expected exactly one thread group and nothing else under the Test Plan")
          order = []
          def own(children, kind):
              return [_parts(c)[1] for c in children if c[0] == kind]
          def walk(children, levels):
              levels = levels + [children]
              for child in children:
                  kind, name, grandchildren = _parts(child)
                  if kind == "sampler":
                      scope = levels + [grandchildren]
                      order.extend(n for level in scope for n in own(level, "pre"))
                      order.extend(n for level in reversed(scope) for n in own(level, "timer"))
                      order.append(name)
                      for k in ("post", "assertion"):
                          order.extend(n for level in scope for n in own(level, k))
                  elif kind == "controller":
                      walk(grandchildren, levels)
                  elif kind not in HIERARCHICAL:
                      raise ValueError(f"unsupported kind {kind!r}")
          walk(_parts(groups[0])[2], [])
          return order
      ```

      Within a level the comprehension keeps tree order (the documented rule); the level order is the observed one.
      The real-run tests are what keep this honest - if a future JMeter changes the nested order, they fail.
    rubric:
      - Every test in tests/jmeter/test_jm_arch_order.py passes, including the two real JMeter runs.
      - Produces the manual's 3.9 example exactly.
      - Leaves out elements with no sampler in scope.
      - Explains in a comment which parts of the order are documented and which observed.
    solution: |
      Per sampler - pre (outer first), timers (inner first), sampler, post and assertions (outer first); tree order
      within a level; verified against real runs.

  - id: jm-arch-plan-code
    type: coding
    concept: perf-jm-cli-runs
    skill: application
    title: Complete the SandPay smoke plan and run it in CLI mode
    prompt: |
      `exercises/jmeter/jm_arch_plan.jmx` signs in once per thread and lists payments, but every list call gets 401.
      Add (1) a JSON Extractor as a child of `POST /auth/token` that stores `$.access_token` in `token`, and (2) the
      header `Authorization: Bearer ${token}` in the Header Manager. The tests run the plan with real JMeter against
      the practice API (2 threads, 3 loops), check every list call is 200, check the extractor's parent, and check that
      no sampler hard-codes a domain. You may edit the XML by hand or in the GUI (`tools/apache-jmeter-5.6.3/bin/jmeter
      -t exercises/jmeter/jm_arch_plan.jmx`).
    project: perf
    files:
      - exercises/jmeter/jm_arch_plan.jmx
    test: tests/jmeter/test_jm_arch_plan.py
    command: .venv/bin/python -m pytest tests/jmeter/test_jm_arch_plan.py
    hints:
      - The TODO comments mark both places. An element always needs a <hashTree/> after it.
      - 'JSON Extractor properties: JSONPostProcessor.referenceNames, JSONPostProcessor.jsonPathExprs, JSONPostProcessor.match_numbers, JSONPostProcessor.defaultValues.'
      - 'A header is an elementProp of elementType "Header" with Header.name and Header.value string properties.'
    modelAnswer: |
      ```xml
      <HTTPSamplerProxy guiclass="HttpTestSampleGui" testclass="HTTPSamplerProxy" testname="POST /auth/token" enabled="true">
        ...
      </HTTPSamplerProxy>
      <hashTree>
        <JSONPostProcessor guiclass="JSONPostProcessorGui" testclass="JSONPostProcessor" testname="Extract token" enabled="true">
          <stringProp name="JSONPostProcessor.referenceNames">token</stringProp>
          <stringProp name="JSONPostProcessor.jsonPathExprs">$.access_token</stringProp>
          <stringProp name="JSONPostProcessor.match_numbers">1</stringProp>
          <stringProp name="JSONPostProcessor.defaultValues">NO_TOKEN</stringProp>
        </JSONPostProcessor>
        <hashTree/>
      </hashTree>
      ```

      and in the Header Manager's `HeaderManager.headers`:

      ```xml
      <elementProp name="" elementType="Header">
        <stringProp name="Header.name">Authorization</stringProp>
        <stringProp name="Header.value">Bearer ${token}</stringProp>
      </elementProp>
      ```

      The real CLI run of the solution: `summary = 8 in 00:00:00 ... Err: 0 (0.00%)` - 2 sign-ins and 6 lists, all 200.
    rubric:
      - Every test in tests/jmeter/test_jm_arch_plan.py passes.
      - The extractor is a child of the sign-in sampler, not of the thread group.
      - The token travels in a header from a per-thread variable, not a property.
      - Host and port stay in HTTP Request Defaults and properties; the run uses CLI mode.
    solution: |
      Extractor inside the sign-in sampler's hashTree; Authorization header using ${token}; run with -n and check the
      JTL.

placement:
  - id: jm-arch-place-scope
    type: mcq
    concept: perf-jm-scope-order
    skill: application
    title: Which samples does it check?
    prompt: |
      A Simple Controller "Checkout" contains `POST /v1/payments` and `GET /v1/payments/{id}`. A Response Assertion
      is a child of the Checkout controller. A third sampler, `GET /v1/payments`, is a sibling of the controller.
      Which samples does the assertion check?
    options:
      - id: both-in-controller
        text: POST /v1/payments and GET /v1/payments/{id}
        feedback: Correct - an assertion whose parent is a controller "affects all requests that are descendants of that Controller".
      - id: all-three
        text: All three samplers
        feedback: The list sampler is outside the controller, so it is not in the assertion's scope.
      - id: first-only
        text: Only POST /v1/payments, the first sampler under the controller
        feedback: Hierarchical elements apply to every sampler below their parent, not just the first.
      - id: none
        text: None, because the assertion is not a child of a sampler
        feedback: Assertions under controllers apply to the controller's samplers.
    correct: [both-in-controller]
    hints:
      - Find the assertion's parent.
    solution: |
      The two samplers under Checkout. Scope comes from the parent; position does not matter.

  - id: jm-arch-place-elements
    type: mcq
    concept: perf-jm-elements
    skill: application
    title: Which element, where?
    prompt: |
      Each SandPay merchant signs in once (`POST /auth/token` inside a Once Only Controller) and then calls
      `GET /v1/payments` with the returned token. In the .jmx, what do you add, and inside which `<hashTree>`?
    options:
      - id: extractor-in-sampler
        text: A JSON Extractor (a post-processor), inside the hashTree that follows POST /auth/token
        feedback: Correct - a post-processor extracts from a response, and as the sampler's child it runs after that sampler only.
      - id: extractor-in-tg
        text: A JSON Extractor, inside the thread group's hashTree
        feedback: At thread group level it runs after every sampler and overwrites the token when a response has none.
      - id: pre-in-get
        text: A pre-processor inside the hashTree that follows GET /v1/payments
        feedback: A pre-processor runs before the request; it cannot read the sign-in response.
      - id: header-in-auth
        text: A Header Manager inside the hashTree that follows POST /auth/token
        feedback: A Header Manager adds headers to requests in its scope; it does not read responses, and there it would only affect the sign-in.
    correct: [extractor-in-sampler]
    hints:
      - Which kind of element reads a response, and which hashTree makes an element the child of one sampler?
    solution: |
      A post-processor (JSON Extractor) as the child of the sign-in sampler - inside the hashTree that follows it.

  - id: jm-arch-place-cli
    type: mcq
    concept: perf-jm-cli-runs
    skill: application
    title: Same plan, another environment
    prompt: A plan must run unchanged against a local stub on port 8090 and a staging host on port 443. What is the JMeter way?
    options:
      - id: properties
        text: Put ${__P(host,127.0.0.1)} and ${__P(port,8090)} in HTTP Request Defaults and pass -Jhost=... -Jport=... in CLI mode
        feedback: Correct - the manual's section 3.12 shows this pattern, changed on the command line with -J.
      - id: two-plans
        text: Keep two copies of the .jmx, one per environment
        feedback: Two copies drift apart; properties keep one plan.
      - id: edit-samplers
        text: Edit the host in every HTTP Request before each run
        feedback: That is what HTTP Request Defaults and properties exist to avoid.
      - id: variables
        text: Set the host in a JSON Extractor at the start of the run
        feedback: Extractors read responses; run settings come from properties.
    correct: [properties]
    hints:
      - Which option sets a JMeter property from the command line?
    solution: |
      Properties read with ${__P(name,default)} in HTTP Request Defaults, set with -J at run time.

recall:
  - id: jm-arch-recall-minimal
    concept: perf-jm-elements
    prompt: What is the minimal JMeter test plan?
    answer: The Test Plan, a Thread Group and one or more Samplers.
  - id: jm-arch-recall-hashtree
    concept: perf-jm-elements
    prompt: How does a .jmx file store an element's children?
    answer: In the <hashTree> that immediately follows the element; inside any hashTree the children come in (element, hashTree) pairs.
  - id: jm-arch-recall-hierarchical
    concept: perf-jm-scope-order
    prompt: Which elements are hierarchical, and how does their scope work?
    answer: Config elements, pre-processors, post-processors, timers, assertions and listeners. They apply to their parent sampler, or to every sampler under their parent controller or thread group, whatever their position among siblings.
  - id: jm-arch-recall-order
    concept: perf-jm-scope-order
    prompt: The per-sampler execution order?
    answer: Configuration elements, pre-processors, timers, the sampler, post-processors, assertions, listeners - tree order within a type; nothing hierarchical runs without a sampler in scope.
  - id: jm-arch-recall-cli
    concept: perf-jm-cli-runs
    prompt: What do -n, -t, -l, -j, -J, -e and -o do?
    answer: CLI mode; the test plan; the samples file (JTL); the run log; set a JMeter property; generate the dashboard after the run; the dashboard output folder (must not exist or be empty).
  - id: jm-arch-recall-gui
    concept: perf-jm-cli-runs
    prompt: What is the GUI for?
    answer: Building and debugging plans. Load tests run in CLI mode - "Don't run load test using GUI mode !"

