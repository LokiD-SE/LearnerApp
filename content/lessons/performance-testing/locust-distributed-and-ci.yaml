  - id: steps-order
    type: order
    concept: perf-lcdist-gate
    skill: application
    title: One distributed step, in order
    prompt: Put the life of a headless distributed Locust step in the order it happens.
    items:
      - id: master
        text: 'The master starts with --expect-workers 2, bound to 127.0.0.1'
      - id: workers
        text: 'Two workers connect to 127.0.0.1 and report ready'
      - id: spawn
        text: 'The master spawns the users on the workers'
      - id: limit
        text: 'The run time limit is reached and the master tells the workers to quit'
      - id: gate
        text: 'The quitting listener on the master reads the merged statistics and sets process_exit_code'
      - id: exit
        text: 'The master exits with that code and the pipeline step passes or fails'
    hints:
      - The gate needs the merged statistics, so it comes after the run.
    solution: |
      Master, workers ready, spawn, time limit, gate, exit. The test starts only after the expected workers have
      connected; the verdict is taken once the run has ended.

  - id: gate-debug
    type: debug
    concept: perf-lcdist-gate
    skill: analysis
    title: Four defects in one gate
    prompt: |
      This listener is meant to fail a pipeline when more than 1 % of requests failed or the 95th percentile is
      over 800 ms, in a cluster. Click every line that is a defect.
    language: python
    code: |
      @events.quitting.add_listener
      def gate(environment, **_):
          total = environment.stats.total
          avg = total.avg_response_time
          if total.fail_ratio > 0.01 and avg > 800:
              environment.process_exit_code = 1
          logging.error("gate failed")
    correctLines: [3, 4, 5, 7]
    lineNotes:
      - line: 3
        note: No worker guard - the listener runs in every process, and a worker's statistics are not the cluster's. Return first when `isinstance(environment.runner, WorkerRunner)`.
      - line: 4
        note: The average hides the slow tail; the rule is about the 95th percentile (`get_response_time_percentile(0.95)`).
      - line: 5
        note: '`and` fails the run only when both limits are broken; either one should fail it.'
      - line: 7
        note: Logged on every run, passing or not, and with no reason. Log inside the failing branch and say which limit and by how much.
    hints:
      - There is one missing guard, one wrong statistic, one wrong operator and one misplaced message.
    solution: |
      Guard against workers (line 3), use the 95th percentile (line 4), `or` instead of `and` (line 5), and log the
      reason only when a limit is broken (line 7).

  - id: merge-short
    type: short
    concept: perf-lcdist-merge
    skill: analysis
    title: Can you get the cluster p95 from the workers' p95s?
    prompt: |
      Two workers report a 95th percentile of 120 ms (900 requests) and 30 ms (100 requests). A colleague says "so the
      cluster's p95 is about 111 ms - the request-weighted average". Is that right? What can you say for certain, and
      what do you need to get the real figure?
    modelAnswer: |
      No. A percentile is not additive, so a weighted average of percentiles is not the percentile of the combined
      requests. From the two figures alone you can bound it but not find it: at most 5 % of each worker's requests are
      slower than its p95, so at most 45 + 5 = 50 of the 1,000 requests are slower than 120 ms, which puts the
      cluster's p95 at or below 120 ms - but where, depends on how the two workers' times are spread. (If worker 1's
      slow requests were just 45 outliers and everything else was fast, the cluster's p95 could be as low as 30 ms.)
      To get the real figure you need the response-time histograms (or the raw times) from both workers: add them
      bucket by bucket and read the percentile from the sum, as the master does - or use the master's own output.
    rubric:
      - Says the weighted average is not valid, because percentiles cannot be averaged.
      - Gives at most a bound, not a value, from the two figures alone.
      - Asks for the histograms (or raw times), merges them and reads the percentile from the sum.
    hints:
      - What would you need to know about the shape of each worker's results?
    solution: |
      Not valid. Merge the workers' histograms and read the percentile from the sum (or use the master's output).

  - id: nightly-testdesign
    type: testdesign
    concept: perf-lcdist-gate
    skill: application
    title: Design the nightly distributed step
    prompt: |
      SandPay wants a nightly load test of `POST /v1/payments` on a 4-core CI runner, run with Locust, failing the
      pipeline when more than 0.5 % of requests fail or the 95th percentile exceeds 800 ms. Design the cluster command
      lines, the gate, the limits that make the step end by itself, and how you will show the gate works.
    modelAnswer: |
      **Cluster.** One machine, so `locust --headless --processes 4`: master and four workers (one per core), bound to
      `127.0.0.1` (`--master-bind-host 127.0.0.1`), a free port repeated as `--master-bind-port` and `--master-port`,
      `-u`, `-r` and `-t` on the command line once, `--expect-workers-max-wait 60`, `--csv` and `--json-file` with
      a run folder for artifacts, `--only-summary`.

      **Data.** Idempotency keys and references from `uuid4()`; no module-level counters; test data split per worker if
      records must not repeat.

      **Gate.** A `quitting` listener that returns on a `WorkerRunner`, reads `fail_ratio` and
      `get_response_time_percentile(0.95)` from `environment.stats.total`, compares them with
      `LC_GATE_MAX_FAIL_RATIO=0.005` and `LC_GATE_P95_MS=800` from the workflow file, logs each broken limit with the
      measured value, and sets `process_exit_code` to 1 or 0.

      **Limits.** `-t 10m`, the worker wait limit and `timeout-minutes` on the job.

      **Proof.** Unit-test the verdict function on edge values (a limit exactly met passes); run the step once with
      `LC_GATE_P95_MS=1` to see exit 1 and the reason, and once against a target configured to fail half the
      payments; check the workers exit 0 and never log "gate failed"; compare the master's JSON total with the
      sum of the target's own counters. Keep the artifacts.

      | Check | Expected | Evidence |
      | --- | --- | --- |
      | limits met | exit 0 | pipeline step green |
      | p95 limit 1 ms | exit 1, "95th percentile ... > 1.0 ms" | master log |
      | half the payments fail | exit 1, "failure ratio ... > 0.005" | master log |
      | a worker started late | the master still waits, within the limit | log |
      | a worker never starts | exit 1 after the wait limit | "Gave up waiting for workers" |
    rubric:
      - Uses one worker per core, bound to loopback, with the port repeated for --processes.
      - Puts -u, -r and -t on the master and sets a worker wait limit and a job timeout.
      - Writes the gate on the master only, with thresholds from the environment and reasons in the log.
      - Makes ids unique across workers.
      - Shows the gate can fail, and keeps the results files.
    hints:
      - What can wait for ever? What must the gate not run on?
      - How do you show a gate can fail?
    solution: |
      `--processes 4` on loopback with the port repeated, `-t` and a worker wait limit and a job timeout, a master-only
      gate with environment thresholds, unique ids, a deliberate failing run, and kept artifacts.

  - id: pipeline-interview
    type: interview
    concept: perf-lcdist-cluster
    skill: analysis
    title: 'Interview: running Locust at scale in a pipeline'
    prompt: |
      "Our Locust test can't generate enough load from one process and we want it in the nightly pipeline. How would you
      scale it, and how would you make the pipeline fail for the right reasons?"
    modelAnswer: |
      First I'd confirm the generator really is the limit: Locust logs a warning when it is close to running out of CPU,
      and a single Python process uses about one core. If it is, I'd distribute: one master (no users) and one worker per
      core. On one machine that is `--processes N`, which forks the workers; across machines it is `--master` and
      `--worker --master-host ...` with the locustfile on each. The master gets `-u`, `-r` and `-t`, and in a headless run
      `--expect-workers`, plus `--expect-workers-max-wait` so a missing worker fails the step instead of hanging it.

      I'd bind the master to loopback (or a private address) because the default is every interface, use a free port per
      run, and repeat a custom bind port as `--master-port` for `--processes`. In the locustfile, identifiers come from
      `uuid4()` or the worker index, because every worker is its own process and module-level counters repeat.

      For the verdict I'd rely on the master's exit code. Locust's default is 1 on any failed request; for a real
      service I'd write a `quitting` listener that sets `environment.process_exit_code` from the failure ratio and the 95th
      percentile, thresholds from the environment, a log line with the reason, and an early return on a worker, since only the
      master has the merged numbers. Percentiles come from the merged histogram, never an average of the workers'.

      Last, three timeouts (the test, the worker wait, the CI job), the master's CSV and JSON kept as artifacts, a heavy
      run on a schedule rather than every pull request, and a deliberate failing run to prove the gate. And of course only
      against systems we own or have permission to test.
    rubric:
      - Checks the generator is the limit before distributing, and sizes workers by cores.
      - Names the master and worker roles and --expect-workers / --processes, with the master-only options.
      - Handles the wait for workers, the loopback bind and the unique-id problem.
      - Gates on the master's exit code with a quitting listener, ignoring workers, with percentiles from the merged data.
      - Adds time limits, keeps artifacts and shows the gate can fail.
    followUps:
      - What would you look at if the 95th percentile doubled in the gate but the dashboards show nothing wrong?
      - How would you keep the pull-request check fast and stable?
      - What changes when the workers run on other machines?
    hints:
      - Start with whether the generator is the bottleneck.
    solution: |
      Check the generator, distribute with one worker per core, wait for workers with a limit, bind to loopback,
      unique ids, a master-only gate on merged numbers, three timeouts, artifacts, and a gate proven to fail.

  - id: commands-code
    type: coding
    concept: perf-lcdist-cluster
    skill: application
    title: Command lines for a loopback cluster
    prompt: |
      Complete `locust/lc_dist_commands.py`. Four functions: `master_command`, `worker_command` and `processes_command`
      return Locust argument lists for a headless distributed run that lives entirely on `127.0.0.1`, and `audit` reads
      a command line and returns the list of problems (`master-not-loopback`, `worker-master-not-loopback`,
      `no-expect-workers`, `port-mismatch`, `no-run-time`). The docstrings give the exact flags. The tests check
      every flag, the `ValueError` cases, a table of command lines for the audit, and then start **real clusters** - a
      master with two workers, and the `--processes` form - with your command lines.
    project: perf
    files:
      - exercises/locust/lc_dist_commands.py
    test: tests/locust/test_lc_dist_commands.py
    command: .venv/bin/python -m pytest tests/locust/test_lc_dist_commands.py
    modelAnswer: |
      See "The code: command lines for a loopback cluster". What the tests rely on:

      - `--master-bind-host 127.0.0.1`, `--expect-workers N` and `-u -r -t --host --csv --json-file --only-summary` on
        the master; `--master-host 127.0.0.1 --master-port P` on a worker.
      - For `--processes`, `--master-bind-port P` **and** `--master-port P`.
      - `ValueError` for `workers < 1`, `users < workers`, `spawn_rate <= 0`, an empty or `"0"` run time and a port
        outside 1024-65535.
      - `audit()` reads flag values by position; a missing `--master-port` means 5557.

      A cluster built from these runs to exit code 0 with exactly one login per user in the master's JSON.
    rubric:
      - Every test in tests/locust/test_lc_dist_commands.py passes
      - The master and the workers use loopback addresses only
      - The one-command form repeats the bind port as --master-port
      - audit() returns exactly the listed problem ids, in order
    hints:
      - 'Build the list from the docstring and convert every number to str.'
      - 'For audit, write a small helper that returns the value after a flag.'
      - 'With --processes and no --worker, the process is the master.'
    solution: |
      Return the argument lists given in the docstrings, validate the inputs, and write `audit()` as five independent
      checks.

  - id: merge-code
    type: coding
    concept: perf-lcdist-merge
    skill: analysis
    title: Merge the workers' statistics
    prompt: |
      Complete `locust/lc_dist_merge.py`: `percentile` (Locust's own algorithm), `merge_entries` and `merge_workers` (add
      the workers' statistics), `naive_percentile` (the mistake: the mean of the workers' percentiles) and
      `even_split`. The tests use the **real per-worker statistics of a two-worker run** and require your merge to equal
      the master's own totals and percentiles exactly, and the naive mean to be at least 30 ms below the true value.
    project: perf
    files:
      - exercises/locust/lc_dist_merge.py
    test: tests/locust/test_lc_dist_merge.py
    command: .venv/bin/python -m pytest tests/locust/test_lc_dist_merge.py
    modelAnswer: |
      See "The code: merging statistics and the gate". The details the tests check:

      - `percentile` walks the buckets from the slowest down and returns the bucket where the allowance
        `int(num_requests * fraction)` is used up; keys may be strings.
      - `merge_entries` sums counts and totals, takes the smallest minimum (ignoring `None`) and the largest maximum, and
        adds histograms key by key; the input is not modified.
      - `naive_percentile` merges each worker's entries first and takes one percentile per worker, then the plain mean.
      - `even_split(10, 3) == [4, 3, 3]`.

      On the captured run: merged p95 100 ms against a naive 53.0 ms.
    rubric:
      - Every test in tests/locust/test_lc_dist_merge.py passes
      - Histograms are added bucket by bucket, never averaged
      - The percentile uses Locust's algorithm and accepts string keys
      - The input data is not modified
    hints:
      - 'Convert the histogram keys with int() first; they are strings when they come from JSON.'
      - 'For the minimum, skip None before comparing.'
      - 'divmod(total, workers) gives the base size and how many workers get one more.'
    solution: |
      Copy Locust's loop for `percentile`, add counts and histograms for `merge_entries`, group by name for
      `merge_workers`, and use `divmod` for `even_split`.

  - id: gate-code
    type: coding
    concept: perf-lcdist-gate
    skill: application
    title: A pipeline gate for a cluster
    prompt: |
      Complete `locust/lc_dist_gate_locustfile.py` (the `Prober` user is given): `verdict` turns a failure ratio and a
      95th percentile into an exit code and reasons, and the `gate` listener applies it on the master, with limits from
      `LC_GATE_MAX_FAIL_RATIO` and `LC_GATE_P95_MS`, and does nothing on a worker. The tests run **real clusters** (a master
      and two workers on loopback): inside the limits it must exit 0; a 20 ms p95 limit or a half-failing target must
      make the master exit 1 with the reason in its log; and the workers must exit 0 and stay silent.
    project: perf
    files:
      - exercises/locust/lc_dist_gate_locustfile.py
    test: tests/locust/test_lc_dist_gate.py
    command: .venv/bin/python -m pytest tests/locust/test_lc_dist_gate.py
    modelAnswer: |
      See "The code: merging statistics and the gate". The details the tests check:

      - `verdict` returns `(1, reasons)` when a limit is *exceeded* (a limit exactly reached passes) and `(0, [])`
        otherwise, with the exact reason texts from the docstring.
      - The listener returns at once when `isinstance(environment.runner, WorkerRunner)`, so workers neither gate nor log.
      - It reads `environment.stats.total.fail_ratio` and `get_response_time_percentile(0.95)`, logs each reason with
        `logging.error("gate failed: %s", ...)` and sets `environment.process_exit_code`.
      - The tests start the master with `--exit-code-on-error 0`, so only your listener can make the exit code 1.
    rubric:
      - Every test in tests/locust/test_lc_dist_gate.py passes
      - The listener does nothing on a worker
      - Thresholds come from the environment with the documented defaults
      - Each broken limit is logged with the measured value and the limit
    hints:
      - 'isinstance(environment.runner, WorkerRunner) is the guard; return before reading any statistics.'
      - 'os.environ.get("LC_GATE_P95_MS", "800") gives a string - convert it with float().'
      - 'Format the ratio with f"{fail_ratio:.4f}" to match the expected reason text.'
    solution: |
      Guard on `WorkerRunner`, read the totals, call `verdict`, log the reasons and set `process_exit_code`.

placement:
  - id: place-bind
    type: mcq
    concept: perf-lcdist-cluster
    skill: application
    title: Starting a master safely
    prompt: |
      You are about to start a distributed Locust run on a shared CI machine and want the master reachable only from
      that machine. Which flag do you add to the master, and what do the workers connect to?
    options:
      - id: bind
        text: '`--master-bind-host 127.0.0.1` on the master; `--master-host 127.0.0.1` on the workers'
        feedback: 'Correct - the default bind is every interface.'
      - id: expect
        text: '`--expect-workers 127.0.0.1`'
        feedback: '--expect-workers takes a number of workers, not an address.'
      - id: headless
        text: '`--headless`, which keeps everything local'
        feedback: '--headless only turns the web UI off; the master port still listens on every interface.'
      - id: nothing
        text: 'Nothing - Locust only listens on loopback'
        feedback: 'The documented default is `*`, all interfaces.'
    correct: [bind]
    solution: |
      Bind the master to `127.0.0.1` and point the workers at `127.0.0.1`.

  - id: place-percentile
    type: mcq
    concept: perf-lcdist-merge
    skill: application
    title: The cluster's percentile
    prompt: Worker A's 95th percentile is 20 ms, worker B's is 300 ms. How do you get the cluster's 95th percentile?
    options:
      - id: histograms
        text: 'Add their response-time histograms and read the percentile from the sum, or take the master''s figure'
        feedback: 'Correct - histograms add; percentiles do not.'
      - id: mean
        text: 'Average the two: 160 ms'
        feedback: 'An average of percentiles describes no request.'
      - id: sum
        text: 'Add them: 320 ms'
        feedback: 'Percentiles are values, not amounts; adding them means nothing.'
      - id: median
        text: 'Take the median of the two: also 160 ms'
        feedback: 'Same problem - it ignores how many requests each worker ran.'
    correct: [histograms]
    solution: |
      Merge the histograms, or use the master's own result.

  - id: place-gate
    type: mcq
    concept: perf-lcdist-gate
    skill: analysis
    title: Green for the wrong reason
    prompt: |
      A distributed pipeline step passes every night, although the system's 95th percentile has doubled. The gate is a
      `quitting` listener that checks the 95th percentile and sets `process_exit_code`. Which cause is most likely?
    options:
      - id: worker
        text: 'The listener also runs on the workers, whose last statistics are empty, and sets exit code 0 there - while nothing checks the master, or the master''s code is never read'
        feedback: 'Correct - a gate must judge the master''s merged statistics and the master''s exit code; a worker''s numbers and code are not the cluster''s.'
      - id: percentile
        text: 'Locust cannot compute a 95th percentile in a cluster'
        feedback: 'It can - it merges the histograms.'
      - id: users
        text: 'Too many users'
        feedback: 'More users would make the percentile worse, not hide it.'
      - id: csv
        text: 'The CSV files lag by a second'
        feedback: 'A one-second lag changes a count slightly; it cannot hide a doubled percentile.'
    correct: [worker]
    solution: |
      The gate is looking at the wrong process's numbers or exit code. Gate on the master.

recall:
  - id: recall-roles
    concept: perf-lcdist-cluster
    prompt: What do the master and the workers do in a distributed Locust run?
    answer: The master runs no users - it tells workers when to spawn and stop users and merges their statistics. Workers run the users and report. -u, -r and -t go on the master only.
  - id: recall-cores
    concept: perf-lcdist-cluster
    prompt: How many workers, and what is the warning to watch?
    answer: About one per core of the load-generating machine (a Python process uses about one core). Locust logs a warning when it is close to running out of CPU - then the generator is the limit, not the system under test.
  - id: recall-headless
    concept: perf-lcdist-cluster
    prompt: The options for a headless cluster that cannot hang?
    answer: --master --expect-workers N with --expect-workers-max-wait (default is wait forever), -t for the test, a CI job timeout; or --processes N (repeat a custom --master-bind-port as --master-port).
  - id: recall-bind
    concept: perf-lcdist-cluster
    prompt: What is the master's default bind, and what do you do about it?
    answer: --master-bind-host defaults to * (all interfaces). Bind to 127.0.0.1 (or a private address) and connect workers with --master-host 127.0.0.1.
  - id: recall-merge
    concept: perf-lcdist-merge
    prompt: What does the master add up, and what must you never average?
    answer: Counts, totals, min and max, and the response-time histograms (bucket by bucket). Percentiles are read from the merged histogram; never average, add or take the max of the workers' percentiles.
  - id: recall-process
    concept: perf-lcdist-merge
    prompt: Why do module-level counters break in a cluster?
    answer: Every worker is its own process with its own copy, so a counter starting at 1 repeats in every worker. Use uuid4() or the worker index for unique ids.
  - id: recall-exit
    concept: perf-lcdist-gate
    prompt: How does Locust pick its exit code, and how do you set your own?
    answer: environment.process_exit_code if set; else --exit-code-on-error (default 1) when there were failures; else 0. Set it in a quitting listener.
  - id: recall-gate
    concept: perf-lcdist-gate
    prompt: Where must a cluster gate run, and what proves it works?
    answer: On the master only (return on a WorkerRunner), because only the master has the merged statistics and the pipeline reads its exit code. A run against a limit known to be broken proves it - a gate that never failed is untested.

