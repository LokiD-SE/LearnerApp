placement:
  - id: place-retry-key
    type: mcq
    concept: idempotent-operations
    skill: application
    title: Making the retry safe
    prompt: |
      A mobile app's `POST /v1/payments` timed out and the app is about to retry. What must be true for the retry
      to be safe?
    options:
      - id: same-key
        text: It sends the same idempotency key as the first attempt.
        feedback: Correct - the same key lets the server recognise the retry and replay the first result.
      - id: new-key
        text: It sends a new idempotency key so the server doesn't confuse the two.
        feedback: A new key makes the retry a new payment - exactly what causes double charges.
      - id: wait
        text: It waits at least ten seconds before retrying.
        feedback: Waiting helps a struggling server, but it doesn't stop a second charge.
      - id: put
        text: It switches the request from POST to PUT.
        feedback: Changing the method doesn't make the server recognise a repeat; the API has to support it.
    correct: [same-key]
    solution: |
      **Same key.** A timeout is an unknown outcome; only the same key lets the server tell a retry from a new
      payment.

  - id: place-key-reuse
    type: mcq
    concept: idempotency-key-contract
    skill: application
    title: Same key, different amount
    prompt: |
      A request arrives with a key the server has already completed, but with a different amount. What should a
      well-designed API do?
    options:
      - id: reject
        text: Reject it without processing, and leave the original payment unchanged.
        feedback: Correct - the key was reused for a different request (the IETF draft suggests 422).
      - id: replay
        text: Replay the stored response of the original request.
        feedback: That tells the client a different payment succeeded - a silent, misleading answer.
      - id: new
        text: Process it as a new payment.
        feedback: Then the key protects nothing - any reuse becomes a second charge.
      - id: update
        text: Update the original payment to the new amount.
        feedback: An idempotency key identifies one operation; it must never change a completed payment.
    correct: [reject]
    solution: |
      **Reject it.** Compare the request fingerprint with the stored one; a mismatch is a client error, with no
      side effects.

  - id: place-same-key-dupes
    type: mcq
    concept: duplicate-payment-diagnosis
    skill: analysis
    title: Two charges, one key
    prompt: |
      A customer was charged twice. Both requests carried the **same** idempotency key, 3 ms apart. Which layer do
      you investigate first?
    options:
      - id: server
        text: The server's idempotency handling - for example a check-then-insert race
        feedback: Correct - with identical keys, the server should have recognised the second request.
      - id: client
        text: The client's retry logic
        feedback: The client sent the same key, which is what it should do. The server failed to use it.
      - id: network
        text: The card network
        feedback: The network received two authorisations because the server sent two.
      - id: bank
        text: The customer's bank
        feedback: The bank processed two separate authorisations it was sent.
    correct: [server]
    solution: |
      **The server.** Same key, two charges means the key wasn't reserved atomically before charging (or the
      processor was called twice without a downstream reference).
