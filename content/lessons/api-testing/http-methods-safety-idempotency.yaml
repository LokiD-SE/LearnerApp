placement:
  - id: place-unsafe-get
    type: mcq
    concept: safe-methods
    skill: application
    title: Which design is a problem?
    prompt: |
      Which of these endpoints breaks HTTP method semantics in a way that can cause unintended side effects?
    options:
      - id: read
        text: "`GET /v1/orders/123` - read an order"
        feedback: A read with GET is exactly what GET is for.
      - id: filter
        text: "`GET /v1/orders?status=open` - list open orders"
        feedback: Filtering a list with query parameters is a normal, safe read.
      - id: cancel
        text: "`GET /v1/orders/123/cancel` - cancel the order"
        feedback: Correct - GET promises no change, yet this cancels the order. Prefetchers, link scanners and crawlers can trigger it.
      - id: head
        text: "`HEAD /v1/orders/123` - check the order exists"
        feedback: HEAD is safe - it returns only headers.
    correct: [cancel]
    solution: |
      **`GET /v1/orders/123/cancel`.** A state change behind a safe method can be triggered by software that
      follows or prefetches links. Cancelling should be a `POST` (or `DELETE`) from an authenticated action.

  - id: place-delete-twice
    type: mcq
    concept: idempotent-methods
    skill: application
    title: Is this DELETE idempotent?
    prompt: |
      `DELETE /v1/customers/cus_12/cards/card_9` returns `204` the first time and `404` when repeated. Is the API
      keeping the idempotency promise?
    options:
      - id: yes
        text: Yes - the final state is the same; only the response differs.
        feedback: Correct - idempotency is about the effect. The card is removed either way.
      - id: no-responses
        text: No - an idempotent method must return the same response every time.
        feedback: Idempotency promises the same effect, not the same response.
      - id: no-204
        text: No - DELETE must always return 204.
        feedback: Either 204 or 404 for the repeat is compatible with idempotency; the API's documentation decides.
      - id: only-410
        text: Only if the repeat returns 410 Gone.
        feedback: 410 is one possible answer, but not required. The effect is what matters.
    correct: [yes]
    solution: |
      **Yes.** The card ends up removed whether the request runs once or twice. A different status code on the
      repeat is fine - test that it matches the documentation.
