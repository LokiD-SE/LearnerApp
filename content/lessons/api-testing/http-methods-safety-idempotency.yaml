id: http-methods-safety-idempotency
title: HTTP methods - safety and idempotency
subject: api-testing
module: api-foundations
level: beginner
status: published
estimatedMinutes: 35
summary: Which methods are safe, which are idempotent, what that promises, and why it decides what may be retried, prefetched or cached.
tags: [http, methods, get, post, put, patch, delete, safe, idempotent, retries]

environment: |
  - **Standards:** method semantics come from **RFC 9110** (HTTP Semantics): safe methods in section
    9.2.1, idempotent methods in 9.2.2, cacheable methods in 9.2.3. `PATCH` is defined separately in
    **RFC 5789**.
  - **What the standard does and doesn't guarantee:** the RFC defines what each method *promises*. Whether
    a particular API keeps that promise is exactly what you test.
  - **Examples:** SandPay (`https://api.sandpay.example`) is fictional. The `example.com` responses in the
    code section are real curl 8.5.0 output captured on 2026-10-29; a public site can change its behaviour.
  - **Sources:**
    - [RFC 9110 - HTTP Semantics](https://www.rfc-editor.org/rfc/rfc9110.html): safe (9.2.1), idempotent and the
      client retry rule (9.2.2), caching (9.2.3), HEAD (9.3.2), OPTIONS (9.3.7), TRACE (9.3.8), `Allow`
      (10.2.1) and 405 (15.5.6)
    - [RFC 5789 - PATCH Method for HTTP](https://www.rfc-editor.org/rfc/rfc5789.html), section 2: "PATCH is
      neither safe nor idempotent", but a PATCH "can be issued in such a way as to be idempotent"
    - [curl man page](https://curl.se/docs/manpage.html): `-I` (HEAD), `-X`, `-i`

prerequisites:
  - http-request-response-anatomy

concepts:
  - id: safe-methods
    name: Safe methods
    summary: Methods that only ask to read - GET, HEAD, OPTIONS, TRACE - must not change server state.
  - id: idempotent-methods
    name: Idempotent methods
    summary: Repeating the request leaves the server in the same state as sending it once - PUT, DELETE and the safe methods.

objectives:
  - List the safe and the idempotent methods and explain what each property promises.
  - Explain why method semantics decide what clients, proxies and crawlers may retry or repeat on their own.
  - Spot an API design that breaks method semantics, and explain the risk it creates.
  - Write tests that check an API keeps the promises its methods make.

sections:
  - id: intuition
    kind: intuition
    concepts: [safe-methods, idempotent-methods]
    title: The idea in plain language
    body: |
      **Looking at a shop window** is *safe*: you can look a hundred times and nothing in the shop
      changes. That is `GET`.

      **Setting your thermostat to 21 °C** is *idempotent*: pressing "set to 21" twice leaves the room at
      21, exactly as pressing it once. That is `PUT` - "make it exactly this".

      **Pressing "add a coffee to my order"** is neither: press it twice and you get two coffees. That is
      `POST`.

      Software all over the internet - browsers, proxies, retry libraries, search crawlers - relies on
      these promises to decide what it may repeat **without asking you**. An API that breaks them gets
      surprising, sometimes expensive, side effects.

  - id: what
    kind: what
    concepts: [safe-methods, idempotent-methods]
    title: What each method promises
    body: |
      | Method | Typical use | Safe | Idempotent | Request body |
      |---|---|---|---|---|
      | `GET` | read a resource | yes | yes | normally none |
      | `HEAD` | like `GET`, but headers only - no response body | yes | yes | none |
      | `OPTIONS` | ask what is allowed (used by browsers for CORS preflight) | yes | yes | rare |
      | `TRACE` | echo the request back (diagnostic, usually disabled) | yes | yes | none |
      | `PUT` | create or **replace** a resource at a known URL | no | **yes** | the full new representation |
      | `DELETE` | remove a resource | no | **yes** | rare |
      | `POST` | process data - typically create something new | no | **no** | yes |
      | `PATCH` | apply a **partial** change | no | **no** (not by definition) | the change |

      - **Safe** = the client asks for no change of state. The server may still log, count or cache - what
        matters is that the *client* requested nothing to change.
      - **Idempotent** = the *intended effect* of N identical requests equals the effect of one. Every safe
        method is idempotent; `PUT` and `DELETE` are idempotent without being safe.
      - **Responses can differ while the effect is the same:** a second `DELETE` may return `404` instead
        of `204` - the resource is gone either way.

  - id: why
    kind: why
    concepts: [safe-methods, idempotent-methods]
    title: Why the promises matter
    body: |
      Other software acts on these promises **automatically**:

      - **Retries.** RFC 9110 section 9.2.2: "A client SHOULD NOT automatically retry a request with a
        non-idempotent method unless it has some means to know that the request semantics are actually
        idempotent, regardless of the method, or some means to detect that the original request was never
        applied." HTTP libraries and proxies may retry an
        idempotent request after a dropped connection.
      - **Prefetching and link scanners.** Browsers can prefetch links, and email security products
        often "visit" every link in a message to check it. If a `GET` link performs an action - cancel
        an order, refund a payment - the action happens without anyone clicking.
      - **Caching.** `GET` (and `HEAD`) responses may be stored and reused by caches. (RFC 9110 also
        defines caching for `POST`, but notes that "the overwhelming majority of cache implementations
        only support GET and HEAD".) A `GET` that
        changes state may be answered from a cache and never reach the server, or reach it twice.

      For payments, the method decides whether a retry is harmless or a second charge. That is why
      `POST /payments` needs an extra mechanism - idempotency keys - which the next lessons cover.

  - id: internals
    kind: internals
    concepts: [idempotent-methods]
    title: How it works - "the same effect", precisely
    body: |
      **`PUT` is idempotent because it says *what the result should be*.** `PUT /v1/customers/cus_12`
      with the full profile means "the customer must look exactly like this". Sending it again changes
      nothing more.

      **`PATCH` depends on the patch.** `{"email": "a@example.com"}` (set a value) gives the same result
      every time. `{"loyalty_points": "+50"}` (apply a change) adds 50 more on every repeat. The method
      doesn't promise either - the API's design does, and its documentation should say.

      **`POST` creates or processes.** Two identical `POST /v1/payments` requests are two payment
      requests as far as HTTP is concerned. Only the API can recognise a repeat, for example with an
      idempotency key.

      **Idempotent is not the same as "returns the same response".** The first `DELETE` might return
      `204 No Content` and the second `404 Not Found`; both are compatible with idempotency. An API that
      returns `204` both times is fine too - check what the contract says.

  - id: when
    kind: when
    concepts: [safe-methods, idempotent-methods]
    title: When to use which method - a tester's checklist
    body: |
      When you review or test an API, ask for every endpoint:

      - **Does a `GET` change anything?** If yes, it's a design defect - whatever it changes can be
        triggered by prefetchers, scanners, caches and retries.
      - **Is a `PUT` really a full replacement?** If sending it twice adds or duplicates something, it
        isn't idempotent and clients that retry it will cause damage.
      - **Is a `PATCH` idempotent?** If it applies increments or appends, the documentation must say so,
        and clients must not auto-retry it.
      - **Does a `POST` that creates money movement (payments, refunds, payouts) have duplicate
        protection?** If not, every network retry is a risk.

  - id: visual
    kind: visual
    concepts: [idempotent-methods]
    title: "Flowchart: may this request be repeated automatically?"
    body: |
      ```mermaid
      flowchart TD
          A[Connection dropped before a response] --> B{Is the method safe?}
          B -- Yes --> R[Repeating is harmless]
          B -- No --> C{Is the method idempotent?}
          C -->|Yes - PUT or DELETE| R2[Repeating gives the same final state]
          C -->|No - POST or PATCH| D{Does the API recognise repeats, for example with an idempotency key?}
          D -- Yes --> R3[Repeat with the same key]
          D -- No --> X[Do not repeat blindly - check the outcome first]
      ```

  - id: example
    kind: example
    concepts: [safe-methods]
    title: "Real-world example: the refund link in an email"
    body: |
      A back-office tool emails support agents a link for each refund request:
      `https://backoffice.example/refunds/approve?id=rf_301` - a plain `GET`.

      The company's email security service checks every incoming link by fetching it. Each fetch is a
      `GET`, and each `GET` approves a refund. Refunds start being approved minutes after they are
      requested, before any agent has seen them.

      Evidence the tester collects: access logs showing the approval requests coming from the scanner's
      addresses and user agent, timestamps before any agent login, and the audit trail of the refunds.
      **Root cause:** a state-changing action on a safe method. **Fix:** the link opens a page; approval
      is a `POST` from that page, with the agent authenticated.

  - id: code
    kind: code
    concepts: [idempotent-methods]
    title: Checking method behaviour with curl
    collapsed: true
    body: |
      `PUT` twice - the second must not change anything further:

      ```bash
      curl -i -X PUT "https://api.sandpay.example/v1/customers/cus_12" \
        -H "Authorization: Bearer $SANDPAY_KEY" \
        -H "Content-Type: application/json" \
        -d '{"name": "Asha Rao", "email": "asha@example.com"}'
      # run the same command again, then GET the customer and compare
      ```

      `DELETE` twice - note both status codes, then check the resource is gone:

      ```bash
      curl -i -X DELETE "https://api.sandpay.example/v1/customers/cus_12/cards/card_9" \
        -H "Authorization: Bearer $SANDPAY_KEY"
      ```

      `HEAD` - only the headers come back, which should match what `GET` returns:

      ```bash
      curl -I "https://api.sandpay.example/v1/payments/pay_81Fz" -H "Authorization: Bearer $SANDPAY_KEY"
      ```

      `OPTIONS` - which methods does the server say it allows here? (Look for an `Allow` header; APIs
      differ in whether they answer `OPTIONS` at all.)

      ```bash
      curl -i -X OPTIONS "https://api.sandpay.example/v1/payments" -H "Authorization: Bearer $SANDPAY_KEY"
      ```

      **A real server, checked against the standard.** The same checks against `https://example.com/`
      (curl 8.5.0, 2026-10-29; `Date`, `Age` and Cloudflare's own headers left out). `HEAD` answers with the headers only:

      ```plaintext
      $ curl -sI --http1.1 https://example.com/
      HTTP/1.1 200 OK
      Content-Type: text/html; charset=utf-8
      Connection: keep-alive
      Server: cloudflare
      last-modified: Sat, 24 Oct 2026 20:05:47 GMT
      allow: GET, HEAD
      Accept-Ranges: bytes
      ```

      `DELETE` (and `OPTIONS`) are refused:

      ```plaintext
      $ curl -s -i --http1.1 -X DELETE https://example.com/
      HTTP/1.1 405 Method Not Allowed
      Content-Type: text/html
      Transfer-Encoding: chunked
      Connection: keep-alive
      Cache-Control: private, max-age=0, no-store, no-cache, must-revalidate, post-check=0, pre-check=0
      Expires: Thu, 01 Jan 1970 00:00:01 GMT
      Referrer-Policy: same-origin
      X-Frame-Options: SAMEORIGIN
      Server: cloudflare

      <the Example Domain HTML page follows>
      ```

      Read it like a tester: the `405` itself is correct, but RFC 9110 section 10.2.1 says "An origin server
      MUST generate an Allow header field in a 405 (Method Not Allowed) response" - and this `405` has none,
      although the `200` responses carry `allow: GET, HEAD`. (Whether the gap is the site's or the CDN's in
      front of it is the next question to ask.) Also notice the `GET` response has `Transfer-Encoding:
      chunked` and the `HEAD` response doesn't - allowed, as the next table explains.

  - id: tests
    kind: tests
    concepts: [safe-methods, idempotent-methods]
    title: Tests that check method promises
    body: |
      | ID | Test | Expected | Evidence |
      |---|---|---|---|
      | S1 | `GET` a resource 5 times | no change to any record; same body each time (unless something else changed it) | record before and after, audit log |
      | S2 | Every state-changing action reachable by `GET`? | none - review routes and UI links | route list, link targets |
      | S3 | `HEAD` vs `GET` | same status and headers, no body for `HEAD` - RFC 9110 9.3.2 lets the server omit fields only known while generating the body (such as `Content-Length` or `Transfer-Encoding`) | both responses |
      | I1 | `PUT` the same full representation twice | identical final state; no duplicates | `GET` after each |
      | I2 | `DELETE` twice | resource gone; second status as documented (`404` or `204`) | both responses, `GET` returns `404` |
      | I3 | `PATCH` with a relative change, sent twice | applied twice **unless** documented otherwise - flag it if clients auto-retry it | values after each request |
      | P1 | `POST` create, sent twice | **two** resources unless the API has duplicate protection | list before and after |

  - id: mistakes
    kind: mistakes
    concepts: [safe-methods, idempotent-methods]
    title: Common mistakes
    body: |
      - **State changes behind `GET`** (`/logout`, `/approve`, `/cancel`, `/refund` links). Report as a
        defect: crawlers, scanners and prefetchers will trigger them.
      - **Assuming "idempotent" means "same response every time".** It means the same *effect*.
      - **Assuming `PATCH` is idempotent.** Only if the specific patch is.
      - **`PUT` used as "append"** (for example `PUT /cart/items` adding an item each time). Calling it
        `PUT` makes clients believe repeats are harmless.
      - **Auto-retrying `POST` in client code** (common in HTTP client configuration) without an
        idempotency key - the source of many duplicate orders and payments.

  - id: summary
    kind: summary
    title: Summary and quick reference
    body: |
      - **Safe:** `GET`, `HEAD`, `OPTIONS`, `TRACE` - ask for no change.
      - **Idempotent:** the safe methods plus `PUT` and `DELETE` - repeating gives the same final state.
      - **Neither:** `POST`, and `PATCH` unless the specific patch is idempotent.
      - Same effect, not necessarily the same response (`DELETE` → `204`, then `404`).
      - Browsers, proxies, libraries and scanners repeat safe and idempotent requests on their own - so an
        API that breaks the promises gets surprise side effects.
      - Money-moving `POST`s need explicit duplicate protection.

exercises:
  - id: which-are-safe
    type: mcq
    concept: safe-methods
    skill: recognition
    title: Which methods are safe?
    prompt: |
      Which of these methods are **safe** according to RFC 9110? Select every one that applies.
    options:
      - id: get
        text: "`GET`"
        feedback: Correct - a read; the client asks for no change.
      - id: head
        text: "`HEAD`"
        feedback: Correct - the same as GET without the response body.
      - id: options
        text: "`OPTIONS`"
        feedback: Correct - it asks what is allowed, changing nothing.
      - id: put
        text: "`PUT`"
        feedback: Not safe - it replaces a resource. It is idempotent, which is a different property.
      - id: delete
        text: "`DELETE`"
        feedback: Not safe - it removes something. Idempotent, yes; safe, no.
      - id: post
        text: "`POST`"
        feedback: Neither safe nor idempotent - it processes data, typically creating something.
    correct: [get, head, options]
    hints:
      - Safe means "only asks to read". Which of these could you call a thousand times without changing anything?
    solution: |
      **`GET`, `HEAD` and `OPTIONS`** (and `TRACE`, not listed). `PUT` and `DELETE` are idempotent but
      not safe - they change state, just in a repeatable way.
    followUp: |
      A `GET /v1/payments/{id}` increments a "times viewed" counter in the database. Does that break the
      safety promise? Explain using what the client *asked* for.

  - id: route-review
    type: debug
    concept: safe-methods
    skill: analysis
    title: Review the routes
    prompt: |
      You are reviewing SandPay's internal route list before release. Click the line or lines that break
      HTTP method semantics in a way that could cause unintended side effects.
    language: plaintext
    code: |
      GET     /v1/payments/{id}                  read a payment
      GET     /v1/payments/{id}/refund           refund the full amount
      POST    /v1/payments                       create a payment
      PUT     /v1/customers/{id}                 replace a customer profile
      DELETE  /v1/customers/{id}/cards/{card}    remove a saved card
      PATCH   /v1/payments/{id}                  update metadata fields
    correctLines: [2]
    lineNotes:
      - line: 6
        note: PATCH is not idempotent by definition, but that is not a violation - the method doesn't promise idempotency. Setting metadata fields is a reasonable use; just check whether it is documented as safe to retry.
      - line: 3
        note: POST for creating a payment is the expected method. It needs duplicate protection, but the method choice is correct.
      - line: 5
        note: DELETE is the right method for removing a card, and it is idempotent - repeating it leaves the card removed.
    hints:
      - Which line promises "nothing changes" while doing something that moves money?
    solution: |
      **Line 2.** `GET` promises the client asks for no change, yet this route issues a refund. Link
      scanners, browser prefetching, crawlers, caches and automatic retries can all trigger it without a
      person deciding to refund.

      Fix: `POST /v1/payments/{id}/refunds` (create a refund), protected by authentication and an
      idempotency key.
    followUp: |
      Write the defect report for line 2: a title, the risk in one sentence, and how you would
      demonstrate it safely in a test environment.

  - id: auto-retry-allowed
    type: mcq
    concept: idempotent-methods
    skill: application
    title: Which requests may be retried automatically?
    prompt: |
      Your HTTP client library is configured to retry automatically when the connection drops before a
      response arrives. Which of these requests can it safely retry **without** any other mechanism?
      Select every one that applies.
    options:
      - id: get
        text: "`GET /v1/payments/pay_81Fz`"
        feedback: Yes - safe, so repeating it changes nothing.
      - id: put
        text: "`PUT /v1/customers/cus_12` with the complete profile"
        feedback: Yes - a full replacement leaves the same state however many times it is applied.
      - id: delete
        text: "`DELETE /v1/customers/cus_12/cards/card_9`"
        feedback: Yes - the card ends up removed either way; only the status of the repeat may differ.
      - id: post
        text: "`POST /v1/payments` creating a 25.00 EUR payment"
        feedback: No - without an idempotency key, a retry may create a second payment if the first one was processed before the connection dropped.
      - id: patch
        text: "`PATCH /v1/customers/cus_12` with `{\"loyalty_points\": \"+50\"}`"
        feedback: No - a relative change is applied again on every repeat, so the customer could get 100 points.
    correct: [get, put, delete]
    hints:
      - Ask of each one - if the first request was processed and only the response was lost, what does the retry do?
      - Look at whether the request says "make it this" or "add this".
    solution: |
      **The `GET`, the full `PUT` and the `DELETE`.** Repeating them leaves the same final state. The
      `POST` could create a second payment and the relative `PATCH` adds points again. Those need a
      mechanism that recognises repeats (such as an idempotency key) or must not be retried blindly.
    followUp: |
      How would you change the loyalty-points request so that retrying it becomes safe? Give two
      different designs.

  - id: method-semantics-tests
    type: testdesign
    concept: idempotent-methods
    skill: application
    title: Test that the API keeps its promises
    prompt: |
      SandPay documents `PUT /v1/customers/{id}` (replace a profile) and `DELETE
      /v1/customers/{id}/cards/{card}` (remove a saved card). Write test cases that prove both methods
      behave as their semantics promise. Include the evidence you would collect.
    hints:
      - Idempotency is about the final state after repeats - how will you observe the state?
      - What about the response of the second request - what does the documentation say?
    modelAnswer: |
      1. `PUT` the full profile, then `GET`; `PUT` the identical profile again, then `GET`: both reads are
         identical, no duplicate records or events.
      2. `PUT` with a field left out: the field is removed or reset (full replacement), as documented -
         if it is kept, the endpoint behaves like `PATCH` and the documentation is wrong.
      3. Two concurrent identical `PUT`s: same final state.
      4. `DELETE` a card: `204`; `GET` the card: `404`; the card no longer appears in the list.
      5. `DELETE` the same card again: the documented status (`404` or `204`), and nothing else removed.
      6. `DELETE` a card that belongs to another customer: rejected, nothing removed.
      Evidence: request and response pairs, reads of the resource after each step, audit or event logs.
    rubric:
      - Repeated the PUT with the identical body and compared the final state
      - Checked that PUT really replaces (a missing field is removed or reset as documented)
      - Repeated the DELETE and checked both the final state and the documented status of the repeat
      - Verified state with a separate read (GET or list), not only the write's response
      - Covered an authorization boundary (another customer's card)
    solution: |
      The habit to build: **verify the effect with an independent read**, and repeat each request to see
      whether the effect changes. The full-replacement check (case 2) catches APIs that call a partial
      update `PUT`.
    followUp: |
      Write one test that would reveal a `PUT` endpoint that secretly appends instead of replacing.

  - id: interview-put-patch
    type: interview
    concept: idempotent-methods
    skill: application
    title: "Interview: PUT versus PATCH"
    prompt: |
      **Interviewer:** "What is the difference between PUT and PATCH, and how does it change the way you
      test them?"
    hints:
      - Cover the meaning, idempotency, and what a test must check for each.
    modelAnswer: |
      - `PUT` replaces the resource with the representation sent - fields left out are removed or reset.
        It is idempotent: sending it again leaves the same state.
      - `PATCH` applies a partial change. It is not idempotent by definition: "set email" is repeatable,
        "add 50 points" is not.
      - Testing `PUT`: send it twice and compare the state; send it with a field missing and check it is
        replaced, not merged.
      - Testing `PATCH`: check only the named fields change, then repeat it and check whether the result
        matches the documented behaviour; flag relative changes that clients may auto-retry.
    followUps:
      - A PUT endpoint keeps fields you left out. Is that a defect?
      - How would you make a PATCH that adds loyalty points safe to retry?
      - Which of the two would you let an HTTP client retry automatically, and why?
    rubric:
      - Explained PUT as full replacement and PATCH as partial change
      - Stated that PUT is idempotent and PATCH is not by definition
      - Gave a test that repeats the request and compares the final state
      - Gave a test that checks fields left out of a PUT are replaced, not merged
      - Connected the answer to automatic retries
    solution: |
      Strong answers connect the definitions to **concrete tests and to retries**. Weak answers stop at
      "PUT is full, PATCH is partial".

  - id: why-get-must-be-safe
    type: short
    concept: safe-methods
    skill: recall
    title: Why GET must be safe
    prompt: |
      In two to four sentences: why must a `GET` request never change server state? Give one concrete
      way the problem shows up.
    hints:
      - Who, other than your user, sends GET requests to your URLs?
    modelAnswer: |
      Browsers, proxies, caches, crawlers and link scanners all send or repeat GET requests on their own,
      because GET promises not to change anything. If a GET changes state, those tools trigger the change
      without anyone deciding to - for example an email link scanner approving a refund, or a browser
      prefetch cancelling an order.
    rubric:
      - Said other software repeats or sends GET requests automatically because GET is safe
      - Gave a concrete example such as a link scanner, prefetching, crawler or cache
      - Said the consequence is a state change nobody intended
    solution: |
      The key idea: **the safety promise is what allows other software to act on GET freely** - so
      breaking it hands control of the action to that software.

recall:
  - id: recall-safe
    concept: safe-methods
    prompt: Which HTTP methods are safe?
    answer: GET, HEAD, OPTIONS and TRACE - the client asks for no change of state.
  - id: recall-safe-meaning
    concept: safe-methods
    prompt: Can a safe request cause any server-side activity at all?
    answer: Yes - logging, metrics or caching are fine. Safe means the client did not ask for a change of state, not that the server does nothing.
  - id: recall-idempotent
    concept: idempotent-methods
    prompt: Which HTTP methods are idempotent, and which are not by definition?
    answer: Idempotent - the safe methods plus PUT and DELETE. Not by definition - POST and PATCH.
  - id: recall-delete-twice
    concept: idempotent-methods
    prompt: A second DELETE returns 404 after the first returned 204. Is that idempotent?
    answer: Yes. Idempotency is about the effect - the resource is gone either way. The response may differ.
  - id: recall-patch
    concept: idempotent-methods
    prompt: When is a PATCH request idempotent?
    answer: Only when the specific change is - setting a value is repeatable, applying a relative change (add, append) is not.

