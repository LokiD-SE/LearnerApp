id: http-request-response-anatomy
title: Anatomy of an HTTP request and response
subject: api-testing
module: api-foundations
level: beginner
status: published
estimatedMinutes: 35
summary: Method, target, headers and body of a request; status, headers and body of a response - what each part is for and how a tester inspects it.
tags: [http, api, headers, status codes, curl, devtools, content-type]

environment: |
  - **Standards:** HTTP semantics - methods, status codes and header fields - are defined in **RFC 9110**.
    The text layout shown in this lesson is HTTP/1.1 (**RFC 9112**). HTTP/2 and HTTP/3 carry the same
    information in binary frames, so tools show you the same fields.
  - **Tools:** `curl` (any recent version) and the Network panel of browser developer tools. The options
    used are curl's own: `-v` (verbose), `-i` (include response headers), `-H` (add a header),
    `-d` (send a body), `-X` (set the method).
  - **Examples:** SandPay (`https://api.sandpay.example`) is a fictional payment provider. Status codes an
    API returns for each mistake are part of *its* contract - check the API's documentation.

prerequisites: []

concepts:
  - id: http-message-structure
    name: HTTP message structure
    summary: A request is method, target, headers and an optional body; a response is a status, headers and an optional body.
  - id: headers-and-bodies
    name: Headers and bodies
    summary: Headers describe the message (format, length, credentials, caching); the body carries the data in the format the headers declare.

objectives:
  - Name every part of a raw HTTP request and response and say what each part is for.
  - Decide whether a piece of data belongs in the path, the query string, a header or the body.
  - Read a request/response pair from `curl -v` or browser DevTools and point to the part that explains a failure.
  - Write API test cases that check the status code and headers as well as the body.

sections:
  - id: intuition
    kind: intuition
    title: The idea in plain language
    body: |
      Think of an HTTP request as a **parcel**. The address label says *what to do* and *where*
      ("POST to /v1/payments"). Stickers on the box give instructions - "contents: JSON", "reply in
      JSON please", "here is my ID card". Inside the box is the actual **letter**: the data.

      The **response** comes back the same way, with one addition: a stamp on the outside saying how
      it went - `201 Created`, `404 Not Found`, `500 Internal Server Error`. That stamp is the
      **status code**, and you can often tell what happened before you open the box.

      A tester who only reads the letter misses half the story. Wrong stamps, missing stickers and
      parcels sent to the wrong address are some of the most common API defects.

  - id: what
    kind: what
    title: What a request and a response contain
    body: |
      A request to create a payment, as it travels in HTTP/1.1:

      ```http
      POST /v1/payments?expand=customer HTTP/1.1
      Host: api.sandpay.example
      Authorization: Bearer <sandbox key>
      Content-Type: application/json
      Accept: application/json
      Content-Length: 60

      {"amount": 2500, "currency": "EUR", "reference": "ORD-1042"}
      ```

      | Part | In the example | What it is for |
      |---|---|---|
      | **Method** | `POST` | the action wanted on the resource |
      | **Path** | `/v1/payments` | which resource - often with ids in it, such as `/v1/payments/pay_81Fz` (path parameters) |
      | **Query string** | `?expand=customer` | options that modify the request: filters, paging, sorting, expansions (query parameters) |
      | **Header fields** | `Host`, `Authorization`, `Content-Type` ... | information *about* the message: host, credentials, body format, accepted response formats, length |
      | **Blank line** | | ends the headers |
      | **Body** | the JSON | the data itself; `GET` requests normally have none |

      And the response:

      ```http
      HTTP/1.1 201 Created
      Content-Type: application/json
      Location: /v1/payments/pay_81Fz
      Cache-Control: no-store

      {"id": "pay_81Fz", "status": "authorized", "amount": 2500, "currency": "EUR"}
      ```

      | Part | In the example | What it is for |
      |---|---|---|
      | **Status code** and reason | `201 Created` | the outcome, in a standard vocabulary |
      | **Header fields** | `Content-Type`, `Location`, `Cache-Control` | format of the body, where the new resource lives, whether it may be cached |
      | **Body** | the JSON | the data, or an error description |

      Status codes come in five classes: **1xx** informational, **2xx** success, **3xx** redirection,
      **4xx** the client made a mistake, **5xx** the server failed.

  - id: why
    kind: why
    title: Why each part matters to a tester
    body: |
      Each part is a separate promise in the API's contract, and each can be wrong on its own:

      - **Status code** - a `200 OK` with `{"error": "card declined"}` in the body breaks every client
        that trusts the status. Monitoring and retry logic usually look only at the status.
      - **Content-Type** - clients parse the body according to this header. A JSON body labelled
        `text/html` may be shown as raw text, or fail to parse.
      - **Location** - after a `201 Created`, clients may follow it to fetch the new resource.
      - **Caching headers** - a response with personal or payment data that a shared cache is allowed
        to store can leak to the next user. `Cache-Control: no-store` says "never store this".
      - **Where data travels** - URLs, including query strings, are written to server, proxy and browser
        logs. Secrets and card data must never be in a URL.

  - id: internals
    kind: internals
    title: How a server uses each part
    body: |
      1. **Routing.** The method and path pick the handler. An unknown path typically gives `404`; a known
         path with a method it doesn't support gives `405 Method Not Allowed`.
      2. **Authentication.** Credentials are read from a header (often `Authorization`) or a cookie.
         Missing or invalid credentials → `401 Unauthorized`. Valid credentials without permission for
         this resource → `403 Forbidden`.
      3. **Reading the body.** `Content-Type` tells the server how to parse the body. An unsupported
         format → `415 Unsupported Media Type`. A body that claims to be JSON but isn't → `400 Bad
         Request`. The body's end is found from `Content-Length` (or chunked transfer encoding).
      4. **Validation.** Well-formed data that breaks a rule (negative amount, unknown currency) is
         rejected - many APIs use `422 Unprocessable Content`, others use `400`.
      5. **Choosing the response format.** `Accept` says what the client can read. If the server can't
         produce any of it, some APIs answer `406 Not Acceptable`; many simply ignore `Accept`.

      Two details that cause false defect reports:

      - **Header names are case-insensitive.** `content-type` and `Content-Type` are the same field.
        HTTP/2 always sends them in lower case.
      - **Intermediaries change messages.** Proxies, load balancers and API gateways may add headers (such
        as `Via` or `X-Forwarded-For`), compress bodies, or answer by themselves - a `502` or `504` often
        comes from a gateway, not from the application behind it.

  - id: visual
    kind: visual
    title: "Flowchart: where a request can be rejected"
    body: |
      A typical order of checks inside an API. The status codes are common conventions; your API's
      documentation is the authority.

      ```mermaid
      flowchart TD
          A[Request arrives] --> B{Method and path known?}
          B -- Path unknown --> B1[404 Not Found]
          B -- Method not allowed --> B2[405 Method Not Allowed]
          B -- Yes --> C{Valid credentials?}
          C -- No --> C1[401 Unauthorized]
          C -- Yes, but no permission --> C2[403 Forbidden]
          C -- Yes --> D{Body format supported?}
          D -- No --> D1[415 Unsupported Media Type]
          D -- Yes --> E{Body parses?}
          E -- No --> E1[400 Bad Request]
          E -- Yes --> F{Business rules pass?}
          F -- No --> F1[422 or 400 with an error body]
          F -- Yes --> G[2xx with headers and body]
      ```

  - id: steps
    kind: steps
    title: Step by step - inspecting a real exchange
    body: |
      **With curl:**

      1. Run the request with `-v`. Lines starting with `>` are what was **sent**, lines starting with
         `<` are what was **received**, and lines starting with `*` are connection details.
      2. Check the request line and headers you *meant* to send are really there - typos in header
         names fail silently.
      3. Read the status line, then the response headers, then the body - in that order.

      **With browser DevTools (Network panel):**

      1. Open DevTools, select **Network**, then repeat the action in the page.
      2. Click the request. **Headers** shows the request line, status and both sets of headers;
         **Payload** shows what was sent; **Response** shows the body; **Timing** shows where time went.
      3. Right-click the request and choose **Copy as cURL** to reproduce it outside the browser - and
         remove the credentials before you paste it anywhere.

  - id: example
    kind: example
    title: "Real-world example: the silent SDK upgrade"
    body: |
      After a dependency upgrade, the mobile app shows "Something went wrong" at checkout. The UI says
      nothing useful, so the tester routes the app's traffic through a debugging proxy and captures the
      call:

      ```http
      POST /v1/payments HTTP/1.1
      Content-Type: text/plain; charset=utf-8

      {"amount": 2500, "currency": "EUR"}
      ```

      ```http
      HTTP/1.1 415 Unsupported Media Type
      ```

      The body is perfectly good JSON, but the new HTTP library labelled it as plain text, so the server
      refused to parse it. Evidence for the bug report: the captured request and response (with the
      credentials removed), the app version, and the library version that changed. The fix belongs in the
      app's HTTP client configuration, not in the payment service.

  - id: code
    kind: code
    title: curl commands to practise with
    collapsed: true
    body: |
      Read a payment and show the full exchange:

      ```bash
      curl -v "https://api.sandpay.example/v1/payments/pay_81Fz" \
        -H "Authorization: Bearer $SANDPAY_KEY" \
        -H "Accept: application/json"
      ```

      List payments with query parameters - quote the URL so the shell doesn't treat `&` as "run in
      the background":

      ```bash
      curl -i "https://api.sandpay.example/v1/payments?limit=10&status=authorized" \
        -H "Authorization: Bearer $SANDPAY_KEY"
      ```

      Create a payment with a JSON body. `-d` sends a body and makes curl use `POST`; the
      `Content-Type` header is set explicitly because curl's default for `-d` is
      `application/x-www-form-urlencoded`:

      ```bash
      curl -i "https://api.sandpay.example/v1/payments" \
        -H "Authorization: Bearer $SANDPAY_KEY" \
        -H "Content-Type: application/json" \
        -d '{"amount": 2500, "currency": "EUR", "reference": "ORD-1042"}'
      ```

      The key is read from an environment variable (`$SANDPAY_KEY`) so it doesn't end up in your shell
      history or in a screenshot of the command.

  - id: tests
    kind: tests
    title: Positive and negative test cases
    body: |
      For `GET /v1/payments/{id}` and `POST /v1/payments`. The expected codes are typical choices -
      confirm them against the API's documentation.

      | ID | Request | Expected status | Also check |
      |---|---|---|---|
      | P1 | `GET` an existing payment | `200` | `Content-Type: application/json`; body matches the schema; `Cache-Control` prevents shared caching |
      | P2 | `POST` a valid payment | `201` | `Location` points at the new payment; body has its id |
      | N1 | `GET` an unknown id | `404` | error body follows the documented error format |
      | N2 | Request without `Authorization` | `401` | no payment data in the body |
      | N3 | Valid key that may not see this payment | `403` or `404` | no data leaked either way |
      | N4 | `POST` with `Content-Type: text/plain` | `415` (or a documented `400`) | nothing created |
      | N5 | `POST` with malformed JSON | `400` | error says the body is invalid, not a generic 500 |
      | N6 | `POST` with a negative amount | `422` or `400` | error names the field |
      | N7 | `DELETE /v1/payments` (method not supported) | `405` | an `Allow` header listing the supported methods (RFC 9110 requires it on a 405) |

      Positive tests confirm the contract; the negative ones catch servers that answer `500` (or worse,
      `200`) to client mistakes.

  - id: mistakes
    kind: mistakes
    title: Common mistakes and how to debug them
    body: |
      - **Checking only the body.** Always assert the status code and the important headers too.
      - **Treating every 2xx the same.** `200`, `201`, `202 Accepted` (processing later) and `204 No
        Content` mean different things; clients behave differently for each.
      - **Sending JSON without `Content-Type: application/json`.** The classic cause of a `415` or of a
        server reading an empty body.
      - **Unquoted URLs in the shell.** `&` in a query string splits the command in two.
      - **Secrets in URLs.** Keys or tokens in query strings end up in logs. Report it as a security
        defect.
      - **Pasting `Authorization` headers into bug reports.** Redact them - a leaked key works for anyone.

      **Debugging order:** status → response headers → body → request headers → request line. Most
      "the server is broken" reports turn out to be a wrong request.

  - id: summary
    kind: summary
    title: Summary and quick reference
    body: |
      - Request = **method + target (path, query) + headers + optional body**.
      - Response = **status + headers + optional body**.
      - `Content-Type` describes the body being *sent*; `Accept` asks for a format *back*.
      - 4xx = the client's mistake, 5xx = the server's failure. `401` = who are you? `403` = I know you,
        but no.
      - Assert **status, headers and body**. Inspect with `curl -v` or DevTools → Network.
      - Never put secrets in URLs or bug reports.

exercises:
  - id: parts-of-request
    type: mcq
    concept: http-message-structure
    skill: recognition
    title: Read the raw request
    prompt: |
      Look at this request. Which statements are true? Select every one that applies.

      ```http
      POST /v1/payments?expand=customer HTTP/1.1
      Host: api.sandpay.example
      Content-Type: application/json
      Accept: application/json

      {"amount": 2500, "currency": "EUR"}
      ```
    options:
      - id: method
        text: "`POST` is the method."
        feedback: Correct - the first word of the request line is the method.
      - id: path
        text: "`/v1/payments` is the path."
        feedback: Correct - the path identifies the resource; the query string starts after `?`.
      - id: expand-header
        text: "`expand=customer` is a header."
        feedback: "Not a header - it comes after `?` in the target, so it is a **query parameter**. Headers are the `Name: value` lines."
      - id: content-type
        text: "`Content-Type` says what format the request body is in."
        feedback: Correct - the server uses it to decide how to parse the body.
      - id: accept-body
        text: "`Accept` says what format the request body is in."
        feedback: "A common mix-up. `Accept` tells the server which formats the client can read in the **response**. The request body's format is `Content-Type`."
    correct: [method, path, content-type]
    hints:
      - "Headers are the lines in `Name: value` form, between the request line and the blank line."
      - One header is about what you send, the other about what you want back.
    solution: |
      **`POST` is the method, `/v1/payments` is the path, and `Content-Type` describes the body.**

      `expand=customer` is a query parameter (after `?`). `Accept` describes the formats the client
      accepts in the response, not the format of what it sends.
    followUp: |
      If this request also had `Accept: text/csv`, and the API only produces JSON, what might the server
      answer? What would you check in the API documentation to decide whether that is a defect?

  - id: where-does-it-go
    type: mcq
    concept: headers-and-bodies
    skill: application
    title: Where should the secret key go?
    prompt: |
      Your backend calls SandPay server-to-server and must send its secret API key. Where should the key
      travel?
    options:
      - id: query
        text: "In the query string: `/v1/payments?api_key=...`"
        feedback: URLs are written to access logs, proxy logs and monitoring tools, so a key in a URL leaks easily. Report this as a security defect if you see it.
      - id: body
        text: 'In the JSON body, as `"api_key": "..."`'
        feedback: It would work technically, but `GET` requests have no body and credentials would mix with business data. Authentication belongs in a header that every request carries the same way.
      - id: header
        text: "In a header, for example `Authorization: Bearer ...`"
        feedback: Correct - credentials belong in a header, which is not written to URL logs and is the same for every method.
      - id: path
        text: "In the path: `/v1/<key>/payments`"
        feedback: The path is part of the URL, so this leaks like the query string - and it mixes credentials into resource addresses.
    correct: [header]
    hints:
      - Which parts of a request end up in log files on every server and proxy along the way?
    solution: |
      **In a header**, usually `Authorization`. Anything in the URL - path or query string - is written
      to logs on servers, proxies and monitoring tools, and can appear in browser history and referrer
      headers. The body is not available on every method and mixes concerns.
    followUp: |
      A mobile app sends the user's session token as `?token=...` on every request. Write the defect
      title and the evidence you would attach - without including a working token.

  - id: diagnose-415
    type: mcq
    concept: http-message-structure
    skill: analysis
    title: Why the 415?
    prompt: |
      After an SDK upgrade, `POST /v1/payments` starts failing. You capture the exchange:

      ```http
      POST /v1/payments HTTP/1.1
      Authorization: Bearer <sandbox key>
      Content-Type: text/plain; charset=utf-8

      {"amount": 2500, "currency": "EUR"}
      ```

      ```http
      HTTP/1.1 415 Unsupported Media Type
      ```

      What is the most likely cause?
    options:
      - id: invalid-json
        text: The JSON body is invalid.
        feedback: The body is valid JSON. Invalid JSON with the right content type usually gives `400 Bad Request`.
      - id: auth
        text: The API key is wrong.
        feedback: An authentication problem gives `401`. `415` is specifically about the format of the request body.
      - id: content-type
        text: The request labels its body as plain text, so the server refuses to parse it.
        feedback: Correct - `415 Unsupported Media Type` means the server doesn't accept the declared `Content-Type`. The SDK upgrade changed how the body is labelled.
      - id: method
        text: "`POST` is not allowed on `/v1/payments`."
        feedback: A method the path doesn't support gives `405 Method Not Allowed`.
    correct: [content-type]
    hints:
      - Read the status code's name word for word. What is a "media type"?
      - Compare what the body actually is with what the headers say it is.
    solution: |
      **The `Content-Type` is wrong.** The body is JSON, but the request says `text/plain`, and `415
      Unsupported Media Type` is the server refusing to parse a format it doesn't accept.

      Confirm it by resending the same request with `Content-Type: application/json` - if that
      succeeds, the cause is proven, and the fix is the client's HTTP configuration.
    followUp: |
      The same app now gets `400 Bad Request` with `Content-Type: application/json`. List two
      different things in the request that could cause it, and how you would tell them apart.

  - id: spot-bad-line
    type: debug
    concept: headers-and-bodies
    skill: analysis
    title: Find the line the server rejects
    prompt: |
      SandPay answers this refund request with `400 Bad Request` and the message
      `"Request body is not valid JSON"`. Click the line responsible.
    language: http
    code: |
      POST /v1/refunds HTTP/1.1
      Host: api.sandpay.example
      Authorization: Bearer <sandbox key>
      Content-Type: application/json
      Accept: application/json

      {"payment": "pay_81Fz", "amount": 1000, 'reason': "duplicate"}
    correctLines: [7]
    lineNotes:
      - line: 4
        note: The declared type is right - the body is meant to be JSON. The problem is that the body doesn't follow JSON's rules.
      - line: 1
        note: Method and path are fine; a routing problem would give 404 or 405, not "not valid JSON".
    hints:
      - The error message is about the body. Which line is the body?
      - Look closely at the quotation marks. JSON is stricter than JavaScript.
    solution: |
      **Line 7.** JSON requires double quotes around keys and strings. `'reason'` uses single quotes, so
      the body is not valid JSON, whatever `Content-Type` says.

      A good API answers `400` with a message saying the body is invalid - as SandPay does here. An API
      that answers `500` to the same request has a defect too: a client mistake should never look like a
      server crash.
    followUp: |
      Write three more invalid bodies for the same endpoint (one malformed, one wrong type, one missing
      field) and the status and error message you would expect for each.

  - id: endpoint-test-design
    type: testdesign
    concept: headers-and-bodies
    skill: application
    title: Test more than the body
    prompt: |
      Write test cases for SandPay's `GET /v1/payments/{id}`. Include at least five, with the expected
      **status code**, the **headers** you would check and what you would check in the **body**.
    hints:
      - Think about who is asking (no key, wrong account), what they ask for (exists, doesn't exist) and how the answer is labelled.
      - Payment data is sensitive. Which response header controls whether it may be stored by caches?
    modelAnswer: |
      1. Existing payment, valid key → `200`, `Content-Type: application/json`, body matches the schema
         (id, status, amount in minor units, currency), `Cache-Control: no-store` or private.
      2. Unknown id → `404`, error body in the documented format, no stack trace.
      3. No `Authorization` header → `401`, no payment data in the body.
      4. Valid key from a different merchant → `403` or `404` (as documented), no data leaked.
      5. `Accept: text/csv` → either `406` or JSON anyway, as documented.
      6. Malformed id (`/v1/payments/%00`) → `400` or `404`, never `500`.
      7. Response time within the agreed limit.
    rubric:
      - Checked the status code for each case, not only the body
      - Checked at least one response header such as Content-Type or Cache-Control
      - Covered a missing or invalid credential
      - Covered access to another account's payment (authorization boundary)
      - Covered a payment id that doesn't exist
      - Checked that error responses don't leak data or stack traces
    solution: |
      Compare your cases with the model answer. The case most often missed is the **authorization
      boundary** - a valid key that belongs to a different merchant. It is also the one with the worst
      consequences if it fails.
    followUp: |
      Turn case 4 into exact steps: which two sandbox accounts you need, which request you send, and what
      proves no data leaked.

  - id: explain-200-not-enough
    type: short
    concept: http-message-structure
    skill: recall
    title: Why "200 OK" is not a passed test
    prompt: |
      In two to four sentences, explain why a test that only checks for `200 OK` is not enough to pass an
      API test.
    hints:
      - Think about what else the response carries, and what the request was supposed to change.
    modelAnswer: |
      A 200 only says the server didn't report an error. The body may still contain the wrong data, an
      error message or a broken schema, and headers such as `Content-Type` or `Cache-Control` may be
      wrong. For requests that change something, the side effect - the record created or updated - has to
      be checked too.
    rubric:
      - Said the body can still be wrong (data, schema or an error in a 200)
      - Mentioned headers as part of what must be checked
      - Mentioned checking side effects or persisted data for requests that change something
    solution: |
      The key idea: **status, headers, body and side effects** are four separate things to verify.

recall:
  - id: recall-parts
    concept: http-message-structure
    prompt: What are the parts of an HTTP request, in order?
    answer: The request line (method, target with path and query, version), the header fields, a blank line, then the optional body.
  - id: recall-classes
    concept: http-message-structure
    prompt: What do the five status-code classes mean?
    answer: 1xx informational, 2xx success, 3xx redirection, 4xx client error, 5xx server error.
  - id: recall-401-403
    concept: http-message-structure
    prompt: What is the difference between 401 and 403?
    answer: 401 means the request has no valid credentials. 403 means the credentials are valid but this client is not allowed to do this.
  - id: recall-content-type-accept
    concept: headers-and-bodies
    prompt: What is the difference between Content-Type and Accept?
    answer: Content-Type describes the format of the body being sent. Accept lists the formats the client can read in the response.
  - id: recall-secrets-url
    concept: headers-and-bodies
    prompt: Why must secrets never be sent in a URL?
    answer: URLs, including query strings, are recorded in server, proxy and monitoring logs, and in browser history - so the secret leaks to everyone who can read them.

