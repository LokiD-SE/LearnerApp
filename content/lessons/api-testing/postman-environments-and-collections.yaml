id: postman-environments-and-collections
title: Postman environments, variables and collections
subject: api-testing
module: manual-api-testing
level: beginner
status: published
estimatedMinutes: 50
summary: Organise API tests in Postman - collections and folders, variables in the right scope, environments for each stage, secrets kept out of exports, scripts that assert and chain requests, data-driven runs - and run the same collection in CI with the Postman CLI.
tags: [api, postman, collections, environments, variables, scripts, pm.test, data-driven, postman cli, newman, ci]

environment: |
  - **Tool documentation (vendor):** Postman Learning Center -
    [variables](https://learning.postman.com/docs/sending-requests/variables/variables/) (scopes from broadest to
    narrowest: global, collection, environment, data, local; "the value stored in the variable with narrowest scope will
    be used"; Postman Vault for sensitive values),
    [test scripts](https://learning.postman.com/docs/tests-and-scripts/write-scripts/test-scripts/) (Scripts → Pre-request
    and Post-response) and the
    [Postman CLI](https://learning.postman.com/docs/postman-cli/postman-cli-collections/) (`postman collection run`).
  - **Version note:** Postman's documentation now says the Postman CLI is "the preferred tool for running Postman
    Collections from the command line", that **Newman is no longer maintained**, and that Newman isn't compatible with the
    collection v3 format used by Postman v12 and later. Existing pipelines may still use Newman - plan the migration.
  - **UI labels change between Postman versions.** If a menu differs, search the Learning Center for the feature.
  - **Fictional:** SandPay's API and the `sk_test_...` keys.

prerequisites:
  - http-request-response-anatomy
  - status-codes-and-errors

concepts:
  - id: postman-variables-and-environments
    name: Variables and environments
    summary: Variables live in scopes (global, collection, environment, data, local) and the narrowest one wins; environments switch base URLs and keys per stage; secrets belong in the vault, not in exported files.
  - id: postman-scripts-and-assertions
    name: Scripts, assertions and chaining
    summary: Pre-request scripts prepare data; post-response scripts assert with pm.test and pass values such as ids to later requests through variables.
  - id: collection-runs-in-ci
    name: Running collections in CI
    summary: The Collection Runner and the Postman CLI run a collection with an environment and a data file, iterate per data row, and write reports such as JUnit for the pipeline.

objectives:
  - Structure a collection with folders, shared variables and an environment per stage.
  - Choose the right variable scope and predict which value Postman uses when names clash.
  - Write post-response tests that assert status, headers and body, and chain requests through variables.
  - Run a collection data-driven and from the command line with the Postman CLI, producing a report for CI.

sections:
  - id: intuition
    kind: intuition
    concepts: [postman-variables-and-environments]
    title: The idea in plain language
    body: |
      Think of a collection as a **recipe book** of requests and an environment as **the kitchen** you cook in. The recipe
      says "pre-heat the oven to `{{oven_temperature}}`"; the home kitchen and the restaurant kitchen fill in different
      values. You don't rewrite the book for each kitchen.

      In Postman, the requests (`POST {{base_url}}/v1/payments`) stay the same; the **development**, **staging** and
      **sandbox** environments supply `base_url` and the API key. Scripts are the **taste test** after each step - is the
      status right, is the amount right? - and they pass the id of what you just created to the next request, like handing
      the dish to the next cook.

      Done well, the same collection runs on your laptop for exploration and in the CI pipeline as a regression suite.

  - id: what
    kind: what
    concepts: [postman-variables-and-environments]
    title: What collections, environments and variable scopes are
    body: |
      - **Collection** - a set of requests, organised in **folders**, with its own variables, scripts and authorisation
        settings that requests inherit.
      - **Environment** - a named set of variables (for example `sandbox`, `staging`) you switch between.
      - **Variable** - referenced as `{{name}}` in URLs, headers and bodies; Postman substitutes the value when the request
        runs. Values are stored as **strings** (serialise objects with `JSON.stringify()`).

      **Scopes, from broadest to narrowest** (Postman documentation):

      | Scope | Lives in | Typical use |
      |---|---|---|
      | **Global** | the workspace | rarely - values every collection shares |
      | **Collection** | the collection | values fixed for this API: API version, default currency |
      | **Environment** | the selected environment | per stage: `base_url`, keys (referenced from the vault) |
      | **Data** | the data file of a run | per iteration: test inputs from CSV or JSON |
      | **Local** | one request or script run | temporary values set in scripts |

      **Precedence:** if the same name exists in several scopes, "the value stored in the variable with narrowest scope will
      be used" - local beats data beats environment beats collection beats global.

      **Secrets:** Postman keeps a **local value** on your machine separately from the **shared value** synced to the
      team, and offers **Postman Vault** for sensitive data. Never put real keys in shared values or exported files.

  - id: why
    kind: why
    concepts: [postman-variables-and-environments, collection-runs-in-ci]
    title: Why structure matters
    body: |
      A Postman workspace without structure becomes a junk drawer: duplicated requests with hard-coded URLs, keys pasted
      into headers, tests that only pass in one person's environment. Typical consequences:

      - **Leaked keys** - a collection exported for a colleague or committed to Git contains a live key.
      - **Testing the wrong stage** - a hard-coded URL points at staging while the environment says sandbox.
      - **Flaky chains** - request 3 uses an id "copied by hand" from request 1, so the collection can't run unattended.
      - **No regression value** - checks live in people's heads, not in scripts, so CI can't run them.

      With variables in the right scope, scripts that assert and chain, and a data file for inputs, the collection becomes
      **executable documentation** of the API that runs the same everywhere.

  - id: internals
    kind: internals
    concepts: [postman-scripts-and-assertions]
    title: How scripts assert and chain requests
    body: |
      Scripts are JavaScript, written in the request's **Scripts** tab: **Pre-request** runs before sending,
      **Post-response** runs after the response arrives. Collection- and folder-level scripts run for every request in
      them. Results appear in the response's **Test Results** tab.

      A post-response script for `POST {{base_url}}/v1/payments`:

      ```javascript
      pm.test('status is 201', function () {
        pm.response.to.have.status(201);
      });

      pm.test('content type is JSON', function () {
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      const body = pm.response.json();

      pm.test('amount and currency are echoed', function () {
        pm.expect(body.amount).to.eql(Number(pm.iterationData.get('amount')));
        pm.expect(body.currency).to.eql(pm.iterationData.get('currency'));
      });

      // pass the new payment id to the next requests
      pm.collectionVariables.set('payment_id', body.id);
      ```

      The next request, `GET {{base_url}}/v1/payments/{{payment_id}}`, uses it. A pre-request script can generate fresh
      values - for example a unique idempotency key per iteration:

      ```javascript
      pm.variables.set('idempotency_key', 'pm-' + pm.info.iteration + '-' + Date.now());
      ```

      `pm.test` names each check; assertions use the Chai `expect` style. Keep scripts small - logic that needs a
      debugger belongs in a code-based test framework.

  - id: visual
    kind: visual
    concepts: [collection-runs-in-ci, postman-variables-and-environments]
    title: "Flowchart: one collection, many runs"
    body: |
      The same collection runs on a laptop and in CI; only the environment and the data change.

      ```mermaid
      flowchart TD
          A[Collection - requests, folders, scripts] --> B{Where does it run?}
          B -- Laptop --> C[Postman app with the sandbox environment]
          B -- CI pipeline --> D[Postman CLI with the staging environment file]
          C --> E[Collection Runner with payments.csv]
          D --> F[postman collection run with -e, -d and -r cli,junit]
          E --> G[Test Results per iteration]
          F --> H[JUnit report in the pipeline - fail the build on failures]
      ```

  - id: steps
    kind: steps
    concepts: [postman-variables-and-environments, postman-scripts-and-assertions]
    title: Step by step - building a payments collection
    body: |
      1. **Create the collection** `SandPay payments` with folders: `Payments`, `Refunds`, `Errors`.
      2. **Set collection variables**: `api_version = v1`, `currency = EUR`.
      3. **Create environments** `sandbox` and `staging`, each with `base_url` and `api_key`; keep the key's value local
         or in the vault, not in the shared value.
      4. **Set authorisation once** at collection level: Bearer token `{{api_key}}`; requests inherit it.
      5. **Write requests with variables only**: `POST {{base_url}}/{{api_version}}/payments` with
         `Idempotency-Key: {{idempotency_key}}`.
      6. **Add post-response tests** to every request - status, key headers, body fields - and chain ids with
         `pm.collectionVariables.set`.
      7. **Add negative requests** in the `Errors` folder - one invalid thing each (see
         [status codes and errors](#/lesson/status-codes-and-errors)).
      8. **Run it in the Collection Runner** with a data file, then from the command line with the Postman CLI.
      9. **Export or sync without secrets** - check the exported JSON for keys before sharing it.

  - id: example
    kind: example
    concepts: [postman-variables-and-environments]
    title: "Real-world example: the test that charged staging's real key"
    body: |
      A tester's collection worked perfectly in `sandbox`. In CI, against `staging`, payments failed with `401` - but the
      tester's laptop runs against staging passed.

      The investigation: the tester had once set `api_key` as a **global** variable while debugging, with a staging key.
      On the laptop, the environment's `api_key` - the **narrower** scope - won when an environment was selected. But one
      request in the `Refunds` folder had its authorisation set to `{{apiKey}}` (different spelling), which only existed as a
      global. In CI there were no globals, so that request was sent with the literal text `{{apiKey}}`.

      Two lessons, both about scope:

      - A variable that resolves on one machine and not on another is a **scope** problem until proven otherwise.
      - Unresolved variables are sent **as text** - add a collection-level pre-request check that fails when a required
        variable is empty, and remove stray globals.

  - id: code
    kind: code
    concepts: [collection-runs-in-ci]
    title: Running the collection with the Postman CLI
    collapsed: true
    body: |
      A data file for a data-driven run, `payments.csv` (one row per iteration; column names become data variables):

      ```plaintext
      amount,currency,expected_status
      2500,EUR,201
      49,EUR,422
      1500,JPY,201
      ```

      Running a local collection file with an environment file, the data file and two reporters (options from the Postman
      CLI documentation):

      ```bash
      postman collection run postman/collections/sandpay-payments \
        --environment postman/environments/staging.json \
        --iteration-data payments.csv \
        --reporters cli,junit \
        --bail
      ```

      - `-e` / `--environment` - environment file path or UID;
      - `-d` / `--iteration-data` - JSON or CSV data file, one iteration per row;
      - `-n` / `--iteration-count` - number of iterations;
      - `-r` / `--reporters` - `cli`, `json`, `junit`, `html`;
      - `--bail` - stop at the first error; `--timeout-request` - per-request timeout in milliseconds.

      The pipeline publishes the JUnit report and fails the build if any test failed. Keys come from the pipeline's secret
      store into the environment at run time - never from the repository.

      In a request's post-response script, read the expected status from the data row:

      ```javascript
      pm.test('status as expected for this row', function () {
        pm.response.to.have.status(Number(pm.iterationData.get('expected_status')));
      });
      ```

  - id: tests
    kind: tests
    concepts: [postman-scripts-and-assertions, collection-runs-in-ci, postman-variables-and-environments]
    title: Checks that make a collection trustworthy
    body: |
      | ID | Check | Expected | Evidence |
      |---|---|---|---|
      | Q1 | every request has at least one `pm.test` on the status | no request without assertions | collection review |
      | Q2 | collection run against `sandbox` and against `staging` | same tests pass in both (or documented differences) | two run reports |
      | Q3 | run with globals cleared | no unresolved `{{variables}}` | run log, pre-request check |
      | Q4 | exported collection and environment JSON | no keys, tokens or personal data | file search |
      | Q5 | data-driven run with payments.csv | one result per row; failing rows identified | Runner or CLI report |
      | Q6 | chained run from a clean state | ids created in the run are used, nothing hard-coded | request log |
      | Q7 | CI run with a failing test | pipeline fails and shows the JUnit result | pipeline output |
      | Q8 | idempotency key per iteration | unique per row, same on a retried request | request headers |

  - id: mistakes
    kind: mistakes
    concepts: [postman-variables-and-environments, postman-scripts-and-assertions, collection-runs-in-ci]
    title: Common mistakes and how to avoid them
    body: |
      - **Hard-coded URLs and keys** in requests - use `{{base_url}}` and inherited authorisation.
      - **Secrets in shared values or exports** - use local values or the vault; search exports before sharing.
      - **Globals for everything** - they leak between collections and hide scope problems.
      - **Requests without tests** - a request that only "looks OK" in the response pane is not a test.
      - **Order-dependent collections that can't start clean** - create what you need in the run; clean up after.
      - **Assertions on whole response bodies** - brittle; assert the fields that matter.
      - **Still building on Newman** - Postman documents it as no longer maintained; new pipelines should use the Postman CLI.
      - **Treating Postman as the whole test strategy** - complex logic, contract checks and load tests have better tools.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [collection-runs-in-ci]
    title: Postman versus code-based API tests
    body: |
      | | Postman collections | Code (REST Assured, Playwright API, pytest...) |
      |---|---|---|
      | Start-up | very fast, visual | slower, needs a project |
      | Exploration and documentation | excellent | weaker |
      | Complex logic, helpers, reuse | limited, scripts get messy | full programming language |
      | Code review and diffs | JSON exports or Postman's own review features | normal pull requests |
      | CI | Postman CLI | native test runners and reports |

      A common split: Postman for exploration, examples and smoke checks shared with the team; code for the regression suite
      - see [network mocking and API testing with Playwright](#/lesson/playwright-network-and-api).

  - id: summary
    kind: summary
    title: Summary and quick reference
    body: |
      - **Collection** (requests, folders, scripts, auth) + **environment** per stage; `{{variables}}` everywhere.
      - Scopes broad → narrow: **global, collection, environment, data, local** - **narrowest wins**.
      - Secrets: local values or **Postman Vault**; nothing secret in exports.
      - Scripts: **Pre-request** prepares; **Post-response** asserts with `pm.test` and chains with
        `pm.collectionVariables.set`.
      - Data-driven runs with CSV/JSON; CI with **`postman collection run`** (`-e`, `-d`, `-n`, `-r cli,junit`, `--bail`).
        Newman is no longer maintained.

exercises:
  - id: scope-precedence
    type: mcq
    concept: postman-variables-and-environments
    skill: application
    title: Which base_url wins?
    prompt: |
      `base_url` is defined as a **global** (`https://api.staging.sandpay.example`), a **collection** variable
      (`https://api.dev.sandpay.example`) and in the selected **environment** (`https://api.sandpay.example`). Which value
      does a request using `{{base_url}}` get?
    options:
      - id: environment
        text: The environment's value
        feedback: Correct - environment is the narrowest of the three scopes, and the narrowest scope wins.
      - id: global
        text: The global value
        feedback: Global is the broadest scope - any narrower definition overrides it.
      - id: collection
        text: The collection value
        feedback: Collection is broader than environment in Postman's order, so the environment value wins.
      - id: error
        text: An error, because the name is ambiguous
        feedback: Postman doesn't raise an error; it applies the precedence rule.
    correct: [environment]
    hints:
      - Postman's order, broad to narrow - global, collection, environment, data, local.
    solution: |
      **The environment's value.** A data-file column called `base_url` or a local variable set in a script would override it
      in turn. Keep names unique per purpose to avoid surprises.
    followUp: |
      Which scope would you use for a value that differs per row of a data-driven run?

  - id: debug-script
    type: debug
    concept: postman-scripts-and-assertions
    skill: analysis
    title: The chained request that fails
    prompt: |
      The second request, `GET {{base_url}}/v1/payments/{{payment_id}}`, returns 404 every time in CI. Click the line in the
      first request's post-response script that causes it.
    language: javascript
    code: |
      pm.test('status is 201', function () {
        pm.response.to.have.status(201);
      });
      const body = pm.response.json();
      pm.test('payment id present', function () {
        pm.expect(body.id).to.match(/^pay_/);
      });
      pm.variables.set('payment_id', body.id);
    correctLines: [8]
    lineNotes:
      - line: 4
        note: Parsing the JSON body is correct.
      - line: 6
        note: Checking the id format is a good assertion.
    hints:
      - Which scope does pm.variables.set write to, and does it survive into the next request?
    solution: |
      **Line 8.** `pm.variables.set` writes a **local** variable that only lives for this request's scripts. The next request
      sees no `payment_id` - or an old value from another scope, hence the 404. Use
      `pm.collectionVariables.set('payment_id', body.id)` (or the environment) to pass it on.
    followUp: |
      Add a pre-request check to the second request that fails clearly when `payment_id` is empty.

  - id: data-driven-design
    type: testdesign
    concept: collection-runs-in-ci
    skill: application
    title: A data-driven payment run
    prompt: |
      Design a data-driven Postman run for `POST /v1/payments`: the CSV columns, at least six rows (valid and invalid), the
      post-response tests that use the data, and the Postman CLI command for CI with a JUnit report.
    hints:
      - Put the expected status and maybe the expected error type in the data, so one script fits all rows.
      - Include boundaries and a 0-decimal currency.
      - How does each iteration get its own idempotency key?
    modelAnswer: |
      CSV columns: `amount,currency,expected_status,expected_error_type`.

      Rows: `2500,EUR,201,` · `50,EUR,201,` (minimum) · `49,EUR,422,validation` · `1500,JPY,201,` ·
      `25.00,EUR,422,validation` (string with decimals) · `2500,XXX,422,validation` (unknown currency) ·
      `2500,,422,validation` (missing currency).

      Pre-request: `pm.variables.set('idempotency_key', 'pm-' + pm.info.iteration + '-' + Date.now())`.

      Post-response: status equals `expected_status`; for 2xx rows, `amount` and `currency` match the row and `id` starts with
      `pay_`; for error rows, `Content-Type` is `application/problem+json` and `type` ends with the expected error type; no
      stack traces in any body.

      CI: `postman collection run postman/collections/sandpay-payments -e staging.json -d payments.csv -r cli,junit`, the
      key injected from the pipeline's secrets, the JUnit report published, the build failing on any failed test.
    rubric:
      - Data columns include inputs and expected results
      - Rows cover valid, boundary and invalid inputs, including a non-2-decimal currency
      - A unique idempotency key per iteration
      - Tests read expectations from the data instead of one script per row
      - Error rows assert the error format and type
      - A Postman CLI command with environment, data and a JUnit reporter
      - Secrets come from the pipeline, not the repository
    solution: |
      Compare with the model answer. Putting **expectations in the data** is what lets one request and one script cover all
      rows.
    followUp: |
      How would you add a row whose expected result depends on an earlier row (for example a duplicate request with the same
      idempotency key)?

  - id: secrets-mcq
    type: mcq
    concept: postman-variables-and-environments
    skill: application
    title: Sharing the collection safely
    prompt: You want to share your SandPay collection and staging environment with a new colleague. What is the safest way to handle the API key?
    options:
      - id: vault-local
        text: Keep the key out of shared values - in Postman Vault or a local value - and let the colleague add their own key
        feedback: Correct - each person uses their own credentials, and nothing secret is synced or exported.
      - id: shared
        text: Put the key in the environment's shared value so it works for them straight away
        feedback: Shared values sync to everyone with access - and end up in exports. Keys spread far beyond the colleague.
      - id: header
        text: Hard-code the key in the Authorization header of each request
        feedback: Then the key is inside the collection itself and travels with every copy.
      - id: chat
        text: Export the environment with the key and send it in a chat
        feedback: Chats are logged and searched; the key is effectively published.
    correct: [vault-local]
    hints:
      - Which values sync to the team, and which stay on your machine?
    solution: |
      **Vault or local value, one key per person.** Keys shared by many people can't be revoked without breaking everyone, and
      can't be traced to a person.
    followUp: |
      You find a live key in a collection JSON in the Git history. What do you do, in order?

  - id: order-build
    type: order
    concept: postman-scripts-and-assertions
    skill: recall
    title: Building a maintainable collection
    prompt: Put the steps for building a maintainable collection in order.
    items:
      - id: structure
        text: Create the collection and its folders
      - id: variables
        text: Define collection variables and an environment per stage
      - id: auth
        text: Set authorisation once at collection level
      - id: requests
        text: Write requests using variables only
      - id: tests
        text: Add post-response tests and chain ids through variables
      - id: run
        text: Run it in the Collection Runner, then with the Postman CLI in CI
    hints:
      - Requests come after the variables they use.
    solution: |
      Structure → variables and environments → collection-level auth → requests → tests and chaining → runs. The order makes
      each later step reuse what earlier steps defined.

  - id: interview-postman
    type: interview
    concept: collection-runs-in-ci
    skill: application
    title: "Interview: Postman in your process"
    prompt: |
      *"How do you use Postman in your API testing, and how do you make those tests run automatically?"* Answer as you would
      in the interview.
    hints:
      - Structure, variables, scripts, data, CI - and where Postman stops being the right tool.
    modelAnswer: |
      I use Postman first to explore an API - read the docs, send requests, see real responses. Then I turn that into a
      collection: folders per resource, collection-level auth, everything parameterised with variables, and an environment
      per stage, with keys in local values or the vault so nothing secret is shared or exported.

      Every request gets post-response tests with pm.test - status, important headers and the fields that matter - and ids
      are passed between requests with collection variables so the whole collection runs from a clean state. For input
      variations I use data files, with the expected status in each row, and unique idempotency keys per iteration.

      To automate, I run the collection with the Postman CLI in the pipeline - environment and data files, secrets from the
      CI secret store, a JUnit reporter so failures show in the build. Postman documents Newman as no longer maintained, so
      I'd migrate any Newman jobs. For complex logic, contract checks or large regression suites I'd move to a code-based
      framework, keeping Postman for exploration and shared examples.
    rubric:
      - Described structure with folders, variables and environments
      - Kept secrets out of shared values and exports
      - Wrote assertions with pm.test and chained values through variables
      - Used data-driven runs with expectations in the data
      - Ran in CI with the Postman CLI and a report
      - Knew Newman's status or the CLI recommendation
      - Said where code-based tests are the better tool
    followUps:
      - How do you avoid order dependencies between requests?
      - How do you test negative cases in Postman without duplicating requests?
      - What would you check before sharing a collection publicly?
    solution: |
      Strong answers show the **path from exploration to automation** and an honest view of the tool's limits.

  - id: explain-unresolved
    type: short
    concept: postman-variables-and-environments
    skill: recall
    title: The unresolved variable
    prompt: In two or three sentences, explain what happens when a request uses a variable that isn't defined in any scope, and how to protect a collection against it.
    hints:
      - What does Postman send in place of an undefined variable?
    modelAnswer: |
      Postman sends the text literally - for example a header value of `{{api_key}}` - so the request fails in confusing ways
      (401, 404) rather than with a clear message. A collection-level pre-request script that checks required variables and
      fails a test when one is empty, plus consistent naming, makes the problem obvious.
    rubric:
      - Said the placeholder is sent as literal text
      - Said the failure looks unrelated (401, 404)
      - Proposed a pre-request check or naming discipline
    solution: |
      Run the collection with globals cleared from time to time - it reveals variables that only resolve on your machine.

placement:
  - id: place-scope
    type: mcq
    concept: postman-variables-and-environments
    skill: application
    title: The data file wins
    prompt: During a data-driven run, `currency` is defined in the environment (`EUR`) and as a column in the data file (`JPY` for this row). Which value does `{{currency}}` get in this iteration?
    options:
      - id: data
        text: JPY, from the data file
        feedback: Correct - data is a narrower scope than environment.
      - id: env
        text: EUR, from the environment
        feedback: Environment is broader than data; the data row overrides it.
      - id: both
        text: EUR,JPY
        feedback: Postman picks one value by precedence; it doesn't combine them.
      - id: none
        text: Nothing - the run stops with an error
        feedback: Duplicate names are resolved by precedence, not rejected.
    correct: [data]
    solution: |
      **JPY.** Narrowest wins: local > data > environment > collection > global.

  - id: place-chain
    type: mcq
    concept: postman-scripts-and-assertions
    skill: application
    title: Passing an id on
    prompt: A post-response script must store the new payment id so the next request in the collection can use it. Which call fits?
    options:
      - id: collection-var
        text: pm.collectionVariables.set('payment_id', pm.response.json().id)
        feedback: Correct - collection variables persist across the requests of the run.
      - id: local
        text: pm.variables.set('payment_id', pm.response.json().id)
        feedback: That sets a local variable, which doesn't carry over to the next request.
      - id: test
        text: pm.test('payment_id', pm.response.json().id)
        feedback: pm.test defines a named test; it doesn't store anything.
      - id: console
        text: console.log(pm.response.json().id)
        feedback: Logging shows the value but doesn't store it for other requests.
    correct: [collection-var]
    solution: |
      **pm.collectionVariables.set** (or the environment, if the value should belong to the stage).

  - id: place-cli
    type: mcq
    concept: collection-runs-in-ci
    skill: analysis
    title: Running in CI
    prompt: Which command runs a local collection with the staging environment file and a CSV data file, producing a JUnit report?
    options:
      - id: cli
        text: postman collection run postman/collections/sandpay -e staging.json -d payments.csv -r cli,junit
        feedback: Correct - these are the Postman CLI's documented options.
      - id: newman-old
        text: postman run --env staging --data payments.csv
        feedback: The Postman CLI's command is "collection run", with -e and -d options as documented.
      - id: npm
        text: npm test postman/collections/sandpay
        feedback: npm test runs a project's test script, not a Postman collection.
      - id: curl
        text: curl -X RUN postman/collections/sandpay
        feedback: curl sends single HTTP requests; it can't run collections or their scripts.
    correct: [cli]
    solution: |
      **`postman collection run ... -e ... -d ... -r cli,junit`.** Inject the key from the pipeline's secrets and publish the
      JUnit report.

recall:
  - id: recall-scopes
    concept: postman-variables-and-environments
    prompt: List Postman's variable scopes from broadest to narrowest.
    answer: Global, collection, environment, data, local - and the narrowest scope wins when names clash.
  - id: recall-secrets
    concept: postman-variables-and-environments
    prompt: Where should API keys live in Postman?
    answer: In Postman Vault or local values - never in shared values, hard-coded headers or exported files.
  - id: recall-scripts
    concept: postman-scripts-and-assertions
    prompt: What is the difference between Pre-request and Post-response scripts?
    answer: Pre-request scripts run before the request is sent (prepare data); post-response scripts run after the response (assertions, storing values).
  - id: recall-pmtest
    concept: postman-scripts-and-assertions
    prompt: How do you assert a status code in a Postman script?
    answer: pm.test('name', function () { pm.response.to.have.status(201); }).
  - id: recall-cli
    concept: collection-runs-in-ci
    prompt: What is Postman's recommended way to run collections from the command line?
    answer: The Postman CLI's postman collection run command; Newman is documented as no longer maintained.
  - id: recall-data
    concept: collection-runs-in-ci
    prompt: How does a data-driven collection run work?
    answer: Each row of a CSV or JSON file is one iteration; its columns become data variables that requests and scripts read.

