id: authentication-and-authorization
title: Authentication and authorization for API testers
subject: api-testing
module: api-foundations
level: intermediate
status: published
estimatedMinutes: 55
summary: Who is calling and what they may do - API keys, OAuth 2.0 access tokens, bearer tokens and JWTs - how each is checked, the standard error responses, and how to test object-, property- and function-level authorization, the most common source of API breaches.
tags: [api, security, authentication, authorization, oauth 2.0, bearer token, jwt, api keys, bola, owasp api top 10, scopes]

environment: |
  - **Standards:** **RFC 6749** (OAuth 2.0 framework), **RFC 6750** (bearer token usage - error codes `invalid_request`,
    `invalid_token`, `insufficient_scope`), **RFC 7519** (JSON Web Token - claims such as `iss`, `sub`, `aud`, `exp`,
    `nbf`, `iat`, `jti`), **RFC 8725** (JWT best current practices), **RFC 9700** (January 2025, *Best Current Practice for
    OAuth 2.0 Security*: the password grant "MUST NOT be used", clients "SHOULD NOT use the implicit grant", PKCE for
    public clients, audience-restricted tokens). All at [rfc-editor.org](https://www.rfc-editor.org/).
  - **Security guidance:** **OWASP API Security Top 10 - 2023** ([owasp.org/API-Security](https://owasp.org/API-Security/)),
    especially API1 Broken Object Level Authorization, API2 Broken Authentication, API3 Broken Object Property Level
    Authorization and API5 Broken Function Level Authorization.
  - **Ethics:** test only systems you are authorised to test, with test accounts. Security testing of other people's
    systems without permission is illegal in most countries.
  - **Fictional:** SandPay's keys (`sk_test_...`), scopes (`payments:read`, `refunds:write`) and accounts.

prerequisites:
  - http-request-response-anatomy
  - status-codes-and-errors

concepts:
  - id: api-credentials
    name: API credentials and tokens
    summary: API keys identify a client; OAuth 2.0 access tokens grant a client limited, expiring access on behalf of an owner; bearer tokens work for whoever holds them; JWTs carry signed claims that must be validated.
  - id: authorization-levels
    name: Object, property and function level authorization
    summary: Every request must check that this caller may perform this function, on this object, with these fields - checking only "is logged in" leads to the OWASP API1, API3 and API5 failures.
  - id: auth-error-responses
    name: Authentication and authorization errors
    summary: Missing or invalid credentials give 401 with WWW-Authenticate; valid credentials without permission give 403 (or 404 to hide the object); errors must not reveal more than necessary.

objectives:
  - Explain API keys, OAuth 2.0 access tokens, bearer tokens and JWTs, and what each one proves.
  - Validate a JWT's claims and recognise insecure handling such as accepting "alg none" or expired tokens.
  - Design tests for object-, property- and function-level authorization with two or more test accounts.
  - Check authentication and authorization error responses against RFC 6750 and RFC 9110.

sections:
  - id: intuition
    kind: intuition
    concepts: [api-credentials, authorization-levels]
    title: The idea in plain language
    body: |
      At an office building, the **badge** at the entrance proves who you are - that's **authentication**. Whether the
      badge opens the server room, the finance floor or only the canteen is **authorization**.

      Two classic failures:

      - A broken turnstile lets anyone in - **broken authentication**.
      - The turnstile works, but **every door inside opens for every badge** - broken authorization. This is the more
        common one, because it has to be right on every single door.

      APIs are buildings with thousands of doors: every endpoint, every object id, every field. Checking the badge at the
      entrance is easy; checking that **this** badge may open **this** door for **this** customer's data, on every
      request, is where APIs fail. OWASP ranks broken object-level authorization as the **number one** API security risk.

  - id: what
    kind: what
    concepts: [api-credentials]
    title: What the credential types are
    body: |
      | Credential | Proves | Typical use | Watch out for |
      |---|---|---|---|
      | **API key** (`sk_test_...`) | which client (merchant, service) is calling | server-to-server APIs such as SandPay | long-lived; leaks in code, logs, URLs; usually no user context |
      | **OAuth 2.0 access token** | the client has been granted limited access (scopes) on behalf of a resource owner | user-delegated access, partner integrations | expiry, scope, audience |
      | **Bearer token** (RFC 6750) | nothing about the holder - "any party in possession" can use it | how most access tokens are sent: `Authorization: Bearer <token>` | must travel only over TLS and never in URLs |
      | **JWT** (RFC 7519) | a set of **claims** signed by an issuer | a common format for access and ID tokens | must be **validated**: signature, algorithm, issuer, audience, expiry |
      | **Session cookie** | a browser session with the server | web front ends | cookie attributes (`Secure`, `HttpOnly`, `SameSite`) |

      OAuth 2.0 **grant types** decide how a client obtains a token. RFC 9700 (2025) narrows the safe choices: the
      **authorization code** grant (with **PKCE** for public clients such as mobile apps and single-page apps), **client
      credentials** for service-to-service calls, and refresh tokens. The **resource owner password credentials** grant
      "MUST NOT be used", and clients "SHOULD NOT use the implicit grant".

  - id: internals
    kind: internals
    concepts: [api-credentials]
    title: How a JWT access token is checked
    body: |
      A JWT is three base64url parts - header, payload (claims), signature - separated by dots. Decoded:

      ```json
      {"alg": "RS256", "typ": "JWT", "kid": "2026-10"}
      ```

      ```json
      {
        "iss": "https://auth.sandpay.example",
        "sub": "merchant_42",
        "aud": "https://api.sandpay.example",
        "scope": "payments:read refunds:write",
        "iat": 1791807600,
        "exp": 1791808500,
        "jti": "tok_8Wq3"
      }
      ```

      The API must check, for **every** request:

      1. the **signature**, with the issuer's key for that `kid`, using an **allowed algorithm** - never `none`, never an
         algorithm chosen by the token itself (RFC 8725);
      2. **`iss`** - issued by the expected authorisation server;
      3. **`aud`** - meant for **this** API (RFC 9700: access tokens "SHOULD be audience-restricted", and a resource server
         "MUST refuse" a token not meant for it);
      4. **`exp`** and **`nbf`** - not expired, already valid (with a small allowance for clock skew);
      5. **scopes** - include what this endpoint needs.

      **Decoding is not validating.** Anyone can create a JWT with any claims; only the signature check makes them
      trustworthy. And a JWT's payload is readable by anyone - it must not contain secrets.

  - id: why
    kind: why
    concepts: [authorization-levels]
    title: Why authorization fails so often
    body: |
      OWASP's 2023 list puts three authorization failures in the top five:

      | OWASP API Top 10 (2023) | What goes wrong | Payments example |
      |---|---|---|
      | **API1 Broken Object Level Authorization (BOLA)** | the API checks the caller is authenticated, but not that **this object** belongs to them | merchant A reads `GET /v1/payments/pay_91Qa`, which belongs to merchant B |
      | **API3 Broken Object Property Level Authorization** | the caller may see or change the object, but not **every field** | a customer updates their order and also sets `"status": "paid"` (mass assignment); a response exposes `internal_risk_score` |
      | **API5 Broken Function Level Authorization** | a **function** meant for some roles is callable by others | a read-only support key calls `POST /v1/refunds` |
      | API2 Broken Authentication | credentials or tokens are weak, unvalidated or leak | expired tokens accepted; JWT `alg: none` accepted |

      Why they survive testing: most tests use **one account** that legitimately owns everything it touches. An
      authorization defect only shows when **account B touches account A's things** - which no happy-path test does.

  - id: visual
    kind: visual
    concepts: [authorization-levels, auth-error-responses]
    title: "Flowchart: the checks on every request"
    body: |
      The order of checks for `POST /v1/payments/pay_81Fz/refunds`, and the response each failure should produce
      (common conventions; the API's documentation is the authority).

      ```mermaid
      flowchart TD
          A[Request arrives] --> B{Credentials present?}
          B -- No --> B1[401 with WWW-Authenticate, no error details]
          B -- Yes --> C{Valid - signature, issuer, audience, not expired?}
          C -- No --> C1[401 with WWW-Authenticate error=invalid_token]
          C -- Yes --> D{Function allowed - role or scope refunds:write?}
          D -- No --> D1[403 error=insufficient_scope]
          D -- Yes --> E{Object pay_81Fz belongs to this caller?}
          E -- No --> E1[404 - same as an unknown id]
          E -- Yes --> F{Only permitted fields in the body?}
          F -- No --> F1[400 or 422 - field not allowed]
          F -- Yes --> G[Process the refund]
      ```

  - id: steps
    kind: steps
    concepts: [authorization-levels]
    title: Step by step - an authorization test plan
    body: |
      1. **Get at least two test tenants** (merchants A and B), and for each **several roles** (admin, refunds agent,
         read-only) - every combination is a test identity.
      2. **List every endpoint and method** from the API documentation or the OpenAPI file, and what each role may do.
         Write it as a matrix: role × function.
      3. **Create objects as A** - a payment, a refund, a customer, a saved card.
      4. **Object level:** call every endpoint on A's objects **as B** - read, update, delete, sub-resources
         (`/payments/{id}/refunds`). Expected: refused, ideally exactly like an unknown id.
      5. **Function level:** call every function with every role, including undocumented "admin" routes found in the
         front end's code or the OpenAPI file. Expected: only allowed roles succeed.
      6. **Property level:** send extra fields in create and update requests (`status`, `amount_refunded`,
         `merchant_id`, `role`); check responses for fields the role shouldn't see.
      7. **Token checks:** no token, malformed, expired, wrong audience, wrong issuer, signed with an unknown key,
         `alg: none`, revoked, missing scope.
      8. **Record evidence** for every failure: both identities, the request, and the data returned - with test data only.

  - id: example
    kind: example
    concepts: [authorization-levels]
    title: "Real-world example: the receipt link"
    body: |
      The demo shop emails a receipt link: `https://shop.example.com/api/receipts/48211`. A tester with two test accounts
      opens account A's receipt while logged in as **account B** - and sees A's name, address, items and the last four
      digits of A's card.

      The endpoint checked that the caller was **logged in**, not that the receipt **belonged** to them - a textbook BOLA.
      The ids were sequential, so `48210`, `48209`... would have listed every customer's receipts.

      Evidence in the report: both test accounts, the request made as B with B's session (redacted), the response with A's
      data, and a note that ids are sequential. Severity: critical - personal data of all customers. Fixes: check
      ownership on every receipt request (404 for others), use unguessable ids as defence in depth (not as the fix), and add
      a cross-account test for every endpoint that takes an id.

  - id: code
    kind: code
    concepts: [auth-error-responses, api-credentials]
    title: Authentication and authorization error responses
    collapsed: true
    body: |
      No credentials at all - RFC 6750 says the server "SHOULD NOT include an error code":

      ```http
      HTTP/1.1 401 Unauthorized
      WWW-Authenticate: Bearer realm="sandpay"
      ```

      An expired or otherwise invalid token:

      ```http
      HTTP/1.1 401 Unauthorized
      WWW-Authenticate: Bearer realm="sandpay", error="invalid_token", error_description="The access token expired"
      ```

      A valid token without the needed scope:

      ```http
      HTTP/1.1 403 Forbidden
      WWW-Authenticate: Bearer realm="sandpay", error="insufficient_scope", scope="refunds:write"
      ```

      Test requests for the cross-account check, with keys from environment variables:

      ```bash
      # created by merchant A
      curl -s https://api.sandpay.example/v1/payments/pay_81Fz \
        -H "Authorization: Bearer $SANDPAY_KEY_A" -o /dev/null -w "A: %{http_code}\n"

      # the same payment requested by merchant B - expect the same response as for an unknown id
      curl -s https://api.sandpay.example/v1/payments/pay_81Fz \
        -H "Authorization: Bearer $SANDPAY_KEY_B" -o /dev/null -w "B: %{http_code}\n"
      curl -s https://api.sandpay.example/v1/payments/pay_doesnotexist \
        -H "Authorization: Bearer $SANDPAY_KEY_B" -o /dev/null -w "unknown: %{http_code}\n"
      ```

  - id: tests
    kind: tests
    concepts: [authorization-levels, auth-error-responses, api-credentials]
    title: Positive and negative test cases
    body: |
      | ID | Identity and request | Expected | Evidence |
      |---|---|---|---|
      | A1 | A reads A's payment | 200 with the payment | response |
      | A2 | B reads A's payment | 404, identical to an unknown id | both responses compared |
      | A3 | B refunds A's payment | 404; no refund created | response, A's refund list |
      | A4 | A's read-only key calls `POST /v1/refunds` | 403 `insufficient_scope` | response headers |
      | A5 | A updates an order with `"status": "paid"` in the body | field refused or ignored; status unchanged | response, order |
      | A6 | A's support role reads a payment | fields such as risk scores absent | response body |
      | T1 | no `Authorization` header | 401 with `WWW-Authenticate`, no error details | headers |
      | T2 | expired token | 401 `invalid_token` | headers |
      | T3 | token for another audience (`aud` of a different API) | 401 | response |
      | T4 | token with `"alg": "none"` and no signature | 401 | response |
      | T5 | token signed by an unknown key | 401 | response |
      | T6 | key in a query string (`?api_key=...`) | refused - credentials only in headers | response, logs |
      | T7 | revoked key | 401 within the documented time | response |

  - id: mistakes
    kind: mistakes
    concepts: [authorization-levels, api-credentials, auth-error-responses]
    title: Common mistakes and how to avoid them
    body: |
      - **Testing with one account.** Authorization defects only appear across accounts and roles - always use two tenants.
      - **Decoding a JWT and trusting it.** Validate signature, algorithm, issuer, audience and expiry.
      - **Checking only the list endpoint.** `GET /payments` filters by owner; `GET /payments/{id}` forgets to.
      - **Forgetting sub-resources and other methods.** `PUT`, `DELETE` and `/payments/{id}/refunds` need the same checks.
      - **403 for other tenants' objects** - confirms they exist; 404 is usually safer.
      - **Detailed errors for missing credentials** - RFC 6750 says not to include error details when no credentials were sent.
      - **Keys in URLs, logs or front-end code.** Search for them; treat any found as compromised and rotate.
      - **Relying on unguessable ids.** Random ids slow attackers down; only an ownership check stops them.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [api-credentials]
    title: Credential choices and their trade-offs
    body: |
      | Option | Good for | Risk | Tests to add |
      |---|---|---|---|
      | Static API keys | simple server-to-server | long-lived; leaks are serious | rotation, revocation, scoped keys, no keys in URLs |
      | OAuth 2.0 client credentials | service-to-service with scopes and expiry | token theft until expiry | expiry, audience, scope |
      | Authorization code + PKCE | user-delegated access, mobile and SPAs | redirect handling | redirect URI validation, PKCE enforced |
      | Self-contained JWT access tokens | no lookup per request | can't be revoked instantly | short expiry, revocation strategy |
      | Opaque tokens with introspection | instant revocation | a lookup per request | revocation takes effect |

  - id: summary
    kind: summary
    title: Summary and quick reference
    body: |
      - **Authentication** = who is calling; **authorization** = what they may do - checked on **every** request.
      - Credentials: API keys, OAuth 2.0 access tokens (via authorization code + PKCE or client credentials), bearer tokens,
        JWTs. RFC 9700: **no password grant, avoid implicit**, audience-restrict tokens.
      - JWT: validate **signature (allowed alg, never none), iss, aud, exp/nbf, scope** - decoding is not validating.
      - Authorization levels: **object (API1 BOLA), property (API3), function (API5)** - test with **two tenants and several
        roles**.
      - Errors: **401 + WWW-Authenticate** (`invalid_token`), **403** `insufficient_scope`, **404** for others' objects.

exercises:
  - id: bola-mcq
    type: mcq
    concept: authorization-levels
    skill: application
    title: Which test finds BOLA?
    prompt: Which test is designed to find **broken object level authorization** (OWASP API1:2023)?
    options:
      - id: cross-account
        text: Create a payment as merchant A, then request it with merchant B's valid key
        feedback: Correct - BOLA means an authenticated caller can reach another owner's object; only a second identity reveals it.
      - id: no-key
        text: Request a payment without any API key
        feedback: That tests authentication - the turnstile at the entrance - not whether objects are protected from other authenticated callers.
      - id: expired
        text: Request a payment with an expired token
        feedback: Also an authentication test (API2). BOLA is about valid callers reaching objects that aren't theirs.
      - id: role
        text: Call the refund endpoint with a read-only key
        feedback: That tests function-level authorization (API5) - the role, not the object.
    correct: [cross-account]
    hints:
      - Who is calling, and whose object is it?
    solution: |
      **Merchant B requesting merchant A's payment.** Expect the same response as for an id that doesn't exist. Repeat it for
      every endpoint and method that takes an id.
    followUp: |
      Which sub-resources and methods of a payment would you include in the same cross-account test?

  - id: jwt-claims
    type: mcq
    concept: api-credentials
    skill: application
    title: The token that should be refused
    prompt: |
      The SandPay API receives a JWT with valid signature from its own authorisation server, `"aud":
      "https://reports.sandpay.example"`, and an `exp` one hour in the future. What should `api.sandpay.example` do?
    options:
      - id: refuse
        text: Refuse it - the token's audience is a different resource server
        feedback: Correct - RFC 9700 says a resource server MUST refuse a token not meant for it.
      - id: accept-sig
        text: Accept it - the signature is valid and it hasn't expired
        feedback: A valid signature only proves who issued it; the audience says who it was issued for.
      - id: accept-same-issuer
        text: Accept it - it comes from the same company's authorisation server
        feedback: Same issuer, different audience - a token for the reports service must not work on the payments API.
      - id: downgrade
        text: Accept it, but only for read requests
        feedback: There is no partial acceptance for a token meant for another API; refuse it.
    correct: [refuse]
    hints:
      - Which claim says which API the token is for?
    solution: |
      **Refuse it (401).** Audience restriction stops a token stolen from one service - or legitimately held by it - from
      being replayed against another.
    followUp: |
      List the other claims you would test with manipulated values, and the expected response for each.

  - id: debug-ownership
    type: debug
    concept: authorization-levels
    skill: analysis
    title: Find the missing check
    prompt: Merchant B can read merchant A's payments. Click the line where the ownership check is missing.
    language: java
    code: |
      @GetMapping("/v1/payments/{id}")
      ResponseEntity<PaymentView> get(@PathVariable String id, Principal caller) {
          Merchant merchant = merchants.forKey(caller.getName());
          if (merchant == null) {
              return ResponseEntity.status(401).build();
          }
          Payment payment = payments.findById(id).orElse(null);
          if (payment == null) {
              return ResponseEntity.notFound().build();
          }
          return ResponseEntity.ok(PaymentView.of(payment));
      }
    correctLines: [7]
    lineNotes:
      - line: 4
        note: Rejecting unknown callers is the authentication check - it works.
      - line: 11
        note: Returning the view is fine once the payment is known to be the caller's.
    hints:
      - Which line fetches the payment, and does it care who is asking?
    solution: |
      **Line 7.** The payment is looked up by id alone. It must be looked up **for this merchant** -
      `payments.findByIdAndMerchant(id, merchant.id())` - so another merchant's payment falls into the 404 branch, exactly
      like an unknown id.
    followUp: |
      Write the automated test that would have caught it, with the two merchants and the expected identical responses.

  - id: authz-matrix
    type: testdesign
    concept: authorization-levels
    skill: application
    title: The authorization matrix
    prompt: |
      SandPay has two merchants (A, B) and three roles per merchant: admin, refunds agent, read-only. Endpoints:
      `GET /v1/payments/{id}`, `POST /v1/payments/{id}/refunds`, `PATCH /v1/customers/{id}` (name, email), and
      `GET /v1/reports/settlements`. Design the authorization tests: the expected result for each role and endpoint, the
      cross-merchant cases, and at least two property-level cases.
    hints:
      - Write the role × endpoint matrix first, then add the "other merchant" dimension.
      - Which fields should a PATCH of a customer never be able to change?
      - What should a refunds agent not see?
    modelAnswer: |
      Function level (own merchant):

      | Endpoint | admin | refunds agent | read-only |
      |---|---|---|---|
      | GET payment | 200 | 200 | 200 |
      | POST refund | 201 | 201 | 403 insufficient_scope |
      | PATCH customer | 200 | 403 | 403 |
      | GET settlement report | 200 | 403 | 403 (or 200 if documented) |

      Object level: every role of B on A's payment, refunds, customer → 404, identical to unknown ids; A's data unchanged.

      Property level: PATCH a customer with `"merchant_id": "B"` or `"risk_level": "low"` → field rejected or ignored, value
      unchanged; GET payment as refunds agent → no internal fields such as risk scores or full card data.

      Token level for each: no token 401, expired 401 invalid_token, wrong audience 401.

      Evidence: request, identity used, response, and the state of the object before and after.
    rubric:
      - Built a role by endpoint matrix with expected codes
      - Covered every endpoint with another merchant's identity
      - Expected 404 identical to unknown ids for cross-merchant access
      - Included property-level cases such as mass assignment or hidden fields
      - Checked that refused requests changed nothing
      - Included basic token failures
    solution: |
      Compare with the model answer. The matrix is the deliverable: it makes gaps visible and gives developers a checklist.
    followUp: |
      How would you keep this matrix up to date automatically when new endpoints are added to the OpenAPI file?

  - id: expired-token-response
    type: mcq
    concept: auth-error-responses
    skill: analysis
    title: Read the expired-token response
    prompt: |
      A request with an expired access token gets this response. What is wrong with it?

      ```http
      HTTP/1.1 403 Forbidden
      Content-Type: application/json

      {"error": "token expired at 2026-10-12T09:00:00Z for merchant_42 (key sk_test_...9f3a)"}
      ```
    options:
      - id: status-and-header
        text: It should be 401 with a WWW-Authenticate header carrying error="invalid_token", and it reveals more than needed
        feedback: Correct - an expired token is invalid credentials (401 per RFC 6750 and RFC 9110), the challenge header is missing, and the body leaks the merchant and part of the key.
      - id: nothing
        text: Nothing - 403 is right for expired tokens
        feedback: 403 means valid but insufficient credentials. An expired token isn't valid - RFC 6750 says invalid_token with 401.
      - id: only-body
        text: Only the body is wrong; the status is fine
        feedback: The status is also wrong, and the required WWW-Authenticate header is missing.
      - id: should-be-400
        text: It should be 400 with error="invalid_request"
        feedback: invalid_request is for malformed requests; a well-formed request with an expired token is invalid_token.
    correct: [status-and-header]
    hints:
      - Is an expired token "valid but not enough" or "not valid"?
      - Which header must a 401 carry?
    solution: |
      **401, WWW-Authenticate with `error="invalid_token"`, and less detail.** Clients use the 401 plus the challenge to
      refresh their token automatically; a 403 tells them refreshing won't help. The merchant id and key fragment are
      unnecessary details in an error.
    followUp: |
      Write the correct response, headers included.

  - id: order-jwt-validation
    type: order
    concept: api-credentials
    skill: recall
    title: Validating a JWT access token
    prompt: Put the JWT checks in a sensible order for a resource server.
    items:
      - id: parse
        text: Parse the token and reject anything malformed
      - id: alg
        text: Check the algorithm is one the API allows (never none)
      - id: sig
        text: Verify the signature with the issuer's key for the kid
      - id: iss-aud
        text: Check iss is the expected issuer and aud is this API
      - id: time
        text: Check exp and nbf against the current time
      - id: scope
        text: Check the scopes for this endpoint
    hints:
      - Nothing in the claims can be trusted before the signature is verified.
    solution: |
      Parse → algorithm → signature → issuer and audience → time → scopes. Claims are only meaningful once the signature,
      made with an allowed algorithm, is verified.

  - id: interview-api-security
    type: interview
    concept: authorization-levels
    skill: application
    title: "Interview: how do you test API authorization?"
    prompt: |
      *"How would you test that our payments API enforces authorization correctly?"* Answer as you would in the interview.
    hints:
      - Identities first; then the three levels; then the token checks.
    modelAnswer: |
      I'd separate authentication from authorization. For authentication: no token, malformed, expired, wrong audience or
      issuer, unknown signing key, alg none, revoked keys, keys in URLs - each should give 401 with WWW-Authenticate, with
      no error details when no credentials were sent.

      For authorization I need at least two tenants with several roles each. Then three levels from the OWASP API Top 10.
      Object level: create objects as tenant A and call every endpoint and method that takes an id as tenant B - reads,
      updates, deletes and sub-resources - expecting the same response as for an unknown id and no change to A's data.
      Function level: a role-by-endpoint matrix, including admin routes found in the front end or the OpenAPI file, with
      insufficient_scope 403s where roles lack permission. Property level: mass assignment of fields like status or
      merchant_id, and responses that expose fields a role shouldn't see.

      I'd automate the cross-tenant tests for every endpoint in the OpenAPI file, so new endpoints get the check by default,
      and report any failure as a security defect with both identities and redacted evidence.
    rubric:
      - Separated authentication from authorization
      - Listed token and credential negative cases
      - Used at least two tenants and several roles
      - Covered object-level (BOLA) with every method and sub-resource
      - Covered function-level with a role matrix
      - Covered property-level (mass assignment, excessive data)
      - Proposed automating cross-tenant checks from the API definition
    followUps:
      - Why might you return 404 instead of 403?
      - What's wrong with putting an API key in a query string?
      - How do you test that a revoked key stops working?
    solution: |
      The phrase interviewers listen for is **"a second tenant"** - authorization can't be tested with one identity.

  - id: explain-bearer
    type: short
    concept: api-credentials
    skill: recall
    title: What "bearer" means
    prompt: In two or three sentences, explain what a bearer token is and two rules that follow from it.
    hints:
      - Who can use a bearer token?
    modelAnswer: |
      A bearer token grants access to whoever presents it - the server doesn't check who the holder is. So it must only
      travel over TLS and never in URLs or logs, and it should be short-lived and limited in scope and audience, because a
      stolen token works for the thief.
    rubric:
      - Said whoever holds it can use it
      - Named protecting it in transit and from URLs or logs
      - Named limiting lifetime, scope or audience
    solution: |
      RFC 6750 states it directly: "any party in possession of a bearer token" can use it.

placement:
  - id: place-401-403
    type: mcq
    concept: auth-error-responses
    skill: application
    title: Valid key, missing permission
    prompt: A request carries a valid, unexpired access token, but its scope doesn't include `refunds:write`, which the endpoint requires. What should the API answer, per RFC 6750?
    options:
      - id: r403
        text: 403 Forbidden with error="insufficient_scope"
        feedback: Correct - the credentials are valid but insufficient.
      - id: r401
        text: 401 Unauthorized with error="invalid_token"
        feedback: invalid_token means the token itself is expired, revoked or malformed; this one is valid.
      - id: r400
        text: 400 Bad Request with error="invalid_request"
        feedback: invalid_request is for malformed requests; this request is well formed.
      - id: r200
        text: 200 OK with an empty body
        feedback: Silently doing nothing hides the problem from the client.
    correct: [r403]
    solution: |
      **403 with insufficient_scope** (and optionally the required `scope`).

  - id: place-bola
    type: mcq
    concept: authorization-levels
    skill: analysis
    title: Name the vulnerability
    prompt: An authenticated customer changes the order id in `GET /api/orders/1043` to `1042` and sees another customer's order. What is this?
    options:
      - id: bola
        text: Broken object level authorization (OWASP API1)
        feedback: Correct - the API doesn't check that the object belongs to the caller.
      - id: broken-auth
        text: Broken authentication (OWASP API2)
        feedback: The customer is genuinely authenticated; the failure is in authorizing access to the object.
      - id: function
        text: Broken function level authorization (OWASP API5)
        feedback: Reading an order is a function customers may use; the problem is whose order.
      - id: rate
        text: Unrestricted resource consumption
        feedback: Rate limits might slow enumeration, but the defect is the missing ownership check.
    correct: [bola]
    solution: |
      **BOLA.** Fix with an ownership check on every object access; test with a second account.

  - id: place-jwt
    type: mcq
    concept: api-credentials
    skill: analysis
    title: Decoded is not validated
    prompt: A service reads the `sub` claim from a JWT by base64-decoding the payload, without checking the signature. Why is that a problem?
    options:
      - id: forge
        text: Anyone can create a token with any sub and the service will believe it
        feedback: Correct - only the signature check makes the claims trustworthy.
      - id: encrypted
        text: The payload is encrypted, so decoding gives garbage
        feedback: A signed JWT's payload is only encoded, not encrypted - which is exactly why it can be forged without validation.
      - id: slow
        text: Decoding is too slow for every request
        feedback: Performance isn't the issue; trust is.
      - id: fine
        text: It's fine because the token came over HTTPS
        feedback: TLS protects the token in transit; it says nothing about who created it.
    correct: [forge]
    solution: |
      **Forgery.** Validate the signature with an allowed algorithm, then iss, aud, exp and scopes.

recall:
  - id: recall-authn-authz
    concept: authorization-levels
    prompt: What is the difference between authentication and authorization?
    answer: Authentication establishes who is calling; authorization decides what that caller may do - on every request, for every object and field.
  - id: recall-owasp
    concept: authorization-levels
    prompt: Name the three authorization risks in the OWASP API Security Top 10 2023.
    answer: API1 Broken Object Level Authorization, API3 Broken Object Property Level Authorization and API5 Broken Function Level Authorization.
  - id: recall-jwt-checks
    concept: api-credentials
    prompt: What must a resource server check in a JWT access token?
    answer: The signature with an allowed algorithm (never none), the issuer, the audience, expiry and not-before, and the scopes.
  - id: recall-grants
    concept: api-credentials
    prompt: Which OAuth 2.0 grants does RFC 9700 rule out or discourage?
    answer: The resource owner password credentials grant must not be used, and clients should not use the implicit grant; use authorization code with PKCE instead.
  - id: recall-6750-errors
    concept: auth-error-responses
    prompt: What are RFC 6750's bearer token error codes and their usual status codes?
    answer: invalid_request (400), invalid_token (401) and insufficient_scope (403).
  - id: recall-no-creds
    concept: auth-error-responses
    prompt: How should an API answer a request with no credentials at all?
    answer: 401 with a WWW-Authenticate challenge and, per RFC 6750, no error code or error details.

