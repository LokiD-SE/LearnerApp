environment: |
  - **Runtime:** **Python 3.12.3**, **NumPy 2.5.4**, **pandas 3.1.1**, **SciPy 1.18.1** and **scikit-learn
    1.9.1** - the versions pinned in `practice/ai/requirements.txt` (SciPy comes with scikit-learn). Every
    printed number, array and table in this lesson was produced by running the code shown on Linux in November
    2026, with fixed random seeds; the same versions give the same output, other versions may differ in the last
    digits.
  - **Data:** all merchants and transactions are **synthetic**, generated by the `data.py` shown in the lesson
    with fixed seeds. SandPay is a fictional payments company; no real merchant, card or payment data is used.
  - **scikit-learn documentation (version 1.9.1):** [2.3 Clustering](https://scikit-learn.org/stable/modules/clustering.html)
    (K-means: "Inertia makes the assumption that clusters are convex and isotropic", "Inertia is not a
    normalized metric", "K-means is often referred to as Lloyd's algorithm", "Given enough time, K-means will
    always converge, however this may be to a local minimum", the `init='k-means++'` scheme; DBSCAN: core
    samples, `min_samples` and `eps`, "When chosen too small, most data will not be clustered at all (and
    labeled as -1 for 'noise')"; 2.3.11.5 Silhouette Coefficient `s = (b - a) / max(a, b)` and its drawback
    that it "is generally higher for convex clusters than other concepts of clusters, such as density based
    clusters like those obtained through DBSCAN"); [2.5 Decomposing signals in
    components](https://scikit-learn.org/stable/modules/decomposition.html) (2.5.1 PCA: "PCA centers but does
    not scale the input data for each feature before applying the SVD", `whiten=True`); [2.7 Novelty and Outlier
    Detection](https://scikit-learn.org/stable/modules/outlier_detection.html) (outlier versus novelty detection;
    `predict` returns 1 for inliers and -1 for outliers; `score_samples`, `decision_function` and
    `contamination`; 2.7.3.2 Isolation Forest). API docstrings checked in the installed 1.9.1:
    [`KMeans`](https://scikit-learn.org/stable/modules/generated/sklearn.cluster.KMeans.html) (`n_init='auto'`
    runs once with `k-means++` and 10 times with `random`; `tol=0.0001`),
    [`DBSCAN`](https://scikit-learn.org/stable/modules/generated/sklearn.cluster.DBSCAN.html) (`eps=0.5`,
    `min_samples=5`, which counts the point itself),
    [`IsolationForest`](https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.IsolationForest.html)
    (`max_samples='auto'` is `min(256, n_samples)`, `contamination='auto'`; `score_samples` is the "Opposite of
    the anomaly score defined in the original paper" - "The lower, the more abnormal"),
    [`PCA`](https://scikit-learn.org/stable/modules/generated/sklearn.decomposition.PCA.html).
  - **Lecture notes:** Tengyu Ma and Andrew Ng, [CS229 Lecture Notes](https://cs229.stanford.edu/main_notes.pdf)
    (Stanford, version of 23 August 2026): chapter 10 "Clustering and the k-means algorithm" (the algorithm, the
    distortion function J, "k-means is exactly coordinate descent on J", "susceptible to local optima", run it
    many times and keep the lowest J) and chapter 12 "Principal components analysis" (normalise each feature to
    mean 0 and variance 1 first; the principal directions are the top eigenvectors of the covariance matrix;
    uses in compression, visualisation, preprocessing and noise reduction).
  - **Papers:** David Arthur and Sergei Vassilvitskii, [k-means++: The Advantages of Careful
    Seeding](https://theory.stanford.edu/~sergei/papers/kMeansPP-soda.pdf) (SODA 2007) - the D-squared seeding
    (steps 1a-1c) and "E[phi] <= 8(ln k + 2) phi_OPT" (Theorem 1.1); Martin Ester, Hans-Peter Kriegel, Joerg
    Sander and Xiaowei Xu, [A Density-Based Algorithm for Discovering Clusters in Large Spatial Databases with
    Noise](https://cdn.aaai.org/KDD/1996/KDD96-037.pdf) (KDD 1996) - Eps-neighbourhood, MinPts, core points,
    density-reachability and noise; Fei Tony Liu, Kai Ming Ting and Zhi-Hua Zhou, [Isolation
    Forest](https://cs.nju.edu.cn/zhouzh/zhouzh.files/publication/icdm08b.pdf) (ICDM 2008) - anomalies are "few
    and different", path length h(x), c(n) = 2H(n - 1) - 2(n - 1)/n (eq. 1), the score s(x, n) = 2^(-E(h(x)) /
    c(n)) (eq. 2) and its reading (near 1 anomalous, much below 0.5 normal, all about 0.5 no distinct anomaly),
    defaults psi = 256 and t = 100.
  - **Textbook:** Ian Goodfellow, Yoshua Bengio and Aaron Courville, [Deep Learning](https://www.deeplearningbook.org/)
    (MIT Press, 2016), section 2.12 "Example: Principal Components Analysis" and section 3.9.3 (the multivariate
    normal distribution).
  - **Builds on:** [Python, NumPy and pandas](#/lesson/python-numpy-pandas), [The maths of machine
    learning](#/lesson/ml-maths-essentials) (vectors, norms, matrices, the normal distribution),
    [Evaluation, overfitting and regularisation](#/lesson/model-evaluation-and-overfitting) (precision, recall,
    average precision) and [Feature engineering and scikit-learn pipelines](#/lesson/scikit-learn-pipelines)
    (scaling inside a pipeline).

prerequisites:
  - python-numpy-pandas
  - ml-maths-essentials
  - model-evaluation-and-overfitting
