id: unsupervised-learning
title: Clustering, anomaly detection and PCA
subject: ai-engineering
module: ml-foundations
level: intermediate
status: published
estimatedMinutes: 90
summary: Learning structure from data without labels - k-means with k-means++ seeding, choosing k with the elbow and the silhouette, why scaling decides the clusters, DBSCAN for clusters of any shape, anomaly detection with a Gaussian density and an Isolation Forest, evaluating detectors with very few labels, and PCA through the SVD with explained variance, reconstruction error and whitening. Every number shown comes from code run with scikit-learn 1.9.1 on synthetic SandPay data.
