concepts:
  - id: kmeans-clustering
    name: k-means clustering, k-means++ and choosing k
    summary: k-means splits rows into k groups by alternating two steps - assign each row to its nearest centroid, move each centroid to the mean of its rows - which never increases the inertia (within-cluster sum of squares) but can stop in a local minimum. k-means++ seeds centroids far apart (each next one with probability proportional to squared distance) and several runs keep the best. Distances depend on units, so features must be scaled; k is chosen with the elbow of the inertia curve and the silhouette score, and checked against what the business can use.
  - id: density-clustering-and-validation
    name: DBSCAN and judging clusters without labels
    summary: DBSCAN grows clusters from core points (at least min_samples rows within eps) and calls rows far from every core point noise, so it finds clusters of any shape and does not need k - but eps must suit the data's scale. Without labels, internal scores such as the silhouette favour round clusters, k-means finds "clusters" even in uniform noise, and cluster numbers change between runs; check stability and usefulness, not only a score.
  - id: anomaly-detection
    name: Anomaly detection with densities and isolation
    summary: An anomaly detector fits what normal data looks like and ranks rows by how unusual they are. A Gaussian density model flags rows with low log-density (computed in logs, because the density underflows); an Isolation Forest flags rows that random splits isolate in few steps. scikit-learn's score_samples is higher for normal rows, contamination only sets the cut-off, and with very few labels you choose and check the threshold on the rows analysts actually review.
  - id: pca-dimensionality-reduction
    name: PCA - principal components, explained variance and reconstruction
    summary: PCA centres the data and finds orthogonal directions of largest variance - the right singular vectors of the centred data. The explained variance ratio says how much each direction keeps, a few components often keep almost everything, and the reconstruction error of a row shows how badly the kept components describe it. Unscaled features let the largest unit dominate; whitening rescales components to unit variance.

objectives:
  - Run k-means by hand and in code, explain why the inertia never increases yet the result can be a local minimum, and how k-means++ and several restarts help.
  - Show with real numbers how feature units change k-means clusters, and scale (and log-transform) features before clustering.
  - Choose k from an inertia curve and silhouette scores, and say why neither proves that clusters exist.
  - Use DBSCAN for non-convex clusters, choose eps from nearest-neighbour distances, and read its noise label.
  - Build a Gaussian density detector computed in log space, use an Isolation Forest with the right score sign, and explain what contamination does.
  - Evaluate an anomaly detector when labels are scarce - review queues, precision at k, and why a threshold tuned on a few frauds is optimistic.
  - Compute PCA with the SVD, read explained variance ratios, use reconstruction error to flag unusual rows, and explain centring, scaling and whitening.

sections:
  - id: intuition
    kind: intuition
    concepts: [kmeans-clustering, anomaly-detection, pca-dimensionality-reduction]
    title: The idea in plain language
    body: |
      Imagine SandPay's sales team hands you a spreadsheet of 600 merchants - monthly card volume, average
      ticket, refund rate, share of card-not-present payments - and asks: **"What kinds of merchants do we
      have?"** Nobody has labelled them. There is no column to predict. You can still learn a lot:

      - **Clustering** sorts the merchants into groups that resemble each other - like a librarian shelving
        books by putting similar ones together without a catalogue. The groups might turn out to be corner
        cafes, online shops, travel agents and grocery chains.
      - **Anomaly detection** looks for the few rows that resemble *nothing* - like a bank teller who has handled
        thousands of normal deposits and notices the one that "feels wrong". For SandPay that is a transaction
        at 03:00, 40 km from home, the fifth on the card in an hour.
      - **Dimensionality reduction (PCA)** summarises many columns with a few - like describing a face by "how
        wide" and "how long" rather than by 10000 pixel values. A merchant's 24 hourly volume shares turn out to
        need only two numbers.

      The catch is in the first sentence: **nobody labelled the data**. Supervised learning has an answer key to
      score against; unsupervised learning does not. Every algorithm in this lesson will happily return groups,
      scores and components - even for pure noise. So half of this lesson is about the methods and half is about
      not fooling yourself with them.

  - id: what
    kind: what
    concepts: [kmeans-clustering, density-clustering-and-validation, anomaly-detection, pca-dimensionality-reduction]
    title: Terms you need
    body: |
      | Term | Meaning |
      | --- | --- |
      | **Unsupervised learning** | learning from inputs x alone - no labels y. CS229 puts it as "we are given a training set ... but no labels y(i) are given" |
      | **Cluster** | a group of rows more similar to each other than to rows in other groups |
      | **Centroid** | the mean of the rows in a cluster - in general not one of the rows itself |
      | **Inertia** | the within-cluster sum of squares: the sum, over all rows, of the squared distance to the row's own centroid. CS229 calls it the **distortion** J. Lower is tighter; 0 is optimal |
      | **k-means++** | a way to choose the starting centroids far apart, by sampling rows with probability proportional to their squared distance from the centroids chosen so far |
      | **Silhouette score** | for each row, (b - a) / max(a, b), where a is its mean distance to its own cluster and b to the nearest other cluster; averaged over rows. From -1 (wrong cluster) to +1 (dense, well separated) |
      | **DBSCAN** | density-based clustering: clusters are areas where rows have at least `min_samples` neighbours within `eps`; rows far from every dense area are **noise** (label -1) |
      | **Anomaly / outlier** | a row unlike the bulk of the data. scikit-learn distinguishes **outlier detection** (the training data contains outliers) from **novelty detection** (the training data is clean and new rows are judged) |
      | **Contamination** | in scikit-learn, the expected share of outliers - used only to set the cut-off between "inlier" and "outlier" |
      | **Principal components** | orthogonal unit directions along which the centred data varies most, in decreasing order |
      | **Explained variance ratio** | the share of the total variance along one component |
      | **Reconstruction error** | how far a row is from its approximation by the kept components |
      | **Whitening** | rescaling the component scores so that each has variance 1 |

      Two scikit-learn conventions trip people up, so learn them now: an outlier detector's `predict` returns
      **1 for inliers and -1 for outliers**, and its `score_samples` is **higher for normal rows** - "The lower,
      the more abnormal", in the docstring's words.

  - id: why
    kind: why
    concepts: [kmeans-clustering, anomaly-detection, density-clustering-and-validation]
    title: Why unsupervised methods matter - and why they are dangerous
    body: |
      Labels are expensive and slow. A fraud label arrives weeks later as a chargeback; a "merchant segment"
      label does not exist until someone defines segments. Meanwhile SandPay has millions of unlabelled rows.
      Unsupervised methods let you:

      - **Segment** merchants or customers for pricing, risk tiers or onboarding checks.
      - **Find new fraud patterns** that no rule and no supervised model has seen - a supervised model only
        recognises fraud that looks like past labelled fraud.
      - **Monitor** data quality and drift: a sudden rise in anomaly scores often means an upstream change.
      - **Compress** many correlated features into a few before another model or a chart.

      The danger is that there is no answer key. A clustering of noise looks as tidy as a clustering of real
      segments; a detector flags *something* every day; PCA always returns components. The defences are the
      ones you already know from testing: an independent oracle where you can get one (a few labelled rows,
      a known segment, an analyst's review), checks of stability (does it change with the seed?), and checks of
      usefulness (can the business act on it?).

  - id: data-setup
    kind: code
    concepts: [kmeans-clustering, anomaly-detection]
    title: The synthetic SandPay data used in this lesson
    collapsed: true
    body: |
      Every experiment in this lesson uses this generator (`data.py`). The merchants come from four segments, so
      for once we *know* the true groups and can check what the algorithms find. The transactions contain 0.5%
      fraud that is "few and different" - larger amounts, odd hours, further from home, more transactions on the
      card in the last hour - but overlaps with genuine rows.

      ```python
      """Synthetic SandPay data for the unsupervised-learning lesson (not real merchants or payments)."""
      import numpy as np
      import pandas as pd

      SEGMENTS = {
          # name: (monthly volume EUR, average ticket EUR, refund rate, share of card-not-present)
          "corner cafes": (18_000, 9, 0.004, 0.05),
          "online shops": (140_000, 65, 0.035, 0.95),
          "travel agents": (420_000, 780, 0.060, 0.80),
          "grocery chains": (900_000, 38, 0.010, 0.10),
      }


      def make_merchants(n_per_segment=150, seed=7):
          rng = np.random.default_rng(seed)
          rows = []
          for name, (vol, ticket, refund, cnp) in SEGMENTS.items():
              for _ in range(n_per_segment):
                  rows.append({
                      "monthly_volume": round(vol * rng.lognormal(0, 0.35), 2),
                      "avg_ticket": round(ticket * rng.lognormal(0, 0.25), 2),
                      "refund_rate": round(float(np.clip(rng.normal(refund, refund * 0.3), 0, 1)), 4),
                      "cnp_share": round(float(np.clip(rng.normal(cnp, 0.06), 0, 1)), 3),
                      "segment": name,
                  })
          return pd.DataFrame(rows).sample(frac=1, random_state=seed).reset_index(drop=True)


      def make_transactions(n=20_000, fraud_rate=0.005, seed=11):
          """Card transactions with a few frauds that are 'few and different'."""
          rng = np.random.default_rng(seed)
          n_fraud = int(n * fraud_rate)
          n_ok = n - n_fraud
          ok = np.column_stack([
              rng.normal(3.4, 0.8, n_ok),           # log amount
              rng.normal(14, 3.5, n_ok) % 24,        # hour of day
              np.abs(rng.normal(0, 12, n_ok)),      # km from home
              rng.poisson(2, n_ok),                 # transactions on the card in the last hour
          ])
          fr = np.column_stack([
              rng.normal(4.3, 1.0, n_fraud),
              rng.normal(9, 6, n_fraud) % 24,
              np.abs(rng.normal(40, 60, n_fraud)),
              rng.poisson(4, n_fraud),
          ])
          X = np.vstack([ok, fr])
          y = np.r_[np.zeros(n_ok, int), np.ones(n_fraud, int)]
          idx = rng.permutation(n)
          cols = ["log_amount", "hour", "km_from_home", "txns_last_hour"]
          return pd.DataFrame(X[idx], columns=cols), y[idx]


      def make_hourly_profiles(n=400, n_odd=6, seed=5):
          """Share of each merchant's daily card volume in each of the 24 hours (rows sum to 1).

          Most merchants mix three daily patterns (morning, lunch and evening peaks); the last ``n_odd`` rows
          are merchants whose volume arrives mostly between 01:00 and 04:00.
          """
          rng = np.random.default_rng(seed)
          hours = np.arange(24)
          bump = lambda c, w: np.exp(-0.5 * ((hours - c) / w) ** 2)
          shapes = np.vstack([bump(8, 1.5), bump(12.5, 1.2), bump(19, 2.0)])
          mix = rng.dirichlet([2, 2, 2], size=n)
          P = mix @ shapes + rng.gamma(2, 0.01, size=(n, 24))
          odd = bump(2.5, 1.0) + 0.3 * bump(19, 2.0)
          P[-n_odd:] = odd + rng.gamma(2, 0.01, size=(n_odd, 24))
          return P / P.sum(axis=1, keepdims=True)
      ```

      The first rows of the merchants, and their spread:

      ```plaintext
         monthly_volume  avg_ticket  refund_rate  cnp_share         segment
      0       126195.54       81.02       0.0313      0.902    online shops
      1        13954.93        7.10       0.0037      0.017    corner cafes
      2      1203925.69       31.62       0.0134      0.087  grocery chains
      3       935246.76       66.56       0.0111      0.051  grocery chains
      4       353792.20      490.86       0.0357      0.702   travel agents

             monthly_volume  avg_ticket  refund_rate  cnp_share
      mean       394463.731     231.305        0.028      0.469
      std        406093.039     351.591        0.024      0.402
      min          9447.640       4.680        0.000      0.000
      max       2422503.330    1646.420        0.109      1.000
      ```

      Look at the standard deviations: about 406000 for volume and 0.024 for the refund rate. Remember that when
      we compute distances.

  - id: kmeans-internals
    kind: internals
    concepts: [kmeans-clustering]
    title: How k-means works - Lloyd's algorithm
    body: |
      k-means needs the number of clusters **k** and minimises the **inertia**

      ```plaintext
      J(c, mu) = sum over rows i of || x(i) - mu_c(i) ||^2
      ```

      where c(i) is the cluster of row i and mu_j the centroid of cluster j. Finding the exact minimum is
      NP-hard even for two clusters (Arthur and Vassilvitskii), so everyone uses **Lloyd's algorithm**, the
      local search CS229 gives:

      1. **Initialise** k centroids (for example k random rows).
      2. **Assign** every row to its nearest centroid.
      3. **Update** every centroid to the mean of the rows assigned to it.
      4. Repeat 2-3 until the centroids stop moving.

      **Why it converges.** CS229 shows that k-means "is exactly coordinate descent on J": step 2 minimises J
      over the assignments with the centroids fixed (each row picks its closest centroid), and step 3 minimises
      J over the centroids with the assignments fixed (the mean minimises the sum of squared distances). Neither
      step can increase J, so J decreases monotonically and converges.

      **Why it can be wrong.** J is not convex, so coordinate descent stops in a **local minimum** that depends on
      the starting centroids. CS229's remedy: "run k-means many times (using different random initial values
      ...) Then, out of all the different clusterings found, pick the one that gives the lowest distortion".

      **k-means++** makes each start better. Arthur and Vassilvitskii's seeding, with D(x) the distance from x
      to the nearest centroid chosen so far:

      - **1a.** Choose the first centroid uniformly at random from the rows.
      - **1b.** Choose the next centroid as row x with probability D(x)^2 / sum of D(x)^2 over all rows.
      - **1c.** Repeat 1b until there are k centroids, then run Lloyd's algorithm.

      Rows far from every chosen centroid are likely picks, so the starts spread out. Their Theorem 1.1 bounds
      the expected inertia right after seeding at 8(ln k + 2) times the optimum - a guarantee random seeding
      cannot give.

      **In scikit-learn 1.9.1** `KMeans` defaults to `init='k-means++'` and `n_init='auto'`, which runs **once**
      with k-means++ and **10 times** with `init='random'`, keeping the lowest inertia. It stops when the
      centroids move less than `tol` (0.0001, relative to the data's variance) - not, the user guide notes, when
      the inertia stops falling.

  - id: kmeans-scaling
    kind: code
    concepts: [kmeans-clustering]
    title: Scaling decides what k-means finds
    body: |
      k-means uses Euclidean distance, so a feature measured in euros dominates one measured as a fraction.
      Three runs on the 600 merchants, each with k = 4 and the true segment shown only to check the result
      (the **adjusted Rand index**, ARI, is 1.0 for a perfect match with the true groups and about 0 for a
      random one, whatever the cluster numbers):

      ```python
      import numpy as np, pandas as pd
      from sklearn.cluster import KMeans
      from sklearn.preprocessing import StandardScaler
      from sklearn.metrics import adjusted_rand_score
      from data import make_merchants

      m = make_merchants()
      X = m[["monthly_volume", "avg_ticket", "refund_rate", "cnp_share"]].to_numpy()

      raw = KMeans(n_clusters=4, random_state=0).fit(X)
      print(pd.crosstab(m.segment, raw.labels_))
      print("ARI unscaled", round(adjusted_rand_score(m.segment, raw.labels_), 3))

      Xs = StandardScaler().fit_transform(X)
      sc = KMeans(n_clusters=4, random_state=0).fit(Xs)
      print("ARI scaled", round(adjusted_rand_score(m.segment, sc.labels_), 3))

      Xl = np.column_stack([np.log(X[:, 0]), np.log(X[:, 1]), X[:, 2], X[:, 3]])
      Xls = StandardScaler().fit_transform(Xl)
      ls = KMeans(n_clusters=4, random_state=0).fit(Xls)
      print("ARI log+scaled", round(adjusted_rand_score(m.segment, ls.labels_), 3))
      ```

      ```plaintext
      col_0             0   1   2    3
      segment
      corner cafes    150   0   0    0
      grocery chains    0  92  48   10
      online shops    141   0   0    9
      travel agents     8  29   4  109
      ARI unscaled 0.464

      scaled: segment x cluster
      col_0             0    1    2    3
      segment
      corner cafes    150    0    0    0
      grocery chains    4    0    0  146
      online shops      0    0  150    0
      travel agents     0  149    1    0
      ARI scaled 0.978

      log+scaled: segment x cluster
      col_0             0    1    2    3
      segment
      corner cafes    150    0    0    0
      grocery chains    0    0  150    0
      online shops      0    0    0  150
      travel agents     0  150    0    0
      ARI log+scaled 1.0
      ```

      **Unscaled**, k-means is clustering on monthly volume alone: it splits the grocery chains into three
      volume bands and lumps cafes with online shops, because their refund rates and card-not-present shares -
      the features that tell them apart - differ by less than one euro. **Standardised** (each feature to mean 0
      and standard deviation 1, as CS229 recommends before PCA), it almost recovers the segments. Volume and
      ticket size are **multiplicative** (a grocery chain is 50 times a cafe, not 50000 euros more), so taking
      their **log** first makes equal ratios equal distances - and the segments come back exactly.

      The column numbers are arbitrary: cluster 2 is "grocery chains" in one run and could be "online shops" in
      the next. That is why ARI, which ignores the numbering, is the right comparison.

  - id: choosing-k
    kind: code
    concepts: [kmeans-clustering, density-clustering-and-validation]
    title: Choosing k - the elbow and the silhouette
    body: |
      With real data you don't know k. Two common aids, run on the log-scaled merchants `Xls`:

      ```python
      from sklearn.metrics import silhouette_score

      for k in range(2, 9):
          km = KMeans(n_clusters=k, random_state=0).fit(Xls)
          print(k, round(km.inertia_, 1), round(silhouette_score(Xls, km.labels_), 3))
      ```

      ```plaintext
      k  inertia  silhouette
      2 1017.0 0.551
      3 448.7 0.683
      4 156.4 0.734
      5 106.6 0.7
      6 94.9 0.666
      7 88.8 0.657
      8 73.4 0.58
      ```

      - **Inertia always falls** as k grows - with k = 600 every row is its own centroid and the inertia is 0.
        So you never pick the k with the lowest inertia; you look for the **elbow**, where adding a cluster stops
        paying off. Here the drops are 568, 292, then 50, 12, 6: the elbow is at **k = 4**.
      - **The silhouette** rewards tight, well-separated clusters and is comparable across k. It peaks at
        **k = 4** (0.734).

      Both agree here because the data was generated with four well-separated segments. On real data the elbow
      is often a gentle curve and the silhouette nearly flat; then k is a **business decision** - how many
      merchant tiers can the risk team actually run? - informed, not decided, by these numbers.

  - id: kmeans-init-run
    kind: code
    concepts: [kmeans-clustering]
    title: Local minima and why k-means++ matters
    body: |
      On 1500 points in 15 blobs, one k-means run per seed (20 seeds), comparing random starting rows with
      k-means++:

      ```python
      from sklearn.datasets import make_blobs

      X, y = make_blobs(n_samples=1500, centers=15, cluster_std=0.6, center_box=(-12, 12), random_state=3)
      for init in ["random", "k-means++"]:
          vals = [KMeans(n_clusters=15, init=init, n_init=1, random_state=s).fit(X).inertia_ for s in range(20)]
          print(f"{init:10s} min {min(vals):8.1f}  median {np.median(vals):8.1f}  max {max(vals):8.1f}")
      best = KMeans(n_clusters=15, init="random", n_init=10, random_state=0).fit(X)
      print("random, n_init=10:", round(best.inertia_, 1))
      ```

      ```plaintext
      random     min   1135.1  median   1769.5  max   7406.3
      k-means++  min    985.1  median   1019.3  max   1255.0
      random, n_init=10: 985.1
      ```

      Every run converged - to a local minimum. With random starts the median run is 74% worse than the best
      found, and the worst is 7.5 times worse: two centroids started in one blob and two blobs ended up sharing
      a centroid. k-means++ starts are far better on their own, and ten random restarts also reach 985.1. That
      is why `n_init` exists and why scikit-learn defaults to k-means++.

      The practice exercise below builds the same algorithm from scratch. On the log-scaled merchants it gives
      the inertia after each assignment step, and its best-of-ten run matches scikit-learn:

      ```plaintext
      inertia per iteration: [208.6, 156.4, 156.4]
      from scratch best of 10: 156.4  sklearn: 156.4
      ```

  - id: dbscan
    kind: internals
    concepts: [density-clustering-and-validation]
    title: DBSCAN - clusters of any shape, and noise
    body: |
      k-means draws straight boundaries halfway between centroids (each cluster is a Voronoi cell), so it can only
      find convex, roughly round clusters - the user guide says inertia "responds poorly to elongated clusters,
      or manifolds with irregular shapes". Ester, Kriegel, Sander and Xu's **DBSCAN** (1996) defines clusters by
      **density** instead:

      - The **eps-neighbourhood** of a row is every row within distance `eps`.
      - A **core point** has at least `min_samples` rows in its neighbourhood - in scikit-learn this count
        **includes the point itself**.
      - A cluster is a set of core points that can reach each other through chains of neighbouring core points,
        plus the non-core rows next to them (the cluster's fringe).
      - Every other row is **noise**, labelled **-1**.

      You don't choose k, clusters can be any shape, and outliers are not forced into a cluster. The price is
      `eps`, which the user guide calls "crucial to choose appropriately for the data set and distance function
      and usually cannot be left at the default value" (0.5). Too small and "most data will not be clustered at
      all"; too large and close clusters merge into one. A common heuristic is the knee of the sorted distances to
      the `min_samples`-th nearest neighbour - because DBSCAN counts the row itself, `NearestNeighbors(n_neighbors=5)`
      (which also returns the row itself first) gives exactly the distance a row needs to be a core point when
      `min_samples=5`.

      ```python
      from sklearn.cluster import DBSCAN
      from sklearn.datasets import make_moons
      from sklearn.neighbors import NearestNeighbors

      M, ym = make_moons(n_samples=500, noise=0.06, random_state=0)
      km = KMeans(2, random_state=0).fit(M)
      print("moons kmeans ARI", round(adjusted_rand_score(ym, km.labels_), 3),
            "silhouette", round(silhouette_score(M, km.labels_), 3))
      for eps in (0.05, 0.1, 0.2, 0.5):
          db = DBSCAN(eps=eps, min_samples=5).fit(M)
          lab = db.labels_
          k = len(set(lab)) - (1 if -1 in lab else 0)
          sil = round(silhouette_score(M, lab), 3) if k > 1 else None
          print(f"DBSCAN eps={eps}: clusters {k}, noise {int((lab == -1).sum())}, "
                f"core {len(db.core_sample_indices_)}, ARI {adjusted_rand_score(ym, lab):.3f}, silhouette {sil}")
      d, _ = NearestNeighbors(n_neighbors=5).fit(M).kneighbors(M)
      print("5th-neighbour distance percentiles 50/90/95/99:",
            np.round(np.percentile(np.sort(d[:, -1]), [50, 90, 95, 99]), 3).tolist())
      ```

      ```plaintext
      moons kmeans ARI 0.261 silhouette 0.489
      DBSCAN eps=0.05: clusters 31, noise 215, core 161, ARI 0.026, silhouette -0.052
      DBSCAN eps=0.1: clusters 2, noise 8, core 466, ARI 0.968, silhouette 0.232
      DBSCAN eps=0.2: clusters 2, noise 0, core 500, ARI 1.000, silhouette 0.33
      DBSCAN eps=0.5: clusters 1, noise 0, core 500, ARI 0.000, silhouette None
      5th-neighbour distance percentiles 50/90/95/99: [0.058, 0.092, 0.11, 0.136]
      ```

      The two interleaved crescents defeat k-means (ARI 0.261: it cuts each moon in half). DBSCAN with eps a
      little above the 99th percentile of the 5th-neighbour distance (0.136) recovers both moons exactly; eps 0.05
      shatters them into 31 fragments and 215 noise rows; eps 0.5 joins them into one. (The silhouette call
      treats the noise label -1 as one more cluster - another reason to read it with care.)

  - id: misleading
    kind: internals
    concepts: [density-clustering-and-validation]
    title: When unsupervised results mislead
    body: |
      **1. The silhouette prefers the wrong answer.** In the moons run above, the *wrong* k-means clustering
      scored silhouette **0.489** and the *exactly right* DBSCAN clustering **0.33**. That is no bug: the user
      guide warns that the silhouette "is generally higher for convex clusters than other concepts of clusters,
      such as density based clusters like those obtained through DBSCAN". An internal score measures one idea of
      a cluster, not truth.

      **2. k-means finds clusters in noise.** 600 points drawn uniformly in a square have no clusters at all:

      ```python
      rng = np.random.default_rng(0)
      U = rng.uniform(0, 1, size=(600, 2))
      for k in (2, 3, 4, 5):
          km = KMeans(n_clusters=k, random_state=0).fit(U)
          print("uniform k", k, "silhouette", round(silhouette_score(U, km.labels_), 3),
                "sizes", np.bincount(km.labels_).tolist())
      ```

      ```plaintext
      uniform k 2 silhouette 0.366
      uniform k 3 silhouette 0.378
      uniform k 4 silhouette 0.41
      uniform k 5 silhouette 0.391
      ```

      (sizes omitted here: four roughly equal groups of 128-175.) A silhouette of 0.41, a "best" k of 4 and
      balanced cluster sizes - for data with no structure. A presentation built on that would be pure artefact.
      Before trusting clusters, compare with a **null baseline** such as this one (uniform data over the same
      range, or each column shuffled independently), check **stability** (resample rows or change the seed and
      compare with ARI) and check **usefulness** (do the segments differ on something the business cares about
      that was not used to build them?).

      **3. Cluster numbers are not identities.** Two runs on the merchants with different seeds:

      ```plaintext
      seed0 labels first 8 [3, 0, 2, 2, 1, 2, 1, 1]
      seed1 labels first 8 [0, 3, 1, 1, 2, 1, 2, 2]
      equal elementwise 0.0 ARI 1.0
      ```

      The clusterings are **identical** (ARI 1.0) yet not one label matches. A dashboard or a database column
      that stores "cluster 2" will silently change meaning on retraining. Name clusters by their centroids
      (for example "high-ticket, high card-not-present"), map new centroids to old ones explicitly, and test
      that mapping.

      **4. The features decide the answer.** The scaling run showed one data set giving ARI 0.464 or 1.0
      depending on units. There is no "the" clustering of a data set - only a clustering under a chosen
      representation and distance.

  - id: anomaly-gaussian
    kind: internals
    concepts: [anomaly-detection]
    title: Anomaly detection with a Gaussian density
    body: |
      The simplest detector models normal data as a **multivariate normal** distribution (*Deep Learning* section
      3.9.3) and flags rows that the model finds unlikely:

      1. Fit the mean vector mu and covariance matrix Sigma on the training rows - which are **unlabelled**, and
         mostly normal.
      2. Score a row by its **log-density**:

         ```plaintext
         log p(x) = -0.5 * [ (x - mu)^T Sigma^-1 (x - mu) + log det(Sigma) + d * log(2 pi) ]
         ```

         The first term is the squared **Mahalanobis distance** - distance measured in units of the data's own
         spread and correlation.
      3. Flag rows with log p(x) below a threshold.

      **Compute it in logs.** For the rows you care about, the density itself is a number too small for a
      float64. A transaction of e^9 (about 8100) euros at 03:00, 2500 km from home, 15th on the card in an hour:

      ```python
      g = fit_gaussian(T[:10000])          # from the practice exercise
      row = np.array([[9.0, 3.0, 2500.0, 15.0]])
      print("log density of an extreme row:", np.round(log_density(g, row), 1).tolist())
      d = row - g.mean
      dens = np.exp(-0.5 * d @ np.linalg.inv(g.cov) @ d.T) / np.sqrt((2 * np.pi) ** 4 * np.linalg.det(g.cov))
      print("density via exp:", dens.ravel().tolist())
      print("log of it:", np.log(dens).ravel().tolist())
      ```

      ```plaintext
      log density of an extreme row: [-41781.7]
      density via exp: [0.0]
      log of it: [-inf]
      RuntimeWarning: divide by zero encountered in log
      ```

      e to the power -41781.7 underflows to 0.0, its log is -inf, and every extreme row ties at -inf - the ranking
      you needed is gone. Use `numpy.linalg.slogdet` for the log-determinant and `numpy.linalg.solve` instead of an
      explicit inverse, and never leave log space.

      **What it assumes:** one roughly elliptical blob of normal data. Hour of day wraps around (23 is next to 0),
      amounts are skewed, and several kinds of normal merchants make several blobs - a mixture of Gaussians, a
      log transform or a different detector may fit better. Here the four features are almost uncorrelated
      (all off-diagonal correlations within 0.04), so a full covariance and a diagonal one (independent
      Gaussians) give the same test average precision, 0.434 and 0.437.

  - id: isolation-forest
    kind: internals
    concepts: [anomaly-detection]
    title: Isolation Forest - anomalies are few and different
    body: |
      Liu, Ting and Zhou (2008) turned the question around. Instead of profiling normal rows, **isolate** each row:
      pick a random feature and a random split value between its minimum and maximum, and recurse until the row
      is alone. Anomalies are "few and different", so random cuts separate them **close to the root**; normal
      rows sit in dense regions and need many cuts. The **path length** h(x) - the number of edges from the root
      to x's leaf - averaged over many random trees, is the signal.

      To compare path lengths across sample sizes, the paper normalises by c(n), the average path length of an
      unsuccessful search in a binary search tree of n points (eq. 1):

      ```plaintext
      c(n) = 2 H(n - 1) - 2 (n - 1) / n          H(i) ~ ln(i) + 0.5772156649 (Euler's constant)
      s(x, n) = 2 ^ ( -E(h(x)) / c(n) )          (eq. 2)
      ```

      - s close to **1**: definitely an anomaly; s much **below 0.5**: normal; all rows near **0.5**: the sample has
        no distinct anomaly.
      - With n = 256 (the paper's default sub-sample, and scikit-learn's `max_samples='auto'`), c(256) = 10.2448.
        A row isolated after 2 cuts on average scores 0.873; one needing 12 cuts scores 0.444; one needing exactly
        c(n) scores 0.5.

      Each tree sees only a sub-sample of 256 rows and is cut off at depth ceil(log2 256) = 8 - anomalies are
      found high in the tree anyway - so training is fast and memory small. The paper uses 100 trees, also
      scikit-learn's `n_estimators` default.

      **The sign trap.** scikit-learn's `IsolationForest.score_samples` returns the **opposite** of the paper's
      score: "The lower, the more abnormal". Feed it straight into a "higher means more suspicious" metric and you
      rank the most normal rows first:

      ```python
      from sklearn.ensemble import IsolationForest
      iso = IsolationForest(random_state=0).fit(Xtr)        # 15000 unlabelled training rows
      s = iso.score_samples(Xte)                             # 5000 test rows, 20 frauds
      print("iforest score_samples range", round(s.min(), 3), round(s.max(), 3), "offset_", iso.offset_)
      print("AP using -score_samples", round(average_precision_score(yte, -s), 3))
      print("AP using +score_samples (wrong sign)", round(average_precision_score(yte, s), 3))
      ```

      ```plaintext
      iforest score_samples range -0.733 -0.379 offset_ -0.5
      AP using -score_samples 0.347
      AP using +score_samples (wrong sign) 0.002
      ```

      With 20 frauds in 5000 rows, random scores would give an average precision of 0.004 (the base rate); the
      wrong sign gives 0.002 - worse than random, and easy to miss if you only look at "the model runs".
      `decision_function` is `score_samples` minus `offset_`, so negative values are outliers.

  - id: contamination
    kind: code
    concepts: [anomaly-detection]
    title: What contamination does - and doesn't
    body: |
      `contamination` does not change the trees or the scores. It only sets the **cut-off** that `predict` uses:
      with a float, the threshold is placed so that that share of the **training** rows is called an outlier;
      with `'auto'` (the default since 0.22), the offset is -0.5, the paper's reference score.

      ```python
      print("predict counts (contamination='auto'):", {int(k): int(v) for k, v in zip(*np.unique(iso.predict(Xte), return_counts=True))})
      for c in (0.001, 0.005, 0.02, 0.05):
          m = IsolationForest(contamination=c, random_state=0).fit(Xtr)
          p = (m.predict(Xte) == -1).astype(int)
          print(f"contamination={c}: flagged {p.sum()}, precision {precision_score(yte, p, zero_division=0):.3f}, "
                f"recall {recall_score(yte, p):.3f}")
      ```

      ```plaintext
      predict counts (contamination='auto'): {-1: 873, 1: 4127}
      contamination=0.001: flagged 4, precision 0.750, recall 0.150
      contamination=0.005: flagged 16, precision 0.438, recall 0.350
      contamination=0.02: flagged 92, precision 0.109, recall 0.500
      contamination=0.05: flagged 227, precision 0.053, recall 0.600
      ```

      The default `'auto'` flags **873** of 5000 transactions (17%) - no review team can work that. Each float
      value is just a different point on the same ranking: precision falls and recall rises as you flag more.
      So treat `contamination` as "how many can we review", decide it from capacity, and judge the detector by
      its **ranking** (average precision, precision at the top) rather than by `predict`.

      Two more real results from the same data: a robust Gaussian (`EllipticEnvelope(contamination=0.005)`)
      flagged 17 rows with precision 0.529 and recall 0.45; and adding **20 irrelevant noise columns** cut the
      Isolation Forest's average precision from 0.347 to **0.09** - random cuts now mostly pick useless features.
      Feature choice matters as much for detectors as for clusters.

  - id: few-labels
    kind: internals
    concepts: [anomaly-detection]
    title: Evaluating a detector with very few labels
    body: |
      You rarely have fraud labels for a new pattern - that is why you are using an unsupervised detector. But you
      need *some* oracle, and there is a trap in how you get it.

      **Random labelling finds nothing.** At 0.5% fraud, analysts who label 200 random transactions expect one
      fraud. In this data a random 200 contained **0** - you cannot compute precision or recall from that.

      **Label where the detector points.** Analysts review the top-scored rows anyway; their verdicts are your
      labels. On the 5000 test transactions (20 frauds), the 50 highest-scored rows contained:

      ```plaintext
      iforest top-50 of test: fraud 9 precision@50 0.18
      gaussian top-50 of test: fraud 10
      random 50: fraud 0
      ```

      **Precision at k** (here k = 50, the daily review capacity) is the number the review team feels, and it
      needs labels only for the rows reviewed. What it cannot tell you is **recall** - the frauds outside the top
      50 are never looked at. Add a small random audit sample of unflagged rows over time to estimate what is
      missed.

      **A threshold tuned on a handful of frauds is optimistic.** With a labelled validation slice (5000 rows, 26
      frauds) we chose the Gaussian log-density threshold that maximised F1, then applied it to fresh test rows:

      ```plaintext
      validation frauds 26 test frauds 20
      chosen log-density threshold -22.033 val F1 0.744 flagged 17
      test: flagged 8 precision 0.75 recall 0.3 F1 0.429
      ```

      F1 0.744 on validation became **0.429** on test. Picking the best of thousands of thresholds on 26 frauds
      fits their noise - the same lesson as choosing hyperparameters on the test set in
      [Evaluation, overfitting and regularisation](#/lesson/model-evaluation-and-overfitting). Report the test
      number, and expect it to move as labels accumulate.

  - id: pca-internals
    kind: internals
    concepts: [pca-dimensionality-reduction]
    title: How PCA works - centring and the SVD
    body: |
      PCA looks for the unit direction u along which the data, once projected, has the **largest variance**; then
      the next largest orthogonal to it; and so on. CS229 shows these are the top **eigenvectors of the covariance
      matrix** of the (centred) data; *Deep Learning* section 2.12 derives PCA as the best linear code for
      compressing points, using only linear algebra.

      In practice you compute them with the **singular value decomposition** of the centred data matrix:

      ```plaintext
      Xc = X - mean(X)                 (centre every column)
      Xc = U S V^T                     (SVD)
      principal directions = rows of V^T
      variance along direction j = S_j^2 / (n - 1)
      explained variance ratio j = S_j^2 / sum of all S^2
      scores = Xc @ V_k^T              (project onto the first k directions)
      reconstruction = scores @ V_k + mean
      ```

      - **Centring is not optional.** Without it the first direction points from the origin to the data's mean,
        not along its spread. On the hourly profiles below, the uncentred first direction has cosine **1.0** with
        the mean vector and **0.044** with the true first principal component - it is the wrong answer.
      - **Scaling is your decision.** scikit-learn's PCA "centers but does not scale the input data". CS229
        normalises each feature first when units differ; with features in the same units (pixel intensities,
        shares of daily volume) you may keep them as they are.
      - **Signs are arbitrary.** u and -u are the same direction, so implementations flip signs differently; compare
        components up to sign.
      - **Whitening** divides each score by the square root of its variance, so every kept component has variance
        1. The user guide notes this helps downstream models that assume isotropic data, such as k-means and SVMs
        with an RBF kernel. It also amplifies tiny, noisy components - whiten only the components you keep.

      Our from-scratch SVD matches scikit-learn on the profiles: the first three explained variances are
      0.006842, 0.006023 and 0.000017 in both, and the first directions agree (absolute cosine 1.0).

  - id: pca-run
    kind: code
    concepts: [pca-dimensionality-reduction]
    title: PCA on SandPay data - units, compression and reconstruction error
    body: |
      **Units first.** PCA on the raw merchant features, then on the log-scaled ones:

      ```python
      from sklearn.decomposition import PCA
      p = PCA().fit(X)                      # raw: euros, euros, fractions, fractions
      print("unscaled ratio", np.round(p.explained_variance_ratio_, 4).tolist())
      print("unscaled PC1", np.round(p.components_[0], 4).tolist())
      p2 = PCA().fit(Xls)                   # log volume and ticket, then standardised
      print("scaled ratio", np.round(p2.explained_variance_ratio_, 3).tolist())
      print("scaled PC1", np.round(p2.components_[0], 3).tolist())
      ```

      ```plaintext
      unscaled ratio [1.0, 0.0, 0.0, 0.0]
      unscaled PC1 [1.0, 0.0001, 0.0, -0.0]
      scaled ratio [0.709, 0.21, 0.058, 0.023]
      scaled PC1 [0.359, 0.566, 0.551, 0.497]
      ```

      Unscaled, "100% of the variance" is monthly volume - PCA has only rediscovered which column has the largest
      numbers. Scaled, the first component mixes all four features (bigger tickets go with more refunds and more
      card-not-present sales: the travel-agent direction) and two components keep 92% of the variance.

      **Compression.** Each merchant's hourly profile is 24 numbers (share of daily volume per hour). Fitted on
      the 394 normal merchants:

      ```python
      P = make_hourly_profiles()
      pp = PCA().fit(P[:-6])
      r = pp.explained_variance_ratio_
      print("hourly ratio first 6", np.round(r[:6], 3).tolist())
      print("cumulative first 6", np.round(np.cumsum(r)[:6], 3).tolist())
      print("components for 0.95:", PCA(n_components=0.95).fit(P[:-6]).n_components_)
      ```

      ```plaintext
      hourly ratio first 6 [0.523, 0.46, 0.001, 0.001, 0.001, 0.001]
      cumulative first 6 [0.523, 0.983, 0.984, 0.985, 0.986, 0.987]
      components for 0.95: 2
      ```

      Two components keep 98.3%. That is not luck: every profile is a mix of three daily shapes (morning, lunch,
      evening) whose weights sum to 1, so the profiles lie close to a **two-dimensional** plane in 24-dimensional
      space - PCA found the true dimension. A float `n_components` asks scikit-learn for the smallest number of
      components reaching that share.

      **Reconstruction error as an anomaly score.** Keep 3 components, reconstruct every profile, and measure the
      squared error:

      ```python
      p3 = PCA(n_components=3).fit(P[:-6])
      R = p3.inverse_transform(p3.transform(P))
      err = ((P - R) ** 2).sum(1)
      print("recon err normal median", round(float(np.median(err[:-6])), 6), "max", round(float(err[:-6].max()), 6))
      print("recon err odd", np.round(err[-6:], 4).tolist())
      ```

      ```plaintext
      recon err normal median 0.000195 max 0.000798
      recon err odd [0.1147, 0.1073, 0.1147, 0.1118, 0.1112, 0.1072]
      ```

      The six merchants whose volume arrives between 01:00 and 04:00 have errors more than 100 times the worst
      normal merchant - they are the six largest of all 400. The components describe "normal" daily patterns, so
      anything they cannot rebuild is unusual: worth a look by the risk team, not proof of fraud.

  - id: visual-choose
    kind: visual
    concepts: [kmeans-clustering, density-clustering-and-validation, anomaly-detection, pca-dimensionality-reduction]
    title: Which method for which question
    body: |
      ```mermaid
      flowchart TD
        Q{What do you want from unlabelled rows?} --> G[Groups of similar rows]
        Q --> A[The rare rows unlike the rest]
        Q --> F[Fewer columns that keep the information]
        G --> S1{Roughly round groups, k known or chosen?}
        S1 -->|yes| KM[k-means with k-means++ on scaled features]
        S1 -->|no, any shape or noise| DB[DBSCAN, eps from nearest-neighbour distances]
        A --> A1[Gaussian log-density or Isolation Forest]
        A1 --> A2[Rank, review the top k, measure precision at k]
        F --> P1[PCA on centred, suitably scaled data]
        P1 --> P2[Keep components by explained variance; use reconstruction error to spot odd rows]
        KM --> V[Check: null baseline, stability across seeds, business usefulness]
        DB --> V
        A2 --> V
      ```

      Notice that every path ends in the same check box. The algorithms always produce an answer; the checks are
      what turn it into evidence.

  - id: steps
    kind: steps
    concepts: [kmeans-clustering, anomaly-detection, pca-dimensionality-reduction]
    title: A working procedure
    body: |
      1. **Write down the question and the action.** "Four pricing tiers", "a daily queue of 50 suspicious
         transactions" - the action decides k, the review capacity and how good is good enough.
      2. **Choose and transform features.** Drop identifiers; log-transform multiplicative quantities (amounts,
         volumes); encode cyclic ones like hour of day if they matter; standardise inside a pipeline fitted on
         training rows only.
      3. **Fit on training rows, evaluate on held-out rows** - unsupervised models overfit too (a threshold, a k,
         a set of components chosen on the same rows they are judged on).
      4. **Clustering:** scan k with inertia and silhouette, try DBSCAN if shapes are irregular, and compare
         with a null baseline (uniform or column-shuffled data).
      5. **Stability:** refit with other seeds and bootstrap samples; compare clusterings with ARI, and rankings
         with the overlap of their top k.
      6. **Anomalies:** rank by score (with the right sign), set the cut-off from review capacity, and measure
         precision at k on reviewed rows plus a small random audit for misses.
      7. **PCA:** centre (and scale if units differ), choose components by explained variance, check
         reconstruction error, and fit it inside the pipeline.
      8. **Name and document.** Describe clusters by their centroids, record seeds, versions and feature
         definitions, and map cluster numbers explicitly across retrains.

  - id: example
    kind: example
    concepts: [kmeans-clustering, anomaly-detection]
    title: "Example: a merchant segmentation that marketing wants to use"
    body: |
      SandPay's marketing team asks for "the five merchant segments" to target with a new product. A data
      scientist delivers k-means with k = 5 and a slide of segment sizes. As the engineer reviewing it, you ask:

      - **Which features, in which units?** If monthly volume entered in euros next to rates, the "segments" are
        volume bands. Ask for the transformations and the scaler, and rerun with log volume.
      - **Why five?** Show the inertia and silhouette for k = 2-10. If 4 and 5 are close, choose by what marketing
        can act on - and say that the data does not prefer one.
      - **Is it more than noise?** Compare the silhouette with column-shuffled data. A segmentation that scores
        0.40 against a shuffled baseline of 0.38 is not evidence of segments.
      - **Is it stable?** Refit on 80% bootstrap samples with five seeds; the ARI between runs should be high
        (for well-separated segments, close to 1).
      - **Is it useful?** Do the segments differ in something not used to build them - product uptake, churn,
        chargeback rate? If not, they are a description, not a strategy.
      - **Will it stay put?** Segment ids must map to named centroids, so "segment 3" means the same thing next
        quarter.

      The same review applies to a fraud anomaly queue: units and features, the score sign, review capacity,
      precision at k on reviewed rows, an audit sample for misses, and drift monitoring.

  - id: tests
    kind: tests
    concepts: [kmeans-clustering, anomaly-detection, pca-dimensionality-reduction]
    title: Tests for unsupervised code
    body: |
      Unsupervised code still has an oracle - in its **properties** and in small cases you can solve by hand.
      The practice project's tests use these patterns:

      | Check | Expected result | Evidence |
      | --- | --- | --- |
      | Lloyd's iterations | inertia never increases from one iteration to the next | the list of inertias |
      | Hand-sized case | two obvious groups of three points come back as two clusters with the right means | exact centroids |
      | Empty cluster | `update` keeps the old centroid; no NaN, no division-by-zero warning (run under `np.errstate(all="raise")`) | the returned array |
      | k-means++ weighting | a far-away point is chosen as the second centre in at least 97% of runs | counts over 300 runs |
      | Against a reference | best-of-n inertia equals `KMeans(n_init=n, random_state=0)` on well-separated blobs; ARI 1.0 | inertia, ARI |
      | Reproducibility | the same seed gives identical labels | `assert_array_equal` |
      | Log-density | equals `scipy.stats.multivariate_normal.logpdf`; finite for a row 5000 km away | values, `np.isfinite` |
      | Score direction | Isolation Forest scores are higher for the planted frauds (ROC-AUC above 0.95) | AUC |
      | Paper formula | c(256) = 10.2448; s = 0.5 when E(h) = c(n) | numbers |
      | PCA | directions match scikit-learn up to sign; components orthonormal; full reconstruction exact; whitened variance 1 | `assert_allclose` |

      Negative cases matter as much: k larger than the number of rows raises `ValueError`; choosing a threshold
      with no fraud labels raises `ValueError`; asking PCA for more components than features raises.

  - id: mistakes
    kind: mistakes
    concepts: [kmeans-clustering, density-clustering-and-validation, anomaly-detection, pca-dimensionality-reduction]
    title: Common mistakes and how to debug them
    body: |
      - **Clustering unscaled features.** Symptom: clusters that differ only in the largest-unit column. Check:
        compare centroids per feature in original units; rerun with standardised (and log) features.
      - **Choosing k by lowest inertia.** It always falls with k. Use the elbow and the silhouette, and the
        business question.
      - **Trusting one k-means run.** A single random start can be several times worse than the best. Use
        k-means++ and `n_init`, and compare inertias across seeds.
      - **Storing cluster numbers.** They change between runs. Name clusters by centroids and map them.
      - **Leaving DBSCAN's eps at 0.5.** Its scale must match your features. Plot or print the k-th nearest
        neighbour distances first.
      - **Reading the silhouette as truth.** It favours round clusters and reports 0.4 on uniform noise. Compare
        with a null baseline.
      - **Flipping the Isolation Forest sign.** `score_samples` is higher for normal rows. A detector with average
        precision below the base rate is usually inverted.
      - **Treating contamination as accuracy.** It only places the cut-off. `'auto'` flagged 17% here.
      - **Computing densities, not log-densities.** Extreme rows underflow to 0 and tie at -inf.
      - **Evaluating on random labels at 0.5% prevalence.** You will find no positives. Label the top of the
        ranking, plus an audit sample.
      - **Fitting the scaler, PCA or detector on all rows** before splitting - the same leakage as in supervised
        learning. Put them in a pipeline fitted on training rows.
      - **PCA without centring** finds the mean direction. scikit-learn centres for you; a hand-written SVD does
        not.

      **Debugging method:** shrink the problem until you can solve it by hand - six points for k-means, one row
      for the log-density, a 3-feature data set for PCA - and compare with a trusted implementation
      (scikit-learn, SciPy) before scaling up.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [kmeans-clustering, density-clustering-and-validation, anomaly-detection, pca-dimensionality-reduction]
    title: Trade-offs and alternatives
    body: |
      | Method | Strengths | Limits | Consider instead |
      | --- | --- | --- | --- |
      | k-means | fast, simple, scales to millions of rows (`MiniBatchKMeans` for more) | needs k; assumes convex, similar-sized clusters; sensitive to scale and outliers | Gaussian mixtures (soft, elliptical clusters), DBSCAN/HDBSCAN |
      | DBSCAN | any shape; finds noise; no k | one global eps fails when clusters have different densities; eps is hard in high dimensions | HDBSCAN (in scikit-learn as `HDBSCAN`), OPTICS |
      | Gaussian density | interpretable (Mahalanobis distance), one formula | assumes one elliptical blob; outliers in training data distort the covariance | `EllipticEnvelope` (robust covariance), Gaussian mixtures |
      | Isolation Forest | fast, sub-sampled, few parameters, many features | axis-parallel cuts; irrelevant features dilute it (AP 0.347 to 0.09 here); scores are relative | `LocalOutlierFactor` for local density, supervised models once labels exist |
      | PCA | exact, fast, invertible, gives explained variance | linear only; components can be hard to interpret; sensitive to scaling | t-SNE or UMAP for visualisation only, autoencoders for non-linear compression |

      Once a few hundred reliable fraud labels exist, a **supervised** model (see [Logistic regression and
      classification](#/lesson/logistic-regression-classification)) usually beats an unsupervised detector on the
      fraud it has seen; the detector stays useful for the fraud it has not.

  - id: summary
    kind: summary
    concepts: [kmeans-clustering, density-clustering-and-validation, anomaly-detection, pca-dimensionality-reduction]
    title: Quick reference
    body: |
      - **k-means:** assign to nearest centroid, move centroids to means, repeat; inertia never rises; local minima
        - use k-means++ (D-squared seeding) and several runs.
      - **Scale first:** unscaled merchants ARI 0.464, standardised 0.978, log + standardised 1.0.
      - **Choosing k:** elbow of inertia, peak of silhouette, then the business question.
      - **DBSCAN:** core points (`min_samples` incl. the point within `eps`), noise = -1; choose eps from k-th
        neighbour distances.
      - **Distrust:** silhouette prefers round clusters; k-means "finds" clusters in uniform noise; labels are
        arbitrary numbers.
      - **Gaussian detector:** log-density with `slogdet` and `solve`; never exponentiate.
      - **Isolation Forest:** s = 2^(-E(h)/c(n)); scikit-learn's `score_samples` is the opposite - lower is more
        abnormal; `contamination` only sets the cut-off.
      - **Few labels:** precision at k on reviewed rows, audit sample for recall; thresholds tuned on a few frauds
        are optimistic.
      - **PCA:** centre, (scale), SVD; variance S^2/(n-1); explained variance ratio; reconstruction error flags
        odd rows; whitening gives unit variance.

exercises:
  - id: scale-before-kmeans
    type: mcq
    concept: kmeans-clustering
    skill: analysis
    title: Why are the cafes and online shops in one cluster?
    prompt: |
      A colleague ran `KMeans(n_clusters=4, random_state=0)` on SandPay's merchants with columns
      `monthly_volume` (euros), `avg_ticket` (euros), `refund_rate` and `cnp_share` (fractions). Cross-tabulated
      against the known segments, 141 of 150 online shops land in the same cluster as all 150 corner cafes, and
      the grocery chains are split into three clusters. What is the most likely cause?
    options:
      - id: scale
        text: The features are not scaled, so distances are almost entirely monthly volume; the rates that separate cafes from online shops barely count.
        feedback: Correct - with a volume standard deviation near 406000 and a refund-rate one near 0.024, Euclidean distance ignores the rates. Standardising gave ARI 0.978, and log plus standardising 1.0.
      - id: k-wrong
        text: k = 4 is wrong; k-means needs more clusters to separate cafes from online shops.
        feedback: There really are four segments, and with scaled features k = 4 recovers them exactly. More clusters would just cut volume into more bands.
      - id: local-minimum
        text: k-means stopped in a local minimum; increase n_init.
        feedback: More restarts find a lower inertia for the same distance - but that distance is dominated by volume, so the best clustering is still volume bands.
      - id: dbscan
        text: k-means cannot separate these segments; use DBSCAN.
        feedback: The segments are compact blobs once the features are scaled - exactly what k-means handles. DBSCAN uses the same Euclidean distance and would suffer from the units too.
    correct: [scale]
    hints:
      - Look at the size of each feature's standard deviation.
      - Which feature do cafes and online shops differ in most - and how large is that difference in raw units?
    solution: |
      Euclidean distance adds squared differences per feature. Two merchants who differ by 50000 euros of monthly
      volume and by 0.9 in card-not-present share are 50000 apart; the share contributes nothing. So the clusters
      are bands of volume. Standardise the features (and log-transform volume and ticket, which are
      multiplicative) inside a pipeline - the real run went from ARI 0.464 to 1.0.
    followUp: |
      After scaling, a new feature "number of terminals" (1 to 400) is added without scaling. What happens to the
      clusters, and how would you notice?

  - id: lloyd-order
    type: order
    concept: kmeans-clustering
    skill: recall
    title: k-means++ and Lloyd's algorithm, in order
    prompt: |
      Put the steps of k-means with k-means++ seeding in order.
    items:
      - id: first-centre
        text: Choose the first centroid uniformly at random from the rows.
      - id: next-centres
        text: Choose each next centroid with probability proportional to the squared distance to the nearest centroid already chosen, until there are k.
      - id: assign-step
        text: Assign every row to its nearest centroid.
      - id: update-step
        text: Move every centroid to the mean of the rows assigned to it.
      - id: repeat
        text: Repeat the assignment and update steps until the centroids stop moving.
      - id: keep-best
        text: Over several runs, keep the one with the lowest inertia.
    hints:
      - Seeding happens once per run, before any assignment.
      - The last step compares whole runs.
    solution: |
      Seeding (steps 1a-1c of Arthur and Vassilvitskii): first centre uniformly, the rest by D-squared weighting.
      Then Lloyd's loop: assign, update, repeat until the centroids move less than the tolerance. Because k-means
      only reaches a local minimum, `n_init` runs it several times and keeps the lowest inertia.

  - id: kmeans-code
    type: coding
    concept: kmeans-clustering
    skill: application
    title: k-means and k-means++ from scratch
    prompt: |
      In `kmeans.py`, implement `kmeans_plus_plus` (D-squared seeding with the given generator), `assign`,
      `update` (an empty cluster keeps its old centroid - the starting draft doesn't), `inertia`, `lloyd` (seed,
      then assign and update until no centroid moves more than `tol`, recording the inertia after each
      assignment) and `best_of` (several runs from one generator, keep the lowest inertia). The tests check a
      hand-sized case, the D-squared weighting, that the inertia never increases, and that `best_of` matches
      scikit-learn's `KMeans` on well-separated blobs.
    project: ai
    files:
      - exercises/ml_foundations/kmeans.py
    test: tests/ml_foundations/test_kmeans.py
    command: .venv/bin/python -m pytest tests/ml_foundations/test_kmeans.py
    hints:
      - "For assign, broadcast to an (n, k, d) array of differences: X[:, None, :] - centroids[None, :, :], square, sum over the last axis, then argmin (which picks the lowest index on ties)."
      - Keep an array d2 of each row's squared distance to its nearest chosen centre, and after choosing a new centre update it with np.minimum - one pass per centre, no nested loops over centres.
      - "In update, start from a copy of the old centroids and only overwrite clusters that have members: if np.any(labels == j)."
      - In lloyd, measure how far each centroid moved with np.linalg.norm(new - old, axis=1) and stop when the largest move is at most tol; assign once more at the end so the labels match the final centroids.
    modelAnswer: |
      ```python
      def kmeans_plus_plus(X, k, rng) -> np.ndarray:
          X = np.asarray(X, dtype=float)
          n = len(X)
          if not 1 <= k <= n:
              raise ValueError(f"k must be between 1 and {n}, got {k}")
          centres = [X[rng.integers(n)]]
          d2 = np.sum((X - centres[0]) ** 2, axis=1)
          for _ in range(1, k):
              total = d2.sum()
              p = d2 / total if total > 0 else np.full(n, 1 / n)
              centres.append(X[rng.choice(n, p=p)])
              d2 = np.minimum(d2, np.sum((X - centres[-1]) ** 2, axis=1))
          return np.array(centres)


      def update(X, labels, old_centroids) -> np.ndarray:
          X = np.asarray(X, dtype=float)
          new = np.array(old_centroids, dtype=float, copy=True)
          for j in range(len(new)):
              members = X[labels == j]
              if len(members):
                  new[j] = members.mean(axis=0)
          return new


      def lloyd(X, k, rng, max_iter=300, tol=1e-6):
          X = np.asarray(X, dtype=float)
          centroids = kmeans_plus_plus(X, k, rng)
          history = []
          for _ in range(max_iter):
              labels = assign(X, centroids)
              history.append(inertia(X, centroids, labels))
              new = update(X, labels, centroids)
              moved = np.max(np.linalg.norm(new - centroids, axis=1))
              centroids = new
              if moved <= tol:
                  break
          return centroids, assign(X, centroids), history
      ```

      `d2` is the running D(x)^2 from the paper: it only ever shrinks as centres are added, so one
      `np.minimum` per new centre keeps it current. When every row coincides with a centre (duplicate rows),
      the probabilities would be 0/0, so the code falls back to a uniform choice. The full solution, with
      `assign`, `inertia` and `best_of`, is in `solutions/ml_foundations/kmeans.py`.
    solution: |
      Seed with D-squared sampling, keeping a running array of squared distances to the nearest centre; assign
      with a broadcast distance matrix and argmin; update from a copy so empty clusters keep their centroid;
      loop until the largest centroid move is within tol, recording the inertia after each assignment; run
      several times from one generator and keep the lowest inertia.
    rubric:
      - Every test in tests/ml_foundations/test_kmeans.py passes.
      - Only the given generator is used for randomness, so seeds reproduce results.
      - An empty cluster never produces NaN or a warning.
      - The inertia history never increases, and you can explain why from the two steps.
      - You can explain why best_of with several runs can only match or beat a single run.
    followUp: |
      Add `predict(X_new, centroids)` for new merchants and a function that maps the clusters of a retrained model
      to the old ones by matching nearest centroids. How do you handle two new centroids nearest to the same old
      one?

  - id: pick-k
    type: mcq
    concept: kmeans-clustering
    skill: application
    title: Read the k scan
    prompt: |
      For the log-scaled merchants, the real scan gave (k, inertia, silhouette): 2 1017.0 0.551; 3 448.7 0.683;
      4 156.4 0.734; 5 106.6 0.7; 6 94.9 0.666; 7 88.8 0.657; 8 73.4 0.58. Which conclusion is best?
    options:
      - id: four
        text: k = 4 - the inertia's elbow (drops of 568, 292, then only 50) and the silhouette's peak agree; confirm that four segments are useful to the business.
        feedback: Correct - two independent aids point to 4, and the last step is the business check that no score can do.
      - id: eight
        text: k = 8, because it has the lowest inertia.
        feedback: Inertia always falls as k grows (it is 0 with one cluster per row), so the lowest value just means the largest k tried.
      - id: two
        text: k = 2, because it has the largest drop in inertia after it.
        feedback: The first drop is always large. The elbow is where the drops become small - after k = 4.
      - id: proof
        text: k = 4, and the silhouette of 0.734 proves that the merchants form four real segments.
        feedback: The choice is right but the claim is too strong - uniform noise reached 0.41, and the silhouette favours round clusters. Scores support a choice; they don't prove clusters exist.
    correct: [four]
    hints:
      - Which of the two numbers can only go down as k grows?
      - Look for where the drop in inertia becomes small, and where the silhouette is highest.
    solution: |
      Inertia drops 568, 292, then 50, 12, 6: the elbow is at 4. The silhouette peaks at 4 (0.734). Choose 4,
      then check it against a null baseline, its stability and what the business can do with four segments.

  - id: dbscan-eps
    type: mcq
    concept: density-clustering-and-validation
    skill: analysis
    title: DBSCAN gives 31 clusters and 215 noise points
    prompt: |
      On 500 points forming two interleaved crescents, `DBSCAN(eps=0.05, min_samples=5)` returns 31 clusters
      and labels 215 points -1. The 99th percentile of each point's distance to its 5th nearest neighbour
      (counting itself) is 0.136. What should you do?
    options:
      - id: raise-eps
        text: Raise eps to just above the typical 5th-neighbour distance (about 0.14-0.2), so that almost every point in the crescents is a core point.
        feedback: Correct - with eps 0.2 the real run found the two crescents exactly (ARI 1.0) with no noise; eps 0.1 found them with 8 noise points.
      - id: lower-eps
        text: Lower eps to 0.01 so that the noise is removed.
        feedback: Smaller eps means fewer neighbours, so fewer core points - more noise and more fragments, not less.
      - id: raise-min
        text: Raise min_samples to 50 to make clusters more robust.
        feedback: That demands far higher density; with eps 0.05 almost nothing would be a core point and nearly every row would become noise.
      - id: kmeans
        text: Switch to k-means with k = 2, which never produces noise.
        feedback: k-means cuts each crescent in half (ARI 0.261 in the real run) - it can't represent non-convex clusters.
    correct: [raise-eps]
    hints:
      - A row is a core point when its 5th-neighbour distance is at most eps.
      - With eps 0.05, roughly how many rows can be core points if the median 5th-neighbour distance is 0.058?
    solution: |
      With the median 5th-neighbour distance at 0.058, eps 0.05 makes fewer than half the rows core points (161 of
      500), so the crescents fall apart into fragments and noise. eps just above the 99th percentile (0.136) makes
      nearly all of them core points and joins each crescent. Too large (0.5) merges the crescents. Check the
      choice against the knee of the sorted distances, not the default 0.5.

  - id: detector-debug
    type: debug
    concept: anomaly-detection
    skill: analysis
    title: Why does the fraud queue look random?
    prompt: |
      This job builds SandPay's daily review queue of the 50 most suspicious transactions. Analysts say the queue
      is full of ordinary coffee purchases. `history` is last month's transactions (unlabelled), `today` is
      today's. Click **every** line that causes or hides the problem.
    language: python
    code: |
      features = ["amount", "hour", "km_from_home", "txns_last_hour", "card_id"]
      scaler = StandardScaler().fit(pd.concat([history, today])[features])
      forest = IsolationForest(contamination="auto", random_state=0)
      forest.fit(scaler.transform(history[features]))
      scores = forest.score_samples(scaler.transform(today[features]))
      queue = today.assign(score=scores).sort_values("score", ascending=False).head(50)
      print("flagged by predict:", (forest.predict(scaler.transform(today[features])) == -1).sum())
    correctLines: [1, 2, 6]
    lineNotes:
      - line: 3
        note: contamination only sets the cut-off for predict; it doesn't change the scores used for ranking. With 'auto' it flags many rows (17% in the lesson's data), which matters for line 7's count but not for the queue.
      - line: 4
        note: Fitting the forest on last month's unlabelled history and scoring today is the right setup (novelty-style scoring).
      - line: 5
        note: score_samples is fine to call - the problem is how its direction is used on line 6.
    hints:
      - In which direction does score_samples point?
      - Which feature is an identifier rather than a behaviour?
      - Which rows is the scaler fitted on?
    solution: |
      - **Line 6** sorts `score_samples` in **descending** order. In scikit-learn "the lower, the more abnormal",
        so the queue holds the 50 **most normal** transactions - ordinary coffee purchases. Sort ascending, or
        negate the score (in the lesson's data the wrong sign gave average precision 0.002, below random).
      - **Line 1** feeds `card_id` - an identifier - as a numeric feature. Random cuts on an arbitrary number
        isolate cards by their id, not by behaviour, and dilute the useful features (20 noise columns cut AP
        from 0.347 to 0.09). Raw amounts are also skewed; a log amount would help.
      - **Line 2** fits the scaler on history **and today**, so today's rows shape the transformation used to
        score them - leakage that also makes scores shift with each day's mix. Fit preprocessing on the training
        rows only, inside a pipeline.

  - id: anomalies-code
    type: coding
    concept: anomaly-detection
    skill: application
    title: A Gaussian detector, a threshold and the Isolation Forest score
    prompt: |
      In `anomalies.py`, implement `fit_gaussian`, `log_density` (in log space with `slogdet` and `solve` - the
      starting draft exponentiates and returns -inf for extreme rows), `choose_threshold` (the log-density
      cut-off with the best F1 on labelled rows, lowest threshold on ties), `average_path_length` and
      `anomaly_score` from the Isolation Forest paper, and `isolation_scores` (higher means more anomalous - the
      draft returns scikit-learn's opposite). The tests compare with SciPy, the paper's numbers and scikit-learn.
    project: ai
    files:
      - exercises/ml_foundations/anomalies.py
    test: tests/ml_foundations/test_anomalies.py
    command: .venv/bin/python -m pytest tests/ml_foundations/test_anomalies.py
    hints:
      - "np.linalg.slogdet(cov) returns (sign, logdet); the squared Mahalanobis distance of every row is np.sum(diff * np.linalg.solve(cov, diff.T).T, axis=1)."
      - "F1 needs no library call: with flagged rows and caught frauds, F1 = 2 * caught / (flagged + total frauds). Loop over np.unique(log_dens) in increasing order and keep a threshold only when F1 is strictly higher."
      - "c(n) = 2 * (ln(n - 1) + 0.5772156649) - 2 * (n - 1) / n for n > 2; c(2) = 1 and c(1) = 0."
      - isolation_scores is one line once you remember that score_samples is the opposite of the paper's score.
    modelAnswer: |
      ```python
      def log_density(g: Gaussian, X) -> np.ndarray:
          X = np.asarray(X, dtype=float)
          diff = X - g.mean
          sign, logdet = np.linalg.slogdet(g.cov)
          if sign <= 0:
              raise ValueError("covariance matrix is not positive definite")
          maha = np.sum(diff * np.linalg.solve(g.cov, diff.T).T, axis=1)
          return -0.5 * (maha + logdet + X.shape[1] * np.log(2 * np.pi))


      def choose_threshold(log_dens, y) -> float:
          log_dens = np.asarray(log_dens, dtype=float)
          y = np.asarray(y).astype(bool)
          if not y.any():
              raise ValueError("choosing a threshold needs at least one labelled fraud")
          best_t, best_f1 = None, -1.0
          for t in np.unique(log_dens):
              flagged = log_dens <= t
              tp = np.sum(flagged & y)
              f1 = 2 * tp / (flagged.sum() + y.sum())
              if f1 > best_f1:
                  best_t, best_f1 = float(t), f1
          return best_t


      def isolation_scores(X_train, X, seed=0) -> np.ndarray:
          forest = IsolationForest(random_state=seed).fit(X_train)
          return -forest.score_samples(X)
      ```

      `solve` avoids forming the inverse, and `slogdet` the determinant, so nothing underflows: a row 5000 km
      away gets a large negative but finite log-density. F1 is written as 2TP / (flagged + positives), which
      equals 2PR / (P + R) and needs no special case for zero precision. Because thresholds are tried in
      increasing order and only a strictly better F1 replaces the best, ties keep the lowest threshold - the one
      that flags fewer rows. The full solution, with the paper's c(n) and score, is in
      `solutions/ml_foundations/anomalies.py`.
    solution: |
      Fit the mean and the ddof=1 covariance; compute the log-density from the Mahalanobis distance (via solve),
      the log-determinant (via slogdet) and d log(2 pi); scan distinct log-densities as thresholds keeping the
      first best F1; implement c(n) and s = 2^(-E(h)/c(n)) from equations 1 and 2; and negate scikit-learn's
      score_samples.
    rubric:
      - Every test in tests/ml_foundations/test_anomalies.py passes.
      - log_density never calls np.exp or np.linalg.inv, and is finite for extreme rows.
      - The threshold scan computes F1 from counts and keeps the lowest threshold on ties.
      - You can explain why scikit-learn's score_samples must be negated for a "higher is more suspicious" ranking.
      - You can explain why the F1 found on validation rows overstates the F1 on new rows.
    followUp: |
      Replace the single Gaussian with a mixture of two (one per merchant type) - how does the log-density of a
      row combine the two components without leaving log space? (Look up `scipy.special.logsumexp`.)

  - id: few-labels-plan
    type: short
    concept: anomaly-detection
    skill: application
    title: Prove the detector is worth a review team
    prompt: |
      SandPay's risk lead will staff two analysts (100 reviews a day) if your Isolation Forest finds "enough"
      fraud. About 0.5% of transactions are fraud, and there are no reliable labels for the new pattern. Last
      week you tuned a log-density threshold on a validation slice with 26 frauds and reported F1 0.744. How do
      you produce honest evidence within two weeks?
    modelAnswer: |
      - **Don't report the 0.744.** It was chosen as the best of many thresholds on 26 frauds; on fresh rows the
        same procedure gave 0.429. Re-measure on rows not used for any choice.
      - **Label where the detector points.** Each day, analysts review the top 100 by score (sorted with the
        right sign). Their verdicts give **precision at 100** per day with a confidence interval - the number
        that decides staffing. In the lesson's data the top 50 held 9-10 frauds, against 0 in a random 50.
      - **Estimate what is missed.** Review a small random audit sample of unflagged transactions (say 50 a
        day), or use chargebacks as they arrive, to estimate recall; at 0.5% prevalence expect very few positives,
        so pool weeks and say how uncertain it is.
      - **Compare with the baseline:** the current rules' queue, scored the same way.
      - **Fix the cut-off from capacity**, not from `contamination='auto'`, which flagged 17% of rows.
      - **Keep the evidence:** daily counts, the score sign and threshold, model and feature versions, and the
        audit sample design.
    rubric:
      - Rejects the validation F1 as optimistic and explains why.
      - Uses precision at k on the analysts' own reviews as the main measure.
      - Adds an audit sample or delayed labels to estimate recall, with uncertainty.
      - Compares with the current baseline and sets the cut-off from capacity.
    hints:
      - What happens to a threshold chosen as the best of many on 26 examples?
      - Which rows will the analysts label anyway?
    solution: |
      Treat the 0.744 as optimistic (it fell to 0.429 on fresh rows). Measure precision at k on the analysts' daily
      reviews of the top-ranked rows, estimate misses with an audit sample of unflagged rows and late chargebacks,
      compare with the current rules, set the cut-off from capacity, and keep the counts and versions as evidence.

  - id: contamination-meaning
    type: mcq
    concept: anomaly-detection
    skill: recall
    title: What does contamination change?
    prompt: |
      You refit `IsolationForest(random_state=0)` with `contamination` 0.001, 0.005, 0.02 and 0.05 on the same
      training rows. What changes between the four models?
    options:
      - id: threshold
        text: Only the cut-off used by predict (and the offset in decision_function); the trees and score_samples are the same, so the ranking is unchanged.
        feedback: Correct - in the real run the flagged count went 4, 16, 92, 227 while precision fell and recall rose along one ranking.
      - id: trees
        text: The trees are built differently, focusing on the expected share of outliers.
        feedback: Tree building uses random features and split values on sub-samples; contamination isn't involved. It is applied after fitting to set the threshold.
      - id: accuracy
        text: It is the fraud rate the model will achieve on new data.
        feedback: It is the share of training rows called outliers, by construction - not a measured rate on new data.
      - id: auto-best
        text: Nothing useful - 'auto' always chooses the best threshold.
        feedback: "'auto' uses the paper's fixed offset (-0.5) and flagged 17% of test rows here - far more than any review team can handle."
    correct: [threshold]
    hints:
      - Is contamination used while building trees, or afterwards?
    solution: |
      contamination places the cut-off on the scores so that that share of training rows is called an outlier.
      The scores and the ranking are unchanged, so choose it from review capacity and judge the detector by its
      ranking.

  - id: pca-code
    type: coding
    concept: pca-dimensionality-reduction
    skill: application
    title: PCA with the SVD
    prompt: |
      In `pca.py`, fix `fit_pca` (the starting draft takes the SVD of uncentred data and has no sign convention)
      and implement `transform` (with optional whitening), `inverse_transform`, `reconstruction_error` and
      `components_for_variance`. The tests compare directions (up to sign), explained variance, scores and
      reconstruction errors with scikit-learn's `PCA`, and check that a night-time merchant has by far the
      largest reconstruction error.
    project: ai
    files:
      - exercises/ml_foundations/pca.py
    test: tests/ml_foundations/test_pca.py
    command: .venv/bin/python -m pytest tests/ml_foundations/test_pca.py
    hints:
      - "Centre first: mean = X.mean(axis=0), then np.linalg.svd(X - mean, full_matrices=False)."
      - "For the sign convention, find each row's largest absolute entry with np.argmax(np.abs(Vt), axis=1) and multiply the row by the sign of that entry."
      - The explained variance is S**2 / (n - 1); divide by the sum over all directions for the ratio, then keep the first n_components.
      - components_for_variance - np.searchsorted on the cumulative ratio gives the index where the target is reached; add one, and allow a tiny tolerance for target 1.0.
    modelAnswer: |
      ```python
      def fit_pca(X, n_components) -> PCAModel:
          X = np.asarray(X, dtype=float)
          n, d = X.shape
          if not 1 <= n_components <= min(n, d):
              raise ValueError(f"n_components must be between 1 and {min(n, d)}, got {n_components}")
          mean = X.mean(axis=0)
          _, S, Vt = np.linalg.svd(X - mean, full_matrices=False)
          signs = np.sign(Vt[np.arange(len(Vt)), np.argmax(np.abs(Vt), axis=1)])
          Vt = Vt * signs[:, None]
          variance = S**2 / (n - 1)
          return PCAModel(
              mean=mean,
              components=Vt[:n_components],
              explained_variance=variance[:n_components],
              explained_variance_ratio=(variance / variance.sum())[:n_components],
          )


      def transform(model: PCAModel, X, whiten=False) -> np.ndarray:
          Z = (np.asarray(X, dtype=float) - model.mean) @ model.components.T
          return Z / np.sqrt(model.explained_variance) if whiten else Z


      def reconstruction_error(model: PCAModel, X) -> np.ndarray:
          X = np.asarray(X, dtype=float)
          return np.sum((X - inverse_transform(model, transform(model, X))) ** 2, axis=1)
      ```

      The draft's bug is the classic one: without centring, the first right singular vector points at the mean of
      the data (cosine 1.0 with it on the hourly profiles) instead of along the spread (cosine 0.044 with the real
      first component). The ratio divides by the variance of **all** directions, so it is right even when you keep
      only a few. The full solution, with `inverse_transform` and `components_for_variance`, is in
      `solutions/ml_foundations/pca.py`.
    solution: |
      Centre on the training mean, take the thin SVD, flip each direction so its largest entry is positive, compute
      variances as S^2/(n-1) and ratios over all directions, project with (X - mean) @ components.T (dividing by
      the standard deviations to whiten), reconstruct with Z @ components + mean, and take squared row errors.
    rubric:
      - Every test in tests/ml_foundations/test_pca.py passes.
      - The mean is subtracted in fit, transform and added back in inverse_transform.
      - Explained variance uses n - 1 and the ratio uses the total over all directions.
      - You can explain why PCA directions are compared up to sign.
      - You can explain why reconstruction error flags the night-time merchants.
    followUp: |
      Fit PCA on standardised merchant features and on raw ones. Using your `explained_variance_ratio`, explain
      to a product manager why "one component explains 100% of the variance" was not a discovery.

  - id: pca-units
    type: mcq
    concept: pca-dimensionality-reduction
    skill: analysis
    title: "\"One component explains 100% of the variance\""
    prompt: |
      PCA on SandPay's raw merchant features (monthly volume and average ticket in euros, refund rate and
      card-not-present share as fractions) prints explained variance ratios `[1.0, 0.0, 0.0, 0.0]` and a first
      component `[1.0, 0.0001, 0.0, -0.0]`. A colleague concludes that merchants are fully described by one
      number. What is the right reading?
    options:
      - id: units
        text: The first component is just monthly volume, the column with the largest numbers; standardise (and log) the features and refit - the real refit gave ratios 0.709, 0.21, 0.058, 0.023.
        feedback: Correct - PCA maximises variance, and variance in euros squared dwarfs variance in fractions. After scaling, two components keep 92%.
      - id: 'agree'
        text: The colleague is right - the other three features carry no information.
        feedback: Refund rate and card-not-present share separate cafes from online shops perfectly; they only look empty because their units are tiny.
      - id: centre
        text: PCA was run without centring; centring fixes it.
        feedback: scikit-learn's PCA always centres. The issue is scaling - PCA "centers but does not scale the input data".
      - id: whiten
        text: Use whiten=True so every component gets variance 1.
        feedback: Whitening rescales the component scores after the directions are found; the first direction would still be volume.
    correct: [units]
    hints:
      - Which column has the largest variance in its own units?
      - Does PCA know that euros and fractions are different units?
    solution: |
      PCA finds directions of largest variance in the units given. Monthly volume varies by hundreds of thousands
      of euros; the rates by hundredths. Standardise (and log the multiplicative features) when units differ - as
      CS229 does before PCA - and the components then mix all four features.

  - id: segmentation-plan
    type: testdesign
    concept: density-clustering-and-validation
    skill: application
    title: Validate a merchant segmentation before it ships
    prompt: |
      A data scientist proposes five k-means merchant segments for SandPay's new pricing tiers, built from 40
      features, with a silhouette of 0.42. Design the checks you would run before pricing uses it: preconditions,
      steps, expected results and the evidence to keep.
    hints:
      - What would the same pipeline report on data with no structure?
      - What should stay the same if you change the seed or the sample?
    modelAnswer: |
      **Preconditions:** the pipeline code, feature list with units and transformations, the fitted scaler, the
      seed, scikit-learn version, and a held-out sample of merchants.

      **Steps and expected results:**

      1. **Feature audit** - no identifiers, no columns derived from the price tier itself, multiplicative
         features logged, scaling fitted on the training merchants only. Expected: every feature justified.
      2. **Null baseline** - run the same pipeline on column-shuffled data (each feature shuffled independently)
         ten times. Expected: the real silhouette clearly above the shuffled ones (uniform noise reached 0.41 in
         this lesson, so 0.42 alone proves nothing).
      3. **k scan** - inertia and silhouette for k = 2-10. Expected: a reason for 5 in the data or the business.
      4. **Stability** - refit on bootstrap samples with five seeds. Expected: pairwise ARI high; segment
         centroids close.
      5. **Hold-out** - assign held-out merchants with the fitted model. Expected: similar segment sizes and
         centroids.
      6. **Usefulness** - compare segments on outcomes not used to build them (churn, chargebacks, revenue).
         Expected: meaningful differences, or the segments are only a description.
      7. **Identity** - segments named by their centroids, with an explicit mapping for retraining. Expected: no
         raw cluster numbers in the pricing database.

      **Evidence:** the null-baseline distribution, the k scan table, the ARI matrix across seeds, held-out
      sizes, the outcome comparison, and the run's versions and seeds.
    solution: |
      Audit the features, compare the silhouette with column-shuffled baselines, justify k with a scan, check
      stability with ARI across seeds and bootstraps, check held-out assignments and outcome differences, and
      replace cluster numbers with named, mapped segments - keeping each table as evidence.
    rubric:
      - Includes a null baseline and explains why 0.42 alone is not evidence.
      - Checks stability across seeds or samples with a label-independent measure (ARI).
      - Checks usefulness on outcomes not used to build the clusters.
      - Addresses feature scaling, leakage of the target tier, and cluster identity across retraining.
      - Names the evidence to keep.

  - id: interview-no-labels
    type: interview
    concept: anomaly-detection
    skill: analysis
    title: "\"How would you find fraud with no labels?\""
    prompt: |
      An interviewer for an ML engineering role at a payments company asks: "We have millions of transactions a
      day and almost no fraud labels for a new attack pattern. How would you build and evaluate a detector?"
    modelAnswer: |
      I'd frame it as ranking for a review queue, not as classification.

      **Features:** behaviour at decision time - log amount, hour (as a cyclic feature), distance from usual
      locations, velocity counts per card and merchant - computed only from data available at authorisation, and
      no identifiers as numbers. Scaling and transformations fitted on training data inside a pipeline.

      **Models:** start simple and complementary - a Gaussian or robust-covariance log-density (always in log
      space) and an Isolation Forest, which handles many features and sub-samples, so it is cheap at this volume.
      I'd remember that scikit-learn's `score_samples` is higher for normal rows.

      **Evaluation without labels:** the review capacity sets k. Analysts review the top k daily; their verdicts
      give precision at k. A small random audit of unflagged transactions, plus chargebacks as they arrive,
      estimates recall. I'd compare against the current rules on the same measures, and I wouldn't trust any
      threshold tuned on a handful of known frauds - it is optimistic.

      **Operations:** monitor the score distribution for drift, retrain on recent normal traffic, and as labels
      accumulate train a supervised model for known fraud, keeping the detector for novel patterns.
    rubric:
      - Frames the problem as ranking for limited review capacity.
      - Chooses decision-time features and fits preprocessing on training data only.
      - Names suitable detectors and the score-direction or log-space pitfalls.
      - Evaluates with precision at k on reviews plus an audit sample for recall, against a baseline.
      - Plans monitoring and a path to supervised learning as labels arrive.
    followUps:
      - Your detector's daily precision at 100 drops from 0.2 to 0.05 overnight. What do you check?
      - How would you stop the analysts' review queue from biasing the labels you later train on?
      - Why might an Isolation Forest get worse when you add more features?
    hints:
      - Who will look at the detector's output, and how many rows can they look at?
      - Which labels will you get for free once the detector runs?
    solution: |
      Rank transactions with decision-time features using a log-density model and an Isolation Forest (right sign),
      set the cut-off from review capacity, measure precision at k on analysts' reviews and recall with an audit
      sample and chargebacks, compare with the current rules, monitor drift, and move to supervised models as
      labels accumulate.

placement:
  - id: place-scale
    type: mcq
    concept: kmeans-clustering
    skill: application
    title: Prepare features for k-means
    prompt: |
      You will cluster SandPay merchants with k-means on monthly volume (euros, from 9000 to 2.4 million), average
      ticket (euros, 5 to 1600), refund rate and card-not-present share (fractions). Which preparation is best?
    options:
      - id: log-scale
        text: Log-transform volume and ticket, then standardise all four features, fitted on training merchants inside a pipeline.
        feedback: Correct - logs turn multiplicative differences into additive ones, and standardising stops one unit from dominating the distance.
      - id: raw
        text: Use the raw values - k-means learns which features matter.
        feedback: k-means has no feature weights; with raw values, the distance is almost entirely monthly volume.
      - id: minmax-volume
        text: Divide only monthly volume by 1000 so it is in thousands of euros.
        feedback: Volume in thousands still ranges up to 2400, dwarfing fractions below 1. All features need comparable scales.
      - id: pca-first
        text: Run PCA on the raw features first and cluster the first component.
        feedback: On raw features the first component is monthly volume (explained variance ratio 1.0), so this clusters volume alone.
    correct: [log-scale]
    hints:
      - Euclidean distance adds squared differences in each feature's own units.
    solution: |
      Distances must treat features comparably. Logging the multiplicative features and standardising them all
      (fitted on training data) took the real clustering from ARI 0.464 to 1.0.

  - id: place-validate
    type: mcq
    concept: density-clustering-and-validation
    skill: analysis
    title: Is a silhouette of 0.41 good news?
    prompt: |
      k-means with k = 4 on a new data set gives a silhouette score of 0.41 and four clusters of similar size. What
      can you conclude?
    options:
      - id: not-enough
        text: Not much yet - k-means on uniform noise can score about 0.41 with balanced clusters; compare with a null baseline and check stability before trusting the clusters.
        feedback: Correct - in the lesson, 600 uniform points gave 0.41 at k = 4. A score needs a baseline.
      - id: good
        text: The data has four real, well-separated groups, because the score is positive.
        feedback: Positive only means rows are on average closer to their own cluster than to the next - which k-means achieves on structureless data too.
      - id: bad
        text: The clustering is wrong - a good silhouette must be above 0.7.
        feedback: There is no universal cut-off; correct density-based clusterings can score lower than wrong round ones (0.33 against 0.489 on the moons).
      - id: dbscan-better
        text: Switch to DBSCAN, whose silhouette will be higher.
        feedback: The silhouette tends to favour k-means' convex clusters, not DBSCAN's; and a higher score would not settle the question either.
    correct: [not-enough]
    hints:
      - What does k-means return for data with no clusters at all?
    solution: |
      An internal score without a reference proves little. Compare with shuffled or uniform data processed the same
      way, check the clusters are stable across seeds and samples, and check they differ on outcomes that matter.

  - id: place-iforest
    type: mcq
    concept: anomaly-detection
    skill: application
    title: Build the review queue
    prompt: |
      `forest = IsolationForest(random_state=0).fit(X_train)`. You need the 50 most suspicious of today's
      transactions `X_today`. Which code gives them?
    options:
      - id: ascending
        text: np.argsort(forest.score_samples(X_today))[:50]
        feedback: Correct - score_samples is lower for more abnormal rows, so the 50 lowest are the most suspicious.
      - id: descending
        text: np.argsort(-forest.score_samples(X_today))[:50]
        feedback: That takes the 50 highest score_samples - the most normal rows. In the lesson the wrong sign gave average precision 0.002, below random.
      - id: predict
        text: np.where(forest.predict(X_today) == 1)[0][:50]
        feedback: predict returns 1 for inliers, so this picks 50 normal rows in input order.
      - id: contamination
        text: Refit with contamination=0.01 and take the first 50 rows where predict is -1.
        feedback: That gives 50 flagged rows in input order, not the 50 most suspicious; contamination only moves the cut-off.
    correct: [ascending]
    hints:
      - In scikit-learn's convention, is a higher score_samples more normal or more abnormal?
    solution: |
      scikit-learn's score_samples is the opposite of the paper's anomaly score - "the lower, the more abnormal".
      Sort ascending (or negate and sort descending) and take the top 50.

  - id: place-pca
    type: mcq
    concept: pca-dimensionality-reduction
    skill: application
    title: How many components?
    prompt: |
      PCA on 394 merchants' 24-hour volume profiles gives explained variance ratios starting 0.523, 0.46, 0.001,
      0.001, ... Six other merchants have reconstruction errors (with 3 components) over 100 times the largest of
      the 394. What follows?
    options:
      - id: two
        text: Two components keep about 98% of the variance, and the six merchants have daily patterns the normal components cannot describe - worth a review.
        feedback: Correct - the cumulative ratio is 0.983 at two components, and large reconstruction error means "unlike the normal patterns".
      - id: twentyfour
        text: All 24 components are needed, because every hour carries information.
        feedback: The ratios show that after two components each further one adds 0.1% - the profiles lie close to a plane.
      - id: fraud
        text: The six merchants are fraudulent and should be blocked.
        feedback: A large reconstruction error says the profile is unusual, not why. It is a reason to review, not proof.
      - id: one
        text: One component is enough because its ratio is the largest.
        feedback: The first keeps 52%; the second keeps another 46%. Dropping it would lose almost half the variance.
    correct: [two]
    hints:
      - Add up the ratios until they pass 0.95.
    solution: |
      0.523 + 0.46 = 0.983, so two components keep 98.3%. Rows that the kept components cannot rebuild are unusual;
      a large reconstruction error makes them candidates for review, not verdicts.

recall:
  - id: recall-lloyd
    concept: kmeans-clustering
    prompt: Describe Lloyd's algorithm and why its inertia never increases.
    answer: Initialise k centroids; assign every row to its nearest centroid; move every centroid to the mean of its rows; repeat until they stop moving. Assignment minimises the inertia over assignments and the mean minimises it over centroids, so it is coordinate descent and can only decrease - but to a local minimum.
  - id: recall-kmeanspp
    concept: kmeans-clustering
    prompt: How does k-means++ choose its starting centroids, and why?
    answer: The first uniformly at random; each next one with probability proportional to D(x)^2, the squared distance to the nearest centroid chosen so far. Starts spread out, giving an expected inertia within 8(ln k + 2) of the optimum after seeding and fewer bad local minima.
  - id: recall-choose-k
    concept: kmeans-clustering
    prompt: How do you choose k, and why not by the lowest inertia?
    answer: Inertia always falls as k grows (0 with one row per cluster), so look for its elbow; check the silhouette, which peaks at well-separated k; then decide by what the business can use.
  - id: recall-dbscan
    concept: density-clustering-and-validation
    prompt: What are DBSCAN's core points and noise, and how do you choose eps?
    answer: A core point has at least min_samples rows (itself included in scikit-learn) within eps; clusters are connected core points plus nearby rows; everything else is noise (-1). Choose eps near the knee of the sorted distances to the min_samples-th neighbour.
  - id: recall-mislead
    concept: density-clustering-and-validation
    prompt: Name three ways unsupervised results mislead.
    answer: The silhouette favours convex clusters (wrong k-means 0.489 beat correct DBSCAN 0.33); k-means finds clusters in uniform noise (silhouette 0.41); cluster numbers change between runs (ARI 1.0 with no label equal). Also, the feature units decide the answer.
  - id: recall-iforest
    concept: anomaly-detection
    prompt: What is the Isolation Forest score, and what does scikit-learn's score_samples return?
    answer: s(x, n) = 2^(-E(h(x))/c(n)) - near 1 anomalous, 0.5 unremarkable. scikit-learn's score_samples is its opposite - lower is more abnormal - and contamination only sets predict's cut-off.
  - id: recall-few-labels
    concept: anomaly-detection
    prompt: How do you evaluate an anomaly detector with almost no labels?
    answer: Review the top k by score and measure precision at k from those verdicts; estimate recall with a random audit of unflagged rows and late labels; compare with the current baseline; distrust thresholds tuned on a few positives.
  - id: recall-pca
    concept: pca-dimensionality-reduction
    prompt: How do you compute PCA, and what are explained variance ratio, reconstruction error and whitening?
    answer: Centre the data, take the SVD, and use the rows of V^T as directions. Variance along j is S_j^2/(n-1), and the ratio is its share of the total. Reconstruction error is the squared distance between a row and its rebuild from the kept components. Whitening divides the scores by their standard deviations.

