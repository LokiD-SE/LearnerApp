id: scikit-learn-pipelines
title: Feature engineering and scikit-learn pipelines
subject: ai-engineering
module: ml-foundations
level: intermediate
status: published
estimatedMinutes: 85
summary: Turn raw rows into model inputs the way scikit-learn intends - the estimator API, scaling, one-hot encoding and imputation, all wired into a Pipeline with a ColumnTransformer so nothing is learnt from rows the model is scored on. Then measure honestly with cross-validation, tune with grid and randomized search, estimate the tuned model with nested cross-validation, and save it without trusting a pickle you did not make. Every number shown was produced by the code shown.
