environment: |
  - **Runtime and libraries:** Python 3.12.3, **PyTorch 2.15.0+cpu** (CPU-only build, no CUDA), **NumPy 2.5.4**,
    in the `practice/ai/.venv` virtual environment. Every printed tensor, loss, warning and error in this lesson
    was produced by running the code on Linux in November 2026 with `torch.manual_seed(...)` and fixed
    generators; object addresses in printed `grad_fn`s are shortened to `0x...`. Scripts ran with
    `OMP_NUM_THREADS=2` on a shared machine. Training numbers can differ slightly on other machines, other
    thread counts and other PyTorch versions - compare with tolerances, not `==`.
  - **Primary sources (PyTorch 2.15 documentation):**
    - [torch.Tensor](https://docs.pytorch.org/docs/2.15/tensors.html), [Tensor
      attributes](https://docs.pytorch.org/docs/2.15/tensor_attributes.html) (dtype, device), [Tensor
      views](https://docs.pytorch.org/docs/2.15/tensor_view.html),
      [Tensor.view](https://docs.pytorch.org/docs/2.15/generated/torch.Tensor.view.html),
      [Tensor.reshape](https://docs.pytorch.org/docs/2.15/generated/torch.Tensor.reshape.html) ("returns a view
      if shape is compatible with the current shape"), [Broadcasting
      semantics](https://docs.pytorch.org/docs/2.15/notes/broadcasting.html),
      [torch.from_numpy](https://docs.pytorch.org/docs/2.15/generated/torch.from_numpy.html) ("The returned
      tensor and ndarray share the same memory") and
      [Tensor.numpy](https://docs.pytorch.org/docs/2.15/generated/torch.Tensor.numpy.html).
    - [Autograd mechanics](https://docs.pytorch.org/docs/2.15/notes/autograd.html),
      [Tensor.backward](https://docs.pytorch.org/docs/2.15/generated/torch.Tensor.backward.html) ("This function
      accumulates gradients in the leaves - you might need to zero .grad attributes or set them to None before
      calling it"), [torch.autograd.grad](https://docs.pytorch.org/docs/2.15/generated/torch.autograd.grad.html),
      [torch.no_grad](https://docs.pytorch.org/docs/2.15/generated/torch.no_grad.html),
      [Tensor.detach](https://docs.pytorch.org/docs/2.15/generated/torch.Tensor.detach.html) and
      [Tensor.item](https://docs.pytorch.org/docs/2.15/generated/torch.Tensor.item.html).
    - [torch.nn.Module](https://docs.pytorch.org/docs/2.15/generated/torch.nn.Module.html) (forward, `eval()`,
      `state_dict`, "an `__init__()` call to the parent class must be made before assignment on the child"),
      [nn.Sequential](https://docs.pytorch.org/docs/2.15/generated/torch.nn.Sequential.html),
      [nn.Dropout](https://docs.pytorch.org/docs/2.15/generated/torch.nn.Dropout.html),
      [nn.BCEWithLogitsLoss](https://docs.pytorch.org/docs/2.15/generated/torch.nn.BCEWithLogitsLoss.html),
      [nn.BCELoss](https://docs.pytorch.org/docs/2.15/generated/torch.nn.BCELoss.html) (the log clamped at
      -100), [torch.optim](https://docs.pytorch.org/docs/2.15/optim.html),
      [Optimizer.zero_grad](https://docs.pytorch.org/docs/2.15/generated/torch.optim.Optimizer.zero_grad.html)
      (`set_to_none=True` by default), [torch.utils.data](https://docs.pytorch.org/docs/2.15/data.html)
      (Dataset, DataLoader, `random_split`), [Serialization
      semantics](https://docs.pytorch.org/docs/2.15/notes/serialization.html),
      [torch.save](https://docs.pytorch.org/docs/2.15/generated/torch.save.html) and
      [torch.load](https://docs.pytorch.org/docs/2.15/generated/torch.load.html) (`weights_only=True` by
      default).
    - The official "Learn the Basics" tutorials on [pytorch.org/tutorials](https://docs.pytorch.org/tutorials/beginner/basics/intro.html):
      tensors, datasets and dataloaders, build the neural network, automatic differentiation, optimizing model
      parameters ("Gradients by default add up; to prevent double-counting, we explicitly zero them at each
      iteration") and save and load the model.
    - Ian Goodfellow, Yoshua Bengio and Aaron Courville, [*Deep Learning*](https://www.deeplearningbook.org)
      (MIT Press, 2016): 6.5.1 (computational graphs) and 6.5 generally (back-propagation, which autograd
      implements), 8.1.3 (batch and minibatch algorithms) and 7.12 (dropout).
  - **Fictional and synthetic:** SandPay, its card payments and fraud labels. The data are generated with NumPy
    (`default_rng(0)`, 2,000 payments, about 12% fraud) from a known logistic model, so they are synthetic and
    nothing here describes a real payment system.
  - **Builds on:** neurons, layers, activations and backpropagation by hand in NumPy from [Neural networks and
    backpropagation](#/lesson/neural-networks-and-backprop); NumPy arrays and broadcasting from [Python, NumPy
    and pandas for ML](#/lesson/python-numpy-pandas); log loss from [Logistic regression and
    classification](#/lesson/logistic-regression-classification). Making training work well - optimisers,
    initialisation, normalisation, learning-rate schedules - is the next lesson, [Training deep networks
    well](#/lesson/training-deep-networks).

