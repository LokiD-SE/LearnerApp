id: pytorch-fundamentals
title: PyTorch fundamentals
subject: ai-engineering
module: deep-learning
level: intermediate
status: published
estimatedMinutes: 85
summary: The four pieces every PyTorch program is built from - tensors (dtype, shape, views, broadcasting and the NumPy bridge), autograd (the recorded graph, backward, leaf tensors, why gradients accumulate, no_grad and detach), modules and data (nn.Module, parameters, state_dict, Dataset and DataLoader) and the training loop (loss on logits, zero_grad / backward / step, train and eval modes, saving weights). Built around a small fraud model for SandPay; every output shown was produced by running the code.
