environment: |
  - **Runtime:** **Python 3.12.3**, **NumPy 2.5.4**, **pandas 3.1.1** and **scikit-learn 1.9.1** - the versions
    pinned in `practice/ai/requirements.txt`. Every printed number, array and table in this lesson was produced
    by running the code shown on Linux in November 2026, with fixed random seeds; the same versions give the
    same output. Other scikit-learn versions may differ in the last digits.
  - **scikit-learn documentation (version 1.9.1):** [3.1 Cross-validation: evaluating estimator
    performance](https://scikit-learn.org/stable/modules/cross_validation.html) (hold out a test set; a
    validation set; "A test set should still be held out for final evaluation, but the validation set is no
    longer needed when doing CV"; `StratifiedKFold`, `GroupKFold`, `TimeSeriesSplit`); [3.4 Metrics and
    scoring](https://scikit-learn.org/stable/modules/model_evaluation.html) (precision, recall, F-measures; the
    average precision definition `AP = sum_n (R_n - R_(n-1)) P_n`, "With random predictions, the AP is the
    fraction of positive samples", no interpolation; ROC AUC; regression metrics); [3.5 Validation curves and
    learning curves](https://scikit-learn.org/stable/modules/learning_curve.html) ("If the training score and the
    validation score are both low, the estimator will be underfitting. If the training score is high and the
    validation score is low, the estimator is overfitting"); [12. Common pitfalls - Data
    leakage](https://scikit-learn.org/stable/common_pitfalls.html) ("Data leakage occurs when information that
    would not be available at prediction time is used when building the model"; "never call fit on the test
    data"); [1.1 Linear models](https://scikit-learn.org/stable/modules/linear_model.html) (ridge's complexity
    parameter alpha >= 0; "The Lasso is a linear model that estimates sparse coefficients"); the API pages of
    [train_test_split](https://scikit-learn.org/stable/modules/generated/sklearn.model_selection.train_test_split.html)
    and
    [average_precision_score](https://scikit-learn.org/stable/modules/generated/sklearn.metrics.average_precision_score.html).
  - **Textbooks:** Ian Goodfellow, Yoshua Bengio and Aaron Courville, *Deep Learning* (MIT Press, 2016), free at
    [deeplearningbook.org](https://www.deeplearningbook.org/) - [chapter 5, Machine Learning
    Basics](https://www.deeplearningbook.org/contents/ml.html) (section 5.2: the two central challenges,
    underfitting and overfitting; section 5.3: a validation set because "the test examples are not used in any
    way to make choices about the model, including its hyperparameters"; section 5.4: bias and variance) and
    [chapter 7, Regularization for Deep
    Learning](https://www.deeplearningbook.org/contents/regularization.html) (regularization as "any
    modification we make to a learning algorithm that is intended to reduce its generalization error but not
    its training error"). Gareth James, Daniela Witten, Trevor Hastie, Robert Tibshirani and Jonathan Taylor,
    *An Introduction to Statistical Learning with Applications in Python* (Springer, 2023), free at
    [statlearning.com](https://www.statlearning.com/) - section 2.2 (the bias-variance decomposition, equation
    2.7), chapter 5 (the validation set approach, LOOCV, k-fold with k = 5 or 10) and chapter 6 (ridge, the
    lasso, standardising predictors before ridge).
  - **Fictional and synthetic:** SandPay and every transaction, merchant and amount. The fraud data set is
    generated by the `make_transactions` function shown in the lesson (seed 7, 20000 rows, 1.15% fraud); the
    settlement-delay curve is a sine wave plus noise. Real fraud data is messier - labels arrive late, fraud
    patterns drift - and the lesson says where that matters.
  - **Not repeated here:** fitting the models themselves ([Linear regression and gradient
    descent](#/lesson/linear-regression-gradient-descent), [Logistic regression and
    classification](#/lesson/logistic-regression-classification)) and building full preprocessing pipelines with
    hyperparameter search ([Feature engineering and scikit-learn pipelines](#/lesson/scikit-learn-pipelines)).

prerequisites:
  - python-numpy-pandas
  - linear-regression-gradient-descent
  - logistic-regression-classification

concepts:
  - id: holdout-splits-and-leakage
    name: Held-out data, cross-validation and data leakage
    summary: A model is judged on data it never learned from - a training set to fit, a validation set (or cross-validation) to choose, and a test set touched once at the end. Stratify rare classes, keep groups (merchants, customers) and time order intact, and fit every preprocessing step on training rows only - otherwise information leaks from the evaluation data and the score is optimistic.
  - id: classification-and-regression-metrics
    name: Choosing metrics that match the problem
    summary: Accuracy hides a rare class. The confusion matrix gives precision (how many flagged rows are fraud) and recall (how much fraud is caught), F1 combines them, and a threshold trades one for the other. ROC-AUC measures ranking and stays near 0.5 for random scores whatever the class balance; average precision starts from the fraud rate and shows how hard imbalance is. For regression, MAE, RMSE and R squared answer different questions, always next to a baseline.
  - id: bias-variance-and-fit
    name: Underfitting, overfitting, bias and variance
    summary: Training error measures how well a model fits; the gap between training and validation error measures how well it generalises. Too simple a model has high bias (both errors high); too flexible a model has high variance (training error low, validation error high). Validation curves show the effect of one hyperparameter, learning curves the effect of more data.
  - id: l1-l2-regularisation
    name: Regularisation with L1 and L2 penalties
    summary: Regularisation trades a little training error for less generalisation error. Ridge (L2) adds alpha times the sum of squared weights and shrinks all of them; the lasso (L1) adds alpha times the sum of absolute weights and sets some exactly to zero. Logistic regression's C is the inverse strength. Standardise features first, and choose the strength on validation data.

objectives:
  - Split data into training, validation and test sets, explain what each is for, and choose stratified, grouped or time-ordered splits for a given data set.
  - Identify data leakage in an evaluation - preprocessing fitted on all rows, the same merchant on both sides, the test set used to choose - and fix it with a pipeline and the right splitter.
  - Compute a confusion matrix, precision, recall and F1 by hand and in code, and choose a decision threshold for a recall target.
  - Explain why accuracy and ROC-AUC look good on 1% fraud while average precision does not, and say which to report.
  - Compare regression metrics (MAE, RMSE, R squared) with a baseline and explain a negative R squared.
  - Diagnose underfitting and overfitting from training and validation scores, validation curves and learning curves, and say what to change.
  - Apply ridge and lasso regularisation, explain how they differ, and tune their strength without touching the test set.

sections:
  - id: intuition
    kind: intuition
    concepts: [holdout-splits-and-leakage, bias-variance-and-fit]
    title: The idea in plain language
    body: |
      Think of a **driving test**. A learner who practises the same three routes until they know every pothole
      will drive those routes perfectly - and may still fail on a road they have never seen. The examiner
      therefore picks a route the learner hasn't practised. That unseen route is the only fair test of whether
      the learner can *drive*, rather than *remember*.

      A model is the same. Fitting it to data is practice; what you want to know is how it will do on
      **tomorrow's transactions**, which it has never seen. So you hide some data from it while it learns and
      judge it only on that. Three things can still go wrong:

      - **The learner memorised the practice routes** - the model fits the training data, noise and all, and
        does badly on new data. That is **overfitting**.
      - **The learner never learned to drive at all** - the model is too simple to capture the pattern, and is
        bad everywhere. That is **underfitting**.
      - **The examiner leaked the route** - something about the test data reached the model while it was being
        built, so the test score is a lie. That is **data leakage**, and it is the most common reason a model
        that looked excellent in a notebook fails in production.

      And even with a fair test, you must score the right thing. At SandPay about **1 in 90** card transactions is
      fraud. A "model" that answers *never fraud* is right 98.9% of the time - and catches nothing. Most of this
      lesson is about scores that can't be fooled that way.

  - id: what
    kind: what
    concepts: [holdout-splits-and-leakage, bias-variance-and-fit]
    title: Training, validation and test sets
    body: |
      | Set | Used to | Rule |
      | --- | --- | --- |
      | **Training set** | fit the model's parameters (weights) | the model sees it as often as it likes |
      | **Validation set** | choose between models and hyperparameters (degree, `alpha`, `C`, threshold) | never used to fit; scores here are slightly optimistic once you have chosen by them |
      | **Test set** | estimate performance on new data, **once**, at the end | never used for any choice |

      **Generalisation error** (also called test error) is the expected error on new data from the same
      distribution. Goodfellow, Bengio and Courville put the goal in two parts: a learning algorithm should
      **make the training error small** and **make the gap between training and test error small**. Failing the
      first is underfitting; failing the second is overfitting.

      Why a separate validation set? Because choosing is learning too. *Deep Learning* (section 5.3) says the test
      examples must not be "used in any way to make choices about the model, including its hyperparameters" -
      otherwise the test score inherits the optimism of every choice. The scikit-learn guide says the same:
      tuning on the test set lets "knowledge about the test set 'leak' into the model".

      **Cross-validation (CV)** replaces the single validation set. In **k-fold CV** the training data is split
      into k folds; each fold is the validation set once while the model is fitted on the other k - 1, and you
      report the mean (and spread) of the k scores. ISLR recommends k = 5 or k = 10 as a good balance of bias
      and variance of the estimate. scikit-learn's guide: "A test set should still be held out for final
      evaluation, but the validation set is no longer needed when doing CV."

      **Hyperparameter** - a setting you choose rather than learn from the data (polynomial degree, `alpha`,
      `C`, number of trees, the decision threshold). **Parameter** - what fitting learns (the weights).

  - id: why
    kind: why
    concepts: [holdout-splits-and-leakage, classification-and-regression-metrics]
    title: Why evaluation is where ML projects fail
    body: |
      A training score is not evidence of anything: a model can score perfectly on data it has memorised. And an
      evaluation can be wrong in ways that all point the same direction - **too optimistic**:

      - The scaler, the feature selector or the imputer was fitted on all the data before splitting.
      - The same customer, card or merchant appears in training and test, so the model recognises them.
      - Random splits on time-ordered data let the model "see the future".
      - Dozens of models were compared on the test set and the best one was reported.
      - The headline metric (accuracy, ROC-AUC) hides that the rare class is barely caught.

      Each of these is shown with real output below. For a payments company the cost is concrete: a fraud model
      reported at "0.99 accuracy" that blocks good customers or misses fraud in production. As a tester you
      already know the principle - *the oracle must be independent of the thing tested*. Model evaluation is
      that principle applied to data.

  - id: data-setup
    kind: code
    concepts: [holdout-splits-and-leakage, classification-and-regression-metrics]
    title: The synthetic SandPay transactions used in this lesson
    collapsed: true
    body: |
      Every fraud example in this lesson uses this generator (saved as `data.py`). Fraud is more likely for
      larger amounts, at night, with a country mismatch, many recent transactions, a new card and a risky
      merchant category - and it is still mostly noise, as real fraud is.

      ```python
      """Synthetic SandPay card transactions with about 1% fraud (fixed seed)."""
      import numpy as np
      import pandas as pd


      def make_transactions(n=20_000, seed=7):
          rng = np.random.default_rng(seed)
          amount = np.round(rng.lognormal(mean=3.5, sigma=1.0, size=n), 2)
          hour = rng.integers(0, 24, size=n)
          card_age_days = rng.integers(1, 2000, size=n)
          tx_last_24h = rng.poisson(2, size=n)
          country_mismatch = rng.random(n) < 0.05
          merchant_risk = rng.choice([0, 1, 2], size=n, p=[0.7, 0.25, 0.05])
          night = (hour < 6).astype(float)
          logit = (-7.4 + 0.6 * np.log(amount) + 0.9 * night + 1.6 * country_mismatch
                   + 0.35 * tx_last_24h - 0.0012 * card_age_days + 0.8 * merchant_risk)
          p = 1 / (1 + np.exp(-logit))
          fraud = (rng.random(n) < p).astype(int)
          return pd.DataFrame({
              "amount": amount, "hour": hour, "card_age_days": card_age_days, "tx_last_24h": tx_last_24h,
              "country_mismatch": country_mismatch.astype(int), "merchant_risk": merchant_risk, "fraud": fraud,
          })
      ```

  - id: splits-internals
    kind: internals
    concepts: [holdout-splits-and-leakage]
    title: Stratified, grouped and time-ordered splits
    body: |
      A random split assumes every row is an independent sample from the same distribution. Three common cases
      break that assumption, and scikit-learn has a splitter for each.

      **Rare classes - stratify.** With 19 fraud rows in 2000, a random 20% test set gets whatever fraud the
      dice give it. `train_test_split(..., stratify=y)` and `StratifiedKFold` keep each class's share in every
      split. Real output (code below):

      ```plaintext
      small sample: rows 2000 fraud 19
      fraud rows in a 20% test set, seeds 0-9, no stratify: [3, 4, 2, 5, 2, 5, 5, 5, 4, 6]
      fraud rows in a 20% test set, seeds 0-9, stratify=y:  [4, 4, 4, 4, 4, 4, 4, 4, 4, 4]
      fraud per fold, KFold:           [3, 2, 7, 4, 3]
      fraud per fold, StratifiedKFold: [3, 4, 4, 4, 4]
      ```

      With 2 fraud rows in a fold, recall can only be 0, 0.5 or 1 - the estimate is mostly luck. Stratifying
      removes one source of that noise (it cannot add fraud that isn't there: report the count next to the
      score).

      **Groups - keep them together.** Several transactions from the same merchant are not independent: they
      share the merchant's behaviour. If one merchant is on both sides, the model can score well by
      *recognising the merchant* rather than learning fraud. `GroupKFold` (and `StratifiedGroupKFold`) keep every
      group on one side. In this run a random forest uses the merchant id as a feature; the label depends mostly
      on a per-merchant effect:

      ```plaintext
      merchant id as a feature, KFold     : 0.865
      merchant id as a feature, GroupKFold: 0.635
      ```

      Which number is right depends on the question. If the model will score **new merchants**, 0.635 is the
      honest estimate and 0.865 is leakage. If it only ever scores merchants it has seen, a split by time is
      closer to reality.

      **Time - train on the past, test on the future.** Fraud patterns drift, and features such as "transactions
      in the last 24 hours" are computed from history. A random split puts June's transactions in training and
      May's in test. Use a cut-off date - everything before it to train, after it to test - or `TimeSeriesSplit`,
      whose training folds always come before their validation fold.

  - id: split-experiments
    kind: code
    concepts: [holdout-splits-and-leakage]
    title: The split experiments
    collapsed: true
    body: |
      ```python
      import numpy as np
      from sklearn.model_selection import train_test_split, StratifiedKFold, KFold, cross_val_score, GroupKFold
      from sklearn.ensemble import RandomForestClassifier
      from data import make_transactions

      df = make_transactions(n=2000, seed=11)
      y = df.fraud.to_numpy(); X = df.drop(columns="fraud").to_numpy()
      print("small sample: rows", len(y), "fraud", y.sum())
      plain = [int(train_test_split(y, test_size=0.2, random_state=s)[1].sum()) for s in range(10)]
      strat = [int(train_test_split(y, test_size=0.2, random_state=s, stratify=y)[1].sum()) for s in range(10)]
      print("fraud rows in a 20% test set, seeds 0-9, no stratify:", plain)
      print("fraud rows in a 20% test set, seeds 0-9, stratify=y: ", strat)
      per_fold_k = [int(y[te].sum()) for _, te in KFold(5, shuffle=True, random_state=0).split(X, y)]
      per_fold_s = [int(y[te].sum()) for _, te in StratifiedKFold(5, shuffle=True, random_state=0).split(X, y)]
      print("fraud per fold, KFold:          ", per_fold_k)
      print("fraud per fold, StratifiedKFold:", per_fold_s)

      # group leakage: the same merchant on both sides
      rng = np.random.default_rng(3)
      merchants = rng.integers(0, 40, 4000)
      merchant_effect = rng.normal(0, 2, 40)
      Xg = np.column_stack([merchants, rng.normal(size=4000)])
      yg = (merchant_effect[merchants] + 0.3 * Xg[:, 1] + rng.normal(0, 1, 4000) > 1.5).astype(int)
      rf = RandomForestClassifier(n_estimators=100, random_state=0)
      print("merchant id as a feature, KFold     :",
            np.round(cross_val_score(rf, Xg, yg, cv=KFold(5, shuffle=True, random_state=0)).mean(), 3))
      print("merchant id as a feature, GroupKFold:",
            np.round(cross_val_score(rf, Xg, yg, cv=GroupKFold(5), groups=merchants).mean(), 3))
      ```

      `cross_val_score` uses accuracy for classifiers unless you pass `scoring=`; the fraud examples below pass
      `scoring="average_precision"`.

  - id: leakage
    kind: internals
    concepts: [holdout-splits-and-leakage]
    title: Data leakage - the evaluation that lies
    body: |
      scikit-learn's definition: "Data leakage occurs when information that would not be available at
      prediction time is used when building the model. This results in overly optimistic performance
      estimates." Its rule: **never call `fit` on the test data** - and that includes the `fit` inside
      preprocessing steps such as `StandardScaler`, `SimpleImputer`, `PCA` and feature selection.

      The most striking demonstration uses **pure noise**: 200 rows, 10000 random features and random labels -
      there is nothing to learn, so any honest estimate of accuracy is about 0.5. Selecting the 25 features most
      correlated with the label *on all rows* before splitting:

      ```python
      import numpy as np
      from sklearn.model_selection import train_test_split
      from sklearn.pipeline import make_pipeline
      from sklearn.linear_model import LogisticRegression
      from sklearn.feature_selection import SelectKBest, f_classif

      rng = np.random.default_rng(42)
      Xn = rng.standard_normal((200, 10_000)); yn = rng.integers(0, 2, 200)
      Xtr, Xte, ytr, yte = train_test_split(Xn, yn, test_size=0.3, random_state=42)
      sel = SelectKBest(f_classif, k=25).fit(Xn, yn)   # WRONG: sees the test rows
      leaky = LogisticRegression().fit(sel.transform(Xtr), ytr)
      print("noise data, selection on ALL rows  -> test accuracy:", round(leaky.score(sel.transform(Xte), yte), 3))
      pipe = make_pipeline(SelectKBest(f_classif, k=25), LogisticRegression()).fit(Xtr, ytr)
      print("noise data, selection inside pipeline -> test accuracy:", round(pipe.score(Xte, yte), 3))
      ```

      ```plaintext
      noise data, selection on ALL rows  -> test accuracy: 0.817
      noise data, selection inside pipeline -> test accuracy: 0.533
      ```

      **0.817 on random noise.** The selector picked features that happen to correlate with the *test* labels,
      so the test set was no longer unseen. Inside a `Pipeline`, `fit` runs the selector on the training rows
      only, and the score falls to chance - the truth.

      Scaling leaks less dramatically (a mean and a standard deviation carry little information) but it is the
      same mistake, and with drifting data it changes the model. The rule is mechanical: **split first, then
      fit everything - every transformer and the model - on the training rows**. A pipeline passed to
      `cross_val_score` or `GridSearchCV` refits every step inside every fold, which is why the next lesson,
      [Feature engineering and scikit-learn pipelines](#/lesson/scikit-learn-pipelines), builds every model as
      one.

      Other leaks you will meet:

      - **Target leakage** - a feature that is only known *because of* the label: `chargeback_filed` predicting
        fraud, or a "refund status" column computed after the investigation. Ask of every feature: *would I have
        this value at the moment I must decide?*
      - **Duplicates** - the same transaction twice (a retry, an export joined twice) on both sides of a split.
      - **Peeking** - choosing among many models by their test score. With 200 coin-flip "models" scored on 500
        random labels, the best looks better than chance; on fresh data it is chance again:

        ```plaintext
        best of 200 random models on the test set: 0.556  same model on fresh data: 0.468
        ```

  - id: visual-workflow
    kind: visual
    concepts: [holdout-splits-and-leakage]
    title: Where each set is used
    body: |
      ```mermaid
      flowchart TD
        D[All labelled data] --> S{Split first - stratified, grouped or by time}
        S --> DEV[Development set]
        S --> T[Test set - locked away]
        DEV --> CV[k-fold cross-validation: fit the whole pipeline on k-1 folds, score the held-out fold]
        CV --> C[Choose features, model, hyperparameters, threshold by the mean CV score]
        C --> F[Refit the chosen pipeline on the whole development set]
        F --> E[Score once on the test set and report it]
        T --> E
        E --> P[Monitor in production - new data is the real test]
      ```

      Notice that the test set joins the flow **once**, at the end. If its score disappoints, you may go back
      and change the model - but then that test set has been used for a choice, and the honest move is to
      say so or to collect a fresh one.

  - id: classification-metrics
    kind: internals
    concepts: [classification-and-regression-metrics]
    title: The confusion matrix, precision, recall and F1
    body: |
      With fraud (1) as the **positive** class, every prediction lands in one cell:

      | | predicted fraud | predicted genuine |
      | --- | --- | --- |
      | **actually fraud** | true positive (TP) - caught | false negative (FN) - missed fraud |
      | **actually genuine** | false positive (FP) - good customer blocked | true negative (TN) |

      - **Accuracy** = (TP + TN) / all rows.
      - **Precision** = TP / (TP + FP) - of the transactions we flagged, how many were fraud? Low precision
        means blocked customers and a busy review team.
      - **Recall** (sensitivity, true positive rate) = TP / (TP + FN) - of the fraud, how much did we catch? Low
        recall means losses and chargebacks.
      - **F1** = 2 x precision x recall / (precision + recall) - the harmonic mean, high only when both are.
        scikit-learn's `fbeta_score` weights recall beta times as much as precision.
      - **False positive rate** = FP / (FP + TN) - the share of genuine transactions flagged; with 99% genuine
        traffic even a small rate is many customers.

      scikit-learn's `confusion_matrix(y_true, y_pred)` puts **true labels in rows and predictions in columns**,
      sorted by label - so for 0/1 labels the layout is `[[TN, FP], [FN, TP]]`, and `.ravel()` gives
      `tn, fp, fn, tp`. Getting this order wrong is a classic interview slip.

      A classifier such as logistic regression outputs a **score** (here a probability); `predict` applies a
      **threshold** of 0.5. On rare classes 0.5 is rarely the right threshold - it is a business choice
      between the cost of missed fraud and the cost of blocked customers, and you make it on validation data.

  - id: metrics-run
    kind: code
    concepts: [classification-and-regression-metrics]
    title: "Real output: accuracy lies, the threshold decides"
    body: |
      ```python
      from sklearn.model_selection import train_test_split
      from sklearn.pipeline import make_pipeline
      from sklearn.preprocessing import StandardScaler
      from sklearn.linear_model import LogisticRegression
      from sklearn.dummy import DummyClassifier
      from sklearn.metrics import (accuracy_score, confusion_matrix, precision_score, recall_score, f1_score,
                                   roc_auc_score, average_precision_score)
      from data import make_transactions

      df = make_transactions()
      X = df.drop(columns="fraud").to_numpy(); y = df.fraud.to_numpy()
      X_tr, X_te, y_tr, y_te = train_test_split(X, y, test_size=0.25, stratify=y, random_state=0)

      dummy = DummyClassifier(strategy="most_frequent").fit(X_tr, y_tr)
      model = make_pipeline(StandardScaler(), LogisticRegression(max_iter=1000)).fit(X_tr, y_tr)
      pred = model.predict(X_te)                    # threshold 0.5
      score = model.predict_proba(X_te)[:, 1]       # fraud probability
      for t in [0.5, 0.2, 0.1, 0.05, 0.02]:
          p = (score >= t).astype(int)
          tn, fp, fn, tp = confusion_matrix(y_te, p).ravel()
          ...
      ```

      ```plaintext
      rows: 20000  fraud rate: 0.0115
      test rows: 5000  fraud in test: 57
      always 'not fraud' accuracy: 0.9886
      always 'not fraud' recall:   0.0
      model accuracy: 0.9888
      confusion matrix at 0.5:
       [[4943    0]
       [  56    1]]
      precision 1.0 recall 0.018 f1 0.034
      threshold 0.5   tp=1   fp=0     fn=56  tn=4943  precision=1.000 recall=0.018
      threshold 0.2   tp=2   fp=3     fn=55  tn=4940  precision=0.400 recall=0.035
      threshold 0.1   tp=8   fp=28    fn=49  tn=4915  precision=0.222 recall=0.140
      threshold 0.05  tp=11  fp=122   fn=46  tn=4821  precision=0.083 recall=0.193
      threshold 0.02  tp=29  fp=667   fn=28  tn=4276  precision=0.042 recall=0.509
      ```

      Read it carefully:

      - The **dummy that never says fraud scores 0.9886 accuracy**; the trained model scores 0.9888. Accuracy
        cannot tell them apart, because 98.86% of the test rows are genuine.
      - At the default threshold the model flags **one** transaction (precision 1.0 - a perfect but useless
        number) and misses 56 of 57 frauds.
      - Lowering the threshold buys recall with precision. To catch about half the fraud (0.02) SandPay would
        review 696 transactions to find 29 frauds - one in 24. Whether that is worth it depends on the cost of
        a review against the average fraud loss; the metric can't decide it for you.
      - Precision 1.0 from 1 flagged row is noise: always report the **counts** behind a ratio on rare classes.

  - id: ranking-metrics
    kind: internals
    concepts: [classification-and-regression-metrics]
    title: ROC-AUC versus average precision on imbalanced data
    body: |
      Threshold metrics judge one operating point. **Ranking metrics** judge the scores over every threshold.

      - The **ROC curve** plots recall (true positive rate) against the false positive rate as the threshold
        moves. Its area, **ROC-AUC**, equals the probability that a randomly chosen fraud row scores higher than
        a randomly chosen genuine row (ties count half). Random scores give 0.5 *whatever the class balance*.
      - The **precision-recall curve** plots precision against recall. scikit-learn's `average_precision_score`
        summarises it as `AP = sum_n (R_n - R_(n-1)) P_n` over the thresholds - a step-wise area with no
        interpolation (the documentation warns that linear interpolation, as `auc` does with the trapezoidal
        rule, "provides an overly-optimistic measure"). "With random predictions, the AP is the fraction of
        positive samples."

      The same model on the same 5000 test rows, plus random scores for comparison:

      ```plaintext
      ROC-AUC: 0.779
      average precision (PR-AUC): 0.089
      random scores ROC-AUC: 0.487  AP: 0.012  prevalence: 0.0114
      ```

      ROC-AUC 0.779 sounds respectable. Average precision 0.089 says the same model, more honestly: across the
      thresholds, fewer than one flagged row in ten is fraud. Both are *right* - they answer different
      questions. ROC-AUC's false positive rate divides by 4943 genuine rows, so 667 false alarms are "only"
      13%; precision divides by what you flagged, which is what the review team feels.

      Practical rules:

      - On rare positives, report **average precision** (and its baseline, the positive rate - 0.0114 here)
        alongside ROC-AUC, and the precision and recall at the threshold you will actually use.
      - Compare AP only between data sets with the **same** positive rate; it moves with the base rate, ROC-AUC
        does not.
      - Both measure ranking, not calibration: a model whose probabilities are all ten times too high has the
        same AUC and AP. If you need probabilities you can trust (to price risk, or to set a threshold in money),
        check calibration too.

  - id: regression-metrics
    kind: internals
    concepts: [classification-and-regression-metrics]
    title: Regression metrics and the baseline
    body: |
      For a numeric target - here, settlement delay in hours:

      - **MAE** (mean absolute error) - the average miss, in hours. Robust to a few large errors; easy to
        explain.
      - **RMSE** (root mean squared error) - also in hours, but squaring punishes large misses more. RMSE >= MAE
        always; a big gap means a few big misses. scikit-learn 1.9 has `root_mean_squared_error`.
      - **R squared** (`r2_score`) - 1 - (sum of squared errors / sum of squared deviations from the mean of the
        *evaluation* targets). 1 is perfect, 0 is as good as predicting that mean, and **it can be negative**:
        a model can be worse than a constant.

      From the settlement-delay data (15 training points, 500 validation points; next section):

      ```plaintext
      degree 3   MAE 0.65  RMSE 0.83  R2 0.916
      degree 12  MAE 1.29  RMSE 3.19  R2 -0.240
      mean       MAE 2.62  RMSE 3.11  R2 -0.177
      ```

      The overfitted degree-12 polynomial has a **negative R squared**: on new data it is worse than always
      predicting the training mean. Even the "mean" baseline scores below 0 here, because it uses the
      *training* mean, not the validation mean that R squared compares against. Always print a baseline next to
      a model - `DummyRegressor` and `DummyClassifier` exist for exactly that.

  - id: bias-variance
    kind: internals
    concepts: [bias-variance-and-fit]
    title: Underfitting, overfitting, bias and variance
    body: |
      Fit polynomials of increasing degree to 15 noisy points of a smooth curve and score them on 500 new points
      from the same curve:

      ```plaintext
      degree  train RMSE  validation RMSE
           1        1.53             2.41
           3        0.52             0.83
           9        0.44             2.36
          12        0.43             3.19
      ```

      - **Degree 1 - underfitting.** A straight line cannot follow a wave: training and validation error are
        both high. The model has high **bias** - it is systematically wrong, and more data wouldn't help.
      - **Degree 3 - about right.** Both errors are low and close together (the noise in the data is 0.8, so
        about 0.8 is the best any model can do).
      - **Degrees 9 and 12 - overfitting.** Training error keeps falling, validation error explodes. The model
        has high **variance** - fitted to a different 15 points it would be a very different curve.

      ISLR (equation 2.7) makes this precise for squared error at a point x0: the expected test error is
      **Var(f_hat(x0)) + [Bias(f_hat(x0))] squared + Var(epsilon)** - the variance of the fitted model across
      training sets, its squared bias, and the **irreducible error** of the noise. Because both of the first
      two are non-negative, "the expected test MSE can never lie below Var(epsilon)". More flexible models lower
      bias and raise variance; the best test error sits in between. (Very large models trained in particular
      ways - modern neural networks - can behave differently in places; [Training deep
      networks](#/lesson/training-deep-networks) returns to that.)

      **Diagnosis from two numbers**, as scikit-learn's guide puts it: "If the training score and the validation
      score are both low, the estimator will be underfitting. If the training score is high and the validation
      score is low, the estimator is overfitting and otherwise it is working very well."

      | Symptom | Diagnosis | Try |
      | --- | --- | --- |
      | train bad, validation bad | high bias - underfitting | more features, a more flexible model, less regularisation |
      | train good, validation much worse | high variance - overfitting | more data, fewer features, a simpler model, more regularisation |
      | train good, validation good, test bad | leakage or a distribution shift between the sets | check the split and the features |

  - id: curves
    kind: internals
    concepts: [bias-variance-and-fit]
    title: Validation curves and learning curves
    body: |
      A **validation curve** varies one hyperparameter and plots training and validation score. Here it is for
      logistic regression's `C` on the fraud data, scored with average precision over 5 stratified folds
      (`validation_curve(..., param_name="logisticregression__C", scoring="average_precision")`):

      ```plaintext
      C        train AP  validation AP
      0.0001   0.068     0.078
      0.001    0.070     0.080
      0.01     0.083     0.092
      0.1      0.089     0.099
      1        0.090     0.099
      10       0.090     0.099
      ```

      Training and validation scores move together and level off by C = 0.1: this six-feature linear model is
      **not overfitting** - it is limited by bias. Less regularisation stops helping, so the next step is better
      features or a more flexible model, not tuning C. (Validation AP is slightly above training AP here
      because each validation fold is small and noisy, not because the model "prefers" unseen data; it would
      reverse with a different seed.)

      A **learning curve** varies the amount of training data. scikit-learn: it shows "how much we benefit from
      adding more training data and whether the estimator suffers more from a variance error or a bias error".
      Here a more flexible model - all degree-2 feature products - on growing training sets:

      ```plaintext
      train size  train AP  validation AP
             800  0.434     0.061
            1600  0.218     0.060
            4000  0.189     0.070
            8000  0.139     0.069
           16000  0.105     0.088
      ```

      With 800 rows (about 9 fraud rows) the model memorises its fraud (train AP 0.434) and fails on new
      data (0.061): a huge variance gap. As data grows the gap closes from both sides. The curves have **not**
      met at 16000 rows, so more labelled fraud would still help this model; if they had converged at a low
      score, more data would be wasted and only a better model or features could help.

  - id: curves-code
    kind: code
    concepts: [bias-variance-and-fit, l1-l2-regularisation]
    title: The overfitting and curve experiments
    collapsed: true
    body: |
      ```python
      import numpy as np
      from sklearn.pipeline import make_pipeline
      from sklearn.preprocessing import PolynomialFeatures, StandardScaler
      from sklearn.linear_model import LinearRegression, Ridge, LogisticRegression
      from sklearn.model_selection import validation_curve, learning_curve, StratifiedKFold
      from sklearn.metrics import mean_absolute_error, root_mean_squared_error, r2_score
      from data import make_transactions

      def sample(n, rng):
          """Settlement delay in hours against batch size (synthetic): a smooth curve plus noise."""
          x = rng.uniform(0, 1, n)
          return x.reshape(-1, 1), 6 + 4 * np.sin(2 * np.pi * x) + rng.normal(0, 0.8, n)

      rng = np.random.default_rng(0)
      X_tr, y_tr = sample(15, rng)      # a small training set
      X_va, y_va = sample(500, rng)     # a large validation set from the same distribution

      def poly(degree, regressor):
          return make_pipeline(PolynomialFeatures(degree, include_bias=False), StandardScaler(), regressor)

      for d in [1, 3, 9, 12]:
          m = poly(d, LinearRegression()).fit(X_tr, y_tr)
          print(d, root_mean_squared_error(y_tr, m.predict(X_tr)), root_mean_squared_error(y_va, m.predict(X_va)))
      for a in [1e-4, 1e-2, 1e-1, 1, 10]:
          m = poly(12, Ridge(alpha=a)).fit(X_tr, y_tr)
          print(a, root_mean_squared_error(y_tr, m.predict(X_tr)), root_mean_squared_error(y_va, m.predict(X_va)))

      df = make_transactions(); yy = df.fraud.to_numpy(); XX = df.drop(columns="fraud").to_numpy()
      cv = StratifiedKFold(5, shuffle=True, random_state=0)
      tr, va = validation_curve(make_pipeline(StandardScaler(), LogisticRegression(max_iter=2000)), XX, yy,
                                param_name="logisticregression__C", param_range=[1e-4, 1e-3, 1e-2, 1e-1, 1, 10],
                                cv=cv, scoring="average_precision")
      sizes, ltr, lva = learning_curve(
          make_pipeline(PolynomialFeatures(2), StandardScaler(), LogisticRegression(max_iter=3000)), XX, yy,
          train_sizes=[0.05, 0.1, 0.25, 0.5, 1.0], cv=cv, scoring="average_precision", shuffle=True, random_state=0)
      ```

      The printed tables in this lesson format these values to two or three decimals. The `train_sizes`
      fractions are of the training part of each fold (16000 rows), hence 800 to 16000.

  - id: regularisation
    kind: internals
    concepts: [l1-l2-regularisation]
    title: L2 (ridge) and L1 (lasso) regularisation
    body: |
      *Deep Learning* defines regularisation as "any modification we make to a learning algorithm that is
      intended to reduce its generalization error but not its training error". For linear models the classic
      modification is a **penalty on the size of the weights** added to the loss:

      - **Ridge (L2):** minimise squared error + **alpha x sum of w_j squared**. Large weights cost a lot, so
        all weights shrink towards zero - but rarely to exactly zero. scikit-learn's `Ridge(alpha=...)`;
        "the complexity parameter alpha >= 0 controls the amount of shrinkage". In neural networks the same
        idea is called **weight decay**.
      - **Lasso (L1):** minimise squared error (scaled by 1 / 2n in scikit-learn) + **alpha x sum of |w_j|**.
        The absolute value's corner at zero sets some weights **exactly** to zero - "The Lasso is a linear model
        that estimates sparse coefficients" - so it also selects features. `Lasso(alpha=...)`.
      - **Elastic net** mixes both (`ElasticNet(alpha, l1_ratio)`).
      - **Logistic regression** is penalised by default in scikit-learn (L2), and its strength is **C**, the
        *inverse*: small C = strong regularisation. The linear-model guide relates the two as `alpha = 1 / C`
        or `alpha = 1 / (n_samples * C)`, "depending on the estimator and the exact objective function".

      The penalty treats every weight alike, so features must be on comparable scales - ISLR advises applying
      ridge "after standardizing the predictors". That is why every model here starts with `StandardScaler`.
      The intercept is not penalised.

      Ridge rescues the degree-12 polynomial from the previous section (same 15 training points):

      ```plaintext
      alpha   train RMSE  validation RMSE
      0.0001        0.49             0.96
      0.01          0.56             0.91
      0.1           0.84             1.59
      1             1.07             1.95
      10            1.35             2.23
      ```

      Unregularised it had validation RMSE 3.19. A small alpha accepts a slightly worse training fit (0.43 to
      0.56) for a far better validation fit (3.19 to 0.91) - exactly the definition. Too much alpha
      underfits. Choose alpha by validation or cross-validation (`RidgeCV`, `LassoCV`, `GridSearchCV`), never on
      the test set.

      Lasso versus ridge on 20 features of which only 3 matter (true weights 3.0, -2.0 and 1.5 on features 0, 3
      and 7; first eight coefficients shown):

      ```plaintext
      OLS   [ 3.12  0.    0.11 -2.04  0.04  0.09  0.07  1.55] zeros: 0
      Ridge [ 3.03 -0.01  0.12 -1.96  0.03  0.09  0.07  1.49] zeros: 0
      Lasso [ 3.02  0.    0.03 -1.91  0.    0.    0.    1.44] zeros: 15
      ```

      (The `0.` in the OLS and ridge rows is a small number rounded to two decimals; only lasso has exact
      zeros.) Ridge shrank everything a little; the lasso zeroed 15 of the 17 irrelevant weights and kept the
      three that matter. That sparsity is the reason to choose L1 - a smaller, explainable model. When features
      are strongly correlated, the lasso tends to pick one of a group somewhat arbitrarily; ridge or elastic net
      spreads the weight.

      Other regularisers you will meet later: early stopping, dropout and data augmentation (in [Training deep
      networks](#/lesson/training-deep-networks)), and limits on tree depth and leaf size (in [Decision trees,
      random forests and boosting](#/lesson/decision-trees-and-ensembles)).

  - id: steps
    kind: steps
    concepts: [holdout-splits-and-leakage, classification-and-regression-metrics, bias-variance-and-fit]
    title: An evaluation procedure you can follow
    body: |
      1. **Write down the decision the model supports** and its costs - for fraud: cost of a missed fraud,
         cost of a review, cost of a blocked customer. This picks the metric.
      2. **Choose the split from how the model will be used** - new merchants: group split; future
         transactions: time split; rare class: stratify. Split **first**.
      3. **Lock the test set away.** Write its size and positive count in the report.
      4. **Build a baseline** - `DummyClassifier`/`DummyRegressor`, or the current rule-based system.
      5. **Put all preprocessing in a pipeline** and evaluate with k-fold CV (k = 5 or 10) on the development
         set; report the mean and the spread across folds.
      6. **Diagnose** with training versus validation scores, a validation curve for the main hyperparameter
         and a learning curve. Fix bias or variance accordingly.
      7. **Choose the threshold** on validation predictions for the business target (for example "recall at
         least 0.5 with the fewest reviews").
      8. **Refit on all development data, score once on the test set**, and report the metric, its baseline,
         the counts behind it, and the threshold.
      9. **Monitor** in production - the score drifts as fraud changes, and labels arrive late.

      The spread matters. Five stratified folds of the SandPay fraud model:

      ```plaintext
      5-fold AP per fold: [0.057 0.096 0.079 0.145 0.104]  mean 0.096  std 0.029
      ```

      One fold says 0.057, another 0.145. A single split could have given either - two models whose means
      differ by less than this spread are not clearly different.

  - id: example
    kind: example
    concepts: [holdout-splits-and-leakage, classification-and-regression-metrics]
    title: "Example: reviewing a data scientist's fraud model report"
    body: |
      A pull request for SandPay's risk service claims: *"New fraud model: 99.1% accuracy, ROC-AUC 0.97 on the
      test set. Ready to ship."* The notebook attached shows:

      - `StandardScaler().fit_transform(X)` and `SelectKBest(...).fit(X, y)` **before** `train_test_split`.
      - A random `train_test_split` on 18 months of transactions, without `stratify`.
      - Features include `chargeback_count_90d` - computed in the nightly batch, including chargebacks filed
        after the transaction.
      - Seven model types compared; the one with the best test ROC-AUC is reported.

      What a reviewer with a tester's mindset checks and asks for:

      1. **Leakage in preprocessing** - refit the scaler and selector inside a pipeline, inside the CV.
      2. **Target leakage** - `chargeback_count_90d` includes the future; rebuild it "as of" each transaction's
         timestamp, or drop it. Expect the score to fall - that is the honest number.
      3. **Time** - train on months 1-15, test on 16-18, the way the model will be used.
      4. **Selection on test** - choose among the seven by CV on the development set; score only the chosen
         one on the test set.
      5. **Metrics** - 99.1% accuracy is barely above the 98.9% of "never fraud". Ask for average precision with
         its baseline, and precision and recall at the threshold the risk team will use, with counts.
      6. **Evidence** - the notebook rerun from a clean kernel with fixed seeds, the split dates, the class
         counts per split, and the fold scores.

  - id: tests
    kind: tests
    concepts: [holdout-splits-and-leakage, classification-and-regression-metrics]
    title: Testing an evaluation pipeline
    body: |
      Evaluation code is code - and its bugs never crash, they flatter. Tests that catch them:

      | Test | Expected result | Evidence |
      | --- | --- | --- |
      | A split returns disjoint index sets that together cover every row | intersection empty, union = all rows | assertion on the indices |
      | Stratified split keeps the fraud count on every seed | same count in every test set | counts per seed |
      | Group split never shares a merchant | no merchant id on both sides | set intersection |
      | Changing only the **test** rows does not change the fitted model | identical coefficients | `coef_` compared |
      | The scaler's mean equals the **training** rows' mean | `mean_ == X_train.mean(0)` | assertion |
      | Metrics match a reference on hand-worked cases and on random data with ties | equal to `sklearn.metrics` | test output |
      | Random scores give ROC-AUC near 0.5 and AP near the positive rate | within a tolerance | test output |
      | The model beats `DummyClassifier` on the agreed metric | strictly better | report |
      | **Negative:** a feature computed from the label (or the future) is rejected | the leakage check fails | review checklist |

      The practice exercises below implement several of these - the "change only the test rows" test is a good
      one to remember: it detects *any* leakage from test into training, whatever the mechanism.

  - id: mistakes
    kind: mistakes
    concepts: [holdout-splits-and-leakage, classification-and-regression-metrics, bias-variance-and-fit, l1-l2-regularisation]
    title: Common mistakes and how to debug them
    body: |
      - **Fitting preprocessing on all the data.** Symptom: CV or test scores higher than production. Fix: a
        `Pipeline`, fitted on training rows only.
      - **Tuning on the test set.** Each look is a choice. Use CV on the development set; touch the test set
        once.
      - **Reporting accuracy on a rare class.** Compare with the "never fraud" baseline; report AP, precision
        and recall with counts.
      - **Reading `confusion_matrix` the wrong way round.** Rows are true labels, columns are predictions:
        `tn, fp, fn, tp = confusion_matrix(y, p).ravel()` for 0/1 labels.
      - **Leaving the threshold at 0.5.** It is a default, not a decision. Choose it on validation data for the
        business cost.
      - **Random splits for grouped or time data.** If the same merchant, customer or week appears on both sides,
        the score measures recognition, not prediction.
      - **One split, one number.** Report the fold spread; a difference smaller than it is noise.
      - **Regularising unscaled features.** The penalty then punishes features measured in small units. Scale
        first, in the pipeline.
      - **Confusing C and alpha.** In `LogisticRegression` and `SVC`, *smaller* C means *more* regularisation.

      **Debugging method for "too good to be true":** (1) Train on shuffled labels - if the score stays well
      above chance, something leaks. (2) Drop features one at a time - a single feature carrying most of the
      score is a target-leakage suspect. (3) Check for duplicates and shared ids across the split. (4) Re-split by
      time or group and compare.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [holdout-splits-and-leakage, classification-and-regression-metrics, l1-l2-regularisation]
    title: Trade-offs and limits
    body: |
      - **Holdout versus CV.** One validation split is cheap but noisy and wastes data; k-fold uses every row
        for validation once at k times the training cost. With millions of rows a single large holdout is
        usually enough; with a few hundred, CV (or repeated CV) is necessary. Leave-one-out CV has low bias but
        high variance and cost (ISLR chapter 5).
      - **Nested CV.** If CV is used to *choose* hyperparameters, its best score is optimistic too. An inner CV
        for choosing inside an outer CV for estimating fixes that, at a multiplied cost - or keep the separate
        test set.
      - **ROC-AUC versus AP.** ROC-AUC is insensitive to class balance - good for comparing across data sets,
        misleading about precision on rare classes. AP depends on the base rate. Report both, with the base
        rate.
      - **Single-number metrics** hide the threshold decision. A cost-weighted metric (expected loss per
        transaction) is closer to the business but needs agreed costs.
      - **L1 versus L2.** L1 gives sparse, explainable models but is unstable with correlated features; L2 is
        stable and keeps everything; elastic net sits between.
      - **Offline evaluation is not production.** Data drifts, fraudsters adapt, labels arrive weeks later. The
        test score is a forecast; monitoring is the measurement.

  - id: summary
    kind: summary
    concepts: [holdout-splits-and-leakage, classification-and-regression-metrics, bias-variance-and-fit, l1-l2-regularisation]
    title: Quick reference
    body: |
      - **Train** to fit, **validate** (or cross-validate, k = 5 or 10) to choose, **test** once to report.
      - **Split first**, then fit every step on training rows - a `Pipeline` does it. Stratify rare classes;
        group by merchant or customer; split by time for forecasts.
      - **Leakage** = information not available at prediction time used in building the model. Test: change
        only the test rows - the model must not change.
      - **Confusion matrix** (scikit-learn): rows true, columns predicted, `[[TN, FP], [FN, TP]]`.
      - **Precision** = TP / (TP + FP); **recall** = TP / (TP + FN); **F1** = harmonic mean.
      - **Threshold** is a business choice made on validation data.
      - **ROC-AUC**: random = 0.5 at any balance. **Average precision**: random = positive rate. On rare
        classes report AP, its baseline, and precision and recall with counts.
      - **MAE**, **RMSE** (punishes big misses), **R squared** (can be negative). Always beside a baseline.
      - **Underfitting**: both errors high (bias). **Overfitting**: training low, validation high (variance).
      - **Ridge (L2)** shrinks all weights; **lasso (L1)** zeroes some. Scale first; tune alpha (or C = inverse)
        by CV.

exercises:
  - id: which-split
    type: mcq
    concept: holdout-splits-and-leakage
    skill: application
    title: Which split for the merchant risk model?
    prompt: |
      SandPay wants a model that scores the risk of a **newly onboarded merchant** from its first 30 days of
      transactions. The training data has 120000 transactions from 900 merchants, with a "merchant later
      closed for fraud" label per transaction. Which cross-validation splitter gives the most honest estimate?
    options:
      - id: group
        text: GroupKFold (or StratifiedGroupKFold) with the merchant id as the group.
        feedback: Correct - the model will score merchants it has never seen, so each validation fold must contain only merchants absent from training.
      - id: stratified
        text: StratifiedKFold on the label, so every fold has the same fraud rate.
        feedback: Stratifying helps with the rare label, but rows from one merchant would land in training and validation; the model can recognise the merchant instead of learning risk, and the score will be optimistic.
      - id: kfold
        text: Plain KFold with shuffle=True - transactions are independent.
        feedback: Transactions of the same merchant share its behaviour and its label; they are not independent, which is exactly what makes a random split leak.
      - id: loo
        text: Leave-one-out, because it uses the most training data.
        feedback: Leave-one-out on rows leaves the other 130-odd rows of the same merchant in training - the same leak, at 120000 times the cost.
    correct: [group]
    hints:
      - What will the model be asked to score in production - seen merchants or new ones?
      - What does a validation fold need to look like to imitate that?
    solution: |
      **Group by merchant.** Evaluation must imitate use: the model scores *new* merchants, so every
      validation fold must hold merchants the model never saw. A row-level split lets the model learn "merchant
      482 is fraudulent" from training rows and repeat it on validation rows of the same merchant. With a rare
      label, `StratifiedGroupKFold` also balances the fraud rate across folds. If onboarding dates matter (fraud
      patterns drift), split by onboarding date as well.
    followUp: |
      The same data is used for a model that scores **each new transaction of existing merchants**. Which split
      now, and why?

  - id: scaler-leak
    type: debug
    concept: holdout-splits-and-leakage
    skill: analysis
    title: Find the leaks
    prompt: |
      This script evaluates a SandPay fraud model and reports test average precision 0.41 - far above the team's
      other models. `df` has one row per transaction with a `created_at` timestamp, a `card_id` and a
      `chargeback_within_60d` column filled in by the nightly batch. Click **every** line that leaks information
      into the evaluation.
    language: python
    code: |
      X = df.drop(columns=["fraud", "created_at"])
      y = df["fraud"]
      X = StandardScaler().fit_transform(X)
      X_tr, X_te, y_tr, y_te = train_test_split(X, y, test_size=0.2, stratify=y, random_state=0)
      best = None
      for C in [0.01, 0.1, 1, 10]:
          model = LogisticRegression(C=C, max_iter=1000).fit(X_tr, y_tr)
          ap = average_precision_score(y_te, model.predict_proba(X_te)[:, 1])
          if best is None or ap > best[0]:
              best = (ap, C)
      print("test AP", best)
    correctLines: [1, 3, 8]
    lineNotes:
      - line: 4
        note: Stratifying is right for a rare label. The split's real problem is that it happens after scaling (line 3) - and that it is random rather than by time, which is a design choice worth raising, but the line itself leaks nothing.
      - line: 7
        note: Fitting on the training rows is correct.
      - line: 2
        note: Selecting the label column is fine.
    hints:
      - Which columns would not be known at the moment a transaction is approved?
      - Which line fits something before the split?
      - Which set is used to choose C?
    solution: |
      - **Line 1** keeps `chargeback_within_60d` (and the `card_id`) as features. A chargeback is filed *after*
        fraud is discovered - target leakage. A raw `card_id` also lets the model recognise cards seen in
        training.
      - **Line 3** fits the scaler on every row before the split, so the test rows shape the training data.
      - **Line 8** chooses C by the **test** score, so the reported number is the best of four looks at the test
        set.

      Fix: drop columns not known at decision time; split first (by time); put `StandardScaler` and
      `LogisticRegression` in a pipeline; choose C with cross-validation on the training part; score the chosen
      pipeline once on the test set.

  - id: confusion-by-hand
    type: mcq
    concept: classification-and-regression-metrics
    skill: application
    title: Precision and recall from a confusion matrix
    prompt: |
      A SandPay rule engine was run on 10000 transactions containing 100 frauds. scikit-learn printed:

      ```plaintext
      [[9504  396]
       [  40   60]]
      ```

      What are the rule's precision and recall for fraud?
    options:
      - id: right
        text: Precision 60 / 456 = 0.13; recall 60 / 100 = 0.60.
        feedback: Correct - rows are true labels and columns predictions, so TP = 60, FP = 396, FN = 40.
      - id: swapped
        text: Precision 0.60; recall 0.13.
        feedback: That swaps the two. Precision divides by everything flagged (60 + 396); recall divides by all actual fraud (60 + 40).
      - id: transposed
        text: Precision 60 / 100 = 0.60; recall 60 / 456 = 0.13 - columns are the true labels.
        feedback: scikit-learn's confusion_matrix puts true labels in rows and predictions in columns. Reading it transposed swaps FP and FN.
      - id: accuracy
        text: Both about 0.96, the accuracy.
        feedback: Accuracy is (9504 + 60) / 10000 = 0.956, but it is dominated by the genuine rows; precision and recall look only at fraud.
    correct: [right]
    hints:
      - In scikit-learn's layout, which cell is a missed fraud?
      - Precision's denominator is what the rule flagged; recall's is what was fraud.
    solution: |
      Layout `[[TN, FP], [FN, TP]]`: TN 9504, FP 396, FN 40, TP 60. **Precision** = 60 / (60 + 396) = 0.132 -
      only about one flagged transaction in eight is fraud. **Recall** = 60 / (60 + 40) = 0.60. F1 = 2 x 0.132 x
      0.60 / 0.732 = 0.216. Accuracy 0.956 is below the 0.99 of "never fraud".

  - id: auc-vs-ap
    type: mcq
    concept: classification-and-regression-metrics
    skill: analysis
    title: "\"Our ROC-AUC is 0.95, so precision must be high\""
    prompt: |
      A new SandPay fraud model has ROC-AUC 0.95 on a test set with 0.2% fraud. The product manager concludes
      that most transactions it flags will be fraud. What is the best response?
    options:
      - id: ap
        text: ROC-AUC says nothing direct about precision at this base rate - check average precision (baseline 0.002) and the precision at the threshold you'll use.
        feedback: Correct - ROC-AUC uses the false positive rate, which divides by the huge genuine class; a 2% false positive rate on 99.8% genuine traffic can still swamp the true frauds.
      - id: agree
        text: Agree - 0.95 means 95% of flagged transactions are fraud.
        feedback: ROC-AUC is a ranking probability (a random fraud outranks a random genuine row 95% of the time), not a precision.
      - id: accuracy
        text: Report accuracy instead; it is easier to explain.
        feedback: With 99.8% genuine rows, accuracy is even less informative - "never fraud" scores 0.998.
      - id: retrain
        text: The AUC is too high to be real; the model must be leaking.
        feedback: A very high AUC deserves a leakage check, but it is perfectly possible honestly; the immediate error is reading it as precision.
    correct: [ap]
    hints:
      - What does the ROC curve's x-axis divide by?
      - With 2 frauds per 1000 rows, how many false alarms does a 2% false positive rate produce?
    solution: |
      Out of 1000 transactions, 2 are fraud and 998 genuine. Even catching both frauds at a 2% false positive
      rate flags about 20 genuine ones: precision about 2 / 22 = 0.09, while the ROC curve can still look
      excellent. Average precision, whose random baseline is the 0.002 base rate, and precision and recall at the
      chosen threshold (with counts) show what the review team will experience.

  - id: metrics-code
    type: coding
    concept: classification-and-regression-metrics
    skill: application
    title: Classification metrics from first principles
    prompt: |
      In `metrics.py`, implement with NumPy only: `confusion_counts`, `precision_recall_f1` (0.0 for an undefined
      ratio, as scikit-learn's `zero_division=0`), `roc_auc` (the probability that a fraud row outscores a
      genuine one, ties counting half), `average_precision` (scikit-learn's step-wise definition, every distinct
      score a threshold), and `threshold_for_recall` (the highest threshold whose recall meets a target). The
      tests compare your numbers with `sklearn.metrics`, including data with tied scores.
    project: ai
    files:
      - exercises/ml_foundations/metrics.py
    test: tests/ml_foundations/test_metrics.py
    command: .venv/bin/python -m pytest tests/ml_foundations/test_metrics.py
    hints:
      - Convert both label arrays to booleans; then TP is np.sum(t & p), FP is np.sum(~t & p), and so on.
      - "For ROC-AUC, compare every fraud score with every genuine score: pos[:, None] - neg[None, :] gives the whole matrix of differences."
      - "For AP, walk np.unique(scores)[::-1] (highest first): at each threshold compute precision and recall of score >= threshold, and add (recall - previous recall) * precision."
      - threshold_for_recall walks the same thresholds and returns the first (highest) one whose recall reaches the target.
    modelAnswer: |
      ```python
      def roc_auc(y_true, scores) -> float:
          t = np.asarray(y_true).astype(bool)
          s = np.asarray(scores, dtype=float)
          pos, neg = s[t], s[~t]
          if len(pos) == 0 or len(neg) == 0:
              raise ValueError("ROC AUC needs both classes in y_true")
          diff = pos[:, None] - neg[None, :]
          wins = np.sum(diff > 0) + 0.5 * np.sum(diff == 0)
          return float(wins / (len(pos) * len(neg)))


      def average_precision(y_true, scores) -> float:
          t = np.asarray(y_true).astype(bool)
          s = np.asarray(scores, dtype=float)
          total_pos = int(t.sum())
          if total_pos == 0:
              raise ValueError("average precision needs at least one positive")
          ap, prev_recall = 0.0, 0.0
          for threshold in np.unique(s)[::-1]:
              flagged = s >= threshold
              tp = int(np.sum(flagged & t))
              precision = tp / int(flagged.sum())
              recall = tp / total_pos
              ap += (recall - prev_recall) * precision
              prev_recall = recall
          return float(ap)
      ```

      ROC-AUC is computed as what it *means* - the share of (fraud, genuine) pairs ranked correctly - which is
      the Mann-Whitney statistic; the pairwise matrix is fine for test-sized data (sorting and ranks scale to
      millions). AP uses each distinct score once, so tied rows enter together, exactly as scikit-learn's curve
      does. The full solution, with the confusion counts and the threshold search, is in
      `solutions/ml_foundations/metrics.py`.
    solution: |
      Count TP, FP, FN and TN with boolean masks; build precision, recall and F1 with a guard for zero
      denominators; compute ROC-AUC as the fraction of fraud-genuine pairs ranked correctly (ties half);
      compute AP by walking distinct thresholds from the top and summing recall steps times precision; and
      return the first threshold from the top whose recall meets the target.
    rubric:
      - Every test in tests/ml_foundations/test_metrics.py passes.
      - No sklearn.metrics in metrics.py - only NumPy.
      - Zero denominators give 0.0, not a warning or NaN.
      - Tied scores are handled as one threshold (AP) and as half a win (ROC-AUC).
      - You can explain why random scores give AUC near 0.5 but AP near the fraud rate.
    followUp: |
      Add `precision_at_k(y_true, scores, k)` - the precision among the k highest-scoring rows, the number a
      review team with capacity for k cases a day cares about. How should it treat ties at the k-th score?

  - id: pick-threshold
    type: short
    concept: classification-and-regression-metrics
    skill: application
    title: Choose the operating threshold
    prompt: |
      Using the real threshold table from this lesson (5000 test rows, 57 frauds), SandPay's risk team says: a
      review costs 2 currency units, a missed fraud costs on average 120, and the team can review at most 200
      transactions per 5000. Which of the thresholds 0.2, 0.1, 0.05 and 0.02 do you recommend, and what else
      would you do before shipping it?
    modelAnswer: |
      Cost per 5000 rows = 2 x (TP + FP) + 120 x FN:

      - 0.2: 2 x 5 + 120 x 55 = 6610
      - 0.1: 2 x 36 + 120 x 49 = 5952
      - 0.05: 2 x 133 + 120 x 46 = 5786
      - 0.02: 2 x 696 + 120 x 28 = 4752 - but 696 reviews exceed the capacity of 200.

      Within capacity, **0.05** is cheapest (133 reviews, 11 frauds caught). 0.02 would be cheaper still, so the
      capacity limit is costing money - worth telling the business. Before shipping: choose the threshold on
      **validation** predictions (cross-validated), not on this test set, then confirm once on the test set;
      check the counts are not too small to trust (11 frauds); and plan monitoring, because the score
      distribution drifts and the threshold with it.
    rubric:
      - Computes a cost per threshold from the counts, with reviews = TP + FP.
      - Applies the capacity limit and names 0.05.
      - Points out that 0.02 is cheaper but over capacity.
      - Says the threshold must be chosen on validation data, not the test set, and monitored.
    hints:
      - Reviews are every flagged row - true and false positives.
      - Work out the cost of each threshold, then remove the ones the team can't staff.
    solution: |
      Cost = 2 x flagged + 120 x missed. Within 200 reviews, threshold 0.05 costs 5786 against 5952 at 0.1 and
      6610 at 0.2; 0.02 costs 4752 but needs 696 reviews. Recommend 0.05, flag the capacity trade-off, and choose
      it on validation data before a single confirmation on the test set.

  - id: diagnose-curves
    type: mcq
    concept: bias-variance-and-fit
    skill: analysis
    title: Read the learning curve
    prompt: |
      A model predicting SandPay settlement delay gives these RMSE values (hours) with 5-fold CV:

      ```plaintext
      train size   train RMSE   validation RMSE
           1000        2.9          3.1
           4000        3.0          3.1
          16000        3.0          3.0
      ```

      A baseline that predicts the mean has RMSE 3.4. What should the team do next?
    options:
      - id: bias
        text: Add informative features or use a more flexible model - the curves have converged at a high error, so this is bias.
        feedback: Correct - training and validation errors are equal and both poor; more data or more regularisation can't lower the training error.
      - id: data
        text: Collect four times more data.
        feedback: The curves already met at 4000 rows and stopped improving; the learning curve says more data will not help this model.
      - id: regularise
        text: Increase regularisation to reduce overfitting.
        feedback: There is no overfitting - no gap between training and validation. More regularisation would raise both errors.
      - id: done
        text: Ship it - training and validation agree, so the model generalises.
        feedback: It generalises its mediocrity; it barely beats the mean baseline (3.0 against 3.4).
    correct: [bias]
    hints:
      - Is there a gap between the two curves?
      - Compare the error level with the baseline.
    solution: |
      No gap means low variance; a training error close to the baseline means high bias. More data and more
      regularisation target variance and won't help. The fix is a better hypothesis: features that explain
      delay (bank, cut-off time, weekday, currency), interactions, or a more flexible model such as gradient
      boosting - then re-check the curves.

  - id: bias-variance-order
    type: order
    concept: bias-variance-and-fit
    skill: recall
    title: From underfitting to overfitting
    prompt: |
      Order these polynomial models of the settlement-delay data from **highest bias** to **highest variance**,
      using the real results (train RMSE / validation RMSE).
    items:
      - id: d1
        text: Degree 1 - 1.53 / 2.41
      - id: d3
        text: Degree 3 - 0.52 / 0.83
      - id: d9
        text: Degree 9 - 0.44 / 2.36
      - id: d12
        text: Degree 12 - 0.43 / 3.19
    hints:
      - Bias shows in the training error; variance in the gap between training and validation.
    solution: |
      **Degree 1, 3, 9, 12.** Training error falls at every step (1.53, 0.52, 0.44, 0.43) - less bias. From
      degree 3 upwards the gap to validation error grows (0.31, 1.92, 2.76) - more variance. Degree 1's gap
      (0.88) is not variance: a straight line is wrong everywhere, and with only 15 training points its
      training error happens to be lower than on new data. Its high *training* error is what marks it as bias.
      Degree 3 has the lowest validation error - the balance point.

  - id: splits-code
    type: coding
    concept: holdout-splits-and-leakage
    skill: application
    title: Honest splits and a leak-free fit
    prompt: |
      In `splits.py`, implement `stratified_split` (every class keeps its share in the test set) and
      `group_split` (whole merchants go to one side), both returning sorted index arrays and repeatable for a
      seed. Then fix `fit_and_score`: a colleague's draft is there, it runs and reports plausible scores - but
      the tests show it is not an honest evaluation. One test changes only the test rows and checks that the
      fitted model does not change.
    project: ai
    files:
      - exercises/ml_foundations/splits.py
    test: tests/ml_foundations/test_splits.py
    command: .venv/bin/python -m pytest tests/ml_foundations/test_splits.py
    hints:
      - "For stratified_split, loop over np.unique(y): take the rows of that class, shuffle them with rng.permutation and keep the first round(n * test_fraction)."
      - "np.setdiff1d(np.arange(len(y)), test_idx) gives the training indices, already sorted."
      - "For group_split, shuffle np.unique(groups), choose the test groups, then use np.isin(groups, test_groups)."
      - In fit_and_score, what data does the scaler's fit see? A Pipeline fitted on X_train alone fits the scaler and the model on training rows only.
    modelAnswer: |
      ```python
      def stratified_split(y, test_fraction, seed):
          _check_fraction(test_fraction)
          y = np.asarray(y)
          rng = np.random.default_rng(seed)
          test = []
          for label in np.unique(y):
              rows = np.flatnonzero(y == label)
              n_test = round(len(rows) * test_fraction)
              test.append(rng.permutation(rows)[:n_test])
          test_idx = np.sort(np.concatenate(test))
          return np.setdiff1d(np.arange(len(y)), test_idx), test_idx


      def fit_and_score(X_train, y_train, X_test, y_test, C=1.0):
          model = Pipeline([("scale", StandardScaler()), ("clf", LogisticRegression(C=C, max_iter=1000))])
          model.fit(X_train, y_train)   # the scaler's mean and scale come from training rows only
          return {
              "model": model,
              "train_ap": float(average_precision_score(y_train, model.predict_proba(X_train)[:, 1])),
              "test_ap": float(average_precision_score(y_test, model.predict_proba(X_test)[:, 1])),
          }
      ```

      The draft fitted the scaler on `np.vstack([X_train, X_test])` - "more data for better statistics" - so the
      test rows' mean and spread shaped the training features. In the test data the rows have drifted, which
      makes the effect visible: the coefficients change when only the test rows change. Fitting the whole
      pipeline on the training rows removes the dependence. `group_split` shuffles the distinct groups and uses
      `np.isin`; see `solutions/ml_foundations/splits.py`.
    solution: |
      Stratify by shuffling each class's rows separately and taking round(n x fraction) of each; split groups by
      shuffling the distinct group ids; and fit a StandardScaler + LogisticRegression pipeline on the training
      rows only, so nothing about the test rows reaches the model.
    rubric:
      - Every test in tests/ml_foundations/test_splits.py passes.
      - All randomness comes from np.random.default_rng(seed).
      - You can say in one sentence why the draft's scaler is leakage even though its scores looked fine.
      - fit_and_score returns the fitted Pipeline, so the same preprocessing is applied in production.
    followUp: |
      Write `time_split(timestamps, cutoff)` - everything strictly before the cut-off for training, the rest for
      testing - and a test that fails if any training timestamp is later than a test timestamp.

  - id: ridge-lasso
    type: mcq
    concept: l1-l2-regularisation
    skill: application
    title: Ridge or lasso?
    prompt: |
      SandPay's compliance team wants a fraud-loss regression model that uses **as few of the 300 candidate
      features as possible**, so each one can be explained to the regulator. Which approach fits best?
    options:
      - id: lasso
        text: The lasso (L1), with alpha chosen by cross-validation on standardised features.
        feedback: Correct - the L1 penalty sets many coefficients exactly to zero, giving a sparse model; CV picks how sparse.
      - id: ridge
        text: Ridge (L2) with a large alpha, so all coefficients become small.
        feedback: Ridge shrinks every coefficient but almost never to exactly zero - all 300 features stay in the model.
      - id: ols
        text: Ordinary least squares, then drop the features with small coefficients.
        feedback: Unscaled coefficient size is not importance, and with 300 features OLS overfits; dropping by eye is selection on noise.
      - id: no-scale
        text: The lasso on the raw, unscaled features, so the coefficients stay in business units.
        feedback: The penalty treats every coefficient alike; without scaling, features measured in large units are penalised less and selection depends on units, not relevance.
    correct: [lasso]
    hints:
      - Which penalty produces coefficients that are exactly zero?
      - What must you do to the features before any penalty?
    solution: |
      **Lasso with CV-chosen alpha on standardised features** (`make_pipeline(StandardScaler(), LassoCV())`).
      The L1 penalty yields sparse coefficients - in this lesson it zeroed 15 of 17 irrelevant ones. If
      features are strongly correlated, the lasso may pick one of a group arbitrarily; elastic net or checking
      stability across folds helps.
    followUp: |
      The lasso picks `amount_eur` in some folds and `amount_usd` (the same amount converted) in others. What is
      happening, and what would you do?

  - id: c-direction
    type: mcq
    concept: l1-l2-regularisation
    skill: recall
    title: Which way does C go?
    prompt: |
      A `LogisticRegression` fraud model overfits: training average precision 0.62, validation 0.21. Which
      change adds regularisation?
    options:
      - id: smaller-c
        text: Decrease C, for example from 1.0 to 0.1.
        feedback: Correct - C is the inverse of regularisation strength; smaller C means a stronger penalty.
      - id: larger-c
        text: Increase C, for example from 1.0 to 10.
        feedback: That weakens the penalty and would overfit more. C works the opposite way to Ridge's alpha.
      - id: max-iter
        text: Increase max_iter.
        feedback: max_iter only lets the optimiser run longer; it doesn't change the penalty.
      - id: remove-scaler
        text: Remove the StandardScaler.
        feedback: Scaling doesn't regularise; removing it makes the penalty uneven across features.
    correct: [smaller-c]
    hints:
      - Is C a strength or an inverse strength?
    solution: |
      **Decrease C.** In scikit-learn's `LogisticRegression` (and `SVC`), C is the inverse of the regularisation
      strength. Choose it with a validation curve or `LogisticRegressionCV`, scored with average precision on
      stratified folds.

  - id: eval-plan
    type: testdesign
    concept: holdout-splits-and-leakage
    skill: application
    title: An evaluation plan for a chargeback-prediction model
    prompt: |
      SandPay will predict, at authorisation time, whether a card transaction will end in a **chargeback**
      (0.4% of transactions). Data: 24 months of transactions with merchant, card and customer ids; chargebacks
      arrive up to 120 days after the transaction. Design the evaluation: splits, leakage checks, metrics,
      baseline and the evidence you would keep.
    hints:
      - When is a label final - and what does that mean for the most recent months?
      - Which features could include information from after authorisation?
    modelAnswer: |
      **Labels:** a transaction's label is only final 120 days later, so drop (or hold aside) the last 4 months
      from training and testing - otherwise recent rows are "genuine" only because their chargeback hasn't
      arrived.

      **Splits:** by time - train on months 1-16, validate with time-ordered CV inside them, test on months 17-20.
      Check the overlap of card and customer ids between train and test and report it; if the model must handle
      new customers, also evaluate on test rows of unseen customers only. Stratification is implicit in large
      time windows - report the chargeback count in each.

      **Leakage checks:** every feature computed "as of" authorisation time (no 90-day aggregates that include
      later transactions, no dispute or refund columns); the pipeline fits all preprocessing on training months
      only; a shuffled-label run scores at chance; the "change only test rows" check leaves the model
      unchanged.

      **Metrics:** average precision with its 0.004 baseline, ROC-AUC, and precision and recall with counts at
      the threshold chosen on validation data for the agreed cost of a decline versus a chargeback; monthly AP
      on the test months to see drift.

      **Baseline:** the current rule set and a `DummyClassifier`.

      **Evidence:** split dates and counts, fold scores with spread, the threshold table, the feature list with
      the timestamp each is computed from, and the notebook rerun from a clean environment with fixed seeds.
    solution: |
      Remove immature labels, split by time with time-ordered CV inside training, audit every feature for
      after-the-fact information, fit preprocessing on training months only, report AP with its base rate and
      precision and recall at a validated threshold against the current rules, and keep split counts, fold
      scores and the feature timing audit as evidence.
    rubric:
      - Handles label delay (the last 120 days are not yet labelled).
      - Uses a time-based split and explains why a random one leaks.
      - Lists concrete leakage checks, including feature timing and preprocessing inside the pipeline.
      - Chooses AP and threshold metrics with counts and a baseline, not accuracy.
      - Names the evidence to keep.

  - id: interview-overfit
    type: interview
    concept: bias-variance-and-fit
    skill: analysis
    title: "\"Your model is 99% accurate in training and 70% in production. What happened?\""
    prompt: |
      An interviewer for an ML engineering role asks: "A colleague's classifier had 99% accuracy in training and
      in their offline test, but about 70% once it was deployed. Walk me through how you would investigate."
    modelAnswer: |
      First, three separate questions: is the offline evaluation honest, has the data changed, and is the metric
      right?

      **Evaluation honesty.** 99% offline suggests leakage before it suggests a great model. I'd check that the
      split happened before any preprocessing and that everything was fitted in a pipeline; look for target
      leakage - features that are only known after the outcome, like a status column updated later; check for
      duplicates and shared entities (same customer on both sides); and whether the test set was used to choose
      the model. A quick test: retrain on shuffled labels - if the score stays high, something leaks.

      **Overfitting.** If training is 99% and an honest validation score is much lower, it's variance: I'd plot
      learning and validation curves, and try regularisation, simpler models or more data.

      **Shift.** Compare production inputs with the training distribution - feature by feature - and check for
      training-serving skew, where a feature is computed differently online than in the batch that built the
      training set. Time-based splits offline would have shown whether performance decays over time.

      **Metric.** "Accuracy" on an imbalanced problem can be meaningless, and production "accuracy" may be
      measured on labels that arrive late or differently. I'd agree the metric and baseline, look at precision
      and recall per class, and then fix the evaluation before touching the model.
    rubric:
      - Separates leakage, overfitting and distribution shift, and suspects leakage first at 99%.
      - Names concrete leakage mechanisms (preprocessing, target leakage, duplicates, test reuse) and a check for them.
      - Uses learning and validation curves to diagnose variance.
      - Mentions training-serving skew and time-based evaluation.
      - Questions the metric and the production labels.
    followUps:
      - How would you design the offline evaluation so this can't happen again?
      - The shuffled-label run scores 0.93. What do you look at next?
      - How would you monitor this model in production when labels arrive weeks late?
    hints:
      - Start by asking whether the 99% could ever have been true.
      - Then consider what changes between the notebook and production.
    solution: |
      Investigate in order: an honest offline evaluation (leakage via preprocessing, target leakage, duplicates,
      shared entities, test reuse - checked with a shuffled-label run), overfitting (learning and validation
      curves), distribution shift and training-serving skew (compare feature distributions, split by time), and
      the metric itself (imbalance, late labels). Fix the evaluation before the model.

placement:
  - id: place-leak
    type: mcq
    concept: holdout-splits-and-leakage
    skill: application
    title: Spot the honest evaluation
    prompt: |
      Which of these evaluations of a SandPay fraud model gives an honest estimate for **future transactions of
      known merchants**?
    options:
      - id: honest
        text: Split by date; fit a pipeline (imputer, scaler, model) on the earlier rows with time-ordered CV to choose hyperparameters; score once on the later rows.
        feedback: Correct - every fitted step sees only the past, choices are made by CV, and the test rows are used once.
      - id: impute-all
        text: Impute missing values with the mean of all rows, then a random stratified split and 5-fold CV.
        feedback: The imputer's means include the test rows, and a random split mixes future rows into training for a model that must predict the future.
      - id: best-test
        text: Split by date, train ten models on the earlier rows and report the best score on the later rows.
        feedback: Choosing the best of ten by the test score makes the test set a validation set; the reported number is optimistic.
      - id: train-score
        text: Fit on all rows and report the training score, since more data gives a better model.
        feedback: A training score measures fit, not generalisation; a flexible model can score perfectly on rows it memorised.
    correct: [honest]
    hints:
      - Which option keeps every fitted step and every choice away from the test rows - and respects time?
    solution: |
      The date split with a pipeline and time-ordered CV is the only one where no fitted statistic and no choice
      depends on the evaluation rows, and where the model predicts the future from the past, as in production.

  - id: place-metric
    type: mcq
    concept: classification-and-regression-metrics
    skill: analysis
    title: Two numbers, one model
    prompt: |
      On a test set with 1% fraud, a model scores ROC-AUC 0.90 and average precision 0.15. Random scores would
      give about 0.5 and 0.01. Which statement is right?
    options:
      - id: right
        text: Both are consistent - it ranks fraud well above chance, but at most thresholds most flagged rows are still genuine.
        feedback: Correct - ROC-AUC measures ranking against the false positive rate; AP reflects precision, which the 99% genuine class drags down.
      - id: contradiction
        text: They contradict each other, so one of them was computed wrongly.
        feedback: They answer different questions and routinely differ this much on rare classes.
      - id: auc-wins
        text: Report only ROC-AUC; AP is low because AP is a stricter version of accuracy.
        feedback: AP is not related to accuracy; it summarises the precision-recall curve, the trade-off a review team feels.
      - id: ap-bad
        text: An AP of 0.15 means the model is worse than random.
        feedback: Random AP is the positive rate, 0.01 here; 0.15 is fifteen times better than random.
    correct: [right]
    hints:
      - What is each metric's value for random scores?
    solution: |
      Compare each with its own baseline: ROC-AUC 0.90 against 0.5, AP 0.15 against 0.01. The model ranks well,
      and precision is still limited by how rare fraud is. Report both, and precision and recall at the chosen
      threshold.

  - id: place-diagnose
    type: mcq
    concept: bias-variance-and-fit
    skill: analysis
    title: Read two scores
    prompt: |
      A model's mean cross-validated RMSE is 0.4 on the training folds and 2.6 on the validation folds; a
      mean-prediction baseline scores 3.0. What is the diagnosis?
    options:
      - id: variance
        text: High variance - overfitting; try more regularisation, a simpler model or more data.
        feedback: Correct - a low training error with a large gap to validation is the signature of variance.
      - id: bias
        text: High bias - underfitting; add features.
        feedback: The training error is low, so the model can fit; the problem is the gap.
      - id: fine
        text: It is fine - it beats the baseline.
        feedback: It beats the baseline, but the gap shows much of the fit is noise; a regularised model would very likely do better on new data.
      - id: leak
        text: Data leakage - the validation score is too good.
        feedback: Leakage makes validation scores look too good; here validation is much worse than training.
    correct: [variance]
    hints:
      - Look at the gap, then at the training error.
    solution: |
      Training error 0.4 against validation 2.6 is a large gap: the model fits noise. Increase regularisation
      (validation curve over alpha or C), reduce flexibility, or add data (check a learning curve).

  - id: place-reg
    type: mcq
    concept: l1-l2-regularisation
    skill: application
    title: Regularisation basics
    prompt: |
      You fit `make_pipeline(StandardScaler(), Ridge(alpha=a))` for alpha in 0.0001, 0.01, 1 and 100. Which
      pattern of training and validation error do you expect as alpha grows?
    options:
      - id: right
        text: Training error rises steadily; validation error first falls (less overfitting), then rises (underfitting).
        feedback: Correct - the penalty always costs training fit; it helps validation only until it removes real signal.
      - id: both-fall
        text: Both errors fall steadily - more regularisation is always better.
        feedback: Too large an alpha shrinks the real weights towards zero and underfits; both errors then rise.
      - id: zeros
        text: Training error is unchanged, and more weights become exactly zero.
        feedback: Ridge almost never produces exact zeros - that is the lasso - and the penalty changes the training fit.
      - id: valid-only
        text: Only validation error changes, because the penalty is applied to validation data.
        feedback: The penalty is part of the training loss; it changes the fitted weights, which changes both errors.
    correct: [right]
    hints:
      - The penalty is added to the training loss - what must happen to the training error?
    solution: |
      Regularisation buys generalisation with training fit. Training error rises with alpha; validation error
      has a U shape with its minimum at the best alpha (here 0.01 gave validation RMSE 0.91 against 3.19
      unregularised, and alpha 10 rose to 2.23).

recall:
  - id: recall-three-sets
    concept: holdout-splits-and-leakage
    prompt: What is each of the training, validation and test sets for?
    answer: Training fits the parameters; validation (or cross-validation on the training data) chooses models, hyperparameters and the threshold; the test set is used once at the end to estimate performance on new data and is never used for a choice.
  - id: recall-leakage
    concept: holdout-splits-and-leakage
    prompt: What is data leakage, and the quickest test for it?
    answer: Using information not available at prediction time when building the model - preprocessing fitted on test rows, target leakage, shared entities or time across the split, test reuse. Tests - change only the test rows and check the model doesn't change; train on shuffled labels and check the score falls to chance.
  - id: recall-splitters
    concept: holdout-splits-and-leakage
    prompt: When do you use StratifiedKFold, GroupKFold and TimeSeriesSplit?
    answer: Stratified for rare classes (keep each class's share per fold); Group when rows of one entity (merchant, customer) must stay on one side; TimeSeries when the model predicts the future (training folds always precede validation).
  - id: recall-precision-recall
    concept: classification-and-regression-metrics
    prompt: Define precision and recall, and give scikit-learn's confusion-matrix layout.
    answer: Precision = TP / (TP + FP), the share of flagged rows that are positive. Recall = TP / (TP + FN), the share of positives caught. confusion_matrix has true labels in rows and predictions in columns - [[TN, FP], [FN, TP]] for 0/1.
  - id: recall-auc-ap
    concept: classification-and-regression-metrics
    prompt: What does each of ROC-AUC and average precision give for random scores, and which do you report on rare classes?
    answer: ROC-AUC is 0.5 whatever the balance; AP equals the positive rate. On rare classes report AP with its baseline (and ROC-AUC), plus precision and recall with counts at the chosen threshold.
  - id: recall-r2
    concept: classification-and-regression-metrics
    prompt: How do MAE, RMSE and R squared differ, and can R squared be negative?
    answer: MAE is the average absolute miss; RMSE squares errors so large misses weigh more (RMSE >= MAE); R squared compares with predicting the mean - 1 is perfect, 0 equals the mean, and negative is worse than the mean.
  - id: recall-bias-variance
    concept: bias-variance-and-fit
    prompt: How do training and validation scores reveal bias and variance?
    answer: Both poor and close together - high bias, underfitting. Training good, validation much worse - high variance, overfitting. Learning curves show whether more data would close the gap; validation curves show one hyperparameter's effect.
  - id: recall-l1-l2
    concept: l1-l2-regularisation
    prompt: How do ridge and lasso differ, and what is C in LogisticRegression?
    answer: Ridge (L2) adds alpha x sum of squared weights and shrinks all weights; lasso (L1) adds alpha x sum of absolute weights and sets some exactly to zero. In LogisticRegression C is the inverse strength - smaller C, stronger regularisation. Standardise features first and tune by CV.

