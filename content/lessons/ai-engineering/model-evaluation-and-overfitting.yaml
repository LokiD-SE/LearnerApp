id: model-evaluation-and-overfitting
title: Evaluation, overfitting and regularisation
subject: ai-engineering
module: ml-foundations
level: intermediate
status: published
estimatedMinutes: 85
summary: How to tell whether a model will work on data it has never seen - train, validation and test splits, stratified, grouped and cross-validated evaluation, data leakage, the confusion matrix, precision, recall and F1, ROC-AUC versus average precision on 1% fraud, regression metrics, bias and variance, learning and validation curves, and L1 and L2 regularisation. Every number shown comes from code run with scikit-learn 1.9.1.
