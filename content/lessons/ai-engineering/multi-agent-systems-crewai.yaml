id: multi-agent-systems-crewai
title: Multi-agent systems with CrewAI
subject: ai-engineering
module: ai-agents
level: advanced
status: published
estimatedMinutes: 150
summary: Decide when several cooperating agents beat one - and when they only multiply cost, errors and coordination problems. Build a mini crew in plain Python for a SandPay chargeback investigation - agents with a role, goal and backstory, tasks with an expected output and explicit context, guardrails that send failures back to the agent, a sequential process and a hierarchical one where a manager delegates through a tool under a budget. Then test the crew deterministically with scripted models routed by role, hand-off assertions and call budgets, and map every piece to CrewAI's real Agent, Task, Crew and Process API quoted from its documentation.
tags:
  [
    multi-agent systems,
    CrewAI,
    crew,
    agent role,
    goal,
    backstory,
    task,
    expected output,
    context passing,
    sequential process,
    hierarchical process,
    manager agent,
    delegation,
    allow_delegation,
    task guardrails,
    guardrail retries,
    orchestrator-workers,
    error compounding,
    token cost,
    coordination failures,
    MAST,
    deterministic testing,
    scripted LLM,
    chargeback,
  ]

environment: |
  - **Runtime:** Python 3.12.3 in `practice/ai/.venv` with NumPy 2.5.4 (only for a seeded simulation) and pytest.
    Every output in this lesson was printed by the code shown, run on Linux on 14 November 2026 with
    `OMP_NUM_THREADS=2`, against the reference solutions in `practice/ai/solutions/agents/`.
  - **No real model is called.** Every agent and the manager are `ScriptedLLM` clients from
    `practice/ai/support/llm_fake.py`, an offline stand-in with the shape of a messages API that replays replies
    **you script** and records every request. The replies in the examples are written for this lesson. Token counts
    come from its toy tokenizer (`count_tokens`: words and punctuation marks are one token each), so they show the
    **ratio** between designs, not what a real model would bill.
  - **CrewAI is not installed and was not run.** The crew you build (`mini_crew.py`, `crew_manager.py`) is plain
    Python that borrows CrewAI's names (`Agent`, `Task`, `Crew`, `Process`, `TaskOutput`, `CrewOutput`, `kickoff`)
    so the mapping is easy to see; it copies none of CrewAI's code, and its prompts and message shapes are this
    lesson's design. Every CrewAI snippet is quoted **from the official docs, not run here (library not
    installed)**, as documented on 14 November 2026: [Agents](https://docs.crewai.com/en/concepts/agents) (the
    attribute table: `role`, `goal`, `backstory`, `allow_delegation` "Default is False", `max_iter` "Default is
    20"), [Tasks](https://docs.crewai.com/en/concepts/tasks) (`description`, `expected_output`, `context`,
    `guardrail`, `guardrails`, `guardrail_max_retries` "Defaults to 3", and the guardrail section),
    [Crews](https://docs.crewai.com/en/concepts/crews) (`process`, `manager_llm`, `manager_agent`, `CrewOutput`,
    `token_usage`, `usage_metrics`), [Processes](https://docs.crewai.com/en/concepts/processes),
    [Sequential Processes](https://docs.crewai.com/en/learn/sequential-process), [Hierarchical
    Process](https://docs.crewai.com/en/learn/hierarchical-process) and
    [Collaboration](https://docs.crewai.com/en/concepts/collaboration) (the "Delegate work to coworker" and "Ask
    question to coworker" tools). The docs change between releases - check the version you install.
  - **Provider articles (Anthropic engineering blog, provider-specific experience, not standards):** [How we built
    our multi-agent research system](https://www.anthropic.com/engineering/multi-agent-research-system) (13 June
    2025: the orchestrator-worker Research system, "about 15x more tokens than chats", the 90.2% internal-eval
    result, coordination failures and evaluation advice) and [Building effective
    agents](https://www.anthropic.com/engineering/building-effective-agents) (19 December 2024: "finding the
    simplest solution possible", the orchestrator-workers and evaluator-optimizer workflows, "compounding errors").
  - **Paper:** Mert Cemri et al., [Why Do Multi-Agent LLM Systems Fail?](https://arxiv.org/abs/2503.13657) (arXiv
    2503.13657, v3 26 October 2025): the MAST taxonomy - 14 failure modes in 3 categories (system design issues,
    inter-agent misalignment, task verification) from 1600+ annotated traces across 7 frameworks.
  - **Tool-result message shapes (provider-specific, as documented on 14 November 2026):** Anthropic, [Handle tool
    calls](https://platform.claude.com/docs/en/agents-and-tools/tool-use/handle-tool-calls) (a `user` message with
    `tool_result` blocks: `tool_use_id`, `content`, optional `is_error`); OpenAI, [Function
    calling](https://platform.openai.com/docs/guides/function-calling) (a `function_call_output` input item with
    `call_id` and `output`). OWASP, [LLM06:2025 Excessive
    Agency](https://genai.owasp.org/llmrisk/llm062025-excessive-agency/). No prices are given.
  - **SandPay** is a fictional payments company. The chargeback CB-2041, payment `pay_7Qm2Xc91`, the evidence ids
    EV-1 to EV-5 and the reason "goods not received" are invented; real card-scheme reason codes and dispute rules
    are not described here.

prerequisites:
  - tool-use-and-function-calling
  - agent-loops-and-workflow-patterns
  - llm-evaluation-and-guardrails

concepts:
  - id: multi-agent-tradeoffs
    name: When several agents help and when they hurt
    summary: A multi-agent system splits work between agents with their own prompts, tools and context windows. It helps when the work really splits - independent directions explored in parallel, more information than one context holds, distinct tools - and it costs more tokens, more calls and more coordination. Errors compound along a chain (four steps that are each 90% right give 66%), agents misread each other's hand-offs, and nobody verifies the whole. Start with one agent or a fixed workflow; add agents only when a test shows the gain.
  - id: crew-agents-tasks-context
    name: Agents, tasks, context and guardrails
    summary: An agent is a role, a goal and a backstory (its system prompt) plus a model and tools. A task is a description, an expected output and an assigned agent; context names which earlier task outputs the task receives. A guardrail is ordinary code (or a model check) that validates a task's output before the next task sees it, returns an error the agent can act on, and allows a bounded number of retries - the place to stop a hallucinated evidence id from reaching the next agent.
  - id: crew-processes-delegation
    name: Sequential and hierarchical processes, and delegation
    summary: In a sequential process the tasks run in a fixed order with each task's output passed on as context - a prompt chain with roles. In a hierarchical process a manager model is given each task, delegates pieces to coworkers through a tool, reviews the results and answers - an orchestrator-workers pattern that adapts to the input but adds manager calls, a new failure point and loops. Delegation needs limits enforced in code - a budget, a turn limit, unknown coworkers returned as errors, specialists that cannot delegate further.
  - id: crew-deterministic-testing
    name: Testing a crew deterministically
    summary: A crew is tested like any distributed system - replace each model with a scripted fake routed by the calling agent's role, so scripts do not depend on call order; assert on what crossed each boundary (the context an agent received, the tool calls the manager made, the guardrail feedback), on call and token budgets, and on the end state; make every unexpected call fail loudly. Quality of real model output is then measured separately with evals.

objectives:
  - Decide, from the shape of a task, whether a single agent, a fixed workflow or a crew of agents fits, and justify it with cost, error compounding and coordination arguments.
  - Calculate the success rate of a chain of agents and the effect of a check with retries between steps.
  - Write agents with a role, goal and backstory and tasks with an expected output and explicit context, and trace exactly what each agent receives.
  - Write task guardrails that validate and transform output, return actionable errors and stop after a bounded number of retries.
  - Explain the sequential and hierarchical processes and build a manager that delegates through a tool under a budget and a turn limit.
  - Test a crew deterministically with scripted models routed by role, hand-off assertions and call budgets.
  - Map a plain-Python crew to CrewAI's Agent, Task, Crew and Process API and name what the library adds.

sections:
  - id: intuition
    kind: intuition
    concepts: [multi-agent-tradeoffs, crew-agents-tasks-context, crew-processes-delegation]
    title: The idea in plain language
    body: |
      A cardholder tells their bank they never received a parcel, and the bank pulls 84.00 EUR back from a SandPay
      merchant: a **chargeback**. SandPay's disputes team has a few days to decide whether to fight it and, if so,
      to send evidence. In a real team three people might touch the case:

      - an **evidence collector** gathers the facts - carrier scan, 3-D Secure result, earlier orders, refunds;
      - a **fraud analyst** decides "contest" or "accept" from those facts;
      - a **dispute writer** turns the decision into a short, factual response.

      A **multi-agent system** copies that division of labour with language-model agents: each gets its own
      instructions (a role, a goal, a backstory), its own task with an expected result, and receives only the
      hand-offs it needs. **CrewAI** is a Python framework built around exactly this picture - agents, tasks, a
      crew, and a process that says who works when.

      The analogy also shows the costs. Three people means three hand-offs where facts can be lost, three times the
      reading, and somebody has to check the work between desks - otherwise the writer happily cites evidence the
      collector invented. A good team lead also knows when the whole case is one person's ten-minute job. This
      lesson builds the crew in plain Python, runs it against a scripted model, measures what it costs, and tests it
      the way you would test any system with several components passing messages.

  - id: what
    kind: what
    concepts: [multi-agent-tradeoffs, crew-agents-tasks-context, crew-processes-delegation, crew-deterministic-testing]
    title: Terms you need, and the CrewAI names
    body: |
      | Term | Meaning | In `mini_crew` | In CrewAI (from the docs) |
      | --- | --- | --- | --- |
      | **Agent** | a model with its own instructions and tools; in Anthropic's article "LLMs autonomously using tools in a loop" | `Agent(role, goal, backstory, llm)`, one model call per attempt | `Agent(role=..., goal=..., backstory=..., llm=..., tools=..., max_iter=20)` - runs a tool loop |
      | **Role / goal / backstory** | who the agent is, what it optimises for, and context that shapes how it works | the system prompt "You are {role}. / Your goal: {goal} / {backstory}" | "Defines the agent's function and expertise", "The individual objective that guides the agent's decision-making", "Provides context and personality" |
      | **Task** | one assignment with a definition of done | `Task(name, description, expected_output, agent, context, guardrails)` | `Task(description=..., expected_output=..., agent=..., context=[...], guardrail=...)` |
      | **Expected output** | what a finished answer looks like - the acceptance criterion in the prompt | "Expected output:" line | `expected_output`: "A detailed description of what the task's completion looks like" |
      | **Context** | which earlier outputs a task receives | `context=None` previous task; `[...]` exactly those | `context`: "Other tasks whose outputs will be used as context for this task" |
      | **Guardrail** | a check on a task's output before it moves on; failure goes back to the agent | `(ok, value_or_error)` functions, `guardrail_max_retries` | function or string (LLM) guardrails, `guardrail_max_retries` "Defaults to 3" |
      | **Crew** | the agents, the tasks and the process | `Crew(agents, tasks, process)` | `Crew(agents=..., tasks=..., process=...)` |
      | **Process** | the execution strategy | `Process.sequential`; hierarchical in `crew_manager` | `Process.sequential` (default), `Process.hierarchical` |
      | **Manager** | in the hierarchical process, the model that assigns, delegates and validates | `run_manager_task` with a `delegate_work` tool | `manager_llm=` or `manager_agent=` |
      | **Delegation** | an agent handing a piece of work to a coworker | the manager's `delegate_work(coworker, task, context)` | `allow_delegation=True` gives "Delegate work to coworker(task, context, coworker)" and "Ask question to coworker" |
      | **Kickoff** | running the crew with inputs for the `{placeholders}` | `crew.kickoff({"case": ...})` | `crew.kickoff(inputs={...})` returns a `CrewOutput` |
      | **Error compounding** | errors of one step become the input of the next, so a chain is only as good as the product of its steps | `chain_success` | - |
      | **Scripted model** | an offline fake that replays written replies and records requests | `ScriptedLLM` + `role_router` | - (test your own crew the same way) |

  - id: why
    kind: why
    concepts: [multi-agent-tradeoffs]
    title: Why several agents - and why not
    body: |
      **The case for several agents** comes from work that really splits. Anthropic's engineering article on its
      Research feature (provider-specific experience, June 2025) reports that a lead agent with parallel subagents
      "outperformed single-agent Claude Opus 4 by 90.2%" on its internal research eval, that the systems "excel
      especially for breadth-first queries that involve pursuing multiple independent directions simultaneously", and
      names three situations where they shine: "heavy parallelization, information that exceeds single context
      windows, and interfacing with numerous complex tools". Each subagent has its own context window, so together
      they read more than one agent could, and return only a condensed result.

      **The case against** is in the same article:

      - **Cost.** "agents typically use about 4x more tokens than chat interactions, and multi-agent systems use about
        15x more tokens than chats", so they need "tasks where the value of the task is high enough to pay for the
        increased performance".
      - **Shared context and dependencies.** "domains that require all agents to share the same context or involve
        many dependencies between agents are not a good fit for multi-agent systems today" - for example "most coding
        tasks".
      - **Coordination.** Early versions made "errors like spawning 50 subagents for simple queries" and subagents
        "duplicated work" when the lead agent's instructions were vague.

      The MAST study (Cemri et al.) starts from the observation that multi-agent "performance gains on popular
      benchmarks are often minimal" and sorts 14 failure modes from 1600+ traces into three categories: **system
      design issues** (for example ignoring the task or role specification, repeating steps, not knowing when to
      stop), **inter-agent misalignment** (for example withholding information, ignoring another agent's input,
      reasoning that does not match the action) and **task verification** (stopping too early, no or incomplete
      verification, incorrect verification).

  - id: when
    kind: when
    concepts: [multi-agent-tradeoffs]
    title: When several agents help - and when they hurt
    body: |
      **A decision rule for a tester or engineer:**

      | Situation | Usually best |
      | --- | --- |
      | the steps are known and the same for every input | one agent, or a fixed **workflow** (prompt chain) in code |
      | the input picks one of a few paths | a **router** plus single agents |
      | independent pieces that can run in parallel, each needing a lot of reading | several agents (orchestrator-workers, parallel subagents) |
      | different tools or permissions per step that one prompt would muddle | separate agents with separate, smaller tool sets |
      | every step needs everything the others know | one agent - splitting only adds hand-offs |
      | high value per run, and the gain is shown by an eval | a crew is worth its cost |

      Anthropic's "Building effective agents" says the same in one line: find "the simplest solution possible, and
      only increasing complexity when needed. This might mean not building agentic systems at all."

      For the SandPay chargeback the honest answer is that **one agent is probably enough**: the case file is short,
      every step needs the same facts, and nothing runs in parallel. The crew in this lesson is a teaching example
      that makes the mechanics visible - and the cost table in the next section shows what it would cost you.

  - id: cost-and-compounding
    kind: internals
    concepts: [multi-agent-tradeoffs]
    title: What a crew costs, and how errors compound
    body: |
      **Cost.** The same chargeback, handled three ways against the scripted model (toy tokenizer, so compare ratios,
      not absolute numbers): one "Disputes Specialist" agent with one prompt; the three-agent sequential crew; and a
      hierarchical crew where a manager delegates to the same three agents.

      ```plaintext
      setup                        calls  prompt  completion  total
      single agent                     1     114         101    215
      sequential crew (3 agents)       3     406         132    538
      hierarchical (manager + 3)       7    1170         468   1638
      hierarchical calls by role: {'Crew Manager': 4, 'Evidence Collector': 1, 'Fraud Analyst': 1, 'Dispute Writer': 1}
      ```

      The sequential crew costs 2.5 times the single agent although every agent's reply is short. The growth is in
      **prompt** tokens: every agent gets its own system prompt, and the evidence list is re-sent to each agent that
      needs it as context. The hierarchical crew costs 7.6 times: the manager is called four times (once per
      delegation plus the final answer), and each manager call re-sends the whole conversation so far, including every
      coworker's result. Real systems show the same shape - Anthropic's "about 15x" - which is why the decision table
      above asks for a measured gain.

      **Error compounding.** If each step of a chain is right with probability p and steps fail independently, the
      whole chain is right with probability p to the power n:

      ```python
      def chain_success(step_probs):
          return math.prod(step_probs)
      ```

      ```plaintext
      steps  p=0.99   p=0.95   p=0.90
          1  0.990   0.950   0.900
          2  0.980   0.902   0.810
          3  0.970   0.857   0.729
          5  0.951   0.774   0.590
         10  0.904   0.599   0.349
      ```

      Four agents that are each right 90% of the time produce a right answer 66% of the time. Independence is the
      optimistic case: in practice a wrong hand-off makes the next agent **more** likely to fail, as Anthropic puts it,
      "One step failing can cause agents to explore entirely different trajectories". "Building effective agents"
      lists "the potential for compounding errors" as a cost of autonomy.

      **A check between steps changes the arithmetic.** Suppose a guardrail after each step catches a wrong output
      with probability c and asks the agent again, up to r times. One step then ends right with probability
      q(0) = p, q(r) = p + (1 - p) * c * q(r - 1), and the chain with q to the power n:

      ```plaintext
      4 steps at 0.90, check catches 0%, 0 retries -> 0.656
      4 steps at 0.90, check catches 50%, 1 retries -> 0.797
      4 steps at 0.90, check catches 80%, 2 retries -> 0.914
      4 steps at 0.90, check catches 100%, 2 retries -> 0.996
      simulation, 20000 seeded runs: 0.914
      ```

      The last line is a seeded simulation (NumPy, seed 11) of the 80% / 2-retry case, which agrees with the formula.
      Two lessons follow. **Verification is where reliability comes from** - MAST's third category exists because
      crews often lack it. And checks written in **code** (catch rate close to 100% for what they check: JSON shape,
      known evidence ids, word limits) are worth more than another agent asked to "review" - which is itself right
      only some of the time.

  - id: visual
    kind: visual
    concepts: [crew-processes-delegation]
    title: The two processes side by side
    body: |
      ```mermaid
      flowchart LR
        subgraph S[Sequential process]
          direction LR
          I1[kickoff inputs] --> C1[Evidence Collector<br/>task collect]
          C1 -->|context| A1[Fraud Analyst<br/>task assess]
          A1 --> G1{guardrails:<br/>JSON, known ids}
          G1 -->|error, retry| A1
          G1 -->|ok| W1[Dispute Writer<br/>task write]
          C1 -->|context| W1
          W1 --> O1[CrewOutput]
        end
        subgraph H[Hierarchical process]
          direction LR
          I2[task] --> M[Manager]
          M -->|delegate_work| C2[Evidence Collector]
          M -->|delegate_work| A2[Fraud Analyst]
          M -->|delegate_work| W2[Dispute Writer]
          C2 -->|tool_result| M
          A2 -->|tool_result| M
          W2 -->|tool_result| M
          M --> G2{guardrails} --> O2[CrewOutput]
        end
      ```

      Notice where decisions are made. In the sequential process the **code** fixes the order and the context
      arrows - you can read the whole data flow before running anything. In the hierarchical process the **manager
      model** draws the arrows at run time, so the flow can differ between runs, and every arrow is another model
      call. The guardrail diamonds are ordinary code in both.

  - id: crewai-api
    kind: code
    concepts: [crew-agents-tasks-context, crew-processes-delegation]
    title: The real CrewAI API, from the docs
    collapsed: true
    body: |
      All snippets below are **from the official docs, not run here (library not installed)**, as documented on 14
      November 2026. They show the names your plain-Python crew mirrors.

      A sequential crew (from "Sequential Processes"):

      ```python
      from crewai import Crew, Process, Agent, Task, TaskOutput, CrewOutput

      # Define your agents
      researcher = Agent(
        role='Researcher',
        goal='Conduct foundational research',
        backstory='An experienced researcher with a passion for uncovering insights'
      )
      # ... analyst and writer defined the same way

      # Define your tasks
      research_task = Task(
        description='Gather relevant data...',
        agent=researcher,
        expected_output='Raw Data'
      )
      # ... analysis_task and writing_task

      # Form the crew with a sequential process
      report_crew = Crew(
        agents=[researcher, analyst, writer],
        tasks=[research_task, analysis_task, writing_task],
        process=Process.sequential
      )

      # Execute the crew
      result = report_crew.kickoff()
      ```

      The same page: "Each task in a sequential process **must** have an agent assigned." The Processes page
      describes the flow: "Task execution follows the predefined order in the task list, with the output of one task
      serving as context for the next. To customize task context, utilize the `context` parameter".

      Explicit context (from "Tasks"):

      ```python
      analysis_task = Task(
          description="Analyze the research findings and identify key trends",
          expected_output="Analysis report of AI trends",
          agent=analyst,
          context=[research_task]  # This task will wait for research_task to complete
      )
      ```

      A function guardrail (from "Tasks"). It receives the `TaskOutput` and returns a tuple - `(True, value)` to
      accept (the value may be a transformed result) or `(False, "error message")`:

      ```python
      def validate_blog_content(result: TaskOutput) -> Tuple[bool, Any]:
          """Validate blog content meets requirements."""
          try:
              # Check word count
              word_count = len(result.raw.split())
              if word_count > 200:
                  return (False, "Blog content exceeds 200 words")

              # Additional validation logic here
              return (True, result.raw.strip())
          except Exception as e:
              return (False, "Unexpected error during validation")

      blog_task = Task(
          description="Write a blog post about AI",
          expected_output="A blog post under 200 words",
          agent=blog_agent,
          guardrail=validate_blog_content  # Add the guardrail function
      )
      ```

      The docs on failure: "The error is sent back to the agent", "The agent attempts to fix the issue", and this
      repeats until the guardrail passes or "Maximum retries are reached (`guardrail_max_retries`)". A `guardrails`
      list runs "sequentially, with each guardrail receiving the output from the previous one", and a **string**
      guardrail becomes an LLM-based check that "uses the agent's LLM". What happens after the last retry is not
      stated on that page - check the documentation of your version before relying on it.

      A hierarchical crew (from "Processes"):

      ```python
      # Example: Creating a crew with a hierarchical process
      # Ensure to provide a manager_llm or manager_agent
      crew = Crew(
          agents=my_agents,
          tasks=my_tasks,
          process=Process.hierarchical,
          manager_llm="gpt-4o"
          # or
          # manager_agent=my_manager_agent
      )
      ```

      In the hierarchical process "Tasks are not pre-assigned; the manager allocates tasks to agents based on their
      capabilities, reviews outputs, and assesses task completion." Delegation is opt-in: the Agents table gives
      `allow_delegation` "Default is False", and the Collaboration page says that with `allow_delegation=True`
      agents get "Delegate work to coworker(task: str, context: str, coworker: str)" and "Ask question to
      coworker(question: str, context: str, coworker: str)". For "Delegation Loops" ("Agents delegate back and
      forth indefinitely") its fix is a clear hierarchy with specialists set to `allow_delegation=False`.

      **What the library adds that `mini_crew` does not:** a tool loop per agent (`max_iter`, default 20), tools,
      memory, caching, planning, async tasks, structured output (`output_pydantic`, `output_json`), callbacks,
      checkpointing, tracing and real provider clients. The concepts - and the testing approach - are the same.

  - id: mini-crew-core
    kind: code
    concepts: [crew-agents-tasks-context]
    title: "The mini crew: agents, tasks and context"
    body: |
      The core of `mini_crew.py` (the practice exercise; the full file has docstrings and validation):

      ```python
      @dataclass
      class Agent:
          role: str
          goal: str
          backstory: str
          llm: Any = None              # anything with .create(messages=..., system=..., ...)
          allow_delegation: bool = False
          max_tokens: int = 300


      @dataclass
      class Task:
          name: str
          description: str
          expected_output: str
          agent: Agent | None = None
          context: list["Task"] | None = None   # None: the previous task's output; []: no context
          guardrails: list[Guardrail] = field(default_factory=list)
          guardrail_max_retries: int = 3


      def agent_system_prompt(agent):
          return f"You are {agent.role}.\nYour goal: {agent.goal}\n{agent.backstory}"


      def task_prompt(task, context):
          text = f"Task: {task.description}\n\nExpected output: {task.expected_output}"
          if context:
              blocks = "\n".join(f'<context task="{c.name}" agent="{c.agent}">\n{c.raw}\n</context>'
                                 for c in context)
              text += f"\n\nContext from earlier tasks:\n{blocks}"
          return text
      ```

      The SandPay crew: the collector lists evidence; the analyst must return JSON whose evidence ids exist in the
      case file; the writer gets **both** earlier outputs as explicit context and a 60-word limit:

      ```python
      collect = Task("collect", "Collect the evidence for this case: {case}", "One line per evidence id", collector)
      assess = Task("assess", "Decide whether to contest the chargeback.",
                    'Only a JSON object with "decision" (contest or accept) and "evidence" (a list of ids)',
                    analyst, guardrails=[parse_json, evidence_exists], guardrail_max_retries=2)
      write = Task("write", "Write the response for case {case_id}.", "At most 60 words, citing evidence ids",
                   writer, context=[collect, assess], guardrails=[word_limit])

      out = Crew([collector, analyst, writer], [collect, assess, write]).kickoff(
          {"case": CASE, "case_id": "CB-2041"})
      ```

      What the writer received - the whole prompt is visible and testable:

      ```plaintext
      Task: Write the response for case CB-2041.

      Expected output: At most 60 words, citing evidence ids

      Context from earlier tasks:
      <context task="collect" agent="Evidence Collector">
      EV-1 carrier scan: delivered 2 Oct to the billing address
      EV-2 3-D Secure authentication passed
      EV-3 same device as 6 earlier undisputed orders
      EV-4 no refund issued
      </context>
      <context task="assess" agent="Fraud Analyst">
      {"decision": "contest", "evidence": ["EV-1", "EV-2", "EV-3"]}
      </context>
      ```

      - **The backstory is prompt text, nothing more.** "You never add evidence that is not in the case file" makes
        invention less likely; it does not make it impossible. The guardrail below does.
      - **Expected output is the acceptance criterion in the prompt.** Write it so a program could check it
        ("Only a JSON object with..."), then write the program.
      - **Context is a design decision.** With `context=None` the writer would have seen only the analyst's JSON and
        could not quote the delivery date. Too much context is the opposite failure - every token is paid again by
        every agent that receives it.
      - **Braces in task text.** Descriptions are filled with `str.format_map`, like CrewAI's `{placeholder}` inputs.
        A literal `{"decision": ...}` in a description raised `KeyError: '"decision"'` in this run; write literal
        braces as double braces, or keep JSON examples out of templated text.

  - id: guardrails
    kind: line-by-line
    concepts: [crew-agents-tasks-context]
    title: Guardrails between agents - line by line
    body: |
      The analyst's two guardrails, written in ordinary code:

      ```python
      def parse_json(output):
          try:
              data = json.loads(output.raw)
          except json.JSONDecodeError:
              return False, "not valid JSON - return only the JSON object, no code fences"
          if not isinstance(data, dict) or data.get("decision") not in ("contest", "accept"):
              return False, "decision must be contest or accept"
          return True, data


      def evidence_exists(output):
          cited = output.value.get("evidence", [])
          unknown = [e for e in cited if e not in KNOWN]
          if unknown:
              return False, f"evidence ids {unknown} are not in the case file"
          if output.value["decision"] == "contest" and not cited:
              return False, "a contest needs at least one evidence id"
          return True, output.value
      ```

      - **`return True, data`** - a guardrail can **transform**: the parsed dict becomes `output.value`, and the next
        guardrail works on it. That is why `evidence_exists` reads `output.value`, not `output.raw`.
      - **The error text is an instruction to the agent.** "not valid JSON - return only the JSON object, no code
        fences" tells the model what to change. "invalid" would not.
      - **`unknown = [...]`** is the anti-hallucination check: it compares against the case file, the source of
        truth, not against what the collector said.

      The retry loop in `run_task`:

      ```python
      while True:
          attempts += 1
          reply = agent.llm.create(messages=messages, system=agent_system_prompt(agent),
                                   max_tokens=agent.max_tokens, temperature=0.0)
          # ... add tokens to usage, run the guardrails in order ...
          if error is None:
              return output
          if attempts > task.guardrail_max_retries:
              raise GuardrailError(task.name, error, attempts)
          messages += [
              {"role": "assistant", "content": reply.text},
              {"role": "user", "content": f"Your answer failed a check: {error}\nReturn a corrected answer."},
          ]
      ```

      - **The rejected answer stays in the conversation** as an assistant message, so the agent can see what it
        wrote and why it failed.
      - **`attempts > guardrail_max_retries`** - retries are on top of the first attempt: 2 retries means at most 3
        calls.
      - **Raise, don't pass it on.** After the last retry the task fails loudly. Handing a known-bad output to the
        next agent is exactly the error compounding of the previous section.

      In the run, the scripted analyst first wrapped its JSON in a code fence, then cited EV-5, which is not in the
      case file:

      ```plaintext
      collect  Evidence Collector  attempts=1
      assess   Fraud Analyst       attempts=3
      write    Dispute Writer      attempts=1
      assess value: {'decision': 'contest', 'evidence': ['EV-1', 'EV-2', 'EV-3']}
      token usage: {'prompt_tokens': 823, 'completion_tokens': 199, 'calls': 5, 'total_tokens': 1022}
      --- the Fraud Analyst's third request: roles, then the two feedback messages ---
      ['user', 'assistant', 'user', 'assistant', 'user']
      Your answer failed a check: not valid JSON - return only the JSON object, no code fences
      Return a corrected answer.
      Your answer failed a check: evidence ids ['EV-5'] are not in the case file
      Return a corrected answer.
      ```

      Two retries cost two extra calls and pushed the run from 538 to 1022 tokens - the third attempt re-sends the
      whole growing conversation. When the analyst keeps citing EV-5:

      ```plaintext
      GuardrailError: task 'assess' failed its guardrail after 3 attempts: evidence ids ['EV-5'] are not in the case file
      ```

      The writer never ran, so no response citing invented evidence could be produced.

  - id: manager-code
    kind: code
    concepts: [crew-processes-delegation]
    title: "The hierarchical process: a manager that delegates through a tool"
    body: |
      `crew_manager.py` gives the manager one tool, `delegate_work(coworker, task, context)` - the same three
      arguments as CrewAI's "Delegate work to coworker" tool. Each manager turn either calls the tool or answers:

      ```python
      for _turn in range(max_turns):
          reply = manager_llm.create(messages=messages, system=system, max_tokens=400,
                                     temperature=0.0, tools=[DELEGATE_TOOL])
          if reply.stop_reason == "tool_use":
              messages.append({"role": "assistant", "content": reply.content})
              results = []
              for call in reply.tool_calls:
                  if call["name"] != "delegate_work":
                      text, is_error, role = f"unknown tool '{call['name']}'", True, None
                  elif delegations >= max_delegations:
                      text, is_error, role = (f"delegation budget of {max_delegations} used up; "
                                              "give your final answer now", True, None)
                  else:
                      delegations += 1
                      text, is_error, role = delegate(call, coworkers, usage)
                  results.append({"type": "tool_result", "tool_use_id": call["id"],
                                  "content": text, "is_error": is_error})
              messages.append({"role": "user", "content": results})
              continue
          # otherwise: the reply is the task's answer -> guardrails, as in run_task
      raise RuntimeError(f"manager did not finish task {task.name!r} in {max_turns} turns")
      ```

      **The tool-result message shape** is this lesson's choice and follows Anthropic's Messages API: a `user`
      message whose content is `tool_result` blocks with `tool_use_id`, `content` and optional `is_error`. OpenAI's
      Responses API sends a `function_call_output` item with `call_id` and `output` instead (both provider-specific,
      as documented on 14 November 2026). The idea is identical: every tool call gets exactly one result, matched by
      id.

      **Limits enforced in code, not in the prompt.** A run where the scripted manager first asks for a "Researcher"
      (no such coworker), then keeps delegating to the collector, with `max_delegations=2`:

      ```plaintext
      1 {'task': 'investigate', 'coworker': 'Researcher', 'is_error': True}
      2 {'task': 'investigate', 'coworker': 'Evidence Collector', 'is_error': False}
      3 {'task': 'investigate', 'coworker': 'Evidence Collector', 'is_error': True}
      4 {'task': 'investigate', 'coworker': 'Evidence Collector', 'is_error': True}
      5 {'task': 'investigate', 'coworker': 'Evidence Collector', 'is_error': True}
      tool_result: True unknown coworker 'Researcher'; choose one of: Evidence Collector, Fraud Analyst,
      tool_result: False EV-1 carrier scan: delivered 2 Oct to the billing address
      EV-2 3-D Secure authen
      tool_result: True delegation budget of 2 used up; give your final answer now
      tool_result: True delegation budget of 2 used up; give your final answer now
      tool_result: True delegation budget of 2 used up; give your final answer now
      collector calls: 1 | manager calls: 6
      ```

      (The demo prints the first 80 characters of each result; the full first message ends "Fraud Analyst, Dispute
      Writer".)

      - **An unknown coworker is an error result, not a crash.** The manager gets the list of valid roles and can
        correct itself - Anthropic's article reports that "letting the agent know when a tool is failing and letting
        it adapt works surprisingly well".
      - **The budget counts failed delegations too**, so a manager stuck on a bad name cannot loop forever; after the
        budget, coworkers are not called at all (the collector ran once).
      - **`max_turns` is the last line of defence.** A manager that never answers raises `RuntimeError` instead of
        spending tokens until someone notices.
      - **Coworkers get no tools.** They cannot delegate further, which rules out the "delegate back and forth"
        loop by construction - CrewAI's documented fix is the same idea (`allow_delegation=False` for specialists).
      - **A coworker sees only `task` and `context`.** Whatever the manager forgets to put in `context` does not
        exist for the coworker - Anthropic's article found that vague delegations made subagents misinterpret the task
        or duplicate each other's work, and that "Each subagent needs an objective, an output format, guidance on the
        tools and sources to use, and clear task boundaries".

  - id: design-steps
    kind: steps
    concepts: [multi-agent-tradeoffs, crew-agents-tasks-context, crew-processes-delegation]
    title: Designing a crew, step by step
    body: |
      1. **Write the single-agent baseline first** and an eval for it (see [Evaluating LLM applications and
         guardrails](#/lesson/llm-evaluation-and-guardrails)). Without a baseline you cannot show a crew is better.
      2. **Split only along real seams**: parallel, independent pieces; different tools or permissions; more reading
         than one context holds. "Each agent mirrors a job title" is not a seam.
      3. **Give each agent a narrow role and goal**, and only the tools that role needs - OWASP LLM06 (Excessive
         Agency) applies per agent: the writer needs no refund tool.
      4. **Write every task's expected output as something code can check** - JSON with named fields, a word limit,
         ids from a known list.
      5. **Make context explicit.** For each task, list the earlier outputs it needs; nothing more.
      6. **Put a code guardrail at every hand-off that matters**, with actionable error messages and a small retry
         limit; fail the run after the limit.
      7. **Prefer the sequential process.** Use a manager only when the subtasks cannot be known in advance, and then
         set a delegation budget, a turn limit, and specialists that cannot delegate.
      8. **Record usage per run** - calls, prompt and completion tokens per agent - and set a budget alarm.
      9. **Test with scripted models** (next section), then evaluate with real ones; compare against the baseline on
         quality **and** cost.

  - id: testing
    kind: tests
    concepts: [crew-deterministic-testing]
    title: Testing a crew deterministically
    body: |
      A crew is several components passing messages, so test it like one: fix every component's behaviour, then
      assert on the boundaries. Anthropic's article explains why outcome checks matter: agents "might take
      completely different valid paths to reach their goal", so for real-model evals it recommends judging "whether
      agents achieved the right outcomes while also following a reasonable process", and end-state evaluation for
      agents that change state. With **scripted** models the path is fixed, so you can also check the process
      exactly.

      **Route the script by role.** One `ScriptedLLM` with a plain list would answer calls in global order, so moving
      a task or adding a retry shifts every reply. `role_router` reads the role from the system prompt's first line
      and answers from that role's own list:

      ```python
      llm = ScriptedLLM(role_router({
          "Evidence Collector": [EVIDENCE],
          "Fraud Analyst": ['```json\n{"decision": ...}\n```', '{"decision": ... "EV-5"]}', '{"decision": ...}'],
          "Dispute Writer": [LETTER],
      }))
      ```

      Unexpected calls fail loudly. Script only the collector and run the crew:

      ```plaintext
      AssertionError: unexpected call from role 'Fraud Analyst'
      ```

      **Assert on what crossed each boundary**, using `llm.calls` (every request is recorded):

      ```plaintext
      handed off EV-3 to the writer in call 4
      calls by role: {'Evidence Collector': {'calls': 1, 'prompt_tokens': 121}, 'Fraud Analyst': {'calls': 3, 'prompt_tokens': 538}, 'Dispute Writer': {'calls': 1, 'prompt_tokens': 164}}
      ```

      **Validate the wiring before anything runs:**

      ```plaintext
      ValueError: task 'assess' uses 'later' as context before it has run
      ```

      (CrewAI's JSONC task configuration likewise rejects forward references "so sequential context stays
      explicit".)

      | # | Case | Expected result | Evidence |
      | --- | --- | --- | --- |
      | 1 | happy path, three agents | tasks run in order; the writer's prompt contains the collector's EV-1 line and the analyst's JSON | `llm.calls[4]`, `assert_handed_off` |
      | 2 | `context=None` on the writer | only the analyst's output reaches the writer | writer prompt |
      | 3 | analyst wraps JSON in a fence | rejected with "not valid JSON..."; second attempt accepted | feedback message, `attempts == 2` |
      | 4 | analyst cites EV-5 on every attempt | `GuardrailError` after `guardrail_max_retries + 1` calls; writer never called | exception, `calls_by_role` |
      | 5 | task context names a later task | `ValueError` and **no** model call | `llm.calls == []` |
      | 6 | manager names an unknown coworker | `is_error` tool result listing valid roles; run continues | tool result, trace |
      | 7 | manager keeps delegating | after the budget, coworkers are not called; error result says "give your final answer now" | coworker call count |
      | 8 | manager never answers | `RuntimeError` after `max_turns` calls | manager call count |
      | 9 | coworker raises a 503-style error | `is_error` result "coworker ... failed", manager decides | tool result |
      | 10 | any run | total calls and tokens under the budget for this case | `token_usage` |

      These tests check the **crew's code** - wiring, hand-offs, limits, guardrails. They do not check whether a real
      model writes a good dispute response; that is an eval with real replies, graded as in the evaluation lesson.

  - id: example
    kind: example
    concepts: [multi-agent-tradeoffs, crew-deterministic-testing]
    title: "Example: reviewing the chargeback crew before release"
    body: |
      The disputes team proposes the three-agent crew for every chargeback. As the tester you report:

      - **Baseline:** a single "Disputes Specialist" agent was not evaluated. Request: run both on the same 50
        recorded cases (anonymised) and compare decision accuracy, evidence-citation accuracy and cost.
      - **Cost:** on the scripted run the sequential crew uses 2.5 times the tokens of one agent and the hierarchical
        variant 7.6 times; each guardrail retry adds a full call. Ask for a per-case token budget and an alarm.
      - **Hand-offs:** the writer's context includes the full evidence list (test 1 passes); with the default
        context the delivery date would be lost - a configuration test pins `context=[collect, assess]`.
      - **Verification:** the analyst's JSON and evidence ids are checked in code (tests 3 and 4 pass); the writer's
        letter is only checked for length. **Gap raised:** nothing checks that the letter cites only the evidence
        ids from the analyst's JSON - add a guardrail on the write task.
      - **Hierarchical variant:** delegation budget 4, turn limit 8, specialists cannot delegate (tests 6 to 9 pass).
        Recommendation: keep the sequential process - the subtasks are the same for every case, so a manager adds
        calls without adding adaptability.

      Evidence kept: the test run, `calls_by_role` output per test, the cost table, and the gap ticket.

  - id: mistakes
    kind: mistakes
    concepts: [multi-agent-tradeoffs, crew-agents-tasks-context, crew-processes-delegation, crew-deterministic-testing]
    title: Common mistakes and a debugging method
    body: |
      - **Agents as job titles.** Splitting by org chart rather than by independent work adds hand-offs and cost with
        nothing to show for it. Start from the single-agent baseline.
      - **Trusting the backstory.** "You never invent evidence" is a request. Check the output in code.
      - **Vague expected outputs.** "A good analysis" cannot be checked by anyone, including the next agent.
      - **Implicit context.** Relying on "the previous output" when a task needs an earlier one; or passing
        everything to everyone and paying for it on every call.
      - **Guardrails without limits, or limits without failure.** An unbounded retry loop burns tokens; passing the
        last bad output on after the limit spreads the error.
      - **Delegation without a budget.** Managers can loop, re-delegate the same work, or (MAST's "unaware of
        termination conditions") never stop. Budget, turn limit, specialists without delegation.
      - **Reviewer agents as the only check.** An LLM reviewer is another step with its own error rate; use code
        checks where possible and calibrate any LLM check.
      - **Order-dependent test scripts.** One shared script list breaks whenever a retry or a new task shifts the
        order. Route by role.
      - **Testing only the final answer.** The final letter can look fine while the analyst cited invented evidence
        that a later step happened to drop. Assert on hand-offs too.

      **Debugging method:** when a crew gives a wrong answer, walk the hand-offs from the first task: print each
      agent's prompt and output (`llm.calls` and `tasks_output`), find the **first** output that is wrong, and decide
      whether the cause was the input it received (context), its instructions (role, goal, expected output) or a
      missing check (guardrail). Fix that boundary, add a scripted test that reproduces it, then re-run the eval.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [multi-agent-tradeoffs, crew-processes-delegation]
    title: Trade-offs and alternatives
    body: |
      | Choice | Gains | Costs and limits |
      | --- | --- | --- |
      | One agent with tools | cheapest, one context, easiest to debug | one prompt does everything; limited by one context window |
      | Fixed workflow in code (prompt chain) | predictable, testable, cheap checks between steps | cannot adapt the steps to the input |
      | Sequential crew | separate prompts and tools per step, clear hand-offs | more prompt tokens; errors compound without checks |
      | Hierarchical crew (manager) | adapts the plan to the input | extra manager calls, non-deterministic flow, delegation loops, the manager is a single point of failure |
      | Parallel subagents (orchestrator-workers) | breadth, speed, more total context | about 15x the tokens of chat in Anthropic's report; synchronisation and duplicated work |
      | Code guardrails | near-certain for what they check, free | only checkable properties |
      | LLM guardrails or reviewer agents | judge open-ended quality | another error rate and cost; needs calibration |
      | A framework (CrewAI) | agents, tools, memory, processes, tracing out of the box | an abstraction over prompts you must still understand - "Building effective agents" warns that frameworks "can also make it tempting to add complexity when a simpler setup would suffice" |

      **Alternatives worth trying first:** a better single prompt with structured output; a router to specialised
      single agents; a prompt chain with code checks; parallel calls (not agents) for independent sub-questions.

  - id: summary
    kind: summary
    concepts: [multi-agent-tradeoffs, crew-agents-tasks-context, crew-processes-delegation, crew-deterministic-testing]
    title: Quick reference
    body: |
      - **Use several agents** for parallel, independent work, more reading than one context, or distinct tools; not
        when every step needs the same context. Start from a single-agent baseline.
      - **Cost:** every agent re-reads its context; here sequential 2.5x and hierarchical 7.6x one agent; Anthropic
        reports about 15x chat for its multi-agent research system.
      - **Compounding:** chain success = product of step success (0.9 four times = 0.656); code checks with retries
        restore it (0.914 at 80% catch, 2 retries).
      - **Agent** = role + goal + backstory (system prompt) + model + tools. **Task** = description + expected output
        + agent + context + guardrails.
      - **Context:** explicit lists; CrewAI's sequential process passes each output to the next task.
      - **Guardrails:** `(True, value)` or `(False, error)`; the error goes back to the agent; bounded retries
        (CrewAI default 3); fail after the limit.
      - **Sequential** = fixed order. **Hierarchical** = a manager (`manager_llm` or `manager_agent`) delegates,
        reviews and answers; add a delegation budget, a turn limit, specialists without delegation.
      - **Testing:** scripted models routed by role, unexpected calls fail, assert on hand-offs, guardrail feedback,
        limits and token budgets; evaluate real-model quality separately.

exercises:
  - id: crew-or-not
    type: mcq
    concept: multi-agent-tradeoffs
    skill: analysis
    title: Should this be a crew?
    prompt: |
      SandPay wants an assistant for merchant onboarding. For each application it must read the merchant's form
      (about 2 pages), check it against a 1-page policy, and answer "approve", "reject" or "ask for documents" with a
      reason. A colleague proposes five agents: Form Reader, Policy Expert, Risk Analyst, Decision Maker and Letter
      Writer, in a sequential crew. What do you recommend?
    options:
      - id: single
        text: Start with one agent (or a short prompt chain) with structured output and code checks, evaluate it, and add agents only if a measured gap appears that a split would fix.
        feedback: Correct - the input is small, every step needs the same facts, and nothing runs in parallel. Five hand-offs would multiply cost and error compounding for no clear gain.
      - id: five
        text: Five agents - specialisation always improves quality.
        feedback: Specialised prompts can help, but each hand-off can lose information and each step can fail; 0.95 per step over five steps is about 0.77 end to end. Show the gain against a baseline first.
      - id: hierarchical
        text: Five agents under a manager, so the plan can adapt to each application.
        feedback: The steps are the same for every application, so a manager adds calls and a non-deterministic flow without adding adaptability.
      - id: parallel
        text: Run the five agents in parallel to save time.
        feedback: The steps depend on each other (the decision needs the form reading and the policy check), so they cannot run in parallel.
    correct: [single]
    hints:
      - Does the work split into independent pieces, or does every step need the same two documents?
      - What does a five-step chain do to the end-to-end success rate?
    solution: |
      Multi-agent systems pay off for parallel, breadth-first work, more information than one context holds, or
      distinct tools. Here the context is small and shared, so a single agent with a JSON output and code checks is
      the baseline. If an eval shows a specific weakness (say, policy checks are missed), fix it with a targeted step
      - and measure again.

  - id: compounding-calc
    type: short
    concept: multi-agent-tradeoffs
    skill: application
    title: How reliable is the chain?
    prompt: |
      A sequential crew has three agents. On your eval set, the first is right 95% of the time, the second 90%, the
      third 98%. Assume independent errors. (a) What is the end-to-end success rate? (b) You add a code guardrail
      after the second agent that catches 80% of its wrong outputs and allows one retry. What is the second agent's
      effective success rate, and the new end-to-end rate? (c) Why is the independence assumption optimistic?
    modelAnswer: |
      (a) 0.95 * 0.90 * 0.98 = 0.838, about 84%.

      (b) One retry: q = p + (1 - p) * c * p = 0.90 + 0.10 * 0.8 * 0.90 = 0.972. End to end: 0.95 * 0.972 * 0.98 =
      0.905, about 90%.

      (c) A wrong hand-off is not independent noise: it becomes the next agent's input, so a wrong first step makes
      the later steps more likely to fail (or to build confidently on the error). Real chains are usually worse than
      the product, which is why checks at hand-offs matter.
    rubric:
      - Multiplies the step rates for (a) - about 0.84.
      - Applies the retry recurrence for (b) - 0.972 for the step, about 0.90 end to end.
      - Explains that errors propagate through hand-offs, so failures are correlated.
    hints:
      - The chain is right only if every step is right.
      - With one retry, the step is right if it is right first time, or wrong, caught, and right the second time.
    solution: |
      0.838 without the check; 0.972 for the checked step and 0.905 end to end with it. Independence ignores that a
      bad hand-off poisons the next step.

  - id: mini-crew-code
    type: coding
    concept: crew-agents-tasks-context
    skill: application
    title: Build the mini crew
    prompt: |
      In `mini_crew.py`, implement `agent_system_prompt`, `task_prompt` (with `<context>` blocks), `fill_inputs`,
      `run_task` (temperature 0, guardrails in order, the rejected answer and the feedback message appended on
      failure, `guardrail_max_retries` retries then `GuardrailError`, token usage added up) and `Crew.validate` /
      `Crew.kickoff` (sequential order, `{placeholder}` inputs, default and explicit context, `CrewOutput` with
      `token_usage`). The tests run a SandPay chargeback crew against one `ScriptedLLM` per agent and inspect every
      prompt each agent received.
    project: ai
    files:
      - exercises/agents/mini_crew.py
    test: tests/agents/test_mini_crew.py
    command: .venv/bin/python -m pytest tests/agents/test_mini_crew.py
    hints:
      - fill_inputs is one call to str.format_map - it already raises KeyError for a missing placeholder.
      - In run_task keep one messages list for the task; on a guardrail failure append the assistant's rejected text and the user feedback, then loop.
      - Each guardrail receives the TaskOutput; on success set output.value to what it returned before running the next one.
      - In kickoff, keep a dict of outputs by task name for explicit context and a list for the default (done[-1:]).
      - validate must run before any model call - the tests check llm.calls is empty for a broken crew.
    modelAnswer: |
      ```python
      def run_task(task, context, usage):
          agent = task.agent
          messages = [{"role": "user", "content": task_prompt(task, context)}]
          attempts = 0
          while True:
              attempts += 1
              reply = agent.llm.create(messages=messages, system=agent_system_prompt(agent),
                                       max_tokens=agent.max_tokens, temperature=0.0)
              usage["prompt_tokens"] += reply.input_tokens
              usage["completion_tokens"] += reply.output_tokens
              usage["calls"] += 1
              output = TaskOutput(task.name, agent.role, reply.text, reply.text, attempts)
              error = None
              for guardrail in task.guardrails:
                  ok, result = guardrail(output)
                  if not ok:
                      error = str(result)
                      break
                  output.value = result
              if error is None:
                  return output
              if attempts > task.guardrail_max_retries:
                  raise GuardrailError(task.name, error, attempts)
              messages += [
                  {"role": "assistant", "content": reply.text},
                  {"role": "user", "content": f"Your answer failed a check: {error}\nReturn a corrected answer."},
              ]
      ```

      `kickoff` validates, fills each task's text from the inputs, picks the context (`done[-1:]` when `context` is
      None, otherwise the named outputs in list order), calls `run_task`, and returns the last raw output with the
      task outputs and the usage plus `total_tokens`. The full solution is `solutions/agents/mini_crew.py`.
    solution: |
      The system prompt is the role, goal and backstory; the task prompt is description, expected output and fenced
      context. The retry loop keeps the rejected answer in the conversation, feeds the guardrail's error back, and
      raises after the limit so a bad output never reaches the next agent.
    rubric:
      - Every test in tests/agents/test_mini_crew.py passes.
      - Guardrail failure messages reach the agent verbatim, and the run fails after the retry limit.
      - Context is chosen per task (default previous, explicit list), not "everything so far".
      - You can explain which CrewAI attribute each of your fields corresponds to.
    followUp: |
      Add a `max_total_tokens` budget to `Crew`: stop the run with a clear error as soon as `token_usage` would exceed
      it. Which test would you write first, and what should happen to the outputs already produced?

  - id: guardrail-debug
    type: debug
    concept: crew-agents-tasks-context
    skill: analysis
    title: The guardrail that let invented evidence through
    prompt: |
      This guardrail runs on the analyst's task. In production a dispute response cited "EV-7", which was not in the
      case file, and another run sent the writer a JSON string instead of the parsed decision. `KNOWN` holds the case
      file's evidence ids. Click **every** line that causes one of these problems.
    language: python
    code: |
      def check_assessment(output):
          try:
              data = json.loads(output.raw)
          except json.JSONDecodeError:
              return False, "not valid JSON - return only the JSON object"
          cited = data.get("evidence", [])
          if any(e in KNOWN for e in cited):
              return True, output.raw
          return False, "cite evidence ids from the case file"
    correctLines: [7, 8]
    lineNotes:
      - line: 5
        note: An actionable error message that goes back to the agent - this line is fine.
      - line: 9
        note: The failure message is fine; the problem is that line 7 lets most bad outputs reach line 8.
    hints:
      - What does `any` return for ["EV-1", "EV-7"]?
      - What value does the guardrail hand on when it succeeds?
    solution: |
      - **Line 7** uses `any`, so one known id is enough: ["EV-1", "EV-7"] passes. Check that **all** cited ids are
        known (and list the unknown ones in the error so the agent can fix them).
      - **Line 8** returns `output.raw`, throwing away the parsed `data`; the next step gets a string. Return
        `True, data` so the guardrail validates **and** transforms.

  - id: context-mcq
    type: mcq
    concept: crew-agents-tasks-context
    skill: analysis
    title: The writer cannot see the delivery date
    prompt: |
      In a sequential crew - collect, assess, write - the writer's letters never mention the carrier's delivery date,
      though the collector always lists it. The writer task has no `context` set. In the recorded requests, the
      writer's prompt contains only the analyst's JSON decision. What is the cause and the fix?
    options:
      - id: context
        text: The default context is only the previous task's output; set the writer's context explicitly to the collect and assess tasks.
        feedback: Correct - the prompt shows exactly what the writer received. Make the hand-off explicit and add a test that the date reaches the writer's prompt.
      - id: backstory
        text: Add "always mention the delivery date" to the writer's backstory.
        feedback: The writer cannot mention what it never receives. The recorded prompt is the evidence.
      - id: max-tokens
        text: The writer's max_tokens is too low, so the date is cut off.
        feedback: Truncation would cut the end of the letter, and the prompt itself does not contain the date - the problem is the input, not the output length.
      - id: hierarchical
        text: Switch to the hierarchical process so the manager passes everything.
        feedback: A manager decides context at run time and may also forget it; explicit context in a sequential crew is simpler and testable.
    correct: [context]
    hints:
      - Look at the recorded request before changing any prompt.
    solution: |
      With `context=None` the mini crew (and CrewAI's description of the sequential process) passes the previous
      task's output. The writer needs the collector's output too: `context=[collect, assess]`. Then add a hand-off
      test - `assert_handed_off(calls, "delivered 2 Oct", "Dispute Writer")`.

  - id: kickoff-order
    type: order
    concept: crew-agents-tasks-context
    skill: recall
    title: What happens in a sequential kickoff
    prompt: Put the steps of `Crew.kickoff` in the mini crew in the order they happen for a crew of tasks.
    items:
      - id: validate
        text: Validate the crew - every task has an agent from the crew, names are unique, context only names earlier tasks
      - id: fill
        text: Fill the task's description and expected output from the inputs
      - id: pick-context
        text: Pick the task's context - the previous output, or exactly the listed tasks' outputs
      - id: call
        text: Call the agent's model with the system prompt and the task prompt
      - id: guard
        text: Run the task's guardrails in order; on failure send the error back and retry, up to the limit
      - id: store
        text: Store the TaskOutput and add the call's tokens to the usage
      - id: result
        text: After the last task, return the CrewOutput with every task output and the token usage
    hints:
      - Nothing may call a model before the crew is known to be valid.
    solution: |
      Validate first (so a broken crew costs nothing), then per task - fill inputs, pick context, call, guard
      (retrying), store - and finally return the CrewOutput.

  - id: crew-manager-code
    type: coding
    concept: crew-processes-delegation
    skill: application
    title: A manager that delegates under a budget
    prompt: |
      In `crew_manager.py`, implement `delegate` (match the coworker by role, ignoring case; unknown coworker,
      missing arguments and a failing coworker call come back as error text, never as exceptions; coworkers get no
      tools), `run_manager_task` (the manager loop: answer every tool call with a `tool_result` block, count every
      delegation against `max_delegations`, stop at `max_turns`, run the task's guardrails on the final answer) and
      `kickoff_hierarchical` (a manager is required; task agents are ignored; context as in the mini crew). The
      prompt helpers are given. The tests script the manager's tool calls and check every message it receives.
    project: ai
    files:
      - exercises/agents/crew_manager.py
    test: tests/agents/test_crew_manager.py
    command: .venv/bin/python -m pytest tests/agents/test_crew_manager.py
    hints:
      - "The assistant message for a tool call is {'role': 'assistant', 'content': reply.content} - keep the tool_use blocks so ids match."
      - All results of one manager reply go back in ONE user message, one tool_result block per call, in order.
      - Check the budget before calling delegate, and count the delegation even when delegate returns an error.
      - Catch LLMError only around the coworker's create call.
    modelAnswer: |
      ```python
      def delegate(call, coworkers, usage):
          args = call.get("input", {})
          name = str(args.get("coworker", ""))
          match = [a for a in coworkers if a.role.strip().casefold() == name.strip().casefold()]
          if not match:
              return f"unknown coworker '{name}'; choose one of: {', '.join(a.role for a in coworkers)}", True, None
          worker = match[0]
          if not args.get("task") or not args.get("context"):
              return "delegate_work needs coworker, task and context", True, None
          try:
              reply = worker.llm.create(messages=worker_messages(args["task"], args["context"]),
                                        system=f"You are {worker.role}.\nYour goal: {worker.goal}\n{worker.backstory}",
                                        max_tokens=worker.max_tokens, temperature=0.0)
          except LLMError as exc:
              return f"coworker {worker.role} failed: {exc}", True, worker.role
          _add_usage(usage, reply)
          return reply.text, False, worker.role
      ```

      `run_manager_task` is the loop shown in the lesson plus the guardrail retry from `run_task`; the full solution
      is `solutions/agents/crew_manager.py`.
    solution: |
      Errors become tool results the manager can act on; limits (budget, turns, no tools for coworkers) are enforced
      in code; every tool call gets exactly one result matched by id; the final answer passes the task's guardrails.
    rubric:
      - Every test in tests/agents/test_crew_manager.py passes.
      - No delegation problem (unknown coworker, bad arguments, coworker failure, budget) raises out of the loop.
      - Coworkers cannot delegate, and the manager cannot run forever.
      - You can say how the same limits are configured in CrewAI (allow_delegation, max_iter) and which ones you would still enforce yourself.
    followUp: |
      Add CrewAI's second collaboration tool, `ask_question(coworker, question, context)`, that does not count
      against the delegation budget but has its own limit. What test shows the two budgets are independent?

  - id: process-choice
    type: mcq
    concept: crew-processes-delegation
    skill: application
    title: Sequential or hierarchical?
    prompt: |
      Two SandPay projects. (1) Monthly merchant statements: for each merchant, summarise payouts, explain fees and
      flag anomalies - always these three steps. (2) Investigating unusual merchant activity: depending on what the
      first findings show, the investigation may need transaction analysis, web research on the merchant, a sanctions
      list lookup, or none of these. Which processes fit?
    options:
      - id: seq-hier
        text: (1) sequential - the steps are fixed; (2) a manager that decides which specialists to involve, with a delegation budget and turn limit.
        feedback: Correct - the hierarchical (orchestrator-workers) pattern fits when the subtasks depend on the input, and it needs limits in code.
      - id: hier-both
        text: Hierarchical for both - a manager always improves quality.
        feedback: For fixed steps a manager only adds calls, cost and a non-deterministic flow.
      - id: seq-both
        text: Sequential for both - list all four investigation steps and always run them.
        feedback: That works but runs (and pays for) every specialist on every case; it is a valid baseline, but the input-dependent subtasks are what the manager is for.
      - id: hier-seq
        text: (1) hierarchical, (2) sequential.
        feedback: Reversed - fixed steps suit a fixed order; unknown subtasks suit a planner.
    correct: [seq-hier]
    hints:
      - Can you write down the steps of each project before seeing the input?
    solution: |
      "Building effective agents" describes orchestrator-workers as fitting "complex tasks where you can't predict
      the subtasks needed". Statements have predictable steps (sequential); investigations do not (manager), with a
      budget, a turn limit and specialists that cannot delegate.

  - id: delegation-debug
    type: debug
    concept: crew-processes-delegation
    skill: analysis
    title: Why did the manager run up a large bill?
    prompt: |
      This manager loop ran for 40 minutes on one case and called coworkers 200 times. The logs show it repeatedly
      delegating to "Researcher", which is not a coworker, and coworkers delegating back to the manager. Click
      **every** line that allowed this.
    language: python
    code: |
      def run(manager_llm, task, coworkers, max_delegations=4):
          messages = [{"role": "user", "content": task}]
          delegations = 0
          while True:
              reply = manager_llm.create(messages=messages, tools=[DELEGATE_TOOL])
              if reply.stop_reason != "tool_use":
                  return reply.text
              messages.append({"role": "assistant", "content": reply.content})
              results = []
              for call in reply.tool_calls:
                  worker = find(coworkers, call["input"]["coworker"]) or coworkers[0]
                  text = worker.run(call["input"]["task"], tools=[DELEGATE_TOOL])
                  results.append({"type": "tool_result", "tool_use_id": call["id"], "content": text})
              messages.append({"role": "user", "content": results})
    correctLines: [4, 11, 12]
    lineNotes:
      - line: 3
        note: The counter exists but is never incremented or checked - the fix belongs in the loop (line 10-12 area) and the loop condition.
      - line: 13
        note: One tool_result per call, matched by id, is correct.
    hints:
      - What stops the loop if the manager never gives a final answer?
      - What happens when the manager names a coworker that does not exist?
      - What can a coworker do with the tools it is given?
    solution: |
      - **Line 4** `while True` has no turn limit, and `max_delegations` is never enforced - bound the loop and count
        delegations.
      - **Line 11** silently falls back to the first coworker for an unknown name, so "Researcher" never gets an
        error and the manager keeps asking. Return an `is_error` result listing the valid roles.
      - **Line 12** gives coworkers the delegate tool, so they delegate back - the loop CrewAI's docs describe;
        specialists get no delegation tool (`allow_delegation=False`).

  - id: crew-harness-code
    type: coding
    concept: crew-deterministic-testing
    skill: application
    title: Tools for testing a crew
    prompt: |
      In `crew_harness.py`, implement `role_router` (a ScriptedLLM script function that answers each request from
      the calling role's own reply list and fails loudly on an unexpected role or an exhausted list), `calls_by_role`
      (calls and prompt tokens per role from `llm.calls`), `assert_handed_off` (the index of the first call by a role
      whose prompt contains a text), `chain_success` and `chain_success_with_checks` (the compounding arithmetic).
      `role_of` is given. One test checks the retry formula against a seeded simulation.
    project: ai
    files:
      - exercises/agents/crew_harness.py
    test: tests/agents/test_crew_harness.py
    command: .venv/bin/python -m pytest tests/agents/test_crew_harness.py
    hints:
      - Copy each role's list into your own queue when the router is created, so the caller's dict is not changed.
      - ScriptedLLM calls a callable step with the request; return the next step for that role (it may itself be a dict or a callable).
      - Message content may be a string or a list of blocks; read "text" or "content" from each block.
      - "Retry recurrence: q = p; repeat `retries` times: q = p + (1 - p) * catch_rate * q; the chain is q ** steps."
    modelAnswer: |
      ```python
      def role_router(replies):
          queues = {role: list(steps) for role, steps in replies.items()}

          def step(request):
              role = role_of(request.system)
              if role not in queues:
                  raise AssertionError(f"unexpected call from role {role!r}")
              if not queues[role]:
                  raise AssertionError(f"no scripted replies left for role {role!r}")
              return queues[role].pop(0)

          return step


      def chain_success_with_checks(p, steps, catch_rate, retries):
          if not (0.0 <= p <= 1.0 and 0.0 <= catch_rate <= 1.0) or steps < 1 or retries < 0:
              raise ValueError("p and catch_rate in [0, 1], steps >= 1, retries >= 0")
          q = p
          for _ in range(retries):
              q = p + (1 - p) * catch_rate * q
          return q ** steps
      ```

      Routing by role makes each agent's script independent of the others, so adding a retry or a task does not
      shift every reply. The full solution is `solutions/agents/crew_harness.py`.
    solution: |
      A role-keyed script with loud failures, per-role call and token summaries from the recorded requests, a
      hand-off assertion that names whether the role was called at all, and the compounding formulas.
    rubric:
      - Every test in tests/agents/test_crew_harness.py passes.
      - An unexpected call fails the test instead of returning a default reply.
      - You can explain why a single shared script list makes crew tests brittle.
    followUp: |
      Write a test for the hierarchical crew with `role_router` for the coworkers and a separate scripted manager,
      asserting that the analyst's prompt contains the collector's evidence only if the manager passed it in
      `context`. What does the test tell you about who is responsible for hand-offs in a hierarchical crew?

  - id: crew-test-plan
    type: testdesign
    concept: crew-deterministic-testing
    skill: application
    title: A test plan for the chargeback crew
    prompt: |
      Design the automated tests for the three-agent sequential chargeback crew (collect, assess with JSON and
      evidence-id guardrails, write with a 60-word guardrail and context [collect, assess]) before it goes live. Give
      at least six cases with preconditions, steps, expected result **and the evidence** you would assert on. Say
      what these tests cannot tell you.
    modelAnswer: |
      Preconditions for all: every agent's model is a `ScriptedLLM` routed by role; unexpected calls fail.

      1. **Happy path.** Script one good reply per role. Expected: three tasks in order, the writer's prompt contains
         the collector's EV lines and the analyst's JSON. Evidence: `assert_handed_off`, `tasks_output` order.
      2. **Fenced JSON.** Analyst's first reply in a code fence, second clean. Expected: one retry with the "not valid
         JSON" feedback, `attempts == 2`. Evidence: the third message of the analyst's second request.
      3. **Invented evidence on every attempt.** Expected: `GuardrailError` after 3 analyst calls, writer never
         called. Evidence: exception, `calls_by_role` has no Dispute Writer.
      4. **Over-long letter.** Writer's first reply 80 words. Expected: retry with "80 words, the limit is 60".
         Evidence: feedback message.
      5. **Broken wiring.** A task whose context names a later task. Expected: `ValueError`, no model calls.
         Evidence: `llm.calls == []`.
      6. **Missing input.** `kickoff` without `case_id`. Expected: `KeyError` naming it before any call.
      7. **Budget.** Expected: total calls at most 3 without retries and at most 3 + retries with them; prompt tokens
         under the agreed budget. Evidence: `token_usage`.

      **What they cannot tell you:** whether a real model decides correctly or writes a convincing letter. That needs
      an eval on recorded cases with real replies (and a single-agent baseline for comparison), graded in code where
      possible.
    rubric:
      - Uses scripted models routed by role and makes unexpected calls fail.
      - Covers hand-offs, both guardrails (retry and give-up), wiring validation and the cost budget.
      - Names concrete evidence for each case (recorded prompts, call counts, exceptions, usage).
      - States that real-model quality needs a separate eval.
    hints:
      - Think of each boundary - inputs to kickoff, task to task, agent to guardrail - and one failure at each.
    solution: |
      Fix every model with a role-routed script, then test each boundary: hand-offs, both guardrails (retry and
      give-up), wiring and inputs before any call, and the call and token budget. Quality of real replies is an eval,
      not a unit test.

  - id: crew-interview
    type: interview
    concept: multi-agent-tradeoffs
    skill: analysis
    title: "Interview: would you build it as a multi-agent system?"
    prompt: |
      "Our team built a five-agent CrewAI crew for customer support triage. It costs a lot and sometimes gives
      answers that contradict the knowledge base. How would you evaluate whether it should stay multi-agent, and how
      would you make it more reliable?"
    modelAnswer: |
      **Measure first.** Build an eval set from real tickets with expected outcomes; run the crew and a single-agent
      baseline (one prompt, same tools, structured output) on it; compare accuracy, contradiction rate and cost per
      ticket (calls and tokens per agent, which CrewAI reports in its usage metrics). If the crew is not clearly
      better, simplify - multi-agent systems pay off for parallel, breadth-first work or more context than one agent
      holds, and cost many times more tokens.

      **Find where the contradictions start.** Trace a failing ticket hand-off by hand-off and find the first wrong
      output. MAST's categories help: a specification problem (vague role or expected output), misalignment (the
      knowledge-base excerpt never reached the answering agent), or missing verification.

      **Make it reliable.** Explicit context per task; expected outputs a program can check; code guardrails at the
      hand-offs (for example every cited article id must exist in the retrieved set) with bounded retries; a
      sequential process unless the subtasks really vary; delegation off for specialists, a budget and turn limit if
      a manager stays. Then regression tests with scripted models routed by role, and the eval on every change.
    rubric:
      - Insists on a baseline and an eval before deciding.
      - Reports cost per ticket and per agent, not only accuracy.
      - Debugs by finding the first wrong hand-off.
      - Proposes code checks at hand-offs and limits on delegation.
      - Separates deterministic tests of the crew's code from evals of model quality.
    followUps:
      - What would make you choose the hierarchical process for this crew?
      - How would you test a guardrail that uses an LLM instead of code?
      - The crew is 3 points more accurate and 6 times the cost. How do you decide?
    hints:
      - Start with what you would measure, then where you would look, then what you would change.
    solution: |
      Baseline and eval first (quality and cost), trace failures to the first bad hand-off, then explicit context,
      checkable outputs, code guardrails, a simpler process and delegation limits - with deterministic tests and evals
      kept separate.

placement:
  - id: place-tradeoffs
    type: mcq
    concept: multi-agent-tradeoffs
    skill: analysis
    title: Where several agents earn their cost
    prompt: Which task is the best fit for several cooperating agents rather than one?
    options:
      - id: breadth
        text: Compiling a report on 40 payment providers' public dispute policies, where each provider's documents must be read separately and the findings combined.
        feedback: Correct - independent, parallel reading that exceeds one context window is where separate agents with their own contexts help.
      - id: refund
        text: Answering a merchant's question about one refund using a 1-page policy.
        feedback: Small, shared context and no parallel work - one agent is cheaper and has fewer hand-offs to fail.
      - id: format
        text: Converting a CSV of payouts into JSON.
        feedback: That is deterministic code, not even a single agent.
      - id: classify
        text: Classifying support messages into five intents.
        feedback: One call with structured output (or a classifier) does this; extra agents only add cost.
    correct: [breadth]
    hints:
      - Look for work that splits into independent pieces too large for one context.
    solution: |
      Breadth-first work with many independent pieces of reading is the case Anthropic's article reports as a strong
      fit; small, shared-context tasks are better done by one agent or plain code.

  - id: place-guardrail
    type: mcq
    concept: crew-agents-tasks-context
    skill: application
    title: Stopping an invented fact at the hand-off
    prompt: |
      In a crew, an analyst agent sometimes cites evidence ids that do not exist, and the writer agent then quotes
      them. What is the most reliable fix?
    options:
      - id: code-guardrail
        text: A code guardrail on the analyst's task that compares cited ids with the case file, returns the unknown ids as an error for a bounded number of retries, and fails the run after the limit.
        feedback: Correct - checked in code against the source of truth, before the next agent sees the output.
      - id: backstory
        text: Add "never invent evidence" to the analyst's backstory.
        feedback: A backstory is prompt text; it lowers the rate, it does not stop it.
      - id: reviewer
        text: Add a Reviewer agent between the analyst and the writer.
        feedback: Another model step with its own error rate and cost; code can check this property exactly.
      - id: writer-check
        text: Tell the writer to ignore ids it does not recognise.
        feedback: The writer has no reliable way to know which ids are real - and the bad output has already crossed the boundary.
    correct: [code-guardrail]
    hints:
      - Which check can be done exactly, without a model?
    solution: |
      Validate at the hand-off, in code, against the case file; send actionable errors back; stop after the retry
      limit so the error never compounds downstream.

  - id: place-process
    type: mcq
    concept: crew-processes-delegation
    skill: analysis
    title: A manager that will not stop
    prompt: |
      A hierarchical crew's manager sometimes delegates the same work again and again, and specialists sometimes
      delegate back to each other. Which change addresses both in a way you can test?
    options:
      - id: limits
        text: Enforce a delegation budget and a turn limit in code, return unknown coworkers as errors, and give specialists no delegation ability.
        feedback: Correct - limits outside the model hold even when the manager misbehaves, and each one can be tested with a scripted manager.
      - id: prompt
        text: Tell the manager in its prompt to delegate at most four times.
        feedback: Helpful, but not enforced; a scripted test of a manager that ignores it would still loop.
      - id: bigger
        text: Use a larger model for the manager.
        feedback: May reduce the rate; it does not bound the cost or stop loops.
      - id: more-agents
        text: Add a supervisor agent above the manager.
        feedback: More coordination layers add calls and failure points rather than limits.
    correct: [limits]
    hints:
      - Assume the manager will misbehave. What still stops it?
    solution: |
      Budgets, turn limits, error results and no delegation for specialists are enforced by code and tested with a
      scripted manager that misbehaves on purpose.

  - id: place-testing
    type: mcq
    concept: crew-deterministic-testing
    skill: application
    title: Making crew tests stable
    prompt: |
      Your crew tests use one ScriptedLLM with a single list of replies for all agents. Every time a guardrail retry
      is added or a task moves, many tests break although the behaviour is right. What do you change?
    options:
      - id: route
        text: Route scripted replies by the calling agent's role, so each agent has its own reply list, and make unexpected calls fail.
        feedback: Correct - each agent's script is independent of the call order between agents.
      - id: real-model
        text: Use a real model at temperature 0 in the tests.
        feedback: Costs money, needs a network and is still not guaranteed to be stable; unit tests of the crew's code should be offline and exact.
      - id: final-only
        text: Assert only on the final answer and ignore the intermediate calls.
        feedback: Hides broken hand-offs; the order problem remains for the replies themselves.
      - id: default
        text: Make the fake return a default reply when the script runs out.
        feedback: Silent defaults hide unexpected calls - exactly the bugs crew tests should catch.
    correct: [route]
    hints:
      - What makes the reply an agent receives depend on other agents' calls?
    solution: |
      A role-routed script decouples agents' scripts from the global call order; loud failures on unexpected calls
      keep the tests honest.

recall:
  - id: recall-when
    concept: multi-agent-tradeoffs
    prompt: When do several agents help, and when do they hurt?
    answer: They help for parallel, breadth-first work, information that exceeds one context window, or many distinct tools. They hurt when every step needs the same context or depends on the others - they multiply tokens (Anthropic reports about 15x chat), add hand-offs where information is lost, and compound errors. Start from a single-agent baseline and an eval.
  - id: recall-compounding
    concept: multi-agent-tradeoffs
    prompt: How do errors compound in a chain of agents, and what restores reliability?
    answer: With independent steps the chain succeeds with the product of the step rates - four steps at 0.9 give 0.656 - and real hand-offs are worse because errors feed the next step. Checks between steps with retries restore it (80% catch, 2 retries gives 0.914); code checks are best where possible.
  - id: recall-agent-task
    concept: crew-agents-tasks-context
    prompt: What makes up an agent and a task in a crew?
    answer: An agent is a role, goal and backstory (its system prompt), a model, tools and limits. A task is a description, an expected output written so it can be checked, the assigned agent, explicit context (which earlier outputs it receives) and guardrails.
  - id: recall-guardrails
    concept: crew-agents-tasks-context
    prompt: How does a task guardrail work in CrewAI and in the mini crew?
    answer: A function receives the task output and returns (True, value) - possibly transformed - or (False, error). On failure the error goes back to the agent, which tries again, up to guardrail_max_retries (CrewAI default 3); the mini crew then raises GuardrailError so a bad output never reaches the next agent. Several guardrails run in order, each on the previous one's result.
  - id: recall-processes
    concept: crew-processes-delegation
    prompt: Compare the sequential and hierarchical processes.
    answer: Sequential runs the tasks in a fixed order, passing outputs on as context - predictable and testable. Hierarchical gives the tasks to a manager (manager_llm or manager_agent) that delegates to coworkers, reviews and answers - adaptive, but with extra manager calls, a non-deterministic flow and the risk of loops.
  - id: recall-delegation-limits
    concept: crew-processes-delegation
    prompt: Which limits does delegation need, and where are they enforced?
    answer: In code - a delegation budget that also counts failed delegations, a turn limit on the manager, unknown coworkers and failing coworkers returned as error results, and specialists without delegation (allow_delegation=False in CrewAI, which is the default).
  - id: recall-testing
    concept: crew-deterministic-testing
    prompt: How do you test a crew deterministically?
