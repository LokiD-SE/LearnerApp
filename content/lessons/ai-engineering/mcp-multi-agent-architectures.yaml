id: mcp-multi-agent-architectures
title: Multi-server and multi-agent MCP architectures
subject: ai-engineering
module: model-context-protocol
level: advanced
status: published
estimatedMinutes: 135
summary: Run one AI application against many MCP servers at once - one client per server, a single tool list for the model with namespaced names, calls routed back to the right server, partial results when one server is down, progress and cancellation tracked per request across servers, and agents placed behind MCP servers. Built from the MCP specification revision 2026-07-28 (the stateless revision) in plain Python; every output shown was printed by the code shown, against in-process fake servers.
