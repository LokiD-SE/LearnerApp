id: python-numpy-pandas
title: Python, NumPy and pandas for machine learning
subject: ai-engineering
module: ml-foundations
level: beginner
status: published
estimatedMinutes: 80
summary: The toolkit under every machine learning lesson - NumPy arrays, dtypes, shapes and axes, broadcasting, vectorised maths with real timings, boolean masks and views versus copies; then pandas DataFrames, missing values, groupby and joins, and the two pandas 3 changes that break old code - Copy-on-Write and the new str dtype. Every output shown was produced by the code next to it.
