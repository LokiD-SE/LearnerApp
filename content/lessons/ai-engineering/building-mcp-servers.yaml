id: building-mcp-servers
title: Building an MCP server
subject: ai-engineering
module: model-context-protocol
level: advanced
status: published
estimatedMinutes: 150
summary: Build SandPay's ledger MCP server by hand from the 2026-07-28 specification - tools with input and output schemas, the two error paths (JSON-RPC protocol errors and isError tool results), cursor pagination and cache hints, resources and URI templates, prompts, change notifications over subscriptions/listen, the stateless per-request _meta envelope and server/discover, and a newline-delimited stdio transport tested as a real subprocess. The official Python SDK (MCPServer, formerly FastMCP) and the MCP Inspector are quoted from their documentation.
