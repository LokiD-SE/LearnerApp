id: llm-apis-and-structured-output
title: LLM APIs, streaming and structured output
subject: ai-engineering
module: genai-engineering
level: intermediate
status: published
estimatedMinutes: 120
summary: Call a hosted large language model like any other unreliable, metered remote API - build the messages request (system prompt, roles, max_tokens), read the stop reason and token usage, assemble a streamed reply from its events, retry 429 and overload errors with retry-after and exponential backoff with jitter (and never retry a 400), get JSON you can trust by parsing, validating and repairing it, and count tokens and cost. Runnable code uses an offline scripted fake model; every provider fact (Anthropic Messages API, OpenAI Responses API) is quoted from the official documentation as read on 14 November 2026 and labelled as provider-specific.
tags:
