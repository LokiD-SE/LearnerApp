id: logistic-regression-classification
title: Logistic regression and classification
subject: ai-engineering
module: ml-foundations
level: intermediate
status: published
estimatedMinutes: 80
summary: How a linear model becomes a classifier - the sigmoid, probabilities, log-odds and decision boundaries; why we train with cross-entropy (maximum likelihood) and not squared error; softmax for many classes and the log-sum-exp trick that keeps it from overflowing; and scikit-learn's LogisticRegression in practice - scaling, the C parameter, solvers, class weights and choosing a threshold from costs. Every output shown was produced by running the code.
