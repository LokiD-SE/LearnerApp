id: mcp-architecture
title: MCP architecture - hosts, clients and servers
subject: ai-engineering
module: model-context-protocol
level: intermediate
status: published
estimatedMinutes: 120
summary: How the Model Context Protocol connects an AI application to tools and data - the host that owns the conversation and the user's consent, one client per server, and servers that expose tools, resources and prompts. Covers the two layers (JSON-RPC 2.0 data layer, stdio or Streamable HTTP transport), the stateless per-request metadata and server/discover of protocol version 2026-07-28, who controls each primitive, how a server asks the user for input with multi round-trip requests, and opt-in notifications. Every message shown was produced by a small plain-Python host and fake SandPay servers from the practice project.
