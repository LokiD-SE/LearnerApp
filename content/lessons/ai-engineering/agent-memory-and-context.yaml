id: agent-memory-and-context
title: Agent memory and context management
subject: ai-engineering
module: ai-agents
level: advanced
status: published
estimatedMinutes: 140
summary: Give a SandPay merchant-support agent a memory you can test - a conversation buffer that folds old turns into a running summary only when the summary is complete, tool results that are cut to their first and last lines or cleared once they are old, a long-term store per merchant ranked by recency, importance and relevance as in the Generative Agents paper, and a guard that redacts personal data, holds poisoned writes for review and forgets on request. Every number shown was produced by the code shown, against an offline scripted model and toy embeddings; the providers' memory tool, context editing and compaction features are quoted from their documentation and labelled.
