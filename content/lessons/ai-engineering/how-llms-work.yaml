    PyTorch,
  ]

environment: |
  - **Runtime and libraries:** Python 3.12.3, **PyTorch 2.15.0+cpu** and NumPy 2.5.4 in `practice/ai/.venv`. Every
    output in this lesson was printed by the code shown (or by the scratch script it is an excerpt of), run on Linux
    on 14 November 2026 with `OMP_NUM_THREADS=2 MKL_NUM_THREADS=2`. Every random step has a fixed seed, so the values
    are reproducible; **timings are from a shared machine and only a rough guide**.
  - **The tiny model is illustrative scale.** A 111,271-parameter, 2-layer character-level transformer trained on
    235 thousand characters is about a million times smaller than the models it explains. It shows the mechanisms
    (the objective, the loss floor, instruction tuning, the window, sampling), not the abilities of a real LLM.
  - **Synthetic data only:** a SandPay event log (SandPay is a fictional payments company) generated in the script
    from templates such as `payment 4350 declined at pixel games: suspected fraud.` with a fixed seed. Merchants,
    ids and reasons are invented. Nothing is downloaded.
  - **Papers (primary sources, quotations checked against the arXiv PDFs):** Brown et al., [*Language Models are
    Few-Shot Learners*](https://arxiv.org/abs/2005.14165) (GPT-3, 2020) - abstract, section 1 (in-context learning),
    section 2 (175 billion parameters, `nctx = 2048`, 300 billion training tokens), section 3.9.2 (BPE "on average
    ~0.7 words per token"); Ouyang et al., [*Training language models to follow instructions with human
    feedback*](https://arxiv.org/abs/2203.02155) (InstructGPT, 2022) - abstract, Figure 2 (SFT, reward model, PPO),
    the "alignment tax" and PPO-ptx; Holtzman et al., [*The Curious Case of Neural Text
    Degeneration*](https://arxiv.org/abs/1904.09751) (ICLR 2020) - abstract, section 3.1, equation 2 (the top-p
    vocabulary), section 3.2-3.3 (top-k and temperature); Kaplan et al., [*Scaling Laws for Neural Language
    Models*](https://arxiv.org/abs/2001.08361) (2020) - abstract; Hoffmann et al., [*Training Compute-Optimal Large
    Language Models*](https://arxiv.org/abs/2203.15556) (Chinchilla, 2022) - abstract; Sennrich, Haddow and Birch,
    [*Neural Machine Translation of Rare Words with Subword Units*](https://arxiv.org/abs/1508.07909) (BPE, 2016).
  - **Provider documentation (provider-specific, as documented on 14 November 2026 - check the current pages):**
    Anthropic [Context windows](https://platform.claude.com/docs/en/build-with-claude/context-windows), [Token
    counting](https://platform.claude.com/docs/en/build-with-claude/token-counting) and [Migrating to API version
    2026-10-21](https://platform.claude.com/docs/en/api/migration-2026-10-21) (sampling parameters removed); OpenAI
    [Conversation state - managing the context window](https://developers.openai.com/api/docs/guides/conversation-state)
    and the [Create a response API reference](https://developers.openai.com/api/reference/resources/responses/methods/create)
    (`temperature`, `top_p`, `max_output_tokens`, `truncation`). No API was called: nothing in this lesson is a
    response from a hosted model, and no prices are quoted.
  - **Practice code:** `practice/ai` exercises `genai/next_token.py`, `genai/sampling.py` and
    `genai/context_budget.py` (NumPy and the offline `support/llm_fake.py` - no key, no network).
  - **Not repeated here:** tokenising, vocabularies and learning BPE merges ([Sequence models, RNNs and word
    embeddings](#/lesson/sequence-models-and-embeddings), exercise `deep_learning/tokens.py`), attention, causal masks
    and the transformer block ([Attention and transformers](#/lesson/attention-and-transformers)), softmax and
    cross-entropy ([Neural networks and backpropagation](#/lesson/neural-networks-and-backprop)).

prerequisites:
  - sequence-models-and-embeddings
  - attention-and-transformers

concepts:
  - id: next-token-prediction
    name: Tokens and next-token prediction
    summary: An LLM reads and writes tokens - pieces of text from a fixed vocabulary, usually subwords learned by byte-pair encoding - and the tokenizer decides what one token is, so counts differ between providers and models. The model has one job, to output a probability distribution over the next token given the tokens so far; it is trained on (input, input shifted by one) pairs with cross-entropy loss, whose exponential is the perplexity. Text is generated autoregressively, one token at a time, each new token appended to the input. The data sets a loss floor that no model can beat; a loss below it means the target leaked into the input.
  - id: pretraining-and-instruction-tuning
    name: Pretraining and instruction tuning
    summary: Pretraining runs next-token prediction over a huge text corpus and produces a base model that continues text - it has learned the patterns of the corpus and, at scale, can follow a task shown in its prompt (in-context learning), but it does not answer questions by default. Instruction tuning then fine-tunes it on prompt-response demonstrations (supervised fine-tuning, with the loss only on the response) and, in InstructGPT, on human preference rankings through a reward model and reinforcement learning. It changes behaviour and format far more than knowledge, and fine-tuning on a narrow set can make the model forget its pretraining distribution unless pretraining data is mixed back in.
  - id: context-window
    name: The context window
    summary: The context window is the maximum number of tokens one request can use - the system prompt, every message, tool definitions and the reply being generated all count. The model sees nothing outside it, keeps no memory between requests, and a model with learned positions cannot even process a longer input. Applications must budget input plus max output tokens, decide what to drop or summarise when a conversation grows, and detect replies cut off by the output limit. Sizes, counting and overflow behaviour are provider- and model-specific.
  - id: decoding-and-sampling
    name: Decoding - temperature, top-k and top-p
    summary: The model outputs logits; decoding turns them into a token. Greedy decoding takes the most likely token and tends to repeat itself. Sampling draws from softmax(logits / T) - temperature below 1 sharpens the distribution, above 1 flattens it and lets the unreliable tail through. Top-k keeps the k most likely tokens; top-p (nucleus sampling) keeps the smallest set whose probability reaches p, so its size adapts to how confident the model is. Sampling makes outputs vary between runs, so tests check properties rather than exact strings. Which of these parameters an API accepts is provider- and version-specific.

objectives:
  - Explain what a token is, compare character, word and BPE tokenisations of the same text, and say why token counts must be measured with the target model's tokenizer.
  - Build next-token training pairs, compute cross-entropy and perplexity, and use the data's loss floor to recognise a target leak.
  - Trace how a base model becomes an instruction-following model (pretraining, supervised fine-tuning with a masked loss, preference tuning) and predict how each stage changes the model's behaviour.
  - Budget a request against a context window (input plus output), trim a conversation to fit, and detect a reply truncated by the output limit.
  - Compute the effect of temperature, top-k and top-p on a real distribution, implement them, and choose decoding settings for a task.

sections:
  - id: intuition
    kind: intuition
    concepts: [next-token-prediction, context-window, decoding-and-sampling]
    title: The idea in plain language
    body: |
      A new SandPay support engineer is handed the event log and asked to guess, one character at a time, how each
      line continues. After reading a few thousand lines they get good at it: after `payment 4721 ` the next letter
      is almost always `a` (approved) and sometimes `d` (declined); after `declined at metro taxi: ` it is the start
      of one of three reasons; after `refund 8` it is any digit - there is nothing to learn about ids.

      A large language model is that guesser, scaled up enormously:

      - it reads text as **tokens** (pieces of words) and, for every position, outputs a **probability for every
        possible next token**;
      - it learned those probabilities by **pretraining** - guessing the next token over a vast amount of text and
        being corrected every time;
      - it writes by guessing, **choosing** one token from the probabilities, appending it, and guessing again -
        so "how to choose" (**sampling**) is a separate decision from "what the probabilities are";
      - it can only look at a fixed number of recent tokens, its **context window**; anything older is simply not
        there;
      - a model that has only been pretrained continues text. Turning it into an assistant that answers questions
        takes a second round of training on examples of the behaviour you want (**instruction tuning**).

      Everything else in this lesson is those five sentences made precise, on a model small enough that you can
      watch each one happen.

  - id: what
    kind: what
    concepts: [next-token-prediction, pretraining-and-instruction-tuning, context-window, decoding-and-sampling]
    title: The vocabulary
    body: |
      | Term | Meaning |
      | --- | --- |
      | **Token** | One unit of the model's input and output: a character, a whole word, or (usually) a subword piece. |
      | **Tokenizer / vocabulary** | The fixed mapping between text and token ids, decided before training. Each model family has its own. |
      | **Logits** | The model's raw score for every token in the vocabulary at one position. `softmax(logits)` gives probabilities. |
      | **Language model** | A model of `P(next token | previous tokens)`. Multiplying these gives the probability of a whole text. |
      | **Autoregressive** | Generates one token at a time and feeds each output back in as input. GPT-3 is described as "an autoregressive language model with 175 billion parameters". |
      | **Pretraining** | Training on a large unlabelled corpus with the next-token objective. The result is a **base model**. |
      | **Cross-entropy loss / perplexity** | The mean `-ln P(correct next token)`, in nats; perplexity is `exp(loss)`. |
      | **In-context learning** | A model doing a task from instructions or examples in its prompt, with no weight updates (term from the GPT-3 paper). |
      | **Instruction tuning** | Fine-tuning a base model on demonstrations of the desired behaviour (supervised fine-tuning, **SFT**), often followed by learning from human preferences (**RLHF**). |
      | **Context window** | The most tokens one request can use - input and output together. |
      | **Decoding** | Turning the next-token distribution into a choice: greedy, sampling with **temperature**, **top-k**, **top-p** (nucleus). |

      A rule of thumb that holds for every model in this lesson, large or tiny: **the network only ever computes one
      thing - next-token probabilities for a window of tokens.** Chat, answers, code, refusals and tool calls are
      all built from that, by the training data and by the loop around the model.

  - id: why
    kind: why
    concepts: [next-token-prediction, context-window, decoding-and-sampling]
    title: Why an engineer needs the mechanism
    body: |
      You will rarely train an LLM, but most surprises when you build on one come straight from the mechanism:

      | Surprise in production | Mechanism behind it |
      | --- | --- |
      | The bill and the limits are in tokens, and the same prompt costs a different number of tokens on another model. | Tokenizers differ per model ([tokens](#tokens)). |
      | The model miscounts the letters in a merchant name, or mangles a long card-like number. | It sees subword pieces, not characters ([tokens](#tokens)). |
      | It writes a fluent, confident, wrong answer. | It was trained to produce *likely* text, not true text ([objective](#objective)). |
      | The base model "ignores" your question and writes more questions. | It continues text; answering is learned in instruction tuning ([instruction tuning](#instruction-tuning)). |
      | Long chats "forget" the start, or a request fails with a 400. | The context window is a hard limit, and history is resent every turn ([context window](#context-window)). |
      | The reply stops mid-sentence. | It hit the output-token limit ([context window](#context-window)). |
      | The same prompt gives different answers. | Sampling ([sampling](#sampling)). |

  - id: tokens
    kind: internals
    concepts: [next-token-prediction]
    title: Tokens - what the model actually reads
    body: |
      The model never sees characters or words directly; it sees **token ids**. How text is cut into tokens is
      decided by the tokenizer before training and fixed afterwards. Three choices, on one SandPay log line (output of
      `ctx_tok.py`, which reuses `learn_bpe` and `bpe_segment` from the
      [sequence-models lesson](#/lesson/sequence-models-and-embeddings) - its exercise `deep_learning/tokens.py`
      builds them, so they are not repeated here):

      ```plaintext
      merges learned: 150 first 8: [('t', '</w>'), ('d', '</w>'), ('e', 'n'), ('.', '</w>'), ('r', 'o'), ('e', 'd</w>'), ('en', 't</w>'), ('a', 'y')]
      sentence: 'payment 4350 declined at pixel games: suspected fraud.'
      characters 54  words+punctuation 10  BPE pieces 12  count_tokens 10
      BPE: ['payment</w>', '43', '5', '0</w>', 'declined</w>', 'at</w>', 'pixel</w>', 'games</w>', ':</w>', 'suspected</w>', 'fraud</w>', '.</w>']
      chargeback -> ['c', 'h', 'ar', 'g', 'e', 'b', 'ac', 'k</w>']
      refunded -> ['re', 'fun', 'd', 'ed</w>']
      4350 -> ['43', '5', '0</w>']
      ```

      What to notice:

      - **Characters** need no vocabulary to speak of (39 symbols for this log) but make sequences long: 54 tokens for
        one line, and attention cost grows with the square of the length.
      - **Words** make sequences short, but every unseen word (`chargeback`, a new merchant) is out of vocabulary.
      - **BPE** (Sennrich et al., 2016) starts from characters and merges the most frequent adjacent pairs. Frequent
        words become one token (`declined</w>`), rare words fall back to pieces (`chargeback` is 8), and nothing is
        ever out of vocabulary. Production LLMs use subword tokenizers of this family (GPT-3 used byte-level BPE,
        "on average ~0.7 words per token" in English, section 3.9.2 of the paper).
      - **Numbers split arbitrarily.** `4350` became `43`, `5`, `0`. The model never sees "four thousand three
        hundred and fifty" as one unit, which is part of why plain LLMs are unreliable at arithmetic, counting
        letters and copying long ids exactly. The GPT-3 paper notes the same about its word-scrambling tasks:
        succeeding "involves not just manipulating BPE tokens but understanding and pulling apart their
        substructure".

      **Token counts are tokenizer-specific.** The practice project's `count_tokens` (a toy that counts words and
      punctuation) says 10 for the sentence above; our BPE says 12; a provider's tokenizer will say something else.
      Provider-specific, as documented on 14 November 2026: Anthropic's token-counting page says newer Claude models
      use a newer tokenizer and "the same input text produces approximately 30 percent more tokens than on earlier
      models", and tells you to "recount prompts against the model you plan to use". OpenAI's guide points to its
      tokenizer tool, built with the `tiktoken` library. Use the provider's counting endpoint or library, never a
      words-times-a-constant estimate, when a limit or a budget depends on it.

  - id: objective
    kind: internals
    concepts: [next-token-prediction]
    title: The objective - predict the next token
    body: |
      Pretraining needs no labels: the text labels itself. Cut the token stream into windows; the target for each
      window is the **same window shifted one token to the right**. Position `j` of the input is trained to predict
      the token at position `j + 1`:

      ```plaintext
      ids      : p  a  y  m  e  n  t     4  7  2  1
      input  X : p  a  y  m  e  n  t     4
      target Y :    a  y  m  e  n  t     4  7
      ```

      One window of `n` tokens therefore gives `n` training examples at once, and the causal mask from the
      [attention lesson](#/lesson/attention-and-transformers) makes sure position `j` cannot look at the token it is
      predicting.

      The loss is **cross-entropy**: the mean of `-ln P(correct next token)`. A model that guesses uniformly over a
      vocabulary of `V` tokens scores exactly `ln V`; a perfect model scores 0. **Perplexity** `= exp(loss)` reads
      as "the model is as unsure as a uniform choice among this many tokens".

      **Every corpus has a loss floor.** Some next tokens are genuinely unpredictable - the digits of a random id,
      which of three decline reasons comes next. For the synthetic log the floor can be computed exactly from the
      generator (`floor.py`): each line carries 12.50 nats of randomness (event type, a uniform 4-digit id
      `ln 9000 = 9.10`, merchant, reason) spread over 39.2 characters on average:

      ```plaintext
      entropy per line 12.50 nats, mean line length 39.2 characters, floor 0.319 nats per character
      ```

      No model, however large, can average below 0.319 nats per character on this data. Real text has a floor too,
      just not one you can compute; the scaling-law papers model the loss as approaching an irreducible term. A loss
      **below** the floor is not a great model, it is a **leak** - most often targets that were not shifted, or a
      missing causal mask.

  - id: visual-generation
    kind: visual
    concepts: [next-token-prediction, context-window, decoding-and-sampling]
    title: One generation step, repeated
    body: |
      ```mermaid
      flowchart LR
        T["prompt + tokens so far"] --> W["keep the last N tokens - the context window"]
        W --> M["model: transformer over the window"]
        M --> L["logits for every token in the vocabulary"]
        L --> D["decoding: temperature, top-k, top-p"]
        D --> S["choose one token"]
        S --> C{"stop token or max tokens?"}
        C -- no --> T
        C -- yes --> R["reply"]
      ```

      Notice that the model is called **once per output token**, that each call sees only the window, and that
      the decoding box is outside the network - the same logits can produce very different text depending on
      what you do there.

  - id: pretraining-code
    kind: code
    concepts: [next-token-prediction, pretraining-and-instruction-tuning]
    title: Pretrain a tiny language model
    body: |
      The whole model is a character embedding, learned positions, two pre-norm transformer layers with a causal
      mask, and a linear head that outputs logits over the 39 characters (`model.py`, run as shown):

      ```python
      import torch
      from torch import nn

      BLOCK = 96   # the context window, in characters


      class TinyLM(nn.Module):
          def __init__(self, vocab_size, d_model=64, n_heads=4, n_layers=2, block=BLOCK):
              super().__init__()
              self.block = block
              self.tok = nn.Embedding(vocab_size, d_model)
              self.pos = nn.Embedding(block, d_model)          # one learned vector per position 0..95
              layer = nn.TransformerEncoderLayer(d_model, n_heads, 4 * d_model, dropout=0.0,
                                                 batch_first=True, norm_first=True)
              self.blocks = nn.TransformerEncoder(layer, n_layers, enable_nested_tensor=False)
              self.norm = nn.LayerNorm(d_model)
              self.head = nn.Linear(d_model, vocab_size)

          def forward(self, ids):                       # ids: (batch, n) with n <= block
              n = ids.shape[1]
              x = self.tok(ids) + self.pos(torch.arange(n))
              causal = nn.Transformer.generate_square_subsequent_mask(n)
              x = self.blocks(x, mask=causal, is_causal=True)
              return self.head(self.norm(x))            # logits: (batch, n, vocab)
      ```

      The training loop (excerpt of `pretrain.py`; the corpus is 6,000 generated log lines, split 90/10 into
      train and validation by position):

      ```python
      def batch(data, bs, g):
          starts = torch.randint(0, len(data) - BLOCK - 1, (bs,), generator=g)
          x = torch.stack([data[s:s + BLOCK] for s in starts])
          y = torch.stack([data[s + 1:s + BLOCK + 1] for s in starts])   # the same window shifted by one
          return x, y

      model = TinyLM(V)
      opt = torch.optim.AdamW(model.parameters(), lr=3e-3)
      for step in range(1501):
          x, y = batch(train, 32, g)
          loss = F.cross_entropy(model(x).reshape(-1, V), y.reshape(-1))
          opt.zero_grad(); loss.backward(); opt.step()
      ```

      Output, with two baselines computed first - uniform guessing, and a bigram model (add-one smoothed counts of
      which character follows which, the model you build in the `next_token` exercise):

      ```plaintext
      characters: 234947 vocabulary: 39 train tokens: 211452 val tokens: 23495
      uniform guess loss ln(V) = 3.664
      bigram model val loss = 1.650  perplexity = 5.21
      parameters: 111271
      step     0  train loss 3.879  val loss 3.611  val perplexity 37.02
      step   100  train loss 1.082  val loss 0.985  val perplexity 2.68
      step   300  train loss 0.394  val loss 0.391  val perplexity 1.48
      step   600  train loss 0.373  val loss 0.367  val perplexity 1.44
      step  1000  train loss 0.350  val loss 0.358  val perplexity 1.43
      step  1500  train loss 0.332  val loss 0.354  val perplexity 1.43
      training time 95 s
      ```

      Read it against the numbers you already know:

      - Step 0 is close to `ln 39 = 3.664`: an untrained model is a uniform guesser.
      - The bigram model (one character of context) reaches 1.650. The transformer, with up to 96 characters of
        context, reaches **0.354** - it has learned the line templates, merchant names and reasons.
      - 0.354 is just above the floor of **0.319**. The gap is mostly windows that start mid-line, where the first
        characters have no context. The model cannot go further, because what is left is the randomness of the
        ids and outcomes. That is the honest ceiling of next-token prediction: **it learns the distribution, not
        the answers to unpredictable questions.**

  - id: probabilities-not-facts
    kind: example
    concepts: [next-token-prediction, decoding-and-sampling]
    title: What the trained model believes
    body: |
      The model's next-character distribution after three prompts (excerpt of `sampling_demo.py` output, `T=1.0`
      rows; the other rows are discussed under sampling):

      ```plaintext
      'payment 4721 '
        T=1.0: a 0.775, d 0.224, p 0.001, r 0.000, s 0.000   entropy 0.54 nats
      'payment 4721 declined at metro taxi: '
        T=1.0: i 0.358, s 0.348, c 0.290, b 0.002, g 0.001   entropy 1.12 nats
      'refund 8'
        T=1.0: 4 0.119, 5 0.113, 1 0.109, 6 0.106, 9 0.099   entropy 2.30 nats
      ```

      The generator makes 45% approved and 15% declined payments, so after `payment 4721 ` the true split is
      0.75 / 0.25 - the model says 0.775 / 0.224. After a decline it spreads its bet over the three reasons
      (`insufficient`, `suspected`, `card`), and after `refund 8` it is close to uniform over the ten digits
      (`ln 10 = 2.30`). The model has learned **how uncertain to be**, which is exactly what the cross-entropy
      objective rewards.

      That is also the root of fluent wrong answers in large models. Ask about refund 8412's status and a model
      that has never seen refund 8412 still produces a likely-looking status, because a likely continuation is all
      it was trained to produce. Facts the application needs must come from the prompt (retrieval, tools) - see
      [Retrieval-augmented generation](#/lesson/retrieval-augmented-generation).

  - id: pretraining-at-scale
    kind: internals
    concepts: [pretraining-and-instruction-tuning]
    title: Pretraining at scale
    body: |
      Real pretraining is the same loop with everything multiplied. The GPT-3 paper (2020) trained "an
      autoregressive language model with 175 billion parameters"; all its model sizes "were trained for a total of
      300 billion tokens", with "a context window of nctx = 2048 tokens". Compare the tiny model: 111 thousand
      parameters, 211 thousand training characters, a 96-character window.

      Two findings explain why scale was worth it:

      - **Loss falls predictably with scale.** Kaplan et al. (2020): "The loss scales as a power-law with model
        size, dataset size, and the amount of compute used for training". Hoffmann et al. (2022, Chinchilla) refined
        the budget: "for compute-optimal training, the model size and the number of training tokens should be
        scaled equally: for every doubling of model size the number of training tokens should also be doubled".
      - **Big models learn from the prompt.** GPT-3 is "applied without any gradient updates or fine-tuning, with
        tasks and few-shot demonstrations specified purely via text interaction with the model". The paper calls
        this **in-context learning** and shows that larger models "make increasingly effective use of in-context
        information". This is why prompt engineering works at all: the examples in a prompt condition the
        next-token distribution.

      What pretraining does **not** give you: a model that answers. A base model asked a question continues the
      document it thinks it is in - which may be more questions, a forum thread, or (in our tiny case) another log
      line.

  - id: instruction-tuning
    kind: example
    concepts: [pretraining-and-instruction-tuning]
    title: Instruction tuning, on the tiny model
    body: |
      InstructGPT (Ouyang et al., 2022) starts from the observation that "Making language models bigger does not
      inherently make them better at following a user's intent", and adds three steps after pretraining (their
      Figure 2): **(1) supervised fine-tuning (SFT)** on labeler-written demonstrations, **(2) reward model (RM)
      training** on human rankings of model outputs, and **(3) reinforcement learning via PPO** against that reward
      model. Its headline result: "outputs from the 1.3B parameter InstructGPT model are preferred to outputs from
      the 175B GPT-3, despite having 100x fewer parameters".

      Step 1 is small enough to do here (`sft.py`). Each demonstration is a prompt and the response we want:

      ```plaintext
      example prompt+answer: 'Q: payment 6305 approved at book nook. status?\nA: approved\n'
      ```

      The fine-tuning loss is ordinary next-token cross-entropy, **but only on the response tokens** - the prompt
      positions get the label `-100`, which `F.cross_entropy` ignores, so the model is not trained to write
      questions, only to answer them:

      ```python
      def encode_pair(p, a):
          x = [stoi[c] for c in p + a]
          labels = [-100] * len(p) + [stoi[c] for c in a]    # -100 = ignored by cross_entropy: no loss on the prompt
          return x, labels

      # 200 steps of 16 random pairs from 400 demonstrations, AdamW lr 1e-3
      logits = m(X[:, :-1])
      loss = F.cross_entropy(logits.reshape(-1, V), L[:, 1:].reshape(-1), ignore_index=-100)
      ```

      Accuracy is measured with greedy decoding on 100 held-out prompts:

      ```plaintext
      BASE model, greedy continuation of 'Q: payment 3395 approved at metro taxi. status?\nA: '
        -> 'suspected fraud.'
      BASE accuracy on 100 held-out prompts: 0%   pretraining val loss 0.354
      SFT step 50: loss 0.058  held-out accuracy 89%
      SFT step 100: loss 0.007  held-out accuracy 95%
      SFT step 200: loss 0.001  held-out accuracy 100%
      SFT time 9 s
      SFT model, greedy continuation of 'Q: payment 3395 approved at metro taxi. status?\nA: '
        -> 'approved'
      pretraining val loss after SFT 1.937
      ```

      Three lessons in one run:

      1. **The base model does not answer.** It had never seen `Q:` / `A:` text, so it continued with the most
         log-like thing it knew. 400 demonstrations and 9 seconds were enough to teach the format: instruction
         tuning teaches **behaviour**, and it is cheap compared with pretraining.
      2. **It did not learn new facts.** The answer is a word already in the prompt; everything the model needed
         to read the line came from pretraining.
      3. **Narrow fine-tuning can wreck the rest.** The loss on ordinary log text went from 0.354 to **1.937** -
         worse than the bigram model. InstructGPT reports a milder version of this, "an 'alignment tax'", and
         reduces it by "mixing PPO updates with updates that increase the log likelihood of the pretraining
         distribution (PPO-ptx)". Doing the same here - adding a pretraining batch's loss to every SFT step
         (`sft_mix.py`):

      ```plaintext
      SFT step 50: loss 0.427  held-out accuracy 83%
      SFT step 100: loss 0.376  held-out accuracy 90%
      SFT step 200: loss 0.360  held-out accuracy 100%
      SFT time 18 s
      pretraining val loss after SFT 0.353
      ```

      (The reported loss now includes the pretraining term, so it cannot fall near zero.) Same 100% on the task,
      and the original skill is kept. Steps 2 and 3 of InstructGPT - learning from preferences - matter when
      "good" cannot be written down as one correct demonstration, such as helpful, honest and harmless answers;
      they are not reproduced here.

  - id: context-window
    kind: internals
    concepts: [context-window]
    title: The context window
    body: |
      The tiny model has `BLOCK = 96`: its position table has exactly 96 rows. Feed it 97 tokens and it does not
      "forget the start" - it cannot run at all:

      ```plaintext
      block size: 96
      97 tokens -> IndexError: index out of range in self
      ```

      So the generation loop crops the input to the **last** 96 tokens before every step
      (`ids = text[-BLOCK:]`). Anything earlier is invisible: if the merchant's name scrolled out of the window, the
      model cannot use it. Hosted models work the same way at a much larger scale, with three points that surprise
      people:

      1. **The reply counts.** Anthropic's documentation: "The 'context window' refers to all the text a language
         model can reference when generating a response, including the response itself", and "Everything in the
         request counts toward the context window: the system prompt, every message in messages (including tool
         results, images, and documents), and your tool definitions." OpenAI's guide: "A context window describes
         the total tokens that can be used for both input and output tokens (and for some models, reasoning
         tokens)." So the budget is **input tokens + maximum output tokens <= context window**.
      2. **There is no memory between requests.** A chat API is stateless: each turn resends the whole history
         (or a provider-side reference to it), so every turn costs more input tokens than the last, and a long
         conversation eventually stops fitting.
      3. **Bigger is not automatically better.** Anthropic's page warns that "As token count grows, accuracy and
         recall degrade, a phenomenon known as context rot", so what you put in the window matters as much as how
         much fits.

      Sizes and behaviour on overflow are provider- and model-specific. As documented on 14 November 2026:

      | | Anthropic (Claude) | OpenAI |
      | --- | --- | --- |
      | Window size | "up to 1M tokens, depending on the model"; some models 200k | per model; the guide's example is `gpt-4o-2024-08-06` with "a total context window of 128k tokens" |
      | Output cap | `max_tokens`, required, per-model maximum | `max_output_tokens`, optional, "including visible output tokens and reasoning tokens" |
      | Input too long | count first with the token counting API; the docs describe compaction and context editing for long conversations | Responses API `truncation`: `disabled` (default) fails "with a 400 error"; `auto` drops "items from the beginning of the conversation" |

      Your application owns the policy: count tokens with the provider's tokenizer, reserve the output budget, and
      decide what to drop or summarise - usually the oldest turns, never the system prompt or the latest question.
      And check whether a reply was **cut off by the output limit** (a `max_tokens` stop reason) before treating
      it as complete. The `context_budget` exercise builds exactly that.

  - id: sampling
    kind: internals
    concepts: [decoding-and-sampling]
    title: Decoding - from logits to a token
    body: |
      The model outputs logits. The four standard ways to pick a token from them:

      | Method | Rule |
      | --- | --- |
      | **Greedy** | Take the argmax. Deterministic. |
      | **Temperature `T`** | Sample from `softmax(logits / T)`. `T < 1` sharpens, `T > 1` flattens, `T -> 0` approaches greedy. |
      | **Top-k** | Keep the `k` highest logits, set the rest to `-inf`, then sample. |
      | **Top-p (nucleus)** | Keep the smallest set of most likely tokens whose probabilities add up to at least `p`, then sample. |

      Holtzman et al. define the nucleus as "the smallest set such that" the sum of `P(x | x_1:i-1)` over the set
      is at least `p` (equation 2). Their argument: "maximization-based decoding methods such as beam search lead to
      degeneration — output text that is bland, incoherent, or gets stuck in repetitive loops", while the tail of
      the distribution is "unreliable" and "needs to be truncated during generation". A fixed `k` is the wrong size
      half the time: "Flat distributions lead to many moderately probable tokens, while peaked distributions
      concentrate most probability mass into just a few tokens". Top-p adapts the size to the distribution.

      The real logits after `payment 4721 ` (the top four, and the smallest):

      ```plaintext
      raw logits after 'payment 4721 ':
         a 12.69, d 11.44, p 5.51, r 3.02  ... min -8.89
      ```

      and what temperature and top-p do to the three prompts from before (`sampling_demo.py`):

      ```plaintext
      'payment 4721 '
        T=0.5: a 0.923, d 0.077, p 0.000, r 0.000, s 0.000   entropy 0.27 nats
        T=1.0: a 0.775, d 0.224, p 0.001, r 0.000, s 0.000   entropy 0.54 nats
        T=2.0: a 0.622, d 0.334, p 0.017, r 0.005, s 0.004   entropy 0.91 nats
        top-p 0.5: keeps 1 token(s): ['a']
        top-p 0.9: keeps 2 token(s): ['a', 'd']
        top-p 0.99: keeps 2 token(s): ['a', 'd']
      'payment 4721 declined at metro taxi: '
        T=0.5: i 0.385, s 0.363, c 0.252, b 0.000, g 0.000   entropy 1.08 nats
        T=1.0: i 0.358, s 0.348, c 0.290, b 0.002, g 0.001   entropy 1.12 nats
        T=2.0: i 0.312, s 0.308, c 0.281, b 0.020, g 0.015   entropy 1.57 nats
        top-p 0.5: keeps 2 token(s): ['i', 's']
        top-p 0.9: keeps 3 token(s): ['i', 's', 'c']
        top-p 0.99: keeps 3 token(s): ['i', 's', 'c']
      'refund 8'
        T=0.5: 4 0.140, 5 0.127, 1 0.118, 6 0.112, 9 0.097   entropy 2.28 nats
        T=1.0: 4 0.119, 5 0.113, 1 0.109, 6 0.106, 9 0.099   entropy 2.30 nats
        T=2.0: 4 0.106, 5 0.103, 1 0.102, 6 0.100, 9 0.097   entropy 2.45 nats
        top-p 0.5: keeps 5 token(s): ['4', '5', '1', '6', '9']
        top-p 0.9: keeps 9 token(s): ['4', '5', '1', '6', '9', '3', '2', '8', '7']
        top-p 0.99: keeps 10 token(s): ['4', '5', '1', '6', '9', '3', '2', '8', '7', '0']
      ```

      What to notice:

      - **Temperature never changes the order**, only the spread. At `T=2` the impossible letters `p`, `r`, `s`
        (no word in the log starts `payment 4721 p...`) get 2.6% between them - that is the unreliable tail
        coming through.
      - **Top-p 0.9 keeps 2 tokens in one place, 3 in another and 9 in a third** - exactly the adaptivity a fixed
        top-k lacks. A `k` of 3 would drop valid digits after `refund 8`; a `k` of 10 would let `p` through after
        `payment 4721 `.
      - The top-p 0.5 row keeps `a` alone: the most probable token is always kept even when it exceeds `p` by
        itself, otherwise the set would be empty.

  - id: sampling-quality
    kind: example
    concepts: [decoding-and-sampling]
    title: What decoding does to the text
    body: |
      Five generations of 200 characters per setting (seeded), then counting how many complete lines came out, how
      many were distinct, and how many words are not in the log's vocabulary at all (`sampling_demo.py`):

      ```plaintext
      greedy            lines  25  distinct   4  unknown words 0/125 = 0.0%
         e.g. payment 4955 approved at green grocer. | payment 1355 approved at green grocer. | payment 1559 approved at green grocer.
      T=0.7             lines  24  distinct  24  unknown words 2/126 = 1.6%
         e.g. payment 5980 approved at green grocer. | payment 5187 declined at green grocer: susped at caffe luna. | payout 9076 sent to green grocer.
      T=1.0             lines  24  distinct  24  unknown words 3/127 = 2.4%
         e.g. payment 5980 approved at green grocer. | payment 6187 declined at green grocer: susped fraud. | payout 8528 sent to pixel games.
      T=1.5             lines  23  distinct  23  unknown words 13/113 = 11.5%
         e.g. payment 5980 approved at green grocer. | payment 6187 declined at cafe lunamaclurd. | payout 79907 sesspectrat taxi.
      T=2.0             lines  20  distinct  20  unknown words 55/119 = 46.2%
         e.g. pamayout es | refund 40166 avfor green grocer. | refund 9031 pending for book.
      T=2.0, top-p 0.9  lines  23  distinct  23  unknown words 10/125 = 8.0%
         e.g. payment 59804 declined at sun pharmacy: insufficientc93 at book nook. | payout 9947 sent to sun to sun pharmacafe luna. | refund 3821 approved for book nook.
      ```

      - **Greedy is perfectly "correct" and useless for variety.** The five greedy runs were identical (greedy
        ignores randomness), and within them there were only 4 distinct lines: always "approved at green grocer",
        the single most likely path. This is the degeneration Holtzman et al. describe, in miniature.
      - **Higher temperature trades correctness for variety**: unknown words rise from 1.6% at `T=0.7` to 46.2% at
        `T=2.0`.
      - **Top-p rescues a high temperature** (46.2% to 8.0%) by cutting the tail before sampling - the tail is
        where the nonsense lives.
      - Even `T=1.0` produced `susped` - a small model's probabilities are imperfect, and sampling exposes that.

      For an application this means: low temperature (or greedy) for extraction, classification and anything
      checked against a schema; moderate temperature with top-p for open-ended writing; and never assume two calls
      return the same text.

  - id: provider-sampling
    kind: when
    concepts: [decoding-and-sampling]
    title: Sampling parameters in hosted APIs
    body: |
      Which knobs you get is provider-, model- and API-version-specific. As documented on 14 November 2026:

      - **OpenAI** (Responses API reference): `temperature` - "What sampling temperature to use, between 0 and 2.
        Higher values like 0.8 will make the output more random, while lower values like 0.2 will make it more
        focused and deterministic", default 1; `top_p` - "An alternative to sampling with temperature, called
        nucleus sampling"; and for both, "We generally recommend altering this or `top_p` but not both."
      - **Anthropic** (Migrating to API version 2026-10-21): "In `2026-10-21`, a request that sends `temperature`,
        `top_p`, or `top_k` returns a 400 error, even at the parameter's default value." Without them "a request
        samples with their defaults, including a `temperature` of 1.0", and "Models that already accept only the
        defaults, such as Claude 4.7 and later models, sample as before." Requests on the older `2023-06-01`
        version keep the parameters.

      So do not build a feature that **depends** on `temperature: 0` for repeatable output - some current APIs do
      not accept it, and even where they do, hosted inference is not guaranteed to be bit-for-bit deterministic.
      Get consistency from the request instead: precise instructions, examples, structured output, and validation
      of the result (see [LLM APIs, streaming and structured output](#/lesson/llm-apis-and-structured-output)).

  - id: tests
    kind: tests
    concepts: [next-token-prediction, context-window, decoding-and-sampling]
    title: Testing code around a language model
    body: |
      You cannot assert on exact sampled text. Test properties, with the model replaced by a fake where you can:

      | Test | Expected result | Evidence |
      | --- | --- | --- |
      | Training pairs: targets are inputs shifted by one | `X[i][1:] == Y[i][:-1]` and no window predicts itself | unit test on a 5-token sequence |
      | Validation loss is plausible | Between the data's floor and `ln V`; below the floor = leak | the loss curve, the computed floor |
      | Sampling with a fixed seed | Same seed, same tokens; different seeds, different tokens | two seeded runs |
      | Sampling frequencies | 4,000 draws match `softmax(logits)` within a tolerance | counts versus probabilities |
      | Top-k / top-p | Only the allowed set is ever drawn; top-1 equals greedy | the set of drawn ids |
      | Context budget | `input + max_output <= window`; oldest turns dropped first; latest message and system prompt kept | the request the fake LLM recorded |
      | Over-long newest message | Clear error before any API call, not a provider 400 | exception, zero recorded calls |
      | Reply cut by the output limit | Flagged as truncated, not shown as a complete answer | stop reason `max_tokens` |
      | Same prompt, several runs | The property you need (valid JSON, right label, cites a source) holds on every run | N runs, pass rate |

      The last row is how LLM features are tested in practice: a fixed set of inputs, an automated check of the
      property, and a pass rate - covered in [Evaluating LLM applications](#/lesson/llm-evaluation-and-guardrails).

  - id: mistakes
    kind: mistakes
    concepts: [next-token-prediction, pretraining-and-instruction-tuning, context-window, decoding-and-sampling]
    title: Common mistakes and how to debug them
    body: |
      - **Estimating tokens as words times a constant.** Count with the target model's tokenizer; counts change
        between models of the same provider.
      - **Unshifted targets or a missing causal mask.** The loss drops below the data's floor and generation is
        garbage. Debug: compute `ln V` and, if you can, the floor; check `Y[:, :-1] == X[:, 1:]`.
      - **Expecting a base model to answer.** It continues documents. Use an instruction-tuned model, or frame the
        prompt as a document whose natural continuation is the answer.
      - **Training SFT on the prompt tokens too.** The model learns to write questions; mask the prompt with
        `-100`.
      - **Fine-tuning on a narrow set and shipping.** Measure the general task before and after (0.354 to 1.937
        above); mix in general data if it regressed.
      - **Forgetting the reply is in the window.** `input + max_tokens` must fit; a long prompt leaves no room to
        answer.
      - **Not checking the stop reason.** A `max_tokens` stop is a truncated answer - half a JSON object, half a
        refund instruction.
      - **Silently dropping the system prompt or the latest question when trimming.** Drop old turns first, and
        keep a user turn first if the API requires it.
      - **Relying on `temperature: 0` for determinism.** Not accepted everywhere, and not a guarantee where it is.
      - **Changing temperature and top-p together blindly.** Both reshape the same distribution; OpenAI's reference
        recommends altering one.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [next-token-prediction, pretraining-and-instruction-tuning, context-window, decoding-and-sampling]
    title: Limitations and trade-offs
    body: |
      - **Tokenizer granularity:** characters - tiny vocabulary, long sequences, no out-of-vocabulary words;
        words - short sequences, huge vocabulary, unknown words; subwords - the compromise every current LLM uses,
        at the cost of odd splits for numbers, rare names and some languages (more tokens for the same meaning,
        so more cost and less fits in the window).
      - **Likelihood is not truth.** Next-token training makes text plausible; it does not check facts. Ground
        answers in retrieved or tool-provided data when facts matter.
      - **Instruction tuning shapes behaviour, not knowledge.** To teach new facts that change often, retrieval is
        usually cheaper and more reliable than fine-tuning - see [Fine-tuning, RAG or
        prompting](#/lesson/fine-tuning-vs-rag-vs-prompting).
      - **Larger windows cost more and do not guarantee use.** Every input token is paid for on every turn, and
        recall degrades with length ("context rot"). Curate what goes in.
      - **Decoding:** greedy is repeatable but repetitive; high temperature is varied but wrong more often; top-p
        adapts where top-k cannot. Many hosted APIs now fix the decoding settings and leave you only the prompt.

  - id: summary
    kind: summary
    concepts: [next-token-prediction, pretraining-and-instruction-tuning, context-window, decoding-and-sampling]
    title: Quick reference
    body: |
      - An LLM outputs `P(next token | window)`; generation repeats "predict, choose, append".
      - Tokens are tokenizer-specific subword pieces; count with the target model's tokenizer.
      - Training pairs: input window and the same window shifted by one. Loss: cross-entropy (uniform = `ln V`,
        perplexity = `exp(loss)`); the data's randomness sets a floor - below it means a leak.
      - Tiny model: uniform 3.664, bigram 1.650, transformer 0.354, floor 0.319.
      - Pretraining makes a base model that continues text; scale brings in-context learning.
      - Instruction tuning: SFT on demonstrations with the loss on the response only, then (InstructGPT) a reward
        model and PPO. Tiny model: 0% to 100% in 200 steps; general loss 0.354 to 1.937 unless pretraining data is
        mixed in (0.353).
      - Context window = input + output; no memory between requests; reserve the output budget, trim oldest turns,
        check for a `max_tokens` stop.
      - Temperature rescales logits (order kept); top-k keeps k; top-p keeps the smallest set reaching p; greedy
        repeats itself. API support for these is provider- and version-specific.

exercises:
  - id: digits-tokens
    type: mcq
    concept: next-token-prediction
    skill: analysis
    title: The model that cannot copy an id
    prompt: |
      A SandPay assistant built on a hosted LLM is asked to repeat back a 12-character reference such as
      `RF-8841-ZQ93` from a long ticket. It usually works but sometimes swaps or drops characters, while it never
      misspells common words like "refund". What is the best explanation?
    options:
      - id: tokens
        text: The model sees subword tokens, and an unusual string like an id is split into several arbitrary pieces it rarely saw together, unlike common words that are single, frequent tokens.
        feedback: Correct - BPE gives frequent words one token and splits rare strings into pieces (the lesson's `4350` became `43`, `5`, `0`). Copying many low-frequency pieces exactly is harder than emitting one familiar token.
      - id: characters
        text: The model reads one character at a time and loses track after about ten characters.
        feedback: Production LLMs do not read characters one by one; they read subword tokens. Long words are not a problem when they are common.
      - id: window
        text: The id falls outside the context window.
        feedback: If it were outside the window the model could not reproduce it at all, not almost correctly. The ticket fits; the problem is how the id is tokenized.
      - id: temperature
        text: Temperature is too low.
        feedback: Lower temperature makes the most likely token more likely - it would help, not hurt, exact copying.
    correct: [tokens]
    hints:
      - How would BPE trained on ordinary text split `refund`, and how would it split `ZQ93`?
      - Look at what happened to `4350` in the lesson.
    solution: |
      Tokenizers learn merges from frequent text, so "refund" is one familiar token while `RF-8841-ZQ93` is cut
      into several rare fragments. Each fragment must be predicted exactly, and errors compound. Confirm by
      counting the tokens of the id with the provider's tokenizer, and fix in the application: copy ids with code
      (structured output plus a lookup) rather than trusting the model to retype them.
    followUp: |
      Why can the same Spanish support message use noticeably more tokens than its English translation, and what
      does that change for cost and for what fits in the window?

  - id: count-with-the-right-tokenizer
    type: mcq
    concept: next-token-prediction
    skill: application
    title: Budgeting tokens before a model upgrade
    prompt: |
      A team measured that their standard SandPay support prompt is 180,000 tokens with model A's token counter and
      planned to move to a newer model B of the same provider with the same window. What should they do first?
    options:
      - id: recount
        text: Recount the prompt with model B's tokenizer (the provider's counting endpoint or library) before relying on it fitting.
        feedback: Correct - token counts are tokenizer-specific. Anthropic's docs, for example, say a newer tokenizer produces "approximately 30 percent more tokens" for the same text and to recount against the model you plan to use.
      - id: same
        text: Nothing - the same text is the same number of tokens on every model.
        feedback: Tokenizers differ between model families and even between versions of one provider's models.
      - id: words
        text: Estimate it as words × 0.75 to be safe.
        feedback: A rule of thumb from one tokenizer and one language is not a measurement; when a hard limit depends on it, count with the real tokenizer.
      - id: characters
        text: Count characters and divide by 4, which is exact for all modern models.
        feedback: No fixed ratio is exact; it varies by tokenizer, language and content (code, numbers, names).
    correct: [recount]
    hints:
      - Who decides what one token is?
    solution: |
      The tokenizer is part of the model. Count with the target model's tokenizer; at 180,000 tokens, a 30% increase
      would be about 234,000 and would no longer fit a 200k window. Also re-check cost, which is billed in the new
      model's tokens.

  - id: shift-bug-debug
    type: debug
    concept: next-token-prediction
    skill: analysis
    title: The loss that is too good
    prompt: |
      This builds training pairs for a character model. Training loss falls to 0.01 within 200 steps on the SandPay
      log (floor 0.319), and generated text is a single character repeated. Click the line with the bug.
    language: python
    code: |
      def make_training_pairs(ids, context):
          a = np.asarray(ids, dtype=np.int64)
          n = len(a) - context
          X = np.stack([a[i : i + context] for i in range(n)])
          Y = np.stack([a[i : i + context] for i in range(n)])
          return X, Y
    correctLines: [5]
    lineNotes:
      - line: 3
        note: n = len(a) - context is right - the last window needs one extra token for its targets.
      - line: 4
        note: The inputs are correct; the targets are what must move.
    hints:
      - What should position j of the input be trained to predict?
      - Compare the slices on lines 4 and 5.
    solution: |
      Line 5 makes the targets equal to the inputs, so the model learns to copy the current token - trivial with
      the token in view, hence a loss below the floor. The fix is `a[i + 1 : i + 1 + context]`. Confirm with a unit
      test: `X[:, 1:] == Y[:, :-1]` and no position where `X == Y` on a sequence of distinct ids.
    followUp: |
      With correctly shifted targets, which missing piece of the model would produce the same "too good" symptom?

  - id: loss-floor-analysis
    type: mcq
    concept: next-token-prediction
    skill: analysis
    title: Reading a loss curve
    prompt: |
      Your character model on the SandPay log (vocabulary 39, floor 0.319 nats per character) reports validation
      losses for three variants. Which reading is right?

      ```plaintext
      variant A  val loss 3.66
      variant B  val loss 0.36
      variant C  val loss 0.05
      ```
    options:
      - id: right
        text: A has learned nothing (it is ln 39), B is near the best possible, C has a leak.
        feedback: Correct - 3.66 is uniform guessing, 0.36 sits just above the floor, and 0.05 is below what the data's randomness allows.
      - id: c-best
        text: C is the best model and should ship.
        feedback: Nothing can predict random 4-digit ids. A loss below the floor means the target is visible to the model - a shift or mask bug.
      - id: b-underfit
        text: B is underfitting; with more training it should reach about 0.
        feedback: Zero would mean predicting random ids perfectly. The floor of 0.319 is the irreducible part.
      - id: a-fine
        text: A is fine; losses above 3 are normal for character models.
        feedback: 3.66 equals ln(39), exactly the loss of a uniform guess - the model has not learned anything.
    correct: [right]
    hints:
      - What loss does a uniform guess over 39 symbols give?
      - Can any model beat the entropy of the data?
    solution: |
      `ln 39 = 3.664` is the uniform baseline; 0.319 is the floor set by the random parts of each line. The lesson's
      real model reached 0.354. Anything below the floor is a leak: check the target shift and the causal mask.

  - id: perplexity-mcq
    type: mcq
    concept: next-token-prediction
    skill: application
    title: Perplexity in words
    prompt: |
      The bigram model scored a validation loss of 1.650 nats per character. What is its perplexity, and what does
      it mean?
    options:
      - id: right
        text: About 5.21 - on average it is as unsure as a uniform choice among about 5 characters.
        feedback: Correct - exp(1.650) = 5.21.
      - id: log10
        text: About 44.7 - 10 to the power 1.650.
        feedback: The loss is in nats (natural log), so perplexity is e to the loss, not 10 to the loss.
      - id: accuracy
        text: 1.650 - it gets about 1.65 characters right in a row.
        feedback: Perplexity is not a run length; it is exp(cross-entropy).
      - id: percent
        text: 16.5% - the share of characters it gets wrong.
        feedback: Cross-entropy is not an error rate; it penalises the probability given to the right answer.
    correct: [right]
    hints:
      - Perplexity = exp(loss).
    solution: |
      `exp(1.650) = 5.21`. The transformer's 0.354 is a perplexity of 1.43, against 39 for a uniform guess.

  - id: order-instructgpt
    type: order
    concept: pretraining-and-instruction-tuning
    skill: recall
    title: From raw text to an assistant
    prompt: Put the stages of building an InstructGPT-style assistant in order.
    items:
      - id: pretrain
        text: Pretrain on a large text corpus with next-token prediction (base model)
      - id: demos
        text: Collect demonstrations of the desired behaviour for a set of prompts
      - id: sft
        text: Supervised fine-tuning on the demonstrations, loss on the responses only
      - id: rankings
        text: Collect human rankings of several model outputs per prompt
      - id: reward-model
        text: Train a reward model to predict the rankings
      - id: ppo
        text: Optimise the fine-tuned model against the reward model with PPO, mixing in pretraining updates
    hints:
      - The reward model scores outputs - something has to produce outputs worth ranking first.
    solution: |
      Pretraining, then InstructGPT's three steps: SFT on labeler demonstrations, reward-model training on
      rankings, and PPO against the reward model (PPO-ptx mixes in pretraining log-likelihood to reduce the
      "alignment tax").

  - id: base-vs-instruct
    type: mcq
    concept: pretraining-and-instruction-tuning
    skill: analysis
    title: The model that answers with more questions
    prompt: |
      A teammate downloads an open-weight **base** model and sends it `What is the refund policy for card payments?`.
      It replies with three more questions in a similar style. What is going on, and what fixes it?
    options:
      - id: base
        text: A base model continues text; a list of questions is a likely continuation. Use the instruction-tuned variant (or frame the prompt as a document whose continuation is the answer).
        feedback: Correct - like the tiny base model that answered 'Q:...A:' with 'suspected fraud.', pretraining teaches continuation, not answering.
      - id: broken
        text: The weights are corrupted; a working LLM always answers questions.
        feedback: Answering is learned in instruction tuning. A base model behaving like this is working as trained.
      - id: temperature
        text: Temperature is too high; at temperature 0 it would answer.
        feedback: Greedy decoding picks the most likely continuation - which for a base model can still be more questions. The tiny base model was greedy and still 0% correct.
      - id: window
        text: The question is too long for its context window.
        feedback: A one-line question fits any window. The behaviour comes from what the model was trained to do.
    correct: [base]
    hints:
      - What was the base model trained to do with any piece of text?
    solution: |
      Pretraining optimises "predict the next token of documents like these". Without instruction tuning a question
      is just the start of a document. The lesson's base model scored 0% on the Q/A format and 100% after 200 SFT
      steps.

  - id: sft-forgetting
    type: mcq
    concept: pretraining-and-instruction-tuning
    skill: analysis
    title: Fine-tuned, and worse at everything else
    prompt: |
      After fine-tuning on 400 SandPay Q/A demonstrations, the model answers 100% of held-out questions, but its loss
      on ordinary log text rose from 0.354 to 1.937 - worse than a bigram model. Which change most directly
      addresses this while keeping the new skill?
    options:
      - id: mix
        text: Add a next-token loss on pretraining text to every fine-tuning step.
        feedback: Correct - this is the idea of InstructGPT's PPO-ptx. In the lesson it kept 100% on the task and brought the log loss back to 0.353.
      - id: more-steps
        text: Fine-tune for more steps so the model settles.
        feedback: More narrow training moves the model further from the pretraining distribution, not back.
      - id: prompt-loss
        text: Remove the -100 mask so the loss also covers the prompt.
        feedback: That teaches the model to write questions too, but they are still a narrow format; it does not restore general log modelling.
      - id: temperature
        text: Lower the temperature when generating log text.
        feedback: The loss measures the probabilities themselves; decoding settings do not change them.
    correct: [mix]
    hints:
      - What did InstructGPT call the regression, and what did they mix into PPO?
    solution: |
      Narrow fine-tuning overwrites general behaviour (catastrophic forgetting; InstructGPT's milder "alignment
      tax"). Mixing pretraining batches into fine-tuning keeps both: 100% held-out accuracy and a log loss of 0.353.
      Always measure a general benchmark before and after fine-tuning.

  - id: window-budget
    type: mcq
    concept: context-window
    skill: application
    title: Will the request fit?
    prompt: |
      A model has a 32,000-token context window. A SandPay support request has a 1,500-token system prompt, 26,000
      tokens of conversation history, a 900-token new question, and asks for up to 4,000 output tokens. What happens,
      and what is the best fix?
    options:
      - id: over
        text: "It does not fit: 1,500 + 26,000 + 900 + 4,000 = 32,400 > 32,000. Drop or summarise the oldest turns (keep the system prompt and the new question) to free at least 400 tokens."
        feedback: Correct - the reply's budget counts against the window, so input plus max output must fit.
      - id: fits
        text: It fits, because the input is 28,400 tokens, under 32,000.
        feedback: The output is part of the context window too - both providers' docs say so.
      - id: drop-system
        text: It does not fit; drop the system prompt, which is the least important part.
        feedback: The system prompt carries the instructions and rules; drop old conversation turns first.
      - id: model-remembers
        text: Send only the new question - the model remembers the earlier turns.
        feedback: Chat APIs are stateless; the model sees only what is in the current request.
    correct: [over]
    hints:
      - Which parts of a request count toward the window - does the reply?
    solution: |
      Input 28,400 + output 4,000 = 32,400, 400 over. Depending on the provider it fails with a 400 or is truncated.
      Trim the oldest turns (or summarise them), or lower `max_tokens` if 3,600 output tokens are enough. Then check
      the reply's stop reason in case it was cut off.

  - id: truncated-reply
    type: mcq
    concept: context-window
    skill: analysis
    title: The half-finished refund instructions
    prompt: |
