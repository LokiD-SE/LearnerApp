id: how-llms-work
title: How large language models work
subject: ai-engineering
module: genai-engineering
level: beginner
status: published
estimatedMinutes: 115
summary: What a large language model actually does, shown on a model small enough to train in two minutes - text becomes tokens, pretraining teaches one skill (predict the next token) with cross-entropy loss, instruction tuning turns a text continuer into an assistant, the context window bounds everything the model can see including its own reply, and temperature, top-k and top-p decide how a probability distribution becomes words. Every number shown comes from a tiny character-level transformer trained on a synthetic SandPay event log, and provider behaviour is quoted, with dates, from Anthropic and OpenAI documentation.
