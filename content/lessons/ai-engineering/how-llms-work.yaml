  - id: top-p-by-hand
    type: mcq
    concept: decoding-and-sampling
    skill: application
    title: Which tokens survive top-p?
    prompt: |
      After `payment 4721 declined at metro taxi: ` the model's probabilities are `i 0.358, s 0.348, c 0.290`, and
      everything else shares 0.004. Which tokens can be sampled with `top_p = 0.7`, and with `top_k = 2`?
    options:
      - id: three
        text: "top-p 0.7: i, s and c, because all three are likely; top-k 2: i and s"
        feedback: The nucleus is the smallest set that reaches p. After i and s the sum is already 0.706, so c is not needed.
      - id: correct
        text: "top-p 0.7: i and s (0.358 + 0.348 = 0.706 >= 0.7); top-k 2: i and s"
        feedback: Correct - the nucleus is the smallest set whose sum reaches p, and here that is the top two. Note how close 0.706 is to 0.7 - a slightly higher p would include c.
      - id: below
        text: "top-p 0.7: only i, because adding s would exceed 0.7"
        feedback: That is the classic off-by-one - keeping only tokens whose cumulative sum stays below p. The nucleus must reach p, so it includes the token that crosses it.
      - id: all
        text: "top-p 0.7: all tokens with probability above 0.7 × 0.358"
        feedback: Top-p is about cumulative mass, not a threshold relative to the top token.
    correct: [correct]
    hints:
      - Sort, add up, stop at the first token where the sum reaches p.
    solution: |
      Cumulative: i 0.358, then s 0.706 - reached 0.7, stop. Nucleus {i, s}. Top-k 2 also gives {i, s}; but at
      `top_p = 0.9` the nucleus becomes {i, s, c}, and top-k 2 would wrongly drop `c`, the start of `card expired`,
      a valid reason.

  - id: temperature-analysis
    type: mcq
    concept: decoding-and-sampling
    skill: analysis
    title: Choosing decoding for two features
    prompt: |
      SandPay builds two features on the same model: (1) classify a dispute message into one of five categories,
      returned as JSON; (2) draft three alternative friendly replies to a customer. Where the API allows it, which
      decoding choice fits best?
    options:
      - id: right
        text: (1) greedy or low temperature; (2) moderate temperature with top-p, so the three drafts differ without drifting into nonsense.
        feedback: Correct - classification wants the most likely answer every time; drafting wants variety from the reliable part of the distribution.
      - id: high-both
        text: High temperature for both, for creativity.
        feedback: For a classifier, high temperature only adds wrong labels - the lesson's unknown-word rate rose to 46.2% at T=2.
      - id: greedy-both
        text: Greedy for both, since it is the most accurate.
        feedback: Greedy returns the same reply three times; the lesson's five greedy runs were identical.
      - id: topk1
        text: top_k = 1 for drafting, so the replies are diverse.
        feedback: top_k = 1 is greedy decoding - the opposite of diverse.
    correct: [right]
    hints:
      - Which feature needs the same answer each time, and which needs different answers?
    solution: |
      Low temperature concentrates probability on the top token (0.923 for `a` at T=0.5 versus 0.775 at T=1);
      top-p cuts the unreliable tail. Check the provider first: some APIs fix these parameters (Anthropic's
      2026-10-21 version rejects them), in which case variety comes from asking for three different drafts and
      reliability from structured output and validation.

  - id: top-p-draft-debug
    type: debug
    concept: decoding-and-sampling
    skill: analysis
    title: The nucleus filter that returns nonsense
    prompt: |
      A teammate's top-p filter is meant to keep the smallest set of most probable tokens reaching `p` (setting the
      rest to `-inf`) and must not modify its input. Sampling with it at `p = 0.9` produces mostly rare tokens, and
      the caller's logits change after the call. Click **every** line with a bug.
    language: python
    code: |
      def top_p_filter(logits, p):
          z = np.asarray(logits, dtype=np.float64)
          probs = softmax(z)
          order = np.argsort(-probs, kind="stable")
          cumulative = np.cumsum(probs[order])
          keep = order[cumulative <= p]
          z[keep] = -np.inf
          return z
    correctLines: [2, 6, 7]
    lineNotes:
      - line: 4
        note: Sorting by descending probability with a stable sort is right - ties go to the lower id.
      - line: 5
        note: The cumulative sum in sorted order is the right quantity to compare with p.
    hints:
      - Does `np.asarray` copy a float64 array?
      - Which token makes the cumulative sum reach p - is it kept by `<= p`?
      - Line 7 assigns -inf to which set?
    solution: |
      Line 2: `np.asarray` returns the same array when it is already float64, so line 7 writes into the caller's
      logits - copy (`np.array(..., copy=True)` or build a new array). Line 6: `cumulative <= p` drops the token that
      crosses p, and keeps nothing when the top token alone exceeds p; keep the first `searchsorted(cumulative, p) +
      1` tokens. Line 7: it sets the **kept** tokens to `-inf`, so only the tail survives - that is why sampling
      returned rare tokens. Build an all-`-inf` array and copy the kept logits into it.

  - id: llm-feature-testdesign
    type: testdesign
    concept: decoding-and-sampling
    skill: application
    title: Test plan for a dispute-summary feature
    prompt: |
      SandPay's dispute screen calls an LLM to summarise a customer's message history into three bullet points, with
      the conversation trimmed to fit a context window and a `max_tokens` of 200. Design tests for the parts that
      depend on how LLMs work: sampling variation, the window and the output limit. Give preconditions, steps,
      expected results and the evidence you would keep.
    modelAnswer: |
      **Preconditions:** a fake LLM client that records requests and returns scripted replies (no network); a
      fixed tokenizer function; a set of 30 real-shaped synthetic dispute histories; for the live check, the
      provider's token counter.

      1. **Budget (fake client):** history of 50 turns that exceeds the window. Expected: the recorded request has
         `input tokens + 200 <= window`, the system prompt and newest message are present, the oldest turns are
         gone, the first message is a user turn. Evidence: the recorded request and the computed counts.
      2. **Newest message alone too big:** expected a clear error before any call; the fake records zero calls.
      3. **Truncation:** script a reply longer than 200 tokens. Expected: the reply is flagged truncated (stop
         reason `max_tokens`) and the UI shows "summary incomplete" or retries, never half a bullet. Evidence: the
         flag and the rendered state.
      4. **Variation (live model, small run):** run the same 30 histories 5 times each. Expected: every output has
         exactly three bullets, mentions the disputed transaction id from the input, and invents no amounts not in
         the input; pass rate reported (target agreed with the product owner, e.g. 100% on format, >= 97% on
         content). Evidence: the outputs, the checks and the pass rate, with model id and date.
      5. **Token counts:** count a sample of prompts with the provider's counter for the configured model; expected
         within the budget the trimming code computed with its tokenizer (or the code uses that counter).
    rubric:
      - Uses a fake client for budget, error and truncation tests, so they are deterministic
      - Asserts input + output budget, keeps system prompt and newest message, drops oldest first
      - Treats a max_tokens stop as incomplete and tests the user-visible behaviour
      - Tests sampled output by properties over several runs with a pass rate, not exact strings
      - Keeps evidence (recorded requests, outputs, model id, date)
    hints:
      - Which of these can be made deterministic with a fake, and which needs the real model?
      - What can you assert about text that varies from run to run?
    solution: |
      See the model answer. The key split: everything around the model (budgeting, errors, stop reasons) is
      tested deterministically with a fake; the model's sampled text is tested by properties and a pass rate.

  - id: next-token-coding
    type: coding
    concept: next-token-prediction
    skill: application
    title: Build next-token training and generation from scratch
    prompt: |
      In `next_token.py`, fix `make_training_pairs` (the draft trains to a suspiciously low loss) and implement
      `bigram_probs`, `cross_entropy`, `perplexity` and `generate` as their docstrings describe. `generate` must
      give the model only the last `context` tokens at every step - the context window - and return only the new
      tokens.
    project: ai
    files:
      - exercises/genai/next_token.py
    test: tests/genai/test_next_token.py
    command: .venv/bin/python -m pytest tests/genai/test_next_token.py
    hints:
      - The targets are the inputs shifted one to the right.
      - "bigram: start from np.full((V, V), alpha), add 1 per adjacent pair, divide each row by its sum."
      - "cross_entropy: -np.log(probs[np.arange(n), targets]).mean()."
      - "generate: keep a list seq = prompt + new tokens; call next_probs(seq[-context:]) each step."
    modelAnswer: |
      ```python
      def make_training_pairs(ids, context):
          if context < 1:
              raise ValueError("context must be at least 1")
          if len(ids) <= context:
              raise ValueError("need more than `context` tokens")
          a = np.asarray(ids, dtype=np.int64)
          n = len(a) - context
          X = np.stack([a[i : i + context] for i in range(n)])
          Y = np.stack([a[i + 1 : i + 1 + context] for i in range(n)])
          return X, Y


      def bigram_probs(ids, vocab_size, alpha=1.0):
          counts = np.full((vocab_size, vocab_size), float(alpha))
          for a, b in zip(ids[:-1], ids[1:]):
              counts[a, b] += 1
          return counts / counts.sum(axis=1, keepdims=True)


      def cross_entropy(probs, targets):
          p = np.asarray(probs, dtype=np.float64)
          t = np.asarray(targets, dtype=np.int64)
          return float(-np.log(p[np.arange(len(t)), t]).mean())


      def perplexity(loss):
          return float(np.exp(loss))


      def generate(next_probs, prompt_ids, max_new_tokens, context, rng=None, stop_id=None):
          seq, new = list(prompt_ids), []
          for _ in range(max_new_tokens):
              probs = np.asarray(next_probs(seq[-context:]), dtype=np.float64)
              token = int(np.argmax(probs)) if rng is None else int(rng.choice(len(probs), p=probs))
              seq.append(token)
              new.append(token)
              if stop_id is not None and token == stop_id:
                  break
          return new
      ```

      The draft's targets equalled its inputs, so the model learned to copy - a loss below the data's floor.
      `seq[-context:]` is the context window: older tokens are never passed to the model.
    rubric:
      - Every test in test_next_token.py passes
      - Targets are shifted by exactly one token and the edge cases raise ValueError
      - The loss uses the natural log, so a uniform guess scores ln V and perplexity V
      - generate never passes more than `context` tokens and does not modify the prompt list
    solution: |
      See the model answer. The tests check the shift on a hand example, the smoothed bigram counts, the uniform
      baseline (`ln 39`), greedy generation stopping at the end token, and that the model sees exactly the last
      `context` tokens at each step.
    followUp: |
      Use your `bigram_probs` and `cross_entropy` on the SandPay log as character ids - you should get close to the
      lesson's 1.650. Why is it not exactly that number?

  - id: sampling-coding
    type: coding
    concept: decoding-and-sampling
    skill: application
    title: Implement temperature, top-k and top-p
    prompt: |
      In `sampling.py`, implement `apply_temperature`, `top_k_filter` and `sample_next`, and fix the draft of
      `top_p_filter`. The tests use the real logits of the lesson's tiny model after `payment 4721 `. Filters
      return a new array with removed tokens at `-inf` and never modify their input; ties go to the lower id.
    project: ai
    files:
      - exercises/genai/sampling.py
    test: tests/genai/test_sampling.py
    command: .venv/bin/python -m pytest tests/genai/test_sampling.py
    hints:
      - "Temperature: logits / T, with a ValueError for T <= 0."
      - "top-k: order = np.argsort(-z, kind='stable'); start from np.full_like(z, -np.inf) and copy z[order[:k]] in."
      - "top-p: the number to keep is np.searchsorted(cumulative, p) + 1 - the token that reaches p is included."
      - "sample_next: greedy when T == 0; otherwise temperature, top-k, top-p, softmax, rng.choice(len(probs), p=probs)."
    modelAnswer: |
      ```python
      def apply_temperature(logits, temperature):
          if temperature <= 0:
              raise ValueError("temperature must be > 0; use temperature=0 in sample_next for greedy decoding")
          return np.asarray(logits, dtype=np.float64) / temperature


      def top_k_filter(logits, k):
          if k < 1:
              raise ValueError("k must be at least 1")
          z = np.asarray(logits, dtype=np.float64)
          keep = np.argsort(-z, kind="stable")[:k]
          out = np.full_like(z, -np.inf)
          out[keep] = z[keep]
          return out


      def top_p_filter(logits, p):
          if not 0 < p <= 1:
              raise ValueError("p must be in (0, 1]")
          z = np.asarray(logits, dtype=np.float64)
          probs = softmax(z)
          order = np.argsort(-probs, kind="stable")
          cumulative = np.cumsum(probs[order])
          n_keep = int(np.searchsorted(cumulative, p - 1e-12)) + 1
          keep = order[: min(n_keep, len(z))]
          out = np.full_like(z, -np.inf)
          out[keep] = z[keep]
          return out


      def sample_next(logits, rng, temperature=1.0, top_k=None, top_p=None):
          z = np.asarray(logits, dtype=np.float64)
          if temperature == 0:
              return int(np.argmax(z))
          z = apply_temperature(z, temperature)
          if top_k is not None:
              z = top_k_filter(z, top_k)
          if top_p is not None:
              z = top_p_filter(z, top_p)
          probs = softmax(z)
          return int(rng.choice(len(probs), p=probs))
      ```

      The draft of `top_p_filter` had three bugs: it wrote into the caller's array, kept only tokens whose
      cumulative sum stayed below p (dropping the one that reaches it), and set the **kept** tokens to `-inf`.
      The `- 1e-12` guards against a cumulative sum of exactly p being stored as a hair below it in floating point.
    rubric:
      - Every test in test_sampling.py passes
      - Filters build new arrays and never modify the input
      - Top-p includes the token that reaches p and always keeps the top token
      - Temperature is applied before the filters, and greedy does not use the random generator
    solution: |
      See the model answer. The tests check the temperature values on the real logits (0.9241, 0.7768, 0.6227 for
      `a`), the kept sets, tie-breaking, sampling frequencies over 4,000 draws, and reproducibility with a seed.
    followUp: |
      Add a `min_p` filter that keeps every token whose probability is at least `min_p` times the top token's. On
      which of the lesson's three prompts would it behave most differently from top-p 0.9?

  - id: context-budget-coding
    type: coding
    concept: context-window
    skill: application
    title: Keep a conversation inside the window
    prompt: |
      In `context_budget.py`, implement `fit_to_window` (drop the oldest messages until input plus the output budget
      fits, keep the newest message, start with a user turn, raise if even the newest message cannot fit) and
      `ask_within_window`, which sends the trimmed conversation through an injected client and reports how many
      messages were dropped and whether the reply was cut off. The tests use the offline `ScriptedLLM`.
    project: ai
    files:
      - exercises/genai/context_budget.py
    test: tests/genai/test_context_budget.py
    command: .venv/bin/python -m pytest tests/genai/test_context_budget.py
    hints:
      - Count every message once, up front, and remember the reply's budget is part of the total.
      - Move a start index forward while the total is too big or the first kept message is from the assistant.
      - "truncated is reply.stop_reason == 'max_tokens'."
    modelAnswer: |
      ```python
      def fit_to_window(system, messages, context_window, max_output_tokens, count=count_tokens):
          if not messages:
              raise ValueError("messages must not be empty")
          sizes = [count(m["content"]) for m in messages]
          fixed = count(system) + max_output_tokens
          if fixed + sizes[-1] > context_window:
              raise ValueError("the system prompt, the newest message and the reply do not fit in the window")
          start = 0
          while fixed + sum(sizes[start:]) > context_window or (start > 0 and messages[start]["role"] == "assistant"):
              start += 1
          kept = [dict(m) for m in messages[start:]]
          return kept, count(system) + sum(sizes[start:])


      def ask_within_window(client, system, messages, context_window, max_output_tokens):
          kept, _ = fit_to_window(system, messages, context_window, max_output_tokens)
          reply = client.create(messages=kept, system=system, max_tokens=max_output_tokens)
          return {
              "text": reply.text,
              "dropped": len(messages) - len(kept),
              "truncated": reply.stop_reason == "max_tokens",
          }
      ```

      The loop can never pass the last message: the guard before it proved that the newest message fits, and the
      newest message is a user turn in a normal conversation.
    rubric:
      - Every test in test_context_budget.py passes
      - The output budget is counted against the window
      - Oldest messages go first; the system prompt and newest message are never dropped
      - A truncated reply is reported, not passed off as complete
      - The client is injected, so no network or key is needed
    solution: |
      See the model answer. The tests check the exact boundary (a 37-token input fits a 60-token window with 23
      output tokens but not 24), the drop order, the leading-assistant rule, the error for an oversized newest
      message, a custom tokenizer, the request the fake recorded, and a reply cut at 5 tokens.
    followUp: |
      Instead of dropping old turns, replace them with one short summary message. What new failure does that
      introduce, and how would you test it?

  - id: interview-how-llms-work
    type: interview
    concept: pretraining-and-instruction-tuning
    skill: analysis
    title: "Interview: explain an LLM to a product team"
    prompt: |
      *"Explain how a chat model like the one behind our support assistant produces an answer, from training to the
      reply on screen. Why does it sometimes make things up, why do answers vary, and why did our long
      conversations start failing?"*
    hints:
      - Tokens, pretraining objective, instruction tuning, generation loop, context window, sampling.
    modelAnswer: |
      The text is split into tokens - subword pieces from a fixed vocabulary. The model was **pretrained** to
      predict the next token over a very large corpus, which teaches it the patterns of language and a lot about
      the world, but only as "what text is likely here". A pretrained base model continues documents; it became an
      assistant through **instruction tuning**: fine-tuning on example prompts and good responses, and (in the
      InstructGPT recipe) a reward model trained on human rankings plus reinforcement learning. That changed its
      behaviour much more than its knowledge.

      At run time our system prompt, the conversation and the new question are tokenised and sent in one request.
      The model outputs a probability for every possible next token; one is chosen, appended, and the loop repeats
      until a stop token or the output limit.

      It **makes things up** because it was trained to produce likely text, not checked facts: asked about a
      refund it has no data on, a plausible status is a likely continuation. We fix that with retrieval or tools
      that put the real data in the prompt and checks on the output. **Answers vary** because the next token is
      sampled from the distribution rather than always taking the top one; we get consistency from clear
      instructions, structured output and validation, not by hoping for determinism. **Long conversations fail**
      because everything - system prompt, history, tool definitions and the reply - must fit in the context window,
      and the API keeps no memory, so history is resent each turn. We count tokens with the provider's tokenizer,
      reserve the output budget, trim or summarise old turns, and check the stop reason for truncated replies.
    rubric:
      - Describes tokens and next-token prediction as the single learned function
      - Separates pretraining (continuation) from instruction tuning (behaviour)
      - Explains hallucination from the training objective and names a grounding fix
      - Explains variation from sampling and how to get consistent behaviour
      - Explains the context window including the output and the stateless API, with a budgeting fix
    followUps:
      - How would you tell whether a wrong answer came from missing context or from the model?
      - What would you measure before and after fine-tuning the model on our tickets?
      - Why might the same prompt cost more tokens after a model upgrade?
    solution: |
      See the model answer. Interviewers listen for one mechanism (next-token prediction) explaining all three
      symptoms, and for engineering fixes rather than "the model is bad".

placement:
  - id: place-floor
    type: mcq
    concept: next-token-prediction
    skill: analysis
    title: A suspiciously good model
    prompt: |
      A character model is trained on a log in which every line contains a random 6-digit id. The data's
      irreducible loss is 0.42 nats per character. A colleague reports a validation loss of 0.08 and a perplexity of
      1.08. What is the most likely explanation?
    options:
      - id: leak
        text: The targets are visible to the model - unshifted targets or a missing causal mask.
        feedback: Correct - no model can beat the randomness of the data; a loss below the floor means it is reading the answer.
      - id: great
        text: The model is excellent and has memorised the ids.
        feedback: Validation ids are new random numbers; memorising training ids cannot predict them.
      - id: overfit
        text: The model is overfitting.
        feedback: Overfitting makes validation loss worse than training loss, not better than the floor.
      - id: perplexity
        text: A perplexity near 1 is normal for character models.
        feedback: Perplexity near 1 means near-certainty about every character, impossible when some characters are random.
    correct: [leak]
    solution: |
      The floor is a property of the data. A validation loss below it is only possible if the target leaks into the
      input; check `Y` is `X` shifted by one and that attention is causally masked.

  - id: place-base-model
    type: mcq
    concept: pretraining-and-instruction-tuning
    skill: application
    title: What instruction tuning changes
    prompt: |
      A base model and the same model after supervised fine-tuning on 50,000 instruction-response pairs are compared.
      Which statement is most accurate?
    options:
      - id: behaviour
        text: The tuned model follows the request format and answers; most of its knowledge still comes from pretraining.
        feedback: Correct - SFT teaches behaviour and format cheaply; knowledge came from the much larger pretraining run.
      - id: knowledge
        text: The tuned model knows many new facts from the 50,000 pairs, which is why it answers better.
        feedback: The pairs teach a way of responding; in the lesson the tuned model answered with a word already in the prompt.
      - id: same
        text: Nothing changes except the stop token.
        feedback: The lesson's tiny model went from 0% to 100% on the question format after SFT.
      - id: architecture
        text: SFT adds new layers that let the model understand questions.
        feedback: SFT continues training the same network with the same next-token loss, usually only on the response tokens.
    correct: [behaviour]
    solution: |
      Instruction tuning is the same next-token training on demonstrations (loss on the response), optionally
      followed by preference tuning. It changes what the model does with a prompt; measure general ability before
      and after, because narrow tuning can also make it forget.

  - id: place-window
    type: mcq
    concept: context-window
    skill: application
    title: The request that failed on turn 40
    prompt: |
      A support chat works for 39 turns, then the 40th request fails with a 400 error about input length. The
      request sends the system prompt, all 39 previous turns, the new message and `max_tokens: 2000`. Which fix is
      correct?
    options:
      - id: trim
        text: Before each request, count tokens and drop or summarise the oldest turns so that input plus 2,000 fits the window, keeping the system prompt and the new message.
        feedback: Correct - history grows every turn because the API is stateless, and the reply's budget counts too.
      - id: retry
        text: Retry the same request with exponential backoff.
        feedback: A 400 for length is not transient; the same request will fail again.
      - id: only-new
        text: Send only the new message; the model remembers the previous turns.
        feedback: The model has no memory between requests; it would lose the conversation.
      - id: raise
        text: Raise max_tokens so the model has more room.
        feedback: max_tokens is part of the window - raising it makes the overflow worse.
    correct: [trim]
    solution: |
      Budget `input + max_tokens <= window` using the provider's token count, and trim old turns first. Then check
      each reply's stop reason in case it was cut off by `max_tokens`.

  - id: place-sampling
    type: mcq
    concept: decoding-and-sampling
    skill: application
    title: Top-p versus top-k
    prompt: |
      At one step the model is almost certain (top token 0.97); at another it is unsure between 12 roughly equal
      tokens. Which decoding setting keeps exactly the reasonable candidates at both steps?
    options:
      - id: top-p
        text: Top-p 0.9 - it keeps 1 token at the first step and about 11 at the second.
        feedback: Correct - the nucleus grows and shrinks with the distribution's shape.
      - id: top-k
        text: Top-k 3 - it keeps 3 tokens at both steps.
        feedback: Three is too many at the first step (it admits tail tokens) and too few at the second (it drops valid ones).
      - id: temp
        text: Temperature 2 - it flattens both.
        feedback: Flattening the confident step promotes unlikely tokens; it does not remove anything.
      - id: greedy
        text: Greedy - it keeps the best token at both.
        feedback: At the second step greedy throws away 11 equally reasonable options and makes output repetitive.
    correct: [top-p]
    solution: |
      Holtzman et al.: flat distributions need many candidates, peaked ones few, so a fixed k is wrong somewhere.
      Top-p keeps the smallest set reaching p, adapting the size (in the lesson, 2 tokens after `payment 4721 ` and
      9 after `refund 8` at p = 0.9).

recall:
  - id: recall-what-llm-computes
    concept: next-token-prediction
    prompt: What is the one function an LLM computes, and how does it write a whole answer with it?
    answer: A probability for every token in its vocabulary as the next token, given the tokens in its window. It writes by choosing a token, appending it and repeating until a stop token or the output limit (autoregressive generation).
  - id: recall-tokens
    concept: next-token-prediction
    prompt: Why must token counts come from the target model's tokenizer?
    answer: Tokenizers are part of the model and differ between families and versions (BPE merges learned from different data). The same text can be a different number of tokens - Anthropic documents about 30% more on its newer tokenizer - and limits and prices are in that model's tokens.
  - id: recall-loss
    concept: next-token-prediction
    prompt: What are the uniform baseline and the floor of a next-token loss, and what does going below the floor mean?
    answer: Uniform guessing over V tokens scores ln V (3.664 for 39). The floor is the data's own randomness (0.319 for the SandPay log). Below the floor means a leak - unshifted targets or no causal mask.
  - id: recall-instruction-tuning
    concept: pretraining-and-instruction-tuning
    prompt: What are InstructGPT's three steps after pretraining, and what does SFT mask?
    answer: (1) Supervised fine-tuning on demonstrations, (2) reward model trained on human rankings, (3) PPO against the reward model (PPO-ptx mixes pretraining updates in). SFT computes the loss only on the response tokens; prompt positions get label -100.
  - id: recall-forgetting
    concept: pretraining-and-instruction-tuning
    prompt: What happened to the tiny model's general loss after narrow SFT, and how was it fixed?
    answer: It rose from 0.354 to 1.937 while task accuracy went to 100%. Adding a pretraining batch's loss to every SFT step kept 100% and brought it back to 0.353.
  - id: recall-window
    concept: context-window
    prompt: What counts toward the context window, and what must an application do about it?
    answer: Everything in the request - system prompt, messages, tool definitions and results - plus the generated reply. Count with the provider's tokenizer, keep input + max output within the window, trim or summarise old turns, and treat a max_tokens stop as a truncated reply.
  - id: recall-sampling
    concept: decoding-and-sampling
    prompt: What do temperature, top-k and top-p each do to the next-token distribution?
    answer: Temperature divides the logits by T (order kept; T < 1 sharper, T > 1 flatter). Top-k keeps the k most likely tokens. Top-p keeps the smallest set whose probabilities sum to at least p, so its size adapts. Greedy takes the argmax and tends to repeat.
  - id: recall-provider-sampling
    concept: decoding-and-sampling
    prompt: Why should a feature not depend on temperature 0 for repeatable output?
    answer: Support is provider- and version-specific (OpenAI accepts temperature 0-2; Anthropic's 2026-10-21 API version rejects temperature, top_p and top_k), and hosted inference is not guaranteed deterministic. Get consistency from instructions, structured output and validation.

