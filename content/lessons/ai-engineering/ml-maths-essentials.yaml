id: ml-maths-essentials
title: The maths of machine learning
subject: ai-engineering
module: ml-foundations
level: beginner
status: published
estimatedMinutes: 85
summary: Only the maths that models need, each idea shown as NumPy code you can run - vectors, dot products, norms and matrix shapes; derivatives, gradients and the chain rule, checked numerically; and probability - Bayes' rule, expectation, variance and the normal distribution. Every printed number in this lesson came from a real run.
