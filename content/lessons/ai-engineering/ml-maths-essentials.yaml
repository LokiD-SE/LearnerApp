    central limit theorem,
  ]

environment: |
  - **Runtime and libraries:** **Python 3.12.3**, **NumPy 2.5.4** and pytest 9.2.0 - the versions pinned in
    `practice/ai/requirements.txt`. Every printed array, error message and number in this lesson was produced by
    running the code shown with `practice/ai/.venv/bin/python` on Linux in November 2026. Random numbers come
    from `np.random.default_rng` with a fixed seed, so you get the same output.
  - **Data:** SandPay is a fictional payments company. The merchants, payments, refund amounts and fraud
    rates in this lesson are synthetic, chosen to make the arithmetic visible - they are not statistics about
    real payment fraud.
  - **Linear algebra:** Ian Goodfellow, Yoshua Bengio and Aaron Courville, *Deep Learning* (MIT Press, 2016),
    [chapter 2, Linear Algebra](https://www.deeplearningbook.org/contents/linear_algebra.html) - scalars,
    vectors, matrices and tensors; the matrix product, the Hadamard product, broadcasting (2.1-2.2); "matrix
    multiplication is not commutative", (AB)ᵀ = BᵀAᵀ; the remark that A⁻¹ "is primarily useful as a
    theoretical tool" and should not be used in most software (2.3); norms and the Euclidean (L²) norm, and
    x·y = ‖x‖₂‖y‖₂ cos θ (2.5). Zico Kolter and Chuong Do, [Linear Algebra Review and
    Reference](https://cs229.stanford.edu/section/cs229-linalg.pdf) (Stanford CS229, 2015) - the matrix-vector
    and matrix-matrix product views (section 2) and the gradient of a quadratic form, ∇ₓ xᵀAx = 2Ax for
    symmetric A (section 4.3).
  - **Calculus and gradients:** *Deep Learning* [chapter 4, Numerical
    Computation](https://www.deeplearningbook.org/contents/numerical.html) - partial derivatives, the gradient,
    "the gradient points directly uphill", steepest (gradient) descent x′ = x − ε∇ₓf(x) with ε the learning
    rate (4.3); and [chapter 11, Practical
    Methodology](https://www.deeplearningbook.org/contents/guidelines.html), section 11.5 - checking derivatives
    with finite differences, the centred difference (equation 11.7) and the warning that the perturbation
    "must be large enough" not to be rounded away. Marc Peter Deisenroth, A. Aldo Faisal and Cheng Soon Ong,
    *Mathematics for Machine Learning* (Cambridge University Press, 2020; [free PDF at
    mml-book.github.io](https://mml-book.github.io/)), chapter 5 - partial derivatives, gradients and the
    chain rule (section 5.2.2).
  - **Probability:** *Deep Learning* [chapter 3, Probability and Information
    Theory](https://www.deeplearningbook.org/contents/prob.html) - conditional probability, expectation (linear),
    variance (3.8), the normal distribution as "a good default choice" and the central limit theorem (3.9.3),
    Bayes' rule (3.11). Arian Maleki and Tom Do, [Review of Probability
    Theory](https://cs229.stanford.edu/section/cs229-prob.pdf) (Stanford CS229) - Bayes's rule for discrete and
    continuous variables (3.5) and independence (3.6).
  - **NumPy documentation:** [numpy.matmul](https://numpy.org/doc/stable/reference/generated/numpy.matmul.html)
    (the `@` operator; "Multiplication by scalars is not allowed, use * instead"),
    [numpy.linalg.norm](https://numpy.org/doc/stable/reference/generated/numpy.linalg.norm.html) (the `ord`
    parameter; 2-norm by default) and the [linear algebra
    routines](https://numpy.org/doc/stable/reference/routines.linalg.html) (`solve`, `inv`, `eigh`, `svd`).
  - **Scope:** this lesson teaches the maths as a working engineer uses it - notation, shapes, what each
    formula computes and how to check it in code. It does not prove theorems; the two textbooks above do, and
    are free online.

prerequisites:
  - python-numpy-pandas

concepts:
  - id: ml-vectors-and-matrices
    name: Vectors, matrices and their products
    summary: A data set is a matrix X of shape (n, d) - one row per example, one column per feature - and a linear model is the matrix-vector product X @ w + b. The dot product measures alignment (x·y = ‖x‖‖y‖cos θ), norms measure size, and the shapes must agree - (n, d) @ (d,) gives (n,). Matrix multiplication is not commutative, * is element-wise (the Hadamard product), and broadcasting silently stretches mismatched shapes, which is where most numeric bugs start.
  - id: ml-derivatives-and-gradients
    name: Derivatives, gradients and the chain rule
    summary: A derivative is the slope of a function; a partial derivative is the slope along one input; the gradient collects every partial derivative into a vector that points uphill. Training moves the parameters a small step against the gradient of the loss. The chain rule turns the derivative of a composed function into a product of simple derivatives, and a centred finite difference checks an analytic gradient numerically.
  - id: ml-probability-essentials
    name: Probability, Bayes' rule and the normal distribution
    summary: Models output and reason about probabilities. Conditional probability P(A | B) is not P(B | A) - Bayes' rule converts one into the other using the base rate, which is why a 95%-accurate fraud flag can still be wrong most of the time. Expectation is a probability-weighted average, variance the expected squared distance from it, and the normal distribution - justified by the central limit theorem - is the default model for noise.

objectives:
  - Write the shapes of X, w, X @ w and X.T @ r for a data set of n examples and d features, and predict whether a NumPy expression will raise, broadcast or work.
  - Compute a dot product, an L1 and L2 norm and a cosine similarity, and explain why an unscaled feature can make two very different vectors look almost identical.
  - Explain what a partial derivative and a gradient are, why gradient descent steps against the gradient, and derive the gradient of the mean squared error of a linear model with the chain rule.
  - Write a centred finite-difference gradient and use a relative-error check to accept or reject an analytic gradient.
  - Apply Bayes' rule with a base rate to compute P(fraud | flagged), and explain to a non-specialist why it is far below the detector's true positive rate.
  - Compute the expectation and variance of a discrete distribution, choose between ddof=0 and ddof=1, and use the 68-95-99.7 rule and the central limit theorem to reason about averages.

sections:
  - id: intuition
    kind: intuition
    concepts: [ml-vectors-and-matrices, ml-derivatives-and-gradients, ml-probability-essentials]
    title: The idea in plain language
    body: |
      Machine learning uses three kinds of maths, and each answers one everyday question.

      - **Linear algebra - "how do I describe things and combine them?"** A SandPay merchant becomes a list of
        numbers: average payment, refunds per 100 orders, orders per day. That list is a **vector**. A
        thousand merchants stacked as rows are a **matrix**. A model that scores every merchant at once is
        one **matrix product** - the same idea as a spreadsheet where every row is multiplied by the same
        column of weights and summed.
      - **Calculus - "which way is downhill?"** Training a model means turning knobs (the weights) until the
        error is small. The **gradient** tells you, for every knob at once, which way to turn it and how
        strongly the error responds. It is like being on a foggy hillside: you cannot see the valley, but you
        can feel the slope under your feet, so you step downhill and repeat.
      - **Probability - "how sure should I be?"** A fraud model doesn't say "fraud", it says "0.06". Knowing
        what that number means, and why a detector that catches 95% of fraud can still be wrong about most
        of the payments it flags, is probability.

      You don't need to prove anything to use these. You need to **read the notation, know the shapes, and
      check your numbers in code** - which is what this lesson practises, with NumPy, on SandPay data.

  - id: why
    kind: why
    concepts: [ml-vectors-and-matrices, ml-derivatives-and-gradients, ml-probability-essentials]
    title: Why an engineer needs this, even with libraries
    body: |
      scikit-learn and PyTorch hide the formulas, so why learn them? Because the bugs and the decisions are
      in the maths, and the libraries don't catch them for you:

      - **Shape bugs are silent.** NumPy broadcasting turns a mistake into a plausible wrong number instead of
        an error - you only notice if you know what shape each result should have.
      - **Training is calculus.** Learning rates, exploding and vanishing gradients, why features need scaling
        and why a custom loss "doesn't learn" are all questions about gradients.
      - **Outputs are probabilities.** Choosing a threshold, explaining why most alerts are false, or deciding
        whether a drop in an average is real or noise needs conditional probability, variance and the central
        limit theorem.
      - **Papers and documentation are written in this notation.** The scikit-learn user guide, the PyTorch
        docs and the transformer paper later in this track all assume you can read ∇, Σ, ‖x‖ and P(A | B).

      The goal is not to prove theorems. It is to read the notation, predict the shapes, and check the numbers
      in code - fast enough that it becomes a habit.

  - id: what-vectors
    kind: what
    concepts: [ml-vectors-and-matrices]
    title: Scalars, vectors, matrices and the words for them
    body: |
      *Deep Learning* (chapter 2.1) names four objects. The table adds the NumPy view, because in code the
      **shape** is how you tell them apart.

      | Object | Notation | Example | NumPy shape |
      | --- | --- | --- | --- |
      | **Scalar** - one number | lower-case italic, *b* | a bias, a learning rate | `()` or a Python `float` |
      | **Vector** - an ordered list | bold lower-case, **x**, element x₁ | one merchant's 3 features | `(3,)` |
      | **Matrix** - a 2-D grid | bold upper-case, **X**, element X₁,₂ | 4 merchants × 2 features | `(4, 2)` |
      | **Tensor** - more than 2 axes | **𝖃** | a batch of images: 32 × 28 × 28 | `(32, 28, 28)` |

      The convention used everywhere in machine learning (scikit-learn, PyTorch, the textbooks): **rows are
      examples, columns are features**. A data set with *n* examples and *d* features is an (*n*, *d*) matrix,
      and a weight vector **w** has one entry per feature - length *d*.

      **Operations you will meet constantly:**

      - **Dot product** x·y = xᵀy = Σᵢ xᵢyᵢ - multiply matching entries and add. It is one number.
      - **Norm** - the size of a vector. The **L²** (Euclidean) norm ‖x‖₂ = √(Σ xᵢ²) is the straight-line
        distance from the origin; the **L¹** norm ‖x‖₁ = Σ |xᵢ| adds absolute values. The *squared* L² norm
        is simply xᵀx, which is easier to differentiate - *Deep Learning* 2.5 notes this is why losses often
        use it.
      - **Cosine similarity** - from x·y = ‖x‖₂‖y‖₂ cos θ: divide the dot product by both lengths to get the
        cosine of the angle between the vectors, from −1 (opposite) through 0 (unrelated, at right angles) to 1
        (same direction). It compares **direction, not size** - the idea behind embedding search later in
        this track.
      - **Transpose** Xᵀ - swap rows and columns: (4, 2) becomes (2, 4).
      - **Element-wise (Hadamard) product** A ⊙ B - multiply matching entries; same shapes in, same shape out.
        In NumPy this is `*`. The matrix product is `@`.

  - id: vectors-code
    kind: code
    concepts: [ml-vectors-and-matrices]
    title: Dot products, norms and cosine similarity in NumPy
    body: |
      Two SandPay merchants, described by average payment (EUR), refunds per 100 orders and orders per day:

      ```python
      import numpy as np
      print("numpy", np.__version__)
      a = np.array([42.0, 1.5, 120.0])
      b = np.array([40.0, 2.0, 110.0])
      print("a * b  ->", a * b)
      print("a @ b  ->", a @ b)
      print("np.dot ->", np.dot(a, b))
      print("norm a ->", round(float(np.linalg.norm(a)), 4))
      print("sqrt(a@a) ->", round(float(np.sqrt(a @ a)), 4))
      print("L1 a   ->", np.linalg.norm(a, ord=1))
      cos = a @ b / (np.linalg.norm(a) * np.linalg.norm(b))
      print("cosine ->", round(float(cos), 6))
      print("shapes:", a.shape, a.reshape(-1, 1).shape, a.reshape(1, -1).shape)
      ```

      Real output:

      ```plaintext
      numpy 2.5.4
      a * b  -> [1.68e+03 3.00e+00 1.32e+04]
      a @ b  -> 14883.0
      np.dot -> 14883.0
      norm a -> 127.1466
      sqrt(a@a) -> 127.1466
      L1 a   -> 163.5
      cosine -> 0.999913
      shapes: (3,) (3, 1) (1, 3)
      ```

      What to notice:

      - `a * b` is **element-wise** (three numbers, printed in scientific notation because they differ so much
        in size); `a @ b` and `np.dot(a, b)` are the **dot product** (one number).
      - `np.linalg.norm` with no `ord` gives the L² norm - the [NumPy
        documentation](https://numpy.org/doc/stable/reference/generated/numpy.linalg.norm.html) says it returns
        "the 2-norm of x.ravel" when both `ord` and `axis` are None - which equals √(a·a).
      - The cosine is **0.999913** - almost identical direction. But look at the refund rate: 1.5 against 2.0
        is a third higher. The orders-per-day feature (around 100) is so much larger than the others that it
        dominates both the dot product and the norms. Distances and similarities on **unscaled features**
        mostly measure the biggest feature - which is why feature scaling (later in this module) matters.
      - A 1-D array has shape `(3,)` - it is neither a row nor a column. `reshape(-1, 1)` makes a (3, 1)
        column and `reshape(1, -1)` a (1, 3) row. Mixing these three is the commonest shape bug.

  - id: matrices
    kind: internals
    concepts: [ml-vectors-and-matrices]
    title: Matrix multiplication is about shapes
    body: |
      The matrix product C = AB is defined when A has as many **columns** as B has **rows**:

      ```plaintext
      A (n, k)  @  B (k, m)  ->  C (n, m)        C[i, j] = Σ_k A[i, k] · B[k, j]
                └── must match ──┘
      ```

      Each entry of C is the dot product of a **row of A** with a **column of B**. The CS229 linear algebra
      review shows two more useful ways to read the same product:

      - **X @ w, row view** - each output is (row i of X) · w: one prediction per example. With X of shape
        (n, d) and w of shape (d,), the result has shape (n,).
      - **X @ w, column view** - the result is a weighted sum of the **columns** of X: w₁ × (feature 1 for every
        example) + w₂ × (feature 2) + ... This is why a linear model is "a weighted combination of features".

      Rules *Deep Learning* 2.2 lists, which you will use when deriving gradients:

      - distributive A(B + C) = AB + AC and associative A(BC) = (AB)C;
      - **not commutative** - AB = BA "does not always hold" (often BA isn't even defined);
      - the dot product of vectors *is* commutative, xᵀy = yᵀx;
      - transpose of a product reverses the order: (AB)ᵀ = BᵀAᵀ.

      **Broadcasting.** NumPy (and the book, which calls it "this implicit copying") lets you add a vector to
      every row of a matrix: `X + b` where X is (4, 2) and b is (2,). The rule: compare shapes from the right;
      two sizes are compatible if they are equal or one of them is 1, and size-1 axes are stretched. It is
      essential - `X @ w + b` adds the scalar bias to every prediction - and it is dangerous: a (4,) array
      minus a (4, 1) array is not an error, it is a (4, 4) matrix of every pairwise difference.

      **Solving instead of inverting.** A linear system Ax = b has the textbook solution x = A⁻¹b, but *Deep
      Learning* 2.3 warns that A⁻¹ "is primarily useful as a theoretical tool" and "should not actually be used
      in practice for most software applications", because it can be represented only with limited precision.
      In NumPy, call `np.linalg.solve(A, b)`, which solves the system directly.

  - id: matrices-code
    kind: code
    concepts: [ml-vectors-and-matrices]
    title: Scoring four merchants at once - and three shape traps
    body: |
      ```python
      import numpy as np
      X = np.array([[42.0, 1.5], [40.0, 2.0], [95.0, 0.5], [12.0, 6.0]])   # 4 merchants x 2 features
      w = np.array([0.02, 0.4])
      b = -1.0
      print("X.shape", X.shape, "w.shape", w.shape)
      print("X @ w + b ->", X @ w + b)
      print("X * w     ->\n", X * w)
      A = np.array([[1, 2], [3, 4]])
      B = np.array([[0, 1], [1, 0]])
      print("A @ B ->\n", A @ B)
      print("B @ A ->\n", B @ A)
      print("(A@B).T == B.T @ A.T ->", np.array_equal((A @ B).T, B.T @ A.T))
      try:
          w @ X
      except ValueError as e:
          print("ValueError:", e)
      y = np.array([1.0, 2.0, 3.0, 4.0])
      col = y.reshape(-1, 1)
      print("(y - col).shape ->", (y - col).shape)
      M = np.array([[2.0, 1.0], [1.0, 3.0]])
      rhs = np.array([3.0, 5.0])
      x = np.linalg.solve(M, rhs)
      print("solve ->", x, "check M@x ->", M @ x)
      ```

      Real output:

      ```plaintext
      X.shape (4, 2) w.shape (2,)
      X @ w + b -> [0.44 0.6  1.1  1.64]
      X * w     ->
       [[0.84 0.6 ]
       [0.8  0.8 ]
       [1.9  0.2 ]
       [0.24 2.4 ]]
      A @ B ->
       [[2 1]
       [4 3]]
      B @ A ->
       [[3 4]
       [1 2]]
      (A@B).T == B.T @ A.T -> True
      ValueError: matmul: Input operand 1 has a mismatch in its core dimension 0, with gufunc signature (n?,k),(k,m?)->(n?,m?) (size 4 is different from 2)
      (y - col).shape -> (4, 4)
      solve -> [0.8 1.4] check M@x -> [3. 5.]
      ```

      Read it line by line:

      1. `X @ w + b` - (4, 2) @ (2,) gives (4,): **one score per merchant**, and the scalar b is broadcast to
         all four.
      2. `X * w` - no error, but it is **element-wise**: w is broadcast across the rows and you get a (4, 2)
         matrix of products, not scores. Summing it all (a common "fix") gives one number for the whole data
         set, not one per row.
      3. `A @ B` and `B @ A` differ - B swaps columns when it is on the right and rows when it is on the left.
      4. `w @ X` puts the (2,) vector on the left of a (4, 2) matrix: the inner sizes are 2 and 4, so NumPy
         raises. The message names the gufunc signature `(n?,k),(k,m?)->(n?,m?)` - "core dimension" is the
         shared `k`.
      5. `y - col` - (4,) minus (4, 1) **silently broadcasts** to (4, 4). If `y` were true values and `col`
         predictions, a loss computed on this would average 16 numbers instead of 4 and be wrong without any
         error.
      6. `np.linalg.solve` returns x with M @ x = rhs, without ever forming M⁻¹.

  - id: visual-graph
    kind: visual
    concepts: [ml-derivatives-and-gradients, ml-vectors-and-matrices]
    title: The forward pass, with shapes, and the chain rule going back
    body: |
      ```mermaid
      flowchart LR
        X["X (n, d)"] --> P["z = X @ w + b  (n,)"]
        W["w (d,)"] --> P
        B["b scalar"] --> P
        P --> R["r = z - y  (n,)"]
        Y["y (n,)"] --> R
        R --> L["loss = mean(r²)  scalar"]
        L -. "dL/dr = 2r / n  (n,)" .-> R
        R -. "dL/dw = Xᵀ (2r / n)  (d,)" .-> W
        R -. "dL/db = sum(2r / n)  scalar" .-> B
      ```

      Solid arrows are the **forward pass** - data flowing to a single number, the loss. Dotted arrows are the
      **backward pass** - the chain rule carrying "how much does the loss change" back to each parameter.
      Notice two things: every gradient has **the same shape as the parameter it belongs to** (dL/dw is (d,)
      like w), and getting from (n,) residuals to a (d,) gradient needs Xᵀ - a (d, n) matrix - on the left.

  - id: derivatives
    kind: internals
    concepts: [ml-derivatives-and-gradients]
    title: Derivatives, partial derivatives and the gradient
    body: |
      **Derivative.** For a function of one number, f′(x) is the slope at x: the limit of
      (f(x + ε) − f(x)) / ε as ε shrinks. It tells you how much the output changes per unit change of the
      input. *Deep Learning* 4.3 makes the point that matters for training: f(x − ε · sign(f′(x))) is smaller
      than f(x) for a small enough ε - so you can **reduce f by moving against the sign of the derivative**.
      Points where f′(x) = 0 are critical (stationary) points: minima, maxima or saddle points.

      **Partial derivative.** A loss depends on many weights. The partial derivative ∂f/∂xᵢ "measures how f
      changes as only the variable xᵢ increases" - hold every other input still and take the ordinary
      derivative.

      **Gradient.** ∇ₓf(x) is the vector of all partial derivatives, one per input, so **it has the same shape
      as x**. The book shows that the gradient "points directly uphill, and the negative gradient points
      directly downhill". **Gradient descent** (steepest descent) therefore updates

      ```plaintext
      x_new = x − ε ∇ₓf(x)        ε is the learning rate, a small positive number
      ```

      Too small an ε crawls; too large overshoots the valley and can diverge - the next lesson shows both.

      **The chain rule.** Models are functions of functions: the loss is a mean of squares of residuals, which
      are predictions minus targets, which are a matrix product of the weights. The chain rule differentiates
      such a composition by multiplying the derivatives of its pieces: if L = g(r) and r = h(w), then
      ∂L/∂w = ∂L/∂r · ∂r/∂w. *Mathematics for Machine Learning* (5.2.2) writes the multivariate form: for
      f(x₁(t), x₂(t)), df/dt = ∂f/∂x₁ · dx₁/dt + ∂f/∂x₂ · dx₂/dt - add up every path from t to f.

      **The gradient of mean squared error**, derived with the chain rule - this is the formula behind the
      diagram above and the coding exercise:

      ```plaintext
      r = X w + b − y                  (n,)     residuals
      L = (1/n) Σᵢ rᵢ²                 scalar   mean squared error
      ∂L/∂rᵢ = 2 rᵢ / n                         outer function: derivative of a mean of squares
      ∂rᵢ/∂wⱼ = Xᵢⱼ,  ∂rᵢ/∂b = 1                inner function: linear
      ∂L/∂wⱼ = Σᵢ (2 rᵢ / n) Xᵢⱼ   →   ∇_w L = (2/n) Xᵀ r     (d,)
      ∂L/∂b  = Σᵢ (2 rᵢ / n)       →   (2/n) Σ r              scalar
      ```

      The sum over i (all examples) is exactly what the product Xᵀr computes. One more result from the CS229
      review that appears in later lessons: for a symmetric matrix A, ∇ₓ(xᵀAx) = 2Ax - the matrix version of
      d/dx (ax²) = 2ax.

  - id: gradient-check
    kind: internals
    concepts: [ml-derivatives-and-gradients]
    title: Checking a gradient with finite differences
    body: |
      A hand-derived gradient is easy to get subtly wrong - a missing factor of 2, a transposed matrix, a sign.
      The model still trains, just badly, and nothing raises an error. *Deep Learning* 11.5 recommends
      comparing your derivatives with **numerical** ones from finite differences:

      - **forward difference** f′(x) ≈ (f(x + ε) − f(x)) / ε;
      - **centred difference** f′(x) ≈ (f(x + ε/2) − f(x − ε/2)) / ε (the book's equation 11.7) - more accurate,
        because the first-order error terms cancel.

      For a gradient, nudge **one coordinate at a time** and compute that partial derivative. The book adds a
      warning: ε "must be large enough to ensure that the perturbation is not rounded down too much by
      finite-precision numerical computations". Too large, and the approximation is crude; too small, and
      floating-point rounding swamps the difference. The table below shows both effects on a real run.

      To compare analytic and numerical gradients, use a **relative error** per coordinate,
      |a − n| / max(|a| + |n|, tiny) - an absolute difference of 0.001 is huge for a gradient of 0.002 and
      nothing for one of 5000. In double precision, a correct gradient typically gives a relative error far
      below 1e-6; a wrong one gives something like 0.1 to 1. The "tiny" floor stops a division by zero when both
      gradients are 0.

  - id: gradient-code
    kind: code
    concepts: [ml-derivatives-and-gradients]
    title: Finite differences, a gradient check and gradient descent - real runs
    body: |
      **How ε changes the error.** f(x) = x³ at x = 2, where the true derivative is 3x² = 12:

      ```python
      f = lambda x: x ** 3
      df = lambda x: 3 * x ** 2
      x = 2.0
      print(f"{'eps':>8} {'forward error':>15} {'centred error':>15}")
      for eps in [1e-1, 1e-3, 1e-5, 1e-8, 1e-11]:
          fwd = (f(x + eps) - f(x)) / eps
          ctr = (f(x + eps / 2) - f(x - eps / 2)) / eps
          print(f"{eps:>8.0e} {abs(fwd - df(x)):>15.3e} {abs(ctr - df(x)):>15.3e}")
      ```

      ```plaintext
           eps   forward error   centred error
         1e-01       6.100e-01       2.500e-03
         1e-03       6.001e-03       2.500e-07
         1e-05       6.000e-05       9.902e-11
         1e-08       7.293e-08       7.293e-08
         1e-11       9.929e-07       9.929e-07
      ```

      From 1e-1 to 1e-5 the forward error shrinks in step with ε, and the centred error with ε² - far smaller.
      Below that, **rounding wins**: at 1e-8 and 1e-11 both errors grow again. Around 1e-5 is a good default
      for double precision and centred differences.

      **A gradient check on a linear model** (50 synthetic examples, 3 features, `default_rng(7)`). `grad` is
      the chain-rule formula; `grad_buggy` forgot the 2 from the derivative of r²:

      ```python
      def grad(w, b):
          r = X @ w + b - y
          n = len(y)
          return 2 / n * X.T @ r, 2 / n * r.sum()
      def grad_buggy(w, b):
          r = X @ w + b - y
          n = len(y)
          return 1 / n * X.T @ r, 1 / n * r.sum()   # forgot the 2 from the chain rule
      def numgrad(w, b, eps=1e-5):
          g = np.zeros_like(w)
          for i in range(len(w)):
              e = np.zeros_like(w); e[i] = eps
              g[i] = (loss(w + e / 2, b) - loss(w - e / 2, b)) / eps
          return g
      def relerr(a, n):
          return float(np.max(np.abs(a - n) / np.maximum(np.abs(a) + np.abs(n), 1e-12)))
      ```

      ```plaintext
      loss at w0       3.4913
      analytic dw      [-2.184347  2.593644 -0.938253]
      numerical dw     [-2.184347  2.593644 -0.938253]
      relative error   3.7e-11
      buggy dw         [-1.092174  1.296822 -0.469127]
      buggy rel error  0.3333
      ```

      The correct gradient agrees to 3.7e-11. The buggy one is exactly half, so its relative error is
      (2 − 1) / (2 + 1) = 1/3 in every coordinate - a number that clearly means "wrong", not "rounding".

      **Gradient descent with the correct gradient**, learning rate 0.1, from w = 0. The data were generated
      with true weights [2, −1, 0.5] and bias 0.3 plus noise:

      ```plaintext
      step  0  loss 4.3463  w [0. 0. 0.]  b 0.000
      step 10  loss 0.2135  w [ 1.489 -0.844  0.557]  b -0.038
      step 20  loss 0.0307  w [ 1.828 -0.961  0.53 ]  b 0.175
      step 30  loss 0.0096  w [ 1.942 -0.988  0.504]  b 0.253
      step 40  loss 0.0070  w [ 1.981 -0.996  0.493]  b 0.279
      step 50  loss 0.0067  w [ 1.995 -0.999  0.489]  b 0.288
      ```

      Each step moves every weight against its partial derivative, and the loss falls towards the noise level
      (the noise had standard deviation 0.1, so variance 0.01). The weights approach the ones that generated
      the data. [Linear regression and gradient descent](#/lesson/linear-regression-gradient-descent) builds
      on exactly this loop.

  - id: probability
    kind: internals
    concepts: [ml-probability-essentials]
    title: Probability rules and Bayes' rule
    body: |
      **The basics.** A probability is a number in [0, 1]; the probabilities of all outcomes sum to 1.
      *Deep Learning* chapter 3 uses a few rules over and over:

      - **Joint** P(A, B) - both happen. **Marginal** P(A) - sum the joint over B (the *sum rule*).
      - **Conditional** P(A | B) = P(A, B) / P(B) - the probability of A *among the cases where B happened*.
      - **Product rule** P(A, B) = P(A | B) P(B).
      - **Independence** - P(A, B) = P(A) P(B); then knowing B tells you nothing about A.
      - **Law of total probability** P(B) = P(B | A) P(A) + P(B | not A) P(not A).

      **Bayes' rule** turns a conditional around:

      ```plaintext
      P(A | B) = P(B | A) · P(A) / P(B)
      ```

      It matters because the probability you can **measure** is usually the wrong way round. When SandPay
      tests a fraud detector on known cases, it measures P(flagged | fraud) - the *true positive rate*. A
      reviewer looking at a flagged payment needs P(fraud | flagged). Bayes' rule connects them, through the
      **base rate** P(fraud) (the *prior*). The result, P(fraud | flagged), is the *posterior*.

      **Worked example** (synthetic numbers): 0.2% of payments are fraud; the detector flags 95% of fraud and,
      wrongly, 3% of legitimate payments.

      ```plaintext
      P(flagged) = 0.95 × 0.002 + 0.03 × 0.998 = 0.03184
      P(fraud | flagged) = 0.95 × 0.002 / 0.03184 ≈ 0.0597
      ```

      Only about **6%** of flagged payments are fraud. The detector is good, but legitimate payments
      outnumber fraud 499 to 1, so the 3% false alarms on them outnumber the real catches. Ignoring the base
      rate - reading 95% as "a flagged payment is 95% likely to be fraud" - is the *base-rate fallacy*, and it
      comes up again in every lesson on classification metrics (precision is exactly this posterior).

  - id: expectation
    kind: internals
    concepts: [ml-probability-essentials]
    title: Expectation, variance and the normal distribution
    body: |
      **Expectation** E[X] is the probability-weighted average of the values: Σ x · P(x) for a discrete
      variable (an integral for a continuous one). It is **linear** - E[αX + βY] = αE[X] + βE[Y] - which is
      why the expected loss of a model is the average of expected losses per example.

      **Variance** Var(X) = E[(X − E[X])²] - the expected squared distance from the mean. The **standard
      deviation** is its square root, in the same units as X.

      **Population or sample?** NumPy's `np.var(x)` divides by n (`ddof=0`, "delta degrees of freedom" 0):
      the variance of exactly these numbers. `np.var(x, ddof=1)` divides by n − 1: the unbiased estimate of
      the variance of the population they were drawn from. For `[4, 7, 13]` the two are 14.0 and 21.0 (real
      run below). On large samples they are nearly equal; on small ones, say which one you used. pandas'
      `Series.var()` and `std()` default to `ddof=1`, unlike NumPy - a classic source of "my numbers don't
      match".

      **The normal (Gaussian) distribution** N(μ, σ²) has density

      ```plaintext
      p(x) = exp(−(x − μ)² / (2σ²)) / (σ √(2π))
      ```

      a symmetric bell with its peak at μ and width set by σ. *Deep Learning* 3.9.3 calls it "a good default
      choice" when you know nothing better, for two reasons. First, the **central limit theorem**: the sum
      (or mean) of many independent random variables is approximately normal, whatever their own
      distribution - so noise built from many small causes looks normal. Second, among distributions with a
      given variance, the normal one carries the least prior knowledge (the most uncertainty). The handy
      consequence is the **68-95-99.7 rule**: about 68%, 95% and 99.7% of values fall within 1, 2 and 3
      standard deviations of the mean.

  - id: probability-code
    kind: code
    concepts: [ml-probability-essentials]
    title: Bayes, variance and the normal distribution - checked by simulation
    collapsed: true
    body: |
      ```python
      import numpy as np
      prior, tpr, fpr = 0.002, 0.95, 0.03
      p_flag = tpr * prior + fpr * (1 - prior)
      post = tpr * prior / p_flag
      print(f"P(flag)         = {p_flag:.5f}")
      print(f"P(fraud | flag) = {post:.4f}")
      rng = np.random.default_rng(42)
      n = 1_000_000
      fraud = rng.random(n) < prior
      flag = np.where(fraud, rng.random(n) < tpr, rng.random(n) < fpr)
      print("simulated: flagged", int(flag.sum()), "fraud among flagged", int((flag & fraud).sum()),
            "share", round(float((flag & fraud).sum() / flag.sum()), 4))
      values = np.array([0.0, 10.0, 50.0])        # refund per order, EUR
      probs = np.array([0.90, 0.08, 0.02])
      mean = values @ probs
      var = ((values - mean) ** 2) @ probs
      print("E[refund] =", round(float(mean), 4), " Var =", round(float(var), 4), " SD =", round(float(np.sqrt(var)), 4))
      draws = rng.choice(values, size=200_000, p=probs)
      print("sample mean", round(float(draws.mean()), 4), "sample var ddof=0", round(float(draws.var()), 4),
            "ddof=1", round(float(draws.var(ddof=1)), 4))
      small = np.array([4.0, 7.0, 13.0])
      print("np.var(small)", round(float(np.var(small)), 4), "np.var(small, ddof=1)", round(float(np.var(small, ddof=1)), 4))
      mu, sigma = 35.0, 8.0
      x = rng.normal(mu, sigma, size=100_000)
      print("normal sample mean", round(float(x.mean()), 3), "std", round(float(x.std()), 3))
      for k in (1, 2, 3):
          print(f"within {k} sigma: {np.mean(np.abs(x - mu) < k * sigma):.4f}")
      pdf = lambda t: np.exp(-0.5 * ((t - mu) / sigma) ** 2) / (sigma * np.sqrt(2 * np.pi))
      print("pdf at mean", round(float(pdf(mu)), 5), " pdf at mean+2sigma", round(float(pdf(mu + 2 * sigma)), 5))
      means = rng.exponential(scale=20.0, size=(50_000, 30)).mean(axis=1)
      print("CLT: mean of means", round(float(means.mean()), 3), "std of means", round(float(means.std()), 3),
            "theory", round(20.0 / np.sqrt(30), 3))
      print("within 2 std of the means:", round(float(np.mean(np.abs(means - means.mean()) < 2 * means.std())), 4))
      ```

      Real output:

      ```plaintext
      P(flag)         = 0.03184
      P(fraud | flag) = 0.0597
      simulated: flagged 31887 fraud among flagged 1933 share 0.0606
      E[refund] = 1.8  Var = 54.76  SD = 7.4
      sample mean 1.7983 sample var ddof=0 54.8291 ddof=1 54.8294
      np.var(small) 14.0 np.var(small, ddof=1) 21.0
      normal sample mean 35.012 std 7.997
      within 1 sigma: 0.6826
      within 2 sigma: 0.9545
      within 3 sigma: 0.9974
      pdf at mean 0.04987  pdf at mean+2sigma 0.00675
      CLT: mean of means 19.99 std of means 3.658 theory 3.651
      within 2 std of the means: 0.9566
      ```

      - A million simulated payments agree with Bayes' rule: 6.06% of flagged payments are fraud against 5.97%
        calculated - the gap is sampling noise.
      - The refund distribution has a mean of 1.8 EUR but a standard deviation of 7.4 - most orders refund
        nothing and a few refund a lot. The mean alone hides that.
      - With 200,000 draws, ddof 0 and 1 differ only in the fourth decimal; with three numbers they differ by
        half.
      - The normal sample lands on the 68-95-99.7 rule. The density is a **density**, not a probability:
        0.04987 at the mean means "about 5% per EUR near 35", and a density can exceed 1 when σ is small.
      - **The central limit theorem in action:** a single exponential draw is very skewed (most small, a long
        tail), yet the means of 30 draws have a standard deviation of 3.658 - close to σ/√n = 20/√30 = 3.651 -
        and 95.66% of them fall within 2 standard deviations, as for a normal distribution.

  - id: steps
    kind: steps
    concepts: [ml-vectors-and-matrices, ml-derivatives-and-gradients]
    title: Checking maths code before you trust it
    body: |
      1. **Write the shapes** next to every array, as comments: `X (n, d)`, `w (d,)`, `r (n,)`. Any line whose
         shapes you can't write is a bug waiting.
      2. **Assert the shapes** of the results in code (`assert pred.shape == (n,)`), especially after
         subtraction, where broadcasting hides mistakes.
      3. **Test against a slow, obvious version** - a Python loop over rows - on a small random input. A
         vectorised formula must agree with the loop to rounding.
      4. **Check gradients numerically** with centred differences (ε around 1e-5) and a relative error.
         Accept below about 1e-6; investigate anything above 1e-4.
      5. **Check probabilities** - non-negative, summing to 1 - and check a probability formula against a
         simulation with a fixed seed.
      6. **Test the edges** - zero vectors, a single example, identical inputs, a gradient at the exact
         minimum (it must be zero).

  - id: example
    kind: example
    concepts: [ml-vectors-and-matrices, ml-derivatives-and-gradients, ml-probability-essentials]
    title: "Where the maths sits in SandPay's fraud score"
    body: |
      SandPay scores every payment for fraud risk. Strip away the libraries and the pipeline is the three
      parts of this lesson:

      | Step | Maths | What can go wrong |
      | --- | --- | --- |
      | Each payment becomes a feature vector (amount, hour, country mismatch, merchant refund rate...) | vectors, **scaling** | an unscaled amount (thousands) dominates every distance and dot product |
      | A batch of 10,000 payments is scored at once: z = X @ w + b, then a probability | matrix-vector product | `X * w` or a (n, 1) column silently broadcasts to the wrong shape |
      | Training adjusts w and b to lower the loss on labelled history | gradients, chain rule, gradient descent | a wrong hand-derived gradient trains slowly or not at all - with no error |
      | Operations see "risk 0.91" and must decide | conditional probability | reading P(flagged \| fraud) as P(fraud \| flagged) and ignoring the base rate |
      | Monitoring watches the average risk per hour | expectation, variance, CLT | an alert on the mean that ignores its standard error fires on noise |

      A tester on this team checks shapes and edge cases, compares vectorised code with a loop, insists on a
      gradient check whenever someone writes a gradient by hand, and asks for **precision** (the posterior),
      not just the true positive rate, before a detector goes live.

  - id: tests
    kind: tests
    concepts: [ml-vectors-and-matrices, ml-derivatives-and-gradients, ml-probability-essentials]
    title: Test cases for numeric code
    body: |
      | Case | Input | Expected | Evidence |
      | --- | --- | --- | --- |
      | Prediction shape | X (4, 2), w (2,) | scores of shape (4,) | `assert scores.shape == (4,)` |
      | Wrong weight count | X (4, 2), w (3,) | ValueError naming both shapes | `pytest.raises(ValueError, match=...)` |
      | Vectorised = loop | random (6, 4) and (5, 4), seed 1 | same distances to 1e-9 | `np.testing.assert_allclose` |
      | Cosine edges | parallel, opposite, orthogonal, zero vector | 1, −1, 0, ValueError | assertions with `pytest.approx` |
      | Gradient correct | MSE gradient at w = [0.5, 0.5, 0.5] | relative error below 1e-6 | gradient check output |
      | Gradient at the optimum | data fitted exactly | gradient 0 within 1e-12 | `assert_allclose(dw, 0, atol=1e-12)` |
      | Probability input | probabilities [0.5, 0.6] | ValueError: does not sum to 1 | `pytest.raises` |
      | Bayes formula | prior 0.05, TPR 0.9, FPR 0.1 | agrees with a seeded simulation of 400,000 draws to 0.01 | test output |
      | Uninformative test | TPR = FPR | posterior equals the prior | `pytest.approx(prior)` |

      Note what makes these tests deterministic: fixed seeds (`np.random.default_rng(42)`), tolerances instead
      of `==` on floats, and simulations large enough that the tolerance is many standard errors wide.

  - id: mistakes
    kind: mistakes
    concepts: [ml-vectors-and-matrices, ml-derivatives-and-gradients, ml-probability-essentials]
    title: Common mistakes and how to find them
    body: |
      - **`*` where `@` was meant.** Element-wise instead of a matrix product; often no error because of
        broadcasting. Symptom: a result with the wrong shape, or one number where you expected n.
      - **Silent broadcasting.** (n,) minus (n, 1) gives (n, n). Symptom: a loss that is plausible but wrong,
        training that doesn't improve. Debug: print `.shape` at every step; assert shapes.
      - **Comparing floats with `==`.** `0.1 + 0.2 == 0.3` is False. Use `np.isclose`, `pytest.approx` or
        `np.testing.assert_allclose` with a stated tolerance.
      - **Inverting matrices.** `np.linalg.inv(A) @ b` is slower and less accurate than `np.linalg.solve(A, b)`.
      - **Distances on unscaled features.** One large feature decides every similarity (the 0.999913 cosine).
      - **Gradient off by a constant or a transpose.** It still "trains". Debug: a numerical gradient check;
        a relative error near 1/3 means a factor of 2, near 1 a sign or a swapped coordinate.
      - **An ε that is too small** for finite differences - errors grow again below about 1e-8 in double
        precision.
      - **Nudging the input in place** in a numerical gradient - the next coordinate is measured at the wrong
        point, and the caller's array changes. Copy first. With an **integer** array, adding ε in place is
        even worse: NumPy casts the result back to int, so the nudge vanishes and every derivative comes out 0.
      - **Confusing P(A | B) with P(B | A)** and ignoring the base rate.
      - **Probabilities that don't sum to 1**, or are negative, after a hand-written normalisation.
      - **ddof confusion** - NumPy's `var`/`std` default to ddof 0, pandas' to ddof 1.
      - **Treating a density as a probability** - p(x) is per unit of x and can exceed 1.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [ml-derivatives-and-gradients, ml-probability-essentials]
    title: What this maths does and doesn't give you
    body: |
      - **You will rarely write gradients by hand.** PyTorch and other frameworks compute them with automatic
        differentiation (the chain rule, applied by the computer - see [Neural networks and
        backpropagation](#/lesson/neural-networks-and-backprop)). Knowing the chain rule still lets you read
        papers, choose losses, understand vanishing gradients and debug a custom layer. Gradient checks stay
        useful for anything custom.
      - **Finite differences are for checking, not training.** They need two function evaluations per
        parameter; a model with a million weights would need two million loss evaluations per step.
      - **The normal distribution is a default, not a fact.** Payment amounts, refund sizes and waiting times
        are skewed and heavy-tailed. The CLT makes *averages* close to normal, not the raw data - check a
        histogram before assuming normality.
      - **Bayes' rule needs a base rate you trust.** If fraud is 0.2% this month and 1% after a new attack, the
        same detector's precision changes a lot. Re-estimate the prior when the population changes.
      - **This lesson leaves out** eigendecomposition, SVD, determinants, Hessians and information theory.
        They appear where a later lesson needs them (PCA uses the SVD), and both free textbooks cover them.

  - id: summary
    kind: summary
    concepts: [ml-vectors-and-matrices, ml-derivatives-and-gradients, ml-probability-essentials]
    title: Quick reference
    body: |
      - Data: X is (n, d), rows = examples, columns = features; w is (d,); X @ w + b is (n,).
      - `@` is the matrix product, `*` is element-wise; matrix products don't commute; (AB)ᵀ = BᵀAᵀ.
      - Dot product a·b = ‖a‖‖b‖cos θ; L² norm = √(a·a); cosine similarity compares direction; scale features
        first.
      - Broadcasting stretches size-1 axes - (n,) − (n, 1) is (n, n). Assert shapes.
      - Use `np.linalg.solve`, not `inv`.
      - Gradient = vector of partial derivatives, same shape as the parameters, points uphill; descend with
        w ← w − ε∇L.
      - Chain rule: multiply the derivatives along the path. MSE: ∇_w = (2/n)Xᵀr, ∂/∂b = (2/n)Σr.
      - Check gradients with centred differences (ε ≈ 1e-5) and relative error; 1e-6 or less is good.
      - Bayes: P(A | B) = P(B | A)P(A) / P(B). The base rate matters.
      - E[X] = Σ x P(x); Var = E[(X − E[X])²]; NumPy ddof=0, pandas ddof=1.
      - Normal: 68-95-99.7 within 1-2-3 σ; means of many independent draws are close to normal (CLT), with
        standard deviation σ/√n.

exercises:
  - id: shape-of-scores
    type: mcq
    concept: ml-vectors-and-matrices
    skill: application
    title: The shape of a batch of scores
    prompt: |
      `X` holds 10,000 SandPay payments with 12 features each. `w` has shape `(12,)` and `b` is a float.
      What is the shape of `X @ w + b`, and what does each entry mean?
    options:
      - id: n
        text: (10000,) - one score per payment.
        feedback: Correct - (10000, 12) @ (12,) contracts the 12 features and leaves one number per row; the scalar b is broadcast to every row.
      - id: d
        text: (12,) - one score per feature.
        feedback: That would be Xᵀ-shaped work, such as a gradient (2/n)Xᵀr. A prediction is per example, so the feature axis is the one that disappears.
      - id: nd
        text: (10000, 12) - every feature multiplied by its weight.
        feedback: That is X * w, the element-wise (broadcast) product. @ also sums across the features.
      - id: error
        text: It raises, because w must be a (12, 1) column.
        feedback: NumPy's matmul accepts a 1-D vector as the second operand and treats it as a column; the result is then 1-D. A (12, 1) column would work too but give shape (10000, 1).
    correct: [n]
    hints:
      - Write the shapes - (10000, 12) @ (12,). Which size must match, and which survive?
    solution: |
      **(10000,).** In A (n, k) @ B (k, ...) the shared k disappears. Here k = 12 features, so each of the
      10,000 rows becomes one number: that payment's score. b is broadcast to all of them.

  - id: cosine-trap
    type: mcq
    concept: ml-vectors-and-matrices
    skill: analysis
    title: Two merchants with a cosine of 0.9999
    prompt: |
      A similarity search groups merchants by cosine similarity of the raw vectors
      [average payment EUR, refunds per 100 orders, orders per day]. Merchant A is [42, 1.5, 120] and
      merchant B is [40, 2.0, 110]. The real cosine is 0.999913, so the search calls them near-identical -
      but B's refund rate is a third higher, which is exactly what the risk team cares about. What is the
      best explanation and fix?
    options:
      - id: scale
        text: Orders per day (around 100) dominates the dot product and the norms, so refund rate barely counts. Standardise each feature (for example subtract the mean and divide by the standard deviation over all merchants) before comparing.
        feedback: Correct - similarity on unscaled features mostly measures the largest feature. Put features on comparable scales first.
      - id: euclid
        text: Cosine similarity is wrong for this; Euclidean distance would show the difference.
        feedback: The Euclidean distance between them is about 10.2, almost all from orders per day (10) - the refund gap (0.5) is still invisible. The problem is the scales, not the measure.
      - id: precision
        text: Floating-point error - compute the cosine in higher precision.
        feedback: 0.999913 is exact to the digits shown. The arithmetic is right; the input is the problem.
      - id: weights
        text: Multiply refund rate by 100 so it looks bigger.
        feedback: That re-weights by hand with an arbitrary number. Standardising uses the data's own spread, so each feature counts in units of its own variation.
    correct: [scale]
    hints:
      - Which entries contribute most to a·b and to ‖a‖?
      - What would happen if every feature were in units of its own standard deviation?
    solution: |
      The dot product and norms are sums of squares and products, so the feature with the largest numbers
      dominates - here orders per day. **Standardise** (z-scores) or otherwise scale features before any
      distance or similarity. A scikit-learn `StandardScaler` does this, and fits it on training data only -
      see [Feature engineering and scikit-learn pipelines](#/lesson/scikit-learn-pipelines).

  - id: debug-shapes
    type: debug
    concept: ml-vectors-and-matrices
    skill: analysis
    title: Find the bugs in this gradient step
    prompt: |
      A colleague wrote one step of gradient descent for a linear model on 100 payments with 3 features.
      Line 9 raises `ValueError: operands could not be broadcast together with shapes (100,3) (100,100)`. Click
      **every** line that is a bug or a numerically poor choice (not just the line that raises).
    language: python
    code: |
      import numpy as np
      rng = np.random.default_rng(0)
      X = rng.normal(size=(100, 3))
      y = rng.normal(size=100)
      w = np.zeros((3, 1))
      pred = X @ w
      residual = pred - y
      loss = np.mean(residual ** 2)
      grad = 2 / len(y) * X * residual
      w = w - 0.1 * grad
      w_exact = np.linalg.inv(X.T @ X) @ X.T @ y
    correctLines: [5, 9, 11]
    lineNotes:
      - line: 7
        note: This is where the damage appears - (100, 1) minus (100,) broadcasts to (100, 100) - but the line is fine once w (line 5) is a (3,) vector. Fix the cause, not the symptom.
      - line: 8
        note: The formula is right. In this run it even prints the correct value at w = 0 (0.8546), because every prediction is 0 - which is exactly why the shape bug goes unnoticed.
      - line: 10
        note: The update rule w - lr * grad is correct; it just receives a wrong gradient.
    hints:
      - Write the shape of every variable as a comment, starting with w.
      - Which operator turns (100, 3) and residuals into a (3,) gradient?
      - Which line forms a matrix inverse?
    solution: |
      - **Line 5** - w is a (3, 1) column, so `pred` is (100, 1) and line 7 broadcasts against the (100,) `y`
        into a (100, 100) "residual". Use `np.zeros(3)`.
      - **Line 9** - the gradient is (2/n) Xᵀ r, a matrix product giving shape (3,): `2 / len(y) * X.T @
        residual`. `X * residual` is element-wise and here raises.
      - **Line 11** - forms an explicit inverse. Use `np.linalg.solve(X.T @ X, X.T @ y)` (or
        `np.linalg.lstsq`), as *Deep Learning* 2.3 advises.

      I ran the snippet: `pred (100, 1) residual (100, 100)`, a loss of 0.8546 that matches the true mean
      squared error at w = 0 only by coincidence, and the broadcast `ValueError` on line 9.

  - id: eps-table
    type: mcq
    concept: ml-derivatives-and-gradients
    skill: analysis
    title: Why the error grows when ε shrinks
    prompt: |
      Estimating the derivative of x³ at x = 2 (true value 12) with a centred difference gave these real errors:
      ε = 1e-3 → 2.5e-7, ε = 1e-5 → 9.9e-11, ε = 1e-8 → 7.3e-8, ε = 1e-11 → 9.9e-7. Why does the error get
      **worse** below 1e-5?
    options:
      - id: rounding
        text: Floating-point rounding - f(x + ε/2) and f(x − ε/2) become so close that most of their digits cancel, and the rounding error (about 1e-16 relative) is then divided by a tiny ε.
        feedback: Correct - this is the trade-off Deep Learning 11.5 warns about. Truncation error falls with ε, rounding error rises as ε falls; the best ε balances them.
      - id: wrong-formula
        text: The centred formula is only valid for large ε.
        feedback: The formula is right for any ε; the computer's arithmetic is not exact. In exact arithmetic the error would keep falling.
      - id: cube
        text: x³ has no derivative at 2 when ε is that small.
        feedback: x³ is smooth everywhere. The function is fine; the subtraction of two nearly equal floats is the problem.
      - id: python
        text: Python floats are 32-bit, which is too few digits.
        feedback: Python floats (and NumPy's default float64) are 64-bit doubles. With float32 the turning point comes much earlier - in a float32 run of the same function the error was smallest at ε = 1e-2 and grew again from 1e-3.
    correct: [rounding]
    hints:
      - Compute f(2.000005) and f(1.999995) to 16 significant figures. How many digits do they share?
    solution: |
      Two errors compete. The **truncation** error of the formula shrinks like ε². The **rounding** error comes
      from subtracting two nearly equal doubles - the difference keeps only a few significant digits - and
      dividing by ε magnifies it. Below about 1e-5 rounding dominates. Use ε around 1e-5 (centred, float64), as
      the gradient check does.

  - id: gradcheck-third
    type: mcq
    concept: ml-derivatives-and-gradients
    skill: analysis
    title: A relative error of exactly 0.3333
    prompt: |
      A gradient check on a hand-written mean squared error gradient prints a relative error of **0.3333** in
      every coordinate. The analytic gradient is `[-1.092, 1.297, -0.469]` and the numerical one
      `[-2.184, 2.594, -0.938]`. What is the most likely bug?
    options:
      - id: factor
        text: A missing factor of 2 - the analytic gradient is half the true one, and |a − n| / (|a| + |n|) = 1/3 for a ratio of 2.
        feedback: Correct - the derivative of r² is 2r; dropping the 2 halves every coordinate, giving (2 − 1)/(2 + 1) = 1/3 everywhere.
      - id: eps
        text: ε is too large; try 1e-8.
        feedback: An ε problem gives small, uneven errors (1e-6, 1e-4), not exactly 1/3 everywhere. A constant ratio between the gradients points to a missing constant.
      - id: sign
        text: The sign is flipped.
        feedback: A flipped sign gives opposite signs and a relative error of 1.0. Here the signs agree.
      - id: transpose
        text: X is used instead of Xᵀ.
        feedback: That would usually raise a shape error, or give unrelated numbers - not exactly half in every coordinate.
    correct: [factor]
    hints:
      - Divide the numerical gradient by the analytic one, coordinate by coordinate.
    solution: |
      Every numerical value is exactly twice the analytic one, and for a ratio of 2 the relative error is
      (2 − 1) / (2 + 1) = 0.3333. The chain rule gives ∂(r²)/∂r = 2r; the code dropped the 2. Fix it and the
      check drops to about 1e-11 - as in the real run in this lesson.

  - id: order-gradcheck
    type: order
    concept: ml-derivatives-and-gradients
    skill: application
    title: Put the gradient check in order
    prompt: Order the steps for checking a hand-written gradient of a loss L(w).
    items:
      - id: point
        text: Choose a test point w (not all zeros, so no term vanishes) and a small fixed data set.
      - id: analytic
        text: Compute the analytic gradient at w with your formula.
      - id: nudge
        text: For each coordinate i, copy w, add ε/2 to entry i and evaluate L, then subtract ε/2 and evaluate L again.
      - id: divide
        text: Divide the difference of the two losses by ε to get the numerical partial derivative.
      - id: relative
        text: Compute the relative error |a − n| / max(|a| + |n|, tiny) for every coordinate.
      - id: judge
        text: Accept if the largest relative error is tiny (around 1e-7 or less); otherwise compare ratios and signs to find the bug.
    hints:
      - You need both gradients before you can compare them.
    solution: |
      Pick a point, compute the analytic gradient, estimate each partial derivative with a centred difference
      on a **copy** of w, then compare with a relative error and judge the largest one. Choosing w away from
      zero matters: at w = 0 some terms vanish and a bug in them would go unseen.

  - id: derive-mse
    type: short
    concept: ml-derivatives-and-gradients
    skill: application
    title: Derive the gradient of a halved squared error
    prompt: |
      A model uses the loss L(w) = (1/n) Σᵢ (xᵢ·w − yᵢ)² / 2 - mean squared error with an extra factor ½, and no
      bias. Use the chain rule to write ∇_w L as a NumPy expression in X (n, d), w (d,) and y (n,), and say
      what the ½ is for.
    modelAnswer: |
      Let r = X @ w − y, shape (n,). Outer function: ∂/∂rᵢ of (1/n)·rᵢ²/2 = rᵢ / n. Inner function:
      ∂rᵢ/∂wⱼ = Xᵢⱼ. Chain rule, summing over examples: ∂L/∂wⱼ = Σᵢ (rᵢ / n) Xᵢⱼ, so

      ```python
      grad = X.T @ (X @ w - y) / len(y)     # shape (d,)
      ```

      The ½ cancels the 2 that differentiating the square produces, which tidies the formula. It doesn't
      change where the minimum is (a constant factor never does); it only halves the gradient, which is the
      same as halving the learning rate.
    rubric:
      - Introduces the residual r and applies the chain rule as outer × inner derivative.
      - Gets X.T @ r / n with shape (d,), with the transpose on the left.
      - Explains that the ½ cancels the 2 from the square and doesn't move the minimum.
    hints:
      - Name the inner function r = Xw − y first.
      - What is the derivative of r²/2 with respect to r?
    solution: |
      ∇_w L = Xᵀ(Xw − y) / n. The ½ exists to cancel the 2 from d(r²)/dr; scaling a loss by a constant leaves
      its minimiser unchanged.

  - id: bayes-fraud
    type: mcq
    concept: ml-probability-essentials
    skill: application
    title: How likely is a flagged payment to be fraud?
    prompt: |
      In a new market, 1% of SandPay payments are fraud. A detector flags 90% of fraudulent payments and 5% of
      legitimate ones. A payment is flagged. Roughly how likely is it to be fraud?
    options:
      - id: p15
        text: About 15%.
        feedback: Correct - P(flag) = 0.9 × 0.01 + 0.05 × 0.99 = 0.0585, and 0.009 / 0.0585 ≈ 0.154.
      - id: p90
        text: About 90%.
        feedback: That is P(flagged | fraud), the true positive rate - the conditional the wrong way round. It ignores the 99% of payments that are legitimate.
      - id: p95
        text: About 95%, because the false positive rate is only 5%.
        feedback: 1 − FPR is the specificity, P(not flagged | legitimate). It says nothing about how many flagged payments are fraud without the base rate.
      - id: p1
        text: About 1% - the flag adds no information.
        feedback: The flag fires 18 times as often for fraud (90% vs 5%), so it raises the probability a lot - from 1% to about 15%. A flag adds no information only when TPR equals FPR.
    correct: [p15]
    hints:
      - Imagine 10,000 payments. How many are fraud, and how many of those are flagged?
      - How many legitimate payments are flagged?
    solution: |
      Out of 10,000 payments: 100 fraud, 90 of them flagged; 9,900 legitimate, 495 of them flagged. Of 585
      flagged payments, 90 are fraud - **about 15%**. Bayes' rule says the same:
      0.9 × 0.01 / (0.9 × 0.01 + 0.05 × 0.99) ≈ 0.154. Counting "natural frequencies" like this is the
      clearest way to explain it to someone else.
    followUp: |
      The fraud rate rises to 5% after an attack, with the same detector. Does P(fraud | flagged) go up or
      down, and to roughly what?

  - id: ddof-choice
    type: mcq
    concept: ml-probability-essentials
    skill: application
    title: Why don't the two variances match?
    prompt: |
      A notebook computes the variance of five daily chargeback counts with `np.var(counts)` and gets 14.0.
      A colleague's pandas report shows `counts.var()` = 17.5 for the same five numbers. Who is wrong?
    options:
      - id: neither
        text: Neither - NumPy divides by n (ddof=0), pandas divides by n − 1 (ddof=1); 14.0 × 5/4 = 17.5. Say which one the report uses.
        feedback: Correct - different defaults. ddof=1 estimates the variance of the population the five days come from; ddof=0 describes these five numbers exactly.
      - id: pandas
        text: pandas, because variance divides by n.
        feedback: Both are standard definitions. Dividing by n − 1 corrects the bias of estimating a population variance from a sample, and it is pandas' default.
      - id: numpy
        text: NumPy, because it has a known bug with integers.
        feedback: There is no such bug; the ratio 17.5 / 14.0 = 5/4 = n / (n − 1) gives the cause away.
      - id: rounding
        text: Floating-point rounding.
        feedback: Rounding errors are around 1e-15, not 25%.
    correct: [neither]
    hints:
      - Compute 17.5 / 14.0. Does it look like n / (n − 1) for n = 5?
    solution: |
      17.5 / 14.0 = 1.25 = 5/4 = n/(n − 1). NumPy's `var` defaults to `ddof=0`; pandas' `Series.var` to
      `ddof=1`. Pass `ddof` explicitly and state which you used.

  - id: clt-alert
    type: mcq
    concept: ml-probability-essentials
    skill: analysis
    title: An alert on the average payment
    prompt: |
      Individual SandPay payment amounts are very skewed (most small, a long tail), with mean 20 EUR and standard
      deviation 20 EUR. A monitor averages 30 payments at a time and alerts when the average leaves 20 ± 2
      standard deviations of that average. Roughly what standard deviation should it use, and why is a normal
      approximation reasonable here?
    options:
      - id: clt
        text: About 3.65 EUR (20 / √30). By the central limit theorem, the mean of 30 independent draws is close to normal even though single payments are skewed.
        feedback: Correct - a real simulation of means of 30 skewed (exponential) draws gave a standard deviation of 3.658 against 3.651 predicted, with 95.66% inside 2 standard deviations.
      - id: twenty
        text: 20 EUR, the standard deviation of a payment.
        feedback: That is the spread of single payments. Averaging 30 independent values shrinks the spread by √30, so this alert would almost never fire.
      - id: not-normal
        text: None - payments are skewed, so no normal approximation can be used.
        feedback: The raw data are skewed, but the question is about the mean of 30 of them. The central limit theorem is precisely about such means.
      - id: div30
        text: 20 / 30 ≈ 0.67 EUR.
        feedback: The standard deviation of a mean scales with 1/√n, not 1/n - the variance scales with 1/n.
    correct: [clt]
    hints:
      - Var(mean of n independent draws) = σ² / n. Take the square root.
    solution: |
      The standard error of a mean of n independent draws is σ/√n = 20/√30 ≈ 3.65 EUR. The CLT makes the mean
      approximately normal, so "±2 standard errors" covers about 95%. Note the assumption - **independent**
      payments; a burst from one merchant breaks it.

  - id: code-linalg
    type: coding
    concept: ml-vectors-and-matrices
    skill: application
    title: Cosine similarity, batch scoring and pairwise distances
    prompt: |
      In `linalg.py`, implement `cosine_similarity(a, b)`, fix the colleague's draft of `predict_scores(X, w, b)`
      (it runs, but returns one number for the whole matrix), and implement `pairwise_sq_distances(A, B)`
      **without Python loops**, using ‖a − b‖² = ‖a‖² + ‖b‖² − 2a·b, a matrix product and broadcasting. The
      docstrings give the shapes and the errors to raise.
    project: ai
    files:
      - exercises/ml_foundations/linalg.py
    test: tests/ml_foundations/test_linalg.py
    command: .venv/bin/python -m pytest tests/ml_foundations/test_linalg.py
    hints:
      - Check the inputs first - np.asarray(..., dtype=float), then .ndim and .shape - and raise ValueError with both shapes in the message.
      - For predict_scores, (n, d) @ (d,) is already (n,). The draft's X * w is element-wise.
      - For the distances, make ‖a‖² a (n, 1) column and ‖b‖² a (1, m) row; adding them broadcasts to (n, m), and A @ B.T is (n, m) too.
      - Rounding can give −1e-12 for a point and itself; np.maximum(d2, 0.0) clips it.
    modelAnswer: |
      ```python
      def predict_scores(X, w, b):
          X = np.asarray(X, dtype=float)
          w = np.asarray(w, dtype=float)
          if X.ndim != 2 or w.ndim != 1:
              raise ValueError(f"expected X with 2 dimensions and w with 1, got {X.shape} and {w.shape}")
          if X.shape[1] != w.shape[0]:
              raise ValueError(f"X has {X.shape[1]} columns but w has {w.shape[0]} weights: {X.shape} @ {w.shape}")
          return X @ w + b

      def pairwise_sq_distances(A, B):
          A = np.asarray(A, dtype=float)
          B = np.asarray(B, dtype=float)
          if A.ndim != 2 or B.ndim != 2 or A.shape[1] != B.shape[1]:
              raise ValueError(f"expected (n, d) and (m, d) matrices, got {A.shape} and {B.shape}")
          sq_a = np.sum(A**2, axis=1).reshape(-1, 1)  # (n, 1)
          sq_b = np.sum(B**2, axis=1).reshape(1, -1)  # (1, m)
          d2 = sq_a + sq_b - 2 * A @ B.T              # (n, m)
          return np.maximum(d2, 0.0)
      ```

      `cosine_similarity` checks for 1-D vectors of the same length and a non-zero norm, then returns
      `float(np.clip(a @ b / (norm_a * norm_b), -1.0, 1.0))` - the clip stops rounding from returning a value a
      hair above 1 for parallel vectors. The draft `np.sum(X * w) + b` returned `np.float64(6.78)` for the
      four merchants in this lesson - one number instead of four scores.
    rubric:
      - Every test in tests/ml_foundations/test_linalg.py passes.
      - Shapes are validated before computing, and error messages name the shapes.
      - pairwise_sq_distances has no loops or comprehensions and says which shape each intermediate has.
      - You can explain why the result is clipped at 0.
    solution: |
      Validate shapes, then use `@` for every sum of products: `X @ w + b` for scores, and
      ‖a‖² (column) + ‖b‖² (row) − 2·A @ Bᵀ for the distance matrix, clipped at zero. The model answer shows
      both.
    followUp: |
      Use `pairwise_sq_distances` to find, for each of 1,000 new payments, the closest of 50 known fraud
      patterns. What shape is the result, and which NumPy function gives the index of the nearest pattern per
      payment?

  - id: code-gradients
    type: coding
    concept: ml-derivatives-and-gradients
    skill: application
    title: A numerical gradient, an MSE gradient and a gradient check
    prompt: |
      In `gradients.py`: fix the draft `numerical_gradient` (it uses forward differences and changes the
      caller's array in place); implement `mse_loss_and_grad(X, y, w, b)` with the chain rule; and implement
      `gradient_check(f, grad, x)`, returning the largest relative error. The tests check against x³, a
      quadratic form, known small cases and 50 synthetic examples, and run 50 steps of gradient descent with
      your gradient.
    project: ai
    files:
      - exercises/ml_foundations/gradients.py
    test: tests/ml_foundations/test_gradients.py
    command: .venv/bin/python -m pytest tests/ml_foundations/test_gradients.py
    hints:
      - Start numerical_gradient with x = np.array(x, dtype=float) - a float copy. For each i, build a step vector with eps/2 at position i.
      - "Residual r = X @ w + b - y; loss = mean(r**2); dw = (2/n) X.T @ r; db = (2/n) r.sum()."
      - Return Python floats for loss and db with float(...); the tests check the type.
      - "In gradient_check, use np.maximum(np.abs(a) + np.abs(n), 1e-12) as the denominator, then np.max over coordinates."
    modelAnswer: |
      ```python
      def numerical_gradient(f, x, eps=1e-5):
          x = np.array(x, dtype=float)  # a copy: the caller's array is never touched
          grad = np.zeros_like(x)
          for i in range(x.size):
              step = np.zeros_like(x)
              step[i] = eps / 2
              grad[i] = (f(x + step) - f(x - step)) / eps
          return grad

      def mse_loss_and_grad(X, y, w, b):
          X, y, w = (np.asarray(a, dtype=float) for a in (X, y, w))
          n = len(y)
          residual = X @ w + b - y
          loss = float(np.mean(residual**2))
          dw = (2 / n) * X.T @ residual
          db = float((2 / n) * residual.sum())
          return loss, dw, db
      ```

      The float copy fixes three draft bugs at once: the caller's array no longer changes, the next coordinate
      is measured at the right point, and an integer input no longer swallows ε (with the draft,
      `numerical_gradient(f, np.array([1, 2]))` returned `array([0, 0])`). `gradient_check` evaluates
      `grad(x)` and `numerical_gradient(f, x)`, then returns the largest
      `|a − n| / max(|a| + |n|, 1e-12)` as a float.
    rubric:
      - Every test in tests/ml_foundations/test_gradients.py passes.
      - The numerical gradient uses centred differences on a copy of x.
      - The MSE gradient comes from the chain rule, with the transpose of X on the left.
      - You can say what a relative error of 0.5 or 1.0 from gradient_check suggests.
    solution: |
      Centred differences on a float copy; the chain-rule gradient (2/n)Xᵀr and (2/n)Σr; and a relative error
      with a floor in the denominator. A relative error of 0.5 means the gradient is off by a factor of 3; 1.0
      means opposite signs (or one side zero).

  - id: code-probability
    type: coding
    concept: ml-probability-essentials
    skill: application
    title: Bayes' rule, expectation and the normal density
    prompt: |
      In `probability.py`: replace the draft `posterior` (it returns the true positive rate - the conditional
      the wrong way round) with Bayes' rule and the law of total probability; implement
      `expectation_and_variance(values, probs)` with input validation; and implement a vectorised
      `normal_pdf(x, mu, sigma)`. One test checks your posterior against a seeded simulation of 400,000
      payments; another integrates your density numerically.
    project: ai
    files:
      - exercises/ml_foundations/probability.py
    test: tests/ml_foundations/test_probability.py
    command: .venv/bin/python -m pytest tests/ml_foundations/test_probability.py
    hints:
      - "P(positive) = TPR × prior + FPR × (1 − prior). Check it is not 0 before dividing."
      - "Mean = values @ probs; variance = ((values - mean) ** 2) @ probs."
      - Compare the sum of probabilities with np.isclose(..., atol=1e-9), not ==.
      - "normal_pdf: z = (x - mu) / sigma; return np.exp(-0.5 * z**2) / (sigma * np.sqrt(2 * np.pi))."
    modelAnswer: |
      ```python
      def posterior(prior, true_positive_rate, false_positive_rate):
          for name, p in (("prior", prior), ("true_positive_rate", true_positive_rate),
                          ("false_positive_rate", false_positive_rate)):
              if not 0.0 <= p <= 1.0:
                  raise ValueError(f"{name} must be a probability in [0, 1], got {p}")
          evidence = true_positive_rate * prior + false_positive_rate * (1 - prior)
          if evidence == 0:
              raise ValueError("P(positive) is 0, so the posterior is undefined")
          return float(true_positive_rate * prior / evidence)

      def normal_pdf(x, mu=0.0, sigma=1.0):
          if sigma <= 0:
              raise ValueError(f"sigma must be positive, got {sigma}")
          z = (np.asarray(x, dtype=float) - mu) / sigma
          return np.exp(-0.5 * z**2) / (sigma * np.sqrt(2 * np.pi))
      ```

      `expectation_and_variance` checks equal shapes, no negative probabilities and a sum of 1 within 1e-9,
      then returns `float(values @ probs)` and `float(((values - mean) ** 2) @ probs)`.
    rubric:
      - Every test in tests/ml_foundations/test_probability.py passes.
      - The posterior uses the base rate through the law of total probability.
      - Inputs are validated with clear ValueError messages, and floats are compared with a tolerance.
      - normal_pdf works on arrays without loops.
    solution: |
      Bayes' rule with the evidence from the law of total probability; mean and variance as dot products with
      the probabilities; the density formula applied element-wise. The model answer shows `posterior` and
      `normal_pdf`.

  - id: interview-base-rate
    type: interview
    concept: ml-probability-essentials
    skill: analysis
    title: "\"Our fraud model is 95% accurate - why are most alerts false?\""
    prompt: |
      An interviewer for an ML engineering role says: "Our fraud model catches 95% of fraud and has a 3% false
      positive rate, yet the operations team says most of the payments it flags are fine. They think the model
      is broken. Is it? Explain it as you would to the operations lead, and say what you would measure."
    modelAnswer: |
      Probably not broken - it's the base rate. The 95% is P(flagged | fraud), measured on fraud cases. The ops
      team experiences P(fraud | flagged), which also depends on how rare fraud is. If 2 in 1,000 payments are
      fraud, then out of 100,000 payments 200 are fraud and 190 get flagged, but 99,800 are legitimate and 3%
      of those - about 2,994 - get flagged too. So of about 3,184 alerts only 190 are fraud: roughly 6%. That is
      Bayes' rule: 0.95 × 0.002 / 0.03184 ≈ 0.06.

      What I'd measure and report: **precision** (the share of alerts that are fraud) alongside recall, on recent
      data, because precision moves with the fraud rate; the false positive rate per segment; and the cost of
      each kind of error. Then the levers are a higher threshold (fewer alerts, higher precision, lower recall)
      chosen on a precision-recall curve against the review team's capacity, better features to cut false
      positives, or a two-stage process where cheap automated checks filter alerts before human review.
    rubric:
      - Distinguishes P(flagged | fraud) from P(fraud | flagged) and names the base rate.
      - Works a concrete count (natural frequencies) that a non-specialist can follow.
      - Gets the arithmetic roughly right (about 6% here).
      - Proposes measuring precision and recall on recent data, and choosing a threshold by cost and capacity.
    followUps:
      - Fraud doubles next month with the same model. What happens to the share of true alerts?
      - Why is accuracy a poor metric for this problem?
      - How would you choose the threshold if each review costs 2 EUR and each missed fraud costs 150 EUR?
    hints:
      - Start from 100,000 payments and count.
    solution: |
      Explain with counts: the detector's 3% false alarms apply to the huge legitimate majority, so they
      outnumber the true catches even though 95% of fraud is caught. Report precision and recall on recent
      data, and pick a threshold by cost and review capacity.

placement:
  - id: place-shapes
    type: mcq
    concept: ml-vectors-and-matrices
    skill: application
    title: Which line silently produces the wrong shape?
    prompt: |
      `y_true` has shape `(500,)`. Which of these computes a mean squared error that is **wrong without raising
      an error**?
    options:
      - id: column
        text: "np.mean((y_true - y_pred) ** 2) with y_pred = model_output of shape (500, 1)"
        feedback: Correct - (500,) minus (500, 1) broadcasts to (500, 500), and the mean of 250,000 pairwise squared differences is not the MSE. No error is raised.
      - id: flat
        text: "np.mean((y_true - y_pred) ** 2) with y_pred of shape (500,)"
        feedback: This is the correct MSE - equal shapes subtract element by element.
      - id: ravel
        text: "np.mean((y_true - y_pred.ravel()) ** 2) with y_pred of shape (500, 1)"
        feedback: ravel flattens (500, 1) to (500,), so this is correct.
      - id: mismatch
        text: "np.mean((y_true - y_pred) ** 2) with y_pred of shape (499,)"
        feedback: (500,) and (499,) can't broadcast, so this raises a ValueError - wrong, but not silently.
    correct: [column]
    hints:
      - Apply the broadcasting rule from the right to each pair of shapes.
    solution: |
      Broadcasting compares shapes from the right: (500,) against (500, 1) stretches both to (500, 500). The
      result is a plausible-looking number that is not the MSE. Flatten predictions (`ravel()` or
      `reshape(-1)`) or assert equal shapes before computing a loss.

  - id: place-gradient
    type: mcq
    concept: ml-derivatives-and-gradients
    skill: application
    title: One step of gradient descent
    prompt: |
      The loss is L(w₁, w₂) = (w₁ − 3)² + 2w₂². At w = (1, 1), with learning rate 0.1, where does one step of
      gradient descent go?
    options:
      - id: right
        text: (1.4, 0.6)
        feedback: Correct - ∇L = (2(w₁ − 3), 4w₂) = (−4, 4); w − 0.1·∇L = (1 + 0.4, 1 − 0.4).
      - id: plus
        text: (0.6, 1.4)
        feedback: That steps along +∇L - uphill. Gradient descent subtracts the gradient.
      - id: nochain
        text: (1.2, 0.8)
        feedback: This uses (w₁ − 3) and 2w₂ - the derivatives without the factor 2 from the power rule (and chain rule).
      - id: target
        text: (3, 0) - the minimum, in one step.
        feedback: Gradient descent moves a step of size ε·∇L, not straight to the minimum. With ε = 0.1 it takes many steps.
    correct: [right]
    hints:
      - Take each partial derivative, evaluate at (1, 1), multiply by 0.1 and subtract.
    solution: |
      ∂L/∂w₁ = 2(w₁ − 3) = −4 and ∂L/∂w₂ = 4w₂ = 4 at (1, 1). The new point is (1, 1) − 0.1 × (−4, 4) =
      **(1.4, 0.6)** - closer to the minimum at (3, 0) in both coordinates.

  - id: place-bayes
    type: mcq
    concept: ml-probability-essentials
    skill: application
    title: A screening flag on rare events
    prompt: |
      0.5% of merchant sign-ups are fraudulent. A check flags 80% of fraudulent sign-ups and 2% of genuine ones.
      What is P(fraudulent | flagged), to the nearest few percent?
    options:
      - id: p17
        text: About 17%.
        feedback: Correct - 0.8 × 0.005 = 0.004; 0.02 × 0.995 = 0.0199; 0.004 / 0.0239 ≈ 0.167.
      - id: p80
        text: About 80%.
        feedback: That is P(flagged | fraudulent). The base rate of 0.5% means genuine sign-ups produce most of the flags.
      - id: p98
        text: About 98%.
        feedback: 98% is P(not flagged | genuine). It doesn't answer the question without the base rate.
      - id: p05
        text: About 0.5%.
        feedback: That is the prior. The flag is informative (80% vs 2%), so the posterior is much higher than the prior.
    correct: [p17]
    hints:
      - Of 100,000 sign-ups, how many are fraudulent and flagged, and how many are genuine and flagged?
    solution: |
      Out of 100,000: 500 fraudulent, 400 flagged; 99,500 genuine, 1,990 flagged. 400 / 2,390 ≈ **17%**. Bayes'
      rule gives the same: 0.8 × 0.005 / (0.8 × 0.005 + 0.02 × 0.995).

recall:
  - id: recall-shapes
    concept: ml-vectors-and-matrices
    prompt: X has n examples and d features. What are the shapes of X, w, X @ w and the gradient (2/n) Xᵀ r?
    answer: X is (n, d), w is (d,), X @ w is (n,) - one prediction per example - and Xᵀ r is (d,), the same shape as w.
  - id: recall-matmul-star
    concept: ml-vectors-and-matrices
    prompt: What is the difference between * and @ in NumPy, and which rule about matrix products breaks scalar intuition?
    answer: "* is element-wise (the Hadamard product, with broadcasting); @ is the matrix product (sums of products of rows and columns). Matrix multiplication is not commutative - AB is generally not BA - and (AB)ᵀ = BᵀAᵀ."
  - id: recall-cosine
    concept: ml-vectors-and-matrices
    prompt: What does cosine similarity measure, and what must you do to features before using it?
    answer: The cosine of the angle between two vectors, a·b / (‖a‖‖b‖) - direction, not size - from −1 to 1. Scale (standardise) features first, or the largest-valued feature dominates.
  - id: recall-gradient
    concept: ml-derivatives-and-gradients
    prompt: What is the gradient, which way does it point, and what is the gradient descent update?
    answer: The vector of partial derivatives of the loss with respect to each parameter, the same shape as the parameters. It points uphill (steepest increase); gradient descent steps against it, w ← w − ε∇L, with learning rate ε.
  - id: recall-chain-mse
    concept: ml-derivatives-and-gradients
    prompt: Using the chain rule, what is the gradient of mean squared error for X @ w + b?
    answer: With r = Xw + b − y, ∇_w L = (2/n) Xᵀ r and ∂L/∂b = (2/n) Σ r - outer derivative 2r/n times inner derivatives X and 1.
  - id: recall-gradcheck
    concept: ml-derivatives-and-gradients
    prompt: How do you check a hand-written gradient?
    answer: Compare it with a centred finite difference (f(x + ε/2) − f(x − ε/2)) / ε per coordinate, ε around 1e-5 in float64, using a relative error |a − n| / (|a| + |n|). Tiny (about 1e-7 or less) passes; 0.33 suggests a missing factor of 2, 1.0 a sign error.
  - id: recall-bayes
    concept: ml-probability-essentials
    prompt: State Bayes' rule and explain the base-rate fallacy in one sentence.
    answer: P(A | B) = P(B | A) P(A) / P(B). The fallacy is reading P(flagged | fraud) as P(fraud | flagged) - when fraud is rare, false alarms on the large legitimate majority outnumber true catches.
  - id: recall-normal-clt
    concept: ml-probability-essentials
    prompt: What does the central limit theorem say, and what is the 68-95-99.7 rule?
    answer: The mean (or sum) of many independent random variables is approximately normal whatever their distribution, with standard deviation σ/√n. For a normal distribution about 68%, 95% and 99.7% of values lie within 1, 2 and 3 standard deviations of the mean.

