  - id: place-activation
    type: mcq
    concept: activation-functions-and-saturation
    skill: application
    title: Which hidden activation?
    prompt: |
      You are building a 12-layer feedforward network for SandPay. Which hidden activation is the usual default,
      and why?
    options:
      - id: relu
        text: ReLU - its derivative is 1 for positive inputs, so it doesn't shrink gradients there; watch for dead units.
        feedback: Correct - Deep Learning calls ReLU "an excellent default choice of hidden unit".
      - id: sigmoid
        text: Sigmoid - its output is a probability between 0 and 1.
        feedback: Sigmoid belongs in a binary output. As a hidden activation its derivative is at most 0.25 and near 0 when saturated, so gradients vanish through 12 layers.
      - id: none
        text: No activation - linear layers train fastest.
        feedback: Twelve linear layers are one linear model; the depth would add nothing.
      - id: tanh-best
        text: tanh - its maximum derivative is 1, so it never vanishes.
        feedback: Its derivative is 1 only at 0 and about 2.5e-05 at |z| = 6; tanh saturates just like sigmoid.
    correct: [relu]
    solution: |
      ReLU-family activations are the default for hidden layers: no saturation for positive inputs and cheap to
      compute. Pair them with a suitable initialisation and learning rate, and monitor the dead fraction.

  - id: place-backward
    type: debug
    concept: backpropagation-chain-rule
    skill: analysis
    title: The wrong weight gradient
    prompt: |
      In this backward step for a dense layer `Z = X @ W + b` (X is (n, d), W is (d, h)), `dZ` of shape (n, h) is
      already correct. Click the line that is wrong.
    language: python
    code: |
      def dense_backward(X, W, dZ):
          dW = dZ.T @ X
          db = dZ.sum(axis=0)
          dX = dZ @ W.T
          return dW, db, dX
    correctLines: [2]
    lineNotes:
      - line: 3
        note: Correct - b is broadcast over the n rows, so its gradient sums dZ over the rows, giving shape (h,).
      - line: 4
        note: Correct - (n, h) @ (h, d) gives (n, d), the shape of X.
    solution: |
      **Line 2** - `dZ.T @ X` is (h, n) @ (n, d) = (h, d), the transpose of what's needed. The gradient must have
      W's shape (d, h): `dW = X.T @ dZ`. When d = h this runs silently and gives wrong values.

  - id: place-gradcheck
    type: mcq
    concept: gradient-checking
    skill: application
    title: Is the backward pass right?
    prompt: |
      A centred-difference check on a small tanh network in float64 with ε = 1e-5 gives a maximum relative error
      of 3e-8 for every parameter. A colleague then repeats it in float32 with ε = 1e-9 and gets 0.4. What do you
      conclude?
    options:
      - id: fine
        text: The backward pass is right; the float32 run is a rounding artefact - with ε = 1e-9 the two losses are equal or differ only in the last bits.
        feedback: Correct - gradient checks belong in float64 with ε around 1e-5.
      - id: broken
        text: The backward pass is wrong; the stricter float32 check found it.
        feedback: The float32 check is less strict, not more. Loss differences of order 1e-9 are below float32's resolution of about 1e-7 relative, so the numerical gradient is noise.
      - id: kink
        text: The network has a kink, so neither result means anything.
        feedback: tanh is smooth everywhere; kinks come from ReLU-like functions.
      - id: lower-eps
        text: Repeat in float64 with ε = 1e-12 to be sure.
        feedback: Even in float64 a tiny ε makes rounding error dominate - the lesson measured 3e-02 at ε = 1e-11.
    correct: [fine]
    solution: |
      3e-8 in float64 with ε = 1e-5 is a pass. A finite difference with a tiny ε in low precision divides rounding
      noise by ε; PyTorch's gradcheck documentation warns its defaults "are designed for input of double
      precision" and the check "will likely fail" otherwise.

recall:
  - id: recall-layer
    concept: neurons-layers-and-forward-pass
    prompt: Write a dense layer's forward pass on a batch, with shapes, and its parameter count.
    answer: H = act(X W + b) with X (n, d), W (d, h), b (h,), H (n, h). Parameters d·h + h.
  - id: recall-nonlinear
    concept: neurons-layers-and-forward-pass
    prompt: Why must hidden layers have a non-linear activation, and what does the universal approximation theorem promise?
    answer: Without it, layers compose into one linear model (X W1 W2 + c), which cannot learn XOR. With one hidden layer of enough squashing units a network can approximate any reasonable function - but the theorem doesn't say how many units, or that training will find the weights.
  - id: recall-activations
    concept: activation-functions-and-saturation
    prompt: Give the derivatives of sigmoid, tanh and ReLU and the problem each can cause.
    answer: sigmoid' = σ(1 − σ) ≤ 0.25; tanh' = 1 − tanh² ≤ 1 - both ≈ 0 when saturated, so gradients vanish through depth. ReLU' = 1 for z > 0, 0 for z < 0 - no saturation, but units negative on every example die.
  - id: recall-dead
    concept: activation-functions-and-saturation
    prompt: What is a dead ReLU unit, what causes it, and how do you measure it?
    answer: A unit whose pre-activation is ≤ 0 on every example - it outputs 0 and gets zero gradient, so it never recovers. Usually a too-large learning rate (the lesson - 39% dead at lr 10, 95% at lr 30). Measure the fraction of columns of Z ≤ 0 on all rows; lower the learning rate or use leaky ReLU.
  - id: recall-backprop
    concept: backpropagation-chain-rule
    prompt: What does backpropagation compute, and what are the rules for a dense layer and an activation?
    answer: The gradient of the loss with respect to every parameter, by the chain rule from the loss backwards, reusing cached forward values, at about the cost of a forward pass. Dense - dW = Xᵀ dZ, db = Σ rows of dZ, dX = dZ Wᵀ. Activation - dZ = dH ⊙ act'(Z). It doesn't update anything; the optimiser does.
  - id: recall-output-gradient
    concept: backpropagation-chain-rule
    prompt: What is the gradient of the mean binary cross-entropy with respect to the logits?
    answer: (sigmoid(s) − y) / n per example - the 1/n from the mean enters once here and every gradient below inherits it.
  - id: recall-gradcheck
    concept: gradient-checking
    prompt: How do you gradient-check a backward pass?
    answer: Tiny network, float64, random non-zero parameters, inputs away from kinks. Centred difference (L(θ + ε/2) − L(θ − ε/2))/ε with ε ≈ 1e-5; relative error |a − b|/(|a| + |b|), worst per parameter. ≤ 1e-7 good, ≥ 1e-2 a bug. Prove it can fail; use it for testing only.
  - id: recall-symmetry
    concept: gradient-checking
    prompt: Why can't all weights start at the same value?
    answer: Identical units compute the same output and get the same gradient, so they stay identical forever - the layer acts like one unit (the lesson - eight identical columns after 1,500 steps, 0.73 on XOR). Random initialisation breaks the symmetry. A gradient check can't detect it.

