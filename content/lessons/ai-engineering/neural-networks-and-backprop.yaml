id: neural-networks-and-backprop
title: Neural networks and backpropagation
subject: ai-engineering
module: deep-learning
level: intermediate
status: published
estimatedMinutes: 90
summary: What a neural network really computes - neurons, layers and the forward pass as matrix products; why a hidden layer with a non-linear activation can learn patterns no linear model can; sigmoid, tanh and ReLU, saturation, vanishing gradients and dead units; backpropagation as the chain rule applied backwards through the computation, worked by hand and then vectorised; and gradient checking, the test that tells you whether your backward pass is right. You build and check a two-layer network in plain NumPy, then confirm it against PyTorch's autograd. Every output shown was produced by running the code.
