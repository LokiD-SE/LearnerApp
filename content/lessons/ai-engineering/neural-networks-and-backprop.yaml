        text: W is (20, 64), the output is (256, 64), and the layer has 1,344 parameters.
        feedback: Correct - X (256, 20) @ W (20, 64) gives (256, 64); 20·64 weights + 64 biases = 1,344.
      - id: batch-in-w
        text: W is (256, 64), the output is (20, 64), and the layer has 16,448 parameters.
        feedback: The weights don't depend on the batch size - the same W is used for every example. W maps features to units.
      - id: no-bias
