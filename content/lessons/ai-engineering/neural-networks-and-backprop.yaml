environment: |
  - **Runtime and libraries:** Python 3.12.3, **NumPy 2.5.4**, **scikit-learn 1.9.1** and **PyTorch 2.15.0+cpu**
    (CPU only, no CUDA) in `practice/ai/.venv`. Every printed number, gradient, accuracy and timing in this lesson
    was produced by running the code on Linux in November 2026 with fixed seeds (`np.random.default_rng(...)`,
    `torch.manual_seed(...)`) and `OMP_NUM_THREADS=2 MKL_NUM_THREADS=2`. **Timings** were measured with 2 threads
    on a shared machine and are only a rough guide - the ratios matter, not the milliseconds. Floating-point
    results can differ in the last digits on other machines and library builds. Code blocks are excerpts: they
    assume `import numpy as np`, `import torch`, `from torch import nn`, `import torch.nn.functional as F`, and
    the functions from `practice/ai/solutions/deep_learning/`.
  - **Primary sources:**
    - Ian Goodfellow, Yoshua Bengio and Aaron Courville, [*Deep Learning*, chapter 6 - Deep Feedforward
      Networks](https://www.deeplearningbook.org/contents/mlp.html) (MIT Press, 2016): 6.1 (learning XOR - the
      linear model "simply outputs 0.5 everywhere"), 6.2.2 (output units and saturation), 6.3 (hidden units -
      "Rectified linear units are an excellent default choice of hidden unit", ReLU is "not differentiable at
      z = 0", leaky ReLU "fixes α to a small value like 0.01", and "The widespread saturation of sigmoidal units
      can make gradient-based learning very difficult"), 6.4.1 (the universal approximation theorem) and 6.5
      (back-propagation - it "refers only to the method for computing the gradient").
    - Michael Nielsen, [*Neural Networks and Deep Learning*](http://neuralnetworksanddeeplearning.com) (free
      online book): [chapter 2](http://neuralnetworksanddeeplearning.com/chap2.html) (the four fundamental
      equations of backpropagation and why it is fast), [chapter
      4](http://neuralnetworksanddeeplearning.com/chap4.html) (a visual proof of universality) and [chapter
      5](http://neuralnetworksanddeeplearning.com/chap5.html) (the vanishing gradient problem).
    - Stanford CS231n course notes: [Neural Networks Part 1](https://cs231n.github.io/neural-networks-1/)
      (activation functions, the "dying ReLU" problem - "as much as 40% of your network can be 'dead'" with too
      high a learning rate), [Backpropagation, Intuitions](https://cs231n.github.io/optimization-2/) (local
      gradients, "Cache forward pass variables") and [Neural Networks Part
      3](https://cs231n.github.io/neural-networks-3/) (gradient checks - use the centred difference, use the
      relative error, and its rule-of-thumb thresholds).
    - PyTorch 2.15 documentation: [Autograd
      mechanics](https://docs.pytorch.org/docs/2.15/notes/autograd.html) (the recorded graph, and "Gradients for
      non-differentiable functions" - relu at 0), [torch.autograd.gradcheck](https://docs.pytorch.org/docs/2.15/generated/torch.autograd.gradcheck.gradcheck.html)
      ("The default values are designed for input of double precision") and
      [BCEWithLogitsLoss](https://docs.pytorch.org/docs/2.15/generated/torch.nn.BCEWithLogitsLoss.html) (more
      numerically stable than a sigmoid followed by BCELoss).
  - **Fictional and synthetic:** SandPay, its payments and fraud labels. The XOR data set is a deliberately
    artificial pattern generated with NumPy (`default_rng(3)`, 400 points uniform in a square, minus a margin of
    0.1 around the axes, leaving 322) so that you can see what a linear model cannot learn. Real fraud is never
    this clean.
  - **Builds on:** the sigmoid, the log loss and its gradient (p − y)x, and stable losses from logits in
    [Logistic regression and classification](#/lesson/logistic-regression-classification); derivatives and the
    chain rule in [The maths of machine learning](#/lesson/ml-maths-essentials); and gradient descent in [Linear
    regression and gradient descent](#/lesson/linear-regression-gradient-descent). The PyTorch tools used briefly
    here are taught properly in [PyTorch fundamentals](#/lesson/pytorch-fundamentals).

prerequisites:
  - logistic-regression-classification
  - ml-maths-essentials
  - linear-regression-gradient-descent

concepts:
  - id: neurons-layers-and-forward-pass
    name: Neurons, layers and the forward pass
    summary: A neuron computes a weighted sum of its inputs plus a bias and passes it through an activation function. A layer is many neurons side by side, so a whole layer on a batch is one matrix product, H = act(X W + b). A multilayer perceptron chains layers; the hidden layers learn new features, and the last layer is a linear or logistic model on those features. Without a non-linear activation the stack collapses to one linear model, which cannot learn patterns such as XOR; with one hidden layer of enough units it can approximate any reasonable function (the universal approximation theorem), though the theorem does not say training will find it.
  - id: activation-functions-and-saturation
    name: Activation functions, saturation and vanishing gradients
    summary: Sigmoid and tanh saturate - their derivatives are almost zero for large |z| (sigmoid's derivative is at most 0.25) - so gradients shrink as they pass back through many layers (vanishing gradients). ReLU, max(0, z), has derivative 1 for positive inputs and 0 otherwise; it is the default hidden activation, but a unit whose input is negative on every example is dead - it outputs 0 and gets no gradient. Leaky ReLU keeps a small slope for negative inputs. Initialisation and learning rate decide how many units die.
  - id: backpropagation-chain-rule
    name: Backpropagation as the chain rule, backwards
    summary: Backpropagation computes the gradient of the loss with respect to every parameter in one backward sweep. Starting from dL/dL = 1 at the loss, each operation multiplies the incoming gradient by its local derivative and passes it to its inputs, reusing values cached in the forward pass. For a dense layer Z = X W + b, dW = Xᵀ dZ, db = the column sums of dZ and dX = dZ Wᵀ; through an element-wise activation, dZ = dH times act'(Z). The cost is a small constant times a forward pass, which is why it beats numerical differentiation by orders of magnitude. Backprop computes gradients; an optimiser such as gradient descent uses them.
  - id: gradient-checking
    name: Gradient checking and debugging a backward pass
    summary: To test a hand-written backward pass, compare it with centred finite differences (L(θ + ε/2) − L(θ − ε/2))/ε on a small network in float64, using the relative error |a − b|/(|a| + |b|). Around 1e-7 or below is right; above 1e-2 is a bug. ε too large adds truncation error and too small adds rounding error. Check before training, never during it (it is thousands of times slower), and avoid kinks such as ReLU at 0. A passing check does not mean the network will train - identical initial weights give identical, correct gradients, so hidden units never become different; random initialisation breaks that symmetry.

objectives:
  - Compute a neuron's and a layer's output by hand and with NumPy, write the shapes of every array in a forward pass, and count a network's parameters.
  - Explain with evidence why a network without non-linear activations is a linear model, and why a hidden layer lets a network learn XOR.
  - Compare sigmoid, tanh, ReLU and leaky ReLU by their derivatives, and explain saturation, vanishing gradients and dead ReLU units with numbers.
  - Trace backpropagation by hand through a small computation and write the vectorised backward pass of a dense layer and an activation.
  - Implement a two-layer network with backpropagation in NumPy and verify it with a gradient check and against PyTorch's autograd.
  - Diagnose a broken backward pass or a stuck network from gradient-check errors, symmetric weights and the fraction of dead units.

sections:
  - id: intuition
    kind: intuition
    concepts: [neurons-layers-and-forward-pass, backpropagation-chain-rule]
    title: The idea in plain language
    body: |
      In the logistic regression lesson, SandPay's fraud model added up weighted clues - amount, time of day,
      country mismatch - and squashed the total into a probability. That works when each clue pushes the risk
      the same way, whatever the others say. But some fraud patterns are about **combinations**: an unusual
      amount is fine at the card's usual time, an unusual time is fine with a usual amount, and the two
      together are fine too (a holiday) - but exactly one of them unusual is suspicious. No single weighted sum
      can say "this clue matters only when that one is absent".

      A neural network fixes this by putting **a team of small models in the middle**. Each hidden neuron is a
      little logistic-regression-like detector that learns its own feature - "unusual amount at a usual hour",
      say. The output neuron then does ordinary logistic regression on those learned features instead of on the
      raw clues. Nobody tells the hidden neurons what to detect: they learn it, because training adjusts every
      weight in the direction that reduces the loss.

      That raises the question this lesson is mostly about: **how do you know which way to move a weight that
      is buried in the middle of the network?** The answer is **backpropagation** - the chain rule from
      calculus, applied from the loss backwards, one layer at a time, so that every weight learns how much it
      contributed to the error. It is not a learning algorithm by itself; it is a fast, exact way to compute the
      gradient that gradient descent needs.

      You'll build all of it in NumPy - forward pass, backward pass, and the **gradient check** that proves the
      backward pass right - and then see PyTorch compute the same numbers automatically.

  - id: what
    kind: what
    concepts: [neurons-layers-and-forward-pass]
    title: Neurons, layers and networks - the terms
    body: |
      | Term | Meaning |
      | --- | --- |
      | **Neuron** (unit) | `h = act(w · x + b)` - a weighted sum of inputs plus a bias, through an activation function |
      | **Pre-activation** `z` | the weighted sum `w · x + b`, before the activation |
      | **Activation function** | an element-wise non-linear function: sigmoid, tanh, ReLU... |
      | **Layer** (dense, fully connected, `Linear` in PyTorch) | many neurons reading the same inputs: `H = act(X W + b)` |
      | **Hidden layer** | a layer between the input and the output; its values are not in the data |
      | **Width / depth** | units per layer / number of layers |
      | **Multilayer perceptron (MLP)**, feedforward network | layers chained so information flows one way, input to output, with no loops |
      | **Logits** | the output layer's raw scores, before sigmoid or softmax |
      | **Parameters** | all the weights and biases - what training changes |

      One neuron on one SandPay payment, with features `x = [1.2, 1.0, 0.0]` (standardised amount, night flag,
      country mismatch), weights `w = [0.8, 1.5, 2.0]` and bias `b = −2`:

      ```plaintext
      z = 1.2·0.8 + 1.0·1.5 + 0.0·2.0 − 2 = 0.46
      sigmoid(z) = 0.613        relu(z) = 0.46
      ```

      A **layer** of `h` neurons stacks their weight vectors as the columns of a `(d, h)` matrix `W`, and a batch of
      `n` examples is an `(n, d)` matrix `X`. Then the whole layer on the whole batch is one matrix product and a
      broadcast add:

      ```plaintext
      X (n, d)  @  W (d, h)  +  b (h,)   ->   Z (n, h)   ->   H = act(Z) (n, h)
      ```

      Counting parameters is just counting matrix entries: a dense layer from `d` inputs to `h` units has
      `d·h + h`. The network used in this lesson's PyTorch check - 3 inputs, 4 hidden units, 1 output - has
      `3·4 + 4 + 4·1 + 1 = 21`, and PyTorch agrees (`sum(p.numel() for p in net.parameters())` printed 21).

      Goodfellow et al. (6) note that networks are called neural because "they are loosely inspired by
      neuroscience" - and then treat them as what they are: function approximators built by composing simple
      functions. That's the useful mental model.

  - id: why-hidden-layers
    kind: why
    concepts: [neurons-layers-and-forward-pass]
    title: Why a hidden layer - XOR, the pattern a linear model can't learn
    body: |
      Section 6.1 of *Deep Learning* starts with XOR: the output is 1 when exactly one of two inputs is "on". A
      linear model fit to XOR "simply outputs 0.5 everywhere". Here is the same thing on synthetic SandPay data -
      fraud when exactly one of two standardised signals is positive:

      ```python
      rng = np.random.default_rng(3)
      X = rng.uniform(-1, 1, size=(400, 2))
      X = X[np.abs(X).min(axis=1) > 0.1]          # a small margin around the axes
      y = ((X[:, 0] > 0) ^ (X[:, 1] > 0)).astype(float)
      print("n =", len(y), " fraud rate =", y.mean().round(3))

      lr = LogisticRegression().fit(X, y)
      print("LogisticRegression accuracy:", round(lr.score(X, y), 3), "coef", lr.coef_.round(3),
            "intercept", lr.intercept_.round(3))

      params, losses = fit(X, y, n_hidden=8, learning_rate=0.5, epochs=1500, seed=0)   # your mlp_numpy.py
      print("MLP accuracy:", (predict(params, X) == y).mean())
      ```

      ```plaintext
      n = 322  fraud rate = 0.528
      LogisticRegression accuracy: 0.556 coef [[0.066 0.079]] intercept [0.115]
      epoch    0 loss 0.6934
      epoch  100 loss 0.4393
      epoch  300 loss 0.0910
      epoch 1000 loss 0.0189
      epoch 1499 loss 0.0130
      MLP accuracy: 1.0
      ```

      The logistic regression's weights are almost zero and its accuracy, 0.556, is barely above always
      predicting the majority class (0.528). The network with 8 tanh hidden units gets every point right. Its
      starting loss, 0.6934, is log 2 - small random weights mean "50/50" for everything.

      **How many hidden units does it need?** The same training, 3,000 epochs, five seeds each:

      ```plaintext
      hidden 1 accuracy over seeds 0-4: [0.73  0.73  0.668 0.693 0.73 ]
      hidden 2 accuracy over seeds 0-4: [0.901 0.764 0.901 0.901 0.901]
      hidden 3 accuracy over seeds 0-4: [0.994 0.991 0.901 0.991 0.994]
      hidden 4 accuracy over seeds 0-4: [1.    0.991 0.994 1.    1.   ]
      ```

      Two units are enough in principle (the book builds an exact XOR network with two ReLU units), but gradient
      descent from a random start does not always find that solution - seed 1 stalls at 0.764. Extra units make
      training **easier**, not just the model more powerful. That is the practical reason networks are wider
      than the theoretical minimum.

      **Why the activation must be non-linear.** Without it, two layers are `(X W1 + b1) W2 + b2 = X (W1 W2) +
      (b1 W2 + b2)` - one linear model with weights `W1 W2`. Any number of linear layers collapses the same way,
      so a deep network of linear layers can't learn XOR either.

      **The universal approximation theorem** (Hornik et al. 1989, Cybenko 1989, as stated in *Deep Learning*
      6.4.1): a feedforward network with a linear output layer and at least one hidden layer with a "squashing"
      activation can approximate any reasonable function as closely as you like, given enough hidden units.
      Nielsen's chapter 4 gives a visual proof. Read it carefully - it says such a network **exists**. It does not
      say how many units you need (possibly a huge number), or that gradient descent will find the weights, or
      that the result will generalise. Deeper networks often need far fewer units for the same function, which is
      the case for depth.

  - id: forward-pass
    kind: internals
    concepts: [neurons-layers-and-forward-pass, backpropagation-chain-rule]
    title: The forward pass, with shapes - and what it must remember
    body: |
      This lesson's network is a binary classifier with one hidden layer - the one in `mlp_numpy.py`:

      ```plaintext
      Z1 = X @ W1 + b1        (n, h)   hidden pre-activations
      H  = act(Z1)            (n, h)   hidden activations (tanh or ReLU)
      s  = H @ W2 + b2        (n, 1)   logits, reshaped to (n,)
      L  = mean binary cross-entropy of sigmoid(s) against y
      ```

      Parameter shapes: `W1 (d, h)`, `b1 (h,)`, `W2 (h, 1)`, `b2 (1,)`. The output layer is exactly logistic
      regression - but on the learned features `H` instead of on `X`.

      ```python
      def forward(params, X, activation="tanh"):
          X = np.asarray(X, dtype=float)
          W1 = params["W1"]
          if X.ndim != 2 or X.shape[1] != W1.shape[0]:
              raise ValueError(f"X must be (n, {W1.shape[0]}), got {X.shape}")
          Z1 = X @ W1 + params["b1"]
          H = _act(Z1, activation)
          logits = (H @ params["W2"] + params["b2"]).reshape(-1)
          return logits, {"X": X, "Z1": Z1, "H": H}
      ```

      Two details matter for what comes next:

      - **The cache.** The forward pass returns `X`, `Z1` and `H` as well as the logits. The backward pass needs
        exactly these values - the CS231n notes put it as "Cache forward pass variables". This is why training
        uses more memory than prediction: every intermediate result is kept until the backward pass has used it.
      - **The loss is computed from logits** with the stable formula `max(s, 0) − s·y + log(1 + e^−|s|)`, exactly as
        in the logistic regression lesson - never `log(sigmoid(s))`, which becomes `log(0) = −inf` for a
        confidently wrong logit. PyTorch's `BCEWithLogitsLoss` does the same thing for the same reason; its
        documentation says it is "more numerically stable than using a plain Sigmoid followed by a BCELoss".

  - id: visual-graph
    kind: visual
    concepts: [backpropagation-chain-rule, neurons-layers-and-forward-pass]
    title: The computation graph, forwards and backwards
    body: |
      ```mermaid
      flowchart LR
        X["X (n, d)"] --> Z1["Z1 = X W1 + b1"]
        W1["W1, b1"] --> Z1
        Z1 --> H["H = act(Z1)"]
        H --> S["s = H W2 + b2"]
        W2["W2, b2"] --> S
        S --> L["L = BCE(s, y)"]
        L -. "dL/ds = (sigmoid(s) − y) / n" .-> S
        S -. "dW2 = Hᵀ ds,  dH = ds W2ᵀ" .-> H
        H -. "dZ1 = dH ⊙ act'(Z1)" .-> Z1
        Z1 -. "dW1 = Xᵀ dZ1,  db1 = Σ dZ1" .-> W1
      ```

      Solid arrows are the forward pass; dotted arrows are the backward pass, which visits the same nodes in
      reverse. Notice that every backward step uses something the forward pass computed (`H`, `Z1`, `X`) - the
      cache - and that the gradient reaching `W1` has been multiplied by `act'(Z1)` on the way. If that factor is
      tiny, `W1` hardly learns: that is the vanishing-gradient problem in one picture. PyTorch's autograd records
      exactly this kind of graph while your code runs - its documentation calls it "a directed acyclic graph whose
      leaves are the input tensors and roots are the output tensors".

  - id: activations
    kind: internals
    concepts: [activation-functions-and-saturation]
    title: Sigmoid, tanh, ReLU - judged by their derivatives
    body: |
      What matters for training is not the shape of the activation but its **derivative**, because every
      gradient passing backwards through a layer is multiplied by it. From `activations.py`:

      ```plaintext
      z         [-6.      -2.     0.      2.      6.     ]
      sigmoid'  [0.00247  0.105   0.25    0.105   0.00247]
      tanh'     [2.46e-05 0.0707  1       0.0707  2.46e-05]
      relu'     [0.       0.      0.      1.      1.     ]
      ```

      | Activation | Formula | Derivative | Range | Notes |
      | --- | --- | --- | --- | --- |
      | sigmoid | 1/(1 + e^−z) | σ(z)(1 − σ(z)), at most **0.25** | (0, 1) | saturates both ways; outputs not centred on 0 |
      | tanh | (e^z − e^−z)/(e^z + e^−z) | 1 − tanh²(z), at most **1** | (−1, 1) | saturates both ways; zero-centred |
      | ReLU | max(0, z) | 1 for z > 0, 0 for z < 0 | [0, ∞) | no saturation for z > 0; cheap; zero gradient for z < 0 |
      | leaky ReLU | z if z > 0 else αz (α ≈ 0.01) | 1 or α | (−∞, ∞) | never exactly zero gradient |

      **Saturation.** When |z| is large, sigmoid and tanh are flat, so their derivatives are almost 0: at z = 6,
      sigmoid's is 0.00247 and tanh's 2.46e-05. A unit there passes almost no gradient back, however wrong the
      output is. *Deep Learning* 6.3.2 says "The widespread saturation of sigmoidal units can make gradient-based
      learning very difficult", and that their use as hidden units "is now discouraged". Sigmoid stays useful as
      an **output** unit, where the cross-entropy loss undoes the saturation (the (p − y) gradient from the
      previous lesson).

      **ReLU** is the default: "Rectified linear units are an excellent default choice of hidden unit" (6.3). Its
      derivative is exactly 1 wherever the unit is active, so it doesn't shrink the gradient there. ReLU is not
      differentiable at exactly 0; libraries just pick a value. PyTorch's autograd notes say that for a convex
      function such as relu at 0 it uses "a subgradient of minimum norm" - which is 0 - and `relu_grad` in this
      lesson does the same.

      **Dead units.** ReLU's weakness is the other side: for z < 0 its gradient is exactly 0. A unit whose
      pre-activation is negative for **every** training example outputs 0 everywhere and receives no gradient, so
      gradient descent can never revive it. `dead_relu_fraction` measures it.

  - id: depth-experiment
    kind: code
    concepts: [activation-functions-and-saturation]
    title: Vanishing gradients and dead units, measured
    body: |
      **Through depth.** Each layer multiplies the backward gradient by its activation's derivative (and its
      weights). With sigmoid that factor is at most 0.25, and `0.25**10 = 9.5e-07`. Here are ten hidden layers
      of 32 units, PyTorch's default initialisation, one batch of 256 random examples, and the norm of each
      layer's weight gradient after one `backward()`:

      ```python
      for act in ["sigmoid", "tanh", "relu"]:
          torch.manual_seed(0)
          A = {"sigmoid": nn.Sigmoid, "tanh": nn.Tanh, "relu": nn.ReLU}[act]
          layers = []
          for i in range(10):
              layers += [nn.Linear(16 if i == 0 else 32, 32), A()]
          net = nn.Sequential(*layers, nn.Linear(32, 1))
          xb = torch.randn(256, 16); yb = (torch.rand(256) < 0.5).float()
          nn.BCEWithLogitsLoss()(net(xb).squeeze(1), yb).backward()
          norms = [net[2 * i].weight.grad.norm().item() for i in range(10)]
      ```

      ```plaintext
      sigmoid  layer1 7.15e-10 layer5 2.66e-06 layer10 4.19e-02 ratio10/1 58643478
      tanh     layer1 5.88e-04 layer5 1.29e-03 layer10 1.84e-02 ratio10/1 31
      relu     layer1 2.99e-05 layer5 1.25e-04 layer10 9.84e-03 ratio10/1 329
      relu+He  layer1 2.24e-02 layer5 4.52e-02 layer10 5.03e-02 ratio10/1 2.2
      ```

      With sigmoid, the first layer's gradient is about **58 million times** smaller than the last layer's: with
      one learning rate for all layers, the first layer effectively doesn't train. This is the vanishing gradient
      problem of Nielsen's chapter 5. ReLU with the default initialisation still shrinks the gradient (329×),
      because the weights are scaled for a different activation; with He initialisation
      (`nn.init.kaiming_normal_(w, nonlinearity="relu")`, zero biases) the ratio is 2.2. Activation and
      initialisation work together - initialisation is covered in [Training deep networks
      well](#/lesson/training-deep-networks).

      **Dead units from a large learning rate.** One hidden layer of 64 ReLU units, 200 steps of plain SGD on
      512 synthetic examples, then `dead_relu_fraction` on the pre-activations:

      ```plaintext
      lr=0.1: dead before 0.000 after 0.000 final loss 0.4756
      lr=1.0: dead before 0.000 after 0.000 final loss 0.0470
      lr=10.0: dead before 0.000 after 0.391 final loss 0.0205
      lr=30.0: dead before 0.000 after 0.953 final loss 1.2595
      ```

      At lr=10, 39% of the units died - CS231n's warning, "as much as 40% of your network can be 'dead'", almost
      exactly - although the loss still went down using the units that survived. At lr=30, 95% died and the loss
      ended **higher** than it started (log 2 ≈ 0.693). A big step pushes a unit's bias or weights so far negative
      that it never fires again. Watch the dead fraction when a ReLU network trains badly.

  - id: chain-rule-by-hand
    kind: internals
    concepts: [backpropagation-chain-rule]
    title: Backpropagation by hand on one payment
    body: |
      Take the smallest possible network - one input, one tanh hidden unit, one output - and one fraud
      example, `x = 1.5`, `y = 1`, with `w1 = 0.4`, `b1 = −0.2`, `w2 = −1.0`, `b2 = 0.3`.

      **Forward**, keeping every intermediate value:

      ```plaintext
      z1 = w1·x + b1       = 0.4000
      h  = tanh(z1)        = 0.3799
      s  = w2·h + b2       = −0.0799
      p  = sigmoid(s)      = 0.4800
      L  = −log p          = 0.7339
      ```

      **Backward.** Start at the loss and multiply by one local derivative per step. Each line uses only the line
      above it and a value cached in the forward pass:

      ```plaintext
      dL/ds  = p − y                 = −0.5200      (sigmoid + cross-entropy, from the previous lesson)
      dL/dw2 = dL/ds · h             = −0.1976      (s = w2·h + b2, so ds/dw2 = h)
      dL/db2 = dL/ds · 1             = −0.5200
      dL/dh  = dL/ds · w2            =  0.5200      (ds/dh = w2)
      dL/dz1 = dL/dh · (1 − h²)      =  0.4449      (tanh'(z1) = 1 − tanh²(z1))
      dL/dw1 = dL/dz1 · x            =  0.6674
      dL/db1 = dL/dz1 · 1            =  0.4449
      ```

      PyTorch's autograd, on the same numbers in float64:

      ```python
      t = {k: torch.tensor(v, dtype=torch.float64, requires_grad=True)
           for k, v in dict(w1=0.4, b1=-0.2, w2=-1.0, b2=0.3).items()}
      s = t["w2"] * torch.tanh(t["w1"] * 1.5 + t["b1"]) + t["b2"]
      loss = F.binary_cross_entropy_with_logits(s, torch.tensor(1.0, dtype=torch.float64))
      loss.backward()
      ```

      ```plaintext
      torch loss 0.7339 {'w1': 0.6674, 'b1': 0.4449, 'w2': -0.1976, 'b2': -0.52}
      ```

      Read the signs: `dL/dw2` is negative, so gradient descent **increases** w2 (towards less negative), which
      raises s and the fraud probability - right, because this was fraud. `dL/dw1` is positive, so w1 goes down:
      that lowers h, and since w2 is negative, lower h means higher s. The chain rule worked out that the hidden
      weight should move "the wrong way" because of the sign of the weight after it - nobody had to reason about
      it.

      That is all backpropagation is: **the chain rule, evaluated from the output backwards, reusing the forward
      values and the gradients already computed**. *Deep Learning* 6.5 stresses that the term "refers only to
      the method for computing the gradient, while another algorithm, such as stochastic gradient descent, is
      used to perform learning using this gradient."

  - id: vectorised-backward
    kind: internals
    concepts: [backpropagation-chain-rule]
    title: The same rules for whole layers and batches
    body: |
      With matrices, every scalar rule becomes a matrix rule. Write `dA` for the gradient of the loss with respect
      to an array `A` (same shape as `A`). For a dense layer `Z = X W + b` with `X (n, d)`, `W (d, h)`, `b (h,)`:

      | Gradient | Formula | Shape check |
      | --- | --- | --- |
      | `dW` | `Xᵀ @ dZ` | (d, n) @ (n, h) = (d, h) ✓ |
      | `db` | `dZ.sum(axis=0)` | (h,) ✓ - b was broadcast over n rows, so its gradient sums them |
      | `dX` | `dZ @ Wᵀ` | (n, h) @ (h, d) = (n, d) ✓ |

      For an element-wise activation `H = act(Z)`: `dZ = dH * act'(Z)` - an element-wise product (Nielsen writes
      it with the Hadamard product ⊙).

      A trick that catches most mistakes: **the gradient has the shape of the thing it's the gradient of**, and
      there is usually only one way to multiply the available arrays to get that shape. If `dW` must be `(d, h)`
      and you have `X (n, d)` and `dZ (n, h)`, it has to be `X.T @ dZ`.

      The `1/n` from the mean loss enters once, at the top: `dL/ds = (sigmoid(s) − y) / n`. Every gradient below
      inherits it - which is why **summing** over the batch in `dW = Xᵀ dZ` and `db = Σ dZ` gives the gradient of
      the **mean** loss.

  - id: backward-code
    kind: line-by-line
    concepts: [backpropagation-chain-rule]
    title: The backward pass, line by line
    body: |
      ```python
      def backward(params, cache, logits, y, activation="tanh"):
          X, Z1, H = cache["X"], cache["Z1"], cache["H"]
          y = np.asarray(y, dtype=float)
          n = X.shape[0]
          d_logits = ((_sigmoid(logits) - y) / n).reshape(-1, 1)  # (n, 1)
          dW2 = H.T @ d_logits                                     # (h, 1)
          db2 = d_logits.sum(axis=0)                               # (1,)
          dH = d_logits @ params["W2"].T                           # (n, h)
          dZ1 = dH * _act_grad(Z1, activation)                     # (n, h)
          dW1 = X.T @ dZ1                                          # (d, h)
          db1 = dZ1.sum(axis=0)                                    # (h,)
          return {"W1": dW1, "b1": db1, "W2": dW2, "b2": db2}
      ```

      - **`d_logits`** - sigmoid plus cross-entropy give `p − y` per example; dividing by `n` because the loss is a
        mean. Reshaped to a column so the matrix products line up with `W2 (h, 1)`.
      - **`dW2 = H.T @ d_logits`** - the output layer's input is `H`, so the dense-layer rule uses `H`, not `X`.
      - **`dH = d_logits @ W2.T`** - the gradient flowing **into** the hidden layer: each hidden unit receives the
        output error times its own outgoing weight. Without the transpose the shapes don't match - (n, 1) @ (h, 1)
        raises a `ValueError`.
      - **`dZ1 = dH * _act_grad(Z1)`** - the step people forget. It needs `Z1` from the cache (for tanh you could
        also use `1 − H²`). Leave it out and the code still runs and the loss may still fall, but the gradient is
        wrong - the gradient check below catches it.
      - **`dW1`, `db1`** - the dense-layer rule again, one layer down. A deeper network repeats the last four lines
        once per layer.

      Nothing here loops over examples or units. The cost is a handful of matrix products - about the same as the
      forward pass.

  - id: gradient-check
    kind: code
    concepts: [gradient-checking]
    title: Gradient checking - the test for a backward pass
    body: |
      A backward pass with a bug often still lets the loss go down a bit, so "it trains" proves nothing. The
      reliable test is to compare it with a **numerical** gradient: nudge one parameter up and down a little and
      see how the loss changes.

      ```python
      def numerical_gradients(params, X, y, activation="tanh", eps=1e-5):
          work = {k: np.array(v, dtype=float, copy=True) for k, v in params.items()}
          grads = {}
          for name in PARAM_NAMES:
              p = work[name]
              g = np.zeros_like(p)
              for idx in np.ndindex(p.shape):
                  old = p[idx]
                  p[idx] = old + eps / 2
                  plus = bce_with_logits(forward(work, X, activation)[0], y)
                  p[idx] = old - eps / 2
                  minus = bce_with_logits(forward(work, X, activation)[0], y)
                  p[idx] = old
                  g[idx] = (plus - minus) / eps
              grads[name] = g
          return grads
      ```

      Compare with the **relative** error, `|a − b| / (|a| + |b|)` per entry, worst case over all entries - an
      absolute difference of 1e-6 is excellent for a gradient of size 1 and terrible for one of size 1e-7. On a
      network with 3 inputs, 4 hidden units and 12 examples:

      ```plaintext
      tanh max relative error: 3.78e-08
      relu max relative error: 9.38e-09
      forgot tanh' : max relative error 1.00e+00
      forgot /n    : max relative error 8.46e-01
      ```

      The correct backward passes agree to 8 digits. Leaving out the activation derivative, or forgetting to
      divide by `n` in the output layer, gives errors near 1 - unmistakable. CS231n's rule of thumb: above 1e-2
      "the gradient is probably wrong"; 1e-2 to 1e-4 "should make you feel uncomfortable"; below 1e-4 is usually
      fine for functions with kinks (ReLU), but too high without them (tanh); "1e-7 and less you should be happy".

      **Choosing ε.** Too large and the formula's approximation error dominates; too small and floating-point
      rounding does (the two losses agree in almost every digit, and you divide their tiny difference by ε):

      ```plaintext
      eps=1e-01 rel error 4.83e-02
      eps=1e-03 rel error 5.08e-06
      eps=1e-05 rel error 3.78e-08
      eps=1e-07 rel error 1.87e-06
      eps=1e-09 rel error 2.54e-04
      eps=1e-11 rel error 3.15e-02
      ```

      The sweet spot for float64 is around 1e-5. In float32 there is no good ε for most networks - check
      gradients in float64. PyTorch's `torch.autograd.gradcheck` does this for any function of tensors, and its
      documentation warns "The default values are designed for input of double precision. This check will likely
      fail if input is of less precision".

      **Why the centred difference** `(L(θ + ε/2) − L(θ − ε/2))/ε` and not the one-sided `(L(θ + ε) − L(θ))/ε`?
      Its error shrinks with ε² instead of ε, so it is far more accurate for the same ε (CS231n: "it is much
      better to use the centered difference formula").

  - id: why-backprop-is-fast
    kind: internals
    concepts: [backpropagation-chain-rule, gradient-checking]
    title: Why not just use numerical gradients?
    body: |
      Because they cost two forward passes **per parameter**. Backpropagation gets every gradient for roughly the
      cost of one more forward pass. On a network with 20 inputs, 64 hidden units (1,409 parameters) and a batch
      of 256:

      ```plaintext
      parameters: 1409
      forward 1.439 ms, forward+backward 3.072 ms, numerical 4.15 s, ratio 1350x
      ```

      (Measured with 2 threads on a shared machine - a rough guide only.) A 1,409-parameter network is 1,350
      times slower to differentiate numerically; for a model with millions of parameters it is out of the question.
      Nielsen's chapter 2 makes the same comparison. So the roles are fixed: **backprop to train, finite
      differences to test backprop** - on a small network, once, before training.

  - id: symmetry
    kind: mistakes
    concepts: [gradient-checking, neurons-layers-and-forward-pass]
    title: Same start, same fate - why weights start random
    body: |
      What if every weight starts at 0 - or at the same value? Train the 8-unit XOR network for 1,500 steps from
      those starts:

      ```plaintext
      all zeros: loss 0.6916 accuracy 0.528 max diff between hidden units' weights 0.0e+00
         W1 row 0: [0. 0. 0. 0. 0. 0. 0. 0.]
      all 0.5: loss 0.5418 accuracy 0.730 max diff between hidden units' weights 0.0e+00
         W1 row 0: [2.233 2.233 2.233 2.233 2.233 2.233 2.233 2.233]
      ```

      From zeros, tanh(0) = 0, so `H` is 0, `dW2 = Hᵀ ds` is 0, and `dH = ds W2ᵀ` is 0 because `W2` is 0: the
      hidden layer **never moves** and the network is stuck at a constant. From 0.5, everything moves - but every
      hidden unit computes the same thing, so it gets the same gradient and takes the same step. After 1,500 steps
      the eight units are still **identical** (difference exactly 0.0): eight copies of one unit, which cannot
      learn XOR. Random initialisation breaks this symmetry; `init_params` draws weights from a normal
      distribution scaled by 1/√fan-in and sets biases to 0 (biases may start equal, because the random weights
      already make the units differ).

      Notice that a gradient check would **pass** on both of these networks - the gradients are correct, they're
      just useless. Gradient checking tests the calculus, not the training set-up.

  - id: pytorch-check
    kind: code
    concepts: [backpropagation-chain-rule, gradient-checking]
    title: The same network in PyTorch - autograd as a second opinion
    body: |
      PyTorch records the forward computation and runs the backward pass for you. Copy the NumPy weights into an
      equivalent `nn.Sequential` (PyTorch's `Linear` stores weights as (out, in), so transpose) and compare:

      ```python
      net = nn.Sequential(nn.Linear(3, 4), nn.Tanh(), nn.Linear(4, 1)).double()
      with torch.no_grad():
          net[0].weight.copy_(torch.tensor(p["W1"].T)); net[0].bias.copy_(torch.tensor(p["b1"]))
          net[2].weight.copy_(torch.tensor(p["W2"].T)); net[2].bias.copy_(torch.tensor(p["b2"]))
      loss = nn.BCEWithLogitsLoss()(net(torch.tensor(Xs)).squeeze(1), torch.tensor(ys))
      loss.backward()
      ```

      ```plaintext
      numpy loss 0.754633 torch loss 0.754633
      max |dW1 numpy - torch|: 4.8e-18
      max |dW2 numpy - torch|: 2.8e-17
      gradcheck: True
      parameter count: 21
      ```

      The hand-written backward pass and autograd agree to the last bits of float64. `loss.grad_fn` printed
      `<BinaryCrossEntropyWithLogitsBackward0 ...>` - the root of the recorded graph. This is how the `mlp_numpy`
      tests check your work: the reference gradients come from autograd, so a `backward()` that agrees with your
      own (equally buggy) `numerical_gradients()` but not with autograd still fails.

      In practice you'll rarely write a backward pass by hand - autograd does it. You still need to know how it
      works: to read shapes in error messages, to understand vanishing gradients and dead units, to write a custom
      operation, and to know what `loss.backward()` costs. [PyTorch fundamentals](#/lesson/pytorch-fundamentals)
      covers tensors, autograd and training loops properly.

  - id: steps
    kind: steps
    concepts: [backpropagation-chain-rule, gradient-checking]
    title: Implementing and verifying a network, step by step
    body: |
      1. **Write the shapes down** for every parameter and intermediate array, for a batch of `n`.
      2. **Forward pass**, returning the output and a cache of every intermediate the backward pass will need.
      3. **Loss from logits** with a stable formula; check it is finite and silent for a logit of ±1000.
      4. **Backward pass**, from the loss down: output gradient (with the `1/n`), then for each layer
         `dW = inputᵀ dZ`, `db = Σ dZ`, `d input = dZ Wᵀ`, then `dZ = dH * act'(Z)` for the layer below. Assert
         every gradient's shape equals its parameter's.
      5. **Gradient check** on a tiny network (a few inputs, a few units, a dozen examples) in float64 with
         ε ≈ 1e-5, non-zero biases, and inputs away from ReLU's kink. Relative error ~1e-7 or below: go on. Near 1:
         a missing factor. Check each parameter separately to find which layer is wrong.
      6. **Overfit a tiny data set** (say XOR) to near-zero loss. If it can't, the bug is in training - learning
         rate, initialisation, symmetric weights - not in the gradients.
      7. **Then** train for real, with gradient checking turned off, and watch the loss and the dead-unit fraction.

  - id: tests
    kind: tests
    concepts: [gradient-checking, backpropagation-chain-rule]
    title: Test cases for a hand-written network
    body: |
      | Case | Input | Expected result | Evidence |
      | --- | --- | --- | --- |
      | Shapes | `X (12, 3)`, `h = 4` | logits `(12,)`; every gradient the shape of its parameter | shape assertions |
      | Gradient check, tanh | 12 random examples, non-zero biases | max relative error < 1e-6 | measured 3.78e-08 |
      | Gradient check, ReLU | the same, inputs away from z = 0 | max relative error < 1e-6 | measured 9.38e-09 |
      | Negative: broken backward | `dW1` doubled | gradient check **fails** (> 0.3) | proves the check can fail |
      | Second opinion | same weights in PyTorch float64 | loss and gradients equal to ~1e-12 | measured 4.8e-18 |
      | Stable loss | logits 1000, −1000 and 40, all wrong | (2000 + log(1 + e^−40))/3, no warning | `warnings` as errors |
      | No side effects | `train_step` and `numerical_gradients` | caller's arrays unchanged | array equality |
      | Learns | XOR, 8 units, 1,500 epochs | loss < 0.1, accuracy ≥ 0.98 | measured 0.0130 and 1.0 |
      | Negative: symmetry | all weights equal | hidden units stay identical | max difference 0.0 |

      The negative cases matter as much as the positive ones: a gradient check that has never been seen to fail
      might not be checking anything.

  - id: mistakes
    kind: mistakes
    concepts: [backpropagation-chain-rule, gradient-checking, activation-functions-and-saturation]
    title: Common mistakes and how to find them
    body: |
      - **Forgetting the activation derivative** (`dZ = dH` instead of `dH * act'(Z)`). Runs, may even train a
        little; the gradient check gives a relative error near 1 for `W1` and `b1` only.
      - **Missing or doubled `1/n`.** Every gradient off by the batch size - the check shows a large error in all
        parameters, or only in the layer where you divided twice. Symptom in training: the learning rate that
        works depends on the batch size.
      - **Transpose mistakes** - `dZ @ W` instead of `dZ @ W.T`. With square weight matrices this runs silently
        and is wrong; use non-square layers in tests so shape errors surface.
      - **Gradient checking in float32**, or with ε = 1e-10 - a "failed" check caused by rounding, not by your
        code. Use float64 and ε ≈ 1e-5.
      - **Checking at a kink.** A ReLU input exactly at (or within ε of) 0 makes the numerical gradient average
        two slopes. Use random inputs, or report only entries away from the kink.
      - **Zero or identical initial weights** - the hidden units never become different (see above).
      - **Sigmoid or tanh hidden layers in a deep network** with no other care - the early layers barely learn.
        Prefer ReLU-family activations with a matching initialisation.
      - **A learning rate that kills ReLUs** - watch `dead_relu_fraction`; at lr=10 in the experiment above, 39%
        died.
      - **Mutating parameters in place inside a function that claims to return new ones** - the caller's "old"
        weights silently change, which breaks comparisons, gradient checks and any rollback.

  - id: when
    kind: when
    concepts: [neurons-layers-and-forward-pass, activation-functions-and-saturation]
    title: When a neural network is the right tool
    body: |
      - **Use one** when the signal is in complex interactions of many raw inputs - images, audio, text, sequences
        - where hand-made features are hard and data is plentiful. Later lessons build convolutional networks,
        sequence models and transformers on exactly the pieces in this lesson.
      - **Think twice** for ordinary tabular data such as SandPay's transaction table: gradient-boosted trees
        ([Decision trees, random forests and boosting](#/lesson/decision-trees-and-ensembles)) are usually as
        good or better, need less tuning and train faster. A plain MLP has no built-in idea of which features
        interact.
      - **Prefer a linear or logistic model** when you need coefficients you can explain feature by feature, or
        the data is small.
      - **Never hand-write backprop in production** - use autograd (PyTorch). Write it by hand to learn it, and
        when you must implement a custom operation - then gradient-check it.

  - id: summary
    kind: summary
    concepts:
      [neurons-layers-and-forward-pass, activation-functions-and-saturation, backpropagation-chain-rule, gradient-checking]
    title: Quick reference
    body: |
      - Neuron: `act(w · x + b)`. Layer on a batch: `H = act(X W + b)`, `X (n, d)`, `W (d, h)`. Parameters per
        dense layer: `d·h + h`.
      - Without a non-linear activation, stacked layers are one linear model. One hidden layer can approximate
        any reasonable function, but training must still find it - wider layers make that easier.
      - sigmoid' ≤ 0.25, tanh' ≤ 1, both ≈ 0 when saturated; ReLU' = 1 or 0. ReLU is the default hidden
        activation; sigmoid belongs in the output, with cross-entropy.
      - Vanishing gradients: early layers get tiny gradients through saturated activations or badly scaled
        weights. Dead ReLU: negative on every example, no gradient, never recovers - watch the dead fraction.
      - Backprop: `ds = (sigmoid(s) − y)/n`; per dense layer `dW = Xᵀ dZ`, `db = Σ dZ`, `dX = dZ Wᵀ`; per
        activation `dZ = dH ⊙ act'(Z)`. Cost ≈ a forward pass. It computes gradients; the optimiser learns.
      - Gradient check: centred differences, float64, ε ≈ 1e-5, relative error; ≤ 1e-7 good, ≥ 1e-2 a bug.
        Thousands of times slower - test only.
      - Random initialisation breaks symmetry; identical weights stay identical.

exercises:
  - id: count-parameters
    type: mcq
    concept: neurons-layers-and-forward-pass
    skill: application
    title: How many parameters?
    prompt: |
      SandPay's fraud network takes 30 features, has two hidden layers of 64 and 32 ReLU units, and one output
      logit. Every layer is dense with a bias. How many parameters does it have?
    options:
      - id: correct-4097
        text: 4,097
        feedback: Correct - 30·64 + 64 + 64·32 + 32 + 32·1 + 1 = 1,920 + 64 + 2,048 + 32 + 32 + 1.
      - id: no-biases-4000
        text: 4,000
        feedback: That counts the weights (1,920 + 2,048 + 32) but forgets one bias per unit - 64 + 32 + 1 = 97 more.
      - id: units-127
        text: "127"
        feedback: That is the number of units (64 + 32 + 1) plus 30 inputs. Each unit has one weight per input it reads, plus a bias.
      - id: product
        text: 61,440
        feedback: That is 30·64·32 - multiplying all the layer sizes together. Each pair of adjacent layers has its own weight matrix; the counts add, they don't multiply.
    correct: [correct-4097]
    hints:
      - A dense layer from d inputs to h units has a (d, h) weight matrix and h biases.
      - There are three dense layers - 30→64, 64→32 and 32→1.
    solution: |
      Per layer `d·h + h`: 30→64 gives 1,984; 64→32 gives 2,080; 32→1 gives 33. Total **4,097**. PyTorch would
      report the same with `sum(p.numel() for p in net.parameters())`.

  - id: linear-stack
    type: mcq
    concept: neurons-layers-and-forward-pass
    skill: analysis
    title: Ten layers, no activation
    prompt: |
      A colleague builds a network of ten dense layers with no activation functions between them, trains it on
      the XOR-style SandPay data and gets about 0.55 accuracy - the same as logistic regression. They want to add
      ten more layers. What do you tell them?
    options:
      - id: collapses
        text: The stack is one linear function, X·(W1 W2 ... W10) + a constant, so more layers can't help; add a non-linear activation such as ReLU after each hidden layer.
        feedback: Correct - composing linear maps gives a linear map, and no linear model can represent XOR.
      - id: more-layers
        text: More layers will help; deeper networks can represent more functions.
        feedback: Only with non-linear activations. Without them depth adds parameters but no expressive power.
      - id: more-epochs
        text: Train for more epochs - deep networks are slow to converge.
        feedback: The best linear model is already about 0.55 on XOR; no amount of training makes a linear model fit XOR.
      - id: bigger-lr
        text: Raise the learning rate so the deep layers learn faster.
        feedback: The problem is what the model can represent, not how fast it learns.
    correct: [collapses]
    hints:
      - Multiply out (X W1 + b1) W2 + b2.
      - What did LogisticRegression score on the same data?
    solution: |
      `(X W1 + b1) W2 + b2 = X (W1 W2) + (b1 W2 + b2)` - still linear, and induction extends it to any depth.
      The lesson's logistic regression scored 0.556 on this data; the stack will do no better. A hidden layer with
      a non-linear activation (8 tanh units in the lesson) reached 1.0.

  - id: saturation
    type: mcq
    concept: activation-functions-and-saturation
    skill: application
    title: A saturated hidden unit
    prompt: |
      A sigmoid hidden unit has pre-activation z = 6 on a training example. The gradient arriving at its output
      is dL/dh = 2.0. Roughly what gradient reaches z, and what does it mean?
    options:
      - id: tiny
        text: About 0.005 (2.0 × 0.00247) - the unit is saturated, so its incoming weights barely change on this example.
        feedback: Correct - sigmoid'(6) = σ(6)(1 − σ(6)) ≈ 0.00247.
      - id: same
        text: 2.0 - an activation passes the gradient through unchanged.
        feedback: Only an identity (or ReLU's active side) has derivative 1. Every gradient is multiplied by the activation's local derivative.
      - id: quarter
        text: 0.5 - sigmoid's derivative is 0.25.
        feedback: 0.25 is the maximum, reached only at z = 0. At z = 6 the curve is almost flat.
      - id: zero
        text: Exactly 0 - sigmoid units stop learning above z = 5.
        feedback: The gradient is tiny but not zero; sigmoid never has an exactly flat region (that's ReLU for z < 0).
    correct: [tiny]
    hints:
      - The chain rule multiplies by sigmoid'(z) = σ(z)(1 − σ(z)).
      - σ(6) ≈ 0.9975.
    solution: |
      dL/dz = dL/dh · σ'(6) ≈ 2.0 × 0.00247 ≈ 0.0049. Stack ten such layers and the factors multiply - at best
      0.25 per layer, `0.25**10 ≈ 9.5e-07` - which is why the lesson's 10-layer sigmoid network gave its first
      layer a gradient 58 million times smaller than its last.

  - id: dead-units
    type: mcq
    concept: activation-functions-and-saturation
    skill: analysis
    title: The network that stopped learning
    prompt: |
      A ReLU network on SandPay data trains well at lr = 0.1. At lr = 30 the loss jumps up early and then stays
      flat at 1.26 for the rest of training. `dead_relu_fraction` on the first hidden layer's pre-activations
      returns 0.953. What happened, and what is the first fix to try?
    options:
      - id: dead
        text: Large steps pushed most units' pre-activations below zero on every example; they output 0 and get zero gradient, so they never recover. Lower the learning rate (and consider leaky ReLU).
        feedback: Correct - this is the "dying ReLU" problem; 95% of the units are dead.
      - id: vanishing
        text: Vanishing gradients from saturation - switch to sigmoid, which never has exactly zero gradient.
        feedback: ReLU doesn't saturate for positive inputs, and sigmoid would make vanishing gradients worse. The 0.953 says the units are dead, not saturated.
      - id: overfit
        text: The network has overfitted the training data; add regularisation.
        feedback: An overfitted network has a low training loss. A flat, high training loss means it isn't learning at all.
      - id: more-epochs
        text: It needs more epochs - large learning rates take longer to converge.
        feedback: Dead units get exactly zero gradient, so more epochs change nothing for them.
    correct: [dead]
    hints:
      - What is ReLU's derivative for z < 0?
      - What does a dead fraction of 0.953 mean in words?
    solution: |
      These are the lesson's real numbers: lr = 30 left 95% of the units dead and the final loss (1.26) above the
      starting loss (log 2). With zero gradient a dead unit can't come back. Lower the learning rate first (lr =
      1.0 left no dead units); leaky ReLU, better initialisation and adaptive optimisers also help. CS231n:
      "With a proper setting of the learning rate this is less frequently an issue."

  - id: order-backprop
    type: order
    concept: backpropagation-chain-rule
    skill: recall
    title: One training step, in order
    prompt: |
      Put the steps of one gradient-descent step for the two-layer network in order.
    items:
      - id: hidden-forward
        text: Compute Z1 = X W1 + b1 and H = act(Z1), keeping both in the cache
      - id: logits-and-loss
        text: Compute the logits s = H W2 + b2 and the loss from the logits
      - id: output-gradient
        text: "Compute the output gradient: ds = (sigmoid(s) − y) / n"
      - id: output-layer
        text: Compute dW2 = Hᵀ ds and db2, then dH = ds W2ᵀ
      - id: hidden-layer
        text: Compute dZ1 = dH ⊙ act'(Z1), then dW1 = Xᵀ dZ1 and db1
      - id: update
        text: Update every parameter by subtracting learning rate × gradient
    hints:
      - The forward pass comes first and must finish before any gradient exists.
      - The backward pass visits the layers in reverse order.
    solution: |
      Forward (cache Z1 and H), loss, then backward from the output: output gradient, output layer, through the
      activation, hidden layer. Only then update - backprop computes all the gradients first; the optimiser uses
      them.

  - id: chain-rule-numbers
    type: mcq
    concept: backpropagation-chain-rule
    skill: application
    title: One more step of the chain
    prompt: |
      In the lesson's worked example, the backward pass has reached dL/dh = 0.5200 at a tanh unit whose output
      is h = 0.3799, and the unit's input is x = 1.5. What is dL/dw1?
    options:
      - id: right
        text: About 0.667 - 0.52 × (1 − 0.3799²) × 1.5.
        feedback: Correct - multiply by tanh's local derivative, then by the input that w1 multiplies.
      - id: no-act
        text: 0.78 - 0.52 × 1.5.
        feedback: That skips the activation's derivative, the most common backprop bug. 1 − h² = 0.8557 must be multiplied in.
      - id: times-h
        text: About 0.169 - 0.52 × 0.8557 × 0.3799.
        feedback: That multiplies by the unit's output h. w1 multiplies x in z1 = w1·x + b1, so dz1/dw1 = x.
      - id: tanh-of-x
        text: About 0.141 - 0.52 × (1 − tanh(1.5)²) × 1.5.
        feedback: The derivative is taken at z1 (where tanh(z1) = h = 0.3799), not at the input x.
    correct: [right]
    hints:
      - Two local derivatives remain - tanh at z1, and z1 with respect to w1.
      - tanh'(z1) = 1 − h².
    solution: |
      dL/dz1 = 0.5200 × (1 − 0.3799²) = 0.5200 × 0.8557 = 0.4449; dL/dw1 = 0.4449 × 1.5 = **0.6674** - the value
      PyTorch's autograd also printed.

  - id: debug-backward
    type: debug
    concept: backpropagation-chain-rule
    skill: analysis
    title: Two bugs in a backward pass
    prompt: |
      This backward pass for the tanh network (`Z1 = X W1 + b1`, `H = tanh(Z1)`, `s = H W2 + b2`, `W2` of shape
      (h, 1)) raises an error with h = 4. Once that is fixed, the gradient check reports a relative error of 1.0
      for `W1` and `b1`. Click every line that is wrong.
    language: python
    code: |
      def backward(params, cache, logits, y):
          X, Z1, H = cache["X"], cache["Z1"], cache["H"]
          n = X.shape[0]
          d_logits = ((sigmoid(logits) - y) / n).reshape(-1, 1)
          dW2 = H.T @ d_logits
          db2 = d_logits.sum(axis=0)
          dH = d_logits @ params["W2"]
          dZ1 = dH
          dW1 = X.T @ dZ1
          db1 = dZ1.sum(axis=0)
          return {"W1": dW1, "b1": db1, "W2": dW2, "b2": db2}
    correctLines: [7, 8]
    lineNotes:
      - line: 4
        note: Correct - sigmoid plus cross-entropy give p − y, divided by n for a mean loss, as a column.
      - line: 5
        note: Correct - the output layer's input is H, so dW2 = Hᵀ ds, shape (h, 1).
      - line: 9
        note: The formula dW1 = Xᵀ dZ1 is right; it is wrong only because dZ1 from line 8 is.
      - line: 10
        note: Summing over the batch is right for a broadcast bias.
    hints:
      - Check the shapes on each line - d_logits is (n, 1) and W2 is (h, 1).
      - Which local derivative is missing between H and Z1?
    solution: |
      - **Line 7** - `(n, 1) @ (h, 1)` is a shape error; it must be `d_logits @ params["W2"].T`, giving (n, h).
      - **Line 8** - it skips tanh's derivative; it must be `dZ1 = dH * (1 - H ** 2)`. Only `W1` and `b1` sit
        below it, which is why only they fail the check - and why the error is near 1.

  - id: read-gradient-check
    type: mcq
    concept: gradient-checking
    skill: analysis
    title: Reading a gradient check
    prompt: |
      You gradient-check a new ReLU network in float64 with ε = 1e-5 and get these worst relative errors per
      parameter: W1 3e-8, b1 2e-8, W2 0.92, b2 0.92. What do you conclude?
    options:
      - id: output-layer
        text: The output layer's backward code is wrong - probably the output gradient or the 1/n - while the hidden layer's maths is right.
        feedback: Correct - errors near 1 are bugs, and they are confined to W2 and b2. (Look at how dW2 and db2 are computed, and at whether the same ds is used for dH.)
      - id: kink
        text: Nothing is wrong - ReLU kinks make numerical gradients unreliable.
        feedback: A kink gives occasional moderate errors on a few entries, not 0.92 on every entry of one layer. And the hidden layer, which has the ReLU, checks out.
      - id: epsilon
        text: ε is too small; try 1e-2.
        feedback: The lesson's sweep showed ε = 1e-5 gives about 1e-8 in float64. If ε were the problem, every parameter would be affected.
      - id: all-wrong
        text: The whole backward pass is wrong; rewrite it.
        feedback: W1 and b1 agree to 8 digits, which they couldn't if the gradient flowing into the hidden layer were wrong - localise the bug instead.
    correct: [output-layer]
    hints:
      - Which parameters fail, and which pass?
      - CS231n - above 1e-2 is "probably wrong"; 1e-7 and less, "you should be happy".
    solution: |
      Per-parameter errors localise the bug. W1 and b1 at ~1e-8 mean the gradient flowing into the hidden layer is
      right; W2 and b2 at 0.92 mean their own formulas are wrong - for example a gradient left multiplied by n
      (forgetting /n gave 0.846 in the lesson) or using the wrong layer's input.

  - id: symmetric-init
    type: mcq
    concept: gradient-checking
    skill: analysis
    title: It passes the gradient check but won't learn XOR
    prompt: |
      A teammate's 8-unit network passes the gradient check (relative error 4e-8), but after 1,500 steps on XOR it
      is stuck at 0.73 accuracy. Printing `W1` shows every column is the same. What is wrong?
    options:
      - id: symmetry
        text: All hidden units started with the same weights, so they received identical gradients and stayed identical - effectively one hidden unit. Initialise the weights randomly.
        feedback: Correct - the lesson's "all 0.5" start gave exactly this, accuracy 0.730 with identical columns.
      - id: backward-bug
        text: The backward pass must still be wrong, because a correct network would learn XOR.
        feedback: The gradient check tests the calculus, and it passed. Correct gradients from a symmetric start are identical for every unit.
      - id: too-few
        text: 8 hidden units are too few for XOR.
        feedback: The lesson's 4-unit networks reached 0.99-1.0, and 8 random-start units reached 1.0.
      - id: relu-dead
        text: The ReLU units died.
        feedback: Dead units output 0 and stop changing; these columns changed (to the same values) during training.
    correct: [symmetry]
    hints:
      - If two units have the same incoming and outgoing weights, what are their gradients?
      - What does "every column is the same" tell you about the hidden units?
    solution: |
      Identical units compute identical outputs and get identical gradients, so equal weights stay equal forever.
      Draw weights from a random distribution (the lesson's `init_params` scales them by 1/√fan-in). A gradient
      check can't catch this - the gradients are correct.

  - id: activations-code
    type: coding
    concept: activation-functions-and-saturation
    skill: application
    title: Activation functions and their derivatives
    prompt: |
      In `activations.py`, `sigmoid` and `relu` are given. A colleague's drafts of `sigmoid_grad` and `relu_grad`
      look plausible - run the tests to see why they're wrong. Then implement:

      - `sigmoid_grad(z)` - σ(z)(1 − σ(z)), no overflow warnings for z = ±1000;
      - `tanh_grad(z)` - 1 − tanh²(z);
      - `relu_grad(z)` - 1.0 where z > 0, else 0.0 (0 at exactly 0, as PyTorch does);
      - `leaky_relu(z, alpha)` and `leaky_relu_grad(z, alpha)`;
      - `dead_relu_fraction(pre_activations)` - the fraction of columns (units) that are ≤ 0 on every row, with a
        `ValueError` for anything but a non-empty 2-D array.

      Every function works element-wise on any shape and returns floats, even for integer input. The tests
      compare each derivative with a centred finite difference.
    project: ai
    files:
      - exercises/deep_learning/activations.py
    test: tests/deep_learning/test_activations.py
    command: .venv/bin/python -m pytest tests/deep_learning/test_activations.py
    hints:
      - The sigmoid_grad draft computes z(1 − z). The textbook formula is in terms of σ(z), not z.
      - The relu_grad draft returns relu(z) itself - a value, not a slope. A derivative of max(0, z) can only be 0 or 1.
      - "np.where(z > 0, 1.0, alpha) gives the leaky slope; np.asarray(z, dtype=float) makes integers float."
      - "dead_relu_fraction: np.all(z <= 0, axis=0) marks the dead columns; its mean is the fraction."
    modelAnswer: |
      ```python
      def sigmoid_grad(z):
          s = sigmoid(z)                 # the given, overflow-safe sigmoid
          return s * (1.0 - s)

      def tanh_grad(z):
          t = np.tanh(np.asarray(z, dtype=float))
          return 1.0 - t * t

      def relu_grad(z):
          return (np.asarray(z, dtype=float) > 0).astype(float)

      def leaky_relu(z, alpha=0.01):
          z = np.asarray(z, dtype=float)
          return np.where(z > 0, z, alpha * z)

      def leaky_relu_grad(z, alpha=0.01):
          z = np.asarray(z, dtype=float)
          return np.where(z > 0, 1.0, alpha)

      def dead_relu_fraction(pre_activations):
          z = np.asarray(pre_activations, dtype=float)
          if z.ndim != 2 or z.shape[0] == 0:
              raise ValueError(f"expected an (n, h) array with n > 0, got shape {z.shape}")
          return float(np.all(z <= 0, axis=0).mean())
      ```

      Reusing the stable `sigmoid` is what keeps `sigmoid_grad` silent at ±1000. A unit is dead only if it is
      non-positive on **every** example (`axis=0`, over rows), and `0.0` counts as not firing because ReLU's
      output and gradient there are both 0.
    solution: |
      Write each derivative in terms of the activation's output - σ(1 − σ), 1 − tanh² - computed with the stable
      sigmoid; ReLU's derivative is the step `z > 0` as floats; leaky ReLU uses `np.where`; a dead unit is a
      column that is ≤ 0 on every row. Full code in `solutions/deep_learning/activations.py`.
    rubric:
      - Every test in tests/deep_learning/test_activations.py passes.
      - No Python loops - every function is vectorised with NumPy.
      - You can explain why the draft sigmoid_grad, z(1 − z), is wrong, and when that formula would be right (if z were already σ(z)).
      - You can explain why sigmoid'(z) ≤ 0.25 makes deep sigmoid networks hard to train, and why a dead ReLU unit never recovers.
    followUp: |
      Add `gelu` and `gelu_grad` (the tanh approximation), check the derivative against a finite difference, and
      compare its derivative with ReLU's at z = −1, 0 and 1. Is a GELU unit ever exactly dead?

  - id: mlp-numpy-code
    type: coding
    concept: backpropagation-chain-rule
    skill: application
    title: A two-layer network with backpropagation, checked against autograd
    prompt: |
      In `mlp_numpy.py`, `init_params`, the activations, `max_relative_error`, `fit` and `predict` are given.
      Implement:

      - `forward(params, X, activation)` - return `(logits of shape (n,), cache)` with `X`, `Z1` and `H` in the
        cache; `ValueError` if `X` is not `(n, d)` with the right `d`;
      - `bce_with_logits(logits, y)` - the draft is the textbook formula; make it finite and warning-free for
        logits of ±1000;
      - `backward(params, cache, logits, y, activation)` - every gradient, each the shape of its parameter;
      - `numerical_gradients(...)` - centred differences, without changing the caller's params;
      - `train_step(...)` - the draft updates the caller's arrays in place; return **new** arrays and the loss
        before the step.

      The tests compare your loss and gradients with PyTorch's autograd in float64, prove your gradient check
      can fail, and train the network on XOR.
    project: ai
    files:
      - exercises/deep_learning/mlp_numpy.py
    test: tests/deep_learning/test_mlp_numpy.py
    command: .venv/bin/python -m pytest tests/deep_learning/test_mlp_numpy.py
    hints:
      - "Write the shapes first: X (n, d), W1 (d, h), Z1 and H (n, h), W2 (h, 1), logits (n,)."
      - "Stable loss: np.maximum(s, 0) - s * y + np.log1p(np.exp(-np.abs(s))), then the mean."
      - "backward: d_logits = ((sigmoid(logits) - y) / n).reshape(-1, 1); then dW2 = H.T @ d_logits, dH = d_logits @ W2.T, dZ1 = dH * act'(Z1), dW1 = X.T @ dZ1; biases sum over axis 0."
      - "numerical_gradients: copy every array first, then loop with np.ndindex(p.shape), setting each entry to old ± eps/2 and back to old."
      - "train_step: {name: params[name] - learning_rate * grads[name] for name in PARAM_NAMES} builds new arrays."
    modelAnswer: |
      ```python
      def forward(params, X, activation="tanh"):
          X = np.asarray(X, dtype=float)
          W1 = params["W1"]
          if X.ndim != 2 or X.shape[1] != W1.shape[0]:
              raise ValueError(f"X must be (n, {W1.shape[0]}), got {X.shape}")
          Z1 = X @ W1 + params["b1"]
          H = _act(Z1, activation)
          logits = (H @ params["W2"] + params["b2"]).reshape(-1)
          return logits, {"X": X, "Z1": Z1, "H": H}

      def bce_with_logits(logits, y):
          s = np.asarray(logits, dtype=float); y = np.asarray(y, dtype=float)
          return float(np.mean(np.maximum(s, 0.0) - s * y + np.log1p(np.exp(-np.abs(s)))))

      def backward(params, cache, logits, y, activation="tanh"):
          X, Z1, H = cache["X"], cache["Z1"], cache["H"]
          n = X.shape[0]
          d_logits = ((_sigmoid(logits) - np.asarray(y, dtype=float)) / n).reshape(-1, 1)
          dW2 = H.T @ d_logits
          db2 = d_logits.sum(axis=0)
          dZ1 = (d_logits @ params["W2"].T) * _act_grad(Z1, activation)
          return {"W1": X.T @ dZ1, "b1": dZ1.sum(axis=0), "W2": dW2, "b2": db2}

      def train_step(params, X, y, learning_rate, activation="tanh"):
          logits, cache = forward(params, X, activation)
          loss = bce_with_logits(logits, y)
          grads = backward(params, cache, logits, y, activation)
          return {k: params[k] - learning_rate * grads[k] for k in PARAM_NAMES}, loss
      ```

      `numerical_gradients` is the loop in the lesson's gradient-check section, run on copies. `params[k] -
      learning_rate * grads[k]` creates a new array, whereas `params[k] -= ...` overwrites the caller's.
    solution: |
      Forward with a cache; the stable loss from logits; backward from `(sigmoid(s) − y)/n` through the output
      layer, the activation's derivative and the hidden layer, checking every shape; centred differences on
      copies; and a train step that builds new arrays. Full code in `solutions/deep_learning/mlp_numpy.py`.
    rubric:
      - Every test in tests/deep_learning/test_mlp_numpy.py passes.
      - The backward pass is vectorised - no loops over examples or units.
      - You can derive each line of backward() from the chain rule and say why every gradient has its parameter's shape.
      - You can explain why the tests check against autograd rather than only against your own numerical_gradients.
    followUp: |
      Generalise the network to any list of hidden sizes (`[16, 8]`), looping over layers in `forward` and in
      reverse in `backward`. Gradient-check it, then repeat the lesson's depth experiment with 10 sigmoid layers
      in your own code - do you see the same shrinking gradients?

  - id: testdesign-backprop
    type: testdesign
    concept: gradient-checking
    skill: analysis
    title: Test plan for a custom layer's backward pass
    prompt: |
      A SandPay ML engineer has written a custom layer with a hand-written backward pass (it will be wrapped as a
      PyTorch autograd function). Before it is used in the fraud model, design the tests. Give preconditions,
      steps, expected results and the evidence you would keep - including at least two negative tests.
    modelAnswer: |
      **Preconditions:** float64 inputs; a fixed seed; a tiny configuration (a few inputs and units, about a dozen
      examples) so the numerical check runs in seconds; random, non-zero weights **and** biases; inputs away from
      any kink.

      1. **Shapes** - call forward and backward; every gradient has the shape of its parameter or input.
         Use non-square sizes so transposes can't hide. Evidence - the asserted shapes.
      2. **Gradient check** - centred differences with ε ≈ 1e-5 for every parameter and the input; expected
         maximum relative error ≤ 1e-7 (≤ 1e-4 if the layer has kinks). Report the worst error **per parameter**,
         so a failure points at a layer. With PyTorch, `torch.autograd.gradcheck(fn, inputs)` returns `True`.
      3. **Negative - the check can fail** - deliberately scale one gradient by 2 (or drop a factor) and confirm
         the check reports an error near 1. Evidence - the failing number.
      4. **Negative - bad input** - wrong input shape raises a clear error; extreme inputs (±1000) give finite
         outputs and no warnings.
      5. **Second implementation** - compare forward outputs and gradients with an equivalent built from standard
         PyTorch operations (autograd) to ~1e-12.
      6. **No side effects** - inputs and parameters unchanged after forward, backward and the gradient check.
      7. **Learns** - a tiny model using the layer overfits a tiny data set (XOR) to near-zero loss.

      **Evidence kept:** the seed, versions (NumPy, PyTorch), the per-parameter error table, the negative-test
      numbers and the training-loss curve.
    rubric:
      - Uses a numerical gradient check with centred differences, float64 and a sensible ε, and reads the relative error.
      - Includes at least two negative tests, one proving the check can fail.
      - Mentions shapes (with non-square sizes), kinks and side effects.
      - Compares with an independent implementation (autograd) or an overfitting run.
      - States the evidence to keep, with versions and seeds.
    hints:
      - What would show the backward pass is right - and what would show your test can catch a wrong one?
      - Which settings make a numerical check give false alarms?
    solution: |
      Tiny float64 configuration with random non-zero parameters; shape checks with non-square sizes; a per-parameter
      centred-difference gradient check (or `gradcheck`); negative tests that break a gradient and feed bad input;
      a second opinion from autograd; side-effect checks; an overfitting run - with seeds, versions and the numbers
      kept as evidence.

  - id: interview-backprop
    type: interview
    concept: backpropagation-chain-rule
    skill: analysis
    title: "\"Explain backpropagation\""
    prompt: |
      An interviewer for an ML engineering role asks: "Explain how a neural network learns. What exactly does
      backpropagation do, and how would you know if your implementation of it were wrong?"
    modelAnswer: |
      A network is a chain of layers - each a matrix product plus a bias, through a non-linear activation - ending
      in a loss. Learning is gradient descent: move every weight a little against the gradient of the loss.
      Backpropagation is how we get that gradient efficiently. It's the chain rule applied from the loss
      backwards: start with dL/dL = 1, and at each operation multiply the incoming gradient by the operation's
      local derivative and pass it to its inputs. For a dense layer Z = XW + b that's dW = XᵀdZ, db = the column
      sums, dX = dZWᵀ; through an activation it's an element-wise product with the activation's derivative. The
      forward pass caches the intermediate values that the backward pass needs, which is why training uses more
      memory. The whole backward pass costs about as much as a forward pass - versus two forward passes per
      parameter numerically, which is why it's what makes deep learning practical. Backprop only computes the
      gradient; SGD or Adam does the learning.

      To know it's right, I gradient-check: on a tiny network in float64, compare with centred finite differences
      using relative error, ε around 1e-5 - around 1e-7 is right, near 1 is a bug, and per-parameter errors
      localise it. I'd also compare with autograd and make sure the check can fail. Then I'd check that the model
      can overfit a tiny data set. Separately, a correct gradient can still be useless - saturated sigmoids
      vanish through depth, ReLUs can die with too high a learning rate, and identical initial weights never
      diverge - so I'd watch gradient norms per layer and the dead-unit fraction.
    rubric:
      - Explains backprop as the chain rule applied backwards, reusing cached forward values.
      - Gives the dense-layer and activation gradient rules, or works an example.
      - Separates computing gradients (backprop) from using them (the optimiser), and explains why it is efficient.
      - Describes gradient checking correctly - centred differences, float64, relative error, thresholds.
      - Mentions failure modes with correct gradients - vanishing gradients, dead ReLUs, symmetry.
    followUps:
      - Why is it called reverse mode, and when would forward-mode differentiation be cheaper?
      - Why does training need more memory than inference?
      - Your gradient check passes but the loss doesn't go down. What do you look at next?
    hints:
      - Forward, loss, backward, update - and the test.
      - Correct gradients are necessary, not sufficient.
    solution: |
      Forward pass with a cache; loss; chain rule backwards with local derivatives (dW = XᵀdZ, dZ = dH ⊙ act');
      cost ≈ a forward pass; the optimiser does the learning; gradient check with centred differences in float64
      and relative error, plus autograd and an overfitting test; then vanishing gradients, dead units and symmetry
      as the problems a correct gradient doesn't solve.

placement:
  - id: place-shapes
    type: mcq
    concept: neurons-layers-and-forward-pass
    skill: application
    title: The shape of a hidden layer
    prompt: |
