id: agent-loops-and-workflow-patterns
title: Agent loops and workflow patterns
subject: ai-engineering
module: ai-agents
level: intermediate
status: published
estimatedMinutes: 135
summary: Decide between a workflow - your code fixes the path and the model fills in each step - and an agent, where the model chooses its next tool call in a loop. Build the five workflow patterns from Anthropic's "Building effective agents" (prompt chaining with gates, routing with a fallback, parallel sectioning and voting, orchestrator-workers with a validated plan, evaluator-optimizer with a code evaluator), then the ReAct-style agent loop with the guards it needs to be safe and testable - a step limit, a token budget, no-progress detection, tool errors returned to the model, and a trace of every step that a tester can assert on. Every output comes from code run offline against a scripted fake model.
tags:
  [
    AI agents,
