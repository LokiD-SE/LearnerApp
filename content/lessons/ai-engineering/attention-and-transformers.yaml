id: attention-and-transformers
title: Attention and transformers
subject: ai-engineering
module: deep-learning
level: advanced
status: published
estimatedMinutes: 120
summary: Build the transformer from its parts and check every part against PyTorch - scaled dot-product attention as a soft lookup, why the scores are divided by the square root of the key size, causal and padding masks (and the two opposite mask conventions inside PyTorch), multi-head attention with its shapes and parameter count, positional encodings, and the residual, layer-norm and feed-forward block that stacks into encoders and decoders. A tiny model trained on a copy task shows what a missing causal mask or missing positions does. Every number shown was produced by the code shown.
