  - id: attention-coding
    type: coding
    concept: scaled-dot-product-attention
    skill: application
    title: Write scaled dot-product attention and its masks
    prompt: |
      In `attention.py`, `attention(q, k, v, mask=None)` is a teammate's draft that runs and is wrong in more than
      one place. Fix it so it returns `(output, weights)` and matches `F.scaled_dot_product_attention`, with a
      boolean mask in the SDPA convention (True = may attend) and fully blocked rows returning zeros instead of NaN.
      Then implement `causal_mask(n)` and `padding_mask(lengths, max_len)` as their docstrings describe. Do not call
      `F.scaled_dot_product_attention` inside your function - the tests compare against it.
    project: ai
    files:
      - exercises/deep_learning/attention.py
    test: tests/deep_learning/test_attention.py
    command: .venv/bin/python -m pytest tests/deep_learning/test_attention.py
    hints:
      - Three things in the draft disagree with equation 1 or with the SDPA convention - check the divisor, the masked_fill argument and the softmax axis.
      - "masked_fill(~mask, float('-inf')) blocks the pairs where mask is False."
      - "A fully blocked row is softmax of all -inf, which is NaN. torch.nan_to_num(weights, nan=0.0) turns it into zeros."
      - "padding_mask: torch.arange(max_len)[None, :] < lengths[:, None] gives (batch, max_len); add a middle axis with [:, None, :]."
    modelAnswer: |
      ```python
      def attention(q, k, v, mask=None):
          scores = q @ k.transpose(-2, -1) / math.sqrt(q.size(-1))
          if mask is not None:
              scores = scores.masked_fill(~mask, float("-inf"))
          weights = torch.softmax(scores, dim=-1)
          if mask is not None:
              weights = torch.nan_to_num(weights, nan=0.0)   # fully blocked rows
          return weights @ v, weights


      def causal_mask(n, device=None):
          return torch.ones(n, n, dtype=torch.bool, device=device).tril()


      def padding_mask(lengths, max_len):
          lengths = torch.as_tensor(lengths)
          keep = torch.arange(max_len, device=lengths.device)[None, :] < lengths[:, None]
          return keep[:, None, :]
      ```

      The draft divided by `d_k` instead of `sqrt(d_k)`, filled the **allowed** pairs with `-inf` (MHA's
      convention applied to an SDPA-style mask), and took the softmax over `dim=-2`, so columns summed to 1. The
      padding mask gets a middle axis so it broadcasts over query positions; combined with a causal mask by `&` it
      becomes `(batch, n, n)`.
    rubric:
      - Every test in test_attention.py passes
      - The function does not call F.scaled_dot_product_attention
      - Scale is 1/sqrt(d_k) and the softmax is over keys
      - Fully blocked rows are handled explicitly, not by luck
    solution: |
      See the model answer. The tests check a hand-computed example, agreement with SDPA with and without masks,
      rows summing to 1, a fully blocked row, `gradcheck`, and that changing future keys and values does not
      change earlier outputs under the causal mask.
    followUp: |
      Add a `dropout_p` argument that applies dropout to the weights only when a `training` flag is True. What should
      happen to the rows that are fully blocked?

  - id: positional-coding
    type: coding
    concept: transformer-block-and-positions
    skill: application
    title: Sinusoidal positions and the shift matrix
    prompt: |
      In `positional.py`, `sinusoidal_encoding(n_positions, d_model)` is a first draft with the right shape and the
      wrong numbers. Fix it to follow section 3.5 of the paper exactly and reject an odd `d_model` with
      `ValueError`. Then implement `shift_matrix(k, d_model)`, the matrix `R` with `PE[pos + k] == PE[pos] @ R` for
      every position.
    project: ai
    files:
      - exercises/deep_learning/positional.py
    test: tests/deep_learning/test_positional.py
    command: .venv/bin/python -m pytest tests/deep_learning/test_positional.py
    hints:
      - Compare the draft's exponent with 2i / d_model, and check which of sin and cos goes in the even columns.
      - "Column pair (2i, 2i+1) uses one frequency w = 1 / 10000 ** (2i / d_model)."
      - "sin(a + b) = sin a cos b + cos a sin b and cos(a + b) = cos a cos b - sin a sin b."
      - "With row vectors, [sin, cos] @ [[c, -s], [s, c]] = [sin·c + cos·s, -sin·s + cos·c]."
    modelAnswer: |
      ```python
      def sinusoidal_encoding(n_positions, d_model, dtype=torch.float32):
          if d_model % 2:
              raise ValueError(f"d_model must be even, got {d_model}")
          pos = torch.arange(n_positions, dtype=torch.float64)[:, None]
          two_i = torch.arange(0, d_model, 2, dtype=torch.float64)
          angles = pos / (10000 ** (two_i / d_model))
          pe = torch.zeros(n_positions, d_model, dtype=torch.float64)
          pe[:, 0::2] = torch.sin(angles)
          pe[:, 1::2] = torch.cos(angles)
          return pe.to(dtype)


      def shift_matrix(k, d_model, dtype=torch.float64):
          if d_model % 2:
              raise ValueError(f"d_model must be even, got {d_model}")
          r = torch.zeros(d_model, d_model, dtype=dtype)
          for j in range(d_model // 2):
              w = 1.0 / 10000 ** (2 * j / d_model)
              c, s = math.cos(w * k), math.sin(w * k)
              r[2 * j, 2 * j], r[2 * j, 2 * j + 1] = c, -s
              r[2 * j + 1, 2 * j], r[2 * j + 1, 2 * j + 1] = s, c
          return r
      ```

      The draft used `i / d_model` with `i` counting pairs (0, 1, 2...) - half the right exponent - and swapped sine
      and cosine. The table is computed in float64 and converted at the end, so float32 users get correctly
      rounded values. `R` is block-diagonal: each 2 × 2 block rotates one (sin, cos) pair by `w · k`, which is the
      angle-addition formula - so the same matrix works for every position, as the paper claims.
    rubric:
      - Every test in test_positional.py passes
      - The table follows sin in even columns, cos in odd columns, exponent 2i / d_model
      - shift_matrix is built from the frequencies, not by solving a least-squares problem on the table
      - Can explain why R is orthogonal and why R_2 @ R_3 = R_5
    solution: |
      See the model answer. The tests check position 0 (alternating 0 and 1), the formula at several positions,
      `PE[pos] @ R_k == PE[pos + k]` for every position, and that `R` is a rotation (`R @ R.T = I`, `R_0 = I`,
      `R_2 @ R_3 = R_5`).
    followUp: |
      Plot (or print) the dot product `PE[10] · PE[10 + k]` for k = 0..20. Does it depend on 10, or only on k?
      Explain with the rotation.

  - id: multihead-coding
    type: coding
    concept: multi-head-attention
    skill: application
    title: Multi-head self-attention and a Pre-LN block
    prompt: |
      In `multihead.py` (solve `attention.py` first if you want to reuse your thinking), finish
      `MultiHeadSelfAttention`: fix `split_heads` (its draft has the right shape), implement `merge_heads`, fix the
      scale, and add causal masking and `key_padding_mask` (MultiheadAttention's convention - True = padding).
      Then fix `TransformerBlock.forward`, whose draft uses the paper's Post-LN order, to be the Pre-LN block its
      docstring describes. The tests copy `nn.MultiheadAttention`'s weights into your layer and compare.
    project: ai
    files:
      - exercises/deep_learning/multihead.py
    test: tests/deep_learning/test_multihead.py
    command: .venv/bin/python -m pytest tests/deep_learning/test_multihead.py
    hints:
      - "split_heads: view the last axis as (heads, d_head), then transpose(1, 2). merge_heads undoes it - transpose back, then reshape."
      - Each head's keys have d_head features - that is the size to take the square root of.
      - "Causal: torch.ones(n, n, dtype=torch.bool).triu(1) is True above the diagonal - the blocked pairs. Padding: key_padding_mask[:, None, None, :] broadcasts over heads and queries."
      - "Pre-LN: a = attn(norm1(x)); x = x + a; return x + ffn(norm2(x))."
    modelAnswer: |
      ```python
      def split_heads(self, t):
          b, n, _ = t.shape
          return t.view(b, n, self.num_heads, self.d_head).transpose(1, 2)

      def merge_heads(self, t):
          b, _, n, _ = t.shape
          return t.transpose(1, 2).reshape(b, n, self.d_model)

      def forward(self, x, causal=False, key_padding_mask=None):
          b, n, _ = x.shape
          q, k, v = self.in_proj(x).chunk(3, dim=-1)
          q, k, v = self.split_heads(q), self.split_heads(k), self.split_heads(v)
          scores = q @ k.transpose(-2, -1) / self.d_head**0.5
          if causal:
              future = torch.ones(n, n, dtype=torch.bool, device=x.device).triu(1)
              scores = scores.masked_fill(future, float("-inf"))
          if key_padding_mask is not None:
              scores = scores.masked_fill(key_padding_mask[:, None, None, :], float("-inf"))
          weights = F.softmax(scores, dim=-1)
          return self.out_proj(self.merge_heads(weights @ v)), weights

      # TransformerBlock.forward
      a, _ = self.attn(self.norm1(x), causal=causal, key_padding_mask=key_padding_mask)
      x = x + a
      return x + self.ffn(self.norm2(x))
      ```

      `in_proj` holds W_Q, W_K and W_V stacked in that order - the same layout as MHA's `in_proj_weight` - so
      `chunk(3, dim=-1)` gives the three projections. Both masks are written in the "True = blocked" form here,
      so they go straight into `masked_fill`. The block keeps an untouched residual stream, which is why zeroing
      both sub-layers' output projections makes it the identity.
    rubric:
      - Every test in test_multihead.py passes
      - split_heads uses view then transpose; merge_heads is its exact inverse
      - Scores are scaled by sqrt(d_head), not sqrt(d_model)
      - The block is Pre-LN with both residual connections
    solution: |
      See the model answer. The tests check the parameter layout and count (`4d² + 4d`), the split on a
      hand-made tensor, agreement with `nn.MultiheadAttention` (no mask, causal, key padding) including per-head
      weights, permutation equivariance, the Pre-LN formula, the identity property, that a causal block's earlier
      outputs ignore later tokens, and that every parameter receives a gradient.
    followUp: |
      Add cross-attention: a `forward(x, memory)` where queries come from `x` and keys and values from `memory`,
      which may have a different length. Which shapes change, and which mask no longer makes sense?

  - id: interview-attention
    type: interview
    concept: transformer-block-and-positions
    skill: analysis
    title: "Interview: explain a transformer layer"
    prompt: |
      *"Walk me through what happens inside one layer of a decoder-only transformer, from the token embeddings to
      the layer's output. Why is there a square root in the attention formula, and how would you test that the
      model cannot see the future?"*
    hints:
      - Positions, projections into heads, scores, mask, softmax, mix, merge, output projection, residual, FFN, norms.
    modelAnswer: |
      Tokens are embedded to `d_model` vectors and position information is added (sinusoidal or learned), because
      attention by itself is permutation equivariant. In a Pre-LN layer the input is layer-normalised and projected
      into queries, keys and values, split into h heads of size `d_model / h`. Each head computes
      `softmax(Q K^T / sqrt(d_head) + mask) V`: dot-product similarity of every query with every key, scaled,
      with a causal mask setting future positions to minus infinity, softmax over the keys, and a weighted sum of
      values. The heads are concatenated and projected by W_O, and the result is added to the residual stream. Then
      a position-wise feed-forward network - two linear layers with a non-linearity, typically 4 × d_model wide -
      is applied to each token after another layer norm and added back.

      The square root: with unit-variance components, a dot product of d_k terms has variance d_k, so without
      scaling the softmax saturates to nearly one-hot and its gradients vanish; dividing by sqrt(d_k) keeps the
      scores at unit variance.

      Testing no look-ahead: change a token at position t and assert that outputs at positions before t are
      bit-for-bit (or float64-close) identical; check the attention weights are exactly zero above the diagonal;
      and in training, compare the loss with the floor the data allows - an implausibly low teacher-forced loss
      with poor generation is the signature of a leak. I would also check the mask convention, because PyTorch's
      SDPA and MultiheadAttention use opposite boolean meanings.
    rubric:
      - Covers positions, Q/K/V projections, heads, scaling, mask, softmax, weighted sum, W_O, residuals, FFN and layer norm in the right order
      - Explains the sqrt(d_k) with the variance argument and the gradient consequence
      - Gives a behavioural test (perturb future tokens) rather than only reading the code
      - Mentions the cost (quadratic in sequence length) or the mask-convention trap
    followUps:
      - How does the cost of a layer grow with sequence length, and what would you do about very long inputs?
      - What changes in an encoder layer, and in a decoder layer with cross-attention?
      - Why might Pre-LN train more stably than the original Post-LN?
    solution: |
      See the model answer. Interviewers listen for the order of operations, a precise reason for the scaling,
      and a test that checks behaviour rather than reading the code.

placement:
  - id: place-attention-output
    type: mcq
    concept: scaled-dot-product-attention
    skill: application
    title: Attention by hand
    prompt: |
      One query `q = [1, 0, 0, 0]` attends over two keys `k1 = [2, 0, 0, 0]` and `k2 = [0, 0, 0, 0]` with values
      `v1 = [10]` and `v2 = [0]`, using scaled dot-product attention (d_k = 4). What is the output, to two decimals?
    options:
      - id: right
        text: "7.31 - scores 1 and 0, weights 0.731 and 0.269"
        feedback: Correct - the dot products are 2 and 0, divided by sqrt(4) = 2 they are 1 and 0, and softmax gives e/(e+1) = 0.731.
      - id: unscaled
        text: "8.81 - scores 2 and 0"
        feedback: That forgets the division by sqrt(d_k). With d_k = 4 the scores are halved.
      - id: hard
        text: "10 - the query matches k1"
        feedback: Attention is a soft lookup; k2 still gets weight because its score (0) is not minus infinity.
      - id: half
        text: "5 - two keys, equal weight"
        feedback: Equal weights need equal scores. Here the first score is larger.
    correct: [right]
    solution: |
      Scores `q·k1 = 2`, `q·k2 = 0`; scaled by `1/sqrt(4)` they are 1 and 0. Softmax: `e / (e + 1) = 0.731` and
      `0.269`. Output `0.731 · 10 + 0.269 · 0 = 7.31`.

  - id: place-mask-convention
    type: mcq
    concept: attention-masks
    skill: application
    title: Passing a mask to MultiheadAttention
    prompt: |
      `allowed = torch.ones(n, n, dtype=torch.bool).tril()` is a causal mask where True means "may attend". Which
      call gives a correct causal `nn.MultiheadAttention` forward pass?
    options:
      - id: invert
        text: "mha(x, x, x, attn_mask=~allowed)"
        feedback: Correct - in MultiheadAttention a True value means the position is NOT allowed to attend, so the SDPA-style mask must be inverted.
      - id: as-is
        text: "mha(x, x, x, attn_mask=allowed)"
        feedback: MultiheadAttention reads True as blocked, so each row would see only the future, and the last row would be fully blocked (NaN).
      - id: padding
        text: "mha(x, x, x, key_padding_mask=allowed)"
        feedback: key_padding_mask is (batch, S) and hides keys for every query; it cannot express a per-query causal rule, and the convention is inverted too.
      - id: float
        text: "mha(x, x, x, attn_mask=allowed.float())"
        feedback: A float mask is ADDED to the scores, so this adds 1 to the allowed pairs and 0 to the future - the future is not blocked at all.
    correct: [invert]
    solution: |
      SDPA's boolean mask uses True = participate; MultiheadAttention's `attn_mask` and `key_padding_mask` use
      True = masked out. Invert once with `~allowed` (or build `triu(1)` directly). A float mask needs `-inf` for
      the blocked pairs, as `nn.Transformer.generate_square_subsequent_mask` produces.

  - id: place-heads
    type: mcq
    concept: multi-head-attention
    skill: application
    title: Heads and shapes
    prompt: |
      `d_model = 768`, 12 heads, batch 4, sequence 100. After splitting the queries into heads, what is their shape,
      and what is the shape of the attention weights per layer?
    options:
      - id: right
        text: Queries (4, 12, 100, 64); weights (4, 12, 100, 100)
        feedback: Correct - d_head = 768 / 12 = 64, and each head has one 100 × 100 weight matrix per sequence.
      - id: full-width
        text: Queries (4, 12, 100, 768); weights (4, 12, 100, 100)
        feedback: Each head works on a d_model / h slice, not the full width - that keeps the cost similar to one full-width head.
      - id: weights-dhead
        text: Queries (4, 12, 100, 64); weights (4, 12, 100, 64)
        feedback: Weights relate every query position to every key position, so their last two axes are both sequence lengths.
      - id: no-head-axis
        text: Queries (4, 100, 768); weights (4, 100, 100)
        feedback: That is a single head of full width. With multi-head attention the weights have a head axis.
    correct: [right]
    solution: |
      `d_head = 768 / 12 = 64`; split queries are `(batch, heads, seq, d_head) = (4, 12, 100, 64)` and the
      weights `(batch, heads, L, S) = (4, 12, 100, 100)`.

  - id: place-positions
    type: mcq
    concept: transformer-block-and-positions
    skill: application
    title: Shuffled input
    prompt: |
      An encoder with token embeddings and two `nn.TransformerEncoderLayer` blocks, **no** positional encoding and
      no mask, receives a sequence and then the same sequence with its tokens shuffled. What is true of the two
      outputs?
    options:
      - id: permuted
        text: The second output is the first one with its rows shuffled the same way.
        feedback: Correct - self-attention, the position-wise FFN and layer norm are permutation equivariant, so the whole stack is.
      - id: same
        text: The two outputs are identical row by row.
        feedback: Each token's output moves with the token. Only an order-independent pooling (such as a mean) would make them identical.
      - id: different
        text: The outputs are unrelated, because attention depends on order.
        feedback: Without positions nothing in the computation refers to an index - that is exactly why positional encodings are needed.
      - id: error
        text: PyTorch raises an error because positional encodings are required.
        feedback: The layers do not check for positions; the model silently ignores order.
    correct: [permuted]
    solution: |
      Nothing in the block uses token indices, so permuting the input permutes the output (the lesson's check
      printed `True`). To make the model order-aware, add sinusoidal or learned positions to the embeddings.

recall:
  - id: recall-attention-formula
    concept: scaled-dot-product-attention
    prompt: Write scaled dot-product attention and say what each part does.
    answer: softmax(Q K^T / sqrt(d_k)) V. Q K^T scores every query against every key, sqrt(d_k) keeps the scores at unit variance, softmax over the keys makes positive weights that sum to 1, and the weights average the values.
  - id: recall-why-sqrt
    concept: scaled-dot-product-attention
    prompt: Why divide by sqrt(d_k)?
    answer: With unit-variance components, q·k has variance d_k. Large scores push the softmax into a near one-hot region with near-zero gradients (5.6e-06 versus 0.25 at d_k = 512 in the lesson). Dividing by sqrt(d_k) restores variance 1.
  - id: recall-cost
    concept: scaled-dot-product-attention
    prompt: How do attention's time and memory grow with sequence length, and what does it buy?
    answer: O(n^2) - an n × n weight matrix per head (64 MiB in float32 at n = 4096). In exchange every token reaches every other in one step (path length O(1)) and all positions are computed in parallel.
  - id: recall-mask-conventions
    concept: attention-masks
    prompt: What does True mean in a boolean mask for SDPA, and for nn.MultiheadAttention?
    answer: SDPA - True = may attend. MultiheadAttention (attn_mask and key_padding_mask) - True = blocked. Convert with ~mask. Float masks are added to the scores in both (0 keep, -inf block).
  - id: recall-causal
    concept: attention-masks
    prompt: What does a causal mask prevent, and how do you test it?
    answer: Position i attending to positions after i, which would let a next-token model read its target. Test by changing a later token and checking earlier outputs are unchanged; in training, a loss below the data's floor signals a leak.
  - id: recall-mha
    concept: multi-head-attention
    prompt: How does multi-head attention reshape its inputs, and how many parameters does it have?
    answer: Project to Q, K, V (b, n, d), view as (b, n, h, d/h) and transpose to (b, h, n, d/h); attend per head; transpose back, reshape to (b, n, d), apply W_O. Parameters 4d^2 + 4d, whatever h is.
  - id: recall-positions
    concept: transformer-block-and-positions
    prompt: Why do transformers need positional encodings, and what is special about the sinusoidal ones?
    answer: Self-attention is permutation equivariant, so it cannot see order. Sinusoids sin/cos(pos / 10000^(2i/d)) need no parameters, are defined at every position, and PE[pos+k] is a fixed linear map (a rotation) of PE[pos].
  - id: recall-block
    concept: transformer-block-and-positions
    prompt: What is in a transformer block, and what is the difference between Post-LN and Pre-LN?
    answer: Multi-head self-attention and a position-wise FFN, each with a residual connection and layer norm. Post-LN (2017) - LayerNorm(x + Sublayer(x)), needs warm-up. Pre-LN - x + Sublayer(LayerNorm(x)), well-behaved gradients at initialisation.

