    correct: [works-now-fragile]
    hints:
      - What information does padding throw away that the lengths keep?
      - What happens to this line if the pad id becomes 99?
    solution: |
      Build the mask from the lengths: `torch.arange(T)[None, :] < lengths[:, None]`. It depends only on how long
      each sequence really is. The exercise's draft has the `!= 0` bug, and the test
      `test_mask_comes_from_lengths_not_from_the_pad_value` pads with 9 while a real token is 0.

  - id: order-bpe
    type: order
    concept: text-tokens-and-padding
    skill: recall
    title: Learning BPE merges
    prompt: Put the steps of learning byte-pair-encoding merges (Sennrich et al., 2016) in order.
    items:
      - id: count-words
        text: Count the training words and their frequencies.
      - id: split-chars
        text: Split each word into characters plus an end-of-word symbol.
      - id: count-pairs
        text: Count every adjacent symbol pair, weighted by word frequency.
      - id: pick-pair
        text: Pick the most frequent pair (break ties by a fixed rule).
      - id: merge-record
        text: Replace every occurrence of that pair with one merged symbol and record the merge.
      - id: repeat
        text: Repeat the counting and merging until the chosen number of merges is reached.
    hints:
      - You cannot count pairs before the words are split into symbols.
      - The output is the ordered list of merges.
    solution: |
      Word frequencies → characters + `</w>` → weighted pair counts → most frequent pair → merge everywhere and
      record → repeat. Segmenting a new word later applies the recorded merges in the same order.

  - id: bpe-by-hand
    type: mcq
    concept: text-tokens-and-padding
    skill: application
    title: Two merges by hand
    prompt: |
      Word frequencies: `{"low": 5, "lower": 2}`. Words start as characters plus `</w>`. Pair counts are weighted
      by frequency, and ties go to the alphabetically smallest pair. What are the first two merges, and how is
      the unseen word "lowest" segmented with them?
    options:
      - id: lo-low
        text: "('l','o') then ('lo','w'); lowest → ['low', 'e', 's', 't', '</w>']"
        feedback: Correct - ('l','o') and ('o','w') both occur 7 times; ('l','o') sorts first. After it, ('lo','w') occurs 7 times.
      - id: ow-first
        text: "('o','w') then ('l','ow'); lowest → ['low', 'e', 's', 't', '</w>']"
        feedback: The tie between ('l','o') and ('o','w') - 7 each - goes to the alphabetically smaller pair, ('l','o').
      - id: w-end
        text: "('w','</w>') then ('l','o'); lowest → ['lo', 'w', 'e', 's', 't', '</w>']"
        feedback: ('w','</w>') occurs only in "low" (5 times); pairs inside both words occur 5 + 2 = 7 times.
      - id: unweighted
        text: "('e','r') then ('r','</w>'), because every pair counts once per word"
        feedback: Counts are weighted by frequency - "low" appears 5 times - and ('e','r') appears only in "lower" (2).
    correct: [lo-low]
    hints:
      - Write the symbols of each word and count every adjacent pair, multiplying by the word's frequency.
      - Which pairs appear in both words?
    solution: |
      Pairs in both words - ('l','o') and ('o','w') - count 5 + 2 = 7; ('l','o') wins the tie. Then "lo w </w>" and
      "lo w e r </w>" give ('lo','w') = 7. "lowest" → l o w e s t </w> → lo w e s t </w> → low e s t </w>.
      This is the `learn_bpe` docstring example, checked by the tests.

  - id: embedding-params
    type: mcq
    concept: word-embeddings
    skill: application
    title: Sizing an embedding layer
    prompt: |
      SandPay's ticket model uses a vocabulary of 10,000 tokens and 300-dimensional embeddings. A teammate
      suggests feeding one-hot vectors to an `nn.Linear(10000, 300, bias=False)` instead of `nn.Embedding`.
      Which is right?
    options:
      - id: same-function
        text: Both compute the same function with 3,000,000 weights; the embedding just selects rows instead of multiplying by mostly zeros, so it is much cheaper.
        feedback: Correct - one-hot × W selects a row of W; nn.Embedding stores W (V × d) and indexes it.
      - id: linear-learns-more
        text: The linear layer can learn more, because it multiplies by the whole input vector.
        feedback: The input is one-hot - all but one entry are zero - so the product only ever uses one row (column of the Linear's weight). Same capacity.
      - id: embedding-fewer
        text: The embedding has only 300 parameters - one vector shared by all tokens.
        feedback: An embedding has one vector per token - 10,000 × 300 = 3,000,000 values.
      - id: ids-scaled
        text: Feed the raw id divided by 10,000 into nn.Linear(1, 300) - that is equivalent and smaller.
        feedback: That treats ids as an ordered quantity - token 4 "between" tokens 3 and 5 - which they are not. Each token needs its own free vector.
    correct: [same-function]
    hints:
      - What does multiplying a one-hot row vector by a matrix do?
      - How many vectors does the table hold?
    solution: |
      V × d = 10,000 × 300 = 3,000,000 parameters either way; the lesson checks `one_hot @ emb.weight` equals
      `emb(ids)` (True). The lookup avoids building 10,000-long vectors and multiplying by zeros. Only rows of
      tokens present in the batch receive gradient.

  - id: skipgram-neighbours
    type: mcq
    concept: word-embeddings
    skill: analysis
    title: What skip-gram neighbours tell you
    prompt: |
      After training skip-gram on SandPay's tickets, the nearest neighbours of "refund" by cosine similarity are
      "chargeback" and "reversal". The routing team wants to use this to merge the refund and chargeback queues
      "because the model says they mean the same". What do you tell them?
    options:
      - id: usage-not-meaning
        text: The vectors are close because the words are used in similar contexts, not because they mean the same thing; that is not evidence the queues can be merged.
        feedback: Correct - skip-gram learns from which words appear around each word. Words that are interchangeable in sentences - even opposites - get similar vectors.
      - id: synonyms
        text: Cosine similarity near 1 means synonyms - merge the queues.
        feedback: Similar contexts are not similar meanings. "Approved" and "declined" can appear in identical sentences.
      - id: random
        text: The neighbours are random - embeddings carry no information.
        feedback: Trained embeddings carry real information about usage; the lesson's run separated actions, payment methods, currencies and parties perfectly.
      - id: ids-close
        text: They are neighbours because their token ids are close.
        feedback: Ids are arbitrary labels; similarity is computed between the learned vectors.
    correct: [usage-not-meaning]
    hints:
      - What exactly is skip-gram trained to predict?
      - Which other word pairs appear in the same sentence positions?
    solution: |
      Skip-gram maximises the probability of the context words around each word, so words with the same
      contexts get similar vectors. That is distributional similarity - useful as a feature - but the routing
      decision needs labelled examples of what each queue handles.

  - id: rnn-shapes
