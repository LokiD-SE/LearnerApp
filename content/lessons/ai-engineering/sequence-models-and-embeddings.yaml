  - id: tokens-coding
    type: coding
    concept: text-tokens-and-padding
    skill: application
    title: Text to tensors - tokens, vocabulary, padding, BPE
    prompt: |
      In `tokens.py`, implement the text pipeline the lesson uses:

      - `tokenize(text)` - lower-case, then `\w+` runs and single non-space punctuation characters;
      - `build_vocab(texts, min_freq, max_size)` - PAD 0, UNK 1, then frequency (ties alphabetical);
        `max_size` counts PAD and UNK, and below 2 is a `ValueError`;
      - `encode(text, vocab)` - unknown tokens become UNK;
      - `pad_batch(sequences, pad_id, max_len)` - returns `(ids, mask, lengths)`; the first draft has the
        shapes right but derives the mask from the ids and ignores `max_len`;
      - `learn_bpe(word_freqs, num_merges)` and `bpe_segment(word, merges)` - Sennrich et al.'s merges, with
        the tie rule in the docstring. `_merge` is provided.
    project: ai
    files:
      - exercises/deep_learning/tokens.py
    test: tests/deep_learning/test_tokens.py
    command: .venv/bin/python -m pytest tests/deep_learning/test_tokens.py
    hints:
      - "tokenize: re.findall(r\"\\w+|[^\\w\\s]\", text.lower())."
      - "build_vocab: Counter over every token, filter by min_freq, sort with key=lambda t: (-counts[t], t), cut to max_size - 2."
      - "pad_batch: trim first (s[:max_len]), lengths from the trimmed lists, torch.full for ids, and mask = torch.arange(T)[None, :] < lengths[:, None]."
      - "learn_bpe: words as tuple(word) + ('</w>',); each round count pairs with zip(symbols, symbols[1:]) weighted by frequency, pick min(pairs, key=lambda p: (-pairs[p], p)), and rebuild every word with _merge."
    modelAnswer: |
      ```python
      def tokenize(text):
          return re.findall(r"\w+|[^\w\s]", text.lower())

      def build_vocab(texts, min_freq=1, max_size=None):
          if max_size is not None and max_size < 2:
              raise ValueError("max_size must leave room for PAD and UNK")
          counts = Counter(t for text in texts for t in tokenize(text))
          ranked = sorted((t for t, c in counts.items() if c >= min_freq), key=lambda t: (-counts[t], t))
          if max_size is not None:
              ranked = ranked[: max_size - 2]
          vocab = {PAD: 0, UNK: 1}
          for token in ranked:
              vocab[token] = len(vocab)
          return vocab

      def encode(text, vocab):
          return [vocab.get(t, vocab[UNK]) for t in tokenize(text)]

      def pad_batch(sequences, pad_id=0, max_len=None):
          trimmed = [list(s[:max_len]) if max_len is not None else list(s) for s in sequences]
          lengths = torch.tensor([len(s) for s in trimmed], dtype=torch.long)
          width = int(lengths.max()) if trimmed else 0
          ids = torch.full((len(trimmed), width), pad_id, dtype=torch.long)
          for row, seq in enumerate(trimmed):
              ids[row, : len(seq)] = torch.tensor(seq, dtype=torch.long)
          mask = torch.arange(width)[None, :] < lengths[:, None]
          return ids, mask, lengths

      def learn_bpe(word_freqs, num_merges):
          words = {tuple(w) + (END_OF_WORD,): f for w, f in word_freqs.items()}
          merges = []
          for _ in range(num_merges):
              pairs = Counter()
              for symbols, freq in words.items():
                  for pair in zip(symbols, symbols[1:]):
                      pairs[pair] += freq
              if not pairs:
                  break
              best = min(pairs, key=lambda p: (-pairs[p], p))
              merges.append(best)
              words = {_merge(s, best): f for s, f in words.items()}
          return merges

      def bpe_segment(word, merges):
          symbols = tuple(word) + (END_OF_WORD,)
          for pair in merges:
              symbols = _merge(symbols, pair)
          return list(symbols)
      ```

      The sort key makes ids reproducible; the mask comes from the lengths, so it is right for any pad id;
      BPE counts are weighted by word frequency and merges are applied in the order learned.
    solution: |
      A regex tokeniser; a frequency-sorted vocabulary with PAD and UNK first; `dict.get` for UNK; padding from
      trimmed copies with a lengths-based mask; BPE as repeated weighted pair counting with a deterministic tie
      rule. Full code in `solutions/deep_learning/tokens.py`.
    rubric:
      - Every test in tests/deep_learning/test_tokens.py passes.
      - The mask is computed from the lengths, never from the id values.
      - The input lists are not modified (pad_batch copies before trimming).
      - You can explain why the tie rules matter (reproducible ids and merges across runs and machines).
    followUp: |
      Add `encode_bpe(text, merges, vocab)` that tokenises, segments each word with `bpe_segment` and maps the
      subwords to ids. Measure the UNK rate of word-level encoding and of BPE encoding on a held-out set of
      tickets - which is lower, and what happens to the sequence lengths?

  - id: rnn-coding
    type: coding
    concept: recurrent-networks-and-bptt
    skill: application
    title: An RNN by hand, gradient norms through time, and a padding-proof LSTM classifier
    prompt: |
      In `rnn.py`, implement:

      - `rnn_forward(x, h0, W_ih, W_hh, b_ih, b_hh)` - the Elman tanh recurrence as a loop over time, using only
        tensor operations, returning `(output, h_n)` like `nn.RNN` (tested against it, outputs and gradients);
      - `input_gradient_norms(rnn, x)` - backpropagate the sum of the last layer's final hidden state to the
        input and return the L2 norm of the gradient per time step; works for RNN, GRU and LSTM, and must not
        modify `x`;
      - `LSTMClassifier` - the first draft trains, but its predictions change with the padding in the batch.
        Fix it: `padding_idx` on the embedding, and pack the batch so the head reads each sequence's final real
        state.

      `train_classifier` is provided. The last test trains on the first-token memory task and expects the loss
      below 0.1 and test accuracy above 0.75.
    project: ai
    files:
      - exercises/deep_learning/rnn.py
    test: tests/deep_learning/test_rnn.py
    command: .venv/bin/python -m pytest tests/deep_learning/test_rnn.py
    hints:
      - "rnn_forward: h = h0; for t in range(L): h = torch.tanh(x[t] @ W_ih.T + b_ih + h @ W_hh.T + b_hh); collect every h and torch.stack them."
      - "input_gradient_norms: x = x.detach().clone().requires_grad_(True) so the caller's tensor is untouched; an LSTM returns (h_n, c_n) - check isinstance(state, tuple)."
      - "The per-step norm over the whole batch: x.grad.flatten(start_dim=1).norm(dim=1)."
      - "LSTMClassifier: nn.Embedding(..., padding_idx=pad_id); pack_padded_sequence(embedded, lengths.cpu(), batch_first=True, enforce_sorted=False); _, (h_n, _) = self.lstm(packed); return self.head(h_n[-1])."
    modelAnswer: |
      ```python
      def rnn_forward(x, h0, W_ih, W_hh, b_ih, b_hh):
          h = h0
          outputs = []
          for t in range(x.shape[0]):
              h = torch.tanh(x[t] @ W_ih.T + b_ih + h @ W_hh.T + b_hh)
              outputs.append(h)
          return torch.stack(outputs), h

      def input_gradient_norms(rnn, x):
          x = x.detach().clone().requires_grad_(True)
          _, state = rnn(x)
          h_n = state[0] if isinstance(state, tuple) else state   # LSTM: (h_n, c_n)
          h_n[-1].sum().backward()
          return x.grad.flatten(start_dim=1).norm(dim=1)

      class LSTMClassifier(nn.Module):
          def __init__(self, vocab_size, embed_dim, hidden_size, num_classes, pad_id=0):
              super().__init__()
              self.embedding = nn.Embedding(vocab_size, embed_dim, padding_idx=pad_id)
              self.lstm = nn.LSTM(embed_dim, hidden_size, batch_first=True)
              self.head = nn.Linear(hidden_size, num_classes)

          def forward(self, ids, lengths):
              packed = pack_padded_sequence(self.embedding(ids), lengths.cpu(),
                                            batch_first=True, enforce_sorted=False)
              _, (h_n, _) = self.lstm(packed)
              return self.head(h_n[-1])
      ```

      The loop is differentiable because it uses only tensor operations - autograd builds the unrolled graph.
      Cloning `x` keeps the caller's tensor free of `requires_grad`. Packing makes `h_n` the state after each
      sequence's last real token, so padding cannot change a prediction.
    solution: |
      The recurrence as a Python loop over `x[t]`; gradient norms from a detached clone of the input and the
      last layer's `h_n` (first element of an LSTM's tuple); a classifier that packs the padded batch and
      classifies from `h_n[-1]`. Full code in `solutions/deep_learning/rnn.py`.
    rubric:
      - Every test in tests/deep_learning/test_rnn.py passes.
      - rnn_forward uses no nn.RNN and keeps weights in the documented orientation (x @ W_ih.T).
      - The classifier's output for a sequence is identical alone and beside a longer sequence (eval mode).
      - You can explain, using your gradient norms, why the plain RNN struggles on long sequences and what the forget gate changes.
    followUp: |
      Add a `forget_bias` argument to `LSTMClassifier` that fills `bias_ih_l0[H:2H]` at construction. Train on
      the first-token task with 30-40-token sequences (as in the lesson's experiment) with and without it, and
      compare `input_gradient_norms` at step 0 before training and test accuracy after.

  - id: interview-rnn-limits
    type: interview
    concept: gated-rnns-and-their-limits
    skill: analysis
    title: "\"Why did transformers replace LSTMs?\""
    prompt: |
      An interviewer for an ML engineering role asks: "Before transformers, LSTMs were the standard for text.
      Explain how an LSTM processes a sentence, what problem it solved over a plain RNN, and why it was
      replaced."
    modelAnswer: |
      Text is tokenised into ids and looked up in an embedding table, so each token is a learned vector. A
      recurrent network reads the vectors in order, updating a hidden state with the same weights at each step,
      so it handles any length. It is trained with backpropagation through time; the gradient reaching early
      tokens is a product of one Jacobian per step, so in a plain RNN it vanishes - in a measurement on 50
      steps the first token's gradient was 13 orders of magnitude below the last's - or occasionally explodes,
      which is handled with gradient-norm clipping.

      The LSTM adds a cell state updated additively, c_t = f ⊙ c_(t-1) + i ⊙ g, controlled by input, forget and
      output gates. When the forget gate stays near 1, information and gradients survive many steps; a positive
      forget-gate bias at initialisation helps it learn long dependencies. GRUs are a smaller variant with two
      gates.

      They were replaced because of three limits. Computation is sequential in time - step t needs step t-1 -
      so you cannot parallelise across a sequence and training time grows with length, which wastes GPUs. The
      whole past must be squeezed into one fixed-size state. And the path between distant tokens is as long as
      the distance between them. Attention gives every token a direct, weighted connection to every other
      token, computed for all positions at once with matrix products, which made it practical to train much
      larger models on much more data - at a cost that grows quadratically with length instead.
    rubric:
      - Describes tokens → embeddings → recurrent state with shared weights.
      - Explains BPTT and vanishing/exploding gradients as products over time steps, and clipping for explosions.
      - Explains the LSTM's additive cell and gates (forget gate as the key), and mentions GRUs.
      - Names sequential computation, the fixed-size state and long paths as the limits.
      - Explains what attention changes (direct connections, parallel over positions) and its quadratic cost.
    followUps:
      - Your LSTM classifier's predictions change with batch size. What is the likely bug?
      - When would you still choose a GRU or LSTM today?
      - Gradient clipping is on but early tokens still have no effect. Why?
    hints:
      - Start from how text becomes vectors, then the recurrence, then training.
      - Limits - think about time, memory size and path length.
    solution: |
      Embeddings → recurrent state with shared weights → BPTT with vanishing/exploding gradients (clip for
      explosions); LSTM's additive gated cell keeps memory when the forget gate is open; replaced because of
      sequential computation, a fixed-size state and long paths - attention connects all positions directly
      and in parallel, at quadratic cost in length.

placement:
  - id: place-mask
    type: mcq
    concept: text-tokens-and-padding
    skill: application
    title: The mask of a padded batch
    prompt: |
      Sequences `[[5, 0, 7], [8]]` are right-padded with `pad_id=9`. (Here id 0 is a real token.) What are
      `ids` and the mask (True = real token)?
    options:
      - id: right
        text: "ids [[5, 0, 7], [8, 9, 9]], mask [[T, T, T], [T, F, F]]"
        feedback: Correct - the mask comes from the lengths (3 and 1), so the real 0 stays True.
      - id: zero-masked
        text: "ids [[5, 0, 7], [8, 9, 9]], mask [[T, F, T], [T, F, F]]"
        feedback: That is the `ids != 0` mask - it hides a real token. Masks come from the lengths.
      - id: left-pad
        text: "ids [[5, 0, 7], [9, 9, 8]], mask [[T, T, T], [F, F, T]]"
        feedback: That is left padding. The question says right-padded.
      - id: pad-zero
        text: "ids [[5, 0, 7], [8, 0, 0]], mask [[T, T, T], [T, F, F]]"
        feedback: The pad id is 9, not 0.
    correct: [right]
    solution: |
      Right padding appends `pad_id` (9) up to the longest length (3). The mask is `positions < lengths` with
      lengths [3, 1], so the real token 0 is True. A mask computed as `ids != 0` would wrongly hide it.

  - id: place-embedding
    type: mcq
    concept: word-embeddings
    skill: application
    title: What an embedding lookup computes
    prompt: |
      `emb = nn.Embedding(5000, 64, padding_idx=0)`. For `ids` of shape (8, 20), what does `emb(ids)` return,
      and what happens to row 0 of `emb.weight` during training?
    options:
      - id: right
        text: A (8, 20, 64) tensor - row ids[b, t] of the weight matrix at each position; row 0 starts at zeros and gets no gradient.
        feedback: Correct - a lookup equal to one-hot × weight; the padding row is fixed.
      - id: one-hot
        text: A (8, 20, 5000) one-hot tensor; row 0 is ignored.
        feedback: The embedding never builds one-hot vectors; it returns the 64-dimensional rows.
      - id: pooled
        text: A (8, 64) tensor - the average vector of each sequence.
        feedback: Embedding returns one vector per id; any pooling over the sequence is your code's job (using the mask).
      - id: row0-trained
        text: A (8, 20, 64) tensor; row 0 is trained like any other row.
        feedback: With padding_idx=0, "the entries at padding_idx do not contribute to the gradient" (PyTorch docs).
    correct: [right]
    solution: |
      The output shape is the input shape plus the embedding dimension, (8, 20, 64). The values are rows of
      `emb.weight`, identical to one-hot × weight. With `padding_idx=0`, row 0 is zeros at construction and is
      not updated by gradients.

  - id: place-gradients
    type: mcq
    concept: recurrent-networks-and-bptt
    skill: analysis
    title: Clipping and vanishing gradients
    prompt: |
      A plain RNN on 200-token tickets ignores the first sentence. Gradient-norm clipping at 1.0 is already
      in the training loop, after `backward()`. Why doesn't it help?
    options:
      - id: right
        text: Clipping only scales gradients down when their total norm exceeds the threshold; the problem is gradients for early steps shrinking exponentially through the product of per-step Jacobians.
        feedback: Correct - clipping addresses explosions; vanishing needs gating (LSTM/GRU), initialisation or a different architecture.
      - id: threshold
        text: The threshold is too high; clip at 0.01 instead.
        feedback: A lower threshold shrinks gradients further. It cannot increase a gradient that is already tiny.
      - id: position
        text: Clipping must happen before backward() to affect early steps.
        feedback: Before backward() there are no new gradients to clip. After backward() and before step() is the right place.
      - id: per-step
        text: clip_grad_norm_ clips each time step separately, which removes the early ones.
        feedback: It computes one norm over all parameter gradients together and scales them all by the same factor; it doesn't work per time step.
    correct: [right]
    solution: |
      `clip_grad_norm_` rescales all gradients when their combined norm exceeds `max_norm` - it fixes
      explosions. The first sentence's influence vanishes because BPTT multiplies one Jacobian per step; that
      needs an LSTM/GRU (with an open forget gate) or attention.

  - id: place-packing
    type: debug
    concept: gated-rnns-and-their-limits
    skill: analysis
    title: Final state of a padded batch
    prompt: |
      This function should return each sequence's hidden state after its last real token. Click the line to
      change.
    language: python
    code: |
      def final_states(lstm, embedded, lengths):
          # embedded: (B, T, E), right-padded; lstm has batch_first=True
          output, (h_n, c_n) = lstm(embedded)
          return h_n[-1]
    correctLines: [3]
    lineNotes:
      - line: 4
        note: h_n[-1] is exactly right once the input is packed - it then holds each sequence's state after its own last token.
    solution: |
      **Line 3** runs the LSTM over the padding, so `h_n` is the state after the last **column**. Pack first:
      `lstm(pack_padded_sequence(embedded, lengths.cpu(), batch_first=True, enforce_sorted=False))`; then
      `h_n[-1]` is correct.

recall:
  - id: recall-text-pipeline
    concept: text-tokens-and-padding
    prompt: List the steps from raw text to a batch a recurrent model can use.
    answer: Tokenise; map tokens to ids with a vocabulary built on training text (PAD 0, UNK 1); encode (unknown → UNK); right-pad to the longest sequence; keep the lengths and build the mask from them (positions < length).
  - id: recall-bpe
    concept: text-tokens-and-padding
    prompt: How does BPE learn its subwords, and why does it remove UNKs?
    answer: Start from characters plus an end-of-word marker; repeatedly merge the most frequent adjacent pair (frequency-weighted) and record the merge. Segment by applying the merges in order. Any word can be spelled from characters, so nothing is unknown.
  - id: recall-embedding
    concept: word-embeddings
    prompt: What is nn.Embedding mathematically, and how many parameters does it have?
    answer: One-hot(id) × W, computed as a row lookup in W (V × d) - V·d parameters. padding_idx keeps that row at zeros and out of the gradient. Vectors start random and are learned.
  - id: recall-skipgram
    concept: word-embeddings
    prompt: What does skip-gram with negative sampling train, and what do the resulting vectors capture?
    answer: For each word, score real context words (within a window) high and k random noise words low, with logistic losses. Words used in similar contexts get similar vectors (high cosine) - similar usage, not necessarily similar meaning.
  - id: recall-rnn
    concept: recurrent-networks-and-bptt
    prompt: Write the Elman RNN update and say why it handles any length.
    answer: h_t = tanh(x_t W_ih^T + b_ih + h_(t-1) W_hh^T + b_hh). The same weights are used at every step, so the parameter count is independent of the length.
  - id: recall-vanishing
    concept: recurrent-networks-and-bptt
    prompt: Why do RNN gradients vanish or explode, and what does clipping fix?
    answer: BPTT multiplies one Jacobian (diag(tanh') · W_hh) per step, so gradients scale roughly exponentially with distance. clip_grad_norm_ - after backward(), before step() - rescales explosions; it cannot fix vanishing.
  - id: recall-lstm
    concept: gated-rnns-and-their-limits
    prompt: Write the LSTM cell update and explain the forget gate's role.
    answer: c_t = f_t ⊙ c_(t-1) + i_t ⊙ g_t, h_t = o_t ⊙ tanh(c_t). With f_t ≈ 1 the cell (and its gradient) passes through almost unchanged; a positive forget-gate bias at initialisation helps learn long dependencies.
  - id: recall-limits
    concept: gated-rnns-and-their-limits
    prompt: What are the limits of recurrent models that attention removed?
    answer: Sequential computation over time (no parallelism across steps, time grows with length), a fixed-size state summarising the whole past, and long paths between distant tokens. Attention connects all positions directly and in parallel, at quadratic cost in length.

