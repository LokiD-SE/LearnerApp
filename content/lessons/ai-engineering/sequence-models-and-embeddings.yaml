        feedback: Correct - batch_first applies to output, not to h_n; 4 gates × (50×100 + 50×50 + 50 + 50) = 30,400.
      - id: hn-batch-first
        text: output (32, 20, 50), h_n (32, 1, 50); 30,400 parameters.
        feedback: batch_first does not apply to hidden or cell states - h_n is always (layers × directions, batch, hidden).
      - id: rnn-count
        text: output (32, 20, 50), h_n (1, 32, 50); 7,600 parameters.
        feedback: 7,600 is a plain nn.RNN of these sizes. An LSTM has four such blocks, one per gate.
      - id: length-dependent
        text: The parameter count depends on the sequence length of 20.
        feedback: The same weights are used at every step, so the size of the layer does not depend on the length at all.
    correct: [correct-shapes]
    hints:
      - Which outputs does batch_first change?
      - "One block: hidden × input + hidden × hidden + two bias vectors. How many blocks in an LSTM?"
    solution: |
      `output` is (32, 20, 50); `h_n` and `c_n` are (1, 32, 50). Parameters: 4 × (5,000 + 2,500 + 50 + 50) =
