environment: |
  - **Runtime and libraries:** Python 3.12.3 with **PyTorch 2.15.0+cpu** (CPU only, no CUDA), from
    `practice/ai/requirements.txt`. Every printed tensor, loss, accuracy, gradient norm and timing in this
    lesson was produced by running the code on Linux in November 2026 with fixed seeds
    (`torch.manual_seed`, `torch.Generator().manual_seed`). Timings were measured with **2 threads**
    (`OMP_NUM_THREADS=2`) on a shared machine and are only a rough guide; your numbers will differ, and small
    floating-point differences between machines and PyTorch versions are normal.
  - **Primary sources:**
    - Ian Goodfellow, Yoshua Bengio and Aaron Courville, [*Deep Learning*](https://www.deeplearningbook.org),
      [chapter 10, Sequence Modeling](https://www.deeplearningbook.org/contents/rnn.html) (MIT Press, 2016):
      10.1-10.2 (unfolding, parameter sharing, back-propagation through time - "The runtime is O(τ) and cannot
      be reduced by parallelization because the forward propagation graph is inherently sequential"), 10.7
      (the challenge of long-term dependencies - gradients "tend to either vanish (most of the time) or explode
      (rarely, but with much damage to the optimization)"), 10.10 (LSTM and GRU, including the forget-gate bias
      of 1 reported by Jozefowicz et al., 2015) and 10.11.1 (clipping gradients). The original LSTM paper
      (Hochreiter and Schmidhuber, 1997) is described here through this chapter.
    - Razvan Pascanu, Tomas Mikolov and Yoshua Bengio, [On the difficulty of training recurrent neural
      networks](https://arxiv.org/abs/1211.5063) (ICML 2013) - exploding and vanishing gradients, and rescaling
      the gradient "when its norm is above a threshold".
    - Kyunghyun Cho et al., [Learning Phrase Representations using RNN Encoder-Decoder for Statistical
      Machine Translation](https://arxiv.org/abs/1406.1078) (EMNLP 2014) - the reset and update gates (the GRU).
    - Tomas Mikolov, Kai Chen, Greg Corrado and Jeffrey Dean, [Efficient Estimation of Word Representations in
      Vector Space](https://arxiv.org/abs/1301.3781) (2013) - CBOW and continuous skip-gram, and the
      vector("King") - vector("Man") + vector("Woman") example; and Mikolov et al., [Distributed
      Representations of Words and Phrases and their Compositionality](https://arxiv.org/abs/1310.4546)
      (NeurIPS 2013) - negative sampling and subsampling of frequent words.
    - Rico Sennrich, Barry Haddow and Alexandra Birch, [Neural Machine Translation of Rare Words with Subword
      Units](https://arxiv.org/abs/1508.07909) (ACL 2016) - byte pair encoding for words: "iteratively count
      all symbol pairs and replace each occurrence of the most frequent pair ('A', 'B') with a new symbol
      'AB'".
    - PyTorch 2.15 documentation: [nn.RNN](https://docs.pytorch.org/docs/2.15/generated/torch.nn.RNN.html),
      [nn.LSTM](https://docs.pytorch.org/docs/2.15/generated/torch.nn.LSTM.html) (the gate equations and the
      `(W_ii|W_if|W_ig|W_io)` weight layout), [nn.GRU](https://docs.pytorch.org/docs/2.15/generated/torch.nn.GRU.html),
      [nn.Embedding](https://docs.pytorch.org/docs/2.15/generated/torch.nn.Embedding.html) (`padding_idx`),
      [pack_padded_sequence](https://docs.pytorch.org/docs/2.15/generated/torch.nn.utils.rnn.pack_padded_sequence.html),
      [pad_sequence](https://docs.pytorch.org/docs/2.15/generated/torch.nn.utils.rnn.pad_sequence.html) and
      [clip_grad_norm_](https://docs.pytorch.org/docs/2.15/generated/torch.nn.utils.clip_grad_norm_.html).
  - **Fictional and synthetic:** SandPay, its support tickets and every corpus and sequence in the lesson. The
    tickets are short sentences written for the lesson; the word2vec corpus is 3,000 sentences generated from
    five templates with a fixed seed; the "memory" task is random token sequences whose label depends only on
    the first token. They are small on purpose, so every run takes seconds on a CPU.
  - **Builds on:** layers, losses and backpropagation from [Neural networks and
    backpropagation](#/lesson/neural-networks-and-backprop), tensors, autograd and training loops from [PyTorch
    fundamentals](#/lesson/pytorch-fundamentals), and initialisation and diagnosing training from [Training
    deep networks well](#/lesson/training-deep-networks). Self-attention, which replaced recurrence in most of
    these models, is the next lesson: [Attention and transformers](#/lesson/attention-and-transformers).

prerequisites:
  - neural-networks-and-backprop
  - pytorch-fundamentals
  - training-deep-networks

concepts:
  - id: text-tokens-and-padding
    name: Tokens, vocabularies, padding and subwords
    summary: A model sees integers, not text. Tokenisation splits text into tokens; a vocabulary maps each token to an id, with reserved ids for padding and for unknown tokens (UNK). Sequences of different lengths are right-padded into one rectangular batch, and a mask (or the lengths) records which positions are real - computed from the lengths, never by comparing ids with the pad id. Word vocabularies cannot cover new words; byte pair encoding learns frequent character sequences by repeatedly merging the most frequent adjacent pair, so any word can be built from subwords.
  - id: word-embeddings
    name: Word embeddings and how they are learned
    summary: An embedding layer is a learned table with one dense vector per token id - mathematically the one-hot vector times a weight matrix, computed as a row lookup. Vectors are trained with the rest of the model, or in advance with word2vec, whose skip-gram objective predicts the words around each word; words used in similar contexts end up with similar vectors (high cosine similarity). padding_idx keeps the padding vector at zeros and out of the gradient.
  - id: recurrent-networks-and-bptt
    name: Recurrent networks, backpropagation through time and unstable gradients
    summary: An RNN reads a sequence one step at a time, updating a hidden state h_t = tanh(x_t W_ih^T + b_ih + h_(t-1) W_hh^T + b_hh) with the same weights at every step, so it handles any length with a fixed number of parameters. Training unrolls the loop and backpropagates through every step (BPTT); the gradient reaching an early step is a product of one Jacobian per step, so it usually shrinks exponentially (vanishing) and sometimes grows exponentially (exploding). Clipping the global gradient norm stops explosions; it does nothing for vanishing gradients.
  - id: gated-rnns-and-their-limits
    name: LSTM and GRU gates, variable lengths and the limits of recurrence
    summary: LSTMs and GRUs add sigmoid gates that decide what to keep, write and output, and an additively updated state (the LSTM cell c_t = f_t ⊙ c_(t-1) + i_t ⊙ g_t), so information and gradients can survive many steps when the forget gate stays near 1 - a positive forget-gate bias helps them learn long dependencies. Padded batches must be packed (or masked) so the final state comes from each sequence's last real token. Recurrence remains strictly sequential (time grows with length and cannot be parallelised across steps) and squeezes the whole past into one fixed-size vector - the limitations that attention removed.

objectives:
  - Turn raw text into padded id tensors - tokenise, build a vocabulary with PAD and UNK, encode, pad, and build a mask from the lengths - and explain what goes wrong when the mask is derived from the pad value.
  - Learn byte-pair-encoding merges from word frequencies and segment an unseen word into subwords by hand and in code.
  - Explain an embedding layer as one-hot times a weight matrix, count its parameters, and describe how skip-gram with negative sampling makes words that share contexts end up with similar vectors.
  - Write the Elman RNN recurrence as a loop that matches nn.RNN, state the shapes of nn.RNN, nn.GRU and nn.LSTM inputs, outputs and weights, and count their parameters.
  - Measure how the gradient of the final state with respect to each input step decays through time, explain the decay as a product of Jacobians, and use clip_grad_norm_ correctly against exploding gradients.
  - Write the LSTM and GRU update equations, explain why the forget gate and the additive cell update let information last, and use pack_padded_sequence so predictions do not depend on padding.
  - Explain, with numbers, why recurrent models were hard to scale - sequential computation and a fixed-size state - and what attention changes.

sections:
  - id: intuition
    kind: intuition
    concepts: [text-tokens-and-padding, word-embeddings, recurrent-networks-and-bptt]
    title: The idea in plain language
    body: |
      SandPay's support team gets thousands of tickets a day: "Refund failed for order 1042.", "Chargeback
      opened, customer furious!". They want a model that routes each ticket - refunds to one queue, disputes to
      another - and that understands that "refund **not** received" is not the same as "refund received".

      Three problems stand in the way, and this lesson solves them in order:

      1. **Networks eat numbers, not words.** We cut text into **tokens**, give every token an **id**, and
         pad short tickets so a batch is a rectangle - remembering which positions are padding.
      2. **An id is just a name.** Token 4 is not "close to" token 5. An **embedding** gives each token a
         learned vector, and training places words used in similar ways near each other - "refund" ends up
         near "reversal", far from "eur".
      3. **Order matters and length varies.** A **recurrent network** reads the vectors one at a time, like a
         person reading left to right, keeping a running summary - the **hidden state** - that it updates after
         every word with the same weights.

      Then the catch. Training a recurrent network sends the error signal **backwards through every step**,
      and on the way it is multiplied again and again. In this lesson's run, the gradient reaching the first of
      50 steps was about **10^14 times smaller** than the one reaching the last. The network could not learn
      that the first word mattered. **LSTM** and **GRU** cells add gates - learned "keep / overwrite" switches -
      that let information survive, and on a task that needs the first of 30-40 tokens, an LSTM with the right
      initial forget-gate bias reached 100% test accuracy where a plain RNN stayed at a coin flip.

      Even gated RNNs read one step after another, and that is why the next lesson's **attention** took over.

  - id: what
    kind: what
    concepts:
      [text-tokens-and-padding, word-embeddings, recurrent-networks-and-bptt, gated-rnns-and-their-limits]
    title: Terms you need
    body: |
      | Term | Meaning |
      | --- | --- |
      | **Token** | One unit of text the model sees - a word, a punctuation mark, or a subword such as `refun`. |
      | **Vocabulary** | The mapping from token to integer **id**. Fixed after it is built from training text. |
      | **PAD, UNK** | Reserved ids: PAD fills the empty positions of short sequences; UNK stands for any token not in the vocabulary (out-of-vocabulary, OOV). |
      | **Mask / lengths** | Which positions of a padded batch are real. A boolean tensor (True = real) or one length per sequence. |
      | **Subword, BPE** | Pieces smaller than words, learned from data. Byte pair encoding merges the most frequent adjacent pair again and again. |
      | **Embedding** | A learned dense vector per token id - a row of the matrix in `nn.Embedding(num_embeddings, embedding_dim)`. |
      | **word2vec, skip-gram** | Learning embeddings by predicting the words around each word (Mikolov et al., 2013). |
      | **Sequence length L (or T, τ)** | The number of time steps; **batch size N (or B)**; **features H_in**; **hidden size H**. |
      | **Hidden state h_t** | The RNN's running summary after step t; `h_n` is the state after the last step. |
      | **BPTT** | Back-propagation through time: backpropagation through the loop unrolled over every step. |
      | **Vanishing / exploding gradients** | Gradients that shrink or grow exponentially with the number of steps they travel back. |
      | **Gradient clipping** | Rescaling gradients whose norm is above a threshold, before the optimiser step. |
      | **LSTM** | Long short-term memory: a recurrent cell with input, forget and output gates and a separate **cell state** c_t. |
      | **GRU** | Gated recurrent unit (Cho et al., 2014): reset and update gates, no separate cell state. |
      | **Packed sequence** | PyTorch's format for a batch of variable-length sequences, so recurrent layers skip the padding. |

      PyTorch shape conventions you will meet all lesson: recurrent layers take `(L, N, H_in)` by default, or
      `(N, L, H_in)` with `batch_first=True`; the returned `h_n` is **always** `(num_layers × directions, N, H)`
      - `batch_first` does not apply to hidden or cell states.

  - id: why
    kind: why
    concepts: [recurrent-networks-and-bptt, text-tokens-and-padding]
    title: Why not just feed the words to an ordinary network?
    body: |
      Two simpler ideas, and where they break:

      - **Bag of words** - count each vocabulary word in the ticket and feed the counts to a classifier. It
        works surprisingly often, but it throws away order: "refund received, no chargeback" and "chargeback
        received, no refund" have **identical** counts.
      - **A fixed window into an MLP** - concatenate the vectors of the first 50 tokens. Now order is kept, but
        the network learns "refund at position 3" and "refund at position 17" with **separate weights**; a
        pattern learned in one place does not transfer to another, and tickets longer than 50 tokens are cut.

      A recurrent network applies **the same function with the same weights at every position** (Goodfellow et
      al. 10.1 call this parameter sharing across time). It learns "what does *refund* do to my summary" once,
      wherever the word appears, and it runs for as many steps as the sequence has. That is the idea; the rest of
      the lesson is about getting text into it and making it trainable.

  - id: tokens-and-vocab
    kind: internals
    concepts: [text-tokens-and-padding]
    title: From text to ids - tokenise, build a vocabulary, encode
    body: |
      The practice project's `tokens.py` uses the simplest useful tokeniser: lower-case, then the regular
      expression `\w+|[^\w\s]` - a run of letters, digits or underscores is a word token, and every other
      non-space character is a token on its own.

      ```python
      tokenize("Refund of EUR 12.50 failed!")
      # ['refund', 'of', 'eur', '12', '.', '50', 'failed', '!']
      ```

      A vocabulary assigns ids. Conventions used here (and by many libraries): **PAD = 0**, **UNK = 1**, then
      tokens from most to least frequent, ties alphabetical, so the ids are reproducible. Built from four
      synthetic SandPay tickets, it has 17 entries (real output):

      ```python
      train = ["Refund failed for order 1042.", "Refund pending, customer asked again!",
               "Chargeback opened for order 1042.", "Customer asked for a refund."]
      vocab = build_vocab(train)
      # {'<pad>': 0, '<unk>': 1, '.': 2, 'for': 3, 'refund': 4, '1042': 5, 'asked': 6, 'customer': 7,
      #  'order': 8, '!': 9, ',': 10, 'a': 11, 'again': 12, 'chargeback': 13, 'failed': 14, 'opened': 15,
      #  'pending': 16}
      encode("Customer refunded twice!", vocab)
      # [7, 1, 1, 9]
      ```

      "refunded" and "twice" never appeared in training, so both became UNK (1). Two consequences:

      - The model sees **"refunded" and "twice" as the same token**. Every unseen word collapses into one id; a
        word vocabulary can never cover names, typos, new product words or order numbers.
      - Frequency limits (`min_freq`, `max_size`) trade vocabulary size - and the size of the embedding table -
        against how much text becomes UNK. Measure the UNK rate on validation text, not only on training text,
        where it is zero by construction.

      Real tokenisers (for example those shipped with pretrained language models) normalise Unicode, handle
      numbers and whitespace carefully and use subwords - the next sections. The **contract** stays the same:
      the vocabulary is fitted on training data only, and the same tokeniser and vocabulary must be used at
      training and at prediction time.

  - id: padding-and-masks
    kind: code
    concepts: [text-tokens-and-padding]
    title: Padding a batch, and the mask that remembers what was padding
    body: |
      Tensors are rectangles; tickets are not. `pad_batch` right-pads with the PAD id and returns a mask and the
      lengths (real output, using the vocabulary above):

      ```python
      ids, mask, lengths = pad_batch([encode(t, vocab) for t in
                                      ["Refund failed.", "Customer asked for a refund.", "Chargeback!"]])
      ```

      ```plaintext
      tensor([[ 4, 14,  2,  0,  0,  0],
              [ 7,  6,  3, 11,  4,  2],
              [13,  9,  0,  0,  0,  0]])
      tensor([[ True,  True,  True, False, False, False],
              [ True,  True,  True,  True,  True,  True],
              [ True,  True, False, False, False, False]])
      tensor([3, 6, 2])
      ```

      The heart of the solution is two lines:

      ```python
      lengths = torch.tensor([len(s) for s in trimmed], dtype=torch.long)
      mask = torch.arange(width)[None, :] < lengths[:, None]   # (1, T) < (B, 1) -> (B, T)
      ```

      The mask is computed **from the lengths**, by broadcasting position numbers against lengths. The tempting
      shortcut `mask = ids != pad_id` is wrong whenever a real token can have the pad's id - for example when
      someone pads with 0 but id 0 is also a real token in another vocabulary, or when `pad_id` is changed and
      the shortcut still says `!= 0`. The exercise's first draft has exactly that bug.

      Everything downstream uses the mask or the lengths: averaging token vectors only over real positions,
      ignoring padding in a loss, packing sequences for an RNN (later in this lesson) and, in the next lesson,
      stopping attention from looking at padding. PyTorch also ships
      [`pad_sequence`](https://docs.pytorch.org/docs/2.15/generated/torch.nn.utils.rnn.pad_sequence.html),
      which pads a list of tensors but does not return lengths or a mask - keep the lengths yourself.

      Truncation (`max_len`) caps cost and memory for very long inputs; it silently drops the end of the text,
      so log how often it happens.

  - id: subwords-bpe
    kind: internals
    concepts: [text-tokens-and-padding]
    title: Subwords with byte pair encoding
    body: |
      Sennrich, Haddow and Birch (2016) adapted a compression algorithm to words: start from characters and
      "iteratively count all symbol pairs and replace each occurrence of the most frequent pair ('A', 'B') with a
      new symbol 'AB'". Frequent words become single symbols; rare words are spelled with frequent pieces; no
      word is ever unknown, because single characters are always available.

      The algorithm, as `learn_bpe` implements it:

      1. Write every training word as its characters plus an end-of-word marker `</w>`, with its frequency:
         `refund` (40) → `r e f u n d </w>`.
      2. Count every **adjacent pair** of symbols, each word's pairs weighted by its frequency.
      3. Merge the most frequent pair everywhere (ties: the alphabetically smallest pair) and record the merge.
      4. Repeat for the chosen number of merges; the merges, **in order**, are the learned tokeniser.

      To segment a word, start from its characters and apply the merges in the order learned. On a synthetic
      word-frequency list of SandPay terms (refund 40, payment 45, card 50, charge 30, chargeback 15, ...), 20
      merges gave (real output):

      ```plaintext
      [('a', 'r'), ('d', '</w>'), ('ar', 'g'), ('arg', 'e'), ('c', 'h'), ('ch', 'arge'), ('a', 'y'),
       ('ay', 'm'), ('aym', 'e'), ('ayme', 'n'), ('aymen', 't'), ('e', 'f'), ('ef', 'u'), ('efu', 'n'),
       ('p', 'ayment'), ('r', 'efun'), ('s', '</w>'), ('c', 'ar'), ('car', 'd</w>'), ('payment', '</w>')]
      refunds     ['refun', 'd', 's</w>']
      chargebacks ['charge', 'b', 'a', 'c', 'k', 's</w>']
      recharged   ['r', 'e', 'charge', 'd</w>']
      prepayment  ['p', 'r', 'e', 'payment</w>']
      cardholder  ['car', 'd', 'h', 'o', 'l', 'd', 'e', 'r', '</w>']
      ```

      "recharged", "prepayment" and "cardholder" were never in the list, yet each is built from learned pieces
      (`charge`, `payment</w>`, `car`) plus single characters. With more merges, more of each word becomes one
      symbol. The `</w>` marker lets the model tell `d</w>` (a word ending in d) from `d` inside a word.

      What changes in practice: the vocabulary size is now the number of merges plus the characters - a dial you
      choose - and sequences get **longer** (one word can be several tokens), which matters for the sequential
      models below and for the cost of attention in the next lesson. Production tokenisers vary the idea (byte
      level instead of characters, different pre-splitting); check the documentation of the tokeniser you use.

  - id: embeddings
    kind: internals
    concepts: [word-embeddings]
    title: Embeddings - a lookup table that learns
    body: |
      The naive way to feed id 4 to a network is a **one-hot** vector: length = vocabulary size, a 1 at position
      4, zeros elsewhere. Multiplying a one-hot row by a weight matrix W (vocabulary × d) just **selects row 4
      of W**. `nn.Embedding` is that product without building the one-hot vectors: "a simple lookup table that
      stores embeddings of a fixed dictionary and size" (PyTorch docs). Real output:

      ```python
      torch.manual_seed(0)
      emb = nn.Embedding(6, 3, padding_idx=0)
      ids = torch.tensor([[4, 2, 0]])
      out = emb(ids)                                      # shape (1, 3, 3): one 3-vector per id
      one_hot = F.one_hot(ids, num_classes=6).float()     # shape (1, 3, 6)
      torch.allclose(one_hot @ emb.weight, out)           # True
      ```

      ```plaintext
      weight:                       out (rows 4, 2, 0):
      [[ 0.0000,  0.0000,  0.0000], [[ 1.3890,  1.5860,  0.9460],
       [ 0.7940,  0.5990, -1.5550],  [-0.3410,  1.8530,  0.4680],
       [-0.3410,  1.8530,  0.4680],  [ 0.0000,  0.0000,  0.0000]]
       [-0.1580, -0.1730,  0.1830],
       [ 1.3890,  1.5860,  0.9460],
       [-0.8440,  0.9320,  1.2590]]
      ```

      After `out.sum().backward()`, the gradient of the weight is 1 in rows 2 and 4 and **zero in row 0**:
      with `padding_idx=0`, "the entries at padding_idx do not contribute to the gradient" and the vector
      starts as zeros (PyTorch docs). Only the rows of tokens in the batch get gradient at all - an embedding
      table is updated sparsely.

      Facts worth knowing:

      - **Parameters = vocabulary × dimension.** `nn.Embedding(20000, 128)` has 2,560,000 parameters - often
        the largest layer of a small text model. Vocabulary size is a cost decision.
      - **The vectors start random** (`N(0, 1)` by default) and mean nothing until trained - either with the
        task (the classifier's loss shapes them) or in advance on lots of unlabelled text and then loaded.
      - **Similarity is measured with cosine similarity** (the dot product of length-normalised vectors), not
        with the ids.
      - **One vector per token, whatever the context**: "charge" in "charge the card" and "free of charge"
        get the same vector. Contextual representations - a different vector per occurrence - are what the
        attention layers of the next lesson produce.

  - id: word2vec
    kind: internals
    concepts: [word-embeddings]
    title: Learning embeddings from context - skip-gram with negative sampling
    body: |
      Mikolov et al. (2013) trained embeddings on unlabelled text with a deliberately simple task. The
      **continuous skip-gram** model "tries to maximize classification of a word based on another word in the
      same sentence": for each word, predict the words within a window around it. CBOW does the reverse.
      Words that appear in similar contexts must predict similar neighbours, so they are pushed towards similar
      vectors - the distributional idea. Their follow-up paper replaced the expensive softmax over the whole
      vocabulary with **negative sampling**: for each real (word, context) pair, also draw k random "noise"
      words and train a logistic classifier to tell the real context from the noise.

      A tiny version, written for this lesson, on a synthetic corpus of 3,000 SandPay sentences from five
      templates ("the {who} asked for a {action} on the {method} payment", ...) with three interchangeable words
      per slot (`refund/chargeback/reversal`, `card/wallet/transfer`, `eur/usd/gbp`,
      `customer/merchant/cardholder`). Two embedding tables (centre and context), dimension 16, window 2, k = 5
      negatives drawn from the unigram counts raised to the 3/4 power (the noise distribution the paper found
      best), Adam, 5 epochs:

      ```python
      def forward(self, centre, context, negatives):
          c = self.inp(centre)                                       # (B, d)
          pos = (c * self.out(context)).sum(-1)                      # score of the real pair
          neg = torch.bmm(self.out(negatives), c.unsqueeze(2)).squeeze(2)   # (B, k) noise scores
          return -(F.logsigmoid(pos).mean() + F.logsigmoid(-neg).sum(1).mean())
      ```

      Real output (77,928 training pairs, 1.9 s with 2 threads):

      ```plaintext
      epoch 0 loss 2.838
      epoch 4 loss 1.852
      refund [('chargeback', 1.0), ('reversal', 1.0), ('a', 0.55)]
      card [('wallet', 1.0), ('transfer', 1.0), ('approved', 0.53)]
      eur [('usd', 1.0), ('gbp', 1.0), ('approved', 0.57)]
      merchant [('customer', 1.0), ('cardholder', 1.0), ('declined', 0.49)]
      cos(refund, eur) 0.28
      ```

      Nobody told the model that refund and chargeback are related; it learned it because they occur in the
      same contexts. In this synthetic corpus the words of a slot have **exactly** the same contexts, so their
      cosine similarity rounds to 1.0; on real text the neighbours are noisier but the effect is the same. It
      is also the limitation: "refund" and "chargeback" are close because they are **used** alike, even though
      for SandPay's routing they mean different things - and antonyms often share contexts too. Mikolov et al.
      also report vector offsets capturing relations, such as vector("King") - vector("Man") +
      vector("Woman") being closest to vector("Queen") on their large corpus; a toy corpus like this one is far
      too small to show that.

  - id: visual-unrolled
    kind: visual
    concepts: [recurrent-networks-and-bptt]
    title: An RNN unrolled through time
    body: |
      ```mermaid
      flowchart LR
        h0["h0 (zeros)"] --> C1
        x1["x1 = embed('refund')"] --> C1["cell: same W_ih, W_hh"]
        C1 -- h1 --> C2["cell: same W_ih, W_hh"]
        x2["x2 = embed('not')"] --> C2
        C2 -- h2 --> C3["cell: same W_ih, W_hh"]
        x3["x3 = embed('received')"] --> C3
        C3 -- "h3 = h_n" --> Y["linear head -> logits"]
        Y -. "loss gradient flows back through h3, h2, h1" .-> C1
      ```

      Notice two things. Every box is the **same** cell with the same weights - the loop drawn out once per
      step, which is why the model works for any length. And the gradient for x1 has to travel back through
      **every** later cell; each one multiplies it by its own Jacobian. That chain is where the trouble starts.

  - id: rnn-recurrence
    kind: code
    concepts: [recurrent-networks-and-bptt]
    title: The recurrence by hand, checked against nn.RNN
    body: |
      PyTorch's `nn.RNN` documentation gives the Elman RNN update for each step:
      h_t = tanh(x_t W_ih^T + b_ih + h_(t-1) W_hh^T + b_hh). As a loop over time (the exercise's
      `rnn_forward`, inputs shaped `(L, N, H_in)`):

      ```python
      def rnn_forward(x, h0, W_ih, W_hh, b_ih, b_hh):
          h = h0
          outputs = []
          for t in range(x.shape[0]):                      # one step at a time - no way around it
              h = torch.tanh(x[t] @ W_ih.T + b_ih + h @ W_hh.T + b_hh)
              outputs.append(h)
          return torch.stack(outputs), h                   # (L, N, H) and (N, H)
      ```

      Compared with `nn.RNN(input_size=3, hidden_size=4)` on 5 steps of a batch of 2 (real output):

      ```plaintext
      shapes (5, 2, 4) (2, 4) (5, 2, 4) (1, 2, 4)
      max abs difference 5.960464477539063e-08
      [('weight_ih_l0', (4, 3)), ('weight_hh_l0', (4, 4)), ('bias_ih_l0', (4,)), ('bias_hh_l0', (4,))]
      ```

      The difference is float32 rounding. Note the shapes: `output` holds **every** step's hidden state
      `(L, N, H)`; `h_n` holds only the last, with a leading `num_layers × directions` axis (1 here). For a
      one-layer, one-direction RNN without padding, `output[-1]` equals `h_n[0]`.

      Parameter counts, from `sum(p.numel() for p in m.parameters())` with input 32 and hidden 64 (real
      output):

      ```plaintext
      RNN 6272 (64, 64)
      GRU 18816 (192, 64)
      LSTM 25088 (256, 64)
      ```

      An RNN layer has H·H_in + H·H + 2H parameters (PyTorch keeps two bias vectors). A GRU stacks 3 such blocks
      (its `weight_hh_l0` is 3H × H) and an LSTM 4 (4H × H) - one per gate - so they are 3 and 4 times the size.
      None of these numbers depends on the sequence length.

  - id: bptt-and-gradients
    kind: internals
    concepts: [recurrent-networks-and-bptt]
    title: Backpropagation through time, and why gradients vanish
    body: |
      Training differentiates the unrolled loop like any other graph: a forward pass over all L steps, storing
      every h_t, then a backward pass from the last step to the first. Goodfellow et al. (10.2): "The runtime
      is O(τ) and cannot be reduced by parallelization because the forward propagation graph is inherently
      sequential ... the memory cost is also O(τ)."

      The gradient of the final state with respect to an early state is a **product** of one Jacobian per step:

      ```plaintext
      ∂h_L/∂h_t = ∂h_L/∂h_(L-1) · ∂h_(L-1)/∂h_(L-2) · ... · ∂h_(t+1)/∂h_t
      each factor = diag(1 - h_k²) · W_hh          (tanh' ≤ 1)
      ```

      Multiply L - t such matrices and the size of the result behaves roughly like a number raised to the power
      L - t: if the factors shrink vectors, the product shrinks **exponentially**; if they stretch them, it
      grows exponentially. Goodfellow et al. (10.7): gradients "tend to either vanish (most of the time) or
      explode (rarely, but with much damage to the optimization)".

      Measured: `input_gradient_norms` (an exercise function) backpropagates the sum of the final hidden state
      to the input and reports the gradient norm for each step. Freshly initialised layers, 50 steps, hidden
      size 32 (real output, steps 0, 10, 20, 30, 40, 49):

      ```plaintext
      RNN  ['3.4e-14', '1.6e-11', '1.0e-08', '6.8e-06', '3.4e-03', '1.8e+00']
      GRU  ['1.5e-11', '2.4e-09', '2.7e-07', '3.7e-05', '6.4e-03', '7.5e-01']
      LSTM ['1.1e-11', '1.3e-09', '1.6e-07', '1.5e-05', '1.9e-03', '3.5e-01']
      ```

      Read across a row: every 10 steps back, the RNN's gradient drops by about a factor of 1,000. The first
      token's influence on the loss is 13 orders of magnitude below the last token's - in float32, it is noise.
      Whatever weight update depends on the first token, gradient descent will not find it.

      The surprise is the second and third rows: **freshly initialised GRUs and LSTMs vanish too.** Gates help
      only when they are open: at initialisation a forget gate outputs about σ(0) = 0.5, which halves the cell
      state's contribution at every step. The architecture makes long memory **possible**; training (or a good
      initialisation, below) has to make it happen.

  - id: exploding-and-clipping
    kind: code
    concepts: [recurrent-networks-and-bptt]
    title: Exploding gradients and clipping the norm
    body: |
      The other direction: the same 50-step input through an RNN with ReLU and the recurrent weights multiplied
      by 3. One backward pass, then `clip_grad_norm_` (real output):

      ```python
      m = nn.RNN(8, 32, nonlinearity="relu")
      with torch.no_grad():
          m.weight_hh_l0.mul_(3.0)
      out, h = m(x)
      h[-1].sum().backward()
      total = nn.utils.clip_grad_norm_(m.parameters(), max_norm=1.0)
      ```

      ```plaintext
      norm before clipping 2.029e+06
      norm after clipping 1.0
      ```

      One update with a gradient of norm two million would throw the weights far away - Goodfellow et al.
      (figure 10.17) show gradient descent hitting a steep "cliff" in the loss surface, where "the large gradient
      catastrophically propels the parameters" far away. Pascanu et al. (2013) proposed rescaling the gradient "when its norm is above a threshold"; that
      is exactly `clip_grad_norm_`: it computes one norm over **all** parameters' gradients together, scales
      them all down in place by the same factor if it exceeds `max_norm`, and returns the norm **before**
      clipping (log it - a rising value is an early warning).

      The order in a training step matters:

      ```python
      optimiser.zero_grad()
      loss = loss_fn(model(ids, lengths), labels)
      loss.backward()                                         # 1. gradients exist now
      nn.utils.clip_grad_norm_(model.parameters(), 1.0)       # 2. clip them
      optimiser.step()                                        # 3. use the clipped gradients
      ```

      Clipping before `backward()` clips the old (zeroed) gradients; clipping after `step()` changes nothing that
      matters. And clipping fixes only **explosions** - it cannot make a 10^-14 gradient larger. Vanishing
      gradients need a different architecture.

  - id: lstm-gru
    kind: internals
    concepts: [gated-rnns-and-their-limits]
    title: LSTM and GRU - gates that decide what to keep
    body: |
      The LSTM (Hochreiter and Schmidhuber, 1997; Goodfellow et al. 10.10.1) keeps a second state, the **cell
      state** c_t, and controls it with gates - sigmoid outputs between 0 and 1 that multiply other values
      element by element. The equations in PyTorch's `nn.LSTM` documentation:

      ```plaintext
      i_t = σ(W_ii x_t + b_ii + W_hi h_(t-1) + b_hi)      input gate:  how much new content to write
      f_t = σ(W_if x_t + b_if + W_hf h_(t-1) + b_hf)      forget gate: how much old cell state to keep
      g_t = tanh(W_ig x_t + b_ig + W_hg h_(t-1) + b_hg)   candidate content
      o_t = σ(W_io x_t + b_io + W_ho h_(t-1) + b_ho)      output gate: how much of the cell to show
      c_t = f_t ⊙ c_(t-1) + i_t ⊙ g_t
      h_t = o_t ⊙ tanh(c_t)
      ```

      The key line is c_t = f_t ⊙ c_(t-1) + i_t ⊙ g_t. The cell is updated by **addition**, and the factor on
      the old cell is the forget gate itself - no weight matrix, no squashing. When f_t is close to 1, c_t
      carries its content (and the gradient flows back) almost unchanged across many steps; the network
      **learns** when to keep and when to forget. Greff et al. (2015), as summarised by Goodfellow et al.,
      found the forget gate to be the crucial ingredient.

      The GRU (Cho et al., 2014) merges the states into one and uses two gates (PyTorch's `nn.GRU` form):

      ```plaintext
      r_t = σ(W_ir x_t + b_ir + W_hr h_(t-1) + b_hr)          reset gate
      z_t = σ(W_iz x_t + b_iz + W_hz h_(t-1) + b_hz)          update gate
      n_t = tanh(W_in x_t + b_in + r_t ⊙ (W_hn h_(t-1) + b_hn))
      h_t = (1 - z_t) ⊙ n_t + z_t ⊙ h_(t-1)
      ```

      With z_t near 1 the GRU copies its state forward - the same "leaky" path. It has 3 blocks of weights
      instead of 4, so it is about 25% smaller than an LSTM of the same hidden size. Neither consistently beats
      the other; Goodfellow et al. (10.10.2) report studies that found no variant "that would clearly beat both
      of these across a wide range of tasks".

      PyTorch's LSTM returns `output, (h_n, c_n)` - a tuple for the states - while RNN and GRU return
      `output, h_n`. The weights are stored stacked by gate, `weight_ih_l0 = (W_ii|W_if|W_ig|W_io)` of shape
      (4H, H_in), so the forget-gate bias is the slice `bias_ih_l0[H:2H]`.

  - id: forget-bias-experiment
    kind: example
    concepts: [gated-rnns-and-their-limits, recurrent-networks-and-bptt]
    title: "Experiment: a task that needs memory"
    body: |
      Goodfellow et al. (10.10.2) note that Jozefowicz et al. (2015) found "adding a bias of 1 to the LSTM
      forget gate ... makes the LSTM as strong as the best of the explored architectural variants". The
      gradient measurement from before, with the forget-gate bias slice set to 3 instead of its random
      initial value:

      ```python
      with torch.no_grad():
          m.bias_ih_l0[H:2 * H].fill_(3.0)     # σ(3) ≈ 0.95: keep most of the cell at every step
      ```

      ```plaintext
      LSTM forget bias +3 ['1.8e-01', '1.2e-01', '8.3e-02', '5.9e-02', '5.6e-02', '3.6e-01']
      ```

      The gradient at step 0 went from 1.1e-11 to 0.18 - comparable to the last step's.

      Does that matter for learning? A synthetic task: sequences of random token ids 2-19; the label is 1 when
      the **first** token is below 11. Everything after the first token is noise, so the model must carry one
      fact to the end. Embedding (8) → recurrent layer (hidden 16) → linear, packed sequences, full-batch Adam
      (lr 0.01) with clipping at 1.0, 2,000 training sequences, 120 epochs, accuracy on 1,000 new sequences
      (real output; times with 2 threads, a rough guide):

      ```plaintext
      lengths 5-12  RNN:                loss 0.709 -> 0.301, test accuracy 0.668, 3.7 s
      lengths 5-12  LSTM:               loss 0.695 -> 0.000, test accuracy 1.000, 3.5 s
      lengths 5-12  LSTM forget bias 3: loss 0.695 -> 0.000, test accuracy 1.000, 3.6 s
      lengths 30-40 RNN:                loss 0.716 -> 0.420, test accuracy 0.502, 7.7 s
      lengths 30-40 LSTM:               loss 0.696 -> 0.252, test accuracy 0.510, 26.8 s
      lengths 30-40 LSTM forget bias 3: loss 0.707 -> 0.000, test accuracy 1.000, 29.2 s
      ```

      What to read from it:

      - On short sequences the LSTM solves the task; the plain RNN only partly.
      - On 30-40 tokens the plain RNN and the default LSTM are at **chance** on new data (0.50, 0.51). The
        default LSTM's training loss still fell to 0.252: it **memorised** training sequences through their
        later tokens - overfitting, not learning the rule. Always check held-out data.
      - The same LSTM with forget bias 3 learns the rule perfectly. The architecture was capable all along; the
        initialisation decided whether the gradient could reach the first token.
      - Length changes the cost too: the 30-40 runs took two to eight times longer than the 5-12 runs. More
        steps means more sequential work.

  - id: packing
    kind: code
    concepts: [gated-rnns-and-their-limits, text-tokens-and-padding]
    title: Variable lengths - packing so padding cannot change the answer
    body: |
      The exercise's first draft of `LSTMClassifier.forward` looks reasonable:

      ```python
      embedded = self.embedding(ids)          # (B, T, E)
      output, _ = self.lstm(embedded)         # (B, T, H)
      return self.head(output[:, -1])         # the "last" step
      ```

      For a ticket shorter than the batch's longest, the last column is **padding**. The LSTM keeps running over
      the padding and changes its state. The same 3-token ticket, scored alone and in a batch with a 15-token
      ticket, identical weights, model in eval mode (real output):

      ```plaintext
      draft  alone [0.2047, 0.0915] in a batch [0.093, 0.0494]
      packed alone [0.2047, 0.0915] in a batch [0.2047, 0.0915]
      ```

      A ticket's prediction depends on **what else is in its batch** - a bug that passes shape tests, trains
      fine, and makes evaluation numbers change with the batch size. The fix packs the batch so the LSTM
      processes each sequence only up to its own length, and uses `h_n`, which then holds each sequence's
      state after its **last real token**:

      ```python
      packed = pack_padded_sequence(embedded, lengths.cpu(), batch_first=True, enforce_sorted=False)
      _, (h_n, _) = self.lstm(packed)
      return self.head(h_n[-1])               # last layer's final state, (B, H)
      ```

      Details from the PyTorch documentation: `lengths` must be on the CPU if it is a tensor;
      `enforce_sorted=False` lets you pass sequences in any order (sorting by decreasing length "is only
      necessary for ONNX export"); `pad_packed_sequence` turns a packed `output` back into a padded tensor if you
      need every step. Alternatives that are also correct: gather `output` at index `lengths - 1` for each row,
      or pool over steps using the mask. `padding_idx` on the embedding is still worth setting - it keeps the PAD
      vector at zero for anything that does read padding positions - but it does **not** stop an RNN from
      updating its state on padding.

  - id: limits
    kind: tradeoffs
    concepts: [gated-rnns-and-their-limits]
    title: Why recurrent models struggled - and what replaced them
    body: |
      Gated RNNs were the standard sequence models for years (Goodfellow et al. 10.10 call them "the most
      effective sequence models used in practical applications" as of 2016). Three limitations remained:

      1. **Sequential computation.** Step t needs h_(t-1). Within one sequence nothing can run in parallel
         across time, so time grows with length. One LSTM layer (batch 32, hidden 128) on this machine, 2
         threads (real output, a rough guide):

         ```plaintext
         50  8.8 ms
         100 10.8 ms
         200 21.3 ms
         400 41.8 ms
         ```

         Doubling the length roughly doubles the time. GPUs are fast at large parallel matrix products; a
         chain of hundreds of small dependent steps wastes most of that.
      2. **A fixed-size bottleneck.** Everything the model knows about the first 400 tokens has to fit in one
         vector of H numbers when it reaches token 401. Gates decide what to keep, but they cannot keep
         everything.
      3. **Long paths for gradients and information.** Token 1 influences token 400 only through 399 steps.
         Gates make the path less lossy; they do not make it shorter. Even with a good forget bias, very long
         dependencies stay hard to learn.

      Attention attacks all three: every position can look directly at every other position through a learned,
      weighted average - a path of length one - and all positions are computed at once with matrix products.
      Its cost grows with the **square** of the length instead, which is why tokenisation (and BPE's longer
      sequences) still matters. That is the next lesson: [Attention and
      transformers](#/lesson/attention-and-transformers).

      Where recurrent models still make sense: streaming input processed one step at a time with constant
      memory per step (sensor data, on-device keyword spotting), small data sets and short sequences, and as a
      cheap baseline. Check against a simple bag-of-words model and a small transformer before committing.

  - id: steps
    kind: steps
    concepts: [text-tokens-and-padding, word-embeddings, gated-rnns-and-their-limits]
    title: Building a recurrent text classifier, step by step
    body: |
      1. **Split first** (train / validation / test), before building anything from the text, so the vocabulary
         and merges never see validation or test data.
      2. **Choose the tokeniser** - word-level for a quick baseline, subwords (BPE) when new words and typos
         are common. Fix its version; the same one must run at prediction time.
      3. **Build the vocabulary** on training text with PAD and UNK; measure the UNK rate on validation text.
      4. **Encode and pad** per batch; keep the **lengths** (and a mask from them). Decide `max_len` from the
         length distribution and log truncations.
      5. **Model:** `nn.Embedding(vocab, d, padding_idx=PAD)` → `nn.LSTM`/`nn.GRU` with `batch_first=True`
         on a **packed** batch → a linear head on `h_n[-1]`. Consider a positive forget-gate bias for long
         dependencies.
      6. **Train** with `CrossEntropyLoss`, `clip_grad_norm_` between `backward()` and `step()`, and log the
         returned pre-clip norm and the loss.
      7. **Check invariances**: a sequence's prediction must not change with its batch or its padding.
      8. **Evaluate on held-out data** against a bag-of-words baseline. A training loss near zero with chance
         validation accuracy is memorisation.
      9. **Save the tokeniser and vocabulary with the weights** - ids are meaningless without them.

  - id: tests
    kind: tests
    concepts: [text-tokens-and-padding, recurrent-networks-and-bptt, gated-rnns-and-their-limits]
    title: Testing sequence-model code
    body: |
      The practice tests are a template for checking any text pipeline or recurrent model:

      | Check | Input | Expected | Catches |
      | --- | --- | --- | --- |
      | Tokeniser known output | "Refund of EUR 12.50 failed!" | the 8 tokens shown above | regex or case bugs |
      | Vocabulary ordering | ties in frequency | PAD 0, UNK 1, then frequency, ties alphabetical | non-reproducible ids |
      | `max_size` | cap of 4 | exactly 4 entries including PAD and UNK | off-by-two caps |
      | Unknown words | a word not in training text | UNK id | `KeyError` at prediction time |
      | Mask from lengths | sequence containing the pad value as a real token | still masked as real | `ids != pad_id` masks |
      | Truncation | `max_len=3` | first 3 tokens kept, input lists unchanged | in-place edits, wrong end cut |
      | BPE hand example | {"low": 5, "lower": 2}, 2 merges | ('l','o'), ('lo','w') | unweighted counts, tie order |
      | Hand RNN vs library | same weights, float64 | `rnn_forward` equals `nn.RNN` outputs and weight gradients | transposed weights, wrong bias |
      | Vanishing gradients | recurrent weights × 0.1, 20 steps | first step's gradient < 1e-6 × last step's | measurement mistakes |
      | Padding invariance | short sequence alone vs beside a long one | identical logits (eval mode) | missing packing |
      | `padding_idx` | fresh model | PAD row is zeros | padding vector trained |
      | Learns a memory task | first-token task, 50 epochs | final loss < 0.1 and test accuracy > 0.75 | broken wiring, no learning |

      Habits: seed everything (`torch.manual_seed`), use float64 when comparing gradients, compare with
      `torch.testing.assert_close` rather than `==`, and test **behaviour** (invariances, loss falls below a
      bound) rather than exact numbers after training.

  - id: mistakes
    kind: mistakes
    concepts:
      [text-tokens-and-padding, word-embeddings, recurrent-networks-and-bptt, gated-rnns-and-their-limits]
    title: Common mistakes and how to debug them
    body: |
      - **Building the vocabulary on all the data.** Validation then has no UNKs and looks better than
        production will. Fit tokeniser and vocabulary on training text only.
      - **Mask from the pad value** (`ids != 0`): breaks when the pad id changes or a real token shares it.
        Build masks from lengths.
      - **Reading `output[:, -1]` on a padded batch.** Predictions change with batch composition (0.2047 alone,
        0.093 in a batch, above). Pack, or gather at `lengths - 1`.
      - **Forgetting `batch_first=True`**, or forgetting that it does not apply to `h_n`. With the default
        layout, a `(B, T, E)` tensor is read as T sequences of length B - it runs without an error. Print
        shapes at each layer once.
      - **`h_n` vs `h_n[-1]`.** `h_n` is `(layers × directions, B, H)`; the head wants `(B, H)`. With a
        two-layer LSTM, `h_n[0]` is the **first** layer.
      - **Unpacking an LSTM like an RNN.** `out, h = lstm(x)` gives `h = (h_n, c_n)`, a tuple.
      - **Clipping in the wrong place**, or not logging the norm `clip_grad_norm_` returns. Between
        `backward()` and `step()`.
      - **Expecting clipping to cure vanishing gradients.** It only shrinks. Measure per-step gradient norms
        (as `input_gradient_norms` does) and change the architecture or initialisation.
      - **Trusting a falling training loss.** On 30-40-token sequences a default LSTM reached loss 0.252 at
        51% test accuracy - memorisation.
      - **Reading cosine neighbours as meaning.** Embeddings encode usage; words with opposite meanings can be
        close.
      - **Loss turns into NaN.** Look at the pre-clip gradient norm history first: a jump of several orders of
        magnitude points at explosion. Then the learning rate, then inputs (an id out of range raises
        `IndexError` in `nn.Embedding`, which is easier to spot).

  - id: when
    kind: when
    concepts: [gated-rnns-and-their-limits, word-embeddings]
    title: When to use what
    body: |
      - **Bag of words / TF-IDF + a linear model** - first baseline for classification of short texts. Fast,
        explainable, often hard to beat on small data.
      - **Pretrained embeddings + a simple pooled model** (mean of the vectors over the mask) - when you have
        little labelled data and word order matters less.
      - **LSTM / GRU** - streaming or step-by-step input, modest lengths, small models, a stronger baseline
        that uses order.
      - **Transformers** - long texts, large data or pretrained models; the default for language today (next
        lesson). Recurrent models do **not** replace them for long-range dependencies.
      - **Subword tokenisers** - whenever new words, names, codes or typos are common, and always with
        pretrained models (use the tokeniser the model was trained with).

  - id: summary
    kind: summary
    concepts:
      [text-tokens-and-padding, word-embeddings, recurrent-networks-and-bptt, gated-rnns-and-their-limits]
    title: Quick reference
    body: |
      - Text → tokens → ids (PAD 0, UNK 1) → padded batch + **lengths** → mask from lengths.
      - BPE: merge the most frequent adjacent pair, repeat; segment by applying merges in order; no word is
        unknown.
      - `nn.Embedding(V, d)` = one-hot × W as a lookup; V·d parameters; `padding_idx` keeps PAD at zeros
        with no gradient. Skip-gram learns vectors from context; similar usage → high cosine similarity.
      - RNN: h_t = tanh(x_t W_ih^T + b_ih + h_(t-1) W_hh^T + b_hh), same weights at every step; RNN/GRU/LSTM
        have 1/3/4 weight blocks.
      - BPTT multiplies one Jacobian per step: gradients vanish (1e-14 at 50 steps here) or explode (2e6
        here). `clip_grad_norm_` after `backward()`, before `step()`; it does not fix vanishing.
      - LSTM: c_t = f_t ⊙ c_(t-1) + i_t ⊙ g_t; forget gate near 1 keeps memory; positive forget bias helps.
        GRU: h_t = (1 - z_t) ⊙ n_t + z_t ⊙ h_(t-1).
      - Pack padded batches (`enforce_sorted=False`, lengths on CPU) and use `h_n[-1]`.
      - Limits: sequential in time, fixed-size state, long gradient paths → attention.

exercises:
  - id: unk-collapse
    type: mcq
    concept: text-tokens-and-padding
    skill: application
    title: What the model sees for an unseen word
    prompt: |
      A word-level vocabulary was built from SandPay's training tickets with PAD = 0 and UNK = 1. It contains
      `customer` (7) and `!` (9) but not `refunded`, `twice` or `chargebacked`. What does
      `encode("Customer refunded twice!", vocab)` return, and what does it mean for the model?
    options:
      - id: unk-both
        text: "[7, 1, 1, 9] - both unseen words get the same id, so the model cannot tell them apart."
        feedback: Correct - every out-of-vocabulary token collapses into UNK; "refunded" and "twice" are indistinguishable inputs.
      - id: dropped
        text: "[7, 9] - unknown words are skipped."
        feedback: Dropping tokens would silently change the sequence and its length. This encoder maps them to the UNK id.
      - id: keyerror
        text: It raises KeyError, because "refunded" is not in the dictionary.
        feedback: That is what plain `vocab[token]` would do. A proper encoder uses `vocab.get(token, unk_id)`.
      - id: new-ids
        text: "[7, 17, 18, 9] - new words get the next free ids."
        feedback: The vocabulary is fixed after building it from training data; adding ids at prediction time would point at embedding rows that were never trained (or don't exist).
    correct: [unk-both]
    hints:
      - Is the vocabulary allowed to change after training?
      - What id is reserved for tokens it doesn't know?
    solution: |
      `[7, 1, 1, 9]` - the lesson's real output. Both unknown words become UNK, so the model sees one
      "unknown" symbol for both. Measure the UNK rate on validation text; if it is high, use subwords (BPE),
      which can build any word from learned pieces.

  - id: mask-from-lengths
    type: mcq
    concept: text-tokens-and-padding
    skill: analysis
    title: Where should the mask come from?
    prompt: |
      A teammate builds the attention mask for a padded batch with `mask = ids != 0`. The batch was padded with
