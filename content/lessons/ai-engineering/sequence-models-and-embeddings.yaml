    language: python
    code: |
      class TicketClassifier(nn.Module):
          def __init__(self, vocab_size, pad_id=0):
              super().__init__()
              self.embedding = nn.Embedding(vocab_size, 32, padding_idx=pad_id)
              self.lstm = nn.LSTM(32, 64, batch_first=True)
