  - id: read-gradient-norms
    type: mcq
    concept: recurrent-networks-and-bptt
    skill: analysis
    title: Reading per-step gradient norms
    prompt: |
      You measure the gradient of the final hidden state with respect to each input step of a fresh `nn.RNN`
      on 50 steps:

      ```plaintext
      step:  0        10       20       30       40       49
      norm:  3.4e-14  1.6e-11  1.0e-08  6.8e-06  3.4e-03  1.8e+00
      ```

      What does this predict, and what would you try?
    options:
      - id: vanishing
        text: Early tokens barely affect the update, so the model will struggle to learn dependencies on them; try a gated cell (LSTM/GRU) with a positive forget-gate bias and check held-out accuracy.
        feedback: Correct - a roughly 1,000× drop every 10 steps is vanishing gradients; gating with an open forget gate gives an additive path.
      - id: clip
        text: Gradients are exploding at the last step (1.8); clip them to 1.0.
        feedback: 1.8 is ordinary. The problem is the other end - and clipping can only shrink gradients, never enlarge 3.4e-14.
      - id: lr
        text: Increase the learning rate by 10^14 so the first step's gradient becomes useful.
        feedback: The learning rate scales every gradient equally - the late steps would explode. The ratio between early and late steps is the problem.
      - id: fine
        text: Nothing - small gradients mean the early tokens are already learned.
        feedback: These are from a freshly initialised network; nothing has been learned yet. Small gradients here mean the signal cannot reach those steps.
    correct: [vanishing]
    hints:
      - Compare the first and last numbers - how many orders of magnitude apart?
      - What can clipping do to a tiny number?
    solution: |
      Vanishing gradients: the product of 49 Jacobians shrinks the signal exponentially. Clipping can't help.
      Gated cells provide an additive memory path; in the lesson, setting the LSTM forget bias to 3 raised the
      step-0 gradient from 1.1e-11 to 0.18 and turned a chance-level model into a perfect one on 30-40 tokens.

  - id: debug-clipping
    type: debug
    concept: recurrent-networks-and-bptt
    skill: analysis
    title: The clipping that never clips
    prompt: |
      This training step should stop exploding gradients, but the loss still spikes to `nan` after a few hundred
      steps, and the logged norm is always 0.0. Click **every** line that is wrong.
    language: python
    code: |
      for ids, lengths, labels in loader:
          optimiser.zero_grad()
          norm = nn.utils.clip_grad_norm_(model.parameters(), max_norm=1.0)
          logits = model(ids, lengths)
          loss = loss_fn(logits, labels)
          loss.backward()
          optimiser.step()
          log(loss.item(), norm.item())
    correctLines: [3]
    lineNotes:
      - line: 2
        note: Zeroing the gradients at the start of each step is correct - that is exactly why the clip on line 3 sees nothing.
      - line: 6
        note: backward() belongs here; the clip has to move to just after it.
      - line: 7
        note: step() is right, as long as the clip runs between backward() and step().
      - line: 8
        note: Logging the pre-clip norm is good practice - once the clip is in the right place, this value is the early warning.
    hints:
      - When do gradients exist in this loop?
      - The logged norm is 0.0. Of which gradients?
    solution: |
      **Line 3** clips immediately after `zero_grad()` - the gradients are zero, so the logged norm is 0.0 and the
      real gradients from line 6 reach `step()` unclipped. Move the clip between `loss.backward()` and
      `optimiser.step()`.

  - id: forget-gate
    type: mcq
    concept: gated-rnns-and-their-limits
    skill: recall
    title: The line that lets an LSTM remember
    prompt: Which part of the LSTM update lets information and gradients survive many steps, and when?
    options:
      - id: additive-cell
        text: "c_t = f_t ⊙ c_(t-1) + i_t ⊙ g_t - the cell is updated by addition, scaled only by the forget gate, so with f_t near 1 it passes through almost unchanged."
        feedback: Correct - no weight matrix and no squashing on the path from c_(t-1) to c_t; the forget gate decides how much survives.
      - id: output-gate
        text: "h_t = o_t ⊙ tanh(c_t) - the output gate stores the memory."
        feedback: The output gate decides how much of the cell is shown in h_t; the memory lives in c_t.
      - id: tanh-g
        text: "g_t = tanh(...) - tanh has a larger derivative than sigmoid."
        feedback: g_t is new candidate content; its derivative does not create a long-lived path.
      - id: always
        text: Every LSTM remembers indefinitely, whatever its weights.
        feedback: A fresh LSTM's forget gate is about 0.5, and the lesson measured its step-0 gradient at 1.1e-11 - it vanishes like an RNN's until the gate learns (or is initialised) to stay open.
    correct: [additive-cell]
    hints:
      - Look for the equation that connects c_(t-1) to c_t.
      - What multiplies c_(t-1)?
    solution: |
      The cell update is additive and gated: with f_t ≈ 1, c_t ≈ c_(t-1) + new content, so information - and
      gradient - flows back across many steps. The gate value is learned (and can be biased open at
      initialisation; Jozefowicz et al. found a bias of 1 helps).

