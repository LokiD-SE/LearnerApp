id: sequence-models-and-embeddings
title: Sequence models, RNNs and word embeddings
subject: ai-engineering
module: deep-learning
level: advanced
status: published
estimatedMinutes: 100
summary: How text becomes something a network can learn from - tokens, vocabularies, padding and masks, byte-pair-encoding subwords and learned embedding vectors (word2vec's skip-gram) - and how recurrent networks read a sequence one step at a time. You build an RNN by hand, measure its gradients vanishing through time, clip exploding ones, see why LSTM and GRU gates help (and when they don't), stop padding from changing predictions with packed sequences, and see why the strictly sequential computation pushed the field towards attention. Every output shown was produced by running the code.
