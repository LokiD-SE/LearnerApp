        text: It gives the right mask today, but it is tied to the pad value; computing it from the lengths (positions < length) is correct whatever the pad id and token ids are.
        feedback: Correct - with PAD = 0 reserved, the result is the same today; the lengths-based mask also survives a different pad id or a vocabulary where 0 is a real token.
      - id: always-wrong
        text: It is always wrong, because a mask must be float, not bool.
        feedback: Boolean masks are normal (True = real token). The issue is where the values come from, not the dtype.
      - id: always-right
        text: It is always right - padding is by definition the pad value.
        feedback: Only if no real token can have that id and the pad id never changes. Change `pad_id` to 99 and this line still masks id 0.
      - id: use-ids-gt-1
