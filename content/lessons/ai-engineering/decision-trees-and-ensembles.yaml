environment: |
  - **Runtime:** **Python 3.12.3**, **NumPy 2.5.4**, **pandas 3.1.1** and **scikit-learn 1.9.1** - the versions
    pinned in `practice/ai/requirements.txt`. Every printed tree, score, table and timing in this lesson was
    produced by running the code shown on Linux in November 2026, with fixed random seeds and two CPU threads;
    other versions may differ in the last digits, and timings depend on the machine.
  - **scikit-learn documentation (version 1.9.1):** [1.10 Decision
    Trees](https://scikit-learn.org/stable/modules/tree.html) (the advantages and disadvantages lists - "white
    box model", "can be unstable because small variations in the data might result in a completely different
    tree", "not good at extrapolation", learning an optimal tree is "NP-complete", so trees are grown greedily;
    the impurity formulas; section 1.10.9 Minimal Cost-Complexity Pruning and the effective alpha); [1.11
    Ensembles](https://scikit-learn.org/stable/modules/ensemble.html) (1.11.1.1 Histogram-Based Gradient
    Boosting - "orders of magnitude faster than GradientBoostingClassifier ... when the number of samples is
    larger than tens of thousands", built-in missing values, native categorical support, early stopping "enabled
    by default if the number of samples is larger than 10,000"; 1.11.2 Random forests - bootstrap samples, a
    random subset of features, "the scikit-learn implementation combines classifiers by averaging their
    probabilistic prediction, instead of letting each classifier vote"; 1.11.2.3 Parameters - `max_features="sqrt"`
    for classification and `1.0` for regression as "empirical good default values"; out-of-bag estimates); [5.2
    Permutation feature importance](https://scikit-learn.org/stable/modules/permutation_importance.html)
    (impurity-based importance "can give high importance to features that may not be predictive on unseen data
    when the model is overfitting" and is "strongly biased and favor high cardinality features"; misleading
    values on correlated features); the API pages of
    [DecisionTreeClassifier](https://scikit-learn.org/stable/modules/generated/sklearn.tree.DecisionTreeClassifier.html),
    [RandomForestClassifier](https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.RandomForestClassifier.html)
    and
    [HistGradientBoostingClassifier](https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.HistGradientBoostingClassifier.html).
  - **Textbook:** Trevor Hastie, Robert Tibshirani and Jerome Friedman, *The Elements of Statistical Learning*,
    2nd edition (Springer, 2009), free at [the authors'
    site](https://hastie.su.domains/ElemStatLearn/) - section 9.2 (CART; the (400, 400) split example in 9.2.3:
    "either the Gini index or cross-entropy should be used when growing the tree"), section 8.7 (bagging),
    section 10.10 and 10.12.1 (gradient boosting; shrinkage - "set ν to be very small (ν < 0.1) and then choose M
    by early stopping") and chapter 15 (random forests; equation 15.1, the variance of an average of correlated
    trees, ρσ² + (1 - ρ)σ²/B; out-of-bag samples, "almost identical to that obtained by N-fold
    cross-validation").
  - **Paper:** Leo Breiman, [Random Forests](https://www.stat.berkeley.edu/~breiman/randomforest2001.pdf),
    *Machine Learning* 45 (2001) - the generalization error of a forest "depends on the strength of the
    individual trees in the forest and the correlation between them". Gradient boosting is from J. H. Friedman,
    "Greedy function approximation: a gradient boosting machine", *Annals of Statistics* 29 (2001), as cited
    by the scikit-learn guide.
  - **Fictional and synthetic:** SandPay and every payment. The data set is generated by `make_fraud_data` in
    `practice/ai/exercises/ml_foundations/trees.py` (seed 0, 20000 rows, 3.5% fraud). Its fraud rule is built
    from thresholds and one interaction on purpose - a new card used at night - because that is the structure
    trees find well; real fraud is noisier and drifts. XGBoost and LightGBM are mentioned for orientation
    only; nothing in the lesson depends on them.
  - **Not repeated here:** splits, metrics and overfitting ([Evaluation, overfitting and
    regularisation](#/lesson/model-evaluation-and-overfitting)) and pipelines and hyperparameter search
    ([Feature engineering and scikit-learn pipelines](#/lesson/scikit-learn-pipelines)).

prerequisites:
  - model-evaluation-and-overfitting
  - scikit-learn-pipelines

concepts:
  - id: tree-splits-and-pruning
    name: How a decision tree splits and when to stop it
    summary: A CART tree splits the rows again and again on one feature and one threshold, choosing at each node the split that most reduces impurity (Gini or entropy for classes, squared error for numbers), weighted by the size of each child. The greedy search keeps going until leaves are pure, so a full tree memorises its training data; depth limits, minimum leaf sizes and cost-complexity pruning (ccp_alpha, chosen by cross-validation) stop it.
  - id: bagging-and-random-forests
    name: Bagging and random forests
    summary: A single tree has high variance. Bagging fits many trees on bootstrap samples and averages them; a random forest also lets each split consider only a random subset of features (max_features) so the trees are less correlated and the average varies less. About 37% of rows are left out of each bootstrap sample, so out-of-bag predictions give a validation score for free.
  - id: gradient-boosting
    name: Gradient boosting
    summary: Boosting adds shallow trees one after another, each fitted to the negative gradient of the loss for the current model - the residuals for squared error - and scaled by a learning rate. A small learning rate needs more trees and usually generalises better; the number of trees is chosen by early stopping on held-out data. HistGradientBoosting bins features, handles missing values and categories natively and is the fast default for tabular data.
  - id: tree-feature-importance
    name: Reading feature importances honestly
    summary: Impurity-based importance (feature_importances_, MDI) is computed on training data and favours features with many distinct values, so a random column can rank high. Permutation importance measures how much a score on held-out data drops when one column is shuffled; it is model-agnostic but splits the credit between correlated features. Neither says what causes fraud.

objectives:
  - Compute Gini impurity, entropy and the impurity decrease of a candidate split by hand, and trace how CART chooses the best feature and threshold.
  - Read a fitted tree (export_text) as rules, and diagnose overfitting from a table of depth against training and test scores.
  - Prune a tree with max_depth, min_samples_leaf or ccp_alpha chosen by cross-validation, and explain the effective alpha of the weakest link.
  - Explain why averaging bootstrap trees reduces variance, why max_features lowers the correlation between trees, and use out-of-bag scores as a validation estimate.
  - Write gradient boosting for squared error from single trees, and explain how the learning rate, the number of trees and early stopping interact.
  - Use HistGradientBoostingClassifier with categorical columns and missing values, and choose between a random forest, boosting and a linear model for a given problem.
  - Compare impurity-based and permutation importances, and explain why a noise column or a correlated pair misleads each.

sections:
  - id: intuition
    kind: intuition
    concepts: [tree-splits-and-pruning, bagging-and-random-forests, gradient-boosting]
    title: The idea in plain language
    body: |
      A SandPay fraud analyst who reviews payments by hand doesn't compute a weighted sum. They ask questions:
      *Is the card new? Was it used at 3 in the morning? Is the amount unusually large?* Each answer sends the
      payment down a different path, and at the end of a path they have seen enough similar payments to say
      "about 40% of these are fraud".

      A **decision tree** learns that list of questions from data. At each step it picks the one question - one
      feature and one cut-off - that best separates fraud from genuine payments, then asks the next question
      separately for each answer. Trees need no scaling, handle "new card **and** at night" interactions on their
      own, and you can print them as rules.

      Their weakness is that they are **too eager**. Left alone, a tree keeps asking questions until each leaf
      holds a handful of payments - and then it has memorised them. Two fixes give the most accurate models for
      tabular data that exist today:

      - **Ask a crowd** (bagging, random forests): train hundreds of trees, each on a slightly different sample
        of the data and with some questions hidden from it, and average their answers. Individual mistakes
        cancel out.
      - **Learn from mistakes** (boosting): train small trees one after another, each one focusing on the errors
        the team has made so far, and add a small part of each tree's answer.

  - id: what
    kind: what
    concepts: [tree-splits-and-pruning]
    title: Terminology
    body: |
      | Term | Meaning |
      | --- | --- |
      | **Node** | a group of training rows; the **root** holds all of them |
      | **Split** | a test on one feature, `feature <= threshold`; rows that pass go to the **left** child |
      | **Leaf** (terminal node) | a node that is not split; it predicts the class shares (classification) or the mean (regression) of its rows |
      | **Depth** | the number of splits from the root to a node; `max_depth` limits it |
      | **Impurity** | how mixed a node is - **Gini**, **entropy** (log loss) or **squared error** |
      | **Impurity decrease** | parent impurity minus the children's impurities weighted by their share of rows |
      | **CART** | Classification and Regression Trees (Breiman, Friedman, Olshen and Stone, 1984) - binary splits chosen greedily; scikit-learn uses "an optimized version" of it |
      | **Ensemble** | a model that combines many models; **bagging** averages independent ones, **boosting** adds them in sequence |

      For a node whose rows have class shares p_1 ... p_K:

      - **Gini** = sum of p_k (1 - p_k) = 1 - sum of p_k². It is 0 for a pure node and 0.5 for a 50/50 node of
        two classes.
      - **Entropy** = - sum of p_k log2 p_k (scikit-learn uses base 2; checked below). It is 0 for a pure node and
        1 for a 50/50 node.
      - **Squared error** (regression) = the mean of (y - mean(y))², the node's variance.

      A tree is **non-parametric**: it has no fixed number of weights; the more data, the more splits it can
      make. It predicts a **piecewise constant** function - one value per leaf - which is why, as the scikit-learn
      guide says, trees "are not good at extrapolation".

  - id: why
    kind: why
    concepts: [tree-splits-and-pruning, bagging-and-random-forests, gradient-boosting]
    title: Why trees are the default for tabular data
    body: |
      Linear and logistic regression assume each feature pushes the prediction in one direction by a fixed
      amount. Payment data rarely behaves that way:

      - **Thresholds** - risk jumps above an amount, it doesn't rise smoothly with it.
      - **Interactions** - a new card is fine at noon and suspicious at 03:00.
      - **Mixed types** - amounts, counts, hours and categories side by side, on wildly different scales, with
        gaps.

      A tree models all three without feature engineering, is unaffected by scaling or by any monotonic
      transformation of a feature (it only compares values), and its ensembles - random forests and gradient
      boosting - are what most teams reach for first on rows-and-columns data. Neural networks dominate images,
      audio and text; for tables, boosted trees remain the strong baseline to beat.

      The catch is that each of those strengths can hide a problem - an overfitted tree, a misleading
      importance, an extrapolation that is silently flat. This lesson shows each one with real output.

  - id: data-setup
    kind: code
    concepts: [tree-splits-and-pruning]
    title: The synthetic SandPay payments used in this lesson
    collapsed: true
    body: |
      `make_fraud_data` is provided in the practice file `exercises/ml_foundations/trees.py`. Every example
      splits its 20000 rows 75/25, stratified, with `random_state=0`; most one-hot encode the two categorical
      columns (17 features).

      ```python
      def make_fraud_data(n=20000, seed=0):
          rng = np.random.default_rng(seed)
          category = rng.choice(CATEGORIES, size=n, p=[0.25, 0.12, 0.1, 0.12, 0.1, 0.12, 0.09, 0.1])
          country = rng.choice(COUNTRIES, size=n, p=[0.5, 0.15, 0.15, 0.1, 0.1])
          amount = np.round(np.exp(rng.normal(4.0, 1.0, n)), 2)
          card_age = np.floor(rng.exponential(300, n))
          hour = rng.integers(0, 24, n)
          attempts = rng.poisson(0.4, n)
          logit = (
              -5.0
              + 4.0 * ((card_age < 30) & (hour < 6))   # a new card at night - an interaction
              + 2.2 * (amount > 400)                    # a threshold
              + 1.5 * np.isin(category, ["electronics", "gaming"])
              + 0.7 * (country != "IN")
              + 1.8 * (attempts >= 2)
          )
          y = (rng.random(n) < 1 / (1 + np.exp(-logit))).astype(int)
          ...  # a DataFrame with amount, card_age_days, hour, attempts_24h, merchant_category, country


      # prep.py - used by most examples below
      def split(n=20000, seed=0):
          X, y = make_fraud_data(n, seed)
          Xd = pd.get_dummies(X, columns=["merchant_category", "country"], dtype=float)
          return train_test_split(Xd, y, test_size=0.25, stratify=y, random_state=0)
      ```

      The training set has 15000 rows and 525 fraud (3.5%). Because the outcome is drawn at random from a
      probability, even a perfect model could not reach an AUC of 1 - most payments with risky features are
      still genuine.

  - id: splitting
    kind: internals
    concepts: [tree-splits-and-pruning]
    title: How CART chooses a split
    body: |
      At a node, CART tries **every feature** and, for each, **every threshold** between two consecutive distinct
      values (scikit-learn uses the midpoint). For each candidate it computes the **weighted impurity of the
      children**:

      G = (n_left / n) H(left) + (n_right / n) H(right)

      and keeps the candidate with the smallest G - equivalently the largest **impurity decrease** H(node) - G.
      Then it repeats inside each child. It never looks ahead: finding the optimal tree is NP-complete, so every
      practical learner is greedy, and "cannot guarantee to return the globally optimal decision tree"
      (scikit-learn guide).

      **Why not just count mistakes?** ESL section 9.2.3 gives the classic example: a node with 400 rows of
      each class, and two candidate splits - A: (300, 100) and (100, 300); B: (200, 400) and (200, 0). Real
      output:

      ```plaintext
      misclassification  parent=0.5000  split A=0.2500  split B=0.2500
      gini               parent=0.5000  split A=0.3750  split B=0.3333
      entropy            parent=1.0000  split A=0.8113  split B=0.6887
      gini root impurity_ 0.375
      entropy root impurity_ 0.8113
      log2 entropy 0.8113  ln entropy 0.5623
      ```

      The error rate cannot tell A from B. Gini and entropy prefer B, which creates a **pure** node of 200 rows
      that needs no further splitting. That is why trees are grown with Gini or entropy. The last three lines
      fit a scikit-learn stump on a (300, 100) node: its `tree_.impurity` for the entropy criterion is 0.8113,
      the base-2 value, not the natural-log 0.5623.

      **The SandPay root, by hand.** On the 15000 training rows (four numeric features), the solution of this
      lesson's exercise evaluates every threshold of every feature:

      ```plaintext
      root: rows 15000 fraud 525 gini 0.0676
      left  rows 1419 fraud 184 gini 0.2257
      right rows 13581 fraud 341 gini 0.049
      weighted 0.0657 decrease 0.00187
      best_split -> card_age_days 29.5 0.00187
        amount         best threshold    402.9  decrease 0.00078
        card_age_days  best threshold     29.5  decrease 0.00187
        hour           best threshold      5.5  decrease 0.00057
        attempts_24h   best threshold      1.5  decrease 0.00083
      sklearn stump root: card_age_days 29.5
      ```

      Check the weighted line yourself: 1419/15000 x 0.2257 + 13581/15000 x 0.049 = 0.0214 + 0.0444 = 0.0657.
      Card age wins although the left child is still 87% genuine: it concentrates 35% of the fraud into 9% of
      the rows. Each feature's best cut-off lands near the threshold used to generate the data (30 days, 400,
      06:00, 2 attempts) - the tree rediscovers the rules. scikit-learn's own stump picks the same feature and
      threshold.

      For **regression** the same search uses squared error, so each leaf predicts the mean of its rows. For
      categorical features, a one-hot column is just a 0/1 feature split at 0.5.

  - id: tree-code
    kind: code
    concepts: [tree-splits-and-pruning]
    title: Grow a tree and read it as rules
    body: |
      ```python
      import pandas as pd
      from sklearn.model_selection import train_test_split
      from sklearn.tree import DecisionTreeClassifier, export_text
      from sklearn.metrics import roc_auc_score, average_precision_score

      X, y = make_fraud_data()
      Xn = X[["amount", "card_age_days", "hour", "attempts_24h"]]
      X_tr, X_te, y_tr, y_te = train_test_split(Xn, y, test_size=0.25, stratify=y, random_state=0)

      t2 = DecisionTreeClassifier(max_depth=2, random_state=0).fit(X_tr, y_tr)
      print(export_text(t2, feature_names=list(Xn.columns), show_weights=True, decimals=1))
      ```

      ```plaintext
      |--- card_age_days <= 29.5
      |   |--- hour <= 5.5
      |   |   |--- weights: [247.0, 160.0] class: 0
      |   |--- hour >  5.5
      |   |   |--- weights: [988.0, 24.0] class: 0
      |--- card_age_days >  29.5
      |   |--- amount <= 402.8
      |   |   |--- weights: [13001.0, 296.0] class: 0
      |   |--- amount >  402.8
      |   |   |--- weights: [239.0, 45.0] class: 0
      ```

      Read each path as a rule. **New card at night**: 160 fraud in 407 rows - 39%, eleven times the base rate.
      The same new card in daytime: 24 in 1012, 2.4%. The second level found the interaction without being told
      about it - the split on hour happens only on the new-card side.

      Every leaf says `class: 0`, because `predict` returns the majority class. For fraud you use
      `predict_proba` (the leaf's share, 0.39 for the first leaf) and choose a threshold yourself, as in the
      evaluation lesson.

  - id: tree-visual
    kind: visual
    concepts: [tree-splits-and-pruning]
    title: The depth-2 SandPay tree
    body: |
      ```mermaid
      flowchart TD
        R["All 15000 training payments - 3.5% fraud"] -->|"card_age_days <= 29.5"| A["1419 rows - 13% fraud"]
        R -->|"card_age_days > 29.5"| B["13581 rows - 2.5% fraud"]
        A -->|"hour <= 5.5"| A1["Leaf - 407 rows - 39% fraud"]
        A -->|"hour > 5.5"| A2["Leaf - 1012 rows - 2.4% fraud"]
        B -->|"amount <= 402.8"| B1["Leaf - 13297 rows - 2.2% fraud"]
        B -->|"amount > 402.8"| B2["Leaf - 284 rows - 16% fraud"]
      ```

      Notice that the two sides of the root ask **different** second questions. That is how a tree expresses
      interactions: a linear model would need a hand-made `new_card_at_night` feature to do the same.

  - id: overfitting-and-pruning
    kind: internals
    concepts: [tree-splits-and-pruning]
    title: Overfitting, and three ways to stop it
    body: |
      With no limits, a tree splits until every leaf is pure (or cannot be split). Same data, growing
      `max_depth` (AP = average precision; the fraud rate, 0.035, is its random baseline):

      ```plaintext
      depth  leaves  train_auc  test_auc  train_ap  test_ap
          1       2      0.633     0.655     0.068    0.077
          2       4      0.682     0.712     0.171    0.221
          3       8      0.736     0.758     0.217    0.257
          4      16      0.757     0.748     0.246    0.254
          6      49      0.790     0.715     0.304    0.236
          8      95      0.821     0.701     0.381    0.216
         12     296      0.909     0.634     0.606    0.135
       None     898      1.000     0.585     1.000    0.064
      ```

      The full tree has 898 leaves, a perfect training score - and a test AP of 0.064, worse than depth 2.
      Training scores rise with every level; test scores peak at depth 3 or 4 and then fall: the textbook
      variance curve from the evaluation lesson, in one hyperparameter.

      Three ways to stop it, all chosen by cross-validation, never by the test set:

      1. **Pre-pruning limits**: `max_depth`, `min_samples_leaf` (every leaf keeps at least that many rows),
         `min_samples_split`, `max_leaf_nodes`, `min_impurity_decrease`.
      2. **Cost-complexity pruning** (`ccp_alpha`): grow the full tree, then cut it back. scikit-learn scores a
         tree by R_alpha(T) = R(T) + alpha |leaves|, where R(T) is the total sample-weighted impurity of the
         leaves. For each internal node t with branch T_t below it, the **effective alpha** is
         alpha_eff(t) = (R(t) - R(T_t)) / (|leaves of T_t| - 1) - the impurity the branch saves per extra leaf.
         The node with the smallest alpha_eff is the **weakest link**; it is pruned first, and pruning stops
         when every remaining alpha_eff exceeds `ccp_alpha`.
      3. **Use an ensemble** - the rest of this lesson.

      `cost_complexity_pruning_path` lists every alpha at which the tree changes (191 here, up to 0.00358).
      Refitting at a few of them:

      ```plaintext
      ccp_alpha   leaves  test_auc  test_ap
        0.00000     898     0.585    0.064
        0.00005     716     0.557    0.071
        0.00010      67     0.686    0.170
        0.00020       9     0.759    0.255
        0.00040       7     0.758    0.256
        0.00080       3     0.661    0.188
        0.00160       3     0.661    0.188
      cv best ccp_alpha {'ccp_alpha': 0.0002} cv AP 0.201 leaves 9 test AP 0.255
      ```

      Five-fold `GridSearchCV` on the training rows (scoring average precision) chose alpha 0.0002: 9 leaves
      instead of 898, and four times the test AP. Too large an alpha (0.0008) underfits.

  - id: pruning-code
    kind: code
    concepts: [tree-splits-and-pruning]
    title: The depth and pruning experiments
    collapsed: true
    body: |
      ```python
      for d in [1, 2, 3, 4, 6, 8, 12, None]:
          t = DecisionTreeClassifier(max_depth=d, random_state=0).fit(X_tr, y_tr)
          ptr, pte = t.predict_proba(X_tr)[:, 1], t.predict_proba(X_te)[:, 1]
          print(f"{str(d):>5}  {t.get_n_leaves():>6}  {roc_auc_score(y_tr, ptr):9.3f}  {roc_auc_score(y_te, pte):8.3f}"
                f"  {average_precision_score(y_tr, ptr):8.3f}  {average_precision_score(y_te, pte):7.3f}")

      full = DecisionTreeClassifier(random_state=0).fit(X_tr, y_tr)
      path = full.cost_complexity_pruning_path(X_tr, y_tr)
      print("number of alphas on the path:", len(path.ccp_alphas), " max alpha:", round(path.ccp_alphas[-1], 5))

      from sklearn.model_selection import GridSearchCV, StratifiedKFold
      grid = GridSearchCV(
          DecisionTreeClassifier(random_state=0),
          {"ccp_alpha": [0.0, 0.00005, 0.0001, 0.0002, 0.0004, 0.0008, 0.0016]},
          scoring="average_precision",
          cv=StratifiedKFold(5, shuffle=True, random_state=0),
      ).fit(X_tr, y_tr)
      ```

      `random_state` matters even without randomness in the data: when two splits tie, the tree's random
      feature order decides, and a fixed seed makes the result reproducible.

  - id: why-ensembles
    kind: why
    concepts: [bagging-and-random-forests]
    title: Why one tree is not enough
    body: |
      The scikit-learn guide lists the problem plainly: "Decision trees can be unstable because small variations
      in the data might result in a completely different tree being generated. This problem is mitigated by
      using decision trees within an ensemble." Fitting the same depth-3 tree on three random halves of the
      training rows:

      ```plaintext
      half 0: root = card_age_days <= 29.5; left child = hour <= 5.5; leaves 8
      half 1: root = card_age_days <= 26.5; left child = hour <= 5.5; leaves 8
      half 2: root = card_age_days <= 29.5; left child = hour <= 5.5; leaves 8
      ```

      The strong top splits survive, but the threshold already moves - and deeper down, where each node holds a
      few dozen rows, the splits are mostly noise. That is **variance**: the model depends on which rows it
      happened to see.

      Averaging cures variance. ESL (equation 15.1): an average of B identically distributed predictions, each
      with variance σ² and pairwise correlation ρ, has variance

      ρσ² + (1 - ρ)σ²/B

      More trees shrink the second term towards zero; the **first term stays**. So two things matter: many trees,
      and trees that are **not too correlated**. Breiman's random-forest paper says the same in classifier terms:
      a forest's error "depends on the strength of the individual trees in the forest and the correlation
      between them".

  - id: forests
    kind: internals
    concepts: [bagging-and-random-forests]
    title: Bagging, random forests and out-of-bag rows
    body: |
      **Bagging** (bootstrap aggregating): draw a **bootstrap sample** - n rows with replacement from the n
      training rows - fit a deep tree on it, repeat B times, and average. Each draw misses a given row with
      probability 1 - 1/n, so the row is left out of the whole sample with probability (1 - 1/n)^n, which tends
      to 1/e:

      ```plaintext
      P(row not in a bootstrap sample of 10) = 0.3487
      P(row not in a bootstrap sample of 100) = 0.3660
      P(row not in a bootstrap sample of 1000) = 0.3677
      P(row not in a bootstrap sample of 15000) = 0.3679
      1/e = 0.3679
      ```

      So each tree never sees about **37% of the rows** - its **out-of-bag** (OOB) rows.

      **Random forest** = bagging + one more source of randomness: at every split, the tree may only choose
      among a random subset of `max_features` columns. A strong feature can no longer dominate every tree's top
      splits, so the trees differ more and their errors are less correlated. scikit-learn's guide gives
      `max_features="sqrt"` (the classifier's default) for classification and `1.0` (all features, which is plain
      bagging) for regression as empirical good defaults, and says "the best parameter values should always be
      cross-validated". Note also: scikit-learn "combines classifiers by averaging their probabilistic
      prediction, instead of letting each classifier vote".

      Same data, 300 trees each; the correlation is the mean pairwise correlation of 60 trees' test predictions:

      ```plaintext
      one full tree                      test AUC 0.596  test AP 0.070
      one tree min_samples_leaf=50       test AUC 0.777  test AP 0.250
      bagged full trees (300)            test AUC 0.788  test AP 0.225
      forest max_features=None  mean tree-tree corr 0.244  test AUC 0.787  test AP 0.226
      forest max_features=sqrt  mean tree-tree corr 0.184  test AUC 0.800  test AP 0.269
      forest max_features=1     mean tree-tree corr 0.156  test AUC 0.776  test AP 0.219
      ```

      Averaging turned the worst single model (a full tree, AP 0.070) into a good one (0.225). Lowering
      `max_features` lowers the correlation (0.244, 0.184, 0.156) - and the best AP is in the middle:
      considering only **one** random column per split decorrelates the trees most but makes each tree too weak.
      That is Breiman's strength-versus-correlation trade-off in three lines.

      **OOB predictions.** For each training row, average only the trees that did not see it. ESL: the OOB error
      "is almost identical to that obtained by N-fold cross-validation", so a forest is validated while it is
      fitted. With `oob_score=True` scikit-learn stores `oob_decision_function_` (and `oob_score_`, which is
      **accuracy** unless you pass a scoring callable):

      ```plaintext
      fraud rate train 0.035  accuracy of always 'not fraud' 0.965
      trees  rows_no_oob  oob_auc  oob_ap  test_auc  test_ap  oob_accuracy  fit_s
         10          149    0.742   0.197     0.795    0.308        0.9650    0.2  warnings=1
         30            0    0.777   0.235     0.817    0.331        0.9650    0.4  warnings=0
        100            0    0.798   0.248     0.823    0.331        0.9649    1.1  warnings=0
        300            0    0.804   0.254     0.819    0.327        0.9648    3.4  warnings=0
       1000            0    0.806   0.258     0.818    0.324        0.9649   11.9  warnings=0
      ```

      Four things to read here (`min_samples_leaf=5`, all on the training rows except the test columns):

      - With 10 trees, 149 rows were in every bootstrap sample, so they have no OOB prediction, and
        scikit-learn warns "Some inputs do not have OOB scores". Exclude them; never count them as 0.
      - OOB scores are a little **below** test scores: each OOB prediction averages only about 37% of the trees.
        It is a slightly pessimistic estimate, and it needs no separate validation split.
      - **More trees never overfit** in the sense that the test score collapses - from 100 to 1000 trees it is
        flat, while fitting time grows linearly. Breiman shows the generalization error converges as trees are
        added. Pick the smallest number where the OOB score has stopped improving.
      - `oob_score_` = 0.965 is exactly the accuracy of always saying "not fraud". On 3.5% fraud it says nothing;
        compute AUC or AP from `oob_decision_function_` instead.

  - id: forest-code
    kind: code
    concepts: [bagging-and-random-forests]
    title: The forest experiments
    collapsed: true
    body: |
      ```python
      import numpy as np
      from sklearn.ensemble import RandomForestClassifier, BaggingClassifier
      from sklearn.tree import DecisionTreeClassifier
      from sklearn.metrics import roc_auc_score, average_precision_score

      X_tr, X_te, y_tr, y_te = split()          # one-hot, 17 features

      BaggingClassifier(DecisionTreeClassifier(), n_estimators=300, random_state=0, n_jobs=2).fit(X_tr, y_tr)
      for mf in [None, "sqrt", 1]:
          rf = RandomForestClassifier(n_estimators=300, max_features=mf, random_state=0, n_jobs=2).fit(X_tr, y_tr)
          P = np.array([t.predict_proba(X_te.to_numpy())[:, 1] for t in rf.estimators_[:60]])
          C = np.corrcoef(P)
          rho = C[np.triu_indices_from(C, 1)].mean()   # mean correlation over pairs of trees

      for n in (10, 30, 100, 300, 1000):
          rf = RandomForestClassifier(n_estimators=n, min_samples_leaf=5, oob_score=True,
                                      random_state=0, n_jobs=2).fit(X_tr, y_tr)
          d = rf.oob_decision_function_
          ok = d.sum(axis=1) > 0                       # rows with at least one OOB tree
          oob_ap = average_precision_score(y_tr[ok], d[ok, 1])
      ```

  - id: boosting
    kind: internals
    concepts: [gradient-boosting]
    title: Gradient boosting - each tree fixes the last one's errors
    body: |
      A forest grows deep, independent trees and averages them to remove **variance**. Boosting goes the other
      way: it grows **shallow** trees (which underfit on their own - high bias) **in sequence**, each one
      correcting what the model so far gets wrong, so the sum removes **bias**.

      For squared error the algorithm fits in five lines:

      1. Start with a constant: F_0(x) = mean(y).
      2. Compute the **residuals** r_i = y_i - F_(m-1)(x_i). For squared loss these are the negative gradient of
         the loss with respect to the prediction - hence *gradient* boosting.
      3. Fit a small regression tree h_m to the residuals.
      4. Update F_m(x) = F_(m-1)(x) + ν h_m(x), where ν is the **learning rate** (shrinkage).
      5. Repeat for M trees.

      For other losses (log loss for classification) step 2 uses that loss's negative gradient and the leaves are
      adjusted to minimise it, but the structure is the same. The exercise below builds exactly this from
      `DecisionTreeRegressor`, and its predictions match `GradientBoostingRegressor` with the same settings to
      within 1e-14. On a synthetic SandPay fee (0.3 + 0.02 x amount, plus 5 when a risk flag is set, plus noise),
      depth-2 trees, ν = 0.1:

      ```plaintext
      trees    0  training MSE   40.572
      trees    1  training MSE   34.370
      trees    2  training MSE   29.262
      trees    5  training MSE   18.293
      trees   10  training MSE    8.992
      trees   50  training MSE    0.846
      trees  200  training MSE    0.542
      first row: y 5.217  init 12.973  after one tree (lr=1.0) 9.784
      first row: y 5.217  init 12.973  after one tree (lr=0.1) 12.654
      ```

      Each tree removes part of the remaining error; the noise variance is 1, so below about 1 the model is
      starting to fit noise. The first row shows shrinkage: the first tree moves the prediction from 12.97
      towards 5.22 by 3.19 at ν = 1, but only by a tenth of that at ν = 0.1.

      **Why shrink?** ESL section 10.12.1: "Smaller values of ν lead to larger values of M for the same training
      risk", and empirically "the best strategy appears to be to set ν to be very small (ν < 0.1) and then
      choose M by early stopping". A small step leaves room for later trees to correct the earlier ones instead
      of overshooting. Boosting **can** overfit with too many trees - unlike a forest - so M must be chosen on
      held-out data.

  - id: hist-gradient-boosting
    kind: code
    concepts: [gradient-boosting]
    title: HistGradientBoosting on SandPay - learning rate, early stopping, categories and gaps
    body: |
      `HistGradientBoostingClassifier` first bins every feature into at most `max_bins=255` integer bins (for
      the non-missing values) and searches splits over bins, which the guide says makes it "orders of magnitude faster"
      than `GradientBoostingClassifier` beyond tens of thousands of rows. Its early stopping is on by default
      (`early_stopping="auto"`) when there are more than 10000 training rows: it holds out
      `validation_fraction=0.1` and stops when `n_iter_no_change=10` iterations bring no gain larger than `tol`.

      ```python
      X, y = make_fraud_data(20000, 0)
      for c in ("merchant_category", "country"):
          X[c] = X[c].astype("category")              # native categorical support reads the dtype
      X_tr, X_te, y_tr, y_te = train_test_split(X, y, test_size=0.25, stratify=y, random_state=0)

      for lr in (1.0, 0.3, 0.1, 0.03):
          m = HistGradientBoostingClassifier(learning_rate=lr, max_iter=2000, random_state=0).fit(X_tr, y_tr)
      ```

      ```plaintext
      learning_rate  n_iter_  test_logloss  test_auc  test_ap  fit_s   (early_stopping='auto', 15000 rows)
               1.00       10        1.0111     0.510    0.087   0.11
               0.30       14        0.1312     0.787    0.248   0.11
               0.10       25        0.1161     0.831    0.320   0.15
               0.03       59        0.1164     0.831    0.334   0.30

      validation_score_ (negative log loss) first / best / last: -0.1506 -0.133 -0.1351  best at iteration 15 of 25
      early_stopping=False, 2000 iterations: test logloss 0.3459  AUC 0.747  AP 0.198
      is_categorical_: [False, False, False, False, True, True]
      ```

      - At ν = 1 each tree overshoots; the validation loss gets worse from the start and the model is useless
        (AUC 0.51). At 0.1 and 0.03 the scores are the best in this lesson, and a smaller rate needs more
        iterations (25, then 59) - ESL's trade-off, measured.
      - At ν = 0.1 the best validation loss came at iteration 15; the model stopped 10 iterations later, at 25,
        and keeps all 25 trees (scikit-learn does not roll back to the best one).
      - **Without** early stopping, 2000 iterations overfit badly: test AP 0.198 instead of 0.320.
      - `is_categorical_` shows the two pandas `category` columns were treated as categorical
        (`categorical_features="from_dtype"` is the default).

      **Categories and missing values.** The same model with three encodings, and with 10% of `card_age_days`
      blanked out:

      ```plaintext
      encoding        columns  n_iter_  test_auc  test_ap
      native                6       25     0.831    0.320
      ordinal codes         6       21     0.824    0.329
      one-hot              17       32     0.827    0.324

      10% of card_age_days missing, no imputer: test AUC 0.817  AP 0.289
      LogisticRegression: Input X contains NaN.
      RandomForestClassifier with NaN fitted: 17 features
      ```

      On eight merchant categories the three encodings are within noise of each other; native support matters
      most with many categories, where one-hot creates hundreds of sparse columns (each categorical feature may
      have at most `max_bins` categories, and categories unseen during fit are treated as missing values). Missing values need no
      imputer: during training each split learns whether rows with a gap go left or right. `LogisticRegression`
      refuses NaN; in scikit-learn 1.9.1 `RandomForestClassifier` also accepts it (its API page describes the
      same native support).

      **Other libraries.** XGBoost, LightGBM and CatBoost are separate gradient-boosting libraries with the
      same core idea and many extra options; scikit-learn's histogram estimators were "inspired by LightGBM".
      Learn the idea here; check each library's own documentation for its parameters.

  - id: importances
    kind: internals
    concepts: [tree-feature-importance]
    title: Feature importance - two numbers that disagree
    body: |
      The first question about a fraud model is "what does it look at?". Tree ensembles offer two answers:

      - **Impurity-based importance** (`feature_importances_`, also called **MDI**, mean decrease in impurity):
        the total impurity decrease of every split on that feature, weighted by the rows reaching it, averaged
        over the trees and normalised to sum to 1. It is free, and computed **on the training data**.
      - **Permutation importance** (`sklearn.inspection.permutation_importance`): the drop in a score when one
        column is shuffled, breaking its link to the label, averaged over repeats. It works for any model and
        should be computed **on held-out data**.

      To see the difference, two columns of pure noise were added to the SandPay data: `random_num` (a normal
      random number - many distinct values) and `random_cat` (0, 1 or 2). A forest of 300 fully grown trees:

      ```plaintext
      forest, fully grown trees: train AUC 1.000  test AUC 0.804
      feature                           MDI MDI rank  perm test    +/- perm train
      amount                          0.208        2     0.0359 0.0070     0.0123
      card_age_days                   0.231        1     0.1388 0.0087     0.0454
      hour                            0.150        4     0.0870 0.0100     0.0243
      attempts_24h                    0.046        5     0.0308 0.0040     0.0094
      merchant_category_electronics   0.014        8     0.0271 0.0044     0.0069
      country_IN                      0.014        9     0.0092 0.0033     0.0005
      random_num                      0.191        3     0.0003 0.0044     0.0029
      random_cat                      0.042        6    -0.0015 0.0047     0.0004
      ```

      MDI ranks the **noise column third**, above `hour` and `attempts_24h`, because deep trees keep splitting on
      its 15000 distinct values to separate the last few training rows. Permutation importance on the test set
      (AUC drop, 10 repeats, +/- one standard deviation) gives it 0.0003 ± 0.0044 - nothing. This is the
      scikit-learn guide's warning: MDI "can give high importance to features that may not be predictive on
      unseen data when the model is overfitting" and is "strongly biased and favor high cardinality features".
      Regularising the trees (`min_samples_leaf=20`) shrinks the noise column's MDI from 0.191 to 0.088, still
      rank 4 - better, not fixed.

      **Correlated features share the credit.** Adding `amount_eur`, a near-copy of `amount` (correlation
      0.99996, which the script prints rounded as 1.0):

      ```plaintext
      with a near-copy amount_eur (corr 1.0 )
      amount          MDI 0.099  perm test 0.0053
      amount_eur      MDI 0.105  perm test 0.0044
      card_age_days   MDI 0.304  perm test 0.1324
      hour            MDI 0.208  perm test 0.0561
      ```

      Before the copy, amount's permutation importance was 0.0305 (`min_samples_leaf=20` forest). Now each copy
      scores about 0.005: shuffle one and the model still reads the other. A naive reading says "amount barely
      matters". The guide's fix: cluster correlated features and keep one per cluster, or permute them together.

      Neither number is **causal**. "The model relies on card age" is a statement about the model, not a proof
      that card age causes fraud.

  - id: importance-code
    kind: code
    concepts: [tree-feature-importance]
    title: The importance experiment
    collapsed: true
    body: |
      ```python
      from sklearn.inspection import permutation_importance

      rng = np.random.default_rng(42)
      def add_noise(X):
          X = X.copy()
          X["random_num"] = rng.normal(size=len(X))
          X["random_cat"] = rng.integers(0, 3, size=len(X)).astype(float)
          return X

      X_tr2, X_te2 = add_noise(X_tr), add_noise(X_te)
      model = RandomForestClassifier(n_estimators=300, random_state=0, n_jobs=2).fit(X_tr2, y_tr)
      mdi = pd.Series(model.feature_importances_, index=X_tr2.columns)
      pt = permutation_importance(model, X_te2, y_te, scoring="roc_auc", n_repeats=10, random_state=0, n_jobs=2)
      perm = pd.Series(pt.importances_mean, index=X_tr2.columns)   # pt.importances_std is the +/- column
      ```

      Permutation importance re-scores the model `n_features x n_repeats` times - here 19 x 10 predictions of a
      300-tree forest - so it is the slowest step in the lesson. Use a sample of the test rows if it is too slow,
      and report the spread.

  - id: when
    kind: when
    concepts: [bagging-and-random-forests, gradient-boosting]
    title: Which model when
    body: |
      Three comparisons, same splits as before (code: the `ev` helper fits, times and scores each model):

      ```plaintext
      SandPay data (thresholds and an interaction):
      logistic regression (scaled)             AUC 0.764  AP 0.119  fit  0.04s
      random forest (300, min_samples_leaf=5)  AUC 0.819  AP 0.327  fit  3.32s
      HistGradientBoosting (defaults)          AUC 0.827  AP 0.324  fit  0.19s
      logistic regression + 3 hand-made features AUC 0.845  AP 0.370  fit  0.03s

      A truly linear problem (logit linear in 5 numeric features, 20000 rows):
      positive rate 0.1036
      logistic regression                      AUC 0.853  AP 0.453  fit  0.02s
      random forest (300, min_samples_leaf=5)  AUC 0.838  AP 0.424  fit  6.62s
      HistGradientBoosting (defaults)          AUC 0.841  AP 0.420  fit  0.23s

      Extrapolation: fee = 0.3 + 0.02 * amount, trained on amounts 0-1000
      LinearRegression                 10.32   20.30   40.27  100.17   (true: 10.30 20.30 40.30 100.30 )
      RandomForestRegressor            10.69   20.21   20.21   20.21   (true: 10.30 20.30 40.30 100.30 )
      HistGradientBoostingRegressor    10.36   20.23   20.23   20.23   (true: 10.30 20.30 40.30 100.30 )

      Speed on 100000 rows (one-hot, 17 features):
      train rows 100000
      GradientBoostingClassifier (100 trees)   AUC 0.818  AP 0.306  fit 17.19s
      HistGradientBoostingClassifier (max_iter=100, no early stop) AUC 0.815  AP 0.300  fit  1.17s
      ```

      What each block says:

      - **Thresholds and interactions**: both ensembles beat plain logistic regression by a wide margin (AP 0.32
        against 0.12). But logistic regression with three hand-made features (`new_card_at_night`,
        `amount_over_400`, `two_plus_attempts`) beats them all - because here we *know* the true rules. Trees
        find structure you don't know; when you do know it, encode it.
      - **A linear problem**: when the truth is a weighted sum, logistic regression wins, and the trees approximate
        a smooth slope with many steps. Trees are a strong default, not a law.
      - **Extrapolation**: every amount in training was below 1000. At 2000 and 5000 both tree models predict
        about 20.2 - the value of their last leaf - while the linear model follows the trend. A tree cannot
        predict outside the range of targets it saw. If a feature will drift beyond its training range (amounts
        in a new, richer market), trees fail silently.
      - **Speed**: on 100000 rows the histogram version fitted 100 trees in 1.2 s against 17.2 s, with the same
        scores - why it is the default choice for larger data.

      | Situation | First choice | Why |
      | --- | --- | --- |
      | Tabular data, mixed types, interactions | `HistGradientBoostingClassifier` / `Regressor` | usually the most accurate; fast; handles NaN and categories |
      | Want good results with almost no tuning, or an OOB estimate | `RandomForestClassifier` | hard to break; more trees never hurt accuracy |
      | Rules a person must read or approve | one pruned `DecisionTreeClassifier` | readable - at a cost in accuracy |
      | Relationship close to linear, few rows, or extrapolation needed | linear or logistic regression | smooth, extrapolates, cheap |
      | Images, audio, text | neural networks | trees cannot use the structure of pixels or words |

  - id: comparison-code
    kind: code
    concepts: [bagging-and-random-forests, gradient-boosting]
    title: The comparison code
    collapsed: true
    body: |
      ```python
      def ev(name, m, a=X_tr, b=X_te, ya=y_tr, yb=y_te):
          t0 = time.perf_counter(); m.fit(a, ya); dt = time.perf_counter() - t0
          p = m.predict_proba(b)[:, 1]
          print(f"{name:40s} AUC {roc_auc_score(yb, p):.3f}  AP {average_precision_score(yb, p):.3f}  fit {dt:5.2f}s")

      ev("logistic regression (scaled)", make_pipeline(StandardScaler(), LogisticRegression(max_iter=2000)))
      ev("random forest (300, min_samples_leaf=5)",
         RandomForestClassifier(n_estimators=300, min_samples_leaf=5, random_state=0, n_jobs=2))
      ev("HistGradientBoosting (defaults)", HistGradientBoostingClassifier(random_state=0))

      def eng(X):
          X = X.copy()
          X["new_card_at_night"] = ((X["card_age_days"] < 30) & (X["hour"] < 6)).astype(float)
          X["amount_over_400"] = (X["amount"] > 400).astype(float)
          X["two_plus_attempts"] = (X["attempts_24h"] >= 2).astype(float)
          return X

      # extrapolation
      rng = np.random.default_rng(5)
      ...  # (the linear problem draws from rng first)
      amt = rng.uniform(0, 1000, 2000).reshape(-1, 1)
      fee = 0.3 + 0.02 * amt.ravel() + rng.normal(0, 0.5, 2000)
      q = np.array([[500.0], [1000.0], [2000.0], [5000.0]])
      RandomForestRegressor(n_estimators=200, random_state=0, n_jobs=2).fit(amt, fee).predict(q)
      ```

      The timings were measured with two threads on one machine; compare them with each other, not with yours.

  - id: steps
    kind: steps
    concepts: [tree-splits-and-pruning, bagging-and-random-forests, gradient-boosting, tree-feature-importance]
    title: A workflow for a tree model on tabular data
    body: |
      1. **Split first** - train and test, stratified, grouped or by time, as the evaluation lesson describes.
      2. **Baselines**: a `DummyClassifier`, a logistic regression, and a shallow tree (depth 2-3) whose rules you
         print and sanity-check with a domain expert.
      3. **Fit `HistGradientBoostingClassifier`** with defaults. Keep categories as pandas `category` dtype and
         leave NaN in place. Check `n_iter_` - if it equals `max_iter`, early stopping never triggered.
      4. **Fit a `RandomForestClassifier`** (a few hundred trees, `n_jobs` set) as a second opinion; read the OOB
         AUC or AP from `oob_decision_function_`, not `oob_score_`.
      5. **Tune by cross-validation** on the training rows: for boosting, `learning_rate` (0.03-0.1),
         `max_leaf_nodes` or `max_depth`, `min_samples_leaf`, `l2_regularization`; for forests,
         `max_features` and `min_samples_leaf`. Score with the metric you will report.
      6. **Score once** on the test set; report AUC and AP with their baselines, and precision and recall at the
         chosen threshold.
      7. **Explain** with permutation importance on held-out data, with repeats; check correlated features; never
         call it causal.
      8. **Check the edges**: values outside the training range, new categories, a column that is suddenly all
         NaN.

  - id: example
    kind: example
    concepts: [gradient-boosting, tree-feature-importance]
    title: "Scenario: the model that thinks the merchant id matters"
    body: |
      A SandPay data scientist replaces the logistic-regression fraud score with a gradient-boosted model. In
      review you see:

      - Test AP rose from 0.12 to 0.33 - believable for data with thresholds and interactions.
      - The importance chart (`feature_importances_` of a `GradientBoostingClassifier`) lists **`merchant_id`**
        (an integer with 40000 values) in second place.
      - The model was trained on January-October and tested on a random 20% of the same months.

      What a tester checks:

      1. **Is merchant_id meaningful as a number?** Merchant 31337 is not "more" than merchant 4. A tree can still
         carve id ranges that happen to hold risky merchants - memorising merchants rather than learning fraud.
      2. **Is the high importance real?** MDI favours features with many distinct values. Recompute with
         permutation importance on the test rows: if shuffling `merchant_id` barely changes AP, the chart was
         misleading.
      3. **Does it generalise to new merchants?** A random split puts the same merchants on both sides. Evaluate
         on November, and separately on merchants never seen in training. If AP drops sharply there, the model
         leans on identity.
      4. **What does the model do with a new merchant?** Its id is larger than any in training, so it lands in
         the last leaf of every split on `merchant_id` - extrapolation by the last constant, never a deliberate
         choice.

      Evidence to keep: both importance tables, the time-split and new-merchant scores with counts, and the
      decision on whether to drop the id or replace it with honest merchant features (age, category, past
      chargeback rate computed only from earlier data).

  - id: tests
    kind: tests
    concepts: [tree-splits-and-pruning, bagging-and-random-forests, gradient-boosting, tree-feature-importance]
    title: Checks for a tree model before it ships
    body: |
      | Check | Positive / negative | Expected result | Evidence |
      | --- | --- | --- | --- |
      | Training vs validation score | negative | gap small; training AP far from 1.0 for a single tree | the depth or pruning table |
      | Early stopping triggered | positive | `n_iter_ < max_iter`, best validation iteration logged | `validation_score_` |
      | Forest has enough trees | positive | OOB AP flat over the last doubling of `n_estimators` | OOB table |
      | Noise column | negative | a random column gets near-zero permutation importance | importance table with spread |
      | Monotone sanity | positive | raising `attempts_24h` with all else fixed never lowers the fraud score much | a small grid of predictions |
      | Out-of-range input | negative | amount 10x the training maximum - prediction equals the last leaf; flagged in monitoring | the prediction and the training range |
      | Missing value | negative | a payment with `card_age_days` = NaN gets a score, not an error | the prediction |
      | Unseen category | negative | a new merchant category is handled (HistGradientBoosting treats unknown categories like missing values) and logged | the prediction and the log |
      | Reproducibility | positive | the same seed and data give identical predictions | two runs compared |

      For the monotone check, HistGradientBoosting can **enforce** it with `monotonic_cst` - useful when a
      regulator expects "more attempts never lowers risk"; check the API page before relying on it.

  - id: mistakes
    kind: mistakes
    concepts: [tree-splits-and-pruning, bagging-and-random-forests, gradient-boosting, tree-feature-importance]
    title: Common mistakes and how to debug them
    body: |
      - **Shipping a fully grown tree.** Training AP 1.000, test 0.064. Always prune or limit depth, and always
        compare with an ensemble.
      - **Choosing depth or ccp_alpha on the test set.** It is a hyperparameter: cross-validate it.
      - **Scaling features for trees.** Harmless but pointless - splits compare values, so any monotonic
        transformation gives the same tree. (It still matters for the linear model next to it in a comparison.)
      - **Reading `oob_score_` on imbalanced data.** It is accuracy - 0.965 here, the always-genuine baseline.
      - **Too few trees with OOB.** Rows in every bootstrap sample have no OOB prediction; scikit-learn warns.
        Use more trees or exclude those rows.
      - **Boosting without early stopping, or with `learning_rate=1.0`.** 2000 iterations: AP 0.198 instead of
        0.320; rate 1.0: AUC 0.51. Lower the rate and let validation data choose the number of trees.
      - **Trusting `feature_importances_`.** A random column ranked third. Use permutation importance on
        held-out data, with repeats.
      - **Calling a shared importance "unimportant".** Correlated copies split the credit - permute them
        together.
      - **Expecting trees to extrapolate.** Beyond the training range a tree returns its edge leaf. Check the
        ranges of production inputs.
      - **Ordinal-coding categories for a linear model** (or for any model that reads order). Codes 0-7 for
        merchant categories invent an order; for HistGradientBoosting use the native support instead.

      **Debugging method**: when a tree model scores worse than expected, print the training and validation
      scores side by side (variance or bias?), then the leaf count or `n_iter_`, then the first two levels of
      a shallow tree (are the splits sensible?), then a permutation-importance table (is it leaning on an id or a
      leaked column?).

  - id: tradeoffs
    kind: tradeoffs
    concepts: [bagging-and-random-forests, gradient-boosting, tree-feature-importance]
    title: Limitations and alternatives
    body: |
      - **Interpretability.** One small tree is readable; a 300-tree forest is not. Explanations of ensembles
        (permutation importance, partial dependence, SHAP values) describe the model's behaviour approximately -
        they are not the rules themselves.
      - **Probability calibration.** A forest's probabilities are averages of leaf shares, not calibrated
        probabilities; if the score is used as a probability (expected loss), check a reliability curve and
        calibrate it if needed (`CalibratedClassifierCV`).
      - **Size and latency.** Deep forests are large - the guide gives the default model size as O(M x N log N)
        for M trees and N rows. Boosted models with shallow trees are smaller and faster to score.
      - **Smooth or extrapolating relationships** suit linear models; **perceptual data** suits neural networks
        (the next module).
      - **Forest vs boosting.** Forests are forgiving and parallel; boosting is usually a little more accurate
        but needs early stopping and a tuned learning rate, and its trees must be built in sequence.

  - id: summary
    kind: summary
    concepts: [tree-splits-and-pruning, bagging-and-random-forests, gradient-boosting, tree-feature-importance]
    title: Quick reference
    body: |
      - **Split choice**: largest impurity decrease, H(node) - (n_L/n) H(L) - (n_R/n) H(R); Gini = sum p(1 - p),
        entropy = -sum p log2 p, regression = variance. Greedy, one feature and threshold at a time.
      - **A full tree memorises** - limit `max_depth` / `min_samples_leaf`, or prune with `ccp_alpha`, chosen by
        CV. Weakest link: smallest (R(t) - R(T_t)) / (leaves - 1).
      - **Bagging**: bootstrap samples, average; about 37% of rows are out-of-bag for each tree.
      - **Random forest**: bagging plus `max_features` per split; variance ρσ² + (1 - ρ)σ²/B - decorrelate the
        trees. More trees never hurt accuracy.
      - **Boosting**: shallow trees fitted in sequence to the negative gradient (residuals), scaled by the
        learning rate; small rate, early stopping. Can overfit with too many trees.
      - **HistGradientBoosting**: binned, fast, native NaN and categories, early stopping by default above
        10000 rows.
      - **Importance**: MDI is training-based and favours many-valued features; permutation importance on
        held-out data, with repeats; correlated features share credit; neither is causal.
      - **Trees do not extrapolate.**

exercises:
  - id: gini-by-hand
    type: mcq
    concept: tree-splits-and-pruning
    skill: application
    title: Which split does CART choose?
    prompt: |
      A node holds 100 payments: 80 genuine and 20 fraud (Gini = 1 - 0.8² - 0.2² = 0.32). Two candidate
      splits:

      - **Split A** (`amount <= 400`): left 70 genuine + 5 fraud (75 rows); right 10 genuine + 15 fraud (25 rows).
      - **Split B** (`hour <= 5`): left 40 genuine + 10 fraud (50 rows); right 40 genuine + 10 fraud (50 rows).

      Which split does a Gini tree choose, and what is its impurity decrease (to two decimals)?
    options:
      - id: a
        text: Split A, decrease about 0.11.
        feedback: "Correct - left Gini = 1 - (70/75)² - (5/75)² = 0.124, right = 1 - 0.4² - 0.6² = 0.48; weighted 0.75 x 0.124 + 0.25 x 0.48 = 0.213; decrease 0.32 - 0.213 = 0.107. Split B decreases nothing."
      - id: b
        text: Split B, because its children are the same size.
        feedback: Balanced children are not a goal. Both of B's children have the parent's 20% fraud rate, so the weighted impurity is still 0.32 - a decrease of zero.
      - id: a-unweighted
        text: Split A, decrease about 0.02 - the average of the two children is 0.30.
        feedback: That averages the children without weighting them by their rows. CART weights each child by its share of the node (75% and 25%).
      - id: none
        text: Neither - both leave fraud on both sides, so neither reduces impurity.
        feedback: A split doesn't need pure children to help. A concentrates fraud on the right (60%) and removes it from the left (7%), which lowers the weighted impurity.
    correct: [a]
    hints:
      - Compute each child's Gini from its class shares.
      - Weight the children by 75/100 and 25/100 (for A) before subtracting from 0.32.
    solution: |
      Split A: left Gini = 1 - 0.9333² - 0.0667² = 0.1244; right Gini = 1 - 0.4² - 0.6² = 0.48. Weighted:
      0.75 x 0.1244 + 0.25 x 0.48 = 0.0933 + 0.12 = 0.2133. Decrease = 0.32 - 0.2133 = 0.107 (about 0.11).
      Split B: both children are 80/20, so each has Gini 0.32 and the decrease is 0. The tree takes A.
    followUp: |
      Compute the entropy decrease of split A (base 2). Does entropy choose the same split?

  - id: read-the-depth-table
    type: mcq
    concept: tree-splits-and-pruning
    skill: analysis
    title: Read the depth table
    prompt: |
      From this lesson's run (test AP baseline 0.035):

      ```plaintext
      depth  leaves  train_ap  test_ap
          3       8     0.217    0.257
          6      49     0.304    0.236
         12     296     0.606    0.135
       None     898     1.000    0.064
      ```

      A colleague says "depth 12 is best - its training AP is three times depth 3's". What is the right
      response?
    options:
      - id: variance
        text: Depth 12 overfits - training AP rises while test AP falls; choose depth (or ccp_alpha) by cross-validation, which here points to a small tree.
        feedback: Correct - a widening gap between training and held-out scores is variance. The training score measures memorisation.
      - id: more-data
        text: Depth 12 is right, but the test set is too small to show it.
        feedback: The test set holds 5000 rows with 175 fraud; the fall from 0.257 to 0.135 is far larger than its noise, and it follows a steady trend over depths.
      - id: underfit
        text: All of them underfit, because no test AP reaches 0.5.
        feedback: The ceiling is set by the noise in the labels (most risky payments are still genuine). The pattern of training up, test down is overfitting, not underfitting.
      - id: none-best
        text: The full tree is best because a training AP of 1.000 means it found every fraud.
        feedback: It found every fraud **it was trained on** - one leaf per few rows. On new payments its AP is 0.064, barely above the 0.035 baseline.
    correct: [variance]
    hints:
      - Compare how training and test AP move as depth grows.
    solution: |
      Training AP rises monotonically with depth because each extra level fits the training rows more closely.
      Test AP peaks at depth 3-4 and falls after it. Choose the complexity on validation folds (the CV search in
      this lesson picked ccp_alpha 0.0002, 9 leaves, test AP 0.255) - or use an ensemble.

  - id: trees-code
    type: coding
    concept: tree-splits-and-pruning
    skill: application
    title: Build CART's split search and the weakest link
    prompt: |
      In `trees.py`, the draft of `impurity` is right for Gini only, `split_impurity` forgets to weight the
      children, and three functions are missing. With NumPy only, make `impurity` handle Gini, base-2 entropy,
      squared error, an empty node and an unknown criterion; weight `split_impurity` by child size; write
      `best_threshold` (midpoints between distinct sorted values, `min_samples_leaf`, ties to the smallest
      threshold), `best_split` (ties to the lowest column) and `effective_alpha` (scikit-learn's weakest-link
      formula). The tests compare your numbers with scikit-learn's own trees: root impurities, stumps on the
      SandPay data and the first alpha of `cost_complexity_pruning_path`.
    project: ai
    files:
      - exercises/ml_foundations/trees.py
    test: tests/ml_foundations/test_trees.py
    command: .venv/bin/python -m pytest tests/ml_foundations/test_trees.py
    hints:
      - "np.unique(y, return_counts=True) gives the class counts; p = counts / counts.sum(). For entropy use np.log2 - only classes present appear, so there is no log of 0."
      - "Candidate thresholds: v = np.unique(x); (v[:-1] + v[1:]) / 2. For each, left = x <= threshold."
      - Skip a candidate when either side has fewer than min_samples_leaf rows; replace the best only when the decrease is strictly larger, which keeps the smallest threshold on a tie.
      - "effective_alpha: R(t) = node_samples / total * impurity; R(T_t) = the same sum over the leaves; divide the difference by (leaves - 1)."
    modelAnswer: |
      ```python
      def best_threshold(x, y, criterion="gini", min_samples_leaf=1):
          x = np.asarray(x, dtype=float)
          y = np.asarray(y)
          parent = impurity(y, criterion)
          values = np.unique(x)
          best = (None, 0.0)
          for low, high in zip(values[:-1], values[1:]):
              threshold = (low + high) / 2
              left = x <= threshold
              n_left = int(left.sum())
              if n_left < min_samples_leaf or len(x) - n_left < min_samples_leaf:
                  continue
              decrease = parent - split_impurity(y[left], y[~left], criterion)
              if best[0] is None or decrease > best[1]:
                  best = (float(threshold), float(decrease))
          return best


      def effective_alpha(node_impurity, node_samples, leaf_impurities, leaf_samples, total_samples):
          if len(leaf_impurities) != len(leaf_samples) or len(leaf_samples) < 2:
              raise ValueError("a branch has at least two leaves")
          r_node = node_samples / total_samples * node_impurity
          r_branch = sum(n / total_samples * imp for imp, n in zip(leaf_impurities, leaf_samples))
          return (r_node - r_branch) / (len(leaf_samples) - 1)
      ```

      The threshold search is O(distinct values x rows) - fine for learning; scikit-learn sorts once and updates
      class counts incrementally as the threshold moves. Weighting by child size is what makes a tiny pure leaf
      count for little. The full solution is in `solutions/ml_foundations/trees.py`.
    solution: |
      Count classes with np.unique for Gini and log2 entropy and use the variance for regression; weight the
      children by their row share; scan midpoints of sorted distinct values, skip candidates that leave a child
      under min_samples_leaf, keep strict improvements; loop over columns for best_split; and compute
      (R(t) - R(T_t)) / (leaves - 1) with costs weighted by total_samples.
    rubric:
      - Every test in tests/ml_foundations/test_trees.py passes.
      - Only NumPy in the functions you wrote - no scikit-learn.
      - Entropy uses log base 2, as scikit-learn's tree_.impurity does.
      - Ties go to the smallest threshold and the lowest column index.
      - You can explain why the same weighted formula explains both the ESL (400, 400) example and the SandPay root.
    followUp: |
      Write `grow(X, y, max_depth)` that calls `best_split` recursively and returns nested dicts; compare its
      depth-2 tree with the `export_text` output in this lesson.

  - id: oob-rows
    type: mcq
    concept: bagging-and-random-forests
    skill: recall
    title: Out-of-bag rows
    prompt: |
      A random forest is trained on 15000 rows with `bootstrap=True`. Roughly what share of the training rows
      does one tree never see, and what are they used for?
    options:
      - id: third
        text: About 37% (1/e); averaging, for each row, only the trees that did not see it gives an out-of-bag validation estimate.
        feedback: Correct - (1 - 1/15000)^15000 = 0.3679.
      - id: half
        text: About 50%, because each tree is fitted on half the data.
        feedback: A bootstrap sample has n rows, not n/2 - but drawn with replacement, so some rows repeat and about 37% never appear.
      - id: none
        text: None - a bootstrap sample has as many rows as the training set, so every row is used.
        feedback: The sample has n draws, but duplicates mean only about 63% of distinct rows appear.
      - id: test
        text: About 37%, and they replace the test set, so no test split is needed.
        feedback: The share is right, but OOB estimates replace a validation split for choices such as the number of trees - the final report still needs a test set the model never influenced.
    correct: [third]
    hints:
      - Each of the n draws misses a given row with probability 1 - 1/n.
    solution: |
      The row is missed by all n draws with probability (1 - 1/n)^n, which is 0.3679 for n = 15000 - 1/e.
      Averaging only the trees that never saw a row gives an honest prediction for it; scored over all rows,
      that is the OOB estimate, slightly pessimistic because each row gets about a third of the trees.

  - id: max-features-effect
    type: mcq
    concept: bagging-and-random-forests
    skill: analysis
    title: What does max_features buy?
    prompt: |
      Real output from the lesson (300 trees each):

      ```plaintext
      forest max_features=None  mean tree-tree corr 0.244  test AP 0.226
      forest max_features=sqrt  mean tree-tree corr 0.184  test AP 0.269
      forest max_features=1     mean tree-tree corr 0.156  test AP 0.219
      ```

      Which explanation fits these three lines?
    options:
      - id: tradeoff
        text: Fewer candidate features per split makes trees less correlated, which helps the average, but each tree gets weaker; the best balance is in the middle.
        feedback: Correct - ESL's ρσ² term falls with the correlation, while Breiman's "strength" of each tree falls too. Cross-validate max_features.
      - id: lower-better
        text: Lower correlation is always better, so max_features=1 should win; the result is noise.
        feedback: Correlation is only half of the story. With one random column per split, many splits are on weak features, and the trees' individual accuracy drops.
      - id: speed
        text: max_features only changes the training time; the AP differences come from different random seeds.
        feedback: It changes which splits each tree can make; the tree-tree correlation moves systematically with it.
      - id: none-bagging
        text: max_features=None is a random forest with the most information per split, so it should be the most accurate.
        feedback: With all features, every tree picks the same strong splits at the top - this is plain bagging, and the trees stay correlated.
    correct: [tradeoff]
    hints:
      - What does ESL's equation 15.1 say the averaged variance depends on?
      - And what happens to one tree when it can choose from only one random column?
    solution: |
      The variance of an average of B trees is ρσ² + (1 - ρ)σ²/B. Restricting the features per split lowers ρ
      (0.244, 0.184, 0.156) but makes each tree weaker. `"sqrt"` balanced the two and gave the best AP; the right
      value for other data comes from cross-validation.

  - id: forest-eval-debug
    type: debug
    concept: bagging-and-random-forests
    skill: analysis
    title: Find the problems in the forest report
    prompt: |
      A teammate reports "OOB score 0.965 with only 10 trees, so we can ship a small, fast forest" from this code.
      The data has 3.5% fraud. Click **every** line that makes the report wrong or misleading.
    language: python
    code: |
      X_tr, X_te, y_tr, y_te = train_test_split(X, y, test_size=0.25, stratify=y, random_state=0)
      scaler = StandardScaler().fit(X_tr)
      X_tr_s = scaler.transform(X_tr)
      rf = RandomForestClassifier(n_estimators=10, oob_score=True, random_state=0)
      rf.fit(X_tr_s, y_tr)
      oob = rf.oob_decision_function_[:, 1]
      print("OOB AP", average_precision_score(y_tr, oob))
      print("OOB score", rf.oob_score_)
    correctLines: [7, 8]
    lineNotes:
      - line: 2
        note: Scaling is pointless for trees but leaks nothing - it is fitted on training rows only.
      - line: 4
        note: Ten trees is few, and it explains the problem on line 7, but the line itself is a valid configuration to evaluate.
    hints:
      - What metric is oob_score_ for a classifier by default, and what does it score for "never fraud"?
      - With 10 trees, does every training row have an out-of-bag prediction?
    solution: |
      - **Line 8**: `oob_score_` is **accuracy**. 0.965 is exactly what "always genuine" scores on 3.5% fraud;
        it says nothing about catching fraud.
      - **Line 7**: with 10 trees about 149 of the 15000 rows were in every bootstrap sample and have no OOB
        prediction (scikit-learn warns). Their entries in `oob_decision_function_` must be excluded, not scored
        as if they were real predictions.

      Fix: use enough trees that every row is out-of-bag at least once (30 was enough here), mask rows without
      OOB votes, report OOB AP and AUC with the 0.035 baseline, and compare 10, 100 and 300 trees before
      claiming the small forest is enough (OOB AP 0.197 at 10 trees against 0.254 at 300).

  - id: ensembles-code
    type: coding
    concept: gradient-boosting
    skill: application
    title: Build bagging, boosting and permutation importance yourself
    prompt: |
      In `ensembles.py`, using scikit-learn's single trees only: compute the out-of-bag probability, draw
      bootstrap samples and their out-of-bag indices, fit a small random forest that remembers each tree's
      sample, average probabilities (the draft takes a majority vote - fix it), compute out-of-bag
      probabilities (`NaN` for rows that were in every sample), write gradient boosting for squared error and its
      predictions, permutation importance, and HistGradientBoosting's early-stopping rule. The tests replay your
      random draws, compare your boosting with `GradientBoostingRegressor` and your stopping point with
      `HistGradientBoostingClassifier.n_iter_`.
    project: ai
    files:
      - exercises/ml_foundations/ensembles.py
    test: tests/ml_foundations/test_ensembles.py
    command: .venv/bin/python -m pytest tests/ml_foundations/test_ensembles.py
    hints:
      - The draft out_of_bag_probability returns 1/n; the chance a row is missed by all n draws is (1 - 1/n) ** n.
      - "Out-of-bag indices: a boolean mask of length n, set True at the sampled indices, then np.flatnonzero(~mask)."
      - "Boosting: F = np.full(n, y.mean()); in the loop fit a DecisionTreeRegressor to y - F, then F += learning_rate * tree.predict(X)."
      - "Early stopping: for i from n_iter_no_change to the end, stop when max(scores[i - k + 1 : i + 1]) <= scores[i - k] + tol, with k = n_iter_no_change."
    modelAnswer: |
      ```python
      def fit_boosting(X, y, n_trees=100, learning_rate=0.1, max_depth=3):
          X = np.asarray(X, dtype=float)
          y = np.asarray(y, dtype=float)
          init = float(y.mean())
          F = np.full(len(y), init)
          trees = []
          for _ in range(n_trees):
              tree = DecisionTreeRegressor(max_depth=max_depth, random_state=0).fit(X, y - F)
              F += learning_rate * tree.predict(X)
              trees.append(tree)
          return init, trees


      def out_of_bag_proba(forest, X):
          X = np.asarray(X, dtype=float)
          total = np.zeros(len(X))
          count = np.zeros(len(X))
          for tree, sample in forest:
              oob = out_of_bag_indices(len(X), sample)
              if len(oob):
                  total[oob] += tree_proba(tree, X[oob])
                  count[oob] += 1
          with np.errstate(invalid="ignore"):
              return np.where(count > 0, total / np.where(count > 0, count, 1), np.nan)
      ```

      Boosting fits each tree to the residuals - the negative gradient of squared error - and adds a shrunken
      step; with the same settings this reproduces `GradientBoostingRegressor`'s predictions. OOB predictions
      keep a running sum and count per row, and a row with count 0 stays NaN so it can be excluded rather than
      scored as "no fraud". The full solution is in `solutions/ml_foundations/ensembles.py`.
    solution: |
      Use (1 - 1/n)^n; draw rng.integers(0, n, size=n) and mask the drawn indices to find the out-of-bag ones;
      fit each tree on its bootstrap sample with a seed from the same generator; average probabilities; average
      only out-of-bag trees per row, NaN where there are none; boost residuals with shrinkage from the mean;
      shuffle one column at a time on a copy for permutation importance; and stop at the first iteration whose
      last n_iter_no_change scores never beat the reference by more than tol.
    rubric:
      - Every test in tests/ml_foundations/test_ensembles.py passes.
      - forest_proba averages probabilities, as scikit-learn does, instead of counting votes.
      - out_of_bag_proba returns NaN - never 0 - for rows without an out-of-bag tree.
      - permutation_importance never modifies the X passed in.
      - You can explain why boosting with learning_rate 0.1 needs more trees than with 1.0, and why that helps.
    followUp: |
      Add `subsample` to `fit_boosting` (fit each tree on a random half of the rows, as in stochastic gradient
      boosting) and compare the test error of 300 trees with and without it.

  - id: boosting-order
    type: order
    concept: gradient-boosting
    skill: recall
    title: One round of gradient boosting
    prompt: Put the steps of gradient boosting for squared error in order, starting before the first tree.
    items:
      - id: init
        text: Set every prediction F to the mean of y
      - id: residual
        text: Compute the residuals y - F (the negative gradient)
      - id: fit
        text: Fit a shallow regression tree to the residuals
      - id: shrink
        text: Add learning_rate times the tree's predictions to F
      - id: check
        text: Score the validation set and stop if it has not improved for n_iter_no_change rounds
    hints:
      - The tree is fitted to something computed from the current model.
    solution: |
      Start from a constant (the mean), then repeat: residuals of the current model, a tree fitted to them, a
      shrunken update, and an early-stopping check on held-out data.

  - id: learning-rate
    type: mcq
    concept: gradient-boosting
    skill: application
    title: Learning rate and number of trees
    prompt: |
      In the lesson's run, HistGradientBoosting with early stopping gave:

      ```plaintext
      learning_rate  n_iter_  test_ap
               1.00       10    0.087
               0.10       25    0.320
               0.03       59    0.334
      ```

      You must cut scoring latency in half and propose `learning_rate=0.3, max_iter=12` for a model that
      currently uses `learning_rate=0.1` and 25 iterations. What do you expect, and what do you do?
    options:
      - id: worse-check
        text: Expect a worse model (the 0.3 run reached AP 0.248 with early stopping); measure it on validation data and consider shallower trees or fewer features instead.
        feedback: Correct - a larger step with fewer trees usually generalises worse; the run showed AP 0.248 at 0.3. Latency can also be cut by smaller trees, which you must measure too.
      - id: same
        text: Expect the same model - learning_rate x iterations is about the same (0.3 x 12 = 3.6, 0.1 x 25 = 2.5).
        feedback: The product is not what matters. Larger steps overshoot and later trees cannot fully correct them - see the 1.0 run.
      - id: better
        text: Expect a better model, because a higher learning rate learns more per tree.
        feedback: Each tree contributes more, but that is exactly what makes the model overfit faster; the measured AP at 0.3 was lower.
      - id: no-stop
        text: Turn off early stopping so all 12 trees are used; that removes the risk.
        feedback: Early stopping chose the number of trees on held-out data; switching it off only removes the safety check.
    correct: [worse-check]
    hints:
      - Look at the 0.3 and 1.0 rows in the lesson's full table.
    solution: |
      ESL: smaller learning rates need more trees and generalise better. A faster model should be measured, not
      assumed. Try fewer or smaller trees at the same learning rate, measure AP on validation data and latency
      on realistic hardware, and choose with both numbers.

  - id: forest-or-boosting
    type: short
    concept: gradient-boosting
    skill: analysis
    title: Choose a model for merchant chargeback amounts
    prompt: |
      SandPay wants to predict the **amount** of chargebacks each merchant will receive next month, from 60
      columns: merchant category (200 values), country, age, monthly volume, refund rate and so on. Some columns
      have gaps for new merchants. Next year SandPay will onboard much larger merchants than any it has today.
      Which model family would you start with, and what one risk would you test explicitly?
    modelAnswer: |
      Start with `HistGradientBoostingRegressor`: tabular data with many interactions, a 200-value category
      (native categorical support instead of 200 one-hot columns; each categorical feature may have at most
      `max_bins` = 255 categories), and gaps it handles without an imputer. Use
      early stopping, cross-validate the learning rate and tree size, and compare with a random forest and a
      linear baseline.

      The explicit risk is **extrapolation**: trees predict a constant beyond the largest training volumes, so for
      the new, larger merchants the prediction would stop growing with volume. Test it: hold out the largest
      merchants by volume, train on the rest, and compare with a model that scales by volume (for example, predict
      chargebacks per unit of volume, or a linear model on log volume).
    rubric:
      - Picks gradient boosting (or a forest) for heterogeneous tabular data with reasons.
      - Uses native categorical and missing-value support rather than 200 one-hot columns and an imputer.
      - Names extrapolation beyond the training range as the main risk.
      - Proposes a concrete test (hold out the largest merchants) and a mitigation (a rate target or linear component).
    hints:
      - What does a tree predict for a value larger than anything it was trained on?
    solution: |
      HistGradientBoosting for the data's shape; test extrapolation on the largest merchants held out, and
      predict a rate per unit of volume (or add a linear component) if the trees flatten.

  - id: noise-column
    type: mcq
    concept: tree-feature-importance
    skill: analysis
    title: The random column ranks third
    prompt: |
      A forest of fully grown trees (train AUC 1.000, test AUC 0.804) reports these `feature_importances_`:
      `card_age_days` 0.231, `amount` 0.208, `random_num` 0.191, `hour` 0.150. `random_num` is pure noise
      added as a check. What do you conclude?
    options:
      - id: mdi-bias
        text: Impurity-based importance is computed on training data and favours many-valued columns; overfitted trees split on noise. Use permutation importance on held-out data.
        feedback: Correct - on the test set, permutation importance gave random_num 0.0003 ± 0.0044, effectively zero.
      - id: real
        text: The noise column carries hidden signal, because the model chose to split on it.
        feedback: It was generated independently of the label. Fully grown trees split on anything that separates the last few training rows.
      - id: drop-hour
        text: Drop hour, because it ranks below a noise column.
        feedback: On held-out data hour's permutation importance was 0.087, far above noise. The ranking, not hour, is wrong.
      - id: normalise
        text: Normalise the importances by each feature's variance to fix the ranking.
        feedback: The bias comes from how many split points a feature offers and from fitting to training noise; rescaling the numbers doesn't change which splits were made.
    correct: [mdi-bias]
    hints:
      - On which data is feature_importances_ computed?
    solution: |
      MDI adds up impurity decreases on the training rows. A continuous noise column offers thousands of
      thresholds, and deep trees use them to separate the last few rows, so it collects training "importance"
      that doesn't generalise. Permutation importance on test data measures what the model's predictions really
      depend on.

  - id: correlated-copy
    type: mcq
    concept: tree-feature-importance
    skill: application
    title: Two amounts, two small importances
    prompt: |
      Your feature set has `amount` and `amount_eur` (correlation 0.99996). Permutation importance on the test
      set gives each about 0.005, while `card_age_days` gets 0.13. A product manager asks whether "amount barely
      matters" to the model. What do you do?
    options:
      - id: group
        text: Explain that correlated copies share the credit; permute both columns together (or drop one and recompute) to measure what amount really contributes.
        feedback: Correct - without the copy amount's importance was 0.0305, six times what each copy shows.
      - id: agree
        text: Agree - permutation importance is unbiased, so amount barely matters.
        feedback: Permutation importance avoids MDI's cardinality bias, but when one copy is shuffled the model reads the other one, so each looks unimportant.
      - id: mdi
        text: Use feature_importances_ instead, which handles correlation.
        feedback: MDI also splits credit between the copies (0.099 and 0.105 here) and adds its own training-data bias.
      - id: drop-both
        text: Drop both columns, since neither is important.
        feedback: That would remove a real signal - before the copy was added, amount alone had a permutation importance of 0.0305.
    correct: [group]
    hints:
      - What can the model still read when only amount is shuffled?
    solution: |
      Shuffle groups of correlated features together, or keep one feature per cluster of correlated features (the
      scikit-learn guide's suggestion), and only then rank importances. Report that importance describes the
      model, not a cause.

  - id: tree-test-plan
    type: testdesign
    concept: tree-feature-importance
    skill: application
    title: Test plan for a boosted fraud model
    prompt: |
      SandPay will replace its rules with a `HistGradientBoostingClassifier` that scores every card payment.
      Inputs: amount, card age, hour, attempts in 24 h, merchant category (pandas category), country, device
      age (often missing). Design the tests you would run before sign-off: preconditions, steps, expected
      results and the evidence you keep.
    hints:
      - Think about values the model has never seen - larger amounts, new categories, gaps.
      - How will you show which inputs drive the score, honestly?
    modelAnswer: |
      **Preconditions:** a time-based split (train on earlier months, test on the latest), the trained model with
      its seed, the training ranges of every numeric feature and the list of known categories.

      **Tests:**

      1. **Early stopping and fit:** `n_iter_` < `max_iter`; training vs validation log loss logged; test AP
         and AUC reported with the fraud-rate baseline. Evidence: `validation_score_` and the score table.
      2. **Baselines:** the model beats the current rules and a logistic regression on the test months.
      3. **Out of range:** amounts at 2x, 10x and 100x the training maximum get the same score as the maximum
         (trees do not extrapolate) - flag such inputs in monitoring. Evidence: the predictions.
      4. **Missing values:** device age NaN returns a score; compare the score distribution with and without
         NaN.
      5. **Unseen category:** a new merchant category gets a score (treated like missing) and is logged.
      6. **Monotone sanity:** for 100 sampled payments, increasing attempts from 0 to 5 does not lower the
         score materially; if required, enforce with `monotonic_cst` and re-test.
      7. **Importance:** permutation importance on the test months with 10 repeats, plus a random noise column
         that must score about 0; correlated features permuted together.
      8. **Reproducibility:** retrain with the same seed and data and compare predictions.

      **Evidence:** the split dates and counts, score tables, the prediction grids for tests 3-6, the importance
      table with spreads, and the model and data versions.
    solution: |
      Split by time, check early stopping and baselines, probe out-of-range values, NaN and unseen categories,
      check monotone behaviour, compute permutation importance on held-out data with a noise column, and record
      reproducibility - keeping every table and prediction grid as evidence.
    rubric:
      - Uses a time-based split and reports AP and AUC with baselines.
      - Tests out-of-range inputs and expects a flat prediction (no extrapolation).
      - Tests missing values and unseen categories explicitly.
      - Uses permutation importance on held-out data, with a noise-column control.
      - Lists concrete evidence for each test.

  - id: interview-trees
    type: interview
    concept: bagging-and-random-forests
    skill: analysis
    title: "\"Random forest or gradient boosting - and why?\""
    prompt: |
      An interviewer for an ML engineering role asks: "For a fraud model on tabular data, would you use a random
      forest or gradient boosting? Explain how each one works and what could go wrong."
    modelAnswer: |
      Both are ensembles of decision trees, which suit tabular data because they model thresholds and
      interactions and need no scaling.

      A **random forest** fits many deep trees, each on a bootstrap sample and with a random subset of features
      at each split, and averages them. Deep trees have low bias and high variance; averaging decorrelated trees
      reduces variance - the variance of the average is ρσ² + (1 - ρ)σ²/B, so `max_features` matters. It is hard
      to overfit by adding trees, it parallelises, and out-of-bag predictions give a free validation estimate.

      **Gradient boosting** fits shallow trees in sequence, each to the negative gradient of the loss for the
      current model, with a learning rate. It reduces bias step by step and is usually a little more accurate,
      but it can overfit with too many trees, so I would use a small learning rate and early stopping. I would
      start with scikit-learn's HistGradientBoosting - fast, native missing values and categories - and keep a
      forest as a second opinion.

      **What can go wrong:** reading `feature_importances_` (biased towards many-valued features and computed on
      training data - use permutation importance on held-out data); `oob_score_` being accuracy on 3% fraud;
      extrapolation - trees predict a constant beyond the training range; and leaky features or a random split
      on time-ordered fraud data, which inflate any model's score.
    rubric:
      - Explains bagging plus feature subsampling and why it reduces variance (correlation).
      - Explains boosting as sequential fitting to gradients with shrinkage, reducing bias.
      - Mentions early stopping and the learning-rate / number-of-trees trade-off.
      - Names pitfalls - importance bias, OOB accuracy on imbalance, extrapolation.
      - Gives a concrete choice with a reason and a validation plan.
    followUps:
      - Why does adding trees to a random forest not overfit, while adding trees to boosting can?
      - How would you explain a single prediction of the boosted model to a fraud analyst?
      - Your boosted model's n_iter_ equals max_iter. What does that tell you?
    hints:
      - Contrast what each method does to bias and to variance.
    solution: |
      Forests average deep, decorrelated trees (variance reduction, robust, OOB estimate); boosting adds shallow
      trees fitted to gradients with shrinkage (bias reduction, usually more accurate, needs early stopping).
      Start with HistGradientBoosting and compare with a forest; watch importance bias, OOB accuracy on
      imbalanced data and extrapolation.

placement:
  - id: place-split
    type: mcq
    concept: tree-splits-and-pruning
    skill: application
    title: The weighted split
    prompt: |
      A node has 200 payments, 20 of them fraud. A candidate split sends 10 payments, all fraud, to the left and
      the other 190 (10 fraud) to the right. Which statement about this split is right for a Gini tree?
    options:
      - id: right
        text: Its weighted impurity is 0.95 x Gini(right) = 0.95 x (1 - (180/190)² - (10/190)²), about 0.095, down from 0.18 - a large decrease from a small pure leaf.
        feedback: Correct - the pure left child contributes 0, and the right child is weighted by 190/200.
      - id: average
        text: Its impurity is the average of the children, (0 + 0.0997) / 2, about 0.05.
        feedback: Children are weighted by their share of rows, not averaged equally.
      - id: rejected
        text: CART rejects it, because a 10-row leaf is too small.
        feedback: Only if you set min_samples_leaf above 10; scikit-learn's default is 1.
      - id: no-gain
        text: It gives no decrease, because the right child still contains fraud.
        feedback: The right child's fraud rate falls from 10% to 5.3%, and the left child is pure, so the weighted impurity falls.
    correct: [right]
    hints:
      - Weight each child by its share of the 200 rows.
    solution: |
      Parent Gini = 1 - 0.9² - 0.1² = 0.18. Left child Gini 0 (weight 0.05); right child Gini = 1 - 0.947² -
      0.053² = 0.0997 (weight 0.95), so the weighted impurity is 0.0947 and the decrease about 0.085.

  - id: place-forest
    type: mcq
    concept: bagging-and-random-forests
    skill: analysis
    title: Why the forest helps
    prompt: |
      A single fully grown tree scores test AP 0.07; averaging 300 bootstrap trees gives 0.23, and limiting each
      split to sqrt(n_features) random columns gives 0.27. Which explanation is correct?
    options:
      - id: variance
        text: Averaging reduces the variance of high-variance trees, and random feature subsets lower the correlation between trees, which reduces it further.
        feedback: Correct - ESL's ρσ² + (1 - ρ)σ²/B - more trees shrink the second term, decorrelation shrinks the first.
      - id: bias
        text: Averaging makes each tree less biased, because each tree sees more data.
        feedback: Each bootstrap tree sees no more data than the single tree; bagging leaves the bias of a tree roughly unchanged and reduces variance.
      - id: pruning
        text: The forest prunes each tree automatically.
        feedback: Forest trees are grown deep by default (max_depth=None); averaging, not pruning, does the work.
      - id: oob
        text: The out-of-bag rows add extra training data to each tree.
        feedback: Out-of-bag rows are exactly the ones a tree did not train on; they are used for evaluation.
    correct: [variance]
    hints:
      - Which of bias and variance does averaging identically distributed models reduce?
    solution: |
      Bagging averages trees with the same expected prediction, so bias stays and variance drops; random feature
      subsets decorrelate the trees so the averaging works better. More trees can't remove the correlated part.

  - id: place-boost
    type: mcq
    concept: gradient-boosting
    skill: application
    title: The boosting knob
    prompt: |
      A gradient-boosted model with `learning_rate=0.1` and early stopping stopped at 25 trees. You rerun with
      `learning_rate=0.03`. What do you expect?
    options:
      - id: right
        text: Early stopping will take more trees (here 59), with similar or slightly better held-out scores.
        feedback: Correct - each tree contributes a smaller step, so more are needed; small rates usually generalise at least as well.
      - id: fewer
        text: Fewer trees, because a lower learning rate converges faster.
        feedback: A lower rate makes smaller steps, so it needs more trees to reach the same training loss.
      - id: overfit
        text: It will overfit, because a lower rate fits the training data more closely.
        feedback: Shrinkage is a regulariser; for the same number of trees a lower rate fits the training data less.
      - id: same
        text: Exactly the same model, because early stopping compensates.
        feedback: The number of trees changes, and so do the trees themselves - each is fitted to different residuals.
    correct: [right]
    hints:
      - Smaller steps - more or fewer of them to reach the same place?
    solution: |
      ESL 10.12.1: smaller ν needs larger M for the same training risk and tends to give better test error. In the
      lesson's run, 0.1 stopped at 25 iterations (AP 0.320) and 0.03 at 59 (AP 0.334).

  - id: place-importance
    type: mcq
    concept: tree-feature-importance
    skill: analysis
    title: Which importance to trust
    prompt: |
      For a fraud forest, `feature_importances_` ranks `transaction_id` (a unique number per payment) first.
      Permutation importance on held-out data gives it 0.000 ± 0.003. What is going on?
    options:
      - id: right
        text: The impurity-based number is biased towards a column with many distinct values and computed on training data; the model memorised ids that do not generalise. Drop the column.
        feedback: Correct - a unique id lets deep trees isolate single training rows.
      - id: perm-wrong
        text: Permutation importance is wrong because shuffling destroys the id's meaning.
        feedback: Destroying the column's link to the label is the point; if the score doesn't drop, the model doesn't need it on new data.
      - id: leak
        text: The id is the strongest fraud signal and should be kept.
        feedback: A unique id carries no information about a new payment. The high training importance reflects memorisation.
      - id: both-fine
        text: Both are right - they measure the same thing on different scales.
        feedback: They measure different things on different data - training impurity decrease against held-out score drop - and they disagree here for a reason.
    correct: [right]
    hints:
      - On which data is each importance computed?
    solution: |
      MDI rewards columns with many split points and is computed on the training rows, so a unique id that lets
      trees memorise rows looks important. On held-out payments shuffling it changes nothing. Remove id columns
      before training.

recall:
  - id: recall-split
    concept: tree-splits-and-pruning
    prompt: How does CART choose a split, and what are Gini and entropy?
    answer: It tries every feature and every midpoint threshold and keeps the split with the largest impurity decrease - parent impurity minus the children's impurities weighted by their share of rows. Gini = sum p(1 - p); entropy = -sum p log2 p; regression uses the variance.
  - id: recall-prune
    concept: tree-splits-and-pruning
    prompt: How do you stop a tree overfitting?
    answer: Pre-prune with max_depth, min_samples_leaf or max_leaf_nodes, or post-prune with ccp_alpha (cut the weakest link - smallest (R(t) - R(T_t)) / (leaves - 1) - first), choosing the value by cross-validation; or use an ensemble.
  - id: recall-oob
    concept: bagging-and-random-forests
    prompt: What is an out-of-bag estimate, and what is the catch with oob_score_?
    answer: Each tree misses about 37% (1/e) of the rows; predicting each row with only the trees that did not see it gives a free validation estimate. oob_score_ is accuracy for classifiers - meaningless on 3% fraud - so compute AP or AUC from oob_decision_function_, excluding rows with no OOB trees.
  - id: recall-rf
    concept: bagging-and-random-forests
    prompt: What does max_features do in a random forest?
    answer: It limits each split to a random subset of features, which decorrelates the trees so averaging reduces variance more (ρσ² + (1 - ρ)σ²/B), at the cost of weaker trees. Defaults - sqrt for classification, all features for regression; cross-validate it.
  - id: recall-boost
    concept: gradient-boosting
    prompt: Describe gradient boosting for squared error in one sentence, and its two key settings.
    answer: Start from the mean, then repeatedly fit a shallow tree to the residuals (negative gradient) and add learning_rate times its prediction; a smaller learning rate needs more trees and usually generalises better, and the number of trees is chosen by early stopping.
  - id: recall-hgb
    concept: gradient-boosting
    prompt: What does HistGradientBoosting add over GradientBoosting?
    answer: Features are binned (max_bins 255), which makes it much faster on large data; native missing-value support (each split learns where NaN goes); native categorical features (from_dtype by default); early stopping on by default above 10000 rows.
  - id: recall-importance
    concept: tree-feature-importance
    prompt: Why can feature_importances_ mislead, and what do you use instead?
    answer: It is computed on training data and favours many-valued features, so noise or ids can rank high in overfitted trees. Use permutation importance on held-out data with repeats - and remember correlated features share the credit and importance is not causation.
  - id: recall-extrapolate
    concept: tree-splits-and-pruning
    prompt: What does a tree predict for an input beyond its training range?
    answer: The constant of the edge leaf - trees are piecewise constant and do not extrapolate. In the lesson, forests and boosting predicted about 20.2 for amounts of 2000 and 5000 when the true fee was 40.3 and 100.3.

