id: decision-trees-and-ensembles
title: Decision trees, random forests and boosting
subject: ai-engineering
module: ml-foundations
level: intermediate
status: published
estimatedMinutes: 90
summary: How tree models learn if-then rules from tabular data and why they are the strongest default for it - how CART chooses a split with Gini or entropy, why a deep tree overfits and how cost-complexity pruning cuts it back, how bagging and random forests average unstable trees (bootstrap samples, out-of-bag scores, max_features), how gradient boosting fits each tree to the errors of the ones before it (learning rate, early stopping, HistGradientBoosting with categories and missing values), and how to read feature importances without being fooled. Every number shown comes from code run with scikit-learn 1.9.1.
