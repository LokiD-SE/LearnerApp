      crash hides), implement `ResidualBlock.forward` and `train_model`, fix `accuracy` so evaluation is
      deterministic, and fix `make_transfer_model`, whose draft changes the model it is given and freezes the
      new head too. `load_digit_tensors` is provided.
    project: ai
    files:
      - exercises/deep_learning/digits_cnn.py
    test: tests/deep_learning/test_digits_cnn.py
    command: .venv/bin/python -m pytest tests/deep_learning/test_digits_cnn.py
    hints:
      - "The crash names the shapes: (64x128 and 2048x10). How big is the feature map after two MaxPool2d(2) layers on 8x8?"
      - Read the DigitsCNN docstring again - what should forward return, given that the loss is CrossEntropyLoss?
      - "ResidualBlock: relu(bn2(conv2(relu(bn1(conv1(x))))) + x)."
      - "accuracy: model.eval() and torch.no_grad(). make_transfer_model: copy.deepcopy first, and freeze only model.features."
    modelAnswer: |
      ```python
      class DigitsCNN(nn.Module):
          def __init__(self, num_classes=10):
              super().__init__()
              self.features = nn.Sequential(
                  nn.Conv2d(1, 16, 3, padding=1), nn.ReLU(), nn.MaxPool2d(2),
                  nn.Conv2d(16, 32, 3, padding=1), nn.ReLU(), nn.MaxPool2d(2), nn.Flatten())
              self.classifier = nn.Linear(32 * 2 * 2, num_classes)

          def forward(self, x):
              return self.classifier(self.features(x))      # logits, no softmax


      class ResidualBlock(nn.Module):
          ...
          def forward(self, x):
              out = torch.relu(self.bn1(self.conv1(x)))
              return torch.relu(self.bn2(self.conv2(out)) + x)


      def accuracy(model, X, y):
          model.eval()
          with torch.no_grad():
              return float((model(X).argmax(dim=1) == y).float().mean())


      def make_transfer_model(pretrained, num_classes, freeze=True):
          model = copy.deepcopy(pretrained)
          model.classifier = nn.Linear(model.classifier.in_features, num_classes)
          if freeze:
              for param in model.features.parameters():
                  param.requires_grad = False
          return model
      ```

      `train_model` is the loop in the lesson: `torch.manual_seed(seed)`, `model.train()`, Adam over the
      parameters with `requires_grad`, a `randperm` per epoch, and the size-weighted mean batch loss per
      epoch. With it the tests train the CNN for 6 epochs to a loss below 0.25 and more than 93% test
      accuracy, and check that a frozen model's feature weights do not move.
    rubric:
      - Every test in test_digits_cnn.py passes
      - The head's input size is derived from the shapes, and forward returns logits
      - Evaluation uses eval mode and no_grad; training sets train mode
      - The transfer model is a copy, with only the feature extractor frozen and the optimiser given only trainable parameters
    solution: |
      See the model answer. The crash is the 2048-versus-128 head; the hidden bug is the softmax before
      `CrossEntropyLoss`. The accuracy draft leaves dropout on (the test uses a model with dropout and calls
      it twice). The transfer draft modifies `pretrained` in place and freezes every parameter including
      the new head, so nothing could train.

  - id: interview-cnn
    type: interview
    concept: cnn-architectures-and-residuals
    skill: application
    title: "Interview: build an image classifier with little data"
    prompt: |
      *"We have about 2,000 labelled product photos in 12 categories and want a classifier. Walk me through
      how you would build it, what architecture you would start from, and how you would know it works."*
    hints:
      - Starting point, data handling, training details, evaluation and failure modes.
    modelAnswer: |
      With 2,000 photos I would not train a deep CNN from scratch. I would start from an ImageNet-pretrained
      ResNet (residual connections make it deep and trainable, and it is a well-understood baseline),
      replace the 1000-class head with a 12-class linear layer and use exactly the preprocessing that ships
      with the weights.

      Data first: split by product or by photo session, not by image, so near-duplicate shots do not appear
      on both sides; keep a test set untouched. Training: freeze the backbone and train the head, then
      fine-tune the later blocks or all of them with a small learning rate, using augmentations that keep the
      label - random resized crops, small rotations, colour jitter; horizontal flips if products are
      symmetric enough. Cross-entropy on logits, `model.train()` and `model.eval()` in the right places,
      fixed seeds.

      To know it works: compare with a frozen-feature model and a small from-scratch baseline on the same
      split, over several seeds; look at per-class accuracy and the confusion matrix, not only the average;
      test on photos like the ones production will send (phone photos, other lighting); and check
      preprocessing parity between training and serving with an automated test. If it still underperforms, I
      would look at the data - label noise, class imbalance, and whether the source domain matches.
    rubric:
      - Chooses a pretrained backbone and explains why (data size)
      - Replaces the head and matches the weights' preprocessing
      - Splits by group to avoid near-duplicate leakage, keeps a test set
      - Describes freezing then fine-tuning, with label-preserving augmentation
      - Evaluates against baselines, per class and on production-like photos
    followUps:
      - Why does a residual connection make a 50-layer network trainable when a plain one is not?
      - How do you compute the input size of the head if you change the image resolution?
      - What would you change if the images were X-rays instead of product photos?
    solution: |
      See the model answer: pretrained ResNet with a new head and matching preprocessing, a group-aware
      split, freeze-then-fine-tune with label-preserving augmentation, and evaluation against baselines, per
      class and on production-like data.

placement:
  - id: place-conv-value
    type: mcq
    concept: convolution-layer-mechanics
    skill: application
    title: What does Conv2d compute?
    prompt: |
      `F.conv2d` is applied to a 1-channel input with 2 rows `[[1, 2, 3], [4, 5, 6]]` and a 1x2 kernel
      `[[10, 1]]`, no padding, no bias. What is the output?
    options:
      - id: right
        text: "[[12, 23], [45, 56]]"
        feedback: "Correct - cross-correlation: 1*10 + 2*1 = 12, 2*10 + 3*1 = 23, and the same on the second row."
      - id: flipped
        text: "[[21, 32], [54, 65]]"
        feedback: "That flips the kernel to [[1, 10]] - mathematical convolution. PyTorch computes cross-correlation, without the flip."
      - id: summed
        text: "[[57, 79]]"
        feedback: A 1x2 kernel only spans one row; the rows are not combined. The output has 2 rows and 3 - 2 + 1 = 2 columns.
      - id: same
        text: "[[12, 23, 30], [45, 56, 60]]"
        feedback: With no padding, the kernel only fits in 2 positions per row - the output is 2 wide.
    correct: [right]
    hints:
      - Slide the kernel without flipping it.
    solution: |
      PyTorch's convolution is cross-correlation: each output is the patch times the kernel as written.
      Row 1: `1*10 + 2*1 = 12`, `2*10 + 3*1 = 23`. Row 2: `45`, `56`. The flipped kernel would give 21, 32,
      54, 65 - what SciPy's `convolve2d` computes.

  - id: place-shapes
    type: mcq
    concept: conv-shapes-pooling-receptive-field
    skill: application
    title: The head's input size
    prompt: |
      A model takes `(N, 3, 64, 64)` images through `Conv2d(3, 32, 3, padding=1)`, `MaxPool2d(2)`,
      `Conv2d(32, 64, 3, padding=1)`, `MaxPool2d(2)`, `Conv2d(64, 64, 3, stride=2, padding=1)` and
      `Flatten()`. What must `in_features` of the following `nn.Linear` be?
    options:
      - id: right
        text: "4096"
        feedback: "Correct - 64 -> 32 -> 16 -> 8 spatially, with 64 channels: 64 * 8 * 8 = 4,096."
      - id: no-stride
        text: "16384"
        feedback: "That is 64 * 16 * 16 - it ignores the stride-2 convolution, which halves 16 to floor((16 + 2 - 3)/2) + 1 = 8."
      - id: channels-only
        text: "64"
        feedback: Flatten keeps every channel at every position; only global pooling would reduce it to 64.
      - id: early
        text: "65536"
        feedback: "That is 64 * 32 * 32 - it misses a pooling layer and the stride."
    correct: [right]
    hints:
      - Padding 1 keeps the size of a 3x3 convolution at stride 1; each pooling halves it.
    solution: |
      `64 -> 64` (conv, padding 1) `-> 32` (pool) `-> 32 -> 16` (conv, pool) `-> 8` (stride-2 conv:
      `floor((16 + 2 - 3) / 2) + 1 = 8`). Flatten: `64 * 8 * 8 = 4,096`. A wrong value produces PyTorch's
      "mat1 and mat2 shapes cannot be multiplied" error at the first batch.

  - id: place-residual
    type: mcq
    concept: cnn-architectures-and-residuals
    skill: analysis
    title: What the shortcut fixes
    prompt: |
      A 34-layer plain CNN has a **higher training error** than an 18-layer plain CNN on the same data. Which
      statement is right?
    options:
      - id: right
        text: This is degradation - an optimisation problem; residual shortcuts, relu(F(x) + x), let the deeper network train at least as well.
        feedback: Correct - He et al. show exactly this and solve it with identity shortcuts.
      - id: overfit
        text: The 34-layer network is overfitting; regularise it.
        feedback: Overfitting lowers training error and raises validation error. Higher training error means the network is not fitting the data.
      - id: impossible
        text: It cannot happen - a deeper network can always copy the shallower one.
        feedback: It could in principle (extra layers as identities), but in practice the optimiser does not find that solution - which is the observation that motivated ResNet.
      - id: pooling
        text: The deeper network has too much pooling; remove pooling layers.
        feedback: Pooling changes resolution, not trainability; the plain networks in the ResNet paper have the same downsampling as the residual ones.
    correct: [right]
    hints:
      - Is the problem on the training data or only on new data?
    solution: |
      Higher training error for a deeper model is the degradation problem: not overfitting, but an optimiser
      that cannot fit the deeper plain network. A residual block only has to learn the correction `F(x)` to
      the identity, so extra blocks can start near the identity and depth stops hurting.

  - id: place-transfer
    type: mcq
    concept: transfer-learning-for-vision
    skill: application
    title: Freeze or fine-tune?
    prompt: |
      You have 300 labelled photos for a new 5-class task similar to everyday ImageNet photos, and a
      pretrained ResNet. What is the right first setup?
    options:
      - id: right
        text: Replace the head, freeze the backbone (requires_grad = False), train the head with the weights' preprocessing, and compare with a baseline.
        feedback: Correct - little data and a similar source favour a fixed feature extractor; the baseline confirms it helped.
      - id: all-high-lr
        text: Fine-tune every layer with the learning rate used to train from scratch.
        feedback: A high learning rate through every layer, from a random new head, can wreck the pretrained features with 300 photos. Fine-tuning uses a small learning rate, usually after training the head.
      - id: keep-1000
        text: Keep the 1000-class head and pick the 5 most frequent ImageNet predictions as the classes.
        feedback: The ImageNet classes are not your classes; the head is always replaced and trained on your labels.
      - id: freeze-all
        text: Freeze every parameter including the new head.
        feedback: Then nothing trains - the new head starts random and must learn.
    correct: [right]
    hints:
      - Which part of the network is specific to ImageNet's classes, and how much data is there to retrain the rest?
    solution: |
      With 300 photos and a similar source, freeze the pretrained feature extractor, replace and train the
      head, and preprocess as the weights expect. Fine-tune later with a small learning rate if the frozen
      features underfit - and keep a from-scratch baseline, because transfer only helps when the source fits.

recall:
  - id: recall-conv-computes
    concept: convolution-layer-mechanics
    prompt: What does one output value of nn.Conv2d compute, and is it convolution?
    answer: The sum over all input channels and kernel positions of input times weight, plus that output channel's bias. It is cross-correlation - the kernel is not flipped - which libraries call convolution.
  - id: recall-three-ideas
    concept: convolution-layer-mechanics
    prompt: Which three ideas make convolution better than a dense layer for images?
    answer: Sparse interactions (each output sees a small window), parameter sharing (the same kernel at every position - parameters independent of image size) and equivariance (shifting the input shifts the feature map).
  - id: recall-output-size
    concept: conv-shapes-pooling-receptive-field
    prompt: What is the output size of a convolution along one dimension?
    answer: floor((size + 2*padding - dilation*(kernel-1) - 1) / stride) + 1. For a 3x3 kernel, padding 1 keeps the size at stride 1; stride 2 or MaxPool2d(2) halves it.
  - id: recall-receptive-field
    concept: conv-shapes-pooling-receptive-field
    prompt: How do you compute the receptive field of a stack of layers, and why use three 3x3 instead of one 7x7?
    answer: Start r = 1, jump = 1; per layer r += (span - 1) * jump, jump *= stride. Three 3x3 layers see 7x7 like one 7x7 layer, with 27C² instead of 49C² parameters and three non-linearities.
  - id: recall-pooling
    concept: conv-shapes-pooling-receptive-field
    prompt: What does max pooling give, and what does it not?
    answer: Invariance to shifts within its window and a smaller, cheaper feature map. Not full shift invariance - the head still depends on position; data augmentation teaches the rest.
  - id: recall-residual
    concept: cnn-architectures-and-residuals
    prompt: What problem do residual connections solve, and what does a basic block compute?
    answer: Degradation - deeper plain networks get higher training error because they are hard to optimise. The block outputs relu(F(x) + x), with F = conv-BN-ReLU-conv-BN, so it only learns a correction to the identity.
  - id: recall-eval-mode
    concept: cnn-architectures-and-residuals
    prompt: What must an evaluation function do with a PyTorch model?
    answer: Call model.eval() (dropout off, batch norm uses running statistics) and run under torch.no_grad(); call model.train() again before training. Return logits from forward and let CrossEntropyLoss apply log-softmax.
  - id: recall-transfer
    concept: transfer-learning-for-vision
    prompt: What are the two transfer learning scenarios and the rules that go with them?
    answer: Fixed feature extractor - freeze the backbone (requires_grad = False), train a new head; fine-tuning - train all layers from the pretrained weights with a small learning rate. Always replace the head, preprocess exactly as the weights expect, and compare with a from-scratch baseline.

