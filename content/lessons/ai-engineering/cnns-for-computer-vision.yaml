id: cnns-for-computer-vision
title: Convolutional networks for computer vision
subject: ai-engineering
module: deep-learning
level: advanced
status: published
estimatedMinutes: 100
summary: How a convolutional network sees an image - a small kernel slid over every position with the same weights, so the layer is cheap, local and shifts its output when the input shifts. Work out output shapes, padding, stride, pooling and receptive fields by hand and check them against PyTorch, build and train a small CNN on scikit-learn's 8x8 digits, follow the architectures from LeNet to ResNet and why residual connections let deep networks train, and reuse a trained network for a new task - with an honest baseline that shows when transfer learning does not help. Every number shown was produced by the code shown.
