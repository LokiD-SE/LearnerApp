environment: |
  - **Runtime:** Python 3.12.3 in `practice/ai/.venv`, standard library only (`hmac`, `hashlib`, `base64`,
    `ipaddress`, `unicodedata`), pytest for the exercises. Every output in this lesson was printed by the code
    shown, run on Linux on 18 November 2026. The code run is the reference solutions of this lesson's exercises:
    `practice/ai/solutions/mcp/security_tokens.py`, `security_discovery.py` and `security_tool_guard.py`. Nothing
    is random and the clock is injected, so the output is the same on any machine.
  - **No MCP SDK, no network.** By the learner's choice the practice project has no MCP SDK: the code implements
    the checks by hand so you can see them, and nothing makes an HTTP request. In production use a maintained
    OAuth / JWT library and your SDK's authorization support rather than hand-written token parsing.
  - **Teaching tokens:** JWT-shaped (`header.payload.signature`, base64url) and signed with HMAC-SHA256 ("HS256")
    using a shared secret so that only the standard library is needed. RFC 9068 recommends that authorization
    servers sign access tokens with an **asymmetric** algorithm and publish keys at `jwks_uri`; a resource server
    may also check opaque tokens by introspection (RFC 7662). The checks taught here are the same either way.
  - **Synthetic data:** SandPay is a fictional payments company - `https://mcp.sandpay.example/mcp` (its MCP
    server), `https://auth.sandpay.example` (its authorization server), `https://api.sandpay.example`, merchant
    `merchant-m204`, payment `pay_1042`, scopes `payments:read`, `refunds:write`, `merchant:admin`, and the
    malicious `fx-rates` server were invented for this lesson. No real credentials appear anywhere.
  - **Primary source - the MCP specification, revision 2026-07-28** (the latest revision on 18 November 2026,
    checked against `modelcontextprotocol.io/specification/latest`), as documented on 18 November 2026:
    [Authorization](https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization) (protocol
    requirements, scope selection strategy, authorization flow, resource parameter, canonical server URI, token
    handling, error handling, step-up), [Authorization Server
    Discovery](https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization/authorization-server-discovery),
    [Authorization Security
    Considerations](https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization/security-considerations),
    [Tools](https://modelcontextprotocol.io/specification/2026-07-28/server/tools) (user interaction model, tool
    annotations, security considerations), [Streamable
    HTTP](https://modelcontextprotocol.io/specification/2026-07-28/basic/transports/streamable-http) (security
    warning) and the specification overview's [Security and Trust &
    Safety](https://modelcontextprotocol.io/specification/2026-07-28) principles. Also the project's [Security
    Best Practices](https://modelcontextprotocol.io/docs/2026-07-28/tutorials/security/security_best_practices)
    page (confused deputy, token passthrough, SSRF, state handle hijacking, local server compromise, authorization
    URL validation, scope minimization). Quotations are from those pages. The 2026-07-28 revision removed
    protocol-level sessions; servers that keep state mint their own handles, which is why the best-practices page
    covers "state handle hijacking" where older revisions covered session hijacking.
  - **Standards cited by the specification:** [RFC 6750](https://datatracker.ietf.org/doc/html/rfc6750) (bearer
    tokens, section 3.1 error codes), [RFC 8707](https://www.rfc-editor.org/rfc/rfc8707.html) (resource
    indicators), [RFC 9728](https://datatracker.ietf.org/doc/html/rfc9728) (protected resource metadata,
    sections 2, 3.3, 5.1, 7.3), [RFC 9068](https://www.rfc-editor.org/rfc/rfc9068.html) (JWT access tokens,
    section 4 validation), [RFC 8414](https://datatracker.ietf.org/doc/html/rfc8414) (authorization server
    metadata), [RFC 9207](https://datatracker.ietf.org/doc/html/rfc9207) (issuer identification) and the [OAuth
    2.1 draft](https://datatracker.ietf.org/doc/html/draft-ietf-oauth-v2-1-13) (draft-ietf-oauth-v2-1-13, an
    Internet-Draft, not yet an RFC).
  - **Tool poisoning:** Invariant Labs, [MCP Security Notification - Tool Poisoning
    Attacks](https://invariantlabs.ai/blog/mcp-security-notification-tool-poisoning-attacks) (1 April 2025) -
    a security vendor's research blog, the source of the terms "tool poisoning", "rug pull" and tool
    "shadowing" used here. OWASP [LLM01:2025 Prompt
    Injection](https://genai.owasp.org/llmrisk/llm01-prompt-injection/) (indirect injection; mitigation 6,
    "Segregate and identify external content") and [LLM06:2025 Excessive
    Agency](https://genai.owasp.org/llmrisk/llm062025-excessive-agency/).
  - **Not repeated here:** OAuth roles, the authorization code flow and PKCE - [Passwords, OAuth and
    OIDC](#/lesson/passwords-oauth-and-oidc); MCP participants and primitives - [MCP
    architecture](#/lesson/mcp-architecture); JSON-RPC framing and the transports - [The MCP lifecycle, JSON-RPC
    and transports](#/lesson/mcp-lifecycle-and-transports); tool-use loops and approval of risky calls - [Tool use
    and function calling](#/lesson/tool-use-and-function-calling).

