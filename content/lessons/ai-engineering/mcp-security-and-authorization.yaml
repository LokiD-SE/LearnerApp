id: mcp-security-and-authorization
title: MCP security and authorization
subject: ai-engineering
module: model-context-protocol
level: advanced
status: published
estimatedMinutes: 150
summary: Secure a remote SandPay MCP server and the client that talks to it, from the MCP specification (revision 2026-07-28) and the RFCs it builds on - the 401 challenge and Protected Resource Metadata that start discovery, resource indicators and audience-bound tokens, why a server must never pass a client's token through, scopes and step-up authorization, and the client's own attack surface (SSRF through discovered URLs, dangerous authorization URLs, local servers). Then the threats OAuth does not touch - poisoned tool descriptions, rug pulls and tool output that carries instructions - with a scanner, hash pinning and delimited output. Every output shown was printed by the code shown.
