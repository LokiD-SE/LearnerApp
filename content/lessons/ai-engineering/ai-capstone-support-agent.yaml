id: ai-capstone-support-agent
title: Capstone - a SandPay support agent with RAG and MCP
subject: ai-engineering
module: ai-production-capstone
level: advanced
status: published
estimatedMinutes: 170
summary: Build SandPay's merchant-support agent end to end and decide whether it may ship. A knowledge layer answers policy questions only from retrieved sections and rejects answers whose citations do not check out. An MCP server (revision 2026-07-28) looks up payments and refunds them only after the user approves through an input-required result with a signed, bound, single-use requestState. A model loop with turn and token limits joins the two, and an offline evaluation with critical cases decides the release. Every output shown was printed by the code shown, against a scripted model.
