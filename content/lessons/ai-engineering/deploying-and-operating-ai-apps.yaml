id: deploying-and-operating-ai-apps
title: Deploying and operating AI applications
subject: ai-engineering
module: ai-production-capstone
level: advanced
status: published
estimatedMinutes: 150
summary: Run an LLM feature like any other production service, with the extra failure modes a model brings. Retry rate limits and overloads with capped exponential backoff and full jitter, honour Retry-After, stop at a deadline, and fall back to another model only when the first is unavailable - never for a bad request or a spend cap you would hit again. Price every request from its token usage, use provider prompt caching and an application response cache where they are safe, and put per-request, per-user and daily limits in front of the model (OWASP LLM10 Unbounded Consumption). Trace every model call with the OpenTelemetry GenAI attribute names, watch percentiles and time to first chunk instead of averages, and block a release when a golden-set case regresses. Every number shown was produced by the code shown, against an offline scripted model.
