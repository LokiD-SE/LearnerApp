id: retrieval-augmented-generation
title: Retrieval-augmented generation (RAG)
subject: ai-engineering
module: genai-engineering
level: intermediate
status: published
estimatedMinutes: 125
summary: Build a retrieval-augmented question answerer for a synthetic SandPay help centre and measure every step - chunking (fixed size with and without overlap, or by heading) and what it does to recall@k, BM25 you write yourself, toy dense vectors, reciprocal rank fusion, a simple reranker, a relevance gate that refuses instead of guessing, a prompt with numbered sources, and a checker that rejects any answer citing a source it was not given or leaving a sentence uncited. Every number shown was produced by the code shown, against an offline scripted model; provider features (Anthropic citations, OpenAI file search) are quoted from their documentation and labelled.
tags:
  [
    RAG,
    retrieval-augmented generation,
    retrieval,
    chunking,
    chunk overlap,
    recall@k,
    BM25,
    Okapi BM25,
    idf,
    sparse retrieval,
    dense retrieval,
    hybrid search,
    reciprocal rank fusion,
    RRF,
    reranking,
    reranker,
    cross-encoder,
    grounding,
