id: mcp-lifecycle-and-transports
title: The MCP lifecycle, JSON-RPC and transports
subject: ai-engineering
module: model-context-protocol
level: advanced
status: published
estimatedMinutes: 135
summary: How an MCP client and server agree on what they are speaking and move messages between them - JSON-RPC 2.0 requests, notifications and responses; the stdio binding's one-message-per-line framing; protocol versions and capabilities declared on every request in the current, stateless 2026-07-28 revision, the server/discover probe, and the initialize handshake that older servers still expect; Streamable HTTP with its headers, SSE response streams and validation rules; and timeouts, cancellation and shutdown. Every wire message shown was produced by the code shown, talking to a real subprocess over stdio.
tags:
