id: llm-evaluation-and-guardrails
title: Evaluating LLM applications and guardrails
subject: ai-engineering
module: genai-engineering
level: advanced
status: published
estimatedMinutes: 150
summary: Test an LLM feature the way a tester tests anything else - a tagged golden set, deterministic code graders (exact match, regular expressions, JSON fields), pass rates with Wilson confidence intervals, and a paired comparison that names every fix and regression between two prompt versions. Then use an LLM as a judge only where code cannot grade - a rubric, a verdict a program can read, a position-swap check for bias and agreement with human labels measured by Cohen's kappa. The second half defends the feature - prompt injection (direct and indirect), card-number masking with the Luhn check, injection heuristics and their blind spots, an allow-list for every tool call, and a red-team suite organised by the OWASP Top 10 for LLM Applications 2025. Every output comes from code run offline against a scripted fake model.
