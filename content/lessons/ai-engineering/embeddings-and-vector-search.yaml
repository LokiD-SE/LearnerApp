id: embeddings-and-vector-search
title: Embeddings and vector search
subject: ai-engineering
module: genai-engineering
level: intermediate
status: published
estimatedMinutes: 105
summary: Turn text into vectors, measure how similar two vectors are, and find the nearest ones fast. You build an exact (brute-force) index with metadata filters, an approximate inverted-file (IVF) index trained with k-means, and the metrics that tell you whether search works - recall@k and MRR against labelled queries, and neighbour recall against exact search. You see a toy bag-of-words embedding fail on synonyms, cosine, dot product and L2 distance agree on unit vectors, an IVF index trade recall for speed (and lose to brute force when tuned badly), and a filter applied after the index return one result instead of ten. Every output shown was produced by running the code.
