environment: |
  - **Runtime and libraries:** Python 3.12.3 with **NumPy 2.5.4** from `practice/ai/requirements.txt`, run
    with `practice/ai/.venv/bin/python`. Every printed vector, score, recall, MRR and timing in this lesson
    was produced by running the lesson's code (the reference solutions in `practice/ai/solutions/genai/`) on
    Linux in November 2026 with fixed seeds. Timings were measured with **2 threads**
    (`OMP_NUM_THREADS=2`) on a shared machine and are only a rough guide; your numbers will differ, and the
    *ratios* matter more than the milliseconds.
  - **No model, no network, no API key.** Text vectors come from the practice project's
    `support/toy_embeddings.py`: it hashes lower-cased words and word pairs (bigrams) into 256 numbers and
    scales the result to length 1. It is deterministic and knows nothing about meaning - the lesson uses that
    on purpose to show what a real embedding model adds. The index experiments use synthetic clustered
    vectors (Gaussian noise around random "topic" centres, then normalised).
  - **Primary sources:**
    - Tomas Mikolov, Kai Chen, Greg Corrado and Jeffrey Dean, [Efficient Estimation of Word Representations
      in Vector Space](https://arxiv.org/abs/1301.3781) (2013) - word vectors learned from context; their
      training is covered in [Sequence models, RNNs and word
      embeddings](#/lesson/sequence-models-and-embeddings) and not repeated here.
    - Nils Reimers and Iryna Gurevych, [Sentence-BERT: Sentence Embeddings using Siamese
      BERT-Networks](https://arxiv.org/abs/1908.10084) (EMNLP 2019) - one vector per sentence, compared with
      cosine similarity; the 65 hours (cross-encoder BERT on all pairs of 10,000 sentences) versus about 5
      seconds (SBERT embeddings) figure; mean pooling as the default.
    - Jeff Johnson, Matthijs Douze and Hervé Jégou, [Billion-scale similarity search with
      GPUs](https://arxiv.org/abs/1702.08734) (2017, the FAISS paper) - exact k-nearest-neighbour search as a
      matrix product with k-selection, the decomposition ‖x − y‖² = ‖x‖² + ‖y‖² − 2⟨x, y⟩, and the inverted
      file (IVF): a k-means coarse quantizer, "inverted lists", and the multi-probe parameter (τ, called
      `nprobe` in the FAISS library).
    - Yu. A. Malkov and D. A. Yashunin, [Efficient and robust approximate nearest neighbor search using
      Hierarchical Navigable Small World graphs](https://arxiv.org/abs/1603.09320) (2016, HNSW) - the
      multi-layer proximity graph, and the definition of ANN recall: "the ratio between the number of found
      true nearest neighbors and K".
    - [pgvector README](https://github.com/pgvector/pgvector/blob/v0.8.7/README.md) (version 0.8.7, read on
      2026-11-14) - the `<->`, `<#>` and `<=>` operators, HNSW and IVFFlat indexes and their options
      (`m`, `ef_construction`, `hnsw.ef_search`, `lists`, `ivfflat.probes`), and its section on filtering
      ("With approximate indexes, filtering is applied *after* the index is scanned") and iterative index
      scans. The SQL in this lesson is quoted or adapted from it and was **not** run here.
    - **Provider documentation (provider-specific, as documented on 2026-11-14):** OpenAI's [Vector embeddings
      guide](https://platform.openai.com/docs/guides/embeddings) and Anthropic's
      [Embeddings](https://platform.claude.com/docs/en/build-with-claude/embeddings) page (which says Anthropic
      "does not offer its own embedding model" and documents Voyage AI's). Model names, dimensions and
      parameters change; check the current pages. No provider API was called for this lesson.
  - **Fictional and synthetic:** SandPay, its twelve help-centre articles and eight labelled queries (written
    for the lesson), and every vector collection used for timing.
  - **Builds on:** vectors, dot products and norms from [ML maths essentials](#/lesson/ml-maths-essentials),
    k-means from [Unsupervised learning](#/lesson/unsupervised-learning), word2vec from [Sequence models, RNNs
    and word embeddings](#/lesson/sequence-models-and-embeddings), and contextual representations from
    [Attention and transformers](#/lesson/attention-and-transformers). The next lesson, [Retrieval-augmented
    generation](#/lesson/retrieval-augmented-generation), puts this search in front of a language model.

prerequisites:
  - ml-maths-essentials
  - unsupervised-learning
  - how-llms-work

concepts:
  - id: text-embeddings-and-similarity
    name: Text embeddings and similarity measures
    summary: An embedding model maps a piece of text to a fixed-length vector so that texts with similar meaning get vectors that point in similar directions. Similarity is measured with cosine similarity (the dot product of length-normalised vectors), the dot product, or Euclidean (L2) distance; on unit-length vectors all three give the same ranking, because ‖a − b‖² = 2 − 2·cos(a, b). A bag-of-words vector only matches shared words - synonyms score near zero and negation barely changes the score - which is why trained sentence-embedding models (Sentence-BERT and provider models) exist. Queries and documents must be embedded by the same model, and some providers embed them differently on purpose (an input type).
  - id: exact-and-approximate-search
    name: Exact and approximate nearest-neighbour search
    summary: Exact (brute-force) search scores the query against every stored vector - one matrix-vector product - and keeps the top k with partial selection; it has perfect recall and is fast enough for tens or hundreds of thousands of vectors. Approximate indexes look at a fraction of the vectors. An inverted file (IVF) clusters the vectors with k-means and scans only the nprobe lists nearest the query; HNSW walks a multi-layer neighbour graph. Both trade recall for speed through a query-time knob (nprobe, ef_search), and both must be measured on your own data against exact search.
  - id: filtered-vector-search
    name: Metadata filtering in vector search
    summary: Real searches restrict results by metadata - tenant, region, product, date. Pre-filtering (score only the rows that pass) returns k results whenever k rows match; post-filtering an approximate index's top k (as pgvector does by default) can return far fewer, because the nearest vectors mostly fail the filter. Fixes are over-fetching, iterative index scans, partial indexes or partitions per filter value, or exact search on the filtered subset. A filter that isolates tenants is a security control and must be tested as one.
  - id: retrieval-evaluation
    name: Evaluating retrieval - recall@k, MRR and neighbour recall
    summary: Recall@k is the share of a query's relevant documents found in the first k results; reciprocal rank is 1 over the position of the first relevant one, and MRR averages it over queries. Both need a labelled set of queries with their correct documents, including paraphrases that share no words with the answer. Neighbour recall compares an approximate index with exact search and needs no labels - it measures the index, not the embedding. Report the misses, not only the averages.

objectives:
  - Embed text with the practice project's toy embedding, compute cosine similarity, dot product and L2 distance by hand and in NumPy, and show that the three rank unit vectors identically while they disagree on raw vectors.
  - Explain, with real scores, why a bag-of-words embedding fails on synonyms and negation, and what a sentence-embedding model (a bi-encoder such as Sentence-BERT) changes - and what it costs compared with a cross-encoder.
  - Write an exact top-k search with deterministic ties and a metadata pre-filter, and explain why it uses partial selection instead of a full sort.
  - Build an inverted-file index with k-means, measure its recall@10 and query time against exact search for several nprobe values, and choose a setting from the measurements.
  - Explain why post-filtering an approximate index returns too few results, using the measured numbers and the pgvector documentation, and choose a filtering strategy.
  - Compute recall@k, reciprocal rank, MRR and neighbour recall, build a labelled query set that includes paraphrases, and use the results to decide what to fix.

sections:
  - id: intuition
    kind: intuition
    concepts: [text-embeddings-and-similarity, exact-and-approximate-search]
    title: The idea in plain language
    body: |
      SandPay's help centre has a search box. A merchant types "give the customer their money back". The
      article they need is called "How to refund a card payment". A keyword search finds nothing: the query and
      the title share no useful word.

      **Embeddings** fix this by giving every text a position on a map. An embedding model reads a sentence
      and returns a list of numbers - a **vector**, often hundreds or thousands of them - chosen so that texts
      meaning similar things land close together. "Money back" and "refund" end up near each other even
      though the letters differ. Searching becomes geometry: put the query on the map, and return the articles
      closest to it.

      Two practical questions follow, and this lesson answers both with measurements:

      1. **How do you measure "close"?** Cosine similarity, dot product or straight-line (L2) distance - and
         when they agree.
      2. **How do you find the closest of millions fast?** Checking every vector is exact but grows with the
         collection. An **index** checks only a likely neighbourhood - like looking only in the shelves of the
         right section of a library - and sometimes misses a book that was shelved elsewhere.

      Then the parts teams forget: **filters** ("only articles for the US"), which can silently break an
      index, and **evaluation** - a list of real queries with their right answers, so "search got better" is a
      number and not a feeling.

  - id: what
    kind: what
    concepts:
      [text-embeddings-and-similarity, exact-and-approximate-search, filtered-vector-search, retrieval-evaluation]
    title: Terms you need
    body: |
      | Term | Meaning |
      | --- | --- |
      | **Embedding** | A fixed-length vector of floats representing a text (or image, or code). Its **dimension** is the vector's length, e.g. 256, 1024, 1536. |
      | **Embedding model** | The model that produces it. Query and documents must be embedded by the **same** model, or the vectors are not comparable. |
      | **Unit vector / normalised** | A vector scaled to Euclidean length (L2 norm) 1: v / ‖v‖. |
      | **Cosine similarity** | cos(a, b) = a·b / (‖a‖ ‖b‖), from −1 to 1. Measures direction, ignores length. |
      | **Dot (inner) product** | a·b = Σ aᵢbᵢ. Equals cosine for unit vectors; otherwise rewards long vectors. |
      | **L2 (Euclidean) distance** | ‖a − b‖. Smaller is closer. |
      | **k-nearest neighbours (kNN), top-k** | The k stored vectors most similar to the query. |
      | **Exact / brute-force search** | Score every stored vector. Perfect recall, cost grows linearly with the collection. |
      | **ANN (approximate nearest neighbour)** | Search that inspects only part of the collection and may miss some true neighbours. |
      | **IVF (inverted file)** | ANN index: k-means splits the vectors into cells ("lists"); a search scans the `nprobe` cells nearest the query. |
      | **HNSW** | ANN index: a multi-layer graph of neighbours walked greedily from the top layer (Malkov and Yashunin). |
      | **Metadata filter** | A condition on fields stored next to the vector (`region = 'us'`, `tenant_id = 42`). **Pre-filter**: before ranking; **post-filter**: after. |
      | **Recall@k** | Share of a query's relevant documents that appear in the first k results. |
      | **Reciprocal rank, MRR** | 1 / position of the first relevant result (0 if none); MRR is its mean over queries. |
      | **Neighbour recall** | Share of the exact top k that the ANN index also returned - the index's own accuracy. |

  - id: why
    kind: why
    concepts: [text-embeddings-and-similarity, retrieval-evaluation]
    title: Why not keyword search, and why not just ask the language model?
    body: |
      **Keyword search** (match the words, rank by how rare they are) is fast, explainable and very good when
      users use the same words as the documents - order numbers, error codes, product names. It fails when
      they don't: "money back" versus "refund", "forgot my login" versus "reset your password". You will see
      the toy embedding in this lesson fail the same way, because it is a hashed bag of words.

      **Asking a model to compare the query with every document** is accurate but does not scale. Reimers and
      Gurevych measured it: finding the most similar pair among 10,000 sentences with BERT used as a
      **cross-encoder** (both sentences fed in together) "requires about 50 million inference computations
      (~65 hours)"; with Sentence-BERT, a **bi-encoder** that embeds each sentence once, it took about 5
      seconds to compute the 10,000 embeddings plus about 0.01 seconds of cosine similarities.

      That is the shape of every semantic search system: **embed each document once, ahead of time; embed the
      query at search time; compare vectors**. Cross-encoders still have a place - re-scoring the top 20-100
      results (reranking), which [Retrieval-augmented generation](#/lesson/retrieval-augmented-generation)
      covers.

  - id: embeddings
    kind: internals
    concepts: [text-embeddings-and-similarity]
    title: What an embedding is - and what the toy one cannot do
    body: |
      The practice project ships a deliberately simple embedding, `toy_embeddings.embed`. It lower-cases the
      text, takes every word and every pair of neighbouring words, hashes each one to one of 256 positions
      with a +1 or −1 sign, adds them up and scales the vector to length 1. Real output:

      ```python
      from toy_embeddings import embed
      v = embed("Refund a card payment")
      v.shape, round(float(np.linalg.norm(v)), 3), int((v != 0).sum())
      # ((256,), 1.0, 7)        4 words + 3 word pairs = 7 non-zero positions
      ```

      Because the vectors have length 1, `embed(a) @ embed(b)` **is** their cosine similarity. Real scores:

      ```plaintext
      'refund a card payment'   vs 'How to refund a card payment'          0.798
      'refund a card payment'   vs 'payment card refund'                   0.507
      'refund a card payment'   vs 'give the customer their money back'   -0.105
      'refund'                  vs 'reimbursement'                          0.000
      'the refund was approved' vs 'the refund was not approved'           0.756
      ```

      Read them as a tester would:

      - **Shared words score high, word order a little.** Same words in another order lose the shared
        word pairs, so 0.798 drops to 0.507.
      - **Synonyms score zero.** "refund" and "reimbursement" share no feature. The −0.105 is not "opposite
        meaning" either - it is two hash collisions with opposite signs. A score near zero from this model means
        "no shared words", nothing more.
      - **Negation barely matters.** "approved" and "not approved" score 0.756 - most of their words are the
        same. Learned embeddings are better at this, but not immune; test negation in your evaluation set.

      **Learned embeddings** fix the first two problems by training. Word2vec (Mikolov et al., 2013) learned one
      vector per *word* from the words around it - see [Sequence models, RNNs and word
      embeddings](#/lesson/sequence-models-and-embeddings). Sentence-embedding models give one vector per
      *text*: Sentence-BERT runs a pretrained transformer over the sentence, averages the output vectors (its
      default "MEAN" pooling) and fine-tunes the network with siamese and triplet objectives so that
      "semantically similar sentences are close in vector space" and "can be compared using
      cosine-similarity". Provider embedding models are trained for the same goal; their training data and
      architecture are mostly not published.

      What does not change between the toy and a real model is the **contract**: same model for queries and
      documents, fixed dimension, compare with the similarity the model was trained for.

  - id: metrics
    kind: internals
    concepts: [text-embeddings-and-similarity]
    title: Cosine, dot product and L2 - when they disagree and when they agree
    body: |
      Three documents and a query in 2-D, so you can check by hand (real output of `similarity` from the
      exercise, higher is better; L2 is reported as **minus** the distance so "higher is better" holds for all
      three):

      ```python
      docs  = np.array([[1.0, 0.0], [3.0, 3.0], [0.6, 0.8]])
      query = np.array([1.0, 0.2])
      ```

      ```plaintext
      cosine [0.981  0.832  0.745]  ranking [0 1 2]
      dot    [1.     3.6    0.76 ]  ranking [1 0 2]
      l2     [-0.2  -3.441 -0.721]  ranking [0 2 1]
      ```

      Three metrics, three different rankings. Document 1, `[3, 3]`, is long: the dot product rewards its
      length (3.6), L2 punishes it (it is far away), and cosine looks only at its direction (45°).

      Now normalise all four vectors to length 1 and score again:

      ```plaintext
      normalised cosine [0.981  0.832  0.745]   ranking [0 1 2]
      normalised dot    [0.981  0.832  0.745]   ranking [0 1 2]
      normalised l2     [-0.197 -0.58  -0.714]  ranking [0 1 2]
      ‖a − b‖²          [0.039  0.336  0.51 ]
      2 − 2·cos         [0.039  0.336  0.51 ]
      ```

      On unit vectors **the three agree**, because ‖a − b‖² = ‖a‖² + ‖b‖² − 2a·b = 2 − 2·cos(a, b): the
      distance is a decreasing function of the cosine. The FAISS paper uses the same expansion to compute
      exact L2 search as one matrix product.

      What the providers document (provider-specific, as documented on 2026-11-14):

      - **OpenAI**: "OpenAI embeddings are normalized to length 1", so "Cosine similarity can be computed
        slightly faster using just a dot product" and "Cosine similarity and Euclidean distance will result in
        the identical rankings". They recommend cosine similarity.
      - **Voyage AI** (in Anthropic's embeddings page): "Voyage AI embeddings are normalized to length 1",
        with the same two consequences.
      - **pgvector**: "If vectors are normalized to length 1 (like OpenAI embeddings), use inner product for
        best performance."

      The practical rule: **normalise once when you store, and use the cheapest equivalent metric** (the dot
      product). If a model's vectors are *not* normalised, the choice matters - use the metric its
      documentation says it was trained for. And when you shorten vectors yourself (both providers document
      models whose vectors keep their meaning when truncated to fewer dimensions), normalise them again
      afterwards; both guides say so.

  - id: providers
    kind: example
    concepts: [text-embeddings-and-similarity]
    title: What a provider's embedding call looks like (documentation, not run)
    body: |
      The shapes below are **quoted from the providers' documentation as of 2026-11-14** - they were not run
      for this lesson and model names change. They show the decisions you make when you call one.

      OpenAI's guide shows a request to `POST https://api.openai.com/v1/embeddings` with `input` and `model`
      (for example `text-embedding-3-small`) and says: "By default, the length of the embedding vector is 1536
      for `text-embedding-3-small` or 3072 for `text-embedding-3-large`", with a `dimensions` parameter to
      request shorter vectors.

      Anthropic's page states that "Anthropic does not offer its own embedding model" and documents Voyage AI's
      models, for example (Python, from that page):

      ```python
      # Illustrative - quoted from the documentation, needs a VOYAGE_API_KEY; not run here.
      import voyageai
      vo = voyageai.Client()
      doc_embds = vo.embed(documents, model="voyage-4", input_type="document").embeddings
      query_embd = vo.embed([query], model="voyage-4", input_type="query").embeddings[0]
      ```

      Notice `input_type`. The page explains that Voyage prepends a different prompt for each: "Represent the
      query for retrieving supporting documents: " for queries and "Represent the document for retrieval: "
      for documents, and tells you not to omit it for retrieval. Queries and documents are embedded
      **asymmetrically** on purpose - so a test that embeds a document as a "query" and expects to find itself
      is testing the wrong thing.

      What to record next to every stored vector, whatever the provider: the **model name and version**, the
      **dimension**, the **input type** and whether it was **normalised**. A vector from one model is
      meaningless next to a vector from another; changing the model means re-embedding the whole collection.

  - id: brute-force
    kind: code
    concepts: [exact-and-approximate-search, filtered-vector-search]
    title: Exact search - one matrix product and a partial sort
    body: |
      An exact index stores a matrix with one normalised row per document. A search is:

      ```python
      def top_k(scores, k):
          if k < len(scores):
              kth = -np.partition(-scores, k - 1)[k - 1]      # the k-th best score, O(n)
              candidates = np.flatnonzero(scores >= kth)      # every position at least that good
          else:
              candidates = np.arange(len(scores))
          order = np.lexsort((candidates, -scores[candidates]))   # best first, ties to the lower position
          return candidates[order][:k]

      scores = vectors @ normalise_rows(query)                # cosine, because the rows are unit length
      best = top_k(scores, 10)
      ```

      Two details matter in tests. **Ties** must break the same way every time (here: earlier-added first), or
      two runs of the same query return different results. And **partial selection** (`np.partition`, O(n))
      instead of sorting all n scores (O(n log n)).

      The `BruteForceIndex` in the exercise wraps this with ids and metadata. On the twelve synthetic SandPay
      articles (real output, scores rounded):

      ```python
      index = BruteForceIndex(256)
      index.add(ids, embed_many(titles), metadata)       # metadata like {"topic": "refunds", "region": "us"}
      index.search(embed("refund a card payment"), 3)
      # [('a01', 0.798), ('a02', 0.683), ('a09', 0.63)]
      index.search(embed("refund a card payment"), 3, where={"region": "us"})
      # [('a02', 0.683), ('a12', 0.105), ('a06', 0.098)]
      index.search(embed("refund a card payment"), 3, where={"region": "us", "topic": "refunds"})
      # [('a02', 0.683)]
      ```

      a01 is "How to refund a card payment", a02 its US version, a09 "A card payment was declined" (shares
      "card payment"). The filtered searches return k results while k rows match, then fewer - never an error.

      **How fast is exact search?** 50,000 synthetic vectors of 64 dimensions, 200 queries, 2 threads (real
      measurements):

      ```plaintext
      scores M @ q:                       1.35 ms
      scores + top_k (partition):         1.62 ms
      BruteForceIndex.search:             1.87 ms/query
      200 queries batched, one matmul:    0.72 ms/query
      ```

      Almost all the time is the matrix product, which grows with **n × d**. Under 2 ms for 50,000 vectors
      means exact search is a perfectly good answer for many applications - a help centre, a company wiki, a
      few hundred thousand chunks. Exact search also has **perfect recall**, which is why it is the reference
      every approximate index is measured against.

  - id: ivf
    kind: internals
    concepts: [exact-and-approximate-search]
    title: An approximate index you build - the inverted file (IVF)
    body: |
      The FAISS paper describes the inverted file this way: a coarse quantizer, "trained via k-means", maps
      each vector to its nearest centroid; "the inverted file, groups the vectors into ... inverted lists" with
      the same centroid; a search computes the query's distance to the centroids, keeps the τ nearest (τ is
      "the multi-probe parameter", `nprobe` in the FAISS library, `probes` in pgvector), and scans only those
      lists. (FAISS's IVFADC also compresses the vectors with product quantization; this lesson's index stores
      them uncompressed, which is what pgvector calls IVFFlat.)

      The exercise's `IVFIndex` has three steps:

      ```python
      index = IVFIndex(n_lists=224, seed=0)
      index.train(base[:20_000])     # k-means on a sample: 224 centroids
      index.add(ids, base)           # each vector goes into the list of its nearest centroid
      index.search(q, 10, nprobe=8)  # scan the 8 lists nearest q, return the best 10 found there
      ```

      The miss happens at the border. A true neighbour that sits just across the boundary of a cell the query
      did not probe is never scored. More probes, fewer misses, more work.

      Real measurements: 50,000 normalised synthetic vectors (64 dimensions, 100 topics), 224 lists (≈ √n),
      k-means trained on 20,000 of them in 8.7 s, adding all 50,000 in 1.1 s; list sizes from 11 to 535,
      median 187. Recall@10 is **neighbour recall** against the exact top 10 for 200 held-out queries; the
      speed-up is against `BruteForceIndex.search` (1.87 ms per query):

      ```plaintext
      nprobe  recall@10  scanned  ms/query  speed-up
           1      0.615     0.6%      0.17     11.0x
           2      0.812     1.0%      0.20      9.3x
           4      0.904     1.8%      0.28      6.7x
           8      0.936     3.5%      0.43      4.3x
          16      0.966     7.1%      0.77      2.4x
          32      0.983    14.3%      1.49      1.3x
          64      0.995    28.3%      2.76      0.7x
         224      1.000   100.0%      9.00      0.2x
      ```

      What to take from it:

      - **The knob is a curve, not a switch.** One probe is 11 times faster and misses 4 of every 10 true
        neighbours; 16 probes find 97% for 2.4 times the speed.
      - **Approximate is not automatically faster.** From 64 probes on, this Python index is *slower* than
        exact search - gathering scattered lists costs more than one contiguous matrix product. Measure against
        a well-written brute force, not a slow one.
      - **Scale changes the answer.** With 400,000 vectors and 800 topics (632 lists, built in 83 s), exact
        search took 13.9 ms per query; nprobe 4 gave recall 0.639 at 15.9x, nprobe 32 gave 0.840 at 2.5x. The
        same nprobe gives different recall on different data - always re-measure.

      pgvector's advice for IVFFlat (version 0.8.7) matches this shape: create the index after the table has
      data, start with `lists` at "rows / 1000 for up to 1M rows and sqrt(rows) for over 1M rows", and probes
      at "sqrt(lists)"; "higher is better for recall, lower is better for speed".

  - id: visual-ivf
    kind: visual
    concepts: [exact-and-approximate-search]
    title: Where an IVF search spends its time
    body: |
      ```mermaid
      flowchart LR
        Q[query vector] --> N[normalise]
        N --> C[compare with all centroids]
        C --> P[keep the nprobe nearest lists]
        P --> S[score only the vectors in those lists]
        S --> K[top k]
        T[k-means on a sample, once] -.-> C
        A[add: each vector into its nearest list] -.-> S
      ```

      Notice that the expensive "score every vector" step of brute force became "score the vectors in a few
      lists". Training (k-means) and adding happen once, offline; `nprobe` is the only query-time knob, and a
      true neighbour in an unprobed list is invisible.

  - id: hnsw
    kind: internals
    concepts: [exact-and-approximate-search]
    title: HNSW - the graph index most vector databases default to
    body: |
      Malkov and Yashunin's HNSW builds "a multi-layer structure consisting from hierarchical set of proximity
      graphs (layers) for nested subsets of the stored elements". Each new element gets a random top layer
      ("with an exponentially decaying probability distribution"), so upper layers are sparse and the bottom
      layer holds everything. A search starts at the top layer, greedily moves to the neighbour closest to the
      query until it cannot improve, drops a layer and repeats, keeping a candidate list of size `ef` at the
      bottom. The paper reports logarithmic complexity scaling. You do not build HNSW in this lesson; you set
      its parameters.

      pgvector 0.8.7's documented HNSW options (not run here):

      ```sql
      CREATE INDEX ON items USING hnsw (embedding vector_cosine_ops) WITH (m = 16, ef_construction = 64);
      SET hnsw.ef_search = 100;
      ```

      - `m` - "the max number of connections per layer (16 by default)";
      - `ef_construction` - "the size of the dynamic candidate list for constructing the graph (64 by
        default)"; higher gives better recall at the cost of build time;
      - `hnsw.ef_search` - the candidate list size at query time, 40 by default; "A higher value provides
        better recall at the cost of speed."

      The README's comparison: HNSW "has better query performance than IVFFlat (in terms of speed-recall
      tradeoff), but has slower build times and uses more memory", and needs no training step, so it can be
      created on an empty table. IVFFlat builds faster and uses less memory. Either way it is the same contract
      as your IVF: a recall-versus-speed knob that you tune by measuring neighbour recall against exact search
      on your data.

  - id: filtering
    kind: example
    concepts: [filtered-vector-search]
    title: Filters - why "region = 'sg'" returned one result instead of ten
    body: |
      SandPay's merchants are spread over ten regions; a merchant in Singapore must only see Singapore
      articles. In the 50,000-vector collection, 5,047 rows (about 10%) have `region == "sg"`. Three ways to
      answer "top 10 for this query, Singapore only" (real measurements, 200 queries; recall is against the
      exact filtered top 10):

      ```plaintext
      post-filter: IVF top 10 (nprobe 8), then keep sg rows     mean 1.0 results (min 0, max 4)   recall 0.101
      over-fetch:  IVF top 100 (nprobe 8), keep sg, first 10    mean 9.0 results                  recall 0.801
      pre-filter:  exact search over the sg rows only           10 results                        recall 1.000
      ```

      The post-filter result is what you should expect: if 10% of rows pass, about 10% of any top 10 pass -
      one result. pgvector documents exactly this for its approximate indexes: "filtering is applied *after*
      the index is scanned. If a condition matches 10% of rows, with HNSW and the default `hnsw.ef_search` of
      40, only 4 rows will match on average."

      Options, from the pgvector README (0.8.7) and this lesson's measurements:

      - **Pre-filter and search exactly** when the filtered subset is small. Here, with the sg rows already
        in their own array, exact search over 5,047 vectors took **0.15 ms**. (The exercise's
        `BruteForceIndex` checks each row's metadata in a Python loop - 31 ms per query on 50,000 rows; a
        database would use an ordinary index on the filter column, which is pgvector's first suggestion.)
      - **Over-fetch** - ask the index for more and filter. Better (0.801), never guaranteed.
      - **Iterative index scans** (pgvector 0.8.0+): `SET hnsw.iterative_scan = strict_order;` makes the
        index "automatically scan more of the index until enough results are found" (or a limit is reached).
      - **Partial indexes or partitions** per filter value, when there are few values (pgvector:
        `CREATE INDEX ... USING hnsw (...) WHERE (category_id = 123)`).

      Tenant filters are different from convenience filters: returning another tenant's document is a data
      leak, not a relevance bug. Never rely on post-filtering of a shared index for isolation without testing
      it, and remember pgvector's note that with a shared approximate index "vectors from one tenant can affect
      recall (and speed) for other tenants".

  - id: evaluation
    kind: tests
    concepts: [retrieval-evaluation]
    title: Measuring search - a labelled query set, recall@k and MRR
    body: |
      Neighbour recall says whether the **index** finds what exact search would. It cannot say whether the
      **embedding** puts the right article first. For that you need queries with known answers. SandPay's
      first evaluation set has eight queries; four reuse the articles' words, four are paraphrases a real
      merchant would type. Real output of `evaluate` with the toy embedding and exact search, k = 3:

      ```plaintext
      query                                       top 3                    recall@3  RR
      'refund a card payment'                     ['a01', 'a02', 'a09']    1.00      1.00
      'refund pending'                            ['a03', 'a01', 'a02']    1.00      1.00
      'dispute a chargeback'                      ['a06', 'a05', 'a09']    1.00      1.00
      'change bank account for payouts'           ['a08', 'a07', 'a12']    1.00      1.00
      'give the customer their money back'        ['a02', 'a07', 'a03']    0.33      1.00
      'customer says the purchase was fraudulent' ['a11', 'a09', 'a12']    0.00      0.00
      'when do I get paid'                        ['a11', 'a07', 'a01']    1.00      0.50
      'forgot my login'                           ['a03', 'a07', 'a01']    0.00      0.00

      all 8:       recall@3 0.667   MRR@3 0.688   misses: fraudulent, forgot my login
      lexical 4:   recall@3 1.0     MRR@3 1.0
      paraphrase:  recall@3 0.333   MRR@3 0.375
      ```

      How to read it:

      - **recall@3** for "money back" is 1/3: three articles (a01, a02, a04) are relevant and only a02 came
        back. **RR** is 1.0 anyway, because the first result happened to be relevant. The two metrics answer
        different questions - "did we find them all?" versus "how soon was the first good one?" - and RAG
        usually cares about both.
      - **Look at the hits that look like successes.** a02 scored only 0.072 - it shares the word "the" with the
        query. "when do I get paid" finds a07 at rank 2 through the word "when". With a toy embedding,
        "relevant" results can be luck. Read the top results of a sample of queries, not only the averages.
      - **Split the set.** The overall 0.667 hides that the toy model is perfect on queries that reuse the
        words and poor on paraphrases. An evaluation set made only of queries copied from the documents makes
        any keyword-like model look perfect.
      - **The misses list is the work list.** Each miss is a candidate fix: a better embedding model, a
        hybrid with keyword search, a rewritten title, or a synonym in the document.

      Positive and negative cases to keep in the regression set:

      | Case | Expected | Evidence |
      | --- | --- | --- |
      | Query that copies an article title | that article at rank 1 | RR = 1 |
      | Paraphrase with no shared words | relevant article in the top k | recall@k per query, logged |
      | Negated query ("refund **not** received") | the "pending / not received" article above "how to refund" | rank of each |
      | Filter on region `us` | only `us` rows, k of them while k exist | every result's metadata checked |
      | Tenant A's query | zero rows from tenant B | assert on tenant id of every result, including with an ANN index |
      | ANN index vs exact | neighbour recall@10 ≥ the agreed target (for example 0.95) | measured on held-out queries after each re-index |

  - id: steps
    kind: steps
    concepts:
      [text-embeddings-and-similarity, exact-and-approximate-search, filtered-vector-search, retrieval-evaluation]
    title: Building a vector search, step by step
    body: |
      1. **Write the evaluation set first.** 30-100 real queries (from search logs or support tickets), with
         the ids of the right documents, including paraphrases, negations and filtered queries.
      2. **Choose the embedding model** and record its name, version, dimension and input types. Measure it
         on the evaluation set before building anything else.
      3. **Embed the documents** (with the document input type, if the model has one), normalise, and store
         vector + id + metadata + model version together.
      4. **Start with exact search.** Measure recall@k, MRR and latency. If latency is acceptable, stop here -
         you have perfect neighbour recall.
      5. **If it is too slow, add an ANN index** (HNSW or IVF), and tune its query knob (`ef_search`,
         `nprobe`) until neighbour recall@k meets the target on held-out queries; record the latency.
      6. **Decide how filters run** - pre-filter, over-fetch, iterative scans or partitions - and test that
         filtered searches still return k results and never cross a tenant boundary.
      7. **Re-run the evaluation on every change** - model, chunking, index parameters, data growth - and keep
         the misses as regression cases.

  - id: mistakes
    kind: mistakes
    concepts:
      [text-embeddings-and-similarity, exact-and-approximate-search, filtered-vector-search, retrieval-evaluation]
    title: Common mistakes and how to debug them
    body: |
      - **Mixing models.** Documents embedded with one model, queries with another (or a newer version). Scores
        look random. Store the model version with each vector and assert it at query time.
      - **Dot product on unnormalised vectors** when cosine was intended - long documents win. Normalise on
        write, or use the metric the model documents.
      - **Truncating vectors without re-normalising** them, so "cosine" is no longer cosine.
      - **Sorting the wrong way.** Ascending sort of *similarities* returns the least similar documents;
        ascending sort of *distances* is right. pgvector's `<#>` "returns the negative inner product" so that
        ascending order works - read each library's sign convention.
      - **Post-filtering an approximate index** and wondering why filtered searches return 1-4 results.
      - **Comparing ANN latency with a slow brute force.** The IVF table above shows an index that is slower
        than exact search when over-probed.
      - **Evaluating only on easy queries**, or only on averages. Split by query type and read the misses.
      - **Building an IVF index on an empty or tiny table** - the centroids are learned from whatever is there
        (pgvector: create it "after the table has some data").

      **Debugging method.** For a bad result, answer in order: (1) Is the right document in the store, with
      the right metadata? (2) What is its exact similarity to the query - is it in the **exact** top k? If
      not, it is an embedding or content problem, not an index problem. (3) If exact search finds it but the
      index does not, raise `nprobe`/`ef_search` or check the filter strategy.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [exact-and-approximate-search, text-embeddings-and-similarity]
    title: Trade-offs and alternatives
    body: |
      | Choice | Gains | Costs |
      | --- | --- | --- |
      | Exact search | perfect recall, no tuning, simple filters | time and memory grow with n × d |
      | IVF / IVFFlat | fast build, low memory, simple to reason about | needs training data; recall depends on nprobe and on data drift after training |
      | HNSW | best speed-recall trade-off in pgvector's comparison, no training | slower build, more memory |
      | Larger dimension | often better quality | more storage and slower scoring (cost is linear in d) |
      | Fewer dimensions (shortened vectors) | cheaper storage and search | some quality; measure it |
      | Keyword search | exact terms, ids, codes, explainable | misses paraphrases |
      | Hybrid (keyword + vector) | both kinds of match | two systems to tune; results must be fused |

      pgvector's README suggests combining Postgres full-text search with vector search and fusing the two
      ranked lists (it links to examples using Reciprocal Rank Fusion and a cross-encoder). Other ANN families
      exist - locality-sensitive hashing and product quantization among them (the HNSW paper's introduction
      lists both) - with the same need to be measured.

  - id: when
    kind: when
    concepts: [exact-and-approximate-search, text-embeddings-and-similarity]
    title: When to use vector search - and when not
    body: |
      Use it when users describe what they want in their own words: help centres, support-ticket routing,
      duplicate detection, recommendations, and the retrieval step of RAG.

      Do not use it alone for exact lookups - an order number, an IBAN-like reference, an error code - where
      keyword or database search is exact and explainable. Do not add an ANN index before exact search is
      measurably too slow. And do not treat a similarity score as a probability or a confidence: 0.63 means
      "closer than 0.60" for this model and nothing in absolute terms; thresholds must be calibrated on your
      evaluation set and re-checked when the model changes.

  - id: summary
    kind: summary
    concepts:
      [text-embeddings-and-similarity, exact-and-approximate-search, filtered-vector-search, retrieval-evaluation]
    title: Quick reference
    body: |
      - Embedding = fixed-length vector per text; same model (and the right input type) for queries and
        documents.
      - Unit vectors: cosine = dot product, and ‖a − b‖² = 2 − 2·cos, so all three rank alike. Normalise once.
      - Bag-of-words vectors fail on synonyms (0.000) and barely see negation (0.756).
      - Exact search: one matrix product + partial selection; perfect recall; 1.87 ms for 50,000 × 64 here.
      - IVF: k-means cells, scan `nprobe` nearest lists; recall 0.615 → 0.966 from 1 to 16 probes here, and
        slower than exact when over-probed. HNSW: graph, tune `ef_search`.
      - Post-filtering an ANN top 10 at 10% selectivity returned 1 result on average; pre-filter, over-fetch,
        iterative scans or partitions.
      - recall@k = found relevant / all relevant; RR = 1 / rank of the first relevant; MRR = mean RR.
        Neighbour recall = ANN vs exact, no labels needed.

exercises:
  - id: synonym-miss
    type: mcq
    concept: text-embeddings-and-similarity
    skill: application
    title: Why "forgot my login" finds nothing
    prompt: |
      With the toy embedding, the query "forgot my login" returns `['a03', 'a07', 'a01']` - none of them is
      a11, "Reset your dashboard password". `embed("refund") @ embed("reimbursement")` is 0.000. What is the
      best explanation and next step?
    options:
      - id: right
        text: The toy vector only matches shared words (and word pairs); the query and a11 share none. Measure a trained sentence-embedding model (or add keyword synonyms) on the paraphrase queries.
        feedback: Correct - a hashed bag of words has no notion of meaning; only training on text puts "login" near "password".
      - id: index
        text: The index is approximate and skipped a11; raise nprobe.
        feedback: This search is exact (brute force). An index can only lose neighbours that exact search would find, and exact search does not find a11 either.
      - id: metric
        text: Cosine is the wrong metric; use L2 distance.
        feedback: The vectors are unit length, so L2 gives the same ranking as cosine. Changing the metric cannot create similarity that isn't in the vectors.
      - id: dimension
        text: 256 dimensions is too small; use 2048.
        feedback: More hash buckets would reduce collisions, but "forgot" and "password" would still be different words with unrelated buckets.
    correct: [right]
    hints:
      - Which words do the query and the article title share?
      - Would exact search find a11? Then is it an index problem?
    solution: |
      The scores come from shared features only, and there are none. Confirm it by checking a11's exact
      similarity to the query (it is not in the exact top 3, so the index is not to blame). The fix is the
      representation - a learned embedding model, a hybrid with keyword search plus synonyms - measured on the
      paraphrase queries, where the toy model scored recall@3 0.333.

  - id: metrics-agree
    type: mcq
    concept: text-embeddings-and-similarity
    skill: analysis
    title: Which metric should the store use?
    prompt: |
      A provider documents that its embeddings are normalised to length 1. A teammate wants to store them in
      pgvector and asks which operator to index: `<->` (L2), `<#>` (negative inner product) or `<=>` (cosine
      distance). Which answer is right?
    options:
      - id: right
        text: All three give the same ranking on unit vectors; inner product is the cheapest, and pgvector's README recommends it for vectors normalised to length 1.
        feedback: Correct - ‖a − b‖² = 2 − 2·cos for unit vectors, and the dot product skips the norms.
      - id: cosine-only
        text: Only cosine distance is correct for text embeddings; the others give wrong results.
        feedback: For unit vectors, cosine and dot product are the same number and L2 is a decreasing function of it - the rankings are identical.
      - id: l2-best
        text: L2, because it is the only true distance and the others are similarities.
        feedback: Being a metric in the mathematical sense does not change the ranking here, and L2 costs more to compute.
      - id: depends-length
        text: Inner product, but only after re-normalising every vector at query time.
        feedback: The provider already normalised them. Re-normalising stored vectors on every query wastes work; normalise once on write if you ever transform them (for example by truncating).
    correct: [right]
    hints:
      - Expand ‖a − b‖² for vectors of length 1.
      - What does pgvector's README say about vectors normalised to length 1?
    solution: |
      With ‖a‖ = ‖b‖ = 1: a·b = cos(a, b) and ‖a − b‖² = 2 − 2·cos(a, b). The three operators order results
      identically; `<#>` (inner product, negated so ascending order works) is cheapest. On raw vectors they
      disagree - in the lesson's 2-D example, cosine ranked [0 1 2], dot [1 0 2], L2 [0 2 1].

  - id: negation-score
    type: mcq
    concept: text-embeddings-and-similarity
    skill: analysis
    title: Reading a high score
    prompt: |
      `embed("the refund was approved") @ embed("the refund was not approved")` is 0.756 with the toy model.
      A product manager concludes that the search "understands that these are about the same thing". What do
      you say?
    options:
      - id: right
        text: The score is high because 4 of the 5 words are shared; it says nothing about meaning. Add negated queries to the evaluation set and check how the real model ranks them.
        feedback: Correct - a bag-of-words similarity is word overlap. Negation is a known weak spot; measure it.
      - id: means-75
        text: It means the sentences are 75.6% similar in meaning.
        feedback: Similarity scores are not percentages of meaning or probabilities; they are only comparable with other scores from the same model.
      - id: threshold
        text: Raise the match threshold to 0.8 and the problem disappears.
        feedback: A threshold would also drop good matches (the title query scored 0.798). It doesn't teach the model what "not" means.
      - id: fine
        text: That is correct behaviour - both are about refunds.
        feedback: For a merchant whose refund was not approved, an article on approved refunds is the wrong answer. Topic overlap is not relevance.
    correct: [right]
    hints:
      - Count the shared words.
      - What does a score from this model measure?
    solution: |
      The toy vector is a sum of word and word-pair features; four words are shared, so the score is high
      whatever "not" does. Learned models usually do better, but not always - add negated queries with their
      correct articles to the evaluation set and look at the ranks.

  - id: order-pipeline
    type: order
    concept: retrieval-evaluation
    skill: application
    title: Order the build of a semantic search
    prompt: Put the steps for SandPay's help-centre search in the order a careful team would do them.
    items:
      - id: label
        text: Collect real queries and label the right articles for each, including paraphrases
      - id: model
        text: Choose an embedding model and record its name, version, dimension and input types
      - id: embed
        text: Embed and normalise the articles, and store vector, id, metadata and model version together
      - id: exact
        text: Run exact search and measure recall@k, MRR and latency on the labelled queries
      - id: ann
        text: Only if exact search is too slow, add an ANN index and tune nprobe or ef_search against exact search
      - id: rerun
        text: Re-run the evaluation after every change of model, content or index settings
    hints:
      - What do you need before you can say a model is good?
      - Which search is the reference for the approximate one?
    solution: |
      The labelled set comes first, because every later decision is measured on it. The model is chosen and
      recorded before embedding; exact search sets the quality and latency baseline; an index is added only
      when needed and tuned against exact search; evaluation repeats on every change.

  - id: need-ann
    type: mcq
    concept: exact-and-approximate-search
    skill: analysis
    title: Do we need an ANN index?
    prompt: |
      SandPay's help centre has 40,000 article chunks, 1024-dimensional unit vectors, about 5 searches per
      second. Exact search in NumPy measures 3 ms per query. An engineer proposes adding HNSW "because vector
      search needs an index". What do you recommend?
    options:
      - id: right
        text: Keep exact search - it has perfect recall and 3 ms is well within budget; set a latency alert and revisit when the collection or traffic grows.
        feedback: Correct - an ANN index trades recall for speed you do not need yet, and adds tuning and build cost.
      - id: always-index
        text: Add HNSW - exact search does not scale.
        feedback: It scales linearly, which is fine at this size. Scaling later is a measured decision, not a default.
      - id: ivf
        text: Add IVF with nprobe = 1, the fastest setting.
        feedback: In the lesson's measurement nprobe = 1 lost about 4 of every 10 true neighbours. Speed you don't need, bought with recall you do.
      - id: dims
        text: Cut the vectors to 64 dimensions first.
        feedback: That might lose quality and needs evaluating; it solves a latency problem that does not exist.
    correct: [right]
    hints:
      - What does exact search cost here, and what is the budget?
      - What does an ANN index give up?
    solution: |
      Exact search is a single matrix product - n × d multiply-adds - and here it is already fast. An ANN index
      would cost recall, build time, memory and tuning. Record the latency, alert on it, and add an index when
      measurements say so.

  - id: choose-nprobe
    type: mcq
    concept: exact-and-approximate-search
    skill: application
    title: Pick nprobe from the measurements
    prompt: |
      The team's target is neighbour recall@10 of at least 0.95 at the lowest latency. Using the lesson's IVF
      table (50,000 vectors, 224 lists; exact search 1.87 ms), which setting do you choose?

      ```plaintext
      nprobe  recall@10  ms/query
           4      0.904      0.28
           8      0.936      0.43
          16      0.966      0.77
          32      0.983      1.49
          64      0.995      2.76
      ```
    options:
      - id: sixteen
        text: nprobe 16 - the lowest setting that meets 0.95, 0.77 ms.
        feedback: Correct - it meets the target with the least work. Re-check it on held-out queries after each re-index.
      - id: eight
        text: nprobe 8 - 0.936 rounds to 0.95.
        feedback: 0.936 is below the target. It misses about 6 of every 100 true neighbours.
      - id: sixty-four
        text: nprobe 64 - always pick the highest recall.
        feedback: 64 probes is slower than exact search here (2.76 ms vs 1.87 ms); at that point use exact search and get recall 1.0.
      - id: exact
        text: None - recall below 1.0 is never acceptable.
        feedback: That is a valid product decision, but then you would not add the index at all. The question set a 0.95 target.
    correct: [sixteen]
    hints:
      - Which rows meet the target?
      - Among those, which is fastest - and is any slower than exact search?
    solution: |
      16, 32 and 64 meet 0.95; 16 is the fastest (0.77 ms, 2.4x faster than exact). The target and the choice
      only hold for this data - with 400,000 vectors the lesson measured recall 0.840 even at 32 probes.

  - id: debug-ivf
    type: debug
    concept: exact-and-approximate-search
    skill: analysis
    title: The index that returns the worst matches
    prompt: |
      This IVF search (vectors and centroids are unit length) returns nonsense: the top results have the
      **lowest** similarities, and recall@10 against exact search is 0.0 even with many probes. Click every
      wrong line.
    language: python
    code: |
      def search(self, query, k, nprobe=1):
          q = query / np.linalg.norm(query)
          d2 = ((self.centroids - q) ** 2).sum(axis=1)
          probe = np.argsort(d2)[-nprobe:]
          candidates = np.concatenate([self.lists[j] for j in probe])
          scores = self.vectors[candidates] @ q
          best = np.argsort(scores)[:k]
          return [(self.ids[candidates[i]], float(scores[i])) for i in best]
    correctLines: [4, 7]
    lineNotes:
      - line: 2
        note: Normalising the query is right - the stored vectors are unit length, so the dot product on line 6 is then cosine.
      - line: 3
        note: Squared L2 to every centroid is fine; with unit vectors it ranks the same as cosine.
      - line: 6
        note: The dot product of unit vectors is the cosine similarity - correct.
    hints:
      - "argsort sorts ascending. What is at the end of an ascending list of distances?"
      - Which line handles distances (smaller is better) and which handles similarities (bigger is better)?
    solution: |
      **Line 4** takes the *last* entries of an ascending sort of distances - the **furthest** lists. Use
      `np.argsort(d2)[:nprobe]`. **Line 7** takes the first entries of an ascending sort of similarities - the
      **least** similar candidates. Use the highest (`np.argsort(-scores)[:k]`, or partial selection with a tie
      rule). Distances sort ascending, similarities descending; mixing them up is the classic vector-search
      bug, and a test against exact search catches it at once.

  - id: post-filter
    type: mcq
    concept: filtered-vector-search
    skill: analysis
    title: Ten results requested, one returned
    prompt: |
      SandPay moved help-centre search to Postgres with pgvector and an HNSW index. The query
      `... WHERE region = 'sg' ORDER BY embedding <=> $1 LIMIT 10` returns between 0 and 4 rows; without the
      `WHERE` it returns 10. About 10% of rows are `sg`. What is happening, and what is a documented fix?
    options:
      - id: right
        text: The filter is applied after the approximate index returns its candidates (ef_search, 40 by default), so about 10% of them survive. Enable iterative index scans, or use a partial index or exact search for the sg subset.
        feedback: Correct - this is the behaviour pgvector's README describes, with iterative scans (0.8.0+), partial indexes and partitioning as remedies.
      - id: data
        text: Only a few sg articles exist.
        feedback: 10% of the table is sg - thousands of rows. Exact search with the same WHERE returns 10.
      - id: operator
        text: "`<=>` is wrong for normalised vectors; use `<#>`."
        feedback: On unit vectors both rank the same. The operator is not why rows disappear.
      - id: limit
        text: LIMIT is applied before WHERE in SQL.
        feedback: Logically WHERE comes first. The issue is that the approximate index produces only a limited candidate set before the filter.
    correct: [right]
    hints:
      - How many candidates does the index produce, and what fraction pass the filter?
      - Look at pgvector's "Filtering" and "Iterative Index Scans" sections.
    solution: |
      With approximate indexes "filtering is applied *after* the index is scanned" (pgvector README). The
      lesson measured the same effect in its own IVF index: post-filtering a top 10 returned 1.0 results on
      average (recall 0.101), over-fetching 100 returned 9.0 (0.801), exact pre-filtered search returned 10.
      Confirm by comparing with exact search - pgvector's README shows `SET LOCAL enable_indexscan = off;`
      inside a transaction ("use exact search") for monitoring recall - and choose a remedy.

  - id: tenant-tests
    type: testdesign
    concept: filtered-vector-search
    skill: application
    title: Test tenant isolation in a shared vector index
    prompt: |
      SandPay will let each merchant search its own uploaded documents. All merchants' vectors live in one
      pgvector table with a `merchant_id` column and one HNSW index; every query adds
      `WHERE merchant_id = $1`. Design the tests that show one merchant can never see another's documents and
      still gets full results. Give preconditions, steps, expected results and evidence.
    modelAnswer: |
      **Preconditions:** a test database with two merchants, A (500 documents) and B (50,000 documents), with
      some near-duplicate texts across them (B has a document almost identical to A's query target); the
      production index type and parameters; a labelled query set for A.

      1. **No cross-tenant rows.** For every query in A's set, search as A with k = 10, 50 and 100. Expected:
         every returned row has `merchant_id = A`. Evidence: the rows with their merchant ids, asserted in the
         test, including the near-duplicate case where B's document is the closest vector overall.
      2. **Full results under the filter.** For A (1% of rows), expect k results while A has at least k
         documents. Evidence: result counts per query; compare with exact search on A's rows - neighbour
         recall@10 at or above the agreed target. Repeat with iterative scans on and off to show which
         configuration is needed.
      3. **Missing filter is impossible.** Call the search API without a merchant id or with another
         merchant's id in the body while authenticated as A. Expected: rejected (an authorisation error), never
         a search over all merchants. Evidence: response and server log.
      4. **Deleted documents.** Delete one of A's documents; search for it. Expected: gone from results.
      5. **Model version.** Insert a vector with a different model version tag for A; expected: excluded or
         the write rejected.
    rubric:
      - Asserts on the tenant id of every returned row, not just the count.
      - Includes a case where another tenant's vector is the nearest overall.
      - Checks that filtered searches still return k results and measures recall against exact search on the filtered subset.
      - Tests the API path (missing or forged tenant id), not only the SQL.
      - Names the evidence - rows, counts, recall numbers, logs.
    hints:
      - What happens to a small tenant's results when the filter runs after the index?
      - Where can the tenant id come from - and who controls it?
    solution: |
      Treat isolation as security (assert tenant ids on every row, forge the tenant id at the API) and
      completeness as relevance (k results and neighbour recall on the filtered subset for a small tenant,
      with and without iterative scans).

  - id: compute-metrics
    type: mcq
    concept: retrieval-evaluation
    skill: application
    title: Compute recall@3 and MRR by hand
    prompt: |
      Two queries, k = 3:

      - Q1 returns `['a11', 'a07', 'a01']`; relevant `{a07}`.
      - Q2 returns `['a02', 'a07', 'a03']`; relevant `{a01, a02, a04}`.

      What are the mean recall@3 and MRR@3?
    options:
      - id: right
        text: Recall@3 = (1 + 1/3) / 2 ≈ 0.667; MRR@3 = (1/2 + 1) / 2 = 0.75.
        feedback: Correct - Q1 finds its only relevant article at rank 2; Q2 finds one of three, at rank 1.
      - id: precision
        text: Recall@3 = (1/3 + 1/3) / 2 ≈ 0.333; MRR@3 = 0.75.
        feedback: 1/3 for Q1 is precision@3 (one of the three results is relevant). Recall divides by the number of relevant articles, which is 1 for Q1.
      - id: rank-sum
        text: Recall@3 ≈ 0.667; MRR@3 = 1 / ((2 + 1) / 2) ≈ 0.667.
        feedback: MRR averages the reciprocals, not the ranks.
      - id: all-rel
        text: Recall@3 ≈ 0.667; MRR@3 = 1.0, because both queries found something.
        feedback: Reciprocal rank depends on the position of the first relevant result - rank 2 gives 0.5.
    correct: [right]
    hints:
      - Recall divides by the number of relevant documents for that query.
      - Reciprocal rank = 1 / position of the first relevant result.
    solution: |
      Q1: recall 1/1 = 1, RR 1/2. Q2: recall 1/3, RR 1/1. Means: recall (1 + 0.333) / 2 = 0.667, MRR
      (0.5 + 1) / 2 = 0.75. These are two of the lesson's real rows ("when do I get paid" and "money back").

  - id: which-recall
    type: mcq
    concept: retrieval-evaluation
    skill: analysis
    title: Neighbour recall 0.99, but users still complain
    prompt: |
      After moving to HNSW, the team reports "recall@10 = 0.99" - measured as overlap with exact search. Users
      still complain that "forgot my login" finds nothing useful. What is the right reading?
    options:
      - id: right
        text: 0.99 is neighbour recall - the index finds what exact search finds. It says nothing about whether exact search finds the right articles; that needs labelled recall@k / MRR on real queries.
        feedback: Correct - two different measurements of two different components.
      - id: raise-ef
        text: Raise ef_search until neighbour recall is 1.0; the complaint will disappear.
        feedback: At neighbour recall 1.0 you get exactly the exact-search results, which are already wrong for this query.
      - id: users-wrong
        text: Recall 0.99 proves search is fine; the users are typing bad queries.
        feedback: Real users' wording is the test. The labelled set should contain their paraphrases.
      - id: switch-ivf
        text: Switch to IVF, which has better recall than HNSW.
        feedback: The index is not the problem - it already matches exact search 99% of the time.
    correct: [right]
    hints:
      - What is the reference set in "overlap with exact search"?
      - Would exact search find a11 for "forgot my login"?
    solution: |
      Neighbour recall measures the index against exact search; labelled recall@k and MRR measure the
      embedding and content against human judgements. Debug in that order: if exact search misses, fix the
      representation (model, hybrid search, content); if exact search hits and the index misses, tune the index.

  - id: vector-index-coding
    type: coding
    concept: text-embeddings-and-similarity
    skill: application
    title: An exact vector index with metadata filters
    prompt: |
      In `vector_index.py`, implement:

      - `normalise_rows(x)` - rows to length 1, zero rows stay zero, 1-D in gives 1-D out, input unchanged;
      - `similarity(query, matrix, metric)` - `"cosine"`, `"dot"` or `"l2"` (minus the distance), higher is
        better; anything else is a `ValueError`;
      - `top_k(scores, k)` - best first, ties to the lower position, `k` above the length returns all, `k < 1`
        is a `ValueError`; use partial selection;
      - `BruteForceIndex.add(ids, vectors, metadata)` - validate lengths, dimension and unique ids (store
        nothing on error); store normalised vectors for cosine;
      - `BruteForceIndex.search(query, k, where)` - a pre-filter on metadata equality, `(id, score)` pairs.

      The tests use the practice project's `toy_embeddings` and five SandPay articles.
    project: ai
    files:
      - exercises/genai/vector_index.py
    test: tests/genai/test_vector_index.py
    command: .venv/bin/python -m pytest tests/genai/test_vector_index.py
    hints:
      - "normalise_rows: np.divide(rows, norms, out=np.zeros_like(rows), where=norms > 0)."
      - "similarity: cosine is normalise_rows(m) @ normalise_rows(q); l2 is -np.linalg.norm(m - q, axis=1)."
      - "top_k: kth = -np.partition(-s, k - 1)[k - 1]; keep np.flatnonzero(s >= kth); order those with np.lexsort((candidates, -s[candidates]))."
      - "add: check everything first (len, shape[1], set(ids) & set(self.ids)), then extend the lists and np.vstack the vectors."
      - "search: positions = rows whose metadata matches every where item; score only those; map the top_k positions back to ids."
    modelAnswer: |
      ```python
      def normalise_rows(x):
          x = np.asarray(x, dtype=float)
          rows = np.atleast_2d(x)
          norms = np.linalg.norm(rows, axis=1, keepdims=True)
          out = np.divide(rows, norms, out=np.zeros_like(rows), where=norms > 0)
          return out[0] if x.ndim == 1 else out

      def similarity(query, matrix, metric="cosine"):
          q = np.asarray(query, dtype=float)
          m = np.atleast_2d(np.asarray(matrix, dtype=float))
          if metric == "cosine":
              return normalise_rows(m) @ normalise_rows(q)
          if metric == "dot":
              return m @ q
          if metric == "l2":
              return -np.linalg.norm(m - q, axis=1)
          raise ValueError(f"metric must be one of {METRICS}, got {metric!r}")

      def top_k(scores, k):
          if k < 1:
              raise ValueError(f"k must be at least 1, got {k}")
          s = np.asarray(scores, dtype=float)
          if k < len(s):
              kth = -np.partition(-s, k - 1)[k - 1]
              candidates = np.flatnonzero(s >= kth)
          else:
              candidates = np.arange(len(s))
          order = np.lexsort((candidates, -s[candidates]))
          return candidates[order][:k]

      # BruteForceIndex.search
      if where:
          positions = np.array([i for i, meta in enumerate(self.metadata)
                                if all(meta.get(f) == v for f, v in where.items())], dtype=int)
      else:
          positions = np.arange(len(self.ids))
      if len(positions) == 0:
          return []
      rows = self.vectors[positions] if where else self.vectors
      scores = rows @ normalise_rows(q) if self.metric == "cosine" else similarity(q, rows, self.metric)
      best = top_k(scores, k)
      return [(self.ids[positions[i]], float(scores[i])) for i in best]
      ```

      Partial selection keeps search O(n) apart from the few ties; the tie rule makes results reproducible;
      filtering before ranking returns k results whenever k rows match.
    solution: |
      Normalise with a zero-safe divide; one scoring function for three metrics with "higher is better"; a
      partition-then-lexsort top-k; validate before mutating in `add`; pre-filter, score, select, map back
      to ids. Full code in `solutions/genai/vector_index.py`.
    rubric:
      - Every test in tests/genai/test_vector_index.py passes.
      - The filter runs before ranking (pre-filter), so a filtered search is not starved of results.
      - "`add` stores nothing when it raises - checked before any list or array is changed."
      - You can explain why the three metrics agree on unit vectors and disagree on raw ones.
    followUp: |
      Add `delete(ids)` and a `model` field: `add` must reject vectors tagged with a different embedding model
      than the index was created for. Write the tests first.

  - id: ivf-coding
    type: coding
    concept: exact-and-approximate-search
    skill: application
    title: Build an inverted-file (IVF) index and measure it
    prompt: |
      In `ivf_index.py`, `kmeans`, `normalise_rows`, `top_k` and `train` are provided. Implement:

      - `nearest_centroids(x, centroids, n)` - for each row, the `n` nearest centroids by squared L2,
        nearest first, ties to the lower index; no (n, k, d) array;
      - `IVFIndex.add(ids, vectors)` - `RuntimeError` before training; normalise, store, and append each
        vector's position to the list of its nearest centroid;
      - `IVFIndex.search(query, k, nprobe)` - normalise the query, probe the `nprobe` nearest lists (capped at
        `n_lists`; below 1 is a `ValueError`), score the candidates **in position order**, return the best k
        `(id, score)` pairs and set `last_scanned`.

      The tests check that every vector sits in exactly one list, that `nprobe == n_lists` reproduces exact
      search, and that more probes scan more and never lower the mean recall. Then reproduce the lesson's table
      on your own data.
    project: ai
    files:
      - exercises/genai/ivf_index.py
    test: tests/genai/test_ivf_index.py
    command: .venv/bin/python -m pytest tests/genai/test_ivf_index.py
    hints:
      - "nearest_centroids: d2 = (x**2).sum(1)[:, None] - 2 * x @ c.T + (c**2).sum(1)[None, :]; np.argsort(d2, axis=1, kind='stable')[:, :n]."
      - "add: cells = nearest_centroids(vectors, self.centroids, 1)[:, 0]; for each list j, append start + np.flatnonzero(cells == j)."
      - "search: probe = nearest_centroids(q, self.centroids, min(nprobe, self.n_lists))[0]; candidates = np.sort(np.concatenate([self.lists[j] for j in probe]))."
      - Sorting the candidates is what makes ties break like the exact index, so the full-probe test matches exactly.
    modelAnswer: |
      ```python
      def nearest_centroids(x, centroids, n):
          x = np.atleast_2d(np.asarray(x, dtype=float))
          c = np.asarray(centroids, dtype=float)
          d2 = (x**2).sum(axis=1)[:, None] - 2 * x @ c.T + (c**2).sum(axis=1)[None, :]
          return np.argsort(d2, axis=1, kind="stable")[:, :n]

      def add(self, ids, vectors):
          if self.centroids is None:
              raise RuntimeError("train the index before adding vectors")
          ids = list(ids)
          vectors = normalise_rows(np.atleast_2d(np.asarray(vectors, dtype=float)))
          if len(ids) != len(vectors):
              raise ValueError("ids and vectors must have the same length")
          start = len(self.ids)
          self.ids.extend(ids)
          self.vectors = np.vstack([self.vectors, vectors])
          cells = nearest_centroids(vectors, self.centroids, 1)[:, 0]
          for j in range(self.n_lists):
              self.lists[j] = np.concatenate([self.lists[j], start + np.flatnonzero(cells == j)])

      def search(self, query, k, nprobe=1):
          if nprobe < 1:
              raise ValueError(f"nprobe must be at least 1, got {nprobe}")
          if self.centroids is None:
              raise RuntimeError("train the index before searching")
          q = normalise_rows(np.asarray(query, dtype=float))
          probe = nearest_centroids(q, self.centroids, min(nprobe, self.n_lists))[0]
          candidates = np.sort(np.concatenate([self.lists[j] for j in probe]))
          self.last_scanned = len(candidates)
          if len(candidates) == 0:
              return []
          scores = self.vectors[candidates] @ q
          return [(self.ids[candidates[i]], float(scores[i])) for i in top_k(scores, k)]
      ```

      The distance expansion is the FAISS paper's ‖x − y‖² = ‖x‖² + ‖y‖² − 2⟨x, y⟩, which turns the
      assignment into one matrix product.
    solution: |
      Assign with the expanded distance and a stable argsort; keep one array of positions per list; at search
      time probe the nearest lists, sort and score the candidates, and select the top k. Full code in
      `solutions/genai/ivf_index.py`.
    rubric:
      - Every test in tests/genai/test_ivf_index.py passes.
      - Distances are computed without building an (n, k, d) array.
      - "`nprobe = n_lists` returns exactly what exact search returns, ties included."
      - You measured recall@10 and time for at least four nprobe values on your own data and chose one against a stated target.
    followUp: |
      Add `remove(ids)` and a `drift()` method that reports how far the mean of newly added vectors is from
      the training sample's mean. Why does an IVF index trained on last year's documents lose recall on this
      year's?

  - id: metrics-coding
    type: coding
    concept: retrieval-evaluation
    skill: application
    title: Retrieval metrics and an evaluation run
    prompt: |
      In `retrieval_metrics.py`, implement `recall_at_k`, `reciprocal_rank` (optionally only within `k`),
      `mean_reciprocal_rank`, `neighbour_recall` (overlap of an approximate top k with the exact top k) and
      `evaluate(search, queries, k)`, which runs a search function over labelled queries and returns the
      number of queries, mean recall@k, MRR@k and the list of queries with no relevant result in the top k.
      Then run `evaluate` on the lesson's eight SandPay queries with the toy embedding and your
      `BruteForceIndex`.
    project: ai
    files:
      - exercises/genai/retrieval_metrics.py
    test: tests/genai/test_retrieval_metrics.py
    command: .venv/bin/python -m pytest tests/genai/test_retrieval_metrics.py
    hints:
      - "recall_at_k: len(set(retrieved[:k]) & relevant) / len(relevant); an empty relevant set is a ValueError."
      - "reciprocal_rank: enumerate(ranked, start=1) and return 1 / rank at the first relevant id."
      - "evaluate: a miss is a query whose reciprocal rank within k is 0."
    modelAnswer: |
      ```python
      def recall_at_k(retrieved, relevant, k):
          relevant = set(relevant)
          if not relevant:
              raise ValueError("relevant must not be empty")
          if k < 1:
              raise ValueError(f"k must be at least 1, got {k}")
          return len(set(list(retrieved)[:k]) & relevant) / len(relevant)

      def reciprocal_rank(retrieved, relevant, k=None):
          relevant = set(relevant)
          ranked = list(retrieved) if k is None else list(retrieved)[:k]
          for rank, item in enumerate(ranked, start=1):
              if item in relevant:
                  return 1.0 / rank
          return 0.0

      def neighbour_recall(approx, exact, k):
          truth = list(exact)[:k]
          if not truth:
              raise ValueError("exact must not be empty")
          return len(set(list(approx)[:k]) & set(truth)) / len(truth)
      ```

      `mean_reciprocal_rank` averages `reciprocal_rank`; `evaluate` loops over the queries, collects both
      metrics and the misses, and averages.
    solution: |
      Sets for recall (duplicates count once), the first relevant position for RR, the exact top k as the
      reference for neighbour recall, and an evaluation loop that keeps the misses. Full code in
      `solutions/genai/retrieval_metrics.py`. On the lesson's eight queries it gives recall@3 0.667, MRR@3
      0.688 and two misses.
    rubric:
      - Every test in tests/genai/test_retrieval_metrics.py passes.
      - Recall divides by the number of relevant documents, not by k.
      - Your evaluation run reports the lexical and paraphrase queries separately and lists the misses.
    followUp: |
      Add `precision_at_k` and nDCG@k with graded relevance (2 = the exact article, 1 = useful). On which
      SandPay queries would nDCG and MRR disagree?

  - id: interview-semantic-search
    type: interview
    concept: exact-and-approximate-search
    skill: analysis
    title: "\"Design search for our help centre\""
    prompt: |
      An interviewer for an AI engineering role asks: "We have 2 million support articles in 20 languages,
      each customer can only see their own region's articles, and search has to answer in under 100 ms. Walk
      me through how you'd build semantic search and how you'd know it works."
    modelAnswer: |
      I'd start with evaluation: a few hundred real queries from search logs and tickets, per language, with
      their correct articles labelled - including paraphrases, negations and region-filtered queries - and
      report recall@k and MRR per segment, plus the misses.

      Then the representation: a multilingual embedding model, evaluated on that set; I'd record model
      version, dimension and input types with every vector, embed documents with the document input type and
      queries with the query type, and normalise so inner product equals cosine. Long articles are chunked,
      which the RAG work covers.

      Exact search over 2 million vectors of around 1,000 dimensions is billions of multiply-adds per query,
      so I'd measure it, and likely add HNSW (or IVF if memory or build time matter more), tuning ef_search or
      nprobe until neighbour recall@10 against exact search meets a target like 0.95 on held-out queries,
      inside the latency budget.

      The region filter is the trap: with a post-filter on an approximate index, small regions get too few
      results. I'd use partitions or partial indexes per region (20-ish values), or iterative scans, and test
      that filtered queries still return k results with high neighbour recall, and that no row from another
      region ever appears. I'd consider hybrid keyword + vector search for ids and error codes, and rerank the
      top results with a cross-encoder if the evaluation shows it helps. Finally, re-run the evaluation on
      every model, content or index change, and monitor latency and zero-result rates in production.
    rubric:
      - Starts from a labelled evaluation set with segments and misses, not from a database choice.
      - Same model and correct input types for queries and documents; normalisation and metric choice explained.
      - Justifies an ANN index with numbers and tunes it against exact search (neighbour recall).
      - Identifies the filtering problem with ANN and gives concrete remedies and tests.
      - Mentions hybrid search or reranking as measured options, and ongoing re-evaluation.
    followUps:
      - Recall dropped after you re-embedded with a newer model version. How do you find out why?
      - How would you migrate 2 million vectors to a new embedding model without downtime?
      - Neighbour recall is 0.99 but MRR fell. Where do you look?
    hints:
      - Begin with how you will measure success.
      - Then representation, index, filters, and continuous evaluation.
    solution: |
      Evaluation set first; a measured, versioned embedding model with correct input types and normalisation;
      ANN index tuned against exact search inside the latency budget; a filtering strategy that keeps small
      regions complete and never leaks; hybrid search and reranking only if the numbers support them.

placement:
  - id: place-metric
    type: mcq
    concept: text-embeddings-and-similarity
    skill: application
    title: Ranking with raw vectors
    prompt: |
      Query q = [1, 0]. Documents: A = [0.9, 0.1], B = [5, 5]. Neither is normalised. Which document ranks
      first by cosine similarity, and which by dot product?
    options:
      - id: right
        text: Cosine ranks A first; dot product ranks B first.
        feedback: Correct - A points almost the same way as q (cos ≈ 0.994); B is long, so its dot product is 5 against A's 0.9.
      - id: same
        text: A first by both - they are the same measure.
        feedback: They are the same only for unit vectors. B's length inflates its dot product.
      - id: b-both
        text: B first by both.
        feedback: B's direction is 45° away from q (cos ≈ 0.707); cosine ignores length.
      - id: reverse
        text: Cosine ranks B first; dot product ranks A first.
        feedback: That is reversed - work out a·b and a·b / (‖a‖‖b‖) for each.
    correct: [right]
    solution: |
      Dot: A·q = 0.9, B·q = 5 → B first. Cosine: A ≈ 0.9 / 0.906 ≈ 0.994, B = 5 / 7.07 ≈ 0.707 → A first.
      Normalise the vectors and the two rankings agree.

  - id: place-nprobe
    type: mcq
    concept: exact-and-approximate-search
    skill: analysis
    title: An IVF index that misses neighbours
    prompt: |
      An IVF index with 1,000 lists, queried with nprobe = 1, returns 6 of the exact top 10 on average. Which
      change will raise that number, and what does it cost?
    options:
      - id: right
        text: Raise nprobe - more lists are scanned, so neighbours just across a cell border are found; each query scores more vectors and gets slower.
        feedback: Correct - nprobe is the query-time recall/speed knob of an inverted file.
      - id: fewer-lists
        text: Raise k to 100 and keep the first 10.
        feedback: A larger k still only looks inside the one probed list; true neighbours in other lists stay invisible.
      - id: metric
        text: Switch from cosine to L2 distance.
        feedback: On unit vectors the ranking is identical; the missing neighbours were never scored.
      - id: retrain
        text: Retrain k-means with more iterations; recall will reach 1.0 at nprobe = 1.
        feedback: Better centroids help a little, but vectors near cell borders exist for any clustering; one probe will still miss some.
    correct: [right]
    solution: |
      A true neighbour that sits in an unprobed list is never scored. Scanning more lists finds more of them at
      the cost of more work per query - in the lesson, 1 → 16 probes raised recall@10 from 0.615 to 0.966 and
      the time from 0.17 to 0.77 ms.

  - id: place-filter
    type: mcq
    concept: filtered-vector-search
    skill: analysis
    title: Filter after the index
    prompt: |
      An approximate index returns 40 candidates per query, then a metadata filter keeps rows of one merchant,
      who owns 5% of the vectors. Roughly how many results does a `LIMIT 10` query return, and why?
    options:
      - id: right
        text: About 2 - only about 5% of the 40 candidates belong to the merchant, because the filter runs after the index.
        feedback: Correct - post-filtering keeps the share of candidates that pass, regardless of LIMIT.
      - id: ten
        text: 10 - the database keeps searching until it has 10.
        feedback: Only with an iterative scan (or exact search). By default the candidate list is fixed by the index parameter.
      - id: zero
        text: 0 - filters cannot be combined with vector indexes.
        feedback: They can; the issue is how many candidates survive.
      - id: forty
        text: 40 - the filter is ignored by the index.
        feedback: The filter is applied, to the 40 candidates.
    correct: [right]
    solution: |
      5% of 40 is 2. This is pgvector's documented example shape (10% of rows with ef_search 40 → about 4).
      Fixes: iterative scans, partial indexes or partitions, over-fetching, or exact search on the subset.

  - id: place-mrr
    type: mcq
    concept: retrieval-evaluation
    skill: application
    title: MRR for three queries
    prompt: |
      Three queries. The first relevant result appears at rank 1, at rank 4, and not at all in the top 10.
      What is MRR@10?
    options:
      - id: right
        text: (1 + 0.25 + 0) / 3 ≈ 0.417
        feedback: Correct - reciprocal ranks 1, 1/4 and 0, averaged.
      - id: skip-miss
        text: (1 + 0.25) / 2 = 0.625
        feedback: A query with no relevant result counts as 0 - dropping it hides the worst case.
      - id: mean-rank
        text: 1 / ((1 + 4) / 2) = 0.4
        feedback: MRR averages reciprocals; it does not take the reciprocal of the mean rank.
      - id: recall
        text: 2 / 3 ≈ 0.667
        feedback: That is the share of queries with any relevant result (a hit rate), not MRR.
    correct: [right]
    solution: |
      RR is 1/rank of the first relevant result, 0 when there is none within k; MRR is the mean over all
      queries: (1 + 0.25 + 0) / 3 ≈ 0.417.

recall:
  - id: recall-embedding
    concept: text-embeddings-and-similarity
    prompt: What is a text embedding, and what must be the same for a query and the documents it searches?
    answer: A fixed-length vector representing a text, placed so that similar meanings point in similar directions. Same embedding model and version (and the right input type, query or document, where the model has one).
  - id: recall-unit
    concept: text-embeddings-and-similarity
    prompt: Why do cosine, dot product and L2 distance rank unit vectors identically?
    answer: For ‖a‖ = ‖b‖ = 1, a·b = cos(a, b) and ‖a − b‖² = 2 − 2·cos(a, b), a decreasing function of the cosine. Normalise once and use the dot product.
  - id: recall-bow
    concept: text-embeddings-and-similarity
    prompt: What does a bag-of-words embedding get wrong, with the lesson's numbers?
    answer: It only matches shared words - "refund" vs "reimbursement" scored 0.000 - and barely sees negation - "approved" vs "not approved" 0.756. Trained sentence-embedding models fix much of this.
  - id: recall-exact
    concept: exact-and-approximate-search
    prompt: How does exact vector search work, and when is it enough?
    answer: One matrix-vector product scores every stored vector, then partial selection keeps the top k. Perfect recall; cost grows with n × d (1.87 ms for 50,000 × 64 in the lesson). Enough until measured latency says otherwise.
  - id: recall-ivf
    concept: exact-and-approximate-search
    prompt: How does an IVF index search, and what does nprobe trade?
    answer: k-means centroids split the vectors into lists; a query scans only the nprobe lists with the nearest centroids. More probes = higher recall (0.615 → 0.966 from 1 to 16 in the lesson) and more time.
  - id: recall-hnsw
    concept: exact-and-approximate-search
    prompt: What are HNSW's main parameters in pgvector?
    answer: m (max connections per layer, 16 by default) and ef_construction (build candidate list, 64) at build time; hnsw.ef_search (query candidate list, 40) at query time - higher gives better recall, slower.
  - id: recall-filter
    concept: filtered-vector-search
    prompt: Why can a filtered ANN query return fewer than k rows, and what are the fixes?
    answer: The filter is applied to the index's candidates, so only the passing fraction survives (1.0 of 10 at 10% selectivity in the lesson). Fixes - pre-filter with exact search, over-fetch, iterative index scans, partial indexes or partitions.
  - id: recall-metrics
    concept: retrieval-evaluation
    prompt: Define recall@k, MRR and neighbour recall.
    answer: Recall@k = relevant found in the top k / all relevant. RR = 1 / rank of the first relevant (0 if none); MRR = mean RR. Neighbour recall = share of the exact top k the ANN index also returns - it measures the index, not the embedding.

