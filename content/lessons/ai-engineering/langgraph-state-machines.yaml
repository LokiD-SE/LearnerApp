id: langgraph-state-machines
title: LangGraph - state, nodes, edges and cycles
subject: ai-engineering
module: ai-agents
level: advanced
status: published
estimatedMinutes: 130
summary: Model an agent workflow as a state graph by building one - a mini StateGraph in plain Python with a typed state schema, reducers that append instead of overwrite, nodes that return partial updates, fixed and conditional edges between START and END, cycles stopped by a router and capped by a recursion limit, a compile step that rejects broken wiring, and a stream of steps. Then build a SandPay dispute-triage graph on it (classify, assess risk, refund, escalate, or draft and review in a loop) against an offline scripted model. Every output shown was produced by the code shown; each idea is mapped to the real LangGraph API, quoted from its documentation and not run here.
