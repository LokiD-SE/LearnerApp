id: training-deep-networks
title: Training deep networks well
subject: ai-engineering
module: deep-learning
level: advanced
status: published
estimatedMinutes: 110
summary: How to make a deep network actually train and generalise - SGD, momentum, Adam and AdamW as PyTorch implements them, learning-rate warmup and cosine decay, why initialisation scale decides whether signals survive ten layers, batch norm and layer norm (and their train/eval difference), dropout, weight decay and early stopping, and a debugging method for training curves, NaN losses and silent loop bugs. Every number shown comes from code run with PyTorch 2.15 on synthetic SandPay data.
