id: linear-regression-gradient-descent
title: Linear regression and gradient descent
subject: ai-engineering
module: ml-foundations
level: beginner
status: published
estimatedMinutes: 75
summary: Fit your first model from scratch - the linear hypothesis, the least-squares cost, the normal equation and gradient descent - then watch learning rates crawl, converge and explode on real runs, see why feature scaling decides whether gradient descent works at all, and compare batch, mini-batch and stochastic descent with scikit-learn's LinearRegression and SGDRegressor.
