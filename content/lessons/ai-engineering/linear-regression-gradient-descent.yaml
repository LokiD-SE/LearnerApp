    scikit-learn,
  ]

environment: |
  - **Runtime and libraries:** Python 3.12.3, **NumPy 2.5.4**, **scikit-learn 1.9.1** (with SciPy 1.18.1) -
    the versions pinned in `practice/ai/requirements.txt`. Every printed number in this lesson was produced by
    running the code shown, on Linux in November 2026, with fixed random seeds, so you will get the same
    numbers. The timings in the trade-offs section are from one run on a 14-core laptop that was busy with
    other jobs; they vary a lot between runs - only their order of magnitude matters.
  - **Primary sources:** Tengyu Ma and Andrew Ng, [CS229 Lecture Notes](https://cs229.stanford.edu/main_notes.pdf)
    (Stanford, version of 23 August 2026), chapter 1 "Linear regression": the hypothesis and least-squares cost
    J(θ) (section 1), the LMS (Widrow-Hoff) update, batch and stochastic gradient descent (1.1), the normal
    equations (1.2). Ian Goodfellow, Yoshua Bengio and Aaron Courville, [*Deep
    Learning*](https://www.deeplearningbook.org/) (MIT Press, 2016): [chapter 4 "Numerical
    Computation"](https://www.deeplearningbook.org/contents/numerical.html), section 4.3 "Gradient-Based
    Optimization" (learning rate, line search, the Hessian's condition number), and [chapter 5 "Machine Learning
    Basics"](https://www.deeplearningbook.org/contents/ml.html), section 5.1.4 "Example: Linear Regression" and
    section 5.9 "Stochastic Gradient Descent".
  - **scikit-learn documentation (1.9):** [Linear Models - Ordinary Least
    Squares](https://scikit-learn.org/stable/modules/linear_model.html#ordinary-least-squares) (the SVD-based
    solution and its O(n_samples · n_features²) cost, multicollinearity),
    [LinearRegression](https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.LinearRegression.html)
    ("scipy.linalg.lstsq ... wrapped as a predictor object"), [Stochastic Gradient
    Descent](https://scikit-learn.org/stable/modules/sgd.html) - "Tips on Practical Use" ("SGD is sensitive to
    feature scaling"; fit the scaler on training data only) and "Stopping criterion" -, and
    [SGDRegressor](https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.SGDRegressor.html)
    (defaults `learning_rate='invscaling'`, `eta0=0.01`, `power_t=0.25`, `penalty='l2'`, `alpha=0.0001`,
    `max_iter=1000`, `tol=1e-3`).
  - **Fictional and synthetic:** SandPay and its fee data. The 200 "merchants" are generated with
    `numpy.random.default_rng(7)` from a known rule - fee = 40 + 0.25 × transactions + 1.8 × average ticket +
    noise with standard deviation 60 - so you can check what each method recovers. Real fee schedules are not
    linear like this; the rule exists only to make the maths visible.
  - **Notation:** the app does not render maths, so formulas are written in plain text: θ (theta) for the
    parameters, x⁽ⁱ⁾ for the i-th example, n examples, d features, α (alpha) for the learning rate, Xᵀ for the
    transpose.
  - **Naming:** *Deep Learning* section 5.9 calls minibatch descent "stochastic gradient descent", as most deep
    learning libraries do. This lesson keeps the CS229 distinction - SGD updates on one example per step.

prerequisites:
  - python-numpy-pandas
  - ml-maths-essentials

concepts:
  - id: least-squares-linear-model
    name: The linear model, its least-squares cost and the normal equation
    summary: Linear regression predicts with h(x) = θᵀx, where x includes x0 = 1 for the intercept. It is fitted by minimising the least-squares cost J(θ) = (1/2n) Σ (h(x⁽ⁱ⁾) − y⁽ⁱ⁾)² - half the mean squared error. J is a convex quadratic with one minimum, which the normal equation XᵀXθ = Xᵀy gives in closed form; solve it with a least-squares solver (lstsq, SVD), never by inverting XᵀX, because XᵀX is singular whenever a feature is a combination of others.
  - id: gradient-descent-learning-rate
    name: Gradient descent and the learning rate
    summary: Gradient descent repeats θ := θ − α ∇J(θ), where ∇J(θ) = (1/n) Xᵀ(Xθ − y). The learning rate α decides everything - too small and the cost falls too slowly to finish, too large and it grows without limit. For least squares the boundary is exact - steps are stable while α < 2 / λmax, the largest eigenvalue of XᵀX/n. Read the cost history - falling and flattening means converged, still falling means more steps or a larger α, rising or nan means α is too large.
  - id: gd-variants-and-feature-scaling
    name: Batch, mini-batch and stochastic descent, and feature scaling
    summary: Batch gradient descent uses every example per step, stochastic gradient descent (SGD) one example, mini-batch a small shuffled group - cheaper steps and early progress, at the price of noise that keeps a constant-step SGD moving around the minimum. Features on very different scales make the cost surface a long narrow valley (a huge condition number), so no single learning rate suits every direction; standardising features (fitted on training data only) makes gradient descent - and scikit-learn's SGDRegressor - work, while LinearRegression's closed-form solution does not need it.

objectives:
  - Write the linear hypothesis, the least-squares cost J(θ) and its gradient in vectorised NumPy, and explain each term, including the intercept column and the 1/2.
  - Solve linear regression with the normal equation through a least-squares solver, and explain why inverting XᵀX fails when features are collinear.
  - Implement batch gradient descent, choose a learning rate from a cost history, and predict divergence from the largest eigenvalue of XᵀX/n.
  - Diagnose a run as converged, still improving or diverged from its cost history, and say what to change in each case.
  - Implement mini-batch and stochastic gradient descent with per-epoch shuffling, and compare their cost curves with batch descent.
  - Standardise features, convert the learned parameters back to original units, and explain why SGD needs scaling and the closed-form solution does not.
  - Choose between LinearRegression and SGDRegressor for a given data size, and use SGDRegressor safely in a pipeline with StandardScaler.

sections:
  - id: intuition
    kind: intuition
    concepts: [least-squares-linear-model, gradient-descent-learning-rate]
    title: The idea in plain language
    body: |
      SandPay wants to quote a new merchant a **monthly fee** before they sign. It has last year's data: for
      each merchant, how many transactions they processed a month, their average ticket, and what they
      ended up paying. Plot fee against transactions and the points lie roughly along a line. Linear
      regression finds **the line** - or, with two inputs, the flat plane - that sits closest to all the
      points at once.

      "Closest" needs a number. Measure how far each prediction is from the real fee, square it (so misses
      above and below both count, and big misses count a lot), and average. That number is the **cost**: a
      bad line has a big cost, the best line the smallest.

      There are two ways to find the best line:

      - **Solve it.** The cost is a bowl-shaped function of the line's parameters, and the bottom of a bowl
        is where its slope is zero. Setting the slope to zero gives equations you can solve in one go - the
        **normal equation**.
      - **Walk downhill.** Start anywhere, look which way the bowl slopes, take a step down, repeat. That is
        **gradient descent**. The size of the step is the **learning rate**: too small and you are still
        walking tomorrow, too big and you jump over the bottom and up the other side - higher every time.

      Why learn the walking method when solving works? Because almost nothing else in machine learning can
      be solved in one go. Logistic regression, neural networks and the transformers behind large language
      models are all trained by walking downhill. Linear regression is where you can watch every step and
      check it against the exact answer.

  - id: what
    kind: what
    concepts: [least-squares-linear-model]
    title: The hypothesis, the cost and their notation
    body: |
      The CS229 notes set up linear regression like this (section 1). A training set has n examples; example
      i has an input vector x⁽ⁱ⁾ with d features and a target y⁽ⁱ⁾. The model - the **hypothesis** - is a
      weighted sum:

      ```plaintext
      h(x) = θ0 + θ1·x1 + ... + θd·xd = θᵀx      (with the convention x0 = 1)
      ```

      The convention **x0 = 1** turns the intercept θ0 into an ordinary weight: add a column of ones to the
      data and the intercept is learned like any other parameter.

      Stack the examples as rows and you get the **design matrix** X (shape n × (d+1), ones in the first
      column) and the target vector y. Then all n predictions are one matrix product, `X @ theta`.

      The **cost** (CS229 calls it the least-squares cost function) measures how far the predictions are:

      ```plaintext
      J(θ) = (1/2n) · Σᵢ (h(x⁽ⁱ⁾) − y⁽ⁱ⁾)²
      ```

      | Term                         | Meaning                                                                              |
      | ---------------------------- | ------------------------------------------------------------------------------------ |
      | h(x⁽ⁱ⁾) − y⁽ⁱ⁾                 | the **residual** - how far prediction i misses                                         |
      | squared                      | misses above and below both count, big misses count more; makes J smooth and convex  |
      | Σ / n                        | the **mean** over examples - the mean squared error (MSE)                             |
      | 1/2                          | cosmetic - it cancels the 2 from differentiating a square; it doesn't move the minimum |

      So **J = MSE / 2**. scikit-learn's `mean_squared_error` reports the MSE without the 1/2; CS229 writes
      the sum without dividing by n. Each variant has the same minimum - they differ only by a constant
      factor, which matters for one thing: the learning rate that works (dividing by n keeps the gradient's
      size independent of how much data you have).

      Training means **finding the θ that minimises J**. For linear regression J is a *convex quadratic*
      function of θ - a bowl - so it has one global minimum and no other local minima (CS229 section 1.1).

  - id: why
    kind: why
    concepts: [least-squares-linear-model, gradient-descent-learning-rate]
    title: Why start with the simplest model
    body: |
      - **It is a real tool.** Linear models are fast, explainable ("each extra transaction adds 0.25 to the
        fee") and a strong baseline. A complex model that cannot beat a linear one on the same data is not
        worth deploying.
      - **Everything later reuses the pattern.** Hypothesis, cost, gradient, update - logistic regression
        changes the hypothesis and the cost; a neural network changes the hypothesis to a stack of layers
        and computes the gradient with backpropagation. The training loop and the learning-rate problems
        stay the same.
      - **You can check the answer.** Gradient descent on a neural network has no closed form to compare
        with. Here the normal equation gives the exact minimum, so you can see precisely how close each run
        gets - and *why* it doesn't.
      - **The failures are the interview questions.** "The loss went to nan", "it trains forever", "it works
        on the raw data with one library and not another" - every one of them shows up in this lesson, with
        real numbers.

  - id: normal-equation
    kind: internals
    concepts: [least-squares-linear-model]
    title: The normal equation - solving for the minimum
    body: |
      At the bottom of the bowl every partial derivative of J is zero. In matrix form the gradient is

      ```plaintext
      ∇J(θ) = (1/n) · Xᵀ(Xθ − y)
      ```

      Setting it to zero gives the **normal equations** (CS229 section 1.2; *Deep Learning* section 5.1.4):

      ```plaintext
      XᵀX θ = Xᵀy        so, when XᵀX is invertible,   θ = (XᵀX)⁻¹ Xᵀy
      ```

      The formula is worth knowing for interviews; the inverse is **not** how to compute it.

      - **XᵀX can be singular.** The CS229 notes point out that it is not invertible when there are fewer
        independent examples than features, or when the features are not linearly independent - a column
        that duplicates another, "amount in euros" next to "amount in cents", or one-hot columns plus an
        intercept. scikit-learn's documentation adds the softer version: with *nearly* dependent columns
        (multicollinearity) the matrix is close to singular and the estimate becomes "highly sensitive to
        random errors in the observed target".
      - **Least-squares solvers avoid the problem.** `numpy.linalg.lstsq` (and `scipy.linalg.lstsq`, which
        `LinearRegression` wraps) solve the least-squares problem through a matrix factorisation (SVD) of
        X itself, never forming the inverse. When the solution is not unique they return the one with the
        **smallest norm**.

      The cost: scikit-learn documents the SVD solution as O(n_samples · n_features²) for a dense matrix with
      more samples than features. With a few dozen features that is nothing; with thousands it becomes the
      reason to walk downhill instead.

  - id: normal-code
    kind: code
    concepts: [least-squares-linear-model]
    title: The SandPay fees, solved two ways
    body: |
      The data generator (shared by every snippet in this lesson - save it as `data.py`):

      ```python
      import numpy as np

      def sandpay_fees(n=200, seed=7):
          """Synthetic SandPay merchants: monthly fee from transactions and average ticket."""
          rng = np.random.default_rng(seed)
          tx = rng.integers(200, 20000, n).astype(float)   # transactions per month
          ticket = rng.uniform(5, 250, n).round(2)        # average ticket
          fee = 40 + 0.25 * tx + 1.8 * ticket + rng.normal(0, 60, n)
          return np.column_stack([tx, ticket]), fee
      ```

      Solve with NumPy's least-squares solver, then with scikit-learn:

      ```python
      import numpy as np
      from sklearn.linear_model import LinearRegression
      from data import sandpay_fees

      X, y = sandpay_fees()
      Xi = np.column_stack([np.ones(len(X)), X])           # x0 = 1 for the intercept
      theta = np.linalg.lstsq(Xi, y, rcond=None)[0]        # solves X^T X theta = X^T y
      residuals = Xi @ theta - y
      print("theta:", theta.round(4))
      print("J(theta):", round(residuals @ residuals / (2 * len(y)), 2))
      print("MSE:", round(np.mean(residuals ** 2), 2))

      model = LinearRegression().fit(X, y)
      print("sklearn:", round(model.intercept_, 4), model.coef_.round(4))
      print("R^2:", round(model.score(X, y), 5))
      ```

      ```plaintext
      theta: [33.9362  0.2501  1.7822]
      J(theta): 1621.86
      MSE: 3243.73
      sklearn: 33.9362 [0.2501 1.7822]
      R^2: 0.99843
      ```

      What to notice:

      - **The two agree to four decimals** - `LinearRegression` adds the intercept column itself
        (`fit_intercept=True`) and reports it separately as `intercept_`.
      - **The weights are close to the rule** (0.25 per transaction, 1.8 per unit of ticket). The intercept
        is 33.9, not 40: with noise of standard deviation 60 and only 200 merchants, the intercept is the
        least precisely determined parameter. That is not a bug - it is what the data supports.
      - **The MSE is 3243.73, close to 60² = 3600**, the variance of the noise. No line can predict noise;
        a training MSE far *below* the noise level would be a warning sign of overfitting (a later lesson).
      - **J is exactly half the MSE**, as defined.

      Now break it - add the average-ticket column a second time:

      ```python
      Xi = np.column_stack([np.ones(len(X)), X, X[:, 1]])   # the average ticket column, twice
      A, b = Xi.T @ Xi, Xi.T @ y
      try:
          np.linalg.solve(A, b)
      except np.linalg.LinAlgError as error:
          print("solve:", repr(error))
      print("lstsq:", np.linalg.lstsq(Xi, y, rcond=None)[0].round(4))
      ```

      ```plaintext
      solve: LinAlgError('Singular matrix')
      lstsq: [33.9362  0.2501  0.8911  0.8911]
      ```

      Solving XᵀXθ = Xᵀy directly fails (so does `np.linalg.inv`). The least-squares solver returns the
      minimum-norm answer: the 1.7822 is split equally, 0.8911 + 0.8911, and every prediction is unchanged.
      The model is fine; the *individual* weights of collinear features simply mean nothing on their own.

      **The error is the lucky case.** Replace the duplicate with a column equal to transactions + ticket - just
      as dependent, but floating-point rounding now makes XᵀX *almost* rather than exactly singular. On the
      same data, `np.linalg.solve` and `np.linalg.inv` both returned numbers without complaint - and the `inv`
      version's intercept was −276.7 instead of 33.9. A crash tells you something is wrong; a confident wrong
      answer does not. That is the strongest reason to use `lstsq`.

  - id: gradient-descent
    kind: internals
    concepts: [gradient-descent-learning-rate]
    title: Gradient descent - the update rule
    body: |
      Gradient descent "starts with some initial θ, and repeatedly performs the update" (CS229 section 1.1):

      ```plaintext
      θ := θ − α · ∇J(θ)  =  θ − α · (1/n) · Xᵀ(Xθ − y)
      ```

      - **∇J(θ)** points uphill - the direction in which J increases fastest - so stepping against it is the
        steepest way down. *Deep Learning* (section 4.3) calls this the method of **steepest descent**.
      - **α**, the **learning rate**, is a positive number you choose. *Deep Learning* lists the options: a
        small constant (the usual choice), a step solved to make the directional derivative vanish, or a
        **line search** that tries several step sizes and keeps the best.
      - **Every component of θ is updated simultaneously** from the *same* old θ (CS229 stresses this).
        Updating θ0 and then using the new θ0 to compute θ1's step is a different - and wrong - algorithm.
      - For one example, the update is θ := θ + α (y⁽ⁱ⁾ − h(x⁽ⁱ⁾)) x⁽ⁱ⁾ - the **LMS** ("least mean squares")
        or **Widrow-Hoff** rule. The step is proportional to the error: an example the model already
        predicts well barely moves it.

      **Why it converges here.** J is a convex quadratic with a single minimum, so gradient descent "always
      converges (assuming the learning rate α is not too large) to the global minimum" (CS229). Neural
      networks lose that guarantee; linear regression is the case where the theory is clean.

      **How large is "too large"?** For a quadratic, the size of the steps that work is set by the
      curvature. The curvature of J is the matrix XᵀX/n (its Hessian). Along the direction of its largest
      eigenvalue λmax the bowl is steepest, and a step multiplies the error in that direction by
      (1 − α·λmax). That factor has magnitude below 1 - the error shrinks - only while

      ```plaintext
      0 < α < 2 / λmax
      ```

      Above that bound the error grows by a constant factor every step: the cost rises **exponentially**.
      And along the *smallest* eigenvalue λmin the error shrinks by (1 − α·λmin) per step - tiny if λmin is
      tiny. The ratio λmax / λmin is the **condition number**; *Deep Learning* (section 4.3.1) explains that
      with a poor condition number "gradient descent performs poorly" and it "makes choosing a good step size
      difficult". You will see both effects in the runs below.

  - id: visual-loop
    kind: visual
    concepts: [gradient-descent-learning-rate]
    title: The training loop and how to read its cost history
    body: |
      ```mermaid
      flowchart TD
        S[theta = zeros, choose alpha] --> P[Predict: X @ theta]
        P --> C[Cost J and gradient from the residuals]
        C --> U[theta := theta - alpha * gradient]
        U --> R{Read the cost history}
        R -- rising, inf or nan --> D[Diverged: alpha too large - divide it by 3 to 10, check feature scales]
        R -- still falling clearly --> M[Still improving: more steps or a larger alpha]
        R -- flat: last step improves less than tol --> V[Converged: stop and evaluate]
        M --> P
      ```

      The cost history is your instrument panel. Record the cost **before** the first step and after every
      step; a plot (or a few printed values) tells you which branch you are on long before the run ends.

  - id: rates-code
    kind: code
    concepts: [gradient-descent-learning-rate]
    title: Seven learning rates, one dataset
    body: |
      The features are standardised first (next sections explain why). Batch gradient descent, 200 steps,
      printing J at steps 0, 1, 2, 5, 20, 50 and 200:

      ```python
      import numpy as np
      from data import sandpay_fees

      X, y = sandpay_fees()
      mean, std = X.mean(axis=0), X.std(axis=0)
      Xs = np.column_stack([np.ones(len(X)), (X - mean) / std])   # standardised, then x0 = 1

      def descend(X, y, lr, steps):
          theta = np.zeros(X.shape[1])
          costs = []
          for _ in range(steps + 1):
              r = X @ theta - y
              costs.append(r @ r / (2 * len(y)))
              theta = theta - lr * X.T @ r / len(y)
          return costs

      with np.errstate(over="ignore"):
          for lr in [0.001, 0.01, 0.1, 0.5, 1.0, 1.5, 2.1]:
              costs = descend(Xs, y, lr, 200)
              print(f"lr={lr:<5}", "  ".join(f"{costs[i]:.4g}" for i in (0, 1, 2, 5, 20, 50, 200)))
      ```

      ```plaintext
      lr=0.001 5.141e+06  5.131e+06  5.12e+06  5.09e+06  4.939e+06  4.652e+06  3.447e+06
      lr=0.01  5.141e+06  5.039e+06  4.939e+06  4.65e+06  3.441e+06  1.885e+06  9.434e+04
      lr=0.1   5.141e+06  4.165e+06  3.375e+06  1.796e+06  7.801e+04  1761  1622
      lr=0.5   5.141e+06  1.289e+06  3.243e+05  6726  1622  1622  1622
      lr=1.0   5.141e+06  2540  1623  1622  1622  1622  1622
      lr=1.5   5.141e+06  1.282e+06  3.225e+05  6873  1622  1622  1622
      lr=2.1   5.141e+06  6.203e+06  7.505e+06  1.35e+07  3.711e+08  1.594e+12  6.486e+31
      ```

      Read it against the minimum, **J = 1621.86** from the normal equation:

      - **0.001 and 0.01 - too small.** After 200 steps the cost is still 3.4 million and 94 thousand: not
        wrong, just unfinished. The history is still falling steadily - the "still improving" branch.
      - **0.1 and 0.5 - fine.** 0.5 reaches the minimum (to four significant figures) by step 20.
      - **1.0 - almost one step.** Standardised, uncorrelated features make the bowl nearly round, and for a
        round bowl a step of 1/λ lands at the bottom at once. Here every eigenvalue of XᵀX/n is close to 1
        (0.9702, 1.0000, 1.0298 - measured below), so α = 1 is nearly that step.
      - **1.5 - overshooting but converging.** It jumps past the bottom each time, by less each time
        (|1 − 1.5 × 1.03| = 0.55 < 1). Its numbers mirror 0.5's: the same shrink factor, with alternating sign.
      - **2.1 - diverged.** The bound is 2 / λmax = 2 / 1.0298 = 1.94. Above it the cost rises from the first
        step and reaches 6.5 × 10³¹ by step 200. Run long enough and it becomes `inf`, then `nan`.

      There is no "best learning rate" in general - it depends on the curvature of *this* cost on *this*
      data. That is why the next thing to learn is what scaling does to the curvature.

  - id: scaling
    kind: internals
    concepts: [gd-variants-and-feature-scaling, gradient-descent-learning-rate]
    title: Feature scaling - why the raw data defeats gradient descent
    body: |
      The SandPay features have wildly different scales: transactions run from 200 to 20,000, average
      tickets from 5 to 250, and the intercept column is always 1. The curvature of J in each direction is
      roughly the size of that feature squared, so the bowl is a **long, narrow valley**: extremely steep
      across the transaction axis, almost flat along the intercept.

      ```python
      Xi = np.column_stack([np.ones(len(X)), X])                  # NOT scaled
      eigenvalues = np.linalg.eigvalsh(Xi.T @ Xi / len(y))        # curvature of J in each direction
      print("eigenvalues:", [f"{e:.4g}" for e in eigenvalues])
      print("condition number:", f"{eigenvalues[-1] / eigenvalues[0]:.3g}")
      print("largest stable lr (2 / max eigenvalue):", f"{2 / eigenvalues[-1]:.3g}")
      ```

      ```plaintext
      eigenvalues: ['0.1269', '9308', '1.409e+08']
      condition number: 1.11e+09
      largest stable lr (2 / max eigenvalue): 1.42e-08
      ```

      A condition number of a **billion**. The learning rate must stay below 1.42 × 10⁻⁸ or the steep
      direction explodes - and at that rate the flat direction (eigenvalue 0.1269) shrinks its error by a
      factor of (1 − 1.4 × 10⁻⁸ × 0.1269) per step, which is to say: never. Both sides of the bound, for 1000
      and 50 steps (same `descend` as above, also returning θ):

      ```plaintext
      lr=1e-08: 5.141e+06  8.743e+05  1.614e+05  1.837e+04  1.825e+04 ... step 1000: 1.557e+04 theta [0.0006 0.268  0.1712]
      lr=1.5e-08: 5.141e+06  6.366e+06  7.883e+06  4.372e+07  2.316e+11 ... step 50: 2.316e+11 theta [4.80000e-03 6.40888e+01 6.27400e-01]
      ```

      - **1 × 10⁻⁸ (just under the bound):** the cost drops fast for ten steps - the steep transaction
        direction is fitted - then **stalls at about 15,570, ten times the minimum**. θ is [0.0006, 0.268,
        0.171]: the intercept and the ticket weight have hardly moved from zero, and the transaction weight
        has absorbed their effect. A loss curve that flattens is *not* proof of convergence.
      - **1.5 × 10⁻⁸ (just over it):** the cost rises from step 1 and is at 2.3 × 10¹¹ by step 50.

      The theory predicted the boundary to two significant figures. Now standardise: subtract each column's
      mean and divide by its standard deviation, so every feature has mean 0 and standard deviation 1
      (`StandardScaler` does exactly this, with the population standard deviation). The eigenvalues become
      0.9702, 1.0000 and 1.0298 - **condition number 1.06** - and, as the previous section showed, any α
      between about 0.1 and 1.5 converges within 200 steps.

      **Scaling changes the parameters' units.** On standardised data θ means "fee per standard deviation of
      transactions". To report "fee per transaction", convert back: w = w_scaled / std and
      b = b_scaled − Σ w·mean. The learned θ on scaled data was [2865.33, 1436.42, 126.66]; converted, it is
      [33.9362, 0.2501, 1.7822] - the normal equation's answer exactly.

      **Fit the scaler on the training data only.** scikit-learn's SGD guide: "the same scaling must be
      applied to the test vector to obtain meaningful results", with the comment "Don't cheat - fit only on
      training data". Computing the mean and standard deviation on all the data leaks information from the
      test set into training - a mistake the [pipelines lesson](#/lesson/scikit-learn-pipelines) returns to.

  - id: variants
    kind: internals
    concepts: [gd-variants-and-feature-scaling]
    title: Batch, stochastic and mini-batch gradient descent
    body: |
      **Batch** gradient descent (CS229 equation 1.1) "looks at every example in the entire training set on
      every step". With 200 merchants that is nothing; with 200 million, one step is one full pass over the
      data.

      **Stochastic** gradient descent (CS229 equation 1.2, "also incremental gradient descent") updates θ
      after **each single example**: θ := θ − α (h(x⁽ⁱ⁾) − y⁽ⁱ⁾) x⁽ⁱ⁾. CS229's summary:

      - it "can start making progress right away", so it often gets θ close to the minimum much faster than
        batch descent;
      - but "it may never 'converge' to the minimum, and the parameters θ will keep oscillating around the
        minimum" - each step follows one noisy example, not the true gradient;
      - letting α decrease towards zero as training goes on makes it converge rather than oscillate.

      **Mini-batch** gradient descent sits between: each step uses a small random batch B of examples
      (*Deep Learning* section 5.9 calls it a minibatch, typically from one to a few hundred examples) and
      averages their gradients. It is what almost every deep learning library does by default: less noise
      than SGD, far cheaper steps than batch descent, and batches map well onto vectorised hardware.

      Vocabulary that interviews expect:

      | Term          | Meaning                                                                         |
      | ------------- | ------------------------------------------------------------------------------- |
      | step, update  | one change of θ                                                                  |
      | batch size    | examples per step: n (batch), 1 (SGD), between (mini-batch)                     |
      | epoch         | one pass over the training data: n / batch_size steps                           |
      | shuffle       | a new random order each epoch, so batches differ and no ordering bias creeps in |
      | schedule      | a learning rate that changes over time (decays), so SGD's oscillation shrinks   |

      Note that "SGD" in libraries usually means *mini-batch* descent with a configurable batch size -
      scikit-learn's `SGDRegressor` is the exception that really updates one example at a time.

  - id: variants-code
    kind: code
    concepts: [gd-variants-and-feature-scaling]
    title: Three batch sizes, thirty epochs
    collapsed: true
    body: |
      Same standardised data. One function covers all three: batch size 200 is batch descent, 1 is SGD. The
      cost is measured on **all** the data after each epoch:

      ```python
      def minibatch(X, y, lr, epochs, batch_size, seed=0):
          rng = np.random.default_rng(seed)
          theta = np.zeros(X.shape[1])
          costs = [((X @ theta - y) ** 2).mean() / 2]
          for _ in range(epochs):
              order = rng.permutation(len(y))                 # reshuffle every epoch
              for start in range(0, len(y), batch_size):
                  idx = order[start:start + batch_size]
                  r = X[idx] @ theta - y[idx]
                  theta = theta - lr * X[idx].T @ r / len(idx)
              costs.append(((X @ theta - y) ** 2).mean() / 2)  # cost on ALL data after the epoch
          return costs

      for batch_size, lr in [(200, 0.1), (16, 0.1), (1, 0.01)]:
          costs = minibatch(Xs, y, lr, 30, batch_size)
          print(f"batch={batch_size:<3} lr={lr:<4}", "  ".join(f"{costs[i]:.6g}" for i in (0, 1, 2, 5, 10, 30)))
      ```

      J after epochs 0, 1, 2, 5, 10 and 30:

      ```plaintext
      batch=200 lr=0.1  5.14093e+06  4.16528e+06  3.37488e+06  1.79551e+06  627920  10947.6
      batch=16  lr=0.1  5.14093e+06  306572  20497.4  1634.69  1623.14  1624.31
      batch=1   lr=0.01 5.14093e+06  88313.7  2930.27  1628.31  1628.8  1623.81
      ```

      - **Per epoch, smaller batches win early.** Batch descent takes one step per epoch, mini-batch 16 takes
        13, SGD takes 200. After 5 epochs both stochastic versions are within 1% of the minimum (1621.86);
        batch descent is still at 1.8 million.
      - **They never settle.** The mini-batch cost goes 1634.69, 1623.14, then *up* to 1624.31; SGD goes
        1628.31, 1628.80, 1623.81. With a constant learning rate the parameters keep moving around the
        minimum, exactly as CS229 describes.
      - **SGD needed a smaller α (0.01).** One example's gradient is noisy; a large step on it throws θ far
        off.
      - **The comparison is per epoch, not per second.** A mini-batch step is vectorised and cheap; 200
        single-example steps in a Python loop do far more interpreter work for the same pass over the data. At scale, the per-step
        cost of batch descent is what makes mini-batches the norm.

  - id: sklearn
    kind: code
    concepts: [gd-variants-and-feature-scaling]
    title: LinearRegression and SGDRegressor in scikit-learn
    body: |
      scikit-learn has both approaches:

      - **`LinearRegression`** - ordinary least squares, "scipy.linalg.lstsq ... wrapped as a predictor
        object". Closed form, exact, no learning rate, no scaling needed.
      - **`SGDRegressor`** - stochastic gradient descent, one example at a time, with defaults that matter:
        `penalty='l2'` and `alpha=0.0001` (a small regularisation - not plain least squares),
        `learning_rate='invscaling'` (η = eta0 / t^power_t with `eta0=0.01`, `power_t=0.25` - a decaying
        schedule), `max_iter=1000` epochs, and a stopping rule: stop when the training loss has not improved
        by `tol=1e-3` for `n_iter_no_change=5` epochs in a row.

      Its documentation is blunt: "SGD is sensitive to feature scaling, so it is highly recommended to scale
      your data". On the raw SandPay data:

      ```python
      raw = SGDRegressor(random_state=0).fit(X, y)
      print("unscaled:", raw.intercept_.round(-6), raw.coef_.round(-9), "epochs:", raw.n_iter_)

      pipe = make_pipeline(StandardScaler(), SGDRegressor(random_state=0)).fit(X, y)
      scaler, sgd = pipe[0], pipe[-1]
      coef = sgd.coef_ / scaler.scale_                      # back to "per transaction", "per unit of ticket"
      intercept = sgd.intercept_[0] - coef @ scaler.mean_
      print("scaled:  ", round(intercept, 4), coef.round(4), "epochs:", sgd.n_iter_)
      print("R^2:", round(pipe.score(X, y), 5))
      ```

      ```plaintext
      unscaled: [-7.949e+09] [3.273e+12 3.404e+12] epochs: 65
      scaled:   34.2779 [0.2501 1.7823] epochs: 51
      R^2: 0.99843
      ```

      - **Unscaled, it "finished" with weights of three trillion** - and no warning. The step size 0.01 is
        hundreds of thousands of times above the 1.42 × 10⁻⁸ bound for batch descent, the weights blew up, and the stopping rule ended the
        run after 65 epochs because the loss had stopped "improving". Always check a fitted model's
        predictions or score; a fit that returns is not a fit that worked.
      - **Scaled, it matches the closed form** to three decimals on the weights (0.2501 and 1.7823), with an
        intercept of 34.28 against 33.94 - the decaying learning rate and the small L2 penalty stop it just
        short of the exact minimum. R² is the same to five decimals.

  - id: when
    kind: when
    concepts: [least-squares-linear-model, gd-variants-and-feature-scaling]
    title: When to solve and when to descend
    body: |
      | Situation                                                                      | Use                                                                            |
      | ------------------------------------------------------------------------------ | ------------------------------------------------------------------------------ |
      | Tens to a few thousand features, data fits in memory                           | `LinearRegression` (closed form): exact, no tuning                              |
      | Millions of rows, or more features than the SVD can handle in reasonable time   | `SGDRegressor` (scaled, in a pipeline) or mini-batch descent                    |
      | Data arrives in a stream or does not fit in memory                             | SGD with `partial_fit`, one chunk at a time                                    |
      | Collinear or many features, you want stable weights                            | regularised models (`Ridge`, `Lasso`) - [evaluation and regularisation](#/lesson/model-evaluation-and-overfitting) |
      | The relationship is clearly not linear                                         | add features (polynomials, interactions) or use another model family          |
      | Learning how neural networks train                                             | write gradient descent yourself, as in this lesson                             |

      scikit-learn's SGD guide gives a rule of thumb for the number of epochs - SGD "converges after observing
      approximately 10⁶ training samples", so `max_iter = np.ceil(10**6 / n)` is a reasonable first guess -
      and notes that SGD "has been successfully applied to large-scale and sparse machine learning problems".

      What linear regression is **not**: a classifier (predicting fraud yes/no with a line gives
      "probabilities" below 0 and above 1 - [logistic regression](#/lesson/logistic-regression-classification)
      fixes that), or proof of causation (a weight says how the *prediction* changes with a feature in this
      data, not what would happen if you changed the feature in the world).

  - id: steps
    kind: steps
    concepts: [gradient-descent-learning-rate, gd-variants-and-feature-scaling]
    title: Training a linear model with gradient descent, step by step
    body: |
      1. **Split** the data into training and test sets first (and a validation set if you will tune α).
      2. **Fit the scaler on the training set** - mean and standard deviation per feature - and apply it to
         both sets. Leave constant features centred, not divided by zero.
      3. **Add the intercept column** of ones after scaling (or let the library handle the intercept).
      4. **Check the closed form if you can.** On a sample small enough for `lstsq`, compute the exact
         minimum - it is the target your descent should reach.
      5. **Choose α by trying a range** - 0.001, 0.01, 0.1, 1 - for a few dozen steps each, keeping the
         largest one whose cost falls steadily. If you can, compute 2 / λmax and stay well below it.
      6. **Record the cost every step (or epoch)** and diagnose: rising or `nan` → smaller α or check scaling;
         still falling → more steps; flat → converged.
      7. **Stop on a rule, not on a count alone** - relative improvement below a tolerance, or a validation
         score that has stopped improving.
      8. **Convert the parameters back** to original units if anyone will read them, and evaluate on the
         **test set** with the same scaler.

  - id: example
    kind: example
    concepts: [gradient-descent-learning-rate, gd-variants-and-feature-scaling]
    title: "\"The model trains but the predictions are rubbish\" - a review"
    body: |
      A SandPay data analyst shares a notebook: a fee model trained with a hand-written gradient descent on
      the raw features, α = 1e-8, 1000 steps. The loss curve "converged" - it dropped from 5 million to about
      18,000 in ten steps and has been almost flat since. They want to ship it.

      What a reviewer (or a tester on an ML team) checks:

      - **Is flat the same as converged?** Compute the closed-form minimum on the same data: 1621.86. The
        notebook's final cost is 15,570 - ten times worse. Flat here means "stuck in a narrow valley", not
        "at the bottom".
      - **What do the parameters say?** Intercept 0.0006 and 0.17 per unit of ticket, against 33.9 and 1.78
        from the closed form. Ask the analyst: is it plausible that the average ticket barely matters?
      - **Why?** Feature scales of 1, about 130 and about 10,000 - a condition number of 1.1 × 10⁹. The only
        stable learning rate cannot move the flat directions.
      - **The evidence to keep:** the cost history, the closed-form cost on the same data, the eigenvalues
        of XᵀX/n, and the test-set MSE before and after the fix.
      - **The fix:** standardise with a scaler fitted on the training set; α = 0.5 then reaches the minimum
        in about 20 steps. Or simply use `LinearRegression` - 200 rows and 2 features do not need gradient
        descent at all.

  - id: tests
    kind: tests
    concepts: [least-squares-linear-model, gradient-descent-learning-rate, gd-variants-and-feature-scaling]
    title: How to test a training routine
    body: |
      ML code fails quietly - it returns numbers either way. These are the tests the practice exercises use,
      and they work for any optimiser you write later.

      **Positive cases**

      - **Exact recovery on noise-free data.** y = 3 + 1·x1 + 2·x2 exactly (the `LinearRegression` docs
        example) - the normal equation must return [3, 1, 2] to within 10⁻¹⁰.
      - **Agreement with a trusted implementation.** Your normal equation equals `LinearRegression` on noisy
        data; your descent with a good α reaches the `lstsq` answer (relative tolerance 10⁻⁶).
      - **Gradient check.** Compare the analytic gradient with a numerical one,
        (J(θ + εeⱼ) − J(θ − εeⱼ)) / 2ε for each j - the standard test for any hand-written gradient. At the
        least-squares solution the gradient must be (almost) zero.
      - **Monotone cost** for batch descent with a safe α: every cost ≤ the one before.
      - **Equivalences.** Mini-batch with batch size n must equal batch descent step for step; converting
        scaled parameters back must reproduce the predictions exactly.

      **Negative cases**

      - A learning rate above 2 / λmax must diverge - and the history must *show* it (inf and nan included),
        not crash or hide it.
      - A duplicated column must not raise `LinAlgError`; a constant feature must not produce a division by
        zero when scaling.
      - Shapes: `mse` of a column (n, 1) against a vector (n,) must raise, not broadcast into an (n, n) matrix.

      **Evidence:** fixed seeds (`default_rng(seed)`) so every run is reproducible; tolerances via
      `pytest.approx` or `numpy.testing.assert_allclose`, never `==` on floats.

  - id: mistakes
    kind: mistakes
    concepts: [least-squares-linear-model, gradient-descent-learning-rate, gd-variants-and-feature-scaling]
    title: Common mistakes and how to debug them
    body: |
      | Symptom                                                    | Likely cause                                                                         | Check / fix                                                                                    |
      | ---------------------------------------------------------- | ------------------------------------------------------------------------------------ | ---------------------------------------------------------------------------------------------- |
      | Cost rises, then `inf`, then `nan`                          | α above 2 / λmax - often because features are unscaled                               | Divide α by 3-10; standardise; compute λmax                                                    |
      | Cost drops, then flat - but far above the closed form       | ill-conditioned problem: α is limited by the steep direction, the flat ones crawl     | Compare with `lstsq`; standardise; look at the parameters                                       |
      | Cost falls slowly, steadily                                 | α too small, or too few steps                                                        | Try 3-10× larger α; more steps                                                                 |
      | Intercept stays near 0                                      | forgot the column of ones (or `fit_intercept=False`)                                 | Check `X[:, 0]` is all ones                                                                    |
      | Results change when you reorder the update lines            | parameters updated one at a time with the new values                                 | Compute the whole gradient from the old θ, then update the vector                              |
      | MSE is an (n, n) matrix or absurdly large                   | `y` shaped (n, 1) and predictions (n,) - NumPy broadcasting                          | `y = y.ravel()`; assert shapes                                                                 |
      | `LinAlgError: Singular matrix`                              | `inv` or `solve` on XᵀX with a duplicated or collinear column                        | Use `lstsq` / `LinearRegression`; remove the redundant feature                                 |
      | Great on training data, poor on new data with SGD           | scaler fitted on everything, or the test set not scaled the same way                 | Fit the scaler on training only; use a pipeline                                               |
      | `SGDRegressor` weights in the billions, no warning          | unscaled features                                                                    | `make_pipeline(StandardScaler(), SGDRegressor())`; check the score                            |

      **A debugging method:** shrink the problem until you know the answer. Two features, noise-free data, a
      known θ. Does the normal equation return it? Does your gradient match the numerical one? Does one step
      by hand match one step of your code? Then grow back to the real data one change at a time.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [least-squares-linear-model, gd-variants-and-feature-scaling]
    title: Closed form or descent - what each costs
    body: |
      The closed form does all its work at once; gradient descent pays per step. One closed-form solve against
      **one** gradient step on random data:

      ```python
      rng = np.random.default_rng(1)
      for n, d in [(100_000, 10), (100_000, 500), (20_000, 2000)]:
          X = rng.normal(size=(n, d))
          y = X @ rng.normal(size=d) + rng.normal(size=n)
          start = time.perf_counter()
          np.linalg.lstsq(X, y, rcond=None)                 # closed form: one big solve
          closed = time.perf_counter() - start
          start = time.perf_counter()
          X.T @ (X @ np.zeros(d) - y) / n                   # gradient descent: ONE step
          step = time.perf_counter() - start
          print(f"n={n:>6} d={d:>4}: lstsq {closed * 1000:>7.0f} ms   one gradient {step * 1000:5.1f} ms")
      ```

      ```plaintext
      n=100000 d=  10: lstsq      55 ms   one gradient  16.2 ms
      n=100000 d= 500: lstsq   28079 ms   one gradient  56.7 ms
      n= 20000 d=2000: lstsq   43881 ms   one gradient  30.6 ms
      ```

      (One run on a busy machine - an earlier run of the d = 500 case took 4.3 seconds. The pattern is what
      matters.) With 10 features the closed form costs about three gradient steps: solve it. With hundreds or
      thousands of features one solve costs as much as hundreds or thousands of gradient steps - and the
      SVD's cost grows with the *square* of the number of features (scikit-learn: O(n_samples ·
      n_features²)), while a gradient step grows linearly.

      | | Normal equation (`lstsq`, `LinearRegression`) | Gradient descent (batch, mini-batch, SGD) |
      | --- | --- | --- |
      | Answer | exact minimum | approximate; how close depends on α, steps and conditioning |
      | Tuning | none | learning rate, steps or epochs, batch size, schedule |
      | Scaling of features | not needed | essential |
      | Cost | O(n · d²), all at once, all data in memory | O(n · d) per epoch; can stream data |
      | Works for | least squares (and a few relatives) | almost any differentiable model - logistic regression, neural networks |

      The real reason to master gradient descent is the last row: from logistic regression onwards there is no
      closed form, and every model in this track is trained by some version of the loop you wrote here.

  - id: summary
    kind: summary
    concepts: [least-squares-linear-model, gradient-descent-learning-rate, gd-variants-and-feature-scaling]
    title: Quick reference
    body: |
      - **Model:** h(x) = θᵀx with x0 = 1 for the intercept; all predictions `X @ theta`.
      - **Cost:** J(θ) = (1/2n) Σ (h(x⁽ⁱ⁾) − y⁽ⁱ⁾)² = MSE / 2 - a convex bowl with one minimum.
      - **Gradient:** ∇J(θ) = (1/n) Xᵀ(Xθ − y). **Update:** θ := θ − α∇J(θ), all components at once.
      - **Normal equation:** XᵀXθ = Xᵀy. Solve with `lstsq` / `LinearRegression`, never `inv(X.T @ X)` -
        collinear features make XᵀX singular.
      - **Learning rate:** stable while α < 2 / λmax (largest eigenvalue of XᵀX/n). Rising or `nan` = too
        large; slow steady fall = too small; flat = converged *or stuck* - compare with the closed form.
      - **Scaling:** standardise features (fit on training data only) - it turned a condition number of
        1.1 × 10⁹ into 1.06 and made α = 0.5 converge in 20 steps. Convert θ back: w = w_s / std,
        b = b_s − Σ w·mean.
      - **Variants:** batch = all examples per step; SGD = one; mini-batch = a shuffled handful. Smaller
        batches progress faster per epoch but oscillate unless α decays.
      - **scikit-learn:** `LinearRegression` for exact small-to-medium problems; `SGDRegressor` inside
        `make_pipeline(StandardScaler(), ...)` for large or streaming data - and check the score, because an
        unscaled fit can return garbage without a warning.

exercises:
  - id: which-cost
    type: mcq
    concept: least-squares-linear-model
    skill: recognition
    title: Which number is J?
    prompt: |
      A model's residuals on four examples are 2, −2, 4 and 0. Using this lesson's definition
      J(θ) = (1/2n) Σ residual², what is J - and what would `sklearn.metrics.mean_squared_error` report for
      the same predictions?
    options:
      - id: j3-mse6
        text: J = 3 and the MSE = 6.
        feedback: Correct - the squares are 4, 4, 16 and 0, their mean is 6 (the MSE), and J is half of it.
      - id: j6-mse6
        text: J = 6 and the MSE = 6.
        feedback: That forgets the 1/2 in J. It does not change where the minimum is, but J and the MSE are different numbers.
      - id: j0-mse0
        text: J = 0 and the MSE = 0, because the residuals cancel out.
        feedback: The residuals sum to 4, not 0 - and squaring is there precisely so that misses above and below cannot cancel.
      - id: j12-mse6
        text: J = 12 and the MSE = 6 (the CS229 notes' form).
        feedback: CS229 writes (1/2) times the sum without dividing by n - that is (1/2) × 24 = 12. This lesson's J divides by n as well, which gives 3.
    correct: [j3-mse6]
    hints:
      - Square each residual first.
      - The MSE is the mean of the squares; J is defined as half of that.
    solution: |
      Squares: 4, 4, 16, 0 - sum 24, mean 6. The MSE is 6 and J = 6 / 2 = 3. CS229's unnormalised form would
      give 12. All three versions have their minimum at the same θ; they differ by constant factors, which
      only changes which learning rate works.

  - id: singular-features
    type: mcq
    concept: least-squares-linear-model
    skill: analysis
    title: The LinAlgError in the fee model
    prompt: |
      A teammate adds a feature "monthly volume in cents" next to the existing "monthly volume in currency
      units" and computes `theta = np.linalg.inv(X.T @ X) @ X.T @ y`. It raises
      `LinAlgError: Singular matrix`. With the old features it worked. What is going on, and what is the best
      fix?
    options:
      - id: collinear
        text: The new column is exactly 100 × an existing column, so XᵀX is singular. Drop the duplicate - and solve with lstsq or LinearRegression rather than inv.
        feedback: Correct - one column is a linear combination of another, so the normal equations have infinitely many solutions and XᵀX has no inverse. A least-squares solver returns the minimum-norm solution; dropping the redundant feature makes the weights meaningful again.
      - id: scale
        text: The cents column is too large, so the numbers overflow - standardise the features.
        feedback: Scaling would not help - a standardised copy of a column is still perfectly collinear with it. Nothing overflows; the matrix is singular because the columns are dependent.
      - id: more-data
        text: There are too few rows; collect more data.
        feedback: More rows of the same two columns stay exactly proportional. The problem is the relationship between the columns, not the number of examples.
      - id: gd
        text: Switch to gradient descent, because the normal equation does not work for more than one feature.
        feedback: The normal equation works for any number of features as long as they are not linearly dependent. Gradient descent would run, but the split of weight between the two columns would still be arbitrary.
    correct: [collinear]
    hints:
      - What is the relationship between the two volume columns?
      - When is XᵀX not invertible? CS229 names two situations.
    solution: |
      "Volume in cents" = 100 × "volume in currency units" - the columns are linearly dependent, so XᵀX is
      singular (CS229: XᵀX is not invertible "if the features are not linearly independent"). Drop the
      duplicate. And compute θ with `np.linalg.lstsq` or `LinearRegression`, which use a factorisation of X
      and return the minimum-norm solution instead of failing.
    followUp: |
      Instead of exact duplicates, two features are "volume last month" and "volume this month", correlated
      at 0.99. Nothing raises. What goes wrong, and how would you see it?

  - id: lr-history
    type: mcq
    concept: gradient-descent-learning-rate
    skill: application
    title: Read the cost history
    prompt: |
      Batch gradient descent on standardised data, J printed at steps 0, 1, 2, 5 and 20:

      ```plaintext
      run A: 5.1e+06  6.2e+06  7.5e+06  1.4e+07  3.7e+08
      run B: 5.1e+06  5.0e+06  4.9e+06  4.6e+06  3.4e+06
      run C: 5.1e+06  1.3e+06  3.2e+05  6.7e+03  1.6e+03
      ```

      The closed-form minimum is J = 1.6e+03. What do you do with each run?
    options:
      - id: right
        text: "A: lower α (it diverged). B: raise α or run longer (still improving). C: keep it (converged)."
        feedback: Correct - A rises from the first step, B falls steadily but slowly, C has reached the closed-form minimum.
      - id: a-more-steps
        text: "A: run more steps - costs sometimes rise before they fall. B and C: keep both."
        feedback: For a convex quadratic with batch descent, a cost that rises on every step only grows - this is divergence, and more steps make it worse. B is also nowhere near the minimum.
      - id: b-diverged
        text: "A and B both diverged; C is fine."
        feedback: B's cost falls on every step - it is just slow. Diverging means rising.
      - id: c-overfit
        text: "C is overfitting because its cost fell too fast; prefer B."
        feedback: Speed of descent says nothing about overfitting - C has reached the same minimum the normal equation gives. Overfitting is judged on held-out data, not on the training curve's speed.
    correct: [right]
    hints:
      - Compare each run's last value with its first, and with the minimum.
      - Which runs are moving in the right direction, and how far have they got?
    solution: |
      A is the "rising" branch: diverged, so divide α by 3-10 (and check the features are scaled). B is "still
      improving": 3.4 million after 20 steps against a minimum of 1600 - increase α or run many more steps.
      C has reached the closed-form minimum; stop and evaluate it on the test set.

  - id: predict-divergence
    type: short
    concept: gradient-descent-learning-rate
    skill: analysis
    title: Predict the largest safe learning rate
    prompt: |
      For a least-squares problem, the eigenvalues of XᵀX/n are 0.5, 2 and 8. (a) Above which learning rate
      will batch gradient descent diverge? (b) With α = 0.2, by what factor does the error shrink per step
      along the slowest direction? (c) What would you change to make descent faster, and why?
    modelAnswer: |
      (a) The bound is α < 2 / λmax = 2 / 8 = **0.25**; above it the error along the λ = 8 direction is
      multiplied by |1 − 8α| > 1 each step and the cost grows exponentially.

      (b) Along λmin = 0.5: the factor is 1 − 0.2 × 0.5 = **0.9** - the error shrinks by only 10% per step
      (after 50 steps, 0.9⁵⁰ ≈ 0.005 of its starting size). Along λmax it is 1 − 0.2 × 8 = −0.6: it
      overshoots but shrinks.

      (c) The condition number is 8 / 0.5 = 16. Improve it - standardise the features (or decorrelate them)
      so the eigenvalues are closer together. Then a larger α is stable and the slow direction moves fast. On
      perfectly conditioned data (all eigenvalues 1), α = 1 reaches the minimum in one step.
    rubric:
      - Gives 0.25 from 2 / λmax and explains it with the per-step factor 1 − αλ.
      - Computes 0.9 for the slowest direction and says it is slow.
      - Names the condition number and feature scaling (or decorrelation) as the fix.
    hints:
      - In the direction of eigenvalue λ, one step multiplies the error by (1 − αλ).
      - Stability needs |1 − αλ| < 1 for every λ.
    solution: |
      α must stay below 2 / 8 = 0.25. With α = 0.2 the slowest direction shrinks by a factor 0.9 per step.
      The condition number 16 limits α; standardising the features brings the eigenvalues together so a larger
      α works for every direction.

  - id: debug-gd
    type: debug
    concept: gradient-descent-learning-rate
    skill: analysis
    title: Find the bugs in this gradient descent
    prompt: |
      This function should run batch gradient descent on X (which already has the column of ones) and return
      θ and the cost history. It returns numbers but never reaches the closed-form answer. Click **every**
      line that is a bug.
    language: python
    code: |
      def batch_gd(X, y, lr, n_iters):
          theta = np.zeros(X.shape[1])
          history = []
          for _ in range(n_iters):
              residuals = y - X @ theta
              grad = X.T @ residuals / len(y)
              for j in range(len(theta)):
                  theta[j] = theta[j] - lr * X[:, j] @ (X @ theta - y) / len(y)
              theta = theta + lr * grad
              history.append(float(residuals @ residuals) / (2 * len(y)))
          return theta, history
    correctLines: [7, 8, 9]
    lineNotes:
      - line: 5
        note: "y − Xθ is the negative of the usual residual. That is fine on its own: the gradient on line 6 is then −∇J, and line 9 adds it - which is a correct descent step."
      - line: 6
        note: With the sign of line 5, this is −∇J(θ). Correct, as long as it is used with +.
      - line: 10
        note: The residual's sign does not matter once squared, and this records the cost before the step - acceptable.
    hints:
      - Count how many times θ is changed in one iteration.
      - Does each parameter's update use the same old θ?
    solution: |
      - **Lines 7-8** - a second, per-parameter update loop. It changes θ in place one component at a time,
        so θ1's step is computed with the *new* θ0 - not the simultaneous update CS229 describes - and it
        moves θ a second time in each iteration.
      - **Line 9** - then applies the (correct) vectorised update on top. Two updates per iteration mean an
        effective step of about 2α, from a mixture of old and new values.

      Delete lines 7-8 and keep line 9: with residuals = y − Xθ, grad = Xᵀ(y − Xθ)/n is −∇J, so
      `theta + lr * grad` is exactly θ − α∇J. Lines 5, 6 and 10 are a valid (if unusual) way to write it.

  - id: scaling-sgd
    type: mcq
    concept: gd-variants-and-feature-scaling
    skill: application
    title: Two libraries, two answers
    prompt: |
      On the same raw (unscaled) SandPay data, `LinearRegression().fit(X, y)` gives sensible weights, while
      `SGDRegressor(random_state=0).fit(X, y)` returns weights around 3 × 10¹² with no warning. Why the
      difference, and what is the fix?
    options:
      - id: scaling
        text: LinearRegression solves in closed form and does not depend on feature scales; SGDRegressor takes gradient steps whose stable size depends on them. Use make_pipeline(StandardScaler(), SGDRegressor()).
        feedback: Correct - the default step 0.01 is far above 2 / λmax for features in the thousands, so SGD diverged. Scaling makes the curvature similar in every direction, and the pipeline applies the training-set scaling to new data too.
      - id: bug
        text: SGDRegressor has a bug with integers; convert X to float.
        feedback: X is already float. The behaviour is the documented sensitivity of SGD to feature scaling, not a bug.
      - id: iterations
        text: SGDRegressor stopped too early; raise max_iter to 100000.
        feedback: More epochs of a diverging update make the weights worse, not better. The step size relative to the curvature is the problem.
      - id: penalty
        text: The L2 penalty in SGDRegressor pushes the weights to huge values; set penalty=None.
        feedback: A penalty shrinks weights towards zero, never inflates them. Without scaling, SGD diverges with or without the penalty.
    correct: [scaling]
    hints:
      - Which of the two takes steps with a learning rate?
      - What does the largest stable learning rate depend on?
    solution: |
      `LinearRegression` wraps `scipy.linalg.lstsq` - an exact solve, unaffected by the size of the features.
      `SGDRegressor` takes steps of size η (eta0 = 0.01 by default); with features in the thousands the
      curvature is enormous and 0.01 is far above 2 / λmax, so the weights blow up. Put
      `StandardScaler()` and `SGDRegressor()` in a pipeline (the scaler is then fitted on the training data
      only) and the weights match the closed form. Always check the score - a returned fit is not a correct
      fit.

  - id: variants-order
    type: order
    concept: gd-variants-and-feature-scaling
    skill: recall
    title: Steps per epoch
    prompt: |
      A training set has 10,000 examples. Order these setups from the **fewest** parameter updates per epoch
      to the **most**.
    items:
      - id: batch
        text: Batch gradient descent
      - id: mb500
        text: Mini-batch gradient descent with batch size 500
      - id: mb32
        text: Mini-batch gradient descent with batch size 32
      - id: sgd
        text: Stochastic gradient descent (one example per step)
    hints:
      - An epoch is one pass over all 10,000 examples.
      - Updates per epoch = 10,000 / batch size, rounded up.
    solution: |
      Batch: 1 update. Batch size 500: 20. Batch size 32: 313 (the last batch is smaller). SGD: 10,000. More
      updates per epoch means faster early progress per pass over the data - and noisier steps.

  - id: sgd-oscillation
    type: mcq
    concept: gd-variants-and-feature-scaling
    skill: analysis
    title: Why the SGD cost will not settle
    prompt: |
      SGD with a constant learning rate of 0.01 on standardised data gives a full-data cost of 1628.31 after
      epoch 5, 1628.80 after epoch 10 and 1623.81 after epoch 30. The closed-form minimum is 1621.86. A
      colleague says the implementation must be broken because the cost went *up* between epochs 5 and 10.
    options:
      - id: expected
        text: It is expected - each step follows one example's noisy gradient, so with a constant step θ keeps moving around the minimum. A decaying learning rate (or a larger batch) reduces it.
        feedback: Correct - this is exactly the behaviour CS229 describes for SGD; the cost stays within 0.5% of the minimum but never settles.
      - id: broken
        text: It is broken - gradient descent must decrease the cost every epoch.
        feedback: That holds for batch descent with a small enough α on a convex cost. SGD's steps use one example at a time, so the full-data cost can rise between epochs.
      - id: overfitting
        text: It is overfitting, so stop at epoch 5.
        feedback: Overfitting is about held-out data. This is the training cost moving around its minimum - noise from single-example steps.
      - id: no-shuffle
        text: The data was not shuffled; shuffling makes SGD monotonic.
        feedback: Shuffling every epoch is correct practice and was done here. It removes ordering bias but does not remove the noise of single-example steps.
    correct: [expected]
    hints:
      - How close are all three costs to the minimum?
      - Which gradient does each SGD step follow?
    solution: |
      All three are within 0.5% of the minimum: SGD found the bowl and is moving around its bottom, as CS229
      says it "may never converge ... the parameters θ will keep oscillating around the minimum". To settle,
      decay α over time (scikit-learn's default `invscaling` schedule does) or use larger mini-batches.

  - id: linreg-exercise
    type: coding
    concept: least-squares-linear-model
    skill: application
    title: Linear regression from first principles
    prompt: |
      In `linreg.py`, implement `add_intercept`, `predict`, `mse`, `cost`, `gradient` and `normal_equation`
      - vectorised NumPy, no loops over examples. The docstrings give the exact definitions: J is half the
      MSE, `mse` must refuse mismatched shapes instead of broadcasting, and `normal_equation` must survive a
      duplicated column (return the minimum-norm solution, don't invert XᵀX). The tests compare your results
      with scikit-learn's `LinearRegression` and check your gradient against a numerical derivative.
    project: ai
    files:
      - exercises/ml_foundations/linreg.py
    test: tests/ml_foundations/test_linreg.py
    command: .venv/bin/python -m pytest tests/ml_foundations/test_linreg.py
    hints:
      - "`np.column_stack([np.ones(n), X])` adds the intercept; reshape a 1-D X to a column first."
      - The gradient is one line - X.T @ (X @ theta − y) / n.
      - "`np.linalg.lstsq(X, y, rcond=None)` returns a tuple; the solution is its first element."
      - "In `mse`, compare `y_true.shape` with `y_pred.shape` before subtracting."
    modelAnswer: |
      ```python
      def add_intercept(X):
          X = np.asarray(X, dtype=float)
          if X.ndim == 1:
              X = X.reshape(-1, 1)
          return np.column_stack([np.ones(X.shape[0]), X])

      def mse(y_true, y_pred):
          y_true, y_pred = np.asarray(y_true, dtype=float), np.asarray(y_pred, dtype=float)
          if y_true.shape != y_pred.shape:
              raise ValueError(f"shapes differ: {y_true.shape} and {y_pred.shape}")
          return float(np.mean((y_pred - y_true) ** 2))

      def cost(X, y, theta):
          residuals = predict(X, theta) - np.asarray(y, dtype=float)
          return float(residuals @ residuals / (2 * len(residuals)))

      def gradient(X, y, theta):
          X = np.asarray(X, dtype=float)
          return X.T @ (X @ theta - y) / X.shape[0]

      def normal_equation(X, y):
          theta, *_ = np.linalg.lstsq(np.asarray(X, dtype=float), np.asarray(y, dtype=float), rcond=None)
          return theta
      ```

      `predict` is `X @ theta`. The shape check in `mse` matters because NumPy broadcasts an (n, 1) column
      against an (n,) vector into an (n, n) matrix - a silent, wrong number. `lstsq` uses an SVD of X, so a
      duplicated column gives the minimum-norm solution (the weight split equally) instead of
      `LinAlgError`.
    solution: |
      Add the ones column with `column_stack`, predict with `X @ theta`, compute the MSE after a shape check,
      J as half the mean of squared residuals, the gradient as `X.T @ residuals / n`, and the normal equation
      with `np.linalg.lstsq`. The model answer shows each function.
    rubric:
      - Every test in tests/ml_foundations/test_linreg.py passes.
      - No Python loops over examples or features - matrix operations only.
      - normal_equation never forms the inverse of XᵀX.
      - You can explain why J has a 1/2 and why the minimum is the same with or without it.

  - id: gd-exercise
    type: coding
    concept: gd-variants-and-feature-scaling
    skill: application
    title: Gradient descent, scaling and a diagnosis
    prompt: |
      In `gradient_descent.py`, implement `batch_gradient_descent`, `minibatch_gradient_descent`,
      `standardize`, `unscale_theta` and `diagnose`. The tests replay the exact mini-batch procedure in the
      docstring (one `default_rng(seed)`, a permutation per epoch), require the history to record divergence
      (inf and nan included) rather than stop, check that mini-batch with the whole data equals batch descent
      step for step, compare your scaling with `StandardScaler`, and check that your unscaled parameters match
      least squares on the raw data.
    project: ai
    files:
      - exercises/ml_foundations/gradient_descent.py
    test: tests/ml_foundations/test_gradient_descent.py
    command: .venv/bin/python -m pytest tests/ml_foundations/test_gradient_descent.py
    hints:
      - Record the cost before the loop, then after every update - the history has n_iters + 1 values.
      - Wrap the loop in `with np.errstate(over="ignore", invalid="ignore"):` so a diverging run finishes and shows inf or nan.
      - "For a constant column, `np.where(std == 0, 1.0, std)` avoids dividing by zero."
      - "Unscaling - predictions must agree: w = w_s / std and b = b_s − w · mean."
      - "In diagnose, test for divergence first - a nan makes every comparison False."
    modelAnswer: |
      ```python
      def batch_gradient_descent(X, y, lr, n_iters, theta0=None):
          X, y = np.asarray(X, dtype=float), np.asarray(y, dtype=float)
          theta = np.zeros(X.shape[1]) if theta0 is None else np.array(theta0, dtype=float)
          with np.errstate(over="ignore", invalid="ignore"):
              history = [_cost(X, y, theta)]
              for _ in range(n_iters):
                  theta = theta - lr * _gradient(X, y, theta)
                  history.append(_cost(X, y, theta))
          return theta, history

      def minibatch_gradient_descent(X, y, lr, epochs, batch_size, seed=0):
          X, y = np.asarray(X, dtype=float), np.asarray(y, dtype=float)
          rng = np.random.default_rng(seed)
          theta = np.zeros(X.shape[1])
          with np.errstate(over="ignore", invalid="ignore"):
              history = [_cost(X, y, theta)]
              for _ in range(epochs):
                  order = rng.permutation(len(y))
                  for start in range(0, len(y), batch_size):
                      idx = order[start : start + batch_size]
                      theta = theta - lr * _gradient(X[idx], y[idx], theta)
                  history.append(_cost(X, y, theta))
          return theta, history

      def standardize(X):
          X = np.asarray(X, dtype=float)
          mean, std = X.mean(axis=0), X.std(axis=0)
          std = np.where(std == 0, 1.0, std)
          return (X - mean) / std, mean, std

      def unscale_theta(theta_scaled, mean, std):
          weights = theta_scaled[1:] / std
          return np.concatenate([[theta_scaled[0] - weights @ mean], weights])

      def diagnose(history, tol=1e-6):
          if len(history) < 2:
              raise ValueError("need at least two costs to diagnose")
          values = np.asarray(history, dtype=float)
          if not np.all(np.isfinite(values)) or values[-1] > values[0]:
              return "diverged"
          if values[-2] - values[-1] <= tol * values[-2]:
              return "converged"
          return "still-improving"
      ```

      Batch descent is mini-batch with one batch of everything - which is why the equivalence test holds
      exactly. `X.std(axis=0)` is the population standard deviation (`ddof=0`), as in `StandardScaler`. The
      divergence check comes first in `diagnose` because a `nan` makes every later comparison false.
    solution: |
      Keep the update vectorised from the old θ, record the cost before and after every step under
      `np.errstate`, shuffle with one generator per run, scale with the population standard deviation (1 for a
      constant column), convert back with w / std and b − w·mean, and check divergence before convergence. The
      model answer shows each function.
    rubric:
      - Every test in tests/ml_foundations/test_gradient_descent.py passes.
      - The update is vectorised and simultaneous - no per-parameter loop.
      - A diverging run returns its full history instead of raising or stopping early.
      - You can explain, with the eigenvalues, why the raw SandPay features defeat gradient descent.

  - id: test-design-trainer
    type: testdesign
    concept: gradient-descent-learning-rate
    skill: application
    title: Test plan for a colleague's optimiser
    prompt: |
      A colleague has written `train(X, y, lr, epochs, batch_size)` for the team's internal ML library -
      mini-batch gradient descent for linear regression, returning θ and a per-epoch cost history. Design the
      tests you would want before it is used for the fee model: preconditions, inputs, expected results and the
      evidence each test leaves.
    hints:
      - Which answers do you know exactly, without trusting the code?
      - Which inputs should make it fail - and how should failure look?
    modelAnswer: |
      **Preconditions:** fixed seeds; small synthetic datasets generated from a known θ.

      1. **Exact recovery:** noise-free y = Xθ* with 3 standardised features; batch size n, α = 0.5,
         200 epochs → θ within 10⁻⁶ of θ*. Evidence: θ and the final cost.
      2. **Agreement with a trusted solver:** noisy data; compare with `np.linalg.lstsq` /
         `LinearRegression` - relative tolerance 10⁻⁶ for batch descent, a looser one (cost within 1% of the
         minimum) for small batches. Evidence: both θ and both costs.
      3. **Equivalence:** batch size = n must give the same θ and history as a separately written batch
         descent, step for step.
      4. **Reproducibility:** same seed → identical θ; different seeds → different paths, same neighbourhood.
      5. **Monotone history** for batch size n and safe α.
      6. **Divergence is visible:** α above 2 / λmax → the history rises and contains inf/nan; the function
         returns rather than hanging or raising. Evidence: the history.
      7. **Edge cases:** batch size larger than n; n not divisible by the batch size (last batch smaller);
         a constant feature; a duplicated feature (no crash; predictions still fit); epochs = 0 returns the
         initial θ and a one-element history.
      8. **Gradient check** of the internal gradient against finite differences.
      9. **Shape safety:** y of shape (n, 1) must be rejected or flattened, not broadcast.
    solution: |
      Use answers known independently - noise-free recovery, `lstsq`, batch-equals-mini-batch equivalence,
      a numerical gradient - plus negative cases that must fail visibly (divergence in the history, shape
      errors) and edge cases (uneven last batch, constant or duplicated features, zero epochs), all with fixed
      seeds and tolerances.
    rubric:
      - Uses independently known answers (noise-free data, a closed-form solver), not the code's own output.
      - Includes a gradient check and an equivalence or reproducibility check.
      - Has negative cases where failure must be visible, with the expected evidence.
      - Covers edge cases in batching and in the features.
      - Uses tolerances, never exact float equality, and fixed seeds.

  - id: interview-gd
    type: interview
    concept: gradient-descent-learning-rate
    skill: analysis
    title: "\"Your loss is nan after a few epochs - what do you do?\""
    prompt: |
      An interviewer for an ML engineering role asks: "You train a linear model with gradient descent. After a
      few epochs the loss is nan. Walk me through what is happening and how you fix it. And then - when would
      you not use gradient descent for linear regression at all?"
    modelAnswer: |
      A loss that grows and turns into nan is almost always **divergence**: the learning rate is larger than
      the curvature allows. For least squares that is exact - batch descent is stable only while
      α < 2 / λmax, where λmax is the largest eigenvalue of XᵀX/n. Above it, each step multiplies the error
      along that direction by more than one in magnitude, the parameters overflow to inf, and inf − inf gives
      nan.

      I'd check, in order: the cost history (does it rise from the first step? then it's the step size);
      the feature scales - raw features in the thousands make λmax huge, so a typical α of 0.01 is millions of
      times too large; the data itself - a nan or inf in an input propagates immediately; and the shapes, since
      an (n, 1) target against (n,) predictions silently broadcasts. Fixes: standardise the features with a
      scaler fitted on the training set, then pick α by trying a few orders of magnitude for a few dozen steps
      and keep the largest one with a steadily falling cost. Gradient clipping or a decaying schedule help in
      deep learning; for linear regression, scaling and a smaller α are the real fix.

      When not to use gradient descent: when the closed form is cheap. With up to a few thousand features
      and data that fits in memory, `LinearRegression` (an SVD-based least-squares solve) gives the exact
      minimum with no tuning and no scaling. Gradient descent earns its place with very large or streaming
      data, very many features, or models with no closed form - which is everything after linear regression.
    rubric:
      - Names divergence from too large a learning rate, and explains the curvature (or eigenvalue) bound.
      - Connects unscaled features to the problem and fixes it with standardisation fitted on training data.
      - Mentions checking the data for nan/inf and shapes.
      - Gives a method for choosing α from the cost history.
      - Knows the closed form and when it is the better choice.
    followUps:
      - The loss is not nan but has been flat for 500 epochs at ten times the closed-form cost. What now?
      - How does mini-batch size interact with the learning rate you can use?
      - Why does the closed form not care about feature scaling?
    hints:
      - Start from what makes a cost grow every step.
      - Then the data - scales, nan values, shapes.
    solution: |
      Divergence: α is above 2 / λmax, usually because features are unscaled; inf turns into nan. Check the
      history, the scales, the data for nan and the shapes; standardise and choose α from short trial runs.
      Prefer the closed form (`LinearRegression`) when the problem fits in memory with a moderate number of
      features.

placement:
  - id: place-normal
    type: mcq
    concept: least-squares-linear-model
    skill: application
    title: Duplicated feature, which solver?
    prompt: |
      A design matrix has an intercept column and three features, and the third feature is exactly the sum of
      the first two. You need the least-squares fit. Which approach works?
    options:
      - id: lstsq
        text: "np.linalg.lstsq(X, y, rcond=None) - it returns the minimum-norm least-squares solution."
        feedback: Correct - lstsq factorises X (SVD) instead of inverting XᵀX, so a rank-deficient X still gives a solution with the right predictions.
      - id: inv
        text: "np.linalg.inv(X.T @ X) @ X.T @ y - the normal equation."
        feedback: XᵀX is singular because one column is a combination of others - in floating point inv either raises LinAlgError or - worse - returns numbers. On the SandPay data with a "sum" column it returned an intercept of −276.7 instead of 33.9, with no warning.
      - id: solve
        text: "np.linalg.solve(X.T @ X, X.T @ y) - faster and more accurate than inv."
        feedback: solve is better than inv in general, but it also needs a non-singular matrix. Depending on rounding it raises LinAlgError or silently returns one of infinitely many weight vectors - on the SandPay data it did the latter.
      - id: impossible
        text: None - least squares has no solution when features are dependent.
        feedback: It has infinitely many solutions, all giving the same predictions. A least-squares solver picks the one with the smallest norm.
    correct: [lstsq]
    solution: |
      Dependent columns make XᵀX singular, so `inv` and `solve` either raise or - because of rounding - return
      unreliable numbers without a warning. The least-squares problem still has
      solutions - infinitely many, with identical predictions - and `lstsq` (or `LinearRegression`) returns the
      minimum-norm one.

  - id: place-rate
    type: mcq
    concept: gradient-descent-learning-rate
    skill: analysis
    title: Above or below the bound
    prompt: |
      For a least-squares problem the eigenvalues of XᵀX/n are 0.97, 1.00 and 1.03. Which learning rate makes
      batch gradient descent diverge?
    options:
      - id: lr21
        text: α = 2.1
        feedback: Correct - 2 / 1.03 ≈ 1.94, so 2.1 is above the bound and the error along the steepest direction grows every step.
      - id: lr15
        text: α = 1.5
        feedback: 1.5 is below 1.94 - the steps overshoot the minimum (the factor 1 − 1.5 × 1.03 is negative) but shrink, so it converges.
      - id: lr1
        text: α = 1.0
        feedback: With eigenvalues all close to 1, α = 1 is close to the ideal step and converges almost immediately.
      - id: lr01
        text: α = 0.1
        feedback: Small and safe - it converges, just more slowly.
    correct: [lr21]
    solution: |
      Batch descent on least squares is stable while α < 2 / λmax = 2 / 1.03 ≈ 1.94. Only 2.1 is above it. 1.5
      overshoots each step yet still converges, because |1 − 1.5 × 1.03| = 0.55 < 1.

  - id: place-scaling
    type: mcq
    concept: gd-variants-and-feature-scaling
    skill: application
    title: The stalled loss curve
    prompt: |
      Gradient descent on raw features (one ranges 0-20,000, another 5-250) drops quickly for ten steps, then
      flattens at a cost ten times the closed-form minimum. Increasing the learning rate a little makes it
      diverge. What is the best next step?
    options:
      - id: standardise
        text: Standardise the features (fit the scaler on the training data), then choose the learning rate again.
        feedback: Correct - very different scales give a huge condition number; scaling equalises the curvature so one learning rate works in every direction.
      - id: more-steps
        text: Keep the learning rate and run 100 times more steps.
        feedback: Along the flattest direction the error shrinks by a factor extremely close to 1 per step - even 100 times more steps barely move it.
      - id: sgd
        text: Switch to stochastic gradient descent with batch size 1.
        feedback: SGD suffers from the same conditioning - its stable step is limited by the same steep direction - and adds noise. Scale first.
      - id: accept
        text: Accept the model - a flat loss curve means it has converged.
        feedback: Flat at ten times the minimum is stuck, not converged; the closed-form cost proves there is a much better fit.
    correct: [standardise]
    solution: |
      The stall-or-diverge pattern is ill-conditioning: the steep direction caps α, and at that α the flat
      directions barely move. Standardise the features (on the training set) - the condition number falls to
      near 1 and a single α converges quickly. Or, for a small problem, use the closed form.

recall:
  - id: recall-hypothesis-cost
    concept: least-squares-linear-model
    prompt: Write the linear regression hypothesis and its least-squares cost, and say what x0 is for.
    answer: h(x) = θᵀx with x0 = 1, so θ0 is the intercept. J(θ) = (1/2n) Σ (h(x⁽ⁱ⁾) − y⁽ⁱ⁾)² - half the mean squared error; a convex quadratic with one minimum.
  - id: recall-normal-equation
    concept: least-squares-linear-model
    prompt: What are the normal equations, and how should you compute their solution?
    answer: XᵀXθ = Xᵀy (θ = (XᵀX)⁻¹Xᵀy when invertible). Compute with a least-squares solver - np.linalg.lstsq or LinearRegression (SVD of X) - not by inverting XᵀX, which is singular when features are collinear.
  - id: recall-update
    concept: gradient-descent-learning-rate
    prompt: Write the gradient of J and the gradient descent update.
    answer: ∇J(θ) = (1/n) Xᵀ(Xθ − y); θ := θ − α∇J(θ), every component updated simultaneously from the old θ. For one example it is the LMS (Widrow-Hoff) rule.
  - id: recall-bound
    concept: gradient-descent-learning-rate
    prompt: For least squares, which learning rates make batch gradient descent converge?
    answer: 0 < α < 2 / λmax, where λmax is the largest eigenvalue of XᵀX/n. Each step multiplies the error along eigenvalue λ by (1 − αλ).
  - id: recall-history
    concept: gradient-descent-learning-rate
    prompt: How do you read a cost history?
    answer: Rising, inf or nan - diverged, lower α or scale features. Falling steadily - still improving, more steps or larger α. Flat - converged, or stuck in an ill-conditioned valley; compare with the closed-form cost.
  - id: recall-variants
    concept: gd-variants-and-feature-scaling
    prompt: Batch, stochastic and mini-batch gradient descent - what is the difference?
    answer: Examples per update - all (batch), one (SGD), a small shuffled group (mini-batch). Smaller batches make progress sooner and cost less per step, but are noisy; with a constant α they oscillate around the minimum unless α decays.
  - id: recall-scaling
    concept: gd-variants-and-feature-scaling
    prompt: Why does feature scaling matter for gradient descent but not for LinearRegression?
    answer: Different scales give a large condition number - steep in some directions, flat in others - so no single α works. Standardising (fit on training data only) brings the curvature close to equal. The closed-form solve has no step size, so scales do not affect it.

