id: testing-cross-site-scripting
title: Testing for cross-site scripting
subject: security-testing
module: web-vulnerabilities
level: intermediate
status: published
estimatedMinutes: 140
summary: Find reflected, stored and DOM-based cross-site scripting the way the OWASP testing guide describes - a unique, harmless canary, the context it lands in, and which special characters come back unencoded - then prove it with evidence, tell a real fix from a cosmetic one, and know what only a browser can show. Practised against a deliberately vulnerable SandPay portal on your own machine.
tags:
  [
    XSS,
    cross-site scripting,
    reflected XSS,
    stored XSS,
    DOM-based XSS,
    WSTG-INPV-01,
    WSTG-INPV-02,
    WSTG-CLNT-01,
    output encoding,
    HTML entity encoding,
    attribute encoding,
    URL encoding,
    javascript URL,
    output context,
    canary,
    sources and sinks,
    innerHTML,
    textContent,
    HTML sanitization,
    DOMPurify,
    Content-Security-Policy,
    defence in depth,
    security testing,
    OWASP,
  ]

environment: |
  - **Runtime:** Python 3.12.3 in `practice/security/.venv` with requests 2.34.2 and pytest 9.2.0; curl for the
    raw responses. Every output in this lesson was printed by the code or command shown, run on Linux on
    20 November 2026 against the practice portal on `127.0.0.1`. Canaries are random per run, so yours differ.
  - **Target:** `practice/security/support/sandpay_vuln.py`, a **deliberately vulnerable** SandPay merchant
    portal that binds to the loopback interface only. Its `xss-reflected` flaw is in `GET /search?q=` and its
    `xss-stored` flaw in `POST /api/notes` + `GET /notes`; `make_app({"xss-reflected", "xss-stored"})` fixes
    both with HTML entity encoding. SandPay, its merchants and all data are fictional.
  - **Ethics:** test only systems you own or have written permission to test. Even then, store only harmless
    markers - never working script - in shared environments.
  - **OWASP Web Security Testing Guide v4.2** (the current stable release; 5.0 is in development), quoted from
    the v4.2 tag on GitHub, as documented on 20 November 2026:
    [WSTG-INPV-01 Testing for Reflected Cross Site Scripting](https://owasp.org/www-project-web-security-testing-guide/v42/4-Web_Application_Security_Testing/07-Input_Validation_Testing/01-Testing_for_Reflected_Cross_Site_Scripting),
    [WSTG-INPV-02 Testing for Stored Cross Site Scripting](https://owasp.org/www-project-web-security-testing-guide/v42/4-Web_Application_Security_Testing/07-Input_Validation_Testing/02-Testing_for_Stored_Cross_Site_Scripting),
    [WSTG-CLNT-01 Testing for DOM-Based Cross Site Scripting](https://owasp.org/www-project-web-security-testing-guide/v42/4-Web_Application_Security_Testing/11-Client-side_Testing/01-Testing_for_DOM-based_Cross_Site_Scripting).
  - **OWASP Cheat Sheet Series**, quoted from the GitHub source as of 20 November 2026 (the cheat sheets are
    living documents):
    [Cross Site Scripting Prevention](https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html),
    [DOM based XSS Prevention](https://cheatsheetseries.owasp.org/cheatsheets/DOM_based_XSS_Prevention_Cheat_Sheet.html),
    [Content Security Policy](https://cheatsheetseries.owasp.org/cheatsheets/Content_Security_Policy_Cheat_Sheet.html).
  - **WHATWG [URL Standard](https://url.spec.whatwg.org/)** (living standard, read 20 November 2026), basic
    URL parser: leading/trailing C0 control or space removed, ASCII tab or newline removed, and a backslash
    treated like a slash in special (http, https) URLs.
  - **Rule of thumb, not a standard:** the "which raw characters break out of which context" table in this
    lesson and in `xss_reflect.py` is derived from the WSTG and the cheat sheet's contexts; OWASP does not
    publish it as a table.
  - **Not run here:** DOMPurify, browser developer tools and any browser execution. A server-side test proves
    unencoded reflection; only a browser proves execution (see "What a server-side test can prove").
  - **Not repeated here:** CSP and the other security headers -
    [HTTP security for testers](#/lesson/http-security-for-testers); the injection family in general -
    [OWASP Top 10 for developers](#/lesson/owasp-top-10-for-developers); proxies and replay -
    [Intercepting proxies](#/lesson/intercepting-proxies).

prerequisites:
  - http-security-for-testers
  - intercepting-proxies
  - reconnaissance-and-attack-surface

concepts:
  - id: sec-xss-kinds
    name: Reflected, stored and DOM-based XSS
    summary: Reflected XSS comes back in the response to the same request; stored XSS is saved by one request and served to whoever loads a later page (two or more requests, and every viewer, including administrators); DOM-based XSS happens when page script moves data from a source such as location.hash into a sink such as innerHTML, possibly without the server ever seeing the payload. Each needs a different way of looking.
  - id: sec-xss-context-encoding
    name: Output contexts and context-aware encoding
    summary: The same input is safe or dangerous depending on where it lands - HTML text, a quoted or unquoted attribute, a script block, a URL. A tester sends a unique canary, finds its context, then checks which special characters come back unencoded; a raw character that breaks out of that context is the finding. The fix is the encoding for that context (or an allow-list for URLs), not filtering words like script.
  - id: sec-xss-evidence-defence
    name: Evidence, safe probing and defence in depth
    summary: A server-side test proves unencoded reflection; only a browser proves execution, and DOM XSS may need a browser to see at all. Probes on shared systems use harmless markers. A fix is verified by the same probe going quiet, not by one payload failing. CSP and sanitisers are layers - CSP is defence in depth, a sanitiser is for user-authored HTML - not replacements for encoding.

objectives:
  - Distinguish reflected, stored and DOM-based XSS from evidence, and say which requests and which viewers each involves.
  - Classify the output context of a reflected value and name the characters that break out of it.
  - Probe a parameter with a unique, harmless canary and report which special characters come back raw, encoded or removed.
  - Write a stored XSS probe that writes through one endpoint, reads through another and refuses to conclude when it proved nothing.
  - Implement HTML text and attribute encoding and a safe-href check that follow the OWASP XSS Prevention Cheat Sheet.
  - Explain what a server-side test can and cannot prove, and why CSP and sanitisers do not replace output encoding.

sections:
  - id: intuition
    kind: intuition
    concepts: [sec-xss-kinds, sec-xss-context-encoding, sec-xss-evidence-defence]
    title: The idea in plain language
    body: |
      A browser reads a web page the way an actor reads a script. Some lines are **stage directions** - tags,
      attributes, code - and some are **dialogue**, the text to say out loud. The page author decides which is
      which with punctuation: a `<` opens a direction, a quote closes an attribute, a `</script>` ends a block
      of code.

      **Cross-site scripting (XSS)** is what happens when text that a user typed - a search term, a note, a
      name - is pasted into the script without its punctuation being made harmless. The user meant dialogue;
      the browser reads a stage direction. If that direction is "run this code", it runs **as the site**, with
      the site's cookies, the site's permissions, and the victim's trust.

      SandPay's merchant portal has a search box. Search for `invoice` and the page says *Results for invoice*.
      Search for `invoice<b>` and, on the vulnerable portal, the page does not say *Results for invoice&lt;b&gt;*:
      the rest of the heading turns **bold**. Nothing harmful happened - but the browser just took an
      instruction from the search box. Replace `<b>` with a script and it would take that instruction too.

      Three variations matter to a tester:

      - **Reflected** - the input comes straight back in the response to the same request (the search box).
      - **Stored** - the input is saved and shown later, to whoever opens the page (a merchant's notes, a
        support ticket an administrator reads).
      - **DOM-based** - the page's own JavaScript copies input (often from the URL) into the page, sometimes
        without the server ever seeing it.

      The tester's job is not to pop alert boxes. It is to find **where** each input lands, **which**
      punctuation comes back unescaped there, and to show that with evidence - using markers so harmless that
      running the test on a shared system can never hurt a colleague.

  - id: what
    kind: what
    concepts: [sec-xss-kinds, sec-xss-context-encoding]
    title: Terms you need
    body: |
      | Term | Meaning |
      | --- | --- |
      | **XSS** | Untrusted data put into a page "in a way that lets the browser treat it as code" (OWASP XSS Prevention Cheat Sheet, *XSS Defense Philosophy*) |
      | **Reflected XSS** (WSTG-INPV-01) | "the attacker injects browser executable code within a single HTTP response"; "non-persistent", also called "first-order or type 1 XSS" |
      | **Stored XSS** (WSTG-INPV-02) | input is stored "for later use" and not correctly filtered; it "typically involves at least two requests", hence "second-order XSS" |
      | **DOM-based XSS** (WSTG-CLNT-01) | page JavaScript obtains user input "through a source and using it in a sink, leading to the execution of injected code" |
      | **Source** | where untrusted data enters page script: `location.hash`, `location.search`, `document.referrer`, `postMessage` data, storage |
      | **Sink** | where data is placed into the page: safe text sinks (`textContent`, `value`) or dangerous ones (`innerHTML`, `document.write`, `eval`) |
      | **Output context** | where the value lands: HTML text, a quoted or unquoted attribute, a script block, a URL, CSS, a comment |
      | **Output encoding** | converting characters so the browser shows them as data - for HTML text: `&` `&amp;`, `<` `&lt;`, `>` `&gt;`, `"` `&quot;`, `'` `&#x27;` (the cheat sheet's table) |
      | **Canary** | a unique, harmless marker (`xq5f1c2a9d04`) the tester sends so the reflection can be found unambiguously |
      | **Breakout character** | a character that, raw, ends the current context - `<` in HTML text, `"` in a double-quoted attribute |
      | **HTML sanitisation** | stripping dangerous markup from user-authored HTML while keeping safe markup (the cheat sheet recommends DOMPurify) |
      | **CSP** | Content-Security-Policy, a response header that limits what scripts may run - "defense-in-depth", not a fix (cheat sheet) |

  - id: why
    kind: why
    concepts: [sec-xss-kinds, sec-xss-evidence-defence]
    title: Why XSS still matters to a payments tester
    body: |
      Script injected into SandPay's portal runs in the merchant's own session. The WSTG lists what attackers
      do with it: "install key loggers, steal victim cookies, perform clipboard theft, and change the content of
      the page (e.g., download links)" (INPV-01), and for stored XSS "Hijacking another user's browser",
      "Capturing sensitive information viewed by application users" and "Pseudo defacement" (INPV-02). On a
      payments portal that means changed payout details, refunds issued in the victim's name, or a fake "update
      your card" form that looks exactly like the real site - because it **is** the real site.

      Stored XSS is the worst case: "Stored XSS does not need a malicious link to be exploited" and it is
      "particularly dangerous in application areas where users with high privileges have access. When the
      administrator visits the vulnerable page, the attack is automatically executed by their browser"
      (INPV-02). A merchant note that SandPay operations staff read in a back-office tool is exactly that path.

      Modern frameworks reduce the bugs - "applications built with modern web frameworks have fewer XSS bugs"
      - but the cheat sheet lists the gaps that remain: "escape hatches", React's `dangerouslySetInnerHTML`
      without sanitising, unvalidated URL values, template injection, old plugins. And "Coverage is what
      matters: an application that protects 99 places and misses one is still vulnerable." Testers find the
      one.

  - id: internals-contexts
    kind: internals
    concepts: [sec-xss-context-encoding]
    title: Contexts - why the same character is safe in one place and dangerous in another
    body: |
      The WSTG's "Check Impact" step says testers must identify "any special characters that were not properly
      encoded, replaced, or filtered out. The set of vulnerable unfiltered special characters will depend on
      the context of that section of HTML." The browser parses each context with different rules, so the
      character that ends it differs:

      | Context | Example template | Raw character that breaks out | Correct output protection (cheat sheet) |
      | --- | --- | --- | --- |
      | HTML text | `<h1>Results for VALUE</h1>` | `<` (starts a tag) | HTML entity encoding |
      | Double-quoted attribute | `<input value="VALUE">` | `"` (ends the value) | attribute encoding, value always quoted |
      | Single-quoted attribute | `<input value='VALUE'>` | `'` | attribute encoding, value always quoted |
      | Unquoted attribute | `<input value=VALUE>` | a space or `>` - almost anything | do not do this: "Always surround attribute values with double (") or single (') quotation marks" |
      | Script block | `<script>var q = "VALUE";</script>` | `"` (ends the string), `\`, and `</script>` ends the block | a maintained JavaScript encoder for that context; better, do not put data in script at all |
      | URL in `href` / `src` | `<a href="VALUE">` | none needed - `javascript:alert(1)` runs with no special character | allow-list http and https, then attribute-encode |
      | HTML comment | `<!-- searched for VALUE -->` | `>` after `--` ends the comment | a "dangerous context": do not put data there |

      The last two rows are why "encode `<` and `>`" is not a complete answer. In the URL context **encoding is
      not enough**: the cheat sheet's defence for an untrusted URL in `href` or `src` is "Canonicalize input,
      URL Validation, Safe URL verification, Allow-list http and HTTPS URLs only ... Attribute encoder". And it
      names **dangerous contexts** - "Directly in a script", "Inside an HTML comment", "Directly in CSS" - where
      "even with output encoding, it will not prevent an XSS attack fully".

      This lesson's breakout table is a tester's rule of thumb built from these rules; OWASP does not publish
      it as a table. The authoritative statement is the cheat sheet's: "There are many different output
      encoding methods because browsers parse HTML, JS, URLs, and CSS differently. Using the wrong encoding
      method may introduce weaknesses".

  - id: internals-dom
    kind: internals
    concepts: [sec-xss-kinds, sec-xss-evidence-defence]
    title: DOM-based XSS - when the server never sees the payload
    body: |
      WSTG-CLNT-01 uses this example:

      ```html
      <script>
      document.write("Site is at: " + document.location.href + ".");
      </script>
      ```

      "An attacker may append `#<script>alert('xss')</script>` to the affected page URL ... the appended code
      would not be sent to the server as everything after the `#` character is not treated as part of the
      query by the browser, but as a fragment." So "DOM-based XSS vulnerabilities can be executed in many
      instances without the server being able to determine what is actually being executed", which "may make
      many of the general XSS filtering and detection techniques impotent".

      For a tester this has two consequences:

      1. **A server-side probe (like this lesson's) cannot find DOM XSS through the fragment.** The request it
         sends never carries the payload. DOM XSS needs the page's JavaScript read for sources and sinks, or a
         real browser running the page - the WSTG's test objectives are "Identify DOM sinks" and "Build
         payloads that pertain to every sink type".
      2. **The fix is in the front-end code.** The cheat sheet's *Safe Sinks*: "Try to refactor your code to
         remove references to unsafe sinks like innerHTML, and instead use textContent or value." Assigning
         text to `textContent` "creates a text node without parsing HTML".

      The SandPay practice portal renders its pages on the server and has no page JavaScript, so it has no DOM
      XSS. That is a limit of the practice target, not of the technique - say so in a report when a scope
      contains single-page applications.

  - id: when
    kind: when
    concepts: [sec-xss-kinds, sec-xss-evidence-defence]
    title: When to test for XSS, and what this testing does not replace
    body: |
      **Test every place where input comes back.** The WSTG starts with "Detect input vectors" - "all the web
      application's user-defined variables", including "hidden or non-obvious inputs such as HTTP parameters,
      POST data, hidden form field values". The inventory from
      [reconnaissance](#/lesson/reconnaissance-and-attack-surface) is the list to work through. For stored XSS
      it lists typical places: profiles, shopping carts, file managers, settings, forums, blogs - and "Log: if
      the application stores some users input into logs", because log viewers are pages too.

      **Test where privileged users look.** INPV-02: "All areas of the application accessible by administrators
      should be tested to identify the presence of any data submitted by users." On SandPay that includes back-
      office views of merchant names, notes and dispute texts.

      **Re-test on every change to templates, front-end frameworks or sanitiser versions.** Make the probes
      automated regression tests (see [Automating security regression tests](#/lesson/security-regression-automation)).

      What this does **not** replace:

      - **Browser-based testing.** Server-side probes prove unencoded reflection; DOM XSS and real execution
        need a browser (manually, through an [intercepting proxy](#/lesson/intercepting-proxies), or with a
        headless browser in the lab).
      - **Code review of templates and front-end sinks.** A grep for `innerHTML`, `dangerouslySetInnerHTML`,
        `|safe` or `v-html` finds places a black-box probe may never reach.
      - **DAST scanners** such as OWASP ZAP - they try far more inputs than a hand-written probe; see
        [DAST with OWASP ZAP](#/lesson/dast-with-owasp-zap). They also miss context and logic, which is why
        both are used.

  - id: visual
    kind: visual
    concepts: [sec-xss-kinds]
    title: Reflected, stored and DOM-based - where the payload travels
    body: |
      ```mermaid
      flowchart LR
        A["Attacker"] -- "1. crafted link" --> V["Victim's browser"]
        V -- "2. GET /search?q=payload" --> S["SandPay server"]
        S -- "3. page with payload unencoded" --> V
        A -- "a. POST /api/notes payload" --> S
        S -- "b. saves it" --> D[("Notes store")]
        O["Ops admin's browser"] -- "c. GET /notes" --> S
        D -- "d. payload in page" --> O
        V2["Victim's browser"] -- "i. opens page#payload" --> JS["Page JavaScript"]
        JS -- "ii. location.hash into innerHTML" --> V2
      ```

      What to notice: **reflected** is one round trip (1-3) and needs the victim to follow a link. **Stored**
      is two separate requests (a and c) by two different people - the attacker never meets the admin. **DOM**
      (i-ii) never reaches the server at all, so server logs and server-side probes see nothing.

  - id: code
    kind: code
    concepts: [sec-xss-context-encoding]
    title: Seeing it with curl, then probing it with Python
    body: |
      Start by hand. Send a canary with one harmless tag in it to both portals (vulnerable on port 8781, fixed
      on 8782; `%3C` and `%3E` are `<` and `>`):

      ```bash
      $ curl -s "http://127.0.0.1:8781/search?q=xq1%3Cb%3Exq1"
      <!doctype html><title>Search</title><h1>Results for xq1<b>xq1</h1><p>No payments.</p>
      $ curl -s "http://127.0.0.1:8782/search?q=xq1%3Cb%3Exq1"
      <!doctype html><title>Search</title><h1>Results for xq1&lt;b&gt;xq1</h1><p>No payments.</p>
      ```

      The vulnerable page contains a real `<b>` tag the user wrote; the fixed page contains `&lt;b&gt;`, which a
      browser displays as the text `<b>`. That difference **is** the evidence.

      The probe automates the WSTG's steps for one parameter. The core of `xss_reflect.py` (reference
      solution; the full file has docstrings):

      ```python
      PROBE_CHARS = ("<", ">", '"', "'", "&", "\\")

      BREAKOUT = {
          "html-text": {"<"},
          "attribute-double": {'"'},
          "attribute-single": {"'"},
          "attribute-unquoted": {">", '"', "'", "<"},
          "script": {"<", '"', "'", "\\"},
          "comment": {">"},
      }


      def _fate(page: str, canary: str, char: str) -> str:
          if f"{canary}{char}{canary}" in page:
              return "raw"
          encoded = {html.escape(char, quote=True), "&#39;", "&#x27;", "&#34;", "&quot;", "\\" + char,
                     "%" + format(ord(char), "02X")}
          if any(f"{canary}{e}{canary}" in page for e in encoded if e != char):
              return "encoded"
          return "absent"


      def probe_characters(base_url, path, parameter, session=None, canary=None):
          s = session or requests.Session()
          canary = canary or make_canary()
          url = base_url + path
          first = s.get(url, params={parameter: canary}, timeout=5, allow_redirects=False)
          report = ReflectionReport(url, parameter, classify_context(first.text, canary))
          if report.context is None:
              return report
          for char in PROBE_CHARS:
              r = s.get(url, params={parameter: f"{canary}{char}{canary}"}, timeout=5, allow_redirects=False)
              report.fates[char] = _fate(r.text, canary, char)
          return report
      ```

      Run against both portals (reference solutions, 20 November 2026; ports and canaries vary per run):

      ```text
      [vulnerable] context=html-text fates={'<': 'raw', '>': 'raw', '"': 'raw', "'": 'raw', '&': 'raw', '\\': 'raw'} breakout=['<']
      [vulnerable] reflected finding: Finding(url='http://127.0.0.1:42073/search', parameter='q', context='html-text', breakout_chars=['<'], evidence='ml><title>Search</title><h1>Results for xq7d8e904c23<xq7d8e904c23</h1><p>No payments.')
      [vulnerable] stored finding:    StoredFinding(write_path='/api/notes', read_path='/notes', payload='<xqbc66e83b68 data-probe="xqbc66e83b68">', evidence='otes</title><ul><li><xqbc66e83b68 data-probe="xqbc66e83b68"></li></ul>')
      [vulnerable] parameter 'page':  None
      [fixed] context=html-text fates={'<': 'encoded', '>': 'encoded', '"': 'encoded', "'": 'encoded', '&': 'encoded', '\\': 'raw'} breakout=[]
      [fixed] reflected finding: None
      [fixed] stored finding:    None
      [fixed] parameter 'page':  None
      ```

      Read the fixed line carefully: the backslash still comes back **raw**, and that is correct. In HTML text a
      backslash means nothing, so it is not a breakout character there and the probe reports no finding. A
      probe that flagged every raw character would bury the real findings in noise.

  - id: line-by-line
    kind: line-by-line
    concepts: [sec-xss-context-encoding, sec-xss-evidence-defence]
    title: Why the probe is written this way
    body: |
      - **A random canary per run (`make_canary`).** The page may already contain `<` from its own markup and
        from other users' input. Searching for `<canary><char><canary>` finds **this** probe's reflection and
        nothing else - the canary is letters and digits only, so no encoder changes it.
      - **First the plain canary, then one request per character.** The first request finds whether and where
        the value lands (`classify_context`). Sending each character separately makes each verdict unambiguous:
        if `<` and `"` were sent together and the server dropped the whole value on seeing `<`, you would wrongly
        conclude `"` is filtered too.
      - **Three fates, not two.** `raw`, `encoded` and `absent` are different facts. `absent` (stripped) is often
        a blacklist filter, which the WSTG warns about: an application "might filter out `<script>`, but might
        not filter `%3cscript%3e`". Report it as a weak defence even when it holds today.
      - **The verdict depends on the context (`BREAKOUT`).** A raw `"` in HTML text is harmless; in a
        double-quoted attribute it ends the value. That is the WSTG's "will depend on the context".
      - **`allow_redirects=False`.** A redirect could take the probe to another page or host - the scope gate
        from [Security testing fundamentals](#/lesson/security-testing-fundamentals) applies to probes too.
      - **No script, no handler, no `alert` is ever sent.** A test asserts this. The evidence a server-side probe
        can produce - an unencoded `<` in HTML text - does not get stronger by sending a real script; it only
        gets riskier.
      - **The stored probe refuses to say "safe" when it proved nothing.** If the write fails, or the canary is
        not on the read page at all, `probe_stored` raises instead of returning `None`. "Not vulnerable" must
        mean "my marker was displayed, encoded" - not "I looked at the wrong page".

  - id: steps
    kind: steps
    concepts: [sec-xss-kinds, sec-xss-context-encoding, sec-xss-evidence-defence]
    title: Testing a feature for XSS, step by step
    body: |
      1. **Confirm scope and the data rules.** Which hosts, which accounts, and whether stored payloads may be
         left behind (on shared systems: harmless markers only, and a clean-up plan).
      2. **List the input vectors** - query and form parameters, JSON fields, headers that are displayed (a
         `User-Agent` in an admin log view), file names, and for stored XSS every place the value is shown
         later, including admin and export views.
      3. **Send a unique canary** through each vector and search every response (and every later page, for
         stored input) for it.
      4. **Classify the context** of each reflection: HTML text, attribute (and its quote character), script,
         URL, comment, CSS.
      5. **Probe the breakout characters** for that context one at a time and record raw, encoded or absent.
      6. **Decide.** A raw breakout character is a finding. Encoded everywhere is a pass for this vector.
         Absent is a weak filter - note it.
      7. **For URL contexts, try schemes, not characters** - `javascript:` with case, leading spaces and
         embedded tabs - since no special character is needed.
      8. **For DOM XSS, read the front-end code** for sources (`location`, `document.referrer`, `postMessage`)
         flowing into sinks (`innerHTML`, `document.write`, `eval`, `setTimeout` with a string), and confirm in
         a browser in the lab.
      9. **Prove impact proportionately.** In the lab, a browser showing that a harmless element was created is
         enough; a full exploit is rarely needed and never on shared systems.
      10. **Report** with the request, the response fragment, the context, the raw characters and the fix for
          that context - then **re-run the same probe** after the fix.

  - id: example
    kind: example
    concepts: [sec-xss-kinds, sec-xss-evidence-defence]
    title: "Example: the merchant note an administrator reads"
    body: |
      SandPay merchants can leave notes on their account; the support team sees the same notes in an internal
      tool. A release changes the merchant-facing notes page from a server template to a front-end component.

      What the tester checks, in order:

      - **Stored path, merchant view.** `probe_stored` with a merchant token: the marker
        `<xq... data-probe="xq...">` comes back encoded. Pass - for this view.
      - **Stored path, admin view.** The same note opened in the support tool. INPV-02 says to test "All areas
        of the application accessible by administrators"; the support tool uses a different template, so the
        merchant-view result proves nothing about it.
      - **The new component.** A code search finds `note.innerHTML = body` in the component. The server encodes
        on output, but the component **decodes** the JSON field into `innerHTML`, so the browser parses it as
        markup. This is the DOM-sink variant of the same flaw, invisible to the server-side probe.
      - **The fix proposed:** `note.textContent = body`, the cheat sheet's safe sink, instead of re-encoding.
        Verified by loading a note containing `<b>marker</b>` in a browser and seeing the literal text.
      - **Evidence kept:** the request, the stored payload, both response fragments, the component line and a
        screenshot of the literal text after the fix.

      The lesson: one encoded response is evidence about one page, built by one code path. Test every place
      the value is shown.

  - id: tests
    kind: tests
    concepts: [sec-xss-context-encoding, sec-xss-evidence-defence]
    title: Test cases with expected results and evidence
    body: |
      | # | Case | Steps | Expected (secure) | Evidence |
      | --- | --- | --- | --- | --- |
      | 1 | Reflected, HTML text | `GET /search?q=<canary><<canary>` | `<` returned as `&lt;` | response fragment around the canary |
      | 2 | All breakout characters | one request per `<` `>` `"` `'` `&` | each encoded or harmless for the context | per-character fate table |
      | 3 | Parameter not reflected | probe `page` on `/search` | no reflection, no finding | probe output `None` |
      | 4 | Stored, own view | `POST /api/notes` marker, `GET /notes` | marker shown encoded | both requests and the page fragment |
      | 5 | Stored, admin view | the same note in every admin page | encoded everywhere | one fragment per page |
      | 6 | Probe proves nothing | write with an invalid token | probe raises, no verdict | the error message |
      | 7 | URL context | `javascript:`, ` JaVaScRiPt:`, `java\tscript:` as a link URL | rendered as `#` or rejected | rendered `href` value |
      | 8 | Attribute context | `" autofocus x="` in a value field | stays inside the quoted value | parsed attribute list |
      | 9 | DOM sink | page code review plus a browser in the lab | no source flows into `innerHTML` | code reference and screenshot |
      | 10 | Regression | re-run cases 1-8 after every template or front-end change | same results | CI test report |

      Negative tests matter as much as positive ones: on `make_app({"xss-reflected", "xss-stored"})` the probes
      must return `None`. A probe that reports findings on the fixed portal would make developers stop
      trusting your reports.

  - id: mistakes
    kind: mistakes
    concepts: [sec-xss-kinds, sec-xss-context-encoding, sec-xss-evidence-defence]
    title: Common mistakes and a debugging method
    body: |
      - **"No alert popped, so it is safe."** The alert proves execution in a browser; its absence proves
        nothing - the payload may have landed in an attribute, needed different quotes, or been blocked by CSP
        that a different browser ignores. Check the context and the raw characters instead.
      - **Testing one payload.** `<script>alert(1)</script>` being stripped does not mean `<img src=x
        onerror=...>` is, and neither matters in a `javascript:` URL context. The WSTG calls out filters that
        miss other encodings.
      - **Accepting a blacklist as the fix.** Removing the word `script` is not output encoding. Ask for
        context-aware encoding (or the framework's auto-escaping) and re-run the full character probe.
      - **Encoding for the wrong context.** HTML-encoding a value placed in `href` leaves `javascript:` working;
        `escape(value, quote=False)` in an attribute leaves `"` raw. Name the context in the report.
      - **Stopping at the merchant's own view of stored input.** Admin and support views are separate code
        paths - and higher-value targets.
      - **Treating CSP as the fix.** The cheat sheet is explicit: CSP works best "as a defense-in-depth
        technique"; "Sole Reliance on Content-Security-Policy (CSP) Headers" is listed among the anti-patterns.
      - **Storing real script on shared systems.** Colleagues' browsers run it too. Use inert markers and clean
        up.
      - **Concluding "not vulnerable" from a probe that never saw its own marker.** That is a failed test, not a
        pass.

      **Debugging method** when a probe and a browser disagree: (1) save the raw response, not the rendered page;
      (2) find the canary and write down the exact characters around it; (3) name the context; (4) check the
      response `Content-Type` - JSON served as `text/html` is itself a finding (the cheat sheet: "verify that the
      Content-Type header is application/json and not text/html"); (5) if the server response is clean but the
      browser shows markup, the bug is a DOM sink - look at the page's JavaScript.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [sec-xss-evidence-defence]
    title: Trade-offs and alternatives
    body: |
      | Approach | Strength | Limit |
      | --- | --- | --- |
      | Server-side probe (this lesson) | fast, repeatable, safe, ideal as a regression test | proves unencoded reflection, not execution; blind to DOM XSS |
      | Browser-based testing (manual or headless) | sees execution and DOM sinks | slower, more setup; still needs a list of inputs |
      | DAST scanner (OWASP ZAP) | many payloads and inputs quickly | false positives and negatives; weak on context and multi-step stored paths |
      | Code review / SAST of templates and sinks | finds what black-box testing never reaches | needs code access; framework knowledge |
      | Framework auto-escaping | encodes by default, everywhere | escape hatches (`dangerouslySetInnerHTML`, `\|safe`, `v-html`) reintroduce the bug |
      | HTML sanitiser (DOMPurify) | lets users author rich text safely | must be patched; "If you sanitize content and then modify it afterwards, you can easily void your security efforts" |
      | CSP | limits damage when something slips through | not a fix; browser support and legacy pages limit it |

      Defences combine: the cheat sheet's introduction says "no single technique will solve XSS, using the right
      combination of defensive techniques will be necessary". Testing combines the same way.

  - id: summary
    kind: summary
    concepts: [sec-xss-kinds, sec-xss-context-encoding, sec-xss-evidence-defence]
    title: Quick reference
    body: |
      - **Reflected** - same request and response (WSTG-INPV-01). **Stored** - written once, shown later, often
        to admins (INPV-02). **DOM** - page script moves a source into a sink; may never reach the server
        (CLNT-01).
      - **Method:** unique canary, find the context, probe each breakout character, record raw, encoded or
        absent.
      - **Breakout characters:** `<` in HTML text; the quote in a quoted attribute; almost anything unquoted;
        quotes, `\` and `</script>` in script; in URLs, the scheme (`javascript:`) - no character needed.
      - **Fix:** encoding for the context (HTML entities `&amp; &lt; &gt; &quot; &#x27;`), quoted attributes with
        fixed names, allow-listed URL schemes, safe sinks (`textContent`), a maintained sanitiser for user HTML.
      - **CSP is defence in depth**, not the fix.
      - **Evidence:** the request, the response fragment, the context and the raw characters. A server-side test
        proves reflection; a browser proves execution.
      - **Harmless markers only** on shared systems; a probe that did not see its marker has proved nothing.

exercises:
  - id: kinds-which
    type: mcq
    concept: sec-xss-kinds
    skill: application
    title: Which kind of XSS is it?
    prompt: |
      A merchant sets their shop name to `<b>Shop</b>`. Nothing changes on their own dashboard, which encodes
      it. The next morning, SandPay's support tool shows the shop name in bold in the dispute queue. Which kind
      of XSS does this evidence show?
    options:
      - id: stored
        text: Stored (second-order) XSS in the support tool
        feedback: Correct - written by one request, displayed unencoded in a later page to another user.
      - id: reflected
        text: Reflected XSS in the dashboard
        feedback: The dashboard encoded the value; nothing came back unencoded in the same response.
      - id: dom
        text: DOM-based XSS, because the effect appeared in a different place
        feedback: DOM XSS is about page script moving a source into a sink; here the server template shows stored data.
      - id: none
        text: No XSS - bold text is harmless
        feedback: The browser took markup from user input; a script tag would be treated the same way. The marker proves the precondition.
    correct: [stored]
    hints:
      - How many requests, and how many people, are involved?
    solution: |
      Stored XSS "typically involves at least two requests" (WSTG-INPV-02) - here the merchant's write and the
      support agent's read. The admin view is the dangerous one.

  - id: dom-fragment
    type: mcq
    concept: sec-xss-kinds
    skill: analysis
    title: Why the server-side probe missed it
    prompt: |
      A page runs `document.write("Site is at: " + document.location.href)`. Your server-side probe sends
      `/page#xq01<b>xq01` and finds nothing unusual in the response. Why?
    options:
      - id: fragment
        text: The fragment after # is not sent to the server, so the response cannot contain it
        feedback: Correct - WSTG-CLNT-01 - "the appended code would not be sent to the server". The flaw is in the page script.
      - id: encoded
        text: The server encoded the fragment
        feedback: The server never received it, so it had nothing to encode.
      - id: csp
        text: CSP blocked the payload
        feedback: CSP acts in the browser; the probe never ran a browser.
      - id: safe
        text: The page is safe because the response is clean
        feedback: document.write with location data is a classic DOM sink; a browser would build the markup.
    correct: [fragment]
    hints:
      - What does a browser send to the server for `https://shop.example/page#abc`?
    solution: |
      Fragments stay in the browser. DOM XSS needs the page's JavaScript reviewed for sources and sinks, or a
      browser test in the lab.

  - id: context-attribute
    type: mcq
    concept: sec-xss-context-encoding
    skill: application
    title: The canary lands in an attribute
    prompt: |
      Your canary comes back as `<input name="q" value="xq2c41">`. Which raw character would you need back to
      break out of this context?
    options:
      - id: dquote
        text: The double quote "
        feedback: Correct - a raw double quote ends the attribute value, so the rest becomes new attributes.
      - id: lt
        text: The less-than sign <
        feedback: Inside a quoted attribute value, < is just text; it does not end the value.
      - id: squote
        text: The single quote '
        feedback: The value is delimited by double quotes; a single quote does not end it.
      - id: backslash
        text: The backslash \
        feedback: Backslash has no meaning in HTML attribute values.
    correct: [dquote]
    hints:
      - Which character ends the value that started with `value="`?
    solution: |
      The context decides the character. In a double-quoted attribute it is `"`; that is why the cheat sheet
      says to always quote attribute values and use an attribute encoder.

  - id: backslash-raw
    type: mcq
    concept: sec-xss-context-encoding
    skill: analysis
    title: A raw backslash on the fixed portal
    prompt: |
      On the fixed portal, the probe reports `<`, `>`, `"`, `'` and `&` encoded but `\` raw, in the HTML text
      context of the search heading. What should you report?
    options:
      - id: no-finding
        text: No XSS finding - a backslash cannot break out of HTML text
        feedback: Correct - the verdict depends on the context, and in HTML text only < starts markup.
      - id: finding
        text: An XSS finding - one special character is unencoded
        feedback: Reporting every raw character regardless of context creates noise and false positives.
      - id: partial
        text: A partial fix - ask for the backslash to be encoded too
        feedback: HTML entity encoding does not touch backslash, and there is nothing to fix in this context.
      - id: retest
        text: Inconclusive - test again with a real script payload
        feedback: A script payload adds risk, not evidence; the context analysis already answers the question.
    correct: [no-finding]
    hints:
      - Would a backslash matter if the value were inside a JavaScript string?
    solution: |
      Backslash matters in script contexts, not HTML text. Context-aware probing is how a tester avoids false
      positives.

  - id: href-encoding
    type: mcq
    concept: sec-xss-context-encoding
    skill: analysis
    title: Encoded, but still exploitable
    prompt: |
      A profile page renders the merchant's website as `<a href="ENCODED">website</a>` with full HTML attribute
      encoding. A merchant sets the website to `javascript:alert(document.domain)`. What happens when someone
      clicks it?
    options:
      - id: runs
        text: The script runs - the value needs no special characters, so encoding changes nothing
        feedback: Correct - the URL context needs a scheme allow-list (http and https) before encoding.
      - id: blocked
        text: Nothing - attribute encoding neutralises it
        feedback: There is nothing to encode in `javascript:alert(document.domain)`; the scheme itself is the problem.
      - id: url-encode
        text: Nothing, if the value is also URL-encoded
        feedback: Percent-encoding a whole URL would break real links; the defence is validating the scheme.
      - id: csp-only
        text: It depends only on the CSP
        feedback: CSP may limit it, but the cheat sheet calls sole reliance on CSP an anti-pattern.
    correct: [runs]
    hints:
      - Which characters in the payload would an HTML encoder change?
    solution: |
      For untrusted URLs in `href` or `src` the cheat sheet asks for canonicalisation, URL validation and an
      allow-list of http and https, then attribute encoding.

  - id: csp-role
    type: mcq
    concept: sec-xss-evidence-defence
    skill: recall
    title: Where CSP fits
    prompt: |
      A developer says: "We added a strict Content-Security-Policy, so we don't need to fix the unencoded search
      parameter." What does the OWASP XSS Prevention Cheat Sheet say?
    options:
      - id: depth
        text: CSP is defence in depth - the encoding bug still needs fixing
        feedback: Correct - it lists "Sole Reliance on Content-Security-Policy (CSP) Headers" as an anti-pattern.
      - id: enough
        text: A strict CSP is a complete fix for reflected XSS
        feedback: The cheat sheet disagrees - browsers differ and legacy pages complicate CSP.
      - id: dom-only
        text: CSP only applies to DOM XSS
        feedback: CSP restricts script in the browser whatever the injection path; it is still not a fix.
      - id: replaces-sanitiser
        text: CSP replaces the need for an HTML sanitiser
        feedback: Sanitisers are for user-authored HTML; CSP does not strip markup.
    correct: [depth]
    hints:
      - Look for the word "anti-patterns".
    solution: |
      Fix the encoding; keep the CSP as a second layer. Report both: the XSS, and any CSP weakness.

  - id: sanitiser-or-encode
    type: mcq
    concept: sec-xss-evidence-defence
    skill: application
    title: Rich-text notes
    prompt: |
      SandPay wants merchants to write notes with bold, italic and links. Encoding every note would show the
      tags as text. What does the cheat sheet recommend?
    options:
      - id: sanitise
        text: A maintained HTML sanitiser such as DOMPurify, kept patched, with no changes to its output afterwards
        feedback: Correct - "When users need to author HTML ... HTML Sanitization should be used."
      - id: regex
        text: A regular expression that removes script tags
        feedback: That is a blacklist filter; event handlers, URLs and encodings get through.
      - id: csp
        text: No encoding, and a CSP to block scripts
        feedback: CSP is defence in depth, not a substitute for sanitising untrusted HTML.
      - id: validate
        text: Input validation that rejects any <
        feedback: That forbids the feature; the requirement is safe markup, not no markup.
    correct: [sanitise]
    hints:
      - Encoding shows markup as text. What keeps safe markup but removes the dangerous parts?
    solution: |
      Sanitise user-authored HTML with a maintained library, patch it, and do not modify its output afterwards -
      "you can easily void your security efforts".

  - id: safe-sink
    type: mcq
    concept: sec-xss-kinds
    skill: application
    title: Pick the safe sink
    prompt: |
      Page script shows a merchant's display name, taken from `location.search`, in a heading. Which line is
      safe?
    options:
      - id: textcontent
        text: '`heading.textContent = name`'
        feedback: Correct - textContent "creates a text node without parsing HTML".
      - id: innerhtml
        text: '`heading.innerHTML = name`'
        feedback: innerHTML parses the value as markup - the classic DOM sink.
      - id: write
        text: '`document.write("<h1>" + name + "</h1>")`'
        feedback: document.write parses its argument as HTML.
      - id: outerhtml
        text: '`heading.outerHTML = "<h1>" + name + "</h1>"`'
        feedback: outerHTML parses markup too.
    correct: [textcontent]
    hints:
      - Which assignment creates a text node instead of parsing HTML?
    solution: |
      Prefer text sinks (`textContent`, `value`, `createTextNode`) over HTML sinks. The cheat sheet: "remove
      references to unsafe sinks like innerHTML, and instead use textContent or value."

  - id: what-proves
    type: mcq
    concept: sec-xss-evidence-defence
    skill: analysis
    title: What does the probe's evidence prove?
    prompt: |
      Your server-side probe shows `<h1>Results for xq7d8e904c23<xq7d8e904c23</h1>` on the vulnerable portal.
      What exactly does this prove?
    options:
      - id: reflection
        text: User input is reflected in HTML text with < unencoded - the precondition for XSS
        feedback: Correct - execution is shown in a browser; the server-side evidence proves the encoding failure.
      - id: execution
        text: Script has executed in a victim's browser
        feedback: No browser ran the page; the probe only read the HTML.
      - id: nothing
        text: Nothing, until an alert box is shown
        feedback: The raw < in HTML text is the root cause and is enough for a finding; the alert is a demonstration.
      - id: dom
        text: DOM-based XSS
        feedback: The server put the value in the response; this is reflected XSS.
    correct: [reflection]
    hints:
      - Which step of the attack happens in the server, and which in the browser?
    solution: |
      A server-side test proves unencoded reflection in a context where it breaks out. That is reportable;
      a lab browser demonstration can be added when impact is disputed.

  - id: harmless-marker
    type: mcq
    concept: sec-xss-evidence-defence
    skill: application
    title: Testing stored XSS on a shared staging system
    prompt: |
      You must test the notes feature on a staging system that SandPay's support team also uses. Which payload
      do you store?
    options:
      - id: marker
        text: An inert, unique element such as `<xq9a1 data-probe="xq9a1">`
        feedback: Correct - proves markup survives, cannot run, and is easy to find and clean up.
      - id: alert
        text: '`<script>alert(1)</script>` - the standard proof'
        feedback: It runs in every colleague's browser that opens the notes page.
      - id: cookie
        text: A script that sends document.cookie to your test server
        feedback: That steals colleagues' sessions - harmful and outside any sane scope.
      - id: none
        text: Nothing - stored XSS cannot be tested safely on shared systems
        feedback: It can, with harmless markers and a clean-up plan agreed in scope.
    correct: [marker]
    hints:
      - What is the least harmful payload that still shows unencoded markup?
    solution: |
      Use inert markers that prove the precondition (raw `<` in HTML text), record them, and remove them after
      the test.

  - id: probe-order
    type: order
    concept: sec-xss-context-encoding
    skill: application
    title: Test one parameter for reflected XSS
    prompt: Put the steps of a reflected XSS test of one parameter in order.
    items:
      - id: vector
        text: List the parameter as an input vector from the recon inventory
      - id: canary
        text: Send a unique alphanumeric canary and find it in the response
      - id: context
        text: Classify the context the canary landed in
      - id: chars
        text: Send each breakout character for that context, one per request, wrapped in the canary
      - id: fates
        text: Record each character as raw, encoded or absent
      - id: decide
        text: Report a finding if a breakout character came back raw, with the response fragment as evidence
      - id: retest
        text: After the fix, run the same probe and confirm it reports nothing
    hints:
      - You cannot choose the characters before you know the context.
    solution: |
      Vector, canary, context, characters, fates, decision, re-test. The context decides which characters
      matter, so it comes before them.

  - id: debug-attribute
    type: debug
    concept: sec-xss-context-encoding
    skill: analysis
    title: The search box that still breaks
    prompt: |
      After an XSS fix, the heading is safe but your probe still reports a raw `"` in a
      **double-quoted attribute**. Which line is the defect?
    language: python
    code: |
      from html import escape

      def search_page(q: str) -> str:
          shown = escape(q, quote=False)
          return (
              "<h1>Search</h1>"
              f'<input name="q" value="{shown}">'
              f"<p>You searched for {shown}</p>"
          )
    correctLines: [4]
    lineNotes:
      - line: 7
        note: Quoting the attribute is right - the value just needs an encoder that also encodes quotes.
      - line: 8
        note: For HTML text, escaping without quotes is enough; this line is safe.
    hints:
      - What does `quote=False` leave unencoded?
    solution: |
      `escape(q, quote=False)` encodes `&`, `<` and `>` but not `"` or `'`, so `" autofocus onfocus="...` ends
      the value. Use `escape(q)` (quotes encoded) - one encoder per context.

  - id: no-alert-short
    type: short
    concept: sec-xss-evidence-defence
    skill: analysis
    title: '"I tried alert(1) and nothing happened"'
    prompt: |
      A colleague tested the merchant name field by entering `<script>alert(1)</script>` and opening the page in
      Chrome. No alert appeared, so they marked the field "not vulnerable". Give three reasons this conclusion
      may be wrong and say what you would test instead.
    modelAnswer: |
      1. The value may land in a **context** where that payload does not apply - an attribute (needs a quote),
         a script string, a URL (needs `javascript:` and no tags), so the absence of an alert says nothing about
         the other contexts.
      2. **Something else may have interfered**: a CSP blocking inline script in that browser, a filter that
         strips the word `script` but not `<img onerror>`, or the value shown on a **different page** (an admin
         view) that was not opened.
      3. **Stored and DOM paths** need the right page and, for DOM sinks, the page's own script - one look at
         one page is not coverage.

      Instead: send a unique harmless canary, find every place it appears, classify each context, probe that
      context's breakout characters one at a time, and record raw, encoded or absent with the response
      fragment as evidence.
    rubric:
      - Names output context as a reason a single payload proves nothing.
      - Names a filter, CSP or browser difference as a reason the alert may be missing.
      - Mentions other display locations (admin views) or DOM sinks.
      - Proposes the canary, context and per-character method with evidence.
    hints:
      - Where might the name be displayed, and in what context?
    solution: |
      An absent alert is not evidence of safety. Context-aware probing with a canary across every display
      location is.

  - id: notes-testdesign
    type: testdesign
    concept: sec-xss-kinds
    skill: application
    title: Test plan for the notes feature after the fix
    prompt: |
      Developers say the stored XSS in merchant notes is fixed. Notes are shown on the merchant's notes page, in
      the support team's back-office tool, and in a CSV export. Design the test cases: preconditions, steps,
      expected result and evidence for each.
    modelAnswer: |
      Preconditions: lab or agreed staging; two merchant accounts and one support account; agreement that inert
      markers may be stored and must be removed afterwards.

      1. **Merchant view, HTML text.** Store `<xq.. data-probe="xq..">`; open `/notes`. Expected: the marker
         is shown as text (`&lt;xq..`). Evidence: request, response fragment.
      2. **Support tool.** Open the same note as support staff. Expected: encoded. Evidence: response fragment
         from the support tool, its URL and the account used.
      3. **Attribute context, if any.** If the note text appears in a `title` or `data-` attribute (tooltips),
         probe `"` and `'`. Expected: encoded quotes. Evidence: parsed attribute.
      4. **Other merchant.** Merchant B's notes page must not show merchant A's note at all. Expected: absent.
         Evidence: response (this is also an access-control check).
      5. **CSV export.** Open the export in a spreadsheet: a note starting with `=` must not run as a formula
         (a related injection). Expected: escaped. Evidence: the file and the cell.
      6. **Negative control.** Run the automated probe against the fixed build: no finding; against the old
         build: finding. Evidence: both probe outputs.
      7. **Clean-up.** Delete the markers. Evidence: the notes list afterwards.
    rubric:
      - Covers every display location, including the support tool.
      - Uses harmless markers and includes clean-up.
      - States expected results as encoded output, with response fragments as evidence.
      - Includes a negative control showing the probe still detects the old flaw.
    hints:
      - List every place a note is displayed, then test each one.
    solution: |
      One case per display location, inert markers, encoded output as the expected result, and a negative
      control on the old build.

  - id: interview-xss
    type: interview
    concept: sec-xss-context-encoding
    skill: analysis
    title: 'Interview: how do you test a web app for XSS?'
    prompt: |
      "Walk me through how you would test our merchant portal for cross-site scripting, and how you would know
      a fix is real."
    modelAnswer: |
      I start from the input inventory: every parameter, JSON field and displayed header, and for stored input
      every page that shows it later - especially admin and support views. For each, I send a unique harmless
      canary and find where it comes back. Then I classify the context - HTML text, a quoted attribute, a script
      string, a URL - because that decides which characters matter: `<` in text, the quote in an attribute,
      quotes and backslash in script, and in URLs the scheme itself. I send those characters one at a time and
      record whether each comes back raw, encoded or stripped. A raw breakout character is the finding, with
      the request and response fragment as evidence. For DOM XSS I read the front-end code for sources like
      `location.hash` flowing into sinks like `innerHTML`, and confirm in a browser in the lab.

      A fix is real when it is context-aware output encoding (or a safe sink, or a sanitiser for rich text,
      or a scheme allow-list for URLs) and the same probe goes quiet - not when one payload stops working.
      CSP is a good second layer, but not the fix. I keep the probes as regression tests in CI.
    rubric:
      - Starts from input vectors and covers stored display locations including admin views.
      - Uses a canary and classifies the context before choosing characters.
      - Distinguishes server-side evidence from browser execution, and covers DOM sources and sinks.
      - Describes context-aware fixes and verifying them by re-running the probe; CSP as defence in depth.
    followUps:
      - How do you test stored XSS on a staging system other people use?
      - Why is an encoded `<` not enough for a value placed in `href`?
      - What would you look for in a React code base?
    hints:
      - Input vectors, canary, context, characters, evidence, fix verification.
    solution: |
      Inventory, canary, context, per-character probing, evidence, DOM review, context-aware fix, re-test with
      the same probe, CSP as a second layer.

  - id: reflect-code
    type: coding
    concept: sec-xss-context-encoding
    skill: application
    title: Write a context-aware reflection probe
    prompt: |
      In `practice/security/exercises/web/xss_reflect.py`, implement `make_canary`, `classify_context`,
      `_fate`, `ReflectionReport.breakout_chars`, `probe_characters` and `find_reflected_xss`. The tests check
      the context classifier on hand-written pages, then run your probe against the portal: it must find the
      reflected XSS in `/search?q=` on `make_app()`, report **nothing** on `make_app({"xss-reflected"})`, ignore
      a parameter that is not reflected, and never send `script`, `onerror` or `alert`.
    project: security
    files: [exercises/web/xss_reflect.py]
    test: tests/web/test_xss_reflect.py
    command: .venv/bin/python -m pytest tests/web/test_xss_reflect.py
    modelAnswer: |
      Find the context from what precedes the canary, then test only the characters that matter there:

      ```python
      def classify_context(page, canary):
          at = page.find(canary)
          if at < 0:
              return None
          before = page[:at]
          if before.rfind("<!--") > before.rfind("-->"):
              return "comment"
          lower = before.lower()
          if lower.rfind("<script") > lower.rfind("</script"):
              if ">" in before[lower.rfind("<script"):]:
                  return "script"
          if before.rfind("<") > before.rfind(">"):          # inside a tag
              tag = before[before.rfind("<"):]
              m = re.search(r"=\s*([\"']?)([^\"'=]*)$", tag)
              if m:
                  q = m.group(1)
                  if q == '"' and tag.count('"') % 2 == 1:
                      return "attribute-double"
                  if q == "'" and tag.count("'") % 2 == 1:
                      return "attribute-single"
                  if q == "":
                      return "attribute-unquoted"
          return "html-text"
      ```

      `breakout_chars` keeps the characters whose fate is `raw` **and** that are in `BREAKOUT[context]` - that
      is what keeps the fixed portal's raw backslash from becoming a false positive.
    rubric:
      - Every test in tests/web/test_xss_reflect.py passes.
      - The canary is unique per run and alphanumeric.
      - Characters are probed one per request, so each verdict is unambiguous.
      - The verdict depends on the context, so a raw character that cannot break out is not reported.
      - No script, event handler or alert is ever sent.
    hints:
      - Find the canary first; if it is not reflected, there is nothing else to probe.
      - For the context, look backwards from the canary - an unclosed comment, an open script element, an open tag.
      - '`_fate` checks the exact string `<canary><char><canary>` first, then encoded forms between the canaries.'
    solution: |
      Canary, context, one character per request, and a context-dependent verdict - see the model answer and
      `solutions/web/xss_reflect.py`.

  - id: stored-code
    type: coding
    concept: sec-xss-kinds
    skill: application
    title: Write a safe stored-XSS probe
    prompt: |
      In `practice/security/exercises/web/xss_stored.py`, implement `make_marker` and `probe_stored`. The probe
      writes an inert marker through `POST /api/notes` and reads `GET /notes` with the same bearer token. It
      must find the stored XSS on `make_app()`, return `None` on `make_app({"xss-stored"})` - even when an
      older, encoded note is on the page - and **raise** `RuntimeError` when the write fails ("write failed") or
      the marker is not on the read page ("nothing proved").
    project: security
    files: [exercises/web/xss_stored.py]
    test: tests/web/test_xss_stored.py
    command: .venv/bin/python -m pytest tests/web/test_xss_stored.py
    modelAnswer: |
      ```python
      def make_marker():
          canary = f"xq{secrets.token_hex(5)}"
          return canary, f'<{canary} data-probe="{canary}">'


      def probe_stored(base_url, token, write_path="/api/notes", read_path="/notes", field="body", session=None):
          s = session or requests.Session()
          auth = {"Authorization": f"Bearer {token}"}
          canary, payload = make_marker()
          w = s.post(base_url + write_path, json={field: payload}, headers=auth, timeout=5)
          if w.status_code >= 300:
              raise RuntimeError(f"write failed: {w.status_code} {w.text[:200]}")
          page = s.get(base_url + read_path, headers=auth, timeout=5).text
          if canary not in page:
              raise RuntimeError(f"the marker {canary} is not on {read_path}: nothing proved")
          at = page.find(payload)
          if at < 0:
              return None
          return StoredFinding(write_path, read_path, payload, page[max(0, at - 20): at + len(payload) + 20])
      ```

      The canary check before the verdict is what turns "I looked at the wrong page" into an error instead of
      a false "safe".
    rubric:
      - Every test in tests/web/test_xss_stored.py passes.
      - The marker is inert - no script, event handler, URL or style.
      - The probe searches only for its own unique marker.
      - It refuses to conclude when the write fails or the marker is not displayed.
    hints:
      - The canary must appear on the read page in some form - raw or encoded - before you can decide anything.
      - Look for the whole raw payload; if only the canary is there, the payload was encoded.
    solution: |
      Write, read, check the canary is displayed, then decide raw versus encoded - see the model answer.

  - id: encode-code
    type: coding
    concept: sec-xss-evidence-defence
    skill: application
    title: Implement context-aware encoders
    prompt: |
      In `practice/security/exercises/web/xss_encode.py`, implement `encode_html_text`, `render_attribute`,
      `encode_url_param` and `safe_href` following the OWASP XSS Prevention Cheat Sheet. The tests parse your
      output with Python's HTML parser to prove no payload adds a tag or escapes an attribute, check the
      cheat sheet's entity table exactly, reject attribute names such as `onclick`, and try `javascript:` URLs
      with mixed case, leading spaces, tabs and protocol-relative tricks.
    project: security
    files: [exercises/web/xss_encode.py]
    test: tests/web/test_xss_encode.py
    command: .venv/bin/python -m pytest tests/web/test_xss_encode.py
    modelAnswer: |
      ```python
      _HTML = {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#x27;"}


      def encode_html_text(value):
          return "".join(_HTML.get(c, c) for c in value)


      def safe_href(url, fallback="#"):
          canonical = _TAB_OR_NEWLINE.sub("", url.strip("".join(chr(i) for i in range(0x21))))
          parts = urllib.parse.urlsplit(canonical)
          if parts.scheme.lower() in ("http", "https") and parts.netloc:
              return encode_html_text(canonical)
          if not parts.scheme and canonical.startswith("/") and not canonical.startswith(("//", "/\\")):
              return encode_html_text(canonical)
          return encode_html_text(fallback)
      ```

      Canonicalise the way browsers do (the WHATWG URL Standard strips leading and trailing C0 control or space
      and removes tabs and newlines), allow-list the scheme, then attribute-encode. In production use your
      framework's auto-escaping or a maintained encoder - this exercise is to know what correct looks like.
    rubric:
      - Every test in tests/web/test_xss_encode.py passes.
      - Encodes & first, so nothing is double-encoded or left half-encoded.
      - Attribute names are fixed by an allow-list, and values are always quoted.
      - URLs are canonicalised and allow-listed before encoding, not filtered for the word javascript.
    hints:
      - Map each of the five characters to its entity in one pass, so `&` is never encoded twice.
      - Browsers ignore a leading space, and a tab inside the word (java, tab, script, colon) too - canonicalise before checking the scheme.
      - '`//evil.example` and `/\evil.example` are protocol-relative links to another host.'
    solution: |
      One entity table for text and quoted attributes, fixed attribute names, percent-encoding for parameters,
      and canonicalise-then-allow-list for URLs.

placement:
  - id: place-kind
    type: mcq
    concept: sec-xss-kinds
    skill: analysis
    title: Two requests, two people
    prompt: |
      A support agent's browser builds a `<b>` element from a dispute description that a cardholder submitted
      through a web form a week earlier. The form's own confirmation page showed the text encoded. Which kind
      of XSS is this, and where do you test it?
    options:
      - id: stored-admin
        text: Stored XSS - test the support agent's view, not only the form's confirmation page
        feedback: Correct - written once, displayed later to a privileged user by a different code path.
      - id: reflected-form
        text: Reflected XSS in the form's confirmation page
        feedback: The confirmation page encoded the value; the problem shows up in a later page.
      - id: dom-form
        text: DOM XSS in the form
        feedback: Nothing suggests page script moving a source into a sink on the form.
      - id: not-xss
        text: Not XSS, because the form encoded the value
        feedback: Encoding on one page says nothing about another page built by another template.
    correct: [stored-admin]
    hints:
      - Which page showed the markup?
    solution: |
      Stored XSS is tested where the value is displayed later - especially admin and support views
      (WSTG-INPV-02).

  - id: place-context
    type: mcq
    concept: sec-xss-context-encoding
    skill: application
    title: The canary in a script string
    prompt: |
      Your canary comes back inside `<script>var ref = 'xq81ab';</script>`. Which result is a finding?
    options:
      - id: squote-raw
        text: A single quote comes back raw
        feedback: Correct - it ends the JavaScript string, so the rest of the input becomes code.
      - id: lt-encoded
        text: < comes back as &lt;
        feedback: That is encoding, not a finding - and alone it would not prove the script context is safe.
      - id: amp-raw
        text: '& comes back raw'
        feedback: A raw ampersand does not end a JavaScript string.
      - id: space-raw
        text: A space comes back raw
        feedback: Spaces are harmless inside a quoted JavaScript string.
    correct: [squote-raw]
    hints:
      - Which character ends a string that starts with `'`?
    solution: |
      In a script string the delimiter quote (and backslash, and `</script>`) break out. The cheat sheet treats
      script as a dangerous context: avoid putting data there at all.

  - id: place-fix
    type: mcq
    concept: sec-xss-evidence-defence
    skill: analysis
    title: Is the fix real?
    prompt: |
      After a fix, the search page returns `xq1&lt;b&gt;xq1` for `xq1<b>xq1`, every breakout character is
      encoded, and the response still has **no** Content-Security-Policy header. What do you report?
    options:
      - id: fixed-plus
        text: The reflected XSS is fixed; the missing CSP is a separate, lower-priority hardening finding
        feedback: Correct - encoding fixes the bug, and CSP is defence in depth, reported on its own.
      - id: not-fixed
        text: Not fixed - XSS needs a CSP to be fixed
        feedback: The cheat sheet treats CSP as defence in depth, not the fix.
      - id: retest-alert
        text: Inconclusive until a script payload is tried in a browser
        feedback: Every breakout character is encoded in this context; the probe already shows the fix.
      - id: fixed-only
        text: Fixed, and nothing else to report
        feedback: The missing CSP is still worth reporting as hardening.
    correct: [fixed-plus]
    hints:
      - Which control fixes the bug, and which only limits damage?
    solution: |
      Verify the fix with the same probe; report missing defence-in-depth layers separately.

recall:
  - id: recall-kinds
    concept: sec-xss-kinds
    prompt: How do reflected, stored and DOM-based XSS differ?
    answer: Reflected comes back in the response to the same request. Stored is written by one request and shown in later pages, often to admins. DOM-based is page script moving a source (location.hash) into a sink (innerHTML), possibly never reaching the server.
  - id: recall-check-impact
    concept: sec-xss-context-encoding
    prompt: What does the WSTG's "Check Impact" step tell the tester to look for?
    answer: The test input in the response and any special characters "that were not properly encoded, replaced, or filtered out" - a set that "will depend on the context".
  - id: recall-html-entities
    concept: sec-xss-context-encoding
    prompt: What are the cheat sheet's five HTML entity encodings?
    answer: "& to &amp;, < to &lt;, > to &gt;, \" to &quot;, ' to &#x27;."
  - id: recall-url-context
    concept: sec-xss-context-encoding
    prompt: Why is encoding not enough for an untrusted URL in href, and what is?
    answer: "javascript: URLs need no special characters. Canonicalise, allow-list http and https (and local paths), then attribute-encode."
  - id: recall-proof
    concept: sec-xss-evidence-defence
    prompt: What does a server-side XSS test prove, and what needs a browser?
    answer: It proves unencoded reflection in a context where it breaks out. Execution and DOM-based XSS need a browser.
  - id: recall-csp
    concept: sec-xss-evidence-defence
    prompt: How does the OWASP cheat sheet position CSP against XSS?
    answer: As defence in depth, customised per application. Sole reliance on CSP is listed as an anti-pattern.

