    API8,
    API9,
    API10,
    BOLA,
    BOPLA,
    BFLA,
    mass assignment,
    excessive data exposure,
    SSRF,
    unrestricted resource consumption,
    improper inventory management,
    shadow endpoint,
    test coverage,
    WSTG-APIT-01,
    WSTG-APIT-03,
    WSTG-APIT-04,
  ]

environment: |
  - **Runtime:** Python 3.12.3 in `practice/security/.venv` with pytest 9.2.0 and requests 2.34.2, and curl,
    on Linux. Every output in this lesson was printed by the commands and code shown, run on 20 November 2026
    against the practice portal. Sign-in tokens are random, so they are not shown (a forged token is shown,
    because it carries nothing secret).
  - **Practice target:** `practice/security/support/sandpay_vuln.py`, a **deliberately vulnerable** SandPay
    merchant portal bound to `127.0.0.1` only, with 17 flaws; `make_app({...})` builds the same portal with
    named flaws fixed. SandPay, its merchants (`m_100` Shop A, `m_200` Shop B), users, keys and payments are
    fictional, and every secret in the outputs is a synthetic practice value. The shared helpers for this lesson
    are in `support/apitop_fixture.py`.
  - **Ethics:** test an API only with **written permission**, inside the agreed scope, with **test accounts you
    were given**. Several checks in this lesson - SSRF, rate limits, hidden-path guessing - cause load or reach
    systems that were not meant to be reached; against a real system they need the owner's explicit approval
    of exactly that test. Everything here runs against your own machine.
  - **The list:** OWASP API Security Top 10, **2023** edition, as published on 20 November 2026:
    the [risk overview](https://owasp.org/API-Security/editions/2023/en/0x11-t10/), the [release
    notes](https://owasp.org/API-Security/editions/2023/en/0x04-release-notes/) and the ten risk pages -
    [API1](https://owasp.org/API-Security/editions/2023/en/0xa1-broken-object-level-authorization/),
    [API2](https://owasp.org/API-Security/editions/2023/en/0xa2-broken-authentication/),
    [API3](https://owasp.org/API-Security/editions/2023/en/0xa3-broken-object-property-level-authorization/),
    [API4](https://owasp.org/API-Security/editions/2023/en/0xa4-unrestricted-resource-consumption/),
    [API5](https://owasp.org/API-Security/editions/2023/en/0xa5-broken-function-level-authorization/),
    [API6](https://owasp.org/API-Security/editions/2023/en/0xa6-unrestricted-access-to-sensitive-business-flows/),
    [API7](https://owasp.org/API-Security/editions/2023/en/0xa7-server-side-request-forgery/),
    [API8](https://owasp.org/API-Security/editions/2023/en/0xa8-security-misconfiguration/),
    [API9](https://owasp.org/API-Security/editions/2023/en/0xa9-improper-inventory-management/) and
    [API10](https://owasp.org/API-Security/editions/2023/en/0xaa-unsafe-consumption-of-apis/). Quotations are
    from these pages. The site also hosts the 2019 edition; the numbers in this lesson are the 2023 ones.
  - **Testing guide:** the OWASP Web Security Testing Guide's API Testing chapter, **read from the development
    version on [GitHub](https://github.com/OWASP/wstg/tree/master/document/4-Web_Application_Security_Testing/12-API_Testing)
    on 20 November 2026** - WSTG-APIT-01 API Reconnaissance, WSTG-APIT-03 Excessive Data Exposure and
    WSTG-APIT-04 API Broken Function Level Authorization. These ids come from the development version and may
    change before the next stable release; the stable release is [v4.2](https://owasp.org/www-project-web-security-testing-guide/v42/),
    which has no such chapter.
  - **Tools named, not run here:** the WSTG names a ZAP add-on for importing OpenAPI definitions and
    request-collection formats such as Postman and Bruno for sharing API artifacts; none is installed. The
    exercises build the same comparisons in Python.
  - **Not repeated here:** the two-account IDOR method and authorization matrix - [Testing access control and
    IDOR](#/lesson/testing-access-control-idor); tampering with JWTs and OAuth - [Testing JWTs and OAuth
    2.0](#/lesson/testing-jwt-and-oauth); mass assignment and excessive data exposure in depth - [Testing mass
    assignment and excessive data exposure](#/lesson/testing-mass-assignment-and-data-exposure); races, double
    refunds and rate limits - [Testing business logic, races and rate limits](#/lesson/testing-business-logic-and-rate-limits);
    the web-application list this one complements - [OWASP Top 10 for developers](#/lesson/owasp-top-10-for-developers).

prerequisites:
  - security-testing-fundamentals
  - reconnaissance-and-attack-surface
  - testing-access-control-idor

concepts:
  - id: sec-apitop-ten-risks
    name: The ten API risks as ten testable questions
    summary: The 2023 list is awareness material, not a standard. Read each risk as a question you can answer with a request - may this caller touch this object (API1), this property (API3), this function (API5); is this really the caller (API2); how much and how often (API4, API6); where does the server reach and whom does it trust (API7, API10); what is configured (API8) and what exists (API9). Some flaws belong to two risks, and some web flaws (injection, XSS, CSRF, logging) have no category in the 2023 list.
  - id: sec-apitop-probes
    name: One probe per risk - safe, with a control and no false positive
    summary: A probe is a small automated check for one risk. It sends a harmless request (a read, a value that changes nothing, a fetch of the server's own health page), proves its request works with a control first, reports evidence without secret values, finds the flaw on the vulnerable portal and says nothing once that flaw is fixed.
  - id: sec-apitop-inventory-coverage
    name: Inventory and coverage - what exists, and what nobody tested
    summary: Improper inventory management is a testable gap - compare the documented endpoints with the ones that really answer, remembering that a 404 can come from a handler and that unauthenticated 401, 405 and 500 answers still prove a route exists. Then count which of the ten risks have no evidence at all; those blind spots need a design review or tests of a different kind.

objectives:
  - Name the ten risks of the OWASP API Security Top 10:2023 and turn each into a question a test can answer.
  - Tell object level (API1), property level (API3) and function level (API5) authorization failures apart, and explain why API3 merged data exposure with mass assignment.
  - Map findings to the right risk - including findings that belong to two risks and flaws the 2023 list has no category for.
  - Write a safe probe for a risk that sends a harmless request, runs a control first, reports evidence without secrets, and stays quiet on the fixed system.
  - Compare an API's documentation with what answers, and read 404, 401, 405 and 500 correctly when deciding whether an endpoint exists.
  - Report which risks a test suite has not covered, and say what kind of testing the uncovered ones need.

sections:
  - id: intuition
    kind: intuition
    concepts: [sec-apitop-ten-risks, sec-apitop-probes]
    title: The idea in plain language
    body: |
      A building inspector does not wander around looking for "anything wrong". They carry a checklist: fire
      doors, wiring, stair rails, exits, signs. Each line is a question with a way to check it - push the door,
      press the test button, count the exits. The checklist cannot tell them the building is safe. It tells them
      which questions have been asked.

      An API has the same problem. "Test the API for security" is too vague to start. The **OWASP API Security
      Top 10** is the checklist the API world uses. Its ten lines are the ways APIs most often fail, and almost
      every line becomes a request you can send:

      - may Shop A's user read Shop B's payment? (API1)
      - does the API accept a token nobody signed? (API2)
      - what happens to the 9,000th request in a minute? (API4)
      - can I make the server fetch an address *I* choose? (API7)

      SandPay's merchant portal has flaws planted in it for exactly this. This lesson takes the ten risks one by
      one, shows each flaw with a real request, then turns each into a small probe that finds the flaw and goes
      silent once it is fixed. The last step is the one a checklist is really for: **count the lines you have not
      asked yet**.

      One caution up front. The Top 10 is an *awareness* list. Saying "we tested the OWASP API Top 10" does not
      mean the API is secure - it means ten kinds of question were asked. The release notes say so
      themselves: it "does not replace other TOP 10's".

  - id: what
    kind: what
    concepts: [sec-apitop-ten-risks, sec-apitop-probes, sec-apitop-inventory-coverage]
    title: Terms you need
    body: |
      | Term | Meaning |
      | --- | --- |
      | **OWASP API Security Top 10** | OWASP's list of the ten most critical API risks. The 2023 edition is the second, published "exactly four years after its first release" (2019). |
      | **API1 BOLA** | Broken Object Level Authorization - the API does not check "that the logged-in user has permissions to perform the requested action on the requested object". IDOR in API clothes. |
      | **API2 Broken Authentication** | tokens and credentials mishandled - for example "accepts unsigned/weakly signed JWT tokens (`{"alg":"none"}`)" or permits "brute force attack on the same user account, without presenting captcha/account lockout mechanism". |
      | **API3 BOPLA** | Broken Object Property Level Authorization - one object, but a property the caller must not read ("Excessive Data Exposure" in 2019) or must not write ("Mass Assignment" in 2019). |
      | **API4 Unrestricted Resource Consumption** | requests cost "network bandwidth, CPU, memory, and storage", and sometimes money; a missing limit means denial of service or a bigger bill. |
      | **API5 BFLA** | Broken Function Level Authorization - a regular user reaches an administrative or other-role **function**. |
      | **API6 Sensitive Business Flows** | a legitimate flow (buy a ticket, post a comment) with no compensation for being run "excessively in an automated manner". "This doesn't necessarily come from implementation bugs." |
      | **API7 SSRF** | Server Side Request Forgery - the API fetches "a remote resource without validating the user-supplied URI", so an attacker steers the server's own requests, "even when protected by a firewall or a VPN". |
      | **API8 Security Misconfiguration** | missing hardening, verbose errors, missing security headers, unneeded features, a missing or wrong CORS policy. |
      | **API9 Improper Inventory Management** | more endpoints and versions exist than anyone has documented, such as "deprecated API versions and exposed debug endpoints". |
      | **API10 Unsafe Consumption of APIs** | the API trusts what a third-party API sends it more than it would trust user input. |
      | **Probe** | a small automated check for one risk: a harmless request, a verdict, and a line of evidence. |
      | **Control request** | a request that must succeed - it proves the token and the request shape work, so a "denied" or "nothing found" is meaningful. |
      | **Safe-value probe** | testing whether a property can be written by sending the value it already has, so a vulnerable system changes nothing. |
      | **Shadow endpoint** | a route that answers but appears in no documentation or inventory. |
      | **Coverage gap** | a risk for which a test suite holds no evidence at all - neither pass nor fail. |

  - id: why
    kind: why
    concepts: [sec-apitop-ten-risks]
    title: Why a separate list for APIs
    body: |
      A web page hides most of its logic behind a user interface. An API exposes it. The API1 page says that
      APIs "tend to expose endpoints that handle object identifiers, creating a wide attack surface of Object
      Level Access Control issues", and that the issue is extremely common "because the server component usually
      does not fully track the client's state, and instead, relies more on parameters like object IDs, that are
      sent from the client".

      The same shift explains the rest of the list:

      - **The client is not a gatekeeper.** An API response contains every field the server sends, whatever the
        screen shows (API3). A request can carry fields the form never had (API3, again).
      - **Machines call APIs, so volume is normal.** A person submits a form a few times; a script can submit it
        a hundred thousand times, and some calls cost money - OWASP's API4 example is a text-message provider
        charging per call (API4, API6).
      - **APIs call APIs.** Webhooks, URL previews and imports make the server a client of someone else's
        address (API7) and of someone else's data (API10).
      - **APIs multiply.** Versions, partner endpoints and debug routes outlive their documentation (API9).

      The list is also a **testing vocabulary**. A tester who writes "BOLA on `GET /api/payments/{id}`, evidence
      attached" and a developer who reads it mean the same thing. That shared name is most of its value.

  - id: ten-questions
    kind: internals
    concepts: [sec-apitop-ten-risks]
    title: The ten risks as ten questions
    body: |
      Each risk page has an "Is the API Vulnerable?" section. Read it as a test charter. The five groups below
      are this lesson's way of remembering the list, not OWASP's:

      | Risk | The question to answer with a request | A quick check | Planted in SandPay as |
      | --- | --- | --- | --- |
      | **API1** BOLA | May this caller act on **this object**? | A reads B's payment id | `idor` |
      | **API3** BOPLA | May this caller read or write **this property**? | read a merchant object; PATCH a `role` | `data-exposure`, `mass-assignment` |
      | **API5** BFLA | May this caller use **this function**? | merchant calls an admin endpoint; other verbs | nothing seeded directly |
      | **API2** Broken Authentication | Is this really the caller? | unsigned token, no lockout, weak hashes | `jwt-none`, `weak-hash`, `no-rate-limit` |
      | **API4** Resource consumption | How much, how often, how large? | repeat, batch, page size, payload size | `no-rate-limit` |
      | **API6** Business flows | Can a flow be abused at scale? | automate the flow and watch the business effect | nothing seeded |
      | **API7** SSRF | Whose URL does the server fetch? | give it a URL you control | `ssrf` |
      | **API10** Unsafe consumption | Whom does the server trust? | feed bad data through a stubbed third party | nothing seeded |
      | **API8** Misconfiguration | What is configured, and how loudly does it fail? | trigger an error; read headers | `verbose-errors`, `missing-headers` |
      | **API9** Inventory | What exists that nobody wrote down? | compare documentation with answers | an undocumented `/internal/admin` and `/boom` |

      Three authorization risks look alike and are easy to mix up. They differ in **what the check is about**:

      - **API1** - the *object* (`/api/payments/pay_2001`). "By design the user will have access to the vulnerable
        API endpoint/function"; the violation is at the object level. Comparing the id in the URL with the id in
        the token "isn't a sufficient solution".
      - **API3** - a *property* of an object you may legitimately reach (`role`, `api_secret`).
      - **API5** - a *function* you should not reach at all (`POST /api/admin/promoteUser`). OWASP's rule of
        thumb: "Don't assume that an API endpoint is regular or administrative only based on the URL path."

      Notice two things about the "planted in SandPay" column. **`no-rate-limit` is on two rows**: a sign-in
      endpoint without lockout is a brute-force opening (API2) *and* a missing limit (API4). And three risks -
      API5, API6, API10 - have **no seeded flaw**. That is not a mistake in the table; it is the lesson's last
      point, and a real finding about any test suite built from the portal alone.

  - id: what-changed
    kind: internals
    concepts: [sec-apitop-ten-risks]
    title: What the 2023 edition changed - and what it left out
    body: |
      The release notes give the changes from 2019 in four lines:

      1. "We've combined Excessive Data Exposure and Mass Assignment focusing on the common root cause: object
         property level authorization validation failures." That is **API3**. One question - may this caller read
         or write this property? - covers a leaking response and an over-accepting request.
      2. "We've put more emphasis on resource consumption, over focusing on the pace they are exhausted." The 2019
         "Lack of Resources & Rate Limiting" became **API4 Unrestricted Resource Consumption**: size, count,
         memory, timeouts and spend, not only requests per second.
      3. A new category, **API6 Unrestricted Access to Sensitive Business Flows**, "to address new threats,
         including most of those that can be mitigated using rate limiting".
      4. A new category, **API10 Unsafe Consumption of APIs**: "attackers have started looking for a target's
         integrated services to compromise those, instead of hitting the APIs of their target directly".

      Comparing the two lists' tables of contents shows what is **gone**: the 2019 list had *API8 Injection* and
      *API10 Insufficient Logging & Monitoring*; the 2023 list has no category for injection or logging, and
      none for cross-site scripting or CSRF either. The portal has flaws of all of those kinds - `sqli`, `xss-*`,
      `csrf`, `secret-logging`. They are real findings; they belong to the [web application
      list](#/lesson/owasp-top-10-for-developers) and to the testing lessons for [SQL
      injection](#/lesson/testing-sql-injection), [XSS](#/lesson/testing-cross-site-scripting) and
      [CSRF](#/lesson/testing-csrf-and-clickjacking), not to a 2023 API number. When you map findings, "no API
      category" is an honest answer. Forcing an `sqli` finding into API8 to make a report look complete is not.

      The edition is dated 2023 and OWASP has not published a newer API list as of 20 November 2026, but the web
      application list has a 2025 edition. Quote the year with every number: "API3:2023".

  - id: when
    kind: when
    concepts: [sec-apitop-ten-risks, sec-apitop-inventory-coverage]
    title: When to use the list, and when not to
    body: |
      **Use it to:**

      - **plan** - one test charter per risk for a new API, so no risk is skipped by accident;
      - **name** findings consistently, so a defect says "API1:2023" and everyone knows the class;
      - **report coverage** - which risks were tested, how deeply, and which were not;
      - **train** developers and testers on one vocabulary.

      **Do not use it as:**

      - **a standard to certify against.** It is awareness material. For a testable requirement set, use the
        [ASVS](#/lesson/owasp-wstg-and-asvs) and the WSTG chapters.
      - **a complete list.** Injection, XSS and CSRF are missing by design, and an API can be insecure in ways no
        line names.
      - **a pass/fail score.** "Seven of ten tested" says nothing about how well each was tested.
      - **proof that a risk is absent.** One check that finds nothing is one data point. The probes below prove a
        *flaw is present or absent in one place*, not that a whole category is covered.

      A good coverage statement is specific: "API1 tested for payments and merchants with two accounts; API2:
      unsigned token and lockout checked, token lifetime not; API5, API6, API10 not tested".

  - id: visual
    kind: visual
    concepts: [sec-apitop-ten-risks, sec-apitop-inventory-coverage]
    title: From the portal's flaws to the ten risks
    body: |
      ```mermaid
      flowchart LR
        subgraph Portal["SandPay portal - 17 flaws"]
          idor["idor"]
          ma["mass-assignment"]
          de["data-exposure"]
          jn["jwt-none"]
          wh["weak-hash"]
          nrl["no-rate-limit"]
          ssrf["ssrf"]
          ve["verbose-errors"]
          mh["missing-headers"]
          web["sqli, xss-reflected, xss-stored,<br/>csrf, open-redirect, path-traversal,<br/>weak-session, secret-logging"]
        end
        idor --> A1["API1 Object level"]
        ma --> A3["API3 Property level"]
        de --> A3
        jn --> A2["API2 Authentication"]
        wh --> A2
        nrl --> A2
        nrl --> A4["API4 Resource consumption"]
        ssrf --> A7["API7 SSRF"]
        ve --> A8["API8 Misconfiguration"]
        mh --> A8
        web -. "no 2023 category" .-> NONE["web Top 10 and WSTG"]
        A5["API5 Function level"]:::gap
        A6["API6 Business flows"]:::gap
        A9["API9 Inventory"]:::gap
        A10["API10 Unsafe consumption"]:::gap
        classDef gap stroke-dasharray: 4 3
      ```

      Four risks have no arrow: API5, API6, API9 and API10. A suite built from the seeded flaws alone cannot
      report on them. API9 can still be tested without a seeded flaw - by comparing documentation with reality,
      as the inventory exercise does - while API5, API6 and API10 need a design review, role-based test data
      or a stubbed third party.

  - id: curl-evidence
    kind: code
    concepts: [sec-apitop-ten-risks, sec-apitop-probes]
    title: Six risks by hand, with curl
    body: |
      Start the vulnerable portal (`.venv/bin/python support/sandpay_vuln.py --port 8793`), sign in as Alice and
      Bob, and keep their tokens in `$A` and `$BT`.

      **API1 - Alice reads Bob's payment** (the status line and body; see the [IDOR
      lesson](#/lesson/testing-access-control-idor) for the full method):

      ```bash
      curl -si http://127.0.0.1:8793/api/payments/pay_2001 -H "Authorization: Bearer $A"
      ```

      ```http
      HTTP/1.1 200 OK

      {"id": "pay_2001", "merchant_id": "m_200", "amount_minor": 4999, "currency": "EUR", "status": "captured", "card_last4": "1881"}
      ```

      **API2 - an unsigned token.** The forged token has the header `{"alg": "none", "typ": "JWT"}`, a payload
      naming the admin, and **no signature** (the part after the second dot is empty):

      ```plaintext
      header=eyJhbGciOiAibm9uZSIsICJ0eXAiOiAiSldUIn0 payload=eyJzdWIiOiAib3BzQHNhbmRwYXkuZXhhbXBsZSJ9 signature=[]
      ```

      ```bash
      curl -s http://127.0.0.1:8793/api/me -H "Authorization: Bearer $FORGED"
      ```

      ```json
      {"email": "ops@sandpay.example", "merchant_id": null, "role": "admin", "display_name": "SandPay Ops"}
      ```

      **API3 - a property that should not be there.** Alice's own merchant object:

      ```bash
      curl -s http://127.0.0.1:8793/api/merchants/m_100 -H "Authorization: Bearer $A"
      ```

      ```json
      {"id": "m_100", "name": "Shop A", "api_secret": "sk_test_shop_a_practice", "payout_iban": "XX00 SAND 0000 0001"}
      ```

      The caller may see her merchant - but `api_secret` and the full IBAN are properties she should not be
      sent. And a property she should not be able to **write**. The safe-value probe sends the role she already
      has:

      ```bash
      curl -si -X PATCH http://127.0.0.1:8793/api/profile -H "Authorization: Bearer $A" \
        -H 'Content-Type: application/json' -d '{"role":"merchant"}'
      ```

      ```http
      HTTP/1.1 200 OK

      {"email": "alice@shop-a.example", "merchant_id": "m_100", "role": "merchant", "display_name": "Alice"}
      ```

      Nothing changed - and the server still accepted a property the form never offers. On the fixed portal
      the same request is refused with `400 {"error": "fields not allowed: ['role']"}`.

      **API4 - eight wrong sign-ins for one account**, vulnerable portal, then with `no-rate-limit` fixed
      (printing only status codes; curl printed them separated by spaces and they are joined with commas here, because a run of three-digit numbers looks like a card number to this app's content check):

      ```plaintext
      401, 401, 401, 401, 401, 401, 401, 401
      401, 401, 401, 401, 401, 429, 429, 429
      ```

      **API7 - the webhook test fetches a URL of the caller's choice.** Bob asks the portal to fetch its own
      internal page:

      ```bash
      curl -s http://127.0.0.1:8793/api/webhooks/test -H "Authorization: Bearer $BT" \
        -H 'Content-Type: application/json' -d '{"url": "http://127.0.0.1:8793/internal/admin"}'
      ```

      ```json
      {"delivered": true, "status": 200, "response_preview": "{\"admin\": true, \"settlement_key\": \"sk_practice_do_not_use\"}"}
      ```

      **API8 - an error that explains too much.** The last two lines of `curl -s .../boom` on the vulnerable
      portal (the traceback above them also names a file path on the machine, left out here), then on the
      fixed one:

      ```plaintext
          raise RuntimeError(f"settlement batch failed; db=sqlite:///var/sandpay/portal.db key={JWT_SECRET.decode()}")
      RuntimeError: settlement batch failed; db=sqlite:///var/sandpay/portal.db key=sandpay-practice-only-jwt-key
      ```

      ```json
      {"error": "internal error", "reference": "0c0f2946"}
      ```

      The `reference` is random for each error: support can find the log line, an attacker learns nothing.
      Headers of `GET /health` before and after the `missing-headers` fix (`Date` left out):

      ```http
      HTTP/1.1 200 OK
      Server: SandPayPortal/0.9 Python/3.12
      Content-Type: application/json
      Content-Length: 16
      ```

      ```http
      HTTP/1.1 200 OK
      Server: SandPay
      Content-Type: application/json
      Content-Security-Policy: default-src 'self'; frame-ancestors 'none'
      X-Content-Type-Options: nosniff
      Referrer-Policy: no-referrer
      Strict-Transport-Security: max-age=31536000
      Content-Length: 16
      ```

      (The fixed portal still sends HSTS over plain HTTP, which RFC 6797 says not to, and its CSP lacks
      `object-src` and `base-uri` - "fixed" here means this lesson's probe passes, not that the portal meets a
      standard.)

      **API9** and **API5/API6/API10** have no curl line here: API9 is the comparison below, and the other three
      need setups the portal does not have.

  - id: probe-code
    kind: code
    concepts: [sec-apitop-probes, sec-apitop-inventory-coverage]
    title: The probes and the inventory comparison in code
    body: |
      The exercises in `practice/security/exercises/api/` turn the six curl checks and two more into probes.
      Three of them, abridged. First, the safe-value write probe (API3), which changes nothing on a vulnerable
      portal:

      ```python
      def check_property_write(base_url, token):
          role = _get(base_url, "/api/me", token).json()["role"]
          resp = requests.patch(base_url + "/api/profile", json={"role": role},
                                headers=_auth(token), timeout=5)
          if resp.status_code == 200:
              return Finding("API3:2023", "mass-assignment",
                             "PATCH /api/profile accepted the property 'role': 200")
          return None
      ```

      Second, the SSRF probe (API7) - it asks the server to fetch **its own** health page, so no request leaves
      the machine, and it needs both `200` and `delivered: true` before it calls it a finding:

      ```python
      def check_ssrf(base_url, token):
          resp = requests.post(base_url + "/api/webhooks/test", json={"url": base_url + "/health"},
                               headers=_auth(token), timeout=5)
          if resp.status_code == 200 and resp.json().get("delivered") is True:
              return Finding("API7:2023", "ssrf", "the server fetched a loopback URL and returned its body: 200")
          return None
      ```

      Third, the orchestrator. It runs a **control** first and returns findings in risk order:

      ```python
      def probe_api(base_url, token_a, token_b):
          control = _get(base_url, "/api/me", token_a)
          if control.status_code != 200:
              raise RuntimeError(f"control failed: GET /api/me as A returned {control.status_code}")
          email = control.json()["email"]
          checks = [check_bola(base_url, token_a, token_b), check_unsigned_jwt(base_url, email),
                    check_property_write(base_url, token_a), check_property_read(base_url, token_a),
                    check_login_rate_limit(base_url), check_ssrf(base_url, token_a),
                    check_error_detail(base_url), check_security_headers(base_url)]
          return sorted((f for f in checks if f is not None), key=lambda f: int(f.risk.split(":")[0][3:]))
      ```

      The inventory comparison (API9) probes a wordlist without signing in and keeps what exists:

      ```python
      def route_exists(status, body):
          return not (status == 404 and body == {"error": "not found"})

      def undocumented(observed, documented):
          return sorted(p for p in observed if not any(matches_template(p, t) for t in documented))
      ```

      And the mapping that turns flaw ids into risks is a table, plus two small functions that group by risk
      and list the risks nobody covered:

      ```python
      "no-rate-limit": ("API4:2023", "API2:2023"),   # best fit first; two risks
      "sqli": (),                                     # no API Top 10:2023 category

      def untested_risks(flaws):
          covered = set(group_by_risk(flaws))
          return [risk for risk in sorted(RISKS, key=_number) if risk not in covered]
      ```

  - id: line-by-line
    kind: line-by-line
    concepts: [sec-apitop-probes, sec-apitop-inventory-coverage, sec-apitop-ten-risks]
    title: Why the probes are written that way
    body: |
      - **The control comes first and stops the run.** If Alice's token does not work, a probe that reports "no
        finding" is not saying the API is safe. `RuntimeError` makes the broken run loud.
      - **The write probe sends the value the property already has.** A probe that sets `role: admin` would
        break a vulnerable system's data and could not be re-run. Sending `merchant` to a `merchant` user is
        accepted by the vulnerable portal, refused by the fixed one, and changes nothing either way. (It cannot
        find a server that accepts the property but ignores it - that needs a visible side effect; the [mass
        assignment lesson](#/lesson/testing-mass-assignment-and-data-exposure) goes deeper.)
      - **The SSRF probe asks for the server's own `/health`.** Nothing leaves the machine, so it is safe to
        run. It requires `delivered: true`, not just a 200, because the fixed portal answers a public URL with
        `200 {"delivered": false, ...}`.
      - **Evidence names keys, never secret values.** The finding for `data-exposure` says the response
        "returns api_secret, payout_iban". Evidence copied into tickets and chat logs must not become a second
        leak. A test checks that no evidence line contains the secret.
      - **The rate-limit probe uses an account that does not exist.** It sends eight wrong passwords for
        `probe-nobody@shop-a.example`, so it cannot lock out a real user. Against a real system a lockout is a
        side effect you must agree beforehand.
      - **`route_exists` looks at the body, not only the status.** `/files` answers `404` with
        `{"error": "file not found: public"}` - a handler ran, so the route exists. Only the router's own
        `{"error": "not found"}` means it does not.
      - **Probing is unauthenticated on purpose.** Without a token every real `/api/*` route answers `401` or
        `405` and a missing one answers `404`. One extra signed-in pass would add object-level `404`s that
        look like missing routes.
      - **`probe_paths` does not follow redirects.** A `302` is an answer; following it would test the page
        the redirect points at.
      - **`group_by_risk` lists a flaw under every risk it belongs to.** `no-rate-limit` is a finding for API4
        *and* a symptom for API2; counting it once would hide that API2 has evidence.
      - **`risks_for_flaw` raises for an unknown id.** A typo (`idorr`) must not look like "no category".

  - id: steps
    kind: steps
    concepts: [sec-apitop-ten-risks, sec-apitop-probes, sec-apitop-inventory-coverage]
    title: Testing an API against the Top 10, step by step
    body: |
      1. **Get permission and test accounts in writing** - two ordinary accounts, one of each higher role - and
         agree which tests may cause load (API4), reach other hosts (API7) or lock accounts.
      2. **Collect the inventory** (API9): ask the owner for the OpenAPI definition or request collection first
         (WSTG-APIT-01 recommends asking "as early as possible"), then look in well-known places such as
         `/api-docs` and `/openapi.json`.
      3. **Write one charter per risk**, each as a question with the endpoints it applies to. Mark the ones that
         need a different setup (API5 roles, API6 business rules, API10 a stubbed third party).
      4. **For each charter, build a probe** with a control, a harmless request, evidence without secrets, and
         two expectations: it finds the flaw on a vulnerable build and stays quiet on a fixed one.
      5. **Run the probes against the real build.** Read each finding's evidence; reproduce it by hand once
         before you report it.
      6. **Compare the documentation with what answers.** Every answering route that is not documented is a
         question for the owner: remove it, document it, or protect it.
      7. **Count the gaps.** List the risks with no evidence and say why, so the report shows what was *not*
         tested.
      8. **Map every finding to a risk id and year** (or "no API category") and file it with the evidence.
      9. **Keep the probes.** Run them on every release; a probe that found something becomes the regression
         test for its fix.

  - id: example
    kind: example
    concepts: [sec-apitop-ten-risks, sec-apitop-probes]
    title: "Example: three findings that chain"
    body: |
      Risks rarely arrive alone. On the vulnerable portal, Alice (an ordinary merchant, `m_100`) can read Shop
      B's secrets by chaining findings the probes reported separately.

      **Step 1 - API3, mass assignment.** Alice sends a property the form never offers - this time with a new
      value:

      ```bash
      curl -s -X PATCH http://127.0.0.1:8793/api/profile -H "Authorization: Bearer $A" \
        -H 'Content-Type: application/json' -d '{"role":"admin"}'
      ```

      ```json
      {"email": "alice@shop-a.example", "merchant_id": "m_100", "role": "admin", "display_name": "Alice"}
      ```

      **Step 2 - API5 as a result.** The portal's admin rule - an admin may read any merchant - is now Alice's:

      ```bash
      curl -s http://127.0.0.1:8793/api/merchants/m_200 -H "Authorization: Bearer $A"
      ```

      ```json
      {"id": "m_200", "name": "Shop B", "api_secret": "sk_test_shop_b_practice", "payout_iban": "XX00 SAND 0000 0002"}
      ```

      A property-level failure (API3) produced a function/privilege-level result (API5), and the response
      leaked a secret the merchant object should never have carried (API3 again).

      **Step 3 - API7 and API9.** Bob asks the webhook test to fetch `/internal/admin` and gets the settlement
      key back (shown above). That page is reachable by anyone who asks the server for it directly, and it
      appears in no documentation - the inventory probe lists it. An undocumented endpoint (API9) was the
      target of a forged request (API7).

      **What the tester reports.** Not "three bugs" and not "API3 and API5 and ...". One attack path with the
      risk ids as vocabulary: *"a merchant can become admin (API3:2023 mass assignment), then read any
      merchant's secrets (API3:2023 data exposure) via an admin rule that is now hers (the result of API5-class
      access); the server can also be told to fetch its own undocumented `/internal/admin` (API7:2023 and
      API9:2023)."* The fix list follows from the chain: block the property, trim the response, remove the
      undocumented route or protect it, and stop the server fetching user-chosen URLs.

      **A caution on SSRF from the same run.** Asking the vulnerable portal to fetch `http://127.0.0.1:1/x`
      (a closed port) returns `500` with a traceback, while `/internal/admin` returns `200`. The difference
      between "connection refused" and "success" lets an attacker map which internal services exist - an
      oracle, not only a one-shot fetch.

  - id: tests
    kind: tests
    concepts: [sec-apitop-ten-risks, sec-apitop-probes, sec-apitop-inventory-coverage]
    title: Test cases with expected results and evidence
    body: |
      | # | Risk | Case | Expected (secure) | Evidence |
      | --- | --- | --- | --- | --- |
      | 1 | API1 | Control: A reads own payment. A reads B's payment id from B's listing | 200 for own; 404 or 403 for B's, no B data | both requests and responses |
      | 2 | API2 | A token with `alg: none` and no signature | 401 | the forged token (no secrets) and the response |
      | 3 | API2 / API4 | Eight wrong sign-ins for one account | a `429` before the eighth | the status sequence |
      | 4 | API3 | Read an object you may reach; look for keys the UI does not show | no `api_secret` or full IBAN | key names of the response |
      | 5 | API3 | PATCH a property you may not write, with a value that changes nothing | 400 or 403 | request and response |
      | 6 | API4 | Oversized body, huge page size, batched operations | rejected with a clear limit | request size and response |
      | 7 | API5 | Merchant calls each admin function and each other verb on admin paths | 401, 403 or 404, no state change | response and state afterwards |
      | 8 | API6 | Automate the sensitive flow (for example refunds) beyond a person's pace | a business limit holds | counts and business effect |
      | 9 | API7 | Give the webhook test a loopback or internal URL | refused (400) | request and response |
      | 10 | API8 | Trigger an unhandled error; read headers | generic error with a reference; security headers present | body and headers |
      | 11 | API9 | Probe a wordlist; compare with the documentation | no undocumented route answers | the routes found and the list compared |
      | 12 | API10 | Make the stubbed third party return oversized, malformed or redirecting answers | validated, bounded, redirects not followed | the stub's answer and the API's behaviour |

      **Reading the table.** Cases 1-5 and 7-10 can be run against the practice portal (7 only after the role
      change in the example; 6 and 8 need endpoints it does not have). Cases 6, 8 and 12 are shown for
      completeness: nothing in the portal exercises them, which is the point of case "coverage".

      **Negative-control discipline** still applies to every case: a control that succeeds, a request that
      should fail, then proof of state. And every probe case has a twin that runs on the **fixed** build and
      must report nothing.

  - id: mistakes
    kind: mistakes
    concepts: [sec-apitop-ten-risks, sec-apitop-probes, sec-apitop-inventory-coverage]
    title: Common mistakes and a debugging method
    body: |
      - **Treating the list as a standard.** "ISO-style" compliance claims about the API Top 10 mean nothing; it
        is awareness material that "does not replace other TOP 10's".
      - **Mapping by name instead of by cause.** `no-rate-limit` is not only "API4" - on a sign-in endpoint it is
        also API2. Read each risk's "Is the API Vulnerable?" list.
      - **Forcing every finding into a number.** SQL injection, XSS and CSRF have no 2023 API category. Say so
        and cite the web list instead.
      - **Confusing API1, API3 and API5.** Ask what the check is about: an object, a property or a function.
      - **A probe with no control.** A 401 from an expired token reads exactly like "denied".
      - **A destructive probe.** Writing `role: admin`, locking real accounts or hammering a shared system turns
        a test into an incident. Use a no-op value, a made-up account and agreed limits.
      - **Evidence with secrets in it.** Paste key names and status codes, not `sk_...` values.
      - **Reading 404 as "does not exist".** A handler can return 404 for "that object is missing" - the route
        is real. Compare the body of a known-missing route.
      - **Blocklisting SSRF.** The fixed portal compares literal hostnames and rejects `localhost`, `127.0.0.1`
        and private ranges. On this machine the resolver turns `http://0x7f000001/` into `127.0.0.1` while
        Python's `ipaddress` parser rejects the same text as an IP address - so the check and the resolver disagree
        about what the address is. The practice portal is only safe because it never fetches off loopback.
        OWASP's advice is allow lists of origins, schemes, ports and media types, no HTTP redirections, and a
        well-tested URL parser.
      - **Declaring victory with gaps.** "No findings" for six risks is silent about the other four.

      **Debugging a surprising probe result.** Re-run the request by hand with curl as the same account. Check
      the control first. Change one thing at a time: token, id, header. Compare the body of the surprising answer
      with the body of a request you know should fail. If the probe says "fixed" and curl disagrees, the probe
      is wrong - fix the probe, because a green wrong probe is worse than none.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [sec-apitop-ten-risks, sec-apitop-probes, sec-apitop-inventory-coverage]
    title: Trade-offs and alternatives
    body: |
      - **Breadth against depth.** One probe per risk shows presence of a flaw in one place. It does not show
        the absence of the class. Use the Top 10 to make sure every risk is *asked*, then go deep where the
        business impact is highest.
      - **Safe probes against proof.** A no-op write cannot find "the API accepts the property but silently
        ignores it", and an unauthenticated inventory scan cannot see routes behind a login. Each safety choice
        costs some sensitivity; write the limit into the report.
      - **Standard checklist against your own.** The Top 10 is shared vocabulary; ASVS is a requirement set;
        the WSTG is a method. A team's own charter list, mapped to the Top 10 ids, usually works best.
      - **Scanners against probes.** API scanners and the OpenAPI importers the WSTG mentions find breadth
        quickly (a ZAP add-on for OpenAPI import, named, not run here). They still need you to read the
        results, and they know nothing about your business flows (API6) or trust boundaries (API10).
      - **Documentation as source of truth.** Comparing against an OpenAPI file finds undocumented routes, but
        the document itself can be outdated ("may not be accurate, and also may not disclose the complete API",
        WSTG-APIT-01). Ask which source is authoritative.
      - **Code review against black-box testing.** Reading handlers finds missing checks (API1, API3, API5)
        faster than guessing requests; black-box probes confirm what is actually deployed (API8, API9).

  - id: summary
    kind: summary
    concepts: [sec-apitop-ten-risks, sec-apitop-probes, sec-apitop-inventory-coverage]
    title: Quick reference
    body: |
      - The **OWASP API Security Top 10:2023** is an awareness list: API1 BOLA, API2 Broken Authentication, API3
        BOPLA, API4 Unrestricted Resource Consumption, API5 BFLA, API6 Sensitive Business Flows, API7 SSRF, API8
        Security Misconfiguration, API9 Improper Inventory Management, API10 Unsafe Consumption of APIs.
      - Read each risk as a question: which **object** (1), **property** (3), **function** (5); is this really the
        **caller** (2); how **much and how often** (4, 6); whose **URL** (7) and whom to **trust** (10); what is
        **configured** (8) and what **exists** (9).
      - API3 merged Excessive Data Exposure and Mass Assignment. Injection, XSS, CSRF and logging have no 2023
        category - map them to the web list and say so.
      - One flaw can be two risks: a sign-in without lockout is API2 and API4.
      - A good probe: control first, harmless request, evidence without secrets, finds the flaw on the
        vulnerable build, silent on the fixed one.
      - Inventory: compare documentation with what answers. A 404 with a handler's message is still a route;
        401, 405 and 500 prove a route exists.
      - Report coverage, not only findings: on the portal, API5, API6, API9 (without the comparison) and API10
        have no evidence.
      - Test only with written permission, test accounts and agreed limits.

exercises:
  - id: which-risk-bola
    type: mcq
    concept: sec-apitop-ten-risks
    skill: recognition
    title: Which risk is it?
    prompt: |
      Signed in as Shop A, a tester changes `pay_1001` to `pay_2001` in `GET /api/payments/{id}` and receives
      Shop B's payment. Which risk of the OWASP API Security Top 10:2023 is this?
    options:
      - id: api1
        text: API1:2023 Broken Object Level Authorization
        feedback: Correct - the user may use this endpoint, but the server does not check the requested object.
      - id: api5
        text: API5:2023 Broken Function Level Authorization
        feedback: "The function (read a payment) is allowed for merchants; the violation is at the object level."
      - id: api2
        text: API2:2023 Broken Authentication
        feedback: Shop A was authenticated correctly as Shop A; the failure is what that user was allowed to reach.
      - id: api9
        text: API9:2023 Improper Inventory Management
        feedback: The endpoint is documented and expected; the problem is the missing ownership check.
    correct: [api1]
    hints:
      - Is the endpoint one that the caller may use at all?
    solution: |
      The caller may use the endpoint; the missing check is on the object. That is BOLA, API1:2023.

  - id: bopla-merge
    type: mcq
    concept: sec-apitop-ten-risks
    skill: recall
    title: What API3 combines
    prompt: Which two 2019 risks did API3:2023 Broken Object Property Level Authorization combine?
    options:
      - id: edata-mass
        text: Excessive Data Exposure and Mass Assignment
        feedback: Correct - both are a missing authorization check on one property, once on read and once on write.
      - id: injection-logging
        text: Injection and Insufficient Logging and Monitoring
        feedback: "Those two were dropped as categories from the 2023 list."
      - id: bola-bfla
        text: Broken Object Level and Function Level Authorization
        feedback: Those stayed separate as API1 and API5.
      - id: rate-assets
        text: Lack of Resources and Improper Assets Management
        feedback: Those became API4 and API9 respectively; neither is API3.
    correct: [edata-mass]
    hints:
      - What do a response that leaks a property and a request that sets one have in common?
    solution: |
      Excessive Data Exposure and Mass Assignment, "focusing on the root cause: the lack of or improper
      authorization validation at the object property level".

  - id: bfla-after-mass
    type: mcq
    concept: sec-apitop-ten-risks
    skill: analysis
    title: Chain of risks
    prompt: |
      A merchant sends `PATCH /api/profile {"role": "admin"}` and is accepted. Afterwards the same merchant
      reads another merchant's object with `GET /api/merchants/m_200`. How do you describe the weaknesses?
    options:
      - id: chain
        text: "API3 (a property the caller must not write) made the admin check pass, so the privilege-level effect is API5-class access"
        feedback: Correct - the root cause is the property-level failure; the consequence is access to functions and objects reserved for admins.
      - id: bola-only
        text: Pure API1 - the merchant read another merchant's object
        feedback: The object check was bypassed by changing the caller's role first, not by changing the id.
      - id: authn
        text: API2 - the admin token was forged
        feedback: No token was forged; the user's own account was changed.
      - id: fine
        text: No weakness - an admin may read any merchant
        feedback: The admin rule is fine; the flaw is that a merchant became admin.
    correct: [chain]
    hints:
      - Which request changed what the server thinks about the caller?
    solution: |
      Mass assignment (API3) changed the caller's role; the read then succeeded under the admin rule. Report the
      chain and fix the root cause - the property.

  - id: login-two-risks
    type: mcq
    concept: sec-apitop-ten-risks
    skill: application
    title: One flaw, two risks
    prompt: |
      `POST /api/login` never returns `429`, however many wrong passwords one account receives. How should a
      report map this?
    options:
      - id: both
        text: API4:2023 (no limit on how often the operation runs) and API2:2023 (brute force without lockout)
        feedback: Correct - the API4 page asks to limit how often a client can run an operation such as validating an OTP, and the API2 page lists brute force without lockout.
      - id: only4
        text: Only API4 - it is about rate limits
        feedback: API2's "Is the API Vulnerable?" list names brute force on the same account, so API2 has evidence too.
      - id: only2
        text: Only API2 - it is about sign-in
        feedback: The missing limit is also a resource-consumption issue, and the same fix (a limit) serves both.
      - id: none
        text: No API risk - it is a web flaw
        feedback: Both API2 and API4 name this directly.
    correct: [both]
    hints:
      - Check both risk pages' lists of ways an API is vulnerable.
    solution: |
      Both. List API4 as the best fit and API2 as the second risk so neither looks untested.

  - id: ssrf-fix
    type: mcq
    concept: sec-apitop-ten-risks
    skill: application
    title: Which SSRF fix holds?
    prompt: |
      The webhook test fetches any URL a merchant supplies. Which change is closest to OWASP's guidance for
      API7:2023?
    options:
      - id: allowlist
        text: Accept only URLs whose scheme, host and port are on an allow list, and do not follow HTTP redirects
        feedback: Correct - the page recommends allow lists of origins, schemes and ports, and disabling HTTP redirections.
      - id: blocklist
        text: Reject the strings `localhost` and `127.0.0.1`
        feedback: A deny list of spellings misses others - on this machine `0x7f000001` resolves to 127.0.0.1 while the IP parser rejects it.
      - id: hide
        text: Hide the webhook form from merchants who should not use it
        feedback: Hiding a page does not stop requests to the endpoint.
      - id: raw
        text: Return the fetched body to the user so they can see what happened
        feedback: The page says "Do not send raw responses to clients" - echoing the body is how the internal key leaked.
    correct: [allowlist]
    hints:
      - The page prefers listing what is allowed to listing what is forbidden.
    solution: |
      Allow lists of origins, schemes and ports, redirections disabled, a well-tested URL parser and no raw
      response returned.

  - id: safe-value-why
    type: mcq
    concept: sec-apitop-probes
    skill: application
    title: Why send the role the user already has?
    prompt: |
      A probe tests whether `PATCH /api/profile` accepts the property `role`. It sends `{"role": "merchant"}`
      for a `merchant` user. Why?
    options:
      - id: harmless
        text: A vulnerable server accepts it and nothing changes, so the probe is repeatable and does not damage test data
        feedback: Correct - the verdict comes from accepted-or-refused, not from a changed role.
      - id: faster
        text: It makes the request smaller and therefore faster
        feedback: Size is not the reason.
      - id: bypass
        text: It bypasses validation that would reject `admin`
        feedback: It does the opposite of bypassing - it avoids side effects.
      - id: legit
        text: It is the only value the server will accept
        feedback: The vulnerable server accepts any value; the fixed one refuses the whole property.
    correct: [harmless]
    hints:
      - What would happen to the account if the probe sent `admin` and the server accepted it?
    solution: |
      A no-op value tests acceptance without changing state. Its limit: it cannot detect a server that accepts
      but ignores the field.

  - id: control-first
    type: mcq
    concept: sec-apitop-probes
    skill: application
    title: What the control is for
    prompt: |
      A probe's checks all report "no finding" against a build you have not seen before. What should you check
      before believing it?
    options:
      - id: control
        text: That a control request - a call that must succeed with the same token and shape - really succeeded
        feedback: Correct - otherwise an expired token or a wrong base URL also produces "no finding".
      - id: count
        text: That the probe made at least a thousand requests
        feedback: Volume says nothing about whether the requests were meaningful.
      - id: speed
        text: That the probe finished in under a second
        feedback: A fast probe may have failed at the first request.
      - id: log
        text: That the server's log shows no errors
        feedback: The server may log nothing about a refused request.
    correct: [control]
    hints:
      - What else would make every check come back empty?
    solution: |
      A control that succeeds proves the token, URL and request shape work; only then does silence mean the
      flaw is absent.

  - id: quiet-when-fixed
    type: mcq
    concept: sec-apitop-probes
    skill: analysis
    title: Proving there is no false positive
    prompt: |
      Your probe reports an SSRF finding on the vulnerable portal. What else must you show before trusting the
      probe?
    options:
      - id: twin
        text: That it reports nothing on the same portal with `ssrf` fixed, and nothing for the other flaws' fixes
        feedback: Correct - a probe that fires everywhere finds nothing; the fixed twin shows it fires only for its own flaw.
      - id: twice
        text: That it reports the same finding twice in a row
        feedback: Repeatability does not show it can stay quiet.
      - id: scan
        text: That a public scanner agrees
        feedback: A scanner may be wrong too, and cannot be pointed at a build you cannot expose.
      - id: bigger
        text: That the evidence line is longer than 100 characters
        feedback: Length of evidence is no measure of correctness.
    correct: [twin]
    hints:
      - What is the opposite of "finds the flaw"?
    solution: |
      The same probe on the fixed build must report nothing; isolating one flaw at a time shows each check
      fires only for its own.

  - id: route-404
    type: mcq
    concept: sec-apitop-inventory-coverage
    skill: analysis
    title: Does the route exist?
    prompt: |
      Unauthenticated, `GET /files` answers `404 {"error": "file not found: public"}` and `GET /swagger.json`
      answers `404 {"error": "not found"}`. What can you conclude?
    options:
      - id: handler
        text: "`/files` is a real route whose handler returned 404; `/swagger.json` does not exist"
        feedback: Correct - only the router's own "not found" means no route; a different message means a handler ran.
      - id: neither
        text: Neither exists, because both are 404
        feedback: The first body comes from a handler that looked for a file name.
      - id: both
        text: Both exist, because both answer
        feedback: The second is the router's answer for an unknown path.
      - id: sw
        text: "`/swagger.json` exists but is protected"
        feedback: A protected route would answer 401 or 403, not the router's "not found".
    correct: [handler]
    hints:
      - Compare the two bodies, not only the status.
    solution: |
      Compare against the body of a path you know is missing. `/files` is a route; `/swagger.json` is not.

  - id: shadow-risk
    type: mcq
    concept: sec-apitop-inventory-coverage
    skill: application
    title: An undocumented internal page
    prompt: |
      The inventory probe finds `/internal/admin` answering `200` to a plain GET, and it is in no documentation.
      Which risk is the best fit for the finding itself?
    options:
      - id: api9
        text: API9:2023 Improper Inventory Management
        feedback: Correct - an endpoint exists that nobody documented, and it is reachable. API8 (what it exposes) and API7 (if the server can be told to fetch it) may also apply.
      - id: api10
        text: API10:2023 Unsafe Consumption of APIs
        feedback: Nothing here consumes a third-party API.
      - id: api6
        text: API6:2023 Unrestricted Access to Sensitive Business Flows
        feedback: There is no business flow being abused.
      - id: nocat
        text: No category - it is only a web flaw
        feedback: Undocumented, exposed endpoints are exactly API9's subject.
    correct: [api9]
    hints:
      - What does the API9 page say about debug endpoints and documentation?
    solution: |
      API9 - an exposed endpoint missing from the inventory. Add API7 if a request-forging path leads to it
      and API8 for what the page shows.

  - id: coverage-gap
    type: mcq
    concept: sec-apitop-inventory-coverage
    skill: analysis
    title: Four risks with no evidence
    prompt: |
      A suite built only from the portal's 17 flaws leaves API5, API6, API9 and API10 with no evidence. What is
      the right report?
    options:
      - id: gaps
        text: "State that these four were not tested and say what each needs: role test data, business-rule review, a documentation comparison, a stubbed third party"
        feedback: Correct - a coverage statement names its gaps and what would close them.
      - id: green
        text: Report ten of ten covered, because no test failed
        feedback: No evidence is not a pass.
      - id: seed
        text: Add flaws to the portal until every risk has one
        feedback: That tests the portal's design, not your target.
      - id: drop
        text: Drop the four from the report since they are not relevant
        feedback: Relevance is a decision for the owner, with reasons - not silence.
    correct: [gaps]
    hints:
      - What is the difference between "passed" and "not tested"?
    solution: |
      Name the gaps and the kind of testing each needs, so nobody reads silence as safety.

  - id: consumption-vs-flow
    type: mcq
    concept: sec-apitop-ten-risks
    skill: analysis
    title: API4 or API6?
    prompt: |
      A signup endpoint lets a script request an SMS code for any phone number, thousands of times a minute;
      each SMS costs money. Another endpoint lets a script buy every ticket of a popular event in seconds, each
      request small and cheap. Which pairing is right?
    options:
      - id: sms4-ticket6
        text: SMS endpoint is API4 (cost and resource consumption); ticket buying is API6 (a business flow abused at scale)
        feedback: Correct - API4 is about the resources a request consumes, API6 about harm to the business from automating a legitimate flow.
      - id: both4
        text: Both are API4
        feedback: The ticket requests consume few resources; the harm is the business effect (scalping).
      - id: both6
        text: Both are API6
        feedback: The SMS case's main harm is operational cost from resource use, which API4 describes.
      - id: swap
        text: SMS is API6; ticket buying is API4
        feedback: This is reversed.
    correct: [sms4-ticket6]
    hints:
      - Where is the damage - to resources and spend, or to what the business sells?
    solution: |
      Resources and cost -> API4; abuse of a legitimate flow's business meaning -> API6.

  - id: unsafe-consumption
    type: mcq
    concept: sec-apitop-ten-risks
    skill: recognition
    title: Spot API10
    prompt: Which behaviour is a symptom of API10:2023 Unsafe Consumption of APIs?
    options:
      - id: trust-partner
        text: The API stores a partner's address field in the database without validation and follows its redirects blindly
        feedback: Correct - the page lists lack of validation of data from other APIs, blindly following redirections and missing timeouts.
      - id: no-limit
        text: The API accepts a million requests per minute from one client
        feedback: That is API4.
      - id: debug
        text: The API serves an old version nobody documented
        feedback: That is API9.
      - id: weak-token
        text: The API accepts unsigned tokens
        feedback: That is API2.
    correct: [trust-partner]
    hints:
      - Whose data is the API trusting?
    solution: |
      Trusting a third party's data more than user input - no validation, blind redirects, no timeouts.

  - id: audit-order
    type: order
    concept: sec-apitop-probes
    skill: application
    title: Run an API Top 10 test
    prompt: Put the steps of testing an API against the Top 10 in order.
    items:
      - id: permission
        text: Get written permission, scope and test accounts, and agree which tests may cause load
      - id: inventory
        text: Collect the documentation and inventory of endpoints
      - id: charters
        text: Write one charter per risk and mark the ones that need a different setup
      - id: probes
        text: Build probes with a control, a harmless request, evidence without secrets and a fixed-build twin
      - id: run
        text: Run them and reproduce each finding by hand
      - id: compare
        text: Compare the documentation with what answers
      - id: gaps
        text: List the risks with no evidence, and map every finding to a risk id and year
    hints:
      - Permission before any request; findings are reported only after the gaps are known.
    solution: |
      Permission, inventory, charters, probes, runs with manual reproduction, documentation comparison, then
      the gap list and risk mapping in the report.

  - id: ssrf-probe-debug
    type: debug
    concept: sec-apitop-probes
    skill: analysis
    title: The probe that cries wolf
    prompt: |
      This SSRF probe reports a finding on the **fixed** portal when the tester's token has expired. Pick the
      line that causes the false positive.
    language: python
    code: |
      def check_ssrf(base_url, token):
          resp = requests.post(base_url + "/api/webhooks/test", json={"url": base_url + "/health"}, headers=auth(token))
          if resp.status_code != 400:
              return Finding("API7:2023", "ssrf", "webhook fetched a URL")
          return None
    correctLines: [3]
    hints:
      - Which status codes other than 400 can the endpoint return when the request is refused?
      - What would a correct test require for a finding?
    lineNotes:
      - line: 2
        note: The request asks the server to fetch its own health page - harmless and local.
      - line: 3
        note: "`!= 400` counts a 401 (expired token), a 405 or a 500 as a finding; require `status_code == 200` and `delivered` true."
    solution: |
      Line 3 treats every status except 400 as proof of a fetch. Require a 200 and `delivered` equal to true,
      and run a control first.

  - id: compliance-short
    type: short
    concept: sec-apitop-ten-risks
    skill: analysis
    title: "\"We tested the OWASP API Top 10\""
    prompt: |
      A project manager asks you to put "tested against the OWASP API Security Top 10" on the release sign-off.
      What would you answer, and what would you write instead?
    modelAnswer: |
      I would not use that sentence on its own. The list is awareness material - its release notes say it "does
      not replace other TOP 10's" - and it has no pass/fail criteria, so the sentence says only that ten kinds of
      question were asked. It also omits classes such as injection, XSS and CSRF, which the web list and the
      WSTG cover. I would write a specific coverage statement instead: which risks were tested, on which
      endpoints, with which roles, how deeply, and which risks were not tested and why (for example API5, API6
      and API10 need role data, business review or a stubbed third party), with the findings mapped to risk
      ids and years. If a requirement set is needed, I would point to ASVS requirements rather than the Top 10.
    rubric:
      - Says the list is an awareness document without pass/fail criteria.
      - Notes it does not cover everything, for example injection, XSS and CSRF.
      - Proposes a specific coverage statement naming tested and untested risks.
      - Mentions mapping findings to risk ids with the year, or ASVS for a requirement set.
    hints:
      - What can a sign-off line like that be misread as?
    solution: |
      Replace the slogan with a coverage statement: tested risks and depth, untested risks and reasons, findings
      with ids and year.

  - id: payouts-testdesign
    type: testdesign
    concept: sec-apitop-inventory-coverage
    skill: application
    title: Design tests for the risks the portal does not show
    prompt: |
      SandPay adds `POST /api/payouts` (a merchant requests a payout), `POST /api/admin/payouts/{id}/approve`
      (admin only) and a callback `POST /api/provider/payout-status` that a third-party bank calls. Design tests
      for API5, API6 and API10, with preconditions, steps, expected results and evidence.
    modelAnswer: |
      Preconditions: two merchant accounts and one admin, each merchant with a pending payout, a stub of the
      bank's callback, and a reset of the data afterwards. Agreed limits for the automated flow test.

      1. **API5 - function level.** Control: the admin approves a payout, expecting 200. As a merchant, call
         the approve endpoint on their own and on the other merchant's payout, and with other verbs (`PUT`,
         `DELETE`, `PATCH`) on the same path. Expected 401, 403 or 404 and the payout still pending. Evidence:
         responses and the payout state afterwards.
      2. **API5 - discovery.** Try admin-looking paths for other functions (`/api/admin/...`) and do not assume
         the prefix marks the admin API. Expected: denied for merchants.
      3. **API6 - business flow.** Automate payout requests for one merchant at a rate and count the business
         allows (daily total, number per hour). Expected: a business limit stops the flow and the response
         explains it. Evidence: counts accepted against the limit and the resulting balance.
      4. **API10 - unsafe consumption.** Through the stub, send callbacks with oversized fields, wrong types,
         an unknown payout id, a status that skips a state, and a response that redirects to another host.
         Expected: validated and rejected or bounded, timeouts respected, redirects not followed, no stack
         traces. Evidence: the stub's payload and the API's answers and logs.
      5. **Coverage.** Add every case to the suite with its risk id and year.
    rubric:
      - Covers function level access with roles and several HTTP verbs, and checks state afterwards.
      - Designs a business-flow test with limits agreed beforehand and a business-level expected result.
      - Designs third-party-callback tests with a stub, including validation, timeouts and redirects.
      - States preconditions, evidence and the risk ids.
    hints:
      - For each risk ask who or what is trusted, and how you will prove the limit holds.
    solution: |
      API5 by role and verb with state checks; API6 by an automated flow against agreed business limits; API10
      through a stubbed bank with bad, oversized and redirecting answers; every case tagged with its risk id.

  - id: interview-api-top10
    type: interview
    concept: sec-apitop-ten-risks
    skill: analysis
    title: "Interview: how do you use the OWASP API Security Top 10?"
    prompt: |
      "How would you use the OWASP API Security Top 10 to test a new payments API, and what are its limits?"
    modelAnswer: |
      I use it as a checklist of questions, not a standard. For a new API I write one test charter per risk. For
      API1, BOLA, I run the two-account method on every endpoint that takes an object id. For API3 I check
      responses for properties the client should not receive and try writing properties it should not set, with
      no-op values. For API5 I call admin functions as an ordinary role and try other verbs. For API2 I test
      unsigned tokens, expiry and lockout. For API4 and API6 I test limits - sizes, counts, rates and business
      limits - with agreed volumes. For API7 I test any feature that fetches a URL, with a local target. For API8
      I trigger errors and read headers and CORS. For API9 I compare the documentation with what answers,
      including old versions. For API10 I stub the third party and send bad answers. Each charter becomes a
      probe with a control and evidence, with a twin on a fixed build to show it has no false positives. I report
      coverage, including the risks I could not test, and I map findings to ids with the year. The limits: it is
      awareness material, not a pass/fail standard; it has no injection, XSS or CSRF category in 2023, so I use
      the web list and the WSTG for those; and one probe per risk shows presence of a flaw in one place, not that
      the class is absent.
    rubric:
      - Treats the list as ten questions or charters, not as a standard.
      - Names at least four risks with a concrete test for each.
      - Describes probe discipline - control, harmless requests, evidence, fixed-build twin.
      - Reports coverage gaps and maps findings to ids with the year.
      - States limits - awareness list, missing web classes, presence not absence.
    followUps:
      - How would you test API6 when there is no defect to find?
      - A developer says API3 is covered because the UI hides the field - what do you reply?
      - Which risks can you test without any test accounts?
    hints:
      - Structure it - how you use it, a test for each risk, discipline, reporting, limits.
    solution: |
      Charter per risk, a concrete test for each, disciplined probes, a coverage report with ids and year, and
      the limits of an awareness list.

  - id: map-code
    type: coding
    concept: sec-apitop-ten-risks
    skill: analysis
    title: Map findings to risks and find the blind spots
    prompt: |
      In `practice/security/exercises/api/apitop_map.py`, fill in `FLAW_RISKS` for the portal's 17 flaw ids and
      implement `risks_for_flaw`, `group_by_risk` and `untested_risks`. The tests check each mapping (including
      the flaw that belongs to two risks and the eight with no 2023 category), the grouping order, and that a
      full set of flaws leaves API5, API6, API9 and API10 untested.
    project: security
    files: [exercises/api/apitop_map.py]
    test: tests/api/test_apitop_map.py
    command: .venv/bin/python -m pytest tests/api/test_apitop_map.py
    modelAnswer: |
      ```python
      FLAW_RISKS = {
          "idor": ("API1:2023",), "mass-assignment": ("API3:2023",), "data-exposure": ("API3:2023",),
          "jwt-none": ("API2:2023",), "weak-hash": ("API2:2023",),
          "no-rate-limit": ("API4:2023", "API2:2023"), "ssrf": ("API7:2023",),
          "verbose-errors": ("API8:2023",), "missing-headers": ("API8:2023",),
          "sqli": (), "xss-reflected": (), "xss-stored": (), "csrf": (), "open-redirect": (),
          "path-traversal": (), "weak-session": (), "secret-logging": (),
      }

      def risks_for_flaw(flaw):
          if flaw not in FLAW_RISKS:
              raise ValueError(f"unknown flaw id: {flaw!r}")
          return list(FLAW_RISKS[flaw])

      def group_by_risk(flaws):
          grouped = {}
          for flaw in flaws:
              for risk in risks_for_flaw(flaw):
                  grouped.setdefault(risk, []).append(flaw)
          return {risk: grouped[risk] for risk in sorted(grouped, key=_number)}

      def untested_risks(flaws):
          covered = set(group_by_risk(flaws))
          return [risk for risk in sorted(RISKS, key=_number) if risk not in covered]
      ```
    rubric:
      - Every test in tests/api/test_apitop_map.py passes.
      - A flaw appears under every risk it belongs to, and no-rate-limit lists API4 before API2.
      - Flaws without a 2023 category map to an empty list, and an unknown flaw raises ValueError.
      - Risks are ordered by number, not alphabetically (API10 after API9).
    hints:
      - Use the "Is the API Vulnerable?" lists on the risk pages, not the flaw's name.
      - Sorting `API10:2023` as text puts it before `API2:2023` - sort by the number.
      - Return a copy so callers cannot change your table.
    solution: |
      A table of flaw to risks, a lookup that raises on unknown ids, grouping by risk sorted by number, and the
      difference between all ten risks and the grouped ones.

  - id: probes-coding
    type: coding
    concept: sec-apitop-probes
    skill: application
    title: Write four probes and the orchestrator
    prompt: |
      In `practice/security/exercises/api/apitop_probe.py`, four checks are written for you. Implement
      `check_unsigned_jwt`, `check_login_rate_limit`, `check_property_write`, `check_ssrf` and `probe_api`.
      The tests need all eight findings on the vulnerable portal, none once the covered flaws are fixed, exactly
      one finding when only one flaw is left unfixed, no secret values in evidence, no change to Alice's
      account, and a `RuntimeError` when the control fails.
    project: security
    files: [exercises/api/apitop_probe.py]
    test: tests/api/test_apitop_probe.py
    command: .venv/bin/python -m pytest tests/api/test_apitop_probe.py
    modelAnswer: |
      ```python
      def check_ssrf(base_url, token):
          resp = requests.post(base_url + "/api/webhooks/test", json={"url": base_url + "/health"},
                               headers=_auth(token), timeout=5)
          if resp.status_code == 200 and resp.json().get("delivered") is True:
              return Finding("API7:2023", "ssrf", "the server fetched a loopback URL and returned its body: 200")
          return None

      def check_unsigned_jwt(base_url, email):
          resp = _get(base_url, "/api/me", make_jwt({"sub": email}, alg="none"))
          if resp.status_code == 200 and resp.json().get("email") == email:
              return Finding("API2:2023", "jwt-none", "GET /api/me accepted an unsigned token: 200")
          return None
      ```

      `check_login_rate_limit` sends `LOGIN_LIMIT + 3` wrong sign-ins for one account that does not exist and
      reports a finding only if no `429` appeared. `check_property_write` reads the caller's current role,
      patches that same value and reports a finding only on a 200. `probe_api` runs the control (`GET /api/me`
      must be 200), then all eight checks, and returns the findings sorted by risk number.
    rubric:
      - Every test in tests/api/test_apitop_probe.py passes.
      - The control runs first and raises RuntimeError when it fails.
      - Each check requires positive evidence of its own flaw, not just a status other than the fixed one.
      - The write probe sends the role the user already has, and the rate-limit probe uses a non-existent account.
      - Findings are sorted by risk number and evidence never contains a secret value.
    hints:
      - Which request would a fixed portal refuse, and with what status?
      - What value can you PATCH that changes nothing if the server accepts it?
      - What does the fixed portal answer for the webhook URL - and for a public URL?
    solution: |
      Four checks that each need positive evidence, a control that raises, a no-op write, a made-up account for
      the limit probe, and a sort by risk number.

  - id: inventory-code
    type: coding
    concept: sec-apitop-inventory-coverage
    skill: application
    title: Find the undocumented endpoints
    prompt: |
      In `practice/security/exercises/api/apitop_inventory.py`, implement `route_exists`, `probe_paths`,
      `matches_template` and `undocumented`. The tests probe a wordlist against the portal, expect `/boom` and
      `/internal/admin` to be the only undocumented routes (also on a fully fixed portal), and check that
      documenting a route removes it from the result.
    project: security
    files: [exercises/api/apitop_inventory.py]
    test: tests/api/test_apitop_inventory.py
    command: .venv/bin/python -m pytest tests/api/test_apitop_inventory.py
    modelAnswer: |
      ```python
      def route_exists(status, body):
          return not (status == 404 and body == {"error": "not found"})

      def probe_paths(base_url, candidates):
          found = {}
          for path in candidates:
              resp = requests.get(base_url + path, allow_redirects=False, timeout=5)
              try:
                  body = resp.json()
              except ValueError:
                  body = None
              if route_exists(resp.status_code, body):
                  found[path] = resp.status_code
          return found

      def matches_template(path, template):
          p, t = path.strip("/").split("/"), template.strip("/").split("/")
          return len(p) == len(t) and all(b.startswith("{") and b.endswith("}") or a == b for a, b in zip(p, t))

      def undocumented(observed, documented):
          return sorted(p for p in observed if not any(matches_template(p, t) for t in documented))
      ```
    rubric:
      - Every test in tests/api/test_apitop_inventory.py passes.
      - A 404 only means "no route" when the body is the router's own not-found answer.
      - Probing is unauthenticated and does not follow redirects, and keeps the candidates' order.
      - A template matches exactly one path segment per placeholder.
    hints:
      - Why does `/files` answer 404 even though the route exists?
      - Which two things must a path and a template share to match?
      - Which status makes a redirect an answer rather than a path to follow?
    solution: |
      A route exists unless the router itself says "not found"; probe without signing in and without following
      redirects; match templates segment by segment; report what exists and is not documented.

placement:
  - id: place-map
    type: mcq
    concept: sec-apitop-ten-risks
    skill: analysis
    title: Map the findings
    prompt: |
      Three findings on one API: (1) a merchant reads another merchant's payment by id; (2) the merchant object
      includes an `api_secret`; (3) a merchant calls an admin-only endpoint and it works. Which mapping is right?
    options:
      - id: right
        text: (1) API1 object level, (2) API3 property level, (3) API5 function level
        feedback: Correct - the object, the property and the function are three different things the server must check.
      - id: swapped
        text: (1) API5, (2) API1, (3) API3
        feedback: These are shuffled - the id-in-the-URL finding is object level (API1).
      - id: all1
        text: All three are API1
        feedback: Only the first is about an object id.
      - id: all2
        text: All three are API2
        feedback: Authentication is not the issue in any of them.
    correct: [right]
    solution: |
      Object (API1), property (API3), function (API5).

  - id: place-probe
    type: order
    concept: sec-apitop-probes
    skill: application
    title: Order a safe probe
    prompt: Put the steps of a safe probe for "does PATCH accept the role property" in order.
    items:
      - id: control
        text: Call GET /api/me as the test user - the control must succeed
      - id: read
        text: Read the user's current role
      - id: send
        text: PATCH the same role value back
      - id: judge
        text: Report a finding only if the PATCH was accepted (200)
      - id: twin
        text: Run the probe on the fixed build and check it reports nothing
    solution: |
      Control, read the current value, send it back, judge on acceptance, then confirm the fixed build is quiet.

  - id: place-coverage
    type: mcq
    concept: sec-apitop-inventory-coverage
    skill: analysis
    title: Read a coverage report
    prompt: |
      A test report lists passes for API1, API2, API3, API4, API7 and API8 and says nothing about the rest.
      What do you do first?
    options:
      - id: ask
        text: Ask what happened to API5, API6, API9 and API10 - silence is not a pass
        feedback: Correct - a report must name what was not tested and why.
      - id: accept
        text: Accept it - six of ten is a majority
        feedback: Coverage is not a vote; each risk is its own question.
      - id: assume
        text: Assume the other four are fine because no defects were reported
        feedback: No defects reported is not the same as tested.
      - id: rerun
        text: Re-run the six risks until the report is longer
        feedback: More runs of the same checks do not cover new risks.
    correct: [ask]
    solution: |
      Ask about the four missing risks; the report must show tested, untested and why.

recall:
  - id: recall-ten
    concept: sec-apitop-ten-risks
    prompt: List the ten risks of the OWASP API Security Top 10:2023 in order.
    answer: API1 Broken Object Level Authorization, API2 Broken Authentication, API3 Broken Object Property Level Authorization, API4 Unrestricted Resource Consumption, API5 Broken Function Level Authorization, API6 Unrestricted Access to Sensitive Business Flows, API7 Server Side Request Forgery, API8 Security Misconfiguration, API9 Improper Inventory Management, API10 Unsafe Consumption of APIs.
  - id: recall-object-property-function
    concept: sec-apitop-ten-risks
    prompt: How do API1, API3 and API5 differ?
    answer: API1 - the check on the requested object (an id). API3 - the check on a property of an object you may reach, for reading or writing. API5 - the check on a function you should not reach at all, such as an admin endpoint.
  - id: recall-api3-merge
    concept: sec-apitop-ten-risks
    prompt: What did API3:2023 combine, and what is the common root cause?
    answer: Excessive Data Exposure and Mass Assignment (both 2019). The root cause is a missing or wrong authorization check at the object property level.
  - id: recall-missing-categories
    concept: sec-apitop-ten-risks
    prompt: Which classes of flaw have no category in the 2023 API list, and what do you do with them?
    answer: Injection, XSS, CSRF and logging. Report them against the web application list and the WSTG, and say "no API category" rather than forcing a number.
  - id: recall-probe
    concept: sec-apitop-probes
    prompt: What makes a probe trustworthy?
    answer: A control that must succeed first, a harmless request (read, no-op value, local fetch), evidence without secret values, a finding on the vulnerable build and silence on the fixed one - isolated flaw by flaw.
  - id: recall-route-exists
    concept: sec-apitop-inventory-coverage
    prompt: How do you decide from an unauthenticated request whether an endpoint exists?
    answer: Compare with the router's own "no such route" answer. 401, 403, 405 and 500 all mean a handler answered, and even a 404 with a different message means the route exists.
  - id: recall-coverage
    concept: sec-apitop-inventory-coverage
    prompt: What belongs in a coverage statement besides the findings?
    answer: Which risks were tested, on which endpoints and roles, how deeply - and which were not tested and why, so silence is never read as a pass.

