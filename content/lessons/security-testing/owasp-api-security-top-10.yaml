id: owasp-api-security-top-10
title: The OWASP API Security Top 10
subject: security-testing
module: api-security
level: intermediate
status: published
estimatedMinutes: 150
summary: Learn the ten API-specific risks of the OWASP API Security Top 10:2023 - from broken object level authorization to unsafe consumption of APIs - as ten testable questions, map the flaws of a deliberately vulnerable SandPay portal to them, write one probe per risk that finds its flaw and stays quiet once it is fixed, and compare the documented API with what really answers to find the risks no test of yours has covered yet.
tags:
