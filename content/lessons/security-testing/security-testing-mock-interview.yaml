id: security-testing-mock-interview
title: Security testing mock interview
subject: security-testing
module: security-specialised
level: advanced
status: published
estimatedMinutes: 150
summary: Rehearse the questions a security testing interview asks - explain, scenario ("how would you test this feature?"), triage ("the scanner found 120 things") and scoping ("how long would it take?") - with a fixed method for each and permission and scope before everything. Turn a feature's behaviour into the test areas it calls for and find what a candidate's plan misses, triage a scanner report in the order that keeps you ethical (scope, then a working control, then verification, then the report), and size an engagement with stated assumptions that include the report, the re-test and contingency. Every output shown was printed by the code shown; the rates are made-up practice assumptions.
tags:
  [
    mock interview,
    security tester interview,
    penetration testing interview,
    rules of engagement,
    scope,
    authorisation,
    ethics,
    explain question,
    scenario question,
    test planning,
    WSTG,
    test categories,
    scanner triage,
    false positive,
    positive control,
    unverified finding,
    risk rating,
    business impact,
    estimation,
    effort estimate,
    person days,
    retest,
    reporting,
    incident during testing,
    safe methods,
    security testing,
  ]

environment: |
  - **Runtime:** Python 3.12.3 in `practice/security/.venv` with pytest 9.2.0 and requests 2.34.2. Every output in
    this lesson was printed by `practice/security/support/smi_demo.py`, which runs the reference solutions of this
    lesson's exercises (`practice/security/solutions/specialised/smi_plan.py`, `smi_triage.py` and
    `smi_estimate.py`), on Linux on 21 November 2026. Nothing is random. The demo imports the practice portal only
    to count its routes (`len(make_app().routes)`); it sends no request anywhere.
  - **Ethics and scope:** test only systems you own or have written permission to test, and only inside the agreed
    scope. The practice exercises here are pure code and never touch a network. This is not legal advice: an
    engagement's authorisation is agreed with the system owner and, in a company, usually with its legal team.
  - **Synthetic data:** SandPay is a fictional payments company. The scanner report (`F-01` to `F-12`), its hosts
    (under the reserved `.example` domain), the features and the estimate rates are invented for this lesson. **The
    rates are assumptions, not benchmarks** - no firm, tool or survey says a test takes 1.5 hours per endpoint.
  - **Sources, as documented on 21 November 2026:**
    - NIST [SP 800-115](https://csrc.nist.gov/pubs/sp/800/115/final), _Technical Guide to Information Security
      Testing and Assessment_ (September 2008; read from the [PDF](https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-115.pdf)):
      the definitions of Rules of Engagement and penetration testing, the vulnerability scanning row of the
      technique table, "Legal Considerations" (section 6.6), the assessment plan and ROE passage (section 6),
      the analysis passage on false positives (section 8) and the Rules of Engagement template (Appendix B). It is
      old, but it is still the NIST publication on the topic.
    - OWASP [Risk Rating Methodology](https://owasp.org/www-community/OWASP_Risk_Rating_Methodology): the formula,
      the worst-case advice, the level boundaries, the worked example and the severity table. The page names
      other, more established methodologies.
    - OWASP [Web Security Testing Guide](https://owasp.org/www-project-web-security-testing-guide/) v4.2
      ([tag v4.2](https://github.com/OWASP/wstg/tree/v4.2), 3 December 2020): the twelve category headings of
      `checklist/Testing_Checklist.md` and [WSTG-ATHZ-04 Testing for Insecure Direct Object
      References](https://github.com/OWASP/wstg/blob/v4.2/document/4-Web_Application_Security_Testing/05-Authorization_Testing/04-Testing_for_Insecure_Direct_Object_References.md).
      The checklist table calls two headings `WSTG-BUSLOGIC` and `WSTG-CLIENT` while their tests are `WSTG-BUSL-..`
      and `WSTG-CLNT-..`; the exercise handles that. The guide is developing release 5.0, so ids can change.
    - IETF [RFC 9110](https://www.rfc-editor.org/rfc/rfc9110) _HTTP Semantics_, section 9.2.1 Safe Methods.
  - **This lesson's own judgement, not a standard's:** the table that says which feature behaviour calls for which
    WSTG category (`RULES`), the six labels of the triage and their order, and the effort model. They are teaching
    models; say so in an interview and say what you would calibrate them with.
  - **Interview format:** the round types are the ones LearnerApp's interview practice uses. Companies differ;
    nothing here is a real or leaked question from any company.
  - **Not repeated here:** a scope checker and the OWASP risk calculation as code - [Security testing
    fundamentals](#/lesson/security-testing-fundamentals); a test plan by ASVS level - [OWASP WSTG and
    ASVS](#/lesson/owasp-wstg-and-asvs); CVSS scoring and report writing - [Reporting vulnerabilities and scoring
    with CVSS](#/lesson/vulnerability-reporting-and-cvss); turning a finding into a regression test - [Automating
    security regression tests](#/lesson/security-regression-automation).

prerequisites:
  - security-testing-fundamentals
  - owasp-wstg-and-asvs
  - testing-access-control-idor
  - vulnerability-reporting-and-cvss
  - security-regression-automation

concepts:
  - id: sec-smi-answer-method
    name: Answering explain, scenario and triage questions - permission first
    summary: 'Every security answer starts with permission and scope: written authorisation, a written scope, and what to do when something goes wrong - the Rules of Engagement NIST describes as "established before the start of a security test". Explain questions - definition, mechanism, how it fails or what it costs, how to test it safely. Scenario questions ("how would you test this?") - permission and scope, what the feature does, the test areas that follow, safe probes with a control, evidence, rating by business impact, report and re-test. Triage questions - scope, reproduce with a control, rate, report. The method shows judgement even when you do not know a detail.'
  - id: sec-smi-feature-plan
    name: Planning and sizing a test from what the feature does
    summary: 'A plan is not the whole checklist; it is the categories that the feature''s behaviour calls for - a login calls for authentication and session tests, a parameter that names an object for authorisation tests, a URL the server fetches for input validation, a money-moving flow for business logic - plus a baseline of information gathering, configuration and error handling for everything. Compare a candidate''s plan with that set to find what is missing and what is padding, and remember what the checklist does not cover. To size the work, count endpoints, add an uplift for every extra role, fixed hours for uploads and integrations and setup, then the report, the re-test and contingency, with every rate stated as an assumption.'
  - id: sec-smi-finding-triage
    name: Triaging findings from evidence, in an order that keeps you ethical
    summary: 'A scanner report is a list of claims. Place each in the first label that applies - out of scope (stop, tell the owner), duplicate, unverified (nobody tried), invalid test (the positive control failed, so neither a hit nor a miss counts), confirmed, false positive - then work in that order: scope problems first, broken tests next, unverified findings, then report the confirmed ones by severity. A negative result is only as good as the test that produced it, and severity comes from likelihood and business impact, not from the scanner''s label.'

objectives:
  - Open every answer with permission and scope, and say what you would do on finding an out-of-scope host, real customer data or another intruder.
  - Answer an explain question in four parts - definition, mechanism, failure modes or cost, and a safe test.
  - Turn a feature's behaviour into the WSTG test categories it calls for, and find what a plan misses or pads.
  - Triage a scanner report into scope, test, verification and report buckets, and order the work correctly.
  - Explain why a reproduction without a working control is not evidence, and what "false positive" really claims.
  - Size an engagement from an inventory with stated assumptions, including the report, the re-test and contingency, and turn hours into person-days and calendar days.

sections:
  - id: intuition
    kind: intuition
    concepts: [sec-smi-answer-method, sec-smi-feature-plan, sec-smi-finding-triage]
    title: The idea in plain language
    body: |
      A security testing interview is not a quiz on tool names. The interviewer wants to see what you do **before**
      you touch anything, how you decide what to test, and whether you believe your own results too easily.

      Think of a locksmith called to a house. A good one first asks who owns it and whether the person calling may
      let them in; then asks what the door and windows are like; tries the obvious weak points; and when the alarm
      company says "your tool reported the back window is open", checks the window before telling the owner. A
      weak one starts picking locks because the caller sounded sure.

      This lesson gives you four short checklists - for **explain**, **scenario**, **triage** and **scoping**
      questions - with permission and scope in front of all of them, and three small tools you build yourself: a
      planner that turns what a feature does into the test areas it calls for, a triage that places every scanner
      finding in the first label that applies, and an estimator that sizes an engagement. Then you rehearse with
      SandPay's merchant portal, the fictional system used throughout this track.

  - id: what
    kind: what
    concepts: [sec-smi-answer-method, sec-smi-feature-plan, sec-smi-finding-triage]
    title: Terms you need
    body: |
      | Term | Meaning |
      | --- | --- |
      | **Explain question** | "How does X work?" - XSS, CSRF, JWT, SSRF, IDOR |
      | **Scenario question** | "How would you test this feature?" - the interviewer describes a feature or a system |
      | **Triage question** | "The scanner reported 120 findings" or "this is disputed" - what do you do with evidence? |
      | **Scoping question** | "How long would a test take, and what do you need from us?" |
      | **Rules of Engagement (ROE)** | NIST SP 800-115 - "Detailed guidelines and constraints regarding the execution of information security testing. The ROE is established before the start of a security test, and gives the test team authority to conduct defined activities without the need for additional permissions." |
      | **Scope** | the hosts, techniques, accounts, time window and contacts the written permission covers |
      | **Positive control** | a request that has to succeed - if it fails, a "denied" or "not found" means nothing |
      | **False positive** | NIST - "An alert that incorrectly indicates that a vulnerability is present." |
      | **Unverified** | a finding nobody has tried to reproduce yet - a claim, not a result |
      | **Likelihood and impact** | the two halves of OWASP's "Risk = Likelihood * Impact", each rated 0 to 9 and split into LOW, MEDIUM and HIGH |
      | **Person-day** | one person's productive working day; calendar days depend on how many testers work in parallel |

  - id: why
    kind: why
    concepts: [sec-smi-answer-method, sec-smi-finding-triage]
    title: Why interviewers care about method and ethics
    body: |
      - **Permission is the job, not a formality.** NIST says the ROE "gives the test team authority to conduct
        defined activities without the need for additional permissions" - and, by implication, that anything
        outside them needs permission. On the legal side it says that, although involving legal advisors is "at the
        discretion of the organization", "it is recommended that they always be involved for intrusive tests such
        as penetration testing". An interviewer who hears
        "I would run a full scan first" learns that you do not know where your authority ends.
      - **Scanners claim, testers verify.** NIST: "vulnerability scanners can have a high false positive error rate
        (i.e., reporting vulnerabilities when none exist)" and "Automated tools can produce a significant number of
        findings, but these findings often need to be validated to isolate false positives." A report of
        unchecked scanner rows costs the client time and costs you credibility.
      - **Severity is context.** OWASP's own worked example has a medium likelihood and a high technical impact
        but a low business impact, and concludes that "the overall severity is best described as low as well. This
        is why understanding the business context of the vulnerabilities you are evaluating is so critical to
        making good risk decisions."
      - **Estimates show how you think.** "40 endpoints times 1.5 hours" ignores the access control you repeat for
        every role, the report, the re-test and the day the test environment is down. Naming those is what a
        senior tester sounds like.

  - id: method
    kind: steps
    concepts: [sec-smi-answer-method, sec-smi-feature-plan, sec-smi-finding-triage]
    title: Four checklists - explain, scenario, triage, scoping
    body: |
      **Before any of them - permission and scope.** In one sentence: "I would first confirm that I have written
      authorisation, which hosts and techniques are in scope, the testing window, and who to call if something
      breaks." Then answer.

      **Explain (2-4 minutes)**

      1. **Definition** in one sentence, in plain words.
      2. **Mechanism** - how it works, with one concrete request or value.
      3. **Failure modes or cost** - what an attacker gets, what the fix does not cover.
      4. **How you would test it safely** - a harmless probe, a control, the evidence you keep.

      **Scenario - "how would you test this feature?" (5-10 minutes)**

      1. **Permission and scope**, as above, plus the environment (production or not) and the accounts you get.
      2. **What does the feature do?** Login, session, roles, object ids in URLs, user input shown back, URLs the
         server fetches, redirects, uploads, money moved, an API, sensitive data.
      3. **Which areas does that call for?** Every feature gets information gathering, configuration and error
         handling; each behaviour adds its own (the planner below).
      4. **Safe probes with a control** for the riskiest areas first; say what you will not do (no denial of
         service, no real customers' accounts).
      5. **Evidence, rating and report** - requests and responses, severity from likelihood and business impact,
         steps anyone can repeat, a fix for each, and a re-test.

      **Triage - "the scanner reported N findings" (5-10 minutes)**

      1. **Scope** - any finding on a host outside the written scope is handed back to the owner without testing.
      2. **Deduplicate and group** - the same flaw is often reported on many URLs.
      3. **Reproduce with a control** - your own request; a failed control makes the result void.
      4. **Rate** by likelihood and business impact, not by the scanner's label.
      5. **Report** confirmed, false positive and unverified separately, honestly.

      **Scoping (3-5 minutes)**

      1. **Inventory** - endpoints, roles, uploads, integrations.
      2. **Model** - hours per endpoint with an uplift per extra role, fixed hours for the rest, setup.
      3. **Overheads** - report, re-test, contingency.
      4. **State every rate as an assumption**, give a range, and list what you need from the client.

  - id: scope-internals
    kind: internals
    concepts: [sec-smi-answer-method]
    title: What the rules of engagement and the scope really say
    body: |
      NIST SP 800-115 separates two documents. An **assessment plan** says what will be done; the **ROE** "contains
      the same information in an assessment plan, and also addresses testing activities that are usually prohibited
      by the organization's policies. For example, some activities that are often performed during penetration
      testing, such as issuing attacks to compromise systems, are usually prohibited by an organization's policies.
      The ROE provides authorization for the assessors to conduct such activities as part of the assessment
      process." So the ROE is not paperwork around the test - it is what makes the test lawful and in policy.

      Its template (Appendix B) is a good checklist of what to ask a client in a scoping call:

      | Template section | What it settles | Question to ask |
      | --- | --- | --- |
      | Purpose, Scope | "test boundaries in terms of actions and expected outcomes" | which hosts, which actions, what counts as done? |
      | Assumptions and Limitations | what the organisation and the team assume | is a test environment available, and is it like production? |
      | Risks | inherent risks "particularly in the case of intrusive tests", and how the team reduces them | what could break, and what do we do if it does? |
      | Personnel, Communication Strategy | who is on the team and who to call | who is the contact for an incident, and how do I reach them? |
      | Test Schedule | the hours of testing | NIST: "it may be prudent to conduct technical testing of an operational site during evening hours" - when? |
      | Test Site, Test Equipment | where testing is authorised from and with which tools | from which addresses will I test, and which tools may I run? |

      **When something unplanned happens, the plan decides.** NIST asks: "if the assessors discover an actual
      intruder or an intruder's footprints within the network, should testing stop? If so, when can testing
      recommence - and by whose authority? The assessment plan should provide clear-cut instructions on what
      actions assessors should take in these situations." In an interview, the same three events always come up,
      and the answer to each is the same shape - stop touching it, tell the owner through the agreed channel, keep
      your own record, and wait:

      - a host or link **outside the scope** ("a partner's admin console"): do not interact further; note what you
        saw and tell the owner;
      - **real personal data** in a response: stop probing that endpoint, keep the least evidence that proves it
        (the request and a masked copy of the response), copy nothing, tell the owner at once;
      - **another intruder's traces**: stop activity on that system, keep a log of your own requests so responders
        can tell yours from theirs, do not clean up.

      **"Read-only" is a promise about semantics, not about code.** If your scope says "read-only testing", RFC
      9110 section 9.2.1 says "Request methods are considered 'safe' if their defined semantics are essentially
      read-only" and that "the GET, HEAD, OPTIONS, and TRACE methods are defined to be safe". It also says the
      definition "does not prevent an implementation from including behavior that is potentially harmful, that is
      not entirely read-only, or that causes side effects while invoking a safe method." A path such as
      `GET /api/payments/pay_1001/cancel` is safe by the RFC's definition and can still cancel a payment. Read what
      an endpoint does, and use data you may destroy.

  - id: plan-internals
    kind: internals
    concepts: [sec-smi-feature-plan]
    title: From behaviour to test areas, and what a checklist does not cover
    body: |
      The scenario question ("how would you test X?") rewards a plan that follows from what X does. The planner
      models a feature as twelve yes/no flags and a table of which flag calls for which category of the WSTG v4.2
      checklist (the heading ids of its testing table). The table is this lesson's judgement:

      | Flag | Calls for |
      | --- | --- |
      | every feature (baseline) | `WSTG-INFO` information gathering, `WSTG-CONF` configuration, `WSTG-ERRH` error handling |
      | `has_login` | `WSTG-IDNT` identity management, `WSTG-ATHN` authentication |
      | `keeps_session` | `WSTG-SESS` session management |
      | `has_roles`, `object_ids_in_urls` | `WSTG-ATHZ` authorisation |
      | `renders_user_input` | `WSTG-INPV` input validation, `WSTG-CLIENT` client-side |
      | `uses_sql`, `fetches_urls` | `WSTG-INPV` |
      | `redirects_to_param` | `WSTG-CLIENT` (WSTG-CLNT-04 is the client-side URL redirect test) |
      | `accepts_uploads` | `WSTG-ATHZ`, `WSTG-BUSLOGIC`, `WSTG-INPV` |
      | `moves_money` | `WSTG-BUSLOGIC` |
      | `json_api` | `WSTG-APIT`, `WSTG-INPV` |
      | `handles_sensitive_data` | `WSTG-CRYP` cryptography |

      Running it on four features of the practice portal (flags chosen from what each route does):

      ```text
      == plan: required areas per feature ==
      payments list
        WSTG-INFO      baseline
        WSTG-CONF      baseline
        WSTG-IDNT      has_login
        WSTG-ATHN      has_login
        WSTG-ATHZ      has_roles, object_ids_in_urls
        WSTG-SESS      keeps_session
        WSTG-INPV      json_api, uses_sql
        WSTG-ERRH      baseline
        WSTG-CRYP      handles_sensitive_data
        WSTG-APIT      json_api
      webhook test
        WSTG-INFO      baseline
        WSTG-CONF      baseline
        WSTG-IDNT      has_login
        WSTG-ATHN      has_login
        WSTG-INPV      fetches_urls, json_api
        WSTG-ERRH      baseline
        WSTG-APIT      json_api
      login with next
        WSTG-INFO      baseline
        WSTG-CONF      baseline
        WSTG-IDNT      has_login
        WSTG-ATHN      has_login
        WSTG-SESS      keeps_session
        WSTG-ERRH      baseline
        WSTG-CLIENT    redirects_to_param
      notes
        WSTG-INFO      baseline
        WSTG-CONF      baseline
        WSTG-IDNT      has_login
        WSTG-ATHN      has_login
        WSTG-SESS      keeps_session
        WSTG-INPV      json_api, renders_user_input
        WSTG-ERRH      baseline
        WSTG-CLIENT    renders_user_input
        WSTG-APIT      json_api
      ```

      Notice what a different feature does to the list: the webhook feature has no `WSTG-ATHZ` or `WSTG-SESS`,
      because nothing in it names an object or keeps a cookie - and `WSTG-INPV` is there only because of the
      URL it fetches (that is where SSRF lives) and its JSON body.

      **Two plans, compared.** A candidate asked about the webhook feature answers with four test ids. The planner
      maps ids to categories (`WSTG-BUSL-05` to `WSTG-BUSLOGIC`, `WSTG-CLNT-04` to `WSTG-CLIENT`) and compares:

      ```text
      == plan: a candidate's answer for 'webhook test' ==
      planned   ['WSTG-INPV-19', 'WSTG-ATHN-03', 'WSTG-BUSL-05', 'WSTG-CLNT-04']
      missing   ['WSTG-INFO', 'WSTG-CONF', 'WSTG-IDNT', 'WSTG-ERRH', 'WSTG-APIT']
      unneeded  ['WSTG-BUSLOGIC', 'WSTG-CLIENT']
      ```

      The candidate found the SSRF category and the lockout test, but left out the baseline, the way the endpoint
      is called as an API, and padded the plan with two categories the feature does not need. "Unneeded" is not
      "wrong" - say it is a judgement ("a redirect test is not relevant, because this endpoint does not redirect")
      and be ready to defend it.

      **What a checklist does not cover.** The portal's flaw table has 17 flaws. Using the WSTG v4.2 ids that the
      [WSTG lesson](#/lesson/owasp-wstg-and-asvs) mapped to them, the four features above ask for every category
      of the 14 flaws that have a v4.2 test:

      ```text
      == plan: do the four features cover the categories of the portal's flaws? ==
      categories asked for by the four features: 11
        not covered -> jwt-none: no v4.2 test
        not covered -> data-exposure: no v4.2 test
        not covered -> secret-logging: no v4.2 test
      flaws with a v4.2 test whose category is covered: 14 of 14
      ```

      Read that carefully. It checks this lesson's rules table against the flaw map; it does **not** show that the
      plan would find the flaws. And three flaws - a JWT accepted with `alg: none`, secrets in API responses and
      passwords in the access log - have no test in v4.2 at all (the mapping is the WSTG lesson's; the development
      version of the guide adds some). A tester who only walks a checklist misses what the checklist lacks; so in
      an interview, add the sources you would combine: the API Security Top 10, ASVS requirements and the
      Top 10's logging category.

  - id: triage-internals
    kind: internals
    concepts: [sec-smi-finding-triage]
    title: Why scope comes first, and what a "false positive" claims
    body: |
      The triage places each finding in the **first** label that applies. The order is the lesson:

      | # | Label | Rule | What you do next |
      | --- | --- | --- | --- |
      | 1 | `out_of_scope` | the host is not in the written scope | stop; tell the engagement owner; send nothing else |
      | 2 | `duplicate` | it repeats another finding | merge it into the parent |
      | 3 | `unverified` | nobody has tried to reproduce it | verify, most severe claim first |
      | 4 | `invalid_test` | it was tried, but the positive control failed | repair the test before believing anything |
      | 5 | `confirmed` | reproduced, with a working control | report it, with evidence, impact and a fix |
      | 6 | `false_positive` | not reproduced, with a working control | close it, keeping the evidence of the attempt |

      **Scope first, even when the finding looks serious.** `F-09` ("Default credentials on admin console", claimed
      critical) is on `admin.partner-bank.example`, which is not in scope. It is tempting to try the credentials
      "just to be sure". The triage labels it `out_of_scope` before anything else, because nothing that follows is
      allowed for a host you may not touch - the same reason the RAG triage in the AI track checks citations first.

      **The control decides whether a result counts.** `F-05` ("Open redirect on /login", medium) was tried and
      did not reproduce - but the positive control (a normal redirect that has to work) failed too, so the attempt
      says nothing about the redirect. It is `invalid_test`, not `false_positive`. Treating it as a false positive
      would close a finding on the strength of a broken test. `F-11` is the opposite mistake: it reproduced, but the
      control failed, so even the "hit" cannot be trusted until the test is repaired.

      **"False positive" is a narrow claim.** NIST defines it as "An alert that incorrectly indicates that a
      vulnerability is present." The triage's `false_positive` means: on this build, with this test, with a working
      control, the vulnerability did not show up (`F-04`, an IDOR the scanner claimed, did not reproduce between two
      accounts). It does not prove no variant exists. Keep the request and response, say which build, and be ready
      to retest if the scanner's claim comes with new detail. NIST adds that using "a second automated tool and
      comparing the results" can "often produce similar results - including the same false positives", and that
      "Manual examination typically provides more accurate results".

      **Severity is not the scanner's word.** The report order is by claimed severity here only because the
      example has no business information. With it, OWASP says to use the business impact: "if they have good
      business impact information, they should use that instead of the technical impact information." A confirmed
      "low" on the payment path may outrank a "high" on a page nobody uses. The triage orders by the claim only to
      keep the exercise deterministic; in a report, rate each confirmed finding yourself.

      The practice report and its triage:

      ```text
      == triage: the scanner report ==
      F-01  high     confirmed       Reflected XSS in /search
      F-02  critical confirmed       SQL injection in /api/payments
      F-03  low      confirmed       Missing X-Content-Type-Options
      F-04  high     false_positive  IDOR on /api/payments/{id}
      F-05  medium   invalid_test    Open redirect on /login
      F-06  medium   unverified      Directory listing on /files/
      F-07  medium   unverified      Weak TLS cipher accepted
      F-08  high     duplicate       Reflected XSS in /search (again)
      F-09  critical out_of_scope    Default credentials on admin console
      F-10  low      confirmed       Outdated jQuery on /notes
      F-11  medium   invalid_test    Session cookie without Secure
      F-12  info     out_of_scope    Server banner discloses version

      counts: {'out_of_scope': 2, 'invalid_test': 2, 'unverified': 2, 'confirmed': 4, 'false_positive': 1, 'duplicate': 1}
      next:   Stop testing those targets today and tell the engagement owner; do not send another request.
      report order: ['F-02', 'F-01', 'F-03', 'F-10']

      after the two out-of-scope findings are handed back:
      next:   Repair the tests first: a result without a working positive control proves nothing either way.
      ```

      Notice that `confirmed` is the **largest** bucket (4) and still not the first job. The RAG triage fixes the
      biggest bucket; this one follows a fixed order of work, because scope and broken tests change what the other
      numbers mean.

  - id: estimate-internals
    kind: internals
    concepts: [sec-smi-feature-plan]
    title: Sizing an engagement with a model you can say aloud
    body: |
      The model has an inventory (endpoints, roles, uploads, integrations) and rates. All the rates below are
      **assumptions made up for practice**: 1.5 hours per endpoint, a 0.4 uplift per extra role, 6 hours per upload,
      4 hours per integration, 8 hours of setup, a report of 25% of the testing hours, a re-test of 15% and
      contingency of 15% of everything before it, 6 productive hours in a person-day.

      ```text
      testing hours = endpoints x hours_per_endpoint x (1 + role_uplift x (roles - 1))
                      + uploads x hours_per_upload + integrations x hours_per_integration + setup_hours
      report   = report_fraction  x testing hours
      re-test  = retest_fraction  x testing hours
      contingency = contingency_fraction x (testing + report + re-test)
      total    = testing + report + re-test + contingency
      person-days = total / hours_per_day, rounded UP to the next half day
      calendar days = person-days / (testers x utilisation), rounded UP to a whole day
      ```

      Why the uplift: access control is tested again for every role, so a second role does not double the work but
      it does add to it. Why uploads and integrations are fixed hours: they are features of their own, not
      multiplied by roles. Why contingency applies to the sum: the report and the re-test can overrun too.

      The portal's route table has 17 entries (`len(make_app().routes)`); say it has 2 roles (merchant and admin)
      and one integration (the webhook test):

      ```text
      == estimate ==
      routes in the portal's table: 17
      effort_hours: 47.7
        test_hours          47.700
        report_hours        11.925
        retest_hours         7.155
        contingency_hours   10.017
        total_hours         76.797
      person days: 13.0
        1 tester(s) at 80% -> 17 working days
        2 tester(s) at 80% -> 9 working days
        3 tester(s) at 80% -> 6 working days

      what changes the answer most:
        a third role      93.219 h  (16.0 person days)
        a file upload     86.457 h  (14.5 person days)
        no integrations   70.357 h  (12.0 person days)

      the naive answer (endpoints x hours, nothing else): 25.5 h = 4.5 person days
      ```

      Three things to say aloud. **The naive answer is a third of the model's** - 25.5 hours against 76.8 - because
      it leaves out the role uplift, the integration, setup and the three overheads. **A third role costs more than
      a file upload** here, because it multiplies every endpoint. And **three testers do not finish in a third of
      the time** in real life (setup and reporting do not parallelise); the model ignores that, which is why you
      give a range and name the assumption. The figures are the model's output for made-up rates, not a claim about
      what any real test takes.

  - id: visual
    kind: visual
    concepts: [sec-smi-finding-triage]
    title: The triage decision for one finding
    body: |
      ```mermaid
      flowchart TD
        A["one scanner finding"] --> B{"host in the written scope?"}
        B -- "no" --> O["out_of_scope: stop, tell the owner"]
        B -- "yes" --> C{"repeats another finding?"}
        C -- "yes" --> D["duplicate"]
        C -- "no" --> E{"has anyone tried to reproduce it?"}
        E -- "no" --> U["unverified"]
        E -- "yes" --> F{"did the positive control work?"}
        F -- "no" --> I["invalid_test"]
        F -- "yes" --> G{"reproduced?"}
        G -- "yes" --> K["confirmed"]
        G -- "no" --> P["false_positive"]
      ```

      Notice the order of the questions: scope before everything, and the control before the verdict. A finding on a
      host you may not test never reaches the question "did it reproduce?", and a reproduction without a working
      control never reaches "confirmed" or "false_positive".

  - id: visual-scenario
    kind: visual
    concepts: [sec-smi-answer-method, sec-smi-feature-plan]
    title: The shape of a scenario answer
    body: |
      ```mermaid
      flowchart LR
        A["permission and scope"] --> B["what does the feature do?"]
        B --> C["test areas it calls for"]
        C --> D["safe probes with a control"]
        D --> E["evidence and rating"]
        E --> F["report and re-test"]
        C -. "name what you leave out and why" .-> G["limits of the plan"]
      ```

      Say the first box out loud even when nobody asks; it is the one most candidates skip. The dotted edge is the
      sentence that separates a plan from a list: "I would not test redirects here, because this endpoint never
      redirects."

  - id: triage-code
    kind: code
    concepts: [sec-smi-finding-triage]
    title: The classifier and the advice
    collapsed: true
    body: |
      From `practice/security/solutions/specialised/smi_triage.py`:

      ```python
      def classify(finding: ScanFinding) -> str:
          if finding.repro not in REPRO:
              raise ValueError(f"{finding.id}: unknown repro state {finding.repro!r}")
          if finding.claimed not in SEVERITY_ORDER:
              raise ValueError(f"{finding.id}: unknown severity {finding.claimed!r}")
          if not finding.in_scope:
              return "out_of_scope"
          if finding.duplicate_of is not None:
              return "duplicate"
          if finding.repro == "not_tried":
              return "unverified"
          if not finding.control_ok:
              return "invalid_test"
          return "confirmed" if finding.repro == "reproduced" else "false_positive"
      ```

      ```python
      def next_step(counts: dict[str, int]) -> str:
          for label in LABELS:
              if counts.get(label, 0) > 0:
                  return NEXT_STEP[label]
          return "Nothing to triage."
      ```

  - id: plan-code
    kind: code
    concepts: [sec-smi-feature-plan]
    title: The planner and the estimator
    collapsed: true
    body: |
      From `practice/security/solutions/specialised/smi_plan.py`:

      ```python
      def required_areas(feature: Feature) -> dict[str, list[str]]:
          reasons: dict[str, list[str]] = {}
          for category in BASELINE:
              reasons.setdefault(category, []).append("baseline")
          for flag in FLAGS:
              if getattr(feature, flag):
                  for category in RULES[flag]:
                      reasons.setdefault(category, []).append(flag)
          return {category: sorted(reasons[category]) for category in CATEGORIES if category in reasons}
      ```

      ```python
      def plan_gaps(feature: Feature, planned: Iterable[str]) -> Gaps:
          need = set(required_areas(feature))
          have = {category_of(entry) for entry in planned}
          return Gaps(
              missing=tuple(c for c in CATEGORIES if c in need and c not in have),
              unneeded=tuple(c for c in CATEGORIES if c in have and c not in need),
          )
      ```

      From `practice/security/solutions/specialised/smi_estimate.py`:

      ```python
      def estimate(inventory: Inventory, rates: Rates) -> Estimate:
          testing = effort_hours(inventory, rates)
          report = rates.report_fraction * testing
          retest = rates.retest_fraction * testing
          contingency = rates.contingency_fraction * (testing + report + retest)
          return Estimate(testing, report, retest, contingency, testing + report + retest + contingency)
      ```

      ```python
      def person_days(total_hours: float, hours_per_day: float) -> float:
          if total_hours < 0 or hours_per_day <= 0:
              raise ValueError("hours must be 0 or more and hours_per_day above 0")
          return math.ceil(round(total_hours / hours_per_day * 2, 9)) / 2
      ```

  - id: line-by-line
    kind: line-by-line
    concepts: [sec-smi-finding-triage, sec-smi-feature-plan]
    title: Why the important lines are written that way
    body: |
      - `if finding.repro not in REPRO: raise` comes **before** the scope check - a malformed record is refused even
        for an out-of-scope host, so a typo never turns into a silent label.
      - `if not finding.in_scope: return "out_of_scope"` is the first real rule. Moving it below the reproduction
        checks would let a reproduced finding on someone else's host be reported as `confirmed`.
      - `if finding.duplicate_of is not None` sits before `unverified`: a duplicate of a finding you will verify
        anyway needs no verification of its own.
      - `if not finding.control_ok: return "invalid_test"` sits before the verdict. A hit and a miss both count only
        when the control worked, so both reproduction outcomes fall into `invalid_test` together.
      - `next_step` walks `LABELS` in order and returns the first non-empty bucket. It does not take the largest
        bucket, because the order of the work is not the order of the sizes.
      - `required_areas` starts from `BASELINE` and adds `RULES[flag]` per flag, keeping every reason; the result is
        built in `CATEGORIES` order so two plans can be compared and printed the same way.
      - `category_of` accepts a heading or a test id and maps `BUSL` and `CLNT` through `PREFIX_ALIASES`, but
        refuses `WSTG-BUSLOGIC-01` - the heading is not a test prefix. Silent acceptance would let a typo pass as
        coverage.
      - `person_days` rounds the quotient to nine decimals **before** `ceil`, so a tiny float error just
        above a whole number does not cost a half day; `calendar_days` rounds up because nobody books 8.125 days.

  - id: choose-approach
    kind: when
    concepts: [sec-smi-answer-method]
    title: Which checklist for which question
    body: |
      | The interviewer says... | It is a... | Start with |
      | --- | --- | --- |
      | "Explain CSRF / SSRF / JWT" | explain question | the one-sentence definition; end with a safe test |
      | "How would you test our login / export / webhook?" | scenario question | permission and scope, then what the feature does |
      | "The scanner found 120 issues" | triage question | scope, then deduplicate, then controls |
      | "The developers say it is fixed" | triage question | the positive control, the original request, then variants |
      | "How long and what do you need?" | scoping question | the inventory and the model; ask for scope, accounts, environment, contacts |
      | "You find X during a test - what now?" | ethics question | stop, tell the owner, keep your own record |
      | "Tell me about a bug you found" | behavioural question | the story in order: scope, what you did, evidence, impact, fix |

      When a question mixes two ("how would you test it and how long would it take?"), answer in the order of the
      work: plan first, then size. And when you do not know a detail, say what you would check and where - "I would
      look it up in the WSTG's testing page for it" is a better answer than a confident guess.

  - id: example
    kind: example
    concepts: [sec-smi-answer-method, sec-smi-feature-plan, sec-smi-finding-triage]
    title: "A mock scenario round: SandPay's webhook test"
    body: |
      **Interviewer:** "SandPay's portal lets merchants test their webhook endpoint with
      `POST /api/webhooks/test` and a JSON body `{"url": ...}`. How would you test it?"

      **Candidate (permission and scope, 1 min):** "First: do I have written authorisation, which environment is this
      - not production, I hope - which accounts do I get, and what is off limits? I would also ask for the incident
      contact. I will not point it at third-party hosts, and I will not run anything that looks like a denial of
      service."

      **Candidate (behaviour, 1 min):** "The feature takes a URL from the client and the server fetches it. It needs a
      login and returns JSON. So the category the behaviour calls for is input validation - that is where SSRF
      sits - plus authentication, and the baseline: information gathering, configuration, error handling. There are
      no object ids and no cookies in the request, so access control and session tests would be padding for this
      endpoint." *(The planner prints exactly this: `WSTG-INFO`, `WSTG-CONF`, `WSTG-IDNT`, `WSTG-ATHN`, `WSTG-INPV`,
      `WSTG-ERRH`, `WSTG-APIT`.)*

      **Candidate (probes, 3 min):** "The riskiest area is the URL. I would point it only at a listener I run
      myself, first with a normal address as the control, then with addresses on the local machine and the
      internal ranges the server should not reach, and look at whether the server connected and what came back -
      in-band, or only that it connected - blind. I would also check that redirects are not followed, what the error
      messages reveal, whether the response size and time are limited, and whether the endpoint is rate limited
      per account."

      **Candidate (evidence and report, 1 min):** "Each test gets an expected result and evidence - the request,
      the response and my listener's log. I would rate findings by likelihood and by what the server can reach, and
      report with steps anyone can repeat, a fix (an allow-list checked after the name is resolved, no redirects,
      egress rules), and an offer to retest."

      **Interviewer:** "The scanner also reported 12 findings. What next?" **Candidate:** "Scope first: two are on
      hosts outside the written scope - I hand them back without testing. Then the unverified ones get a control and
      a reproduction, and the two where my control failed get their tests fixed before I believe either way. Only
      the confirmed ones, rated by business impact, go in the report, and I list what I could not verify."

      **Interviewer:** "How long would all of it take?" **Candidate:** "With the 17 routes, two roles and the one
      integration, and my assumed rates, about 13 person-days or 9 working days for two testers, a range, with a
      third role or an upload adding 3 to 1.5 days. I would calibrate the rates from my last engagements."

      What the interviewer heard: permission and scope first, a plan that follows from the behaviour (and says what
      it leaves out), safe probes with controls, evidence, a triage that starts with scope, and an estimate with
      assumptions.

  - id: tests
    kind: tests
    concepts: [sec-smi-feature-plan, sec-smi-answer-method]
    title: Tests you would promise for the webhook feature
    body: |
      | Case | Steps | Expected | Evidence |
      | --- | --- | --- | --- |
      | Authentication required | call the endpoint with no token and with an expired one | 401, nothing fetched | both responses; the listener's log shows no connection |
      | Control | give a URL on your own listener | the server connects once; the response says it succeeded | listener log with the time and the User-Agent |
      | Internal destinations | give the loopback address, a private-range address and a link-local address (on your test environment only) | refused with a clear error, nothing fetched | responses, listener log |
      | Redirects | give a URL on your listener that redirects to another address you control | the redirect is not followed | listener log shows one hit, not two |
      | Name resolution | give a host name that resolves to a forbidden address (a name you control in a test zone) | refused after resolution | response, DNS log |
      | Error messages | give an invalid URL, an unreachable port and a very slow listener | generic errors, no internal paths, host names or stack traces; a timeout | the three responses |
      | Size and time limits | have your listener return a very large body slowly | the server stops reading at a limit | response time, bytes read at the listener |
      | Rate limit | send a small agreed number of calls from one test account | a 429 appears within the agreed window, or the gap is a finding | status codes of the calls |
      | Logging | after the tests, read the audit log | each test call is recorded with the destination | log lines (masked) |

      Everything above runs only against listeners and zones you own, inside the written scope, in the agreed window.

  - id: mistakes
    kind: mistakes
    concepts: [sec-smi-answer-method, sec-smi-feature-plan, sec-smi-finding-triage]
    title: Common mistakes and how to recover
    body: |
      - **Starting with a tool.** "I would run Burp and ZAP" before permission and scope sounds like someone who has
        not been burned yet. Recover with "Before that, let me confirm the scope."
      - **Testing "just to be sure" outside the scope.** Trying default credentials on a host you noticed is
        unauthorised access, however small. Note it and tell the owner.
      - **Listing the whole checklist.** Recite 90 test ids and you have shown memory, not judgement. Pick the areas
        the feature calls for and name what you leave out.
      - **Trusting a negative.** "I sent the payload and nothing happened, so it is fixed." Without a positive control
        and variants that is a guess; say so.
      - **Reporting scanner rows.** NIST: scanners "typically have high false positive rates". Validate, and report
        confirmed, false positive and unverified separately.
      - **Severity by label.** A scanner's "critical" on a test server with no data is not a critical finding;
        OWASP: use business impact when you have it.
      - **One number for an estimate.** "Two weeks." Give the model, the assumptions and a range, and name the
        overheads: report, re-test, contingency.
      - **Taking evidence you do not need.** Downloading real customers' records to prove an exposure creates a second
        incident. Keep one masked example.
      - **Cleaning up an intruder's traces.** Removing a web shell destroys the evidence and is not your decision. Stop,
        tell the owner, keep your own log.
      - **Assuming "read-only" methods cannot hurt.** RFC 9110's safe methods are a promise about semantics; the
        server decides what happens.

      **Method for a triage question:** scope, deduplicate, control, verify, rate by business impact, report with
      what you did not verify.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [sec-smi-answer-method, sec-smi-feature-plan, sec-smi-finding-triage]
    title: Trade-offs and limits of this method
    body: |
      - **Breadth vs depth.** The scenario checklist covers everything thinly; interviewers often want one deep
        dive. Offer one ("I can go deeper on access control or on the URL fetching") and follow their lead.
      - **The planner is a model.** Twelve flags and a table are a teaching device. A real feature has dependencies
        the flags do not capture - a feature that looks harmless can call an internal service - so the plan changes
        as you learn. It also inherits the checklist's blind spots, such as the three flaws with no v4.2 test.
      - **Fixed triage order is a policy.** Scope first and broken tests second are defensible, but a real
        engagement may add a "stop" rule of its own (a live incident, real personal data) that overrides the order.
      - **`false_positive` is local.** It says "not on this build, by this test". A scanner can be right about a
        different state of the application.
      - **Estimates are rough on purpose.** They decide orders of magnitude and what to ask for, not exact invoices;
        a few timed engagements replace the made-up rates.
      - **Fixed methods can sound scripted.** Use the checklist to structure your thinking, not as a recitation.

  - id: summary
    kind: summary
    concepts: [sec-smi-answer-method, sec-smi-feature-plan, sec-smi-finding-triage]
    title: Quick reference
    body: |
      - Always first - written authorisation, written scope, window, contacts. ROE: "established before the start of a
        security test".
      - Explain - definition, mechanism, failure modes or cost, safe test.
      - Scenario - permission, what the feature does, areas it calls for, safe probes with a control, evidence and
        rating, report and re-test; say what you leave out.
      - Triage order - out of scope, duplicate, unverified, invalid test, confirmed, false positive; next step is the
        first non-empty bucket, not the largest.
      - A result without a working positive control proves nothing, in either direction.
      - Severity - likelihood and business impact; business impact wins when you have it.
      - Estimate - endpoints x hours x role uplift + uploads + integrations + setup, then report, re-test and
        contingency; round person-days up to half days; state every rate as an assumption.
      - Unplanned events - out-of-scope host, real data, another intruder: stop, tell the owner, keep your own
        record, do not clean up.

exercises:
  - id: smi-explain-opening
    type: mcq
    concept: sec-smi-answer-method
    skill: application
    title: Opening an explain answer
    prompt: |
      The interviewer asks: "Explain what an insecure direct object reference is." Which opening best follows the
      explain checklist?
    options:
      - id: definition-then-mechanism
        text: '"It is when an application uses an identifier the user supplies to fetch an object without checking that this user may have it. For example, changing the 1001 in /api/payments/1001 to 2001 returns someone else''s payment..."'
        feedback: Correct - a one-sentence definition, then the mechanism with a concrete request; failure modes and a safe test come next.
      - id: tool-first
        text: '"I would run Burp Suite and look at the Repeater tab..."'
        feedback: That answers "how do you test it" with a tool name before saying what the flaw is.
      - id: top-ten
        text: '"It is A01 in the Top 10, also called BOLA in the API list."'
        feedback: Labels are not an explanation; give the plain definition, then mention the names.
      - id: story
        text: '"At my last job we found one in the first hour of every test..."'
        feedback: A story before the definition makes the interviewer wait; tell it as an example after the mechanism.
    correct: [definition-then-mechanism]
    hints:
      - Which of the four checklist parts comes first?
      - Plain words and one concrete request.
    solution: |
      Definition in a sentence, then the mechanism with a concrete request. Then the failure modes (any signed-in
      user reads any object) and a safe test (two accounts that own different objects, plus a control). See [Testing
      access control and IDOR](#/lesson/testing-access-control-idor).

  - id: smi-scope-first
    type: mcq
    concept: sec-smi-answer-method
    skill: application
    title: The first sentence of a scenario answer
    prompt: |
      "How would you test our checkout page?" Which first sentence is best?
    options:
      - id: permission
        text: '"First I would confirm I have written authorisation, which environment and accounts I may use, what is in scope and what is not, and who to call if something breaks."'
        feedback: Correct - permission and scope come before any technique, and saying it unprompted is what the interviewer is listening for.
      - id: scan
        text: '"I would start with a full automated scan of the checkout."'
        feedback: A scan is testing; it needs authorisation and a scope first, and on a live checkout it can create orders.
      - id: owasp
        text: '"I would go through the OWASP Top 10 one by one."'
        feedback: That is a method without a target; ask what the checkout does first.
      - id: sqli
        text: '"I would try SQL injection in every field."'
        feedback: One technique chosen before knowing the feature, and before permission.
    correct: [permission]
    hints:
      - What gives you the right to send the first request?
    solution: |
      Authorisation, scope, environment, accounts and incident contact first. Then ask what the feature does. See
      [Security testing fundamentals](#/lesson/security-testing-fundamentals).

  - id: smi-plan-flags
    type: mcq
    concept: sec-smi-feature-plan
    skill: application
    title: What a URL-fetching feature calls for
    prompt: |
      A feature's only behaviour is that the server fetches a URL the client supplies; there is no login, no cookie,
      no roles, no object ids and no database lookup. With the lesson's rules, which categories does it call for?
    options:
      - id: baseline-inpv
        text: The baseline (information gathering, configuration, error handling) and input validation.
        feedback: Correct - `fetches_urls` calls for `WSTG-INPV` (where SSRF is tested), and every feature gets the baseline.
      - id: inpv-only
        text: Input validation only.
        feedback: Every web feature also gets information gathering, configuration and error handling.
      - id: athz-sess
        text: Authorisation, session management and input validation.
        feedback: Nothing in the feature names an object or keeps a session, so those two would be padding.
      - id: all
        text: All twelve categories, to be safe.
        feedback: That is reciting the checklist, not planning from the feature.
    correct: [baseline-inpv]
    hints:
      - Which flag is true, and which categories does the rules table give it?
    solution: |
      Baseline plus `WSTG-INPV`. Say what you leave out (no authentication, no session) and why.

  - id: smi-plan-gaps
    type: mcq
    concept: sec-smi-feature-plan
    skill: analysis
    title: What this plan misses
    prompt: |
      The feature is `GET /login?next=...`: it keeps a session cookie and redirects to the value of `next` after
      login. No input is shown back and no SQL is built from the parameter. A candidate plans only
      `WSTG-ATHN-03` (lockout) and `WSTG-INPV-05` (SQL injection). What is the most important criticism?
    options:
      - id: redirect
        text: It misses the redirect (client-side URL redirect, the `WSTG-CLIENT` category) and session management, and the SQL injection test is padding for this feature.
        feedback: Correct - `redirects_to_param` calls for `WSTG-CLIENT` and `keeps_session` for `WSTG-SESS`; nothing here calls for SQL injection.
      - id: nothing
        text: Nothing - lockout and SQL injection are the two most important tests of any login.
        feedback: That is a list from memory; the question is about what this endpoint does.
      - id: more-sqli
        text: It needs more injection tests, such as XSS and command injection.
        feedback: The feature shows nothing back and builds no commands; more injection tests are more padding.
      - id: tools
        text: It does not name a scanner.
        feedback: A tool is not a test area.
    correct: [redirect]
    hints:
      - What does the `next` parameter make the server do?
    solution: |
      Plan from behaviour: a parameter that becomes a redirect target calls for the client-side category (WSTG-CLNT-04),
      a cookie for session tests. Say plainly that the SQL injection test is padding here and why.

  - id: smi-blind-spots
    type: mcq
    concept: sec-smi-feature-plan
    skill: analysis
    title: A flaw the checklist has no test for
    prompt: |
      Your plan covers every category the features call for, but the system also writes users' passwords into its
      access log - and the WSTG v4.2 checklist has no test for that. What do you do?
    options:
      - id: other-sources
        text: Add the other sources to the plan - the Top 10's logging category and ASVS logging requirements - and test it as a finding with its own evidence.
        feedback: Correct - a checklist is a floor, not a ceiling; the plan should name where the missing coverage comes from.
      - id: ignore
        text: Leave it out; if the checklist has no test it is not a vulnerability.
        feedback: The checklist is a list of tests, not a definition of vulnerabilities.
      - id: invent
        text: Invent a WSTG test id for it so the report looks complete.
        feedback: An invented reference misleads the reader; cite the source you really used.
      - id: pass
        text: Mark the whole category as passed.
        feedback: A category cannot pass when part of it was never tested.
    correct: [other-sources]
    hints:
      - Where else are logging weaknesses described?
    solution: |
      Combine sources: the checklist for breadth, the Top 10 and ASVS for what it lacks, and cite each honestly. In this
      lesson's run, three of the portal's 17 flaws (the `none` JWT, secrets in responses, secrets in the log) have no
      v4.2 test.

  - id: smi-triage-order
    type: mcq
    concept: sec-smi-finding-triage
    skill: analysis
    title: Why scope before reproduction
    prompt: |
      A scanner reports a critical finding on a host that is not in the written scope. Why does the triage label it
      `out_of_scope` before it asks whether the finding reproduces?
    options:
      - id: not-allowed
        text: Because reproducing it means sending requests to a host you may not test, so nothing after the scope check is allowed.
        feedback: Correct - the check protects you and the host's owner; verification is itself testing.
      - id: low-priority
        text: Because out-of-scope findings are always low severity.
        feedback: F-09 in the example is claimed critical; severity does not change what you may touch.
      - id: scanner-wrong
        text: Because scanners are usually wrong about hosts.
        feedback: The scanner may be right; that is exactly why you tell the owner instead of verifying.
      - id: alphabet
        text: Because the labels are sorted alphabetically.
        feedback: The order is the order of the work, not alphabetical.
    correct: [not-allowed]
    hints:
      - Is "verifying" the same as "looking"?
    solution: |
      Verification sends requests. Without authority over the host, you hand the finding to the engagement owner
      instead.

  - id: smi-control
    type: mcq
    concept: sec-smi-finding-triage
    skill: application
    title: The control failed
    prompt: |
      You try to reproduce a reported open redirect. The redirect does not appear - and the positive control, a
      normal `next=/settings` that must redirect, also fails (the login page answers 500). Which label and next step?
    options:
      - id: invalid
        text: "`invalid_test` - repair the test (here, find why the login page fails) and run it again before believing either result."
        feedback: Correct - with the control broken, a missing redirect says nothing about the flaw.
      - id: false-positive
        text: "`false_positive` - it did not reproduce, so close it."
        feedback: A miss counts only when the control worked; otherwise the test, not the finding, is what failed.
      - id: confirmed
        text: "`confirmed` - the server error shows the parameter is dangerous."
        feedback: A 500 is a different symptom; it is not evidence of an open redirect.
      - id: unverified
        text: "`unverified` - nobody tried."
        feedback: Someone did try; the result is void because the control failed, which is its own label.
    correct: [invalid]
    hints:
      - What does the control prove when it works, and what does it prove when it fails?
    solution: |
      Void result, label `invalid_test`: fix the environment or the request, repeat with a working control, then decide.

  - id: smi-false-positive
    type: mcq
    concept: sec-smi-finding-triage
    skill: analysis
    title: What "false positive" claims
    prompt: |
      Between two accounts, with both controls passing, the scanner's IDOR claim on `/api/payments/{id}` did not
      reproduce. You label it `false_positive`. What exactly does that label claim?
    options:
      - id: local
        text: On this build, with this test and a working control, the flaw did not show up; it does not prove that no variant exists.
        feedback: Correct - keep the request and response, name the build, and be ready to retest with new detail.
      - id: never
        text: That the endpoint can never be vulnerable.
        feedback: A single negative never proves that.
      - id: scanner-bad
        text: That the scanner is broken and should be replaced.
        feedback: One false positive says nothing about the tool as a whole; tune it from the evidence.
      - id: fixed
        text: That the developers fixed it.
        feedback: The label says nothing about whether it was ever present.
    correct: [local]
    hints:
      - What is the narrowest true statement?
    solution: |
      A local, evidence-based claim. NIST defines a false positive as "an alert that incorrectly indicates that a
      vulnerability is present" - the label says the alert was wrong on this build, by this test.

  - id: smi-estimate-contingency
    type: mcq
    concept: sec-smi-feature-plan
    skill: application
    title: Contingency on what?
    prompt: |
      Testing takes 100 hours. The report is 25% of that, the re-test 15% of it, and contingency is 15% of everything
      before it (testing, report and re-test). What is the total?
    options:
      - id: h161
        text: 161 hours
        feedback: Correct - 100 + 25 + 15 = 140, contingency 0.15 x 140 = 21, total 161.
      - id: h155
        text: 155 hours
        feedback: That takes 15% of the testing hours only (15) instead of 15% of the 140.
      - id: h140
        text: 140 hours
        feedback: That forgets the contingency.
      - id: h180
        text: 180 hours
        feedback: That adds 80% - the three fractions applied again on top of each other.
    correct: [h161]
    hints:
      - Add the report and the re-test first.
    solution: |
      140 hours before contingency, 21 for contingency, 161 in total - about 26.8 person-days at 6 productive hours,
      rounded up to 27 person-days.

  - id: smi-estimate-roles
    type: mcq
    concept: sec-smi-feature-plan
    skill: analysis
    title: Why every extra role costs time
    prompt: |
      The estimate adds an uplift for every role beyond the first, applied to the endpoint hours. Why?
    options:
      - id: access-control
        text: Access control is tested again for each role - who can call each endpoint, and whose data each role sees - so more roles mean more cases per endpoint.
        feedback: Correct - the work does not double with a second role, but it grows, and the uplift is the assumption that says by how much.
      - id: licences
        text: Each role needs another scanner licence.
        feedback: Licences are not hours.
      - id: more-users
        text: More roles mean more users, and users are slow.
        feedback: Roles change what is allowed, not how many people are involved.
      - id: not-needed
        text: It does not; the uplift is only there to make the estimate bigger.
        feedback: Padding without a reason would not survive a client's question; the reason is the repeated access tests.
    correct: [access-control]
    hints:
      - What is tested again when a new role appears?
    solution: |
      The uplift stands for repeated access control testing. State the rate as an assumption and say how you would
      calibrate it from earlier engagements.

  - id: smi-order-triage
    type: order
    concept: sec-smi-finding-triage
    skill: recall
    title: Handling a scanner report, in order
    prompt: Put the steps of a triage answer in order.
    items:
      - id: scope
        text: Check every finding against the written scope and hand back what is out of it
      - id: group
        text: Deduplicate and group the findings by type
      - id: reproduce
        text: Reproduce with your own request and a working positive control, and keep the evidence
      - id: rate
        text: Rate each confirmed finding by likelihood and business impact
      - id: report
        text: Report confirmed, false positive and unverified findings separately, with a fix for each confirmed one
    hints:
      - You cannot rate what you have not confirmed, nor reproduce on a host you may not touch.
    solution: |
      Scope, group, reproduce with a control, rate by business impact, report with the unverified listed honestly.

  - id: smi-debug-triage
    type: debug
    concept: sec-smi-finding-triage
    skill: analysis
    title: A triage that tests what it must not
    prompt: |
      This function labels scanner findings. A reproduced finding on a partner's host, and a "not tried" finding on a
      host nobody agreed to test, both come out as ordinary results that the team goes on to verify and report. Click
      **every** line that lets a finding on an out-of-scope host through.
    language: python
    code: |
      def classify(f):
          if f.repro == "not_tried":
              return "unverified"
          if f.repro == "reproduced":
              return "confirmed"
          if not f.in_scope:
              return "out_of_scope"
          return "false_positive"
    correctLines: [2, 4]
    lineNotes:
      - line: 6
        note: The scope check itself is right; the bug is that it runs after two returns that never look at the host.
      - line: 8
        note: A missed reproduction also needs a working control to count as a false positive, which this function never checks - a second bug, though not the one asked about.
    hints:
      - Which return statements happen before `in_scope` is read?
    solution: |
      Lines 2 and 4 return before the scope is checked, so an out-of-scope finding becomes "unverified" (to be verified,
      meaning tested) or "confirmed". Move the `in_scope` check to the top. The function also never reads `control_ok`,
      so a failed control still yields a verdict.

  - id: smi-rewrite-answer
    type: short
    concept: sec-smi-answer-method
    skill: application
    title: Improve this explain answer
    prompt: |
      A candidate answered "What is SQL injection?" with: "When hackers put code in a form. You stop it with a
      firewall." Rewrite the answer using the explain checklist, in five or six sentences.
    modelAnswer: |
      SQL injection is when an application builds a database query by putting untrusted input into the SQL text, so
      the input can change what the query means. It works because the database cannot tell the developer's SQL from
      the text that arrived in the data: a status value such as `' OR '1'='1` inside a query built by concatenation
      turns a filter into one that matches every row. The cost is reading or changing data the user should not reach,
      and in some setups running commands. I would test it with a harmless input such as a single quote, watch for
      a database error or a changed result, confirm with a control request that has the same shape, and keep the
      request and response as evidence. The fix is parameterised queries so the input is never part of the SQL
      text, with an allow-list for things that cannot be parameters such as sort columns; a firewall can reduce
      noise but does not remove the flaw.
    rubric:
      - Defines SQL injection as untrusted input becoming part of the SQL statement.
      - Explains the mechanism with a concrete input and what it changes.
      - Names the impact (data read or changed).
      - Describes a safe test with a control and evidence.
      - Gives parameterised queries as the main fix and says why a firewall is not enough.
    hints:
      - Definition, mechanism, cost, test and fix.
    solution: |
      Definition, mechanism with an example, impact, a safe test with a control, and parameterised queries as the fix.
      See [Testing SQL injection](#/lesson/testing-sql-injection).

  - id: smi-webhook-testdesign
    type: testdesign
    concept: sec-smi-feature-plan
    skill: application
    title: Tests for the webhook feature
    prompt: |
      SandPay's `POST /api/webhooks/test` takes `{"url": ...}`, requires a login and makes the server fetch the URL.
      Design the security tests for it. Give preconditions, steps, expected results and evidence for each case, and
      say what you leave out.
    modelAnswer: |
      Preconditions - written authorisation and scope, a test environment, two merchant accounts, a listener I run
      myself, the incident contact.

      1. **No token or an expired token** - call the endpoint. Expected - 401 and nothing fetched. Evidence - the
         response and an empty listener log.
      2. **Control** - a URL on my listener. Expected - one connection and a success answer. Evidence - listener log.
      3. **Internal destinations** - loopback, private and link-local addresses on the test environment. Expected -
         refused, nothing fetched. Evidence - responses and listener log.
      4. **Redirects** - my URL redirecting to another address I control. Expected - not followed. Evidence - one hit
         in the listener log.
      5. **Name resolution** - a name I control that resolves to a forbidden address. Expected - refused after
         resolution. Evidence - response and DNS log.
      6. **Error messages, size and time** - invalid URL, unreachable port, slow and huge responses. Expected -
         generic errors, a limit on bytes and time. Evidence - responses and timings.
      7. **Rate limit** - a small agreed number of calls from one test account. Expected - a 429 within the window.
         Evidence - status codes.

      Left out - session and object-level access tests (the endpoint keeps no cookie and names no object), and any
      high-volume test, which needs separate approval.
    rubric:
      - Starts with preconditions that include authorisation, scope and a listener the tester controls.
      - Each case has steps, an expected result and concrete evidence.
      - Covers unauthenticated access, a control, internal destinations, redirects and name resolution.
      - Covers errors, size and time limits and a small rate-limit test.
      - Says what is left out and why, including high-volume testing.
    hints:
      - Where does the request go, and who owns that place?
    solution: |
      Authentication, a control, internal destinations, redirects, name resolution, errors and limits, and a small rate
      test - all against targets you own, each with evidence, and with the omissions named.

  - id: smi-interview-dispute
    type: interview
    concept: sec-smi-finding-triage
    skill: analysis
    title: 'Interview: "your critical is a false positive"'
    prompt: |
      "Your report rates the SQL injection in the payments list as critical. Our developers say it is a false positive
      and want it removed. What do you do?"
    modelAnswer: |
      I would not argue and I would not remove it; I would show the evidence and let them check it. I would send
      the exact requests I used - the control that works, the request with the marker that changes the answer, and the
      responses - with the build and the time, so a developer can repeat it. If they cannot reproduce it, we compare:
      the build or environment may differ, a WAF may sit in front of one environment, my account or data may differ.

      If it reproduces for them, the discussion moves to impact and the fix, and I keep the severity from likelihood and
      business impact, not from the label. If it truly does not reproduce on the build in the report, I would test
      again with variants and a working control, and if still not, change it to "not reproduced on build X" and say
      what I tried. A false positive is a claim about my test on one build, so I accept it when the evidence supports
      it and keep the finding when it does not. Either way I keep a record of what changed.
    rubric:
      - Responds with repeatable evidence rather than authority.
      - Compares build, environment and data when reproduction differs.
      - Keeps severity tied to likelihood and business impact.
      - Retests with a working control and variants before changing the verdict.
      - Records the outcome, including the build tested.
    followUps:
      - What if they say "we fixed it last night"?
      - How would you stop this dispute next time?
    hints:
      - Who can repeat your steps, and on which build?
    solution: |
      Share repeatable evidence, compare builds, retest with a control and variants, and change the verdict only when
      the evidence supports it.

  - id: smi-plan-coding
    type: coding
    concept: sec-smi-feature-plan
    skill: application
    title: Plan the test from the feature
    prompt: |
      In `smi_plan.py`, implement `category_of`, `required_areas` and `plan_gaps` so a feature's behaviour becomes the
      categories it calls for, and a candidate's plan can be compared with them.
    project: security
    files:
      - exercises/specialised/smi_plan.py
    test: tests/specialised/test_smi_plan.py
    command: .venv/bin/python -m pytest tests/specialised/test_smi_plan.py
    hints:
      - "Start from `BASELINE`, then add `RULES[flag]` for each flag that is True, remembering the flag as the reason."
      - A test id such as `WSTG-CLNT-04` maps to the heading `WSTG-CLIENT` through `PREFIX_ALIASES`.
      - A heading used as a test prefix (`WSTG-BUSLOGIC-01`) is an error, not a match.
    modelAnswer: |
      ```python
      def required_areas(feature):
          reasons = {}
          for category in BASELINE:
              reasons.setdefault(category, []).append("baseline")
          for flag in FLAGS:
              if getattr(feature, flag):
                  for category in RULES[flag]:
                      reasons.setdefault(category, []).append(flag)
          return {c: sorted(reasons[c]) for c in CATEGORIES if c in reasons}

      def plan_gaps(feature, planned):
          need = set(required_areas(feature))
          have = {category_of(entry) for entry in planned}
          return Gaps(
              missing=tuple(c for c in CATEGORIES if c in need and c not in have),
              unneeded=tuple(c for c in CATEGORIES if c in have and c not in need),
          )
      ```
    rubric:
      - Every test in tests/specialised/test_smi_plan.py passes.
      - Reasons are kept per category and sorted, and the result follows the order of CATEGORIES.
      - Test ids and headings both map to a category, and unknown or malformed ids raise ValueError.
      - Can explain why "unneeded" is a judgement and not an error.
    solution: |
      Baseline plus per-flag categories with reasons, a category mapper that is strict about ids, and a comparison in
      checklist order.

  - id: smi-triage-coding
    type: coding
    concept: sec-smi-finding-triage
    skill: application
    title: Triage a scanner report
    prompt: |
      In `smi_triage.py`, implement `classify`, `triage`, `next_step` and `report_order` so each finding is placed in the
      first label that applies and the advice follows the order of the work.
    project: security
    files:
      - exercises/specialised/smi_triage.py
    test: tests/specialised/test_smi_triage.py
    command: .venv/bin/python -m pytest tests/specialised/test_smi_triage.py
    hints:
      - Validate `repro` and `claimed` before anything else, even for an out-of-scope host.
      - Scope first, then duplicate, then not tried, then the control, then the verdict.
      - "`next_step` walks `LABELS` in order; it does not look at which count is largest."
    modelAnswer: |
      ```python
      def classify(finding):
          if finding.repro not in REPRO or finding.claimed not in SEVERITY_ORDER:
              raise ValueError(f"{finding.id}: unknown repro state or severity")
          if not finding.in_scope:
              return "out_of_scope"
          if finding.duplicate_of is not None:
              return "duplicate"
          if finding.repro == "not_tried":
              return "unverified"
          if not finding.control_ok:
              return "invalid_test"
          return "confirmed" if finding.repro == "reproduced" else "false_positive"

      def next_step(counts):
          for label in LABELS:
              if counts.get(label, 0) > 0:
                  return NEXT_STEP[label]
          return "Nothing to triage."
      ```

      `triage` starts every label at zero so the report always has the same keys; `report_order` sorts the confirmed
      findings by `SEVERITY_ORDER.index(claimed)` and then by id.
    rubric:
      - Every test in tests/specialised/test_smi_triage.py passes.
      - Scope is checked before reproduction, and a failed control gives invalid_test for both outcomes.
      - The next step comes from the first non-empty label, not the largest bucket.
      - Can explain why a reproduction without a control is not evidence.
    solution: |
      Scope, duplicate, not tried, control, verdict; count every label; next step is the first non-empty bucket;
      report confirmed findings most severe first.

  - id: smi-estimate-coding
    type: coding
    concept: sec-smi-feature-plan
    skill: application
    title: A whiteboard estimator
    prompt: |
      In `smi_estimate.py`, implement `effort_hours`, `estimate`, `person_days` and `calendar_days` for an assessment
      of the portal. The rates are assumptions given in the tests.
    project: security
    files:
      - exercises/specialised/smi_estimate.py
    test: tests/specialised/test_smi_estimate.py
    command: .venv/bin/python -m pytest tests/specialised/test_smi_estimate.py
    hints:
      - "The uplift multiplies the endpoint hours only: `endpoints x hours x (1 + uplift x (roles - 1))`."
      - Contingency is a fraction of testing plus report plus re-test, not of the testing hours alone.
      - Round person-days up to the next half day, after rounding the quotient to 9 decimals.
    modelAnswer: |
      ```python
      def effort_hours(inventory, rates):
          _check(inventory, rates)
          endpoint_hours = inventory.endpoints * rates.hours_per_endpoint * (1 + rates.role_uplift * (inventory.roles - 1))
          return endpoint_hours + inventory.uploads * rates.hours_per_upload + inventory.integrations * rates.hours_per_integration + rates.setup_hours

      def estimate(inventory, rates):
          testing = effort_hours(inventory, rates)
          report = rates.report_fraction * testing
          retest = rates.retest_fraction * testing
          contingency = rates.contingency_fraction * (testing + report + retest)
          return Estimate(testing, report, retest, contingency, testing + report + retest + contingency)

      def person_days(total_hours, hours_per_day):
          return math.ceil(round(total_hours / hours_per_day * 2, 9)) / 2
      ```

      Round only the last step: `calendar_days` divides by testers times utilisation and rounds up to a whole day.
    rubric:
      - Every test in tests/specialised/test_smi_estimate.py passes.
      - The role uplift applies to endpoint hours only, while uploads, integrations and setup are fixed hours.
      - Contingency is taken on the sum of testing, report and re-test.
      - Invalid inputs raise ValueError instead of returning nonsense.
    solution: |
      Endpoint hours with the role uplift plus fixed hours, overheads in order, a half-day round-up, and a whole-day
      round-up on the calendar.

placement:
  - id: place-explain-order
    type: order
    concept: sec-smi-answer-method
    skill: recall
    title: The explain checklist
    prompt: Put the parts of an explain answer in order.
    items:
      - id: definition
        text: A one-sentence definition in plain words
      - id: mechanism
        text: How it works, with one concrete request or value
      - id: cost
        text: What an attacker gets, or what the fix does not cover
      - id: test
        text: How you would test it safely, with a control and evidence
    hints:
      - Start from what it is.
    solution: |
      Definition, mechanism, failure modes or cost, safe test - short, concrete and ending with evidence.

  - id: place-triage-scope
    type: mcq
    concept: sec-smi-finding-triage
    skill: application
    title: A finding on someone else's host
    prompt: |
      A scanner reports default credentials on `admin.partner-bank.example`, which is not in your written scope. What do
      you do?
    options:
      - id: hand-back
        text: Do not send anything to it; tell the engagement owner what the scanner reported.
        feedback: Correct - out of scope means untouched; the owner can ask the partner.
      - id: try
        text: Try the credentials once to confirm.
        feedback: A login attempt on a host you may not test is unauthorised access.
      - id: report
        text: Put it in the report as a confirmed critical.
        feedback: It is not confirmed, and you may not confirm it.
      - id: drop
        text: Delete the finding from the scanner output and say nothing.
        feedback: The owner should hear about it; hiding it helps nobody.
    correct: [hand-back]
    hints:
      - Who owns that host?
    solution: |
      Label it `out_of_scope`, send nothing, tell the owner.

  - id: place-plan-estimate
    type: mcq
    concept: sec-smi-feature-plan
    skill: application
    title: Endpoint hours with two roles
    prompt: |
      40 endpoints, 2 roles, an assumed 1.5 hours per endpoint and a 0.4 uplift per extra role. How many hours of endpoint
      testing, before uploads, integrations, setup and overheads?
    options:
      - id: h84
        text: 84 hours
        feedback: Correct - 40 x 1.5 x (1 + 0.4 x 1) = 60 x 1.4 = 84.
      - id: h60
        text: 60 hours
        feedback: That ignores the second role.
      - id: h120
        text: 120 hours
        feedback: That doubles the effort for the second role; the uplift is 0.4, not 1.
      - id: h64
        text: 64 hours
        feedback: That adds the 0.4 hours to the total instead of multiplying the endpoint hours.
    correct: [h84]
    hints:
      - The uplift multiplies the endpoint hours.
    solution: |
      60 hours for one role, times 1.4 for two roles, is 84 hours.

recall:
  - id: recall-permission
    concept: sec-smi-answer-method
    prompt: What comes before any technique in a security answer?
    answer: Written authorisation, a written scope (hosts, techniques, window), the environment and accounts, and who to call if something breaks.
  - id: recall-explain
    concept: sec-smi-answer-method
    prompt: What are the four parts of an explain answer?
    answer: Definition in plain words, mechanism with a concrete example, failure modes or cost, and how you would test it safely.
  - id: recall-plan
    concept: sec-smi-feature-plan
    prompt: How do you plan a test for a feature?
    answer: Ask what it does (login, session, roles, object ids, input shown back, fetched URLs, redirects, uploads, money, API, sensitive data), take the categories that behaviour calls for plus the baseline, and say what you leave out.
  - id: recall-estimate
    concept: sec-smi-feature-plan
    prompt: What does a defensible test estimate include besides endpoint hours?
    answer: A per-role uplift, fixed hours for uploads and integrations, setup, then the report, the re-test and contingency - every rate stated as an assumption.
  - id: recall-triage
    concept: sec-smi-finding-triage
    prompt: In what order do you place a scanner finding?
    answer: Out of scope, duplicate, unverified, invalid test (control failed), then confirmed or false positive; the next step is the first non-empty bucket.
  - id: recall-control
    concept: sec-smi-finding-triage
    prompt: Why does every reproduction need a positive control?
    answer: Without a request that must work, a denial or a missing hit might come from a broken test, so neither outcome proves anything.

