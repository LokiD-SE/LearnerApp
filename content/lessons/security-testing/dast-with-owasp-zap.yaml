id: dast-with-owasp-zap
title: DAST with OWASP ZAP
subject: security-testing
module: devsecops
level: intermediate
status: published
estimatedMinutes: 150
summary: >-
  Dynamic application security testing (DAST) attacks or observes a running application from the outside, and OWASP ZAP
  is the open source scanner most teams meet first. Learn what its baseline, full and API scans do and do not do, how
  passive and active scanning differ, how to read an alert (risk, confidence, evidence, instances), how to prove or
  reject an alert by replaying it, and how rule configuration and exit codes turn a scan into a pipeline gate. ZAP is
  described from its official documentation and is not run here; the practice builds a small passive scanner, a report
  replayer and a gate against the local, deliberately vulnerable SandPay portal.
tags:
  - DAST
  - dynamic application security testing
  - OWASP ZAP
  - ZAP by Checkmarx
  - zap-baseline.py
  - zap-full-scan.py
  - zap-api-scan.py
  - Automation Framework
  - passive scan
  - active scan
  - spider
  - alert
  - risk
  - confidence
  - false positive
  - alert filter
  - scan policy
  - exit code
  - CI gate
  - security testing

environment: |
  - **Runtime:** Python 3.12.3 in `practice/security/.venv` with pytest 9.2.0 and requests 2.34.2, on Linux. Every output
    marked as run here was printed by the code shown, on 21 November 2026, against the practice portal on `127.0.0.1`. The
    results do not depend on timing.
  - **ZAP is not installed on this machine and Docker is not either - from the docs, not run here.** Everything this
    lesson says about ZAP comes from the official documentation, read on 21 November 2026 (the site's footer then read
    "ZAP by Checkmarx"): the Docker scan pages
    [Baseline Scan](https://www.zaproxy.org/docs/docker/baseline-scan/),
    [Full Scan](https://www.zaproxy.org/docs/docker/full-scan/) and
    [API Scan](https://www.zaproxy.org/docs/docker/api-scan/); the Desktop User Guide pages
    [Alerts](https://www.zaproxy.org/docs/desktop/start/features/alerts/),
    [Active Scan](https://www.zaproxy.org/docs/desktop/start/features/ascan/),
    [Scan Policy Dialog](https://www.zaproxy.org/docs/desktop/ui/dialogs/scanpolicy/) and
    [Alert Filters](https://www.zaproxy.org/docs/desktop/addons/alert-filters/); the
    [Automation Framework](https://www.zaproxy.org/docs/automate/automation-framework/) pages (its
    [add-on help](https://www.zaproxy.org/docs/desktop/addons/automation-framework/),
    [environment](https://www.zaproxy.org/docs/desktop/addons/automation-framework/environment/),
    [activeScan job](https://www.zaproxy.org/docs/desktop/addons/automation-framework/job-ascan/),
    [exitStatus job](https://www.zaproxy.org/docs/desktop/addons/automation-framework/job-exitstatus/) and
    [alert tests](https://www.zaproxy.org/docs/desktop/addons/automation-framework/test-alert/)); the
    [Traditional JSON Report](https://www.zaproxy.org/docs/desktop/addons/report-generation/report-traditional-json/);
    and the alert pages [10038-1](https://www.zaproxy.org/docs/alerts/10038-1/), [10020-1](https://www.zaproxy.org/docs/alerts/10020-1/),
    [10021](https://www.zaproxy.org/docs/alerts/10021/), [10036-2](https://www.zaproxy.org/docs/alerts/10036-2/),
    [10035-4](https://www.zaproxy.org/docs/alerts/10035-4/), [10010](https://www.zaproxy.org/docs/alerts/10010/),
    [10011](https://www.zaproxy.org/docs/alerts/10011/), [10054-1](https://www.zaproxy.org/docs/alerts/10054-1/) and
    [90022](https://www.zaproxy.org/docs/alerts/90022/), plus the [alert index](https://www.zaproxy.org/docs/alerts/). ZAP
    changes often; check the pages for the version you run. The example output in the Baseline Scan page is dated 2016 there, so
    its rule list is older than today's.
  - **Practice target:** `practice/security/support/sandpay_vuln.py`, the **deliberately vulnerable** SandPay merchant
    portal; `make_app({...})` closes flaws by id. This lesson uses the headers, cookie, error, reflected XSS and path traversal
    flaws. The portal binds to loopback only. SandPay and everything in it are fictional.
  - **What is hand-written:** `support/zap_fixture.py` holds a **synthetic** ZAP-style report, written by hand in the shape of the
    sample in the Traditional JSON Report page - it is not output of a ZAP run. The three practice tools are **simplified**:
    they use ZAP's rule ids, names and risks as documented, but they are not ZAP's code and do not behave exactly like
    ZAP's rules.
  - **Ethics:** active scanning is an attack. Scan only systems you own or have **written permission** to test, inside the agreed scope
    and time window. The ZAP docs say "You should NOT use it on web applications that you do not own." Practice runs only against the
    local portal; the tools refuse any host that is not loopback.
  - **Not repeated here:** the intercepting proxy itself - [Intercepting proxies](#/lesson/intercepting-proxies); the weaknesses scanners
    look for - [Testing security misconfiguration](#/lesson/testing-security-misconfiguration), [Testing cross-site scripting](#/lesson/testing-cross-site-scripting)
    and [Testing SQL injection](#/lesson/testing-sql-injection); the test catalogue ZAP rules map to -
    [OWASP WSTG and ASVS](#/lesson/owasp-wstg-and-asvs).

prerequisites:
  - security-testing-fundamentals
  - http-security-for-testers
  - intercepting-proxies
  - reconnaissance-and-attack-surface
  - testing-security-misconfiguration

concepts:
  - id: sec-zap-scan-modes
    name: Passive, active and API scans - what DAST sees
    summary: A DAST tool tests a running application from the outside. ZAP's passive scanning only reads the responses it sees, so it is safe to point at almost anything you may touch; active scanning sends known attacks and is an attack in its own right, so it needs permission. The Docker scripts package this as the baseline scan (spider plus passive), the full scan (spider plus active) and the API scan (import an API definition, then actively scan it). DAST finds what shows in requests and responses - missing headers, reflected input, error pages - and cannot find flaws that need an understanding of who may do what.
  - id: sec-zap-alert-triage
    name: Reading and proving an alert
    summary: An alert is a claim about one request, with a rule, a risk, a confidence, and for active rules an attack and the evidence that made ZAP suspect it. A tester reads the evidence, replays the instance against the same build, and records one of three outcomes - reproduced, not reproduced, not replayable. A scanner cannot know your intent, so some alerts are noise for your application; the fix is a filter with a reason, never an unread report.
  - id: sec-zap-gate
    name: Gating a pipeline on scan results
    summary: A scan only changes a release when something acts on it. The baseline script treats every alert as a WARN unless a rule configuration file sets it to FAIL, IGNORE or INFO, and exits 0, 1 or 2; the Automation Framework's exitStatus job sets the exit code from risk levels. A good gate fails on a short list of things that must never ship, warns on the rest, pins the scanner version, and treats a config typo as an error.

objectives:
  - Explain what DAST is, what passive and active scanning do, and why active scanning needs written permission.
  - Choose between the baseline, full and API scans for a given job, and say what each one sends.
  - Read a ZAP alert - rule id, risk, confidence, parameter, attack, evidence, instances - and explain why a missing-header alert has no evidence.
  - Replay an alert instance against a build and report reproduced, not reproduced or not replayable, without calling the last two false positives.
  - Write a rule configuration and compute the exit code of a baseline-style gate and of an exitStatus job.
  - Say what DAST cannot find, and which other tests must cover it.

sections:
  - id: intuition
    kind: intuition
    concepts: [sec-zap-scan-modes, sec-zap-alert-triage, sec-zap-gate]
    title: The idea in plain language
    body: |
      Imagine a building inspector who has never seen the architects' drawings. They walk around the outside, try every
      door and window, look at what the signs say, and note what they can see through the glass. They might find an unlocked
      back door, a sign that says exactly which alarm company the building uses, a window with no lock. They cannot tell
      you whether the vault's access list is right, because that is not visible from the street.

      That inspector is **dynamic application security testing (DAST)**: it tests the application **while it runs**, from
      the outside, with no access to the source. **OWASP ZAP** is a free scanner that does this for web applications and
      APIs. It works in two ways. **Passively**, it only *reads* the traffic that passes through it - like reading the signs.
      **Actively**, it *sends attacks* - like trying the doors. The first is polite; the second is an attack and needs the
      owner's permission, exactly like the inspector's.

      Two things make a scanner useful or useless. First, **what you do with the result**. A report of 200 alerts that
      nobody reads changes nothing. A report that has been triaged - this one is real, this one is noise, this one fails the
      build - changes what ships. Second, **what you expect from it**. A scanner finds what is *visible in requests and
      responses*. It does not know who is allowed to read whose payments. ZAP's own documentation says it plainly: logical
      vulnerabilities, such as broken access control, "will not be found by any active or automated vulnerability
      scanning", so manual testing is always needed as well.

      This lesson is about using the scanner honestly: choose the right scan, read each alert as a claim to be checked,
      and wire the result into a pipeline with a short list of hard failures.

  - id: what
    kind: what
    concepts: [sec-zap-scan-modes, sec-zap-alert-triage, sec-zap-gate]
    title: What the terms mean
    body: |
      **DAST** - testing a running application from outside, by sending requests and examining responses. It is
      *black-box*: it needs no source code. The counterpart, **SAST**, reads the source (next lesson).

      **ZAP** - the Zed Attack Proxy, an open source tool (its site calls it "ZAP by Checkmarx"). It is an intercepting
      proxy first (see the proxies lesson) and a scanner second. This lesson uses its automation-friendly parts.

      **Spider** - the crawler that follows links to discover the pages and parameters to test. The Baseline docs say the
      baseline script runs "the ZAP spider against the specified target for (by default) 1 minute".

      **Passive scan** - rules that examine every message ZAP sees and raise alerts without sending anything extra: a cookie
      without `HttpOnly`, a missing header, an error message in a page.

      **Active scan** - rules that "use known attacks against the selected targets". The Active Scan page: "Active scanning is
      an attack on those targets. You should NOT use it on web applications that you do not own."

      **The three Docker scripts** (all in ZAP's Docker images):

      | Script | What it does (from the docs) | Sends attacks? |
      | --- | --- | --- |
      | `zap-baseline.py` | Spiders (1 minute by default), waits for passive scanning, reports. "Ideal to run in a CI/CD environment, even against production sites." | No - "the script doesn't perform any actual 'attacks'" |
      | `zap-full-scan.py` | Spiders (no time limit by default), optional modern spider, then a full active scan. "Can potentially run for a long period of time." | Yes |
      | `zap-api-scan.py` | Imports an OpenAPI, SOAP or GraphQL definition, then runs an active scan "tuned to APIs, so it doesn't bother looking for things like XSSs". Has `-S` safe mode: skip the active scan and run a baseline. | Yes (not with `-S`) |

      **Alert** - "a potential vulnerability ... associated with a specific request". One rule can raise many alerts, one per
      request, so a report groups them: one alert **with several instances**.

      **Risk and confidence** - two different questions. **Risk** is how bad it would be if it were real: Informational, Low,
      Medium or High. **Confidence** is how sure ZAP is that it *is* real: False Positive, Low, Medium, High or Confirmed. The
      docs add that ZAP itself will not raise an alert with confidence False Positive or Confirmed - a person or an alert filter sets
      those.

      **Rule id and alert reference** - every rule has a numeric id (`10038`), and an alert reference is that id "optionally
      followed by a dash and the alert type" (`10038-1`). Configuration files use the plain rule id.

      **Scan policy** - which active rules run and how hard: a **threshold** (how likely ZAP is to report - Low gives more
      alerts and more false positives, High gives fewer and may miss real issues) and a **strength** (how many attacks per
      rule - Low is quicker and may miss things, "Insane" only for small parts of an application).

      **Automation Framework (AF)** - one YAML file that describes the whole run: the environment (contexts, URLs), then **jobs**
      executed top to bottom. The ZAP site calls it "the best way to automate ZAP for most people".

  - id: why
    kind: why
    concepts: [sec-zap-scan-modes, sec-zap-alert-triage, sec-zap-gate]
    title: Why use DAST, and why not trust it alone
    body: |
      **Why it earns a place**

      - **It tests the thing you deploy.** Configuration, the proxy in front of the application, the framework's defaults and
        the real headers are all in what a scanner sees. A code review sees none of them. Security misconfiguration is exactly the
        class DAST is good at.
      - **It is cheap to repeat.** A passive baseline takes minutes and needs no knowledge of the code, so it can run on every
        deployment to a staging copy and catch a header that someone removed.
      - **It is language-independent.** The same scan works on Java, PHP, Node and a vendor product you cannot read.
      - **It gives a common starting point.** A report of rule ids, CWE numbers and evidence is something developers and testers
        can both read.

      **Why not alone**

      - **It cannot see intent.** Reading another merchant's payment (IDOR), changing a price in a request, skipping a step in a
        workflow - these are valid requests with valid responses. The docs: "Manual penetration testing should always be performed in
        addition to active scanning to find all types of vulnerabilities."
      - **It sees only what it reaches.** A page behind a login it cannot perform, an API endpoint missing from the definition, a
        feature behind a flag - none of it is tested. A clean report covers the crawled surface only.
      - **It is noisy.** Rules are generic. ZAP's own solution text is generic because "ZAP does not access any source code". Some
        alerts are right and unimportant, some are wrong.
      - **Active scans change data.** Posting attack strings into forms creates records, may lock accounts, and can hurt a shared
        environment. That is why they run on a staging copy, with permission, on a schedule.

      This lesson's practice makes the first limit measurable: in the "Real output" section, fixing any one of 14 of the portal's
      17 flaws changes nothing that a passive scan of four requests reports.

  - id: modes-internals
    kind: internals
    concepts: [sec-zap-scan-modes]
    title: Inside the scans - spider, passive rules, active rules
    body: |
      **The spider feeds both kinds of scanning.** The spider requests a page, reads the links and forms in it, and requests those.
      Every response flows through ZAP's passive scanner, which runs each passive rule on it. The docs say the baseline script
      "doesn't perform any actual 'attacks'"; what it sends is a crawl. That is why they call it suitable even for production - and also
      why its reach is only what the spider found in the time it had (one minute by default).

      **Passive rules are pattern checks on messages.** In this lesson's practice you write nine of them, simplified. For example, the
      rule behind alert `10021` asks: is `X-Content-Type-Options: nosniff` present? The rule behind `10010` looks at each `Set-Cookie`: is
      the `HttpOnly` attribute there? The rule behind `90022` looks for error or stack trace text in a body. A passive rule never changes
      the request, so it cannot find a flaw that only appears when the request is *different* - an injection, for instance.

      **Active rules are experiments.** For each parameter the spider found, an active rule sends crafted values and judges the
      response. In outline (the rules differ in detail): a reflected XSS rule looks for its marker coming back unencoded; an SQL
      injection rule looks for database errors or changed behaviour. The alert then has an **attack** (the value sent) and **evidence** (the text that made ZAP suspect it). How
      many values a rule tries is its **strength**; how readily it reports is its **threshold**.

      **What decides whether a rule can see a flaw:** the flaw must change a response in a way the rule knows how to read. Open
      redirects, reflected XSS and verbose errors do. An IDOR does not: asking for `/api/payments/9` as Alice returns a perfectly
      normal `200` whether or not payment 9 is hers.

      **The API scan** changes the *discovery* step, not the testing. Instead of crawling, it imports an OpenAPI, SOAP or GraphQL
      definition so the scanner knows every endpoint and parameter - including ones no link points to - and then actively scans them.
      The docs add two scripts to it: one raises alerts for HTTP server error response codes, the other for URLs returning content
      types "not usually associated with APIs". Its coverage is only as good as the definition: an endpoint missing from the OpenAPI file
      is not tested.

      **Authentication is the usual gap.** A scan that cannot log in tests only the login page. The AF environment holds contexts,
      users and authentication methods (`manual`, `http`, `form`, `json`, `script`, `autodetect`, `browser`, `client`) and a
      verification regex for "logged in" - the part of a ZAP setup that takes the most care.

  - id: report-internals
    kind: internals
    concepts: [sec-zap-alert-triage, sec-zap-gate]
    title: Inside an alert, a report and an exit code
    body: |
      **An alert's fields** (Alerts page): *Name*, *URL*, *Risk*, *Confidence*, *Parameter* (the one attacked, empty if none),
      *Attack* (the payload; "empty for passive alerts"), *Evidence* ("a string that appears in the request or response which was
      used to help identify the alert ... empty if there is no relevant string, for example for missing security headers"), *CWE ID*,
      *WASC ID*, *Source* (the component and rule), *Alert Reference*, *Description*, *Other Info*, *Solution* and *Reference*.

      The empty evidence of a missing-header alert is not a bug: there is nothing to quote because the problem is an *absence*. The
      proof is the response itself, which you can fetch and read.

      **The Traditional JSON report** nests them: `site[]` (one per host) -> `alerts[]` (one per rule alert) -> `instances[]` (one per
      request). The documentation's sample shows an alert with `"pluginid": "40012"`, `"alertRef": "40012"`, `"riskcode": "3"`,
      `"confidence": "2"` and `"riskdesc": "High (Medium)"` - so risk code 3 is High and confidence code 2 is Medium - and instances
      with `uri`, `method`, `param`, `attack`, `evidence` and `otherinfo`. This lesson's `flatten` reads the other codes by the order of the
      documented lists (Informational, Low, Medium, High; False Positive, Low, Medium, High, Confirmed); only 3 and 2 are confirmed by the
      sample.

      **The baseline rule configuration** is a text file: `<rule id><TAB><WARN|IGNORE|FAIL>` and optionally `<TAB>(name)`, then a message
      after another tab. Lines starting with `#` are comments, and "only the rule identifiers are used - the names are just for info". A default file
      comes from `-g`. The docs: "By default all alerts found by ZAP will be treated as WARNings", and `-i` makes rules not in the file INFO.

      **Exit codes.** The baseline, full and API scripts exit `0` success, `1` at least one FAIL, `2` at least one WARN and no FAIL,
      `3` any other failure. The Automation Framework run (`-cmd -autorun`) exits `0` no errors or warnings, `1` one or more errors, `2`
      warnings and no errors. Its **exitStatus** job can set the exit from **risk levels**: with `errorLevel` or `warnLevel` set, "the job will
      report a warning or error if any alerts are raised which have the same risk level or greater".

      **Alert filters** change an alert's risk automatically - the AF `alertFilter` job takes a mandatory `ruleId`, a mandatory `newRisk`
      (`False Positive`, `Info`, `Low`, `Medium`, `High`) and optional matches on context, `url`, `parameter`, `attack` and `evidence` (each
      with a regex switch). A narrow filter ("this rule, on this URL pattern, with this evidence") records a *decision*; a bare `newRisk: False Positive`
      on a rule id silences every future instance.

  - id: when
    kind: when
    concepts: [sec-zap-scan-modes, sec-zap-gate]
    title: When to run which scan
    body: |
      | Situation | Use | Why |
      | --- | --- | --- |
      | Every pull request or deployment to a staging copy | **Baseline** (passive) | Minutes, no attacks, catches header, cookie and error regressions |
      | A new environment, before testing starts | **Baseline**, read by a human | A first map of what the app gives away |
      | Nightly or weekly against a staging copy you own | **Full scan** | Active rules find reflected XSS, injection, traversal; takes long, changes data |
      | A REST or GraphQL service with a definition | **API scan** | Covers endpoints no link points to; skips browser-only rules |
      | Production | **Baseline only**, and only with agreement | The docs call it suitable even for production; active scans on production are an incident waiting |
      | A third party's system | **Nothing**, until you hold written permission and scope | Active scanning is an attack |
      | You need to prove access control or business logic | **Manual tests** (the earlier lessons) | Scanners cannot see intent |

      Rules of thumb:

      - Start with passive; add active only where you have permission and a place where data can be thrown away.
      - Give the scan a **scope**: URLs in, URLs out. The AF environment has `includePaths` and `excludePaths` for exactly that, and the
        `activeScan` job has `maxScanDurationInMins` and `delayInMs` to limit time and strain.
      - Tell the people who watch the logs. The Active Scan page mentions a script that adds an `X-ZAP-Initiator` header to ZAP traffic,
        so your own scan is not mistaken for an attacker.
      - Run it **before** the manual test. The scanner clears the obvious, so your hours go to what only a person can find.

  - id: visual-modes
    kind: visual
    concepts: [sec-zap-scan-modes]
    title: What each Docker script does
    body: |
      ```mermaid
      flowchart LR
        T["Target URL"] --> SP["Spider - follows links"]
        SP --> PS["Passive scan - reads every response"]
        PS --> BR["Baseline scan reports here"]
        SP --> AS["Active scan - sends attacks"]
        AS --> FR["Full scan reports here"]
        DEF["API definition: OpenAPI, SOAP or GraphQL"] --> IM["Import the definition"]
        IM --> AA["Active scan tuned for APIs"]
        AA --> AR["API scan reports here"]
      ```

      Read the picture as three routes. The **baseline** route stops after passive scanning, which is why it sends nothing
      a browser would not send. The **full scan** adds the attack step after crawling. The **API scan** replaces crawling by
      importing a definition - so what it tests is *exactly what the definition lists*.

      The same picture shows where a scan can be blind: if the spider never reaches a page (login needed, no link), it is
      not in the left two routes; if an endpoint is missing from the definition, it is not in the right one.

  - id: visual-gate
    kind: visual
    concepts: [sec-zap-alert-triage, sec-zap-gate]
    title: From report to exit code
    body: |
      ```mermaid
      flowchart TD
        A["Scan report"] --> B["Group findings by rule (plugin id)"]
        B --> C{"Rule in the config?"}
        C -- "yes" --> D["Use its action"]
        C -- "no" --> E["Use the default (WARN)"]
        D --> F{"Any rule with FAIL?"}
        E --> F
        F -- "yes" --> G["Exit 1"]
        F -- "no" --> H{"Any rule with WARN?"}
        H -- "yes" --> I["Exit 2"]
        H -- "no" --> J["Exit 0"]
      ```

      Two details matter. The lookup is by **rule id**, so every instance of `10038` shares one action - the config cannot say
      "FAIL on this URL only"; that is what alert filters and triage are for. And the default is **WARN**, so a rule that ZAP adds in
      a later version appears as a warning and moves the exit code from 0 to 2 even though you changed nothing. Decide in advance
      whether exit 2 fails your pipeline.

  - id: run-output
    kind: code
    concepts: [sec-zap-scan-modes, sec-zap-alert-triage, sec-zap-gate]
    title: Real output - the three practice tools against the portal
    collapsed: true
    body: |
      Printed on 21 November 2026 by a script that runs the **solutions** of this lesson's three exercises against the loopback portal.
      The four steps are `GET /login`, `GET /search?q=sandpay`, `GET /boom` and `POST /api/login` as Alice. In the tables the base URL is
      removed, alert names are cut to 46 characters and the traceback evidence to 30, to fit.

      **1. A passive scan of the vulnerable portal** (`passive_scan`, sorted by risk):

      ```text
      Medium   10020-1  /login             Missing Anti-clickjacking Header
      Medium   10020-1  /search?q=sandpay  Missing Anti-clickjacking Header
      Medium   10038-1  /login             Content Security Policy (CSP) Header Not Set
      Medium   10038-1  /search?q=sandpay  Content Security Policy (CSP) Header Not Set
      Medium   90022    /boom              Application Error Disclosure       Traceback (most recent call la
      Low      10010    /api/login         Cookie No HttpOnly Flag            sid
      Low      10011    /api/login         Cookie Without Secure Flag         sid
      Low      10021    /api/login         X-Content-Type-Options Header Missing
      Low      10021    /boom              X-Content-Type-Options Header Missing
      Low      10021    /login             X-Content-Type-Options Header Missing
      Low      10021    /search?q=sandpay  X-Content-Type-Options Header Missing
      Low      10036-2  /api/login         Server Leaks Version Information via "Server"  SandPayPortal/0.9 Python/3.12
      Low      10036-2  /boom              Server Leaks Version Information via "Server"  SandPayPortal/0.9 Python/3.12
      Low      10036-2  /login             Server Leaks Version Information via "Server"  SandPayPortal/0.9 Python/3.12
      Low      10036-2  /search?q=sandpay  Server Leaks Version Information via "Server"  SandPayPortal/0.9 Python/3.12
      Low      10054-1  /api/login         Cookie without SameSite Attribute  sid
      ```

      Sixteen alerts from eight rules. Note the evidence: the cookie alerts say `sid` - the cookie's **name** - never its value.

      **2. The same steps after fixing `missing-headers`, `weak-session` and `verbose-errors`:**

      ```text
      Informational 10035-4  /api/login   Strict-Transport-Security Header on Plain HTTP  max-age=31536000
      Informational 10035-4  /boom        Strict-Transport-Security Header on Plain HTTP  max-age=31536000
      Informational 10035-4  /login       Strict-Transport-Security Header on Plain HTTP  max-age=31536000
      Informational 10035-4  /search?q=sandpay  Strict-Transport-Security Header on Plain HTTP  max-age=31536000
      ```

      "Fixed" is not "perfect": the fixed portal still sends HSTS over plain HTTP, which ZAP documents as alert `10035-4` - the
      same teaching point as the portal's README, now with a rule id.

      **3. Which single fix changes the passive result?** The script fixed each of the 17 flaws alone and re-ran the same four steps:

      ```text
      weak-session     alerts removed: 3
      verbose-errors   alerts removed: 1
      missing-headers  alerts removed: 12
      (the other 14 flaws, among them idor, sqli, xss-reflected, xss-stored, path-traversal, ssrf, csrf, jwt-none:   alerts removed: 0)
      3 of 17 flaws change the passive result
      ```

      A passive scan of these four requests cannot tell an IDOR, an injection or a forged JWT from a safe portal, because none of them
      changes what those four responses look like. That is not a flaw in the tool; it is what *passive* means.

      **4. Replaying the synthetic report** (`replay_report` on `sample_report`; URIs cut to 44 characters), vulnerable portal then with
      `xss-reflected` and `path-traversal` fixed:

      ```text
      vulnerable {'reproduced': 2, 'not-reproduced': 1, 'not-replayable': 3}
        40012    GET   /search?q=%3Cscript%3Ealert%281%29%3C%2Fscri reproduced
        6-1      GET   /files?name=..%2Finternal%2Fsettlement-keys. reproduced
        6-1      GET   /files?name=..%2F..%2Fetc%2Fpasswd           not-reproduced
        40014    POST  /api/notes                                   not-replayable
        10038-1  GET   /login                                       not-replayable
        10038-1  GET   /search                                      not-replayable
      fixed {'reproduced': 0, 'not-reproduced': 3, 'not-replayable': 3}
      ```

      **5. The gate** (`evaluate` with the lesson's `BASELINE_CONFIG`, on the alerts of table 1). The config sets `10010` WARN, `10011` FAIL,
      `10021` IGNORE, `10036` INFO and `10038` WARN; everything else gets the default:

      ```text
      {'10020': 'WARN', '10038': 'WARN', '90022': 'WARN', '10010': 'WARN', '10011': 'FAIL', '10021': 'IGNORE', '10036': 'INFO', '10054': 'WARN'}
      {'FAIL': 1, 'WARN': 5, 'INFO': 1, 'IGNORE': 1} exit 1
      exit_status(warn_level="Low") = 2, exit_status(error_level="Medium") = 1, exit_status(warn_level="Medium", error_level="High") = 2
      ```

      Eight rules fired (the table has 16 alerts, because a rule counts once however many pages it fires on), and the one FAIL - the cookie without
      `Secure` - sets exit code 1.

  - id: code
    kind: code
    concepts: [sec-zap-scan-modes, sec-zap-alert-triage, sec-zap-gate]
    title: The three tools, in code
    collapsed: true
    body: |
      From the solutions in `practice/security/solutions/devsecops/`. The first is the heart of a passive rule set:

      ```python
      def passive_alerts(url, status, headers, body):
          by_name = {}
          for name, value in headers:                       # a name can repeat: Set-Cookie
              by_name.setdefault(name.lower(), []).append(value)
          is_html = "text/html" in " ".join(by_name.get("content-type", [])).lower()
          csp = " ".join(by_name.get("content-security-policy", [])).lower()
          found = []
          def add(rule_id, evidence=""):
              name, risk = RULES[rule_id]
              found.append(Finding(rule_id, name, risk, url, evidence=evidence))

          if is_html and not csp:
              add("10038-1")
          if "nosniff" not in " ".join(by_name.get("x-content-type-options", [])).lower():
              add("10021")
          for cookie in by_name.get("set-cookie", []):
              cookie_name = cookie.split("=", 1)[0].strip()   # the NAME is evidence, never the value
              attrs = [a.strip().lower() for a in cookie.split(";")[1:]]
              if "httponly" not in attrs:
                  add("10010", cookie_name)
          ...
          return found
      ```

      The replay of one alert instance:

      ```python
      def replay(finding, timeout=5):
          if urllib.parse.urlsplit(finding.uri).hostname not in LOOPBACK:
              raise ValueError("loopback only")             # scope first, before anything is sent
          if not finding.attack or not finding.evidence or finding.method != "GET":
              return NOT_REPLAYABLE                         # passive alert, or a POST the report cannot rebuild
          resp = requests.get(finding.uri, timeout=timeout, allow_redirects=False)
          if resp.status_code == 200 and finding.evidence in resp.text:
              return REPRODUCED
          return NOT_REPRODUCED
      ```

      And the gate:

      ```python
      def evaluate(findings, config, default="WARN"):
          result = GateResult()
          for finding in findings:
              rule = plugin_id(finding.rule_id)             # "10038-1" -> "10038"
              result.outcomes[rule] = config.get(rule, (default, ""))[0]
          for action in result.outcomes.values():
              result.counts[action] += 1
          if result.counts["FAIL"]:
              result.exit_code = 1
          elif result.counts["WARN"]:
              result.exit_code = 2
          return result
      ```

      An Automation Framework plan, **from the docs, not run here**, assembled from keys the documentation shows (the host is the
      fictional staging name; the spider job's parameters are not shown because I did not read that page):

      ```yaml
      env:
        contexts:
          - name: sandpay-staging
            urls:
              - https://staging.sandpay.example
            includePaths:
              - https://staging.sandpay.example/.*
        parameters:
          failOnError: true
          failOnWarning: false
          progressToStdout: true
      jobs:
        - type: spider
        - type: activeScan                 # attacks the target - permission only
          parameters:
            context: sandpay-staging
            maxScanDurationInMins: 30
            delayInMs: 100
          tests:
            - name: no reflected XSS
              type: alert
              action: passIfAbsent
              scanRuleId: 40012
              onFail: error
        - type: exitStatus
          parameters:
            errorLevel: High
            warnLevel: Medium
      ```

      The `alert` test is the documented way to say "this alert must be absent": `passIfAbsent` is the default action and `onFail` is
      one of `warn`, `error` or `info`.

  - id: line-by-line
    kind: line-by-line
    concepts: [sec-zap-scan-modes, sec-zap-alert-triage, sec-zap-gate]
    title: Why the important lines are written that way
    body: |
      | Line | Why |
      | --- | --- |
      | `by_name.setdefault(name.lower(), []).append(value)` | Header names are case-insensitive and one name can repeat. A dict of lists keeps every `Set-Cookie`; a plain dict would keep the last. |
      | `is_html and not csp` | The CSP and clickjacking rules matter for pages a browser renders. A JSON `404` with no CSP is not a finding of that rule; judging it would add noise to every API response. |
      | `cookie.split("=", 1)[0]` as evidence | A report is copied into tickets and chats. The cookie *name* identifies the problem; the *value* is a live session id and must never be in it. |
      | `add("10036-2", server)` with the header value | The evidence quotes the one header that proves the finding, so a reader can check it in one request. |
      | `if hsts and url.startswith("http://")` | HSTS is ignored on plain HTTP (alert `10035-4`'s description). The header is only worth reporting when the scheme makes it useless. |
      | `ValueError` before any request in `replay` and `passive_scan` | Scope is a safety property. A tool that can be pointed anywhere eventually will be. The check comes first so nothing is sent on the way to the error. |
      | `urlsplit(...).hostname not in LOOPBACK` | A substring test such as `"127.0.0.1" in url` accepts `http://127.0.0.1.evil.example`. The parsed hostname does not. |
      | `finding.method != "GET"` returns `not-replayable` | The JSON report holds no request body, so a POST cannot be rebuilt. Saying "not replayable" is honest; sending an empty POST and calling its result "not reproduced" is not. |
      | `resp.status_code == 200 and evidence in resp.text` | A `404` page that quotes the path can contain the evidence string and still prove nothing. The status check and the body check together are the reproduction. |
      | `allow_redirects=False` | A redirect to another page changes what is judged. The replay judges the response to *this* request. |
      | `rule = plugin_id(finding.rule_id)` | The config is keyed by rule id; an alert reference carries a dash and a type. Without this line `10038-1` never matches `10038`, and every rule you set to FAIL silently falls back to WARN. |
      | `config.get(rule, (default, ""))` | The documented default. Making it a parameter is the `-i` idea: a pipeline can choose that unknown rules are INFO instead of WARN. |
      | counts per **rule**, not per finding | The baseline output counts rules (`FAIL: 0 WARN: 4 ... PASS: 22`). Three pages with a missing header are one rule to fix. |
      | `elif result.counts["WARN"]` | Exit `2` means "warnings and no failures". The order of the two tests is the whole meaning of the codes. |
      | `worst >= RISKS.index(error_level)` | "The same risk level or greater" - the comparison uses the documented order, so `Medium` also triggers on `High`. |

  - id: steps
    kind: steps
    concepts: [sec-zap-scan-modes, sec-zap-alert-triage, sec-zap-gate]
    title: A DAST run, step by step
    body: |
      1. **Get permission and scope in writing.** Which hosts, which scan types (passive only, or active too), which times, which
         accounts, who to call if something breaks.
      2. **Pick a target you can afford to attack.** A staging copy with test data, rebuilt on demand. Never a shared environment
         with real data for an active scan.
      3. **Describe the environment.** The context's URLs, include and exclude paths, and - the hard part - how the scanner logs in and
         how it can tell it is logged in. A scan that is logged out tests the login page.
      4. **Run the baseline first.** Read the whole report once as a person. It tells you what the application gives away and how noisy
         the scanner will be on this target.
      5. **Triage each alert** (next section): read the evidence, replay it, decide reproduced, not reproduced or not replayable, and note
         the risk *for this application*.
      6. **Write the rule configuration.** `FAIL` for the short list that must never ship (cookies without `Secure`, a debug page, a traceback
         in a response); `IGNORE` only with a written reason; leave the rest on `WARN`; choose the default for unknown rules.
      7. **Wire the exit code into the pipeline** and keep the HTML or JSON report as a build artifact, so a failed build comes with
         its evidence.
      8. **Add active and API scans on a schedule**, where permitted, and give them time and request limits.
      9. **Pin the scanner version.** A new ZAP release adds rules; with a default of WARN that is a new exit code. Update on purpose,
         then re-read the config.
      10. **Run the manual tests the scanner cannot** - access control, business logic, authentication flows - and turn each confirmed
          finding into an automated test (the security regression lesson).

  - id: example
    kind: example
    concepts: [sec-zap-alert-triage, sec-zap-gate]
    title: Worked example - triaging a staging scan (hypothetical)
    body: |
      This is a **hypothetical** story with invented counts, to show the thinking, not measured numbers.

      The nightly baseline of the SandPay staging site finishes with exit code 2. The team reads the report instead of re-running it.

      - **`10038-1` CSP not set, 40 instances.** One rule, one cause: the reverse proxy adds no `Content-Security-Policy` header. Real, Medium. It
        is *one* fix, not 40. Decision: set the header at the proxy; until then the rule stays WARN.
      - **`10010` cookie without `HttpOnly`, 1 instance, evidence `sid`.** Real, Low, but it is the **session cookie**. Decision: FAIL in the
        config - a session cookie readable by script is a rule this team never ships.
      - **`90022` application error disclosure, 1 instance on `/help/errors`.** The evidence is a stack trace - inside a documentation page that
        *explains* error messages. The alert's own page says it "could be a false positive if the error message is found inside a documentation
        page". Decision: an alert filter for rule 90022 limited to that URL, with the reason in the file.
      - **`10035-4` HSTS on a plain HTTP response, 3 instances, Informational.** The staging environment is served over plain HTTP behind the
        proxy. Decision: leave as INFO; revisit when staging gets TLS.
      - **`40012` reflected XSS on `/search`, High, from last week's full scan.** Before opening a ticket the tester **replays** the instance:
        the payload comes back unencoded with status 200. Reproduced. A ticket goes out with the request, the evidence and the replay.

      Next morning the pipeline has a rule file with one FAIL, a filter with a reason, and one ticket. The report did not change what shipped;
      the **decisions** did.

  - id: tests
    kind: tests
    concepts: [sec-zap-scan-modes, sec-zap-alert-triage, sec-zap-gate]
    title: Test cases with expected results and evidence
    body: |
      | # | Case | Steps | Expected | Evidence |
      | --- | --- | --- | --- | --- |
      | 1 | Permission and scope | read the agreement; list hosts, scan types, window | active scanning only where written | the agreement reference |
      | 2 | Passive baseline | run the baseline on a staging copy | completes; no attack traffic in the application log | exit code, report |
      | 3 | Reach | compare the pages the spider found with the site map | every page the test needs is in scope; gaps listed | spider output vs the map |
      | 4 | Authenticated reach | scan with a test user, then check the report holds a logged-in page | the report has authenticated URLs | one such URL in the report |
      | 5 | Known flaw is found | scan a build with a seeded reflected XSS or missing header | the matching alert appears | the alert with its evidence |
      | 6 | Known fix is quiet | scan the fixed build | the alert is gone | the second report |
      | 7 | Replay | replay each active alert instance | reproduced, not reproduced or not replayable, each recorded | the request and status |
      | 8 | Gate on a FAIL rule | introduce a response the FAIL rule matches | pipeline exit 1 and the build is red | the exit code and the log |
      | 9 | Gate on a warning | introduce a WARN-only issue | exit 2 (or as the team decided) | the exit code |
      | 10 | Config typo | misspell an action in the rule file | the run stops with an error, never a quieter gate | the error |
      | 11 | Version pin | note the scanner version in the report | version recorded; upgrade is a reviewed change | the report header |
      | 12 | What it cannot find | seed an IDOR, then scan | the scan finds nothing; a manual test finds it | both results |

      Cases 5 and 6 are the **negative control** of this lesson: a scan that fires on the vulnerable build and stays quiet on the fixed one is
      one you can believe. Case 12 is the honest one - write it into the plan so nobody reads a clean report as "secure".

  - id: mistakes
    kind: mistakes
    concepts: [sec-zap-scan-modes, sec-zap-alert-triage, sec-zap-gate]
    title: Common mistakes
    body: |
      - **Running an active scan on something you do not own or have no permission for.** It is an attack: it creates data, can lock
        accounts, and may be illegal. Permission and scope come before the first request.
      - **Running an active scan on a shared or production environment.** Use a staging copy you can reset; baseline only elsewhere, by agreement.
      - **Treating a clean report as "secure".** It means "nothing the rules know was visible on the pages reached". Access control, business
        logic and anything behind an unconfigured login are untested.
      - **Treating every alert as real.** Some are right and unimportant, some are wrong for your application. Read the evidence and replay.
      - **Treating "not reproduced" as "false positive".** It means the replay did not show it against this build. The instance may need a session,
        a body or a state the replay lacks. Say what you saw.
      - **A scan that is not logged in.** The report looks fine and covers only the public pages. Check that authenticated URLs are in the report.
      - **`IGNORE` without a reason.** Six months later nobody knows whether the rule was noise or an accepted risk. Write the reason beside the rule.
      - **A bare "False Positive" filter on a rule id.** It silences every future instance, including the real one. Match the URL, parameter and
        evidence as narrowly as you can.
      - **Looking up the config by alert reference.** The file is keyed by rule id; `10038-1` is not `10038`. Rules you meant to FAIL stay on WARN.
      - **Not pinning the version.** A ZAP upgrade adds rules; with the default WARN your pipeline changes exit code overnight.
      - **Putting a session value in the report or the ticket.** Report the cookie name and the header, not the secret.
      - **Fixing 40 instances.** One missing header at the proxy is one fix. Group by rule and cause before you create tickets.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [sec-zap-scan-modes, sec-zap-alert-triage, sec-zap-gate]
    title: Limits, trade-offs and alternatives
    body: |
      - **Passive versus active.** Passive is safe and fast and finds configuration and disclosure problems; active finds injection-class
        flaws but attacks the target, takes long and changes data. Run passive often, active rarely and carefully.
      - **Threshold and strength.** Lower thresholds find more and raise more false positives; higher strengths try more payloads and run longer
        (the docs say "Insane" is for small parts of an application only). Tune per area, not globally.
      - **Config file versus risk levels.** A rule configuration says "FAIL on **this rule**"; the `exitStatus` job says "fail at **this risk or
        higher**". The first is precise and needs upkeep; the second is simple and breaks when a new rule appears at that risk.
      - **Failing the build.** A gate that fails on every Low alert is turned off within a month. One that fails on a short, justified list stays.
      - **Baseline script versus Automation Framework.** The scripts are quick to start; the framework, which the docs call the best way to
        automate ZAP for most people, gives one reviewable YAML file with environment, jobs and tests. A plan can express more than the flags can.
      - **ZAP versus the alternatives.** Burp Suite and commercial DAST tools have their own scanners; the idea of this lesson - scope,
        passive before active, triage, gate - carries over. This lesson describes only ZAP and does not compare them.
      - **DAST versus SAST versus SCA.** DAST sees the deployed system but not the code; SAST sees the code but not the deployment; dependency
        scanning sees known-vulnerable libraries. Each misses what the others find (the next lessons).
      - **Coverage is bounded by discovery.** The spider and the API definition decide what is tested. A clean report on a thin crawl is not
        evidence of safety.
      - **Replay is evidence for one moment.** It shows the claim true or not on this build, with these inputs. It does not prove the application
        has no other instance.

  - id: summary
    kind: summary
    concepts: [sec-zap-scan-modes, sec-zap-alert-triage, sec-zap-gate]
    title: Summary
    body: |
      - **DAST** tests a running application from outside. **ZAP** does it **passively** (reads responses, safe) and **actively** (sends attacks, needs
        written permission).
      - **Baseline** = spider plus passive, "even against production sites" per the docs; **full scan** = spider plus active; **API scan** = import a
        definition plus a scan tuned to APIs. Coverage equals what the spider or the definition reached.
      - DAST sees what changes a response: headers, cookies, errors, reflected input. It does **not** see broken access control or business logic - the docs
        say no automated scan will, so test those by hand.
      - An alert is a **claim** with a rule, a **risk** (how bad) and a **confidence** (how sure), and for active rules an **attack** and **evidence**. Missing-
        header alerts have no evidence because the problem is an absence.
      - **Replay** an instance and record **reproduced**, **not reproduced** or **not replayable**. Never write "false positive" for "not reproduced".
      - The baseline config sets a rule to **FAIL**, **WARN**, **INFO** or **IGNORE** by **rule id**; the default is **WARN**; exit codes are **0**, **1** (a FAIL),
        **2** (WARN and no FAIL). The AF `exitStatus` job sets the code from a **risk level or greater**.
      - A gate is useful when it fails on a **short justified list**, pins the scanner version, treats a config typo as an error, and keeps the report as evidence.
      - Run every check against the vulnerable build **and** the fixed one - the quiet result is what makes the loud one believable.

exercises:
  - id: zp-which-scan
    type: mcq
    concept: sec-zap-scan-modes
    skill: application
    title: Which scan on every pull request?
    prompt: |
      Your team wants a security check on every pull request, against a staging copy that is rebuilt for each one. It must finish in minutes
      and must not attack anything. Which ZAP Docker script fits?
    options:
      - id: baseline
        text: "`zap-baseline.py` - it spiders briefly and waits for passive scanning, and sends no attacks."
        feedback: "Correct. The docs describe it as ideal for CI/CD, with no actual attacks and a few minutes at most."
      - id: full
        text: "`zap-full-scan.py` - it is the most thorough."
        feedback: "The full scan runs an active scan and can take a long time. It is for a scheduled run against a copy you own."
      - id: api
        text: "`zap-api-scan.py` - every project has an API."
        feedback: "The API scan imports a definition and then actively scans it. It sends attacks and is not the quick passive check you asked for."
      - id: none
        text: "None - DAST cannot run in a pipeline."
        feedback: "The baseline script is designed for exactly that."
    correct: [baseline]
    hints:
      - "Which script sends no attacks?"
      - "Which one is described as suitable for CI/CD?"
    solution: |
      The baseline scan: spider for a short time, wait for passive scanning, report. It sends nothing a browser would not, finishes in minutes, and is documented
      as suited to CI/CD.

  - id: zp-passive-attack
    type: mcq
    concept: sec-zap-scan-modes
    skill: recognition
    title: Does passive mean harmless?
    prompt: |
      A colleague says "passive scanning cannot hurt anything, so we can point ZAP at any website we like". What is the right correction?
    options:
      - id: scope
        text: "Passive scanning reads responses and sends no attack payloads, but the spider still sends requests to the target, so you still need permission and a scope for what you crawl."
        feedback: "Correct. The spider's crawl is real traffic. Passive is gentler than active, not permission-free."
      - id: agree
        text: "They are right - passive scanning sends nothing."
        feedback: "The spider is part of the baseline scan and it requests pages. Nothing is attacked, but the target is still being visited."
      - id: active
        text: "Passive scanning is just as dangerous as active scanning."
        feedback: "It is not - no attack payloads are sent. The point is that gentler is not the same as permitted."
    correct: [scope]
    hints:
      - "What does the spider do to the target?"
    solution: |
      Passive rules only read, and the baseline sends no attacks, but the spider requests pages. Use only targets you own or may test, and agree the scope.

  - id: zp-permission
    type: mcq
    concept: sec-zap-scan-modes
    skill: application
    title: A partner's site and a full scan
    prompt: |
      A partner company says "go ahead and have a look at our test site". You have an email saying that. You want to run `zap-full-scan.py` against
      it tonight. What do you do first?
    options:
      - id: scope-first
        text: "Ask for written scope: which hosts, that active scanning is allowed, the time window and a contact. Then run it inside that scope."
        feedback: "Correct. 'Have a look' is not clear permission for an active scan, which is an attack."
      - id: run-it
        text: "Run it - the email is permission."
        feedback: "An informal 'have a look' does not say that attacks, data creation and load are allowed. Get scope in writing."
      - id: baseline-only-prod
        text: "Run it on their production site instead, because the test site may be slow."
        feedback: "Moving an active scan to production is worse. Never do that without an explicit agreement."
      - id: fewer-requests
        text: "Run it but with a low strength so it is polite."
        feedback: "A lower strength sends fewer attacks, not no attacks. Permission still comes first."
    correct: [scope-first]
    hints:
      - "What does the Active Scan page say about applications you do not own?"
    solution: |
      Active scanning is an attack on the target. Get written scope - hosts, scan types, window, contact - before sending a single request, and stay inside it.

  - id: zp-logic-gap
    type: mcq
    concept: sec-zap-scan-modes
    skill: analysis
    title: What the scan cannot find
    prompt: |
      The full scan of SandPay staging finishes with no High alerts. A tester then logs in as Alice, requests `/api/payments/2` (which belongs to Bob), and
      receives it. Why did the scan not report this?
    options:
      - id: logic
        text: "The request and response are valid and normal; the flaw is that Alice may not read Bob's payment. That depends on intent, which automated scanners cannot judge - the docs say broken access control will not be found by automated scanning."
        feedback: "Correct. A 200 with a payment body looks the same whether or not the payment is the caller's."
      - id: strength
        text: "The scan strength was too low - raise it to Insane."
        feedback: "More attacks do not help: the scanner has no way to know that payment 2 is not Alice's."
      - id: bug
        text: "ZAP has a bug in its IDOR rule."
        feedback: "No scanner rule can decide ownership without knowing who owns what."
      - id: permission
        text: "The scan was passive."
        feedback: "A full scan is active. The limit is not the scan type; it is that the flaw needs an understanding of intent."
    correct: [logic]
    hints:
      - "Does a response to /api/payments/2 look different if it is Bob's?"
    solution: |
      IDOR and other access-control or business-logic flaws are valid requests with valid responses. Only a test that knows who owns what can see them, which is why manual and
      scripted access-control tests are needed beside DAST.

  - id: zp-risk-conf
    type: mcq
    concept: sec-zap-alert-triage
    skill: recognition
    title: Risk or confidence?
    prompt: |
      An alert is shown as "High (Low)" - risk High, confidence Low. What does that tell you?
    options:
      - id: serious-unsure
        text: "If it is real it would be serious, but ZAP is not very sure it is real - so check it before anything else."
        feedback: "Correct. Risk is the impact if real; confidence is how sure the rule is."
      - id: serious-sure
        text: "It is a serious flaw and ZAP is confident."
        feedback: "That would be High (High). The second word is the confidence, which is Low here."
      - id: minor
        text: "It is a minor issue."
        feedback: "The first word is the risk, and it is High."
      - id: fp
        text: "It is a false positive."
        feedback: "ZAP does not itself raise False Positive confidence - a person or filter sets that. Low confidence means unsure, not wrong."
    correct: [serious-unsure]
    hints:
      - "Risk answers 'how bad'. Confidence answers 'how sure'."
    solution: |
      Risk is how bad it would be if real (High); confidence is how sure the rule is that it is real (Low). A High risk with Low confidence is a priority to verify.

  - id: zp-evidence-empty
    type: mcq
    concept: sec-zap-alert-triage
    skill: analysis
    title: Why is the evidence empty?
    prompt: |
      Alert `10021` (X-Content-Type-Options Header Missing) shows an empty **Evidence** field and an empty **Attack** field. A junior tester says the alert is broken. What is the answer?
    options:
      - id: absence
        text: "It is a passive alert about something missing. There is no attack, and the docs say evidence is empty when there is no relevant string, such as for missing security headers - the proof is the response without the header."
        feedback: "Correct. You verify it by fetching the response and checking the header is not there."
      - id: broken
        text: "The alert is broken and should be ignored."
        feedback: "Empty evidence is normal for an absence."
      - id: rerun
        text: "Re-run the scan with a higher strength to fill in the evidence."
        feedback: "Strength applies to active rules. There is nothing to attack and nothing to quote here."
      - id: confirmed
        text: "Empty evidence means the confidence is Confirmed."
        feedback: "It does not. The two fields are unrelated."
    correct: [absence]
    hints:
      - "How would you quote something that is not there?"
    solution: |
      Passive alerts have no attack, and an alert about an absent header has no string to quote. The response itself is the evidence - fetch it and look.

  - id: zp-not-repro
    type: mcq
    concept: sec-zap-alert-triage
    skill: analysis
    title: The replay does not reproduce
    prompt: |
      A scan report lists a reflected XSS on `/search?q=...`. You replay the instance against the current build and the payload comes back HTML-encoded. What do you write?
    options:
      - id: not-reproduced
        text: "Not reproduced on build X with this request (encoded output, status 200). Check whether the report came from an older build or the instance needs a session or state before closing it."
        feedback: "Correct. It states what you saw and what you have not ruled out."
      - id: fp
        text: "False positive - closed."
        feedback: "That claims more than you know. The alert may predate a fix, or the replay may lack a cookie."
      - id: reproduced
        text: "Reproduced - the payload came back."
        feedback: "It came back encoded, which is the safe behaviour, not the flaw."
      - id: ignore
        text: "Ignore the rule from now on."
        feedback: "A global ignore would also hide a real instance later."
    correct: [not-reproduced]
    hints:
      - "What do you actually know after one replay?"
    solution: |
      Record what happened - not reproduced on this build with this request - and note what could explain it (older build, missing session). 'False positive' is a stronger claim than a single replay supports.

  - id: zp-exit-codes
    type: mcq
    concept: sec-zap-gate
    skill: recognition
    title: What does exit code 2 mean?
    prompt: |
      `zap-baseline.py` exits with code 2. What happened?
    options:
      - id: warn
        text: "At least one rule was a WARN and no rule was a FAIL."
        feedback: "Correct. The docs: 0 success, 1 at least one FAIL, 2 at least one WARN and no FAILs, 3 any other failure."
      - id: fail
        text: "At least one rule was a FAIL."
        feedback: "A FAIL gives exit code 1."
      - id: crash
        text: "ZAP crashed."
        feedback: "Other failures give exit code 3."
      - id: clean
        text: "The scan was clean."
        feedback: "A clean scan exits 0."
    correct: [warn]
    hints:
      - "Which code is for a FAIL?"
    solution: |
      Exit 2 means at least one WARN and no FAIL. FAIL is 1, success is 0, any other failure is 3.

  - id: zp-new-rule
    type: mcq
    concept: sec-zap-gate
    skill: analysis
    title: The pipeline turned red overnight
    prompt: |
      Nobody changed the application or the rule file, but the nightly baseline now exits 2 instead of 0. The only change is that the pipeline pulled a newer ZAP image. What is the most likely cause and the right response?
    options:
      - id: new-rule
        text: "The newer version added a rule that is not in your file, so it takes the default WARN. Read the new alert, then decide its action; pin the image version so upgrades are deliberate."
        feedback: "Correct. Rules missing from the file default to WARN, and WARN moves the exit code to 2."
      - id: broken
        text: "The new image is broken - go back to the old one and forget it."
        feedback: "That hides the new alert, which may be real. Read it first."
      - id: ignore-all
        text: "Set every rule to IGNORE so it cannot happen again."
        feedback: "That removes the gate altogether."
      - id: nothing
        text: "Exit code 2 is not a failure so no action is needed."
        feedback: "Whether exit 2 fails the pipeline is your decision; an unread new warning is how real findings get missed."
    correct: [new-rule]
    hints:
      - "What happens to a rule that is not in the config file?"
    solution: |
      A rule that is not in the file uses the default, WARN, which moves the exit code to 2. Read the alert, set its action on purpose, and pin the image version so that upgrades are reviewed.

  - id: zp-threshold
    type: mcq
    concept: sec-zap-scan-modes
    skill: application
    title: Lowering the threshold
    prompt: |
      An active scan misses an issue you know exists, so a teammate lowers the alert threshold of the rule from Medium to Low. What should you expect?
    options:
      - id: more-fp
        text: "More potential issues are raised, which may include more false positives. Low also reports more readily, so a missed real issue may now appear."
        feedback: "Correct. The Scan Policy page says Low raises more potential issues and may increase false positives; High raises fewer and may miss real ones."
      - id: fewer
        text: "Fewer alerts and fewer false positives."
        feedback: "That is the effect of a High threshold."
      - id: faster
        text: "A faster scan."
        feedback: "Threshold controls how readily a rule reports, not how many attacks it sends. Strength does that."
      - id: attacks
        text: "More attack payloads per parameter."
        feedback: "That is strength, a separate setting."
    correct: [more-fp]
    hints:
      - "Threshold controls reporting; strength controls the number of attacks."
    solution: |
      A lower threshold makes a rule report more readily: more potential issues, more false positives, fewer misses. Strength is the separate control for how many attacks a rule sends.

  - id: zp-api-scan
    type: mcq
    concept: sec-zap-scan-modes
    skill: application
    title: Scanning a REST API
    prompt: |
      SandPay has a REST API described by an OpenAPI file, and no web pages. Some endpoints have no links pointing to them. Which approach covers them?
    options:
      - id: api-scan
        text: "The API scan with `-f openapi`: it imports the definition so every listed endpoint is known, then runs an active scan tuned to APIs."
        feedback: "Correct. Discovery comes from the definition, not from crawling - so an endpoint missing from the definition would still be untested."
      - id: baseline
        text: "The baseline scan, which will find every endpoint by spidering."
        feedback: "A spider follows links; endpoints with no links, and APIs with no pages, are not found."
      - id: full
        text: "The full scan with a longer spider time."
        feedback: "More crawl time does not discover an endpoint that nothing links to."
      - id: no
        text: "DAST cannot test APIs."
        feedback: "The API scan exists for this."
    correct: [api-scan]
    hints:
      - "Where does the API scan get its list of endpoints?"
    solution: |
      The API scan imports an OpenAPI, SOAP or GraphQL definition and actively scans what it lists. Its coverage is the definition's coverage.

  - id: zp-order
    type: order
    concept: sec-zap-gate
    skill: application
    title: Put a DAST rollout in order
    prompt: Put the steps of introducing ZAP into a delivery pipeline in a sensible order.
    items:
      - id: permission
        text: Get written permission and scope for the target and the scan types
      - id: environment
        text: Point the scan at a staging copy with test accounts and define its scope
      - id: baseline
        text: Run the passive baseline first and read the whole report
      - id: triage
        text: Triage each alert by its evidence, a replay, and its risk for this application
      - id: config
        text: Write the rule file with FAIL for what must never ship and a reason beside every IGNORE
      - id: gate
        text: Wire the exit code into the pipeline and keep the report as an artifact
      - id: active
        text: Add scheduled active or API scans where permitted, with time and request limits
    hints:
      - "Permission and scope come before any request."
      - "You cannot write a sensible rule file before you have read a report."
    solution: |
      Permission and scope, a safe environment, the baseline, triage, the rule file, the pipeline gate, then scheduled active and API scans.

  - id: zp-debug
    type: debug
    concept: sec-zap-gate
    skill: analysis
    title: Which line makes every FAIL rule quietly WARN?
    prompt: |
      A team's gate never fails even though the rule file says `10038 FAIL`. The report contains alert `10038-1`. Pick the line responsible.
    language: python
    code: |
      def gate(findings, config):
          worst = "OK"
          for f in findings:
              action = config.get(f.rule_id, "WARN")
              if action == "FAIL":
                  return 1
              if action == "WARN":
                  worst = "WARN"
          return 2 if worst == "WARN" else 0
    correctLines: [4]
    hints:
      - "What key does the config use, and what key is the lookup using?"
      - "An alert reference carries a dash and a type."
    lineNotes:
      - line: 2
        note: "Starting from OK and raising it is a fine way to track the worst action."
      - line: 5
        note: "Returning at the first FAIL is correct once the action is right."
      - line: 9
        note: "The mapping of WARN to 2 and everything else to 0 follows the documented exit codes."
    solution: |
      Line 4 looks up `f.rule_id`, which is `10038-1`, but the file is keyed by rule id `10038`. The lookup misses, falls back to `"WARN"`, and the FAIL never applies. Look up
      `f.rule_id.split("-")[0]`.

  - id: zp-short
    type: short
    concept: sec-zap-alert-triage
    skill: analysis
    title: A clean report
    prompt: |
      A manager says "the ZAP baseline report is clean, so the application is secure". In three or four sentences, explain what is wrong with that.
    modelAnswer: |
      A clean baseline report means that none of ZAP's passive rules matched on the pages the spider reached in the time it had. It sends no attacks, so it cannot find injection-class flaws, and
      scanners cannot judge intent, so they miss broken access control and business logic whatever their mode. The spider may also not have reached pages behind a login or without links, so the
      untested part is unknown. It is a useful baseline of what the application gives away, not a security verdict.
    rubric:
      - Says a clean report covers only what the rules know and the spider reached.
      - Says passive scans send no attacks, so they cannot find flaws that need a changed request.
      - Says access control and business logic need other tests.
    hints:
      - "Think about what the scan reached, what it sends, and what it cannot judge."
    solution: A clean baseline means no passive rule matched on the pages reached; it sends no attacks, misses intent-based flaws, and may not have reached the login-protected surface.

  - id: zp-testdesign
    type: testdesign
    concept: sec-zap-gate
    skill: application
    title: Plan DAST for SandPay
    prompt: |
      SandPay has a web portal, a REST API with an OpenAPI file, and a staging environment that is rebuilt nightly from a clean database. The release pipeline runs on every merge. Design the DAST
      plan: which scans, where, how often, how results are triaged and what fails the build.
    modelAnswer: |
      Preconditions: written scope that names the staging hosts and allows active scanning there; test accounts (one merchant, one admin) and a way for the scanner to log in with a
      verification check; production is out of scope for active scans.

      1. **Every merge - baseline.** Spider the portal for a few minutes against staging, passive only. Exit code feeds the pipeline; the JSON and HTML reports are kept as artifacts. A rule file
         sets FAIL for session cookies without `Secure` or `HttpOnly`, tracebacks in responses and a missing CSP on authenticated pages; everything else WARN; unknown rules INFO until read.
      2. **Nightly - API scan.** Import the OpenAPI file, scan the rebuilt staging API with the merchant user, with a request delay and a duration limit. Because staging is rebuilt, data
         created by attacks is thrown away.
      3. **Weekly - full scan of the portal.** Active scan with a policy tuned per area (higher strength on search and file endpoints, lower elsewhere), with the scope limited to the staging host.
      4. **Triage.** A person reads each new alert: evidence, replay (reproduced, not reproduced, not replayable), risk for SandPay. Real findings become tickets, one per cause. Noise gets a narrow
         alert filter with a reason.
      5. **Gate.** Exit 1 fails the build; exit 2 posts the report and does not fail until the team decides. The ZAP image version is pinned and upgraded in its own reviewed change.
      6. **What it does not cover.** Access control, IDOR and business logic stay with manual and scripted API tests; the plan lists them so a clean report is not read as "secure".
    rubric:
      - Uses a passive baseline on every merge and active or API scans on a schedule, only on a staging copy.
      - States permission and scope, authentication and a verification check.
      - Defines triage (evidence, replay, risk) and narrow filters with reasons.
      - Defines what fails the build and pins the scanner version.
      - Names what DAST will not find and which tests cover it.
    hints:
      - "Think in layers - frequency, scan type, environment, triage, gate."
      - "End with what the plan does not cover."
    solution: Baseline on every merge, API scan nightly and a full scan weekly on the rebuilt staging copy with permission, a logged-in scanner, triage by evidence and replay, a short FAIL list with the version pinned, and manual tests for what DAST cannot see.

  - id: zp-interview
    type: interview
    concept: sec-zap-scan-modes
    skill: analysis
    title: 'Interview: how would you introduce ZAP into CI?'
    prompt: '"We have a CI pipeline and no automated security testing. How would you introduce OWASP ZAP?"'
    modelAnswer: |
      I would start by agreeing scope and permission, because active scanning is an attack, and by choosing a staging copy that can be rebuilt. Then I would add the **baseline** scan to the
      pipeline: it spiders briefly and runs passive rules only, sends no attacks, and ZAP's documentation calls it suitable for CI. Before gating anything I read the first reports myself and triage each
      alert - read the evidence, replay it against the build, note the risk for our application - because scanner rules are generic and some alerts are noise.

      Then I would write the rule configuration: FAIL for a short list we never ship, such as session cookies without Secure, a traceback in a response; IGNORE only with a written reason; WARN for the rest,
      with a considered default for rules the file does not list. The pipeline reads the exit code (0, 1 for a FAIL, 2 for warnings) and keeps the report as an artifact. I would pin the ZAP version so an upgrade does
      not change the verdict overnight.

      Later I would add an API scan from the OpenAPI definition and a scheduled full scan on the staging copy. And I would say clearly what none of it covers: access control and business logic need manual and scripted tests, so a
      clean report is never presented as "secure".
    rubric:
      - Starts with permission, scope and a safe environment.
      - Chooses the passive baseline for CI and explains why.
      - Describes triage (evidence, replay) before gating.
      - Describes the rule file, default, exit codes, report artifacts and version pinning.
      - States the limits - access control and business logic are not covered.
    followUps:
      - How would you scan a part of the application behind a login?
      - What would you do about a rule that is wrong for your application?
      - How is DAST different from SAST?
    hints:
      - "Structure it as scope, baseline, triage, gate, later scans, limits."
    solution: Scope and permission, baseline in CI, triage before gating, a rule file with a short FAIL list and a pinned version, API and full scans later, and a clear statement of what DAST cannot find.

  - id: zp-passive-code
    type: coding
    concept: sec-zap-scan-modes
    skill: application
    title: Write the passive rules and the scanner
    prompt: |
      In `practice/security/exercises/devsecops/zap_passive.py`, implement `passive_alerts` (nine simplified passive rules on one recorded response) and `passive_scan` (fetch the steps you are given and judge every
      response). The tests run it against the loopback portal: the vulnerable portal must raise eight rules, the portal with `missing-headers`, `weak-session` and `verbose-errors` fixed must raise only the HSTS-on-HTTP note,
      a cookie's value must never appear as evidence, and a host that is not loopback must be refused before anything is sent.
    project: security
    files: [exercises/devsecops/zap_passive.py]
    test: tests/devsecops/test_zap_passive.py
    command: .venv/bin/python -m pytest tests/devsecops/test_zap_passive.py
    modelAnswer: |
      ```python
      by_name = {}
      for name, value in headers:
          by_name.setdefault(name.lower(), []).append(value)
      is_html = "text/html" in " ".join(by_name.get("content-type", [])).lower()
      csp = " ".join(by_name.get("content-security-policy", [])).lower()

      if is_html and not csp:
          add("10038-1")
      if is_html and not (by_name.get("x-frame-options") or "frame-ancestors" in csp):
          add("10020-1")
      if "nosniff" not in " ".join(by_name.get("x-content-type-options", [])).lower():
          add("10021")
      # server digit, HSTS on http://, each Set-Cookie's attributes, a traceback in the body
      ```

      `passive_scan` checks `is_loopback(base_url)` first, sends each step with `requests.request`, collects `Set-Cookie` with `resp.raw.headers.getlist`, drops repeats of the same (rule, url, evidence) and sorts by
      `-RISKS.index(risk)`, rule id and url.
    rubric:
      - Every test in tests/devsecops/test_zap_passive.py passes.
      - Header names are matched case-insensitively and repeated names are kept.
      - Cookie evidence is the cookie name, never the value.
      - A non-loopback host raises ValueError before any request is sent.
      - The result is sorted by risk, then rule id, then URL, with no repeats.
    hints:
      - "Group the headers into a dict of lists first; then every rule is a small if."
      - "For cookies, split on ';' and look at the attributes after the first one."
      - "Use the is_loopback helper at the very top of passive_scan."
    solution: Group headers by lower-cased name, apply the nine rules with Finding(rule_id, name, risk, url, evidence), and in passive_scan check loopback first, fetch each step, collect Set-Cookie with getlist, de-duplicate and sort by risk.

  - id: zp-replay-code
    type: coding
    concept: sec-zap-alert-triage
    skill: application
    title: Read a ZAP-style report and replay it
    prompt: |
      In `practice/security/exercises/devsecops/zap_replay.py`, implement `flatten`, `replay`, `replay_report` and `summarise`. `flatten` reads the traditional JSON shape (`site[].alerts[].instances[]`) into one `Finding` per instance, mapping risk
      and confidence codes by the documented order. `replay` re-sends an instance and returns reproduced, not-reproduced or not-replayable, and refuses a non-loopback host first. Against the vulnerable portal two alerts reproduce and one stale one does not;
      against the fixed one nothing reproduces.
    project: security
    files: [exercises/devsecops/zap_replay.py]
    test: tests/devsecops/test_zap_replay.py
    command: .venv/bin/python -m pytest tests/devsecops/test_zap_replay.py
    modelAnswer: |
      ```python
      def replay(finding, timeout=5):
          if urllib.parse.urlsplit(finding.uri).hostname not in LOOPBACK:
              raise ValueError("loopback only")
          if not finding.attack or not finding.evidence or finding.method != "GET":
              return NOT_REPLAYABLE
          resp = requests.get(finding.uri, timeout=timeout, allow_redirects=False)
          if resp.status_code == 200 and finding.evidence in resp.text:
              return REPRODUCED
          return NOT_REPRODUCED
      ```

      `flatten` loops site, alerts and instances with `.get(..., [])`, takes `alertRef` (falling back to `pluginid`), `RISKS[int(riskcode)]` and `CONFIDENCES[int(confidence)]`. `summarise` starts from all three keys at zero.
    rubric:
      - Every test in tests/devsecops/test_zap_replay.py passes.
      - flatten gives one Finding per instance, using alertRef with a pluginid fallback.
      - replay checks the host first, treats passive and non-GET instances as not-replayable, and needs both status 200 and the evidence in the body.
      - summarise always returns all three keys.
    hints:
      - "The host check comes before every other branch, including the not-replayable ones."
      - "A 404 page can contain your evidence string; check the status too."
      - "Use .get(key, []) so an empty report does not raise."
    solution: Flatten the three nested lists into Findings, replay with loopback check first then not-replayable cases then a GET that needs 200 and the evidence, and count three outcomes in summarise.

  - id: zp-gate-code
    type: coding
    concept: sec-zap-gate
    skill: application
    title: Build the gate
    prompt: |
      In `practice/security/exercises/devsecops/zap_gate.py`, implement `parse_rule_config`, `evaluate` and `exit_status`. The parser reads a baseline-style rule file (id, action, optional name and message; `#` comments) and rejects an unknown action.
      `evaluate` looks rules up by plugin id with a default, counts rules not findings, and returns exit 1 for a FAIL, 2 for a WARN and no FAIL, 0 otherwise. `exit_status` follows the exitStatus job: a risk level or greater makes an error or a warning.
    project: security
    files: [exercises/devsecops/zap_gate.py]
    test: tests/devsecops/test_zap_gate.py
    command: .venv/bin/python -m pytest tests/devsecops/test_zap_gate.py
    modelAnswer: |
      ```python
      def evaluate(findings, config, default="WARN"):
          if default not in ACTIONS:
              raise ValueError(default)
          result = GateResult()
          for finding in findings:
              rule = plugin_id(finding.rule_id)
              result.outcomes[rule] = config.get(rule, (default, ""))[0]
          for action in result.outcomes.values():
              result.counts[action] += 1
          if result.counts["FAIL"]:
              result.exit_code = 1
          elif result.counts["WARN"]:
              result.exit_code = 2
          return result
      ```

      `parse_rule_config` splits each non-comment line on tabs: column 0 is the id, column 1 the upper-cased action (checked against `ACTIONS`), column 3 the message. `exit_status` finds the worst risk with `RISKS.index` and compares it with the two levels.
    rubric:
      - Every test in tests/devsecops/test_zap_gate.py passes.
      - The config lookup uses the plugin id, so 10038-1 matches a 10038 line.
      - Rules are counted once however many findings they have, and exit codes are 1, 2 and 0 in that order of precedence.
      - A bad action, a short line, an unknown default or an unknown risk level raises ValueError.
    hints:
      - "plugin_id is already written - use it for the lookup."
      - "Check FAIL before WARN when you pick the exit code."
      - "RISKS.index(level) gives you an order to compare risks."
    solution: Parse tab-separated lines into (action, message) with validation, look rules up by plugin id with the default, count per rule and return 1, 2 or 0, and compare the worst RISKS index with the warn and error levels in exit_status.

placement:
  - id: zp-place-modes
    type: mcq
    concept: sec-zap-scan-modes
    skill: application
    title: Which scan sends attacks?
    prompt: |
      Which pair of ZAP Docker scripts sends attack payloads at the target by default?
    options:
      - id: full-api
        text: "`zap-full-scan.py` and `zap-api-scan.py`."
        feedback: "Correct. Both run an active scan; the API scan's `-S` safe mode skips it."
      - id: baseline-full
        text: "`zap-baseline.py` and `zap-full-scan.py`."
        feedback: "The baseline script sends no attacks."
      - id: baseline-api
        text: "`zap-baseline.py` and `zap-api-scan.py`."
        feedback: "The baseline script sends no attacks; only the API scan does of that pair."
    correct: [full-api]
    solution: The full scan and the API scan run an active scan. The baseline scan only spiders and scans passively.

  - id: zp-place-triage
    type: mcq
    concept: sec-zap-alert-triage
    skill: analysis
    title: Which outcome for a POST instance?
    prompt: |
      An alert instance in the JSON report is a `POST` to `/api/notes` with an attack string and evidence. The report holds no request body. What does a replay tool honestly report?
    options:
      - id: not-replayable
        text: "Not replayable - the request cannot be rebuilt from the report, so no verdict is given."
        feedback: "Correct. Sending an invented body and reporting 'not reproduced' would be a guess presented as a result."
      - id: not-reproduced
        text: "Not reproduced - the replay returned nothing."
        feedback: "A replay that never sent the real request has not tested the claim."
      - id: reproduced
        text: "Reproduced - the report says so."
        feedback: "The report is the claim, not the proof."
    correct: [not-replayable]
    solution: A POST whose body is not in the report cannot be rebuilt, so the honest outcome is not-replayable, to be checked another way.

  - id: zp-place-gate
    type: mcq
    concept: sec-zap-gate
    skill: application
    title: Which config lookup works?
    prompt: |
      The rule file contains `10038<TAB>FAIL`. Which lookup key makes the gate fail for the alert reference `10038-1`?
    options:
      - id: plugin
        text: "The rule id - the part before the dash, `10038`."
        feedback: "Correct. Config lines use the rule id; the alert reference adds a dash and a type."
      - id: ref
        text: "The full alert reference, `10038-1`."
        feedback: "That key is not in the file, so the default WARN applies and the FAIL never fires."
      - id: name
        text: "The alert name."
        feedback: "The docs say only the rule identifiers are used; the names are for people."
    correct: [plugin]
    solution: Look up the rule id, the text before the dash. The full reference and the name do not match the file.

recall:
  - id: zp-recall-modes
    concept: sec-zap-scan-modes
    prompt: What do the baseline, full and API scans each do, and which send attacks?
    answer: Baseline = spider (1 minute by default) plus passive scan, no attacks. Full scan = spider plus a full active scan, sends attacks. API scan = import an OpenAPI, SOAP or GraphQL definition, then an active scan tuned to APIs, sends attacks (-S skips it).
  - id: zp-recall-permission
    concept: sec-zap-scan-modes
    prompt: What does the ZAP Active Scan page say about who you may scan?
    answer: Active scanning is an attack on the targets, and you should NOT use it on web applications that you do not own. Get written permission and scope first.
  - id: zp-recall-limit
    concept: sec-zap-scan-modes
    prompt: What can automated scanners not find, according to the Active Scan page?
    answer: Logical vulnerabilities, such as broken access control, will not be found by any active or automated scanning, so manual penetration testing is needed as well.
  - id: zp-recall-risk
    concept: sec-zap-alert-triage
    prompt: How do risk and confidence differ?
    answer: Risk (Informational, Low, Medium, High) is how bad it would be if real; confidence (False Positive, Low, Medium, High, Confirmed) is how sure ZAP is that it is real.
  - id: zp-recall-outcomes
    concept: sec-zap-alert-triage
    prompt: What are the three outcomes of replaying an alert instance?
    answer: Reproduced (the evidence came back on this build), not reproduced (it did not - not the same as false positive) and not replayable (a passive alert or a request the report cannot rebuild).
  - id: zp-recall-exit
    concept: sec-zap-gate
    prompt: What do the baseline script's exit codes 0, 1, 2 and 3 mean?
    answer: 0 success, 1 at least one FAIL, 2 at least one WARN and no FAIL, 3 any other failure. By default every alert is a WARN unless the rule file says otherwise.
  - id: zp-recall-config
    concept: sec-zap-gate
    prompt: How is the rule file keyed, and what is the default action?
    answer: By rule id (an alert reference like 10038-1 is rule id 10038 plus a dash and a type). Rules not in the file default to WARN (INFO with the -i option).
  - id: zp-recall-exitstatus
    concept: sec-zap-gate
    prompt: What does the Automation Framework exitStatus job do?
    answer: It sets ZAP's exit code from results - with warnLevel or errorLevel set, any alert of that risk or greater makes the plan report a warning or an error - and lets you override the exit values (defaults 0 ok, 1 error, 2 warning).

