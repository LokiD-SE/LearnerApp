id: testing-mass-assignment-and-data-exposure
title: Testing mass assignment and excessive data exposure
subject: security-testing
module: api-security
level: intermediate
status: published
estimatedMinutes: 150
summary: Test the two halves of API3:2023, Broken Object Property Level Authorization - the properties a client can write that it never should (mass assignment) and the properties the server sends that the client never should see (excessive data exposure). Probe PATCH /api/profile with harmless same-value requests and a control, scan responses for secrets without printing them, compare each response with the API contract, and write the two fixes - an allow-list for input and a response model for output - against a deliberately vulnerable SandPay portal, with probes that find the flaw and stay quiet once it is fixed.
tags:
  [
    mass assignment,
    autobinding,
    object injection,
    excessive data exposure,
    broken object property level authorization,
    API3:2023,
    BOPLA,
    CWE-915,
    CWE-213,
    allow-list,
    block-list,
    DTO,
    data transfer object,
    response model,
