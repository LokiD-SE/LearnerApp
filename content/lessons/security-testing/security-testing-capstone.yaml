id: security-testing-capstone
title: Capstone - a security assessment of the SandPay portal
subject: security-testing
module: security-specialised
level: advanced
status: published
estimatedMinutes: 180
summary: Run a whole assessment, not another technique. Start from the rules of engagement and enforce them in code on every request, then probe the SandPay practice portal with checks that run a positive control first and give each probe an honest verdict - found, not found, inconclusive, blocked or not run - turn what was found into scored findings with a weakness id, a CVSS vector and redacted evidence, and prove the fixes with a retest that repeats the same probes and refuses to call anything fixed that it could not test. It ends with a clean-bill rule, a pipeline exit code and the hand-over of every finding to the regression suite. Only the local practice portal is ever tested.
tags:
  [
    security assessment,
    capstone,
    rules of engagement,
    scope,
    request budget,
    positive control,
    inconclusive result,
    coverage,
    black box,
    white box,
    findings,
    CVSS v4.0,
    CWE,
    retest,
    clean bill,
    report,
    regression hand-over,
    NIST SP 800-115,
    OWASP WSTG reporting,
    SandPay portal,
    security testing,
  ]

environment: |
  - **Runtime:** Python 3.12.3 in `practice/security/.venv` with pytest 9.2.0 and requests 2.34.2, on Linux. Every output marked as run
    here was printed by `practice/security/support/scap_demo.py` (and the code it imports) on 21 November 2026, against the
    in-process practice portal on loopback. Nothing leaves the machine. SandPay, its merchants, its findings and the finding ids
    (`SP-CAP-nn`) are fictional. Timings are from one shared machine and vary.
  - **Sources (read on 21 November 2026, "as documented on" that date):** NIST
    [SP 800-115](https://csrc.nist.gov/pubs/sp/800/115/final), _Technical Guide to Information Security Testing and Assessment_
    (section 5.2.2 on the reporting phase, section 8 on post-testing activities and section 8.3 on retesting; the ROE definition is the one quoted in the fundamentals lesson); the OWASP Web Security Testing Guide
    v4.2 [Reporting chapter](https://github.com/OWASP/wstg/blob/v4.2/document/5-Reporting/README.md); MITRE's CWE entries
    [CWE-22](https://cwe.mitre.org/data/definitions/22.html), [CWE-79](https://cwe.mitre.org/data/definitions/79.html),
    [CWE-89](https://cwe.mitre.org/data/definitions/89.html), [CWE-200](https://cwe.mitre.org/data/definitions/200.html),
    [CWE-209](https://cwe.mitre.org/data/definitions/209.html), [CWE-307](https://cwe.mitre.org/data/definitions/307.html),
    [CWE-347](https://cwe.mitre.org/data/definitions/347.html), [CWE-352](https://cwe.mitre.org/data/definitions/352.html),
    [CWE-532](https://cwe.mitre.org/data/definitions/532.html), [CWE-601](https://cwe.mitre.org/data/definitions/601.html),
    [CWE-639](https://cwe.mitre.org/data/definitions/639.html), [CWE-693](https://cwe.mitre.org/data/definitions/693.html),
    [CWE-915](https://cwe.mitre.org/data/definitions/915.html), [CWE-916](https://cwe.mitre.org/data/definitions/916.html),
    [CWE-918](https://cwe.mitre.org/data/definitions/918.html) and [CWE-1004](https://cwe.mitre.org/data/definitions/1004.html)
    (version 5.0 of each entry; only the entry titles were read, which is all the lesson relies on). The CVSS v4.0 scoring is the
    code and the FIRST tables from the [reporting lesson](#/lesson/vulnerability-reporting-and-cvss); the WSTG and ASVS references
    on each finding come from the table built in the [WSTG and ASVS lesson](#/lesson/owasp-wstg-and-asvs).
  - **What the code is.** Three exercises (`scap_scope.py`, `scap_assess.py`, `scap_retest.py` in `exercises/specialised/`) build
    the assessment harness around `support/scap_fixture.py`, which holds what is not an exercise: the rules-of-engagement check
    (`check_scope`, the foundations lesson's rule in one function), fifteen probes for the flaws that can be seen from outside,
    two owner-supplied checks for the flaws that cannot, the catalogue (title, CWE and vector per flaw) and the pinned base scores.
    The fixture does not depend on any other exercise being solved. `scap_demo.py` re-checks the pinned scores against
    `solutions/specialised/cvss_v4.py` (14 of 14 distinct vectors match). The earlier lessons' solutions are reused only in the demo:
    the registry (`reg_registry`) and the red/green pair (`reg_probe`) in the hand-over step.
  - **The probes and the vectors are mine.** I wrote the fifteen probes for this portal and chose each CVSS vector by applying
    FIRST's definitions to what the portal does; another analyst may choose differently (the reporting lesson shows how far one
    metric can move a rating). The CWE ids are the entry I judged the closest; several flaws have more than one reasonable
    entry, and the lesson says where.
  - **What "17 of 17" means, and does not.** The portal's flaw table is published at the top of `support/sandpay_vuln.py`, so
    this assessment knows what to look for. On a real target nobody hands you the list: coverage then comes from a method (the WSTG
    checklist, a threat model) and the report says what was and was not tested. A clean result on the fixed portal means "none of
    these 17 probes reports its flaw", **not** "the portal is secure": the practice README says the fixed portal still sends HSTS
    over plain HTTP and its CSP lacks `object-src` and `base-uri`, and the WSTG/ASVS lesson uses both as teaching points.
  - **Not read or not run:** the NIST publication's appendices (the ROE template is described in the fundamentals lesson, not
    reproduced here); the WSTG pages for individual tests; the CWE entries beyond their titles; any report generator, ZAP,
    Burp or other tool (the DAST, SAST and dependency lessons quote theirs from the docs, "not run here").
  - **Ethics:** test only with written permission, inside the agreed scope. The code here refuses any host that is not the
    loopback address of the practice portal, and the probes send harmless values only - a canary tag, the value a field already
    holds, a token in the wrong place - and keep no secret in their evidence. Never point any of this at a system you do not own or
    have written permission to test.
  - **Not repeated here:** how each flaw works and how to find it - see
    [authentication](#/lesson/testing-authentication), [access control and IDOR](#/lesson/testing-access-control-idor),
    [SQL injection](#/lesson/testing-sql-injection), [cross-site scripting](#/lesson/testing-cross-site-scripting),
    [JWT and OAuth](#/lesson/testing-jwt-and-oauth), [mass assignment](#/lesson/testing-mass-assignment-and-data-exposure) and
    [business logic](#/lesson/testing-business-logic-and-rate-limits); the scope gate and the rules of engagement in depth -
    [Security testing fundamentals](#/lesson/security-testing-fundamentals); scoring and the finding format -
    [Reporting vulnerabilities and scoring with CVSS](#/lesson/vulnerability-reporting-and-cvss); turning findings into permanent
    tests - [Automating security regression tests](#/lesson/security-regression-automation).

prerequisites:
  - security-testing-fundamentals
  - owasp-wstg-and-asvs
  - vulnerability-reporting-and-cvss
  - security-regression-automation

concepts:
  - id: sec-cap-engagement
    name: The engagement - scope, rules and a guard that cannot be forgotten
    summary: An assessment is legitimate only inside written authorisation and rules of engagement - which target, which methods, which paths stay untouched, how many requests. Writing them down is not enough, so the rules become code. One wrapper sits under every probe and checks the budget, the scope rule and the redirect policy on every request, refuses what is out of scope before it is sent, and records what was sent without the query strings that can carry secrets. A runaway loop stops itself, and a redirect to another site is read as data and never followed.
  - id: sec-cap-assessment
    name: The assessment - probes with controls and verdicts that mean something
    summary: Each probe runs a positive control first, so that "not found" can only come from a request that worked, and then a harmless test value. Its answer is one of five verdicts - found, not found, inconclusive, blocked, not run - and only the first two say anything about the flaw. A failed control, a transport error, a refused request and a spent budget are never counted as "clean". Some flaws cannot be seen from outside at all - password hashing, secrets in logs - and need evidence the owner supplies, so coverage has to be stated, not assumed.
  - id: sec-cap-report-retest
    name: The report and the retest - scored findings, a mirror test and a clean bill that is earned
    summary: Found results become findings - a title, a weakness id, a CVSS vector and score with a rating, redacted evidence and references - sorted worst first with stable ids. After the owner fixes, the retest repeats the same probes and compares flaw by flaw (fixed, still open, new, unchanged, newly tested, unverified), because a retest can verify a fix only if "a mirror copy of the original test is performed". A flaw the retest could not test is unverified, never fixed; a clean bill needs every expected probe run and not found; a pipeline gets exit code 1 for open or new findings and 2 for unverified ones; every fixed finding then needs an automated test.

objectives:
  - Turn a written scope into a guard that checks the budget, the scope rule and the redirect policy on every request, and explain why the checks live in one wrapper under every probe.
  - Write a probe with a positive control and a harmless test value, and explain why a probe that cannot tell "not vulnerable" from "did not work" is worse than no probe.
  - Give every probe one of five verdicts - found, not found, inconclusive, blocked, not run - and say which of them count as evidence about the flaw.
  - Explain what a black-box assessment cannot see, and report coverage and limitations honestly.
  - Turn found results into findings with a CWE, a CVSS v4.0 vector and score, a rating, redacted evidence and references, sorted worst first.
  - Retest by repeating the same probes, classify each flaw (fixed, still open, new, unverified), set a pipeline exit code, and decide when a clean bill may be given.
  - Hand each finding to the regression registry and say what a clean retest does and does not prove.

sections:
  - id: intuition
    kind: intuition
    concepts: [sec-cap-engagement, sec-cap-assessment, sec-cap-report-retest]
    title: The idea in plain language
    body: |
      Imagine a building inspector hired to check a block of flats. Before the first door is opened there is a signed paper: which
      building, which floors, which hours, what the inspector may touch and what is off limits (the plant room, say). The inspector
      does not trust their own memory of that paper on a long day, so the keys they are given open only the doors on the list.

      Then the inspection. For each check, a good inspector first proves the instrument works - tests the smoke detector's tester on
      a known flame - because "no alarm" only means something if the tester can alarm. If the tester is flat, the entry in the
      notebook is not "no fault", it is "could not test". If the lift is out of service, that is "not tested", never "passed".

      The report lists each fault with how bad it is, where, how to see it again and how to fix it - and it lists what was *not*
      checked and why. After the repairs, the inspector comes back and runs **the same checks again**. A fault is "fixed" only if
      the same check, with a working instrument, no longer finds it; a check that could not be repeated is "not verified". Only
      when every check on the list was run and came back clear does the inspector sign a clean bill - and even then it says "these
      checks", not "this building is safe".

      That is the whole capstone. The new ideas are small: the rules are **code**, not a document; "not found" is an answer only
      when the **control** worked; there are **five** answers, not two; and a retest is a **mirror** of the first test, with a
      verdict for what it could not repeat.

  - id: what
    kind: what
    concepts: [sec-cap-engagement, sec-cap-assessment, sec-cap-report-retest]
    title: What the terms mean
    body: |
      | Term | Meaning here | In the code |
      | --- | --- | --- |
      | **Rules of Engagement (ROE)** | "Detailed guidelines and constraints regarding the execution of information security testing" (NIST SP 800-115), agreed before testing | `Scope` - target, methods, excluded paths, request budget |
      | **Guard** | The wrapper that checks every request against the scope and the budget before it is sent | `GuardedHttp.request` |
      | **Probe** | One small test of one flaw: a positive control, then a harmless test value, then a yes or no with evidence | a function in `PROBES` |
      | **Positive control** | A request that must work if the probe is to mean anything (log in, read your own record, fetch a public file) | `ControlFailed` when it does not |
      | **Verdict** | `found`, `not-found`, `inconclusive`, `blocked` or `not-run` | `Result.status` |
      | **Coverage** | What was actually tested, and what was not, and why | the verdict counts, plus the black-box and white-box split |
      | **Finding** | A reportable flaw: title, CWE, CVSS vector and score, rating, redacted evidence, references | `to_findings` |
      | **Retest** | The same probes, run again after the fix, compared flaw by flaw | `retest` |
      | **Clean bill** | Every expected probe was run and found nothing - which is a statement about those probes only | `clean_bill` |

      The standards give the frame. SP 800-115 divides a penetration test into planning, discovery, attack and reporting, and says "the
      reporting phase occurs simultaneously with the other three phases": the plan is written first, logs are kept while testing, and
      "at the conclusion of the test, a report is generally developed to describe identified vulnerabilities, present a risk rating, and
      give guidance on how to mitigate the discovered weaknesses." Its section on post-testing adds the point this lesson ends on:
      mitigation is verified "by conducting an audit of the system, retesting the system and its components", and "the test team will
      be able to verify its implementation only if a mirror copy of the original test is performed."

      The WSTG's reporting chapter adds two things a capstone report needs and a list of findings does not: a **Limitations** section
      ("out-of-bounds areas in relation to testing", "broken functionality", "lack of cooperation", "lack of time", "lack of access or
      credentials") and, for a re-test, "a subsection that summarizes findings of the previous test, the updated status of previously
      identified vulnerabilities, and any cross-references with the current test."

  - id: why
    kind: why
    concepts: [sec-cap-engagement, sec-cap-assessment, sec-cap-report-retest]
    title: Why a capstone, and why these three ideas
    body: |
      Every earlier lesson in this track teaches one technique in isolation. A real assessment fails in the gaps between them, and
      the gaps are the same few mistakes:

      - **A test that went outside the agreement.** A loop that never stops, a redirect that was followed to someone else's server, a
        path that was meant to be left alone and was touched "just to look". Writing the rules in a document does not stop any of
        these; a check in the one place every request passes through does.
      - **A "pass" that is really a broken test.** A login that failed with a 429, a URL with a typo, a server that was down: each makes
        a probe see nothing, and "saw nothing" reads exactly like "not vulnerable". Most false reassurance in security testing is this,
        and it is cheap to prevent with a control and a fifth verdict.
      - **A report that cannot be acted on.** A list of titles with no score, no weakness id and no evidence a developer can repeat.
      - **A "fixed" that nobody verified.** A ticket closed because someone said so, or because the retest ran fewer checks than the
        first test and the missing ones were quietly counted as passes.
      - **A fix that decays.** The flaw comes back in the next release because nothing guards it.

      This capstone also shows how the pieces of the track fit: the scope gate from the fundamentals lesson becomes a wrapper; the
      probes are the ones you wrote lesson by lesson, tidied into one style; the scoring and the finding come from the reporting lesson;
      the red/green pair and the registry come from the regression lesson. The three exercises are the new glue, and they are small on
      purpose - 56, 83 and 66 lines in the reference solutions - because the hard part is deciding what the glue must refuse to do.

  - id: engagement-internals
    kind: internals
    concepts: [sec-cap-engagement]
    title: Inside the guard - what is checked, in what order, and what is logged
    body: |
      `GuardedHttp.request(method, target)` is the only way a probe reaches the network. In order:

      1. **Budget.** If `scope.max_requests` requests have already been *sent*, raise `BudgetExhausted`. It comes first: once the
         budget is gone nothing else matters, and a loop that retries a refused request cannot keep the machine busy. The portal
         assessment sends 33 requests; the budget is 150, so a normal run uses about a fifth of it and a runaway loop stops long
         before it matters.
      2. **Scope.** `check_scope(scope, method, url)` returns `None` or the reason. A reason becomes `OutOfScope(reason)`; the
         request is written to `refused` and never sent. The rule checks, in order: the scheme is plain `http`; there is no user
         info (`http://127.0.0.1:8765@evil.example/` really targets `evil.example`); the host is a loopback address (the practice
         rule); the host *and port* are the engagement target's, exactly; the method is allowed (`GET`, `POST` and `PATCH` here, so a
         `DELETE` is refused); and the path does not start with an excluded prefix **after** percent-decoding and folding `..`, so
         `/internal/admin`, `/%69nternal/admin` and `/public/../internal/admin` are all the same refusal.
      3. **Send, without following redirects.** The wrapper passes `allow_redirects=False` and drops the caller's own value. A
         `Location` header is *data*: the open-redirect probe reads it and never visits it. A tester who lets the library follow
         redirects has just let the target choose where the test goes next.
      4. **Log, path only.** Each sent request is recorded as method, path and status. The **query string is left out** on purpose:
         a query can carry a token or a search term, and evidence that copies it spreads the leak.

      A refused request does not use budget, because it was never sent. That is a detail the tests check, since the opposite - a
      refusal counting against the budget - would let a loop of refused requests exhaust the engagement.

      **The excluded path is worth a second look.** The scope excludes `/internal/`, which is where the portal's SSRF target lives. The
      SSRF probe still proves the flaw, without touching that path: it asks the *webhook test endpoint* to fetch the portal's own
      `/health` page, and finds that the server fetched an internal URL for the caller. The request the tester sends is in scope; the
      request the server makes on their behalf is the vulnerability. A scope document should say so in words, or the tester has to ask
      - this is the kind of ambiguity that belongs in the rules of engagement before testing starts, not in an argument afterwards.

  - id: assessment-internals
    kind: internals
    concepts: [sec-cap-assessment]
    title: Inside a probe - the control, the harmless value and the five verdicts
    body: |
      Every probe has the same three parts, and the fifteen in `support/scap_fixture.py` differ only in the details:

      | Probe | Positive control (must work) | Harmless test value | Evidence it records |
      | --- | --- | --- | --- |
      | `idor` | Alice reads her own payment (200, her merchant) | Alice reads Bob's payment | the two ids, never the body |
      | `mass-assignment` | `/api/me` shows Bob as a merchant | the **same** value `role: merchant` sent to the profile endpoint | that the protected field was accepted |
      | `sqli` | a plain `?status=captured` returns only Alice's rows | a tautology in `?status=` | which merchants' rows came back |
      | `xss-reflected` | a plain word is echoed | a harmless `<i>` canary tag | that the tag came back unencoded |
      | `xss-stored` | saving a note answers 201 | the same canary as a note | that the notes page returned it unencoded |
      | `path-traversal` | a public file is served | `../internal/settlement-keys.txt` | that the file was served - **not its contents** |
      | `open-redirect` | `next=/settings` redirects locally | `next=` another site (never followed) | that the `Location` host differs |
      | `ssrf` | a public URL answers "not delivered" | the portal's own `/health` page | that an internal URL was fetched |
      | `csrf` | `/settings` loads with the session cookie | the **same** email posted without a token | that the change was accepted |
      | `weak-session` | login sets a `sid` cookie | none - reads the cookie attributes | which attributes are missing, not the value |
      | `no-rate-limit` | the first wrong login answers 401 | seven failed logins for an account that does not exist | that no 429 came back |
      | `jwt-none` | a signed token is accepted | a token with `alg: none` and no signature | that it was accepted |
      | `verbose-errors` | `/health` answers 200 | `/boom` | that a trace came back - **not the text** |
      | `missing-headers` | `/health` answers 200 | none - reads the headers | which headers are missing |
      | `data-exposure` | Alice reads her own merchant record | none - reads the field names | which sensitive fields are present, not their values |

      Three habits are visible in that table. **Harmless values:** the mass-assignment and CSRF probes send back the value the field
      already holds, so the test finds the flaw without changing an account; the XSS probes use a tag that does nothing. **Evidence
      without secrets:** a probe says "the settlement-keys file was served", never the key; a test fixture asserts that no key, password or
      digit run appears in any evidence. **One login per user:** the context logs each user in once and reuses the token, because once
      `no-rate-limit` is fixed a login limit of five attempts per account per minute would make the *controls* fail.

      **The five verdicts.** A probe returns evidence (a non-empty string) or `None`. The runner turns that, and everything else that can
      happen, into one of five answers:

      | Verdict | When | Says something about the flaw? |
      | --- | --- | --- |
      | `found` | the probe returned evidence | yes - it is there |
      | `not-found` | the control worked and the probe returned `None` | yes - not seen by this probe |
      | `inconclusive` | `ControlFailed`, a transport error, or the probe crashed | **no** - the probe proved nothing |
      | `blocked` | the guard refused a request (`OutOfScope`) | **no** - the rules did not allow the test |
      | `not-run` | the budget ran out (this probe and every later one) | **no** - it never ran |

      A probe that **crashes** is `inconclusive`, with the exception type and message as the reason. This is the same rule the WSTG
      runner in the earlier lesson used for an "Error" result: a check that crashed has not passed. A budget that runs out stops the
      run and marks everything after it `not-run`, so a report cannot show 12 of 15 probes and imply 15.

      **What no request can show.** `weak-hash` (unsalted MD5 in the database) and `secret-logging` (passwords written to the access
      log) are invisible from outside: no response contains either. A black-box assessment must say so. In an engagement they are checked
      from evidence **the owner supplies under the agreement** - a hash extract, a log sample - and `whitebox_results` does exactly that
      for the practice portal, printing counts and a verdict, never a hash or a log line. A code review would find the hashing too (the
      SAST lesson's rule engine has a weak-hash rule). The honest coverage statement is "15 flaws checked from outside, 2 from
      owner-supplied evidence".

  - id: report-internals
    kind: internals
    concepts: [sec-cap-report-retest]
    title: Inside the report and the retest
    body: |
      **From result to finding.** `to_findings` takes each `found` result and builds a dict from the catalogue: a title, a **CWE** (the weakness
      class, chosen from the list and never from memory), a **CVSS v4.0 vector** with the score the reporting lesson's code gives it and a
      qualitative rating, the evidence the probe recorded, and the **WSTG and ASVS references** from the table in the standards lesson. The
      findings are sorted by score (highest first), with ties broken by flaw id so that the order is the same on every run, and **ids are
      numbered after sorting** (`SP-CAP-01` is the worst), so a reader can quote "01" and mean the same thing tomorrow. A `found` flaw missing
      from the catalogue raises `KeyError`: an unreportable finding must be loud, not silently dropped.

      **Choices behind the vectors.** These are mine, in the reporting lesson's style. The unsigned-token flaw is `AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H`
      - no account, no victim, full confidentiality and integrity on the portal - and scores 9.3, the only Critical. IDOR reuses that lesson's vector
      (7.1). The stack-trace flaw is scored `VC:H` **because** the trace includes a line naming an application key: the probe records that the line
      exists without recording it, and that observation is the reason for the score. The same flaw without a key would be `VC:L`. The session-cookie
      flaw and the missing headers score 2.3 because each needs another flaw, a victim action and a harder precondition (`AC:H/AT:P`) to matter.
      Where more than one CWE fits, the catalogue picks one and the report can list others: `weak-session` is CWE-1004 (no `HttpOnly`), and
      the missing `Secure` attribute is CWE-614; `missing-headers` is the broad CWE-693 because no narrower entry covers four headers
      (CWE-1021 is about rendered UI layers or frames); `data-exposure` is CWE-200, though an analyst could argue the "unauthorised actor" is any script in
      the page and choose differently. The report states its choices; it does not claim they are the only ones.

      **The executive summary and the limitations.** The WSTG chapter wants an executive summary that gives "the objective of the test", "key
      findings in a business context" and "strategic recommendations", and a Limitations section. For a capstone the limitations are concrete:
      15 probes from outside and 2 from owner-supplied evidence; harmless values only, so exploitability beyond the proof was not tested; a
      request budget; the rules excluded `/internal/`; "point in time" ("There is no guarantee that all possible security issues have been
      identified", in the WSTG's example disclaimer).

      **From retest to exit code.** `retest(before, after)` compares flaw by flaw. Six outcomes; the rule that matters is the last row.

      | Before | After | Outcome |
      | --- | --- | --- |
      | found | not found | `fixed` |
      | found | found | `still-open` |
      | not found, inconclusive, blocked, not run, or absent | found | `new` |
      | not found | not found | `unchanged` |
      | inconclusive, blocked, not run | not found | `newly-tested` |
      | anything | inconclusive, blocked, not run, or **absent** | `unverified` |

      `exit_code` gives a pipeline `1` when anything is `still-open` or `new`, otherwise `2` when anything is `unverified`, otherwise `0`:
      a failure outranks an unknown. `clean_bill(after, expected)` is true only when **every** expected flaw has a result and that result is
      `not-found`; a missing or untested one makes it false. The expected list comes from the *first* assessment, so a retest cannot shrink the
      claim by running fewer probes. That is SP 800-115's "mirror copy of the original test", written as a rule a program can check.

  - id: when
    kind: when
    concepts: [sec-cap-engagement, sec-cap-assessment, sec-cap-report-retest]
    title: When to use it, and when not
    body: |
      **Use this shape** for any assessment you will hand to someone else: an engagement for a client, a pre-release review, a retest
      before a release. The three habits - rules in code, verdicts that separate "clear" from "not tested", a retest that mirrors the first
      test - cost little and prevent the reassuring-but-wrong report.

      **Do not read it as a method for finding unknown flaws.** The portal publishes its flaw table; the probes here are written to find
      *those*. On a real target the hard part is the discovery that comes before the probes - threat modelling, crawling, reading the
      checklist - and the report's limitations section says how far it went. A tidy "17 of 17" on a known target measures the harness, not the
      tester.

      **Do not use the harmless-value style where the engagement needs proof of impact.** Some clients want a demonstration that goes further
      (a real account taken over in a test tenant). That needs its own written permission and its own guard; the probes here deliberately stop at
      "the flaw is there".

      **Add a human review before anything is sent.** The linter from the reporting lesson checks form, not truth. A second person should
      try the steps cold on the target, and reproduce the *negative* control on a fixed build too.

      **If you find something outside the scope**, stop, do not collect more evidence, and tell your engagement contact how to proceed. The
      guard refuses out-of-scope requests; it cannot tell you what to do about what you saw.

  - id: visual-flow
    kind: visual
    concepts: [sec-cap-engagement, sec-cap-assessment, sec-cap-report-retest]
    title: The whole engagement on one page
    body: |
      ```mermaid
      flowchart TD
        A["written authorisation<br/>from someone entitled to give it"] --> B["rules of engagement<br/>target, methods, exclusions, budget"]
        B --> C["guard in code<br/>checks every request"]
        C --> D["probes<br/>control first, harmless values"]
        D --> E{"verdict"}
        E -- "found" --> F["finding<br/>CWE, vector, score, evidence"]
        E -- "not found" --> G["coverage note"]
        E -- "inconclusive, blocked, not run" --> H["limitation in the report"]
        F --> I["report: summary, findings, limitations"]
        G --> I
        H --> I
        I --> J["owner fixes"]
        J --> K["retest: the same probes"]
        K --> L{"clean bill?"}
        L -- "no" --> J
        L -- "yes" --> M["hand over: each finding becomes<br/>a regression test"]
      ```

      Notice that the three non-finding verdicts do not disappear into "pass": two of them reach the report as limitations. And notice the
      loop on the right - fix, retest, fix - which only ends when the clean bill is *earned*, not declared.

  - id: visual-verdicts
    kind: visual
    concepts: [sec-cap-assessment]
    title: How one probe becomes one verdict
    body: |
      ```mermaid
      flowchart LR
        P["probe runs"] --> C{"positive control<br/>worked?"}
        C -- "no" --> I["inconclusive"]
        C -- "yes" --> S{"flaw seen?"}
        S -- "yes" --> F["found + evidence"]
        S -- "no" --> N["not-found"]
        P -. "a request is refused" .-> B["blocked"]
        P -. "the budget is used up" .-> R["not-run for this and every later probe"]
      ```

      The two dotted lines are the interruptions. A refusal ends *that probe* and the run goes on; a spent budget ends the *run*. Only the two
      solid-line verdicts at the right, `found` and `not-found`, say anything about the portal.

  - id: code-python
    kind: code
    concepts: [sec-cap-engagement, sec-cap-assessment, sec-cap-report-retest]
    title: The code, shortened
    collapsed: true
    body: |
      The guard (`solutions/specialised/scap_scope.py`):

      ```python
      def request(self, method, target, **kw):
          method = method.upper()
          url = self.scope.base_url + target if target.startswith("/") else target
          if self.used >= self.scope.max_requests:
              raise BudgetExhausted(f"request budget of {self.scope.max_requests} is used up")
          reason = check_scope(self.scope, method, url)
          if reason is not None:
              self.refused.append((method, url, reason))
              raise OutOfScope(reason)
          kw.pop("allow_redirects", None)
          kw.setdefault("timeout", TIMEOUT)
          resp = self.session.request(method, url, allow_redirects=False, **kw)
          self.log.append(LogEntry(method, urllib.parse.urlsplit(url).path, resp.status_code))
          return resp
      ```

      The runner (`scap_assess.py`):

      ```python
      def run_assessment(http, probes):
          ctx = Context(http)
          results, names = [], list(probes)
          for index, flaw in enumerate(names):
              before = http.used
              try:
                  evidence = probes[flaw](ctx)
                  status, text = ("found", evidence) if evidence else ("not-found", "the control worked ...")
              except ControlFailed as exc:
                  status, text = "inconclusive", str(exc)
              except BudgetExhausted:
                  for left in names[index:]:
                      results.append(Result(left, "not-run", "request budget exhausted ...", 0))
                  return Assessment(tuple(results))
              except OutOfScope as exc:
                  status, text = "blocked", f"refused by the rules of engagement: {exc}"
              except requests.RequestException as exc:
                  status, text = "inconclusive", f"transport error: {type(exc).__name__}"
              except Exception as exc:
                  status, text = "inconclusive", f"probe crashed: {type(exc).__name__}: {exc}"
              results.append(Result(flaw, status, text, http.used - before))
          return Assessment(tuple(results))
      ```

      The retest rules (`scap_retest.py`):

      ```python
      for flaw in flaws:
          b, a = before.get(flaw), after.get(flaw)
          b_status = b.status if b else "absent"
          if a is None or a.status in UNTESTED:
              outcome = "unverified"
          elif a.status == "found":
              outcome = "still-open" if b_status == "found" else "new"
          elif b_status == "found":
              outcome = "fixed"
          elif b_status == "not-found":
              outcome = "unchanged"
          else:
              outcome = "newly-tested"

      def clean_bill(after, expected):
          return all((r := after.get(f)) is not None and r.status == "not-found" for f in expected)
      ```

      The order of the `except` clauses matters: `OutOfScope` and `BudgetExhausted` must be caught before the broad `Exception`, and
      `BudgetExhausted` (a subclass of `OutOfScope`) before `OutOfScope`, or a spent budget would be reported as one refused probe.

  - id: real-runs
    kind: code
    concepts: [sec-cap-engagement, sec-cap-assessment, sec-cap-report-retest]
    title: Real output - the assessment on the practice portal
    body: |
      `practice/security/support/scap_demo.py`, run on 21 November 2026 with the reference solutions, against a fresh in-process portal on
      loopback for each step. Run `.venv/bin/python support/scap_demo.py` from `practice/security` to reproduce it. First, the guard. The port
      is replaced with `PORT` and nothing else is edited:

      ```text
      === 1. The guard refuses what the rules of engagement do not allow
      GET    /internal/admin                          -> refused: path /internal/admin is excluded from the scope
      GET    /%69nternal/admin                        -> refused: path /internal/admin is excluded from the scope
      GET    /public/../internal/admin                -> refused: path /internal/admin is excluded from the scope
      DELETE /api/payments/pay_1001                   -> refused: method DELETE is not allowed
      GET    http://evil.example/health               -> refused: host 'evil.example' is not a loopback address (practice rule)
      GET    http://127.0.0.1:PORT@evil.example/      -> refused: user info in the URL hides the real host
      GET    /health                                  -> sent, status 200
      sent 1, refused 6, budget left 149
      third request with a budget of 2 -> BudgetExhausted: request budget of 2 is used up
      ```

      Six refusals, one request sent, and the budget barely touched: refused requests cost nothing. Then the assessment of the vulnerable
      portal. The `requests` column is what each probe sent. The first probe pays for the login that every later probe reuses, which is
      why `weak-session`, `weak-hash` and `secret-logging` show 0:

      ```text
      === 2. The assessment of the vulnerable portal
      flaw             status        requests
      idor             found                3
      mass-assignment  found                3
      sqli             found                2
      xss-reflected    found                2
      xss-stored       found                2
      path-traversal   found                2
      open-redirect    found                2
      ssrf             found                2
      csrf             found                2
      weak-session     found                0
      no-rate-limit    found                7
      jwt-none         found                2
      verbose-errors   found                2
      missing-headers  found                1
      data-exposure    found                1
      weak-hash        found                0
      secret-logging   found                0
      black-box probes: 15, requests sent: 33 of a budget of 150, refused: 0
      found 17 of 17  (run took 0.6 s on this machine)
      ```

      The findings, worst first (the ids are numbered after sorting; ties are broken by flaw id):

      ```text
      === 3. The scored findings, worst first
      id         score rating    flaw             cwe       title
      SP-CAP-01    9.3 Critical  jwt-none         CWE-347   Unsigned tokens (alg none) are accepted
      SP-CAP-02    8.7 High      path-traversal   CWE-22    Path traversal reaches the internal settlement keys file
      SP-CAP-03    8.7 High      verbose-errors   CWE-209   Stack traces with an application key in error responses
      SP-CAP-04    8.6 High      mass-assignment  CWE-915   A merchant can send the protected field role to the profile endpoint
      SP-CAP-05    7.1 High      csrf             CWE-352   No CSRF protection on the email change
      SP-CAP-06    7.1 High      idor             CWE-639   Merchants can read each other's payments
      SP-CAP-07    7.1 High      sqli             CWE-89    SQL injection in the payment status filter
      SP-CAP-08    7.1 High      ssrf             CWE-918   The webhook test fetches internal URLs for the caller
      SP-CAP-09    6.9 Medium    no-rate-limit    CWE-307   No limit on failed logins
      SP-CAP-10    6.7 Medium    secret-logging   CWE-532   Passwords written to the access log
      SP-CAP-11    5.9 Medium    weak-hash        CWE-916   Passwords stored as unsalted MD5
      SP-CAP-12    5.3 Medium    data-exposure    CWE-200   Merchant record returns the API secret and full IBAN
      SP-CAP-13    5.3 Medium    open-redirect    CWE-601   Login redirect to any site
      SP-CAP-14    5.1 Medium    xss-reflected    CWE-79    Reflected cross-site scripting in the search page
      SP-CAP-15    4.8 Medium    xss-stored       CWE-79    Stored cross-site scripting in merchant notes
      SP-CAP-16    2.3 Low       missing-headers  CWE-693   Security response headers are missing
      SP-CAP-17    2.3 Low       weak-session     CWE-1004  Session cookie without HttpOnly, Secure or SameSite
      by rating: {'Critical': 1, 'High': 7, 'Medium': 7, 'Low': 2}
      ```

      One finding in full - this is what a developer receives, and nothing secret is in it:

      ```json
      {
        "flaw": "jwt-none",
        "title": "Unsigned tokens (alg none) are accepted",
        "cwe": "CWE-347",
        "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N",
        "score": 9.3,
        "rating": "Critical",
        "evidence": "GET /api/me accepted a token with alg none and no signature",
        "refs": {
          "wstg": [],
          "asvs": [
            "V9.1.1",
            "V9.1.2"
          ]
        },
        "id": "SP-CAP-01"
      }
      ```

      `wstg` is empty because the standards lesson's table lists no WSTG v4.2 test for this flaw and maps it to ASVS requirements only. The
      pinned scores were then checked against the reporting lesson's scorer: 14 of 14 distinct vectors match (several flaws share a vector).

      Now what is **not** a clean result. A budget of 12 stops the run, and everything after the break is `not-run`. A portal that is not
      listening turns every probe `inconclusive` - not fifteen `not-found`:

      ```text
      === 4. What is NOT a clean result
      budget of 12: {'found': 5, 'not-run': 10} - sent 12
      first not-run: path-traversal
      nothing listening: {'inconclusive': 15} | transport error: ConnectionError
      clean bill for that run: False
      ```

      Then the retest. The developers fix 13 flaws (all but `ssrf`, `no-rate-limit`, `missing-headers` and `secret-logging`), and the same
      assessment runs against the new build:

      ```text
      === 5. The retest after the developers' first round of fixes
      flaw             outcome      note
      idor             fixed        found before, not found now (the control worked)
      mass-assignment  fixed        found before, not found now (the control worked)
      sqli             fixed        found before, not found now (the control worked)
      xss-reflected    fixed        found before, not found now (the control worked)
      xss-stored       fixed        found before, not found now (the control worked)
      path-traversal   fixed        found before, not found now (the control worked)
      open-redirect    fixed        found before, not found now (the control worked)
      ssrf             still-open   found again
      csrf             fixed        found before, not found now (the control worked)
      weak-session     fixed        found before, not found now (the control worked)
      no-rate-limit    still-open   found again
      jwt-none         fixed        found before, not found now (the control worked)
      verbose-errors   fixed        found before, not found now (the control worked)
      missing-headers  still-open   found again
      data-exposure    fixed        found before, not found now (the control worked)
      weak-hash        fixed        found before, not found now (the control worked)
      secret-logging   still-open   found again
      outcomes: {'fixed': 13, 'still-open': 4} -> exit code 1
      clean bill: False
      ```

      After the second round the portal has every flaw fixed. A retest that skips one probe shows why the fifth verdict matters:

      ```text
      === 6. The second retest, after everything is fixed
      outcomes: {'fixed': 17} -> exit code 0
      clean bill for all 17: True
      requests sent: 33

      === 7. A retest that could not run the same test
      csrf -> unverified | exit code 2 | clean bill: False
      ```

      Finally the hand-over. Each fixed finding becomes an entry in the regression registry from the earlier lesson; only three flaws (`idor`,
      `open-redirect`, `path-traversal`) have a probe written as a regression test there, so the registry flags the other fourteen:

      ```text
      === 8. Hand-over to the regression registry
      17 fixed findings; registry problems by kind: {'fixed-without-test': 14}
      coverage: {'fixed': 17, 'covered': 3, 'ratio': 0.18}

      the red/green pair for the three flaws that already have a probe:
      idor            found on vulnerable: True, found on fixed: False, verdict red-green
      open-redirect   found on vulnerable: True, found on fixed: False, verdict red-green
      path-traversal  found on vulnerable: True, found on fixed: False, verdict red-green
      ```

      The engagement ends here, and the regression work begins: 14 findings are "fixed" and unguarded. The retest proves *this* build; only a test in
      the suite proves the next one.

  - id: line-by-line
    kind: line-by-line
    concepts: [sec-cap-engagement, sec-cap-assessment, sec-cap-report-retest]
    title: Why the important lines are written that way
    body: |
      | Line | Why |
      | --- | --- |
      | `if self.used >= self.scope.max_requests: raise BudgetExhausted` **first** | A spent budget ends everything; checking it before the scope means a loop of refused requests also hits a wall. |
      | `self.refused.append(...)` then `raise OutOfScope` | The refusal is evidence too: the report can say what the tester tried and the rules stopped. It costs no budget because nothing was sent. |
      | `kw.pop("allow_redirects", None)` then `allow_redirects=False` | The caller cannot switch redirect-following back on. A `Location` header is data; following it lets the target steer the test. |
      | `kw.setdefault("timeout", TIMEOUT)` | A request with no timeout can hang the whole run, and a hung probe is not a verdict. |
      | `LogEntry(method, urlsplit(url).path, status)` | The path only. A query string can hold a token or a search term; logs are evidence and evidence is shared. |
      | `class BudgetExhausted(OutOfScope)` | One `except OutOfScope` could catch both, which is why the runner puts the narrower clause first. |
      | `raise ControlFailed("control failed: ...")` in a probe | The probe says *why* it cannot answer. The runner turns it into `inconclusive`, never into `not-found`. |
      | `ctx.login(user)` caches the token | Logging in again for each probe would burn the login limit on the fixed portal and make controls fail for a reason unrelated to the flaw. |
      | `{"role": "merchant"}` sent by Bob (mass assignment) | The same value the field already has: the portal either rejects the field (fixed) or accepts it and nothing changes. |
      | `data={"email": ALICE[0]}` (CSRF probe) | The current email, posted without a token, proves the missing check without changing the account. |
      | `Cookie: sid=...` set by hand | The fixed portal's cookie is `Secure`; `requests` will not send it over plain `http`, so the probe sends the header itself. |
      | `evidence = probes[flaw](ctx)`; `if evidence` | Evidence must be a non-empty string. An empty string would be `not-found`, so a probe that returns `""` by mistake cannot report a flaw. |
      | `except Exception` -> `inconclusive` | A crashed probe has not proved anything. Counting it as a pass is how a typo becomes a clean report. |
      | `for left in names[index:]: ... "not-run"` then `return` | Every probe after the break is recorded, so the report shows 12 of 15 run, not 12 results that look like the whole. |
      | `rows.sort(key=lambda f: (-f["score"], f["flaw"]))` | Worst first, ties by name: the same order on every run, so ids and diffs are stable. |
      | `row["id"] = f"SP-CAP-{number:02d}"` after sorting | Ids that follow the sort order mean "01" is always the worst. |
      | `catalogue[r.flaw]` with no `.get` | A found flaw that cannot be reported must raise, not vanish. |
      | `if a is None or a.status in UNTESTED` **first** in `retest` | A flaw the retest could not test is `unverified`, whatever it was before. This line is what stops "not tested" from reading as "fixed". |
      | `outcome = "still-open" if b_status == "found" else "new"` | A flaw found now that was not found before is *new*, including one that was never tested - a retest can discover too. |
      | `expected` comes from the first assessment | The claim cannot shrink by running fewer probes. |
      | `if kinds & {"still-open", "new"}: return 1` before the `unverified` check | A known failure outranks an unknown. |

  - id: steps
    kind: steps
    concepts: [sec-cap-engagement, sec-cap-assessment, sec-cap-report-retest]
    title: Running the assessment, step by step
    body: |
      1. **Get the authorisation in writing** from someone entitled to give it: the target, the dates, the techniques, the contacts and the
         way findings will be sent. No authorisation, no first request.
      2. **Turn the rules into a `Scope`**: base URL, allowed methods, excluded paths, request budget. Write down the ambiguous cases (the
         SSRF target, destructive methods, test accounts) in the document itself.
      3. **Put every request behind the guard.** Probes get an HTTP object, never `requests` directly.
      4. **Plan the coverage** from a method, not from the flaw list: threat model, the WSTG checklist, what the owner told you. Decide
         which checks need owner-supplied evidence.
      5. **Write each probe** with a positive control, a harmless value and evidence that holds no secret. Prove it with the red/green pair:
         it finds the flaw on the vulnerable build and stays quiet on the build where only that flaw is fixed.
      6. **Run the assessment.** Read the verdict counts before the findings: how many were `inconclusive`, `blocked` or `not-run`? Fix the
         test, or say so in the limitations.
      7. **Add the owner-supplied evidence** for what cannot be seen from outside, and keep only counts and verdicts.
      8. **Build the findings.** Choose each CVSS metric with a sentence of reason, pick the closest CWE, redact the evidence, sort worst first.
      9. **Write the report**: executive summary, findings, limitations (what was not tested and why), appendices (the method, the rating scale,
         the checklist of tests run).
      10. **Send it** to the owner through the channel agreed, encrypted where possible, and record when.
      11. **Retest after the fixes with the same probes**, compare flaw by flaw, and set the exit code. Anything `unverified` is a conversation with
          the owner, not a closure.
      12. **Give a clean bill only when every expected probe ran and found nothing**, and word it as "these checks", with the date and the build.
      13. **Hand every fixed finding to the regression suite** and track the registry's coverage until it reaches 1.0.

  - id: example
    kind: example
    concepts: [sec-cap-engagement, sec-cap-assessment, sec-cap-report-retest]
    title: A hypothetical week with the SandPay team
    body: |
      This is made up to show the shape; the figures are the ones from the real runs above, and the wording of the report is mine.

      **Monday - scope.** The SandPay security lead signs a one-page agreement: the staging portal on one address, GET, POST and PATCH only,
      `/internal/` excluded, a budget of 150 requests per run, two test accounts for two merchants, results to one named address. The lead
      adds a sentence the tester asked for: "Server-side requests triggered through the webhook test are in scope as long as the request the
      tester sends is." That sentence is the difference between a debate on Thursday and a test on Tuesday.

      **Tuesday - run.** 33 requests, 17 of 17 flaws found (15 from outside, 2 from the hash extract and log sample the lead supplied). The
      tester reads the verdict counts first: no `inconclusive`, no `blocked`, no `not-run`. If the portal had been down, those counts would
      have said so before the findings did.

      **Wednesday - report.** The executive summary says: *"We tested the SandPay merchant portal on the agreed staging address on Tuesday. One
      Critical finding lets anyone sign in as any merchant by sending an unsigned token; seven High findings include reading other merchants'
      payments, reaching an internal key file and changing a merchant's role. Together they would let an outsider read or change payment data
      for every merchant. The common cause is trust in client-supplied input and identifiers. We recommend fixing the Critical and High findings
      first, adding an automated test for each fix, and repeating this assessment before release."* The findings table is the one above. The
      limitations section lists 15 checks from outside and 2 from supplied evidence, harmless values only, a budget of 150, `/internal/`
      excluded, and "point in time".

      **Friday - retest.** The developers fixed 13. The retest repeats the 17 checks: 13 fixed, 4 still open, exit code 1. The tester writes
      the four into the retest subsection - "previous status, current status, cross-reference" as the WSTG describes - and does not close
      them. A week later the second retest gives 17 fixed, exit code 0, and the lead receives one sentence: *"On the build of 28 November, none of
      the 17 checks in the 21 November assessment reports its flaw."* It does not say "secure". Then the lead opens the regression registry:
      3 of 17 findings have a test, 14 do not, and that is next sprint.

  - id: tests
    kind: tests
    concepts: [sec-cap-engagement, sec-cap-assessment, sec-cap-report-retest]
    title: Test cases for the assessment harness itself
    body: |
      | Case | Steps | Expected | Evidence |
      | --- | --- | --- | --- |
      | Excluded path | Request `/internal/admin`, `/%69nternal/admin` and `/public/../internal/admin` | All refused with the same reason; nothing sent | The three refusals and the empty send log |
      | Other host, port, scheme | Request another host, another port on the target host, `https`, and a URL with user info | Each refused | The four reasons |
      | Method | `DELETE` a payment | Refused; budget unchanged | The refusal and the used count |
      | Budget | Set a budget of 3 and send 4 requests | The fourth raises `BudgetExhausted`; three requests sent | The error and the log length |
      | Refusals are free | Send five refused requests, then two allowed ones, under a budget of 2 | Both allowed requests are sent | The log and `refused` list |
      | No redirect following | `GET /login?next=` another site | A 302 comes back; one request logged | The status, the `Location` and the log |
      | Query not logged | `GET /api/payments?status=captured` | The log holds the path only | The log entry |
      | Positive control | Break the control (a nonexistent URL) | `ControlFailed`, so `inconclusive` | The verdict and reason |
      | Vulnerable portal | Run every probe | Every probe returns evidence; no secret or digit run in any evidence | The 17 results |
      | Fixed portal | Run every probe on `make_app(FLAWS)` | Every control works and no probe reports | 15 `not-found` |
      | One fix at a time | For each flaw, run on a portal where only that flaw is fixed | That probe is `not-found`; the other 14 still `found` | 15 runs |
      | Down portal | Point the run at a closed port | Every probe `inconclusive` with "transport error", never `not-found` | The counts |
      | Spent budget | Budget of 12 | `not-run` from the break onward; no later probe called | The counts |
      | Ordering | Three found results with scores 9.3, 7.1 and 7.1 | Worst first, ties by flaw id, ids numbered after sorting | The ids |
      | Retest table | Every before/after pair of verdicts | One outcome each, as in the table | 16 cases |
      | Absent in the retest | Drop one probe from the second run | `unverified`; `clean_bill` false; exit code 2 | The three results |

  - id: mistakes
    kind: mistakes
    concepts: [sec-cap-engagement, sec-cap-assessment, sec-cap-report-retest]
    title: Common mistakes
    body: |
      - **Treating "nothing found" as "not vulnerable".** Without a control that worked, a login that returned 429 or a typo in a URL looks the
        same as a safe endpoint. Run the control first and keep a verdict for "could not test".
      - **Letting the HTTP library follow redirects.** The target then decides where the test goes next. Read the `Location` header; do not visit it.
      - **Checking scope in the probe instead of under it.** A probe that remembers to check is a probe that one day forgets. One wrapper, every request.
      - **Logging query strings.** They carry tokens and search terms. Evidence that copies them leaks them again.
      - **Counting a refused request against the budget** - or, worse, not counting the *sent* ones. Both make the number meaningless.
      - **Reporting 12 of 15 as 15.** When the budget ends a run, the missing probes are `not-run`, and the report says so.
      - **Treating a crashed probe as a pass.** An exception proves nothing about the target.
      - **Testing with values that change data** where a harmless one would prove the same thing. Send back the value a field already has; use a tag that does nothing.
      - **Recording secrets as evidence.** "The settlement-keys file was served" is evidence; the key is a second leak.
      - **Logging in again for every probe.** Once the login limit is fixed, your own controls fail and every result after the fifth login is inconclusive.
      - **Calling a flaw fixed because the retest ran fewer checks.** Compare against the original list: a missing probe is `unverified`.
      - **Giving a clean bill for "the system".** It is "these checks, this build, this date". The fixed practice portal still has its CSP and HSTS shortcomings.
      - **Scoring by habit.** The score follows the vector, and the vector follows the evidence: the stack-trace flaw is High only because a key was in the trace.
      - **Ending at the retest.** A fix without a regression test lasts until the next refactor.
      - **Testing something because you could.** An out-of-scope request that "worked" is still out of scope; stop, and tell the owner.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [sec-cap-engagement, sec-cap-assessment, sec-cap-report-retest]
    title: Trade-offs
    body: |
      | Choice | Gain | Cost |
      | --- | --- | --- |
      | A guard wrapper under every probe | Rules cannot be forgotten; refusals are on record | Every probe must use it, and an ambiguous rule is refused, not guessed |
      | A small request budget | A runaway loop stops itself | A real run may need a larger budget, agreed in advance |
      | Harmless test values | No data changed, safe on shared environments | Some flaws are proved less dramatically than a real exploit would |
      | A positive control per probe | "Not found" means something | A few extra requests, and a control that fails for the wrong reason makes a probe inconclusive |
      | Five verdicts | The report cannot hide what was not tested | More to explain to a reader who wanted pass or fail |
      | Owner-supplied evidence for hashes and logs | Covers what no request can see | It relies on the owner's honesty, and has to be in the agreement |
      | Pinned scores in the fixture | Tests that do not depend on another exercise | They must be re-checked when the scorer changes (the demo does) |
      | Sorting by score | Worst first, stable ids | A tie hides which is more urgent; the owner's context decides |
      | A mirror retest | A fix is verified by the same test | Cost grows with the suite, and new risk needs new probes |
      | `exit_code` 1 versus 2 | A pipeline can tell a failure from an unknown | Teams must decide whether 2 blocks a release |

  - id: summary
    kind: summary
    concepts: [sec-cap-engagement, sec-cap-assessment, sec-cap-report-retest]
    title: Quick reference
    body: |
      - **No written authorisation, no first request.** The rules of engagement (SP 800-115: "detailed guidelines and constraints regarding the execution of information security testing") say what may be touched.
      - **Put the rules in code**: one guard under every probe checks the budget, then the scope (scheme, user info, host and port, method, excluded paths after decoding and `..`), never follows redirects, and logs method, path and status only.
      - A refused request is never sent and costs no budget; a spent budget stops the run.
      - **Probe = control, harmless value, evidence without secrets.** Prove it red/green: found on the vulnerable build, quiet where only its flaw is fixed.
      - **Five verdicts**: `found`, `not-found`, `inconclusive` (control failed, transport error, probe crashed), `blocked` (refused), `not-run` (budget). Only the first two say anything about the flaw.
      - Some flaws cannot be seen from outside (hashes, secrets in logs): use owner-supplied evidence and state the coverage - here 15 from outside, 2 supplied.
      - **Finding** = title, CWE, CVSS vector and score, rating, redacted evidence, WSTG/ASVS references; worst first, ties by name, ids after sorting; a found flaw with no catalogue entry must raise.
      - **Report** = executive summary, findings, limitations (what was not tested and why), appendices; "point in time".
      - **Retest = mirror of the first test.** Outcomes: fixed, still-open, new, unchanged, newly-tested, unverified. A flaw the retest could not test is `unverified`, never fixed.
      - **Exit code**: 1 for still-open or new, 2 for unverified, 0 otherwise. **Clean bill**: every expected probe present and `not-found` - "these checks, this build, this date".
      - **Hand over**: each fixed finding gets a regression test; track the registry's coverage.

exercises:
  - id: cap-scope-first
    type: mcq
    concept: sec-cap-engagement
    skill: recognition
    title: What comes before the first request?
    prompt: |
      A colleague is ready to start the assessment and asks what must exist before the first request is sent. Which answer is right?
    options:
      - id: written
        text: "Written authorisation from someone entitled to give it, and rules of engagement that name the target, the allowed techniques and what is off limits."
        feedback: "Correct. SP 800-115 has the ROE agreed before testing starts; everything else, including the guard, implements it."
      - id: tool
        text: "A working scanner, since the scan will show what is in scope."
        feedback: "A scanner finds things; it does not give permission, and it will happily test what it was never allowed to."
      - id: verbal
        text: "A verbal go-ahead from the developer who owns the code."
        feedback: "A developer is not necessarily entitled to authorise testing, and a verbal yes cannot be shown to anyone later."
      - id: later
        text: "Nothing - the scope can be agreed once the first findings come in."
        feedback: "Scope agreed after the fact is an excuse, not a rule, and the first request may already have been out of bounds."
    correct: [written]
    hints:
      - Who is entitled to say yes, and where is the yes written down?
    solution: |
      Written authorisation from an entitled person, plus rules of engagement that state the target, methods, exclusions and limits - before any request.

  - id: cap-guard-where
    type: mcq
    concept: sec-cap-engagement
    skill: application
    title: Where should the scope check live?
    prompt: |
      Fifteen probes are written by three people. Where should the scope and budget checks go so that none of them can be forgotten?
    options:
      - id: wrapper
        text: "In one HTTP wrapper that every probe must use, so every request is checked whether or not the author remembered."
        feedback: "Correct. The check is in the one place all requests pass through; a probe has no way to skip it."
      - id: each
        text: "At the top of each probe, as a comment reminding the author to check the scope."
        feedback: "A reminder is not a check. It works until the day someone is tired."
      - id: review
        text: "In code review only."
        feedback: "Review helps but cannot see a request built at runtime from a redirect or a parameter."
      - id: trust
        text: "Nowhere - the testers know the scope."
        feedback: "Knowing the scope is not enforcing it, and a loop or a redirect does not know it at all."
    correct: [wrapper]
    hints:
      - Which place does every request, including one that follows a redirect, pass through?
    solution: |
      A single wrapper under every probe: budget, scope, redirect policy and logging happen on every request, by construction.

  - id: cap-control
    type: mcq
    concept: sec-cap-assessment
    skill: analysis
    title: Why does every probe run a control first?
    prompt: |
      The IDOR probe first reads Alice's own payment and raises an error if that fails. What does the control buy?
    options:
      - id: meaning
        text: "It makes 'not found' mean something: if the control worked, a missing flaw is the target's answer, not a broken login or a wrong URL."
        feedback: "Correct. Without it, a failed login looks exactly like a secure endpoint."
      - id: speed
        text: "It makes the probe faster."
        feedback: "It costs a request. The gain is correctness, not speed."
      - id: coverage
        text: "It increases the number of flaws found."
        feedback: "It does not find anything; it stops false reassurance."
      - id: login
        text: "It logs the user in so later probes can use the token."
        feedback: "Caching the login is a different habit. The control's job is to prove the test could have worked."
    correct: [meaning]
    hints:
      - What would a probe report if the login had failed with a 500?
    solution: |
      A control that worked proves the probe could have seen the flaw; only then is "not found" an answer about the target.

  - id: cap-inconclusive
    type: mcq
    concept: sec-cap-assessment
    skill: analysis
    title: Which verdict is this?
    prompt: |
      During a run the portal restarts and the CSRF probe gets a connection error. What should the runner record?
    options:
      - id: inconclusive
        text: "inconclusive, with the reason 'transport error: ConnectionError' - the probe proved nothing about CSRF."
        feedback: "Correct. A transport error is not an answer from the portal."
      - id: notfound
        text: "not-found, because no flaw was seen."
        feedback: "Nothing was seen because nothing was reached. That is the mistake the fifth verdict exists to prevent."
      - id: found
        text: "found, because an error might hide a flaw."
        feedback: "An error is not evidence of a flaw either."
      - id: skip
        text: "Nothing - leave the probe out of the report."
        feedback: "A probe that vanishes from the report makes the coverage look better than it was."
    correct: [inconclusive]
    hints:
      - Can the result say anything about the flaw?
    solution: |
      inconclusive with the transport error as the reason; it counts as a limitation, never as a pass.

  - id: cap-budget
    type: mcq
    concept: sec-cap-assessment
    skill: application
    title: The budget runs out at probe 6 of 15
    prompt: |
      The request budget is spent while probe 6 is running. How should the report read?
    options:
      - id: notrun
        text: "Five results, the sixth and every later probe as not-run (0 requests each), and the run stops - the report says the assessment was incomplete."
        feedback: "Correct. The missing probes stay on the list as not-run so the report cannot imply 15."
      - id: skip
        text: "Report five results as the assessment."
        feedback: "That reads as a complete test of five things instead of an incomplete test of fifteen."
      - id: notfound
        text: "Mark the remaining ten as not-found; they were not seen to be vulnerable."
        feedback: "They were not tested. Not-found needs a probe that ran and a control that worked."
      - id: raise
        text: "Raise the budget silently and carry on."
        feedback: "The budget is part of the agreement; raising it is a decision for the owner, not the tester."
    correct: [notrun]
    hints:
      - Which verdict means "it never ran"?
    solution: |
      The probe that hit the budget and every later one are not-run; the run stops, and the report states that it is incomplete.

  - id: cap-whitebox
    type: mcq
    concept: sec-cap-assessment
    skill: analysis
    title: Why can no request show weak password hashing?
    prompt: |
      Black-box probes find 15 of the portal's flaws but not the unsalted MD5 password hashes. Why, and what should the report do?
    options:
      - id: invisible
        text: "No response contains the stored hash or the log, so the flaw is invisible from outside; the report states the gap and uses evidence the owner supplies (a hash extract, a log sample) or a code review."
        feedback: "Correct. Coverage is a statement about method, and some flaws need a different method."
      - id: weak
        text: "The probes were not strong enough; with more requests they would find it."
        feedback: "More requests will not reveal data the server never sends."
      - id: ignore
        text: "It does not matter, because a black-box assessment is complete by definition."
        feedback: "Black-box means the tester has no inside knowledge, not that it sees everything."
      - id: guess
        text: "Guess from the login time that the hash is weak."
        feedback: "A guess is not evidence."
    correct: [invisible]
    hints:
      - Does any response contain a password hash?
    solution: |
      No response exposes it. State the coverage gap and check it from owner-supplied evidence or a code review.

  - id: cap-clean
    type: mcq
    concept: sec-cap-report-retest
    skill: analysis
    title: What does a clean retest prove?
    prompt: |
      The retest of the fixed portal shows all 17 probes `not-found`. What may the report say?
    options:
      - id: these
        text: "On the tested build and date, none of these 17 checks reports its flaw - not that the portal is secure."
        feedback: "Correct. The checks were chosen from a list; the fixed portal still lacks object-src and base-uri in its CSP and sends HSTS over HTTP."
      - id: secure
        text: "The portal is secure."
        feedback: "A set of probes cannot prove that, and this one shows two known shortcomings."
      - id: always
        text: "These flaws can never come back."
        feedback: "Only a regression test guards the next build."
      - id: nothing
        text: "Nothing - retests prove nothing."
        feedback: "They prove what the mirror test checked, which is the point."
    correct: [these]
    hints:
      - Which claim is limited to what was actually run?
    solution: |
      Only that these 17 checks do not report their flaws on that build and date.

  - id: cap-ssrf-scope
    type: mcq
    concept: sec-cap-engagement
    skill: application
    title: The SSRF test and the excluded path
    prompt: |
      The scope excludes `/internal/`. The SSRF probe asks the webhook test endpoint to fetch the portal's own `/health` page. Why is that allowed?
    options:
      - id: inscope
        text: "The request the tester sends goes to an in-scope endpoint, and the target's own harmless page proves the server fetches internal URLs for a caller; the rules should say so in words."
        feedback: "Correct. The flaw is the server's request, the tester's request is in scope, and the ambiguity belongs in the agreement."
      - id: bypass
        text: "It bypasses the guard, which is acceptable for SSRF."
        feedback: "The guard sees every request the tester sends; it is not bypassed."
      - id: never
        text: "It is not allowed; SSRF cannot be tested when a path is excluded."
        feedback: "SSRF can be proved with a harmless internal URL, without touching the excluded path directly."
      - id: any
        text: "Any internal URL is fine, including `/internal/admin`."
        feedback: "That would use the flaw to read what the owner excluded - exactly what the exclusion forbids."
    correct: [inscope]
    hints:
      - Which request is sent by the tester, and which by the server?
    solution: |
      The tester's request is in scope and the probe uses a harmless internal page; the agreement should state this case explicitly.

  - id: cap-retest-mirror
    type: mcq
    concept: sec-cap-report-retest
    skill: analysis
    title: Why repeat the same probes?
    prompt: |
      A developer says: "Just rerun the checks for the four flaws you found last time - the others were fine." What is wrong with that?
    options:
      - id: mirror
        text: "SP 800-115 says verification is possible only if 'a mirror copy of the original test is performed'; a fix can break something else, a clean flaw can regress, and a smaller test can hide a gap."
        feedback: "Correct. The same list of probes, compared flaw by flaw, is the evidence."
      - id: time
        text: "Nothing - it saves time and is just as good."
        feedback: "It saves time and loses the ability to find new or regressed flaws."
      - id: more
        text: "Only that more probes should always be added."
        feedback: "New probes are welcome but do not replace the mirror."
      - id: trust
        text: "They should be trusted; developers know their code."
        feedback: "Verification is not about trust; it is about evidence."
    correct: [mirror]
    hints:
      - Which outcome can only appear if the whole list is rerun?
    solution: |
      A retest is valid as a mirror of the original: it finds regressions and new findings as well as confirming fixes.

  - id: cap-retest-unverified
    type: mcq
    concept: sec-cap-report-retest
    skill: application
    title: The CSRF probe is missing from the retest
    prompt: |
      The first assessment found CSRF. The retest has no result for it at all (the probe was left out of the run). What is its outcome?
    options:
      - id: unverified
        text: "unverified: the retest has no usable answer, so the flaw cannot be called fixed, clean_bill is false and the pipeline exit code is 2."
        feedback: "Correct. Absence of a result is not a pass."
      - id: fixed
        text: "fixed, because it was not found this time."
        feedback: "It was not looked for. 'Not found' needs a probe that ran."
      - id: new
        text: "new, because it appears in a different place."
        feedback: "It does not appear at all."
      - id: unchanged
        text: "unchanged."
        feedback: "Unchanged means not found before and not found now; here there is no 'now'."
    correct: [unverified]
    hints:
      - What does `retest` do when the after-assessment has no entry for a flaw?
    solution: |
      unverified - never fixed; the clean bill is withheld and the exit code is 2.

  - id: cap-order-steps
    type: order
    concept: sec-cap-engagement
    skill: application
    title: Put the engagement in order
    prompt: Put the stages of the assessment in a sensible order.
    items:
      - id: auth
        text: Get written authorisation and agree the rules of engagement
      - id: guard
        text: Turn the scope into a guard that checks every request
      - id: probes
        text: Write probes with controls and harmless test values, and prove them red and green
      - id: run
        text: Run the assessment and read the verdict counts before the findings
      - id: report
        text: Build scored findings and write the report with its limitations
      - id: retest
        text: Retest with the same probes after the fixes and classify each flaw
      - id: handover
        text: Hand every fixed finding to the regression suite
    hints:
      - The guard exists before any probe sends a request.
      - Verdict counts come before the findings because they say how much to trust them.
    solution: |
      Authorisation and rules, the guard, probes with controls, the run (counts first), the report, the retest, and the regression hand-over.

  - id: cap-debug
    type: debug
    concept: sec-cap-assessment
    skill: analysis
    title: Which line turns a broken test into a pass?
    prompt: |
      This function gives one probe a verdict. A probe whose control fails still comes out as "not-found". Pick the line that is wrong.
    language: python
    code: |
      def verdict(probe, ctx):
          try:
              evidence = probe(ctx)
          except ControlFailed:
              return "not-found"
          return "found" if evidence else "not-found"
    correctLines: [5]
    hints:
      - Can a probe whose control failed say anything about the flaw?
      - Which verdict means "could not test"?
    lineNotes:
      - line: 3
        note: Fine - the probe runs once and returns evidence or None.
      - line: 4
        note: Catching ControlFailed is right; what is returned for it is the problem.
      - line: 6
        note: This line is correct for a probe whose control worked.
    solution: |
      Line 5 returns "not-found" for a probe that proved nothing. It should return "inconclusive" (with the control's message), so a broken test cannot read as a clean result.

  - id: cap-short
    type: short
    concept: sec-cap-report-retest
    skill: analysis
    title: Why is "unverified" its own outcome?
    prompt: |
      In two or three sentences, explain why a retest needs an "unverified" outcome instead of treating a flaw it could not test as fixed or as still open.
    modelAnswer: |
      A retest can verify a fix only by running the same test and seeing the flaw gone with a working control. If the probe was missing, blocked, out of budget or inconclusive, there is no evidence either way, so calling it fixed claims something nobody checked and calling it open claims something nobody saw. "Unverified" keeps the question open, withholds the clean bill and gives a pipeline a distinct exit code.
    rubric:
      - Says a fix is verified only by repeating the test with a working control.
      - Says a missing or inconclusive result is no evidence either way, so neither fixed nor open is justified.
      - Says unverified withholds the clean bill and keeps the issue visible.
    hints:
      - Which claim does each of the other two outcomes make?
    solution: Without a usable result there is no evidence, so fixed and still-open would both be unjustified; unverified withholds the bill and stays visible.

  - id: cap-testdesign
    type: testdesign
    concept: sec-cap-report-retest
    skill: application
    title: Design the retest of the fixed build
    prompt: |
      SandPay says all 17 findings are fixed in build 412. Design the retest - preconditions, steps, expected results and evidence for each check.
    modelAnswer: |
      Preconditions: written authorisation that covers the retest, the same rules of engagement and budget, the original assessment with its verdicts, the same probes and test accounts, build 412 on the staging address, and the owner-supplied evidence (hash extract, log sample) from the same sources.

      1. **Mirror run** - run every probe from the first assessment, unchanged, through the guard. Expected: 17 results, none `inconclusive`, `blocked` or `not-run`. Evidence: the verdict counts.
      2. **Controls** - confirm each control worked on build 412 (for example a login still succeeds). Expected: no `ControlFailed`. Evidence: the per-probe request counts.
      3. **Compare flaw by flaw** - classify each result against the first assessment. Expected: `fixed` for each flaw that was found. Evidence: the comparison table.
      4. **New findings** - look for any `new` outcome. Expected: none. Evidence: the table.
      5. **Owner-supplied evidence** - check a new hash extract and a new log sample. Expected: no 32-hex digests and no password text in the log. Evidence: the two counts, not the data.
      6. **Exit code and clean bill** - compute both. Expected: 0 and true. Evidence: the outputs.
      7. **Regression** - for each fixed finding, check that a test exists and passes red/green. Expected: coverage 1.0. Evidence: the registry check.
      8. **Report** - add the retest subsection with previous status, current status and cross-references, and the date and build. Evidence: the report.
    rubric:
      - Reruns the same probes under the same rules and budget, and compares flaw by flaw.
      - Checks controls and the verdict counts, not only the found count.
      - Looks for new findings and covers the owner-supplied evidence.
      - Ends with a worded clean bill and a regression check; every case has preconditions, steps, an expected result and evidence.
    hints:
      - What would you look at first to know whether the run can be trusted?
    solution: Run the same probes under the same rules, check the controls and counts, compare each flaw, look for new ones, check the supplied evidence, compute the exit code and clean bill, and verify the regression tests.

  - id: cap-interview
    type: interview
    concept: sec-cap-report-retest
    skill: analysis
    title: 'Interview: "so is the app secure now?"'
    prompt: '"You assessed our portal, we fixed everything you found, and your retest is clean. Can we tell our customers the portal is secure?"'
    modelAnswer: |
      I would tell them what the retest does and does not show. On that build and that date, every check from the first assessment ran, with a working control, and none reports its flaw - so the fixes are verified by a mirror of the original test. That is a strong statement about those checks. It is not a statement about the whole portal: the checks were chosen from a method, harmless values proved the flaws without exploiting them, a budget and the rules left some things untested, and two flaw classes needed evidence you supplied. The report's limitations section says all that, and the assessment is a point-in-time one.

      Then I would say what makes it last: an automated test for each finding, so a later release cannot bring one back unnoticed, and a repeat of the assessment before major releases. If they want a public statement, I would help them word it as "independently assessed and retested, with findings fixed", not "secure".
    rubric:
      - Separates "these verified checks" from "the whole system is secure".
      - Names the limits - method-based coverage, harmless values, budget and rules, owner-supplied evidence, point in time.
      - Suggests regression tests and a repeat assessment.
      - Offers wording that does not overclaim.
    followUps:
      - What would you say if one probe was unverified?
      - What would make you agree to a stronger wording?
      - How do you stop the same flaws returning?
    hints:
      - What did the retest actually repeat, and what could it not see?
    solution: Say the fixes are verified for the checks that ran, state the limits, recommend regression tests and a repeat, and avoid the word secure.

  - id: scope-code
    type: coding
    concept: sec-cap-engagement
    skill: application
    title: Write the guard that enforces the rules of engagement
    prompt: |
      In `practice/security/exercises/specialised/scap_scope.py`, implement `GuardedHttp.request`. The tests check that a path is joined onto the base URL, that a refused request raises
      `OutOfScope` and is never sent (other host, port, scheme, user info, a disallowed method, and the excluded path in three disguises), that the budget raises
      `BudgetExhausted` after the allowed number of sent requests and before the scope check, that refused requests use no budget, that redirects are never followed whatever the caller passes,
      that a timeout is always set, and that the log keeps the path but never the query.
    project: security
    files: [exercises/specialised/scap_scope.py]
    test: tests/specialised/test_scap_scope.py
    command: .venv/bin/python -m pytest tests/specialised/test_scap_scope.py
    modelAnswer: |
      ```python
      method = method.upper()
      url = self.scope.base_url + target if target.startswith("/") else target
      if self.used >= self.scope.max_requests:
          raise BudgetExhausted(f"request budget of {self.scope.max_requests} is used up")
      reason = check_scope(self.scope, method, url)
      if reason is not None:
          self.refused.append((method, url, reason))
          raise OutOfScope(reason)
      kw.pop("allow_redirects", None)
      kw.setdefault("timeout", TIMEOUT)
      resp = self.session.request(method, url, allow_redirects=False, **kw)
      self.log.append(LogEntry(method, urllib.parse.urlsplit(url).path, resp.status_code))
      return resp
      ```

      The budget comes first, a refusal is recorded but never sent, redirects are switched off after dropping the caller's value, and only the path is logged.
    rubric:
      - Every test in tests/specialised/test_scap_scope.py passes.
      - The budget is checked first and counts only requests that were sent.
      - A refused request raises OutOfScope with check_scope's reason, is recorded in refused and never reaches the session.
      - Redirects are never followed, a timeout is always set, and the log holds method, path and status only.
    hints:
      - "`check_scope` already contains the scope rule; the exercise is everything around it."
      - Drop the caller's allow_redirects before you pass your own.
      - "`urllib.parse.urlsplit(url).path` gives the path without the query."
    solution: Check the budget, ask check_scope, record and raise on a refusal, send with redirects off and a default timeout, then log the method, the path and the status.

  - id: assess-code
    type: coding
    concept: sec-cap-assessment
    skill: application
    title: Run the probes and build the findings
    prompt: |
      In `practice/security/exercises/specialised/scap_assess.py`, implement `run_assessment` and `to_findings`. The tests give probes that return evidence, return nothing, fail their
      control, raise transport errors and ordinary exceptions, are refused by the guard and run the budget out; they also run all fifteen real probes against the practice portal (every flaw
      found, none found on the fully fixed portal, and for each flaw the one-fix-at-a-time check), and they check the findings: worst first, ties by flaw id, ids numbered after sorting, a rating,
      references copied from the flaw map and a loud failure for a flaw with no catalogue entry.
    project: security
    files: [exercises/specialised/scap_assess.py]
    test: tests/specialised/test_scap_assess.py
    command: .venv/bin/python -m pytest tests/specialised/test_scap_assess.py
    modelAnswer: |
      ```python
      ctx = Context(http)
      for index, flaw in enumerate(names):
          before = http.used
          try:
              evidence = probes[flaw](ctx)
              status, text = ("found", evidence) if evidence else ("not-found", "the probe's control worked ...")
          except ControlFailed as exc:
              status, text = "inconclusive", str(exc)
          except BudgetExhausted:
              ...  # every probe from here on is not-run, then return
          except OutOfScope as exc:
              status, text = "blocked", f"refused by the rules of engagement: {exc}"
          except requests.RequestException as exc:
              status, text = "inconclusive", f"transport error: {type(exc).__name__}"
          except Exception as exc:
              status, text = "inconclusive", f"probe crashed: {type(exc).__name__}: {exc}"
          results.append(Result(flaw, status, text, http.used - before))

      rows.sort(key=lambda f: (-f["score"], f["flaw"]))
      for number, row in enumerate(rows, start=1):
          row["id"] = f"SP-CAP-{number:02d}"
      ```

      `BudgetExhausted` is caught before its parent `OutOfScope`. In `to_findings`, `catalogue[r.flaw]` is indexed (not `.get`) so a missing entry raises, and the reference lists are copied so a caller cannot change the shared table.
    rubric:
      - Every test in tests/specialised/test_scap_assess.py passes.
      - A failed control, a transport error and a crash are all inconclusive, with the documented reasons, and none is counted as not-found.
      - A refusal is blocked and the run continues; an exhausted budget marks this probe and every later one not-run and stops.
      - Findings are sorted by score then flaw id, numbered after sorting, rated, carry copied references, and a missing catalogue entry raises KeyError.
    hints:
      - Catch BudgetExhausted before OutOfScope - it is a subclass.
      - Result.requests is http.used after the probe minus before it.
      - Number the ids after you sort, not before.
    solution: Give each probe a verdict from what it returned or raised (never not-found for anything but a working control), stop and mark the rest not-run when the budget ends, then sort, number, rate and reference the findings.

  - id: retest-code
    type: coding
    concept: sec-cap-report-retest
    skill: application
    title: Compare the retest and decide who gets a clean bill
    prompt: |
      In `practice/security/exercises/specialised/scap_retest.py`, implement `retest`, `clean_bill` and `exit_code`. The tests check every pair of before and after verdicts, a flaw missing from the retest,
      a flaw that appears only in the retest, the order of the output, a note on every outcome, the clean-bill rule (every expected flaw present and not found) and the exit codes (1 for still-open or new,
      2 for unverified, 0 otherwise, a failure outranking an unknown).
    project: security
    files: [exercises/specialised/scap_retest.py]
    test: tests/specialised/test_scap_retest.py
    command: .venv/bin/python -m pytest tests/specialised/test_scap_retest.py
    modelAnswer: |
      ```python
      flaws = [r.flaw for r in before.results]
      flaws += [r.flaw for r in after.results if r.flaw not in flaws]
      for flaw in flaws:
          b, a = before.get(flaw), after.get(flaw)
          b_status = b.status if b else "absent"
          if a is None or a.status in UNTESTED:
              outcome = "unverified"
          elif a.status == "found":
              outcome = "still-open" if b_status == "found" else "new"
          elif b_status == "found":
              outcome = "fixed"
          elif b_status == "not-found":
              outcome = "unchanged"
          else:
              outcome = "newly-tested"

      def clean_bill(after, expected):
          return all((r := after.get(f)) is not None and r.status == "not-found" for f in expected)

      def exit_code(outcomes):
          kinds = {o.outcome for o in outcomes}
          return 1 if kinds & {"still-open", "new"} else 2 if "unverified" in kinds else 0
      ```

      The untested check comes first, so "could not test" can never become "fixed". The expected list for the clean bill comes from the first assessment.
    rubric:
      - Every test in tests/specialised/test_scap_retest.py passes.
      - A flaw the retest could not test, or lacks, is unverified whatever it was before.
      - Found now and found before is still-open; found now and not found before is new; found before and not found now is fixed.
      - clean_bill is true only when every expected flaw is present and not-found; exit_code gives 1, then 2, then 0.
    hints:
      - Test the after-status for "untested or absent" before anything else.
      - Build the flaw order from the before-assessment, then append the extras.
      - A set of outcome names makes exit_code three lines.
    solution: Classify each flaw by after-status first (untested means unverified), then by before-status; require every expected flaw to be present and not-found for a clean bill; return 1, then 2, then 0.

placement:
  - id: place-engagement
    type: mcq
    concept: sec-cap-engagement
    skill: application
    title: A refused request in the middle of a probe
    prompt: |
      One probe tries a path the rules exclude and the guard refuses it. What should happen to that probe and to the run?
    options:
      - id: blocked
        text: "The probe's verdict is blocked, with the refusal as the reason, and the run goes on with the next probe; the refusal costs no budget."
        feedback: "Correct. The rules stopped one test, not the assessment, and the report lists it."
      - id: stop
        text: "The whole run stops."
        feedback: "Only a spent budget ends the run; a refusal ends one probe."
      - id: ignore
        text: "Send the request anyway and note the breach later."
        feedback: "That is exactly what the guard exists to prevent."
      - id: notfound
        text: "Record not-found, since no flaw was seen."
        feedback: "Nothing was tested, so no flaw could have been seen."
    correct: [blocked]
    solution: A refusal makes the probe blocked and the run continues; it costs no budget.

  - id: place-assessment
    type: mcq
    concept: sec-cap-assessment
    skill: analysis
    title: Twelve of fifteen
    prompt: |
      A report says "12 of 15 probes found nothing". The run summary shows 9 not-found, 3 inconclusive and 3 not-run. What is wrong with the sentence?
    options:
      - id: counts
        text: "Only 9 probes found nothing with a working control; the other 6 gave no answer, and the report should list them as limitations."
        feedback: "Correct. Inconclusive and not-run results are not evidence of a clean target."
      - id: nothing
        text: "Nothing - 12 is the sum of the quiet probes."
        feedback: "Inconclusive and not-run were not quiet; they were silent."
      - id: bad
        text: "It should say 15, because every probe is part of the assessment."
        feedback: "That hides the difference between clear and untested."
      - id: found
        text: "It should call the 6 found."
        feedback: "They show nothing about the flaw either way."
    correct: [counts]
    solution: Only the not-found verdicts are clear; inconclusive and not-run results are limitations.

  - id: place-retest
    type: mcq
    concept: sec-cap-report-retest
    skill: application
    title: Which exit code?
    prompt: |
      A retest classifies 15 flaws as fixed, 1 as unverified and 1 as still-open. What should the pipeline's exit code be, and why?
    options:
      - id: one
        text: "1 - a known failure outranks an unknown, and the unverified flaw still needs a conversation."
        feedback: "Correct. Still-open or new gives 1 first; 2 is for a run whose only problem is what it could not test."
      - id: zero
        text: "0 - 15 of 17 are fixed."
        feedback: "A pipeline gate is not a percentage; one open finding fails it."
      - id: two
        text: "2, because something is unverified."
        feedback: "2 is used only when nothing is open or new."
      - id: three
        text: "It depends on the severity."
        feedback: "Severity may drive a policy, but the code's rule is outcomes first."
    correct: [one]
    solution: A still-open or new flaw gives exit code 1 even if another flaw is unverified.

recall:
  - id: recall-guard
    concept: sec-cap-engagement
    prompt: What does the guard check, in order, on every request?
    answer: The budget first (requests already sent), then the scope rule - plain http, no user info, loopback host, the target's exact host and port, an allowed method, and no excluded path after decoding and folding `..` - then it sends with redirects off and a timeout, and logs method, path and status (never the query).
  - id: recall-refused
    concept: sec-cap-engagement
    prompt: What happens to a refused request, and what does it cost?
    answer: It is recorded in the refused list, raises OutOfScope with the reason and is never sent, so it costs no budget. The probe's verdict is blocked and the run continues.
  - id: recall-control
    concept: sec-cap-assessment
    prompt: Why does a probe run a positive control, and what happens if it fails?
    answer: So that "not found" can only come from a request that worked. A failed control raises ControlFailed and the verdict is inconclusive, never not-found.
  - id: recall-verdicts
    concept: sec-cap-assessment
    prompt: Name the five verdicts and which of them say something about the flaw.
    answer: found and not-found do. inconclusive (control failed, transport error, probe crashed), blocked (refused by the rules) and not-run (budget used up) do not; they are limitations to report.
  - id: recall-whitebox
    concept: sec-cap-assessment
    prompt: Which two portal flaws cannot be seen from outside, and how are they checked?
    answer: weak-hash (unsalted MD5 in the database) and secret-logging (passwords in the access log). They are checked from evidence the owner supplies under the agreement, or by code review, and the report states the coverage - here 15 from outside, 2 supplied.
  - id: recall-retest
    concept: sec-cap-report-retest
    prompt: What are the retest outcomes and which one protects against false closure?
    answer: fixed, still-open, new, unchanged, newly-tested and unverified. Unverified protects against false closure - a flaw the retest could not test (missing, blocked, inconclusive, not run) is never fixed.
  - id: recall-clean
    concept: sec-cap-report-retest
    prompt: When may a clean bill be given, and how is it worded?
    answer: Only when every expected probe from the first assessment has a result and every result is not-found. Word it as "these checks, this build, this date", not "secure". Then hand each fixed finding to the regression suite.

