id: sast-and-secret-scanning
title: SAST and secret scanning
subject: security-testing
module: devsecops
level: intermediate
status: published
estimatedMinutes: 150
summary: Find security flaws and leaked credentials in source code without running it. Build a small static-analysis engine on Python's syntax tree (five rules that find the flaw and stay quiet when it is fixed), build a secret scanner from regexes, entropy and stop words that never prints the secret, and then do the part that decides whether anyone uses the tools - triage the findings, suppress with a reason, baseline the old ones and gate a pipeline on new findings only. Run against the deliberately vulnerable SandPay portal, with Semgrep and Gitleaks explained from their documentation.
tags:
  [
    SAST,
    static application security testing,
    static analysis,
    secret scanning,
    secrets detection,
    hard-coded credentials,
    CWE-798,
    Semgrep,
    Gitleaks,
    abstract syntax tree,
    AST,
    rules,
    taint analysis,
    Shannon entropy,
    stop words,
    allowlist,
    false positive,
    false negative,
    triage,
    baseline,
    suppression,
    nosemgrep,
    quality gate,
    shift left,
    pre-commit hook,
    secret rotation,
    git history,
    DevSecOps,
    security testing,
  ]

environment: |
  - **Runtime:** Python 3.12.3 in `practice/security/.venv` with pytest 9.2.0, on Linux. The exercises use only the standard
    library (`ast`, `re`, `hashlib`, `math`). Every output marked as run here was printed by the code shown, on
    21 November 2026, from `practice/security`. Nothing here depends on timing.
  - **Practice target:** the source code of `practice/security/support/sandpay_vuln.py`, the **deliberately vulnerable**
    SandPay merchant portal, scanned as text - it is never started in this lesson. Its string-built SQL, its MD5 password
    hash and its synthetic key-like constants are the real material. SandPay is fictional, and every key in
    `support/sast_fixture.py` (for example `sp_live_...`) was invented for this lesson and was never issued.
  - **Ethics:** scan only code you own or are **authorised in writing** to scan. A scanner pointed at someone else's
    repository, or at a colleague's personal repository, is reconnaissance. A real secret that you find is **not** yours to
    test: report the path and the rule, never the value, and never try the credential to "see if it works" unless the
    rules of engagement say so.
  - **Sources (read in full on 21 November 2026):**
    the OWASP [Source Code Analysis Tools](https://owasp.org/www-community/Source_Code_Analysis_Tools) page (its strengths
    and weaknesses of SAST are quoted); the Semgrep documentation,
    [Rule structure syntax](https://semgrep.dev/docs/writing-rules/rule-syntax),
    [Rule pattern syntax](https://semgrep.dev/docs/writing-rules/pattern-syntax),
    [Write rules](https://semgrep.dev/docs/writing-rules/overview) and
    [Ignore files, folders, and code](https://semgrep.dev/docs/ignoring-files-folders-code);
    the Gitleaks [README](https://github.com/gitleaks/gitleaks) (configuration, baseline, pre-commit hook, `gitleaks:allow`);
    the OWASP [Secrets Management Cheat Sheet](https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html)
    (rotation, revocation and deletion); [CWE-798, Use of Hard-coded Credentials](https://cwe.mitre.org/data/definitions/798.html).
    Their wording is quoted where it is quoted. As of that date the Gitleaks README says Gitleaks is "feature complete" and
    that future releases are security patches only, with the author moving to a project called Betterleaks - check which
    tool your team has chosen before you copy a configuration.
  - **Not run here:** Semgrep, Gitleaks, CodeQL, Bandit, TruffleHog and every CI service are **not installed and not run**.
    Their rule files, commands and flags are quoted from their documentation and labelled "from the docs, not run
    here". The engines you build are small teaching versions; they are not drop-in replacements.
  - **Not repeated here:** the injection and cryptography weaknesses themselves -
    [Testing for SQL injection](#/lesson/testing-sql-injection) and
    [Testing cryptography and data exposure](#/lesson/testing-cryptography-and-data-exposure); the developer's view -
    [OWASP Top 10 for developers](#/lesson/owasp-top-10-for-developers); how pipelines are built -
    [CI/CD for web apps](#/lesson/ci-cd-for-web-apps).

prerequisites:
  - security-testing-fundamentals
  - owasp-top-10-for-developers
  - testing-sql-injection
  - testing-cryptography-and-data-exposure

concepts:
  - id: sec-sast-rules
    name: Static analysis rules - matching risky code shapes
    summary: Static application security testing reads source code without running it. A rule describes a risky shape (a SQL call whose query is built by string formatting, an eval call, shell=True, MD5, verify=False) and the engine reports every place that shape appears, with a file, a line and a severity. A rule that matches syntax cannot tell safe input from unsafe input, so it produces false positives, and a flaw that has no matching rule is a false negative that nobody sees.
  - id: sec-secret-scanning
    name: Secret scanning - finding credentials in code and history
    summary: A secret scanner looks for credentials that were committed - API keys, passwords, private keys - with a regular expression per kind, a cheap keyword pre-check, an entropy filter and stop words that remove placeholders, and an allow comment for a known test value. A finding reports the path, the rule and a redacted value, never the secret. Because git remembers every commit, a secret that was ever pushed is compromised, and the fix is to rotate it, not to delete the line.
  - id: sec-scan-triage
    name: Triage, suppression, baselines and the gate
    summary: A scanner nobody trusts is turned off. Triage decides for each finding whether it is a true positive, a false positive, an accepted risk or a duplicate; a suppression records that decision on the code with a reason; a baseline of fingerprints stops old findings from blocking work; and a gate fails the pipeline only for new findings at or above an agreed severity. A fingerprint that ignores line numbers keeps a moved line from looking new, and an unknown severity must fail closed.

objectives:
  - Explain what SAST and secret scanning find and what they cannot, with the limits OWASP states, and say why a scan does not replace a test.
  - Read a Semgrep rule and a Gitleaks rule (from the documentation) and say what each field does - pattern, ellipsis, metavariable, severity, regex, keywords, entropy, allowlist.
  - Write a static-analysis rule on a syntax tree that finds the flaw and stays quiet when it is fixed, including the safe shapes that look risky.
  - Write a secret detector with regex, entropy and stop words that never stores the secret, and explain what to do when a real secret has been committed.
  - Triage a finding, suppress it with a reason, build a baseline from fingerprints and write a gate that fails closed.
  - Design a SAST and secret-scanning plan for a repository with expected results and evidence.

sections:
  - id: intuition
    kind: intuition
    concepts: [sec-sast-rules, sec-secret-scanning, sec-scan-triage]
    title: The idea in plain language
    body: |
      Picture two people checking a contract before it is signed.

      The first is a **proofreader with a list of dangerous phrases**. She never asks the other side anything and never
      watches the contract being used. She reads every page and underlines every sentence that looks like a trap:
      "unlimited liability", "automatically renews". She is fast, tireless and fair - she reads page 200 as carefully as
      page 1. But she has no idea whether *this* "automatically renews" matters in *this* deal, so some of her underlines
      are noise, and a trap that is not on her list passes straight through. That is **static analysis**: it reads the
      source code without running it and underlines the shapes that are often security bugs.

      The second is a **metal detector at the door** of the building. It does not understand contracts at all. It only
      knows what a key looks like. Anything that looks like a key makes it beep, and it beeps *before* the key leaves the
      building. There is one cruel twist: in this building every visitor is photographed, and the photos are kept for
      ever. If a key walks out once, deleting the key from the visitor's pocket later changes nothing - the photograph
      still shows it. That is **secret scanning** on a git repository: git keeps every commit, so a secret that was
      ever pushed has to be treated as stolen.

      Both tools are useful for the same reason and dangerous for the same reason. They are **cheap and early**: they run
      on every change, long before anyone runs the application. And they are **blunt**: they beep at test keys and
      example strings, they miss anything they were not taught, and a team that is beeped at all day learns to ignore the
      beeping. Most of the craft in this lesson is not in writing the rule. It is in the three habits that keep the tool
      believable: **triage** each finding, **record** the decision where the code is, and **block only on what is new**.

  - id: what
    kind: what
    concepts: [sec-sast-rules, sec-secret-scanning, sec-scan-triage]
    title: What the terms mean
    body: |
      **SAST - static application security testing.** OWASP's tools page defines it: "Source code analysis tools, also known as
      Static Application Security Testing (SAST) Tools, can help analyze source code or compiled versions of code to help find
      security flaws." *Static* means the program is not running; the tool works from the text.

      **A rule** is a description of a risky shape plus a message and a severity. In Semgrep, a rule file has the keys `id`,
      `message`, `severity`, `languages` and one of `pattern`, `patterns`, `pattern-either` or `pattern-regex`. Severity is
      `LOW`, `MEDIUM`, `HIGH` or `CRITICAL` (the older `INFO`, `WARNING` and `ERROR` still work). A **finding** is one place
      where a rule matched: a file, a line, the rule id and a severity.

      **Secret scanning (secret detection)** is a specialised kind of static analysis that looks for credentials rather than
      flaws: API keys, passwords, tokens, private keys. The weakness it targets has a name - CWE-798, "The product contains
      hard-coded credentials, such as a password or cryptographic key."

      | Term | Meaning |
      | --- | --- |
      | True positive | the finding is real: the flaw or the secret exists |
      | False positive | the finding is not a problem (a test key, a column name taken from an allow-list) |
      | False negative | a real problem that no rule matched - you never see it |
      | Suppression | a recorded decision that this finding is accepted, written next to the code |
      | Baseline | the set of findings that existed when you started; it stops old findings from blocking new work |
      | Fingerprint | a stable id for a finding, used to compare scans |
      | Gate | the step that turns findings into pass or fail for a pipeline |
      | Entropy | a measure of how random a string looks, in bits per character |

      **Two families of rule.** A *pattern* rule matches the **shape** of the code (a call to `execute` whose first argument is
      an f-string). A *data-flow* or *taint* rule follows a value from a **source** (where untrusted data enters) to a **sink**
      (where it is dangerous), and reports only when a path exists. The Semgrep overview says its rules "encapsulate pattern
      matching logic and data flow analysis", and its taint-mode rules are written with `pattern-sources` and `pattern-sinks`.
      The engine you build in this lesson is a pattern engine, and the lesson is honest about what that costs.

  - id: why
    kind: why
    concepts: [sec-sast-rules, sec-secret-scanning, sec-scan-triage]
    title: Why this matters and what it cannot do
    body: |
      **Why run it.** OWASP lists the strengths of SAST: it "scales well" ("can be run on lots of software, and can be run
      repeatedly (as with nightly builds or continuous integration)"); it "identifies certain well-known vulnerabilities", and
      its examples are buffer overflows and SQL injection flaws; and "output helps developers, as SAST tools highlight the problematic code, by
      filename, location, line number, and even the affected code snippet." It also says that feedback from SAST "can save time
      and effort, especially when compared to finding vulnerabilities later in the development cycle." A tester who finds a
      string-built query in a pull request has found the bug **before** there is a deployed system to attack.

      **What it cannot do.** The same OWASP page is blunt about the weaknesses:

      - it is "difficult to automate searches for many types of security vulnerabilities, including" authentication
        problems, access control issues and insecure use of cryptography;
      - "current SAST tools are limited. They can automatically identify only a relatively small percentage of application
        security flaws";
      - "high numbers of false positives";
      - "frequently unable to find configuration issues, since they are not represented in the code";
      - "difficult to 'prove' that an identified security issue is an actual vulnerability".

      Read that as a tester. A clean SAST report **does not mean the application is secure** - it means that no rule matched.
      Access control issues are on OWASP's own list of what SAST does poorly, and that is why the other lessons in this
      track still need a human with a proxy. SAST and secret scanning are **one layer**, chosen because
      they are cheap, early and repeatable.

      **Why secrets get their own tool.** A leaked credential is different from a flaw: it needs no exploit. Whoever reads it
      can use it, as you. And in git the damage is permanent. The OWASP Secrets Management Cheat Sheet says that revoked or
      rotated secrets "must be removed from the exposed system immediately, including secrets discovered in code or logs", and
      that rewriting git history to remove one "may introduce other problems as it rewrites git history and will break any
      other links to a given commit." So the order of work is fixed: **revoke and rotate first**, clean up second. The scanner's
      job is to catch the key at the door - in a pre-commit hook or on the pull request - while rotating is still free.

      **Why triage is the real subject.** A scan with 400 findings on day one gets ignored on day two. A tester's value is
      deciding which findings are real, saying why, and setting up the pipeline so that the next scan only shows what is new.
      That judgement is the part a tool cannot do.

  - id: sast-internals
    kind: internals
    concepts: [sec-sast-rules, sec-scan-triage]
    title: Under the hood - how a static analyser finds a flaw
    body: |
      A static analyser does four things, in this order.

      1. **Parse.** The source text becomes a tree. Python ships its own parser: `ast.parse(source)` returns the *abstract
         syntax tree*, where `db.execute(f"... {status}")` is a `Call` node whose function is an `Attribute` (`execute` on
         `db`) and whose first argument is a `JoinedStr` (an f-string) holding a `FormattedValue` (the `{status}` part).
         Comments, spacing and quote style are gone. That is why a rule written on the tree is not fooled by
         `db .execute( f'...' )`, while a text search is.
      2. **Match.** Each rule looks for a shape in the tree. Here it is the `Call` nodes that matter, so the engine walks
         the whole tree (`ast.walk`) and tests every call against every rule.
      3. **Report.** A match becomes a finding: rule id, line (`node.lineno`, the line where the call *starts*), severity and
         message.
      4. **Decide.** Triage, suppressions, baselines and a gate (the third concept) turn findings into a result.

      **The five rules you write** (all are about calls, and each came from a flaw this track has already shown):

      | Rule id | Matches | Does not match |
      | --- | --- | --- |
      | `sql-built-from-string` | a method such as `execute` or `query` whose **first argument is built at run time**: an f-string with a `{...}`, `+` or `%` with a non-literal operand, or `"...".format(x)` | a literal, a plain variable (`db.execute(QUERY, params)`), or two literals joined (`"a" + "b"`) |
      | `eval-exec` | the builtin `eval` or `exec` | `ast.literal_eval` |
      | `shell-true` | `subprocess.run`, `call`, `Popen` and friends with `shell=True` | an argument list, or `shell=False` |
      | `weak-hash` | `hashlib.md5` or `hashlib.sha1` | the same call with `usedforsecurity=False` (a checksum, not a security use) |
      | `tls-verify-off` | any call with `verify=False` | `verify=True`, or a path to a CA bundle |

      The right-hand column matters as much as the left. A rule that fires on `db.execute(QUERY, params)` would make every
      parameterised query a finding, and the team would switch the rule off in a week. **A rule is only as good as its
      "ok" cases.** Semgrep rule authors test this the same way: the documentation's example annotates matching code with
      `# ruleid: <id>` and safe code with `# ok: <id>`.

      **Pattern rules have a blind spot you can see on the portal.** The rule checks the *shape* of the first argument. It
      cannot tell **where the value came from**. Two lines of `sandpay_vuln.py` produce the same finding, and only one is a
      vulnerability:

      - `self.query(f"SELECT * FROM payments WHERE merchant_id = '{u['merchant_id']}' AND status = '{status}' ...")` - `status`
        comes straight from the query string. A true positive: SQL injection.
      - `self.execute(f"UPDATE users SET {key} = ? WHERE id = ?", ...)` - the f-string inserts `key`, but `key` comes from
        `sorted(set(data) & allowed)`, where `allowed` is a hard-coded set of column names. The *value* is parameterised and the
        *column name* is allow-listed. Not injectable, but still a finding - a false positive of a syntax rule. (It is a
        poor design all the same: the list must stay hard-coded. Triage can say "false positive" and "worth a comment".)

      A taint rule would separate the two by asking whether untrusted input reaches the sink. That is better, and it is
      slower, harder to write and still imperfect. The pragmatic stance is the one the tool vendors take: use patterns for
      the many cheap cases, taint for the few that matter, and **always triage by reading the code**.

  - id: secret-internals
    kind: internals
    concepts: [sec-secret-scanning, sec-scan-triage]
    title: Under the hood - how a secret scanner decides
    body: |
      A secret scanner is a pipeline of filters. Each filter removes noise, and the order is chosen for cost.

      1. **Keywords (cheap).** Before running a regex, check whether a word such as `secret`, `token` or `password` appears
         in the line at all. Gitleaks calls these `keywords` and says they are used "for pre-regex check filtering": "a quick
         string compare check" that skips the rule when none is present.
      2. **Regex (candidates).** A rule per kind of secret. A vendor key has a fixed prefix and length, so its regex is
         precise (`sp_live_` followed by 20 or more letters and digits). A *generic* rule matches the **name** of a variable
         (`password`, `api_key`, `token`) followed by `=` and a quoted value, and takes the value as the candidate. Gitleaks'
         `secretGroup` setting says which capture group of the regex is the secret.
      3. **Entropy (is it random?).** Real keys are random-looking; placeholders are not. **Shannon entropy** measures that, in
         bits per character: `-sum(p * log2(p))` over the characters of the string, where `p` is how often each character
         appears. `aaaa` scores 0. `abcd` scores 2. A 24-character string of 24 different characters scores log2(24), about 4.58.
         Gitleaks' `entropy` option is "the minimum shannon entropy a regex group must have to be considered a secret". The
         generic rule here uses 3.5.
      4. **Stop words (known noise).** Strings such as `example`, `changeme`, `your_` and `placeholder` are never real. Gitleaks
         allowlists support `stopwords`, with a note that this "targets the extracted secret, not the entire regex match".
      5. **Allowlists (decisions).** A line with an allow comment is skipped (Gitleaks: a `gitleaks:allow` comment "will
         instruct gitleaks to ignore that secret"), and whole paths such as `tests/` can be skipped. Gitleaks allowlists can also
         name commits, paths and regexes, with `condition` set to `OR` (the default) or `AND`.
      6. **Redact (never print it).** The finding keeps the first four characters and `***`. A secret scanner whose report is
         itself a leak - pasted in a ticket, a pull request comment, a log - has made things worse.

      **Dedupe.** `api_key = "sp_live_..."` matches the specific rule *and* the generic one. Report it **once**, by the more
      specific rule, or the same secret is rotated twice and counted twice.

      **What entropy cannot do.** It filters placeholders, but it also drops real passwords that look human (`Summer2026!`
      scores low) and keeps long random-looking identifiers that are not secrets (a content hash, a UUID-like id). That is the
      permanent trade-off: lower the threshold and you get noise; raise it and you miss real credentials. Every secret scanner
      is tuned somewhere on that line.

      **History.** Scanning the working tree finds what is there *now*. A leak that was deleted three commits ago is still in
      the history, so scanners also walk commits - Gitleaks has a `git` command for that, and a `--baseline-path` option to
      ignore findings that are already in an earlier report. For the response to a hit, the cheat sheet's guidance is to revoke
      or rotate the secret and remove it from the exposed system. Checking the access logs for any use of the old
      credential is the tester's own addition, and worth doing before you close the finding.

  - id: when
    kind: when
    concepts: [sec-sast-rules, sec-secret-scanning, sec-scan-triage]
    title: When to use it, and when not to
    body: |
      **Use SAST when**

      - the language and framework are covered by rules (mainstream web languages are; a niche DSL is not);
      - you want a **repeatable, cheap** check on every pull request, not a one-off audit;
      - the bug classes you care about have a recognisable **shape** - injection sinks, dangerous functions, weak crypto calls,
        disabled TLS checks, hard-coded keys.

      **Use secret scanning when**

      - there is any shared repository - which is always - and especially for configuration files, test fixtures and
        copied snippets;
      - it can run **before** the push (a pre-commit hook) as well as on the pull request. Gitleaks documents a pre-commit
        configuration, and a note that setting `SKIP=gitleaks` disables the hook for one commit - which is why the
        pull-request scan must exist as well. A hook on a laptop is advice; a server-side scan is a control.

      **Do not rely on either when**

      - the risk is in **design or behaviour** - broken access control, business logic, race conditions, a missing rate limit.
        Those need the tests from the earlier lessons;
      - the risk is in **configuration** the code does not contain (an open storage bucket, a missing security header). OWASP
        lists configuration issues among what SAST cannot find;
      - there is **no one to triage**. A scanner added without an owner produces a backlog, not security.

      **Treat results as leads.** A finding says "look here". A report to a developer says "this input reaches this sink and
      here is the request that proves it". The second sentence needs a test (the other lessons of this track), not a
      scanner.

  - id: visual-pipeline
    kind: visual
    concepts: [sec-sast-rules, sec-secret-scanning, sec-scan-triage]
    title: Where each check runs
    body: |
      ```mermaid
      flowchart LR
        A["Developer edits code"] --> B["Pre-commit hook: secret scan on staged changes"]
        B -- "secret found" --> X["Commit refused: remove it, rotate if it was real"]
        B -- "clean" --> C["Push and open pull request"]
        C --> D["CI: SAST rules plus secret scan of the new commits"]
        D --> E["Compare with the baseline by fingerprint"]
        E -- "new finding at or above the gate" --> F["Pipeline fails: triage the finding"]
        E -- "only baselined or lower findings" --> G["Pipeline passes: merge allowed"]
        F -- "true positive" --> H["Fix, then rescan"]
        F -- "false positive or accepted" --> I["Suppress with a reason, reviewed in the PR"]
        H --> D
        I --> D
      ```

      The hook is fast and local, so it catches the *accident*. The CI scan is the one that cannot be skipped, so it is the *control*.
      The gate looks at **new** findings only, which is what lets a team adopt the tool on an old codebase without a month of
      cleaning first. And a suppression goes back through the same scan, in the same pull request, where a reviewer sees it.

  - id: visual-triage
    kind: visual
    concepts: [sec-sast-rules, sec-scan-triage]
    title: Triaging one finding
    body: |
      ```mermaid
      flowchart TD
        S["A finding: rule, file, line"] --> R["Read the code around it"]
        R --> Q1{"Can untrusted input reach the flagged value?"}
        Q1 -- "yes" --> TP["True positive: prove it with a request or a unit test, then report"]
        Q1 -- "no" --> Q2{"Is the reason in the code or only in your head?"}
        Q2 -- "in the code, for example an allow-list" --> FP["False positive: suppress with a reason, or tighten the rule"]
        Q2 -- "only in my head" --> TP2["Treat as a true positive: make the safe path explicit in the code"]
        TP --> Q3{"Fix now?"}
        Q3 -- "no" --> AR["Accepted risk: owner, reason and an expiry date, then baseline"]
        Q3 -- "yes" --> FX["Fix and rescan"]
      ```

      The second question is the one people skip. "It is safe because the caller always validates" is a claim about *other* code.
      If the safety is visible in the same function (a hard-coded allow-list), the finding is a false positive. If it is not,
      the next person to call the function will not know - so you fix the code, not the report.

  - id: code-run
    kind: code
    concepts: [sec-sast-rules, sec-secret-scanning, sec-scan-triage]
    title: The three engines run on the practice portal
    body: |
      The solutions are in `practice/security/solutions/devsecops/`. Each script below imports one of them and prints a
      table. Outputs were printed on 21 November 2026 by exactly this code, run from `practice/security` with
      `PYTHONPATH=solutions:support .venv/bin/python <script>`.

      **1. Static analysis of the portal's source.** The portal is read as text and never started.

      ```python
      from devsecops.sast_rules import scan_source
      from sast_fixture import PORTAL_SOURCE

      source = PORTAL_SOURCE.read_text()
      lines = source.splitlines()
      for f in scan_source(source, "support/sandpay_vuln.py"):
          print(f"{f.line:>4}  {f.severity:<6} {f.rule_id:<22} {lines[f.line - 1].strip()[:52]}")
      ```

      Output:

      ```text
       118  MEDIUM weak-hash              return hashlib.md5(password.encode()).hexdigest()
       314  HIGH   sql-built-from-string  self.execute(f"UPDATE users SET {key} = ? WHERE id =
       332  HIGH   sql-built-from-string  rows = self.query(
      ```

      Three findings, and each needs a different triage decision. Line 118 is the MD5 password hash - the portal's `weak-hash`
      flaw, and a true positive. Line 332 is the call that starts the multi-line statement whose f-string holds `{status}`: the
      `sqli` flaw, a true positive (the finding is reported on the line where the **call** starts, not on the f-string line).
      Line 314 is the allow-listed column name from the previous section: a false positive.

      **2. Secret scanning of a synthetic settings file, and of the portal.**

      ```python
      from devsecops.sast_secrets import scan_text
      from sast_fixture import PORTAL_SOURCE, SETTINGS_FILE

      for f in scan_text(SETTINGS_FILE, "settings.py"):
          print(f"settings.py:{f.line}  {f.rule_id:<18} {f.redacted:<8} entropy {f.entropy}")
      print("--- the practice portal")
      for f in scan_text(PORTAL_SOURCE.read_text(), "sandpay_vuln.py"):
          line = PORTAL_SOURCE.read_text().splitlines()[f.line - 1].strip()
          print(f"sandpay_vuln.py:{f.line}  {f.rule_id:<18} {f.redacted:<8} entropy {f.entropy}   <- {line}")
      ```

      Output:

      ```text
      settings.py:1  sandpay-api-key    sp_l***  entropy 4.75
      settings.py:2  generic-secret     r7Q!***  entropy 4.0
      settings.py:8  private-key-block  ----***  entropy 3.2
      --- the practice portal
      sandpay_vuln.py:67  generic-secret     inte***  entropy 3.53   <- SECRET_FILE = "internal/settlement-keys.txt"  # what path traversal can reach
      ```

      Read the settings result against the file (`support/sast_fixture.py`, `SETTINGS_FILE`): of its eight lines, three are
      reported. Line 3 (`YOUR_API_KEY_HERE`) and line 4 (`changeme-changeme`) were dropped by **stop words**. Line 5 has the
      `scanner:allow` comment. Line 6 (`X-Retry-Token`) has a secret-looking variable name but too little entropy. Line 7 has
      no secret-looking name. And no finding shows more than four characters of a secret.

      The portal result is a **false positive worth studying**: the variable is called `SECRET_FILE` and the value is a *path*,
      so the generic rule matched the name and the entropy of a path is high enough. The portal's real key-like constants (for
      example `sandpay-practice-only-jwt-key`) were dropped by the stop word `practice`. That is how a real repository stays
      quiet - and how it can hide a real secret that happens to contain a stop word, which is why stop words must be short
      and specific.

      **3. The gate: baseline, a moved line, a new finding, a severity threshold.**

      ```python
      from devsecops.sast_rules import scan_source
      from devsecops.sast_triage import gate, make_baseline
      from sast_fixture import VULNERABLE_HANDLERS


      def as_findings(source, path):
          lines = source.splitlines()
          return [{"rule_id": f.rule_id, "path": path, "line": f.line, "severity": f.severity,
                   "text": lines[f.line - 1]} for f in scan_source(source, path)]


      today = as_findings(VULNERABLE_HANDLERS, "app/handlers.py")
      baseline = make_baseline(today)
      print("baseline entries:", len(baseline))

      # 1. someone adds 40 lines above everything: every line number moves
      moved = as_findings("# header\n" * 40 + VULNERABLE_HANDLERS, "app/handlers.py")
      shifted = gate(moved, baseline)
      print("after the shift:   exit", shifted["exit_code"], "new", len(shifted["new"]), "known", shifted["known"])

      # 2. a new f-string query appears
      new_code = VULNERABLE_HANDLERS + '''

      def refunds(db, merchant):
          return db.execute(f"SELECT * FROM refunds WHERE merchant = '{merchant}'")
      '''
      added = as_findings(new_code, "app/handlers.py")
      result = gate(added, baseline)
      print("with a new query:  exit", result["exit_code"], "blocking",
            [(f["rule_id"], f["line"]) for f in result["blocking"]])

      # 3. the same finding at MEDIUM with the default threshold
      medium = [dict(f, severity="MEDIUM") for f in added
                if f["text"].lstrip().startswith("return db.execute(f\"SELECT * FROM refunds")]
      print("MEDIUM, fail_on HIGH:   exit", gate(medium, [])["exit_code"])
      print("MEDIUM, fail_on MEDIUM: exit", gate(medium, [], fail_on="MEDIUM")["exit_code"])
      ```

      Output:

      ```text
      baseline entries: 8
      after the shift:   exit 0 new 0 known 8
      with a new query:  exit 1 blocking [('sql-built-from-string', 40)]
      MEDIUM, fail_on HIGH:   exit 0
      MEDIUM, fail_on MEDIUM: exit 1
      ```

      Forty inserted lines moved every finding, and **none** became "new", because the fingerprint hashes the rule, the file and the
      *text* of the line - not its number. The new query is the only finding that blocks, and it is reported at line 40 of the
      changed file. The last two lines show the threshold at work: the same MEDIUM finding passes at `HIGH` and fails at `MEDIUM`.
      (Save the script as any file name you like, for example `demo_gate.py`, and run it with the `PYTHONPATH` above. It uses
      the solutions; after you solve the exercises, point `PYTHONPATH` at `exercises:support` to run your own versions.)

  - id: code-docs
    kind: code
    concepts: [sec-sast-rules, sec-secret-scanning, sec-scan-triage]
    title: The real tools' rule files, from their documentation (not run here)
    collapsed: true
    body: |
      None of this was run. It is the documentation's own wording, so that you can read a real rule after writing a small one.

      **A Semgrep rule** (the Rule structure syntax page, example for `patterns` with `pattern-not`):

      ```yaml
      rules:
        - id: unverified-db-query
          patterns:
            - pattern: db_query(...)
            - pattern-not: db_query(..., verify=True, ...)
          message: Found unverified db query
          severity: HIGH
          languages:
            - python
      ```

      The docs show it matching this test file, where the comments are the rule test's own annotations:

      ```python
      # ruleid: unverified-db-query
      db_query("SELECT * FROM ...")
      # ok: unverified-db-query
      db_query("SELECT * FROM ...", verify=True, env="prod")
      ```

      `...` is the **ellipsis operator**: "a sequence of zero or more items such as arguments, statements, parameters, fields,
      characters". The pattern page also documents `crypto.set_secret_key("...")` ("also works with constant propagation") for
      hard-coded strings, and the **deep expression operator** `<... $X ...>`, with `sql.query(<... $X ...>)` and
      `"..." + <... $X ...>` as examples of where it works. `$X` is a **metavariable**: it stands for one expression and can be
      reused.

      **My adaptation of those documented forms** (not from the docs as written, and not run - it needs `semgrep --test` against
      `# ruleid:` and `# ok:` cases like the ones in your exercise before you trust it):

      ```yaml
      rules:
        - id: sandpay.sql-built-from-string
          languages: [python]
          severity: HIGH
          message: SQL built by string concatenation; pass parameters instead
          pattern: $DB.execute("..." + <... $X ...>)
      ```

      **Suppressing in Semgrep.** The ignore page says to add a comment with `nosemgrep` "at the first line or preceding line of
      the pattern match" and that it "generates a finding that is automatically ignored". `# nosemgrep` with no rule id ignores
      every rule on that code; `# nosemgrep: rule-id` ignores one, and "to ignore multiple rules, use a comma-delimited list".
      The exercise's `is_suppressed` follows exactly this: the finding's line or the line before it, bare or by rule id.

      **A Gitleaks rule** (the README's configuration section, abridged):

      ```toml
      [extend]
      useDefault = true
      disabledRules = [ "generic-api-key" ]

      [[rules]]
      id = "awesome-rule-1"
      description = "awesome rule 1"
      regex = '''one-go-style-regex-for-this-rule'''
      secretGroup = 3
      entropy = 3.5
      keywords = [ "auth", "password", "token" ]

      [[rules.allowlists]]
      description = "ignore commit A"
      condition = "OR"
      commits = [ "commit-A", "commit-B" ]
      paths = [ '''go\.mod''', '''go\.sum''' ]
      stopwords = [ '''client''', '''endpoint''' ]
      ```

      Map each field to your `RULES` table in `sast_secrets.py`: `regex`, `secretGroup`, `entropy` and `keywords` are the four
      tuple fields after the id; `stopwords` is `STOPWORDS`; `paths` is `allow_paths`. The README adds that `regex` is a Go
      regular expression, which "does not support lookaheads", and that rules from an extended configuration override
      defaults with the same id.

      **Commands from the README** (also not run): `gitleaks git .` scans the repository history;
      `gitleaks git --baseline-path gitleaks-report.json --report-path findings.json` reports only issues that are not in the
      baseline report; the README's pre-commit section configures the hook, and `SKIP=gitleaks` before a commit skips it. A
      known test value on a line can be marked with a `gitleaks:allow` comment - which, like `nosemgrep`, is a suppression that
      a reviewer should see.

  - id: line-by-line
    kind: line-by-line
    concepts: [sec-sast-rules, sec-secret-scanning, sec-scan-triage]
    title: Reading the key lines of the three solutions
    body: |
      **`sast_rules.py` - is this string built at run time?**

      ```python
      def _is_dynamic_string(node):
          if isinstance(node, ast.JoinedStr):
              return any(isinstance(part, ast.FormattedValue) for part in node.values)
          if isinstance(node, ast.BinOp) and isinstance(node.op, (ast.Add, ast.Mod)):
              return any(isinstance(n, DYNAMIC_PARTS) for n in ast.walk(node))
          ...
      ```

      An f-string is dynamic only if it contains at least one `{...}` part - `f"SELECT 1"` is a constant. A `+` or `%` is dynamic if
      anything inside it is a name, attribute, call or subscript; `"a" + "b"` has none of these, so it is not a finding. The
      engine therefore *asks the tree* instead of searching the text for a plus sign.

      **`sast_rules.py` - suppress the safe look-alike.**

      ```python
      if base == "hashlib" and func.attr in ("md5", "sha1") \
              and not _is_constant(_keyword(call, "usedforsecurity"), False):
          hits.append("weak-hash")
      ```

      A checksum of a file is not a password hash. The rule reads the keyword argument and stays quiet when the author said so.

      **`sast_rules.py` - never look clean by accident.**

      ```python
      except SyntaxError as err:
          raise ValueError(f"cannot parse {path}: {err.msg} (line {err.lineno})") from err
      ```

      If the scanner returned an empty list for a file it could not read, a broken file would look like a clean one. Failing loudly
      is a design choice about **false negatives**.

      **`sast_secrets.py` - the order of the filters.**

      ```python
      if not any(word in lowered for word in keywords):   # 1. cheap pre-check
          continue
      ...
      if any(word in secret.lower() for word in STOPWORDS):  # 2. known noise
          continue
      entropy = shannon_entropy(secret)
      if min_entropy is not None and entropy < min_entropy:  # 3. is it random enough?
          continue
      ```

      Cheap checks first, expensive last, and a `reported` set per line so that the specific rule wins and the generic one does not
      repeat the same secret. The stored finding holds `redact(secret)`, never `secret`.

      **`sast_triage.py` - the fingerprint.**

      ```python
      normalised = " ".join(line_text.split())
      return hashlib.sha256(f"{rule_id}:{path}:{normalised}".encode()).hexdigest()[:16]
      ```

      No line number, and whitespace normalised, so re-indenting a block or inserting lines above it does not change the id. The
      trade-off is that two *identical* lines in one file share a fingerprint - baselining one baselines both - and that editing
      the flagged line makes it a new finding (usually what you want: someone touched it, so look again).

      **`sast_triage.py` - fail closed.**

      ```python
      if f["severity"] not in SEVERITIES:
          raise ValueError(f"unknown severity: {f['severity']!r}")
      ```

      A finding with severity `"High"` (wrong case) would otherwise compare as not-blocking and pass quietly. A gate must treat
      what it does not understand as a failure.

  - id: steps
    kind: steps
    concepts: [sec-sast-rules, sec-secret-scanning, sec-scan-triage]
    title: Adding SAST and secret scanning to a repository, step by step
    body: |
      1. **Agree scope and ownership.** Which repositories, which branches, who triages and within how many days. Write down
         that the scan reads code only and that nobody tests a discovered credential. A scanner without an owner is a backlog.
      2. **Start with the secret scan, on the history.** Scan the whole history once, in a throwaway report. Treat every real
         hit as an incident: **revoke or rotate first**, then remove from the code, then decide with the team whether a history
         rewrite is worth its cost. Check the access logs for use of the old credential.
      3. **Prove each tool on a known-bad and a known-good sample.** Before trusting a rule set, run it on code you know is
         vulnerable (the portal, a fixture) and on the same code fixed. Every flaw must be found and the fixed version must be
         quiet. This is the same negative control as in the web and API lessons.
      4. **Pick rules deliberately.** A small set that you have tuned beats a thousand rules nobody reads. Start with injection
         sinks, dangerous functions, weak crypto, disabled TLS verification and hard-coded keys.
      5. **Run it once and look at the whole report.** Do not gate yet. Sort by rule, then by severity. A single rule that
         produces most of the findings is usually a rule to tune, not 80 bugs.
      6. **Triage each distinct finding.** Use the decision flow: read the code, can untrusted input reach it, is the reason
         visible in the code. Record true positive, false positive, accepted risk or duplicate. Prove the true positives with a
         request or a unit test where you can.
      7. **Record decisions where the code is.** A suppression comment (`# nosemgrep: rule-id`, `gitleaks:allow`) with a **reason**
         in the same line or the line above, reviewed in the pull request. For an accepted risk add an owner and an expiry.
      8. **Baseline the rest.** Save the fingerprints of what you accepted today and commit the baseline. Fingerprints are hashes
         of the rule, the path and the line text, so for a **secret** finding the hash is derived from a line that holds the
         secret. Keep secret findings out of the baseline: rotate them instead.
      9. **Gate on new findings only.** Choose a threshold (for example `HIGH` and above blocks; lower severities are reported).
         Unknown severities fail the gate. Put the secret scan in a pre-commit hook **and** in CI.
      10. **Measure and maintain.** Track the false-positive rate per rule, the time to triage, and the number of suppressions.
          Review suppressions and accepted risks when they expire. A rule that is always suppressed should be fixed or removed.
      11. **Report to the team in findings, not in noise.** One message per true positive, with the file, the rule, the proof and
          the fix; one summary line for everything else.

  - id: example
    kind: example
    concepts: [sec-sast-rules, sec-secret-scanning, sec-scan-triage]
    title: A realistic scenario - the first scan of the SandPay portal
    body: |
      *This is a hypothetical walk-through built on the real output above; the team and the meeting are invented, the findings
      are the ones printed in this lesson.*

      Mei is the QA engineer on the SandPay merchant portal. The team has asked her to "add a security scan to the pipeline" this
      sprint. She does not turn the tool on and wait. She works in the order of the steps.

      **Secrets first.** She scans the repository history in a throwaway report. The generic rule reports one item in
      `sandpay_vuln.py`: `SECRET_FILE = "internal/settlement-keys.txt"`. She reads the line. The value is a *path*, not a key.
      A false positive of the name-based rule. She records "false positive: value is a file path" and adds a `scanner:allow` comment
      on that line rather than a stop word that would also hide real keys containing that word. The real key-like constants in the
      file (`sk_test_shop_a_practice` and the others) are dropped by the stop word `practice`, and she notes that this is a
      deliberate property of the practice portal's naming, not of her rule set.

      **SAST next.** Three findings, three decisions:

      | Finding | What she reads | Decision |
      | --- | --- | --- |
      | `weak-hash` at the MD5 helper | the password hash of the portal's `weak-hash` flaw | true positive, severity MEDIUM; file it |
      | `sql-built-from-string` where the multi-line query starts | `status` comes from the query string and goes straight into the SQL | true positive, HIGH; prove it with the SQL injection test from the earlier lesson, then file it |
      | `sql-built-from-string` at the profile update | the inserted `key` comes from `sorted(set(data) & allowed)` and `allowed` is a hard-coded set of column names | false positive of a syntax rule; suppress with a reason, and ask the developer to leave a comment on why the list must stay hard-coded |

      She proves the second one in thirty seconds with the portal's own test, so the report to the developer is "this input
      reaches this sink, here is the request", not "the scanner said so".

      **Baseline and gate.** The two true positives are **not** baselined - they are bugs. They fail the build until they are
      fixed, which is the point. The false positive carries a suppression with its reason. Everything else the tool might find
      in older code is baselined by fingerprint, so a pull request that adds nothing risky passes.

      **A month later.** A developer adds an `execute` call with an f-string. The pipeline fails on the new finding, at the
      line, with the rule id. A pull request that only moves code around does not fail, because the fingerprints did not change.
      That is a scanner people keep.

  - id: tests
    kind: tests
    concepts: [sec-sast-rules, sec-secret-scanning, sec-scan-triage]
    title: Test cases for a SAST and secret-scanning setup
    body: |
      | # | Case | Steps | Expected | Evidence |
      | --- | --- | --- | --- | --- |
      | 1 | Known-bad finds | scan a file with each flaw (f-string SQL, concatenation, `.format`, `%`, `eval`, `shell=True`, MD5, `verify=False`) | one finding per flaw, on the right line | the findings table |
      | 2 | Known-good is quiet | scan the same code with each flaw fixed | no findings | the empty report |
      | 3 | Look-alikes are quiet | scan parameterised queries, `ast.literal_eval`, an argument list, `usedforsecurity=False`, two joined literals | no findings | the empty report |
      | 4 | Multi-line statement | a call whose argument is on the next line | reported on the line where the call starts | the line number |
      | 5 | Unparseable file | scan a file with a syntax error | an error that names the file - not an empty result | the message |
      | 6 | Secret found | commit a synthetic key of a known vendor shape and a random-looking password | both reported, by rule | rule ids and lines |
      | 7 | Secret never printed | read the report and the log | at most four characters of a value, never the whole | the redacted text |
      | 8 | Placeholders ignored | `YOUR_API_KEY_HERE`, `changeme`, `example` values | no finding | the empty report |
      | 9 | Allow comment and path | a line with the allow comment; a file under an allowed path | skipped, and the allow is visible in review | the diff |
      | 10 | One finding per secret | a key assigned to `api_key` | reported once, by the specific rule | the finding count |
      | 11 | History | commit a synthetic key, then delete it in the next commit | the history scan still reports it | the commit id |
      | 12 | Baseline stability | add 40 lines above existing findings | no new findings, exit 0 | the gate result |
      | 13 | New finding blocks | add one new HIGH finding | exit 1, the finding named | the gate result |
      | 14 | Threshold | a new MEDIUM finding with the gate at HIGH and at MEDIUM | passes, then fails | the two exit codes |
      | 15 | Fail closed | an unknown severity or an unknown threshold | an error, not a pass | the message |
      | 16 | Suppression scope | `nosemgrep: other-rule` above a finding of a different rule | still reported | the report |
      | 17 | Hook is not the control | commit with the hook skipped | the CI scan still catches it | the CI result |

      Cases 1 to 3 are the same positive and negative controls you used on the portal in the earlier lessons: a rule that fires
      on the fixed code is noise, and a rule that stays quiet on the flawed code is blind.

  - id: mistakes
    kind: mistakes
    concepts: [sec-sast-rules, sec-secret-scanning, sec-scan-triage]
    title: Common mistakes and a debugging method
    body: |
      - **Reporting the scanner's output as findings.** "Semgrep found 212 issues" is a count, not a result. OWASP lists "high
        numbers of false positives" and "difficult to 'prove' that an identified security issue is an actual vulnerability". Triage,
        prove, and report the true positives one by one.
      - **Treating a clean scan as secure.** A scan with zero findings means no rule matched. Access control, business logic and
        configuration are outside what the tool can see.
      - **Deleting a leaked secret and moving on.** The key is in the history, in forks, in CI caches and in pull request diffs.
        Revoke or rotate first. A history rewrite is a separate, costly decision.
      - **Printing the secret.** A report, a ticket or a chat message that contains the full key is a second leak. Keep paths,
        rule ids and four characters at most.
      - **Entropy as a magic number.** A threshold that is too high misses passwords that look human; too low drowns you in hashes
        and ids. Tune it on your own repository, and keep keyword and regex filters in front of it.
      - **Stop words that are too broad.** A stop word like `test` silences every secret that contains the letters. Prefer specific
        words, and put known test values behind an allow comment that a reviewer sees.
      - **Suppressing without a reason.** `# nosemgrep` with nothing else is a promise that nobody can check. Write the reason on
        the same line, name the rule id so other rules still apply, and give an accepted risk an owner and an expiry.
      - **Fingerprinting by line number.** Every refactor then looks like a hundred new findings, the team learns to ignore the
        gate, and someone disables it.
      - **A gate that fails open.** An unknown severity, a missing report or a parse error that quietly returns "pass" is worse than
        no gate, because everyone assumes it works. Fail closed.
      - **Only a pre-commit hook.** The hook runs on the developer's machine and can be skipped. The pull-request scan is the control.
      - **Scanning code you are not allowed to scan.** A scanner pointed at an employer's or customer's repository without
        permission is not a harmless read. Get the scope in writing.

      **Debugging method when a rule does not behave.**

      1. Reduce the code to the smallest snippet that misbehaves and put it in a test file with `ruleid:` and `ok:` style cases.
      2. Print the **tree** (`ast.dump(ast.parse(snippet), indent=2)`) and look at the node types; the shape you assumed is often not
         the shape the parser produced (a keyword argument, a nested call, an attribute chain).
      3. For a secret rule, print the regex match, the captured group, the entropy and which filter dropped it.
      4. Change one thing, rerun the known-bad and known-good samples, and keep both in the test suite.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [sec-sast-rules, sec-secret-scanning, sec-scan-triage]
    title: Trade-offs and alternatives
    body: |
      | Choice | Gain | Cost |
      | --- | --- | --- |
      | Pattern rules | fast, easy to write and to read, works on partial code | blind to where a value came from, so false positives |
      | Taint (data-flow) rules | follows untrusted input to a sink and reports fewer false positives | slower, harder to write, still misses flows it cannot model |
      | Many rules | broader coverage | more noise, more triage, a team that switches them off |
      | Few tuned rules | trusted findings | known gaps - say what is not covered |
      | High entropy threshold | few false positives | misses real passwords that look human |
      | Low entropy threshold | catches more | drowns you in hashes, ids and paths |
      | Pre-commit hook | feedback in seconds, before anything is pushed | can be skipped, only on machines that installed it |
      | CI scan | cannot be skipped, one place to configure | feedback after the push, so a leaked secret is already in the history |
      | History scan | finds secrets already committed | slow on big repositories, and every hit is an incident |
      | Baseline | adoption without a clean-up month | can hide debt for ever - review it, and keep it visible |
      | Gate on new findings | fair to developers | old bugs stay until someone schedules them |
      | Suppression comments | decision sits next to the code | can become a way to silence the tool, so require a reason and review |

      **Alternatives and companions.** Code review catches design and logic problems that rules do not. **DAST** (the next lessons
      in this module) tests the running application and finds what is in configuration and behaviour. **Dependency scanning** finds
      known-vulnerable libraries, which SAST of your own code does not. **A secrets manager** removes the need to keep a credential in
      code at all - the OWASP cheat sheet's subject - and is the real fix; scanning is the safety net. And a **security unit test**
      (the regression lesson that closes this module) proves a bug stays fixed, which no pattern can.

  - id: summary
    kind: summary
    concepts: [sec-sast-rules, sec-secret-scanning, sec-scan-triage]
    title: Summary
    body: |
      - SAST reads code without running it and reports risky **shapes**; secret scanning reports **credentials**. Both are cheap,
        early and repeatable, and both are blunt.
      - OWASP's limits apply: false positives, only a small share of flaws found automatically, access control and configuration
        out of reach, findings that are hard to prove. A clean scan is not a secure application.
      - A rule is judged by its **ok cases** as much as its matches. Test every rule on known-bad and known-good code.
      - A pattern rule cannot see where a value came from. Triage by reading the code: can untrusted input reach it, and is the
        reason visible in the code?
      - A secret scanner filters in order - keyword, regex, entropy, stop words, allow - and **redacts**. It reports a secret once,
        by the most specific rule.
      - A secret that was ever pushed is compromised. **Revoke or rotate first**; cleaning the history is a separate decision.
      - Fingerprint without line numbers, suppress with a reason next to the code, baseline the old findings, gate on **new**
        findings at or above an agreed severity, and **fail closed**.
      - A pre-commit hook is advice; the pull-request scan is the control.

exercises:
  - id: sa-clean-scan
    type: mcq
    concept: sec-sast-rules
    skill: analysis
    title: What does a clean scan mean?
    prompt: |
      A SAST scan of the SandPay API repository finishes with zero findings. The release manager writes "security scan passed,
      application is secure" in the release notes. What is the accurate reading?
    options:
      - id: no-rule
        text: "No rule matched. Access control, business logic and configuration issues are outside what SAST finds well, so the application still needs the other tests."
        feedback: "Correct. OWASP lists access control issues, insecure use of cryptography and configuration issues among the things SAST cannot automate well."
      - id: secure
        text: "The application has no vulnerabilities in the code that was scanned."
        feedback: "Only for the shapes the rules describe. A flaw with no matching rule is a false negative you cannot see."
      - id: broken
        text: "The scanner must be broken - real code always has findings."
        feedback: "A clean result is possible; the point is what it proves. It proves that no rule matched."
      - id: dast
        text: "It means DAST is no longer needed."
        feedback: "The opposite. DAST finds configuration and behaviour problems that static rules cannot see."
    correct: [no-rule]
    hints:
      - What exactly does a rule match?
      - Which kinds of flaw does OWASP say SAST finds poorly?
    solution: |
      Zero findings means no rule matched. Access control, business logic, race conditions and configuration are not shapes in the
      code, so the release note overstates the result.

  - id: sa-which-line
    type: mcq
    concept: sec-sast-rules
    skill: application
    title: Which of these calls does sql-built-from-string report?
    prompt: |
      The rule reports a `query` or `execute` call whose first argument is a string built at run time. Which line is reported?
    options:
      - id: fstring
        text: 'rows = self.query(f"SELECT * FROM payments WHERE status = ''{status}''")'
        feedback: "Correct. An f-string with a {status} part is built from a variable at run time."
      - id: param
        text: 'rows = self.query("SELECT * FROM payments WHERE status = ?", (status,))'
        feedback: "That is the fix: the query is a literal and the value travels as a parameter."
      - id: constant
        text: 'rows = self.query("SELECT id FROM payments " + "WHERE status = ''paid''")'
        feedback: "Two literals joined: nothing from outside enters the string. Not a finding."
      - id: variable
        text: 'rows = self.query(QUERY, (status,))'
        feedback: "A plain variable as the query is not a built string. Whatever QUERY holds was built elsewhere, so the rule cannot see it - that is a false negative risk, not a finding."
    correct: [fstring]
    hints:
      - Is anything non-literal inside the string?
      - Which options are the fix or a constant?
    solution: Only the f-string is built from a non-literal at run time. The parameterised call and the joined literals are quiet.

  - id: sa-false-positive
    type: mcq
    concept: sec-sast-rules
    skill: analysis
    title: The allow-listed column name
    prompt: |
      The rule reports `self.execute(f"UPDATE users SET {key} = ? WHERE id = ?", (value, user_id))`. Three lines above,
      `key` comes from `sorted(set(data) & allowed)`, and `allowed = {"display_name"}` is a hard-coded set. What do you do?
    options:
      - id: suppress
        text: "Triage it as a false positive because the reason is visible in the code, and suppress it with a reason (or ask for a comment) - after confirming nothing else feeds `allowed`."
        feedback: "Correct. The value is parameterised and the column name comes from a hard-coded allow-list, and a reader of the function can see that."
      - id: critical
        text: "Report it as critical SQL injection - it is an f-string in a query."
        feedback: "A syntax rule cannot see where the value came from. Reading the code shows an allow-list, so this is not injectable."
      - id: disable
        text: "Disable the rule for the whole repository."
        feedback: "That also silences the real injection two screens down. Suppress the one line, with a reason."
      - id: ignore
        text: "Ignore it without writing anything down."
        feedback: "Then the next scan reports it again, and nobody knows it was reviewed."
    correct: [suppress]
    hints:
      - Where does the interpolated value come from?
      - What should the record of your decision contain?
    solution: |
      The interpolated name comes from a hard-coded allow-list, so it is a false positive. Suppress that line with a reason and keep
      the rule on for everything else.

  - id: sa-entropy
    type: mcq
    concept: sec-secret-scanning
    skill: application
    title: Which string has the highest entropy?
    prompt: |
      Shannon entropy is `-sum(p * log2(p))` over the characters. Which of these has the highest entropy in bits per character?
    options:
      - id: random
        text: '"Zk3pQ9vL2mXa7TdRw4Ns8BhY" (24 different characters)'
        feedback: "Correct: log2(24), about 4.58. Every character is different, which is as random as 24 characters can look."
      - id: repeat
        text: '"aaaaaaaaaaaaaaaa"'
        feedback: "One character repeated has entropy 0."
      - id: pair
        text: '"abababababababab"'
        feedback: "Two characters used equally give exactly 1 bit per character."
      - id: placeholder
        text: '"changeme-changeme"'
        feedback: "A repeated word has low entropy, about 2.9 bits per character here."
    correct: [random]
    hints:
      - Count how many different characters there are and how evenly they are used.
    solution: A string of 24 different characters has entropy log2(24), about 4.58; repeated characters score far lower.

  - id: sa-stopword
    type: mcq
    concept: sec-secret-scanning
    skill: analysis
    title: Why is a short stop word risky?
    prompt: |
      A team adds the stop word `test` so that test keys stop appearing in the report. A month later a production API key is committed
      whose random part happens to contain the letters `test`. What happens, and what is the better design?
    options:
      - id: hidden
        text: "The scanner drops it, because stop words are matched against the extracted secret. Use specific stop words and put known test values behind an allow comment that a reviewer sees."
        feedback: "Correct. A broad stop word silently hides real secrets that contain it."
      - id: reported
        text: "It is still reported - stop words only apply to the variable name."
        feedback: "In Gitleaks, stopwords target the extracted secret, not the whole match. Here the same is true."
      - id: crash
        text: "The scanner stops with an error."
        feedback: "Nothing fails; the finding is dropped quietly, which is the danger."
      - id: nothing
        text: "Nothing - production keys never contain English words."
        feedback: "Random strings contain any short substring now and then."
    correct: [hidden]
    hints:
      - What does a stop word match against?
      - How would a reviewer ever see a stop word's effect?
    solution: A stop word silences any secret containing it, and nobody reviews that. Use specific words and visible allow comments.

  - id: sa-committed-key
    type: mcq
    concept: sec-secret-scanning
    skill: application
    title: A real key was pushed
    prompt: |
      The history scan reports a live SandPay API key pushed three weeks ago and removed from the file the next day. What is the first
      action?
    options:
      - id: rotate
        text: "Revoke or rotate the key now, then check the access logs for use of the old one, then decide separately about cleaning the history."
        feedback: "Correct. The key is in the history, in clones and in old diffs. Rotation is the only step that makes it harmless."
      - id: delete
        text: "Nothing - it was deleted from the file."
        feedback: "Git keeps every commit, so the key is still readable."
      - id: rewrite
        text: "Rewrite the history first and then decide whether to rotate."
        feedback: "A rewrite is costly (it breaks links to commits) and does not recall copies that were already fetched. Rotate first."
      - id: test
        text: "Try the key against the API to see whether it still works."
        feedback: "Using a discovered credential without authorisation is out of scope. Report it; the owner rotates it."
    correct: [rotate]
    hints:
      - Does deleting a line from the latest commit remove it from the history?
    solution: Revoke or rotate first, check the logs, and treat history cleaning as a separate decision. Never test a found credential.

  - id: sa-fingerprint
    type: mcq
    concept: sec-scan-triage
    skill: application
    title: Why not use the line number?
    prompt: |
      A team fingerprints findings as `rule:path:line`. A developer adds a 30-line import block at the top of `handlers.py`. What
      happens at the next CI run?
    options:
      - id: all-new
        text: "Every baselined finding in that file looks new, so the gate fails and people learn to ignore or disable it. Hash the rule, the path and the normalised line text instead."
        feedback: "Correct. Line numbers change whenever code moves; the text of the flagged line does not."
      - id: nothing
        text: "Nothing - the baseline follows the code."
        feedback: "A baseline keyed by line number cannot follow anything. That is the problem."
      - id: faster
        text: "The scan gets faster because the file is bigger."
        feedback: "Unrelated."
      - id: fewer
        text: "Findings disappear."
        feedback: "They move to new line numbers and no longer match the baseline, so they reappear as new."
    correct: [all-new]
    hints:
      - What changes about a finding when code is inserted above it?
    solution: Line numbers shift, so a line-keyed baseline reports old findings as new. Fingerprint the rule, the path and the normalised text.

  - id: sa-threshold
    type: mcq
    concept: sec-scan-triage
    skill: application
    title: Gate at HIGH
    prompt: |
      The gate is set to `fail_on = HIGH`. A pull request adds one new MEDIUM finding (`weak-hash`) and one new HIGH finding that is
      already in the baseline. What is the exit code, and what should the report show?
    options:
      - id: pass-report
        text: "0, and the report still lists the new MEDIUM finding as non-blocking so someone can triage it."
        feedback: "Correct. The MEDIUM is below the threshold and the HIGH is known, so nothing blocks - but a finding that is hidden is never fixed."
      - id: fail
        text: "1, because any new finding blocks."
        feedback: "That would be a threshold of LOW. The gate blocks new findings at or above the chosen severity."
      - id: fail-known
        text: "1, because a HIGH finding is present."
        feedback: "It is already in the baseline, so it is known, not new."
      - id: hide
        text: "0, and the MEDIUM finding is not shown at all."
        feedback: "The exit code is right but hiding it is wrong: non-blocking findings still need triage."
    correct: [pass-report]
    hints:
      - Which findings count for blocking - new, at or above the threshold?
    solution: Exit code 0 - the new MEDIUM is below HIGH and the HIGH is baselined - and the MEDIUM is still reported.

  - id: sa-hook
    type: mcq
    concept: sec-scan-triage
    skill: analysis
    title: Is the pre-commit hook enough?
    prompt: |
      A team installs a secret-scanning pre-commit hook and removes the scan from CI "to avoid running it twice". Why is that a mistake?
    options:
      - id: skippable
        text: "The hook runs on each developer's machine and can be skipped or never installed, so only a server-side scan is a control. Keep both."
        feedback: "Correct. The Gitleaks README even documents SKIP=gitleaks to skip the hook for one commit."
      - id: slower
        text: "Running only the hook makes commits slower."
        feedback: "Speed is not the reason."
      - id: noaccess
        text: "Hooks cannot read the files being committed."
        feedback: "They can; that is what they are for."
      - id: nothing
        text: "It is not a mistake - the hook runs the same check."
        feedback: "It runs the same check in a place that can be bypassed."
    correct: [skippable]
    hints:
      - Who controls a developer's local hook?
    solution: A local hook can be skipped or missing. The pull-request scan is the control; the hook is early feedback.

  - id: sa-unparseable
    type: mcq
    concept: sec-sast-rules
    skill: analysis
    title: A file the parser cannot read
    prompt: |
      Your scanner meets `handlers.py` with a syntax error (a merge conflict marker). What should it do?
    options:
      - id: fail-loud
        text: "Raise an error that names the file, so the pipeline fails and nobody mistakes the file for clean."
        feedback: "Correct. Returning an empty list turns every unreadable file into a silent false negative."
      - id: empty
        text: "Return no findings and carry on."
        feedback: "A broken file would look clean."
      - id: skip
        text: "Skip the file but do not mention it."
        feedback: "Same problem, with no trace."
      - id: guess
        text: "Search the text with regexes instead."
        feedback: "A fallback with different behaviour makes results inconsistent and hard to explain."
    correct: [fail-loud]
    hints:
      - What does an empty result look like to the person reading the report?
    solution: Fail loudly with the file name. An unreadable file must never look the same as a clean one.

  - id: sa-order
    type: order
    concept: sec-scan-triage
    skill: application
    title: Introduce scanning to an existing repository in order
    prompt: Put the steps for adding secret and static scanning to an old repository in a sensible order.
    items:
      - id: scope
        text: Agree scope, owner and the rule that nobody tests a found credential
      - id: history
        text: Scan the history once and treat every real secret as an incident - rotate first
      - id: prove
        text: Prove each tool on known-bad and known-good samples
      - id: run
        text: Run once without a gate and read the whole report
      - id: triage
        text: Triage each distinct finding and prove the true positives
      - id: record
        text: Record decisions as suppressions with reasons and baseline the rest
      - id: gate
        text: Gate on new findings at or above the agreed severity, in CI as well as in a hook
    hints:
      - Secrets that are already out come before anything else.
      - You cannot baseline before you have triaged.
    solution: |
      Scope and ownership, scan the history and rotate real secrets, prove the tools on known samples, run once without a gate, triage,
      record decisions and baseline, then gate on new findings.

  - id: sa-debug
    type: debug
    concept: sec-scan-triage
    skill: analysis
    title: Which line lets a typo open the gate?
    prompt: |
      This gate is meant to fail the pipeline for new findings at or above a severity. Pick the line that lets the gate pass when a
      finding has a severity the code does not know.
    language: python
    code: |
      SEVERITIES = {"LOW": 1, "MEDIUM": 2, "HIGH": 3, "CRITICAL": 4}

      def gate(findings, baseline, fail_on="HIGH"):
          limit = SEVERITIES.get(fail_on, 99)
          new = [f for f in findings if f["id"] not in baseline]
          blocking = [f for f in new if SEVERITIES.get(f["severity"], 0) >= limit]
          return 1 if blocking else 0
    correctLines: [4]
    hints:
      - What number does an unknown threshold become?
      - What would happen with fail_on set to "SEVERE"?
    lineNotes:
      - line: 4
        note: An unknown threshold becomes 99, which no finding reaches, so the gate passes everything.
      - line: 6
        note: An unknown finding severity becomes 0 here, so it can never block either - the same fail-open mistake. Raise an error for it as well.
      - line: 7
        note: Returning only an exit code also hides which findings blocked; return them for the report.
    solution: |
      Line 4 turns a typo such as "SEVERE" into a limit of 99, so the gate passes every finding. Raise `ValueError` for an unknown
      threshold, and for an unknown finding severity as well (line 6 has the same flaw on the finding side).

  - id: sa-short
    type: short
    concept: sec-sast-rules
    skill: analysis
    title: Explain the false positive to a developer
    prompt: |
      A developer asks why the scanner flagged `self.execute(f"UPDATE users SET {key} = ? ...")` when "everything is parameterised". In
      a few sentences, explain what the scanner saw, why the finding is a false positive in this code, and what you would ask them to
      change.
    modelAnswer: |
      The rule matches the shape of the first argument: an f-string with a `{...}` part passed to `execute`. It cannot tell where `key`
      came from, so it reports every such call. In this function `key` comes from the intersection of the request fields with a
      hard-coded set of column names, and the values travel as parameters, so no untrusted text reaches the SQL: a false positive.

      I would suppress that one line with a reason that names the allow-list, leave the rule on elsewhere, and ask the developer to add
      a comment (or a named constant) saying the list must stay hard-coded, because the safety is a fact about that set, not about the
      f-string.
    rubric:
      - Says the rule matches the syntax shape and cannot see where the value came from.
      - Explains why this code is safe - the column name comes from a hard-coded allow-list and the values are parameters.
      - Proposes a recorded, narrow suppression with a reason, not disabling the rule.
      - Asks for the safety to be visible or protected in the code.
    hints:
      - What does a pattern rule know about the value?
      - Where should the decision be recorded?
    solution: The rule sees only the f-string shape; the column name comes from a hard-coded allow-list, so suppress that line with a reason and keep the rule.

  - id: sa-testdesign
    type: testdesign
    concept: sec-secret-scanning
    skill: application
    title: Test plan for a secret scanner and its gate
    prompt: |
      SandPay wants a secret scanner in the pre-commit hook and in CI, with a gate. Design the test plan that proves the scanner,
      its filters and its gate work - preconditions, steps, expected result and evidence for each case.
    modelAnswer: |
      Preconditions: written scope for the repositories, a throwaway test repository, synthetic credentials of each vendor shape that
      were never issued, and the scanner configuration under review.

      1. **Detection** - commit a synthetic SandPay key, a random-looking password and a private-key header in separate files. Expected:
         one finding for each, by the right rule and line. Evidence: the report.
      2. **No secret in the output** - read the report, the console and the CI log. Expected: at most four characters of a value.
         Evidence: the redacted lines.
      3. **Noise filters** - commit `YOUR_API_KEY_HERE`, `changeme`, a header name and a path assigned to a `secret_file` variable.
         Expected: placeholders and low-entropy values dropped; record any false positive and decide how to tune it. Evidence: the report.
      4. **Allow comment and allowed path** - add the allow comment to a known test value and put another under an allowed path.
         Expected: both skipped, and both visible in the diff. Evidence: the diff and the report.
      5. **One finding per secret** - assign a vendor key to `api_key`. Expected: one finding, by the specific rule. Evidence: the count.
      6. **History** - commit a synthetic key, delete it in the next commit. Expected: the history scan reports it with the commit id.
      7. **Hook is not the control** - commit with the hook skipped. Expected: the CI scan fails the pull request. Evidence: the CI result.
      8. **Gate** - add a new finding; move existing code; add a finding below the threshold. Expected: exit 1 for the new one, exit 0 for the
         move, exit 0 and a listed finding for the lower one. Evidence: the three results.
      9. **Fail closed** - give the gate an unknown severity and a missing report. Expected: an error, not a pass.
      10. **Negative control** - run the scanner on the repository after the secrets were rotated and removed. Expected: no new finding.
    rubric:
      - Uses synthetic, never-issued credentials in a throwaway repository, with written scope.
      - Tests detection, redaction, noise filters, allow comments and one-finding-per-secret.
      - Covers the history and shows that the hook alone is not a control.
      - Tests the gate for a new finding, a moved finding, a lower severity and fail-closed behaviour.
      - Every case has preconditions, steps, an expected result and evidence.
    hints:
      - What would prove a secret is detected, and what would prove it is not printed?
      - How do you test that the gate is stable and that it fails closed?
    solution: |
      Detect each shape, check the output is redacted, test the noise filters and allows, scan the history, show that CI catches a skipped
      hook, and prove the gate blocks new findings, ignores moved ones and fails closed.

  - id: sa-interview
    type: interview
    concept: sec-scan-triage
    skill: analysis
    title: 'Interview: how do you roll out SAST and secret scanning?'
    prompt: '"Your team wants SAST and secret scanning in the pipeline. How do you introduce it so that people actually use it?"'
    modelAnswer: |
      I start by saying what these tools do and do not do. SAST finds risky code shapes cheaply and early; OWASP also says it finds only
      a small share of flaws, produces many false positives, and cannot see access control or configuration. So it is one layer, and a
      clean scan is not a security sign-off.

      I begin with secrets, on the whole history, because a pushed secret is already out: I treat each real hit as an incident and
      revoke or rotate first. Then I prove each tool on known-bad and known-good code, run it once without a gate, and triage the
      findings by reading the code - can untrusted input reach it, is the reason visible. True positives I prove and report one by one;
      false positives get a narrow suppression with a reason next to the code; the remainder goes into a baseline keyed by a fingerprint
      that does not use line numbers.

      Then I gate on new findings at or above an agreed severity, fail closed on anything I do not understand, run the secret scan in a
      pre-commit hook for speed and in CI as the actual control, and track false-positive rates and suppressions so the tool stays
      trusted.
    rubric:
      - States the limits of SAST and that a clean scan is not proof of security.
      - Handles secrets first - history scan, revoke or rotate before cleaning.
      - Describes triage with reasons, suppressions next to the code, and a baseline keyed by a stable fingerprint.
      - Describes a gate on new findings with a threshold that fails closed, a hook plus a CI scan, and ongoing measurement.
    followUps:
      - How would you decide whether a rule is worth keeping?
      - What would make you choose a taint rule over a pattern rule?
      - What do you do when a developer asks to suppress everything in a folder?
    hints:
      - Structure it as limits, secrets first, triage, baseline, gate, maintenance.
    solution: Limits, secrets first (rotate), prove the tools, triage with reasons, baseline by fingerprint, gate on new findings and fail closed, hook plus CI, measure.

  - id: sa-rules-code
    type: coding
    concept: sec-sast-rules
    skill: application
    title: Write the five static-analysis rules
    prompt: |
      In `practice/security/exercises/devsecops/sast_rules.py`, implement `scan_source`. Parse the source with `ast`, walk the call nodes
      and report `sql-built-from-string`, `eval-exec`, `shell-true`, `weak-hash` and `tls-verify-off` exactly as the docstring defines
      them. The tests run the rules on vulnerable and fixed handlers (all flaws found on their lines, the fixed code quiet), on safe
      look-alikes, on a multi-line call, on a file that does not parse and on the real source of the practice portal.
    project: security
    files: [exercises/devsecops/sast_rules.py]
    test: tests/devsecops/test_sast_rules.py
    command: .venv/bin/python -m pytest tests/devsecops/test_sast_rules.py
    modelAnswer: |
      ```python
      def _is_dynamic_string(node):
          if isinstance(node, ast.JoinedStr):
              return any(isinstance(p, ast.FormattedValue) for p in node.values)
          if isinstance(node, ast.BinOp) and isinstance(node.op, (ast.Add, ast.Mod)):
              return any(isinstance(n, (ast.Name, ast.Attribute, ast.Call, ast.Subscript)) for n in ast.walk(node))
          if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute) and node.func.attr == "format" \
                  and isinstance(node.func.value, ast.Constant):
              return any(not isinstance(p, ast.Constant) for p in [*node.args, *(k.value for k in node.keywords)])
          return False

      def scan_source(source, path="<string>"):
          try:
              tree = ast.parse(source, filename=path)
          except SyntaxError as err:
              raise ValueError(f"cannot parse {path}: {err.msg} (line {err.lineno})") from err
          findings = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Call):
                  for rule_id in _match(node):          # the five checks on node.func and node.keywords
                      severity, message = RULES[rule_id]
                      findings.append(Finding(rule_id, node.lineno, severity, message))
          return sorted(findings, key=lambda f: (f.line, f.rule_id))
      ```

      The string test asks the tree, so two joined literals are quiet. Each rule reads `node.func` (a `Name` for `eval`, an `Attribute` for
      `subprocess.run`) and `node.keywords` (for `shell`, `verify` and `usedforsecurity`).
    rubric:
      - Every test in tests/devsecops/test_sast_rules.py passes.
      - Findings are sorted by line and rule id and use the severity and message from RULES.
      - Safe look-alikes (literals, plain variables, joined literals, literal_eval, argument lists, usedforsecurity=False) are quiet.
      - The line reported is the line where the call starts.
      - A file that does not parse raises ValueError naming the file.
    hints:
      - ast.walk(tree) visits every node; you only need the ast.Call ones.
      - 'For `eval` the func is an ast.Name; for `subprocess.run` it is an ast.Attribute whose value is an ast.Name.'
      - Look for keywords with `next((k.value for k in call.keywords if k.arg == "shell"), None)`.
    solution: Parse with ast, walk the Call nodes, apply the five checks on func and keywords (with a dynamic-string test for SQL), sort the findings, and raise ValueError on a syntax error.

  - id: sa-secrets-code
    type: coding
    concept: sec-secret-scanning
    skill: application
    title: Write the secret scanner
    prompt: |
      In `practice/security/exercises/devsecops/sast_secrets.py`, implement `shannon_entropy`, `redact` and `scan_text`. The scanner must apply
      keywords, the regex, stop words and the entropy filter in that spirit, honour the allow comment and allowed paths, report a secret once by
      the most specific rule, and never put a whole secret in a finding. The tests run it on a synthetic settings file and on the portal source.
    project: security
    files: [exercises/devsecops/sast_secrets.py]
    test: tests/devsecops/test_sast_secrets.py
    command: .venv/bin/python -m pytest tests/devsecops/test_sast_secrets.py
    modelAnswer: |
      ```python
      def shannon_entropy(text):
          if not text:
              return 0.0
          counts = Counter(text)
          return -sum(n / len(text) * math.log2(n / len(text)) for n in counts.values()) + 0.0

      def redact(secret):
          return secret[:4] + "***" if len(secret) > 4 else "***"

      def scan_text(text, path="<string>", allow_paths=()):
          if any(path.startswith(p) for p in allow_paths):
              return []
          findings = []
          for number, line in enumerate(text.splitlines(), start=1):
              if ALLOW_COMMENT in line:
                  continue
              lowered, reported = line.lower(), set()
              for rule_id, regex, group, min_entropy, keywords in RULES:
                  if not any(w in lowered for w in keywords):
                      continue
                  for match in regex.finditer(line):
                      secret = match.group(group)
                      if secret in reported or any(w in secret.lower() for w in STOPWORDS):
                          continue
                      entropy = shannon_entropy(secret)
                      if min_entropy is not None and entropy < min_entropy:
                          continue
                      reported.add(secret)
                      findings.append(SecretFinding(rule_id, path, number, redact(secret), round(entropy, 2)))
          return findings
      ```

      Cheap filters run first and the stored finding holds only `redact(secret)`. The `reported` set per line makes the first, more specific rule win.
    rubric:
      - Every test in tests/devsecops/test_sast_secrets.py passes.
      - Entropy is 0.0 for an empty or single-character string and log2(n) for n different characters.
      - Stop words, the entropy minimum, the allow comment and allowed paths all remove findings as described.
      - The same secret on a line is reported once by the first rule that finds it.
      - No finding contains the whole secret - only the redacted form.
    hints:
      - Counter(text) gives you the counts for the entropy formula.
      - Keep a per-line set of secrets already reported so the specific rule wins.
      - Store redact(secret), never secret, in the finding.
    solution: Compute entropy from character counts, redact to four characters, and for each line apply keywords, regex, stop words and entropy while reporting each secret once by the first rule.

  - id: sa-triage-code
    type: coding
    concept: sec-scan-triage
    skill: application
    title: Write the fingerprint, the suppression check and the gate
    prompt: |
      In `practice/security/exercises/devsecops/sast_triage.py`, implement `fingerprint`, `is_suppressed`, `make_baseline` and `gate`. A fingerprint must
      ignore line numbers and whitespace, a suppression comment covers the finding's line and the line above it (bare or by rule id), and the gate
      must report new findings, block on those at or above the threshold, and fail closed on an unknown severity.
    project: security
    files: [exercises/devsecops/sast_triage.py]
    test: tests/devsecops/test_sast_triage.py
    command: .venv/bin/python -m pytest tests/devsecops/test_sast_triage.py
    modelAnswer: |
      ```python
      def fingerprint(rule_id, path, line_text):
          normalised = " ".join(line_text.split())
          return hashlib.sha256(f"{rule_id}:{path}:{normalised}".encode()).hexdigest()[:16]

      def is_suppressed(lines, line_no, rule_id):
          for number in (line_no, line_no - 1):
              if 1 <= number <= len(lines):
                  match = SUPPRESSION.search(lines[number - 1])
                  if match:
                      names = match.group(1)
                      if names is None or rule_id in [n.strip() for n in names.split(",")]:
                          return True
          return False

      def gate(findings, baseline, fail_on="HIGH"):
          if fail_on not in SEVERITIES:
              raise ValueError(f"unknown severity: {fail_on!r}")
          for f in findings:
              if f["severity"] not in SEVERITIES:
                  raise ValueError(f"unknown severity: {f['severity']!r}")
          known = set(baseline)
          new = [f for f in findings if fingerprint(f["rule_id"], f["path"], f["text"]) not in known]
          blocking = [f for f in new if SEVERITIES[f["severity"]] >= SEVERITIES[fail_on]]
          return {"exit_code": 1 if blocking else 0, "blocking": blocking, "new": new, "known": len(findings) - len(new)}
      ```

      The fingerprint uses the text of the line, not its number, so moved code is not new. The gate validates before it counts, so a typo cannot open it.
    rubric:
      - Every test in tests/devsecops/test_sast_triage.py passes.
      - The fingerprint is 16 hex characters that ignore line numbers and whitespace but change with the rule, path or line text.
      - is_suppressed checks the finding's line and the line above, handles bare and named suppressions and ignores out-of-range lines.
      - make_baseline returns sorted, de-duplicated fingerprints.
      - gate raises ValueError for an unknown threshold or severity and returns exit_code, blocking, new and known.
    hints:
      - hashlib.sha256(...).hexdigest()[:16] gives the fingerprint.
      - Check line_no and line_no - 1 and ignore indexes outside the list.
      - Validate every severity before you decide anything.
    solution: Hash the rule, path and normalised line text; check the finding's line and the one above for a suppression; validate severities, split new from known and block at or above the threshold.

placement:
  - id: sa-place-rules
    type: mcq
    concept: sec-sast-rules
    skill: analysis
    title: Is the finding a true positive?
    prompt: |
      A rule reports `db.execute(f"SELECT * FROM refunds WHERE merchant = '{merchant}'")` where `merchant` is read from a request parameter without
      validation. What is the triage result?
    options:
      - id: tp
        text: "True positive - untrusted input reaches a string-built query. Prove it with a request, then report it."
        feedback: "Correct. The value comes from the request and goes into the SQL text."
      - id: fp
        text: "False positive - it is only an f-string."
        feedback: "The f-string contains request data. This is exactly the shape the rule is meant to find."
      - id: ar
        text: "Accepted risk - SAST findings are low priority."
        feedback: "Nothing about this finding is low priority."
    correct: [tp]
    solution: Untrusted request data goes into the SQL text, so it is a true positive; prove it with a request and report it.

  - id: sa-place-secrets
    type: mcq
    concept: sec-secret-scanning
    skill: analysis
    title: Which candidate is the real secret?
    prompt: |
      The scanner reports three lines. `api_key = "YOUR_API_KEY_HERE"`, `retry_token_header = "X-Retry-Token"` and
      `SANDPAY_KEY = "sp_live_Zk3pQ9vL2mXa7TdRw4Ns8BhY"` (a synthetic key). Which one needs rotation if it were a real committed credential?
    options:
      - id: key
        text: "SANDPAY_KEY - a vendor-shaped, high-entropy value."
        feedback: "Correct. The others are a placeholder and a header name."
      - id: placeholder
        text: "api_key - it has api_key in the name."
        feedback: "A name is not a secret. The value is a placeholder."
      - id: header
        text: "retry_token_header - it has token in the name."
        feedback: "The value is a header name, not a credential."
    correct: [key]
    solution: Only the vendor-shaped, random-looking value is a credential; the others are a placeholder and a header name.

  - id: sa-place-gate
    type: mcq
    concept: sec-scan-triage
    skill: application
    title: What does the gate do?
    prompt: |
      A pull request only moves code, so every existing finding gets a new line number. The gate keys findings by a fingerprint of rule, path and line
      text. What is the result?
    options:
      - id: pass
        text: "No new findings, exit 0 - the fingerprints did not change."
        feedback: "Correct. The text of each flagged line is the same, so each fingerprint still matches the baseline."
      - id: fail
        text: "Exit 1, because every finding changed line."
        feedback: "That would happen with a line-number fingerprint, which is the mistake the design avoids."
      - id: error
        text: "An error, because the baseline no longer matches."
        feedback: "The baseline matches; the fingerprints are stable."
    correct: [pass]
    solution: The fingerprint ignores line numbers, so a moved finding is still known and the gate passes.

recall:
  - id: sa-recall-limits
    concept: sec-sast-rules
    prompt: What does a clean SAST scan prove, and which flaws does OWASP say SAST finds poorly?
    answer: Only that no rule matched. OWASP lists authentication problems, access control issues and insecure use of cryptography as hard to automate, adds that SAST often cannot find configuration issues, and notes many false positives and findings that are hard to prove.
  - id: sa-recall-ok
    concept: sec-sast-rules
    prompt: Why must every rule be tested on safe code as well as vulnerable code?
    answer: A rule that fires on parameterised queries or on literal strings is noise, and a team switches noisy rules off. The "ok" cases (a literal, a plain variable, ast.literal_eval, an argument list, usedforsecurity=False) are what keep a rule trusted.
  - id: sa-recall-fp
    concept: sec-sast-rules
    prompt: Why does a pattern rule report an allow-listed column name in an f-string, and what do you do?
    answer: It matches the syntax shape and cannot see where the value came from. Read the code - if the safety is visible (a hard-coded allow-list), triage it as a false positive and suppress that line with a reason; if it is not visible, fix the code.
  - id: sa-recall-filters
    concept: sec-secret-scanning
    prompt: What are the filters of a secret scanner, in order?
    answer: Keywords (cheap pre-check), regex (candidates), entropy (is it random), stop words (known noise), allow comments and paths (decisions), then redaction. A secret is reported once, by the most specific rule.
  - id: sa-recall-entropy
    concept: sec-secret-scanning
    prompt: What is Shannon entropy and what is its weakness for secret detection?
    answer: -sum(p * log2(p)) over a string's characters, in bits per character - 0 for repeated characters, log2(n) for n different ones. It drops placeholders but also real passwords that look human, and keeps random-looking ids that are not secrets.
  - id: sa-recall-rotate
    concept: sec-secret-scanning
    prompt: What is the first action when a real secret was pushed, and why is deleting it not enough?
    answer: Revoke or rotate it, then check the logs for use of the old one. Git keeps every commit, and copies and old diffs exist, so the secret is compromised once pushed. Rewriting history is a separate, costly decision.
  - id: sa-recall-gate
    concept: sec-scan-triage
    prompt: What makes a gate trustworthy?
    answer: A fingerprint without line numbers, a baseline for old findings, blocking only on new findings at or above an agreed severity, suppressions with a reason next to the code, a CI scan as well as a hook, and failing closed on unknown severities or errors.

