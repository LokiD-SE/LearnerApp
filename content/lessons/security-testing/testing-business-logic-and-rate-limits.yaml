id: testing-business-logic-and-rate-limits
title: Testing business logic, races and rate limits
subject: security-testing
module: api-security
level: advanced
status: published
estimatedMinutes: 150
summary: Test the flaws that no scanner can find because the code does exactly what it was told - the rules just do not match the business. Write abuse cases for a refund service (a double refund, a refund of a declined payment, a negative amount), prove a check-then-act rule breaks when two requests arrive together, and probe a sign-in endpoint for a missing rate limit - each probe with a control, a baseline and a negative control, so it finds the flaw in a practice target and stays quiet once the flaw is fixed.
