id: threat-modelling-stride
title: Threat modelling with STRIDE
subject: security-testing
module: security-foundations
level: intermediate
status: published
estimatedMinutes: 135
summary: Model the SandPay merchant portal as a data flow diagram with trust boundaries, find what can go wrong with STRIDE per element and attack trees, and turn each threat into a response, a security requirement and an executable test. The four questions come from Shostack and the Threat Modeling Manifesto, the per-element table from Microsoft's 2006 STRIDE article, and attack-tree arithmetic from Schneier; every output shown was printed by this lesson's code against the deliberately vulnerable local portal.
