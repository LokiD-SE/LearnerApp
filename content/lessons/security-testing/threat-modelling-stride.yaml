  ]

environment: |
  - **Runtime:** Python 3.12.3 in `practice/security/.venv` with requests 2.34.2 and pytest 9.2.0. Every output
    in this lesson was printed by the code shown (the reference solutions in
    `practice/security/solutions/foundations/threat_*.py` and the shared model in
    `practice/security/support/threat_fixture.py`), run on Linux on 19 November 2026. Nothing depends on timing,
    so the output is the same on any machine.
  - **Target:** `practice/security/support/sandpay_vuln.py`, the **deliberately vulnerable** SandPay merchant
    portal of this track. It binds to `127.0.0.1` only. SandPay, its merchants, accounts and payments are
    fictional. Test only systems you own or have written permission to test.
  - **Threat modelling sources, as documented on 19 November 2026:** Adam Shostack,
    [Shostack's Four Question Frame for Threat
    Modeling](https://github.com/adamshostack/4QuestionFrame) (the four questions, and why "working on" and
    "are" replaced earlier wording); the [Threat Modeling Manifesto](https://www.threatmodelingmanifesto.org/)
    (definition, values, principles, patterns and anti-patterns); the OWASP [Threat Modeling Cheat
    Sheet](https://cheatsheetseries.owasp.org/cheatsheets/Threat_Modeling_Cheat_Sheet.html) (STRIDE and the
    property each category violates, the technique table, the four responses, the review questions).
  - **STRIDE, from Microsoft:** the category definitions on Microsoft Learn, [Microsoft Threat Modeling Tool
    threats](https://learn.microsoft.com/en-us/azure/security/develop/threat-modeling-tool-threats); the DFD
    symbols, the "Threats Affecting Elements" table (STRIDE per element) and the DFD rules of thumb from Shawn
    Hernan, Scott Lambert, Tomasz Ostwald and Adam Shostack, [Uncover Security Design Flaws Using The STRIDE
    Approach](https://learn.microsoft.com/en-us/archive/msdn-magazine/2006/november/uncover-security-design-flaws-using-the-stride-approach),
    MSDN Magazine, November 2006 (archived; the tables were read from the page's HTML).
  - **Attack trees:** Bruce Schneier, [Attack Trees](https://www.schneier.com/academic/archives/1999/12/attack_trees.html),
    Dr. Dobb's Journal, December 1999. The costs in this lesson's SandPay tree are illustrative effort points,
    like the values in Schneier's figures - they are not measurements.
  - **Not repeated here:** the OWASP Top 10 categories themselves - [OWASP Top 10 for
    developers](#/lesson/owasp-top-10-for-developers); how each flaw is found and proved - the web and API
    vulnerability lessons of this track.

prerequisites:
  - security-testing-fundamentals
  - owasp-top-10-for-developers

concepts:
  - id: sec-threat-dfd
    name: Model the system - the four questions, DFDs and trust boundaries
    summary: Threat modelling answers four questions - what are we working on, what can go wrong, what are we going to do about it, did we do a good (enough) job. The first is answered with a data flow diagram (DFD) of interactors (external entities), processes, data stores and data flows, plus trust boundaries - the borders between trusted and untrusted elements. Flows that cross a boundary are where an attacker's input enters, so they are reviewed first. A sensible DFD has no magic sources or sinks (every data store is written and read by a process) and no psychokinesis (a process at one end of every flow).
  - id: sec-threat-stride
    name: STRIDE per element - what can go wrong
    summary: STRIDE names six threat categories, each violating one property - Spoofing (authentication), Tampering (integrity), Repudiation (non-repudiation), Information disclosure (confidentiality), Denial of service (availability), Elevation of privilege (authorization). Microsoft's per-element table says which apply to which DFD element - data flows and data stores T, I, D; processes all six; interactors S and R. Enumerating them gives a systematic list of prompts for one system; the team then decides which are real.
  - id: sec-threat-to-tests
    name: Responses, priorities and tests
    summary: Every threat gets a response - mitigate, eliminate, transfer or accept - and every agreed mitigation becomes a security requirement with a test that proves it works. An executable threat check must find the threat in the vulnerable system and stay quiet once the matching fix is in, and a fix is a design change that needs its own review (a per-account login limit stops guessing but enables lockout). Attack trees put a goal at the root with OR (alternatives) and AND (all steps needed) nodes; OR takes its cheapest child, AND the sum, so the cheapest remaining attack shows what to fix next.

objectives:
  - Answer the four threat modelling questions for a feature, and say which artefact answers each.
  - Draw a DFD with interactors, processes, data stores, data flows and trust boundaries, and check it against the rules of thumb (no magic sources or sinks, a process on every flow).
  - Enumerate threats with STRIDE per element, name the property each category violates, and identify the flows that cross trust boundaries.
  - Choose a response for each threat, write the mitigation as a testable requirement, and write a check that finds the threat and stays quiet after the fix.
  - Build an attack tree with AND and OR nodes, calculate the cheapest attack, and show how fixes move it.

sections:
  - id: intuition
    kind: intuition
    concepts: [sec-threat-dfd, sec-threat-stride, sec-threat-to-tests]
    title: The idea in plain language
    body: |
      Before a bank opens a new branch, somebody walks through the plans with a pencil and asks awkward
      questions. Where does the cash come in? Who carries it, and through which doors? Where is it kept
      overnight, and who can open that room? What if someone in a courier's uniform turns up early? Nobody has
      robbed the branch yet - the point is to find the weak doors **while they are still lines on paper**, when
      moving a door is cheap.

      **Threat modelling** is that walk-through for software. You draw the system - who talks to it, which
      programs handle the data, where data is stored, how it moves - and mark the **trust boundaries**, the
      doors between "ours" and "anyone's". Then you go element by element and ask a fixed set of questions,
      **STRIDE**: could someone pretend to be someone else, change data, deny what they did, read what they
      shouldn't, stop it working, or gain powers they shouldn't have?

      For a tester this is gold. Each credible threat becomes a **test**: "a merchant cannot read another
      merchant's payment", "an unsigned token is refused". In this lesson you model the SandPay merchant portal
      (the deliberately vulnerable practice app of this track), list its threats, and turn five of them into
      checks that find the flaw in the vulnerable portal - and stay quiet once it is fixed.

  - id: what
    kind: what
    concepts: [sec-threat-dfd, sec-threat-stride, sec-threat-to-tests]
    title: Terms you need
    body: |
      The Threat Modeling Manifesto defines it this way: "Threat modeling is analyzing representations of a
      system to highlight concerns about security and privacy characteristics." It is organised around
      **Shostack's four questions**:

      1. **What are we working on?** - a model of the system, usually a DFD.
      2. **What can go wrong?** - threats, found with STRIDE, attack trees or another technique.
      3. **What are we going to do about it?** - a response for each threat, and requirements.
      4. **Did we do a good job?** - review and validation (the Manifesto adds "enough").

      **DFD elements** (MSDN Magazine, 2006):

      | Element | DFD symbol | What it is |
      | --- | --- | --- |
      | **Interactor** (external entity) | rectangle | "the end points of your system: the people, Web services, and servers" outside its scope |
      | **Process** | circle | "computations or programs run by the computer" |
      | **Data store** | two parallel lines | "files, databases, registry keys, and the like" |
      | **Data flow** | one-way arrow | "data in motion over network connections, named pipes, ..." |
      | **Trust boundary** | dotted line | "the border between trusted and untrusted elements" |

      **STRIDE** - each category is a violation of a property (OWASP cheat sheet; MSDN 2006 Figure 3):

      | Category | Violates | Microsoft's description (shortened) | SandPay portal example |
      | --- | --- | --- | --- |
      | **S**poofing | Authentication | "illegally accessing and then using another user's authentication information" | the portal accepts an unsigned token that claims to be an ops admin |
      | **T**ampering | Integrity | "the malicious modification of data" | a refund amount changed in a request the portal trusts |
      | **R**epudiation | Non-repudiation | "users who deny performing an action without other parties having any way to prove otherwise" | a merchant denies a refund and the log does not say who issued it |
      | **I**nformation disclosure | Confidentiality | "the exposure of information to individuals who are not supposed to have access to it" | a merchant reads another merchant's payment by id |
      | **D**enial of service | Availability | "deny service to valid users" | an attacker locks a merchant out with failed logins |
      | **E**levation of privilege | Authorization | "an unprivileged user gains privileged access" | a merchant sets `role` to `admin` in a profile update |

      Other terms:

      - **STRIDE per element** - apply only the categories that fit each DFD element kind (the table in the
        next sections).
      - **Attack tree** - a goal at the root, ways to reach it below; **OR** nodes are alternatives, **AND**
        nodes are steps that are all needed (Schneier, 1999).
      - **Threat register** - the list of threats with their response, owner, requirement and test.
      - **Responses** (Shostack, via OWASP) - **mitigate**, **eliminate**, **transfer**, **accept**.

  - id: why
    kind: why
    concepts: [sec-threat-dfd, sec-threat-to-tests]
    title: Why testers threat model
    body: |
      The Manifesto's answer: "When you perform threat modeling, you begin to recognize what can go wrong in a
      system. It also allows you to pinpoint design and implementation issues that require mitigation". The
      output, "known as threats, informs decisions that you might make in subsequent design, development,
      testing, and post-deployment phases."

      Three reasons matter most to a tester:

      - **Design flaws are invisible to scanners.** A scanner can find a missing header; it cannot know that
        merchants must never see each other's payments, or that a refund needs two people. Those rules come
        from understanding the system - which is exactly what the DFD forces.
      - **It turns "test security" into a list.** STRIDE per element gives a systematic set of prompts for
        every element, so the security test plan has a traceable source instead of a tester's memory. The
        MSDN article warns: if you stop at brainstorming, "your threat model will be limited not only by what
        you know, but what you happen to remember at the time you're working on it."
      - **It is cheap early.** OWASP: threat modelling "is ideally performed early in the SDLC, such as during
        the design phase" and "is not something that is performed once and never again". A threat found on
        the whiteboard costs a conversation; the same threat found in production costs an incident.

      What it is **not**: proof that a system is secure. The fourth question exists because the model can be
      wrong or incomplete - and the tests you derive from it are how you find out.

  - id: per-element
    kind: internals
    concepts: [sec-threat-stride]
    title: STRIDE per element - which categories apply where
    body: |
      Microsoft's 2006 article gives the table ("Threats Affecting Elements", Figure 5), read here from the
      page's HTML:

      | Element | S | T | R | I | D | E |
      | --- | :-: | :-: | :-: | :-: | :-: | :-: |
      | Data flows | | X | | X | X | |
      | Data stores | | X | | X | X | |
      | Processes | X | X | X | X | X | X |
      | Interactors | X | | X | | | |

      Why it looks like this:

      - **Data flows and data stores** hold or carry data: it can be changed (T), read (I) or made
        unavailable (D). A flow does not log in, so it cannot be spoofed in its own right - spoofing shows up on
        the process or interactor at its end.
      - **Processes** run code with an identity and privileges, so every category applies.
      - **Interactors** are outside your system - you cannot fix the merchant's browser. What you care about
        is whether one can pretend to be another (S) and whether their actions can be denied later (R).

      The same article admits the categories overlap: it files the removal of a salesperson from a list under
      tampering although it "could be modeled as a denial of service", and adds "Don't get too hung up over
      the terminology." The category is a prompt, not a verdict.

      Applied to the SandPay portal model (`support/threat_fixture.py`, solved `threat_dfd.py`):

      ```plaintext
      == 1. STRIDE per element on the SandPay portal DFD
      16 elements -> 51 threats
        merchant  interactor  SR
        ops       interactor  SR
        receiver  interactor  SR
        portal    process     STRIDE
        review    process     STRIDE
        db        data_store  TID
        log       data_store  TID
        f1        data_flow   TID      crosses: SandPay network
        f2        data_flow   TID      crosses: SandPay network
        f3        data_flow   TID      crosses: SandPay network
        f4        data_flow   TID      crosses: Database server
        f5        data_flow   TID      crosses: Database server
        f6        data_flow   TID
        f7        data_flow   TID      crosses: SandPay network
        f8        data_flow   TID
        f9        data_flow   TID      crosses: SandPay network
      by category: {'S': 5, 'T': 13, 'R': 5, 'I': 13, 'D': 13, 'E': 2}
      ```

      Fifty-one prompts for a small portal. Most are quickly answered ("TLS protects f1 in transit"), some
      become register entries, and the flows marked **crosses** are reviewed first, because that is where data
      from outside the boundary arrives.

  - id: visual
    kind: visual
    concepts: [sec-threat-dfd]
    title: The SandPay portal as a DFD
    body: |
      The model the code uses. Boxes are interactors, circles processes, cylinders data stores (Mermaid has no
      "two parallel lines" shape); the subgraphs are trust boundaries. Notice which arrows leave the
      **SandPay network** box - f1, f2, f3, f7 and f9 - and that f4 and f5 cross a second, inner boundary
      around the database server.

      ```mermaid
      flowchart LR
        merchant["Merchant (browser or API client)"]
        ops["SandPay ops staff"]
        receiver["Merchant webhook receiver"]
        subgraph net["SandPay network"]
          portal(("Portal web app and API"))
          review(("Log review"))
          log[("Access log")]
          subgraph dbs["Database server"]
            db[("Portal database")]
          end
        end
        merchant -- "f1 login, API calls, form posts" --> portal
        portal -- "f2 pages, JSON, session cookie" --> merchant
        ops -- "f3 admin requests" --> portal
        portal -- "f4 queries and updates" --> db
        db -- "f5 rows" --> portal
        portal -- "f6 access log lines" --> log
        portal -- "f7 webhook test request" --> receiver
        log -- "f8 log lines" --> review
        review -- "f9 alerts and reports" --> ops
      ```

      The first draft of this diagram had no **Log review** process: the access log was written and never
      read. That is the "data sink" the MSDN article warns about - and a repudiation problem, because a log
      nobody reads proves nothing.

  - id: when
    kind: when
    concepts: [sec-threat-dfd, sec-threat-stride]
    title: When to threat model, and when STRIDE is the wrong tool
    body: |
      **When.** The Manifesto's first principle: "The best use of threat modeling is to improve the security and
      privacy of a system through early and frequent analysis." Model at design time, then again whenever the
      design changes - a new data flow (say, a webhook), a new store, a new kind of user, or a mitigation (as
      you will see, a fix can create a threat). OWASP recommends keeping the threat model current "as the system
      changes", citing NIST SP 800-218 practice PW.1.2. Scope each session to a manageable part of the system,
      as the Manifesto puts it, rather than modelling everything at once.

      **Which technique.** OWASP's cheat sheet says to start with STRIDE for a technical design and choose
      another technique when the scope needs a different view:

      | The team needs to analyse | Consider |
      | --- | --- |
      | security threats in a technical design | STRIDE on components, flows and boundaries |
      | a high-value attacker goal or multi-step attack | attack trees |
      | abuse of a valid workflow or business rule (out of order, repeated, concurrent) | misuse or abuse cases |
      | privacy properties and harms | LINDDUN |
      | application threats with business impact | PASTA |
      | organisation-wide risk to critical assets | OCTAVE |

      It also warns: "Do not add techniques only to make the model appear comprehensive."

      **What it does not replace:** testing. A threat model says what **could** go wrong; only a test (or a
      real attacker) shows what **does**. Nor does it replace a penetration test, code review or scanning -
      it tells you where to point them.

  - id: code-dfd
    kind: code
    concepts: [sec-threat-dfd, sec-threat-stride]
    title: The model in code - elements, boundaries and the per-element table
    collapsed: true
    body: |
      The core of `foundations/threat_dfd.py` (reference solution; the file also holds the register check):

      ```python
      @dataclass(frozen=True)
      class Element:
          id: str
          name: str
          kind: str  # "interactor", "process", "data_store" or "data_flow"
          source: str | None = None  # data flows only
          target: str | None = None  # data flows only

      @dataclass(frozen=True)
      class Boundary:
          name: str
          inside: frozenset[str]  # ids of the elements inside it

      def stride_for(kind: str) -> tuple[str, ...]:
          table = {
              "data_flow": ("T", "I", "D"),
              "data_store": ("T", "I", "D"),
              "process": STRIDE,  # ("S", "T", "R", "I", "D", "E")
              "interactor": ("S", "R"),
          }
          if kind not in table:
              raise ValueError(f"unknown element kind {kind!r}; expected one of {KINDS}")
          return table[kind]

      def crossings(dfd: Dfd, flow: Element) -> tuple[str, ...]:
          return tuple(b.name for b in dfd.boundaries if (flow.source in b.inside) != (flow.target in b.inside))

      def enumerate_threats(dfd: Dfd) -> list[Threat]:
          threats: list[Threat] = []
          for e in dfd.elements:
              crossed = crossings(dfd, e) if e.kind == "data_flow" else ()
              threats += [Threat(e.id, c, crossed) for c in stride_for(e.kind)]
          return threats
      ```

      Checking the diagram before trusting it (`check_dfd`), on the first draft and the final model:

      ```plaintext
      == 2. Checking the diagram
      draft: ['never-read: log']
      final: []
      ```

  - id: line-by-line
    kind: line-by-line
    concepts: [sec-threat-dfd, sec-threat-to-tests]
    title: The lines that matter
    body: |
      **`(flow.source in b.inside) != (flow.target in b.inside)`** - a flow crosses a boundary when **exactly
      one** end is inside it. `or` would be wrong: f4 (portal to database) has both ends inside the SandPay
      network, so it does not cross that boundary - it crosses only the inner database-server boundary.

      **`crossed = crossings(dfd, e) if e.kind == "data_flow" else ()`** - only flows cross boundaries.
      Carrying the crossing on each flow threat lets you sort the register so boundary-crossing flows come
      first.

      **`if all(end.kind != "process" for end in ends): problems.append(f"no-process: {e.id}")`** - the MSDN
      rule "make sure there is always a process that reads and writes data". A flow straight from a merchant
      to the database means the diagram is wrong - or the system really lets users write to the database, which
      is worse.

      **`if not any(f.source == e.id for f in flows): problems.append(f"never-read: {e.id}")`** - "be careful of
      magic data sources or sinks: data isn't created out of thin air". A store nobody reads is either missing a
      reader in the diagram or genuinely useless - and for an audit log, useless means no defence against
      repudiation.

      In the probes (`foundations/threat_probes.py`):

      **`return f"{header}.{payload}."`** - an unsecured JWT (RFC 7519 section 6, "Unsecured JWTs") has an empty signature but
      keeps the final dot. A server that accepts it lets anyone write their own claims.

      **`return r.status_code == 200 and r.json().get("email") == victim_email`** - a check returns True only
      on **evidence** that the attack worked. A plain `status_code == 200` would also pass if the server
      ignored the token and returned the anonymous default - a check that cannot fail proves nothing.

      **`return _login(...victim_password).status_code != 200`** in `lockout_denial` - the one check that is
      expected to be True in the **fixed** portal: it tests the threat the fix created.

  - id: attack-trees
    kind: internals
    concepts: [sec-threat-to-tests]
    title: Attack trees - from a goal to the cheapest path
    body: |
      Schneier: "you represent attacks against a system in a tree structure, with the goal as the root node and
      different ways of achieving that goal as leaf nodes." Two kinds of inner node:

      - **OR** - "alternatives": any child reaches the parent.
      - **AND** - "different steps toward achieving the same goal": all children are needed.

      Leaves get values. Boolean ones (possible / impossible, special equipment / none) propagate as you would
      expect; for costs, "OR nodes have the value of their cheapest child; AND nodes have the value of the sum
      of their children." Querying the tree - "the cheapest attack requiring no special equipment", "all attacks
      that cost less than" a budget - tells you which attacks matter to the attacker you fear.

      The SandPay tree (`threat_fixture.sandpay_attack_tree()`), goal **read another merchant's payment data**.
      Leaves that rely on a portal flaw name it, so fixing the flaw makes the leaf impossible:

      ```plaintext
      == 4. Attack tree: cheapest attack as flaws are fixed
        fixed: nothing                                equipment: yes ->   10  Request another merchant's payment by id
        fixed: idor                                   equipment: yes ->   20  Forge an unsigned ops token
        fixed: idor, jwt-none                         equipment: yes ->   40  Inject SQL into the status filter
        fixed: idor, jwt-none, sqli                   equipment: yes ->  100  Find an ops email address + Guess without being throttled + The ops password is a common one
        fixed: idor, jwt-none, sqli, no-rate-limit    equipment: yes ->  300  Capture traffic on the merchant's network
        fixed: idor, jwt-none, sqli, no-rate-limit    equipment: no  -> 5000  Bribe a SandPay insider
        attacks under 100: [(10, "Request another merchant's payment by id"), (20, 'Forge an unsigned ops token'), (40, 'Inject SQL into the status filter')]
      ```

      Read it as a fix plan: each fix pushes the cheapest attack up. The AND branch costs 100 because all three
      steps are needed (10 + 30 + 60). After the four code fixes, what is left is not a code problem - network
      capture (answered by TLS, which this tree treats as a separate decision) and an insider. The numbers are
      illustrative, as in Schneier's own figures; the **ordering** they produce is the useful part.

  - id: steps
    kind: steps
    concepts: [sec-threat-dfd, sec-threat-stride, sec-threat-to-tests]
    title: A threat modelling session, step by step
    body: |
      1. **Scope it.** One feature or change, not the whole platform - "manageable portions of the system"
         (Manifesto). Name the assets: here, payment data, merchant secrets, ops privileges.
      2. **Draw the DFD** (question 1). Interactors, processes, stores, flows; then the trust boundaries.
         Collapse similar elements inside one boundary - "Think 'major function,' not implementation" (MSDN).
      3. **Check the diagram.** Every store written and read by a process; a process on every flow; nothing
         missing that touches the data (config, logs, queues, third parties).
      4. **Enumerate threats** (question 2). STRIDE per element, boundary-crossing flows first. Add an attack
         tree for the one goal an attacker would want most.
      5. **Decide a response for each credible threat** (question 3): mitigate, eliminate, transfer or accept.
         Record the owner; for "accept", the reason.
      6. **Write each mitigation as a testable requirement**, and the test next to it - preconditions, steps,
         expected result, evidence.
      7. **Review the mitigations as design changes.** Does the fix create a new element, flow or threat?
      8. **Validate** (question 4). Do the tests pass against the fixed system and fail against the old one?
         Does the DFD still match the system? OWASP asks: "Can the agreed upon mitigations be tested?"
      9. **Keep it.** Store the model with the code and revisit it when the design changes.

  - id: example
    kind: example
    concepts: [sec-threat-stride, sec-threat-to-tests]
    title: "Example: five threats from the portal's register, as checks"
    body: |
      Five entries from the portal's register. Four came from STRIDE on the portal process and the flows f1/f3;
      the fifth (lockout) appeared only when the team reviewed the fix for password guessing.

      | Threat | Element | Response | Requirement | Check |
      | --- | --- | --- | --- | --- |
      | S - an unsigned token is accepted as ops | portal | mitigate | Reject tokens whose `alg` is not HS256; verify every signature | `spoofing_unsigned_token` |
      | E - a merchant sets their own role | portal | mitigate | Profile updates accept only `display_name` (allow-list) | `elevation_via_profile_update` |
      | I - a merchant reads another merchant's payment | portal, f1 | mitigate | Every payment read checks the caller's merchant id; unknown and foreign ids answer alike | `disclosure_cross_merchant` |
      | S - unlimited password guessing | f1, portal | mitigate | At most 5 login attempts per account per 60 s | `spoofing_by_guessing` |
      | D - attacker locks a merchant out | portal | accept (with owner and reason), review | The limit is per account; a lockout lasts at most 60 s | `lockout_denial` |

      Each check against the vulnerable portal and against a portal with **only the matching flaw** fixed:

      ```plaintext
      == 3. Threats as executable checks (True = the attack worked)
        threat                             flaw             vulnerable  fixed
        S  unsigned token accepted         jwt-none         True        False
        E  role set via profile update     mass-assignment  True        False
        I  other merchant's payment read   idor             True        False
        S  password guessing unthrottled   no-rate-limit    True        False
        D  victim locked out               no-rate-limit    False       True
      ```

      What a tester checks here: every check flips when its fix goes in - so it really tests the threat, not
      something else - and the last row flips the other way. The per-account limit that stops guessing is a
      new design element; STRIDE on it finds the denial of service it creates. That is why "accept" for T5
      needs an owner and a reason, and why some teams limit by account **and** by source, or slow attempts down
      instead of refusing them.

  - id: tests
    kind: tests
    concepts: [sec-threat-to-tests]
    title: Test cases derived from the model
    body: |
      Turn threats into cases the same way for any feature. For the portal's webhook test flow (f7, portal to
      merchant receiver, crossing the SandPay network boundary):

      | # | Derived from | Test (steps) | Expected | Evidence |
      | --- | --- | --- | --- | --- |
      | 1 | I on f7 / E on portal | As a merchant, `POST /api/webhooks/test` with a URL on `127.0.0.1` pointing to `/internal/admin` | 400 "must be a public address"; nothing internal in the response | response body and status; server access log line |
      | 2 | I on f7 | Same with `localhost`, a private range (`10.0.0.5`) and a link-local address | 400 for each | one request and response per address |
      | 3 | S on merchant | Call it with no token, then with an unsigned token | 401 both times | statuses; no outbound call in the log |
      | 4 | T on f7 | Send a URL with a scheme other than http(s) | 400 | response |
      | 5 | D on portal | Point it at a receiver that never answers | the call times out within the documented limit; the portal stays responsive | timings; a parallel health check |
      | 6 | positive | A public https URL (in an environment that allows outbound calls) | delivered; the merchant sees the status | response; receiver log |

      Negative cases (1-5) prove the mitigation; the positive case (6) proves the feature still works - a fix
      that blocks every webhook would pass 1-5 and fail the business.

      For each mitigation, keep the pair: **finds the flaw** on the vulnerable build, **quiet** on the fixed
      one. A check that is True on both is testing the wrong thing; one that is False on both cannot detect
      anything.

  - id: mistakes
    kind: mistakes
    concepts: [sec-threat-dfd, sec-threat-stride, sec-threat-to-tests]
    title: Common mistakes and a debugging method
    body: |
      - **Modelling the wrong system.** A DFD drawn from the architecture slides, not the running system, misses
        the cron job, the admin endpoint, the log shipper. Check it against reality - routes, configs, network
        rules.
      - **Magic sinks and sources.** A store no process reads, or data appearing from nowhere. The MSDN rules
        catch these; `check_dfd` automates them.
      - **Arguing categories.** Is removing a merchant tampering or denial of service? MSDN: "Don't get too hung
        up over the terminology." Record it once; move on.
      - **Stopping at the list.** Fifty-one prompts are not fifty-one findings. Each needs a decision and, if
        mitigated, a requirement and a test. OWASP: "Each threat identified earlier must have a response."
      - **Accepting without an owner.** An accepted risk with no named owner and reason is a forgotten risk.
      - **Forgetting that fixes are design changes.** The login limit created a lockout threat. Re-run STRIDE
        on every mitigation that adds state, a component or a rule.
      - **One snapshot.** The Manifesto values "Continuous refinement over a single delivery". A model from
        last year's design is a model of a different system.
      - **The hero threat modeler.** The Manifesto's anti-pattern: "everyone can and should do it" - developers,
        testers, ops and product together find more than one expert alone ("Varied Viewpoints").

      **Debugging a threat check that always passes or always fails:**

      1. Run it against the vulnerable build and against a build with **only** its flaw fixed.
      2. If it is True on both, it is not observing the flaw - print the response and look for a weaker
         condition (status only, wrong field, a default user).
      3. If it is False on both, the attack never reached the code - check authentication, the URL, the
         method, the body.
      4. Fix the check until it flips with the flaw; only then trust it in CI.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [sec-threat-stride, sec-threat-to-tests]
    title: Trade-offs and alternatives
    body: |
      - **Systematic versus noisy.** STRIDE per element is reproducible - two teams get the same prompts - but
        produces many, most of them quickly dismissed. Collapsing similar elements, as MSDN suggests, keeps the
        list readable.
      - **Security, not privacy.** STRIDE's properties are security properties. OWASP points to LINDDUN for
        privacy harms (linking, identifying, detecting, unawareness ...), which STRIDE does not fully cover.
      - **Design, not business logic.** STRIDE on a DFD rarely finds "refund the same payment twice"; abuse
        cases ("out of order, repeatedly, concurrently, or for an unintended outcome") do. The business logic
        lesson in this track uses them.
      - **Attack-tree numbers are judgement.** Costs and probabilities are estimates; use them to **order**
        work, not to promise a level of security. Schneier's own values are "only an illustrative example".
      - **Heavier methods.** PASTA links threats to business objectives; OCTAVE assesses organisational risk;
        VAST scales across many teams (OWASP). They cost more time; choose them for the question you have, not
        to look thorough.
      - **Tools.** Tools such as the Microsoft Threat Modeling Tool draw the DFD and list STRIDE threats for it,
        which saves time; the Manifesto still values "People and collaboration over processes, methodologies,
        and tools". The conversation is the product.

  - id: summary
    kind: summary
    concepts: [sec-threat-dfd, sec-threat-stride, sec-threat-to-tests]
    title: Quick reference
    body: |
      - **Four questions:** what are we working on - what can go wrong - what are we going to do about it -
        did we do a good (enough) job.
      - **DFD:** interactors (rectangle), processes (circle), data stores (parallel lines), data flows (arrows),
        trust boundaries (dotted). Every store written and read by a process; a process on every flow.
      - **STRIDE → property:** S authentication, T integrity, R non-repudiation, I confidentiality,
        D availability, E authorization.
      - **Per element:** flows and stores T, I, D; processes all six; interactors S, R.
      - **Review first:** flows that cross a trust boundary.
      - **Responses:** mitigate, eliminate, transfer (name the owner), accept (owner and reason).
      - **Every mitigation:** a testable requirement plus a check that finds the flaw before the fix and is
        quiet after it.
      - **Fixes are design changes:** re-run STRIDE on them (the login limit created a lockout threat).
      - **Attack trees:** OR = cheapest child, AND = sum; the cheapest remaining attack is the next thing to fix.

exercises:
  - id: stride-for-a-flow
    type: mcq
    concept: sec-threat-stride
    skill: recall
    title: Which categories apply to a data flow?
    prompt: |
      Using STRIDE per element, which categories apply to the data flow **f1** (merchant to portal: login, API
      calls and form posts)?
    options:
      - id: tid
        text: Tampering, Information disclosure, Denial of service
        feedback: Correct - data in motion can be changed, read or stopped. Spoofing and elevation of privilege belong to the process (and spoofing also to the interactor) at its ends.
      - id: stride
        text: All six
        feedback: All six apply to processes. A flow does not authenticate or hold privileges itself, so S and E are recorded on the elements at its ends.
      - id: sr
        text: Spoofing and Repudiation
        feedback: That is the interactor row - the merchant, not the flow.
      - id: tie
        text: Tampering, Information disclosure, Elevation of privilege
        feedback: Elevation of privilege needs something that holds privileges - a process. Denial of service is the third flow category.
    correct: [tid]
    hints:
      - What can happen to data while it moves?
      - Which element in the DFD actually checks who you are?
    solution: |
      Data flows and data stores get T, I, D; processes get all six; interactors get S and R (MSDN 2006,
      "Threats Affecting Elements").

  - id: property-for-spoofing
    type: mcq
    concept: sec-threat-stride
    skill: application
    title: The unsigned token
    prompt: |
      The portal accepts a JWT with `"alg": "none"` and `"sub": "ops@sandpay.example"` and treats the caller
      as the ops admin. Which STRIDE category and which violated property best describe the **threat**?
    options:
      - id: s-authn
        text: Spoofing - authentication
        feedback: Correct - the caller uses an identity that is not theirs. The privileges come with the stolen identity; the root failure is that identity was never proven.
      - id: e-authz
        text: Elevation of privilege - authorization
        feedback: The caller does end up with admin powers, but the portal's authorization works as designed for the identity it believed. The broken property is proof of identity.
      - id: t-integrity
        text: Tampering - integrity
        feedback: The attacker writes their own token rather than modifying one in transit; what fails is the check that the token came from the portal - authentication.
      - id: i-conf
        text: Information disclosure - confidentiality
        feedback: Disclosure may follow, but it is a consequence. Name the threat by what the attacker does first.
    correct: [s-authn]
    hints:
      - What did the attacker claim to be?
      - Which property means "the identity of users is established"?
    solution: |
      Spoofing violates authentication: the portal accepted a claim of identity without proof. Its mitigation
      is to reject unsigned tokens and verify every signature - and the check `spoofing_unsigned_token` tests
      exactly that.

  - id: review-first
    type: mcq
    concept: sec-threat-dfd
    skill: application
    title: Where to look first
    prompt: |
      You have one hour to review the portal's 51 STRIDE prompts. Which flows do you take first, and why?
    options:
      - id: crossing
        text: f1, f2, f3, f7 and f9 - they cross the SandPay network boundary, where untrusted data and parties meet the system
        feedback: Correct - a trust boundary is "the border between trusted and untrusted elements". Input from outside it is what an attacker controls.
      - id: database
        text: f4 and f5 - the database holds the most valuable data
        feedback: The database matters, but f4 and f5 start and end inside the SandPay network. An attacker reaches them through the boundary-crossing flows first - review those, then the inner boundary.
      - id: log
        text: f6 and f8 - logs are often forgotten
        feedback: Logs matter for repudiation, but they are internal flows. Start where the attacker's input enters.
      - id: alphabetical
        text: All of them in order - priority is a matter of opinion
        feedback: A trust boundary is an objective reason to prioritise. One hour on 51 prompts in order would end before the external interfaces are reached.
    correct: [crossing]
    hints:
      - Which flows carry data an attacker can choose?
      - What does the dotted line in a DFD mean?
    solution: |
      Flows that cross a trust boundary carry data from (or to) parties you do not control. `enumerate_threats`
      records the boundaries each flow crosses so the register can be sorted by them.

  - id: magic-sink
    type: mcq
    concept: sec-threat-dfd
    skill: analysis
    title: never-read - log
    prompt: |
      `check_dfd` on the first draft of the portal's DFD returns `['never-read: log']`. What does it tell you,
      and what is the right fix?
    options:
      - id: add-reader
        text: Nothing reads the access log in the model. Find out who really reads it (log review, ops) and add that process and its flows - or, if nobody does, record a repudiation threat
        feedback: Correct - a "data sink" in the MSDN rules. Either the diagram is missing a reader, or the system really writes a log nobody uses, which leaves repudiation unanswered.
      - id: delete-store
        text: Remove the log from the diagram - it is not part of the attack surface
        feedback: Hiding the store hides its threats (tampering with or reading the log) and the missing reader. Model what exists.
      - id: ignore
        text: Ignore it - the rule is only a style guideline
        feedback: MSDN gives it as a rule of thumb for a sensible DFD; a magic sink usually means part of the system is missing from the model.
      - id: flow-from-merchant
        text: Add a flow from the log to the merchant, so the store has a reader
        feedback: That invents a flow that does not exist - and would disclose other merchants' log lines. Model the real reader.
    correct: [add-reader]
    hints:
      - '"Data isn''t created out of thin air" - and it does not disappear into it either.'
      - Which STRIDE category depends on someone reading a log?
    solution: |
      The final model adds a **Log review** process (f8 log lines in, f9 alerts out to ops), and `check_dfd`
      then returns `[]`. A log that nobody reads cannot answer "who did this?".

  - id: interactor-row
    type: mcq
    concept: sec-threat-stride
    skill: analysis
    title: Why so few threats for the merchant?
    prompt: |
      A teammate asks why the **merchant** interactor gets only S and R, when merchants' browsers can obviously
      be tampered with. What is the best answer?
    options:
      - id: outside
        text: The merchant is outside our system - we cannot fix their browser. We model whether one can pretend to be another (S) and whether their actions can be denied (R); what they send is covered as T, I, D on the flows and the portal process
        feedback: Correct - interactors are "outside the scope of your system". Their tampering becomes untrusted input on f1, which the portal must validate.
      - id: trusted
        text: Merchants are authenticated, so they are trusted
        feedback: Authenticated is not trusted - a merchant can be malicious (reading other merchants' payments). The merchant is outside the trust boundary.
      - id: mistake
        text: It is a mistake in the table; interactors should get all six
        feedback: The table is deliberate. Threats from the interactor show up on the flows and the process that receives them.
      - id: low-risk
        text: Interactors are low risk, so the table skips them
        feedback: The table is about which categories apply, not about risk. Interactors are often the attacker.
    correct: [outside]
    hints:
      - Where is the merchant relative to the trust boundary?
      - Where does a tampered request become a problem?
    solution: |
      Threats are recorded where you can do something about them. You cannot stop a merchant changing a request,
      but the portal can authenticate them (S), log their actions (R) and validate what f1 carries (T, I, D on the
      flow and the process).

  - id: repudiation-example
    type: mcq
    concept: sec-threat-stride
    skill: recognition
    title: Spot the repudiation threat
    prompt: Which of these is a **repudiation** threat for the SandPay portal?
    options:
      - id: refund-denied
        text: A merchant says they never issued a refund, and the log records only "POST /api/refunds 201" with no user
        feedback: Correct - "users who deny performing an action without other parties having any way to prove otherwise". The fix is attributable, tamper-resistant logging.
      - id: idor
        text: A merchant reads another merchant's payment by changing the id
        feedback: That is information disclosure (confidentiality).
      - id: lockout
        text: An attacker locks a merchant out with failed logins
        feedback: That is denial of service (availability).
      - id: role
        text: A merchant makes themselves an admin
        feedback: That is elevation of privilege (authorization).
    correct: [refund-denied]
    hints:
      - Repudiation is about proving who did something afterwards.
    solution: |
      Repudiation violates non-repudiation: an action cannot be tied to whoever did it. The access log in the
      practice portal records method, path and status - not the user - so it would not settle that dispute.

  - id: fix-creates-threat
    type: mcq
    concept: sec-threat-to-tests
    skill: analysis
    title: The limit that locks people out
    prompt: |
      After the per-account login limit (5 attempts per 60 s) was added, `lockout_denial` turned from False to
      True. What is the right conclusion?
    options:
      - id: new-threat
        text: The fix is a design change that created a denial-of-service threat; record it, decide a response (for example accept with a short window and an owner, or limit by source too), and keep the check
        feedback: Correct - a mitigation adds state and rules, so STRIDE applies to it again. The check documents the trade-off.
      - id: revert
        text: The fix is wrong - revert it
        feedback: Reverting brings back unlimited password guessing (spoofing). Weigh both threats and choose a response.
      - id: broken-check
        text: The check is broken, because checks must be False on the fixed build
        feedback: That rule holds for a check of the threat the fix addresses. This check tests a different threat - one the fix creates.
      - id: irrelevant
        text: Lockouts are a usability issue, not security
        feedback: Availability is one of the security properties - denial of service is the D in STRIDE.
    correct: [new-threat]
    hints:
      - Which STRIDE category does "a legitimate user cannot log in" belong to?
      - Did the fix add anything an attacker can use?
    solution: |
      Mitigations are design changes. The register gets a new D threat with its own response; the check stays as
      evidence of the trade-off.

  - id: transfer-response
    type: mcq
    concept: sec-threat-to-tests
    skill: application
    title: The hosting provider will handle it
    prompt: |
      For "D - a flood of traffic takes the portal offline", the team writes `response: transfer` and nothing
      else, because the hosting contract includes DDoS protection. What is missing?
    options:
      - id: owner
        text: An owner - who now holds the remaining controls and the residual risk; transferring does not by itself make the threat less likely
        feedback: Correct - OWASP, citing NIST - "Risk transfer does not itself reduce the likelihood or harmful consequences of an event"; "document who owns the remaining controls and residual risk."
      - id: test
        text: Nothing - transferred threats need no further detail
        feedback: The threat still happens to SandPay's merchants. Someone must own it, check the contract covers it, and know what happens when it fails.
      - id: requirement
        text: A code-level requirement for the portal
        feedback: Requirements belong to mitigations. Transfer moves responsibility; what it needs is an owner (and ideally a check that the provider's protection is in place).
      - id: accept
        text: It should be "accept" because SandPay cannot do anything
        feedback: Accepting means choosing to live with the risk. Here a provider takes on controls - that is transfer, with an owner.
    correct: [owner]
    hints:
      - Who answers the phone when the portal is down?
    solution: |
      `check_register` reports `no-owner` for a transfer without an owner. The four responses are mitigate,
      eliminate, transfer and accept; only eliminate needs nothing more.

  - id: tree-arithmetic
    type: mcq
    concept: sec-threat-to-tests
    skill: application
    title: Cost of the goal
    prompt: |
      An attack tree's root is an OR of three children: an AND of leaves costing 15 and 25; a leaf costing 45;
      and a leaf costing 30 that needs special equipment. What is the cheapest attack for an attacker **without**
      special equipment?
    options:
      - id: forty
        text: '40 - the AND branch (15 + 25)'
        feedback: Correct - AND sums its children (40); OR takes the cheapest possible child; the equipment leaf is not available, so 40 beats 45.
      - id: thirty
        text: '30 - the equipment leaf'
        feedback: That leaf needs special equipment, which this attacker does not have - it is impossible for them.
      - id: fifteen
        text: '15 - the cheapest leaf'
        feedback: An AND node needs all its children - 15 alone does not reach the goal.
      - id: twentyfive
        text: '25 - the dearer AND leaf'
        feedback: AND is the sum of its children, not the maximum.
    correct: [forty]
    hints:
      - '"OR nodes have the value of their cheapest child; AND nodes have the value of the sum of their children."'
    solution: |
      AND = 15 + 25 = 40; OR = min(40, 45) = 40 once the equipment leaf is excluded. With equipment it would be
      30.

  - id: when-to-model
    type: mcq
    concept: sec-threat-dfd
    skill: application
    title: When is the next session?
    prompt: |
      The portal's threat model was done at design time six months ago. Since then the team has added the
      webhook test endpoint. What should happen?
    options:
      - id: update
        text: Update the model now for the new flow and process (f7 crosses the network boundary) and derive tests for it
        feedback: Correct - the Manifesto values "Continuous refinement over a single delivery"; a new boundary-crossing flow is exactly what needs a fresh look.
      - id: annual
        text: Wait for the annual security review
        feedback: The feature ships before then. Threat modelling should follow design changes "in iterations".
      - id: pentest
        text: Skip it - the penetration test will find anything wrong
        feedback: A pentest is time-boxed and finds what it happens to reach. The model tells you - and the pentester - where to look.
      - id: done
        text: Nothing - the model was already done
        feedback: A model of last year's design describes a different system.
    correct: [update]
    hints:
      - Which Manifesto value is about time?
    solution: |
      Model early and frequently, scoped to the change. The webhook flow adds an outbound request from the portal -
      a server-side request forgery risk the original model could not contain.

  - id: session-order
    type: order
    concept: sec-threat-to-tests
    skill: recall
    title: One pass through the four questions
    prompt: Put the steps of a threat modelling session in order.
    items:
      - id: scope
        text: Scope the feature and name the assets
      - id: draw
        text: Draw the DFD with trust boundaries
      - id: check
        text: Check the diagram (no magic sinks, a process on every flow)
      - id: enumerate
        text: Enumerate threats with STRIDE per element, boundary-crossing flows first
      - id: respond
        text: Decide a response and an owner for each credible threat
      - id: require
        text: Write each mitigation as a requirement with its test
      - id: validate
        text: Run the tests against the old and the fixed build, and review the model
    hints:
      - The four questions come in order - what, what can go wrong, what will we do, did we do enough.
    solution: |
      Scope and draw (question 1), check the drawing, enumerate (question 2), respond and specify (question 3),
      validate (question 4). The steps loop when the design changes.

  - id: debug-crossings
    type: debug
    concept: sec-threat-stride
    skill: analysis
    title: Every flow crosses the network
    prompt: |
      With this code, every interactor gets the wrong categories and f4 (portal to database) is reported as
      crossing the **SandPay network** boundary although both ends are inside it. Click **every** line that causes
      a defect.
    language: python
    code: |
      TABLE = {
          "data_flow": ("T", "I", "D"),
          "data_store": ("T", "I", "D"),
          "process": ("S", "T", "R", "I", "D", "E"),
          "interactor": ("S", "T"),
      }

      def crossings(dfd, flow):
          crossed = []
          for b in dfd.boundaries:
              if flow.source in b.inside or flow.target in b.inside:
                  crossed.append(b.name)
          return tuple(crossed)
    correctLines: [5, 11]
    lineNotes:
      - line: 2
        note: Correct - data flows get T, I, D.
      - line: 3
        note: Correct - data stores also get T, I, D.
      - line: 4
        note: Correct - processes get all six.
      - line: 12
        note: Appending the name is right once the condition is right.
    hints:
      - Which two categories apply to interactors?
      - A flow crosses a boundary when exactly one end is inside it.
    solution: |
      Line 5 should be `("S", "R")` - interactors can be spoofed and can repudiate. Line 11 needs "exactly one
      end inside": `(flow.source in b.inside) != (flow.target in b.inside)`. With `or`, any flow touching the
      boundary counts, so every internal flow "crosses" it.

  - id: why-not-51-tests
    type: short
    concept: sec-threat-to-tests
    skill: analysis
    title: Fifty-one prompts, how many tests?
    prompt: |
      STRIDE per element produced 51 threats for the portal. A manager asks why the security test plan does not
      have 51 tests. Answer in a few sentences.
    modelAnswer: |
      The 51 are prompts, not findings. Each one is examined in context: many are not credible or are already
      answered by a control we can point to (TLS on f1 for tampering in transit), several describe the same
      underlying risk from different elements (merge them), and some are accepted or transferred with an owner.
      Tests come from the threats we decided to **mitigate**: each gets a requirement and at least one check that
      finds the flaw on the old build and is quiet on the fixed one, plus a positive test that the feature still
      works. Prioritisation - boundary-crossing flows first, an attack tree for the main goal - decides the order.
    rubric:
      - Says the STRIDE list is a set of prompts that need a decision, not findings.
      - Mentions merging duplicates and dismissing threats already answered by a named control.
      - Ties tests to mitigated threats (requirement plus check), with accepted and transferred ones owned instead.
      - Mentions prioritisation (trust boundaries, attack trees or risk).
    hints:
      - What is the response to each threat?
    solution: |
      Tests follow from mitigations, not from prompts: decide each threat, merge duplicates, test what you
      mitigate - both "finds" and "quiet after fix".

  - id: webhook-testdesign
    type: testdesign
    concept: sec-threat-to-tests
    skill: application
    title: Test plan for the webhook test endpoint
    prompt: |
      The register has these entries for the portal's webhook test feature (flow f7, portal to the merchant's
      receiver, crossing the SandPay network boundary): I - the portal fetches internal addresses and returns
      what it got; S - anyone can trigger outbound calls; D - a slow receiver ties up the portal. Design the test
      cases. For each give preconditions, steps, expected result **and evidence**, and say which threat it covers.
    modelAnswer: |
      Preconditions for all: the portal running locally with outbound calls restricted as in production; a
      merchant account and token; an access log you can read.

      1. **Internal address (I)** - POST `/api/webhooks/test` with `http://127.0.0.1:<port>/internal/admin`.
         Expected - 400 "must be a public address"; no internal data in the body. Evidence - status and body; no
         `/internal/admin` request in the access log.
      2. **Other internal forms (I)** - `localhost`, `10.0.0.5`, a link-local address. Expected - 400 each.
         Evidence - one request and response per address.
      3. **No or forged identity (S)** - no token, then an unsigned token. Expected - 401 both. Evidence -
         statuses; no outbound request logged.
      4. **Bad scheme (T)** - a non-http(s) URL. Expected - 400. Evidence - response.
      5. **Slow receiver (D)** - a local receiver that never answers. Expected - the call ends within the
         configured timeout; a parallel `/health` check stays fast. Evidence - timings of both.
      6. **Regression pair** - run 1-3 against the vulnerable build too. Expected - they fail there (the attack
         works), proving the checks detect the flaw. Evidence - both runs' results.
      7. **Positive** - a public https URL where outbound calls are allowed. Expected - delivered. Evidence -
         response and the receiver's log.
    rubric:
      - Each case has preconditions, steps, an expected result and concrete evidence.
      - Covers the internal-address threat with more than one address form.
      - Covers authentication (no token and a forged token) and a slow receiver.
      - Runs the negative checks against the vulnerable build as well, to prove they detect the flaw.
      - Includes a positive case showing the feature still works.
    hints:
      - Which addresses count as "internal"?
      - How do you prove the check would have caught the flaw?
    solution: |
      One or more negative cases per threat with evidence, the same checks run against the vulnerable build to
      prove they detect, and one positive case for the feature.

  - id: interview-threat-model
    type: interview
    concept: sec-threat-to-tests
    skill: analysis
    title: "Interview: threat model a new feature"
    prompt: |
      "We are adding instant payouts to the merchant portal. As the QA engineer in the design review, how do you
      threat model it, and what comes out of it for testing?"
    modelAnswer: |
      I would use the four questions. First, what are we working on: draw a DFD with the merchant, the portal, the
      payout service, the bank or payout provider, the database and logs, and mark trust boundaries - the
      internet edge and the link to the provider. I check the diagram: every store has a writer and a reader, a
      process on every flow.

      Then what can go wrong: STRIDE per element, starting with flows that cross boundaries. For payouts the big
      ones are spoofing (someone else triggers a payout), tampering (the amount or the destination account changed
      in a request), repudiation (a merchant denies requesting it - we need attributable logs), information
      disclosure (bank details in responses or logs), denial of service (draining limits or locking accounts) and
      elevation (a merchant user without the payout permission). I would add an attack tree for "send money to an
      account I control" because that is the attacker's real goal, and abuse cases for double submission and
      races.

      What are we going to do about it: a response and owner for each, and each mitigation as a testable
      requirement - "a payout to a newly added account needs re-authentication", "the same idempotency key never
      pays twice". For each I write a check that succeeds on a build without the control and fails with it, plus
      a positive test. And I review the mitigations themselves - limits and step-up authentication create their
      own lockout and usability threats.

      Did we do a good job: the checks run in CI, and the model is revisited when the design changes.
    rubric:
      - Structures the answer with the four questions.
      - Draws a DFD with trust boundaries and names the boundary-crossing flows.
      - Applies STRIDE with concrete payout threats, not just the category names.
      - Turns mitigations into testable requirements and checks that detect the flaw and pass after the fix.
      - Mentions reviewing mitigations as design changes, and keeping the model current.
    followUps:
      - Which of those threats would a scanner find, and which only the model?
      - How would you prioritise if you only had a day?
      - When would you use an attack tree or abuse cases instead of STRIDE?
    hints:
      - Use the four questions as the outline of the answer.
    solution: |
      Four questions - DFD with boundaries - STRIDE per element plus an attack tree for the money goal -
      responses, requirements and checks - revisit as the design changes.

  - id: dfd-code
    type: coding
    concept: sec-threat-stride
    skill: application
    title: STRIDE per element and the register check
    prompt: |
      In `foundations/threat_dfd.py`, implement `stride_for`, `crossings`, `enumerate_threats`, `check_dfd` and
      `check_register` as their docstrings describe. The tests model the SandPay portal (from
      `support/threat_fixture.py`): 51 threats, the boundary each flow crosses, the draft diagram's
      `never-read: log`, and a register with missing owners, tests and responses.
    project: security
    files:
      - exercises/foundations/threat_dfd.py
    test: tests/foundations/test_threat_dfd.py
    command: .venv/bin/python -m pytest tests/foundations/test_threat_dfd.py
    hints:
      - The per-element table has four rows; processes use the whole STRIDE tuple.
      - A flow crosses a boundary when exactly one end is inside it.
      - check_dfd reports flows first (in element order), then the data store problems.
    modelAnswer: |
      ```python
      def stride_for(kind):
          table = {"data_flow": ("T", "I", "D"), "data_store": ("T", "I", "D"),
                   "process": STRIDE, "interactor": ("S", "R")}
          if kind not in table:
              raise ValueError(f"unknown element kind {kind!r}")
          return table[kind]

      def crossings(dfd, flow):
          return tuple(b.name for b in dfd.boundaries if (flow.source in b.inside) != (flow.target in b.inside))

      def enumerate_threats(dfd):
          threats = []
          for e in dfd.elements:
              crossed = crossings(dfd, e) if e.kind == "data_flow" else ()
              threats += [Threat(e.id, c, crossed) for c in stride_for(e.kind)]
          return threats
      ```

      `check_dfd` walks the flows (unknown kind, bad endpoint, no process), then each data store (never
      written, never read); `check_register` checks the category, then what each response needs - mitigate a
      requirement and a test, transfer an owner, accept a reason and an owner.
    rubric:
      - Every test in tests/foundations/test_threat_dfd.py passes.
      - The per-element table matches the MSDN 2006 table exactly, and unknown kinds raise.
      - Boundary crossing uses "exactly one end inside", not "either end".
      - Register rules match the four responses and what each one needs.
    solution: |
      A four-row table, an exclusive-or for boundary crossing, and rule-by-rule checks for the diagram and the
      register.

  - id: probes-code
    type: coding
    concept: sec-threat-to-tests
    skill: application
    title: Threats as executable checks
    prompt: |
      In `foundations/threat_probes.py`, implement `unsigned_token` and the five checks. Each returns True only
      on evidence that the attack worked. The tests run every check against the vulnerable portal (must be True)
      and against a portal with only its flaw fixed (must be False) - except `lockout_denial`, which tests the
      threat the fix creates and so is False on the vulnerable portal and True on the fixed one.
    project: security
    files:
      - exercises/foundations/threat_probes.py
    test: tests/foundations/test_threat_probes.py
    command: .venv/bin/python -m pytest tests/foundations/test_threat_probes.py
    hints:
      - An unsigned JWT is base64url(header) + "." + base64url(payload) + "." - no padding, empty signature.
      - Use the helpers `_login` and `_token`; send the token as `Authorization` with the Bearer scheme.
      - For disclosure, compare the payment's merchant id with the merchant id the login returned.
    modelAnswer: |
      ```python
      def unsigned_token(claims):
          header = _b64url(json.dumps({"alg": "none", "typ": "JWT"}).encode())
          payload = _b64url(json.dumps(claims).encode())
          return f"{header}.{payload}."

      def spoofing_unsigned_token(base_url, victim_email="ops@sandpay.example"):
          r = requests.get(f"{base_url}/api/me", timeout=TIMEOUT,
                           headers={"Authorization": f"Bearer {unsigned_token({'sub': victim_email})}"})
          return r.status_code == 200 and r.json().get("email") == victim_email

      def lockout_denial(base_url, victim_email, victim_password, attempts=6):
          for i in range(attempts):
              _login(base_url, victim_email, f"attacker-{i}")
          return _login(base_url, victim_email, victim_password).status_code != 200
      ```

      The other checks follow the same pattern: perform the attack, then look for the evidence - the role in
      `GET /api/me`, a foreign merchant id on the payment, no 429 among the guesses.
    rubric:
      - Every test in tests/foundations/test_threat_probes.py passes.
      - Each check returns True only on evidence of the attack's effect, not on a status code alone.
      - Each check flips when its flaw is fixed (and lockout_denial flips the other way).
      - Runs only against the local practice portal.
    solution: |
      Attack, then look for the effect; a check is only trusted when it flips with the flaw.

  - id: attack-tree-code
    type: coding
    concept: sec-threat-to-tests
    skill: application
    title: Attack trees - possible, cheapest, all attacks
    prompt: |
      In `foundations/threat_attack_tree.py`, implement `_leaf_ok`, `possible`, `cheapest`, `attacks` and
      `attacks_under`. A leaf is impossible if its flaw is in `fixed` or it needs equipment that is not allowed.
      The tests use small trees and the SandPay tree, whose cheapest attack moves from 10 to 20, 40, 100, 300 and
      5000 as flaws are fixed and equipment is ruled out.
    project: security
    files:
      - exercises/foundations/threat_attack_tree.py
    test: tests/foundations/test_threat_attack_tree.py
    command: .venv/bin/python -m pytest tests/foundations/test_threat_attack_tree.py
    hints:
      - Recursion - a leaf answers for itself; OR and AND combine their children.
      - "For cheapest, on a tie keep the first child: min() with a key does that."
      - For attacks under an AND node, every combination of one attack per child - itertools.product.
    modelAnswer: |
      ```python
      def cheapest(node, fixed=frozenset(), allow_equipment=True):
          if node.kind == "leaf":
              return (node.cost, [node.name]) if _leaf_ok(node, fixed, allow_equipment) else None
          options = [cheapest(c, fixed, allow_equipment) for c in node.children]
          if node.kind == "or":
              found = [o for o in options if o is not None]
              return min(found, key=lambda o: o[0]) if found else None
          if any(o is None for o in options):
              return None
          return sum(o[0] for o in options), [leaf for o in options for leaf in o[1]]
      ```

      `attacks` builds lists the same way - OR concatenates its children's attacks, AND takes the product - and
      sorts by cost, then leaf names.
    rubric:
      - Every test in tests/foundations/test_threat_attack_tree.py passes.
      - OR takes the cheapest possible child, AND the sum, and an impossible child makes an AND impossible.
      - Fixed flaws and the equipment rule are applied at the leaves only.
    solution: |
      Recursive evaluation with Schneier's rules - OR minimum, AND sum - and leaves that become impossible when
      their flaw is fixed.

placement:
  - id: place-no-process
    type: mcq
    concept: sec-threat-dfd
    skill: analysis
    title: A flow straight to the database
    prompt: |
      A draft DFD has a data flow labelled "update payout account" going directly from the **Merchant**
      interactor to the **Payments database** data store. What does this tell you?
    options:
      - id: missing-process
        text: The diagram is missing the process that receives and writes the update - or the system really lets merchants write to the database, which is a serious threat in itself
        feedback: Correct - "make sure there is always a process that reads and writes data" (MSDN 2006). Find out which it is.
      - id: fine
        text: Nothing - merchants update their own data
        feedback: Data does not travel "from a user's head to the disk". Some process handles it; that process is where validation and authorization happen, and where the threats are.
      - id: boundary
        text: Only that a trust boundary is missing
        feedback: A boundary may also be missing, but the flow itself breaks the rule that a process sits on every flow.
      - id: interactor-wrong
        text: The merchant should be modelled as a process
        feedback: The merchant is outside the system - an interactor. The missing element is the portal process between them.
    correct: [missing-process]
    hints:
      - Which DFD element runs code?
    solution: |
      Every data flow needs a process at one end ("psychokinesis" is not a transport). Add the process that
      handles payout updates, then apply STRIDE to it - all six categories.

  - id: place-tampering-in-transit
    type: mcq
    concept: sec-threat-stride
    skill: application
    title: The amount changed on the way
    prompt: |
      A refund request from the portal to the payment service travels over an internal network. A reviewer
      worries that someone on that network could change the amount. Which STRIDE category, on which DFD element?
    options:
      - id: t-flow
        text: Tampering, on the data flow
        feedback: Correct - modifying data in motion violates integrity; data flows get T, I, D.
      - id: s-process
        text: Spoofing, on the payment service process
        feedback: Spoofing is pretending to be someone. Changing the amount in a genuine request is tampering.
      - id: e-flow
        text: Elevation of privilege, on the data flow
        feedback: Data flows do not hold privileges - E applies to processes. And the threat changes data, not privileges.
      - id: r-interactor
        text: Repudiation, on the merchant interactor
        feedback: Repudiation is about denying an action afterwards. The threat here is the data being changed.
    correct: [t-flow]
    hints:
      - Which property is violated when data is changed by the wrong person?
    solution: |
      Tampering violates integrity; for data in motion, it is recorded on the data flow (T, I, D apply to flows).

  - id: place-tree
    type: mcq
    concept: sec-threat-to-tests
    skill: application
    title: The cheapest path
    prompt: |
      Goal (OR): A) an AND of "find an admin email" (5) and "guess the password without throttling" (40);
      B) "forge an unsigned token" (25); C) "bribe an insider" (900). The team fixes the unsigned-token flaw.
      What is the cheapest attack now?
    options:
      - id: forty-five
        text: '45 - find the email and guess the password'
        feedback: Correct - B is impossible after the fix; A costs 5 + 40 = 45; C costs 900.
      - id: twenty-five
        text: '25 - forge the token'
        feedback: That leaf relied on the flaw the team just fixed - it is now impossible.
      - id: forty
        text: '40 - guess the password'
        feedback: Guessing alone is not enough - A is an AND node, so the email is needed too.
      - id: nine-hundred
        text: '900 - bribe an insider'
        feedback: Possible, but A is far cheaper.
    correct: [forty-five]
    hints:
      - AND sums; OR takes the cheapest possible child.
    solution: |
      With B gone, OR(min) of A (5 + 40 = 45) and C (900) is 45 - so password throttling is the next thing to fix.

recall:
  - id: recall-four-questions
    concept: sec-threat-dfd
    prompt: What are Shostack's four threat modelling questions?
    answer: What are we working on? What can go wrong? What are we going to do about it? Did we do a good (enough) job?
  - id: recall-dfd-elements
    concept: sec-threat-dfd
    prompt: Name the DFD elements and the extra one threat modelling adds.
    answer: Interactors (external entities), processes, data stores and data flows - plus trust boundaries, the borders between trusted and untrusted elements.
  - id: recall-stride-properties
    concept: sec-threat-stride
    prompt: Which property does each STRIDE category violate?
    answer: Spoofing - authentication; Tampering - integrity; Repudiation - non-repudiation; Information disclosure - confidentiality; Denial of service - availability; Elevation of privilege - authorization.
  - id: recall-per-element
    concept: sec-threat-stride
    prompt: STRIDE per element - which categories apply to flows, stores, processes and interactors?
    answer: Data flows and data stores - T, I, D. Processes - all six. Interactors - S and R.
  - id: recall-responses
    concept: sec-threat-to-tests
    prompt: What are the four responses to a threat, and what does each need recorded?
    answer: Mitigate (a requirement and a test), eliminate (remove the feature), transfer (an owner of the remaining controls), accept (a reason and an owner).
  - id: recall-good-check
    concept: sec-threat-to-tests
    prompt: What makes an executable threat check trustworthy?
    answer: It finds the threat on the vulnerable build and is quiet once the matching fix is in - it flips with the flaw. A fix that creates a new threat gets its own check.
  - id: recall-tree-rules
    concept: sec-threat-to-tests
    prompt: How do costs propagate in an attack tree?
    answer: OR nodes take the value of their cheapest child; AND nodes the sum of their children. The cheapest remaining attack shows what to fix next.

