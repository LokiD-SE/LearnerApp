id: mobile-app-security-testing
title: Mobile app security testing with OWASP MASVS
subject: security-testing
module: security-specialised
level: advanced
status: published
estimatedMinutes: 150
summary: A mobile app is a program you hand to strangers, so testing it starts from what the standard says and what the platform's own files declare. Read the OWASP MASVS control groups, the MASTG that tests them and the MASWE weakness list that connects the two; then review an Android app the way a tester can before touching a device - the manifest (debuggable, backup, cleartext, exported components) and the network security configuration (cleartext, user CAs, pinning, which rule wins) - and scan a dump of the app's files for tokens, passwords and keys in private storage, shared storage and logs, without ever repeating the secret. All on synthetic SandPay Merchant files, with the dynamic work (an intercepting proxy, Frida, MobSF, objection) described from the official guide and not run here.
tags:
  [
    mobile security,
    OWASP MASVS,
    OWASP MASTG,
    OWASP MASWE,
    Android manifest,
    network security configuration,
    cleartext traffic,
    certificate pinning,
    exported components,
    allowBackup,
    debuggable,
    insecure data storage,
    logcat,
    sensitive data in logs,
    mobile app testing,
    static analysis,
    dynamic analysis,
    resilience,
    evidence redaction,
    security testing,
  ]

environment: |
  - **Runtime:** Python 3.12.3 in `practice/security/.venv` with pytest 9.2.0, on Linux; the bundled XML parser library is Expat 2.6.1.
    Every output marked as run here was printed by `practice/security/support/mob_demo.py` (and the code it imports) on 21 November 2026.
    It reads only the synthetic files in `support/mob_fixture.py`. **No device, emulator or APK was used and nothing leaves the machine.**
    SandPay Merchant, its package name, its tokens, passwords and keys are fictional; none was ever issued.
  - **Sources (read on 21 November 2026, "as documented on" that date):**
    OWASP [MASVS](https://mas.owasp.org/MASVS/) and its group pages for
    [STORAGE](https://mas.owasp.org/MASVS/05-MASVS-STORAGE/), [CRYPTO](https://mas.owasp.org/MASVS/06-MASVS-CRYPTO/),
    [AUTH](https://mas.owasp.org/MASVS/07-MASVS-AUTH/), [NETWORK](https://mas.owasp.org/MASVS/08-MASVS-NETWORK/),
    [PLATFORM](https://mas.owasp.org/MASVS/09-MASVS-PLATFORM/), [CODE](https://mas.owasp.org/MASVS/10-MASVS-CODE/) and
    [RESILIENCE](https://mas.owasp.org/MASVS/11-MASVS-RESILIENCE/); the [MASTG](https://mas.owasp.org/MASTG/) home page and its
    [tools list](https://mas.owasp.org/MASTG/tools/); the [MASWE](https://mas.owasp.org/MASWE/) index and the weakness pages
    [MASWE-0001](https://mas.owasp.org/MASWE/MASVS-STORAGE/MASWE-0001/), [0002](https://mas.owasp.org/MASWE/MASVS-STORAGE/MASWE-0002/),
    [0005](https://mas.owasp.org/MASWE/MASVS-STORAGE/MASWE-0005/), [0006](https://mas.owasp.org/MASWE/MASVS-STORAGE/MASWE-0006/),
    [0018](https://mas.owasp.org/MASWE/MASVS-AUTH/MASWE-0018/), [0026](https://mas.owasp.org/MASWE/MASVS-NETWORK/MASWE-0026/),
    [0027](https://mas.owasp.org/MASWE/MASVS-NETWORK/MASWE-0027/), [0028](https://mas.owasp.org/MASWE/MASVS-NETWORK/MASWE-0028/) and
    [0063](https://mas.owasp.org/MASWE/MASVS-RESILIENCE/MASWE-0063/); the Android developer documentation for the
    [network security configuration](https://developer.android.com/privacy-and-security/security-config), the
    [`<application>` element](https://developer.android.com/guide/topics/manifest/application-element) and the
    [`<activity>` element](https://developer.android.com/guide/topics/manifest/activity-element); and the Python documentation's
    [XML vulnerabilities](https://docs.python.org/3/library/xml.html#xml-vulnerabilities) section. Their wording is quoted where it is quoted.
  - **What the code is, and is not:** three small reviewers - `solutions/specialised/mob_manifest.py`, `mob_netconfig.py` and
    `mob_storage.py` - that read text. They apply **house rules written from the documents above**, not the MASTG's tests, and they
    are a first pass for a human reviewer, not a scanner. Two limits matter. The manifest audit does not read the `exported` default of
    a service, receiver or provider from the documentation (I read the wording for activities), so it reports a provider or a component with an
    intent filter that does not *declare* `android:exported` and leaves the reader to decide; it also does not read `fullBackupContent`, only
    `dataExtractionRules`. The mapping from each finding code to a MASWE weakness and MASVS control (`WEAKNESS_OF` in the fixture) is
    **my reading of the weakness titles and overviews**, not an official table.
  - **Not read or not run:** the MASTG's individual test pages (the lesson names no MASTG test id); every MASWE page other than the nine
    listed; iOS configuration (App Transport Security, `Info.plist`) - the only iOS facts used are the ones MASWE-0063 and MASWE-0002 print;
    the Android `<service>`, `<receiver>` and `<provider>` pages; certificate transparency; Android Keystore and biometric APIs. **MobSF,
    Frida and objection** appear only as names in the MASTG tools list - I did not read their documentation and did not run them. An
    intercepting proxy, an emulator and a rooted device are described, not used. `practice/security/support/sandpay_vuln.py` (the portal) is not used here.
  - **Ethics:** test only an app and a backend you have written permission to test, on devices you own, and keep evidence minimal and masked.
    Never test a production backend through an app without scope that says so; rooting or instrumenting a device you do not own is not
    covered by anything in this lesson. The code runs only on the synthetic files.
  - **Not repeated here:** the web and API flaws behind the app -
    [Testing authentication](#/lesson/testing-authentication), [Testing access control](#/lesson/testing-access-control-idor) and the
    [OWASP API Security Top 10](#/lesson/owasp-api-security-top-10) (the MASVS itself says the remote endpoint "should also be validated using
    industry standards such as the OWASP Application Security Verification Standard"); intercepting traffic -
    [Intercepting proxies](#/lesson/intercepting-proxies); the WSTG and ASVS themselves - [OWASP WSTG and ASVS](#/lesson/owasp-wstg-and-asvs);
    the mobile functional side - [Mobile test planning](#/lesson/mobile-test-planning) and
    [adb and logcat for testers](#/lesson/adb-and-logcat-for-testers).

prerequisites:
  - security-testing-fundamentals
  - owasp-wstg-and-asvs
  - intercepting-proxies

concepts:
  - id: sec-mob-masvs
    name: The standard - MASVS controls, MASTG tests, MASWE weaknesses
    summary: The MASVS lists what a secure mobile app must do, as control statements grouped by area (STORAGE, CRYPTO, AUTH, NETWORK, PLATFORM, CODE, RESILIENCE, PRIVACY). The MASTG is the testing guide that verifies those controls "through the weaknesses defined by the OWASP MASWE", and the MASWE is the list of weaknesses, each mapped to a control. A tester works from a control to a weakness to a test, and writes the finding against the control. Resilience controls are defence in depth - "the absence of these measures does not in itself constitute a vulnerability" - and the rest of the MASVS still applies "according to their threat model".
  - id: sec-mob-config
    name: Static review - the manifest and the network security configuration
    summary: Before any device is touched, the files the platform reads tell you a lot. In an Android app, the manifest declares whether the build is debuggable, whether its data may be backed up (the documented default is yes), whether it intends cleartext traffic and which components other apps can start; the network security configuration decides which CAs are trusted, whether cleartext is permitted per domain, and which certificates are pinned - with a documented rule for which domain rule wins and how unset values are inherited. Each setting is read against the platform default for the app's target API level.
  - id: sec-mob-data
    name: Data on the device - where secrets rest and what leaks them
    summary: Sensitive data - tokens, passwords, keys, personal data - can sit in the app's private storage, in shared or external storage, in logs, and in backups. MASWE separates these weaknesses because their reach differs - other apps, anyone with the unlocked phone and a cable, anyone holding a backup. A reviewer classifies each file by location, looks for secrets in the shapes apps really use, and reports the path, the kind and the location - never the value, because a secret pasted into a report is a second leak.

objectives:
  - Name the MASVS control groups, say what the MASTG and the MASWE add, and map a finding to a control and a weakness.
  - Explain why a missing resilience measure is not by itself a vulnerability, and what that does to how you rate a finding.
  - Read an Android manifest for debuggable, backup, cleartext and exported-component settings, and apply the documented defaults.
  - Read a network security configuration - cleartext, trust anchors, pinning, debug-overrides, the longest matching domain, inheritance - and say whether cleartext is permitted to a host.
  - Classify files by storage location and find tokens, passwords and keys in a dump, reporting kind and place without the value.
  - Plan the dynamic part of an assessment - own device, intercepting proxy, runtime tools - and say what the static review cannot decide.
  - Refuse an XML document type declaration in a file you are auditing, and explain why.

sections:
  - id: intuition
    kind: intuition
    concepts: [sec-mob-masvs, sec-mob-config, sec-mob-data]
    title: The idea in plain language
    body: |
      A web application lives on a server you control. A mobile app is different: you **hand a copy to every user**, and each copy
      runs on a phone you do not control - possibly a lost one, a rooted one, one shared with a child, one with a malicious app
      installed next to it. Whatever the app writes to disk, prints to a log, or sends over a hostile coffee-shop network is out of
      your hands the moment it happens.

      So mobile security testing asks a different set of questions. *What does this app leave lying around?* (storage, logs,
      backups.) *Who can talk to it?* (the components it exposes to other apps.) *Who can listen when it talks?* (network
      configuration, pinning.) *How hard is it to take apart or change?* (resilience.) And because the answers are written down in
      files the platform itself reads - the manifest, the network configuration - a tester can answer many of them **before
      touching a device**, the way an inspector reads the building plans before walking the site.

      The OWASP Mobile Application Security project gives the questions names. The **MASVS** is the checklist of what a secure app
      does; the **MASTG** is the manual for checking each item; the **MASWE** is the catalogue of the ways each item goes wrong. A
      finding that says "*the app trusts user-installed CAs, which weakens MASVS-NETWORK-1*" is one a developer, an auditor and a
      second tester all read the same way.

      Two cautions run through the lesson. A configuration setting is not a vulnerability by itself - `allowBackup` on an app that
      stores nothing sensitive is noise - so every finding carries its context. And the **secret never goes in the report**: you
      say *where* the token was and *what kind* of thing it was, not what it said.

  - id: what
    kind: what
    concepts: [sec-mob-masvs, sec-mob-config, sec-mob-data]
    title: What the terms mean
    body: |
      The OWASP MASVS (Mobile Application Security Verification Standard) describes itself as "the industry standard for mobile
      app security", usable by "security testers to ensure completeness and consistency of test results". It is divided into groups of
      controls, "labeled MASVS-XXXXX, that represent the most critical areas of the mobile attack surface":

      | Group | Area (as the MASVS describes it) |
      | --- | --- |
      | `MASVS-STORAGE` | Secure storage of sensitive data on a device (data-at-rest). |
      | `MASVS-CRYPTO` | Cryptographic functionality used to protect sensitive data. |
      | `MASVS-AUTH` | Authentication and authorization mechanisms used by the mobile app. |
      | `MASVS-NETWORK` | Secure network communication between the mobile app and remote endpoints (data-in-transit). |
      | `MASVS-PLATFORM` | Secure interaction with the underlying mobile platform and other installed apps. |
      | `MASVS-CODE` | Security best practices for data processing and keeping the app up-to-date. |
      | `MASVS-RESILIENCE` | Resilience to reverse engineering and tampering attempts. |
      | `MASVS-PRIVACY` | Privacy controls to protect user privacy. |

      Each group has numbered **controls**, written as statements. For example `MASVS-STORAGE-1` is "The app securely stores sensitive
      data", `MASVS-STORAGE-2` is "The app prevents leakage of sensitive data", `MASVS-NETWORK-1` is "The app secures all network
      traffic according to the current best practices" and `MASVS-NETWORK-2` is "The app performs identity pinning for all remote
      endpoints under the developer's control".

      The other two pieces, in the project's words: "the OWASP Mobile Application Security Testing Guide (MASTG)" is "a comprehensive
      manual for mobile app security testing and reverse engineering. It describes technical processes for verifying the controls
      listed in the OWASP MASVS through the weaknesses defined by the OWASP MASWE." The **MASWE** (Mobile Application Security
      Weakness Enumeration) lists the weaknesses, each tied to one MASVS control - for instance MASWE-0006 "Sensitive Data Not Excluded
      From Backup" belongs to `MASVS-STORAGE-2`. The MASWE index adds a caveat worth remembering: "The MASTG does not yet provide
      dedicated tests for every MASWE." A weakness can be well defined before there is a reliable, reproducible test for it.

      Three platform terms are used throughout. The **manifest** (`AndroidManifest.xml`) is the file that declares the app's
      components, permissions and application-level flags. The **network security configuration** is an XML file, and the Android documentation says the feature "lets you
      customize your app's network security settings in a safe, declarative configuration file without modifying app code". **Private
      storage** is the app's own sandbox directory; **shared** (or external) storage is where other apps, or anyone with the phone and
      a cable, may read.

  - id: why
    kind: why
    concepts: [sec-mob-masvs, sec-mob-config, sec-mob-data]
    title: Why mobile apps need their own testing
    body: |
      - **The attacker holds the artifact.** Anyone can install the app, unpack it and read its configuration. MASVS-RESILIENCE says
        measures such as obfuscation and anti-tampering "increase an app's resilience against reverse engineering" but that "the absence of
        these measures does not in itself constitute a vulnerability" - so a tester must separate *this app can be inspected* (always
        true) from *this app gives away something it should not*.
      - **Data at rest outlives the session.** MASVS-STORAGE says sensitive data may be stored "in private locations, such as the app's
        internal storage, or in public folders that are accessible by the user or other apps", and "can also be unintentionally stored or
        exposed ... typically as a side-effect of using certain APIs or system capabilities such as backups or logs". The leak is often an
        accident, not a feature.
      - **The network is hostile by default.** MASVS-NETWORK is designed to ensure the app "sets up secure connections under any
        circumstances", and warns that "there are numerous ways in which a developer may accidentally disable the platform secure
        defaults". A single attribute in a configuration file can do that.
      - **Other apps are neighbours.** MASVS-PLATFORM covers "platform-provided inter-process communication (IPC) mechanisms and WebViews";
        a component you export is reachable by every other app on the device.
      - **The server still matters.** The MASVS AUTH group says "the enforcement of these mechanisms must be on the remote endpoint". A
        mobile finding that only exists on the client is half the picture; the other half is the API, tested in the earlier lessons.
      - **Money apps are targets.** A payments app holds tokens that move money. Section "Real output" shows how little it takes for one to
        land in a log or an export file.

  - id: masvs-internals
    kind: internals
    concepts: [sec-mob-masvs]
    title: How to work from a control to a finding
    body: |
      **1. Start from the control, not the tool.** Pick the MASVS group that matches the area you are testing, read its control
      statements, and write down what *evidence* would show the statement is true or false for this app. "Run MobSF" is not a test plan;
      "does the app stop its tokens leaking to logs (STORAGE-2)?" is.

      **2. Find the weakness.** The MASWE page for the control describes how the weakness arises ("Modes of Introduction") and names the
      mappings. MASWE-0005, "Insertion of Sensitive Data into Logs", for example, says the requirement is "The app excludes sensitive
      data from application logs" and maps to `MASVS-STORAGE-2` (and, among others, to CWE-532). A weakness page tells you what to look for;
      the MASTG, where it has a test, tells you how.

      **3. Test, and write the finding against the control.** The finding names the control (`MASVS-STORAGE-2`), the weakness (MASWE-0005),
      the file or screen where you saw it, and the *kind* of data. It does not contain the data.

      **4. Rate it with context.** A debuggable flag in a *debug* build is expected; in the build you ship it is MASWE-0063, "Debug
      Mechanisms Not Disabled", which says that "leaving them enabled in production makes the app inspectable and manipulable". Whether it
      is High or Low depends on what the app protects - [CVSS](#/lesson/vulnerability-reporting-and-cvss) and the owner's judgement decide that,
      not this lesson.

      **5. Respect the threat model.** MASVS-RESILIENCE states that "All apps must also fulfill the rest of the OWASP MASVS controls
      according to their threat model" and that "Anti-tampering or obfuscation techniques must not be used as a substitute for proper
      security architecture". Report a missing resilience measure as a gap against a stated threat (cheating, fraud, theft of a model), not
      as a defect in itself.

      | Control family | What a tester usually has to look at | Static (files) or dynamic (a running app)? |
      | --- | --- | --- |
      | STORAGE | Private and shared files, databases, logs, backups | Both - config statically, contents after use |
      | NETWORK | Network security config, TLS behaviour, pinning | Config statically; traffic through a proxy |
      | PLATFORM | Exported components, deep links, WebViews, screenshots | Manifest statically; behaviour dynamically |
      | AUTH | Local authentication, step-up, session handling | Mostly dynamic, plus the server |
      | CRYPTO | Algorithms, key storage, randomness | Code review plus dynamic observation |
      | CODE | Platform version, updates, dependencies, input handling | Static and dynamic |
      | RESILIENCE | Root detection, tamper checks, obfuscation | Dynamic, by trying to bypass them |

  - id: config-internals
    kind: internals
    concepts: [sec-mob-config]
    title: Reading the manifest and the network security configuration
    body: |
      **The manifest.** Attributes live in the namespace `http://schemas.android.com/apk/res/android`, written `android:...`. The ones this
      lesson checks, with what the Android documentation says:

      | Attribute | Documentation | Why a tester cares |
      | --- | --- | --- |
      | `android:debuggable` | "Whether the application can be debugged, even when running on a device in user mode." The default is `"false"`. | A release build with `"true"` can be attached to a debugger (MASWE-0063). |
      | `android:allowBackup` | If `"false"`, "no backup or restore of the application is ever performed". "The default value of this attribute is `"true"`." For sensitive data you can keep it `true` and configure `android:dataExtractionRules`. | A missing attribute is not "off". It is on, unless extraction rules say otherwise (MASWE-0006). |
      | `android:usesCleartextTraffic` | "The default value for apps that target API level 27 or lower is `"true"`. Apps that target API level 28 or higher default to `"false"`." "This attribute is getting deprecated and will be ignored for apps targeting API levels 38 and above." | The target API level decides the default; a network security configuration is the way to control it. |
      | `android:exported` (activity) | `"true"`: "the activity is accessible to any app, and is launchable by its exact class name". `"false"`: it "can be launched only by components of the same application, applications with the same user ID, or privileged system components. This is the default value when there are no intent filters." "If an activity in your app includes intent filters, set this element to `"true"` to let other apps start it." | Every exported component is part of the attack surface. The documentation adds that the attribute "isn't the only way to limit an activity's exposure": a `permission` attribute also limits who can call it. |

      The launcher activity must be exported (it carries the `MAIN` action and the `LAUNCHER` category), so a review excludes it. A
      browsable deep link is exported on purpose, so an exported component is a **review item** - "should this be reachable, and what does it
      do with what it receives?" - not a verdict. The weakness (MASWE-0018) is described as app components that "do not enforce proper
      authentication or authorization on their callers", covering "services, broadcast receivers, activities, and content providers".

      **The network security configuration.** The documentation: "By default, secure connections ... from all apps trust the pre-installed
      system CAs, and apps targeting Android 6.0 (API level 23) and lower also trust the user-added CA store by default." Cleartext: "Up to
      Android 8.1 (API level 27), cleartext support is enabled by default ... Starting with Android 9 (API level 28), cleartext support is
      disabled by default." The configuration can override these:

      - `base-config` is app-wide, `domain-config` applies to the destinations named by its `domain` elements. `includeSubdomains="true"`
        makes a rule match "the domain and all subdomains, including subdomains of subdomains. Otherwise, the rule only applies to exact matches."
      - "If multiple `domain-config` elements cover a destination, the configuration with the most specific (longest) matching domain
        rule is used."
      - "Values not set in a `domain-config` are taken from the parent `domain-config`, if nested, or from the `base-config`, if not.
        Values not set in the `base-config` use the platform default values."
      - `trust-anchors` with `<certificates src="user"/>` makes the app trust CAs the user installed. `debug-overrides` holds CAs "trusted only
        when `android:debuggable` is true" - safe in a release build, and "app stores do not accept apps that are marked debuggable".
      - A `pin-set` pins certificates "by hash of the public key". The documentation says to "always include a backup key" and warns that "setting an
        expiration time on pins may enable attackers to bypass your pinned certificates".

      That is everything the exercises' audits encode. They do **not** model certificate transparency (documented as available from Android 16)
      or the localhost behaviour the documentation describes for Android 17.

  - id: data-internals
    kind: internals
    concepts: [sec-mob-data]
    title: Where secrets rest, and why the location matters
    body: |
      The MASWE separates the places because the **reach** differs.

      | Place | Weakness | Who can read it, in the MASWE's words |
      | --- | --- | --- |
      | Private storage (the app sandbox) | MASWE-0001, "Sensitive Data Stored Unencrypted in Private Storage" | Data "can be exposed via incorrect file permissions, an app or device vulnerability, or data backup mechanisms." Sensitive data "may include personally identifiable information (PII), passwords, cryptographic keys, or session tokens." |
      | Shared or external storage | MASWE-0002, "... Outside of Private Storage" | "where other apps can access it without any user interaction". If the external storage "is emulated by the system, actors with access to an unlocked phone can access it using Android Debug Bridge (ADB)", and a physical SD card "can be removed and read". |
      | Logs | MASWE-0005, "Insertion of Sensitive Data into Logs" | The requirement: "The app excludes sensitive data from application logs." The data it lists includes "passwords, credit card numbers, or other personally identifiable information", and "cryptographic keys or session tokens". |
      | Backups | MASWE-0006, "Sensitive Data Not Excluded From Backup" | "user and app secrets end up in cloud or local backup archives"; the page lists automatic system backups, local backups and device-to-device transfer as ways in. |

      Notice what that table does **not** say: that plaintext in private storage is always a vulnerability. The MASWE-0001 page itself ties
      the exposure to *conditions* - permissions, a vulnerability, a backup - and the finding should say which condition applies and what the
      secret unlocks. A short-lived, scoped token in private storage is a different finding from a long-lived password.

      **What a dump scan looks for.** Apps write secrets in a few recurring shapes: an XML preference
      `<string name="access_token">...</string>`, a JSON key `"password": "..."`, a `key=value` line, an HTTP header `Authorization: Bearer ...`
      in a log, a JWT-shaped string (three dot-separated parts), and a PEM private key header. The exercise scans for those and skips values
      that are already masked (`[REDACTED]`), empty (`null`) or too short to be a secret. It is a **first pass** - it will miss secrets in
      binary formats and flag a harmless `tokenizer=basic` - which is why every hit is reviewed by a person.

      **Evidence hygiene.** The report says `session.xml - token - private storage`, and, if a value must be shown, a masked form such as
      `[REDACTED:27 chars]`. A report that pastes the token is itself a leak, and a screenshot of a log line with a bearer token is the same
      mistake in a different file format.

  - id: dynamic-internals
    kind: internals
    concepts: [sec-mob-masvs, sec-mob-config, sec-mob-data]
    title: What needs a running app - and what this lesson does not run
    body: |
      Static review answers *what the app declares*. It cannot answer *what the app does*. The dynamic half of an assessment - **described
      here, not run here** - looks like this:

      1. **A test device or emulator you own**, with a build you are allowed to test. Rooting or instrumenting someone else's phone is out of scope.
      2. **Traffic through an intercepting proxy** ([Intercepting proxies](#/lesson/intercepting-proxies)). Whether the proxy's CA is trusted
         is exactly what the network security configuration decided, and an app that trusts only system CAs, or pins, will refuse it. That
         refusal is the *control working*; a tester who bypasses it should say so in the report as a step, not a discovery.
      3. **Storage after use.** Log in, make a payment, background the app, then look at the sandbox, shared storage and the log for the
         secrets the static review predicted ([adb and logcat for testers](#/lesson/adb-and-logcat-for-testers) covers the log tool).
      4. **Runtime inspection.** The MASTG's tools list names, among others, **Frida**, **MobSF** and **objection** for Android. They are
         named here only because the guide lists them; their documentation was not read for this lesson and none was run.
      5. **Resilience checks.** Try to run on a rooted device, attach a debugger, repackage the app. Report what *succeeded against a stated
         threat*, never "no obfuscation" on its own.

      The MASWE index says the MASTG "does not yet provide dedicated tests for every MASWE". When there is no MASTG test for a weakness,
      the weakness page, the platform documentation and a second tester are what you have - and the finding says how it was checked.

      **A word on iOS.** The two MASWE pages read for this lesson say only a little about iOS: debuggability "is not controlled by an
      `Info.plist` key" but "depends on the `get-task-allow` entitlement in the signed application" (MASWE-0063), and an iOS app cannot
      "directly read and write an external folder" but can use the pre-installed "Files app or the document picker" to reach a shared location (MASWE-0002).
      The iOS network configuration (App Transport Security) was not read, so the lesson says nothing about it.

  - id: when
    kind: when
    concepts: [sec-mob-masvs, sec-mob-config, sec-mob-data]
    title: When to do this - and when it is the wrong tool
    body: |
      **Use a static configuration and dump review when**
      - a new build or a new SDK version is about to ship and you want a quick, repeatable check of the manifest and the network configuration;
      - you are triaging a third-party or acquired app before deeper work;
      - you want a pipeline gate that stops a debuggable or cleartext-enabled release ([Security testing in CI/CD](#/lesson/security-testing-in-ci-cd));
      - you have a dump from a test device after a scripted session and want to know whether secrets landed on disk or in a log.

      **Add dynamic work when**
      - the question is "what does it do?" - what it sends, what it trusts, what an exported component does with a crafted intent;
      - the app uses WebViews, local authentication or custom crypto, none of which a configuration file settles;
      - a control is claimed by the developers (pinning, root detection) and you must test that it works.

      **It is the wrong tool when**
      - the real risk is on the server. A mobile app that sends an order id the backend trusts is an access control problem
        ([Testing access control](#/lesson/testing-access-control-idor)); fix and test it there.
      - the threat model says nothing about reverse engineering. Do not file "no obfuscation" against an app whose owner has chosen
        transparency; the MASVS itself describes contexts "such as government, health, or other public-interest apps" where resilience
        measures "may not be ideal".
      - you have no permission, or the device is not yours.

  - id: visual-flow
    kind: visual
    concepts: [sec-mob-masvs, sec-mob-config, sec-mob-data]
    title: From a MASVS control to a finding
    body: |
      ```mermaid
      flowchart LR
        S["scope and written permission<br/>own device, named build"] --> C["pick a MASVS control<br/>write the evidence it needs"]
        C --> W["find the MASWE weakness<br/>and the MASTG test, if there is one"]
        W --> ST["static review<br/>manifest, network config"]
        ST --> DY["dynamic check<br/>proxy, storage after use, logs"]
        DY --> F["finding against the control<br/>path, kind, location, no secret"]
        F --> R{"threat model says<br/>it matters?"}
        R -- "yes" --> RP["report with context<br/>and a retest step"]
        R -- "no" --> N["note it, do not file it<br/>as a vulnerability"]
      ```

      Notice that the control comes first and the tool last, and that the last decision is about the *threat model*: the same missing
      measure is a finding for a banking app and a note for an open-source civic app.

  - id: visual-map
    kind: visual
    concepts: [sec-mob-masvs, sec-mob-config, sec-mob-data]
    title: What the three exercises cover
    body: |
      ```mermaid
      flowchart TB
        subgraph STATIC["Read as text - the exercises"]
          M["mob_manifest<br/>debuggable, backup, cleartext, exported"]
          N["mob_netconfig<br/>cleartext, user CAs, pins, rule precedence"]
          D["mob_storage<br/>tokens, passwords, keys by location"]
        end
        subgraph NEEDS["Needs a running app - described, not run"]
          T["traffic through a proxy"]
          R["runtime inspection<br/>Frida, objection, MobSF"]
          X["root, debugger and repackaging attempts"]
        end
        M --> SG["MASVS-STORAGE-2<br/>MASVS-AUTH-1<br/>MASVS-RESILIENCE-4"]
        N --> NG["MASVS-NETWORK-1<br/>MASVS-NETWORK-2"]
        D --> SG2["MASVS-STORAGE-1<br/>MASVS-STORAGE-2"]
        T --> NG
        R --> PG["MASVS-PLATFORM, CRYPTO, AUTH"]
        X --> RG["MASVS-RESILIENCE"]
      ```

      The left side is repeatable and cheap, which is why it belongs in a pipeline. The right side is where the interesting bugs usually
      are, and where a person with a device and permission is needed.

  - id: code-python
    kind: code
    concepts: [sec-mob-masvs, sec-mob-config, sec-mob-data]
    title: The code, shortened
    collapsed: true
    body: |
      Reading a manifest without expanding entities, and the backup and exported rules (`solutions/specialised/mob_manifest.py`):

      ```python
      DTD = re.compile(r"<!\s*(DOCTYPE|ENTITY)", re.IGNORECASE)

      def parse_manifest(text):
          if DTD.search(text):
              raise ValueError("DOCTYPE and ENTITY declarations are not accepted")
          return ET.fromstring(text)

      # in audit_manifest:
      if attr(app, "allowBackup") != "false" and attr(app, "dataExtractionRules") is None:
          found.add(("backup-allowed", "application"))
      for component in app:
          exported, unprotected = attr(component, "exported"), attr(component, "permission") is None
          if exported == "true" and unprotected and not is_launcher(component):
              found.add(("exported-open", name))
          elif exported is None and unprotected and (component.find("intent-filter") is not None or component.tag == "provider"):
              found.add(("exported-undeclared", name))
      ```

      Which rule wins in a network security configuration (`mob_netconfig.py`):

      ```python
      def matches(domain, host):
          name = domain.text.strip().lower()
          return host == name or (domain.get("includeSubdomains") == "true" and host.endswith("." + name))

      # in effective_cleartext: the longest matching domain wins, then values are inherited outwards
      for config in chain:                      # the rule's own config, then its parents
          value = config.get("cleartextTrafficPermitted")
          if value is not None:
              return value == "true"
      base = root.find("base-config")           # then the app-wide config
      if base is not None and base.get("cleartextTrafficPermitted") is not None:
          return base.get("cleartextTrafficPermitted") == "true"
      return target_sdk < 28                    # then the platform default
      ```

      Finding secrets without repeating them (`mob_storage.py`):

      ```python
      KEYVAL = re.compile(r"""(?ix)
          (?P<key>[\w.-]*(?:token|secret|api[_-]?key|password|passwd|pwd)[\w.-]*)
          (?:["']?\s*[:=]\s*["']?|["']\s*>)
          (?P<val>[^\s"'<>,}&]{4,})""")

      def scan_dump(files):
          found = set()
          for path, text in files.items():
              for kind in kinds_in(text):                 # kinds only - never the matched value
                  found.add((path, kind, location(path)))
          return sorted(found)
      ```

  - id: real-runs
    kind: code
    concepts: [sec-mob-masvs, sec-mob-config, sec-mob-data]
    title: Real output - reviewing SandPay Merchant's files
    body: |
      `practice/security/support/mob_demo.py`, run on 21 November 2026 with the reference solutions. The files are synthetic; the output is
      exactly what the code printed. First the manifest of the "bad" build (target API 27), then the good one:

      ```text
      === manifest audit: BAD_MANIFEST
        backup-allowed | application
        cleartext-manifest | application
        debuggable | application
        exported-open | .PayLinkActivity
        exported-open | .ReceiptProvider
        exported-open | .SyncService
        exported-undeclared | .ReceiptActivity

      === manifest audit: GOOD_MANIFEST
        findings: []
      ```

      What is *not* in the first list matters as much: `.MainActivity` is exported but is the launcher, `.RefundReceiver` is exported but names a
      permission, `.SettingsActivity` is `exported="false"`, and `.UploadService` has no filter and no attribute. The next lines show the backup
      default - an app that says nothing about backup is reported, one that says how data is extracted is not:

      ```text
      === manifest audit: no allowBackup written / dataExtractionRules written
         [('backup-allowed', 'application')]
         []
      ```

      Each finding mapped to a weakness and control with the lesson's own table (`WEAKNESS_OF`):

      ```text
        backup-allowed       application        MASWE-0006 MASVS-STORAGE-2
        cleartext-manifest   application        MASWE-0026 MASVS-NETWORK-1
        debuggable           application        MASWE-0063 MASVS-RESILIENCE-4
        exported-open        .PayLinkActivity   MASWE-0018 MASVS-AUTH-1
        exported-open        .ReceiptProvider   MASWE-0018 MASVS-AUTH-1
        exported-open        .SyncService       MASWE-0018 MASVS-AUTH-1
        exported-undeclared  .ReceiptActivity   MASWE-0018 MASVS-AUTH-1
      ```

      The reason `parse_manifest` refuses a DOCTYPE. Python's documentation says that "By default, Expat itself does not access local files or
      create network connections" but that "Expat versions lower than 2.7.2 may be vulnerable to the 'billion laughs', 'quadratic blowup' and 'large
      tokens' vulnerabilities". This machine's Expat is 2.6.1, so it is in that range, and the standard parser does expand an internal entity:

      ```text
      === runtime
      Python 3.12.3, Expat expat_2.6.1

      === why parse_manifest refuses a DOCTYPE: the standard parser expands an internal entity
        ET.fromstring(...) package attribute length: 52
        parse_manifest: DOCTYPE and ENTITY declarations are not accepted
      ```

      The `package` attribute in that file is the five characters `&a;`; the parser handed back 52. One small entity is harmless; nested ones are
      the "billion laughs" case. A manifest never needs a DTD, so the review refuses it instead of trusting the parser to cope.

      The network security configuration of the "bad" build, then which hosts may be reached in cleartext:

      ```text
      === network security config audit: BAD_NSC
        cleartext-base | base-config
        cleartext-domain | legacy.sandpay.example
        pin-expiry | api.sandpay.example
        pin-no-backup | api.sandpay.example
        user-ca-trusted | base-config

      === network security config audit: GOOD_NSC
        findings: []

      === effective cleartext, BAD_NSC
        target 27  legacy.sandpay.example   True
        target 27  api.sandpay.example      True
        target 27  other.example            True
        target 35  legacy.sandpay.example   True
        target 35  api.sandpay.example      True
        target 35  other.example            True
      ```

      Every row is `True` for a reason that is easy to miss: `api.sandpay.example` has a `domain-config` with a `pin-set` but **no**
      `cleartextTrafficPermitted`, so it inherits the `base-config`'s `"true"` - pinning does not turn cleartext off. The `user CA` that
      `debug-overrides` lists is *not* in the findings, as intended. The documentation's nested example, adapted:

      ```text
      === effective cleartext, NESTED_NSC (target 35)
        www.sandpay.example          True
        secure.sandpay.example       False
        x.secure.sandpay.example     False
        notsandpay.example           False

      === effective cleartext, no configuration at all
        target 23  True
        target 27  True
        target 28  False
        target 35  False
      ```

      `notsandpay.example` does not match `sandpay.example` - the rule needs a dot - and with no configuration the answer follows the platform default
      the documentation gives (cleartext on up to API 27, off from 28). Finally the dump scan, then the clean dump and the masking helper:

      ```text
      === storage scan of the synthetic dump
        private  password     /data/data/example.sandpay.merchant/files/cache.json
        private  private-key  /data/data/example.sandpay.merchant/files/keystore.pem
        private  token        /data/data/example.sandpay.merchant/shared_prefs/session.xml
        log      token        /data/local/tmp/logcat.txt
        shared   token        /sdcard/Download/export.csv

      === storage scan of the clean dump, and mask()
        findings: []
        mask: [REDACTED:27 chars]
      ```

      `refresh_token` in `session.xml` was already `[REDACTED]`, so only `access_token` counts; `settings.txt` held only a language and a
      refresh interval. The result lists a path, a kind and a place - nothing that would let a reader of the report use the secret.

  - id: line-by-line
    kind: line-by-line
    concepts: [sec-mob-masvs, sec-mob-config, sec-mob-data]
    title: Why the important lines are written that way
    body: |
      | Line | Why |
      | --- | --- |
      | `if DTD.search(text): raise ValueError(...)` | A manifest or a network configuration has no DTD. Python's XML documentation lists entity expansion as a risk on older Expat, so the audit refuses the document instead of expanding it. |
      | `attr(app, "allowBackup") != "false"` | The documented default is `"true"`, so a missing attribute means backup is on. Testing `== "true"` would miss exactly the apps that never thought about it. |
      | `... and attr(app, "dataExtractionRules") is None` | The documentation says you can keep backup on and "configure" extraction rules for sensitive data; an app that does is not reported (the audit does not judge the rules themselves). |
      | `exported == "true" and unprotected and not is_launcher(...)` | The launcher must be exported and a `permission` limits callers, so both are excluded from the finding. What remains is a review item. |
      | `exported is None and ... (intent-filter or provider)` | When the attribute is not written the platform decides; the audit asks the author to say it out loud instead of guessing a default that was not read for every component type. |
      | `host == name or (includeSubdomains == "true" and host.endswith("." + name))` | The documentation: a rule matches "the domain and all subdomains" only with `includeSubdomains="true"`; the leading dot keeps `notsandpay.example` from matching `sandpay.example`. |
      | `if best is None or length > best[0]` | "The configuration with the most specific (longest) matching domain rule is used." |
      | `for config in chain: ... then base-config ... then target_sdk < 28` | The documented inheritance order: own config, parent, `base-config`, platform default. Unset is not false. |
      | `("user-ca-trusted", ...)` skipped in `debug-overrides` | Those CAs are "trusted only when `android:debuggable` is `true`"; the finding that matters is a debuggable *release* build, which the manifest audit reports. |
      | `len(pins.findall("pin")) < 2` | "You should always include a backup key", otherwise a key change forces an app update to restore connectivity. |
      | `(?i)` and `\w.-` in `KEYVAL` | Key names come in every case and style (`API_KEY`, `client-secret`, `db.passwd`). |
      | `value.upper().startswith("[REDACTED")` | A masked secret is the goal. Only an unmasked one is a finding. |
      | `kinds_in` returns kinds, `scan_dump` adds `(path, kind, location)` | The value is never stored or returned, so the report cannot leak it. A test asserts the secret text is absent from the result. |
      | `location()` checks shared, then private, then `logcat` | A path is classified once, by the first rule that matches; the order is the contract. |

  - id: steps
    kind: steps
    concepts: [sec-mob-masvs, sec-mob-config, sec-mob-data]
    title: A mobile assessment, step by step
    body: |
      1. **Get permission and scope.** Written, naming the app build, the backend it may talk to and the devices. Test only what is in scope.
      2. **Choose the controls.** Read the MASVS groups and pick the ones the app's threat model touches. A payments app: STORAGE, NETWORK,
         AUTH, PLATFORM; add RESILIENCE only if the owner states a threat it addresses.
      3. **Inventory the build.** Package name, version, target API level, permissions, exported components, the network security
         configuration. The target level decides the documented defaults.
      4. **Review the manifest and network configuration.** Run the static reviewers, then read every finding against the platform default and the
         app's purpose. Write down which findings are review items and which are defects.
      5. **Prepare a test device or emulator you own** and a way to see traffic (an intercepting proxy). Note anything you had to change to
         make the app testable - a trusted proxy CA, a debuggable build - because it changes what you can conclude.
      6. **Exercise the app** along its important journeys (sign in, pay, refund, sign out), then **dump** the sandbox, shared storage and the log.
      7. **Scan the dump** with the storage reviewer and read each hit: which file, which kind, which location, what does the secret unlock?
      8. **Trace the traffic.** Is everything TLS? Is the proxy's CA refused? If pinning exists, does it hold, and is there a backup pin?
      9. **Map each finding** to a MASVS control and a MASWE weakness, mask the evidence, and rate it with the owner's threat model.
      10. **Report and retest.** Send findings through the owner's channel ([Reporting vulnerabilities and scoring with CVSS](#/lesson/vulnerability-reporting-and-cvss));
          after the fix, repeat the same steps on the new build.

  - id: example
    kind: example
    concepts: [sec-mob-masvs, sec-mob-config, sec-mob-data]
    title: A worked review of SandPay Merchant (hypothetical)
    body: |
      *This example is made up to show the reasoning. The files are the synthetic ones above; nothing here is a measurement.*

      Mei is asked whether the next SandPay Merchant release can go out. She has the unpacked manifest and network configuration of the release
      candidate (the "bad" files above) and a dump from a test phone she owns, taken after a scripted sign-in and receipt export.

      **Manifest.** The audit reports seven items. She sorts them:
      - `debuggable` - **defect.** This is the build that ships. MASWE-0063 says debug mechanisms left on "make the app inspectable and
        manipulable". It is a one-line fix, and a CI gate can stop it ([Security testing in CI/CD](#/lesson/security-testing-in-ci-cd)).
      - `cleartext-manifest` and the network configuration's `cleartext-base` - **defect.** The app targets API 27, where the documented
        default is cleartext *on*, and both files switch it on explicitly. She also notes that `legacy.sandpay.example` is allowed cleartext by its own
        `domain-config`; she asks the team whether that host is still used.
      - `backup-allowed` - **depends.** The documented default is on. Whether it matters depends on what is stored; her dump says tokens are
        in private storage, so it matters: MASWE-0006 is about "user and app secrets" ending up "in cloud or local backup archives".
      - `exported-open` for `.PayLinkActivity` - **review, probably intended.** A `sandpay://pay` deep link has to be exported. The question for
        the dynamic phase is what the activity does with the data it receives. `.SyncService` and `.ReceiptProvider` are exported with no permission
        and no obvious reason; those are **defects until the team explains them**.
      - `exported-undeclared` for `.ReceiptActivity` - **fix the declaration.** It has an intent filter and does not say whether it is exported.

      **Network configuration.** `user-ca-trusted` in `base-config` means the app would accept a certificate from a CA the user (or malware with
      the user's consent) installed - a **defect** against `MASVS-NETWORK-1` that also explains why her proxy would have worked without any
      bypass. The pin-set for `api.sandpay.example` has an `expiration` and one pin: **two findings** against `MASVS-NETWORK-2` - the documentation's own
      warnings. The `debug-overrides` entry is fine for a debug build and she does not report it.

      **Dump.** Five hits. The log hit is the most urgent: a bearer header in `logcat` is readable by anyone with a cable and the phone unlocked. The export
      file on shared storage is next: other apps can read it without any user interaction. The two private-storage hits are real but depend on the backup
      and device conditions above. She writes each as *path - kind - location*, adds `[REDACTED:27 chars]` where she must show something, and keeps the real
      values only in her own notes on an encrypted disk.

      **What she does not say.** She does not say the app is "secure" because there is no obfuscation finding - there is no resilience finding at all because
      the owner stated no such threat. She does not claim to have tested the server. She states that pinning and the exported components still need a
      dynamic check.

  - id: tests
    kind: tests
    concepts: [sec-mob-masvs, sec-mob-config, sec-mob-data]
    title: Test cases for a mobile security review
    body: |
      | Case | Steps | Expected | Evidence |
      | --- | --- | --- | --- |
      | Release is not debuggable | Read `android:debuggable` in the release manifest | Absent or `"false"` | The attribute and the build id |
      | Backup is a decision | Read `allowBackup` and `dataExtractionRules` | Explicit `"false"`, or rules that exclude sensitive files | The two attributes |
      | No default cleartext | Target API and `usesCleartextTraffic`; network config `cleartextTrafficPermitted` | Cleartext off, or listed domains each with a reason | The effective result per host |
      | Exported by design | List every exported component | Each is the launcher, protected by a permission, or has a written reason | The list and the reasons |
      | Undeclared export | Components with an intent filter | Each declares `android:exported` explicitly | The component list |
      | User CAs | `trust-anchors` in `base-config` and `domain-config` | No `src="user"` outside `debug-overrides` | The XML |
      | Pins | `pin-set` for each backend host | At least two pins; no expiry, or an expiry with a stated reason | The XML and the host list |
      | Longest rule wins | A host covered by two `domain-config` rules | The longest matching rule decides | The result for the host |
      | No default surprises | The same configuration at two target API levels | The documented defaults apply | Both results |
      | Secrets at rest | Dump the sandbox after a scripted session; scan it | No unmasked token, password or key; or each hit explained | Path, kind, location - not the value |
      | Shared storage | Look for exports and downloads the app wrote | No sensitive data on shared storage | The file list |
      | Logs | Capture the log through sign-in and payment | No tokens, passwords, personal data | The scan result |
      | Report hygiene | Read the finding | No secret value in it | The reviewed text |
      | Negative control | Run the same checks on a build known to be fixed | No findings | The empty results |

  - id: mistakes
    kind: mistakes
    concepts: [sec-mob-masvs, sec-mob-config, sec-mob-data]
    title: Common mistakes
    body: |
      - **Filing "no obfuscation" as a vulnerability.** MASVS-RESILIENCE: "The absence of these measures does not in itself constitute a
        vulnerability." Tie resilience findings to a stated threat.
      - **Treating a missing `allowBackup` as safe.** The documented default is `"true"`.
      - **Reading the cleartext default from memory.** It depends on the target API level: on by default up to 27, off from 28. Check the target.
      - **Assuming pinning turns cleartext off.** A `domain-config` with only a `pin-set` inherits the base value. Cleartext and pins are different settings.
      - **Believing a `domain-config` for a domain covers its subdomains.** Only `includeSubdomains="true"` does, and the longest matching rule wins.
      - **Reporting `debug-overrides` as a flaw.** Its CAs are trusted only for a debuggable build. The finding is a debuggable *release*.
      - **Calling every exported component a vulnerability.** The launcher and a browsable deep link must be exported. Ask what the component does with
        what it receives.
      - **Pasting the secret into the report.** Say where it was and what kind it was. Mask the rest.
      - **Judging the app from the client alone.** MASVS-AUTH says "enforcement ... must be on the remote endpoint". Test the API too.
      - **Parsing untrusted XML with a bare parser.** Python's documentation lists entity expansion on older Expat as a risk; refuse a DOCTYPE in files that
        should not have one.
      - **Trusting a scanner's output.** A pattern scan flags `tokenizer=basic` and misses binary formats. Review each hit and say what was not covered.
      - **Testing a device or backend you may not test.** Scope first.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [sec-mob-masvs, sec-mob-config, sec-mob-data]
    title: Trade-offs
    body: |
      | Choice | Gain | Cost |
      | --- | --- | --- |
      | Static review of the manifest and network configuration | Fast, repeatable, safe, fits a pipeline | Says what the app declares, not what it does |
      | Dynamic testing on a device | Shows real behaviour: traffic, storage, components | Needs a device, permission, setup and time |
      | Mapping every finding to MASVS and MASWE | A shared language for developers, auditors and testers | The mapping is a judgement; the MASTG may have no test for the weakness |
      | Strict house rules (flag undeclared exports, expiring pins) | Catches the easy mistakes early | False positives that a human must clear |
      | Resilience controls | Raise the effort for reverse engineering and tampering | They reduce transparency, can exclude legitimate users, and are not a substitute for server-side checks |
      | Certificate pinning | Narrows trust to identities the operator controls | Operational risk: a lost or rotated key without a backup pin breaks connectivity; it can be bypassed on a device the attacker controls (MASWE-0028) |
      | Backup allowed | Users keep their data when they change phone | Secrets travel to backups unless the extraction rules exclude them |
      | Masked evidence | The report cannot leak | A sceptical reader has less to inspect; keep the full capture somewhere safe |

  - id: summary
    kind: summary
    concepts: [sec-mob-masvs, sec-mob-config, sec-mob-data]
    title: Quick reference
    body: |
      - MASVS = what a secure app does (groups STORAGE, CRYPTO, AUTH, NETWORK, PLATFORM, CODE, RESILIENCE, PRIVACY). MASTG = how to verify it, "through the
        weaknesses defined by the OWASP MASWE". MASWE = the weaknesses, each mapped to a control. The MASTG has no test for every MASWE yet.
      - Write findings against a control and a weakness, name the file and the kind of data, and never include the secret.
      - Resilience: "the absence of these measures does not in itself constitute a vulnerability"; report gaps against a stated threat.
      - Manifest: `debuggable` default false; `allowBackup` default **true**; `usesCleartextTraffic` default true up to API 27, false from 28; an exported
        component needs a reason; a `permission` limits callers.
      - Network security configuration: system CAs by default (user CAs also for target API 23 and lower); cleartext default on up to API 27, off from 28; the
        longest matching domain rule wins; unset values come from the parent `domain-config`, then `base-config`, then the platform default.
      - `debug-overrides` CAs apply only when debuggable. Pins need a backup pin, and an expiry "may enable attackers to bypass your pinned certificates".
      - Locations differ in reach: private storage (backups, rooted devices, app bugs), shared storage (other apps, ADB), logs, backups.
      - Refuse a DOCTYPE in a manifest: Python's parser expands internal entities, and Expat below 2.7.2 may be vulnerable to billion laughs.
      - Static review is cheap and repeatable; the proxy, runtime and resilience checks need a device you own and permission - described here, not run.

exercises:
  - id: mob-groups
    type: mcq
    concept: sec-mob-masvs
    skill: recognition
    title: Which control group covers logs and backups?
    prompt: |
      A review finds that the app writes session tokens to the system log, and that its backup settings let secrets travel to cloud backups.
      Which MASVS control group do both findings belong to?
    options:
      - id: storage
        text: "MASVS-STORAGE - the group page says sensitive data can be exposed 'as a side-effect of using certain APIs or system capabilities such as backups or logs'."
        feedback: "Correct. MASVS-STORAGE-2 is 'The app prevents leakage of sensitive data', and MASWE-0005 (logs) and MASWE-0006 (backup) both map to it."
      - id: network
        text: "MASVS-NETWORK, because tokens are also sent over the network."
        feedback: "NETWORK is about data in transit. A token written to a log or a backup is data at rest."
      - id: platform
        text: "MASVS-PLATFORM, because the log is a platform feature."
        feedback: "PLATFORM covers IPC, WebViews and the user interface. The weakness here is the app leaking its own data."
      - id: resilience
        text: "MASVS-RESILIENCE, because an attacker can read the log."
        feedback: "RESILIENCE is about reverse engineering and tampering, and the MASVS says its absence is not by itself a vulnerability."
    correct: [storage]
    hints:
      - Where does the STORAGE group page mention backups and logs?
      - Which weakness numbers did the lesson map to these two findings?
    solution: |
      MASVS-STORAGE. The group page names backups and logs explicitly, and MASWE-0005 and MASWE-0006 both map to MASVS-STORAGE-2.

  - id: mob-resilience
    type: mcq
    concept: sec-mob-masvs
    skill: analysis
    title: '"No obfuscation" as a High finding?'
    prompt: |
      A report from another tester says "The app has no code obfuscation - High". The owner's written threat model lists fraud through stolen
      tokens and data leaks, and says nothing about reverse engineering or tampering. What is the best response?
    options:
      - id: note
        text: "Do not file it as a vulnerability. The MASVS says the absence of resilience measures 'does not in itself constitute a vulnerability'; record it as a note tied to the threat model, and test the controls that apply."
        feedback: "Correct. Resilience is defence in depth against a stated threat; the rest of the MASVS applies 'according to their threat model'."
      - id: critical
        text: "Raise it to Critical, because the code can be read by anyone."
        feedback: "That the code can be read is true of every app. It is not a finding without a threat it enables."
      - id: remove
        text: "Remove the RESILIENCE group from the standard for this app."
        feedback: "The group remains; you decide whether it applies from the threat model."
      - id: substitute
        text: "Accept it, and skip the storage and network checks because obfuscation will protect the app."
        feedback: "The MASVS says obfuscation 'must not be used as a substitute for proper security architecture'."
    correct: [note]
    hints:
      - What does the RESILIENCE group page say about the absence of these measures?
      - What does the threat model actually list?
    solution: |
      Record it as a note, not a vulnerability. The MASVS states that the absence of resilience measures is not in itself a vulnerability and that
      the other controls apply according to the threat model.

  - id: mob-backup-default
    type: mcq
    concept: sec-mob-config
    skill: application
    title: allowBackup is not written
    prompt: |
      An `<application>` element has no `android:allowBackup` and no `android:dataExtractionRules`. What does the audit conclude, and why?
    options:
      - id: on
        text: "Backup is allowed - the documented default of android:allowBackup is 'true' - so it is reported as backup-allowed."
        feedback: "Correct. A missing attribute is the default, which is on."
      - id: off
        text: "Backup is off, because nothing enables it."
        feedback: "The documentation says the default value is true."
      - id: unknown
        text: "Nothing can be concluded without running the app."
        feedback: "The manifest plus the documented default answers this one statically."
      - id: rules
        text: "Backup is excluded for sensitive files by default."
        feedback: "Only data extraction rules can say what is included or excluded; none are present."
    correct: [on]
    hints:
      - What is the documented default value of android:allowBackup?
    solution: |
      The documented default is "true", so backup is allowed and the audit reports backup-allowed unless data extraction rules say otherwise.

  - id: mob-cleartext
    type: mcq
    concept: sec-mob-config
    skill: application
    title: Plain HTTP from an app that targets API 35
    prompt: |
      An app targets API level 35. Its manifest does not mention `usesCleartextTraffic` and it has no network security configuration. It calls
      `http://status.sandpay.example/`. According to the Android network security configuration page, what happens?
    options:
      - id: blocked
        text: "Cleartext is not permitted - from Android 9 (API level 28) cleartext support is disabled by default - so the request is refused unless the app opts in."
        feedback: "Correct. The platform default depends on the target API level."
      - id: allowed
        text: "It works, because cleartext is enabled by default."
        feedback: "That default applies up to API level 27, not to an app that targets 35."
      - id: warn
        text: "It works but Android shows a warning to the user."
        feedback: "The documentation describes a default that disables cleartext, not a warning."
      - id: anything
        text: "It depends on the device, not the app's target level."
        feedback: "The documented default depends on the API level the app targets."
    correct: [blocked]
    hints:
      - Which API level is the boundary in the documentation?
    solution: |
      Cleartext support is disabled by default from API level 28, so the request is refused unless the configuration opts in for that host.

  - id: mob-usercert
    type: mcq
    concept: sec-mob-config
    skill: recognition
    title: Which apps trust user-installed CAs by default?
    prompt: |
      A tester installs the proxy's CA as a user certificate and expects to see an app's HTTPS traffic. Which statement matches the documentation?
    options:
      - id: old
        text: "By default every app trusts the system CAs, and only apps targeting Android 6.0 (API level 23) and lower also trust the user-added CA store."
        feedback: "Correct. A newer target needs a configuration that adds src=user, which is itself a finding in a release build."
      - id: all
        text: "All apps trust user-added CAs by default."
        feedback: "Only the older targets do."
      - id: none
        text: "No app ever trusts a user-added CA."
        feedback: "An app can opt in with a trust-anchors entry, and older targets trust them by default."
      - id: debug
        text: "Only debuggable apps trust the system CAs."
        feedback: "debug-overrides adds CAs for debuggable builds; the system CAs are trusted by default."
    correct: [old]
    hints:
      - Which target API level does the documentation name?
    solution: |
      System CAs by default for every app, user-added CAs also for target API 23 and lower; anything else needs the configuration to say so.

  - id: mob-exported
    type: mcq
    concept: sec-mob-config
    skill: analysis
    title: An exported component with no permission
    prompt: |
      The audit reports `exported-open` for `.PayLinkActivity`, which has `android:exported="true"`, an intent filter for the `sandpay://pay`
      scheme and no `android:permission`. What is the right next step?
    options:
      - id: review
        text: "Treat it as a review item - a deep link must be exported - and ask in the dynamic phase what the activity does with the data it receives, and whether it checks the caller or the user."
        feedback: "Correct. The exported flag is attack surface, not a verdict; MASWE-0018 is about components that do not enforce authentication or authorization on callers."
      - id: critical
        text: "File it as Critical - every exported component is a vulnerability."
        feedback: "The launcher and deep links must be exported. Context decides."
      - id: ignore
        text: "Ignore it, because the intent filter proves it is meant to be public."
        feedback: "Meant to be public does not mean safe; what it does with the input is the question."
      - id: store
        text: "Ignore it, because app stores check exported components."
        feedback: "The documentation lists permissions and the exported attribute as the developer's controls."
    correct: [review]
    hints:
      - Can a browsable deep link be anything but exported?
    solution: |
      A review item. Exported is expected for a deep link; the finding depends on what the component does with untrusted input and callers.

  - id: mob-pin
    type: mcq
    concept: sec-mob-config
    skill: application
    title: A pin-set with an expiry and one pin
    prompt: |
      A `pin-set` has an `expiration` date and one `pin`. Which concerns does the Android documentation raise about this?
    options:
      - id: both
        text: "A backup key should always be included, or a key change forces an app update to restore connectivity; and an expiry may enable attackers to bypass the pinned certificates."
        feedback: "Correct - both are in the documentation, and the audit reports them as pin-no-backup and pin-expiry."
      - id: none
        text: "None - one pin with an expiry is the recommended minimum."
        feedback: "The documentation recommends a backup key."
      - id: expiry
        text: "Only that expiry dates are in the wrong format."
        feedback: "The concern is behavioural: after the date, pinning is not performed."
      - id: hash
        text: "That pins must be certificates, not public key hashes."
        feedback: "The documentation says pinning is done by hash of the public key."
    correct: [both]
    hints:
      - What happens to pinning after the expiration date?
    solution: |
      No backup pin (an update is needed if keys change) and the expiry itself (after it pinning is not performed, which an attacker may use).

  - id: mob-longest
    type: mcq
    concept: sec-mob-config
    skill: application
    title: Which domain rule applies?
    prompt: |
      The configuration below is the documentation's nested example with SandPay names. Target API is 35. Is cleartext permitted to
      `x.secure.sandpay.example`?

      ```xml
      <network-security-config>
        <domain-config cleartextTrafficPermitted="true">
          <domain includeSubdomains="true">sandpay.example</domain>
          <domain-config cleartextTrafficPermitted="false">
            <domain includeSubdomains="true">secure.sandpay.example</domain>
          </domain-config>
        </domain-config>
      </network-security-config>
      ```
    options:
      - id: no
        text: "No - both rules match the host, and the one with the most specific (longest) matching domain, secure.sandpay.example, decides: false."
        feedback: "Correct. This is the documented precedence."
      - id: yes
        text: "Yes - the outer rule says true and the outer rule applies to all subdomains."
        feedback: "More than one rule covers the host; the longest matching domain rule is used."
      - id: base
        text: "It falls back to the platform default."
        feedback: "A domain rule matched, so its value (or its parent's) is used before any default."
      - id: error
        text: "The configuration is invalid because rules are nested."
        feedback: "The documentation shows nesting as a way to avoid duplicating settings."
    correct: [no]
    hints:
      - Which domain name is longer, and does includeSubdomains cover x.secure?
    solution: |
      No. Both rules match; the longest matching domain, secure.sandpay.example, decides, and it sets cleartextTrafficPermitted to false.

  - id: mob-private
    type: mcq
    concept: sec-mob-data
    skill: analysis
    title: A token in private storage
    prompt: |
      The dump scan finds a plaintext `access_token` in `shared_prefs/session.xml` inside the app's private directory. Backup is allowed and the
      test device is rooted. How do you report it?
    options:
      - id: context
        text: "As MASWE-0001 against MASVS-STORAGE-1 with context - backup is on, the device is rooted, and what the token unlocks - giving the path, kind and location and no token value."
        feedback: "Correct. The MASWE page ties the exposure to conditions such as permissions, a vulnerability or backup, so the finding states which apply."
      - id: nothing
        text: "Not at all - private storage is always safe."
        feedback: "The MASWE-0001 page says data in private storage can be exposed through file permissions, a vulnerability or backups."
      - id: paste
        text: "Paste the token into the report as proof."
        feedback: "A secret in a report is a second leak. Mask it."
      - id: critical
        text: "As Critical without further analysis."
        feedback: "The rating depends on what the token unlocks, how long it lives and who can reach the file."
    correct: [context]
    hints:
      - Which conditions does the weakness page name?
    solution: |
      Report it with its conditions and impact, as path, kind and location, and with no token value.

  - id: mob-xml
    type: mcq
    concept: sec-mob-data
    skill: application
    title: Why refuse a DOCTYPE in a manifest?
    prompt: |
      `parse_manifest` raises `ValueError` for any text with a `<!DOCTYPE` or `<!ENTITY` declaration. Why is that the right behaviour for this reviewer?
    options:
      - id: entities
        text: "A manifest never needs a document type declaration, and the standard parser expands internal entities (shown here: 5 characters became 52), which on an older Expat can be abused for 'billion laughs' attacks."
        feedback: "Correct. Refusing is simpler and safer than trusting the parser to cope."
      - id: invalid
        text: "Because the Android build tools reject every XML file with a DOCTYPE."
        feedback: "The lesson makes no such claim; the reason is the reviewer's own safety."
      - id: slow
        text: "Because DOCTYPE declarations make parsing slower."
        feedback: "Speed is not the point; entity expansion is."
      - id: network
        text: "Because Expat always downloads external entities from the network."
        feedback: "Python's documentation says that by default Expat does not access local files or create network connections."
    correct: [entities]
    hints:
      - What did the demo print for the package attribute length?
    solution: |
      The file has no legitimate use for a DTD and the parser expands internal entities, so the reviewer refuses it rather than expanding it.

  - id: mob-order-steps
    type: order
    concept: sec-mob-masvs
    skill: application
    title: Put a mobile assessment in order
    prompt: Put these steps of a mobile security assessment in a sensible order.
    items:
      - id: scope
        text: Get written permission and scope for the build, backend and devices
      - id: controls
        text: Choose the MASVS controls the threat model touches
      - id: static
        text: Inventory the build and review the manifest and network configuration
      - id: dynamic
        text: On a device you own, exercise the app, route traffic through a proxy and dump storage and logs
      - id: map
        text: Map each finding to a control and weakness, mask the evidence and rate it with context
      - id: retest
        text: Report through the owner's channel and retest the fixed build
    hints:
      - Permission comes before any tool.
      - Static review is cheap and tells you what to look for on the device.
    solution: |
      Scope and permission, choose controls, static review, dynamic work, map and mask, then report and retest.

  - id: mob-debug
    type: debug
    concept: sec-mob-config
    skill: analysis
    title: Which line misses the apps that never decided about backup?
    prompt: |
      This function should say whether an app allows backup. It reports False for a manifest that never mentions `android:allowBackup`,
      although the documented default is "true". Pick the wrong line.
    language: python
    code: |
      def backup_allowed(application):
          value = application.get(ANDROID + "allowBackup")
          return value == "true"
    correctLines: [3]
    hints:
      - What is value when the attribute is not written?
      - What does the documentation say the default is?
    lineNotes:
      - line: 1
        note: The signature is fine; the question is what the body does with a missing attribute.
      - line: 2
        note: The lookup returns None when the attribute is absent - that is correct. The decision is made on the next line.
    solution: |
      Line 3 treats only an explicit "true" as backup being on. The documented default is "true", so the test should be `value != "false"` (and a reviewer
      should then check whether data extraction rules say what is backed up).

  - id: mob-short
    type: short
    concept: sec-mob-masvs
    skill: analysis
    title: Why a clean static review is not enough
    prompt: |
      In two or three sentences, explain why a clean result from the manifest, network configuration and dump reviewers does not mean the
      app is secure.
    modelAnswer: |
      The reviewers read what the app declares and what a test run left on disk; they do not show what the app does with traffic, with crafted intents, in its
      WebViews, or when someone tries to bypass pinning or attach a debugger. Whole control areas - local authentication, crypto, runtime behaviour, resilience -
      need a running app, and the server behind the app needs its own testing. A clean static result is the start of the assessment, not the verdict.
    rubric:
      - Says the static review shows what is declared, not runtime behaviour.
      - Names at least one area that needs a running app (traffic, components, WebViews, authentication, resilience).
      - Says the backend is tested separately.
    hints:
      - Which MASVS groups did the three reviewers not touch?
    solution: Static review shows declarations and leftovers; behaviour, other control areas and the server need dynamic testing.

  - id: mob-testdesign
    type: testdesign
    concept: sec-mob-data
    skill: application
    title: Checks for secrets leaking from SandPay Merchant
    prompt: |
      Design the checks that show whether SandPay Merchant leaves tokens, passwords or keys on the device or in logs. Give preconditions, steps,
      expected result and evidence for each check.
    modelAnswer: |
      Preconditions: written scope; a test device you own (rooted or an emulator) with the release candidate installed; a test merchant account; the storage
      reviewer; a place to keep real values off the report.

      1. **Private storage** - sign in, pay, background the app, then copy the sandbox and scan it. Expected: no unmasked token, password or key, or each hit explained
         with what it unlocks. Evidence: path, kind and location for every hit - not the value.
      2. **Shared storage** - export a receipt and list what the app wrote under shared storage. Expected: no sensitive data on shared storage. Evidence: the file list and scan result.
      3. **Logs** - capture the log through sign-in and payment and scan it. Expected: no tokens, passwords or personal data. Evidence: the scan result with line numbers.
      4. **Backup** - read `allowBackup` and `dataExtractionRules`. Expected: backup off, or rules that exclude the files holding secrets. Evidence: the attributes and the rules file.
      5. **Sign-out** - sign out and scan again. Expected: session secrets removed or invalid. Evidence: the second scan.
      6. **Negative control** - repeat on a fixed build. Expected: no findings. Evidence: empty results.
      7. **Report hygiene** - read the draft. Expected: no secret value in it. Evidence: the reviewed text.
    rubric:
      - Covers private storage, shared storage, logs and backup.
      - Includes a negative control on a fixed build.
      - Each check has preconditions, steps, an expected result and evidence.
      - Evidence is path, kind and location, never the secret value.
    hints:
      - Which four places does the lesson separate?
    solution: Scan private storage, shared storage and logs after a scripted session, check backup settings, sign out and rescan, run a negative control, and keep secrets out of the report.

  - id: mob-interview
    type: interview
    concept: sec-mob-masvs
    skill: analysis
    title: 'Interview: "your scanner says no certificate pinning - critical"'
    prompt: '"An automated scan flags the app for having no certificate pinning and rates it Critical. How do you respond?"'
    modelAnswer: |
      I first separate the two controls involved. MASVS-NETWORK-1 is that the app "secures all network traffic according to the current best practices" - TLS everywhere,
      cleartext off, certificate validation intact, no trust in user-installed CAs. MASVS-NETWORK-2 is identity pinning "for all remote endpoints under the developer's
      control". If the basics in NETWORK-1 are broken, that is the urgent finding, and pinning would not fix it.

      Then I treat pinning as a decision, not a checkbox. Pinning narrows trust to identities the operator controls and so helps if a CA is compromised, but MASWE-0028 itself says
      pinning is "not foolproof": someone who controls the device can hook or remove it, and a pin without a backup key or with an expiry has its own failure modes - the Android
      documentation warns that a key change forces an app update, and that an expiry may let attackers bypass it. So I ask what the threat model says, what the app protects and who the
      attacker is.

      Finally I verify rather than assert: read the network configuration, route the app through a proxy on a device I own and see whether it refuses, and report the result against
      the control with context and a rating the owner can defend - not a scanner's default "Critical".
    rubric:
      - Separates NETWORK-1 (secure channel basics) from NETWORK-2 (pinning).
      - Says pinning is a decision with trade-offs and can be bypassed on a device the attacker controls.
      - Mentions backup pins and expiry, or the threat model, as inputs to the rating.
      - Verifies dynamically and reports with context instead of accepting the scanner's rating.
    followUps:
      - What would you check first if the app trusts user-installed CAs?
      - How does a backup pin change the operational risk?
      - When would you recommend against pinning?
    hints:
      - Which MASVS control is about pinning, and which is about the channel itself?
    solution: Check NETWORK-1 basics first, treat pinning (NETWORK-2) as a trade-off tied to the threat model, verify with a proxy on your own device, and rate it with context.

  - id: mob-manifest-code
    type: coding
    concept: sec-mob-config
    skill: application
    title: Audit an Android manifest
    prompt: |
      In `practice/security/exercises/specialised/mob_manifest.py`, implement `parse_manifest`, `target_sdk` and `audit_manifest`. The tests refuse a document
      type declaration, read the target API level, apply the documented backup default, and report debuggable, cleartext and exported-component findings
      while leaving the launcher and permission-protected components alone.
    project: security
    files: [exercises/specialised/mob_manifest.py]
    test: tests/specialised/test_mob_manifest.py
    command: .venv/bin/python -m pytest tests/specialised/test_mob_manifest.py
    modelAnswer: |
      ```python
      def parse_manifest(text):
          if DTD.search(text):
              raise ValueError("DOCTYPE and ENTITY declarations are not accepted")
          try:
              return ET.fromstring(text)
          except ET.ParseError as error:
              raise ValueError(f"not well-formed XML: {error}") from None

      # audit_manifest
      if attr(app, "allowBackup") != "false" and attr(app, "dataExtractionRules") is None:
          found.add(("backup-allowed", "application"))
      ...
      if exported == "true":
          if unprotected and not is_launcher(component):
              found.add(("exported-open", name))
      elif exported is None and unprotected and (component.find("intent-filter") is not None or component.tag == "provider"):
          found.add(("exported-undeclared", name))
      return sorted(found)
      ```

      Read each attribute with its namespace (`ANDROID + name`). The launcher is the component with an intent filter that has the `MAIN` action and the `LAUNCHER` category.
    rubric:
      - Every test in tests/specialised/test_mob_manifest.py passes.
      - A DOCTYPE or ENTITY declaration and text that is not well-formed raise ValueError, and no entity is expanded.
      - A missing allowBackup counts as on unless data extraction rules are present.
      - The launcher and permission-protected components are not reported, and the result is sorted without repeats.
    hints:
      - Android attributes need the namespace in front of the name.
      - A missing allowBackup is the default, not false.
      - The launcher has both MAIN and LAUNCHER.
    solution: Refuse DTDs, parse, then collect application flags and per-component export findings in a set and return it sorted.

  - id: mob-netconfig-code
    type: coding
    concept: sec-mob-config
    skill: application
    title: Audit a network security configuration
    prompt: |
      In `practice/security/exercises/specialised/mob_netconfig.py`, implement `parse_config`, `audit_config` and `effective_cleartext`. The tests check the findings
      for the bad and good configurations, the debug-overrides exception, and the documented rules: the longest matching domain wins, nested configurations inherit,
      then `base-config`, then the platform default for the target API level.
    project: security
    files: [exercises/specialised/mob_netconfig.py]
    test: tests/specialised/test_mob_netconfig.py
    command: .venv/bin/python -m pytest tests/specialised/test_mob_netconfig.py
    modelAnswer: |
      ```python
      def matches(domain, host):
          name = (domain.text or "").strip().lower()
          return host == name or (domain.get("includeSubdomains") == "true" and host.endswith("." + name))

      # effective_cleartext: collect (domain length, [config, *parents]) for each matching rule, keep the longest
      for config in chain:
          value = config.get("cleartextTrafficPermitted")
          if value is not None:
              return value == "true"
      base = root.find("base-config")
      if base is not None and base.get("cleartextTrafficPermitted") is not None:
          return base.get("cleartextTrafficPermitted") == "true"
      return target_sdk < 28
      ```

      `audit_config` walks `base-config` and every `domain-config` (including nested ones), and does not look inside `debug-overrides`.
    rubric:
      - Every test in tests/specialised/test_mob_netconfig.py passes.
      - Findings use the documented codes and are sorted without repeats; debug-overrides is not reported.
      - The longest matching domain rule wins, and subdomains match only with includeSubdomains true.
      - Unset values are inherited from the parent domain-config, then base-config, then the platform default (cleartext on below API 28).
    hints:
      - Keep the chain of parent configs with each match.
      - A look-alike host such as notsandpay.example must not match sandpay.example.
      - Nested domain-config elements need a recursive walk.
    solution: Walk base-config and all domain-configs for the audit; for effective_cleartext pick the longest matching rule, then inherit outwards, then default by target level.

  - id: mob-storage-code
    type: coding
    concept: sec-mob-data
    skill: application
    title: Scan a dump for secrets without repeating them
    prompt: |
      In `practice/security/exercises/specialised/mob_storage.py`, implement `location`, `mask` and `scan_dump`. The tests classify paths, recognise tokens, passwords and
      keys in the shapes apps use, skip masked and empty values, and check that the result never contains a secret value.
    project: security
    files: [exercises/specialised/mob_storage.py]
    test: tests/specialised/test_mob_storage.py
    command: .venv/bin/python -m pytest tests/specialised/test_mob_storage.py
    modelAnswer: |
      ```python
      def location(path):
          if path.startswith(SHARED_PREFIXES):
              return "shared"
          if path.startswith(PRIVATE_PREFIXES):
              return "private"
          if path.rsplit("/", 1)[-1].lower().startswith("logcat"):
              return "log"
          return "unknown"

      def mask(value):
          return f"[REDACTED:{len(value)} chars]"

      def scan_dump(files):
          found = set()
          for path, text in files.items():
              for kind in kinds_in(text):
                  found.add((path, kind, location(path)))
          return sorted(found)
      ```

      `kinds_in` runs the key/value, Bearer, JWT and private-key patterns, skips values that start with `[REDACTED` or are `null`, `none`, `true`, `false` or `undefined`, and returns only the kinds.
    rubric:
      - Every test in tests/specialised/test_mob_storage.py passes.
      - Paths are classified in the order shared, private, log, unknown.
      - Tokens, passwords and private keys are found in XML, JSON and key=value shapes; masked, empty, short and unrelated values are not findings.
      - The result holds only path, kind and location - never a secret value - and the input is not modified.
    hints:
      - Return the kind, not the match.
      - Check for [REDACTED before you decide a value is a secret.
      - A set removes repeated findings; sort at the end.
    solution: Classify the path, find kinds with patterns that skip masked or empty values, and return a sorted set of (path, kind, location) with no values.

placement:
  - id: place-masvs
    type: mcq
    concept: sec-mob-masvs
    skill: analysis
    title: How do MASVS, MASTG and MASWE fit together?
    prompt: |
      A colleague asks which of the three OWASP documents to cite in a finding about tokens in logs. Which answer is the most accurate?
    options:
      - id: chain
        text: "Cite the control (MASVS-STORAGE-2), the weakness (MASWE-0005) and, where the MASTG has a test for it, that test; the MASVS says what is required, the MASWE names the weakness, and the MASTG describes how to verify it."
        feedback: "Correct. The MASTG verifies the MASVS controls through the weaknesses the MASWE defines - and it has no test for every weakness yet."
      - id: one
        text: "Only the MASTG - it is the only one with test steps."
        feedback: "The control and the weakness are what make the finding readable to others."
      - id: masvs
        text: "Only the MASVS, because weaknesses are optional."
        feedback: "A finding is stronger with the weakness and its mappings, such as the CWE."
      - id: none
        text: "None - cite the tool that found it."
        feedback: "A tool name says nothing about the requirement that was not met."
    correct: [chain]
    solution: Control, weakness and, where one exists, the MASTG test; the MASVS requires, the MASWE names the weakness, the MASTG verifies.

  - id: place-config
    type: mcq
    concept: sec-mob-config
    skill: application
    title: What does this configuration allow?
    prompt: |
      An app targets API 35. Its `base-config` sets `cleartextTrafficPermitted="false"`. A `domain-config` for `api.sandpay.example` contains only a `pin-set` with two pins.
      Is cleartext permitted to `api.sandpay.example`?
    options:
      - id: no
        text: "No - the domain-config does not set it, so the value is inherited from base-config, which is false."
        feedback: "Correct. Unset values are inherited from the parent domain-config or the base-config, then the platform default."
      - id: yes
        text: "Yes - a domain-config resets all settings to permissive."
        feedback: "Unset values are inherited, not reset."
      - id: pins
        text: "Yes, because pinned domains are exempt from cleartext rules."
        feedback: "Pinning and cleartext are separate settings."
      - id: unknown
        text: "It cannot be known without running the app."
        feedback: "The documented inheritance rules answer it statically."
    correct: [no]
    solution: The domain-config sets nothing about cleartext, so base-config's false applies.

  - id: place-data
    type: mcq
    concept: sec-mob-data
    skill: application
    title: Is this report safe to send?
    prompt: |
      A draft finding says: "Token found in /sdcard/Download/export.csv: demo-export-key-FAKE". Which problems should the reviewer flag first?
    options:
      - id: both
        text: "The secret value is pasted into the report (mask it, say its kind), and the file is on shared storage where other apps can read it (MASWE-0002) - the finding is that location."
        feedback: "Correct. Report the path, the kind and the location; the value is a second leak."
      - id: format
        text: "The file extension is wrong."
        feedback: "The file type is not the problem."
      - id: private
        text: "Nothing - the file is in the Download folder, which is private."
        feedback: "Download on shared storage is readable by other apps; that is the point of the finding."
      - id: log
        text: "It should be reported as a log leak."
        feedback: "It is an export file on shared storage, not a log."
    correct: [both]
    solution: Remove the value (use a masked form), and report the finding as sensitive data on shared storage.

recall:
  - id: recall-groups
    concept: sec-mob-masvs
    prompt: Name the MASVS control groups.
    answer: STORAGE, CRYPTO, AUTH, NETWORK, PLATFORM, CODE, RESILIENCE and PRIVACY.
  - id: recall-chain
    concept: sec-mob-masvs
    prompt: How do the MASVS, MASTG and MASWE relate?
    answer: MASVS lists the controls (what the app must do); MASWE lists weaknesses, each mapped to a control; MASTG describes how to verify the controls through those weaknesses. The MASTG has no test for every MASWE yet.
  - id: recall-resilience
    concept: sec-mob-masvs
    prompt: Is a missing obfuscation or anti-tampering measure a vulnerability?
    answer: Not by itself - the MASVS says so. Report a gap against a stated threat; the rest of the MASVS applies according to the threat model.
  - id: recall-defaults
    concept: sec-mob-config
    prompt: What are the documented defaults for allowBackup, debuggable and cleartext?
    answer: allowBackup is true, debuggable is false, and cleartext traffic is permitted up to API level 27 and disabled from API level 28.
  - id: recall-nsc
    concept: sec-mob-config
    prompt: Which network security configuration rule wins, and where do unset values come from?
    answer: The domain rule with the longest matching domain; unset values come from the parent domain-config, then base-config, then the platform default.
  - id: recall-pin
    concept: sec-mob-config
    prompt: What does the documentation warn about pinning?
    answer: Always include a backup key, otherwise a key change needs an app update; and an expiration on pins may enable attackers to bypass pinned certificates.
  - id: recall-places
    concept: sec-mob-data
    prompt: Name the places a secret can rest and what reaches each.
    answer: Private storage (backups, file permissions, device or app bugs), shared storage (other apps, ADB), logs, and backups. Report path, kind and location, never the value.

