    RFC 8446,
    certificates,
    Subject Alternative Name,
    openssl s_client,
    HSTS,
    excessive data exposure,
    API3,
    verbose errors,
    stack trace,
    secrets in logs,
    redaction,
    evidence handling,
    CWE-532,
