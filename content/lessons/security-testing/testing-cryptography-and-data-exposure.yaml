concepts:
  - id: sec-crypto-password-storage
    name: Password storage - fast hashes, salts and work factors
    summary: A stored password hash protects users only if it is slow and salted. MD5, SHA-1 and plain SHA-256 are fast, so an attacker with the table can test guesses at enormous speed, and an unsalted hash is the same for everyone who picked the same password. A tester proves the weakness by the stored value's format, by identical values for different users and by hashing a known test password - never by cracking real users - and judges the parameters against the current cheat sheet, not an old figure.
  - id: sec-crypto-transport
    name: Transport security - TLS versions, certificates and cleartext channels
    summary: Data on the wire needs TLS with no legacy protocol versions (RFC 8996 deprecates TLS 1.0 and 1.1) and a certificate with a strong key (at least 2048 bits), a SHA-256-or-better signature, a valid period (at most 398 days for certificates issued after 1 September 2020) and a Subject Alternative Name that matches the host. A client that cannot try a version proves nothing about the server, so a refused probe is inconclusive, not safe. Credentials sent over http are a finding on their own (WSTG-CRYP-03).
  - id: sec-crypto-exposure
    name: Sensitive data exposure in responses, errors and logs
    summary: Cryptography does not help if the application hands the secret over - an API that returns every property of an object, an error page with a stack trace and a key, or a log line with a password. The tester scans each channel for the shapes of secrets, compares responses with the fields the contract allows, and reports redacted evidence - the first characters and the length - so the report is not itself a leak.

objectives:
  - Classify a stored password hash by its format and say which of "fast", "unsalted" and "too few iterations" apply.
  - Prove missing salts and fast hashing without cracking a real user's password, and handle the evidence safely.
  - Choose between conflicting sources (the WSTG's 10,000 PBKDF2 iterations and the cheat sheet's 600,000) and state which you used.
  - Check a certificate against the WSTG-CRYP-01 rules and a server's accepted TLS versions against RFC 8996, and explain why a client that cannot try a version gives no result.
  - Find credentials sent over unencrypted channels (WSTG-CRYP-03).
  - Find excessive data, verbose errors and secrets in logs, and report them with redacted evidence.
  - Plan the WSTG-CRYP, WSTG-ERRH-01 and logging tests for a web application and re-test after fixes.

sections:
  - id: intuition
    kind: intuition
    concepts: [sec-crypto-password-storage, sec-crypto-transport, sec-crypto-exposure]
    title: The idea in plain language
    body: |
      Think of SandPay's data as three things in three places. The merchants' passwords sit in a **filing
      cabinet** (the database). Everything that travels between a browser and the portal rides in a **van**
      (the network). And the portal talks all day - in API answers, error pages and log files - which is a
      **conversation** that anyone near can overhear.

      Cryptography is the locks on the cabinet and the van:

      - The cabinet should not hold passwords at all, only **fingerprints** of them, made by a machine that is
        deliberately slow and stamps a different random mark on every fingerprint. If the fingerprint machine is
        fast and stamps nothing, a thief who steals the cabinet can try millions of guesses a second, and two
        people with the same password have the same fingerprint.
      - The van needs a **sealed, current lock** and the right plate: an old lock design that has been retired,
        or a plate for a different address, means passengers cannot trust it.
      - And no lock helps if the portal simply **says the secret out loud**: an API answer that includes the
        merchant's secret key "because the page needed the name", an error page that prints the signing key, or a
        log line that records the password someone just typed.

      Testing this is checking each place without becoming the thief. You do not crack real passwords: you read
      the fingerprint's *format* and compare identical ones. You do not attack the lock: you ask the server
      politely which designs it accepts, and read its certificate. And you do not copy a secret into your report:
      you write down its first characters and its length. The report is a document that people forward - if it
      contains the key, you have leaked it a second time.

      This lesson builds those checks and runs them against a deliberately vulnerable SandPay portal on your own
      machine - and shows two places where a tester can fool themselves: a client that cannot even try an old TLS
      version, and two reference documents that disagree about how many hash iterations are enough.

  - id: what
    kind: what
    concepts: [sec-crypto-password-storage, sec-crypto-transport, sec-crypto-exposure]
    title: Terms you need
    body: |
      | Term | Meaning |
      | --- | --- |
      | **Hash** | a one-way function: from the output you cannot compute the input - but you can hash a guess and compare |
      | **Fast hash** | MD5, SHA-1, plain SHA-256 - built for speed, so an attacker's guesses are cheap |
      | **Password hashing scheme** | a deliberately slow, salted construction: Argon2id, scrypt, bcrypt, PBKDF2 |
      | **Salt** | "a unique, randomly generated string that is added to each password as part of the hashing process" (Password Storage Cheat Sheet); NIST asks for at least 32 bits, stored with the hash |
      | **Work factor / cost** | how many iterations (or how much memory) one hash takes; it can be raised over time |
      | **Pepper** | a secret shared by all hashes and kept outside the database - extra defence, not a replacement for a salt |
      | **TLS** | Transport Layer Security, the protocol under HTTPS; versions 1.0 and 1.1 are deprecated by RFC 8996, 1.2 and 1.3 are current |
      | **Certificate** | the server's signed proof of identity: key, signature algorithm, validity period, names |
      | **SAN** | Subject Alternative Name - the certificate field browsers match the host name against; the Common Name is ignored |
      | **HSTS** | the `Strict-Transport-Security` header telling browsers to use https only |
      | **Excessive data exposure** | an API returns properties the caller does not need or may not see (merged into API3:2023) |
      | **Verbose error** | an error response with a stack trace, paths, queries or keys (WSTG-ERRH-01) |
      | **Redaction** | showing only a safe part of a secret as evidence: here the first 4 characters and the length |

      The OWASP tests this lesson covers:

      | ID | Test | Where in this lesson |
      | --- | --- | --- |
      | WSTG-CRYP-01 | Weak transport layer security | the certificate and protocol checks |
      | WSTG-CRYP-03 | Sensitive information sent via unencrypted channels | steps, tests |
      | WSTG-CRYP-04 | Weak encryption (MD5, SHA-1, small keys, iteration counts) | the hash audit |
      | WSTG-ERRH-01 | Improper error handling | the forced error |
      | Top 10:2021 A02 / A09, API3:2023 | cryptographic failures, logging failures, object property exposure | the exposure scan |

  - id: why
    kind: why
    concepts: [sec-crypto-password-storage, sec-crypto-transport, sec-crypto-exposure]
    title: Why this gets its own tests
    body: |
      Breaches happen in two steps: something small leaks (a database backup, a log bundle, a verbose error),
      and weak protection turns it into a big loss. OWASP renamed "Sensitive Data Exposure" to **A02
      Cryptographic Failures** in 2021 because exposure is "more of a broad symptom rather than a root cause" -
      the cause is cryptography missing or misused. Its questions read like a test plan: is any data
      transmitted in clear text, are old algorithms or protocols in use, "are deprecated hash functions such as
      MD5 or SHA1 in use", are keys checked into repositories, is the server certificate validated?

      Functional tests never see this. A login with an MD5 hash works exactly like one with PBKDF2; a merchant
      page that returns the secret key renders the same as one that does not; a TLS 1.0 handshake succeeds
      silently. Every check passes - until the day the table leaks, and then the difference is whether the
      attacker needs minutes or never succeeds.

      Fixes also hide new findings. Hardening the hash makes the login slower (the timing of user enumeration
      changes - see [Testing authentication](#/lesson/testing-authentication)); a new error handler may still log
      the request body; a certificate renewal may drop the name the mobile app connects to. And exposure is the
      one place where the *test report* can cause harm: a finding that quotes the key is a second leak. A
      careful tester treats evidence as sensitive data.

  - id: storage-internals
    kind: internals
    concepts: [sec-crypto-password-storage]
    title: How password storage works - and how a tester reads it
    body: |
      **Why fast hashes fail.** A hash cannot be reversed, but the attacker does not need to reverse it. The
      Password Storage Cheat Sheet describes the attack in three steps: "Selecting a password you think the victim
      has chosen", "Calculating the hash", and "Comparing the hash you calculated to the hash of the victim". With
      a stolen table the attacker repeats that over wordlists, leaked passwords and brute force - offline, with no rate limit and
      no lockout. The cheat sheet's conclusion: "Fast hashing algorithms such as SHA-256 are not suitable for
      password storage because they allow attackers to perform large numbers of guesses quickly."

      **What a salt changes.** A unique random salt per password means the attacker "has to crack hashes one at
      a time using the respective salt rather than calculating a hash once and comparing it against every stored
      hash", defeats precomputed lookup tables, and makes it "impossible to determine whether two users have the
      same password without cracking the hashes". For a tester the last point is the evidence: **two different
      users with the same stored value means no per-password salt**.

      **What a work factor changes.** A password hashing scheme repeats work: PBKDF2 iterations, bcrypt cost,
      Argon2id memory and passes. The cost makes each guess expensive for an attacker and is chosen to keep a
      login fast enough for the server ("as a general rule, calculating a hash should take less than one second").
      It can be raised over time; the common upgrade is to re-hash at the user's next login.

      **The numbers to test against** (Password Storage Cheat Sheet, 20 November 2026):

      | Scheme | Minimum configuration |
      | --- | --- |
      | Argon2id | 19 MiB of memory, 2 iterations, 1 degree of parallelism (or the equivalent trade-offs the sheet lists) |
      | scrypt | CPU/memory cost 2^17, block size 8, parallelism 1 |
      | bcrypt (legacy systems) | work factor 10 or more, and a 72-byte password limit |
      | PBKDF2 (when FIPS-140 is required) | 600,000 or more iterations with HMAC-SHA-256 |

      NIST SP 800-63B-4 adds the SHALLs: passwords "SHALL be salted and hashed using a suitable password hashing
      scheme", "the salt SHALL be at least 32 bits in length", and "both the salt value and the resulting hash
      SHALL be stored".

      **When sources disagree.** WSTG-CRYP-04 recommends PBKDF2 iterations "over 10000", citing NIST's older
      figure; the cheat sheet says 600,000. Test against the **current** guidance, name your source in the
      report, and mention the older figure so a developer who read the WSTG is not confused. A value that passes
      the old number and fails the new one is "below current recommendation", not "broken".

      **Reading a stored value.** The format tells you almost everything: 32 hex characters is MD5, 40 is SHA-1,
      64 is SHA-256 (all unsalted and fast); `pbkdf2_sha256$600000$<salt>$<hash>` names the scheme, the iterations
      and the salt; `$2b$12$...` is bcrypt with cost 12; `$argon2id$...` carries its parameters. With the
      owner's permission, reading one stored value per account type is enough - the format is the finding.

  - id: transport-internals
    kind: internals
    concepts: [sec-crypto-transport]
    title: How a TLS service is checked
    body: |
      WSTG-CRYP-01 splits TLS testing into four areas.

      **Server configuration.** TLS has many protocol versions, ciphers and extensions, and many are legacy. The
      WSTG lists SSLv2 (DROWN), SSLv3 (POODLE), TLSv1.0 (BEAST), EXPORT ciphers (FREAK), NULL and anonymous
      ciphers, RC4, CBC-mode ciphers, TLS compression (CRIME) and weak DHE keys (LOGJAM). RFC 8996 formally
      deprecates TLS 1.0 and 1.1: "These versions lack support for current and recommended cryptographic
      algorithms and mechanisms." TLS 1.2 is still acceptable; TLS 1.3 (RFC 8446) obsoleted it in 2018. The
      WSTG also stresses **exploitability**: most of these attacks "require a (usually active) MitM attack, and
      significant resources" - so severity should be reasoned, not copied from a scanner.

      **Digital certificates.** Two cryptographic checks: "the key strength should be *at least* 2048 bits" and
      "the signature algorithm should be *at least* SHA-256. Legacy algorithms such as MD5 and SHA-1 should not be
      used." And validity: within the validity period; for certificates issued after 1 September 2020, not
      valid for more than 398 days; signed by a trusted CA; and "a Subject Alternate Name (SAN) that matches the
      hostname" - "the Common Name (CN) field is ignored by modern browsers". The WSTG adds two traps: do not
      flag an internal service for an untrusted certificate "just because *your* system doesn't trust the CA",
      and note that "if you access the host by IP then any certificate will appear untrusted".

      **Application use of TLS.** The application can undo good TLS: mixed active content, sensitive data sent
      over http (WSTG-CRYP-03: "if data must be protected when it is stored, this data must also be protected
      during transmission"), a login form that posts to `http://`, a session cookie without `Secure`, no HSTS.
      The first request before a redirect is exposed unless the host is on the HSTS preload list.

      **The client trap.** Probing a version means a **client** has to speak it. The WSTG warns: "the version of
      OpenSSL or GnuTLS shipped with most modern systems may not support some outdated and insecure protocols
      such as SSLv2 or EXPORT ciphers. Make sure that your version supports the outdated versions before using
      it for testing, or you'll end up with false negatives." This lesson's probe therefore tries only TLS 1.2
      and 1.3, and the audit takes the list of accepted versions from whatever tool *could* try the old ones.

  - id: exposure-internals
    kind: internals
    concepts: [sec-crypto-exposure]
    title: How exposure happens - and how to look for it
    body: |
      Three channels, three causes:

      - **Responses.** The portal's `GET /api/merchants/<id>` runs `SELECT *` and returns the row: the merchant's
        `api_secret` and full `payout_iban` travel to the browser, which only needs the name. API3:2023 describes
        it: an endpoint is vulnerable if it "exposes properties of an object that are considered sensitive and
        should not be read by the user" (previously "Excessive Data Exposure"). Hiding the field in the screen is
        not a control - the response is what leaves the building. The test compares the actual fields with the
        fields the contract allows.
      - **Errors.** A stack trace tells an attacker the framework, the file layout and the line that failed;
        WSTG-ERRH-01 lists what improper error handling allows: understanding "the APIs being used internally",
        mapping services, gathering "the versions and types of applications". The portal's `/boom` goes further
        and prints a signing key in the exception message. The trigger is simple: send what the developer did
        not expect.
      - **Logs.** Top 10 A09 includes "CWE-532 Insertion of Sensitive Information into Log File". The Logging
        Cheat Sheet's "Data to exclude" lists what should "usually not be recorded directly in the logs, but
        instead should be removed, masked, sanitized, hashed, or encrypted": session identifiers, access tokens,
        authentication passwords, database connection strings, encryption keys and primary secrets, and bank or
        payment card holder data. The portal logs `password=...` for every login attempt.

      **Finding them by shape.** Secrets have shapes: a prefix (`sk_test_...`), `key=` or `password=` followed by
      a value, `Traceback (most recent call last)`, an IBAN layout. A scanner with a handful of patterns finds
      most of them in responses and logs; it will also have false positives (a harmless `key=` in a URL), so a
      human reads each hit.

      **Handling the evidence.** The finding is "the response contains a secret key", not the key. The scanner in
      this lesson redacts at the source: it returns the first 4 characters and the length (`sk_t...(23 chars)`),
      enough to prove which secret and to let the owner find and rotate it. A report, a ticket, a chat message
      and a screenshot are all copies; every copy of a real secret is one more thing to clean up. If you do see
      a real, working secret, tell the owner **now** - it must be rotated whatever the test report says.

  - id: when
    kind: when
    concepts: [sec-crypto-password-storage, sec-crypto-transport, sec-crypto-exposure]
    title: When to run these tests - and what they do not replace
    body: |
      **Run them** at the start of any web or API test (transport and exposure checks are cheap and read-only),
      after every change to authentication, logging, error handling or certificates, and after a breach or a
      dependency change. The hash check needs the owner's help (a read of the user table or a stored value for a
      test account) and is often a code-review or configuration question instead.

      **Do not rely on them alone.** A format check says nothing about *how* the hash is computed (a correct
      format can still be wrapped around a bad pre-hash) or about key management (where the signing key lives,
      who can read it, how it rotates - see the Cryptographic Storage Cheat Sheet). A TLS scan does not test
      the application's behaviour over the channel. A pattern scan finds the secrets it has patterns for.

      **Do not use them to attack.** Cracking real users' hashes, exploiting a padding oracle on a live system
      without permission, or keeping a copy of leaked data are all outside a normal test's scope. Where an
      exploit demonstration would help, build it against your own practice target.

      **Related, not repeated:** header and default checks - [Testing for security
      misconfiguration](#/lesson/testing-security-misconfiguration); the developer view of the same data - [OWASP
      Top 10 for developers](#/lesson/owasp-top-10-for-developers) and [Passwords, OAuth and
      OIDC](#/lesson/passwords-oauth-and-oidc); card data rules - [PCI DSS awareness](#/lesson/pci-dss-awareness);
      what to log instead - [Observability for web apps](#/lesson/observability-for-web-apps).

  - id: visual
    kind: visual
    concepts: [sec-crypto-password-storage, sec-crypto-transport, sec-crypto-exposure]
    title: Three channels, one findings list
    body: |
      ```mermaid
      flowchart LR
        subgraph rest ["At rest - with the owner's permission"]
          A["Stored values<br/>(user table)"] --> B["classify_hash<br/>audit_hashes"]
        end
        subgraph wire ["In transit - loopback only"]
          C["TLS handshakes<br/>and certificate"] --> D["audit_protocols<br/>check_certificate"]
        end
        subgraph talk ["In what the portal says"]
          E["Responses, errors,<br/>log lines"] --> F["find_secrets<br/>excess_fields"]
        end
        B --> G["Findings: a code plus<br/>redacted evidence"]
        D --> G
        F --> G
        G --> H["Report and re-test<br/>after the fix"]
      ```

      Notice that every branch ends in a **code and redacted evidence**, never in a copied secret or a cracked
      password - and that the middle branch only ever produces a result for versions the client could try.

  - id: curl-evidence
    kind: code
    concepts: [sec-crypto-exposure]
    title: "Evidence with curl: what the portal says out loud"
    body: |
      Start the portal and read the merchant record and a forced error. First the vulnerable build:

      ```bash
      cd practice/security
      .venv/bin/python support/sandpay_vuln.py --port 8765 &
      TOKEN=$(curl -s -X POST http://127.0.0.1:8765/api/login -H 'Content-Type: application/json' \
        -d '{"email":"alice@shop-a.example","password":"alice-pass-1"}' | python3 -c "import json,sys;print(json.load(sys.stdin)['token'])")
      curl -si http://127.0.0.1:8765/api/merchants/m_100 -H "Authorization: Bearer $TOKEN"
      curl -si http://127.0.0.1:8765/boom
      ```

      ```plaintext
      HTTP/1.1 200 OK
      Server: SandPayPortal/0.9 Python/3.12
      Content-Type: application/json
      Content-Length: 112

      {"id": "m_100", "name": "Shop A", "api_secret": "sk_test_shop_a_practice", "payout_iban": "XX00 SAND 0000 0001"}

      HTTP/1.1 500 Internal Server Error
      Server: SandPayPortal/0.9 Python/3.12
      Content-Type: text/plain
      Content-Length: 693

      Traceback (most recent call last):
        File ".../support/sandpay_vuln.py", line 474, in handle
          resp = self._route(req)
                 ^^^^^^^^^^^^^^^^
        File ".../support/sandpay_vuln.py", line 498, in _route
          return fn(req)
                 ^^^^^^^
        File ".../support/sandpay_vuln.py", line 469, in boom
          raise RuntimeError(f"settlement batch failed; db=sqlite:///var/sandpay/portal.db key={JWT_SECRET.decode()}")
      RuntimeError: settlement batch failed; db=sqlite:///var/sandpay/portal.db key=sandpay-practice-only-jwt-key
      ```

      (The `Date` header is left out of every response in this lesson, and the file paths are shortened - the
      real trace shows the full path of the machine, which is itself information.) Three findings in two
      requests: a secret key and a full account number in a response that only needed the name; a stack trace
      with file names and line numbers; and a signing key printed in an exception message.

      The same portal with `data-exposure`, `verbose-errors` and `missing-headers` fixed:

      ```plaintext
      HTTP/1.1 200 OK
      Server: SandPay
      Content-Type: application/json
      Content-Security-Policy: default-src 'self'; frame-ancestors 'none'
      X-Content-Type-Options: nosniff
      Referrer-Policy: no-referrer
      Strict-Transport-Security: max-age=31536000
      Content-Length: 62

      {"id": "m_100", "name": "Shop A", "payout_iban_last4": "0001"}

      HTTP/1.1 500 Internal Server Error
      Server: SandPay
      Content-Type: application/json
      Content-Security-Policy: default-src 'self'; frame-ancestors 'none'
      X-Content-Type-Options: nosniff
      Referrer-Policy: no-referrer
      Strict-Transport-Security: max-age=31536000
      Content-Length: 52

      {"error": "internal error", "reference": "95cde1a9"}
      ```

      The `reference` is what a developer greps for in the server's own log - the details stay on the server.
      (The fixed build still sends HSTS over plain http, which RFC 6797 section 7.2 says a server should not do;
      that is a teaching point for the misconfiguration lesson, not a finding about this one.)

  - id: tool-code
    kind: code
    concepts: [sec-crypto-password-storage, sec-crypto-transport, sec-crypto-exposure]
    title: "The three checks, with real output"
    collapsed: true
    body: |
      **Stored values** - `classify_hash` and `audit_hashes` (the solution is in
      `practice/security/solutions/web/crypto_hash_audit.py`). The user table is read in-process here, as the
      owner would give it to you:

      ```python
      def classify_hash(stored: str) -> dict:
          findings: set[str] = set()
          if _HEX.match(stored) and len(stored) in _FAST:            # 32 / 40 / 64 hex characters
              return {"algorithm": _FAST[len(stored)], "salted": False, "slow": False,
                      "findings": sorted({"fast-hash", "unsalted"})}
          if stored.startswith("pbkdf2_sha256$"):
              parts = stored.split("$")
              if len(parts) == 4 and parts[1].isdigit() and _HEX.match(parts[2]) and _HEX.match(parts[3]):
                  if int(parts[1]) < MIN_PBKDF2_ITERATIONS:
                      findings.add("low-iterations")
                  if len(parts[2]) // 2 < MIN_SALT_BYTES:
                      findings.add("short-salt")
                  return {"algorithm": "pbkdf2-sha256", "salted": True, "slow": not findings,
                          "findings": sorted(findings)}
          ...  # bcrypt ($2a$, $2b$, $2y$), argon2id, and "unknown" for anything else
      ```

      Run against both builds of the portal:

      ```plaintext
      == vulnerable
        alice@shop-a.example     8a2552332d39695709a007fbcef16e49
        bob@shop-b.example       1f96efdf3b7947ee9fa84aae7fda3cf5
        ops@sandpay.example      46f3517d98ac333dcfd98053a051ceb8
         alice@shop-a.example {"algorithm": "md5", "salted": false, "slow": false, "findings": ["fast-hash", "unsalted"]}
         bob@shop-b.example {"algorithm": "md5", "salted": false, "slow": false, "findings": ["fast-hash", "unsalted"]}
         ops@sandpay.example {"algorithm": "md5", "salted": false, "slow": false, "findings": ["fast-hash", "unsalted"]}
        shared: []
      == weak-hash fixed
        alice@shop-a.example     pbkdf2_sha256$600000$5f5943be3c025e6d4cf5e2df8c0...
        bob@shop-b.example       pbkdf2_sha256$600000$f5d83d5984f95f12153359625e3...
        ops@sandpay.example      pbkdf2_sha256$600000$6d44864b31accc7ba0579edf078...
         alice@shop-a.example {"algorithm": "pbkdf2-sha256", "salted": true, "slow": true, "findings": []}
         bob@shop-b.example {"algorithm": "pbkdf2-sha256", "salted": true, "slow": true, "findings": []}
         ops@sandpay.example {"algorithm": "pbkdf2-sha256", "salted": true, "slow": true, "findings": []}
        shared: []
      ```

      The proof that needs no cracking - hash a password you were *given* for a test account, with the public
      algorithm, and compare:

      ```plaintext
      == owner check: the known test password hashed with the public algorithm
        md5('alice-pass-1') = 8a2552332d39695709a007fbcef16e49
        equals stored       = True
        two pbkdf2 of the same password differ: True
        same pbkdf2 prefix for both?  pbkdf2_sha256$600000$e64c8f57014f3f9b15d | pbkdf2_sha256$600000$d72a25fb1bd9029ea63
      == timing on this machine: md5 0.33 microseconds, pbkdf2 600000 115 ms, ratio 349,418x
      ```

      On this machine one MD5 takes a third of a microsecond and one PBKDF2 with 600,000 iterations about 115
      ms - roughly 350,000 times more work per guess, which is the whole point of the work factor. Do not quote
      the figures: the ratio is the lesson, and it is the same order of magnitude anywhere. (`shared` is empty
      because the three seeded passwords differ; the tests show the same MD5 for two users with the same
      password, and different PBKDF2 values.)

      **The TLS service** - `serve_tls` starts a local server; `supported_tls_versions` really handshakes with
      TLS 1.2 and 1.3, trusting only the fixture's own certificate:

      ```plaintext
      modern  accepted=['TLSv1.2', 'TLSv1.3'] findings=[]
      tls12   accepted=['TLSv1.2'] findings=[]
      tls13   accepted=['TLSv1.3'] findings=[]
      cert facts: {'key_bits': 2048, 'signature_algorithm': 'sha256WithRSAEncryption', 'not_before': '2026-11-20T16:39:12+00:00', 'not_after': '2026-12-20T16:39:12+00:00', 'san': ['localhost', '127.0.0.1']}
      findings for localhost: []
      findings for pay.sandpay.example: ['hostname-mismatch']
      ```

      The same server with `openssl s_client`, asking for three versions (output trimmed to the lines that
      matter, from the same run):

      ```plaintext
      --- openssl s_client -tls1_1 -> exit 1
      error:0A0000BF:SSL routines:tls_setup_handshake:no protocols available
      --- openssl s_client -tls1_2 -> exit 0
      CONNECTION ESTABLISHED
      Protocol version: TLSv1.2
      Ciphersuite: ECDHE-RSA-AES256-GCM-SHA384
      Peer certificate: CN = localhost, O = SandPay Practice
      Verification: OK
      Verified peername: localhost
      --- openssl s_client -tls1_3 -> exit 0
      CONNECTION ESTABLISHED
      Protocol version: TLSv1.3
      Ciphersuite: TLS_AES_256_GCM_SHA384
      Verification: OK
      ```

      Look at the first result. The local server accepts TLS 1.2 and 1.3 only, so a refusal is the right answer
      for TLS 1.1 - but the message, **"no protocols available"**, comes from the *client*: this OpenSSL has TLS
      1.1 switched off, so it never sent anything. Against a server that *did* accept TLS 1.1 the output would be
      identical. That is the false negative the WSTG warns about, and the reason `audit_protocols` takes its
      list from a tool that can try legacy versions (nmap's `ssl-enum-ciphers`, testssl.sh, sslyze - from the
      docs, not run here).

      **Responses, errors and logs** - `scan_portal` fetches the merchant record and `/boom`, and scans the
      portal's own log lines:

      ```plaintext
      == vulnerable
        log lines: ['login attempt email=alice@shop-a.example password=alice-pass-1', 'POST /api/login 200']
        merchant  [{"kind": "api-key", "sample": "sk_t...(23 chars)"}, {"kind": "iban", "sample": "XX00...(19 chars)"}]
        error     [{"kind": "secret-assignment", "sample": "sand...(29 chars)"}, {"kind": "secret-assignment", "sample": "{JWT...(23 chars)"}, {"kind": "stack-trace", "sample": "Trac...(33 chars)"}]
        log       [{"kind": "password-in-log", "sample": "alic...(12 chars)"}]
      == all three fixed
        log lines: ['login attempt email=alice@shop-a.example', 'POST /api/login 200']
        merchant  []
        error     []
        log       []
      ```

      The second `secret-assignment` in the error body is `{JWT...`: the pattern also matched the **source line**
      in the stack trace (`key={JWT_SECRET.decode()}`) - a reminder that a pattern scan gives candidates, and a
      human decides. And note that no entry contains a whole secret.

  - id: line-by-line
    kind: line-by-line
    concepts: [sec-crypto-password-storage, sec-crypto-transport, sec-crypto-exposure]
    title: Why the checks are written that way
    body: |
      - `classify_hash` decides by **format**, not by trying passwords: the format is the evidence, and nothing
        about a real user's password is learned or kept.
      - `slow` is `not findings` for PBKDF2: a hash is only "slow" when its iterations **and** its salt meet the
        minimums. A 2-byte salt or 10,000 iterations is salted-and-adaptive in name only.
      - `audit_hashes` groups users by **identical stored value**: with a per-password salt, equal values cannot
        happen by accident, so a group of two is proof of a missing salt without any guessing.
      - `MIN_PBKDF2_ITERATIONS = 600_000`: the cheat sheet's figure for PBKDF2-HMAC-SHA256. The WSTG's older
        "over 10000" is mentioned in the lesson text, not used as the pass mark.
      - `check_certificate` compares the host name with the **SAN list only**, with a wildcard covering one
        label (`*.sandpay.example` matches `api.sandpay.example` but not `sandpay.example` and not
        `a.b.sandpay.example`): that is how the WSTG describes it, and the Common Name is deliberately not read.
      - The 398-day rule applies only when `not_before >= 2020-09-01`: an older certificate was issued under old
        rules, and flagging it would be a false positive.
      - `supported_tls_versions` sets `minimum_version == maximum_version` for each probe, so one handshake
        answers one question; it trusts only the fixture's own certificate (`load_verify_locations`) and keeps
        host-name checking on, so a refusal is the server's, not a verification error mistaken for one.
      - The probe raises `ValueError` for any host but loopback **before** `create_connection`: the tests prove
        that no socket is opened for `example.com`.
      - A refused or reset handshake means "not accepted" for that version; it never raises. A closed port
        returns `[]`, which is not the same as "secure" - and `audit_protocols([])` says
        `no-modern-protocol`, so an empty list cannot pass as clean.
      - `find_secrets` returns `sample` = first 4 characters + `...` + length, and uses the **value after the
        `=`** for log lines: the report proves which secret and how long, and cannot be used to log in. A test
        asserts that none of the real secrets appears in the whole result.
      - `scan_portal` fetches `/boom` **without** a token and accepts any status: error pages are exactly where
        the secrets are, and a 500 is the expected answer.
      - `excess_fields` compares against what the contract **allows**, not against a list of bad names: a new
        sensitive field is flagged the day it is added.

  - id: steps
    kind: steps
    concepts: [sec-crypto-password-storage, sec-crypto-transport, sec-crypto-exposure]
    title: Testing cryptography and data exposure, step by step
    body: |
      1. **Agree scope and evidence rules.** Which hosts and endpoints, whether you may read stored values or
         logs (and who gives them to you), where findings may be written down - and the rule that a real secret
         is **never** quoted in full. Agree who to tell at once if you find a working secret.
      2. **Map the sensitive data.** Passwords, tokens, API keys, account numbers, card data, personal data:
         where it is stored, where it travels, where it appears in responses and logs.
      3. **WSTG-CRYP-03, cleartext channels.** Look for sensitive data over `http` - login forms with an `http`
         `action`, Basic authentication over http, session cookies without `Secure` (WSTG-CRYP-03's examples) -
         and for redirects from http that expose the first request.
      4. **WSTG-CRYP-01, TLS.** Run a TLS scanner (nmap scripts, testssl.sh, sslyze, SSL Labs - from the docs,
         not run here) for protocol versions, ciphers and certificate facts. Make sure your tool *can* try the
         old versions. Reason about exploitability before you rate severity.
      5. **Certificate.** Key size, signature algorithm, validity period (and the 398-day rule), chain, and SAN
         against **every host name clients use** - including the one the mobile app connects to.
      6. **WSTG-CRYP-04, password storage.** With the owner, read the stored format for one account of each type
         and check duplicates across accounts; hash a known test password with the public algorithm if the
         format is a plain hash. Judge parameters against the current cheat sheet. Check legacy rows after any
         migration.
      7. **Other weak cryptography.** In the code or configuration: MD5, SHA-1, RC4, DES, ECB mode, small keys,
         predictable random numbers (WSTG-CRYP-04's keyword list), hard-coded keys, keys in the repository.
      8. **Responses.** Read every API response the client receives and compare it with what the screen shows
         and what the contract allows: extra properties, secrets, internal ids, full account numbers.
      9. **WSTG-ERRH-01, errors.** Send what the developer did not expect (wrong type, missing field, bad JSON,
         a very long value, a path that does not exist) and read the error: stack traces, paths, queries,
         versions, keys.
      10. **Logs.** With the owner's permission, sign in once, fail once, trigger an error, then read the new
          lines: no passwords, tokens, keys or card data on **any** path.
      11. **Report with redacted evidence.** Each finding: the request, the response *with secrets redacted*,
          the standard or guide it breaks, and the fix. Rotate anything real that was exposed.
      12. **Re-test** the whole list after fixes - a fix in one place is where the next finding hides.

  - id: example
    kind: example
    concepts: [sec-crypto-password-storage, sec-crypto-transport, sec-crypto-exposure]
    title: "Example: the migration that left the old hashes behind"
    body: |
      SandPay fixes `weak-hash` before a release: new passwords are stored with PBKDF2 and the login code can
      verify both formats. A tester is asked to confirm the fix.

      **Test 1 - format of a new account.** A fresh test account's stored value is
      `pbkdf2_sha256$600000$...`, `classify_hash` says `findings: []`. The fix works for new accounts.

      **Test 2 - the existing table.** With the owner's help the tester reads one stored value per existing
      account type and runs `audit_hashes` over the **whole table**: two thousand rows are still 32-character MD5
      values and the report shows them as `md5`, `fast-hash`, `unsalted`. The migration only covered new
      registrations; the login code accepts the old format, and nothing re-hashes it at the next login. A
      database leak tomorrow exposes every old account exactly as before. The finding is not "MD5 is used" -
      it is "the fix does not reach existing users", and the fix needs a re-hash at login (or a forced reset).

      **Test 3 - duplicates.** `audit_hashes` also lists 14 groups of users with identical stored values - the
      same password chosen by several merchants, visible because the old rows are unsalted. The tester reports
      the count, not the passwords or the users' names.

      **Test 4 - a new problem.** The tester triggers an error by posting malformed JSON to the sign-up
      endpoint. The new error handler returns a bare `reference` - but the server's own log, which the owner
      shares, contains the whole request body, **including the plain password**. `find_secrets` over the log
      lines reports `password-in-log` with the sample `Summ...(19 chars)`. The tester's report says
      `password-in-log`, the log file and line number and that length - not the password.

      This scenario is invented to show the order of checks; its counts are not measurements. The pattern is the
      real one: format, then the *whole table*, then duplicates, then side effects of the fix.

  - id: tests
    kind: tests
    concepts: [sec-crypto-password-storage, sec-crypto-transport, sec-crypto-exposure]
    title: Test cases for SandPay
    body: |
      | # | Test | Steps | Expected | Evidence |
      | --- | --- | --- | --- | --- |
      | 1 | Hash format | with the owner, read one stored value per account type | a salted, slow scheme at current minimums (for example PBKDF2 600,000 or Argon2id) | scheme, parameters, redacted prefix |
      | 2 | No shared values | `audit_hashes` over the user table | no two users share a stored value | group count only |
      | 3 | Known test password | hash a given test-account password with the public algorithm | the result does **not** equal the stored value | the comparison result |
      | 4 | Legacy rows | find rows not in the new format after a migration | none, or a re-hash at next login | count by format |
      | 5 | Cleartext channels | login form action, cookie flags, http redirect | all https, `Secure` cookie, HSTS | form action, headers |
      | 6 | Protocol versions | a scanner that can try legacy versions | no SSLv2, SSLv3, TLS 1.0 or 1.1 | scanner output with its version |
      | 7 | Certificate | key bits, signature, validity, SAN for each host name used | at least 2048 bits, SHA-256 or better, in date, at most 398 days, name matches | certificate facts |
      | 8 | Response fields | `GET /api/merchants/<own id>` | only the contracted fields (no `api_secret`, no full IBAN) | field names, redacted samples |
      | 9 | Forced error | `GET /boom` or malformed input | a generic message and a reference, no trace, path or key | status, body shape |
      | 10 | Log content | one success, one failure, one error, then read the log | no password, token, key or card data on any line | pattern-scan result |
      | 11 | Evidence hygiene | read your own report before sending | no whole secret anywhere | a second reader's check |

      Negative controls keep the tests honest: the hash audit must report nothing against the portal with
      `weak-hash` fixed; `scan_portal` must return empty lists when `data-exposure`, `verbose-errors` and
      `secret-logging` are all fixed; and the TLS probe must report an empty list, not a pass, for a port where
      nothing is listening.

  - id: mistakes
    kind: mistakes
    concepts: [sec-crypto-password-storage, sec-crypto-transport, sec-crypto-exposure]
    title: Common mistakes and a debugging method
    body: |
      - **Cracking to prove weak hashing.** The format and identical values prove it; cracking a real user's
        password proves nothing more and breaks your rules of engagement.
      - **Quoting the secret.** A report with the full key is a second leak. Redact at the source, and rotate
        anything real you saw.
      - **Trusting a failed legacy probe.** "No protocols available" came from the client. Check that your tool
        can speak the version before you report "not supported".
      - **Copying an old figure.** "Over 10000 iterations" passes a hash the current cheat sheet calls too weak.
        Say which source and which date you used.
      - **Rating severity from the scanner.** Most TLS weaknesses need an active attacker and resources (WSTG);
        reason about exploitability.
      - **Flagging the wrong certificate problem.** The Common Name is ignored; an internal CA your machine does
        not trust is not a finding about the service; an IP address will not match a name certificate.
      - **Testing only new accounts.** A hash fix that does not reach existing rows is the common gap.
      - **Hiding fields in the UI.** If the response has the secret, the secret has leaked, whatever the screen
        shows.
      - **Checking only the failed login in logs.** Check success, failure and error paths.
      - **Reading a pattern hit as a verdict.** `key=` in a URL is not a key; a human decides.
      - **Skipping the re-test.** The fix for one channel changed another.

      **Debugging method** when a result looks wrong: reproduce with `curl` or `openssl s_client` and read the
      raw output; confirm which build you are testing (the flaw ids in use); for a TLS result, confirm the
      client's own limits (`openssl version`, `openssl s_client -help` for the version flags); for a hash,
      re-read the stored value's separators and length; for a scan, print the surrounding text of one hit
      (privately) and decide whether it is real.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [sec-crypto-password-storage, sec-crypto-transport, sec-crypto-exposure]
    title: Trade-offs and alternatives
    body: |
      - **Work factor versus load.** A higher cost slows each guess and each login. The cheat sheet warns that
        too high a factor can let an attacker "exhaust the server's CPU with a large number of login attempts" -
        so a slow hash and login throttling go together.
      - **Peppers.** Extra protection if only the database leaks, but a second secret to store, rotate and
        protect; changing it forces password resets. A salt is not optional either way.
      - **Strict TLS versus reach.** Dropping TLS 1.0 and 1.1 can cut off very old clients; RFC 8996's position is
        that the attack surface and misconfiguration risk are worth more. Payment systems often have extra rules of
        their own - see [PCI DSS awareness](#/lesson/pci-dss-awareness).
      - **Short-lived certificates versus operations.** The 398-day limit and shorter lives need automation
        (renewal and deployment) - a tester also checks that expiry is monitored.
      - **Data minimisation versus convenience.** The best answer to "the response exposes the secret" is often
        not to store or return it at all (Top 10 A02: "data that is not retained cannot be stolen"), or to show
        it once at creation and mask it afterwards.
      - **Detailed logs versus safe logs.** Debug detail speeds up fixes and is where secrets get written; the
        Logging Cheat Sheet's answer is to remove, mask, hash or encrypt the sensitive fields, not to log
        nothing.
      - **Pattern scans versus review.** A scan is quick and repeatable but only finds known shapes; a code or
        log review finds the rest and costs more. Use the scan as a regression test and the review as the
        investigation.
      - **This lesson's choices.** The 600,000 / 2048 / 398 numbers are the cited sources'; the "first 4
        characters" redaction rule and the five secret patterns are this lesson's, not a standard.

  - id: summary
    kind: summary
    concepts: [sec-crypto-password-storage, sec-crypto-transport, sec-crypto-exposure]
    title: Quick reference
    body: |
      - Passwords: store a **slow, salted** scheme - Argon2id (19 MiB, 2, 1), scrypt (2^17, 8, 1), bcrypt (10+),
        PBKDF2-HMAC-SHA256 (600,000+). NIST: salted and hashed, salt at least 32 bits, salt and hash stored.
      - Prove weak storage by format, by identical values for different users and by hashing a **given** test
        password - never by cracking real users. 32/40/64 hex characters = MD5/SHA-1/SHA-256, unsalted and fast.
      - When the WSTG ("over 10000") and the cheat sheet (600,000) disagree, use the current one and say so.
      - TLS: no SSLv2, SSLv3, TLS 1.0 or 1.1 (RFC 8996); TLS 1.2 and 1.3 are current. A client that cannot try a
        version cannot tell you the server refuses it - "no protocols available" is inconclusive.
      - Certificate: key at least 2048 bits, SHA-256 or better, in date, at most 398 days (issued after 1
        September 2020), SAN matches the host (the Common Name is ignored).
      - Sensitive data over http, a login form posting to http, a cookie without `Secure` are findings on their
        own (WSTG-CRYP-03).
      - Exposure: compare responses with the contract (API3:2023), force errors (WSTG-ERRH-01), read logs on
        every path (A09, CWE-532; "Data to exclude").
      - **Redact evidence**: first characters and length, never the whole secret; rotate anything real; tell the
        owner at once.
      - Re-test everything after a fix, including existing rows after a migration.

exercises:
  - id: cr-same-value
    type: mcq
    concept: sec-crypto-password-storage
    skill: analysis
    title: Two users, one stored value
    prompt: |
      With the owner's permission you read the user table. Two different merchants, registered months apart,
      have the same stored value `5f4dcc3b5aa765d61d8327deb882cf99`. What does that show?
    options:
      - id: unsalted
        text: The values are 32 hex characters and identical - an unsalted MD5, so the same password gives the same value
        feedback: Correct - with a per-password salt, equal passwords would store different values. No cracking is needed to show it.
      - id: collision
        text: An MD5 collision between two different passwords
        feedback: Collisions need deliberately crafted inputs; two ordinary users choosing the same password is far likelier, and the format shows no salt.
      - id: pepper
        text: A pepper shared by all users
        feedback: A pepper is added before or after the salted hash; it does not make two salted hashes equal.
      - id: nothing
        text: Nothing - stored values are meant to be unique per user id
        feedback: Equal stored values for different users are exactly the evidence of a missing salt.
    correct: [unsalted]
    hints:
      - Count the characters, then ask what a salt would have done to two equal passwords.
    solution: |
      32 hex characters is MD5 (fast, unsalted), and two users with the same value chose the same password. A
      unique random salt per password would have made the stored values differ.

  - id: cr-fast-hash
    type: mcq
    concept: sec-crypto-password-storage
    skill: recognition
    title: Why is SHA-256 a poor password hash?
    prompt: |
      A developer says "we use SHA-256, not MD5, so passwords are safe". What does the Password Storage Cheat
      Sheet say about fast algorithms such as SHA-256?
    options:
      - id: fast
        text: They are not suitable for password storage because they allow large numbers of guesses quickly
        feedback: Correct - a stolen table can be attacked offline at the speed of the hash.
      - id: reversible
        text: They can be decrypted with the right key
        feedback: Hashes have no key and cannot be reversed; the problem is guessing, not decrypting.
      - id: short
        text: Their output is too short to be unique
        feedback: A 256-bit output is plenty long; the weakness is speed and the missing salt and work factor.
      - id: fine
        text: They are fine if the hash is stored in a separate database
        feedback: A separate store does not slow guessing once it leaks.
    correct: [fast]
    hints:
      - The sheet contrasts "fast" with "slow, memory-hard".
    solution: |
      "Fast hashing algorithms such as SHA-256 are not suitable for password storage because they allow attackers
      to perform large numbers of guesses quickly." Use Argon2id, scrypt, bcrypt or PBKDF2 with a work factor.

  - id: cr-conflicting-sources
    type: mcq
    concept: sec-crypto-password-storage
    skill: analysis
    title: Ten thousand or six hundred thousand?
    prompt: |
      A portal stores `pbkdf2_sha256$100000$...` values with random 16-byte salts. WSTG-CRYP-04 says PBKDF2
      iterations should be "over 10000"; the Password Storage Cheat Sheet says 600,000 or more for
      PBKDF2-HMAC-SHA256. What do you report?
    options:
      - id: below-current
        text: Below current recommendation - 100,000 is under the cheat sheet's 600,000; note that it passes the older WSTG figure
        feedback: Correct - test against current guidance, name the source and mention the older figure.
      - id: pass
        text: Pass - it is over 10,000, so it meets the WSTG
        feedback: The WSTG number is older; reporting a pass against it hides a real gap.
      - id: critical
        text: Critical - anything under 600,000 is broken
        feedback: It is salted and slow; "below current recommendation" is accurate, "broken" overstates it.
      - id: skip
        text: Do not report it - sources disagree
        feedback: When sources disagree you choose the current one and say which; silence helps nobody.
    correct: [below-current]
    hints:
      - Which source is newer, and what does your report need to say about the other?
    solution: |
      Use the current cheat sheet figure (600,000 for PBKDF2-HMAC-SHA256), report the value as below current
      recommendation with moderate severity, and note that it meets the older WSTG figure so the developers
      are not confused.

  - id: cr-prove-md5
    type: mcq
    concept: sec-crypto-password-storage
    skill: application
    title: Prove it without cracking real users
    prompt: |
      You must show the client that the portal stores unsalted MD5. Which evidence is within a normal test's rules?
    options:
      - id: known
        text: Hash a password you were given for a test account with MD5 and show that it equals the stored value
        feedback: Correct - it proves the algorithm, the missing salt and the speed, using only data you were given.
      - id: crack-all
        text: Run a cracking tool over all real users' hashes and list the recovered passwords
        feedback: That recovers real people's passwords - outside the scope of a format check and a harm in itself.
      - id: login-guess
        text: Guess passwords against the login of real merchants
        feedback: That is an attack on accounts and shows nothing about storage.
      - id: publish
        text: Copy the table out to a laptop to analyse later
        feedback: Copying the table creates a second copy of sensitive data; read only what you need, where it lives.
    correct: [known]
    hints:
      - Which option uses only data you were given?
    solution: |
      A known test password hashed with the public algorithm and compared with the stored value, plus the format
      and any identical values, is enough. Never recover real users' passwords.

  - id: cr-san
    type: mcq
    concept: sec-crypto-transport
    skill: application
    title: The name on the certificate
    prompt: |
      A certificate has `CN=pay.sandpay.example` and no Subject Alternative Name. Clients connect to
      `pay.sandpay.example`. What does WSTG-CRYP-01 say?
    options:
      - id: finding
        text: Report it - the Common Name is ignored by modern browsers, which look only at the SAN
        feedback: Correct - without a matching SAN the name check fails in modern clients.
      - id: fine
        text: Fine - the CN matches the host
        feedback: Browsers ignore the CN; only the SAN list is matched.
      - id: ip
        text: Fine if you connect by IP address instead
        feedback: Connecting by IP makes any name certificate look untrusted - that is a test artefact, not a fix.
      - id: wildcard
        text: Replace it with a wildcard certificate for the whole domain
        feedback: A wildcard has its own security concerns (the WSTG points to the TLS cheat sheet) and is not the fix for a missing SAN.
    correct: [finding]
    hints:
      - Which certificate field do modern browsers match against?
    solution: |
      WSTG-CRYP-01 requires a SAN that matches the host name and notes the CN is ignored by modern browsers. The
      fix is to reissue the certificate with the SAN.

  - id: cr-client-trap
    type: mcq
    concept: sec-crypto-transport
    skill: analysis
    title: "No protocols available"
    prompt: |
      You run `openssl s_client -connect pay.sandpay.example:443 -tls1_1` and get `no protocols available`. A
      colleague writes "the server rejects TLS 1.1 - pass". What is wrong?
    options:
      - id: client-side
        text: The message comes from the client - this OpenSSL has TLS 1.1 disabled and never sent a handshake, so the result is inconclusive
        feedback: Correct - the WSTG warns that a client that cannot speak the version gives false negatives.
      - id: server-side
        text: Nothing - an error is how a server refuses a version
        feedback: A server refusal arrives as an alert from the server after a ClientHello; here nothing was sent.
      - id: cert
        text: The certificate is invalid, which stops the handshake
        feedback: Certificate problems appear after a handshake starts, with different messages.
      - id: firewall
        text: A firewall blocked the connection
        feedback: A blocked connection times out or resets; this error appears before any packet is sent.
    correct: [client-side]
    hints:
      - Did the client send anything?
    solution: |
      The error is raised locally by the client's setup, so it says nothing about the server. Use a tool or
      build that can speak legacy versions (nmap `ssl-enum-ciphers`, testssl.sh, sslyze) and report the tool and
      its version with the result.

  - id: cr-398
    type: mcq
    concept: sec-crypto-transport
    skill: application
    title: How long may a certificate live?
    prompt: |
      A certificate was issued on 1 January 2026 and expires on 1 March 2027 (424 days). It uses a 2048-bit key
      and a SHA-256 signature, and the name matches. Which statement is correct under WSTG-CRYP-01?
    options:
      - id: too-long
        text: Finding - issued after 1 September 2020, it must not be valid for more than 398 days
        feedback: Correct - 424 days is over the limit the WSTG gives for certificates issued after that date.
      - id: ok
        text: No finding - the key and signature are strong
        feedback: Key and signature are separate checks; the validity period is its own rule.
      - id: old
        text: No finding - the 398-day limit applies only to wildcard certificates
        feedback: The limit is not specific to wildcards.
      - id: expired
        text: Finding - it has already expired
        feedback: It is valid until March 2027; the problem is its length.
    correct: [too-long]
    hints:
      - Look at the issue date as well as the length.
    solution: |
      Certificates issued after 1 September 2020 "must not have a maximum lifespan of more than 398 days" per
      WSTG-CRYP-01; 424 days breaks that, however strong the key and signature are.

  - id: cr-cleartext
    type: mcq
    concept: sec-crypto-transport
    skill: recognition
    title: A secure page with an insecure form
    prompt: |
      The sign-in page is served over https, but its form has `action="http://portal.sandpay.example/login"`.
      Is that a finding?
    options:
      - id: yes
        text: Yes - credentials are sent over an unencrypted channel (WSTG-CRYP-03 example 2), however the page was loaded
        feedback: Correct - where the form posts to is what protects the password.
      - id: no
        text: No - the page itself is https
        feedback: The channel that carries the password is the one the form posts to.
      - id: hsts
        text: Only if HSTS is missing
        feedback: HSTS helps, but a form that explicitly posts to http is a finding on its own.
      - id: cookie
        text: No - only cookies matter
        feedback: Credentials and session cookies both need protected channels.
    correct: [yes]
    hints:
      - What does the browser connect to when the form is submitted?
    solution: |
      WSTG-CRYP-03 lists form-based authentication performed over http as an example: the action attribute shows
      http. Check the form's action, not just the page's scheme.

  - id: cr-ui-hide
    type: mcq
    concept: sec-crypto-exposure
    skill: analysis
    title: "The screen only shows the name"
    prompt: |
      `GET /api/merchants/m_100` returns `id`, `name`, `api_secret` and `payout_iban`. The merchant page displays
      only the name. A developer says nothing is exposed. What is your answer?
    options:
      - id: exposed
        text: The response is what leaves the server - anyone who reads it (a proxy, a browser tool, a saved HAR file) gets the secret; this is API3 excessive data exposure
        feedback: Correct - hiding a field in the interface is not an access control.
      - id: fine
        text: It is fine - only the merchant's own session can call it
        feedback: The merchant may be allowed the endpoint but not every property - and the secret then travels in every response and every log of it.
      - id: cors
        text: It only matters if CORS is open
        feedback: Exposure does not depend on cross-origin access.
      - id: low
        text: Low risk - the secret is a test key
        feedback: Whether a key is a test key is a business fact to confirm, not an assumption; the exposure pattern is the finding.
    correct: [exposed]
    hints:
      - Where can the response be read besides the page?
    solution: |
      API3:2023: an endpoint is vulnerable if it exposes properties the caller should not read. The fix is to
      return only the contracted fields (an allow-list) and show secrets once at creation, then mask them.

  - id: cr-redact
    type: mcq
    concept: sec-crypto-exposure
    skill: application
    title: How to write the evidence
    prompt: |
      You found `"api_secret": "sk_test_shop_a_practice"` in a response. How do you record it in the ticket?
    options:
      - id: redacted
        text: "`api_secret` present in the response to `GET /api/merchants/m_100`: `sk_t...(23 chars)`"
        feedback: Correct - which field, which request, the prefix and the length. The owner can find and rotate it; nobody can use it.
      - id: full
        text: Paste the full key so the developers can search for it
        feedback: The ticket system becomes a second place the key leaks; the prefix and length are enough to find it.
      - id: screenshot
        text: Attach an unedited screenshot of the response
        feedback: A screenshot is a copy of the secret; blur or crop it, or redact the text first.
      - id: none
        text: Do not mention it, to avoid spreading it
        feedback: The finding must be reported; the way to avoid spreading the secret is redaction.
    correct: [redacted]
    hints:
      - What does the owner need to find it, and what would let someone else use it?
    solution: |
      Record the field, the request, a redacted sample (first four characters and the length) and tell the owner
      to rotate the key. Never put the whole secret in a ticket, chat message or screenshot.

  - id: cr-boom
    type: mcq
    concept: sec-crypto-exposure
    skill: analysis
    title: The error that prints a key
    prompt: |
      A forced error returns a stack trace whose last line is
      `RuntimeError: settlement batch failed; db=sqlite:///var/sandpay/portal.db key=sandpay-practice-only-jwt-key`.
      Which response is right?
    options:
      - id: both
        text: Report improper error handling (WSTG-ERRH-01) and the disclosed signing key - and the key must be rotated, not only hidden
        feedback: Correct - two findings, and a key that has appeared in a response is no longer secret.
      - id: handler
        text: Report only the verbose error - once the handler is fixed the problem is gone
        feedback: Fixing the handler stops the next leak; the key that already travelled must be replaced.
      - id: paths
        text: Report only the file paths - the key is a test value
        feedback: Assume a key in an error message is real until the owner says otherwise.
      - id: ignore
        text: Ignore it - errors are expected on forced inputs
        feedback: Errors are expected; what they reveal is the finding.
    correct: [both]
    hints:
      - What has to happen to a secret that has been disclosed?
    solution: |
      Report the verbose error (stack trace, paths, line numbers) and the key disclosure separately, tell the
      owner immediately, and recommend rotating the key as well as fixing the error handler.

  - id: cr-storage-order
    type: order
    concept: sec-crypto-password-storage
    skill: application
    title: Order the password storage review
    prompt: Put the steps of a password storage review in a safe order.
    items:
      - id: scope
        text: Agree scope, who may read stored values, and the evidence rules
      - id: read
        text: With the owner, read one stored value per account type
      - id: classify
        text: Classify each value by format - algorithm, salt, parameters
      - id: duplicates
        text: Count identical stored values across users (counts only)
      - id: known
        text: For a plain hash, hash a given test password and compare
      - id: report
        text: Report with redacted evidence against the current guidance, then re-test after the fix
    hints:
      - You cannot classify what you have not been allowed to read.
      - The re-test comes last.
    solution: |
      Scope and permission, read the values, classify by format, look for duplicates, check a known test
      password, then report and re-test. Nothing in the sequence recovers a real user's password.

  - id: cr-register-debug
    type: debug
    concept: sec-crypto-exposure
    skill: analysis
    title: Find the two weaknesses
    prompt: |
      This sign-up handler has two weaknesses that a hash audit and a log scan would find. Which lines?
    language: python
    code: |
      def register(email, password):
          logger.info("register email=%s password=%s", email, password)
          digest = hashlib.sha256(password.encode()).hexdigest()
          db.insert_user(email, digest)
          return {"status": "created", "email": email}
    correctLines: [2, 3]
    lineNotes:
      - line: 2
        note: The password goes into the log on the success path - a "password-in-log" finding (A09, CWE-532).
      - line: 3
        note: Plain SHA-256 is a fast, unsalted hash - the audit reports fast-hash and unsalted.
      - line: 4
        note: Storing the value is fine - the problem is what was stored.
      - line: 5
        note: The response contains only the email and a status - no secret.
    hints:
      - One line writes the secret somewhere it should not go; one line stores it in a form that is too weak.
    solution: |
      Line 2 logs the password; line 3 hashes it with a fast, unsalted function. Fix: never log the field, and
      use a password hashing scheme (Argon2id, scrypt, bcrypt, PBKDF2) with a unique salt.

  - id: cr-api-secret-short
    type: short
    concept: sec-crypto-exposure
    skill: analysis
    title: "It is only returned to the owner"
    prompt: |
      A developer says the merchant's `api_secret` in `GET /api/merchants/<id>` is fine because only the logged-in
      owner can call that endpoint. Answer them.
    modelAnswer: |
      Being allowed to call the endpoint is not the same as needing the property. Returning the secret on every
      read means it passes through every copy of the response: the browser's memory and developer tools, saved
      HAR files, proxies and support screen-shares, server and gateway logs of response bodies, and any script
      that runs in the page (an XSS flaw turns "only the owner" into "anyone"). It also puts a long-lived secret
      in places that are not protected like a secret. API3:2023 treats this as exposure of a sensitive property.
      The fix is to return an allow-listed set of fields, show the secret once when it is created, and
      afterwards return a masked value such as the last four characters; if the secret has been returned for a
      long time, rotate it.
    rubric:
      - Separates "may call the endpoint" from "needs this property".
      - Names at least two places a response body is copied or exposed (logs, HAR files, proxies, XSS).
      - Gives the fix - an allow-list, show once, mask afterwards.
      - Mentions rotation of a secret that has already been exposed.
    hints:
      - Where is a response copied after it leaves the server?
      - What would an XSS flaw on the page do with it?
    solution: |
      Access to the endpoint does not justify returning every property: responses are copied into logs, proxies,
      HAR files and scripts. Return an allow-list, show the secret once and mask it afterwards, and rotate it.

  - id: cr-retest-design
    type: testdesign
    concept: sec-crypto-password-storage
    skill: application
    title: Plan the re-test of four fixes
    prompt: |
      SandPay says `weak-hash`, `data-exposure`, `verbose-errors` and `secret-logging` are fixed, and the TLS
      certificate was renewed. Design the re-test: for each case give preconditions, steps, expected result and
      evidence. Include at least one case that could find a **new** problem caused by the fixes, and say how
      evidence will be handled.
    modelAnswer: |
      Preconditions for all: written scope; the fixed build on the test host; test accounts alice and bob; the
      owner's permission to read the user table and the log; a redaction rule (first 4 characters and length).

      1. **New-account storage** - steps: register a test account, read its stored value. Expected: salted,
         slow scheme at current minimums. Evidence: scheme and parameters.
      2. **Existing rows (new risk from the migration)** - steps: classify every stored value, count by format.
         Expected: no 32-character values remain, or a re-hash at next login is demonstrated. Evidence: counts by
         format. On a build that only fixed new registrations this finds old unsalted rows.
      3. **Shared values** - steps: `audit_hashes` over the table. Expected: no shared stored values. Evidence:
         group count only.
      4. **Response fields** - steps: `GET` the merchant record as alice; compare with the contract. Expected: only
         `id`, `name`, `payout_iban_last4`. Evidence: field names and a redacted sample.
      5. **Errors** - steps: force an error and malformed JSON on two endpoints. Expected: a generic message and a
         `reference`; no trace, path or key. Evidence: status and body shape.
      6. **Logs (new risk from the error fix)** - steps: one success, one failure, one forced error, then scan the
         new log lines. Expected: no password, token, key or request body with secrets. Evidence: scan result.
      7. **Certificate and protocols** - steps: scan the renewed certificate for key, signature, validity, SAN
         for every host name in use (including the mobile app's), and the accepted versions with a tool that can
         try legacy ones. Expected: 2048 bits or more, SHA-256 or better, at most 398 days, names match, no
         legacy versions. Evidence: scanner output and version.
      8. **Negative control** - steps: run the scans against the vulnerable build. Expected: each finding code
         appears, proving the checks can detect the flaws.
      9. **Evidence hygiene** - steps: a second reader checks the report. Expected: no whole secret.
    rubric:
      - Each case has preconditions, steps, an expected result and concrete evidence.
      - Checks existing stored values after the hash fix, not only a new account.
      - Re-tests logs and errors together, since one fix can change the other.
      - Covers the renewed certificate for every host name and a legacy-capable protocol scan.
      - Includes a negative control and a redaction rule.
    hints:
      - What about the rows that existed before the fix?
      - Which fix changed what the logs contain?
    solution: |
      Re-test each fix with evidence, add the side effects (old rows, logs after the error fix), cover the
      renewed certificate and legacy protocols, prove the checks with a negative control and keep every secret
      redacted.

  - id: cr-interview-data
    type: interview
    concept: sec-crypto-exposure
    skill: analysis
    title: "Interview: how would you test that sensitive data is protected?"
    prompt: |
      "We handle merchant API keys, payout account numbers and passwords in a web portal and a mobile app. How
      would you test that this data is protected?"
    modelAnswer: |
      First scope and evidence rules: written permission, which hosts, who may give me stored values and logs,
      and that I redact any secret I find and report a real one at once. Then I map the sensitive data and take
      it by place. At rest: with the owner, I read the stored password format and check it is a slow, salted
      scheme at current minimums (Argon2id, bcrypt, PBKDF2 with 600,000 iterations), look for identical values
      across users and for old rows after any migration - I never crack real hashes; hashing a given test
      password is enough. In transit: a TLS scan with a tool that can really try legacy versions, because a
      client that cannot speak TLS 1.0 gives false negatives; certificate key size, signature, validity of at
      most 398 days and a SAN for every name clients use, including the mobile app's; credentials never over
      http, `Secure` cookies and HSTS. In what the system says: I compare API responses with the contract and
      with what the screen needs (excessive data exposure), force errors to look for stack traces and keys, and
      read logs on success, failure and error paths for passwords, tokens and keys. I report with redacted
      evidence - first characters and length - rotate anything real that appeared, and re-test everything after
      the fixes, because they change each other.
    rubric:
      - Starts with scope, permission and evidence handling (redaction, who to tell).
      - Covers storage (format, salt, work factor, duplicates, legacy rows) without cracking real users.
      - Covers transport (protocol versions with a capable tool, certificate, cleartext channels).
      - Covers responses, errors and logs, and the mobile client.
      - Mentions rotation of exposed secrets and a re-test.
    followUps:
      - A scanner says TLS 1.0 is not supported but you doubt it. What do you do?
      - The developers say the hash is "SHA-256, so it is secure". What is your reply?
      - How do you test for secrets in logs in production without reading customer data?
    hints:
      - Structure it by place - at rest, in transit, in what the system says - then add evidence handling.
    solution: |
      Scope and evidence rules first; then storage by format without cracking, TLS with a capable client and
      the certificate checks, cleartext channels, responses against the contract, forced errors, logs on every
      path; redact, rotate and re-test.

  - id: cr-hash-code
    type: coding
    concept: sec-crypto-password-storage
    skill: application
    title: Read stored password hashes
    prompt: |
      In `practice/security/exercises/web/crypto_hash_audit.py`, implement `classify_hash` and `audit_hashes`.
      The docstring lists the formats and the finding codes. The tests run them on known values, on the vulnerable
      portal (unsalted MD5, no false positive for a shared value among different passwords) and on the portal with
      `weak-hash` fixed (nothing to report).
    project: security
    files: [exercises/web/crypto_hash_audit.py]
    test: tests/web/test_crypto_hash_audit.py
    command: .venv/bin/python -m pytest tests/web/test_crypto_hash_audit.py
    modelAnswer: |
      ```python
      if _HEX.match(stored) and len(stored) in _FAST:
          return {"algorithm": _FAST[len(stored)], "salted": False, "slow": False,
                  "findings": ["fast-hash", "unsalted"]}
      if stored.startswith("pbkdf2_sha256$"):
          _, iterations, salt_hex, digest = stored.split("$")
          if int(iterations) < MIN_PBKDF2_ITERATIONS: findings.add("low-iterations")
          if len(salt_hex) // 2 < MIN_SALT_BYTES: findings.add("short-salt")
          return {"algorithm": "pbkdf2-sha256", "salted": True, "slow": not findings, ...}
      ```

      `audit_hashes` classifies every user and groups users by identical stored value, keeping groups of two or
      more, all sorted.
    rubric:
      - Every test in tests/web/test_crypto_hash_audit.py passes.
      - Decides by format and never tries a password.
      - A PBKDF2 value is slow only when iterations and salt both meet the minimums.
      - Identical stored values are reported as shared groups; different PBKDF2 values for the same password are not.
    hints:
      - Hex length tells you MD5, SHA-1 or SHA-256.
      - Split the PBKDF2 value on "$" and check there are exactly four parts of the right kind.
      - Group users in a dictionary keyed by the stored value.
    solution: |
      Classify by format (hex length, pbkdf2 parts, bcrypt and argon2 prefixes), apply the minimum iterations
      and salt length, and group users with identical stored values.

  - id: cr-tls-code
    type: coding
    concept: sec-crypto-transport
    skill: application
    title: Check a certificate and a TLS service
    prompt: |
      In `practice/security/exercises/web/crypto_tls_check.py`, implement `check_certificate`,
      `supported_tls_versions` and `audit_protocols`. The probe must refuse any host but loopback **before** it
      opens a socket. The tests run it against three local TLS servers (TLS 1.2 and 1.3, 1.2 only, 1.3 only), a
      closed port and the local certificate, and check the certificate rules on synthetic facts.
    project: security
    files: [exercises/web/crypto_tls_check.py]
    test: tests/web/test_crypto_tls_check.py
    command: .venv/bin/python -m pytest tests/web/test_crypto_tls_check.py
    modelAnswer: |
      ```python
      if host not in LOOPBACK:
          raise ValueError("this probe only talks to the loopback interface")
      for name in MODERN:
          context = ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT)
          context.minimum_version = context.maximum_version = _VERSIONS[name]
          context.load_verify_locations(cafile)
          try:
              with socket.create_connection((host, port), timeout=timeout) as raw:
                  with context.wrap_socket(raw, server_hostname=host) as tls:
                      if tls.version() == name:
                          accepted.append(name)
          except (ssl.SSLError, OSError):
              continue
      ```

      `check_certificate` applies the key, signature, validity, 398-day and SAN rules; `audit_protocols` flags
      legacy versions and an empty modern set.
    rubric:
      - Every test in tests/web/test_crypto_tls_check.py passes.
      - No socket is opened for a non-loopback host.
      - Each probe pins one TLS version (minimum equals maximum) and keeps certificate and host name checks on.
      - A closed port gives an empty list, and an empty list is reported as "no-modern-protocol", not as a pass.
      - The host name is matched against the SAN only, with a wildcard covering one label.
    hints:
      - Validate the host first, then loop over the versions.
      - ssl.SSLError is a subclass of OSError; a refused handshake is "not accepted", not a crash.
      - A wildcard "*.example" matches exactly one label to the left.
    solution: |
      Guard the host, pin one version per handshake with the fixture's certificate as the only trust anchor,
      treat any failure as "not accepted", and implement the certificate rules from WSTG-CRYP-01 on the facts.

  - id: cr-exposure-code
    type: coding
    concept: sec-crypto-exposure
    skill: application
    title: Find secrets without copying them
    prompt: |
      In `practice/security/exercises/web/crypto_exposure_scan.py`, implement `find_secrets`, `excess_fields` and
      `scan_portal`. The scanner must return redacted samples (first 4 characters, `...` and the length) and never
      a whole secret. The tests run it against the vulnerable portal (all three channels leak), against each
      single fix (only that channel goes quiet) and against the fully fixed portal (nothing).
    project: security
    files: [exercises/web/crypto_exposure_scan.py]
    test: tests/web/test_crypto_exposure_scan.py
    command: .venv/bin/python -m pytest tests/web/test_crypto_exposure_scan.py
    modelAnswer: |
      ```python
      _PATTERNS = {
          "api-key": (re.compile(r"\bsk_[a-z]+_[A-Za-z0-9_]+"), 0),
          "password-in-log": (re.compile(r"\bpassword=(\S+)"), 1),
          "secret-assignment": (re.compile(r"\b(?:key|secret|token)=(\S+)"), 1),
          "stack-trace": (re.compile(r"Traceback \(most recent call last\)"), 0),
          "iban": (re.compile(r"\b[A-Z]{2}\d{2}(?: ?[A-Z0-9]{4}){2,7}\b"), 0),
      }

      def _redact(secret): return f"{secret[:4]}...({len(secret)} chars)"
      ```

      `find_secrets` runs every pattern, redacts the secret group and sorts by kind then sample;
      `excess_fields` is a set difference; `scan_portal` checks loopback, fetches `/api/me`, the merchant record
      and `/boom` (any status) and scans each text and the log lines.
    rubric:
      - Every test in tests/web/test_crypto_exposure_scan.py passes.
      - No whole secret appears anywhere in the result.
      - For `password=` and `key=` the secret is the value after the equals sign.
      - Each single fix silences only its own channel, and the fully fixed portal gives empty lists.
      - Nothing is sent before the base URL is confirmed as loopback.
    hints:
      - Use a capture group where only the value is the secret, and group 0 otherwise.
      - Sorting by the pair (kind, sample) keeps the output stable.
      - /boom returns 500 - do not call raise_for_status on it.
    solution: |
      One pattern per kind, redact at the source, sort the results, compare field sets, and have the portal
      scanner guard the URL, fetch the three texts and return the findings per channel.

placement:
  - id: cr-place-storage
    type: mcq
    concept: sec-crypto-password-storage
    skill: analysis
    title: Which stored value is acceptable?
    prompt: |
      Which stored password value meets the current Password Storage Cheat Sheet and SP 800-63B-4?
    options:
      - id: pbkdf2
        text: "`pbkdf2_sha256$600000$<16 random bytes in hex>$<hash>`"
        feedback: Correct - a salted adaptive scheme at 600,000 iterations with a long random salt.
      - id: sha256
        text: A 64-character hex SHA-256 digest of the password
        feedback: Fast and unsalted - not suitable for password storage.
      - id: md5salt
        text: "`md5(salt + password)` with a different salt per user"
        feedback: Salted, but MD5 is still fast - it gives no work factor.
      - id: pbkdf2-low
        text: "`pbkdf2_sha256$1000$<hash>` with a 1-byte salt"
        feedback: Too few iterations and a salt under 32 bits.
    correct: [pbkdf2]
    solution: |
      A password hashing scheme (PBKDF2, bcrypt, Argon2id, scrypt) with a unique random salt and parameters at or
      above the current minimums.

  - id: cr-place-transport
    type: mcq
    concept: sec-crypto-transport
    skill: analysis
    title: Read the TLS scan
    prompt: |
      A scanner run from a modern laptop reports "TLS 1.0: not supported" and "TLS 1.1: not supported" for the
      payment host. The scanner's own documentation says it relies on the system OpenSSL. What do you report?
    options:
      - id: inconclusive
        text: Inconclusive - the client may be unable to speak those versions; repeat with a legacy-capable tool
        feedback: Correct - a client limit and a server refusal produce the same words.
      - id: pass
        text: Pass - both legacy versions are refused
        feedback: That is the false negative the WSTG warns about when the client itself lacks the versions.
      - id: fail
        text: Fail - TLS 1.0 and 1.1 are not supported, which is a problem
        feedback: Not supporting them is the desired outcome; the issue is whether the result is trustworthy.
      - id: cert
        text: Check the certificate instead, since protocol versions do not matter
        feedback: Protocol versions are one of WSTG-CRYP-01's main areas.
    correct: [inconclusive]
    solution: |
      Without proof that the client can try TLS 1.0 and 1.1, "not supported" is not a result. Use a tool or
      build that can, and name it and its version in the report.

  - id: cr-place-exposure
    type: mcq
    concept: sec-crypto-exposure
    skill: application
    title: What goes in the log?
    prompt: |
      Which log line is acceptable under the Logging Cheat Sheet's "Data to exclude" list?
    options:
      - id: email-only
        text: "`login attempt email=alice@shop-a.example result=failed`"
        feedback: Correct - the event and the account, no password, token or key (an email is non-sensitive personal data that may still need care).
      - id: password
        text: "`login attempt email=alice@shop-a.example password=alice-pass-1`"
        feedback: Authentication passwords must not be logged.
      - id: token
        text: "`request authorised with Bearer eyJ...<full token>`"
        feedback: Access tokens should be removed, masked or hashed.
      - id: conn
        text: "`connected to sqlite:///var/sandpay/portal.db key=sandpay-practice-only-jwt-key`"
        feedback: Connection strings and keys are on the exclusion list.
    correct: [email-only]
    solution: |
      Log the event and the account identifier; never passwords, tokens, keys, connection strings or card data.

recall:
  - id: cr-recall-hash
    concept: sec-crypto-password-storage
    prompt: How do you prove a portal stores unsalted MD5 without cracking anyone's password?
    answer: By format (32 hex characters), by identical stored values for different users, and by hashing a password you were given for a test account with MD5 and showing it equals the stored value.
  - id: cr-recall-minimums
    concept: sec-crypto-password-storage
    prompt: State the cheat sheet's minimums for Argon2id, bcrypt and PBKDF2, and NIST's salt rule.
    answer: Argon2id 19 MiB, 2 iterations, 1 parallelism; bcrypt work factor 10 or more (72-byte limit); PBKDF2-HMAC-SHA256 600,000 or more. NIST SP 800-63B-4 - salted and hashed, salt at least 32 bits, salt and hash stored.
  - id: cr-recall-tls
    concept: sec-crypto-transport
    prompt: Which TLS versions are legacy, and why is "no protocols available" not a result?
    answer: SSLv2, SSLv3, TLS 1.0 and TLS 1.1 (RFC 8996 deprecates 1.0 and 1.1). The message came from a client that cannot speak the version, so it says nothing about the server; use a legacy-capable tool.
  - id: cr-recall-cert
    concept: sec-crypto-transport
    prompt: List the WSTG-CRYP-01 certificate checks.
    answer: Key at least 2048 bits; signature at least SHA-256 (not MD5 or SHA-1); within its validity period; at most 398 days if issued after 1 September 2020; trusted CA; a SAN that matches the host name (the CN is ignored).
  - id: cr-recall-exposure
    concept: sec-crypto-exposure
    prompt: Where do you look for sensitive data leaving the application, and what is the evidence rule?
    answer: API responses (compare with the contract - API3), error pages (WSTG-ERRH-01) and logs (A09, CWE-532). Evidence is redacted - the first characters and the length - never the whole secret; rotate anything real.
  - id: cr-recall-logs
    concept: sec-crypto-exposure
    prompt: What does the Logging Cheat Sheet say should not be recorded directly in logs?
    answer: Session identifiers, access tokens, authentication passwords, database connection strings, encryption keys and primary secrets, bank account or card holder data, sensitive personal data - remove, mask, sanitise, hash or encrypt them.

