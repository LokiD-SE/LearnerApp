id: testing-cryptography-and-data-exposure
title: Testing cryptography and sensitive data exposure
subject: security-testing
module: web-vulnerabilities
level: advanced
status: published
estimatedMinutes: 150
summary: Test how a web application protects data at rest, in transit and in what it says - read stored password hashes by their format instead of cracking them, check a TLS service and its certificate against a local server, and find secrets in API responses, error pages and logs with a scanner that never copies a whole secret into your report - all against a deliberately vulnerable SandPay portal on your own machine.
