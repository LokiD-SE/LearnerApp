  ]

environment: |
  - **Runtime:** Python 3.12.3 in `practice/security/.venv` with pytest 9.2.0 and requests 2.34.2, curl 8.5.0 and
    `openssl` 3.0.13 (the same OpenSSL library Python reports) on Linux. Every output in this lesson was
    printed by the code and commands shown, run on 20 November 2026 against the practice portal and a local TLS
    server. **Timings depend on the machine**: the figures for MD5 and PBKDF2 differ on yours, but the ratio
    between them is large enough to show up anywhere. The stored PBKDF2 values and the error `reference` change
    on every run because each uses a fresh random value; the stack trace shows the file path of this
    machine, which the lesson shortens to `.../support/sandpay_vuln.py`.
  - **Practice target:** `practice/security/support/sandpay_vuln.py`, a **deliberately vulnerable** SandPay
    merchant portal that binds to `127.0.0.1` only. This lesson uses its `weak-hash`, `data-exposure`,
    `verbose-errors` and `secret-logging` flaws; `make_app({...})` builds the same portal with those flaws
    fixed (the fixed portal stores PBKDF2-SHA256 with 600,000 iterations and a random salt, returns only
    `payout_iban_last4`, answers errors with a bare `reference`, and never writes the password to its log).
    `practice/security/support/crypto_fixture.py` adds a throw-away **local TLS server** (variants `modern`,
    `tls12`, `tls13`) with a self-signed 2048-bit RSA certificate for `localhost` and `127.0.0.1`. SandPay, its
    merchants, passwords and keys are fictional.
  - **Ethics:** test only systems you own or have **written permission** to test, inside the agreed scope.
    Reading a stored hash needs the owner's explicit permission and a plan for the evidence: **never crack real
    users' passwords, never copy whole secrets into a report, and never publish what you found**. The probes in
    this lesson refuse any host but loopback, and the TLS probe never leaves this machine.
  - **Testing guide:** OWASP Web Security Testing Guide v4.2 (the current stable release), as read on GitHub on
    20 November 2026:
    [WSTG-CRYP-01 Weak Transport Layer Security](https://github.com/OWASP/wstg/blob/v4.2/document/4-Web_Application_Security_Testing/09-Testing_for_Weak_Cryptography/01-Testing_for_Weak_Transport_Layer_Security.md),
    [WSTG-CRYP-03 Sensitive Information Sent via Unencrypted Channels](https://github.com/OWASP/wstg/blob/v4.2/document/4-Web_Application_Security_Testing/09-Testing_for_Weak_Cryptography/03-Testing_for_Sensitive_Information_Sent_via_Unencrypted_Channels.md),
    [WSTG-CRYP-04 Weak Encryption](https://github.com/OWASP/wstg/blob/v4.2/document/4-Web_Application_Security_Testing/09-Testing_for_Weak_Cryptography/04-Testing_for_Weak_Encryption.md)
    and [WSTG-ERRH-01 Improper Error Handling](https://github.com/OWASP/wstg/blob/v4.2/document/4-Web_Application_Security_Testing/08-Testing_for_Error_Handling/01-Testing_For_Improper_Error_Handling.md).
    WSTG-CRYP-02 (padding oracle) is not covered. Quotations are from those pages. WSTG-CRYP-04 suggests PBKDF2
    iterations "over 10000" and cites NIST's old minimum of 10,000; this lesson uses the newer figure in the
    Password Storage Cheat Sheet and says where the two differ.
  - **Risk lists:** [OWASP Top 10:2021 A02 Cryptographic
    Failures](https://owasp.org/Top10/2021/A02_2021-Cryptographic_Failures/) and [A09 Security Logging and
    Monitoring Failures](https://owasp.org/Top10/2021/A09_2021-Security_Logging_and_Monitoring_Failures/)
    (CWE-532 Insertion of Sensitive Information into Log File), and the [OWASP API Security Top 10:2023
    API3](https://github.com/OWASP/API-Security/blob/master/editions/2023/en/0xa3-broken-object-property-level-authorization.md)
    Broken Object Property Level Authorization, which absorbed "Excessive Data Exposure".
  - **Cheat sheets (OWASP Cheat Sheet Series, as documented on 20 November 2026):** [Password
    Storage](https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html) (Argon2id minimums,
    scrypt, bcrypt, PBKDF2 with 600,000 iterations, salting, peppering, work factors),
    [Cryptographic Storage](https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html)
    and [Logging](https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html) (its "Data to exclude"
    list).
  - **Standards:** NIST [SP 800-63B-4](https://pages.nist.gov/800-63-4/sp800-63b.html) (page dated 26 August
    2025 when read): passwords "SHALL be salted and hashed using a suitable password hashing scheme", the salt
    "at least 32 bits"; [RFC 8996](https://www.rfc-editor.org/rfc/rfc8996.html) (deprecates TLS 1.0 and 1.1) and
    [RFC 8446](https://www.rfc-editor.org/rfc/rfc8446.html) (TLS 1.3). Tools not run here (nmap scripts,
    testssl.sh, sslyze, SSL Labs) are named from the WSTG page and labelled "from the docs, not run here".
  - **Not repeated here:** logins, throttling and password rules - [Testing
    authentication](#/lesson/testing-authentication); how a developer stores passwords and tokens - [Passwords,
    OAuth and OIDC](#/lesson/passwords-oauth-and-oidc); security headers and defaults - [Testing for security
    misconfiguration](#/lesson/testing-security-misconfiguration); object properties in requests - [Testing mass
    assignment and excessive data exposure](#/lesson/testing-mass-assignment-and-data-exposure); signed tokens -
    [Testing JWTs and OAuth 2.0](#/lesson/testing-jwt-and-oauth). Card data rules are in [PCI DSS
    awareness](#/lesson/pci-dss-awareness); the portal's synthetic data contains no real card numbers.

