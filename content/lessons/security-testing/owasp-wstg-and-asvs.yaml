id: owasp-wstg-and-asvs
title: The OWASP testing guide and ASVS
subject: security-testing
module: security-foundations
level: intermediate
status: published
estimatedMinutes: 150
summary: Use the OWASP Web Security Testing Guide (WSTG) as the method - how to test - and the Application Security Verification Standard (ASVS) as the requirements - what must be true - with the Top 10 kept for awareness. Read their real structure (WSTG v4.2's 97 tests in 12 categories, ASVS 5.0.0's 345 requirements in 17 chapters and three levels), cite requirements with versioned references, turn them into a test plan for a chosen level, run tagged checks against the SandPay practice portal and fill in the WSTG checklist honestly - including the gaps the guide does not cover and the checks that crashed. Every output shown was produced by the code shown.
tags:
  [
    OWASP,
    WSTG,
    Web Security Testing Guide,
    ASVS,
    Application Security Verification Standard,
    ASVS 5.0.0,
    WSTG v4.2,
    OWASP Top 10,
    Top 10 2025,
    security requirements,
    verification levels,
    test plan,
    testing checklist,
