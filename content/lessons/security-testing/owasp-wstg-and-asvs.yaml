    security testing methodology,
    penetration testing,
    black box testing,
    Content-Security-Policy,
    error handling,
    HSTS,
    scope,
    security testing,
  ]

environment: |
  - **Runtime:** Python 3.12.3 in `practice/security/.venv` with pytest 9.2.0 and requests 2.34.2. Every output in
    this lesson was printed by the code shown, run on Linux on 19 November 2026, against
    `support/sandpay_vuln.py` - a **deliberately vulnerable** SandPay portal that binds to `127.0.0.1` only. The
    code run is the reference solutions of this lesson's exercises: `practice/security/solutions/foundations/`
    `wstg_checklist.py`, `wstg_plan.py` and `wstg_runner.py`.
  - **Ethics and scope:** test only systems you own or have written permission to test, and only inside the
    agreed scope. Everything here runs against the local practice portal and never leaves the machine.
  - **Synthetic data:** SandPay is a fictional payments company; the portal's merchants (`m_100`, `m_200`),
    payments, passwords and keys are invented for practice.
  - **OWASP Web Security Testing Guide (WSTG)**, as documented on 19 November 2026: the
    [project page](https://owasp.org/www-project-web-security-testing-guide/) names **v4.2** as the versioned
    release ([web version](https://wstg.owasp.org/v4.2/)) and says "We are
    currently developing release version 5.0". Quotations and the checklist are from the
    [v4.2 tag](https://github.com/OWASP/wstg/tree/v4.2) of github.com/OWASP/wstg (released 3 December 2020):
    `checklist/Testing_Checklist.md`, 4.0 Introduction and Objectives, WSTG-INFO-02, WSTG-CONF-07,
    WSTG-CLNT-04, WSTG-ERRH-01/02, 3 The Web Security Testing Framework, Penetration Testing Methodologies and
    5 Reporting. Test ids in the development version ([latest](https://wstg.owasp.org/latest/),
    `checklists/checklist.json` on the `master` branch) are quoted as "development, not a release" and may
    change before v5.0 ships.
  - **OWASP ASVS 5.0.0** (released 30 May 2025, tag
    [`v5.0.0_release`](https://github.com/OWASP/ASVS/tree/v5.0.0_release/5.0)): chapters "What is the ASVS?"
    (scope, levels, "How to Reference ASVS Requirements") and the requirement list
    `OWASP_Application_Security_Verification_Standard_5.0.0_en.csv` (counts in this lesson were computed from that
    file). Requirement texts are quoted from it. Project page:
    [owasp.org/www-project-application-security-verification-standard](https://owasp.org/www-project-application-security-verification-standard/).
  - **OWASP Top 10:** [2025](https://owasp.org/Top10/2025/) is the current release; the use-case table and
    "primarily an awareness document" are quoted from the 2021 edition's page
    [How to use the OWASP Top 10 as a standard](https://owasp.org/Top10/2021/A00_2021_How_to_use_the_OWASP_Top_10_as_a_standard/).
    The practice portal's own flaw table cites 2021 categories; this lesson maps to 2025.
  - **RFC 6797** (HTTP Strict Transport Security), section 7.2, from
    [rfc-editor.org](https://www.rfc-editor.org/rfc/rfc6797).
  - The flaw-to-WSTG-to-ASVS mapping in `support/wstg_fixture.py` is this lesson's judgement, not an OWASP
    mapping. The WSTG and ASVS texts are CC BY-SA 4.0.
  - **Not repeated here:** what each vulnerability is and how to exploit it - the web vulnerability lessons from
    [Testing authentication](#/lesson/testing-authentication) on; header and cookie details -
    [HTTP security for testers](#/lesson/http-security-for-testers); the Top 10 from a developer's side -
    [The OWASP Top 10 for developers](#/lesson/owasp-top-10-for-developers).

prerequisites:
  - security-testing-fundamentals
  - threat-modelling-stride

concepts:
  - id: sec-wstg-methodology
    name: The WSTG as a testing method
    summary: The OWASP Web Security Testing Guide says how to test a web application. Version 4.2 (the current release; 5.0 is in development) groups 97 tests into 12 categories, each with a stable id such as WSTG-ATHZ-04, a summary, test objectives and how to test. Its method is black box, split into passive testing (understanding the application, mapping entry points) and active testing (the category tests). Its checklist table, with Status values like Pass, Fail and N/A, is how a team records progress - and a test still empty is not tested, not passed.
  - id: sec-asvs-requirements
    name: ASVS as verifiable requirements
    summary: The OWASP Application Security Verification Standard says what must be true. Version 5.0.0 has 345 requirements in 17 chapters, each verifiable with a pass or fail decision, and three cumulative levels - L1 (about 20%, the first layer of defence), L2 (L1 plus about 50% more, what most applications should aim for) and L3 (the rest, defence in depth). Requirement ids are chapter.section.requirement and change between major versions, so documents cite them as v5.0.0-8.2.2. Some requirements are documentation requirements that can only be verified with access to the team's decisions.
  - id: sec-wstg-asvs-test-plan
    name: From Top 10, ASVS and WSTG to a test plan and coverage
    summary: The Top 10 is an awareness document - a starting point, never a standard to claim. A plan starts from the written scope, picks an ASVS level, keeps the requirements in scope, maps each to WSTG tests and adds your own tests where the guide has none (v4.2 has no JWT or mass-assignment test). Each check returns pass or fail with evidence; a check that crashed is an error, not a pass; results go into the checklist and the report with both the WSTG id and the versioned ASVS reference, and coverage is reported per category, including what was not tested.

objectives:
  - Explain the different jobs of the OWASP Top 10 (awareness), the WSTG (testing method) and ASVS (verifiable requirements), and choose which to use for a given request.
  - Read a WSTG test id and an ASVS requirement id, and cite ASVS requirements with versioned references such as v5.0.0-8.2.2.
  - Choose an ASVS level for an application and list the requirements in and out of scope at that level.
  - Map application flaws to WSTG tests and ASVS requirements, and identify gaps that need your own tests.
  - Write a parser and coverage report for the WSTG checklist that treats untested items honestly.
  - Run checks tagged with WSTG and ASVS references against a local target, record pass, fail or error with evidence, and fill in the checklist.

sections:
  - id: intuition
    kind: intuition
    concepts: [sec-wstg-methodology, sec-asvs-requirements, sec-wstg-asvs-test-plan]
    title: The idea in plain language
    body: |
      SandPay is about to open its merchant portal to the public, and you are asked to "security test it". Three
      OWASP documents will be on the table, and they do three different jobs - like the documents around a new
      building:

      - The **OWASP Top 10** is the poster on the wall listing the most common causes of fires. Everyone should
        know it, but nobody inspects a building against a poster.
      - **ASVS** (Application Security Verification Standard) is the **building code**: requirements written so
        that an inspector can say pass or fail - "the session cookie has `HttpOnly`", "queries are
        parameterized". It comes in three levels, like codes for a shed, a house and a hospital.
      - The **WSTG** (Web Security Testing Guide) is the **inspector's manual**: for each kind of check, how to do
        it - which requests to send, what to look for, which tools help.

      A competent inspection uses the code to decide **what** must be true, the manual to decide **how** to check
      it, and writes down for every item whether it passed, failed or was not inspected yet. That last column
      matters: "we found nothing" from an inspector who only looked at half the rooms says very little.

      This lesson reads the real documents - WSTG v4.2's checklist and ASVS 5.0.0's requirement list - and builds
      that inspection for the SandPay portal: a plan for a chosen level, checks tagged with both references, and a
      checklist that shows pass, fail, error and not tested honestly.

  - id: what
    kind: what
    concepts: [sec-wstg-methodology, sec-asvs-requirements, sec-wstg-asvs-test-plan]
    title: Terms you need
    body: |
      | Term | Meaning | Example |
      | --- | --- | --- |
      | **OWASP** | the Open Worldwide Application Security Project, a non-profit that publishes free security guides | - |
      | **Top 10** | a ranked list of the most critical web application security risk categories, from contributed data | A01:2025 Broken Access Control |
      | **WSTG** | Web Security Testing Guide - the testing method: what to test and how | v4.2 (released), 5.0 (in development) |
      | **Category** | a group of WSTG tests | WSTG-ATHZ (Authorization Testing) |
      | **Test id** | `WSTG-<category>-<number>`, one test in the guide | WSTG-ATHZ-04 Testing for Insecure Direct Object References |
      | **Test objectives** | what a WSTG test must establish | WSTG-INFO-02 - "Determine the version and type of a running web server" |
      | **Passive / active testing** | understanding the application as a user and mapping entry points, then attacking it with the category tests | - |
      | **Checklist** | the WSTG's table of every test with a Status and Notes column | `checklist/Testing_Checklist.md` |
      | **ASVS** | Application Security Verification Standard - verifiable security requirements | 5.0.0 (May 2025) |
      | **Requirement** | one statement that must be true, decided pass or fail | 8.2.2 - data-specific access restricted, against IDOR and BOLA |
      | **Chapter / section** | the first two parts of an ASVS id | chapter V8 Authorization, section 8.2 General Authorization Design |
      | **Level** | L1, L2 or L3; each level includes the ones below it | an L2 application meets every L1 and L2 requirement |
      | **Versioned reference** | ASVS's recommended citation, `v<version>-<id>` | `v5.0.0-8.2.2` |
      | **Documentation requirement** | an ASVS requirement that the team's decisions are written down; verified by reading them | 6.1.1 - how rate limiting defends against credential stuffing |
      | **Coverage** | how much of the plan has a result, per category | WSTG-ATHZ - 2 of 4 tests done |
      | **Gap** | a risk in scope with no matching test in the guide; you write your own | JWT `alg: none` has no WSTG v4.2 test |

  - id: why
    kind: why
    concepts: [sec-wstg-asvs-test-plan, sec-asvs-requirements]
    title: Why not just "test for the Top 10"?
    body: |
      Because the Top 10's own authors say not to. The 2021 edition's page on using it as a standard begins: "The
      OWASP Top 10 is primarily an awareness document." It continues: "If you want to use the OWASP Top 10 as a
      coding or testing standard, know that it is the bare minimum and just a starting point. One of the
      difficulties of using the OWASP Top 10 as a standard is that we document AppSec risks, and not necessarily
      easily testable issues." Its use-case table rates the Top 10 "Bare minimum" for penetration testing and
      ASVS "Yes", and it ends: "OWASP discourages any claims of full coverage of the OWASP Top 10, because it's
      simply untrue."

      So "test it for the Top 10" produces three problems a tester then owns:

      1. **No pass/fail line.** "A01 Broken Access Control" is a family of 40 weaknesses in 2025. Which ones did
         you check, and what counts as passing? ASVS answers with requirements that are, in its words, verifiable:
         "the verification must result in a 'fail' or 'pass' decision."
      2. **No repeatable method.** Two testers "doing the Top 10" test different things. The WSTG's stated aim is a
         methodology that is "Consistent", "Reproducible", "Rigorous" and "Under quality control", and its
         framework chapter is blunt about relying on skill alone: penetration testing "is generally inefficient
         at finding bugs and relies excessively on the skill of the tester."
      3. **No honest coverage.** Without a list of what was planned, "no findings" cannot be told apart from "not
         looked at". A checklist with a status per test makes the difference visible.

      ASVS itself draws the line between the two OWASP documents in its scope section: "Verifiers may have a
      question 'how do I test this requirement in this environment,' and this should be covered by the Web
      Security Testing Guide project." Requirements from ASVS, method from the WSTG, awareness from the Top 10.

  - id: internals-wstg
    kind: internals
    concepts: [sec-wstg-methodology]
    title: Inside the WSTG - versions, categories, test pages and the checklist
    body: |
      **Versions.** The project page lists **v4.2** as the versioned release (December 2020) and says "We are
      currently developing release version 5.0". Use v4.2 ids in reports - they are stable - and read the
      development version ("latest") for newer techniques, citing it as development content.

      **Method.** WSTG 4.0 Introduction: "The OWASP Web Application Security Testing method is based on the black
      box approach. The tester knows nothing or has very little information about the application to be tested."
      Testing is **passive** - "a tester tries to understand the application's logic and explores the application
      as a user", ending with an understanding of "all the access points" - then **active**, the category tests.

      **Categories.** Counted from the v4.2 checklist with this lesson's parser:

      | Category | Name | Tests |
      | --- | --- | --- |
      | WSTG-INFO | Information Gathering | 10 |
      | WSTG-CONF | Configuration and Deployment Management Testing | 11 |
      | WSTG-IDNT | Identity Management Testing | 5 |
      | WSTG-ATHN | Authentication Testing | 10 |
      | WSTG-ATHZ | Authorization Testing | 4 |
      | WSTG-SESS | Session Management Testing | 9 |
      | WSTG-INPV | Input Validation Testing | 19 |
      | WSTG-ERRH | Error Handling | 2 |
      | WSTG-CRYP | Cryptography | 4 |
      | WSTG-BUSL | Business Logic Testing | 9 |
      | WSTG-CLNT | Client-side Testing | 13 |
      | WSTG-APIT | API Testing | 1 |

      97 tests in all. Each test page has the id in a table, then **Summary**, **Test Objectives** and **How to
      Test**, often followed by Remediation, Tools and References. WSTG-INFO-02's objective, for example, is
      "Determine the version and type of a running web server to enable further discovery of any known
      vulnerabilities."

      **The checklist.** `checklist/Testing_Checklist.md` is a Markdown table with the columns Test ID, Test Name,
      Status and Notes, and says: 'The `Status` column can be set for values similar to "Pass", "Fail", "N/A".'
      Two quirks of the real file matter to any script that reads it:

      - category rows are bold (`| **WSTG-INFO** | **Information Gathering** | | |`);
      - two category rows do not match their tests' prefix - `WSTG-BUSLOGIC` heads the `WSTG-BUSL-..` tests and
        `WSTG-CLIENT` heads the `WSTG-CLNT-..` tests. Take a test's category from its own id.

      **Gaps in v4.2.** Some current risks have no v4.2 test. The development version's checklist (not a release;
      ids may change) adds, among others, `WSTG-SESS-10` JSON Web Tokens, `WSTG-INJT-20` Mass Assignment,
      `WSTG-INJT-24` Server-side URL Redirect and `WSTG-CONF-12` Content Security Policy - and renames the input
      validation category from INPV to INJT. In v4.2, open redirects appear only as **WSTG-CLNT-04**, "Testing for
      Client-side URL Redirect".

  - id: internals-asvs
    kind: internals
    concepts: [sec-asvs-requirements]
    title: Inside ASVS 5.0.0 - chapters, levels and identifiers
    body: |
      **Size and shape.** "The ASVS is made up of a total of around 350 requirements which are divided into 17
      chapters, each of which is further divided into sections." The release CSV has 345 rows. The chapters run
      from V1 Encoding and Sanitization through V8 Authorization, V9 Self-contained Tokens, V11 Cryptography,
      V13 Configuration and V16 Security Logging and Error Handling to V17 WebRTC.

      **Levels**, quoted from "Application Security Verification Levels":

      - **Level 1** "contains the minimum requirements to consider when securing an application and represents a
        critical starting point. This level contains around 20% of the ASVS requirements." And: "Level 1 is not
        necessarily penetration testable by an external tester without internal access to documentation or code".
      - **Level 2**: "Most applications should be striving to achieve this level of security. Around 50% of the
        requirements in the ASVS are L2 meaning that an application needs to implement around 70% of the
        requirements in the ASVS (all of the L1 and L2 requirements) in order to comply with L2."
      - **Level 3** "should be the goal for applications looking to demonstrate the highest levels of security and
        provides the final ~30% of requirements".

      The CSV's `L` column gives the level at which each requirement starts. Counted from the 5.0.0 file: 70 at
      L1, 183 at L2 and 92 at L3 - so an L2 application meets 253 requirements. Which level? ASVS does not decide
      for you: "an organization should analyze its risks and decide what level it believes it should be at",
      noting that "a bank may have difficulty justifying anything less than Level 3 to its customers for its
      online banking application."

      **Identifiers.** "Each requirement has an identifier in the format `<chapter>.<section>.<requirement>`".
      Because they move between major versions ("Full reorganization, almost everything may have changed,
      including requirement numbers"), ASVS asks documents to cite `v<version>-<chapter>.<section>.<requirement>`,
      for example `v5.0.0-1.2.5`, and adds: "The `v` preceding the version number in the format should always be
      lowercase." The CSV writes ids with a capital V and no version (`V1.2.5`), so tools convert them.

      **Documentation requirements.** Some requirements ask that decisions are written down - for example 6.1.1,
      that "application documentation defines how controls such as rate limiting, anti-automation, and adaptive
      response, are used to defend against attacks such as credential stuffing and password brute force". ASVS
      stresses that "verifying that the documentation is in place and that the actual implementation are two
      separate activities." A black-box tester can do the second; only someone with access can do the first.

  - id: when
    kind: when
    concepts: [sec-wstg-asvs-test-plan, sec-wstg-methodology, sec-asvs-requirements]
    title: Which document for which job
    body: |
      | You are asked to... | Reach for | Why |
      | --- | --- | --- |
      | raise awareness, train newcomers | Top 10 (2025) | it ranks risk categories from real data |
      | agree what "secure enough" means for a release | ASVS at a chosen level | requirements with a pass/fail decision |
      | plan and run a web security test | WSTG for method, ASVS for scope | how to test, and what must hold |
      | write security unit and integration tests | ASVS | its "Guide for Automated Unit and Integration Tests" use case |
      | buy software or a development service | ASVS level in the contract | ASVS: "must be developed at ASVS level X" |
      | claim "we cover the Top 10" | nothing - don't | "OWASP discourages any claims of full coverage" |

      **When the WSTG alone is not enough:** for APIs, tokens and mass assignment v4.2 has little or nothing (one
      API test, about GraphQL); add tests from ASVS chapters V4, V8 and V9 and the
      [OWASP API Security Top 10](#/lesson/owasp-api-security-top-10). For mobile apps, the WSTG's own
      methodology chapter points to the Mobile Security Testing Guide - see
      [Mobile app security testing](#/lesson/mobile-app-security-testing).

      **When black-box testing cannot verify a requirement:** logging and documentation requirements. The Top 10
      page makes the same point about logging - checking it "can only be done with interviews and requesting a
      sampling of effective incident responses". Put these in the plan as "needs evidence from the team", not
      "N/A".

      **Before any of it: scope.** The WSTG's reporting chapter defines scope as "The boundaries and the needs of
      the engagement agreed upon with the organization." A plan starts from written permission and that scope;
      nothing in a guide makes testing outside it acceptable.

  - id: visual
    kind: visual
    concepts: [sec-wstg-asvs-test-plan, sec-wstg-methodology, sec-asvs-requirements]
    title: From scope to checklist
    body: |
      ```mermaid
      flowchart TB
        S["Written scope and permission"] --> L{"Choose ASVS level"}
        T["Top 10 - awareness, risk focus"] -.-> L
        L --> R["ASVS requirements in scope (L at most the level)"]
        R --> M["Map each to WSTG tests"]
        M --> G{"WSTG has a test?"}
        G -- yes --> W["Run the WSTG test as a tagged check"]
        G -- no --> O["Write your own check (gap)"]
        W --> C["Result - Pass, Fail or Error, with evidence"]
        O --> C
        C --> K["Checklist status per WSTG id, coverage per category"]
        K --> P["Report - finding with WSTG id and v5.0.0 reference"]
        P --> X["Retest after the fix"]
        X --> C
      ```

      Notice where each document enters: the Top 10 only informs the level and focus (dotted line), ASVS decides
      what is in scope, and the WSTG decides how each check is done. Gaps are not dropped; they get their own
      checks. Every result, including Error, flows into the checklist.

  - id: plan-code
    kind: code
    concepts: [sec-wstg-asvs-test-plan, sec-asvs-requirements]
    title: The portal's flaws mapped and planned at level 1
    body: |
      `support/wstg_fixture.py` maps each of the practice portal's 17 flaws to WSTG v4.2 tests and ASVS 5.0.0
      requirements (this lesson's judgement), and holds the real ASVS rows with their levels. `build_plan` keeps
      the requirements in scope at the chosen level and defers the rest:

      ```python
      from foundations.wstg_plan import build_plan
      from wstg_fixture import ASVS_500_SAMPLE, FLAW_MAP
      from sandpay_vuln import FLAWS

      for p in build_plan(list(FLAWS), FLAW_MAP, ASVS_500_SAMPLE, 1):
          print(f"{p.flaw:16} wstg={','.join(p.wstg) or '-':14} L1={','.join(p.asvs) or '-':32} "
                f"later={','.join(p.deferred) or '-'}")
      ```

      Output (19 November 2026):

      ```plaintext
      idor             wstg=WSTG-ATHZ-04   L1=v5.0.0-8.2.2                     later=-
      mass-assignment  wstg=WSTG-ATHZ-03   L1=-                                later=v5.0.0-15.3.3,v5.0.0-8.2.3
      sqli             wstg=WSTG-INPV-05   L1=v5.0.0-1.2.4                     later=-
      xss-reflected    wstg=WSTG-INPV-01   L1=v5.0.0-1.2.1                     later=-
      xss-stored       wstg=WSTG-INPV-02   L1=v5.0.0-1.2.1                     later=-
      path-traversal   wstg=WSTG-ATHZ-01   L1=v5.0.0-5.3.2                     later=-
      open-redirect    wstg=WSTG-CLNT-04   L1=-                                later=v5.0.0-3.7.2
      ssrf             wstg=WSTG-INPV-19   L1=-                                later=v5.0.0-1.3.6
      csrf             wstg=WSTG-SESS-05   L1=v5.0.0-3.5.1                     later=v5.0.0-3.3.2
      weak-session     wstg=WSTG-SESS-02   L1=v5.0.0-3.3.1                     later=v5.0.0-3.3.4
      no-rate-limit    wstg=WSTG-ATHN-03   L1=v5.0.0-6.3.1                     later=-
      jwt-none         wstg=-              L1=v5.0.0-9.1.1,v5.0.0-9.1.2        later=-
      weak-hash        wstg=WSTG-CRYP-04   L1=-                                later=v5.0.0-11.4.2
      verbose-errors   wstg=WSTG-ERRH-01   L1=-                                later=v5.0.0-16.5.1
      missing-headers  wstg=WSTG-INFO-02   L1=-                                later=v5.0.0-3.4.3,v5.0.0-3.4.4,v5.0.0-13.4.6
      data-exposure    wstg=-              L1=v5.0.0-15.3.1                    later=-
      secret-logging   wstg=-              L1=-                                later=v5.0.0-16.2.5
      ```

      Three things to read from it:

      - **Level 1 is not "the easy half".** IDOR, SQL injection, XSS, path traversal, CSRF, brute force, unsigned
        JWTs and over-sharing responses are all L1 - first-layer defences.
      - **Some flaws only matter at L2 or L3.** Stack traces (16.5.1), CSP (3.4.3), `nosniff` (3.4.4) and SSRF
        (1.3.6) start at L2; version disclosure (13.4.6) at L3. An L1 assessment that reports them should label
        them as above the agreed level, not as failures of it.
      - **Three flaws have no WSTG v4.2 test** - `jwt-none`, `data-exposure` and `secret-logging`. The plan keeps
        them, so someone writes a check (or asks the team for log samples) instead of silently dropping them.

  - id: runner-code
    kind: code
    concepts: [sec-wstg-asvs-test-plan, sec-wstg-methodology]
    title: Tagged checks and the checklist they fill in
    body: |
      Each check carries a WSTG id, the WSTG test name and a versioned ASVS reference. The runner records Pass,
      Fail or Error with evidence and writes the WSTG checklist table:

      ```python
      from foundations.wstg_runner import DEFAULT_CHECKS, run_checks, to_checklist_markdown
      from sandpay_vuln import make_app, serve

      for label, app in [("vulnerable", make_app()),
                         ("fixed", make_app({"verbose-errors", "missing-headers"}))]:
          with serve(app) as base:          # 127.0.0.1 only
              print("==", label)
              print(to_checklist_markdown(run_checks(base, DEFAULT_CHECKS)))
      ```

      Output:

      ```plaintext
      == vulnerable
      | Test ID | Test Name | Status | Notes |
      |---|---|---|---|
      | WSTG-ERRH-01 | Testing for Improper Error Handling | Fail | v5.0.0-16.5.1: GET /boom 500 body shows 'Traceback (most recent call last)' |
      | (no WSTG test) | Content-Security-Policy minimum | Fail | v5.0.0-3.4.3: no policy |

      == fixed
      | Test ID | Test Name | Status | Notes |
      |---|---|---|---|
      | WSTG-ERRH-01 | Testing for Improper Error Handling | Pass | v5.0.0-16.5.1: GET /boom 500 generic body (52 bytes) |
      | (no WSTG test) | Content-Security-Policy minimum | Fail | v5.0.0-3.4.3: object-src 'none' missing, base-uri 'none' missing |
      ```

      The error-handling check behaves as a good check should: it finds the stack trace, and it is quiet once the
      flaw is fixed. The CSP check is the interesting one. The portal's "fixed" build sends
      `Content-Security-Policy: default-src 'self'; frame-ancestors 'none'` - a header a presence check would
      happily pass. ASVS 5.0.0 3.4.3 asks for more: "As a minimum, a global policy must be used which includes the
      directives object-src 'none' and base-uri 'none' and defines either an allowlist or uses nonces or hashes."
      Measured against the requirement, the fix is incomplete for an L2 application.

      The fixed portal's error body is JSON with a reference instead of a trace:

      ```plaintext
      HTTP/1.1 500 Internal Server Error
      Server: SandPay
      Content-Type: application/json
      Content-Security-Policy: default-src 'self'; frame-ancestors 'none'
      X-Content-Type-Options: nosniff
      Referrer-Policy: no-referrer
      Strict-Transport-Security: max-age=31536000
      Content-Length: 52

      {"error": "internal error", "reference": "3fd328b9"}
      ```

      (The `Date` header is left out; the reference is random per error.) The vulnerable build answers the same request with
      `Server: SandPayPortal/0.9 Python/3.12`, `Content-Type: text/plain` and a 693-byte Python traceback that
      names the portal's source file and line numbers - exactly what WSTG-ERRH-01 lists among the risks: "Gather the
      versions and types of applications being used."

  - id: line-by-line
    kind: line-by-line
    concepts: [sec-wstg-asvs-test-plan, sec-asvs-requirements, sec-wstg-methodology]
    title: The lines that keep results honest
    body: |
      ```python
      def run_checks(base_url, checks):
          results = []
          for check in checks:
              try:
                  passed, evidence = check.run(base_url)
              except Exception as exc:                       # a crash proves nothing
                  results.append(Result(check, "Error", f"{type(exc).__name__}: {exc}"))
                  continue
              results.append(Result(check, "Pass" if passed else "Fail", evidence))
          return results
      ```

      - **`except Exception` becomes `Error`, never `Pass`.** A check that timed out or hit a changed page tells you
        nothing about the requirement. Counting it as a pass is the most expensive mistake in security
        automation: the dashboard goes green while nothing was verified.
      - **Every result has evidence.** The checklist's Notes column carries `v5.0.0-16.5.1: GET /boom 500 body shows
        'Traceback ...'` - the request, the status and what was seen - so a reviewer can repeat it.

      ```python
      def combined_status(statuses):
          if "Fail" in statuses:
              return "Fail"
          if "Error" in statuses:
              return "Error"
          return "Pass"
      ```

      - **One WSTG test, several checks.** WSTG-SESS-02 (cookie attributes) touches ASVS 3.3.1 (`Secure`) and 3.3.4
        (`HttpOnly`). The test passes only if every check passed; one failure fails it; an error with no failure
        leaves it undecided.

      ```python
      def asvs_ref(req_id, version="5.0.0"):
          m = REQ_ID.match(req_id.strip())                 # V8.2.2 or 8.2.2
          ...
          return f"v{version}-{m.group(1)}.{m.group(2)}.{m.group(3)}"
      ```

      - **Lowercase `v`, version first.** `V8.2.2` from the CSV becomes `v5.0.0-8.2.2`, the format ASVS asks
        reports and tools to use. When ASVS 5.1 or 6.0 renumbers requirements, the reference still points to the
        right text.

      ```python
      def category_of(test_id):
          ...
          return test_id.rsplit("-", 1)[0]                  # WSTG-BUSL-03 -> WSTG-BUSL
      ```

      - **Category from the id, not from the bold row above it.** In the real v4.2 file the bold row says
        `WSTG-BUSLOGIC`; grouping by that row would split Business Logic coverage across two names.

  - id: steps
    kind: steps
    concepts: [sec-wstg-asvs-test-plan]
    title: Building a test plan from ASVS and the WSTG
    body: |
      1. **Get the scope and permission in writing** - targets, environments, accounts, dates, what is out of
         bounds, who to call if something breaks.
      2. **Choose the ASVS level** with the system owner, from the data and risk (the portal moves money: L2 at
         least). Record the version: ASVS 5.0.0.
      3. **Drop chapters that do not apply** - ASVS suggests, for example, ignoring OAuth or WebRTC chapters when
         those are not used - and keep the requirements whose level is at most the chosen one.
      4. **Map each requirement to WSTG tests.** Where v4.2 has none, write your own check and mark it as a gap
         (`(no WSTG test)`), or take the technique from the development version and cite it as such.
      5. **Split the plan by evidence source:** black-box checks you can run; documentation and logging
         requirements that need the team's documents or log samples.
      6. **Run each check as a tagged check** - WSTG id, ASVS reference, evidence - against the agreed target only.
      7. **Fill in the checklist:** Pass, Fail, N/A (with the reason) or Error; leave untested items empty, and
         report coverage per category.
      8. **Report each finding** with its WSTG id and versioned ASVS reference, the evidence and the fix.
      9. **Retest** after the fix with the same checks; a fix is verified when the check that failed now passes
         **and** nothing else regressed.

  - id: example
    kind: example
    concepts: [sec-wstg-asvs-test-plan, sec-asvs-requirements]
    title: "Example: SandPay's pre-launch check at level 2"
    body: |
      SandPay's security lead agrees an **ASVS 5.0.0 Level 2** assessment of the merchant portal in the staging
      environment, black box, two merchant accounts and one admin account, no load testing. A developer reports
      that "missing headers" and "verbose errors" are fixed and asks for sign-off.

      What the tester checks, and why:

      - **Re-runs the failed checks, not a new random sample.** ERRH-01 now passes (generic JSON body with a
        reference).
      - **Checks the fix against the requirement, not against "a header exists".** The CSP has neither
        `object-src 'none'` nor `base-uri 'none'`, so v5.0.0-3.4.3 still fails at L2. The finding stays open with
        the exact missing directives as evidence.
      - **Notices a new issue the fix introduced.** The fixed portal sends `Strict-Transport-Security` over plain
        HTTP. RFC 6797 section 7.2 says: "An HSTS Host MUST NOT include the STS header field in HTTP responses
        conveyed over non-secure transport." Browsers ignore it there, so the risk is low - but it shows the
        header was pasted in without understanding. Reported as informational, with a note to verify HSTS on the
        HTTPS deployment (WSTG-CONF-07, ASVS 3.4.1, an L1 requirement).
      - **Keeps the gaps visible.** JWT `alg: none` (v5.0.0-9.1.2, L1) has no WSTG v4.2 test; a custom check is in
        the plan. Secret logging (v5.0.0-16.2.5, L2) cannot be tested black box; the plan asks for a sample of the
        access log.
      - **Reports coverage honestly:** "WSTG-ATHZ 4 of 4 done, WSTG-CLNT 3 of 13 done (others out of scope -
        no client-side JavaScript)" is a useful sentence; "no critical issues" without it is not.

  - id: tests
    kind: tests
    concepts: [sec-wstg-asvs-test-plan, sec-wstg-methodology, sec-asvs-requirements]
    title: Tests for the plan and the checklist tooling
    body: |
      | # | Case | Setup | Expected result | Evidence |
      | --- | --- | --- | --- | --- |
      | 1 | Real checklist parses | WSTG v4.2 `Testing_Checklist.md` | 97 tests, first `WSTG-INFO-01`, last `WSTG-APIT-01`, all Not tested | item count and ids |
      | 2 | Bold rows and odd category ids | a filled table with a `WSTG-BUSLOGIC` row | its tests counted under `WSTG-BUSL`, no `WSTG-BUSLOGIC` key | coverage keys |
      | 3 | Statuses normalised | `Pass`, `FAIL`, `n/a`, empty | Pass, Fail, N/A, Not tested | parsed items |
      | 4 | Bad id or status rejected (negative) | `OTG-INFO-002`, `WSTG-INF-02`, status `Done` | `ValueError` naming the value | exception message |
      | 5 | Versioned reference | `V8.2.2`, version 5.0.0 | `v5.0.0-8.2.2`; `V5.0.0-1.2.5` rejected | return value, exception |
      | 6 | Levels are cumulative | the ASVS sample | L1 is a subset of L2, which is a subset of L3 | the three id sets |
      | 7 | A risk is never dropped (negative) | a flaw not in the mapping | `KeyError` | exception |
      | 8 | A crashed check (negative) | a check that raises `ConnectionError` | status Error, evidence names the exception; later checks still run | results list |
      | 9 | Finds, then quiet | ERRH check against vulnerable, then fixed portal | Fail with the trace marker, then Pass | evidence text |
      | 10 | Requirement, not presence | CSP check against the fixed portal | Fail listing the two missing directives | evidence text |

      Cases 9 and 10 are the house rule for every security check in this track: it must **find** the flaw on the
      vulnerable build and stay **quiet** once the flaw is really fixed - and "really" is decided by the
      requirement's wording.

  - id: mistakes
    kind: mistakes
    concepts: [sec-wstg-asvs-test-plan, sec-asvs-requirements, sec-wstg-methodology]
    title: Common mistakes and a debugging method
    body: |
      - **"We are Top 10 compliant."** There is no such thing; the Top 10 is an awareness document and OWASP
        "discourages any claims of full coverage". Say which ASVS level and version you verified, and how much.
      - **Unversioned ASVS ids.** "Fails 3.4.3" means different things in 4.0.3 and 5.0.0 - a major release
        renumbers almost everything. Write `v5.0.0-3.4.3`.
      - **Mixing WSTG versions.** `WSTG-INPV-05` (v4.2) and `WSTG-INJT-..` (development) in one report confuses
        readers; pick v4.2 ids and cite development tests explicitly.
      - **Empty means passed.** A checklist with 40% coverage and no fails says nothing about the other 60%. Report
        Not tested as its own number.
      - **N/A without a reason.** "N/A" for WSTG-CLNT tests on a page full of JavaScript hides untested risk. Write
        why in Notes.
      - **Counting crashed checks as passes.** A timeout is Error. Retry or investigate; never green.
      - **Presence instead of the requirement.** A CSP header exists, therefore 3.4.3 passes - wrong, as the fixed
        portal shows.
      - **Dropping gaps.** No WSTG test for JWT signatures does not make the requirement go away.
      - **Testing outside the scope** because a guide lists a test. The scope document wins.

      **Debugging method** when a result looks wrong: re-read the requirement text and the WSTG objective (what
      exactly must hold?); re-run the single check by hand with the same request and compare the raw response;
      check which build and environment you hit (fixed or vulnerable, staging or production); check the check -
      run it against a build where the answer is known (the practice portal with and without the fix); only then
      change the status.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [sec-wstg-asvs-test-plan, sec-wstg-methodology]
    title: Trade-offs and alternatives
    body: |
      - **Checklist-driven vs exploratory testing.** A checklist gives coverage and repeatability, but attackers do
        not follow it; business logic flaws (WSTG-BUSL) need someone who understands the product. Use the
        checklist as the floor and leave time for exploration.
      - **v4.2 vs the development version.** v4.2 is stable but from 2020; the development version has newer tests
        (JWT, mass assignment, CSP, cache poisoning) whose ids may still change. Report with v4.2 ids, borrow
        technique from latest, say so.
      - **Higher ASVS level, higher cost.** L3 adds defence in depth that is hard to implement and to verify; ASVS
        itself says an organisation should choose by risk. For a payments portal, L2 with selected L3
        requirements is a common compromise - justify the selection in the plan.
      - **Automation vs judgement.** Header, error and cookie checks automate well (and belong in CI - see
        [Automating security regression tests](#/lesson/security-regression-automation)); authorisation and
        business logic need human-designed cases.
      - **Other methodologies.** The WSTG's own methodology chapter lists alternatives: the Penetration Testing
        Execution Standard (PTES, seven phases from pre-engagement to reporting), the PCI DSS penetration testing
        guidance, the Penetration Testing Framework, NIST SP 800-115 (Technical Guide to Information Security
        Testing and Assessment) and the OSSTMM. They cover engagement process and infrastructure more than web
        application technique; many teams combine one of them with the WSTG.

  - id: summary
    kind: summary
    concepts: [sec-wstg-methodology, sec-asvs-requirements, sec-wstg-asvs-test-plan]
    title: Quick reference
    body: |
      - **Top 10** = awareness ("primarily an awareness document"); **ASVS** = what must be true (pass/fail
        requirements); **WSTG** = how to test it.
      - **WSTG v4.2**: 97 tests, 12 categories, ids `WSTG-<CAT>-<NN>`; black box, passive then active; checklist
        Status "Pass", "Fail", "N/A" - empty means not tested. 5.0 is in development.
      - **ASVS 5.0.0**: 345 requirements, 17 chapters; L1 70, L2 183, L3 92; levels are cumulative (L2 = L1 + L2).
      - **Cite** `v5.0.0-<chapter>.<section>.<requirement>`, lowercase `v`.
      - **Plan**: scope in writing -> level -> requirements in scope -> WSTG tests -> own checks for gaps ->
        evidence source (black box or team documents).
      - **Results**: Pass, Fail, Error (crashed - never a pass), N/A with a reason, Not tested; coverage per
        category.
      - **A good check** finds the flaw and stays quiet once the requirement - not just a header - is met.

exercises:
  - id: which-document
    type: mcq
    concept: sec-wstg-methodology
    skill: recognition
    title: Where is the how-to?
    prompt: |
      You know the merchant portal must stop merchants reading each other's payments. Which OWASP document tells
      you **how to test** for it - which requests to send and what to compare?
    options:
      - id: wstg
        text: The Web Security Testing Guide - WSTG-ATHZ-04, Testing for Insecure Direct Object References
        feedback: Correct - the WSTG is the testing method; ASVS 8.2.2 states the requirement it verifies.
      - id: asvs
        text: ASVS - requirement 8.2.2
        feedback: ASVS states what must be true; it says how-to-test questions "should be covered by the Web Security Testing Guide project".
      - id: top10
        text: The OWASP Top 10 - A01 Broken Access Control
        feedback: The Top 10 names the risk category for awareness; it does not give test procedures.
      - id: cheatsheet
        text: The Cheat Sheet Series
        feedback: ASVS points developers to the cheat sheets for how to implement a requirement, not testers for how to test it.
    correct: [wstg]
    hints:
      - One document says what, one says how, one says what to worry about.
    solution: |
      WSTG = how to test (WSTG-ATHZ-04); ASVS = the requirement that must hold (v5.0.0-8.2.2); Top 10 = the risk
      category for awareness (A01:2025).

  - id: top10-claim
    type: mcq
    concept: sec-wstg-asvs-test-plan
    skill: application
    title: The compliance request
    prompt: |
      A sales manager asks you to "certify the portal is OWASP Top 10 compliant" for a customer questionnaire.
      What is the best answer?
    options:
      - id: asvs-level
        text: Explain that the Top 10 is an awareness document and offer a statement of which ASVS level and version was verified, with coverage
        feedback: Correct - OWASP discourages Top 10 coverage claims and recommends ASVS as the verifiable standard.
      - id: scan
        text: Run an automated scanner and certify compliance if it reports no Top 10 alerts
        feedback: Tools "cannot comprehensively detect, test, or protect against the OWASP Top 10"; a clean scan is not coverage.
      - id: test-all-ten
        text: Write one test per Top 10 category and certify when all ten pass
        feedback: Each category is a family of weaknesses (A01:2025 maps 40 CWEs); ten tests do not cover them.
      - id: refuse
        text: Refuse - security cannot be certified
        feedback: You can state precisely what was verified - a level, a version, the coverage and the open findings.
    correct: [asvs-level]
    hints:
      - Read what the Top 10 says about being used as a standard.
    solution: |
      "OWASP discourages any claims of full coverage of the OWASP Top 10, because it's simply untrue." Offer a
      precise statement instead - for example ASVS 5.0.0 Level 2, 92% of in-scope requirements verified, two open
      findings - which is what a customer can actually rely on.

  - id: level-two-meaning
    type: mcq
    concept: sec-asvs-requirements
    skill: recall
    title: What does Level 2 include?
    prompt: An application claims ASVS 5.0.0 Level 2. Which requirements has it met?
    options:
      - id: l1-l2
        text: Every L1 and every L2 requirement - about 70% of the standard
        feedback: Correct - levels are cumulative; ASVS says L2 means implementing "all of the L1 and L2 requirements".
      - id: l2-only
        text: Only the requirements marked L2
        feedback: L1 requirements are the first layer of defence; an L2 application meets them too.
      - id: half
        text: Any half of the requirements
        feedback: Levels are fixed lists per requirement, not a percentage you pick from.
      - id: l2-l3
        text: The L2 and L3 requirements, since L1 is for small sites
        feedback: Higher levels add to lower ones; they do not replace them.
    correct: [l1-l2]
    hints:
      - Levels build on each other.
    solution: |
      L2 = L1 + L2. In 5.0.0 that is 70 + 183 = 253 of 345 requirements (about 73%; ASVS says "around 70%").

  - id: versioned-ref
    type: mcq
    concept: sec-asvs-requirements
    skill: application
    title: Cite it properly
    prompt: |
      Your report says the portal fails the ASVS 5.0.0 requirement on parameterized queries, id `V1.2.4` in the
      release CSV. How should the report cite it?
    options:
      - id: right
        text: v5.0.0-1.2.4
        feedback: Correct - version first, lowercase v, then chapter.section.requirement.
      - id: capital
        text: V5.0.0-1.2.4
        feedback: ASVS - "The v preceding the version number in the format should always be lowercase."
      - id: bare
        text: "1.2.4"
        feedback: Without a version the id is assumed to mean the latest ASVS, and ids change between major versions.
      - id: csv
        text: V1.2.4
        feedback: That is the CSV's id with no version; a later major release may give 1.2.4 a different meaning.
    correct: [right]
    hints:
      - Identifiers "may change between versions of the standard".
    solution: |
      `v<version>-<chapter>.<section>.<requirement>` - `v5.0.0-1.2.4`. It stays correct after ASVS renumbers.

  - id: busl-category
    type: mcq
    concept: sec-wstg-methodology
    skill: analysis
    title: Two names for one category
    prompt: |
      Your coverage script groups tests by the bold category row above them. In the real WSTG v4.2 checklist,
      the row `| **WSTG-BUSLOGIC** | **Business Logic Testing** | | |` is followed by `WSTG-BUSL-01` to
      `WSTG-BUSL-09`. A colleague's report filters on `WSTG-BUSL` and shows 0 of 0 business logic tests. Why?
    options:
      - id: right
        text: The script keyed the tests under WSTG-BUSLOGIC; group by the prefix of each test's own id instead
        feedback: Correct - the bold row and the tests use different ids in v4.2, as do WSTG-CLIENT and WSTG-CLNT.
      - id: no-tests
        text: WSTG v4.2 has no business logic tests
        feedback: It has nine (WSTG-BUSL-01 to 09).
      - id: bold-parse
        text: Bold rows break Markdown tables, so the rows after them are lost
        feedback: The rows parse fine; the problem is which id the script used as the category.
      - id: status
        text: Business logic tests have no Status column
        feedback: Every row has the same four columns.
    correct: [right]
    hints:
      - Compare the category id in the bold row with the tests' prefix.
    solution: |
      Take the category from the test id (`WSTG-BUSL-03` -> `WSTG-BUSL`). The same trap exists for `WSTG-CLIENT`
      vs `WSTG-CLNT-..`.

  - id: empty-means
    type: mcq
    concept: sec-wstg-asvs-test-plan
    skill: analysis
    title: No failures yet
    prompt: |
      The checklist shows WSTG-ATHZ with 1 Pass, 0 Fail and 3 empty statuses. The project manager writes
      "authorization: no issues" in the release notes. What do you correct?
    options:
      - id: right
        text: Coverage is 25% - three authorization tests are not done, so nothing can be said about them yet
        feedback: Correct - empty is Not tested, and IDOR (ATHZ-04) may be one of them.
      - id: fine
        text: Nothing - no failures means no issues
        feedback: Absence of results is not absence of flaws.
      - id: na
        text: Mark the empty ones N/A so the report is complete
        feedback: N/A needs a reason (does not apply); these simply were not run.
      - id: fail
        text: Mark the empty ones Fail to be safe
        feedback: That reports flaws you have no evidence for; report them as not tested.
    correct: [right]
    hints:
      - What does an empty Status mean?
    solution: |
      Report "WSTG-ATHZ 1 of 4 done (25%), no failures so far" and finish the other three - ATHZ-04 IDOR is
      L1-critical for a payments portal.

  - id: jwt-gap
    type: mcq
    concept: sec-wstg-asvs-test-plan
    skill: application
    title: The test the guide does not have
    prompt: |
      The portal accepts JWTs with `"alg": "none"`. You test with WSTG v4.2. What goes in the plan and report?
    options:
      - id: right
        text: Your own check against v5.0.0-9.1.2 (an L1 requirement), marked as having no WSTG v4.2 test; optionally cite the development WSTG-SESS-10 as technique
        feedback: Correct - the requirement exists whether or not the guide has a test for it.
      - id: skip
        text: Nothing - it is out of scope because v4.2 has no test for it
        feedback: Scope comes from the agreement and ASVS, not from gaps in a guide.
      - id: v5-id
        text: Report it as a failure of WSTG-SESS-10
        feedback: That id is from the development version and may change; cite the ASVS requirement and label the WSTG reference as development.
      - id: athn
        text: Squeeze it under WSTG-ATHN-01 Credentials over an Encrypted Channel
        feedback: That test is about transport; mislabelling hides the real requirement.
    correct: [right]
    hints:
      - Which document decides what must be true?
    solution: |
      ASVS 9.1.2: only allow-listed algorithms, "must not include the 'None' algorithm". Plan it as a custom check
      (gap), report with `v5.0.0-9.1.2`.

  - id: csp-present
    type: mcq
    concept: sec-asvs-requirements
    skill: analysis
    title: The header is there now
    prompt: |
      After a fix the portal sends `Content-Security-Policy: default-src 'self'; frame-ancestors 'none'`. The
      plan targets ASVS 5.0.0 Level 2. What is the status of v5.0.0-3.4.3?
    options:
      - id: fail
        text: Fail - the policy lacks object-src 'none' and base-uri 'none', which 3.4.3 requires as a minimum
        feedback: Correct - the requirement's wording, not the header's presence, decides.
      - id: pass
        text: Pass - a CSP header is present on every response
        feedback: 3.4.3 lists minimum directives; a presence check would miss them.
      - id: na
        text: N/A - CSP is an L3 requirement
        feedback: 3.4.3 starts at L2, which is the target here.
      - id: error
        text: Error - default-src covers object-src, so the check cannot decide
        feedback: The requirement names the directives explicitly; the check can decide, and it fails.
    correct: [fail]
    hints:
      - Read 3.4.3 to the end - "As a minimum..."
    solution: |
      ASVS 3.4.3: "As a minimum, a global policy must be used which includes the directives object-src 'none' and
      base-uri 'none' and defines either an allowlist or uses nonces or hashes." Two directives missing - Fail,
      with both named as evidence.

  - id: crashed-check
    type: mcq
    concept: sec-wstg-asvs-test-plan
    skill: application
    title: The check timed out
    prompt: |
      In last night's run, the cookie-attribute check raised `ConnectionError` because staging was being
      redeployed. Its previous result was Fail. What should the checklist show?
    options:
      - id: error
        text: Error, with the exception as evidence - and re-run it when staging is back
        feedback: Correct - a crashed check verified nothing.
      - id: pass
        text: Pass, because it did not find a problem
        feedback: It did not look; a crash is not a result.
      - id: last
        text: Fail, carried over from the previous run
        feedback: Carrying results over hides whether the fix landed; record this run's outcome.
      - id: remove
        text: Remove the row until it runs again
        feedback: Removing it inflates coverage; the test is in the plan and was not completed.
    correct: [error]
    hints:
      - What did the check actually observe?
    solution: |
      Pass, Fail and Error are different facts. Error means "not verified this run"; it lowers coverage until the
      check runs again.

  - id: hsts-http
    type: mcq
    concept: sec-wstg-methodology
    skill: analysis
    title: HSTS on the local portal
    prompt: |
      The fixed portal on `http://127.0.0.1` sends `Strict-Transport-Security: max-age=31536000`. How do you treat
      it?
    options:
      - id: info
        text: Informational - RFC 6797 7.2 says an HSTS host MUST NOT send the header over non-secure transport; verify HSTS on the HTTPS deployment
        feedback: Correct - browsers ignore it over HTTP; the real check (WSTG-CONF-07, ASVS 3.4.1) needs HTTPS.
      - id: pass
        text: Pass for v5.0.0-3.4.1 - the header is present with a year's max-age
        feedback: Over HTTP the header has no effect; the requirement cannot be verified here.
      - id: fail
        text: Critical failure - HSTS over HTTP breaks the site
        feedback: It is ignored, not harmful; overstating severity damages the report's credibility.
      - id: ignore
        text: Ignore it - headers do not matter on loopback
        feedback: It is worth noting as a sign the header was added without understanding, and it does not verify 3.4.1.
    correct: [info]
    hints:
      - Look up RFC 6797 section 7.2.
    solution: |
      "An HSTS Host MUST NOT include the STS header field in HTTP responses conveyed over non-secure transport."
      Note it as informational; verify 3.4.1 where TLS is in use.

  - id: plan-order
    type: order
    concept: sec-wstg-asvs-test-plan
    skill: application
    title: Build the plan in order
    prompt: Put the steps of planning and running an ASVS-based web security test in order.
    items:
      - id: scope
        text: Agree the written scope and permission with the system owner
      - id: level
        text: Choose the ASVS version and level from the application's risk
      - id: select
        text: Keep the requirements in scope at that level and drop chapters that do not apply
      - id: map
        text: Map each requirement to WSTG tests and write your own checks for the gaps
      - id: run
        text: Run the tagged checks against the agreed target and record Pass, Fail or Error with evidence
      - id: report
        text: Fill in the checklist, report findings with WSTG ids and versioned ASVS references, and retest fixes
    hints:
      - Nothing runs before permission; nothing is reported before it is run.
    solution: |
      Scope, level, selection, mapping, execution, reporting. Retesting loops back to execution with the same
      checks after each fix.

  - id: coverage-debug
    type: debug
    concept: sec-wstg-methodology
    skill: analysis
    title: A coverage report that flatters
    prompt: |
      This function reports coverage per category from the parsed checklist. Click **every** line that makes the
      report wrong.
    language: python
    code: |
      def coverage(rows):
          result = {}
          category = None
          for row in rows:
              if row.test_id.startswith("**"):
                  category = row.test_id.strip("*")
                  continue
              stats = result.setdefault(category, {"total": 0, "done": 0})
              stats["total"] += 1
              if row.status != "Fail":
                  stats["done"] += 1
          for stats in result.values():
              stats["percent"] = stats["done"] * 100 // stats["total"]
          return result
    correctLines: [6, 10]
    lineNotes:
      - line: 13
        note: Integer division truncates (33.3 becomes 33), which is a rounding choice rather than a wrong result; the serious errors are elsewhere.
      - line: 5
        note: Skipping bold rows is right; the bug is using their id as the category on the next line.
    hints:
      - Which category do WSTG-BUSL-01..09 end up under?
      - Which statuses should count as done?
    solution: |
      Line 6 takes the category from the bold row, so `WSTG-BUSL-..` tests land under `WSTG-BUSLOGIC` (and CLNT
      under CLIENT). Line 10 counts every non-Fail row as done - including empty ones, so untested items inflate
      coverage. Use `category_of(test_id)` and count a row as done only when its status is not empty.

  - id: logging-gap
    type: short
    concept: sec-asvs-requirements
    skill: analysis
    title: The requirement you cannot see
    prompt: |
      The portal writes passwords to its access log (flaw `secret-logging`, ASVS v5.0.0-16.2.5, L2). WSTG v4.2
      has no test for it and your engagement is black box. How do you verify the requirement, and what do you
      write in the checklist until you can?
    modelAnswer: |
      A black-box test cannot read the server's log, so the requirement needs evidence from the team: ask for a
      sample of the access and application logs produced while you log in with a known test password (for
      example `alice-pass-1` on the practice portal), then search the sample for the password and other secrets
      (tokens, card data). Alternatively review the logging code or configuration with the developers. Until the
      evidence arrives, record the requirement as **not tested - needs log sample from the team**, not N/A and not
      Pass, and list it in the report's limitations. If the sample contains the password, it fails 16.2.5, which
      says credentials may not be logged; the fix is to log only the email (or nothing) for login attempts, then
      repeat the same check.
    rubric:
      - Says black-box testing cannot verify it and names the evidence needed (log sample or code review)
      - Describes a concrete check - a known test password, then search the logs for it
      - Records it as not tested with a reason, not N/A or Pass
      - States the pass condition and the fix
    hints:
      - What would you need to see to decide pass or fail?
    solution: |
      Needs team evidence (log sample after a known login, or code review); until then "not tested - needs log
      sample", listed as a limitation.

  - id: verify-plan
    type: testdesign
    concept: sec-wstg-asvs-test-plan
    skill: application
    title: Verify two requirements on the portal
    prompt: |
      Design the tests that verify **v5.0.0-8.2.2** (IDOR, L1) and **v5.0.0-16.5.1** (generic error messages, L2)
      on the local practice portal. For each test give the WSTG id, preconditions, steps, expected result and the
      evidence you would keep. Include at least one negative test per requirement, and say how you show the check
      is quiet once the flaw is fixed.
    modelAnswer: |
      **8.2.2 - WSTG-ATHZ-04**

      1. *Cross-merchant read (negative).* Pre: portal on 127.0.0.1, Alice (m_100) and Bob (m_200) tokens. Steps:
         as Alice, `GET /api/payments/pay_2001` (Bob's). Expected: 404, same body as a missing id. Evidence: request,
         status, body; Bob's payment id.
      2. *Own read (positive).* As Alice, `GET /api/payments/pay_1001`. Expected: 200 with merchant m_100. Evidence:
         response. Shows the check is not failing everything.
      3. *Existence oracle (negative).* As Alice, compare `pay_2001` with `pay_9999`. Expected: identical status and
         body. Evidence: both responses.
      4. *Admin (positive).* As ops (admin), `pay_2001` returns 200 - the documented exception.

      **16.5.1 - WSTG-ERRH-01**

      5. *Unexpected error (negative).* `GET /boom`. Expected: 5xx with a generic body, no "Traceback", no file
         paths, no keys. Evidence: status, content type, body.
      6. *Malformed input (negative).* `GET /api/payments?status='` with a token, and invalid JSON to
         `/api/login`. Expected: 4xx or generic 5xx, no SQL text or trace. Evidence: bodies.
      7. *Normal error (positive).* `GET /api/payments/pay_9999`. Expected: 404 `{"error": "payment not found"}` -
         helpful but internal-free.

      **Quiet when fixed:** run each check against `make_app()` (expect Fail) and against
      `make_app({"idor", "verbose-errors"})` (expect Pass). Record both runs; a check that fails both builds is
      broken, not strict.
    rubric:
      - Each test names the WSTG id and ASVS reference, preconditions, steps, expected result and evidence
      - Includes negative tests that try to break each requirement, and positive controls
      - Checks for an existence oracle (404 vs 403 or different bodies) in the IDOR case
      - Shows the checks find the flaw on the vulnerable build and pass on the fixed build
      - Stays on the local portal (scope)
    hints:
      - A positive control proves your check can pass.
      - What else could leak - status codes, timing, body differences?
    solution: |
      Pair each negative test with a positive control, keep raw requests and responses as evidence, and prove
      each check against the vulnerable and the fixed build.

  - id: interview-wstg-asvs
    type: interview
    concept: sec-wstg-asvs-test-plan
    skill: analysis
    title: "Interview: how do you plan a web security test?"
    prompt: |
      "We are launching a payments portal. How would you use OWASP material to plan and report the security
      testing?"
    modelAnswer: |
      I would start with written scope and permission - targets, accounts, environments, dates. Then I would agree
      the target with the owner as an ASVS level and version, for a payments portal at least ASVS 5.0.0 Level 2,
      which means all L1 and L2 requirements, about 250 of 345. I would drop chapters that do not apply and split
      the rest into requirements I can verify black box and those that need the team's documents or logs.

      For each requirement I map the WSTG v4.2 test that verifies it - IDOR is WSTG-ATHZ-04 against v5.0.0-8.2.2 -
      and where the guide has no test, such as JWT algorithm checks or mass assignment, I write my own and mark
      the gap. I run every check against the agreed environment, record Pass, Fail or Error with evidence, and keep
      the WSTG checklist with coverage per category, including what was not tested.

      The report gives each finding a WSTG id and a versioned ASVS reference so developers can find the
      requirement and the test, and I retest fixes with the same checks. I would not claim Top 10 compliance - the
      Top 10 is an awareness document; I use it to focus training and priorities.
    rubric:
      - Starts with scope and written permission
      - Uses ASVS for requirements with a chosen level and version, WSTG for method, Top 10 for awareness only
      - Mentions mapping, gaps and evidence that needs team access
      - Reports with WSTG ids and versioned ASVS references, and coverage including not tested
      - Mentions retesting fixes
    followUps:
      - How do you choose between Level 2 and Level 3?
      - What do you do with a requirement the WSTG has no test for?
      - How would you automate part of this in CI?
    hints:
      - Answer in the order you would work - scope, requirements, method, execution, reporting.
    solution: |
      Scope -> ASVS level and version -> requirements in scope -> WSTG tests plus own checks for gaps -> evidence
      -> checklist with coverage -> report with both references -> retest.

  - id: checklist-coding
    type: coding
    concept: sec-wstg-methodology
    skill: application
    title: Read the WSTG checklist and report coverage
    prompt: |
      In `wstg_checklist.py`, implement `parse_checklist` (every test row of the real WSTG v4.2 checklist table,
      skipping header, separator and bold category rows; statuses normalised to Pass, Fail, N/A or Not tested;
      `ValueError` for a bad id or status), `category_of`, `coverage` (counts per category, in first-seen order,
      with the percentage of tests that have any status) and `failing`. The tests use the real v4.2 checklist
      from `support/wstg_fixture.py`.
    project: security
    files:
      - exercises/foundations/wstg_checklist.py
    test: tests/foundations/test_wstg_checklist.py
    command: .venv/bin/python -m pytest tests/foundations/test_wstg_checklist.py
    hints:
      - Split a row on `|` after stripping the outer pipes; the first cell decides what kind of row it is.
      - Normalise the status with `.lower()` and a dictionary; an empty cell is Not tested.
      - Take the category from `test_id.rsplit("-", 1)[0]`, never from the bold row.
    modelAnswer: |
      ```python
      def parse_checklist(markdown):
          items = []
          for number, line in enumerate(markdown.splitlines(), start=1):
              if not line.strip().startswith("|"):
                  continue
              cells = _cells(line)
              first = cells[0]
              if first in ("Test ID", "") or set(first) <= set("-: ") or first.startswith("**"):
                  continue
              if not TEST_ID.match(first):
                  raise ValueError(f"line {number}: {first!r} is not a WSTG test id (WSTG-XXXX-NN)")
              cells += [""] * (4 - len(cells))
              status_key = cells[2].lower()
              if status_key not in STATUSES:
                  raise ValueError(f"line {number}: unknown status {cells[2]!r} for {first}")
              items.append(Item(first, cells[1], STATUSES[status_key], cells[3]))
          return items
      ```

      `coverage` groups by `category_of`, counts each status and computes
      `round(100 * (total - not_tested) / total, 1)`. The real v4.2 table parses to 97 items in 12 categories.
    rubric:
      - Every test in test_wstg_checklist.py passes
      - Category comes from the test id, so WSTG-BUSLOGIC and WSTG-CLIENT rows do not create categories
      - Not tested is counted separately and never as done
      - Errors name the line and the bad value
    solution: |
      See the model answer; the full file is `solutions/foundations/wstg_checklist.py`.
    followUp: |
      Add a `--diff` mode that compares two filled checklists (before and after a retest) and lists tests whose
      status changed. Which changes would you highlight in a retest report?

  - id: plan-coding
    type: coding
    concept: sec-asvs-requirements
    skill: application
    title: Versioned references and a plan for one level
    prompt: |
      In `wstg_plan.py`, implement `asvs_ref` (`V8.2.2` or `8.2.2` to `v5.0.0-8.2.2`), `parse_asvs_ref` (and reject
      a capital V or a missing version), `for_level` (cumulative levels, `ValueError` outside 1-3) and `build_plan`
      (per flaw, the WSTG tests, the in-scope and deferred ASVS references; `KeyError` for an unknown flaw or
      requirement). The tests use real ASVS 5.0.0 rows and the portal's flaw mapping.
    project: security
    files:
      - exercises/foundations/wstg_plan.py
    test: tests/foundations/test_wstg_plan.py
    command: .venv/bin/python -m pytest tests/foundations/test_wstg_plan.py
    hints:
      - "`for_level`: keep rows whose int(L) is at most the level."
      - Look up the requirement ids in scope once, as a set, before the loop.
      - Check every ASVS id of a flaw exists before building its item, so nothing is dropped silently.
    modelAnswer: |
      ```python
      def build_plan(flaws, mapping, requirements, level, version="5.0.0"):
          in_scope = {r["req_id"] for r in for_level(requirements, level)}
          known = {r["req_id"] for r in requirements}
          plan = []
          for flaw in flaws:
              entry = mapping[flaw]                     # KeyError for an unknown flaw
              for rid in entry["asvs"]:
                  if rid not in known:
                      raise KeyError(f"{flaw}: ASVS requirement {rid} is not in the requirement list")
              plan.append(PlanItem(
                  flaw,
                  tuple(entry["wstg"]),
                  tuple(asvs_ref(r, version) for r in entry["asvs"] if r in in_scope),
                  tuple(asvs_ref(r, version) for r in entry["asvs"] if r not in in_scope),
              ))
          return plan
      ```
    rubric:
      - Every test in test_wstg_plan.py passes
      - References use a lowercase v and the version first
      - Levels are cumulative, and requirements above the level are deferred rather than dropped
      - Unknown flaws and requirements raise instead of being skipped
    solution: |
      See the model answer; at L1 the plan puts 16.5.1, 3.4.3, 3.4.4 and 13.4.6 in `deferred`, and three flaws
      have no WSTG v4.2 test.
    followUp: |
      Load the full ASVS 5.0.0 CSV and print, per chapter, how many requirements an L2 plan contains. Which
      chapters would you drop for SandPay's portal, and why?

  - id: runner-coding
    type: coding
    concept: sec-wstg-asvs-test-plan
    skill: application
    title: Run tagged checks and fill in the checklist
    prompt: |
      In `wstg_runner.py`, implement `run_checks` (Pass, Fail or Error with evidence; a raising check becomes Error
      and later checks still run), `combined_status`, `to_checklist_markdown`, `csp_problems` (the ASVS 3.4.3
      minimum), `check_error_handling` (WSTG-ERRH-01 / v5.0.0-16.5.1 on `GET /boom`) and `check_csp_asvs`. The
      tests run the checks against the practice portal on 127.0.0.1, vulnerable and fixed.
    project: security
    files:
      - exercises/foundations/wstg_runner.py
    test: tests/foundations/test_wstg_runner.py
    command: .venv/bin/python -m pytest tests/foundations/test_wstg_runner.py
    hints:
      - "Wrap only `check.run(base_url)` in try/except, and format the evidence as `Type: message`."
      - "Parse the CSP by splitting on `;`, then on whitespace; the first token is the directive name."
      - Group results by WSTG id with a dictionary, sort the ids, and put `(no WSTG test)` last.
    modelAnswer: |
      ```python
      def csp_problems(policy):
          if not policy or not policy.strip():
              return ["no policy"]
          directives = {}
          for part in policy.split(";"):
              tokens = part.split()
              if tokens:
                  directives.setdefault(tokens[0].lower(), tokens[1:])
          problems = []
          if directives.get("object-src") != ["'none'"]:
              problems.append("object-src 'none' missing")
          if directives.get("base-uri") != ["'none'"]:
              problems.append("base-uri 'none' missing")
          if not (directives.get("script-src") or directives.get("default-src")):
              problems.append("no allowlist, nonce or hash")
          return problems
      ```

      `run_checks` catches any exception from a check and records `Error` with `f"{type(exc).__name__}: {exc}"`;
      `to_checklist_markdown` writes one row per WSTG id with `combined_status` and the notes joined by `; `.
    rubric:
      - Every test in test_wstg_runner.py passes
      - A crashed check is Error, never Pass, and does not stop the run
      - The error check fails on the vulnerable portal and passes on the fixed one
      - The CSP check follows the requirement's wording, so the portal's fixed CSP still fails
    solution: |
      See the model answer and `solutions/foundations/wstg_runner.py`. The fixed portal passes ERRH-01 and still
      fails 3.4.3 with two missing directives.
    followUp: |
      Add a check for v5.0.0-3.3.4 (session cookie `HttpOnly`) under WSTG-SESS-02 and run both builds. Then add a
      second SESS-02 check for 3.3.1 (`Secure`): what does the combined row show on plain HTTP, and is that a fair
      result?

placement:
  - id: place-roles
    type: mcq
    concept: sec-wstg-methodology
    skill: application
    title: Method, requirement or awareness?
    prompt: |
      Your team must (a) decide what "secure enough" means for a release, (b) decide how to test each item, and
      (c) brief new developers on the most common risks. Which OWASP document fits each?
    options:
      - id: right
        text: (a) ASVS at a chosen level, (b) the WSTG, (c) the Top 10
        feedback: Correct - requirements, method, awareness.
      - id: top10-all
        text: The Top 10 for all three
        feedback: The Top 10 is an awareness document - "bare minimum" as a testing standard.
      - id: swapped
        text: (a) the WSTG, (b) ASVS, (c) the Top 10
        feedback: Swapped - ASVS states what must hold; the WSTG says how to test it.
      - id: wstg-all
        text: The WSTG for (a) and (b), nothing needed for (c)
        feedback: The WSTG is a method; it does not set a release bar or levels.
    correct: [right]
    solution: |
      ASVS = verifiable requirements with levels; WSTG = how to test; Top 10 = awareness of the most critical risk
      categories.

  - id: place-level
    type: mcq
    concept: sec-asvs-requirements
    skill: application
    title: In scope at Level 1?
    prompt: |
      In ASVS 5.0.0, requirement 16.5.1 (generic error messages, no stack traces) has level 2 and 8.2.2 (IDOR) has
      level 1. Your plan targets Level 1. How do you treat a stack trace you happen to see?
    options:
      - id: right
        text: 8.2.2 is in scope; report the stack trace as an observation above the agreed level (v5.0.0-16.5.1, L2), not as an L1 failure
        feedback: Correct - deferred requirements are recorded, not hidden and not counted as failures of the level.
      - id: ignore
        text: Ignore it - it is outside Level 1
        feedback: Never hide a real issue; label it as above the agreed level.
      - id: fail-l1
        text: Fail the Level 1 assessment because of it
        feedback: Level 1 does not include 16.5.1; report it separately.
      - id: both-l1
        text: Both are Level 1, since every requirement applies at Level 1
        feedback: The L column says where a requirement starts; 16.5.1 starts at L2.
    correct: [right]
    solution: |
      Levels are cumulative from the bottom: L1 contains only L1 requirements. Keep higher-level observations in the
      report, labelled with their level.

  - id: place-coverage
    type: mcq
    concept: sec-wstg-asvs-test-plan
    skill: analysis
    title: What does the checklist say?
    prompt: |
      A run produced: ATHZ-01 Pass, ATHZ-02 Error (timeout), ATHZ-03 empty, ATHZ-04 Fail. What is the honest summary
      for WSTG-ATHZ?
    options:
      - id: right
        text: 1 pass, 1 fail, 1 not verified (error), 1 not tested - one finding, half the category still unverified
        feedback: Correct - error and not tested are both unverified, and each is reported.
      - id: pass-most
        text: 3 of 4 passed - only ATHZ-04 failed
        feedback: The error and the empty item are not passes.
      - id: done
        text: Category complete with one finding
        feedback: Two tests have no result yet.
      - id: fail-all
        text: Category failed - all four fail because one did
        feedback: Results are per test; the category summary keeps them apart.
    correct: [right]
    solution: |
      Report counts per status. Only ATHZ-01 and ATHZ-04 were verified; re-run ATHZ-02 and run ATHZ-03 before
      saying anything about them.

recall:
  - id: recall-three-docs
    concept: sec-wstg-asvs-test-plan
    prompt: What are the different jobs of the OWASP Top 10, ASVS and the WSTG?
    answer: Top 10 - awareness of the most critical risk categories ("primarily an awareness document"). ASVS - verifiable security requirements with levels (what must be true). WSTG - the testing method (how to test it).
  - id: recall-wstg-shape
    concept: sec-wstg-methodology
    prompt: Describe the WSTG v4.2 - version status, size, id format and method.
    answer: v4.2 is the current release (5.0 in development). 97 tests in 12 categories, ids WSTG-<CAT>-<NN> such as WSTG-ATHZ-04. Black box; passive testing (understand the app, map entry points) then active category tests. Checklist with Status Pass, Fail, N/A.
  - id: recall-levels
    concept: sec-asvs-requirements
    prompt: What are the ASVS 5.0.0 levels and how many requirements does each add?
    answer: L1 - minimum, first layer of defence, about 20% (70 of 345). L2 - what most applications should aim for, adds about 50% (183), so L2 means all L1 and L2 (253). L3 - defence in depth, the final about 30% (92). Levels are cumulative.
  - id: recall-ref
    concept: sec-asvs-requirements
    prompt: How do you cite an ASVS requirement in a report, and why?
    answer: v<version>-<chapter>.<section>.<requirement>, lowercase v - for example v5.0.0-8.2.2. Ids change between major versions, so the version keeps the reference meaningful.
  - id: recall-statuses
    concept: sec-wstg-asvs-test-plan
    prompt: Which result statuses does an honest security checklist need?
    answer: Pass, Fail, N/A (with a reason), Error (the check crashed - never a pass) and Not tested (empty). Coverage is reported per category, counting only verified results as done.
  - id: recall-gaps
    concept: sec-wstg-asvs-test-plan
    prompt: Name three portal risks with no WSTG v4.2 test and what you do about them.
    answer: JWT alg none (ASVS 9.1.2), excessive data exposure (15.3.1) and secrets in logs (16.2.5). Keep them in the plan, write your own checks or ask the team for evidence (log samples), and mark them as gaps; the development WSTG adds tests such as WSTG-SESS-10 JSON Web Tokens.

