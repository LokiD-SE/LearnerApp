id: testing-jwt-and-oauth
title: Testing JWTs and OAuth 2.0
subject: security-testing
module: api-security
level: advanced
status: published
estimatedMinutes: 160
summary: Test the two things most modern APIs trust blindly - the JSON Web Token in the Authorization header and the OAuth 2.0 flow that issued it. Decode a token and judge what it reveals, probe for the unsigned-token (alg none) flaw and a signature that is never checked, write a validator that enforces algorithm, expiry, issuer and audience, and review an OAuth authorization-code flow for redirect URI, PKCE, state and grant-type weaknesses - with probes that find the flaw in a deliberately vulnerable SandPay portal and stay quiet once it is fixed.
