id: http-security-for-testers
title: HTTP security for testers
subject: security-testing
module: security-foundations
level: intermediate
status: published
estimatedMinutes: 140
summary: What the browser protects and what it leaves to the server - the same-origin policy, CORS and its misconfigurations, cookie attributes and prefixes, and the security response headers - and how a tester checks each one with evidence, against a deliberately vulnerable SandPay portal on your own machine.
tags:
  [
    same-origin policy,
    origin,
    CORS,
    preflight,
    Access-Control-Allow-Origin,
    Access-Control-Allow-Credentials,
    Vary Origin,
    null origin,
    cookies,
    Set-Cookie,
    Secure,
    HttpOnly,
    SameSite,
    __Host- prefix,
    __Secure- prefix,
    security headers,
    Content-Security-Policy,
    frame-ancestors,
    clickjacking,
    HSTS,
    Strict-Transport-Security,
    X-Content-Type-Options,
    nosniff,
    Referrer-Policy,
    Server header,
    version disclosure,
    OWASP WSTG,
    WSTG-SESS-02,
    WSTG-CLNT-07,
    WSTG-CLNT-09,
    WSTG-CONF-07,
    security testing,
  ]

environment: |
  - **Runtime:** Python 3.12.3 in `practice/security/.venv` with pytest 9.2.0 and requests 2.34.2, and curl,
    on Linux. Every output in this lesson was printed by the commands and code shown, run on 19 November 2026
    against the practice portal. Session ids are random, so yours will differ.
  - **Practice target:** `practice/security/support/sandpay_vuln.py`, a **deliberately vulnerable** SandPay
    merchant portal that binds to `127.0.0.1` only. Its `weak-session` and `missing-headers` flaws are the ones
    this lesson tests; `make_app({...})` builds the same portal with those flaws fixed. SandPay, its users and
    every origin under `sandpay.example` and `evil.example` are fictional (`.example` is reserved for
    documentation). The CORS policies in the exercises are small functions that stand in for servers.
  - **Ethics:** test only systems you own or have **written permission** to test, inside the agreed scope.
    Everything here runs against your own machine.
  - **Standards and specifications:** [RFC 6454](https://www.rfc-editor.org/rfc/rfc6454) (The Web Origin
    Concept); [RFC 6265](https://www.rfc-editor.org/rfc/rfc6265) (HTTP State Management Mechanism), section 5.2
    on attribute names; the IETF HTTP working group's
    [RFC 6265bis draft](https://httpwg.org/http-extensions/draft-ietf-httpbis-rfc6265bis.html) (an
    Internet-Draft - work in progress, not yet an RFC; section 4.1.3 cookie prefixes, section 5.6.7 SameSite
    enforcement); [RFC 6797](https://www.rfc-editor.org/rfc/rfc6797) (HTTP Strict Transport Security),
    sections 6.1.1, 7.2 and 8.1; the [WHATWG Fetch standard](https://fetch.spec.whatwg.org/), which now
    defines CORS.
  - **Testing guide:** OWASP Web Security Testing Guide, latest (development) version on
    [GitHub](https://github.com/OWASP/wstg) as read on 19 November 2026 (the latest stable release is v4.2):
    WSTG-SESS-02 Testing for Cookies Attributes, WSTG-CLNT-07 Testing Cross Origin Resource Sharing,
    WSTG-CLNT-09 Testing for Clickjacking, WSTG-CONF-07 Test HTTP Strict Transport Security. Quotations are
    from those pages.
  - **Reference documentation (MDN, as documented on 19 November 2026):**
    [Same-origin policy](https://developer.mozilla.org/en-US/docs/Web/Security/Defenses/Same-origin_policy),
    [CORS guide](https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CORS),
    [Set-Cookie](https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Set-Cookie),
    [CSP frame-ancestors](https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Content-Security-Policy/frame-ancestors),
    [X-Content-Type-Options](https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/X-Content-Type-Options),
    [Referrer-Policy](https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Referrer-Policy) and
    [Strict-Transport-Security](https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Strict-Transport-Security).
    Browser behaviour that differs between browsers (the SameSite default) is labelled as such.
  - **Not repeated here:** how to set cookies and run sessions as a developer -
    [Sessions, cookies and tokens](#/lesson/sessions-cookies-and-tokens); the OWASP Top 10 from the developer's
    side - [The OWASP Top 10 for developers](#/lesson/owasp-top-10-for-developers). CSRF and clickjacking
    attacks get their own lesson - [Testing for CSRF and clickjacking](#/lesson/testing-csrf-and-clickjacking).

prerequisites:
  - security-testing-fundamentals
  - sessions-cookies-and-tokens
  - http-request-response-anatomy

concepts:
  - id: sec-http-origin-cors
    name: The same-origin policy and CORS from a tester's side
    summary: An origin is the scheme, host and port. Browsers let pages send most cross-origin requests but not read the responses; CORS headers are the server's opt-in to let named origins read. CORS protects nothing on the server - it is a browser read permission - so the tester's question is which origins the server lets read, with or without credentials, and whether a reflected or null origin slips through.
  - id: sec-http-cookie-audit
    name: Auditing cookie attributes and prefixes
    summary: Every session cookie should be Secure, HttpOnly and state its SameSite mode, stay host-only unless it must be shared, and ideally use the __Host- prefix. The tester reads the real Set-Cookie header - not browser behaviour, which differs between browsers - and reports each missing attribute with what it allows.
  - id: sec-http-security-headers
    name: Checking security response headers
    summary: Content-Security-Policy (with frame-ancestors), X-Content-Type-Options nosniff, Referrer-Policy and, on HTTPS only, Strict-Transport-Security with a non-zero max-age reduce what an attacker can do with a page; Server and X-Powered-By versions help them pick exploits. Check every kind of response, including errors, because headers often only come from one code path.

objectives:
  - Decide whether two URLs are same-origin and explain what the same-origin policy blocks and what it does not.
  - Explain when a browser preflights a cross-origin request and when it lets script read the response, with and without credentials.
  - Probe a CORS policy with untrusted, look-alike and null origins and classify reflection, wildcard and missing Vary findings by impact.
  - Parse Set-Cookie headers and report missing Secure, HttpOnly and SameSite attributes and broken __Host- and __Secure- prefixes.
  - Check CSP frame-ancestors, nosniff, Referrer-Policy, HSTS and version disclosure on every kind of response, and know when HSTS does not apply.
  - Write automated checks that find each weakness on the vulnerable portal and stay quiet once it is fixed.

sections:
  - id: intuition
    kind: intuition
    concepts: [sec-http-origin-cors, sec-http-cookie-audit, sec-http-security-headers]
    title: The idea in plain language
    body: |
      Picture a building with many tenants. SandPay's merchant portal is one office; a stranger's website is
      another. The browser is the building's post room. It will **carry letters** from any office to any other -
      that is how the web links, posts forms and loads images - but it will not let one office **open another
      office's replies**. That rule is the **same-origin policy**.

      Sometimes an office *wants* a neighbour to read its replies - SandPay's API might serve its own dashboard
      on another host. **CORS** is the office telling the post room "this named neighbour may read my replies".
      Testers care about CORS because offices often hand that permission out too freely: "whoever asks may read
      my replies, even the ones addressed with your key".

      **Cookies** are the keys the browser carries for you. Their attributes are the rules printed on each key:
      only use me on secure lines (`Secure`), don't let any script in the page see me (`HttpOnly`), don't use me
      on letters that started in another building (`SameSite`).

      **Security headers** are notices the office pins on every reply: "never put me inside someone else's
      window" (`frame-ancestors`), "believe my label, don't guess what I am" (`nosniff`), "always phone me on
      the secure line" (HSTS).

      None of these is the lock on the vault. They decide what the *browser* will do for a page. A tester's job
      is to read what the server actually sends, compare it with what the application needs, and show - with
      the real headers as evidence - where the browser has been told to be too generous.

  - id: what
    kind: what
    concepts: [sec-http-origin-cors, sec-http-cookie-audit, sec-http-security-headers]
    title: Terms you need
    body: |
      | Term | Meaning | Source |
      | --- | --- | --- |
      | **Origin** | the scheme, host and port of a URL. MDN: "Two URLs have the same origin if the protocol, port (if specified), and host are the same for both" | RFC 6454; MDN |
      | **Same-origin policy** | the browser rule that a page may send most cross-origin requests but may not read their responses | MDN |
      | **Site** | the scheme and registrable domain - `https://app.sandpay.example` and `https://api.sandpay.example` are one site, two origins | WSTG-SESS-02 |
      | **CORS** | "an HTTP-header based mechanism that allows a server to indicate any origins ... other than its own from which a browser should permit loading resources" | MDN; defined in the Fetch standard |
      | **Preflight** | an `OPTIONS` request the browser sends first, for requests that are not simple, to ask whether the real request is allowed | MDN |
      | **Simple request** | `GET`, `HEAD` or `POST` with only safelisted headers and a form-like `Content-Type` - sent without a preflight | MDN |
      | **Credentialed request** | a cross-origin request that carries cookies or HTTP authentication | MDN |
      | **`Access-Control-Allow-Origin` (ACAO)** | the origin allowed to read the response, or `*` | Fetch; MDN |
      | **`Access-Control-Allow-Credentials` (ACAC)** | `true` lets the named origin read a credentialed response | Fetch; MDN |
      | **`Set-Cookie` attributes** | `Secure`, `HttpOnly`, `SameSite`, `Domain`, `Path`, `Expires`/`Max-Age`, `Partitioned` | RFC 6265, 6265bis draft |
      | **Cookie prefixes** | `__Secure-` and `__Host-` names that make the browser refuse the cookie unless rules hold | 6265bis draft 4.1.3 |
      | **CSP** | `Content-Security-Policy` - where a page may load and run things from; `frame-ancestors` says who may frame it | MDN |
      | **HSTS** | `Strict-Transport-Security` - remember to use only HTTPS for this host for `max-age` seconds | RFC 6797 |
      | **`nosniff`** | `X-Content-Type-Options: nosniff` - don't guess a response's type from its content | MDN |
      | **`Referrer-Policy`** | how much of the page URL goes to other sites in the `Referer` header | MDN |
      | **Version disclosure** | `Server: SandPayPortal/0.9 Python/3.12` - tells an attacker which known flaws to try | WSTG information gathering |

      Two words to keep apart: **origin** (scheme + host + port, used by the same-origin policy and CORS) and
      **site** (scheme + registrable domain, used by `SameSite`). A request from `https://blog.sandpay.example`
      to `https://portal.sandpay.example` is **cross-origin but same-site**.

  - id: why
    kind: why
    concepts: [sec-http-origin-cors, sec-http-cookie-audit, sec-http-security-headers]
    title: Why testers check HTTP security
    body: |
      **Because the browser enforces only what the server asks for.** A portal can have perfect access control
      and still let `https://evil.example` read a signed-in merchant's payments: if the API answers any
      `Origin` with that same value plus `Access-Control-Allow-Credentials: true`, the victim's browser sends
      the victim's cookie and hands the response to the attacker's script. WSTG-CLNT-07 calls returning "the
      origin header without any additional checks" a configuration that "can lead to access of sensitive data".

      **Because one missing attribute turns a small bug into account takeover.** A reflected XSS on a search
      page can read `document.cookie` - unless the session cookie is `HttpOnly`. WSTG-SESS-02 is careful about
      the limit: HttpOnly "doesn't limit the whole attack surface of XSS attacks, as an attacker could still
      send request in place of the user, but limits immensely the reach of XSS attack vectors."

      **Because browser defaults differ, so "it seemed blocked" is not evidence.** WSTG-SESS-02: "Starting in
      2020, Chromium-based browsers (Chrome, Edge, Opera) treat any cookie set without an explicit SameSite
      attribute as SameSite=Lax by default. Firefox and Safari do not apply that default." It concludes:
      "verify the actual Set-Cookie header rather than inferring protection from observed browser behavior."

      **Because headers are cheap for defenders and valuable for attackers.** A missing `frame-ancestors` lets
      a hostile page frame the "Confirm refund" button (clickjacking, WSTG-CLNT-09); a `Server` header with a
      version narrows an attacker's search to that version's known vulnerabilities.

      **Because interviews ask exactly this.** "Explain CORS", "what does HttpOnly protect against", "what is
      SameSite" and "which headers would you check" are standard security-tester questions - and the strong
      answer always says what the mechanism does **not** protect.

  - id: origin-internals
    kind: internals
    concepts: [sec-http-origin-cors]
    title: How the browser decides - origins, reads and preflights
    body: |
      **Same origin.** MDN's own table, for the page `http://store.company.com/dir/page.html`:

      | URL | Outcome | Reason |
      | --- | --- | --- |
      | `http://store.company.com/dir2/other.html` | Same origin | Only the path differs |
      | `https://store.company.com/page.html` | Failure | Different protocol |
      | `http://store.company.com:81/dir/page.html` | Failure | Different port (`http://` is port 80 by default) |
      | `http://news.company.com/dir/page.html` | Failure | Different host |

      **What the policy blocks.** MDN sorts cross-origin interactions into three groups:

      - "Cross-origin writes are typically allowed. Examples are links, redirects, and form submissions."
      - "Cross-origin embedding is typically allowed." (scripts, stylesheets, images, media, frames)
      - "Cross-origin reads are typically disallowed, but read access is often leaked by embedding."

      The first line is the one testers remember: the same-origin policy does **not** stop a hostile page from
      **sending** a form `POST` to the portal with the victim's cookies. That is CSRF, and it needs its own
      defence (tokens, `SameSite`) - MDN: "To prevent cross-origin writes, check an unguessable token in the
      request".

      **Simple requests and preflights.** A cross-origin `fetch()` that a plain HTML form could also have sent
      (`GET`, `HEAD` or `POST`, only safelisted headers, `Content-Type` of
      `application/x-www-form-urlencoded`, `multipart/form-data` or `text/plain`) goes straight to the server.
      MDN explains why: forms could always do this, so "the server doesn't have to opt-in (by responding to a
      preflight request) to receive any request that looks like a form submission ... However, the server
      still must opt-in using Access-Control-Allow-Origin to share the response with the script."

      Anything else - `PUT`, `DELETE`, `Content-Type: application/json`, an `Authorization` header - is
      preflighted: the browser first sends `OPTIONS` with `Access-Control-Request-Method` and
      `Access-Control-Request-Headers`, and sends the real request only if the answer allows it. MDN:
      "CORS-preflight requests must never include credentials."

      **When script may read the response.** From MDN's "Credentialed requests and wildcards":

      - Without credentials, `Access-Control-Allow-Origin: *` or the exact requesting origin lets script read.
      - With credentials, the server "must not specify the * wildcard ... but must instead specify an explicit
        origin", and must send `Access-Control-Allow-Credentials: true`. "If a request includes a credential
        ... and the response includes an Access-Control-Allow-Origin: * header ... the browser will block
        access to the response".
      - If the allowed origin varies with the request, "the server should also include Origin in the Vary
        response header", otherwise a shared cache can replay one origin's permission to another.

      **What CORS is not.** The server still receives and processes the request - CORS only decides whether
      the *browser* shows the response to the page. curl, Postman, a mobile app or a proxy ignore it entirely.
      WSTG-CLNT-07: the `Origin` header "may be spoofed outside the browser ... so you still need to check that
      application-level protocols are used to protect sensitive data."

  - id: cookie-header-internals
    kind: internals
    concepts: [sec-http-cookie-audit, sec-http-security-headers]
    title: What each cookie attribute and security header does
    body: |
      **Cookie attributes** (WSTG-SESS-02, RFC 6265 and the 6265bis draft; attribute names are compared
      case-insensitively - RFC 6265 section 5.2):

      | Attribute | Effect | Missing it means |
      | --- | --- | --- |
      | `Secure` | "only send the cookie if the request is being sent over a secure channel such as HTTPS" | the session id can travel in clear over HTTP |
      | `HttpOnly` | not readable by `document.cookie` | any XSS can steal the session id |
      | `SameSite=Strict` | never sent on cross-site requests, even top-level links | - |
      | `SameSite=Lax` | sent on cross-site top-level `GET` navigations only | - |
      | `SameSite=None` | sent everywhere; must be `Secure` - "Chromium-based browsers and Firefox reject a SameSite=None cookie without Secure" | - |
      | no `SameSite` | browser-dependent: Lax in Chromium (with a two-minute `POST` exception), not in Firefox or Safari | CSRF protection depends on the victim's browser |
      | `Domain=...` | sent to that domain **and its subdomains** | (setting it) widens exposure to every subdomain |
      | `__Secure-` name | rejected unless `Secure` | - |
      | `__Host-` name | rejected unless `Secure`, `Path=/` and no `Domain` | - |

      WSTG-SESS-02's "most secure cookie attribute configuration":
      `Set-Cookie: __Host-SID=<session token>; path=/; Secure; HttpOnly; SameSite=Strict`.

      **Security response headers:**

      | Header | What it does | Tester checks |
      | --- | --- | --- |
      | `Content-Security-Policy` | limits where the page loads and runs scripts, styles, frames from | present; no `unsafe-inline` for scripts on sensitive pages (the XSS lesson goes deeper) |
      | CSP `frame-ancestors` (or `X-Frame-Options`) | who may frame the page; `'none'` "is similar to X-Frame-Options: deny" | present on every page with actions. MDN: it "does not fall back to the default-src setting" |
      | `X-Content-Type-Options: nosniff` | browser won't treat `text/plain` as HTML or script | exact value `nosniff` |
      | `Referrer-Policy` | how much URL leaks to other sites; browsers default to `strict-origin-when-cross-origin` | present where URLs carry anything sensitive |
      | `Strict-Transport-Security` | HTTPS only for `max-age` seconds (`max-age` is REQUIRED - RFC 6797 6.1.1) | **on HTTPS responses** with a real `max-age`; `max-age=0` removes it |
      | `Server`, `X-Powered-By` | product and version | no version numbers |

      HSTS has a rule that trips up scanners: RFC 6797 section 8.1, "If an HTTP response is received over
      insecure transport, the UA MUST ignore any present STS header field(s)." Asking for HSTS on a plain
      `http://` URL is a false positive; the right check on HTTP is that it **redirects** to HTTPS (section 7.2:
      it "SHOULD send an HTTP response message containing a status code indicating a permanent redirect").

  - id: when
    kind: when
    concepts: [sec-http-origin-cors, sec-http-cookie-audit, sec-http-security-headers]
    title: When these checks matter - and what they do not replace
    body: |
      **Run them on every web application and API in scope, early.** They are fast, need only an intercepting
      proxy or curl, and their findings shape later tests: a reflected CORS origin makes every authenticated
      `GET` a data-theft test; a missing `HttpOnly` raises the severity of any XSS you find later.

      **Read the headers of every kind of response**, not just the home page: API JSON, HTML pages, redirects,
      file downloads and **error pages** - headers are often added in one code path (a framework middleware)
      and missing from another (the 404 handler or a reverse proxy's error page).

      **Rate findings by context:**

      | Finding | Serious when | Low or none when |
      | --- | --- | --- |
      | ACAO reflects any origin **with** credentials | the endpoint returns data for the signed-in user | the endpoint is public and uses no cookies |
      | `Access-Control-Allow-Origin: *` | the response is sensitive and protected only by network location (WSTG-CLNT-07) | a public API or public assets |
      | session cookie without `HttpOnly` | almost always | a non-session cookie script must read (a CSRF double-submit token) |
      | no `frame-ancestors` | pages with state-changing buttons | a static, action-free page |
      | no HSTS | HTTPS site with logins | plain-HTTP-only lab or `localhost` |

      **What they do not replace:** authorisation tests (CORS never stops curl), CSRF tests (the same-origin
      policy lets writes through), XSS tests (a CSP reduces impact but is not output encoding), or TLS testing
      (HSTS assumes the certificate and configuration are sound).

  - id: visual
    kind: visual
    concepts: [sec-http-origin-cors]
    title: A reflected-origin CORS attack, step by step
    body: |
      ```mermaid
      sequenceDiagram
        participant V as Victim browser (signed in to SandPay)
        participant E as evil.example page
        participant P as portal.sandpay.example API
        V->>E: visits the attacker's page
        E->>V: script calls fetch on the portal API with credentials included
        V->>P: GET /api/payments with Origin evil.example and the sid cookie
        P-->>V: 200 payments JSON, ACAO evil.example, ACAC true
        Note over V: Origin allowed by name and credentials allowed, so the browser hands over the body
        V-->>E: the victim's payments
        E->>E: sends them to the attacker
      ```

      Notice three things. The request reached the server and was processed whatever the headers said - CORS
      only decided the last step. The cookie went along because the victim was signed in (and the cookie's
      `SameSite` mode allowed it). And the fix is on the server: allow a fixed list of origins and compare
      exactly, never echo the `Origin` header back.

  - id: curl-evidence
    kind: code
    concepts: [sec-http-cookie-audit, sec-http-security-headers]
    title: Reading the real headers with curl
    body: |
      Start the portal twice - vulnerable, then with two flaws fixed - and read only the response headers
      (`-D -` dumps them, `-o /dev/null` discards the body). The `Date` line is left out.

      ```bash
      cd practice/security
      .venv/bin/python support/sandpay_vuln.py --port 8765        # vulnerable
      curl -s -D - -o /dev/null http://127.0.0.1:8765/health
      ```

      ```http
      HTTP/1.1 200 OK
      Server: SandPayPortal/0.9 Python/3.12
      Content-Type: application/json
      Content-Length: 16
      ```

      Sign in and look at the session cookie:

      ```bash
      curl -s -D - -o /dev/null -H 'Content-Type: application/json' \
        -d '{"email": "alice@shop-a.example", "password": "alice-pass-1"}' http://127.0.0.1:8765/api/login
      ```

      ```http
      Set-Cookie: sid=LPga5EOz_-HZcZlhR6zr0m8Rd7V-KlBV; Path=/
      ```

      The same requests against `support/sandpay_vuln.py --port 8765 --fix weak-session --fix missing-headers`:

      ```http
      HTTP/1.1 200 OK
      Server: SandPay
      Content-Type: application/json
      Content-Security-Policy: default-src 'self'; frame-ancestors 'none'
      X-Content-Type-Options: nosniff
      Referrer-Policy: no-referrer
      Strict-Transport-Security: max-age=31536000
      Content-Length: 16
      ```

      ```http
      Set-Cookie: sid=-qwkn3foGyLB2clIif29618BjRzn_t1M; Path=/; HttpOnly; Secure; SameSite=Lax
      ```

      Three observations a tester writes down. The vulnerable session cookie has no `Secure`, `HttpOnly` or
      `SameSite`. The vulnerable `Server` header names the product, the language and both versions. And the
      fixed portal sends HSTS over plain HTTP - harmless, but browsers ignore it there (RFC 6797 8.1), so only
      the deployed HTTPS site can prove HSTS works.

  - id: auditors-code
    kind: code
    collapsed: true
    concepts: [sec-http-cookie-audit, sec-http-security-headers]
    title: The cookie auditor and header checker (reference solutions)
    body: |
      From `practice/security/solutions/foundations/http_cookies.py`:

      ```python
      def audit_cookie(header: str, *, session: bool = True, https: bool = True) -> list[str]:
          c = parse_set_cookie(header)
          a = c.attributes
          secure = "secure" in a
          findings: set[str] = set()
          if https and not secure:
              findings.add("missing-secure")
          if session and "httponly" not in a:
              findings.add("missing-httponly")
          samesite = a.get("samesite")
          if session and samesite in (None, True, ""):
              findings.add("missing-samesite")
          if isinstance(samesite, str) and samesite.lower() == "none" and not secure:
              findings.add("samesite-none-without-secure")
          if session and "domain" in a:
              findings.add("domain-widens-scope")
          if c.name.startswith("__Host-") and not (secure and a.get("path") == "/" and "domain" not in a):
              findings.add("invalid-host-prefix")
          if c.name.startswith("__Secure-") and not secure:
              findings.add("invalid-secure-prefix")
          return sorted(findings)
      ```

      From `practice/security/solutions/foundations/http_headers.py`:

      ```python
      def check_security_headers(headers: dict[str, str], *, https: bool) -> list[str]:
          h = _lower(headers)
          findings: set[str] = set()
          csp = h.get("content-security-policy")
          if csp is None:
              findings.add("missing-csp")
          directives = {d.strip().split(" ", 1)[0].lower() for d in (csp or "").split(";") if d.strip()}
          if "frame-ancestors" not in directives and "x-frame-options" not in h:
              findings.add("missing-frame-ancestors")
          if h.get("x-content-type-options", "").strip().lower() != "nosniff":
              findings.add("missing-nosniff")
          if "referrer-policy" not in h:
              findings.add("missing-referrer-policy")
          if https:
              sts = h.get("strict-transport-security")
              if sts is None:
                  findings.add("missing-hsts")
              else:
                  m = re.search(r"(?i)(?:^|;)\s*max-age\s*=\s*\"?(\d+)\"?", sts)
                  if not m or int(m.group(1)) == 0:
                      findings.add("invalid-hsts")
          for name in ("server", "x-powered-by"):
              if re.search(r"\d+(\.\d+)*", h.get(name, "")):
                  findings.add("version-disclosure")
          return sorted(findings)
      ```

      Run against both portals (the cookie audited as if deployed on HTTPS, the headers scanned on three kinds
      of response):

      ```plaintext
      vulnerable  audit: ['missing-httponly', 'missing-samesite', 'missing-secure']
      vulnerable  scan:  /health, /search?q=refund and /no-such-page each ->
                         ['missing-csp', 'missing-frame-ancestors', 'missing-nosniff',
                          'missing-referrer-policy', 'version-disclosure']
      fixed       audit: []
      fixed       scan:  {}
      ```

  - id: line-by-line
    kind: line-by-line
    concepts: [sec-http-origin-cors, sec-http-cookie-audit, sec-http-security-headers]
    title: The lines that make the checks trustworthy
    body: |
      **`a = c.attributes` with lower-cased keys.** RFC 6265 compares attribute names case-insensitively;
      `secure`, `Secure` and `SECURE` are the same attribute. A checker that matches the exact string `Secure`
      reports false positives on real servers.

      **`if https and not secure`.** The `Secure` finding depends on where the site runs. Over plain HTTP the
      browser would never send a `Secure` cookie back at all, so the portal on `127.0.0.1` is audited "as if
      deployed on HTTPS" - say so in the report.

      **`samesite in (None, True, "")`.** A bare `SameSite` with no value is as good as none. The check states
      a requirement ("say which mode you mean") instead of guessing what the victim's browser would default to.

      **`c.name.startswith("__Host-")` - case-sensitive.** The 6265bis draft says the prefix is a
      "case-sensitive match", so `__host-SID` is an ordinary cookie with no protection. The exercise tests
      both spellings.

      **`directives = {... .split(" ", 1)[0].lower() ...}`.** Split the CSP into directives and look for the
      *name* `frame-ancestors`. Searching the whole string would accept `default-src 'none'` - which, per MDN,
      "still allows the resource to be embedded by anyone".

      **`if https:` around HSTS.** RFC 6797 8.1 makes the browser ignore HSTS on HTTP responses. The scanner
      takes HTTPS from the URL scheme, so it never demands HSTS where it cannot work.

      **`except HTTPError as err: return dict(err.headers.items())`** (in `fetch_headers`). `urllib` raises on
      4xx and 5xx, but error pages need security headers too - the 404 page is checked like any other.

      **CORS: `acao != origin` then `continue`.** In `probe_cors`, an origin counts as allowed only on an
      **exact** match - the same comparison the browser makes. A policy that answers
      `https://portal.sandpay.example.evil.example` with that same origin has been fooled by a prefix check,
      and the probe finds it only because that look-alike origin is in the probe list.

  - id: steps
    kind: steps
    concepts: [sec-http-origin-cors, sec-http-cookie-audit, sec-http-security-headers]
    title: Testing HTTP security, step by step
    body: |
      1. **Confirm scope and permission** in writing, and note which hosts are HTTPS.
      2. **Collect responses of every kind** through an intercepting proxy or curl: a public page, a signed-in
         page, an API call, a redirect, a download and an error (404 and 500).
      3. **Cookies:** sign in and capture every `Set-Cookie`. For each session or security cookie, record
         `Secure`, `HttpOnly`, `SameSite`, `Domain`, `Path`, lifetime and prefix. Repeat after a privilege
         change and after logout.
      4. **Headers:** for each response, record CSP (and `frame-ancestors`), `X-Frame-Options`,
         `X-Content-Type-Options`, `Referrer-Policy`, `Server`/`X-Powered-By` and, on HTTPS, HSTS. On HTTP,
         check for a permanent redirect to HTTPS instead.
      5. **CORS:** for authenticated endpoints, send requests with `Origin` set to (a) an unrelated origin,
         (b) look-alikes - the real origin as a prefix, as a suffix, a subdomain, `http` instead of `https` -
         and (c) `null`. Record `Access-Control-Allow-Origin`, `-Credentials` and `Vary`. Send an `OPTIONS`
         preflight for a JSON `POST` too.
      6. **Prove impact** for anything serious: for a reflected origin with credentials, a minimal proof page
         on a host you control (in the lab) that reads one harmless field of the signed-in test user's data.
      7. **Report** each finding with the exact request and response headers, the affected endpoints, the
         impact in this application and the fix - then turn the check into an automated test so it stays
         fixed.

  - id: example
    kind: example
    concepts: [sec-http-origin-cors, sec-http-cookie-audit, sec-http-security-headers]
    title: 'Example: SandPay''s merchant portal before go-live'
    body: |
      SandPay asks for a security review of the merchant portal before launch. The portal runs at
      `https://portal.sandpay.example`; a reporting dashboard at `https://reports.sandpay.example` calls the
      portal's API from the browser.

      What the tester finds, in the order they would report it:

      | # | Evidence | Finding | Severity (in this app) |
      | --- | --- | --- | --- |
      | 1 | `Origin: https://portal.sandpay.example.evil.example` -> `Access-Control-Allow-Origin` echoes it, `Access-Control-Allow-Credentials: true` on `GET /api/payments` | allow-list checked with "starts with"; any look-alike domain can read signed-in merchants' payments | high |
      | 2 | `Set-Cookie: sid=...; Path=/` | session cookie without `Secure`, `HttpOnly`, `SameSite` | high (raises any XSS to session theft) |
      | 3 | no `frame-ancestors` or `X-Frame-Options` on `/refunds/confirm` | the confirm button can be framed (clickjacking) | medium |
      | 4 | `Server: SandPayPortal/0.9 Python/3.12` on every response, including 404 | version disclosure | low |
      | 5 | no `Referrer-Policy` | browsers default to `strict-origin-when-cross-origin`; no URL carries tokens | informational |

      Note what the tester did **not** report: `Access-Control-Allow-Origin: *` on the public `/fees.json`
      (public data, no cookies), and missing HSTS on the `http://` URL (it redirects with `301` to HTTPS, and
      the HTTPS response has `max-age=31536000`).

      The fix for #1 is an exact-match allow-list containing `https://reports.sandpay.example`, plus
      `Vary: Origin`. The retest sends the same look-alike origin and shows no `Access-Control-Allow-Origin`
      in the response - and the automated probe joins the regression suite.

  - id: tests
    kind: tests
    concepts: [sec-http-origin-cors, sec-http-cookie-audit, sec-http-security-headers]
    title: Positive and negative test cases
    body: |
      | # | Test | Expected (secure) | Evidence |
      | --- | --- | --- | --- |
      | 1 | Sign in; inspect the session `Set-Cookie` | `Secure; HttpOnly; SameSite=Lax` or `Strict`; no `Domain`; ideally `__Host-` | raw response header |
      | 2 | `document.cookie` in the console after sign-in | session cookie not listed | console screenshot |
      | 3 | `GET` an authenticated API with `Origin: https://evil.example` | no `Access-Control-Allow-Origin` (or not that value) | request and response headers |
      | 4 | Same with `Origin: https://portal.sandpay.example.evil.example` and `Origin: https://evilportal.sandpay.example` | not allowed | headers |
      | 5 | Same with `Origin: null` | not allowed | headers |
      | 6 | Same with the real dashboard origin | that exact origin, `Access-Control-Allow-Credentials: true`, `Vary: Origin` | headers |
      | 7 | `OPTIONS` preflight for `POST` with `Content-Type: application/json` from an untrusted origin | no allow headers; the real request is not sent by a browser | headers |
      | 8 | Any page with actions, and its 404 | `frame-ancestors 'none'` (or a named parent) | headers |
      | 9 | Every response type | `X-Content-Type-Options: nosniff`; no versions in `Server`/`X-Powered-By` | headers |
      | 10 | HTTPS response | `Strict-Transport-Security` with a non-zero `max-age` | headers |
      | 11 | `http://` URL | `301` or `308` to the `https://` URL | status and `Location` |

      **Negative controls** keep the checks honest: the public `/fees.json` may use `*`; a `theme` cookie may
      omit `HttpOnly`; HSTS on the plain-HTTP lab is not required. A good automated check passes all of these
      against the fixed portal - which is exactly what the exercises test.

  - id: mistakes
    kind: mistakes
    concepts: [sec-http-origin-cors, sec-http-cookie-audit, sec-http-security-headers]
    title: Common mistakes and a debugging method
    body: |
      - **Treating CORS as access control.** "The API has CORS, so other sites can't call it." Other sites can
        *call* it; CORS only governs whether browser script can *read* the answer. Test authorisation with
        curl, outside the browser.
      - **Reporting `*` as critical everywhere.** Without credentials, `*` on public data is correct. The
        serious case is a reflected origin **with** `Access-Control-Allow-Credentials: true`.
      - **Probing only `https://evil.example`.** A flawed allow-list (`startswith`, `endswith`, an unanchored
        regex) rejects that and accepts `https://portal.sandpay.example.evil.example` or
        `https://evilportal.sandpay.example`. Include look-alikes and `null`.
      - **Inferring SameSite protection from one browser.** Chromium's Lax default does not exist in Firefox
        or Safari (WSTG-SESS-02). Read the header.
      - **Case-sensitive attribute matching.** `secure` and `Secure` are the same attribute; `__host-` and
        `__Host-` are not the same prefix.
      - **Checking only the home page.** Error pages, redirects and downloads often lack the headers.
      - **Demanding HSTS over HTTP.** Browsers ignore it there (RFC 6797 8.1); check the redirect instead.
      - **Believing `default-src 'none'` stops framing.** It does not; `frame-ancestors` has no fallback.

      **Debugging method when a check "fails" unexpectedly:** capture the raw exchange (proxy history or
      `curl -s -D -`), make sure you are looking at the final response and not a redirect, check whether a CDN
      or reverse proxy adds or strips headers (WSTG-CLNT-09: "Web proxies are known for adding and stripping
      headers"), and compare one good and one bad endpoint side by side.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [sec-http-origin-cors, sec-http-cookie-audit, sec-http-security-headers]
    title: Trade-offs and limits
    body: |
      - **`SameSite=Strict` versus usability.** WSTG-SESS-02: with Strict, a user who follows a link from
        webmail "appears to be signed out" on that first request. Many sites choose `Lax` for the session and
        rely on CSRF tokens for state changes.
      - **`SameSite` compares sites, not origins.** WSTG-SESS-02: if an attacker controls any subdomain
        (through XSS or a subdomain takeover) they can send requests with the cookies, "even Strict ones".
      - **Framing protection is not the whole clickjacking story.** WSTG-CLNT-09 describes DoubleClickjacking
        (2024), where the target page loads top-level, "so X-Frame-Options and the frame-ancestors directive
        don't apply".
      - **Header checks are configuration checks.** They find missing defences, not exploitable bugs; report
        them with honest severity, or they drown the real findings.
      - **Automated scanners** (ZAP, Burp - covered in later lessons) find most of these quickly but cannot
        judge context (public `*` vs reflected credentials, a non-session cookie). The checks in this lesson
        take parameters (`session`, `https`) for exactly that reason.

  - id: summary
    kind: summary
    concepts: [sec-http-origin-cors, sec-http-cookie-audit, sec-http-security-headers]
    title: Quick reference
    body: |
      - **Origin** = scheme + host + port. **Site** = scheme + registrable domain.
      - Same-origin policy: cross-origin **writes and embeds allowed, reads blocked**. It does not stop CSRF.
      - CORS lets named origins **read**; the server still receives every request. curl ignores CORS.
      - Readable cross-origin: `*` or exact origin without credentials; exact origin **plus** `ACAC: true`
        with credentials; `*` never works with credentials. Dynamic ACAO needs `Vary: Origin`.
      - Probe with an unrelated origin, look-alikes and `null`. The serious finding: reflected origin with
        credentials on a user-data endpoint.
      - Session cookie: `Secure; HttpOnly; SameSite=Lax|Strict`, no `Domain`, ideally `__Host-` (Secure,
        `Path=/`, no Domain). Attribute names case-insensitive; prefixes case-sensitive.
      - Headers: CSP with `frame-ancestors` (no `default-src` fallback), `nosniff`, `Referrer-Policy`, HSTS
        with non-zero `max-age` **on HTTPS only**, no versions in `Server`/`X-Powered-By`.
      - Check every response type, including errors. Read the header, not the browser's behaviour.

exercises:
  - id: same-origin-pick
    type: mcq
    concept: sec-http-origin-cors
    skill: application
    title: Which URL is same-origin?
    prompt: |
      The page is `https://portal.sandpay.example/settings`. Which URL is **same-origin** with it?
    options:
      - id: explicit-443
        text: '`https://portal.sandpay.example:443/api/payments`'
        feedback: Correct - 443 is the default https port, so the tuple is the same; path and query never matter.
      - id: http
        text: '`http://portal.sandpay.example/settings`'
        feedback: Different scheme - http and https are different origins even on the same host.
      - id: subdomain
        text: '`https://api.portal.sandpay.example/settings`'
        feedback: A subdomain is a different host, so a different origin (though it is the same site).
      - id: port
        text: '`https://portal.sandpay.example:8443/settings`'
        feedback: A different port is a different origin.
    correct: [explicit-443]
    hints:
      - An origin is three things. Which of them does a path change?
      - What port does an https URL use when none is written?
    solution: |
      Origin = (scheme, host, port). `https://...:443` has the same tuple as `https://...` with no port. A
      different scheme, host or port is a different origin.

  - id: sop-writes
    type: mcq
    concept: sec-http-origin-cors
    skill: analysis
    title: The form that posts across origins
    prompt: |
      A page on `https://evil.example` contains an auto-submitting HTML form that `POST`s
      `email=attacker@evil.example` to `https://portal.sandpay.example/settings/email`. The victim is signed in
      and the portal sends **no** CORS headers. What happens?
    options:
      - id: sent
        text: The browser sends the POST (with cookies, if their SameSite mode allows) and the server processes it; only reading the response is blocked
        feedback: Correct - cross-origin writes are allowed; this is CSRF, and it needs tokens or SameSite, not CORS.
      - id: blocked
        text: The same-origin policy blocks the request, because there is no Access-Control-Allow-Origin
        feedback: The policy blocks reading responses, not sending forms. MDN - "Cross-origin writes are typically allowed."
      - id: preflight
        text: The browser sends a preflight OPTIONS first and stops when the portal does not answer it
        feedback: A form POST with a form content type is a simple request - no preflight.
      - id: no-cookies
        text: The request is sent, but browsers never attach cookies to cross-origin requests
        feedback: Cookies go with cross-origin requests unless SameSite (or a browser default) stops them.
    correct: [sent]
    hints:
      - MDN sorts cross-origin interactions into writes, embeds and reads. Which one is a form submission?
    solution: |
      The same-origin policy lets the write through. Whether the cookie goes along depends on `SameSite`; the
      real defence is a CSRF token checked by the server. CORS headers are irrelevant to this attack.

  - id: wildcard-credentials
    type: mcq
    concept: sec-http-origin-cors
    skill: application
    title: Wildcard plus credentials
    prompt: |
      An API answers every request with:

      ```http
      Access-Control-Allow-Origin: *
      Access-Control-Allow-Credentials: true
      ```

      A page on `https://evil.example` calls it with `fetch(url, { credentials: "include" })`. What happens?
    options:
      - id: blocked
        text: The browser sends the request with cookies but blocks the page from reading the response
        feedback: Correct - MDN - with a credential and a wildcard, "the browser will block access to the response".
      - id: readable
        text: The page reads the response, because * allows every origin
        feedback: The wildcard is never valid for credentialed requests.
      - id: not-sent
        text: The browser refuses to send the request at all
        feedback: A GET is sent; the block is on reading the response.
      - id: readable-no-cookie
        text: The page reads the response, but without the cookie being sent
        feedback: The fetch asked for credentials; the browser sends them and then blocks the read.
    correct: [blocked]
    hints:
      - Look for MDN's "Credentialed requests and wildcards".
    solution: |
      `*` cannot be combined with credentials. This configuration is broken rather than exploitable as is - but
      a developer "fixing" it often switches to echoing the `Origin`, which is.
    followUp: |
      The developer changes the server to send `Access-Control-Allow-Origin: <the request's Origin>` with the
      same `Access-Control-Allow-Credentials: true`. What is the finding now?

  - id: reflection-impact
    type: mcq
    concept: sec-http-origin-cors
    skill: analysis
    title: How bad is the reflected origin?
    prompt: |
      Your probe shows `GET /api/merchants/m_100` echoes any `Origin` into `Access-Control-Allow-Origin` and
      sends `Access-Control-Allow-Credentials: true`. The response holds the merchant's payout IBAN. The
      session cookie is `SameSite=None; Secure; HttpOnly`. What is the impact?
    options:
      - id: theft
        text: Any website a signed-in merchant visits can read the merchant's details, including the IBAN
        feedback: Correct - the cookie is sent cross-site (SameSite=None) and the reflected origin with credentials lets the page read it.
      - id: none-httponly
        text: None, because the cookie is HttpOnly
        feedback: HttpOnly stops script reading the cookie, not the browser sending it. The attacker never needs the cookie itself.
      - id: csrf-only
        text: Only CSRF - attackers can send requests but never read responses
        feedback: That is the normal situation; the CORS headers here explicitly grant the read.
      - id: curl
        text: Only someone with curl and a stolen cookie could abuse it
        feedback: The point of the attack is that the victim's browser supplies the cookie.
    correct: [theft]
    hints:
      - Would the browser attach the cookie to a cross-site fetch? Would it then let the page read the body?
    solution: |
      Reflection with credentials on a user-data endpoint is high severity. SameSite=Lax or Strict would block
      the cookie on that cross-site fetch and reduce it - but the fix is an exact-match allow-list.

  - id: vary-origin
    type: mcq
    concept: sec-http-origin-cors
    skill: analysis
    title: The intermittent CORS error
    prompt: |
      The API allows two dashboards by echoing the request's `Origin` if it is on an allow-list. Users of the
      second dashboard sometimes see CORS errors; a CDN caches the API's `GET` responses. Responses carry
      `Access-Control-Allow-Origin` but no `Vary` header. What is the most likely cause?
    options:
      - id: vary
        text: The CDN serves a response cached for one dashboard's origin to the other, because the response does not say it varies by Origin
        feedback: Correct - MDN says to "include Origin in the Vary response header" when the allowed origin changes per request.
      - id: preflight
        text: The second dashboard sends preflights that the CDN drops
        feedback: Possible in theory, but the symptom matches the missing Vary exactly; check the cached ACAO value first.
      - id: credentials
        text: The second dashboard needs Access-Control-Allow-Credentials
        feedback: That would fail every time, not sometimes.
      - id: wildcard
        text: The allow-list should return * instead
        feedback: That breaks credentialed requests and allows everyone.
    correct: [vary]
    hints:
      - The error is intermittent and there is a cache. What does a cache key on by default?
    solution: |
      Confirm it by requesting the same URL with each origin through the CDN and comparing the cached
      `Access-Control-Allow-Origin`. Fix: `Vary: Origin`. As a security finding, a missing Vary can also hand
      one origin's permission to another.

  - id: null-origin
    type: mcq
    concept: sec-http-origin-cors
    skill: recall
    title: Why allow-listing null is dangerous
    prompt: |
      A developer allow-listed `Origin: null` "for local testing from files". Why does WSTG-CLNT-07 treat this as
      a vulnerability?
    options:
      - id: sandbox
        text: Any attacker page can send Origin null from a sandboxed iframe, so null works like a wildcard
        feedback: Correct - WSTG - "An attacker can programmatically generate a request with the origin null by using a sandboxed iframe."
      - id: never-sent
        text: Browsers never send null, so the entry is just dead configuration
        feedback: Browsers do send null - from sandboxed frames, local files and some redirects.
      - id: only-files
        text: Only local files send null, and attackers cannot make victims open local files
        feedback: Sandboxed iframes on any web page also send null.
      - id: curl
        text: Because curl sends null by default
        feedback: curl sends no Origin header unless you add one.
    correct: [sandbox]
    hints:
      - Which HTML feature forces a frame's origin to be opaque?
    solution: |
      `null` is an origin any page can produce. Treat it as untrusted and include it in every CORS probe.

  - id: httponly-limit
    type: mcq
    concept: sec-http-cookie-audit
    skill: analysis
    title: What HttpOnly does not stop
    prompt: |
      The session cookie is `HttpOnly`. A tester finds a stored XSS in merchant notes. Which statement is right?
    options:
      - id: requests
        text: The script cannot read the session id, but it can still send requests as the victim from the victim's browser
        feedback: Correct - WSTG - "an attacker could still send request in place of the user".
      - id: harmless
        text: The XSS is harmless, because HttpOnly stops script from using the session
        feedback: The browser attaches the cookie to the script's same-origin requests; the script just cannot see its value.
      - id: blocks-xss
        text: HttpOnly stops the script from running
        feedback: HttpOnly is a cookie attribute; it has no effect on whether script runs. That is CSP and output encoding.
      - id: secure-too
        text: The XSS is only harmful if the cookie also lacks Secure
        feedback: Secure is about the transport; it does not change what the script can do.
    correct: [requests]
    hints:
      - Does the page's own fetch() to the portal carry the cookie?
    solution: |
      HttpOnly stops session theft (the id leaving the browser), not session riding. Report the XSS at full
      severity; HttpOnly only reduces it.

  - id: samesite-site
    type: mcq
    concept: sec-http-cookie-audit
    skill: analysis
    title: Strict, but not safe from a subdomain
    prompt: |
      The portal session cookie is `SameSite=Strict`. A tester finds a forgotten marketing app at
      `https://promo.sandpay.example` with a stored XSS. Can the XSS make requests to
      `https://portal.sandpay.example` that carry the session cookie?
    options:
      - id: yes-same-site
        text: Yes - both hosts are the same site, so SameSite does not restrict requests between them
        feedback: Correct - WSTG - SameSite "compares sites, not origins"; an attacker on any subdomain gets "even Strict ones".
      - id: no-strict
        text: No - Strict never sends the cookie on requests from another origin
        feedback: SameSite works on sites, not origins. promo and portal are different origins but the same site.
      - id: no-domain
        text: No - the cookie has no Domain attribute, so it is never sent to promo
        feedback: The request goes to portal, which is the cookie's host; where the request starts is what SameSite judges.
      - id: only-get
        text: Only for GET requests
        feedback: That describes Lax for cross-site navigations, not same-site requests.
    correct: [yes-same-site]
    hints:
      - What does WSTG-SESS-02 say SameSite compares?
    solution: |
      Report the promo XSS as a threat to the portal, and include every subdomain in scope when you assess
      SameSite.

  - id: hsts-over-http
    type: mcq
    concept: sec-http-security-headers
    skill: application
    title: The scanner says "HSTS missing"
    prompt: |
      A scanner flags "Strict-Transport-Security missing" on `http://portal.sandpay.example/`. The `http://`
      response is `301 Moved Permanently` to `https://portal.sandpay.example/`, whose response has
      `Strict-Transport-Security: max-age=31536000`. What do you report?
    options:
      - id: false-positive
        text: Nothing for HSTS - browsers ignore HSTS on HTTP responses; the redirect and the HTTPS header are the correct setup
        feedback: Correct - RFC 6797 8.1 - "the UA MUST ignore any present STS header field(s)" received over insecure transport.
      - id: add-to-http
        text: Ask for HSTS to be added to the HTTP response too
        feedback: It would be ignored; the redirect is the right behaviour on HTTP (RFC 6797 7.2).
      - id: medium
        text: Report medium severity, because scanners are usually right
        feedback: Confirm the claim against the standard and the real responses before reporting it.
      - id: remove-redirect
        text: Report the redirect as an open redirect
        feedback: A redirect from http to the same https URL is not an open redirect.
    correct: [false-positive]
    hints:
      - Read RFC 6797 section 8.1 on HTTP responses.
    solution: |
      Mark it as a false positive with the evidence: the `301` and the HTTPS `Strict-Transport-Security`
      header. Consider preloading separately; it is not what the scanner checked.

  - id: frame-ancestors-default
    type: mcq
    concept: sec-http-security-headers
    skill: analysis
    title: A strict CSP that still allows framing
    prompt: |
      The refund confirmation page sends `Content-Security-Policy: default-src 'none'; script-src 'self'` and no
      `X-Frame-Options`. Can a hostile site frame it?
    options:
      - id: yes
        text: Yes - frame-ancestors does not fall back to default-src, so framing is unrestricted
        feedback: Correct - MDN - a policy that declares default-src 'none' "still allows the resource to be embedded by anyone".
      - id: no-default
        text: No - default-src 'none' blocks everything, including being framed
        feedback: default-src covers what the page loads, not who may embed the page.
      - id: no-script
        text: No - script-src 'self' stops the hostile page's scripts
        feedback: The hostile page's scripts are governed by its own policy, not this one.
      - id: only-old
        text: Only in browsers that do not support CSP
        feedback: In every CSP-supporting browser frame-ancestors is separate; with neither header, framing is allowed.
    correct: [yes]
    hints:
      - Which directives fall back to default-src, and is frame-ancestors one of them?
    solution: |
      Add `frame-ancestors 'none'` (or the named parents that need it). Confirm with a test page that frames
      the URL in the lab.

  - id: cors-test-order
    type: order
    concept: sec-http-origin-cors
    skill: application
    title: Test an API's CORS policy
    prompt: Put the steps of a CORS test of an authenticated endpoint in order.
    items:
      - id: baseline
        text: Send the request with the legitimate front-end origin and record ACAO, ACAC and Vary
      - id: unrelated
        text: Repeat with an unrelated origin such as https://evil.example
      - id: lookalike
        text: Repeat with look-alike origins (the real origin as prefix or suffix, a subdomain, http instead of https)
      - id: null-probe
        text: Repeat with Origin null
      - id: preflight
        text: Send an OPTIONS preflight for a non-simple request (JSON POST) from an untrusted origin
      - id: impact
        text: For any allowed untrusted origin with credentials, prove impact with a minimal proof page in the lab
      - id: report
        text: Report each allowed origin with request and response headers, impact and an exact-match fix
    hints:
      - Know what "correct" looks like before you test what "wrong" looks like.
    solution: |
      Baseline, then the three kinds of untrusted origin, then preflights, then impact, then report. The
      baseline tells you whether the server reflects, matches or uses a wildcard.

  - id: cors-debug
    type: debug
    concept: sec-http-origin-cors
    skill: analysis
    title: The allow-list that lets attackers in
    prompt: |
      This Python view adds CORS headers for SandPay's dashboard. Which line is the defect?
    language: python
    code: |
      ALLOWED = "https://reports.sandpay.example"

      def add_cors(request, response):
          origin = request.headers.get("Origin", "")
          if origin.startswith(ALLOWED):
              response.headers["Access-Control-Allow-Origin"] = origin
              response.headers["Access-Control-Allow-Credentials"] = "true"
              response.headers["Vary"] = "Origin"
          return response
    correctLines: [5]
    lineNotes:
      - line: 6
        note: Echoing the origin is fine once the check is an exact match - the bug is the check.
      - line: 8
        note: Vary Origin is correct for a per-request ACAO.
    hints:
      - Which hostname starts with https://reports.sandpay.example but is not SandPay's?
    solution: |
      `startswith` accepts `https://reports.sandpay.example.evil.example`. Compare exactly against a set:
      `if origin in {"https://reports.sandpay.example"}:`.

  - id: cors-not-authz
    type: short
    concept: sec-http-origin-cors
    skill: analysis
    title: '"We have CORS, so the API is protected"'
    prompt: |
      A developer says the merchant API needs no authorisation checks on `DELETE /api/notes/{id}` because "CORS
      only allows our own front end". Explain to them, in a few sentences, why this is wrong and what you would
      test instead.
    modelAnswer: |
      CORS is a browser read permission, not access control. Any client outside the browser - curl, a script, a
      mobile app, a proxy - ignores it and can send `DELETE` with any `Origin` header it likes (WSTG-CLNT-07:
      the Origin header "may be spoofed outside the browser"). Even in the browser, CORS decides whether a page
      may read the response, and simple requests are sent without asking. So the server must authenticate the
      caller and check that the note belongs to the caller's merchant. I would test with curl: as merchant A,
      delete merchant B's note; without a session; and with a forged `Origin`.
    rubric:
      - Says CORS is enforced by browsers only and governs reading responses.
      - Says non-browser clients ignore CORS and can forge Origin.
      - Says the server must authenticate and authorise every request.
      - Proposes concrete tests (other merchant's object, no session, forged Origin) outside the browser.
    hints:
      - Who enforces CORS? Who sends a request from curl?
    solution: |
      CORS controls browser reads; authorisation must be on the server. Prove it with curl and another
      merchant's note.

  - id: http-testdesign
    type: testdesign
    concept: sec-http-security-headers
    skill: application
    title: Test plan for the portal's HTTP security configuration
    prompt: |
      Design test cases for the SandPay portal's cookies, CORS and security headers before go-live. The portal
      is HTTPS at `https://portal.sandpay.example`, the API is called from `https://reports.sandpay.example`,
      and `/fees.json` is public. For each case give preconditions, steps, the expected result and the
      evidence you keep.
    modelAnswer: |
      Preconditions for all: written authorisation, test merchant accounts A and B, a proxy capturing traffic.

      1. **Session cookie** - sign in as A. Expected: `Secure; HttpOnly; SameSite=Lax` or `Strict`, no
         `Domain`, ideally `__Host-`. Evidence: raw `Set-Cookie`.
      2. **Cookie not readable by script** - console `document.cookie`. Expected: no session id. Evidence:
         screenshot.
      3. **CORS baseline** - `GET /api/payments` with `Origin: https://reports.sandpay.example`. Expected:
         that origin in ACAO, `ACAC: true`, `Vary: Origin`. Evidence: headers.
      4. **CORS untrusted** - same with `https://evil.example`, `https://reports.sandpay.example.evil.example`,
         `https://evilreports.sandpay.example`, `http://reports.sandpay.example` and `null`. Expected: none
         allowed. Evidence: one request/response pair per origin.
      5. **Preflight** - `OPTIONS` for JSON `POST` from `https://evil.example`. Expected: no allow headers.
      6. **Public data** - `/fees.json` may send `*` without credentials. Expected: no `ACAC`. Evidence:
         headers (negative control).
      7. **Framing** - pages with actions and their 404. Expected: `frame-ancestors 'none'`. Evidence:
         headers plus a lab page that tries to frame them.
      8. **Other headers** - every response type including 404 and 500. Expected: `nosniff`,
         `Referrer-Policy`, no versions in `Server`. Evidence: header dump per type.
      9. **HSTS** - HTTPS response has non-zero `max-age`; `http://` returns `301`/`308` to HTTPS. Evidence:
         both responses.
    rubric:
      - Each case has preconditions, steps, an expected result and concrete evidence.
      - Covers cookie attributes and confirms HttpOnly in the browser.
      - Probes CORS with unrelated, look-alike and null origins, plus a legitimate baseline.
      - Includes negative controls (public wildcard, HSTS over HTTP) so checks do not over-report.
      - Checks headers on error responses, not just the home page.
    hints:
      - What does the secure answer look like for each check, and how would you prove it?
      - Which responses are most often forgotten?
    solution: |
      Cover cookies, CORS (baseline, untrusted, look-alike, null, preflight), framing, headers on every
      response type and HSTS on HTTPS - with negative controls so the plan does not over-report.

  - id: interview-cors
    type: interview
    concept: sec-http-origin-cors
    skill: analysis
    title: 'Interview: explain CORS and how you would test it'
    prompt: |
      "Explain the same-origin policy and CORS, and tell me how you would test an API's CORS configuration."
    modelAnswer: |
      An origin is scheme, host and port. The same-origin policy lets a page send most cross-origin requests
      and embed resources, but not read cross-origin responses. CORS is how a server opts in to let named
      origins read: `Access-Control-Allow-Origin` with `*` or an exact origin; for requests with cookies it must
      be an exact origin plus `Access-Control-Allow-Credentials: true` - `*` never works with credentials.
      Non-simple requests such as JSON `POST` are preflighted with `OPTIONS`.

      CORS is a browser read permission, not access control - curl ignores it - so I test authorisation
      separately. For CORS I record the legitimate origin's response as a baseline, then send untrusted
      origins: an unrelated one, look-alikes that beat prefix or suffix checks, `http` versions and `null`.
      The serious finding is an untrusted origin reflected with credentials on an endpoint that returns user
      data; I prove it with a minimal page in the lab. I also check `Vary: Origin` and preflights, and report
      `*` on public data as fine.
    rubric:
      - Defines origin and states that the policy blocks reads, not writes.
      - Explains ACAO, credentials and why * fails with credentials.
      - Mentions preflight for non-simple requests.
      - Says CORS is not access control.
      - Describes probing with unrelated, look-alike and null origins and judging impact by credentials and data.
    followUps:
      - How does SameSite change the impact of a reflected-origin finding?
      - Why does a missing Vary Origin matter with a CDN?
      - How would you automate this check in CI?
    hints:
      - Structure it as - definitions, what is enforced where, then the test method.
    solution: |
      Origin and policy, then CORS headers and credentials, then "not access control", then the probe method
      with look-alikes and null, and impact by credentials and data.

  - id: cookie-auditor-code
    type: coding
    concept: sec-http-cookie-audit
    skill: application
    title: Write a Set-Cookie auditor
    prompt: |
      In `practice/security/exercises/foundations/http_cookies.py`, implement `parse_set_cookie` and
      `audit_cookie`. The auditor returns finding codes such as `missing-httponly` and `invalid-host-prefix`.
      The tests also sign in to the vulnerable portal: your auditor must find the weak session cookie there,
      and report **nothing** once the portal's `weak-session` flaw is fixed.
    project: security
    files: [exercises/foundations/http_cookies.py]
    test: tests/foundations/test_http_cookies.py
    command: .venv/bin/python -m pytest tests/foundations/test_http_cookies.py
    modelAnswer: |
      Parse into a name, a value and lower-cased attributes (flags become `True`). Then:

      ```python
      if https and not secure: findings.add("missing-secure")
      if session and "httponly" not in a: findings.add("missing-httponly")
      if session and samesite in (None, True, ""): findings.add("missing-samesite")
      if isinstance(samesite, str) and samesite.lower() == "none" and not secure:
          findings.add("samesite-none-without-secure")
      if session and "domain" in a: findings.add("domain-widens-scope")
      if c.name.startswith("__Host-") and not (secure and a.get("path") == "/" and "domain" not in a):
          findings.add("invalid-host-prefix")
      if c.name.startswith("__Secure-") and not secure: findings.add("invalid-secure-prefix")
      ```

      The `session` and `https` parameters keep the checks honest: a script-readable preference cookie is
      not a finding, and `Secure` only matters on HTTPS.
    rubric:
      - Every test in tests/foundations/test_http_cookies.py passes.
      - Attribute names are matched case-insensitively and prefixes case-sensitively.
      - Context (session cookie, HTTPS) decides which checks apply, so the fixed portal produces no findings.
      - Findings are codes a report or CI job can act on, not free text.
    hints:
      - Split on ";" - the first part is name=value, the rest are attributes.
      - Store bare flags (Secure, HttpOnly) as True and lower-case every attribute name.
      - __Host- needs three things - Secure, Path=/ and no Domain.
    solution: |
      Parse once, apply each WSTG-SESS-02 rule as a separate finding, and let context switch off the checks that
      do not apply.

  - id: header-checker-code
    type: coding
    concept: sec-http-security-headers
    skill: application
    title: Write a security-header scanner
    prompt: |
      In `practice/security/exercises/foundations/http_headers.py`, implement `check_security_headers`,
      `fetch_headers` and `scan`. The tests run your scanner on the vulnerable portal - every page, including a
      404, must show the missing headers and the version disclosure - and on the fixed portal, where it must
      report nothing.
    project: security
    files: [exercises/foundations/http_headers.py]
    test: tests/foundations/test_http_headers.py
    command: .venv/bin/python -m pytest tests/foundations/test_http_headers.py
    modelAnswer: |
      Lower-case the names, parse CSP into directive names, and check `frame-ancestors` (or
      `X-Frame-Options`), `nosniff`, `Referrer-Policy`, HSTS only when `https`, and digits in `Server` /
      `X-Powered-By`. `fetch_headers` must catch `HTTPError` and return `err.headers`, or the 404 page is never
      checked:

      ```python
      try:
          with urllib.request.urlopen(url, timeout=5) as resp:
              return dict(resp.headers.items())
      except HTTPError as err:
          return dict(err.headers.items())
      ```

      `scan` takes HTTPS from the URL scheme, so it never demands HSTS on plain HTTP.
    rubric:
      - Every test in tests/foundations/test_http_headers.py passes.
      - frame-ancestors is found as a directive name, and default-src does not count.
      - HSTS is required only on HTTPS, with a non-zero max-age.
      - Error responses are checked too.
    hints:
      - Which directives in default-src 'none' would stop framing? (None.)
      - urllib raises HTTPError for a 404 - where are that response's headers?
    solution: |
      Directive-level CSP parsing, HSTS only on HTTPS, and error pages included - otherwise the scanner either
      over-reports or misses the forgotten code path.

  - id: cors-probe-code
    type: coding
    concept: sec-http-origin-cors
    skill: analysis
    title: Write a CORS probe
    prompt: |
      In `practice/security/exercises/foundations/http_cors.py`, implement `origin_of`, `same_origin`,
      `browser_allows_read` and `probe_cors`. The tests feed your probe six server policies - an exact
      allow-list, reflection with and without credentials, a public wildcard, a flawed "starts with" check and a
      null allow-list - and expect the right findings for each, and none for the correct allow-list.
    project: security
    files: [exercises/foundations/http_cors.py]
    test: tests/foundations/test_http_cors.py
    command: .venv/bin/python -m pytest tests/foundations/test_http_cors.py
    modelAnswer: |
      The browser model is the heart of it:

      ```python
      if credentialed:
          return acao == origin and h.get("access-control-allow-credentials", "").lower() == "true"
      return acao == "*" or acao == origin
      ```

      The probe sends every untrusted origin plus `"null"`; `*` is a `wildcard-origin`; an exact echo is
      `allows-null-origin` for `null`, otherwise reflection with or without credentials depending on
      `browser_allows_read(..., credentialed=True)`; an echoed origin without `Origin` in `Vary` adds
      `missing-vary-origin`. Results on the six policies:

      ```plaintext
      allowlist                  []
      reflect_with_credentials   ['allows-null-origin', 'reflects-untrusted-origin-with-credentials']
      reflect_without_vary       ['allows-null-origin', 'missing-vary-origin', 'reflects-untrusted-origin']
      public_wildcard            ['wildcard-origin']
      suffix_check               ['reflects-untrusted-origin-with-credentials']
      null_allowed               ['allows-null-origin']
      ```
    rubric:
      - Every test in tests/foundations/test_http_cors.py passes.
      - Origins compare as (scheme, host, port) with default ports.
      - Wildcard never grants a credentialed read.
      - The probe set includes a look-alike origin and null, and the correct allow-list yields no findings.
    hints:
      - urlsplit gives scheme, hostname and port; port is None when not written.
      - The browser compares Access-Control-Allow-Origin to the origin exactly - no prefix matching.
      - Why does the test with only https://evil.example miss the "starts with" bug?
    solution: |
      Model the browser's exact-match rule, then probe with unrelated, look-alike and null origins; impact
      depends on credentials.

placement:
  - id: place-cors-impact
    type: mcq
    concept: sec-http-origin-cors
    skill: analysis
    title: Which CORS response is the real finding?
    prompt: |
      You send `Origin: https://evil.example` to four SandPay endpoints. Which response is a high-severity
      finding?
    options:
      - id: reflect-cred
        text: '`/api/payments` (signed-in data) - `Access-Control-Allow-Origin: https://evil.example` and `Access-Control-Allow-Credentials: true`'
        feedback: Correct - an untrusted origin may read the signed-in user's data with their cookies.
      - id: public-wildcard
        text: '`/fees.json` (public) - `Access-Control-Allow-Origin: *`'
        feedback: A wildcard on public data without credentials is a normal configuration.
      - id: none
        text: '`/api/merchants/m_100` - no Access-Control headers'
        feedback: No CORS headers means the browser will not let the page read the response - the secure default.
      - id: wildcard-cred
        text: '`/api/notes` - `Access-Control-Allow-Origin: *` and `Access-Control-Allow-Credentials: true`'
        feedback: Browsers block credentialed reads with a wildcard; broken, but not readable by the attacker.
    correct: [reflect-cred]
    solution: |
      The danger is an untrusted origin allowed by name with credentials on user data. A wildcard without
      credentials on public data is fine, and wildcard plus credentials is blocked by browsers.

  - id: place-cookie
    type: mcq
    concept: sec-http-cookie-audit
    skill: application
    title: Which session cookie passes?
    prompt: Which `Set-Cookie` for an HTTPS session would pass a WSTG-SESS-02 review with no findings?
    options:
      - id: host
        text: '`__Host-SID=k7Pq; Path=/; Secure; HttpOnly; SameSite=Lax`'
        feedback: Correct - Secure, HttpOnly, an explicit SameSite, Path=/ and no Domain satisfy the __Host- prefix.
      - id: host-domain
        text: '`__Host-SID=k7Pq; Domain=sandpay.example; Path=/; Secure; HttpOnly; SameSite=Lax`'
        feedback: A __Host- cookie must not have a Domain attribute; browsers reject it.
      - id: none-insecure
        text: '`SID=k7Pq; Path=/; HttpOnly; SameSite=None`'
        feedback: SameSite=None without Secure is rejected by Chromium and Firefox, and the cookie lacks Secure.
      - id: no-samesite
        text: '`SID=k7Pq; Path=/; Secure; HttpOnly`'
        feedback: Without SameSite the protection depends on the browser - Lax in Chromium, not in Firefox or Safari.
    correct: [host]
    solution: |
      Session cookie = Secure, HttpOnly, explicit SameSite, host-only; the __Host- prefix makes the browser
      enforce Secure, Path=/ and no Domain.

  - id: place-headers
    type: debug
    concept: sec-http-security-headers
    skill: analysis
    title: Which header line leaves the page frameable or leaks too much?
    prompt: |
      These are the response headers of the HTTPS refund confirmation page. Pick the lines that are defects.
    language: http
    code: |
      HTTP/1.1 200 OK
      Content-Type: text/html; charset=utf-8
      Content-Security-Policy: default-src 'none'; script-src 'self'; style-src 'self'
      X-Content-Type-Options: nosniff
      Strict-Transport-Security: max-age=31536000
      Referrer-Policy: strict-origin-when-cross-origin
      Server: nginx/1.27.4
    correctLines: [3, 7]
    lineNotes:
      - line: 5
        note: A one-year max-age on an HTTPS response is a good HSTS header.
      - line: 6
        note: This is the browsers' default policy; stating it is fine.
    solution: |
      Line 3 has no `frame-ancestors`, and `default-src` does not cover framing, so the page can be framed.
      Line 7 discloses the server version.

recall:
  - id: recall-origin
    concept: sec-http-origin-cors
    prompt: What makes two URLs the same origin, and what does the same-origin policy block?
    answer: Same scheme, host and port (default ports filled in). It blocks reading cross-origin responses; cross-origin writes (forms, links) and embedding are allowed.
  - id: recall-cors-credentials
    concept: sec-http-origin-cors
    prompt: When may script on another origin read a credentialed response?
    answer: Only if Access-Control-Allow-Origin is exactly that origin and Access-Control-Allow-Credentials is true. A wildcard never works with credentials.
  - id: recall-cors-probes
    concept: sec-http-origin-cors
    prompt: Which origins should a CORS probe send?
    answer: The legitimate one as a baseline, an unrelated origin, look-alikes (the real origin as prefix or suffix, subdomains, http) and null.
  - id: recall-cookie
    concept: sec-http-cookie-audit
    prompt: What does a well-configured session cookie look like?
    answer: __Host-SID=...; Path=/; Secure; HttpOnly; SameSite=Lax or Strict - no Domain. Attribute names are case-insensitive, prefixes case-sensitive.
  - id: recall-httponly
    concept: sec-http-cookie-audit
    prompt: What does HttpOnly protect against, and what not?
    answer: It stops script reading the cookie (session theft by XSS). It does not stop script sending requests with the cookie as the user.
  - id: recall-headers
    concept: sec-http-security-headers
    prompt: Name the security headers to check and the HSTS rule for plain HTTP.
    answer: CSP with frame-ancestors (no default-src fallback), X-Content-Type-Options nosniff, Referrer-Policy, HSTS with non-zero max-age on HTTPS, no versions in Server or X-Powered-By. Browsers ignore HSTS on HTTP; check for a redirect instead.

