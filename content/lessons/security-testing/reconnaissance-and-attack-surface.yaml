environment: |
  - **Runtime:** Python 3.12.3 with requests 2.34.2 and pytest 9.2.0 in `practice/security/.venv`; curl from
    Ubuntu 24.04. Every output in this lesson was printed by the code or command shown, run on Linux on
    19 November 2026 against `practice/security/support/sandpay_vuln.py` on `127.0.0.1`. Dates in headers and
    the random error reference differ on every run; everything else repeats. File paths inside the Python
    traceback were shortened to `.../practice/security/...`, and its line numbers are from this run.
  - **Target:** the SandPay merchant portal in `practice/security/support/sandpay_vuln.py` is **deliberately
    vulnerable** and binds to the loopback interface only. SandPay is fictional; every account, merchant,
    payment and secret in it is synthetic. `make_app()` is the vulnerable portal; `make_app(FLAWS)` the same
    portal with every flaw fixed (`missing-headers` and `verbose-errors` are the two this lesson meets most).
  - **Ethics:** test only systems you own or have written permission to test, and only inside the agreed
    scope. Nothing in this lesson's exercises leaves your machine; search-engine and DNS reconnaissance
    (WSTG-INFO-01, -04) are described, not practised, because they would touch real third-party systems.
  - **Standard:** OWASP [Web Security Testing Guide](https://owasp.org/www-project-web-security-testing-guide/),
    4.1 Information Gathering, as documented on 19 November 2026. Quotations are from the guide's "latest"
    edition (the [OWASP/wstg](https://github.com/OWASP/wstg) repository, `master`); the last numbered release is
    [v4.2](https://github.com/OWASP/wstg/releases/tag/v4.2) (December 2020). The test ids WSTG-INFO-01 to -10
    are the same in both; in both, WSTG-INFO-09 "has been merged into" WSTG-INFO-08; WSTG-INFO-04 is
    "Enumerate Applications on Webserver" in v4.2 and "Attack Surface Identification" in latest.
  - **HTTP:** [RFC 9110](https://www.rfc-editor.org/rfc/rfc9110) section 10.2.4 (`Server`) and 10.1.5 (product
    syntax); [RFC 9116](https://www.rfc-editor.org/rfc/rfc9116) (`security.txt`), as cited by WSTG-INFO-03.
  - **Tools named but not run here:** OWASP ZAP's Spider and Client Spider, the OWASP Attack Surface Detector,
    httpx, katana, subfinder and the other tools the WSTG lists - from the docs, not run here. The crawler,
    inventory and fingerprinting code in this lesson are the reference solutions of its exercises in
    `practice/security/solutions/foundations/`.
  - **Related:** HTTP basics - [HTTP request and response anatomy](#/lesson/http-request-response-anatomy);
    the risks a developer fixes - [OWASP Top 10 for developers](#/lesson/owasp-top-10-for-developers).

prerequisites:
  - security-testing-fundamentals
  - http-request-response-anatomy
  - intercepting-proxies

concepts:
  - id: sec-recon-scope-and-method
    name: Reconnaissance method - scope, passive and active
    summary: Information gathering is the first phase of a web assessment because "you can only test what you can find" (WSTG). It combines passive reconnaissance, which does not touch the target, with active enumeration, which does. Everything is bounded by the written scope - an asset you discover is not automatically in scope, and a redirect, link or form that leads off the agreed origin is recorded, not followed. Reconnaissance must not change data either - read, record, and leave state-changing requests for the tests that are designed for them.
  - id: sec-recon-mapping
    name: Mapping entry points and execution paths
    summary: The map of an application lists every page, endpoint, method and parameter (WSTG-INFO-06, -07), with who can reach it. Build it from walking the application through a proxy, crawling, metafiles such as robots.txt and security.txt, and documentation - and check each entry point with and without credentials. A crawler follows links and records forms (hidden fields included) but never submits them, stays on the scope origin, and reads redirects itself. Crawling misses routes that are only reachable from JavaScript or are unlinked, so the map is combined with API specs, client code and source where available.
  - id: sec-recon-fingerprinting
    name: Fingerprinting and information leakage
    summary: Fingerprinting identifies the server and framework, and their versions, from banners (the Server and X-Powered-By headers), error pages, cookies, file names and page content (WSTG-INFO-02, -08). Versions point to known vulnerabilities. Pages, comments, JavaScript and error messages can leak paths, secrets and internal names (WSTG-INFO-05). Version disclosure is "not necessarily in itself a vulnerability" but helps attackers; the fixes are removing detail from banners, generic error pages, and patching - and a test that finds a leak must also stay quiet once it is fixed.

objectives:
  - Explain the WSTG Information Gathering tests and sort reconnaissance activities into passive and active, in scope and out of scope.
  - Grab and interpret a server banner, an X-Powered-By header and an error page, and judge what each discloses.
  - Write a crawler that maps pages and forms while staying on the scope origin, sending only GET requests and recording off-scope redirects without following them.
  - Build an entry-point inventory by probing with and without credentials, without changing any data.
  - Write fingerprinting checks that report a version disclosure or stack trace and stay quiet once the portal is fixed.
  - Design reconnaissance test cases with preconditions, steps, expected results and evidence.

sections:
  - id: intuition
    kind: intuition
    concepts: [sec-recon-scope-and-method, sec-recon-mapping, sec-recon-fingerprinting]
    title: The idea in plain language
    body: |
      Imagine you are hired to check the locks of an office building. Before you touch a single lock, you walk
      the building with the floor plan the owner gave you: every door, every window, the loading bay, the door
      marked "staff only". You note which doors need a badge, which are open to visitors, and the brand of each
      lock - an old model with a known weakness is worth a closer look. You also notice the sticky note on the
      reception desk with the alarm code. And you stay inside the building you were hired for: if a corridor
      leads to the neighbour's office, you write it down and turn back.

      **Reconnaissance** is that walk-through for a web application. Before testing authentication, access
      control or injection, you find out what is there:

      - **what exists** - pages, API endpoints, methods, parameters, hidden form fields (the doors and windows);
      - **who can reach it** - without credentials, as a merchant, as an admin (badge or no badge);
      - **what it is built with** - server, framework and versions, from banners and error pages (the lock brand);
      - **what it gives away** - comments, stack traces, secrets in pages (the sticky note).

      In this lesson you map the deliberately vulnerable SandPay merchant portal that runs on your own machine.
      You will find its version banner, a stack trace that leaks a signing key, an open redirect that points off
      the site - and you will write tools that find these things without changing anything and without leaving
      the scope.

  - id: what
    kind: what
    concepts: [sec-recon-scope-and-method, sec-recon-mapping, sec-recon-fingerprinting]
    title: Terms you need, and the WSTG Information Gathering tests
    body: |
      | Term | Meaning |
      | --- | --- |
      | **Reconnaissance (recon)** | gathering information about a target before testing it |
      | **Passive reconnaissance** | gathering that "does not directly interact with the target" (WSTG) - search engines, archives, certificate logs, public documentation |
      | **Active enumeration** | gathering that does interact with it - requesting pages, crawling, probing endpoints |
      | **Attack surface** | everything an attacker can send input to: hosts, applications, endpoints, parameters, headers, cookies, files |
      | **Entry point** | one place input enters: a method + path + parameter (query, body, header or cookie) |
      | **Scope** | the written list of what you may test - origins, hosts, accounts, time windows, techniques |
      | **Origin** | scheme + host + port (`http://127.0.0.1:8765`); a different port or scheme is a different origin |
      | **Fingerprinting** | identifying the software and version behind a response |
      | **Banner grabbing** | reading identifying headers such as `Server` from a response (WSTG-INFO-02) |
      | **Crawler / spider** | a tool that follows links from seed URLs to discover pages |

      The OWASP Web Security Testing Guide (WSTG) organises information gathering as ten tests:

      | Id | Test (latest edition) | Practised here? |
      | --- | --- | --- |
      | WSTG-INFO-01 | Conduct Search Engine Reconnaissance for Information Leakage | described only (touches third parties) |
      | WSTG-INFO-02 | Fingerprint Web Server | yes - banner grabbing |
      | WSTG-INFO-03 | Review Webserver Metafiles for Information Leakage | described (`robots.txt`, `security.txt`) |
      | WSTG-INFO-04 | Attack Surface Identification (v4.2 - Enumerate Applications on Webserver) | described only (DNS, other hosts) |
      | WSTG-INFO-05 | Review Web Page Content for Information Leakage | yes - comments, stack traces |
      | WSTG-INFO-06 | Identify Application Entry Points | yes - the inventory |
      | WSTG-INFO-07 | Map Execution Paths Through Application | yes - the crawler |
      | WSTG-INFO-08 | Fingerprint Web Application Framework | yes - `X-Powered-By`, error pages |
      | WSTG-INFO-09 | Fingerprint Web Application | merged into WSTG-INFO-08 |
      | WSTG-INFO-10 | Map Application Architecture | described (proxies, load balancers, WAFs) |

      Each test in the guide has the same shape - Summary, Test Objectives, How to Test, Remediation, Tools,
      References. The objectives are short and worth knowing by heart; for example WSTG-INFO-06's single
      objective is to "Identify possible entry and injection points through request and response analysis."

  - id: why
    kind: why
    concepts: [sec-recon-scope-and-method, sec-recon-mapping]
    title: Why reconnaissance comes first
    body: |
      The WSTG's overview of information gathering opens with one sentence: **"You can only test what you can
      find."** It continues: "Assets that are never discovered are never tested, regardless of how thorough the
      rest of the assessment is."

      Three practical reasons follow from that:

      1. **Coverage.** A test plan built from the menu misses the endpoint the menu does not link to -
         `/api/webhooks/test` in the portal, or the "unadvertised administrative interfaces" WSTG-INFO-04 warns
         about. The inventory is the denominator of your coverage: "we tested 14 of 14 entry points" means
         something only if the 14 came from a real map.
      2. **Focus.** Fingerprinting tells you which known weaknesses to check. WSTG-INFO-02: "servers running older
         versions of software without up-to-date security patches can be susceptible to known version-specific
         exploits." A stack trace that names the database file and a signing key changes your priorities at
         once.
      3. **Safety and scope.** Mapping first shows you which requests change data and which systems are not
         yours. The portal's login page redirects to whatever `next=` says - including `https://evil.example/`.
         A tool that blindly follows redirects would have left the scope on the first page. The overview's last
         line is the rule: "Always stay within the defined scope of the engagement."

      For a tester the output is concrete: an inventory (spreadsheet or file) of entry points with method,
      parameters, authentication and notes, a list of technologies and versions, and a list of leaks - each
      with the request and response that prove it.

  - id: internals-active-passive
    kind: internals
    concepts: [sec-recon-scope-and-method]
    title: Passive, active - and what "in scope" really means
    body: |
      The WSTG describes the information-gathering phase as combining "passive reconnaissance (which does not
      directly interact with the target) with active enumeration (which does)". The distinction matters because
      the two have different risks and different permissions:

      | Activity | Passive or active | Touches | Practise it here? |
      | --- | --- | --- | --- |
      | search engine queries, archived pages (INFO-01) | passive | the search engine, not the target | no - real third parties |
      | Certificate Transparency logs, passive DNS (INFO-04) | passive | public logs | no |
      | reading the target's own docs, OpenAPI file | active (one request) | the target | yes, if in scope |
      | `robots.txt`, `security.txt`, sitemaps (INFO-03) | active | the target | yes |
      | banner grab, error page (INFO-02, -08) | active | the target | yes |
      | crawling, probing endpoints (INFO-06, -07) | active | the target, many requests | yes, with limits |
      | content discovery by brute force (`ffuf`) | active, noisy | the target, thousands of requests | only if the scope allows it |

      "Passive" does not mean "allowed". Searching for the client's leaked credentials on paste sites may be
      passive, but whether you may do it - and what you may do with what you find - is for the rules of
      engagement to say.

      **Scope is an origin, not a feeling.** The portal on `http://127.0.0.1:8765` is one origin. The same
      machine on port 8766 is another service; `https://` on the same port is another origin; `localhost` is a
      different host name even though it resolves to the same machine. A tool that checks scope must compare
      scheme, host and port exactly. Everything outside is recorded - "the login page redirects to
      `https://evil.example/`" is a finding (an open redirect) - but never requested.

      **Reconnaissance must not change data.** Crawlers send GET. Inventories probe state-changing methods
      (POST, PUT, PATCH, DELETE) only in a way that cannot succeed - for example without credentials, so an
      endpoint that checks authentication first answers 401 before it does anything. Submitting forms "to see
      what happens" belongs in the tests designed for each form, with test data and a way to undo it.

  - id: internals-fingerprinting
    kind: internals
    concepts: [sec-recon-fingerprinting]
    title: How fingerprinting works
    body: |
      WSTG-INFO-02 lists the techniques: "banner grabbing, eliciting responses to malformed requests, and using
      automated tools". A banner grab "is performed by sending an HTTP request to the web server and examining
      its response header". The `Server` header is defined in RFC 9110 section 10.2.4 as one or more **product
      identifiers**, each "a name and optional version" (section 10.1.5) - `Apache/2.4.43 (Unix)`,
      `nginx/1.31.5`, `lighttpd/1.4.85` are the guide's examples.

      RFC 9110 itself warns servers: "An origin server SHOULD NOT generate a Server header field containing
      needlessly fine-grained detail", because "Overly long and detailed Server field values ... potentially
      reveal internal implementation details that might make it (slightly) easier for attackers to find and
      exploit known security holes."

      Other signals the WSTG lists for frameworks (WSTG-INFO-08):

      - **`X-Powered-By`** - "The most basic form of identifying a web framework". It "doesn't work in all cases":
        it can be removed or set to something misleading - the guide's own example is
        `X-Powered-By: Blood, sweat and tears`.
      - **cookies** with framework-specific names, **HTML source** (generator meta tags, comments, specific
        paths), **file and folder names**, **file extensions** and **error messages**.

      Error pages are the richest signal. The portal's `GET /boom` raises an exception; unfixed, the response
      body is the full Python traceback - the language, the file layout, a database path and the JWT signing
      key. That is WSTG-INFO-05's concern too: comments, metadata and error output "might reveal internal
      information that should not be available to potential attackers".

      Fingerprints are **evidence, not proof**: banners can lie, be removed, or come from a reverse proxy rather
      than the application (WSTG-INFO-10 maps those layers). Report what the response says and how you would
      confirm it, not "the server is vulnerable to CVE-X" from a banner alone.

  - id: when
    kind: when
    concepts: [sec-recon-scope-and-method, sec-recon-mapping]
    title: When to do which kind of reconnaissance
    body: |
      | Situation | What to do |
      | --- | --- |
      | start of any assessment | passive recon allowed by the scope, then a walk-through via a proxy, then crawl and inventory |
      | you have the source or an OpenAPI file | read it first - it lists routes a crawler never finds (WSTG-INFO-06's Attack Surface Detector works from source) |
      | a single-page app | crawling `<a href>` links under-covers it; WSTG-INFO-07 points to JavaScript-capable crawlers and reading client-side routes |
      | a new release of an app you already mapped | diff the new inventory against the old - new entry points are the riskiest |
      | production, fragile systems, or a narrow scope | low request rates, no brute-force discovery, no state-changing probes; agree time windows |
      | a CI pipeline | a scripted inventory and banner/error checks as regression tests (later in this track) |

      What reconnaissance does **not** replace: it finds where to look, not whether a flaw exists. The inventory
      says `/api/payments/{id}` needs a token; only an access-control test shows whether Alice's token can read
      Bob's payment (that is [Testing access control and IDOR](#/lesson/testing-access-control-idor)).

  - id: visual
    kind: visual
    concepts: [sec-recon-scope-and-method, sec-recon-mapping, sec-recon-fingerprinting]
    title: The reconnaissance workflow
    body: |
      ```mermaid
      flowchart TD
        S["Written scope and rules of engagement"] --> P["Passive recon, if allowed (INFO-01, INFO-04)"]
        S --> W["Walk the app through a proxy"]
        W --> M["Metafiles - robots.txt, security.txt (INFO-03)"]
        W --> C["Crawl - GET only, scope origin only (INFO-07)"]
        C --> O{"URL on the scope origin?"}
        O -- "yes" --> F["Fetch and record page, forms, hidden fields"]
        O -- "no" --> X["Record as out of scope - never request"]
        F --> I["Inventory - method, params, anonymous vs signed-in (INFO-06)"]
        W --> B["Banner grab and error pages (INFO-02, INFO-08)"]
        F --> L["Page content leaks - comments, traces (INFO-05)"]
        I --> R["Map, technologies and leaks - evidence for each"]
        B --> R
        L --> R
        P --> R
      ```

      Notice the decision in the middle: the scope check happens **before** a URL is requested, for links,
      form actions and redirects alike. And every branch ends in recorded evidence, not in an attack.

  - id: banner-grab
    kind: code
    concepts: [sec-recon-fingerprinting]
    title: "Banner grabbing and the error page, with curl"
    body: |
      Start the portal (vulnerable) and grab the headers of `/health`. `-D -` prints the response headers;
      `-o /dev/null` discards the body:

      ```bash
      cd practice/security
      .venv/bin/python support/sandpay_vuln.py --port 8765 &
      curl -s -D - -o /dev/null http://127.0.0.1:8765/health
      ```

      ```http
      HTTP/1.1 200 OK
      Server: SandPayPortal/0.9 Python/3.12
      Date: Thu, 19 Nov 2026 05:14:12 GMT
      Content-Type: application/json
      Content-Length: 16
      ```

      Two products with versions: the application's own name and version, and the language runtime. The WSTG's
      example command is `curl -I`, which sends `HEAD`. This portal does not implement `HEAD`, and the answer
      is itself a fingerprint - the reason phrase is the Python standard library's:

      ```http
      HTTP/1.1 501 Unsupported method ('HEAD')
      Server: SandPayPortal/0.9 Python/3.12
      Date: Thu, 19 Nov 2026 05:14:12 GMT
      Connection: close
      Content-Type: text/html;charset=utf-8
      Content-Length: 357
      ```

      Now the error page, `curl -s http://127.0.0.1:8765/boom` (paths shortened):

      ```plaintext
      Traceback (most recent call last):
        File ".../practice/security/support/sandpay_vuln.py", line 470, in handle
          resp = self._route(req)
                 ^^^^^^^^^^^^^^^^
        File ".../practice/security/support/sandpay_vuln.py", line 494, in _route
          return fn(req)
                 ^^^^^^^
        File ".../practice/security/support/sandpay_vuln.py", line 465, in boom
          raise RuntimeError(f"settlement batch failed; db=sqlite:///var/sandpay/portal.db key={JWT_SECRET.decode()}")
      RuntimeError: settlement batch failed; db=sqlite:///var/sandpay/portal.db key=sandpay-practice-only-jwt-key
      ```

      The same two requests against the fixed portal (`--fix-all`):

      ```http
      HTTP/1.1 200 OK
      Server: SandPay
      Date: Thu, 19 Nov 2026 05:14:12 GMT
      Content-Type: application/json
      Content-Security-Policy: default-src 'self'; frame-ancestors 'none'
      X-Content-Type-Options: nosniff
      Referrer-Policy: no-referrer
      Strict-Transport-Security: max-age=31536000
      Content-Length: 16
      ```

      ```json
      {"error": "internal error", "reference": "1b955585"}
      ```

      The product name is still there - "SandPay" - but without a version there is nothing to look up. The
      error page gives a reference the support team can find in their logs, and nothing else.

  - id: crawler-run
    kind: code
    concepts: [sec-recon-mapping, sec-recon-scope-and-method]
    title: "Crawling and inventorying the portal"
    body: |
      The reference solutions of this lesson's exercises, run against the vulnerable portal. First the crawler,
      from five seed paths:

      ```python
      from foundations.recon_crawler import crawl

      SEEDS = ["/login", "/login?next=https://evil.example/", "/search?q=test", "/files?name=terms.txt", "/health"]
      site = crawl(base, SEEDS)
      for path, status in site.pages.items():
          print(f"{status} {path:40} {site.content_types[path]}")
      print("redirects:", site.redirects)
      print("out of scope:", sorted(site.out_of_scope))
      print("forms:", [(f.page, f.method, f.action, f.fields) for f in site.forms])
      ```

      ```plaintext
      200 /login                                   text/html; charset=utf-8
      302 /login?next=https://evil.example/
      200 /search?q=test                           text/html; charset=utf-8
      200 /files?name=terms.txt                    text/plain
      200 /health                                  application/json
      redirects: {'/login?next=https://evil.example/': 'https://evil.example/'}
      out of scope: ['https://evil.example/']
      forms: [('/login', 'POST', '/api/login', [])]
      ```

      The redirect to `https://evil.example/` was recorded - it is the open redirect flaw - and never requested.
      Against the fixed portal the same seed redirects to `/settings`, which is in scope, so the crawler follows
      it and records `401 /settings`.

      Signed in as Alice (a session cookie from `POST /api/login`), crawling `/settings` and `/notes` finds the
      email-change form, and the portal's access log for the crawl contains only `GET` lines:

      ```plaintext
      signed-in forms: [('/settings', 'POST', '/settings/email', [('email', 'text', '')])]
      ```

      Then the inventory: each candidate probed without credentials and - for GET only - with Alice's token:

      ```plaintext
      GET    /admin                     anon=404 auth=404 -> missing
      GET    /api/login                 anon=405 auth=405 -> method-not-allowed
      GET    /api/me                    anon=401 auth=200 -> authenticated
      GET    /api/merchants/m_100       anon=401 auth=200 -> authenticated
      POST   /api/notes                 anon=401 auth=None -> authenticated
      GET    /api/payments              anon=401 auth=200 -> authenticated
      GET    /api/payments/pay_1001     anon=401 auth=200 -> authenticated
      PATCH  /api/profile               anon=401 auth=None -> authenticated
      POST   /api/webhooks/test         anon=401 auth=None -> authenticated
      GET    /files?name=terms.txt      anon=200 auth=200 -> public
      GET    /health                    anon=200 auth=200 -> public
      GET    /notes                     anon=401 auth=200 -> authenticated
      GET    /search?q=test             anon=200 auth=200 -> public
      GET    /settings                  anon=401 auth=200 -> authenticated
      POST   /settings/email            anon=401 auth=None -> authenticated
      notes before/after: 0 0
      ```

      Fifteen entry points, three public, ten behind authentication, one missing and one that exists for
      another method (`/api/login` answers 405 to GET - it is a POST endpoint). The last line is the safety
      check: the notes table had 0 rows before and after, so the inventory changed nothing.

  - id: crawler-lines
    kind: line-by-line
    concepts: [sec-recon-mapping, sec-recon-scope-and-method]
    title: The crawler's important lines
    body: |
      From `practice/security/solutions/foundations/recon_crawler.py`:

      ```python
      def in_scope(url: str, base_url: str) -> bool:
          return _origin(url) == _origin(base_url)          # (1) scheme + host:port, exactly

      while queue and len(site.pages) < max_pages:          # (2) a hard budget
          url = queue.pop(0)
          if url in seen:
              continue
          seen.add(url)
          if not in_scope(url, base_url):                   # (3) checked before any request
              site.out_of_scope.add(url)
              continue
          resp = http.get(url, allow_redirects=False, timeout=5)   # (4) GET only, no auto-redirects
          ...
          if resp.is_redirect and "Location" in resp.headers:
              site.redirects[key] = resp.headers["Location"]
              queue.append(urljoin(url, resp.headers["Location"]))  # (5) back through the scope check
              continue
          ...
          for f in parser.forms:
              site.forms.append(Form(key, action, f["method"], f["fields"]))   # (6) recorded, never submitted
      ```

      1. `_origin` returns `(scheme, netloc)`; `netloc` includes the port. Comparing host names with
         `endswith("example.com")` is a classic scope bug - `evil-example.com` ends with it too.
      2. A page budget stops crawler traps (calendars, infinite pagination) from turning recon into load.
      3. The scope check sits at the single place a URL is requested, so links, form actions and redirects all
         pass through it.
      4. `requests` follows redirects by default; `allow_redirects=False` is what lets the crawler see
         `Location: https://evil.example/` and decide. A `timeout` keeps one hung page from stalling the map.
      5. A redirect target is just another URL in the queue - in scope, it is fetched; out of scope, recorded.
      6. Hidden fields are kept: WSTG-INFO-06 asks testers to "pay special attention to any hidden parameters",
         because "Altering these hidden parameters may result in" different behaviour.

  - id: steps
    kind: steps
    concepts: [sec-recon-scope-and-method, sec-recon-mapping, sec-recon-fingerprinting]
    title: Reconnaissance step by step
    body: |
      1. **Read the scope.** Write down the origins, accounts, allowed techniques, request-rate limits and time
         windows. If something you find is not listed, ask before touching it.
      2. **Passive first, if allowed.** Public documentation, the vendor's changelog, OpenAPI files, certificate
         names. Note sources and dates.
      3. **Walk the application through an intercepting proxy** with each role you were given. WSTG-INFO-06:
         "pay attention to all HTTP requests as well as every parameter and form field". Keep the request
         numbers.
      4. **Read the metafiles.** `/robots.txt`, `/.well-known/security.txt` (RFC 9116), sitemaps. The portal has
         none - a 404 is a result too.
      5. **Grab banners and provoke an error.** `Server`, `X-Powered-By`, the 404 and 500 pages, an unsupported
         method.
      6. **Crawl** from the pages you found: GET only, scope origin only, redirects read not followed, a page
         budget.
      7. **Build the inventory.** For every entry point - method, path, parameters (query, body, headers,
         cookies), anonymous result, result per role. Probe unsafe methods only in ways that cannot succeed.
      8. **Review page content.** Comments, scripts, source maps, error text.
      9. **Record evidence** for each item: the request and response (or the proxy's request number), the time
         and the account.
      10. **Hand over.** The inventory is the test plan's denominator; the leaks are findings; the technologies
          drive which known issues to check.

  - id: example
    kind: example
    concepts: [sec-recon-mapping, sec-recon-fingerprinting, sec-recon-scope-and-method]
    title: "Example: the first day of a SandPay portal assessment"
    body: |
      SandPay asks for a security assessment of its merchant portal before a release. The scope letter names one
      origin, two merchant test accounts and one admin account, allows crawling at up to 5 requests per second,
      and forbids brute-force content discovery and anything that sends email.

      By the end of day one the tester has:

      | Item | Evidence | What it means for the plan |
      | --- | --- | --- |
      | `Server: SandPayPortal/0.9 Python/3.12` | response to `GET /health` | note the runtime; banner itself is a low-severity finding |
      | full traceback from `GET /boom` with a key | request + response body | **high** - a signing key in an error page; report now, not at the end |
      | `/login?next=` redirects anywhere | `302` with `Location: https://evil.example/`, never followed | open redirect - planned for the redirect tests |
      | 15 entry points, 10 behind authentication | the inventory file | access-control tests per authenticated GET; IDOR candidates are `/api/payments/{id}` and `/api/merchants/{id}` |
      | email-change form with no hidden token | crawled `/settings` form fields | CSRF test candidate |
      | `POST /api/webhooks/test` takes a `url` | inventory params | SSRF test candidate |

      Notice what the tester did **not** do: submit the email-change form (it changes an account and the scope
      forbids sending email), follow the redirect to `evil.example`, or try passwords on the login endpoint.
      Those come later, in the tests designed for them - with the scope's permission.

      The leaked signing key is reported immediately rather than at the end, because waiting would leave a
      known critical exposure open for the whole engagement.

  - id: tests
    kind: tests
    concepts: [sec-recon-scope-and-method, sec-recon-mapping, sec-recon-fingerprinting]
    title: Testing your reconnaissance tools
    body: |
      Recon tools are code, and a crawler that leaves the scope or submits forms is a liability. The exercise
      tests check behaviour against both portals:

      | Test | Precondition | Expected | Evidence |
      | --- | --- | --- | --- |
      | scope is the exact origin | none | other port, scheme or host name is out of scope | unit cases |
      | off-scope redirect recorded, not followed | vulnerable portal | `out_of_scope == {"https://evil.example/"}` | crawl result |
      | in-scope redirect followed | fixed portal | `/settings` fetched, `401` | crawl result |
      | crawler never submits forms | signed-in session | the portal's access log for the crawl has only `GET` lines | `app.access_log` |
      | hidden fields and external form actions recorded | a static test site | `("nonce", "hidden", "n-1")`; external action in `out_of_scope` | crawl result |
      | page budget | static site, `max_pages=2` | 2 requests | server request log |
      | inventory changes nothing | vulnerable portal | notes table still empty; Alice's profile unchanged | database queries |
      | unsafe methods never sent with credentials | spy on the portal | no POST/PATCH carries `Authorization` | spy log |
      | banner and trace found | vulnerable portal | `server-version`, `stack-trace` | findings |
      | **quiet once fixed** | `make_app({"missing-headers", "verbose-errors"})` | no findings | findings |

      The last row is the false-positive check: a check that also fires on `Server: SandPay` would bury real
      findings in noise.

  - id: mistakes
    kind: mistakes
    concepts: [sec-recon-scope-and-method, sec-recon-mapping, sec-recon-fingerprinting]
    title: Common mistakes and a debugging method
    body: |
      - **Following redirects and links out of scope.** HTTP clients follow redirects by default. One open
        redirect and your "crawler" is requesting a third party's site. Check scope before every request.
      - **Scope by substring.** `"sandpay.example" in url` accepts `sandpay.example.evil.net`; `endswith` accepts
        `notsandpay.example`. Compare parsed scheme, host and port.
      - **Submitting forms while mapping.** A crawler that "clicks" every form creates notes, changes emails,
        sends refunds. Record forms; test them deliberately later.
      - **Probing with the admin token.** `DELETE /api/users/1` "just to see if it exists" with real credentials
        is not reconnaissance. Probe unsafe methods so they cannot succeed.
      - **Trusting the crawl as complete.** Routes reached only from JavaScript, unlinked APIs and other methods
        on the same path are invisible to a link crawler. Combine with the proxy history, client code and specs.
      - **Reporting a CVE from a banner.** A version string is a lead. Confirm the component and version
        (and whether a proxy added the header) before claiming a vulnerability.
      - **Losing the evidence.** A map with no request/response behind each entry cannot be re-checked after a
        fix.

      **Debugging method** when your map and the application disagree: replay the one request with `curl -v`
      or the proxy's repeater; compare headers (cookies, `Authorization`, `Content-Type`); check whether the
      client followed a redirect; and check the server's own log (the portal's `app.access_log`) to see what
      actually arrived.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [sec-recon-scope-and-method, sec-recon-mapping]
    title: Trade-offs and alternatives
    body: |
      | Choice | Gains | Costs |
      | --- | --- | --- |
      | manual walk-through via a proxy | understands workflows, roles, hidden fields | slow; depends on the tester |
      | link crawler (ZAP Spider, this lesson's) | fast, repeatable, finds linked pages | misses JavaScript routes and unlinked endpoints |
      | JavaScript-capable crawler (ZAP Client Spider, katana - named in WSTG-INFO-07) | covers single-page apps | heavier, can trigger client actions; still black-box |
      | source or OpenAPI driven (Attack Surface Detector - WSTG-INFO-06) | finds unlinked routes and unused parameters | needs access to source or a spec; spec may be stale |
      | brute-force content discovery (ffuf, feroxbuster) | finds forgotten files and admin pages | thousands of requests; often out of scope on production |
      | passive sources (search, archives, CT logs) | no traffic to the target | may expose the engagement; needs explicit permission |

      In practice testers combine them: proxy walk-through for understanding, a crawler for breadth, specs and
      source for completeness, and brute-force discovery only where the scope allows it.

  - id: summary
    kind: summary
    concepts: [sec-recon-scope-and-method, sec-recon-mapping, sec-recon-fingerprinting]
    title: Quick reference
    body: |
      - "You can only test what you can find" - reconnaissance builds the denominator of every test plan.
      - WSTG Information Gathering: INFO-01 search engines, -02 server fingerprint, -03 metafiles, -04 attack
        surface, -05 page content, -06 entry points, -07 execution paths, -08 framework (-09 merged), -10
        architecture.
      - Passive = no traffic to the target; active = requests to it. Both need the scope's permission.
      - Scope is an exact origin: scheme + host + port. Record off-scope URLs, never request them.
      - Recon changes nothing: GET only when crawling, unsafe methods probed so they cannot succeed.
      - Banner grab: `Server`, `X-Powered-By`, error pages, unsupported methods. A product **with a version** is
        the interesting part.
      - Leaks: comments, stack traces, keys in error pages - report critical ones at once.
      - Inventory per entry point: method, path, parameters, anonymous vs per-role result, evidence.
      - A good check finds the leak and stays quiet once it is fixed.

exercises:
  - id: passive-or-active
    type: mcq
    concept: sec-recon-scope-and-method
    skill: recognition
    title: Passive or active?
    prompt: |
      Which of these is **passive** reconnaissance in the WSTG's sense - it "does not directly interact with
      the target"?
    options:
      - id: ct-logs
        text: Searching Certificate Transparency logs for host names in the client's domain
        feedback: Correct - the query goes to public logs; the target receives nothing. It still needs the scope's permission.
      - id: robots
        text: Requesting /robots.txt from the target
        feedback: One harmless request is still a request to the target, so it is active - even if it is very gentle.
      - id: banner
        text: A curl request to read the Server header
        feedback: Banner grabbing sends a request to the target (WSTG-INFO-02), so it is active.
      - id: crawl-slow
        text: Crawling the target at one request per minute
        feedback: Slow is still active; the rate changes the impact, not the category.
    correct: [ct-logs]
    hints:
      - Ask who receives the traffic.
    solution: |
      Passive sources are third parties (search engines, archives, CT logs). Anything that sends a request to the
      target - however small or slow - is active.

  - id: scope-origin
    type: mcq
    concept: sec-recon-scope-and-method
    skill: application
    title: Is it in scope?
    prompt: |
      The scope letter says: "In scope - `https://portal.sandpay.example`". Your crawler meets these URLs. Which
      **may** it request?
    options:
      - id: path
        text: "https://portal.sandpay.example/api/payments?limit=5"
        feedback: Correct - same scheme, host and (default) port; only the path and query differ.
      - id: port
        text: "https://portal.sandpay.example:8443/admin"
        feedback: Another port is another service and another origin. Record it and ask; do not request it.
      - id: http
        text: "http://portal.sandpay.example/"
        feedback: Another scheme is another origin. It may redirect to HTTPS, but checking that is not your call until the scope says so.
      - id: sub
        text: "https://api.portal.sandpay.example/v1"
        feedback: A subdomain is a different host. A substring or endswith check would wrongly accept it.
    correct: [path]
    hints:
      - Compare scheme, host and port separately.
    solution: |
      Scope is an exact origin. Different port, scheme or host name are out of scope until the client adds them -
      record them as discoveries.

  - id: what-banner-says
    type: mcq
    concept: sec-recon-fingerprinting
    skill: analysis
    title: What does the banner tell you?
    prompt: |
      A response carries `Server: nginx/1.31.5` and the application behind it is written in Python. What is the
      most accurate conclusion?
    options:
      - id: proxy
        text: The response passed through (or was served by) nginx 1.31.5 - possibly a reverse proxy in front of the Python application; confirm before reporting component vulnerabilities
        feedback: Correct - banners describe whatever wrote the header. WSTG-INFO-10 maps such layers.
      - id: vuln
        text: The application is vulnerable to every CVE affecting nginx 1.31.5
        feedback: A banner is a lead, not proof. The component may be patched, configured differently, or not the one handling your request.
      - id: python-wrong
        text: The application is not written in Python
        feedback: A front proxy commonly sets its own Server header; the backend language is not visible from it.
      - id: nothing
        text: Nothing - banners are always fake
        feedback: Banners can be altered, but most are accurate; they are useful evidence to confirm.
    correct: [proxy]
    hints:
      - Who writes the Server header when a reverse proxy sits in front?
    solution: |
      The header identifies the software that produced the response. With a proxy in front, that is the proxy.
      Use it as a lead and confirm it (error pages, behaviour differences) before reporting.

  - id: version-only
    type: mcq
    concept: sec-recon-fingerprinting
    skill: application
    title: Which banner is a finding?
    prompt: |
      Your fingerprinting check should report version disclosure. Which `Server` value should it report?
    options:
      - id: versioned
        text: "SandPayPortal/0.9 Python/3.12"
        feedback: Correct - two products, each with a version you could look up.
      - id: name-only
        text: SandPay
        feedback: A product name without a version gives an attacker little; reporting it would make the check fire on the fixed portal.
      - id: cloud
        text: cloudflare
        feedback: The name of a CDN; no version. Note it for the architecture map (WSTG-INFO-10), but it is not version disclosure.
      - id: empty
        text: (no Server header)
        feedback: Nothing to report - and RFC 9110 says an origin server MAY generate the header, so its absence is fine.
    correct: [versioned]
    hints:
      - RFC 9110 product = name and optional version. Which part helps an attacker?
    solution: |
      Report products that carry a version. A bare product name is not useful to an attacker, and a check that
      fires on it would never go quiet after the fix.

  - id: error-page-leak
    type: mcq
    concept: sec-recon-fingerprinting
    skill: analysis
    title: The worst thing on the error page
    prompt: |
      The portal's `/boom` returns a Python traceback ending in
      `RuntimeError: settlement batch failed; db=sqlite:///var/sandpay/portal.db key=sandpay-practice-only-jwt-key`.
      What should the tester do first?
    options:
      - id: report-now
        text: Report the exposed signing key to the client immediately, with the request and response as evidence, and continue mapping
        feedback: Correct - a secret that lets anyone forge tokens is critical; waiting until the final report leaves it open.
      - id: use-key
        text: Use the key to forge an admin token and see how far it goes
        feedback: Exploiting a secret goes beyond reconnaissance and usually beyond the scope; report it and ask.
      - id: version-only
        text: Note "Python 3.12" for the technology list and move on
        feedback: The runtime is the least important thing on that page.
      - id: low
        text: Log it as a low-severity information disclosure for the final report
        feedback: A stack trace alone might be low; one that contains a signing key is not.
    correct: [report-now]
    hints:
      - What can someone do with that key?
    solution: |
      Classify by what leaked, not by the category name. A signing key in an error page is critical; most rules
      of engagement require critical findings to be reported as soon as they are confirmed.

  - id: redirect-follow
    type: mcq
    concept: sec-recon-scope-and-method
    skill: application
    title: The crawler and the 302
    prompt: |
      Your crawler requests `/login?next=https://evil.example/` and gets `302` with
      `Location: https://evil.example/`. What should it do?
    options:
      - id: record
        text: Record the redirect and the target as out of scope, do not request it, and flag the open redirect for testing
        feedback: Correct - the redirect itself is the evidence; following it would leave the scope.
      - id: follow
        text: Follow it to see what the attacker's page looks like
        feedback: That page belongs to someone else; requesting it is out of scope.
      - id: ignore
        text: Ignore redirects - they are not entry points
        feedback: The redirect is the finding (an open redirect). Record it.
      - id: default
        text: Let requests follow it - the library knows best
        feedback: requests follows redirects by default, which is exactly how crawlers leave scope. Use allow_redirects=False.
    correct: [record]
    hints:
      - Where does the scope check happen in the crawler?
    solution: |
      Read the Location yourself (`allow_redirects=False`), record it, and let the scope check decide. Out of scope -
      never requested.

  - id: hidden-fields
    type: mcq
    concept: sec-recon-mapping
    skill: recognition
    title: Why record hidden fields?
    prompt: |
      A crawled form contains `<input type="hidden" name="merchant_id" value="m_100">`. Why does WSTG-INFO-06 tell
      testers to pay special attention to it?
    options:
      - id: tamper
        text: The browser sends it like any other field, and changing it may change what the server does - a candidate for access-control tests
        feedback: Correct - "Altering these hidden parameters may result in" different behaviour; hidden is not protected.
      - id: secret
        text: Hidden fields are encrypted, so they contain secrets
        feedback: Hidden fields are plain text in the page source; they are only not displayed.
      - id: ignored
        text: Servers ignore hidden fields, so they show dead code
        feedback: Servers usually read them - that is why they are in the form.
      - id: csrf-only
        text: Hidden fields are always CSRF tokens
        feedback: Some are; many carry ids, prices or roles.
    correct: [tamper]
    hints:
      - Who controls what the browser sends?
    solution: |
      Hidden means "not displayed", not "trusted". A hidden merchant id is a horizontal access-control test
      waiting to happen.

  - id: unsafe-probe
    type: mcq
    concept: sec-recon-scope-and-method
    skill: application
    title: Probing a POST endpoint safely
    prompt: |
      Your inventory lists `POST /api/notes` (creates a note) and you want to know whether it needs
      authentication. Which probe is right during reconnaissance?
    options:
      - id: anon-empty
        text: Send POST without credentials and with an empty body; record 401 as "needs authentication"
        feedback: Correct - an endpoint that checks authentication first rejects it before writing anything.
      - id: signed-in
        text: Send POST with Alice's token and a test note, then delete it
        feedback: That creates data during recon, and the delete may not exist or may fail. Save it for the test of that endpoint.
      - id: options
        text: Assume POST needs authentication because GET does
        feedback: Methods on the same path often have different rules; that is a common access-control bug.
      - id: skip
        text: Skip POST endpoints - recon is GET only
        feedback: The crawler is GET only, but the inventory still needs every entry point. Probe so that nothing can change.
    correct: [anon-empty]
    hints:
      - Which request cannot succeed if the endpoint checks credentials first?
    solution: |
      Probe unsafe methods in a way that cannot succeed. If the anonymous probe is not rejected (anything but
      401/403), stop and report - that is already a finding.

  - id: crawl-limits
    type: mcq
    concept: sec-recon-mapping
    skill: analysis
    title: The crawl found nine pages
    prompt: |
      A link crawler of a React single-page app finds nine pages, but the proxy history from a manual walk-through
      shows 40 different API paths. What explains the gap, and what next?
    options:
      - id: js
        text: The API calls are made by JavaScript, not linked with a-href - use the proxy history, the client bundles or an OpenAPI file, or a JavaScript-capable crawler
        feedback: Correct - WSTG-INFO-07 says naive spidering "often under-covers modern applications".
      - id: auth
        text: The crawler was not signed in; sign in and the 40 paths will appear
        feedback: Signing in helps for protected pages, but API calls from client code still are not links.
      - id: depth
        text: Raise max_pages to 1000
        feedback: More budget follows more links; it does not create links that do not exist.
      - id: proxy-wrong
        text: The proxy history is wrong; trust the crawler
        feedback: The proxy recorded real requests the browser made - it is the better source here.
    correct: [js]
    hints:
      - How does a single-page app request data?
    solution: |
      Link crawling sees links. Combine it with proxy history, client-side code and API specs to cover routes that
      only JavaScript reaches.

  - id: inventory-405
    type: mcq
    concept: sec-recon-mapping
    skill: analysis
    title: 404, 405 or 401?
    prompt: |
      Your inventory probes `GET /api/login` and gets `405 Method Not Allowed`. What does that tell you?
    options:
      - id: exists
        text: The path exists for another method - here POST - so it belongs in the inventory
        feedback: Correct - 405 means the route exists but not for this method. A 404 would mean no route.
      - id: missing
        text: The endpoint does not exist
        feedback: That would be 404. 405 confirms the path exists.
      - id: auth
        text: It needs authentication
        feedback: Authentication failures are 401 or 403.
      - id: broken
        text: The server is misconfigured
        feedback: 405 is the correct answer to an unsupported method; no misconfiguration is implied.
    correct: [exists]
    hints:
      - Which status says "right path, wrong method"?
    solution: |
      405 is a discovery: the route exists for another method. Probing other methods on known paths is a cheap way
      to find entry points the UI does not use.

  - id: recon-order
    type: order
    concept: sec-recon-scope-and-method
    skill: recall
    title: Put a reconnaissance session in order
    prompt: Order the steps of a first reconnaissance session on a new target.
    items:
      - id: scope
        text: Read the scope and rules of engagement; note origins, accounts, limits and time windows
      - id: passive
        text: Passive sources the scope allows - public docs, API specs, certificate names
      - id: walk
        text: Walk the application through an intercepting proxy with each role
      - id: banners
        text: Grab banners, read metafiles and provoke error pages
      - id: crawl
        text: Crawl from the pages found - GET only, scope origin only, with a page budget
      - id: inventory
        text: Build the entry-point inventory - anonymous and per-role results, unsafe methods probed so they cannot succeed
      - id: record
        text: Record evidence for each item and report any critical leak at once
    hints:
      - Permission first; the most information per request next; evidence last but not least.
    solution: |
      Scope, passive, manual walk, banners and metafiles, crawl, inventory, evidence. The walk-through gives the
      crawler its seeds and the inventory its candidates.

  - id: debug-crawler
    type: debug
    concept: sec-recon-scope-and-method
    skill: analysis
    title: The crawler that left the building
    prompt: |
      This crawler was pointed at `http://127.0.0.1:8765` and ended up requesting `https://evil.example/` and
      creating a note in the portal. Click **every** line that causes one of those problems.
    language: python
    code: |
      def crawl(base_url, seeds, session, max_pages=50):
          queue = [base_url + s for s in seeds]
          seen = set()
          while queue and len(seen) < max_pages:
              url = queue.pop(0)
              if url in seen or "127.0.0.1" not in url:
                  continue
              seen.add(url)
              resp = session.get(url, timeout=5)
              for f in parse_forms(resp.text):
                  session.post(base_url + f.action, data=f.defaults())
              for link in parse_links(resp.text):
                  queue.append(urljoin(url, link))
          return seen
    correctLines: [6, 9, 11]
    lineNotes:
      - line: 4
        note: A page budget is correct.
      - line: 13
        note: Queueing links is fine - the problem is how scope is checked when they are popped.
    hints:
      - How does `"127.0.0.1" not in url` treat `https://evil.example/?next=127.0.0.1`?
      - What does `session.get` do with a 302 by default?
      - Which line sends something other than GET?
    solution: |
      Line 6 checks scope by substring (and ignores port and scheme) - use an exact origin comparison. Line 9
      follows redirects automatically, so a 302 to `https://evil.example/` is fetched without any scope check -
      use `allow_redirects=False` and queue the Location. Line 11 submits every form - recon records forms, never
      submits them.

  - id: banner-severity
    type: short
    concept: sec-recon-fingerprinting
    skill: analysis
    title: Is a version banner a vulnerability?
    prompt: |
      A developer says: "`Server: SandPayPortal/0.9 Python/3.12` is not a vulnerability, so don't report it." Using
      WSTG-INFO-02 and RFC 9110, write the answer you would give - is it a finding, how severe, and what fix do you
      recommend?
    modelAnswer: |
      Partly right. WSTG-INFO-02's remediation says exposed server information "is not necessarily in itself a
      vulnerability, but it is information that can assist attackers" - it lets them look up version-specific
      exploits for unpatched components. RFC 9110 section 10.2.4 also says a server SHOULD NOT generate a Server
      field with "needlessly fine-grained detail". So I report it as a low-severity (informational) finding with
      the request and response as evidence, and recommend removing the versions from the header (product name
      at most), using generic error pages, and - the real defence - keeping components patched. If the version
      is known to be vulnerable, that becomes a separate, higher-severity finding once confirmed.
    rubric:
      - Agrees it is not by itself exploitable, but explains why it helps attackers.
      - Cites WSTG-INFO-02's remediation and or RFC 9110's SHOULD NOT.
      - Rates it low or informational, with evidence.
      - Recommends removing versions and patching, not only hiding the header.
    hints:
      - What does the WSTG's Remediation section of INFO-02 say?
    solution: |
      Report as low/informational with evidence; recommend dropping versions and patching. A confirmed vulnerable
      version is a separate finding.

  - id: recon-test-plan
    type: testdesign
    concept: sec-recon-mapping
    skill: application
    title: Test plan for a reconnaissance crawler
    prompt: |
      Your team will run a crawler against SandPay's staging portal every night. Design five tests for the crawler
      itself, at least three about safety. For each give preconditions, steps, the expected result and the evidence.
    modelAnswer: |
      1. **Off-scope redirect** - precondition: a page that 302s to another origin. Steps: crawl from it.
         Expected: the target is in `out_of_scope`, no request reaches it. Evidence: crawl result and a request
         log on a fake external server showing zero hits.
      2. **Only GET** - precondition: signed-in session, pages with POST forms. Steps: crawl. Expected: the
         server's access log for the crawl contains only GET. Evidence: the access log slice.
      3. **Scope by exact origin** - precondition: links to another port, `https://` and a look-alike host.
         Steps: crawl. Expected: none requested, all recorded. Evidence: crawl result, server logs.
      4. **Page budget** - precondition: a site with an infinite calendar. Steps: crawl with `max_pages=50`.
         Expected: exactly 50 requests. Evidence: request count.
      5. **Hidden fields recorded** - precondition: a form with a hidden field. Steps: crawl. Expected: the field
         (name, type, value) in the form record. Evidence: crawl result.
      6. **Data unchanged** - precondition: known row counts. Steps: crawl. Expected: counts unchanged. Evidence:
         database queries before and after.
    rubric:
      - Each test has preconditions, steps, an expected result and concrete evidence.
      - Covers off-scope redirects and links, and an exact-origin check.
      - Covers that no state-changing request is sent (access log or data before and after).
      - Covers a request budget or crawler trap.
      - Uses controlled test sites or fakes rather than real third parties.
    hints:
      - How would you prove a request did NOT happen?
    solution: |
      Prove safety with logs on both sides: the target's access log (only GET) and a fake external server that
      receives nothing. Add exact-origin, budget, hidden-field and data-unchanged tests.

  - id: recon-interview
    type: interview
    concept: sec-recon-scope-and-method
    skill: analysis
    title: "Interview: how do you start a web application assessment?"
    prompt: |
      "You're given a URL and two test accounts for a payments portal. Walk me through what you do before you test
      any vulnerability."
    modelAnswer: |
      First the scope: I confirm in writing which origins, accounts, techniques and request rates are allowed, and
      what happens if I find a critical issue. Then I follow the WSTG's Information Gathering tests. Passive
      sources if the scope allows - docs, API specs, certificate names. Then I walk the application through an
      intercepting proxy with each account, noting every request, parameter and hidden field. I read
      `robots.txt` and `security.txt`, grab the `Server` and `X-Powered-By` headers, and look at error pages - they
      often leak frameworks, paths or worse. I crawl from what I found, GET only and on the scope origin only,
      reading redirects myself so an open redirect can't take me off scope. Then I build an inventory: every
      method, path and parameter, tried anonymously and per role - unsafe methods only in ways that can't
      succeed, so recon changes nothing. Everything gets evidence. The output is the map that drives the test
      plan - access-control tests for every authenticated endpoint, injection tests per parameter - plus any
      leaks, and a critical leak like a secret in an error page I report immediately.
    rubric:
      - Starts from written scope and rules of engagement.
      - Distinguishes passive and active reconnaissance.
      - Names banner grabbing, error pages and metafiles.
      - Describes a safe crawl (GET only, exact origin, redirects not followed blindly).
      - Describes an entry-point inventory with per-role results and no state changes.
      - Mentions evidence and reporting critical findings at once.
    followUps:
      - How would you map a single-page app whose routes are all JavaScript?
      - The banner says nginx 1.31.5 - what do you do with that?
      - What do you do if you find an admin panel on another port that is not in scope?
    hints:
      - Structure - permission, passive, walk-through, fingerprint, crawl, inventory, evidence.
    solution: |
      Scope first, then the WSTG Information Gathering tests: passive, proxy walk-through, fingerprinting, safe
      crawl, a no-side-effect inventory, evidence - and immediate reporting of critical leaks.

  - id: crawler-code
    type: coding
    concept: sec-recon-mapping
    skill: application
    title: A crawler that stays in scope
    prompt: |
      In `recon_crawler.py`, implement `path_of`, `in_scope` (exact scheme, host and port) and `crawl`: a
      breadth-first GET crawl from seed paths that records every page's status and content type, reads redirects
      itself (never follows them automatically), records forms with their fields (hidden ones included) without
      submitting them, never requests an off-scope URL (it records it in `out_of_scope`), fetches each URL once
      and stops at `max_pages`. The HTML parser is provided. The tests run against the vulnerable and the fixed
      portal and a small static site.
    project: security
    files:
      - exercises/foundations/recon_crawler.py
    test: tests/foundations/test_recon_crawler.py
    command: .venv/bin/python -m pytest tests/foundations/test_recon_crawler.py
    hints:
      - "`urlsplit(url)` gives scheme, netloc (host:port), path and query."
      - "Put the scope check right after popping a URL - links, form actions and redirects all pass through it."
      - "`session.get(url, allow_redirects=False)`; then `resp.is_redirect` and `resp.headers[\"Location\"]`."
    modelAnswer: |
      ```python
      def in_scope(url, base_url):
          return _origin(url) == _origin(base_url)

      def crawl(base_url, seeds, session=None, max_pages=50):
          http = session or requests.Session()
          site, seen = SiteMap(), set()
          queue = [urljoin(base_url, s) for s in seeds]
          while queue and len(site.pages) < max_pages:
              url = queue.pop(0)
              if url in seen:
                  continue
              seen.add(url)
              if not in_scope(url, base_url):
                  site.out_of_scope.add(url)
                  continue
              resp = http.get(url, allow_redirects=False, timeout=5)
              key = path_of(url)
              site.pages[key] = resp.status_code
              site.content_types[key] = resp.headers.get("Content-Type", "")
              if resp.is_redirect and "Location" in resp.headers:
                  site.redirects[key] = resp.headers["Location"]
                  queue.append(urljoin(url, resp.headers["Location"]))
                  continue
              # parse HTML: queue links; record forms (action as path or absolute URL), never submit
          return site
      ```

      The scope check sits where every URL is requested, so redirects and form actions cannot bypass it.
    rubric:
      - Every test in tests/foundations/test_recon_crawler.py passes.
      - Scope compares parsed scheme, host and port - no substring checks.
      - Only GET requests are sent; forms are recorded, never submitted.
      - Redirects are read with allow_redirects=False and go back through the scope check.
    solution: |
      Exact-origin scope at the single request point, GET with `allow_redirects=False`, forms recorded not
      submitted, a seen-set and a page budget.

  - id: inventory-code
    type: coding
    concept: sec-recon-mapping
    skill: application
    title: An entry-point inventory that changes nothing
    prompt: |
      In `recon_entry_points.py`, implement `classify`, `probe` and `inventory`. Probe every candidate without
      credentials; probe safe methods (GET, HEAD) again with the bearer token; never send an unsafe method with
      credentials (send it anonymously with an empty JSON body). Classify each result as public, authenticated,
      missing, method-not-allowed or error, and return the entries sorted by path, then method. The tests check
      the portal's inventory, that its data is unchanged afterwards, and - with a spy - that no POST or PATCH
      carried an `Authorization` header.
    project: security
    files:
      - exercises/foundations/recon_entry_points.py
    test: tests/foundations/test_recon_entry_points.py
    command: .venv/bin/python -m pytest tests/foundations/test_recon_entry_points.py
    hints:
      - "Order matters in classify: 405 first, then 404 (only if not found with credentials either), then 401/403, then 500+."
      - "`requests.request(method, url, json={} if unsafe else None, allow_redirects=False, timeout=5)`."
    modelAnswer: |
      ```python
      def classify(anonymous, authenticated):
          if anonymous == 405:
              return "method-not-allowed"
          if anonymous == 404 and authenticated in (None, 404):
              return "missing"
          if anonymous in (401, 403):
              return "authenticated"
          if anonymous >= 500:
              return "error"
          return "public"

      def probe(base_url, candidate, token):
          method, url = candidate.method.upper(), base_url + candidate.path
          anonymous = requests.request(method, url, allow_redirects=False, timeout=5,
                                       json={} if method not in SAFE_METHODS else None).status_code
          authenticated = None
          if method in SAFE_METHODS:
              authenticated = requests.request(method, url, allow_redirects=False, timeout=5,
                                               headers={"Authorization": f"Bearer {token}"}).status_code
          return EntryPoint(method, candidate.path, candidate.params, anonymous, authenticated,
                            classify(anonymous, authenticated))
      ```

      A 404 that turns into 200 with credentials is "public" by this rule on purpose: the resource exists, and
      hiding it with 404 from anonymous callers is worth a note.
    rubric:
      - Every test in tests/foundations/test_recon_entry_points.py passes.
      - Unsafe methods are only ever sent without credentials.
      - The classification order distinguishes 405 (exists, other method) from 404 (missing).
      - The inventory is sorted and keeps the parameter names for the test plan.
    solution: |
      Two probes for safe methods, one anonymous probe for unsafe ones, and a classification that keeps "exists
      for another method" apart from "missing".

  - id: fingerprint-code
    type: coding
    concept: sec-recon-fingerprinting
    skill: application
    title: Fingerprinting checks that go quiet when fixed
    prompt: |
      In `recon_fingerprint.py`, implement `fingerprint(headers, body)` - report a `Server` header with a
      versioned product, any `X-Powered-By`, a Python traceback (evidence - its last line) and each HTML comment
      in HTML responses, in that order - and `scan(base_url)`, which checks `GET /health` and `GET /boom` and
      de-duplicates. The tests use the WSTG-INFO-02 example banners, the vulnerable portal and the portal with
      `missing-headers` and `verbose-errors` fixed, where your scan must report nothing.
    project: security
    files:
      - exercises/foundations/recon_fingerprint.py
    test: tests/foundations/test_recon_fingerprint.py
    command: .venv/bin/python -m pytest tests/foundations/test_recon_fingerprint.py
    hints:
      - "Lower-case the header names first: `{k.lower(): v for k, v in headers.items()}`."
      - "`VERSIONED_PRODUCT.search(server)` matches `nginx/1.31.5` but not `SandPay`."
      - "For the traceback evidence take `body.strip().splitlines()[-1]`."
    modelAnswer: |
      ```python
      def fingerprint(headers, body=""):
          h = {k.lower(): v for k, v in headers.items()}
          findings = []
          if VERSIONED_PRODUCT.search(h.get("server", "")):
              findings.append(Finding("server-version", h["server"]))
          if "x-powered-by" in h:
              findings.append(Finding("powered-by", h["x-powered-by"]))
          if TRACEBACK in body:
              findings.append(Finding("stack-trace", body.strip().splitlines()[-1][:200]))
          if "html" in h.get("content-type", ""):
              findings += [Finding("html-comment", c.strip()[:200]) for c in COMMENT.findall(body)]
          return findings
      ```

      Requiring a version keeps the check quiet on `Server: SandPay`, which the fixed portal still sends.
    rubric:
      - Every test in tests/foundations/test_recon_fingerprint.py passes.
      - Reports versioned banners but not bare product names (no false positive on the fixed portal).
      - Matches header names case-insensitively.
      - Keeps evidence short and specific (the banner value, the exception line).
    solution: |
      Case-insensitive headers, a versioned-product regex, traceback and comment checks - and a scan that is
      empty once the two flaws are fixed.

placement:
  - id: place-scope
    type: mcq
    concept: sec-recon-scope-and-method
    skill: application
    title: The admin panel on another port
    prompt: |
      Scope: `https://portal.sandpay.example`. While mapping you notice the login page's JavaScript calls
      `https://portal.sandpay.example:9443/admin/health`. What do you do?
    options:
      - id: record-ask
        text: Record it with the evidence, do not request it, and ask the client whether it should be added to the scope
        feedback: Correct - another port is another origin; discovering it is valuable, testing it needs permission.
      - id: test
        text: Test it - it is the same host name, so it is in scope
        feedback: Scope is scheme + host + port; port 9443 is a different service.
      - id: one-request
        text: Send one GET to see if it is real, then decide
        feedback: Even one request to an out-of-scope service is testing it.
      - id: ignore
        text: Ignore it; it is out of scope
        feedback: Out of scope does not mean unimportant - an exposed admin interface is worth reporting to the client.
    correct: [record-ask]
    solution: |
      Origins are exact. Record discoveries outside the scope, with evidence, and ask before touching them.

  - id: place-inventory
    type: mcq
    concept: sec-recon-mapping
    skill: analysis
    title: Reading an inventory row
    prompt: |
      Your inventory shows `GET /api/merchants/m_100 anon=401 auth=200 -> authenticated` for Alice (merchant m_100).
      Which next test does this row point to?
    options:
      - id: idor
        text: Request /api/merchants/m_200 (Bob's) with Alice's token - an object-level access-control test
        feedback: Correct - an authenticated endpoint with an object id in the path is the classic IDOR candidate.
      - id: done
        text: None - 401 without credentials proves access control works
        feedback: It proves authentication is required, not that Alice is limited to her own merchant.
      - id: brute
        text: Brute-force merchant ids anonymously
        feedback: Anonymous requests get 401 before any id check; and brute force may be out of scope.
      - id: sqli-first
        text: SQL injection in the Authorization header
        feedback: Possible later, but the row points first to authorisation of the id.
    correct: [idor]
    solution: |
      Authentication and authorisation are different checks. An id in the path of an authenticated endpoint calls
      for a test with another user's id.

  - id: place-fingerprint
    type: mcq
    concept: sec-recon-fingerprinting
    skill: application
    title: Which response leaks the most?
    prompt: Which of these responses gives an attacker the most useful information?
    options:
      - id: trace
        text: "A 500 whose body is a traceback ending in `RuntimeError: ... key=sk_...`"
        feedback: Correct - a secret plus internals; this one is critical.
      - id: server
        text: "A 200 with `Server: nginx/1.31.5`"
        feedback: A version is a lead to known vulnerabilities, but much less than a leaked key.
      - id: generic
        text: "A 500 with `{\"error\": \"internal error\", \"reference\": \"1b955585\"}`"
        feedback: This is the fixed portal's generic error - it leaks nothing useful.
      - id: name
        text: "A 200 with `Server: SandPay`"
        feedback: A product name without a version is of little use.
    correct: [trace]
    solution: |
      Rank leaks by what they enable: a secret beats a version, which beats a product name. Generic errors with a
      reference are the fix.

recall:
  - id: recall-why-recon
    concept: sec-recon-scope-and-method
    prompt: What is the WSTG's one-line reason for doing information gathering first?
    answer: '"You can only test what you can find." Assets never discovered are never tested, however thorough the rest of the assessment is.'
  - id: recall-passive-active
    concept: sec-recon-scope-and-method
    prompt: What is the difference between passive and active reconnaissance?
    answer: Passive does not directly interact with the target (search engines, archives, Certificate Transparency logs); active sends requests to it (banner grabs, crawling, probing). Both need the scope's permission.
  - id: recall-scope
    concept: sec-recon-scope-and-method
    prompt: How should a tool decide whether a URL is in scope?
    answer: Compare the parsed origin exactly - scheme, host and port. Never by substring or endswith. Record out-of-scope URLs (links, form actions, redirects) and never request them.
  - id: recall-info-ids
    concept: sec-recon-mapping
    prompt: Which WSTG tests cover entry points and execution paths?
    answer: WSTG-INFO-06 Identify Application Entry Points (requests, parameters, hidden fields, responses) and WSTG-INFO-07 Map Execution Paths Through Application (crawling, code paths, workflows).
  - id: recall-safe-inventory
    concept: sec-recon-mapping
    prompt: How do you check whether a POST endpoint needs authentication without changing data?
    answer: Send it without credentials and with an empty body - an endpoint that checks authentication first answers 401/403 before doing anything. Never send unsafe methods with real credentials during recon.
  - id: recall-banner
    concept: sec-recon-fingerprinting
    prompt: Is a versioned Server header a vulnerability?
    answer: Not by itself (WSTG-INFO-02) - but it helps attackers find version-specific exploits, and RFC 9110 says servers SHOULD NOT send needlessly fine-grained detail. Report as low, recommend removing versions and patching.

