id: reconnaissance-and-attack-surface
title: Reconnaissance and attack surface mapping
subject: security-testing
module: security-foundations
level: intermediate
status: published
estimatedMinutes: 130
summary: Map what an application exposes before testing any of it - stay in scope, separate passive from active reconnaissance, grab banners and fingerprint frameworks, review pages for leaks, and build an entry-point inventory with a crawler that only reads. Follows the OWASP Web Security Testing Guide's Information Gathering tests (WSTG-INFO-01 to -10), run against the deliberately vulnerable SandPay portal on your own machine.
