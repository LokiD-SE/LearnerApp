id: testing-security-misconfiguration
title: Testing for security misconfiguration
subject: security-testing
module: web-vulnerabilities
level: intermediate
status: published
estimatedMinutes: 130
summary: Headers, verbose errors, defaults, version disclosure and exposed admin - the flaws that need no exploit, only a setting nobody turned off. How a tester provokes errors and reads what comes back (stack traces, paths, connection strings, secrets, framework error pages, server banners), how to review a deployment's configuration against WSTG and the OWASP Top 10, and how a developer fails safe with a generic response and a logged reference - all against a deliberately vulnerable SandPay portal on your own machine.
tags:
  [
    security misconfiguration,
    A05,
    improper error handling,
    stack trace,
    verbose errors,
    information disclosure,
    error message,
    banner grabbing,
    version disclosure,
    Server header,
    X-Powered-By,
    debug mode,
    default credentials,
    default accounts,
    directory listing,
    admin interface,
    HTTP methods,
    TRACE,
    hardening,
    repeatable configuration,
    last resort handler,
    generic error message,
    error reference,
    fail open,
    OWASP WSTG,
    WSTG-ERRH-01,
    WSTG-CONFIG-02,
    WSTG-CONFIG-05,
    ASVS 16.5,
    CWE-209,
    security testing,
  ]

environment: |
  - **Runtime:** Python 3.12.3 in `practice/security/.venv` with pytest 9.2.0 and requests 2.34.2, and curl, on
    Linux. Every output in this lesson was printed by the commands and code shown, run on 20 November 2026
    against the practice portal. The repository folder in tracebacks is replaced by `<repo>`, random ports by
    the 8765 and 8766 used in the instructions, and the random error reference is shortened where noted.
  - **Practice target:** `practice/security/support/sandpay_vuln.py`, a **deliberately vulnerable** SandPay
    merchant portal that binds to `127.0.0.1` only. Its `verbose-errors` flaw (an unhandled error returns the
    traceback) and `missing-headers` flaw (which in this portal also covers the version in the `Server` banner)
    are the ones this lesson tests; `make_app({...})` builds the same portal with those flaws fixed. SandPay and
    every account, key and connection string in it are fictional and synthetic.
  - **Fixed is not hardened.** Fixing the two flaws closes this lesson's tests, nothing more. The portal still
    sends the default Python error page for methods it does not implement (shown below), and `/internal/admin`
    answers without authentication in every variant - it is the target of the SSRF lesson. The lesson says where
    that matters.
  - **Ethics:** test only systems you own or have **written permission** to test, inside the agreed scope.
    Provoking errors is not harmless on a real system - a request that crashes a process is a denial of
    service. Start with the gentle probes, stay in the agreed rate limit, and report a crash at once.
  - **Testing guide:** OWASP Web Security Testing Guide, latest (development) version on
    [GitHub](https://github.com/OWASP/wstg) as read on 20 November 2026 (the latest stable release is v4.2,
    where the same tests are WSTG-ERRH-01 "Testing for Improper Error Handling", WSTG-CONFIG-02 "Test
    Application Platform Configuration", WSTG-CONFIG-05 "Enumerate Infrastructure and Application Admin
    Interfaces" and WSTG-CONFIG-06 "Test HTTP Methods"): [Improper Error
    Handling](https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/08-Error_Handling/01-Improper_Error_Handling),
    [Application Platform
    Configuration](https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration_and_Deployment_Management/02-Application_Platform_Configuration),
    [Enumerate Admin
    Interfaces](https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration_and_Deployment_Management/05-Enumerate_Infrastructure_and_Application_Admin_Interfaces)
    and [HTTP
    Methods](https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration_and_Deployment_Management/06-HTTP_Methods).
    Quotations are from those pages; the "Debug Modes and Framework Error Pages", "Fail-Open Behavior" and
    "Cloud Services and AI-Enabled Applications" passages are in the latest version only.
  - **Risk category:** OWASP [Top 10:2021 A05 Security
    Misconfiguration](https://owasp.org/Top10/2021/A05_2021-Security_Misconfiguration/), and, for the newer
    list, [Top 10:2025 A02 Security
    Misconfiguration](https://owasp.org/Top10/2025/A02_2025-Security_Misconfiguration/) (the category moved from
    fifth to second place, and 2025 adds the line "A lack of central configuration for intercepting excessive
    error messages"), as read on 20 November 2026. The portal's flaw table uses the 2021 numbering.
  - **Requirements:** OWASP [ASVS
    5.0.0](https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x25-V16-Security-Logging-and-Error-Handling.md),
    chapter V16 section V16.5 "Error Handling" (requirements 16.5.1 to 16.5.4), as documented on 20 November
    2026.
  - **Defences:** OWASP Cheat Sheet Series, [Error Handling Cheat
    Sheet](https://cheatsheetseries.owasp.org/cheatsheets/Error_Handling_Cheat_Sheet.html) and [HTTP Headers
    Cheat Sheet](https://cheatsheetseries.owasp.org/cheatsheets/HTTP_Headers_Cheat_Sheet.html) (the `Server` and
    `X-Powered-By` entries), as documented on 20 November 2026 (read from the project's GitHub source).
  - **Standards:** [RFC 9110](https://www.rfc-editor.org/rfc/rfc9110) HTTP Semantics, section 10.2.4 "Server".
    CWE-209, "Generation of Error Message Containing Sensitive Information", is the weakness the WSTG page links
    for error output; this lesson cites it by name only.
  - **Not repeated here:** a full response-header audit (CSP, nosniff, Referrer-Policy, HSTS, cookie
    attributes) - [HTTP security for testers](#/lesson/http-security-for-testers); finding the pages in the first
    place - [Reconnaissance and attack surface](#/lesson/reconnaissance-and-attack-surface); the developer's view
    of the same list - [OWASP Top 10 for developers](#/lesson/owasp-top-10-for-developers); logs, metrics and
    traces - [Logs, metrics and traces](#/lesson/logs-metrics-traces).
  - **Tools not run here:** ZAP's "Application Error Disclosure" scan rule, Burp Repeater and Intruder, ffuf and
    Nuclei templates are named on the WSTG page; they are from the docs, not run here.

prerequisites:
  - http-security-for-testers
  - reconnaissance-and-attack-surface
  - owasp-wstg-and-asvs

concepts:
  - id: sec-misconf-error-leakage
    name: What an error gives away
    summary: Provoke errors on purpose and classify the response - stack traces, paths, connection strings, secrets, framework pages, banners - without tripping over application URLs.
  - id: sec-misconf-config-review
    name: Reviewing a deployment's configuration
    summary: Debug mode, default accounts, sample content, directory listing, public admin, TRACE and shared secrets are settings, found by a repeatable checklist and closed by a repeatable hardening step.
  - id: sec-misconf-safe-errors
    name: Failing safe
    summary: A last-resort handler returns a generic message with a reference, logs the detail server side, and never trusts an exception's message.

objectives:
  - Explain why a misconfiguration needs no exploit and why one stack trace can be worth more to an attacker than a vulnerability scan.
  - Provoke errors at every layer (web server, framework, application, API) and classify what each response gives away.
  - Tell a real leak from a false positive - an application URL is not a file path - and say what a "no findings" result does and does not prove.
  - Review a deployment's settings against the WSTG and Top 10 checklist and write the hardening change that closes each finding.
  - Write a last-resort error handler that returns a generic message with a reference, logs the full detail, and fails closed.
  - Report a misconfiguration finding with evidence, severity reasoning and a fix that applies to every environment.

sections:
  - id: intuition
    kind: intuition
    concepts: [sec-misconf-error-leakage, sec-misconf-config-review]
    title: The idea in plain language
    body: |
      A new tester joins SandPay and is asked to look at the merchant portal. They do not run an exploit. They
      type a path that does not exist, then a path that does, then send a request the portal was never meant to
      see. One of the answers is not a polite "something went wrong". It is a page of Python: the names of
      the source files, the exact line that failed, a database path and, in the last line, the text of an
      exception that happens to contain the signing key.

      Nobody wrote a bug into the portal to make that happen. Someone left the error handler at its default,
      because the default is useful while you are building. **Security misconfiguration** is that: the code can
      be fine, and the software is set up in a way that gives things away or lets things in - debug switches
      left on, default accounts left unchanged, sample applications left installed, admin pages left reachable,
      servers announcing their exact version.

      It is the most common finding for a reason. A vulnerability has to be introduced by someone; a
      misconfiguration is what you get when nobody decided. It is also the cheapest to test and the cheapest to
      fix - and the cheapest for an attacker, which is why it is worth a tester's first hour on any system.

  - id: what
    kind: what
    concepts: [sec-misconf-error-leakage, sec-misconf-config-review, sec-misconf-safe-errors]
    title: Terms you need
    body: |
      | Term | Meaning |
      | --- | --- |
      | **Security misconfiguration** | Top 10 A05: the application is set up incorrectly from a security point of view - for example "missing appropriate security hardening across any part of the application stack", "unnecessary features are enabled or installed", "default accounts and their passwords are still enabled and unchanged" |
      | **Improper error handling** | WSTG-ERRH-01: errors that arrive as stack traces, network timeouts, input mismatch, memory dumps, debug pages or consoles left enabled in production, and verbose API, GraphQL or cloud service error responses |
      | **Information disclosure** | the response tells the caller something it did not need - versions, paths, internal hostnames, secrets (the WSTG lists "filesystem paths, internal hostnames, and secrets") |
      | **Stack trace** | the list of calls that were active when an exception was raised, with file names and line numbers - a map of the code |
      | **Banner** | what a server says about itself: the `Server` and `X-Powered-By` headers, default error pages, a version in a footer |
      | **Debug mode** | a development setting that gives the developer maximum visibility - full traces, variable values, sometimes a console that runs code |
      | **Default account** | an account that ships with the product (`admin`, `root`, `test`, `guest`) with a known password |
      | **Sample content** | demo applications and example pages installed with a platform and never removed |
      | **Directory listing** | the server showing the files in a folder because there is no index page |
      | **Admin interface** | a management console or admin path; WSTG-CONFIG-05 asks whether it is "exposed to networks/users beyond those intended" |
      | **Generic error** | a message that says only that something failed, optionally with a reference the user can quote |
      | **Reference (correlation) id** | a random token put in both the response and the server log so a support request can be matched to the logged detail |
      | **Last-resort handler** | ASVS 16.5.4: a handler "which will catch all unhandled exceptions" so details reach the logs and "an error does not take down the entire application process" |
      | **Fail open** | WSTG: a security check that is skipped when an exception occurs, so the request is processed "as if the check had passed" |
      | **Hardening** | the repeatable process that sets every setting to a secure value, the same way in every environment |

  - id: why
    kind: why
    concepts: [sec-misconf-error-leakage, sec-misconf-config-review]
    title: Why these flaws matter in a payments portal
    body: |
      - **Errors are a free reconnaissance service.** WSTG-ERRH-01 lists what a verbose error lets an attacker do:
        "understand the APIs being used internally", "map the various services integrating with each other",
        "gather the versions and types of applications being used", and "identify filesystem paths, internal
        hostnames, and secrets (*e.g.* connection strings, API keys, or prompts) embedded in error output". Each
        of those turns the next attack from a guess into a plan.
      - **A version number is a lookup key.** RFC 9110 section 10.2.4 says overly detailed `Server` values
        "potentially reveal internal implementation details that might make it (slightly) easier for attackers
        to find and exploit known security holes". The attacker searches the version in a vulnerability
        database. The cheat sheet adds the honest limit: "attackers have other means of fingerprinting the server
        technology" - removing the banner removes a shortcut, not the weakness, so patching still matters.
      - **Debug and default settings can be a complete compromise.** The WSTG says of a reachable Werkzeug
        debugger (Flask's interactive in-browser console): treat it "as a critical finding (remote code
        execution), not just an information leak". A default `admin` account is a login, not a leak.
      - **Payments make a leak expensive.** The portal's error in the introduction contained a signing key. With
        a settlement signing key an attacker can forge settlement files; with a connection string, they know where
        the cardholder-adjacent data lives. A report that says "information disclosure, low" for that is wrong
        about the data, not the category.
      - **The category is large and growing.** Top 10:2021 reports that 90% of applications tested showed some
        form of misconfiguration; the 2025 edition says 100% and moves the category from fifth to second place.
        "Without a concerted, repeatable application security configuration process, systems are at a higher risk."
      - **It is the cheapest finding to fix and to prevent.** One setting, applied the same way everywhere. That
        is also why a retest is quick - and why "fixed in staging" proves nothing about production.

  - id: error-internals
    kind: internals
    concepts: [sec-misconf-error-leakage, sec-misconf-safe-errors]
    title: Where errors come from, layer by layer
    body: |
      A request passes through several layers, and every layer has its own error pages. The WSTG says to compare
      them: "Compare the error pages returned by each layer (CDN, WAF, proxy, application server) to identify the
      components in the stack and, in some cases, the origin server behind them."

      | Layer | How a tester triggers an error | What the response may give away |
      | --- | --- | --- |
      | CDN, WAF, load balancer | a request the edge rejects (very long path, bad header) | the product behind the edge, its default page |
      | Web server | a path that is not found (404), a folder (403 or a listing), an oversized URL (414), an oversized header (431), a method it does not know | server name and version, default HTML error page |
      | Framework | unhandled exception in a route, debug mode on | stack trace, local variables, settings, installed apps |
      | Application | malformed JSON, wrong type, missing field, out-of-range value, special characters | the failing query, internal field names, validation internals |
      | API gateway, cloud service | a request that reaches the provider directly | bucket names, regions, account ids, provider-specific XML or JSON |
      | Dependencies | stop or slow a backing service (only with permission) | upstream hostnames, driver messages, fail-open behaviour |

      **Why the web-server layer matters even when the application is careful.** The WSTG: "Even if errors are
      handled on the application level, breaking the HTTP specification may make the integrated web server show
      itself since it has to handle the request, and developers forget to override these errors." The portal in
      this lesson shows exactly that, further down: its application handler is fixed, and a request with a method
      it has no handler for still gets the standard library's default page.

      **What counts as a leak.** The classifier in this lesson looks for five things, each with a documented rule:

      - a **stack trace** - a Python `Traceback (most recent call last)` block or `File "...", line N` frame, a
        Java `at pkg.Class(File.java:12)` frame, a JavaScript `at fn (file.js:1:2)` frame;
      - a **file path** - an absolute path under a common root (`/home`, `/var`, `/usr`, `/etc`, `/opt`, `/srv`,
        `/tmp`, `/app`, `/root`, `/Users`) or a Windows drive path;
      - a **connection string** - `postgres://`, `mysql://`, `mongodb://`, `redis://`, `sqlite://`, `amqp://`;
      - a **secret** - `key=`, `secret=`, `password=`, `token=`, `api_key=` with a value, or an `sk_` key;
      - a **SQL error** - a database error message or an echoed `SELECT ... FROM`.

      **What it deliberately does not call a leak.** An application URL such as `/api/payments/9` in a "no such
      payment" message is not a file path, and `https://docs.sandpay.example/errors/E12` is not a connection
      string. A scanner that flags every slash teaches developers to ignore scanners. The rules are narrow on
      purpose, and the tests include the false-positive cases.

      **The reverse is the limit of any scan.** A pattern list finds the leaks it knows. A response that matches
      nothing is "nothing found by these rules" - not proof that the message is safe. The tester still reads it.

      **Errors hidden in successes.** The WSTG: "Sometimes errors are returned as success with an error body, hide
      the error in a 302, or simply by having a custom way of representing that error." A probe that looks only
      at 5xx statuses misses them. The probe in this lesson reads the body of every response, including 404s.

  - id: config-internals
    kind: internals
    concepts: [sec-misconf-config-review]
    title: The configuration checklist
    body: |
      Misconfiguration review is a checklist, because the failures are settings, not logic. Each item below
      comes from a named source; the exercise in this lesson turns it into code (`review_config`) and a
      repeatable fix (`harden`).

      | Finding code | The setting | Source |
      | --- | --- | --- |
      | `debug-enabled` | debug or development mode on in production | WSTG-CONFIG-02: "no debugging code, debug endpoints, debug modes, or unused modules/dependencies are left enabled in production environments" |
      | `verbose-errors` | the error handler returns detail | Top 10 A05: "Error handling reveals stack traces or other overly informative error messages to users" |
      | `version-banner` | `Server` or similar names a version | RFC 9110 section 10.2.4; HTTP Headers Cheat Sheet: "Remove this header or set non-informative values" |
      | `default-credentials` | `admin`, `root`, `test`, `guest` with an unchanged password | Top 10 A05: "Default accounts and their passwords are still enabled and unchanged" |
      | `directory-listing` | the server lists folder contents | Top 10 A05 scenario 2; WSTG-CONFIG-04 asks to "request all enumerated directories to identify any which provide a directory listing" |
      | `sample-content` | sample applications installed | Top 10 A05 scenario 1: "sample applications not removed from the production server" |
      | `admin-public` | admin interface reachable from outside | WSTG-CONFIG-05: check for "exposure to networks/users beyond those intended" |
      | `admin-no-auth` | admin interface without authentication | WSTG-CONFIG-05: check discovered interfaces for "default, weak, or reused credentials" |
      | `trace-enabled` | the `TRACE` method answers | WSTG-CONFIG-06: it "suggests that [the server] has not been properly hardened" - and the same page says it "is no longer exploitable" in browsers, so it is a low finding |
      | `shared-secrets` | the same credentials in several environments | Top 10 A05: "different credentials used in each environment" |

      **Three notes on reading the list.**

      - **The severity is not in the code.** `trace-enabled` is low. `debug-enabled` with an interactive console
        is critical. `admin-public` plus `admin-no-auth` on a page that returns a settlement key is critical. The
        finding is the setting; the severity comes from what the setting exposes in this system.
      - **Production is the only environment that counts, and the others matter too.** "Development, QA, and
        production environments should all be configured identically, with different credentials used in each
        environment." A debug flag on in staging is a finding when staging holds real data or is reachable from
        outside.
      - **A setting can look fixed and not be.** Edge devices may "reject or strip" methods before the origin sees
        them, so a clean `OPTIONS` through a CDN does not describe the origin (WSTG-CONFIG-06). Test the layer you
        mean to judge.

  - id: when
    kind: when
    concepts: [sec-misconf-error-leakage, sec-misconf-config-review, sec-misconf-safe-errors]
    title: When to test, and when to be careful
    body: |
      - **First, on every engagement.** Misconfiguration checks are quick, rarely harmful and often decisive. Run
        them while you map the application, before any heavy testing.
      - **After every deployment that changes the platform.** A new framework version, a new proxy, a new
        container image can switch a default back on. Put the cheap checks in the regression suite (the CI
        lesson covers that).
      - **On every environment you are allowed to touch,** and compare them. A difference between staging and
        production is a finding about the process.
      - **Be careful with errors that crash things.** A malformed request that kills a worker is a denial of
        service on a live system. Escalate slowly: a missing page, a bad method, one malformed body - and stop
        at the first sign of instability.
      - **Be careful with default credentials.** Trying a vendor's documented default login on a system you are
        authorised to test is normal; trying it against accounts that lock after a few attempts can lock real
        users. Ask what the lockout policy is first.
      - **Do not leave debug tools running.** If you enable a diagnostic setting to test it, put it back and note
        that you did.

  - id: visual
    kind: visual
    concepts: [sec-misconf-error-leakage, sec-misconf-safe-errors]
    title: An unhandled error, with and without the fix
    body: |
      ```mermaid
      flowchart TD
        R["Request: GET /boom"] --> H{"Route raises an unhandled exception"}
        H --> V{"verbose-errors fixed?"}
        V -- "no" --> T["500 text/plain: traceback, file paths, DB path, signing key"]
        V -- "yes" --> G["500 JSON: generic message + reference"]
        G --> L["Server log: reference + type + message + traceback"]
        T --> A["Attacker reads the map of the code"]
        L --> D["Team matches the user's reference to the log"]
      ```

      Notice that the fixed branch does not lose information - it moves it. The detail is still captured, in a
      place only the team can read, under the same reference the user was given. That is the whole design of a
      safe error handler.

  - id: curl-evidence
    kind: code
    concepts: [sec-misconf-error-leakage]
    title: The test by hand, with curl
    body: |
      Start two portals - one with all flaws, one with `verbose-errors` and `missing-headers` fixed:

      ```bash
      cd practice/security
      .venv/bin/python support/sandpay_vuln.py --port 8765 &
      .venv/bin/python support/sandpay_vuln.py --port 8766 --fix verbose-errors --fix missing-headers &
      ```

      **1. A route that fails.** The portal has a deliberately broken `/boom` route. Vulnerable portal (the
      repository folder is shown as `<repo>`):

      ```bash
      curl -si http://127.0.0.1:8765/boom
      ```

      ```text
      HTTP/1.1 500 Internal Server Error
      Server: SandPayPortal/0.9 Python/3.12
      Content-Type: text/plain
      Content-Length: 693

      Traceback (most recent call last):
        File "<repo>/practice/security/support/sandpay_vuln.py", line 474, in handle
          resp = self._route(req)
                 ^^^^^^^^^^^^^^^^
        File "<repo>/practice/security/support/sandpay_vuln.py", line 498, in _route
          return fn(req)
                 ^^^^^^^
        File "<repo>/practice/security/support/sandpay_vuln.py", line 469, in boom
          raise RuntimeError(f"settlement batch failed; db=sqlite:///var/sandpay/portal.db key={JWT_SECRET.decode()}")
      RuntimeError: settlement batch failed; db=sqlite:///var/sandpay/portal.db key=sandpay-practice-only-jwt-key
      ```

      (The `Date` header is left out of these listings.) Read it the way an attacker would: Python, with source
      file names and line numbers; the line that failed; a SQLite database path; and a key, in the last line.
      None of it was needed to tell the caller that something went wrong.

      **2. The same route on the fixed portal:**

      ```bash
      curl -si http://127.0.0.1:8766/boom
      ```

      ```text
      HTTP/1.1 500 Internal Server Error
      Server: SandPay
      Content-Type: application/json
      Content-Security-Policy: default-src 'self'; frame-ancestors 'none'
      X-Content-Type-Options: nosniff
      Referrer-Policy: no-referrer
      Strict-Transport-Security: max-age=31536000
      Content-Length: 52

      {"error": "internal error", "reference": "6f881049"}
      ```

      The reference is random on every request. Two things changed at once, because the portal was started with
      both fixes: the body is generic, and the `Server` banner lost its product versions (and the security
      headers appeared - their audit is the previous lesson's job).

      **3. A path that does not exist** is a quieter test, and on this portal a safe one:

      ```bash
      curl -si http://127.0.0.1:8765/nope
      ```

      ```text
      HTTP/1.1 404 Not Found
      Server: SandPayPortal/0.9 Python/3.12
      Content-Type: application/json
      Content-Length: 22

      {"error": "not found"}
      ```

      The body is fine. The header is not: `SandPayPortal/0.9 Python/3.12` names the product and two versions.

      **4. A method the portal does not implement.** This is the WSTG's "request that breaks the HTTP
      specifications" idea, in its mildest form. On the **fixed** portal:

      ```bash
      curl -si -X OPTIONS http://127.0.0.1:8766/health
      ```

      ```text
      HTTP/1.1 501 Unsupported method ('OPTIONS')
      Server: SandPay
      Connection: close
      Content-Type: text/html;charset=utf-8
      Content-Length: 360

      <!DOCTYPE HTML>
      <html lang="en">
          <head>
              <meta charset="utf-8">
              <title>Error response</title>
          </head>
          <body>
              <h1>Error response</h1>
              <p>Error code: 501</p>
              <p>Message: Unsupported method ('OPTIONS').</p>
              <p>Error code explanation: 501 - Server does not support this operation.</p>
          </body>
      </html>
      ```

      This is a different layer answering. The portal's route handler was fixed, but the HTTP server underneath
      (Python's standard-library `http.server`) answers methods that have no handler with its own page: different
      format, different content type, no security headers - and it tells an attentive tester what the stack is
      made of. The two fixes did not cover it, and the lesson's tests do not either: it is a **residual
      finding**, exactly the kind the WSTG warns about ("developers forget to override these errors").

      **5. An admin path** (WSTG-CONFIG-05 asks you to look for these). The portal serves `/internal/admin` and
      does not authenticate the caller:

      ```bash
      curl -si http://127.0.0.1:8765/internal/admin
      ```

      ```text
      HTTP/1.1 200 OK
      Server: SandPayPortal/0.9 Python/3.12
      Content-Type: application/json
      Content-Length: 59

      {"admin": true, "settlement_key": "sk_practice_do_not_use"}
      ```

      It is meant to be "internal only", and the portal trusts the caller's network position instead of
      checking who is calling. That belongs to the SSRF lesson; for this one it is a configuration finding -
      `admin-no-auth` - and the key is again synthetic.

  - id: probe-code
    kind: code
    concepts: [sec-misconf-error-leakage]
    title: The leak probe as code
    body: |
      The by-hand test finds the leak once. The probe finds it every time the application is deployed. It is two
      small functions in `exercises/web/misconf_errors.py`: a classifier for one response body, and a probe that
      applies it to a list of paths.

      ```python
      def classify_leaks(body: str) -> list[str]:
          found = {
              "stack-trace": STACK_TRACE, "file-path": FILE_PATH, "connection-string": CONNECTION,
              "secret": SECRET, "sql-error": SQL_ERROR,
          }
          return sorted(code for code, pattern in found.items() if pattern.search(body))


      def banner_discloses(headers: dict[str, str]) -> bool:
          lowered = {k.lower(): v for k, v in headers.items()}
          if "x-powered-by" in lowered:
              return True
          return bool(re.search(r"/\s*\d|\d+\.\d+", lowered.get("server", "")))


      def probe_errors(base_url: str, paths: list[str]) -> dict[str, list[str]]:
          result = {}
          for path in paths:
              _, _, body = fetch(base_url + path)   # fetch() also returns the body of 4xx and 5xx responses
              codes = classify_leaks(body)
              if codes:
                  result[path] = codes
          return result
      ```

      Run it against both portals, with a harmless path, the broken route and a missing page:

      ```python
      from sandpay_vuln import make_app, serve
      from web.misconf_errors import scan

      PATHS = ["/health", "/boom", "/no-such-page"]
      for label, fixed in [("vulnerable", ()), ("verbose-errors fixed", ("verbose-errors",)),
                           ("missing-headers fixed", ("missing-headers",)),
                           ("both fixed", ("verbose-errors", "missing-headers"))]:
          with serve(make_app(fixed)) as base:
              print(label, scan(base, PATHS))
      ```

      ```text
      vulnerable {'leaks': {'/boom': ['connection-string', 'file-path', 'secret', 'stack-trace']}, 'banner': True}
      verbose-errors fixed {'leaks': {}, 'banner': True}
      missing-headers fixed {'leaks': {'/boom': ['connection-string', 'file-path', 'secret', 'stack-trace']}, 'banner': False}
      both fixed {'leaks': {}, 'banner': False}
      ```

      The four rows are the point of the exercise. The two fixes are **independent**: closing the error leak does
      not hide the banner, and hiding the banner does not stop the traceback. A tester who checks only one of them
      reports a half-fixed portal as fixed.

  - id: line-by-line
    kind: line-by-line
    concepts: [sec-misconf-error-leakage, sec-misconf-safe-errors]
    title: Why the probe and the handler are written that way
    body: |
      - **`fetch` returns the body of 4xx and 5xx responses.** Python's `urllib` raises `HTTPError` for them. A
        probe that gives up on the exception never reads the page that matters, and "no leaks found" would be
        meaningless. The error object is a response too, so the code reads it.
      - **The probe scans every response, not only 5xx.** A 404 page, a 403 page and a 302 can leak - the WSTG
        says errors hide in successes and redirects.
      - **`FILE_PATH` demands a common filesystem root and refuses to match after `:`, `/`, `.` or a word
        character.** That is why `/api/payments/9` and the path part of `https://docs.sandpay.example/...` do not
        match, while `/var/sandpay/portal.db` and `C:\sandpay\config\app.ini` do. The tests have both kinds of
        case.
      - **`SECRET` wants an assignment, not the word.** `token` on its own appears in a harmless "missing or wrong
        CSRF token" message. `key=sandpay-practice-only-jwt-key` is an assignment with a value, which is what a
        leaked configuration looks like.
      - **`banner_discloses` treats any `X-Powered-By` as a finding.** The cheat sheet says to "remove all
        `X-Powered-By` headers" - there is no safe value for it. `Server` is judged by whether it carries a
        version, because RFC 9110 objects to "needlessly fine-grained detail", not to the header itself.
      - **`scan` reads the banner from the first path only.** The banner comes from the server layer, so one
        response is enough; the leaks need every path.
      - **The handler (below) checks `400 <= exc.status < 500`, not just `isinstance(exc, ClientError)`.** A
        `ClientError(500, ...)` is somebody's mistake - an unexpected failure that was dressed as a client
        error - and its message was not written for the caller. The test for it is named
        `test_a_server_error_marked_as_client_error_is_not_trusted`.
      - **The handler logs `traceback.format_exception(type(exc), exc, exc.__traceback__)`.** It works when the
        exception was never raised (its traceback is `None`), which a last-resort handler must survive: an error
        handler that raises is the worst error.

  - id: handler-code
    kind: code
    concepts: [sec-misconf-safe-errors]
    title: The safe error handler as code
    body: |
      The fix side of the lesson is one function in `exercises/web/misconf_handler.py`. It follows the Error
      Handling Cheat Sheet's target: "when an unexpected error occurs then a generic response is returned by the
      application but the error details are logged server side for investigation, and not returned to the user."

      ```python
      def make_handler(log: list[dict]):
          def handle(exc: BaseException, reference: str) -> tuple[int, dict]:
              if isinstance(exc, ClientError) and 400 <= exc.status < 500:
                  return exc.status, {"error": exc.message}
              log.append({
                  "reference": reference,
                  "type": type(exc).__name__,
                  "message": str(exc),
                  "traceback": "".join(traceback.format_exception(type(exc), exc, exc.__traceback__)),
              })
              return 500, {"error": "internal error", "reference": reference}
          return handle
      ```

      Using it on the `/boom` failure, and on a client error:

      ```python
      log = []
      handle = make_handler(log)
      try:
          raise RuntimeError("settlement batch failed; db=sqlite:///var/sandpay/portal.db key=sandpay-practice-only-jwt-key")
      except RuntimeError as exc:
          print(handle(exc, "a1b2c3d4"))
      print(handle(ClientError(404, "payment not found"), "r2"))
      print(log[0]["reference"], log[0]["type"], len(log))
      ```

      ```text
      (500, {'error': 'internal error', 'reference': 'a1b2c3d4'})
      (404, {'error': 'payment not found'})
      a1b2c3d4 RuntimeError 1
      ```

      The client sees a status and a generic message. The team has the type, the message and the traceback under
      the reference the client was given - one log entry, for the one unexpected error. The client error was
      answered with its own message and logged nothing, because it is the caller's problem, not the system's.

      **ASVS 5.0.0 asks for exactly this pair.** 16.5.1: "a generic message is returned to the consumer when an
      unexpected or security-sensitive error occurs, ensuring no exposure of sensitive internal system data such
      as stack traces, queries, secret keys, and tokens". 16.5.4: a "last resort" handler "which will catch all
      unhandled exceptions". 16.5.3 adds the other half: the application "fails gracefully and securely, including
      when an exception occurs, preventing fail-open conditions such as processing a transaction despite errors
      resulting from validation logic" - so the handler returns an error, it never returns "continue".

  - id: config-code
    kind: code
    concepts: [sec-misconf-config-review]
    title: Reviewing and hardening configuration as code
    body: |
      The configuration checklist from the internals section is `review_config` in
      `exercises/web/misconf_config.py`; the repeatable fix is `harden`. An environment is a plain dictionary,
      and a missing key means "nothing to report":

      ```python
      from web.misconf_config import review_config, harden

      env = {
          "debug": True, "error_detail": "full", "server_banner": "SandPayPortal/0.9 Python/3.12",
          "accounts": [{"name": "admin", "password_changed": False}],
          "directory_listing": False, "admin_public": True, "admin_auth": False,
          "http_methods": ["GET", "POST", "TRACE"],
      }
      print(review_config(env))
      print(review_config(harden(env)))
      print(harden(env))
      ```

      ```text
      ['admin-no-auth', 'admin-public', 'debug-enabled', 'default-credentials', 'trace-enabled', 'verbose-errors', 'version-banner']
      []
      {'debug': False, 'error_detail': 'generic', 'server_banner': 'SandPay', 'accounts': [{'name': 'admin', 'password_changed': True}], 'directory_listing': False, 'admin_public': False, 'admin_auth': True, 'http_methods': ['GET', 'POST']}
      ```

      Seven findings, none after `harden`, and `directory_listing` - already false - was not touched. The tests also check that `harden`
      never edits its argument and never adds a key the environment did not have: a hardening step that quietly
      changes unrelated settings is its own source of outages.

      **Two honest limits of this exercise.** First, it reviews a *description* of the settings. Reality has to be
      checked against that description - by looking at the running system, with the probes above - because a
      configuration file says what was meant, not what is running. Second, `harden` writes the secure value for
      you; a real fix also changes the *process* so the next environment starts secure ("A repeatable hardening
      process makes it fast and easy to deploy another environment that is appropriately locked down").

  - id: steps
    kind: steps
    concepts: [sec-misconf-error-leakage, sec-misconf-config-review, sec-misconf-safe-errors]
    title: Testing for misconfiguration, step by step
    body: |
      1. **Confirm scope, rate and what you may break.** Written permission, the environments in scope, and
         whether a crashing request is acceptable.
      2. **Fingerprint.** Request the home page, a missing page and a harmless API route; note the `Server`,
         `X-Powered-By` and any version in a footer or error page.
      3. **Provoke errors, gently first.** A path that does not exist; a folder; a method the app does not use;
         malformed JSON; a wrong type; a missing field; a very long value. One request at a time.
      4. **Classify every response body** - stack trace, path, connection string, secret, SQL error, framework
         page - for every status, not only 5xx. Keep the full response as evidence.
      5. **Compare layers.** Is the 404 from the application or from the server? Do the error formats differ? Does
         a request that breaks HTTP rules produce a default server page?
      6. **Look for debug features and sample content.** Debug endpoints, framework consoles, `/actuator`-style
         paths, sample applications, documentation pages.
      7. **Look for admin interfaces.** Common paths, other ports, links in page source (WSTG-CONFIG-05). For each
         one found: who can reach it, does it ask who you are, are defaults accepted (within the lockout policy)?
      8. **Check the HTTP methods and directory listing.** `OPTIONS`, `TRACE`, a folder without an index page.
      9. **Review configuration, where you have access** (gray box): debug flags, accounts, shared secrets,
         enabled modules, log content - and compare environments.
      10. **Check fail-open behaviour.** Does a security check still apply when a component fails or a token is
          malformed?
      11. **Decide severity from what the setting exposes,** not from its name. Write the finding with the
          evidence, the fix and the environments it applies to.
      12. **Retest after the fix, on every layer you tested.** A fixed application handler and a default server
          page are two findings.

  - id: example
    kind: example
    concepts: [sec-misconf-error-leakage, sec-misconf-config-review]
    title: "Example: a clean scan and a half-fixed portal"
    body: |
      This is a hypothetical walk-through on the practice portal; the classifications are from the runs above.

      A developer reads the report ("`GET /boom` returns a stack trace") and deploys a fix. The tester retests
      with the probe:

      ```text
      verbose-errors fixed {'leaks': {}, 'banner': True}
      ```

      `leaks` is empty, so the finding is closed. `banner` is still `True`, so a **second** finding is open and
      was never reported, because the first report was about the body. The tester adds it: `Server:
      SandPayPortal/0.9 Python/3.12` (low severity - it narrows an attacker's search, it opens nothing).

      Then a lower-level request, `OPTIONS /health` on the fixed portal, returns an HTML page: a third finding,
      at a different layer, which no application-level fix could close. The tester writes it as "default error
      page from the HTTP server layer" with the response as evidence, and recommends handling or disabling
      unsupported methods at the front proxy, where the same behaviour will apply to every route.

      Finally the tester records `/internal/admin`, which answered `200` with a key, as a separate critical
      finding for the SSRF and access-control lessons.

      Four lessons from one retest:

      - a fix closes a finding, not a category - retest each layer;
      - an empty `leaks` result means "nothing found by these rules", so the tester also reads the response;
      - low-severity findings are still worth recording, because they are cheap to fix and tell the next
        attacker something;
      - the severity of a leaked value depends on the value: a path is low, a signing key is critical.

  - id: tests
    kind: tests
    concepts: [sec-misconf-error-leakage, sec-misconf-config-review, sec-misconf-safe-errors]
    title: Test cases
    body: |
      | # | Case | Steps | Expected (secure) | Evidence |
      | --- | --- | --- | --- | --- |
      | 1 | Missing page | request a path that does not exist | generic 404, no product or path | status, body, headers |
      | 2 | Server error | trigger an unhandled error (with permission) | generic 500 with a reference | full response |
      | 3 | Malformed JSON | send a broken body to an API route | 400 with a short message | full response |
      | 4 | Wrong type, missing field | send a string for an integer, omit a required field | 400 or 422 with field names only | full response |
      | 5 | Very long value | oversized path or header (carefully) | 414 or 431 from a layer with generic content | full response |
      | 6 | Unsupported method | `OPTIONS`, `TRACE`, an unknown verb | 405 or 501 in the application's own format | status, body, headers |
      | 7 | Error body scan | classify every body above | no stack trace, path, connection string, secret, SQL | probe output |
      | 8 | Banner | read `Server`, `X-Powered-By` | no version, no `X-Powered-By` | headers |
      | 9 | Layer comparison | compare error formats from each layer | one consistent generic format | responses side by side |
      | 10 | Debug features | look for debug endpoints, consoles, `/actuator`-style paths | none reachable | requests and statuses |
      | 11 | Default accounts | try documented vendor defaults, within the lockout policy | none work | login attempts |
      | 12 | Admin interfaces | enumerate admin paths and ports | not reachable from outside, authentication required | requests and statuses |
      | 13 | Directory listing | request each known folder | no listing | status, body |
      | 14 | Sample content | look for demo apps and docs pages | none | requests and statuses |
      | 15 | Fail open | trigger a failure in a dependency, or send a malformed token | the request is refused | before and after |
      | 16 | Environment comparison | run the same checks on each environment | identical results | the results table |

  - id: mistakes
    kind: mistakes
    concepts: [sec-misconf-error-leakage, sec-misconf-config-review, sec-misconf-safe-errors]
    title: Common mistakes and a debugging method
    body: |
      **Mistakes:**

      - **Looking only at 5xx.** Errors come back as 404, 403, 302 and even 200. Scan every body.
      - **Testing only the application layer.** The server underneath, the framework's debug pages and the proxy
        in front each have their own errors.
      - **Calling an empty scan a pass.** It means "nothing found by these rules". Read at least one response of
        each kind yourself.
      - **A scanner that flags every slash.** Application URLs are not file paths. A noisy check trains people to
        ignore real findings; keep the rules narrow and keep tests for the false positives.
      - **Fixing the body and leaving the banner** (or the reverse). The two flaws in this lesson's portal are
        independent, and so are most real pairs.
      - **Treating a banner as harmless.** It is low severity, not zero - "slightly" easier, in RFC 9110's words -
        and it is quick to fix. But do not treat its removal as a security measure by itself; the cheat sheet
        reminds us attackers "have other means of fingerprinting".
      - **Showing the client the exception message "just for validation errors".** Whitelist client-safe
        messages (a `ClientError` with a 4xx status) and give everything else the generic body.
      - **An error handler that can fail.** If the handler raises, the user gets the framework's default page
        after all. The handler must survive a missing traceback, a message that is not a string and a log that is
        full.
      - **Logging the secret instead of showing it.** Moving the detail to the log is right, but the log is
        another place that must not hold passwords, tokens or card numbers (the WSTG's "Sensitive data in logs"
        check). Redact before you write.
      - **"It is fixed in staging."** Compare environments; production is the one that matters.
      - **Leaving a diagnostic setting on after testing.**

      **A debugging method when the probe says "leak" or "clean" and you doubt it:**

      1. Print the raw response - status, headers and body - for the path.
      2. Run `classify_leaks` on the body alone and see which rule matched; widen or narrow that one pattern.
      3. Check the layer: was the response made by the application, the framework, the server or the edge?
      4. Change one setting (one `make_app` fix) and repeat. A result that does not change when you change the
         setting is not measuring the setting.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [sec-misconf-error-leakage, sec-misconf-config-review, sec-misconf-safe-errors]
    title: Trade-offs and alternatives
    body: |
      | Choice | Strength | Cost or gap |
      | --- | --- | --- |
      | Generic error plus reference | users learn nothing; support can still find the cause | needs a log the team can search by reference |
      | Detailed errors in development only | fast debugging | the switch must be off in every other environment, and checked |
      | Problem Details (RFC 9457) bodies for APIs | a standard shape clients can parse | `detail` and extension fields can still leak if filled from exceptions |
      | Removing the `Server` banner | removes a shortcut | attackers have other fingerprints; patching still matters |
      | A last-resort handler in the framework | catches what nobody anticipated | cannot fix errors raised before it runs (server layer, proxy) |
      | Regex scan of responses | cheap, repeatable, runs in CI | misses what it does not know; false positives if too broad |
      | Manual review of responses | catches the odd cases | slow, not repeatable |
      | Automated config checks (`review_config`) | repeatable, comparable across environments | reviews a description, not the running system |
      | Scanner tools (ZAP, Nuclei - from the docs, not run here) | broad coverage of known misconfigurations | noise; they do not know your business context |
      | One hardened image or template for every environment | the same secure start everywhere | needs ownership, or the template drifts |

      The Top 10's advice is the order of work: a repeatable hardening process, a minimal platform "without any
      unnecessary features, components, documentation, and samples", a review of configuration with each patch
      cycle, security headers, and "an automated process to verify the effectiveness of the configurations and
      settings in all environments". The probe and the review function in this lesson are small versions of that
      last item.

  - id: summary
    kind: summary
    concepts: [sec-misconf-error-leakage, sec-misconf-config-review, sec-misconf-safe-errors]
    title: Quick reference
    body: |
      - Misconfiguration is a setting, not a bug: debug on, defaults unchanged, samples installed, admin reachable,
        banners and errors that say too much (Top 10 A05; A02 in the 2025 list).
      - Provoke errors at every layer and read every response body - 404, 403, 302 and 200 included.
      - Classify leaks: stack trace, file path, connection string, secret, SQL error. Keep the rules narrow:
        `/api/payments/9` is not a file path.
      - A clean scan means "nothing found by these rules"; read the responses yourself.
      - Banners: no version in `Server`, no `X-Powered-By` (RFC 9110 section 10.2.4; HTTP Headers Cheat Sheet).
      - The body flaw and the banner flaw are independent - fix and retest each, and retest each layer.
      - Review configuration against a checklist: debug, error detail, banner, default accounts, directory
        listing, sample content, public admin, admin authentication, `TRACE`, shared secrets.
      - Severity comes from what the setting exposes: a path is low, a signing key is critical.
      - Fail safe: generic message plus reference to the user, full detail to the log, 4xx messages only when
        written for the client, and a handler that cannot itself fail (ASVS 16.5.1, 16.5.3, 16.5.4).
      - Test only what you are authorised to test, gently first, and put diagnostic settings back.

exercises:
  - id: misconf-definition
    type: mcq
    concept: sec-misconf-config-review
    skill: recognition
    title: Which one is a misconfiguration?
    prompt: Which of these is a security misconfiguration rather than a coding vulnerability?
    options:
      - id: debug-on
        text: The production portal runs with its framework's debug mode switched on
        feedback: Correct - the code can be fine; a setting nobody turned off exposes traces, and sometimes a console.
      - id: concat
        text: A handler builds an SQL string by concatenating a request parameter
        feedback: That is injection, a coding flaw - fixed in code with a parameterised query.
      - id: no-owner-check
        text: A handler returns any payment whose id it is given, without checking the owner
        feedback: That is broken access control (IDOR), a logic flaw in code.
      - id: md5-code
        text: The code hashes passwords with unsalted MD5
        feedback: That is a cryptographic failure in code, not a setting.
    correct: [debug-on]
    hints:
      - Could you fix it by changing a setting, without changing the application's logic?
    solution: |
      Misconfiguration is software that is set up insecurely - debug on, defaults left, samples installed, admin
      reachable - while the logic may be sound. The other three are defects in the code.

  - id: misconf-which-responses
    type: mcq
    concept: sec-misconf-error-leakage
    skill: application
    title: Which responses do you scan?
    prompt: Your probe requests a missing page, a forbidden folder, a redirect and a broken route. Which response bodies do you classify for leaks?
    options:
      - id: all
        text: All of them - 404, 403, 302 and 500 can each leak, and an error can be returned as a 200
        feedback: Correct - the WSTG says errors are sometimes "returned as success with an error body" or hidden in a 302.
      - id: only-5xx
        text: Only 5xx, because only server errors are errors
        feedback: A framework's 404 or a proxy's 403 page can name the product and version.
      - id: only-4xx
        text: Only 4xx, because the tester caused them
        feedback: The broken route that returned a 500 is the one that leaked the traceback.
      - id: none
        text: None - read the headers instead
        feedback: Headers matter for banners, but the bodies carry traces, paths and secrets.
    correct: [all]
    hints:
      - Which layer produced each response?
    solution: |
      Classify every body whatever its status. A probe that stops at 5xx misses 404 pages, redirects and errors
      wrapped in a 200.

  - id: misconf-path-false-positive
    type: mcq
    concept: sec-misconf-error-leakage
    skill: analysis
    title: Is this a file path?
    prompt: |
      A classifier flags the error body `{"error": "no such payment", "path": "/api/payments/9"}` as `file-path`.
      What is wrong, and what is the right rule?
    options:
      - id: url-not-path
        text: "`/api/payments/9` is an application URL. Match absolute paths under filesystem roots such as /var, /home or C:\\"
        feedback: Correct - narrow rules keep the scanner credible, and the tests keep the false-positive case.
      - id: remove-check
        text: File paths never leak, so remove the file-path check
        feedback: Paths such as /var/sandpay/portal.db do leak the layout of the server.
      - id: any-slash
        text: Nothing is wrong - any string with a slash is a possible path
        feedback: That rule flags every API response and teaches developers to ignore the scanner.
      - id: only-json
        text: Only JSON bodies can contain paths
        feedback: Tracebacks are usually plain text or HTML.
    correct: [url-not-path]
    hints:
      - Does the string name a place on the server's disk, or a route of the application?
    solution: |
      A leak is a place on the server's filesystem. Routes of the application are not. Use roots and drive
      letters, and keep tests for both the match and the non-match.

  - id: misconf-banner-severity
    type: mcq
    concept: sec-misconf-error-leakage
    skill: analysis
    title: How serious is a version in the Server header?
    prompt: |
      Every response carries `Server: SandPayPortal/0.9 Python/3.12`. How do you rate and report it?
    options:
      - id: low
        text: Low - it makes an attacker's search easier ("slightly", per RFC 9110) but opens nothing; fix it cheaply and keep patching
        feedback: Correct - it is a shortcut, not a hole, and the fix is a single setting.
      - id: critical
        text: Critical - the attacker now has the exploit
        feedback: A version is a lookup key, not an exploit; severity depends on what is actually vulnerable.
      - id: none
        text: Not a finding - the header is required by HTTP
        feedback: RFC 9110 says a server MAY send Server and SHOULD NOT include needlessly fine-grained detail.
      - id: fixed
        text: Fixed once the application handler returns generic errors
        feedback: The banner comes from the server layer; fixing error bodies does not change it.
    correct: [low]
    hints:
      - What does the attacker still have to do after learning the version?
    solution: |
      Report it as a low-severity information disclosure with the evidence and the one-line fix. Removing it does
      not replace patching - the cheat sheet notes attackers "have other means of fingerprinting".

  - id: misconf-residual-layer
    type: mcq
    concept: sec-misconf-error-leakage
    skill: analysis
    title: The fix that did not cover everything
    prompt: |
      After the developer fixes the application's error handler, `OPTIONS /health` still returns an HTML page with
      "Error response / Error code: 501" and no security headers. What is it, and what do you do?
    options:
      - id: residual
        text: A residual finding at the web-server layer - report it separately and recommend handling unsupported methods at the front proxy or server
        feedback: Correct - the WSTG warns that developers "forget to override these errors" for the integrated server.
      - id: retest-passed
        text: Nothing - the fix was for the application, so the retest passed
        feedback: The retest is about what an attacker sees; the default page is what they see.
      - id: regression
        text: A regression in the application handler - send it back
        feedback: The application handler did not produce this page; the server layer did.
      - id: expected
        text: Expected behaviour - 501 pages are always HTML
        feedback: A generic response in the application's own format, with the same headers, is what you want.
    correct: [residual]
    hints:
      - Which component answers a request that no route handles?
    solution: |
      The HTTP server's own default page is a separate layer and a separate finding. Report it with the response
      as evidence, and give the fix where it applies to every route.

  - id: misconf-empty-scan
    type: mcq
    concept: sec-misconf-error-leakage
    skill: analysis
    title: What does "no leaks found" prove?
    prompt: |
      Your probe returns `{}` for ten paths on a new deployment. What can you conclude?
    options:
      - id: nothing-found
        text: Nothing matched the rules on those paths; read the responses to confirm, and probe more error kinds
        feedback: Correct - a pattern list finds only what it knows, on only the paths you asked about.
      - id: safe
        text: The deployment is free of information disclosure
        feedback: The rules are a sample, and ten paths are a sample of the application.
      - id: handler
        text: The error handler is correct
        feedback: It handled these paths; the other error types may not be covered.
      - id: headers
        text: The banner is also fine
        feedback: Banners live in headers, and the probe's leak result does not look at them.
    correct: [nothing-found]
    hints:
      - What did the probe actually test?
    solution: |
      An empty result means nothing matched the known patterns on the tested paths. Keep reading responses by
      hand and extend the error types you provoke.

  - id: misconf-asvs-generic
    type: mcq
    concept: sec-misconf-safe-errors
    skill: application
    title: Which handler meets ASVS 16.5.1?
    prompt: |
      ASVS 5.0.0 requirement 16.5.1 asks for "a generic message ... when an unexpected or security-sensitive error
      occurs". Which response to an unexpected failure meets it?
    options:
      - id: generic-ref
        text: "`500` with `{\"error\": \"internal error\", \"reference\": \"a1b2c3d4\"}` and the detail in the server log"
        feedback: Correct - generic to the caller, traceable by the team through the reference.
      - id: exc-message
        text: "`500` with `{\"error\": \"settlement batch failed; db=sqlite:///var/sandpay/portal.db\"}`"
        feedback: The exception message is internal data - here a database path.
      - id: short-trace
        text: "`500` with only the last line of the traceback"
        feedback: The last line is the exception text, which is where the secret was in this lesson.
      - id: hidden-200
        text: "`200` with `{\"ok\": false}`"
        feedback: Hiding failure as success breaks clients and monitoring, and it is not what the requirement asks for.
    correct: [generic-ref]
    hints:
      - Where should the detail go, if not to the caller?
    solution: |
      Return a generic body, optionally with a reference, and log the detail. The reference is what lets support
      match the user's report to the log.

  - id: misconf-xpoweredby
    type: mcq
    concept: sec-misconf-config-review
    skill: application
    title: What to do with X-Powered-By?
    prompt: 'A response carries `X-Powered-By: Express`. What do you recommend?'
    options:
      - id: remove
        text: Remove the header - the HTTP Headers Cheat Sheet says to remove all X-Powered-By headers
        feedback: Correct - unlike Server, there is no useful non-informative value for it.
      - id: version
        text: Add a version number so clients can adapt
        feedback: The opposite of the advice - it adds detail.
      - id: keep
        text: Keep it - it is needed for HTTP/2
        feedback: It is not part of the protocol.
      - id: replace-server
        text: Replace it with a different X-Powered-By value
        feedback: A made-up value is still a header that serves no purpose; remove it.
    correct: [remove]
    hints:
      - Does any client need to know which framework produced the response?
    solution: |
      Remove it. The cheat sheet's recommendation for X-Powered-By is removal; for Server it is removal or a
      non-informative value.

  - id: misconf-trace-severity
    type: mcq
    concept: sec-misconf-config-review
    skill: analysis
    title: TRACE is enabled
    prompt: |
      `TRACE /` echoes your request on the production web server. A scanner reports it as "high". How do you rate
      it, according to WSTG-CONFIG-06?
    options:
      - id: low-hardening
        text: Low - the Cross-Site Tracing attack is blocked in browsers, but the setting suggests the server was not hardened
        feedback: Correct - record it, fix it, and look for what else the same process missed.
      - id: critical
        text: Critical - it steals HttpOnly cookies
        feedback: The WSTG says that issue "is no longer exploitable" because browsers and plugins block TRACE.
      - id: informational
        text: Not worth recording
        feedback: The WSTG notes it may still be flagged and indicates incomplete hardening.
      - id: high-always
        text: High - any enabled method other than GET and POST is high
        feedback: Severity depends on what the method exposes; TRACE echoes the request and little else.
    correct: [low-hardening]
    hints:
      - What does the WSTG say about browsers and TRACE today?
    solution: |
      A low finding that points at a hardening gap. Rate by what is exposed, not by the scanner's label.

  - id: misconf-default-login
    type: mcq
    concept: sec-misconf-config-review
    skill: application
    title: Trying a vendor's default password
    prompt: |
      You find a management console on port 8443 that looks like a known product. The scope allows testing it.
      What do you do before trying the documented default login?
    options:
      - id: lockout
        text: Find out the lockout policy and the account's owner, then try the documented default once or twice within it
        feedback: Correct - the point is to learn whether defaults were changed, not to lock real users out.
      - id: brute
        text: Run a large password list at once
        feedback: That is brute force, a different test with a bigger risk of locking accounts.
      - id: skip
        text: Skip it - default credentials are never a finding
        feedback: Top 10 A05 lists unchanged default accounts as a typical misconfiguration.
      - id: reset
        text: Reset the administrator password to see whether it works
        feedback: That changes the system you were asked to observe.
    correct: [lockout]
    hints:
      - What can a failed login do to a real user?
    solution: |
      Check the lockout policy first; then try the documented default a small number of times and record the
      result. The finding is whether the default works.

  - id: misconf-client-error-trust
    type: mcq
    concept: sec-misconf-safe-errors
    skill: analysis
    title: A client error with status 500
    prompt: |
      A handler passes through the message of any `ClientError`. Code deep in the stack raises
      `ClientError(500, "db password is hunter2hunter2")` while handling a database failure. What does the handler
      do wrong, and how is it fixed?
    options:
      - id: check-status
        text: It trusts the type. Only pass messages through for 4xx statuses; treat everything else as unexpected, log it and return the generic body
        feedback: Correct - a 5xx "client error" is an unexpected failure with a message nobody vetted.
      - id: nothing
        text: Nothing - ClientError messages are written for the client
        feedback: Only when it really is a client error; a 500 is not.
      - id: strip
        text: Strip the word password from the message
        feedback: Filtering known words does not scale; stop passing unvetted text.
      - id: log-less
        text: Stop logging unexpected errors
        feedback: The log is where the detail belongs; removing it loses the cause.
    correct: [check-status]
    hints:
      - Who wrote this message, and for whom?
    solution: |
      Whitelist what may reach the client: a 4xx `ClientError`. Everything else gets the generic body and a log
      entry.

  - id: misconf-environments
    type: mcq
    concept: sec-misconf-config-review
    skill: analysis
    title: Debug is on in staging only
    prompt: |
      Production has debug off. Staging has debug on and holds a copy of last month's merchant data, reachable from
      the internet. How do you treat it?
    options:
      - id: finding
        text: A finding - staging holds real data and is reachable, so it needs the same configuration as production
        feedback: Correct - "development, QA, and production environments should all be configured identically".
      - id: no-finding
        text: Not a finding - it is not production
        feedback: An exposed copy of real data is a target whatever its name.
      - id: prod-only
        text: Only note it if production is later compromised
        feedback: Reporting is for what you found, not for what happens next.
      - id: switch
        text: Switch debug off yourself during the test
        feedback: Changing the target is outside the scope of testing; report it.
    correct: [finding]
    hints:
      - What would an attacker find in that environment?
    solution: |
      Treat reachable environments with real data like production, and report the difference. Do not change the
      system under test.

  - id: misconf-test-order
    type: order
    concept: sec-misconf-error-leakage
    skill: application
    title: Put the error test in order
    prompt: Order the steps of testing a portal for error-based information disclosure.
    items:
      - id: scope
        text: Confirm scope, rate limit and whether a crashing request is acceptable
      - id: fingerprint
        text: Request a normal page and a missing page, and note the Server and X-Powered-By headers
      - id: gentle
        text: Provoke errors gently - an unknown method, malformed JSON, a wrong type
      - id: classify
        text: Classify every response body, whatever its status
      - id: layers
        text: Compare the error pages of the different layers
      - id: report
        text: Write each finding with the evidence, the severity reasoning and the fix
      - id: retest
        text: After the fix, retest every layer you tested
    hints:
      - You cannot classify a response you have not provoked.
      - Retesting comes last, after the fix.
    solution: |
      Scope, fingerprint, gentle errors, classify every body, compare layers, report, retest each layer. Gentle
      probes come before anything that could crash the system.

  - id: misconf-handler-debug
    type: debug
    concept: sec-misconf-safe-errors
    skill: analysis
    title: The handler that leaks through a detail field
    prompt: |
      This handler logs unexpected errors and returns a generic message - but a tester's probe still finds the
      database path in the response. Which line is the defect?
    language: python
    code: |
      def handle(exc, reference):
          log.append({"reference": reference, "message": str(exc)})
          if isinstance(exc, ClientError) and 400 <= exc.status < 500:
              return exc.status, {"error": exc.message}
          return 500, {"error": "internal error", "detail": str(exc), "reference": reference}
    correctLines: [5]
    lineNotes:
      - line: 2
        note: Logging the message is right; the log is where the detail belongs (redacted, in a real system).
      - line: 3
        note: Passing messages through only for 4xx ClientErrors is the correct whitelist.
    hints:
      - Look at what the unexpected-error branch puts in the body.
      - The generic message is followed by one more field.
    solution: |
      Line 5 puts `str(exc)` into the response as `detail`, so the "generic" body still carries the exception
      text. The body for an unexpected error should hold only the generic message and the reference.

  - id: misconf-banner-short
    type: short
    concept: sec-misconf-error-leakage
    skill: analysis
    title: "Removing the banner is pointless, says the developer"
    prompt: |
      A developer closes your banner finding as "won't fix - attackers can fingerprint us anyway". What do you
      reply, and what do you still recommend?
    modelAnswer: |
      They are partly right: the OWASP cheat sheet itself notes that attackers "have other means of fingerprinting
      the server technology", so removing the banner is not a security control on its own, and I agree the
      priority is patching. But RFC 9110 says a server SHOULD NOT send needlessly fine-grained detail because it
      makes it "(slightly) easier" to find known holes, and the fix is one setting that takes minutes. The finding
      is low severity - I would record it as such, not argue for more. I would recommend removing the version (or
      the header), removing `X-Powered-By`, and keeping the component patched. If they still decline, I ask for
      the decision to be recorded as an accepted risk so the next tester does not re-report it.
    rubric:
      - Concedes that fingerprinting by other means exists and that patching matters more.
      - Cites RFC 9110 or the cheat sheet for why the banner is still worth fixing.
      - Keeps the severity low and does not overstate it.
      - Asks for an accepted-risk record if the finding is declined.
    hints:
      - Part of the developer's argument is correct - which part?
    solution: |
      Agree it is low and patching matters more, but the fix is cheap and the standard advises it; record an
      accepted risk if it is declined.

  - id: misconf-testdesign
    type: testdesign
    concept: sec-misconf-config-review
    skill: application
    title: Test plan for a new staging environment
    prompt: |
      SandPay has built a new staging environment from a container image and will copy production merchant data
      into it next week. Design the misconfiguration test cases: preconditions, steps, expected result and
      evidence for each.
    modelAnswer: |
      Preconditions: written scope that names the staging host, a gray-box account that can read the deployment
      settings, a copy of production's settings for comparison, and agreement on what may be crashed.

      1. **Banner** - request a page and a missing page. Expected: no product version in `Server`, no
         `X-Powered-By`. Evidence: headers.
      2. **Missing page and unknown method** - request a missing path and `OPTIONS`. Expected: the
         application's generic format for both, no default server page. Evidence: full responses.
      3. **Application error** - trigger one unhandled error with permission. Expected: generic body with a
         reference, and the detail in the log under that reference. Evidence: response and log line.
      4. **Malformed input** - broken JSON, wrong types, a missing field. Expected: 400 or 422, field names only.
         Evidence: responses.
      5. **Error body scan** - classify every body above. Expected: no trace, path, connection string, secret
         or SQL. Evidence: probe output.
      6. **Debug settings** - read `debug`, error detail and log level. Expected: off or generic, same as
         production. Evidence: the settings and the comparison.
      7. **Accounts** - list accounts and check the default names. Expected: none, or changed passwords. Evidence:
         the account list and a login attempt within the lockout policy.
      8. **Admin interfaces** - enumerate common paths and other ports. Expected: unreachable from outside,
         authentication required. Evidence: requests and statuses.
      9. **Methods and listing** - `OPTIONS`, `TRACE`, a folder with no index. Expected: no `TRACE`, no listing.
         Evidence: responses.
      10. **Sample content** - look for demo apps and docs pages. Expected: none. Evidence: requests.
      11. **Secrets across environments** - compare secrets with production. Expected: different values.
          Evidence: the comparison (hashes, not the values, in the report).
      12. **Before the data copy** - run all of the above again. Expected: the same results. Evidence: the table.
    rubric:
      - Each case has preconditions, steps, an expected result and evidence.
      - Covers errors at the server layer as well as the application layer.
      - Covers debug, default accounts, admin interfaces, TRACE, listing and sample content.
      - Compares with production and checks that secrets differ.
      - Retests before real data arrives.
    hints:
      - Which settings should be identical to production, and which must differ?
      - The data copy is the moment the exposure becomes expensive.
    solution: |
      Banner, server-layer and application errors, an error-body scan, debug and account settings, admin
      interfaces, methods, listing, sample content and secrets - each with evidence, compared with production
      and repeated before the data copy.

  - id: misconf-interview
    type: interview
    concept: sec-misconf-error-leakage
    skill: analysis
    title: "Interview: how do you test for security misconfiguration?"
    prompt: '"Walk me through how you would test a web application for security misconfiguration, and how you decide how serious a finding is."'
    modelAnswer: |
      I start with scope and a rule about harm - provoking errors can crash a service, so I go gently. Then I
      fingerprint: the Server and X-Powered-By headers, a missing page, a harmless API call.

      Then I provoke errors at every layer - an unknown path, an unsupported method, malformed JSON, a wrong
      type, a missing field - and classify every response body, whatever the status, because errors come back as
      404s, redirects and even 200s. I look for stack traces, file paths, connection strings, secrets and SQL, and
      I compare the layers: if the application handles errors well but a request that breaks HTTP rules returns a
      default server page, that is its own finding. I look for debug features, sample content, admin interfaces
      and what they accept, default credentials within the lockout policy, TRACE and directory listing, and with
      gray-box access I compare the configuration across environments.

      Severity depends on what the setting exposes. A version in a banner is low. A path is low. A signing key in
      an error message or an unauthenticated admin page that returns one is critical. A reachable interactive
      debugger is critical because it is code execution.

      In the report I give the evidence, the one setting to change and that it applies to every environment, and
      I retest each layer after the fix - a fixed handler and a default server page are two findings.
    rubric:
      - Mentions scope and the risk of crashing requests.
      - Provokes errors at several layers and classifies every body.
      - Covers banners, debug, defaults, admin, TRACE, listing and environment comparison.
      - Ties severity to what is exposed, with examples.
      - Retests each layer after the fix.
    followUps:
      - How do you stop a scanner from flagging application URLs as paths?
      - What would you check on an API that returns Problem Details bodies?
      - How do you handle an environment you may not crash?
    hints:
      - Structure it as - how I find it, how I rate it, how I report it.
    solution: |
      Scope, fingerprint, provoke errors at each layer and classify every body, check debug, defaults, admin and
      methods, rate by exposure, report with the fix, retest each layer.

  - id: misconf-errors-code
    type: coding
    concept: sec-misconf-error-leakage
    skill: application
    title: Build the error-leak probe
    prompt: |
      In `practice/security`, complete `exercises/web/misconf_errors.py`: `classify_leaks`, `banner_discloses`,
      `probe_errors` and `scan`. The patterns and the `fetch` helper are given. The tests check the classifier
      on traceback, connection-string, secret and SQL bodies and on false-positive cases (application URLs,
      generic errors), then run the probe against the vulnerable portal (it must find the `/boom` leak and the
      banner), against the portal with `verbose-errors` fixed (no leaks, banner still reported) and with
      `missing-headers` fixed (banner gone, leak still reported).
    project: security
    files: [exercises/web/misconf_errors.py]
    test: tests/web/test_misconf_errors.py
    command: .venv/bin/python -m pytest tests/web/test_misconf_errors.py
    modelAnswer: |
      ```python
      def classify_leaks(body: str) -> list[str]:
          found = {"stack-trace": STACK_TRACE, "file-path": FILE_PATH, "connection-string": CONNECTION,
                   "secret": SECRET, "sql-error": SQL_ERROR}
          return sorted(code for code, pattern in found.items() if pattern.search(body))

      def banner_discloses(headers):
          lowered = {k.lower(): v for k, v in headers.items()}
          if "x-powered-by" in lowered:
              return True
          return bool(re.search(r"/\s*\d|\d+\.\d+", lowered.get("server", "")))
      ```

      `probe_errors` fetches each path, classifies the body and keeps the paths that have findings; `scan` adds
      the banner from the first response's headers. See "The leak probe as code".
    rubric:
      - Every test in tests/web/test_misconf_errors.py passes.
      - The classifier does not flag application URLs or generic errors.
      - The probe reads the body of 4xx and 5xx responses.
      - The banner and the error leak are reported independently.
    hints:
      - Start with classify_leaks - it applies five patterns.
      - Header names are case-insensitive.
      - Use fetch, not urlopen, so error bodies are read.
    solution: |
      Classify with the five narrow patterns, judge the banner by a version or any X-Powered-By, and keep the
      two results separate so each fix can be retested on its own.

  - id: misconf-config-code
    type: coding
    concept: sec-misconf-config-review
    skill: application
    title: Review and harden an environment
    prompt: |
      In `practice/security`, complete `exercises/web/misconf_config.py`: `review_config` and `harden`. The rules
      for the ten finding codes are in the module docstring. The tests check each setting on its own, secure
      settings (no findings), missing keys (no findings), and that `harden` closes every finding, keeps unrelated
      settings and never edits its argument or adds keys.
    project: security
    files: [exercises/web/misconf_config.py]
    test: tests/web/test_misconf_config.py
    command: .venv/bin/python -m pytest tests/web/test_misconf_config.py
    modelAnswer: |
      ```python
      def review_config(settings):
          found = set()
          if settings.get("debug") is True:
              found.add("debug-enabled")
          if "error_detail" in settings and settings["error_detail"] != "generic":
              found.add("verbose-errors")
          if _has_version(settings.get("server_banner", "")):
              found.add("version-banner")
          for account in settings.get("accounts", []):
              if account.get("name") in DEFAULT_NAMES and account.get("password_changed") is not True:
                  found.add("default-credentials")
          # ... the other six rules follow the same pattern ...
          return sorted(found)
      ```

      `harden` deep-copies the settings and changes only the keys that are present. The full solution is in
      `solutions/web/misconf_config.py`.
    rubric:
      - Every test in tests/web/test_misconf_config.py passes.
      - A missing key never produces a finding.
      - harden does not edit its argument and adds no keys.
      - After harden, review_config reports nothing.
    hints:
      - Use `is True` and `is False` so a missing key never matches.
      - copy.deepcopy before changing anything.
      - Handle the accounts list and the methods list separately.
    solution: |
      One rule per finding code, tested so that absent settings stay silent, and a hardening function that is the
      exact inverse of the review and edits only a copy.

  - id: misconf-handler-code
    type: coding
    concept: sec-misconf-safe-errors
    skill: application
    title: Write the safe error handler
    prompt: |
      In `practice/security`, complete `make_handler` in `exercises/web/misconf_handler.py`. The tests check that
      4xx client errors keep their message and are not logged, that an unexpected error returns the generic body
      with the reference and nothing from the exception, that one full log entry (reference, type, message,
      traceback) is written per unexpected error, that a `ClientError` with a 5xx status is not trusted, and that
      an exception that was never raised (no traceback) does not break the handler.
    project: security
    files: [exercises/web/misconf_handler.py]
    test: tests/web/test_misconf_handler.py
    command: .venv/bin/python -m pytest tests/web/test_misconf_handler.py
    modelAnswer: |
      ```python
      def make_handler(log):
          def handle(exc, reference):
              if isinstance(exc, ClientError) and 400 <= exc.status < 500:
                  return exc.status, {"error": exc.message}
              log.append({"reference": reference, "type": type(exc).__name__, "message": str(exc),
                          "traceback": "".join(traceback.format_exception(type(exc), exc, exc.__traceback__))})
              return 500, {"error": "internal error", "reference": reference}
          return handle
      ```
    rubric:
      - Every test in tests/web/test_misconf_handler.py passes.
      - Only 4xx ClientError messages reach the client.
      - The detail goes to the log under the reference, not to the response.
      - The handler cannot fail on a missing traceback.
    hints:
      - Whitelist what may reach the client; everything else is unexpected.
      - traceback.format_exception takes the type, the value and the traceback.
      - The body for an unexpected error has exactly two keys.
    solution: |
      Whitelist 4xx client errors, give everything else a generic body with the reference, and log the full
      detail under that reference.

placement:
  - id: place-misconf-which
    type: mcq
    concept: sec-misconf-config-review
    skill: analysis
    title: Which finding needs the most urgent fix?
    prompt: Your review of a production portal finds all four of these. Which is the most urgent?
    options:
      - id: admin-key
        text: An admin page that needs no login and returns a settlement signing key
        feedback: Correct - anyone who finds the path can forge settlements; the exposure decides the severity.
      - id: banner
        text: "`Server: nginx/1.25.3` on every response"
        feedback: Low - it narrows a search and opens nothing.
      - id: trace
        text: "`TRACE` answers on the web server"
        feedback: Low - browsers block the attack that made it notable, but it indicates missing hardening.
      - id: listing
        text: A folder with no index page that lists only public logo images
        feedback: Low - the listing exposes nothing sensitive here.
    correct: [admin-key]
    solution: |
      Severity comes from what the setting exposes. A key behind no authentication is critical; the other three
      are low.

  - id: place-misconf-leak
    type: mcq
    concept: sec-misconf-error-leakage
    skill: analysis
    title: Which error body leaks?
    prompt: Which of these error bodies gives something away that the caller did not need?
    options:
      - id: conn
        text: "`{\"error\": \"db unavailable\", \"dsn\": \"postgresql://app:pw12345678@db.internal/sandpay\"}`"
        feedback: Correct - a connection string with credentials and an internal hostname.
      - id: generic
        text: "`{\"error\": \"internal error\", \"reference\": \"a1b2c3d4\"}`"
        feedback: Generic, with a reference - this is the target shape.
      - id: route
        text: "`{\"error\": \"no such payment\", \"path\": \"/api/payments/9\"}`"
        feedback: An application route the caller already used is not a leak.
      - id: validation
        text: "`{\"error\": \"amount must be a positive integer\"}`"
        feedback: A message written for the client about its own input.
    correct: [conn]
    solution: |
      The DSN holds credentials and names an internal host. The others are generic or written for the client.

  - id: place-misconf-handler
    type: mcq
    concept: sec-misconf-safe-errors
    skill: application
    title: Where does the detail go?
    prompt: An unexpected exception occurs while a refund is processed. Where should its message and traceback go?
    options:
      - id: log
        text: To the server log under a reference, with the same reference in the generic response
        feedback: Correct - the team can find it, the caller learns nothing.
      - id: response
        text: Into the response, so the user can report it
        feedback: The user can report the reference; the detail stays internal.
      - id: nowhere
        text: Nowhere, so it cannot leak
        feedback: Then nobody can find the cause - ASVS 16.5.4 wants the details to reach the logs.
      - id: header
        text: Into a custom response header
        feedback: Headers are responses too.
    correct: [log]
    solution: |
      Log the detail server side and give the caller a generic message with the reference that finds it.

recall:
  - id: recall-misconf-what
    concept: sec-misconf-config-review
    prompt: What is a security misconfiguration, and give four examples?
    answer: Software set up insecurely while the code may be fine - debug mode on, default accounts unchanged, sample applications installed, admin interfaces reachable, directory listing on, verbose errors, version banners.
  - id: recall-misconf-leaks
    concept: sec-misconf-error-leakage
    prompt: What does the leak classifier look for?
    answer: Stack traces, absolute file paths under filesystem roots, connection strings, secret assignments and SQL errors - and it does not flag application URLs.
  - id: recall-misconf-layers
    concept: sec-misconf-error-leakage
    prompt: Why test the web-server layer even when the application handles errors?
    answer: A request that breaks HTTP rules or uses an unsupported method is answered by the server, whose default page the developer forgot to override.
  - id: recall-misconf-banner
    concept: sec-misconf-error-leakage
    prompt: What do you do about Server and X-Powered-By?
    answer: Remove X-Powered-By; remove the version from Server or the header (RFC 9110 section 10.2.4, HTTP Headers Cheat Sheet). It is low severity; keep patching.
  - id: recall-misconf-checklist
    concept: sec-misconf-config-review
    prompt: Name the findings in the configuration checklist.
    answer: Debug on, verbose errors, version banner, default credentials, directory listing, sample content, public admin, admin without authentication, TRACE enabled, shared secrets across environments.
  - id: recall-misconf-severity
    concept: sec-misconf-config-review
    prompt: How do you rate a misconfiguration?
    answer: By what the setting exposes in this system - a path or version is low, a signing key or an interactive debugger is critical.
  - id: recall-misconf-handler
    concept: sec-misconf-safe-errors
    prompt: What does a safe last-resort handler do?
    answer: Returns a generic message with a reference, logs the type, message and traceback under that reference, lets only 4xx client messages through, and cannot itself fail (ASVS 16.5.1, 16.5.3, 16.5.4).

