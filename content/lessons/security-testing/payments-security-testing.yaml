id: payments-security-testing
title: Security testing payment systems
subject: security-testing
module: security-specialised
level: advanced
status: published
estimatedMinutes: 150
summary: A payment system is where a small leak is expensive. Learn what card data is and where it may appear (the PAN, the verification code and what PCI SSC says about masking, truncation and tokens), then test for it - build a Luhn-based scanner that finds and masks card numbers without keeping them, audit a card gateway for numbers in responses, logs, stored records and receipts, check tokens for guessability and merchant scope, and spot card-testing (carding) in authorisation events with a velocity probe. All on a practice gateway with synthetic numbers built at run time, with PCI SSC's public FAQs and the OWASP guidance quoted, never invented.
tags:
  [
    payments security,
    PCI DSS,
    PAN,
    cardholder data,
    sensitive authentication data,
    CVV,
    masking,
    truncation,
    tokenisation,
    token vault,
    Luhn,
    card number detection,
    log redaction,
    card testing,
    carding,
    OAT-001,
    OAT-010,
    velocity checks,
    fraud abuse cases,
    security testing,
  ]

environment: |
  - **Runtime:** Python 3.12.3 in `practice/security/.venv` with pytest 9.2.0, on Linux. Every output marked as run here was printed by
    `practice/security/support/spay_demo.py` (and the code it imports) on 21 November 2026, against the in-process practice
    `CardGateway`. Nothing leaves the machine, nothing listens on a port, and there are no timings, so the output is the same on any machine.
    SandPay, its merchants, its tokens and every number are fictional.
  - **No real card number exists in this repository.** Test numbers are built when the code runs (`make_test_pan`: a prefix, seeded
    digits and a Luhn check digit), they are not issued to anyone, and the lesson never prints one in full - only masked, counted or
    described. Never put a real card number into a test, a ticket or a log, even your own.
  - **Sources (read on 21 November 2026, "as documented on" that date):**
    PCI Security Standards Council, [PCI Data Security Standard page](https://www.pcisecuritystandards.org/standards/pci-dss/) (public
    summary and intended audience); PCI SSC FAQs
    [1091 acceptable truncation formats](https://www.pcisecuritystandards.org/faq/articles/Frequently_Asked_Question/What-are-acceptable-formats-for-truncation-of-primary-account-numbers/) (June 2022),
    [1117 are truncated PANs protected](https://www.pcisecuritystandards.org/faq/articles/Frequently_Asked_Question/Are-truncated-Primary-Account-Numbers-PAN-required-to-be-protected-in-accordance-with-PCI-DSS/) (September 2021),
    [1146 masking versus truncation](https://www.pcisecuritystandards.org/faq/articles/Frequently_Asked_Question/What-is-the-difference-between-masking-and-truncation/) (July 2025) and
    [1533 storing sensitive authentication data](https://www.pcisecuritystandards.org/faq/articles/Frequently_Asked_Question/For-PCI-DSS-why-is-storage-of-sensitive-authentication-data-SAD-after-authorization-not-permitted-even-when-there-are-no-primary-account-numbers-PANs-in-an-environment/) (July 2021);
    the OWASP [Logging Cheat Sheet](https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html);
    the OWASP Automated Threats handbook entries [OAT-001 Carding](https://owasp.org/www-project-automated-threats-to-web-applications/assets/oats/EN/OAT-001_Carding)
    and [OAT-010 Card Cracking](https://owasp.org/www-project-automated-threats-to-web-applications/assets/oats/EN/OAT-010_Card_Cracking);
    Stripe's [Protect yourself from card testing](https://docs.stripe.com/disputes/prevention/card-testing) (vendor documentation, quoted for how card
    testing looks from a merchant, not run here); and US patent
    [2,950,048 "Computer for verifying numbers"](https://patents.google.com/patent/US2950048A/en) (1960), whose summary describes a check digit appended to a number
    (I read its summary, not its full mechanism; the digit-doubling rule in this lesson is the definition the code implements and the tests check). Their wording is quoted where it is quoted.
  - **What I did not read or confirm:** **the PCI DSS standard itself** - it needs a licence acceptance, so this lesson cites no requirement
    wording from it. Requirement numbers appear only where a PCI SSC FAQ names them (3.4.1 masking, 3.5.1 stored PAN), and the pages I read call
    the standard "PCI DSS v4.x", so I do not say which v4.x text a rule comes from. The PCI SSC Tokenization Guidelines information supplement, the
    payment brands' own rules, the card-number standard itself (ISO/IEC 7812) and any provider's token or network-token design were not read;
    anything about them is general knowledge and says so. Provider sandboxes and test cards, fraud tools such as Stripe Radar, 3-D Secure and
    bank rules are quoted or mentioned from documentation, **not run here**. The OWASP pages list CWE-799 and CWE-837 as cross-references; I did not read those
    CWE entries.
  - **The gateway is a model, not a copy of any real one.** `CardGateway` in `support/spay_fixture.py` has eight flaws I chose to teach with. Its
    decline rule (anything but three seeded cards is declined with one generic message), its velocity limit (five declines per client, counted not
    timed, so tests are exact) and its token formats are inventions. The event streams for the detector are synthetic. The thresholds in
    `detect_card_testing` (60 seconds, 10 attempts, 5 cards, 60% declines) and the house mask rule (at least four digits hidden) are this
    lesson's example policy, not a standard or any provider's rule.
  - **Ethics and law:** test only with written permission, inside the agreed scope, and only on systems you may test. Use synthetic numbers
    or the numbers your payment provider publishes for its **sandbox**; never run a list of real or stolen card numbers against any system -
    that is the attack this lesson teaches you to detect. This lesson's code runs only against the local practice gateway.
  - **Not repeated here:** what PCI DSS is, its twelve requirements and the cardholder data environment -
    [PCI DSS awareness for testers](#/lesson/pci-dss-awareness); what a token replaces and how saved cards behave -
    [Card payments, saved cards and tokenisation](#/lesson/card-payments-and-tokenisation); finding broken access control and rate-limit gaps -
    [Testing access control and IDOR](#/lesson/testing-access-control-idor) and
    [business logic and rate limits](#/lesson/testing-business-logic-and-rate-limits); how a finding is scored and written up -
    [Reporting vulnerabilities and CVSS](#/lesson/vulnerability-reporting-and-cvss).

prerequisites:
  - security-testing-fundamentals
  - pci-dss-awareness
  - card-payments-and-tokenisation
  - testing-business-logic-and-rate-limits

concepts:
  - id: sec-pan-handling
    name: Card data - where it may appear, and how to find it where it should not
    summary: A card number (the PAN) and the verification code have different rules. The PAN may be shown only masked and stored only unreadable (masked is for display, truncated or tokenised or encrypted is for storage - PCI SSC FAQ 1146); the verification code and PIN are sensitive authentication data that must not be stored after authorisation at all. A tester finds card data where it does not belong - responses, logs, exports, receipts, tickets - by looking for 13 to 19 digits that pass the Luhn check, reports where, and never keeps or pastes the number.
  - id: sec-token-testing
    name: Tokens - what they must and must not allow
    summary: A token stands in for a card so the card is not stored or sent again. It earns that only if it cannot be guessed, is not derived from the card, works only for the party it was issued to, and reveals nothing but a brand and last four. A token that is sequential, or works for another merchant, is a broken access control on a payment credential. A token that keeps the BIN and last four and passes Luhn is useful to legacy systems and will also be flagged by every card scanner - its scope is a decision for an assessor (FAQ 1117).
  - id: sec-card-testing
    name: Card testing - the abuse a payment endpoint invites
    summary: Card testing (carding, OWASP OAT-001; card cracking, OAT-010) is an automated, high-volume use of your own authorisation endpoint to find which stolen or guessed cards still work. From the merchant's side it looks like one client trying many different cards in a short time, mostly declined, usually small. Detect it from events, limit it per client and per card, and say plainly that any single signal - an address, a window - can be evaded or can hurt honest customers.

objectives:
  - State what masking, truncation, tokenisation and encryption each mean for a card number, and which one PCI SSC's FAQs tie to display and which to storage.
  - Explain why a verification code is never stored after authorisation, and why a log line, a response and a receipt each have their own rule.
  - Implement the Luhn check and a scanner that finds 13 to 19 digit card candidates, including grouped ones, and masks them without keeping the number.
  - Audit a gateway for a card number in a response, a log, a stored record and a receipt, and for a stored verification code, with a control and no false positive.
  - Test tokens for guessability and merchant scope, and explain what a format-preserving token changes for scanners and for scope.
  - Recognise card testing in authorisation events, write a window rule, probe for a velocity limit and explain its blind spots and side effects.
  - Carry out all of it with synthetic numbers, inside scope, and report findings without the number.

sections:
  - id: intuition
    kind: intuition
    concepts: [sec-pan-handling, sec-token-testing, sec-card-testing]
    title: The idea in plain language
    body: |
      A card number is a key that opens someone else's money. Everything about handling it follows from that one fact. You do not
      leave a key lying on a receipt, in a diary, or in the notes a locksmith keeps about every job. If you must remember which key
      belongs to which customer, you keep a *label* ("the red key, shelf 3") and lock the keys themselves in a safe that few people
      can open. And you keep an eye on your own front door: if someone is trying a thousand keys on it in a minute, the door
      has become a free tool for finding which keys still work.

      That is payment security testing in three parts. **Find the keys lying around** - the full card number in a response, a log, a
      database dump, a receipt or a support ticket - and report where, without photocopying the key into your report. **Check the
      labels** - tokens - are really just labels: unguessable, not derived from the key, and usable only by the shop they were made for.
      **Watch the door** - your authorisation endpoint - for the pattern of a stranger trying many keys, and check that the door slows
      them down.

      One more thing is different from every other security lesson: the thing you are protecting is also the thing you must never
      use while testing. You build fake keys that look right (they pass the arithmetic check) and you never, ever try a real one.

  - id: what
    kind: what
    concepts: [sec-pan-handling, sec-token-testing, sec-card-testing]
    title: What the terms mean
    body: |
      PCI SSC describes its standard this way: "PCI DSS was developed to encourage and enhance payment card account data security and
      facilitate the broad adoption of consistent data security measures globally. PCI DSS provides a baseline of technical and
      operational requirements designed to protect payment account data." Its intended audience is "entities that store, process, or
      transmit cardholder data (CHD) and/or sensitive authentication data (SAD) or could impact the security of the cardholder data
      environment (CDE)" - merchants, processors, acquirers, issuers and service providers.

      | Term | Meaning here |
      | --- | --- |
      | **PAN** | The primary account number: the 13 to 19 digit card number. |
      | **BIN** | The leading digits of the PAN: 6 or 8 digits in FAQ 1091's table. |
      | **SAD** | Sensitive authentication data - FAQ 1533: "specifically the card verification code and the PIN/PIN block". |
      | **Masking** | Concealing part of a PAN **when it is displayed or printed** (FAQ 1146). The full number may still be stored. |
      | **Truncation** | **Permanently removing** part of a stored PAN so it cannot be retrieved in the system (FAQ 1146). |
      | **Tokenisation** | Replacing the PAN with a value that has no usable meaning outside the system that issued it. |
      | **Luhn check** | A one-digit check that catches typing mistakes. It is not security and not proof a number is a card. |
      | **Card testing** | Using a merchant's payment flow to learn which card numbers are valid - OWASP OAT-001 *Carding*, with OAT-010 *Card Cracking* for guessing the missing expiry or code. |

      Two sentences from FAQ 1146 set the frame for the rest of the lesson. "Masking is addressed in PCI DSS Requirement 3.4.1, whereas
      truncation is one of several options specified to meet PCI DSS Requirement 3.5.1" - the first is about a PAN **displayed** on screens,
      receipts and printouts, the second about a PAN **stored, processed or transmitted** in files and databases. And: "even if a PAN is
      masked when displayed, the full PAN might still be electronically stored and would need to be protected."

  - id: why
    kind: why
    concepts: [sec-pan-handling, sec-token-testing, sec-card-testing]
    title: Why this matters
    body: |
      **Card data leaks the quiet way.** Almost nobody sets out to store a card number in a log; it arrives because a debug line
      printed the request, because an error handler dumped a body, or because a support export copied a field. OWASP's Logging Cheat
      Sheet lists what "should usually not be recorded directly in the logs, but instead should be removed, masked, sanitized, hashed, or
      encrypted", and "bank account or payment card holder data" is on that list - next to passwords, access tokens and session
      ids. The same sheet also lists "access to sensitive data such as payment cardholder data" among the events worth logging - the access, as a fact, is what you record. Leaks like these are found by looking, and a tester
      looks with a scanner, because no one can read a million log lines.

      **The verification code is special.** FAQ 1533 explains why it cannot be kept even when there is no PAN beside it: "sensitive
      authentication data must not be stored after authorization even if encrypted". An attacker who holds one merchant's PANs and
      another merchant's codes can join them on an email address, and a merchant that stores a code next to a token "is misrepresenting
      to the card issuer that the cardholder provided the card verification code during the transaction". Card-on-file and recurring
      payments do not need the code.

      **A token is only as good as its access control.** If tokens are sequential, or any merchant can charge any token, the token has
      become a bearer credential for someone else's card - the same flaw as an IDOR, in a more expensive place.

      **Your endpoint is a free oracle.** OWASP describes carding as "multiple payment authorisation attempts to verify the validity of
      bulk stolen payment card data". Every attempt costs the merchant fees and reputation: Stripe's guide lists "higher decline rates",
      "additional fees" and "infrastructure strain" among the consequences, and says card testing "has consequences for the entire
      payments ecosystem".

  - id: pan-internals
    kind: internals
    concepts: [sec-pan-handling]
    title: Under the hood - where a card number lives, and what is allowed to show
    body: |
      **Five surfaces, five rules.** A card number can appear in the *response* an API returns, in a *log line*, in a *stored record*
      (and so in every backup and export), on a *receipt or screen*, and in *free text* (tickets, chat, emails). A fix on one surface
      says nothing about the others, which is why the audit in this lesson checks each separately and why the practice gateway has
      one flaw for each.

      **Display versus storage.** From FAQ 1146: masking is "a method of concealing a segment of a PAN when displayed or printed ... and is
      used when there is no business need to view the entire PAN"; truncation is "a method of rendering a full PAN unreadable by removing
      a segment of PAN data and applies to PANs that are electronically stored". The difference is reversibility: "Masked PAN could be
      'unmasked', but there is no 'un-truncation' without recreating the PAN from another source."

      **How many digits.** FAQ 1091: "A maximum of the first 6 and last 4 digits of the PAN is the starting baseline for entities to retain
      after truncation, considering the business needs and purposes for which the PAN is used." Its table gives, per payment brand and PAN
      length, the maximum that may be retained:

      | PAN length | Brands (as listed) | Retain at most |
      | --- | --- | --- |
      | 16 digits (6- or 8-digit BIN) | Discover, JCB, Mastercard, UnionPay, Visa | at least 4 digits removed; "First 8, any other 4" |
      | 15 digits | American Express | at least 5 digits removed; "First 6, last 4" |
      | under 15 digits | Discover | "First 6, any other 4" |

      The FAQ adds that "access to different truncation formats of the same PAN greatly increases the ability to reconstruct full PAN" -
      two systems that keep different halves can, together, hold the whole number. The lesson's scanner uses a **stricter house rule**: keep
      the first six and last four but always hide at least four digits, which makes a 13-digit number keep only its last three. It is an
      example, not a standard; check your own brand and acquirer rules.

      **The Luhn check.** The patent behind it describes "a single digit, called the check digit" appended to a number "to indicate whether,
      in transmitting a number, an error has been made, such as a transposition of the digits". Going from the right, double every second
      digit (subtract 9 from a result above 9), add everything, and a valid number's total is a multiple of 10. It catches nearly every single
      wrong digit and nearly every swap of neighbours, but about **one random 16-digit run in ten passes** (the real run below, section 2, measured 10.0%), so a
      scanner reports *candidates*: an order id or a ticket number can look exactly like a card.

      **Where the code is never allowed.** The card verification code and PIN are SAD. They are not masked or truncated for storage -
      they are simply not stored after authorisation, "even if encrypted" (FAQ 1533).

  - id: token-internals
    kind: internals
    concepts: [sec-token-testing]
    title: Under the hood - what a good token is, and what testing it means
    body: |
      A token is a *reference*: the vault maps it back to the card, and nothing outside the vault can. Four properties make it safe to hand
      around, and each is a test.

      | Property | Test | A failing sign |
      | --- | --- | --- |
      | **Unpredictable** | Create several tokens and look for a pattern | `tok_0001`, `tok_0002`, `tok_0003` - an attacker can walk the whole space |
      | **Not derived from the card** | The token holds no digits of the PAN and cannot be recomputed from it | the token contains the last four, or equals a hash of the number |
      | **Scoped** | A token made by merchant A is refused for merchant B (403 or 404) | merchant B charges A's token and it works |
      | **Minimal when shown** | The response and logs show a brand and last four, nothing else | the full number comes back "for convenience" |

      **Why scope is the one that bites.** If any caller can use any token, the vault is an object-level authorisation hole: guess or
      steal a token and you can charge a stranger's card. That is the same shape as the portal's IDOR in
      [Testing access control](#/lesson/testing-access-control-idor), with a card behind the object id. Test it from the *other* account,
      never from the owner's.

      **Format-preserving tokens.** Some systems keep the first six and last four digits and replace the middle with generated digits, so a
      legacy system that expects a card-shaped value still works. FAQ 1117 says whether such values "may be considered out of scope for PCI
      DSS is dependent on a variety of factors and can only be determined in respect of an entity's specific implementation by an
      Assessor", and that "the systems performing encryption or tokenization of the PAN segment and those performing key management ...
      would be in scope". It lists the signs that make the result in scope: the segment "can be reversed in the environment in which the
      segment resides", sits "on a system or media that also contains the decryption key", or is "accessible to an entity that also has
      access to the decryption key". For a tester the practical effect is simpler: such a token is card-shaped, may pass Luhn, and **a card
      scanner will flag it** - so the scanner needs an allow-list for the token format, decided with the owner and written down.

      **Truncated PANs in scope.** FAQ 1117 also says systems that hold "only truncated PANs (where a segment of PAN data has been
      permanently removed) may be considered out of scope ... if those systems are adequately segmented from the cardholder data environment",
      but "the system performing the truncation ... as well as any connected systems and networks, would be in scope". Scope is a
      decision with conditions, not a property of a field.

  - id: abuse-internals
    kind: internals
    concepts: [sec-card-testing]
    title: Under the hood - card testing, and how to see and slow it
    body: |
      **The attack.** OWASP OAT-001 *Carding*: "Lists of full credit and/or debit card data are tested against a merchant's payment processes to
      identify valid card details." OAT-010 *Card Cracking* is the sibling: a "brute force attack against application payment card processes to
      identify the missing values for start date, expiry date and/or card security code". Stripe adds that testers favour *card setup*
      because validations "don't typically show up on cardholder statements", and otherwise make "small amount payments, which cardholders are
      less likely to notice".

      **What you see.** Stripe lists the symptoms: "A spike in failed or blocked payments", "a spike in requests with 402 errors", and "a spike in
      suspicious payments with low transaction amounts, often with nonsensical customer names and email addresses". In events that becomes one
      client, many *different* cards, a short time, mostly declined.

      **The detector in this lesson.** For each client, slide a window that starts at each of its events and holds the next `window_s` seconds
      (half-open: the event at exactly `start + window_s` is outside). The client is a suspect at the first start where the window has at least
      10 attempts, at least 5 different cards and at least 60% declines. Each condition removes a false positive: a *retry loop* is many attempts on one
      card, a *busy merchant* is many attempts all approved, a *customer* is a few attempts spread out.

      **Its blind spots - say them out loud.**
      - A **slow tester** spreads attempts over minutes and stays under a one-minute window. A longer window catches it and starts to catch honest
        bursts too. Stripe's own caution applies: "simple firewall rules or filters based on a single heuristic such as IP addresses are usually not
        sufficient to prevent card testing on their own."
      - A **per-client limit stops honest people behind the same address**: after five declines the practice gateway answers 429 even to a good card
        from that client (the real run below, section 8, shows it). Many customers share one office or mobile-carrier address.
      - A **distributed tester** uses many clients, each below every threshold. Per-*card* and per-*merchant* signals, and a check that the same
        card is not tried by many clients, cover what a per-client rule cannot.

      **Controls, in the order they usually pay off.** Make failed attempts cost something (a per-client and per-card limit, a challenge on the
      third decline); do not reveal why a card failed (one generic message, as the gateway does); require the verification code and billing data so
      guessing the expiry alone is not enough; do not expose a raw "validate card" endpoint without authentication; keep API keys out of public
      code, because Stripe notes that when keys leak "card testers can create payments and set up cards using your secret key"; and watch the decline
      rate as a monitored signal, not only a report.

  - id: when
    kind: when
    concepts: [sec-pan-handling, sec-token-testing, sec-card-testing]
    title: When to use each check
    body: |
      | Situation | Reach for | Why |
      | --- | --- | --- |
      | A new endpoint returns payment data | Response audit with a control card, plus the scanner on the body | The fastest leak to find and the easiest to fix |
      | A new log line, a debug flag or an error handler is added | The scanner over a captured log, in CI | The quiet way card data leaks (see the real run, section 3) |
      | A database, backup or export is created | Scan a *sample* of the stored records and the keys | Truncation and tokens are about what is stored |
      | A receipt, an email or an admin screen shows a card | Count exposed digits against the house rule | Masking is a display rule (FAQ 1146) |
      | Tokens are introduced or changed | Token audit from two merchants, and a look at the format | Guessability and scope are cheap to test and costly to miss |
      | A checkout or a card-setup endpoint is exposed | The velocity probe, then the event detector on real traffic | Free oracles get found |
      | A card-shaped token is introduced | Agree a scanner allow-list with the owner | Otherwise every scan reports it (FAQ 1117) |
      | A real incident is suspected | Stop. Escalate through the owner's channel; do not test further on live data | A test is not an investigation |

  - id: visual-surfaces
    kind: visual
    concepts: [sec-pan-handling, sec-token-testing]
    title: Where a card number can leak - and which test looks there
    body: |
      ```mermaid
      flowchart LR
        C["authorise: PAN + expiry + code"] --> G["gateway"]
        G --> R["response body"]
        G --> L["log lines"]
        G --> S["stored records<br/>(backups, exports)"]
        G --> D["receipt / screen / email"]
        G --> T["token vault"]
        R -- "audit: full PAN?" --> F1["pan-in-response"]
        L -- "scanner: Luhn-valid run?" --> F2["pan-in-log"]
        S -- "scanner + keys: PAN or code?" --> F3["pan-stored-plain / cvv-stored"]
        D -- "count exposed digits" --> F4["unmasked-display"]
        T -- "two merchants, several tokens" --> F5["token-guessable / token-cross-merchant"]
      ```

      Each arrow out of the gateway is a different code path, so a fix on one tells you nothing about the others. Read the diagram as the list of
      places to look - and note that the code, the one thing that must never be stored, has no place on it after the authorisation.

  - id: visual-abuse
    kind: visual
    concepts: [sec-card-testing]
    title: Card testing, and the loop that slows it
    body: |
      ```mermaid
      flowchart TD
        A["client sends an authorisation"] --> B{"declined?"}
        B -- "no" --> OK["approved"]
        B -- "yes" --> C["count: declines per client,<br/>distinct cards per window"]
        C --> D{"over the limit?"}
        D -- "no" --> E["generic 'declined' message"]
        D -- "yes" --> F["429 and alert"]
        F --> G["review: attacker, or honest users<br/>behind one address?"]
        G --> H["tune the rule, add a per-card signal"]
        H --> C
      ```

      The loop is the point: a velocity rule is never finished. Each side effect you find (honest users blocked, a slow tester missed) changes
      the thresholds or adds a second signal, and the change is itself tested with the probe and the detector.

  - id: code-python
    kind: code
    concepts: [sec-pan-handling, sec-token-testing, sec-card-testing]
    title: The code, shortened
    collapsed: true
    body: |
      The Luhn check, the mask and the scanner (`solutions/specialised/spay_detect.py`):

      ```python
      CANDIDATE = re.compile(r"(?<![0-9])(?:[0-9][ -]?){12,18}[0-9](?![0-9])")

      def luhn_valid(digits: str) -> bool:
          if len(digits) < 2 or not digits.isdigit():
              return False
          total = 0
          for index, ch in enumerate(reversed(digits)):
              d = int(ch)
              if index % 2 == 1:          # every second digit from the right
                  d *= 2
                  if d > 9:
                      d -= 9
              total += d
          return total % 10 == 0

      def mask_pan(digits: str) -> str:
          masked = max(4, len(digits) - 10)            # always hide at least four
          return digits[:6] + "*" * masked + digits[6 + masked:]

      def find_pans(text: str) -> list[PanHit]:
          hits = []
          for match in CANDIDATE.finditer(text):
              digits = SEPARATORS.sub("", match.group())
              if luhn_valid(digits):
                  hits.append(PanHit(match.start(), match.end(), len(digits), mask_pan(digits)))
          return hits
      ```

      The gateway audit looks at each surface and reports codes, never the number (`solutions/specialised/spay_audit.py`):

      ```python
      def audit_card_data(gateway, merchant="m_100"):
          card = gateway.test_cards[0]
          status, body = gateway.authorize(merchant, "audit-client", card["pan"], card["expiry"], card["cvv"], 1000)
          if status != 200:
              raise RuntimeError("the gateway declined the audit card")
          found = set()
          if card["pan"] in _plain(json.dumps(body)):
              found.add("pan-in-response")
          if any(card["pan"] in _plain(line) for line in gateway.log):
              found.add("pan-in-log")
          records = gateway.export_records()
          if any(card["pan"] in _plain(json.dumps(r)) for r in records):
              found.add("pan-stored-plain")
          if any(k.lower() in CVV_KEYS or v == card["cvv"] for r in records for k, v in r.items()):
              found.add("cvv-stored")
          if exposed_digits(gateway.receipt(body["payment_id"]), card["pan"]) > 10:
              found.add("unmasked-display")
          return sorted(found)
      ```

      The token audit and the card-testing window (`spay_audit.py`, `spay_velocity.py`):

      ```python
      suffixes = [t[len("tok_"):] for t in tokens]
      numbers = [int(s) for s in suffixes if s.isdigit()]
      sequential = len(numbers) == len(suffixes) and all(b - a == 1 for a, b in zip(numbers, numbers[1:]))
      if sequential or any(len(s) < 16 for s in suffixes):
          found.add("token-guessable")
      if gateway.charge_token(merchant_b, tokens[0], 100)[0] == 200:
          found.add("token-cross-merchant")

      for i, first in enumerate(items):                            # items: one client's events, sorted by t
          window = [e for e in items[i:] if e["t"] < first["t"] + window_s]    # half-open
          cards = len({e["card"] for e in window})
          declines = sum(1 for e in window if e["outcome"] == "declined")
          if len(window) >= min_attempts and cards >= min_cards and declines / len(window) >= min_decline_ratio:
              suspects.append(Suspect(client, first["t"], len(window), cards, declines))
              break
      ```

  - id: real-runs
    kind: code
    concepts: [sec-pan-handling, sec-token-testing, sec-card-testing]
    title: Real runs (21 November 2026)
    body: |
      Everything below was printed by `practice/security/support/spay_demo.py` with `SEC_TARGET=solutions`. **No card number is printed in
      full:** values are masked, counted or described, and where a line is shown it has been passed through the lesson's own `redact()` first
      (the demo says so). The one 16-digit order id in section 3 is swapped for a label at print time, only so this page holds no card-like
      digits. The tokens in section 6 are shortened for the same reason.

      ```text

      ## 1. masks by PAN length (first 6 + stars + last digits; at least 4 hidden)
        13 digits -> 459652****079  (hidden: 4)
        14 digits -> 484652****8493  (hidden: 4)
        15 digits -> 470079*****5040  (hidden: 5)
        16 digits -> 406591******3760  (hidden: 6)
        19 digits -> 453348*********9572  (hidden: 9)

      ## 2. how often does a random 16-digit run pass the Luhn check?
        9992 of 100000 random 16-digit runs pass (10.0%)

      ## 3. find_pans / redact on one made-up log line
        line length: 135 characters; it holds 5 long numbers: 2 forms of one Visa-like, 1 Amex-like, 2 ids
        hit start= 15 end= 31 digits=16 masked=437606******3246
        hit start= 36 end= 55 digits=16 masked=437606******3246
        hit start= 61 end= 76 digits=15 masked=377153*****0359
        hit start=107 end=123 digits=16 masked=943014******9758
        redact(line) -> POST /pay card=437606******3246 alt=437606******3246 amex=377153*****0359 order=<16-digit id, fails Luhn, left alone> ticket=943014******9758 amount=2500

      ## 4. audit_card_data on the default gateway, then one flaw at a time
        default gateway: ['cvv-stored', 'pan-in-log', 'pan-in-response', 'pan-stored-plain', 'unmasked-display']
        fully fixed    : []
        only pan-in-response   unfixed -> ['pan-in-response']
        only pan-in-log        unfixed -> ['pan-in-log']
        only pan-stored-plain  unfixed -> ['pan-stored-plain']
        only cvv-stored        unfixed -> ['cvv-stored']
        only unmasked-display  unfixed -> ['unmasked-display']

      ## 5. what the flawed and the fixed gateway wrote (redacted by our own redact())
        flawed raw surface holds the full PAN: log=True, response=True, record=True, receipt=True
        flawed log     : authorize merchant=m_100 client=demo card=406591******3760
        flawed response: {"amount_minor": 1000, "card": {"brand": "synthetic", "last4": "3760", "number": "406591******3760"}, "payment_id": "pay_1", "status": "approved"}
        flawed record  : keys=['amount_minor', 'cvv', 'first6', 'last4', 'merchant', 'pan', 'payment_id']
        flawed receipt : SandPay receipt pay_1: 1000 minor units, card 406591******3760
        flawed exposed digits on the receipt: 16
        fixed  raw surface holds the full PAN: log=False, response=False, record=False, receipt=False
        fixed  log     : authorize merchant=m_100 client=demo card=406591******3760
        fixed  response: {"amount_minor": 1000, "card": {"brand": "synthetic", "last4": "3760"}, "payment_id": "pay_1", "status": "approved"}
        fixed  record  : keys=['amount_minor', 'first6', 'last4', 'merchant', 'payment_id']
        fixed  receipt : SandPay receipt pay_1: 1000 minor units, card 406591******3760
        fixed  exposed digits on the receipt: 10

      ## 6. audit_tokens
        default gateway: ['token-cross-merchant', 'token-guessable']
        fully fixed    : []
        only token-guessable       unfixed -> ['token-guessable']
        only token-cross-merchant  unfixed -> ['token-cross-merchant']
        flawed tokens: ['tok_0001', 'tok_0002', 'tok_0003']
        flawed merchant m_200 charging m_100's first token -> status 200
        fixed  tokens: ['tok_4996...3aa9', 'tok_e4ad...b441', 'tok_b860...4caa']
        fixed  merchant m_200 charging m_100's first token -> status 403

      ## 7. detect_card_testing on a mixed stream of synthetic events
        236 events, 6 clients
        suspect Suspect(client='ip_x', first_t=1000, attempts=30, cards=30, declines=27)
        ip_slow with a 60 s window  : not found
        ip_slow with a 300 s window : [Suspect(client='ip_slow', first_t=0, attempts=15, cards=15, declines=14)]
        busy merchant alone         : []

      ## 8. probe_velocity_limit
        default gateway   : None
        no-velocity fixed : 6
        then a real card from the same client -> 429
        a real card from another client      -> 200
      ```

      What to take from it:

      - **Section 1:** the mask keeps at most the first six and last four and always hides four or more; the 13-digit number keeps three at the end.
      - **Section 2:** 9992 of 100000 random 16-digit runs pass Luhn. A Luhn hit is a candidate.
      - **Section 3:** the scanner finds the grouped form (same number with hyphens) as a second hit, finds the 15-digit one, leaves the 16-digit id that
        fails Luhn alone, and **cannot** tell a Luhn-valid ticket id from a card - it reports it (`ticket=`). Redaction is safe to over-apply; it is not safe to
        trust as a verdict.
      - **Section 4-5:** each flaw is found alone (a control: only that flaw unfixed), and the fixed gateway is clean. The *redacted* views of the
        flawed and fixed surfaces look alike, which is why the audit asks the raw question - `raw surface holds the full PAN` - and why the 16 versus 10
        exposed digits on the receipt is the number to compare.
      - **Section 6:** `tok_0001, tok_0002, tok_0003` is the whole problem on one line, and `m_200` charging `m_100`'s token answers 200 before the fix
        and 403 after.
      - **Section 7:** only `ip_x` is a suspect. The busy merchant (120 events, all approved) and the shoppers are not. `ip_slow` is missed with a 60-second window and
        found with 300 seconds.
      - **Section 8:** the probe finds no limit on the default gateway (`None`), finds attempt 6 on the fixed one, and the limit then also blocks a *good* card from
        the same client (429) while a different client gets 200.

  - id: line-by-line
    kind: line-by-line
    concepts: [sec-pan-handling, sec-token-testing, sec-card-testing]
    title: Why the important lines are written that way
    body: |
      | Line | Why |
      | --- | --- |
      | `(?<![0-9])` and `(?![0-9])` in `CANDIDATE` | A 20-digit id must not be cut into a 19-digit "card" at either end; the number has to stand alone. |
      | `(?:[0-9][ -]?){12,18}[0-9]` | 13 to 19 digits, each optionally followed by one space or hyphen, so `1234-5678-...` grouped numbers are found, and the pattern cannot end on a separator. |
      | `SEPARATORS.sub("", match.group())` before Luhn | The check is on the digits only; spaces and hyphens are layout. |
      | `if index % 2 == 1` after `reversed` | Luhn doubles every second digit **counting from the right**, so the parity does not depend on the length of the number. |
      | `masked = max(4, len(digits) - 10)` | Keep six and four where that hides at least four digits; a 13-digit number keeps only three at the end. |
      | `PanHit` has `masked`, no `digits` | A scanner that stores what it finds becomes the leak. The hit holds a position, a length and the masked form only. |
      | `raise RuntimeError` when the audit card is declined | A declined authorisation produces no record or receipt, so an empty list would read as "clean". Failing loudly is the honest answer. |
      | `any(pan in _plain(line) for line in gateway.log)` | Spaces and hyphens are removed first so a grouped number in a log is not missed. |
      | `exposed_digits` counts digits equal to the PAN's digit at the same position | `406591******3760` shows ten; a full number shows sixteen. Counting positions makes "first six, last four" a number a test can compare. |
      | Audit returns `sorted(found)` of codes | Stable, comparable, and it can never contain the card. |
      | `len(s) < 16` or consecutive integers for `token-guessable` | Two cheap signs of a counter or a short space; a random 24-hex-character token trips neither. |
      | `status == 200` for the cross-merchant charge | Any success means B used A's token; 403 or 404 both count as refusal. |
      | `e["t"] < first["t"] + window_s` | Half-open window: an event exactly `window_s` after the start belongs to the next window, so the rule is the same on both sides of every boundary. |
      | `len({e["card"] ...}) >= min_cards` | One card tried 30 times is a retry loop, not card testing. |
      | `break` after the first qualifying window | One report per client, at the earliest moment it qualified, with that window's numbers. |
      | `if status != 402: raise` in the probe | If a probe card is ever approved, the probe must stop: it is no longer a harmless decline. |

  - id: steps
    kind: steps
    concepts: [sec-pan-handling, sec-token-testing, sec-card-testing]
    title: A payment security review, step by step
    body: |
      1. **Get written permission and the scope**, including whether production data is in scope. Agree how you will report a card number you
         happen to find (you will not copy it).
      2. **Decide the test data.** Synthetic Luhn-valid numbers, or the provider's published sandbox cards, in a non-production environment. Never a real card.
      3. **List the surfaces**: responses, logs, stored records and exports, receipts and emails, admin screens, tickets, test fixtures, mobile and
         browser storage.
      4. **Run one authorisation with a control card** and look at every surface for the number and the code (the audit).
      5. **Scan captured logs and exports** with the Luhn scanner; sample, do not read everything; keep only masked hits.
      6. **Decide each hit**: card, token, id or test number. A Luhn-valid id is a candidate until you have looked at context.
      7. **Test tokens** from two merchants: several tokens (pattern), then a charge from the wrong merchant (scope), then what the token reveals.
      8. **Probe the authorisation endpoint** with declined attempts to find a velocity limit; note what it blocks and for how long.
      9. **Replay traffic into the detector** on a staging copy or a sample; check a busy merchant, a slow tester and a normal shopper.
      10. **Write the findings** with the code of the flaw, the surface, masked evidence, the CVSS vector and rationale
          ([Reporting and CVSS](#/lesson/vulnerability-reporting-and-cvss)), and send them by the agreed channel.
      11. **Turn each finding into a regression test** (the audit against a fixed build) and re-test after the fix.
      12. **Say what you did not cover** - the PCI DSS assessment, network segmentation, key management, the provider - because "no findings" is only a
          statement about the checks you ran.

  - id: example
    kind: example
    concepts: [sec-pan-handling, sec-token-testing, sec-card-testing]
    title: A week-one review of a saved-card feature (hypothetical)
    body: |
      This is a made-up story to show the order of thinking; it contains no measurements.

      SandPay is adding "save my card for next time". Mei, the tester, starts with the surfaces. She authorises one payment with a control card and
      runs the audit: the response is clean, but `pan-in-log` fires - a debug line prints the request body. Nothing is wrong with the card in
      the response; the leak is in a place the user never sees.

      She scans an export of last week's staging logs with the scanner. Most of the hits are the feature's new token, which was designed to keep six and
      four digits and happens to pass Luhn; a few are order ids; two are the debug line. She does not paste any of them into the ticket - she records the
      file, the line numbers and the masked form, and asks the owner for a scanner allow-list for the token format, because FAQ 1117 says the scope of such
      tokens "can only be determined ... by an Assessor". The order ids stay on the list as candidates until the developer confirms them.

      Tokens next: three tokens from account A are sequential in their last digits, so `token-guessable`; account B can charge account A's first token, so
      `token-cross-merchant`. She rates the second higher because it needs no guessing, and writes the rationale for each metric, as in the CVSS lesson.

      The probe finds no limit on the card-setup endpoint at all: thirty declined attempts, no 429. She adds the detector over an hour of staging traffic and checks a
      busy test merchant: not flagged. She notes the slow-tester blind spot and the shared-address side effect in the report, so nobody ships the rule believing it
      is complete. After the fix, each finding becomes a regression test against the fixed build.

  - id: tests
    kind: tests
    concepts: [sec-pan-handling, sec-token-testing, sec-card-testing]
    title: Test cases for a payment security review
    body: |
      | Case | Steps | Expected | Evidence |
      | --- | --- | --- | --- |
      | Full PAN in a response | Authorise with a control card; read the body | Brand and last four only | The masked body |
      | Full PAN in a log | Scan the log written by that call | No hit | The scan result and line count |
      | Stored record | Export the stored record for that payment | No readable PAN, no verification code | The key list |
      | Receipt and screens | Open the receipt, email and admin view | At most first six and last four, with at least four hidden | The exposed-digit count |
      | Grouped numbers | Put the control PAN in a log with spaces and with hyphens | Scanner still finds it | The hits |
      | Luhn limits | A long id that fails Luhn; one that passes | First not a hit; second reported as a candidate | Both results |
      | Token pattern | Create three tokens in a row | No sequence, at least 16 random characters | The token shapes (shortened) |
      | Token scope | Charge merchant A's token as merchant B | 403 or 404 | The status |
      | Token content | Compare a token with its card | No card digits derivable from it | The comparison |
      | Format-preserving token | Run the scanner over the token format | Allow-listed, with a written reason | The allow-list entry |
      | Velocity limit | Send declined attempts as one client | 429 within a small number of attempts | The attempt number |
      | Limit side effect | A good card from the blocked client; from another client | Documented behaviour for both | Both statuses |
      | Fast tester | Replay a tester stream into the detector | Found, with window numbers | The suspect |
      | Busy merchant | Replay a legitimate burst | Not found | The empty list |
      | Slow tester | Replay a slow stream | Documented as a gap, or found by a second rule | The result and the note |
      | Evidence hygiene | Scan your own report and screenshots | No card-like digits | The scan |
      | No false positive | Run every check against the fixed build | Nothing reported | The empty reports |

  - id: mistakes
    kind: mistakes
    concepts: [sec-pan-handling, sec-token-testing, sec-card-testing]
    title: Common mistakes
    body: |
      - **Testing with a real card.** Even your own. It leaves a real number in logs, tickets and screenshots, and a real attempt in the issuer's
        records. Use synthetic or sandbox numbers.
      - **Pasting the number into the ticket.** The finding is "a full PAN in `payments.log` lines 12 to 40", with the masked form - never the digits.
      - **Calling masking storage protection.** FAQ 1146: masking is for what is displayed; "the full PAN might still be electronically stored".
      - **Storing the verification code "only until settlement".** FAQ 1533: not after authorisation, "even if encrypted".
      - **Logging the request body for debugging and forgetting it.** OWASP lists payment card holder data among the data to keep out of logs.
      - **Fixing one surface.** A clean response with a PAN in the export is still a leak; audit all of them.
      - **Trusting Luhn as proof - or ignoring a Luhn hit as noise.** About one random 16-digit run in ten passes; treat hits as candidates and decide them.
      - **Forgetting grouped numbers.** `1234 5678 ...` and `1234-5678-...` are the same number; the scanner must cope with separators.
      - **A scanner that stores what it finds.** Findings hold positions and masked forms, not digits.
      - **Testing tokens only as their owner.** Scope is tested from the other account.
      - **Letting a card-shaped token drown the scan.** Agree an allow-list with the owner and write down why.
      - **Blocking by address alone.** Shared addresses block honest customers, and attackers rotate addresses; combine per-client, per-card and
        per-merchant signals.
      - **Revealing why a card failed.** Distinct "wrong expiry" and "wrong code" messages teach a card cracker which guess was close (the OAT-010 pattern).
      - **Claiming compliance.** A clean test run says the checks found nothing, not that the system meets PCI DSS; an assessor decides that.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [sec-pan-handling, sec-token-testing, sec-card-testing]
    title: Trade-offs
    body: |
      | Choice | Gain | Cost |
      | --- | --- | --- |
      | Scan logs for Luhn-valid runs | Cheap, language-independent, finds the quiet leaks | Candidates, not proof; about 10% of random 16-digit runs pass, so ids need triage |
      | Add BIN and length rules to the scanner | Fewer false positives | Rules go stale as BIN ranges change; a miss is worse than a false hit |
      | Mask 6 + 4 | Familiar and within the FAQ baseline | A stricter rule (hide at least 4) is safer for short numbers |
      | Token format: random | Nothing to guess or derive | Legacy systems may need a card-shaped value |
      | Token format: format-preserving | Legacy systems keep working | Scanners flag it; scope is an assessor's decision (FAQ 1117) |
      | Per-client decline limit | Simple, exact, cheap | Honest users behind one address are blocked; attackers rotate clients |
      | Per-card and per-merchant limits | Catch distributed testers | More state to keep and tune |
      | Long detection window | Finds slow testers | More false positives; later alerts |
      | One generic decline message | Teaches a tester nothing | Harder for an honest customer to fix a typo |
      | Synthetic test numbers | Safe and repeatable | Do not exercise a provider's real fraud models; use the sandbox for that |

  - id: summary
    kind: summary
    concepts: [sec-pan-handling, sec-token-testing, sec-card-testing]
    title: Quick reference
    body: |
      - **Display versus storage.** Masking conceals a PAN **when displayed** (FAQ 1146, requirement 3.4.1); truncation removes digits from a **stored**
        PAN (3.5.1); a masked PAN may still be stored in full. Baseline to keep: at most the first 6 and last 4 (FAQ 1091). House rule here: hide at least 4.
      - **SAD** (verification code, PIN) is **not stored after authorisation, even encrypted** (FAQ 1533). Card-on-file payments do not need the code.
      - **Five surfaces:** response, log, stored record, receipt or screen, free text. Test each; a fix on one says nothing about another.
      - **Luhn:** from the right, double every second digit, subtract 9 above 9, sum, multiple of 10. About one random 16-digit run in ten passes. Hits are candidates.
      - **A scanner never keeps what it finds:** positions, length and the masked form only. Grouped numbers (spaces, hyphens) count.
      - **Tokens:** unpredictable, not derived from the card, scoped to the issuing merchant, minimal when shown. Test scope from the other account.
      - **Format-preserving tokens** (BIN and last four kept) are scanner-visible; scope is for an assessor (FAQ 1117) - agree an allow-list.
      - **Card testing** (OAT-001 carding, OAT-010 card cracking): one client, many cards, short time, mostly declined, often small. Stripe: single-heuristic
        filters such as IP address "are usually not sufficient".
      - **Velocity limits** stop the fast tester and hurt honest users behind a shared address; a window rule misses a slow tester; combine per-client, per-card
        and per-merchant signals and one generic decline message.
      - **Ethics:** written permission and scope; synthetic or sandbox numbers only; never a real card; report without the number.
      - **A clean run is not compliance.** PCI DSS assessment is an assessor's decision.

exercises:
  - id: spay-mask-or-truncate
    type: mcq
    concept: sec-pan-handling
    skill: application
    title: Masked on screen, whole in the database
    prompt: |
      A merchant portal shows `first6******last4` on every receipt. The database column behind it holds the full card number, encrypted with a
      key the same service can read. Which statement matches PCI SSC's FAQ 1146?
    options:
      - id: display-only
        text: "The receipt is masked, which is a display rule; the stored number is a separate question (storage must make the PAN unreadable, for example by truncation or a token), so the masked receipt does not settle it."
        feedback: "Correct. FAQ 1146 separates masking (display, 3.4.1) from the rules for stored PAN (3.5.1) and says a masked PAN 'might still be electronically stored'."
      - id: masked-enough
        text: "Masking the receipt means the PAN is protected everywhere."
        feedback: "Masking only conceals the digits where they are displayed or printed."
      - id: truncation
        text: "The receipt is truncated, which satisfies storage."
        feedback: "Truncation is removal of digits from the stored value; hiding them on a screen is masking."
      - id: encrypted
        text: "Because it is encrypted, masking and truncation do not matter."
        feedback: "Encryption is one way to make storage unreadable, but the key sitting in the same service raises scope questions (FAQ 1117) and does not replace display rules."
    correct: [display-only]
    hints:
      - Which FAQ term applies to what a screen shows, and which to what a database holds?
    solution: |
      Masking is for display (3.4.1); storage is a separate rule (3.5.1). A masked receipt over a readable stored PAN has not solved storage.

  - id: spay-sad-store
    type: mcq
    concept: sec-pan-handling
    skill: application
    title: "Keep the code until settlement"
    prompt: |
      A developer wants to store the card verification code, encrypted, for three days "so that refunds are easier". What does PCI SSC's FAQ 1533 say?
    options:
      - id: never
        text: "Sensitive authentication data must not be stored after authorisation, even if encrypted - and that holds even when no PAN is stored with it."
        feedback: "Correct. That is the FAQ's reading of the standard's applicability information; refunds do not need the code."
      - id: encrypted-ok
        text: "Encrypted storage for a few days is allowed."
        feedback: "The FAQ says 'even if encrypted'."
      - id: no-pan
        text: "It is allowed as long as the PAN is stored somewhere else."
        feedback: "The FAQ explains that storing it separately is still a risk - criminals correlate it with other stolen data by email address."
      - id: token
        text: "It is allowed if it is stored next to a token instead of a PAN."
        feedback: "The FAQ warns about exactly that: a code stored beside a payable token misrepresents to the issuer that the cardholder supplied it."
    correct: [never]
    hints:
      - The FAQ's answer does not depend on whether a PAN is present.
    solution: |
      Not after authorisation, even encrypted, with or without a PAN. Card-on-file and recurring payments do not need the code.

  - id: spay-log-line
    type: mcq
    concept: sec-pan-handling
    skill: application
    title: Which log line is acceptable?
    prompt: |
      Support needs to find a payment in the logs. Which line shape is acceptable under the OWASP Logging Cheat Sheet and this lesson's house rule?
    options:
      - id: masked-token
        text: "`authorize merchant=m_100 payment=pay_81 card=406591******3760 token=tok_c459...`"
        feedback: "Correct. A masked form (at most the first six and last four, at least four hidden) plus identifiers is enough to find the payment, and the number is not recoverable."
      - id: debug
        text: "The full body of the request, but only while a debug flag is on."
        feedback: "Debug flags get left on, and the sheet lists payment card holder data among what should not be logged."
      - id: base64
        text: "The card number base64-encoded."
        feedback: "Encoding is not protection; anyone can decode it, and a scanner for digits will not even see it."
      - id: spaces
        text: "The full number written in groups of four."
        feedback: "Grouping changes the layout, not the exposure."
    correct: [masked-token]
    hints:
      - What does support actually need in order to find one payment?
    solution: |
      Masked form plus identifiers. OWASP: card holder data should be removed, masked, sanitized, hashed or encrypted before it reaches a log.

  - id: spay-luhn-candidate
    type: mcq
    concept: sec-pan-handling
    skill: analysis
    title: A Luhn-valid ticket number
    prompt: |
      Your scanner reports a 16-digit number that passes the Luhn check in a support ticket. The ticket system also issues 16-digit ticket numbers. What is the right conclusion?
    options:
      - id: candidate
        text: "It is a candidate: about one random 16-digit run in ten passes Luhn, so look at the context and the number's source before deciding, and treat it as a card until you have."
        feedback: "Correct. The measured rate here was 10.0%; a scanner finds candidates, not proof."
      - id: card
        text: "It is a real card number, because only cards pass Luhn."
        feedback: "Many numbers pass; Luhn is a typo check."
      - id: noise
        text: "It is noise, because the ticket system also makes 16-digit numbers."
        feedback: "Dismissing without a look is how real leaks stay in place."
      - id: encrypted
        text: "It must be encrypted already, because it appears in a ticket."
        feedback: "Nothing about where it appears says it is protected."
    correct: [candidate]
    hints:
      - How often does a random run pass the check?
    solution: |
      A candidate to be decided from context. A scanner can over-report; redaction is safe to over-apply, but a verdict needs a look.

  - id: spay-token-scope
    type: mcq
    concept: sec-token-testing
    skill: application
    title: Merchant B charges merchant A's token
    prompt: |
      In a test, merchant `m_200` sends a charge with a token that merchant `m_100` created, and the gateway answers 200. What is this?
    options:
      - id: access
        text: "A broken access control on a payment credential: a token should only work for the merchant it was issued to, and the expected answer is 403 or 404."
        feedback: "Correct. It is the object-level authorisation flaw of an IDOR, with a card behind the object id."
      - id: fine
        text: "Normal behaviour - tokens are shared between merchants."
        feedback: "A token that any merchant can use is a bearer credential for someone else's card."
      - id: pci
        text: "Only a PCI paperwork issue, not a security flaw."
        feedback: "It is a functional security flaw: money moves from a card the second merchant has no right to charge."
      - id: rate
        text: "A rate-limit problem."
        feedback: "Rate limits are a different control; this is about who may use the token."
    correct: [access]
    hints:
      - Which account should be able to use a token?
    solution: |
      Broken access control on the token. The merchant that did not create it must be refused (403 or 404).

  - id: spay-token-pattern
    type: mcq
    concept: sec-token-testing
    skill: analysis
    title: tok_0001, tok_0002, tok_0003
    prompt: |
      Three tokens created one after another are `tok_0001`, `tok_0002` and `tok_0003`. What is the problem, and what makes it worse?
    options:
      - id: sequence
        text: "They are guessable - anyone can enumerate the others - and it becomes a payment risk when combined with a missing merchant check, because a guessed token is then usable."
        feedback: "Correct. Each flaw is a finding; together they let a stranger charge cards by counting."
      - id: short
        text: "They are only too short, and a longer counter would be fine."
        feedback: "Length helps, but a counter is still predictable."
      - id: fine
        text: "Nothing, as long as the vault is behind a firewall."
        feedback: "The tokens are handed to clients; their predictability is the issue."
      - id: card
        text: "They contain card digits."
        feedback: "They do not - the problem is the pattern, not the content."
    correct: [sequence]
    hints:
      - What does an attacker do with a counter?
    solution: |
      A counter is predictable, so the token space can be walked; with no merchant check that is a charge on someone else's card.

  - id: spay-format-token
    type: mcq
    concept: sec-token-testing
    skill: analysis
    title: A token that looks like a card
    prompt: |
      A vendor's tokens keep the first six and last four digits of the card, replace the middle with generated digits and pass the Luhn check. The scanner flags them all.
      What does PCI SSC's FAQ 1117 imply, and what do you do?
    options:
      - id: assessor
        text: "Whether such values are out of scope depends on the implementation and is for an assessor to decide; the tokenisation and key-management systems stay in scope. Agree a scanner allow-list for the format with the owner and record why."
        feedback: "Correct. The FAQ lists reversibility, shared keys and shared environments as signs the values are in scope."
      - id: out
        text: "They are always out of scope, so ignore the scanner."
        feedback: "The FAQ says it 'can only be determined ... by an Assessor'."
      - id: in
        text: "They are always card data, so remove the feature."
        feedback: "The FAQ does not say that; it says the answer depends on the implementation."
      - id: hide
        text: "Switch the scanner off for that system."
        feedback: "That also hides real leaks; use a narrow, recorded allow-list instead."
    correct: [assessor]
    hints:
      - Who decides scope for a format-preserving value?
    solution: |
      The assessor decides scope; the systems doing the tokenisation and key management stay in scope. Allow-list the format narrowly and record the reason.

  - id: spay-card-testing-signs
    type: mcq
    concept: sec-card-testing
    skill: recognition
    title: Which pattern is card testing?
    prompt: |
      Which pattern in a merchant's authorisation events most suggests card testing (OWASP OAT-001)?
    options:
      - id: many-cards
        text: "One client trying many different cards in a short time, mostly declined, often for small amounts."
        feedback: "Correct. That matches OWASP's description and Stripe's list of symptoms (a spike in declines, many low-value attempts)."
      - id: one-card
        text: "One client retrying one card thirty times."
        feedback: "That is a retry loop or a stuck client, not enumeration of many cards."
      - id: busy
        text: "A large merchant making hundreds of approved payments a minute."
        feedback: "Busy and honest: high volume, high approval, few cards per customer."
      - id: slow
        text: "A customer making two attempts an hour apart."
        feedback: "Normal behaviour."
    correct: [many-cards]
    hints:
      - Which of them tests many different numbers?
    solution: |
      Many different cards, short time, mostly declined, often small - the shape the window rule looks for.

  - id: spay-single-signal
    type: mcq
    concept: sec-card-testing
    skill: analysis
    title: "Just block the address"
    prompt: |
      A teammate proposes to stop card testing by blocking any address after five declines. What is the strongest objection?
    options:
      - id: both
        text: "Attackers rotate addresses so the rule is easy to evade (Stripe: single-heuristic filters such as IP address 'are usually not sufficient'), and honest customers behind one shared address get blocked too - as the practice gateway shows."
        feedback: "Correct. Keep the limit, and add per-card and per-merchant signals and review of what it blocks."
      - id: nothing
        text: "None - it is the standard fix."
        feedback: "It is a useful layer, not a fix."
      - id: slow
        text: "It makes the site slower for everyone."
        feedback: "A counter is cheap; that is not the issue."
      - id: illegal
        text: "Blocking addresses is not allowed."
        feedback: "Nothing prevents it; the problem is how little it covers and who it hurts."
    correct: [both]
    hints:
      - Who else shares an office or a mobile network address?
    solution: |
      It is easy to evade and it blocks honest users behind a shared address. Layer it with per-card and per-merchant signals and review.

  - id: spay-ethics
    type: mcq
    concept: sec-card-testing
    skill: application
    title: Testing the detection with real cards
    prompt: |
      You have written permission to test SandPay's staging gateway. A colleague offers a list of old real card numbers "to see whether the detection really fires". What do you do?
    options:
      - id: synthetic
        text: "Decline. Use synthetic Luhn-valid numbers or the provider's published sandbox test cards, in scope and in staging, because running real numbers is the attack itself."
        feedback: "Correct. Detection is tested with test numbers; real card data spreads into logs and is a crime to use without authority."
      - id: use
        text: "Use them, since you have permission for staging."
        feedback: "Permission for a system is not permission to use other people's card numbers."
      - id: own
        text: "Use only your own real card, in small amounts."
        feedback: "It still puts a real number into logs and the issuer's records."
      - id: prod
        text: "Run them against production, where detection is real."
        feedback: "Out of scope, and the same attack."
    correct: [synthetic]
    hints:
      - What does the lesson say about real card numbers in tests?
    solution: |
      Use synthetic or sandbox numbers only; never real or stolen ones.

  - id: spay-report-steps
    type: order
    concept: sec-pan-handling
    skill: application
    title: Reporting a card number in a log
    prompt: Put the steps of handling a full card number found in a log in a sensible order.
    items:
      - id: confirm
        text: Confirm it with a synthetic control card, not a real one
      - id: evidence
        text: Record file, lines and the masked form - never the digits
      - id: report
        text: Send the finding through the owner's agreed channel
      - id: fix
        text: The owner stops the logging and purges logs, backups and copies
      - id: retest
        text: Re-run the audit against the fixed build
      - id: keep
        text: Keep the audit as a regression test
    hints:
      - Evidence is captured before it is sent, and the re-test comes after the fix.
      - The tester reports; the owner stops the logging and purges.
    solution: |
      Confirm with a control, record masked evidence, report by the agreed channel, the owner fixes and purges, re-test with the audit, keep it as a regression test.

  - id: spay-redact-debug
    type: debug
    concept: sec-pan-handling
    skill: analysis
    title: Which line lets some card numbers through?
    prompt: |
      This function should hide every card number in a log line, yet a card number written in groups separated by hyphens comes out untouched. Pick the line that is wrong.
    language: python
    code: |
      import re

      def redact(text):
          out = text
          for run in re.findall(r"[0-9]{13,19}", text):
              out = out.replace(run, run[:6] + "******" + run[-4:])
          return out
    correctLines: [5]
    hints:
      - What does the pattern `[0-9]{13,19}` say about hyphens and spaces?
      - Which lines in the lesson's scanner handle separators?
    lineNotes:
      - line: 4
        note: Starting from the original text is fine.
      - line: 6
        note: The replacement keeps six and four digits, which is acceptable; the trouble is which runs reach it.
    solution: |
      Line 5 only matches an unbroken run of digits, so a number written in groups with hyphens or spaces is never found. Allow one optional separator after each digit (`(?:[0-9][ -]?){12,18}[0-9]`), remove the separators before the check, and add the Luhn test so ids are not over-redacted.

  - id: spay-luhn-short
    type: short
    concept: sec-pan-handling
    skill: analysis
    title: Why a Luhn hit is not a verdict
    prompt: |
      In two or three sentences, explain why a Luhn-valid number found in a log is a candidate and not proof of a leak, and why you still treat it as a leak until it is decided.
    modelAnswer: |
      Luhn is a check digit that catches typing mistakes; about one random 16-digit run in ten passes it, so order ids, ticket numbers and tokens can look like cards. A hit is therefore a candidate to be decided from context, source and format. Until it is, it is handled as a leak - masked in evidence and reported - because a real card number in a log is costly and a false alarm is cheap.
    rubric:
      - Says Luhn is a typo check and many non-card numbers pass it.
      - Says the hit needs context or source before a verdict.
      - Says it is treated as a leak until decided, because missing a real one costs more.
    hints:
      - How often does a random 16-digit number pass?
    solution: Luhn is only a check digit, so hits are candidates; treat them as leaks until context says otherwise.

  - id: spay-testdesign
    type: testdesign
    concept: sec-token-testing
    skill: application
    title: Tests for a new saved-card feature
    prompt: |
      SandPay adds "save my card" using tokens. Design the security tests for it - preconditions, steps, expected result and evidence for each check.
    modelAnswer: |
      Preconditions: written permission and scope, a non-production environment, synthetic or sandbox test cards, two merchant accounts, access to captured logs and an export.

      1. **Response** - save a card and read the response. Expected: a token, brand and last four only. Evidence: the masked body.
      2. **Logs** - scan the logs of that call. Expected: no Luhn-valid run except an allow-listed token format. Evidence: the scan result.
      3. **Stored record** - export the stored record. Expected: no readable PAN and no verification code. Evidence: the key list.
      4. **Token pattern** - create several tokens. Expected: random, long, not sequential, not derived from the card. Evidence: shortened token shapes.
      5. **Token scope** - charge merchant A's token as merchant B. Expected: 403 or 404. Evidence: the status.
      6. **Receipts and emails** - open them. Expected: at most first six and last four, at least four hidden. Evidence: the exposed-digit count.
      7. **Card-on-file code** - make a later payment with the token. Expected: no verification code requested or stored. Evidence: the request and record.
      8. **Velocity** - send declined attempts to the setup endpoint as one client. Expected: limited within a few attempts, with documented side effects. Evidence: the attempt number and statuses.
      9. **Evidence hygiene** - scan the report. Expected: no card-like digits. Evidence: the scan.
      10. **Negative control** - repeat everything against the fixed build. Expected: no findings. Evidence: empty reports.
    rubric:
      - Starts with permission, synthetic or sandbox cards and two merchant accounts.
      - Covers response, logs, stored record, receipts and the verification code.
      - Tests token pattern and merchant scope from the other account.
      - Covers velocity limits and their side effects, and runs a negative control.
      - Every case has preconditions, steps, an expected result and evidence.
    hints:
      - Think of every place a card number or a token could appear.
    solution: Cover the five surfaces, token pattern and scope from a second merchant, velocity limits, evidence hygiene and a negative control.

  - id: spay-interview
    type: interview
    concept: sec-pan-handling
    skill: analysis
    title: 'Interview: "your scanner found 40 card numbers in our logs, but they are all order ids"'
    prompt: '"Your scan flagged 40 card-like numbers in last week''s staging logs. The team says they are all order ids and wants to close it. What do you do?"'
    modelAnswer: |
      I would not close it on a statement. First I explain what the scan found: Luhn-valid runs of 13 to 19 digits, which are candidates - about one random 16-digit run in ten passes the check, so some order ids would be flagged. Then I decide them rather than argue: group the hits by log line template and field name, check whether the order id format is documented and whether the flagged values match it, look at the leading digits and length against known card ranges, and ask the owner for the id generator's rules. I do this with masked forms only; I never paste the numbers into the ticket.

      For each group the outcome is one of: an id (add a narrow allow-list for that field with a written reason), a token in a card-shaped format (same, and note that scope is for an assessor), or a card (a finding: stop the logging, purge logs and backups, re-test). If a group is still undecided I keep it open. I also check the other surfaces, because an id-heavy log does not tell me about responses or exports, and I add the scan to CI so the allow-list is tested.
    rubric:
      - Treats hits as candidates and explains the Luhn false-positive rate.
      - Decides hits by pattern, field and id rules, using masked forms only.
      - Allow-lists narrowly with a recorded reason and treats real cards as a finding.
      - Does not close on assertion, and checks other surfaces and CI.
    followUps:
      - What would make you believe one group is real cards?
      - How would you keep the allow-list from hiding a real leak later?
      - What if the order ids are generated from the card number?
    hints:
      - What is the difference between a candidate and a verdict?
    solution: Treat hits as candidates, decide them by field and format with masked evidence, allow-list narrowly, treat real cards as a finding and automate the scan.

  - id: spay-detect-code
    type: coding
    concept: sec-pan-handling
    skill: application
    title: Find and mask card numbers
    prompt: |
      In `practice/security/exercises/specialised/spay_detect.py`, implement `luhn_valid`, `mask_pan`, `find_pans` and `redact`. The tests build their numbers when they
      run (no card number is written in any file), find grouped numbers, ignore ids that fail Luhn, ignore runs longer than 19 digits, and check that nothing a hit holds
      or `redact` returns still contains the number.
    project: security
    files: [exercises/specialised/spay_detect.py]
    test: tests/specialised/test_spay_detect.py
    command: .venv/bin/python -m pytest tests/specialised/test_spay_detect.py
    modelAnswer: |
      ```python
      def luhn_valid(digits):
          if len(digits) < 2 or not digits.isdigit():
              return False
          total = 0
          for index, ch in enumerate(reversed(digits)):
              d = int(ch)
              if index % 2 == 1:
                  d = d * 2 - 9 if d * 2 > 9 else d * 2
              total += d
          return total % 10 == 0

      def mask_pan(digits):
          hidden = max(4, len(digits) - 10)
          return digits[:6] + "*" * hidden + digits[6 + hidden:]
      ```

      `find_pans` runs `CANDIDATE.finditer`, strips separators, keeps the matches that pass `luhn_valid` and builds a `PanHit` with `mask_pan`; `redact` copies the text between hits and puts each `masked` value where the match was.
    rubric:
      - Every test in tests/specialised/test_spay_detect.py passes.
      - Luhn doubles every second digit counting from the right and returns False for non-digits and very short input.
      - Masks keep at most the first six and last four and always hide at least four digits.
      - Grouped numbers are found with their original span; ids that fail Luhn and runs longer than 19 digits are not.
      - No hit and no redacted text still holds the number.
    hints:
      - Parity of the doubled digits is counted from the right, not from the left.
      - The hit holds a span and a masked string, not the digits.
      - For a 13-digit number `max(4, len - 10)` hides four and keeps three at the end.
    solution: Luhn from the right, mask with at least four hidden, match with the given pattern after stripping separators, keep Luhn-valid matches, and replace spans in order.

  - id: spay-audit-code
    type: coding
    concept: sec-token-testing
    skill: application
    title: Audit a gateway - card data and tokens
    prompt: |
      In `practice/security/exercises/specialised/spay_audit.py`, implement `exposed_digits`, `audit_card_data` and `audit_tokens`. The tests find each flaw alone (every other flaw fixed),
      expect the whole list on the default gateway and an empty list on a fully fixed one, expect an error when the audit card is declined, and check that no finding holds a number.
    project: security
    files: [exercises/specialised/spay_audit.py]
    test: tests/specialised/test_spay_audit.py
    command: .venv/bin/python -m pytest tests/specialised/test_spay_audit.py
    modelAnswer: |
      ```python
      def exposed_digits(text, pan):
          best = 0
          for token in re.findall(r"[0-9*]{%d}" % len(pan), SEPARATORS.sub("", text)):
              best = max(best, sum(1 for shown, real in zip(token, pan) if shown == real))
          return best
      ```

      `audit_card_data` authorises once with `test_cards[0]` (raising `RuntimeError` on a non-200), then checks the response text, every log line, every exported record (the number, and a key or value that is the code) and the receipt's `exposed_digits`, adding one code for each, and returns `sorted(found)`. `audit_tokens` tokenises three cards as merchant A, flags a short or consecutive-integer token suffix, and flags a 200 when merchant B charges the first token.
    rubric:
      - Every test in tests/specialised/test_spay_audit.py passes.
      - Each flaw is reported alone when it is the only one unfixed, and a fully fixed gateway reports nothing.
      - Spaces and hyphens are ignored when looking for the number; a declined audit card raises RuntimeError.
      - exposed_digits counts only digits equal to the PAN's digit at the same position in a run of digits and asterisks.
      - A finding is a code and never contains the number.
    hints:
      - Remove spaces and hyphens before looking for the number.
      - Count positions, not occurrences, in `exposed_digits`.
      - A cross-merchant charge succeeds when the status is exactly 200.
    solution: Look at each surface for the number, check the exported records for a code, count exposed digits on the receipt, and test token pattern and scope from a second merchant.

  - id: spay-velocity-code
    type: coding
    concept: sec-card-testing
    skill: application
    title: Detect card testing and probe a velocity limit
    prompt: |
      In `practice/security/exercises/specialised/spay_velocity.py`, implement `detect_card_testing` and `probe_velocity_limit`. The tests check a fast tester, ordinary shoppers, a busy honest
      merchant, a slow tester (missed by a short window, found by a longer one), the half-open window, each condition on its own, and the probe against a gateway with and without a limit.
    project: security
    files: [exercises/specialised/spay_velocity.py]
    test: tests/specialised/test_spay_velocity.py
    command: .venv/bin/python -m pytest tests/specialised/test_spay_velocity.py
    modelAnswer: |
      ```python
      for i, first in enumerate(items):
          window = [e for e in items[i:] if e["t"] < first["t"] + window_s]
          cards = len({e["card"] for e in window})
          declines = sum(1 for e in window if e["outcome"] == "declined")
          if len(window) >= min_attempts and cards >= min_cards and declines / len(window) >= min_decline_ratio:
              suspects.append(Suspect(client, first["t"], len(window), cards, declines))
              break
      ```

      Group the events by client, sort each group by `t` (without changing the caller's list), return the suspects sorted by client, and raise `ValueError` for a bad window or minimum. The probe sends declined authorisations with a changing 16-digit number, returns the 1-based attempt that first gets 429, returns `None` when none does, and raises `RuntimeError` on an approval or any other status.
    rubric:
      - Every test in tests/specialised/test_spay_velocity.py passes.
      - The window starts at each event and is half-open; a suspect needs enough attempts, enough different cards and enough declines.
      - One Suspect per client with the first qualifying window's numbers, sorted by client; the input is not modified.
      - The probe returns the attempt number of the first 429 or None, and fails loudly on an approval or an odd status.
    hints:
      - Sort a copy of each client's events.
      - Use the start event's time plus the window length as an exclusive limit.
      - A tripped limit is a number; no limit is None.
    solution: Slide a half-open window per client, require attempts, distinct cards and decline ratio, report the first qualifying window, and have the probe return the first 429 attempt number or None.

placement:
  - id: place-pan
    type: mcq
    concept: sec-pan-handling
    skill: analysis
    title: What do you check first?
    prompt: |
      A new endpoint returns a payment object. The page shows only the last four digits. Where else must you look before saying the card number is protected?
    options:
      - id: surfaces
        text: "The other places a number can appear - the full response body, log lines, stored records and exports, receipts and emails - because a clean screen says nothing about them, and the verification code must not be stored at all."
        feedback: "Correct. Each surface is a separate code path with its own rule."
      - id: nothing
        text: "Nowhere - the page is what users see."
        feedback: "Logs and exports are not shown to users and are where card data usually leaks."
      - id: tls
        text: "Only check that the connection uses HTTPS."
        feedback: "Transport encryption does not stop a number being logged or stored."
      - id: password
        text: "Only check the admin password."
        feedback: "Unrelated to where card data is written."
    correct: [surfaces]
    solution: Check every surface - response, log, stored record, receipt and screens - and make sure no verification code is stored.

  - id: place-token
    type: mcq
    concept: sec-token-testing
    skill: application
    title: Is this token safe to hand out?
    prompt: |
      Which two quick tests give the most information about a new card token?
    options:
      - id: pattern-scope
        text: "Create several tokens and look for a pattern, then charge one from a different merchant's account and expect a refusal."
        feedback: "Correct. Predictability and scope are cheap to test and decide whether the token is a credential for someone else's card."
      - id: length
        text: "Count the characters and check it starts with `tok_`."
        feedback: "A prefix and length say nothing about predictability or who may use it."
      - id: decode
        text: "Base64-decode it."
        feedback: "A random token does not decode to anything; this tests nothing useful."
      - id: owner
        text: "Charge it from the owner's account and check it works."
        feedback: "That proves the happy path; the flaw lives in the other account."
    correct: [pattern-scope]
    solution: Look for a pattern across several tokens and test scope from a second merchant.

  - id: place-abuse
    type: mcq
    concept: sec-card-testing
    skill: application
    title: Spot the card tester
    prompt: |
      Which client is most likely card testing?
    options:
      - id: tester
        text: "A client with 30 attempts in a minute on 30 different cards, 27 declined, all for small amounts."
        feedback: "Correct. Many cards, short time, mostly declined, small."
      - id: busy
        text: "A client with 120 approved payments a minute on three cards."
        feedback: "High volume, all approved, few cards - a busy merchant."
      - id: retry
        text: "A client that retried one declined card 30 times."
        feedback: "One card repeatedly is a retry loop."
      - id: normal
        text: "A client with two attempts an hour apart."
        feedback: "Normal behaviour."
    correct: [tester]
    solution: Many different cards in a short time, mostly declined, usually small.

recall:
  - id: recall-mask-trunc
    concept: sec-pan-handling
    prompt: What is the difference between masking and truncation, and which requirement does each map to in FAQ 1146?
    answer: Masking conceals part of a PAN when it is displayed or printed (3.4.1) and the full number may still be stored; truncation permanently removes part of a stored PAN so it cannot be retrieved (one of the options for 3.5.1).
  - id: recall-sad
    concept: sec-pan-handling
    prompt: What is sensitive authentication data and what is the rule for it?
    answer: The card verification code and the PIN or PIN block. It must not be stored after authorisation, even if encrypted, and that holds even with no PAN present (FAQ 1533). Card-on-file and recurring payments do not need the code.
  - id: recall-truncation
    concept: sec-pan-handling
    prompt: How many digits of a PAN may be kept after truncation, according to FAQ 1091?
    answer: A maximum of the first 6 and last 4 is the starting baseline; the brand table allows more for some lengths (for example first 8 and any other 4 for a 16-digit number, with at least 4 removed). Different truncation formats of one PAN together can rebuild it.
  - id: recall-luhn
    concept: sec-pan-handling
    prompt: How does the Luhn check work, and what is it good for?
    answer: From the right, double every second digit (subtract 9 above 9), add all digits; valid when the total is a multiple of 10. It catches typing mistakes. About one random 16-digit run in ten passes, so a scanner's hits are candidates.
  - id: recall-token
    concept: sec-token-testing
    prompt: Name the four properties of a safe token and the test for scope.
    answer: Unpredictable, not derived from the card, scoped to the merchant that created it, and minimal when shown. Test scope by charging merchant A's token as merchant B - expect 403 or 404.
  - id: recall-format-token
    concept: sec-token-testing
    prompt: What changes when a token keeps the BIN and last four and passes Luhn?
    answer: Card scanners will flag it, and whether it is out of scope depends on the implementation and is for an assessor (FAQ 1117); the systems that tokenise and manage keys stay in scope. Agree a narrow scanner allow-list with a recorded reason.
  - id: recall-card-testing
    concept: sec-card-testing
    prompt: What does card testing look like, and what are the limits of a velocity rule?
    answer: One client, many different cards, a short time, mostly declined, often small (OWASP OAT-001, OAT-010). A per-client limit blocks honest users behind a shared address and misses slow or distributed testers; combine per-client, per-card and per-merchant signals.

