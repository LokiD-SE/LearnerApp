environment: |
  - **Runtime:** Python 3.12.3 in `practice/security/.venv` with pytest 9.2.0 and requests 2.34.2. Every
    output in this lesson was printed by the code shown, run on Linux on 19 November 2026 against
    `support/sandpay_vuln.py` on `127.0.0.1:8765`. In the stack traces shown, the checkout folder is
    shortened to `~/LearnerApp`; nothing else is changed. The 8-character error reference in the fixed
    portal's answer is random, so yours will differ.
  - **The target is deliberately vulnerable and local:** the SandPay Merchant Portal is fictional, binds to the
    loopback interface only and refuses any other address. Every merchant, password and key in it is synthetic
    (`sandpay-practice-only-jwt-key` protects nothing). The code run is the reference solutions of this
    lesson's exercises in `practice/security/solutions/foundations/` (`fund_scope.py`, `fund_risk.py`,
    `fund_probe.py`).
  - **Standards and guides, as documented on 19 November 2026:**
    - OWASP [Web Security Testing Guide](https://owasp.org/www-project-web-security-testing-guide/) (WSTG):
      the latest release is v4.2 (December 2020); the quotations from "2. Introduction", "3. The OWASP
      Testing Framework" and [WSTG-ERRH-01 Improper Error
      Handling](https://github.com/OWASP/wstg/blob/master/document/4-Web_Application_Security_Testing/08-Error_Handling/01-Improper_Error_Handling.md)
      are from the development version on the project's
      [GitHub `master` branch](https://github.com/OWASP/wstg), which will become the next release. Section
      numbers and ids can change between versions; the guide itself recommends versioned ids such as
      `WSTG-v42-INFO-02`.
    - OWASP [Risk Rating
      Methodology](https://owasp.org/www-community/OWASP_Risk_Rating_Methodology) (Jeff Williams) - factor
      options, the "Repeatable Method", the worked example and the severity table. The page itself carries a
      disclaimer that other, more established methodologies exist (it names NIST SP 800-30).
    - NIST [SP 800-115](https://csrc.nist.gov/pubs/sp/800/115/final), _Technical Guide to Information Security
      Testing and Assessment_ (September 2008) - definitions of penetration testing, vulnerability scanning,
      overt and covert testing, white, black and grey box, the four penetration testing phases and the Rules of
      Engagement template (Appendix B). It is old, but it is still the NIST publication on the topic, and the
      WSTG lists it among penetration testing methodologies (Appendix G).
    - NIST [FIPS 199](https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.199.pdf) - the definitions of
      confidentiality, integrity and availability (from 44 U.S.C. Sec. 3542). The NIST CSRC glossary entries
      for [threat](https://csrc.nist.gov/glossary/term/threat), [risk](https://csrc.nist.gov/glossary/term/risk)
      and [red team](https://csrc.nist.gov/glossary/term/red_team).
  - **Not defined by those sources:** "IAST" (interactive application security testing) is an industry term;
    none of the sources above defines it, so the lesson describes it in one plain sentence and does not quote
    anyone. Tools named here (ZAP, Burp Suite, Semgrep and others) are not installed and are not run; they
    appear only as the WSTG names them.
  - **Law:** unauthorised access to computer systems is a crime in many countries; the lesson names two
    well-known laws only as examples. This is not legal advice - an engagement's authorisation is agreed with
    the system owner, and in a company usually with its legal team.
  - **Not repeated here:** what the OWASP Top 10 risks are and how developers prevent them - [OWASP Top 10
    for developers](#/lesson/owasp-top-10-for-developers); risk-based test prioritisation in general -
    [Risk-based testing](#/lesson/risk-based-testing).

prerequisites:
  - risk-based-testing
  - client-server-request-flow
  - status-codes-and-errors

concepts:
  - id: sec-fund-cia-risk
    name: CIA, vulnerability, threat and risk
    summary: Security protects confidentiality (authorised restrictions on access and disclosure), integrity (no improper modification or destruction) and availability (timely, reliable access). A vulnerability is a weakness that a threat source could exploit; a threat is a circumstance or event that could cause harm; risk combines how likely the harm is with how bad it would be. The OWASP Risk Rating Methodology averages 0-9 factor scores into likelihood and impact, maps each to LOW (<3), MEDIUM (3 to <6) or HIGH (6-9) and reads the severity from a 3x3 table - using business impact when you have it.
  - id: sec-fund-testing-kinds
    name: The kinds of security testing
    summary: Vulnerability scanning matches what it finds against known weaknesses; SAST reads source code; secret scanning looks for committed credentials; SCA checks dependencies; DAST attacks the running application; IAST instruments it while tests run; a penetration test mimics real attacks to prove what can be exploited and chained; a red team emulates an adversary to test the defenders; a bug bounty invites outside researchers. White box uses the source, black box only the running system, grey box both. Overt testing happens with the staff's knowledge, covert without. Functional testing asks whether the system does what it should; security testing also asks what else it lets someone do.
  - id: sec-fund-authorisation-scope
    name: Authorisation, scope and evidence
    summary: Security testing is only legitimate with written permission from someone entitled to give it, and only inside an agreed scope - hosts, ports, paths, methods, accounts, times and techniques - set out before testing starts in Rules of Engagement. A scope gate runs before every request, including redirects. Evidence records what was sent and what came back so a finding can be reproduced, and it is redacted - a report that copies a leaked secret spreads the leak.

objectives:
  - Explain confidentiality, integrity and availability with the FIPS 199 definitions, and classify a SandPay incident by the property it breaks.
  - Distinguish a vulnerability, a threat and a risk, and rate a finding with the OWASP Risk Rating Methodology, choosing business or technical impact.
  - Choose between vulnerability scanning, SAST, SCA, DAST, penetration testing, red teaming and bug bounties for a stated goal, and say whether a test is black, grey or white box.
  - State what written authorisation and Rules of Engagement must settle before a test, and refuse out-of-scope requests in code before they are sent.
  - Write a probe for improper error handling (WSTG-ERRH-01) that records redacted evidence and reports nothing once the flaw is fixed.

sections:
  - id: intuition
    kind: intuition
    concepts: [sec-fund-cia-risk, sec-fund-testing-kinds, sec-fund-authorisation-scope]
    title: The idea in plain language
    body: |
      A functional tester checks that the door of a shop opens with the right key and stays shut with the wrong
      one. A security tester asks different questions. Does the door open if you lift it off its hinges? Does
      the shop window show the safe's combination on a sticky note? Does the alarm notice someone trying a
      thousand keys?

      Those questions are only fair to ask about **your own shop, or a shop whose owner asked you to**, in
      writing, and only about the doors they named. A locksmith who "tests" a neighbour's lock at night is a
      burglar, however good their intentions. In software that permission has a name - authorisation - and the
      list of doors is the **scope**.

      This lesson's shop is the SandPay Merchant Portal in `practice/security/support/sandpay_vuln.py`. It is
      deliberately vulnerable, it runs only on your own machine, and you have permission to test it - that is
      the whole point of it. Ask it for a page that fails:

      ```plaintext
      GET http://127.0.0.1:8765/boom

      500 text/plain SandPayPortal/0.9 Python/3.12
      Traceback (most recent call last):
        ...
      RuntimeError: settlement batch failed; db=sqlite:///var/sandpay/portal.db key=sandpay-practice-only-jwt-key
      ```

      No functional test would call that a failure: an internal error produced a 500, as it should. A security
      tester sees the database path, the software versions and a signing key handed to anybody who asks. That
      is a **vulnerability**. Someone on the internet who would use the key is a **threat**. How likely that is,
      and how much harm it would do, is the **risk**. By the end of this lesson you will have found that leak
      with your own probe, rated it, and proved that the probe stays silent once the portal is fixed.

  - id: what
    kind: what
    concepts: [sec-fund-cia-risk, sec-fund-testing-kinds, sec-fund-authorisation-scope]
    title: Terms you need
    body: |
      **What security protects - the CIA triad** (FIPS 199, quoting 44 U.S.C. Sec. 3542):

      | Property | Definition | A loss of it is... | SandPay example |
      | --- | --- | --- | --- |
      | **Confidentiality** | "Preserving authorized restrictions on information access and disclosure, including means for protecting personal privacy and proprietary information" | "the unauthorized disclosure of information" | the error page shows the signing key |
      | **Integrity** | "Guarding against improper information modification or destruction, and includes ensuring information non-repudiation and authenticity" | "the unauthorized modification or destruction of information" | a merchant changes their own role to `admin` |
      | **Availability** | "Ensuring timely and reliable access to and use of information" | "the disruption of access to or use of information or an information system" | unlimited login attempts lock everyone out or overload the portal |

      **Weakness, threat, risk** (NIST definitions):

      | Term | Definition | Example |
      | --- | --- | --- |
      | **Vulnerability** | "Weakness in an information system, or in system security procedures, internal controls, or implementation, that could be exploited or triggered by a threat source." (SP 800-115) | unhandled exceptions return a full stack trace |
      | **Threat** | "Any circumstance or event with the potential to adversely impact organizational operations ... organizational assets, or individuals through an information system via unauthorized access, destruction, disclosure, modification of information, and/or denial of service." (CSRC glossary, from FIPS 200) | an anonymous internet user who triggers errors on purpose |
      | **Risk** | "A measure of the extent to which an entity is threatened by a potential circumstance or event, and typically is a function of: (i) the adverse impact ... and (ii) the likelihood of occurrence." (CSRC glossary, from CNSSI 4009-2022) | how likely the key is found and used, times what forged tokens would cost SandPay |

      The OWASP Risk Rating Methodology writes the same idea as "**Risk = Likelihood \* Impact**".

      **Kinds of security testing:**

      | Kind | What it looks at | Typical moment (WSTG cadence table) |
      | --- | --- | --- |
      | **Vulnerability scanning** | hosts and their attributes, matched "with information on known vulnerabilities stored in the scanners' vulnerability databases" (SP 800-115) | scheduled |
      | **SAST** (static application security testing) | source code - tools that "scan source code for known vulnerability patterns" (WSTG) | every commit or pull request |
      | **Secret scanning** | the repository - "accidentally committed credentials" (WSTG) | every commit |
      | **SCA** (software composition analysis) | dependencies - "for known vulnerabilities" (WSTG) | every commit |
      | **DAST** (dynamic application security testing) | the running application - tools that "crawl and fuzz the application" (WSTG) | staging, on a schedule |
      | **IAST** (interactive) | the running application from inside: an agent instruments it and reports flaws while other tests exercise it | while functional tests run |
      | **Penetration test** | the running system, by people: "assessors mimic real-world attacks to identify methods for circumventing the security features" (SP 800-115) | release schedule or on demand |
      | **Red team** | the whole organisation, defenders included - "authorized and organized to emulate a potential adversary's attack or exploitation capabilities" (CSRC glossary) | occasional exercises |
      | **Bug bounty** | anything in the programme's published scope, by outside researchers | continuous |

      **How much the tester knows** (SP 800-115, section 7): **white box** techniques "involve direct analysis
      of the application's source code"; **black box** techniques are "performed against the application's
      binary executable without source code knowledge"; using both "is known as gray box testing". **Overt**
      testing is "performed with the knowledge and consent of the organization's IT staff"; **covert** testing
      is performed "without the knowledge of the organization's IT staff".

      **Permission:** **Rules of Engagement (ROE)** - "Detailed guidelines and constraints regarding the
      execution of information security testing. The ROE is established before the start of a security test,
      and gives the test team authority to conduct defined activities without the need for additional
      permissions." (SP 800-115). The **scope** is the part of the ROE that says which targets and actions are
      allowed; SP 800-115's template describes it as "test boundaries in terms of actions and expected
      outcomes".

  - id: why
    kind: why
    concepts: [sec-fund-testing-kinds, sec-fund-cia-risk]
    title: Why functional testing is not enough
    body: |
      Functional tests check the behaviour someone **intended**: valid input in, the right output out, a clear
      error for invalid input. Attackers use the behaviour nobody intended - the extra parameter, the other
      merchant's id, the error page, the thousandth login attempt. A suite of thousands of passing functional
      tests can coexist with every flaw in the SandPay portal, because none of those tests ever asks "what
      else does this let someone do?"

      The WSTG's principles explain what follows from that:

      - **"No Silver Bullet"** - "Automated tools (DAST, SAST, dependency scanning) are necessary and valuable,
        but they are insufficient on their own." Tools "excel at finding known, signature-based
        vulnerabilities; they do not understand business logic or context."
      - **"Continuous Security Testing"** - "testing only after development is 'complete' is wasteful and
        ineffective." A flaw "caught during design costs a fraction of one caught in production".
      - **"Risk and Impact-Based Prioritization"** - "Prioritize testing effort based on risk, not on finding
        counts. A single critical authorization bypass affecting user data is more important than dozens of
        low-risk cross-site scripting (XSS) findings."
      - **"Balanced Testing Approach"** - "No single testing technique is sufficient." Manual review, threat
        modelling, code review, penetration testing and automated scanning each find things the others miss.

      And why permission comes first: a security test does things a real attack does. SP 800-115 warns that
      "Systems may be damaged or otherwise rendered inoperable during the course of penetration testing" and
      that the risk "can never be fully eliminated". In many countries unauthorised access to a computer system
      is a criminal offence - the UK's Computer Misuse Act 1990 and the US Computer Fraud and Abuse Act are two
      well-known examples - whatever the tester meant. Good intentions are not authorisation.

  - id: internals
    kind: internals
    concepts: [sec-fund-cia-risk]
    title: From a symptom to a rated finding
    body: |
      A finding is more than "I saw something odd". It moves through four steps, and each one needs evidence.

      1. **Observe the symptom** - `GET /boom` returns 500 with a Python traceback.
      2. **Name the weakness** - improper error handling, WSTG-ERRH-01. The WSTG says it can let attackers
         "Identify filesystem paths, internal hostnames, and secrets (e.g. connection strings, API keys, or
         prompts) embedded in error output."
      3. **Name the impact** - here, loss of confidentiality: the database path, software versions and a
         signing key. A signing key can lead on to integrity loss (forged tokens), which you would only claim
         once you have shown it.
      4. **Rate the risk** - with an agreed method, so two testers give the same answer.

      **The OWASP Risk Rating Methodology, "Repeatable Method".** Each factor gets a score from 0 to 9 from the
      options the methodology lists:

      | Group | Factors (options) |
      | --- | --- |
      | Threat agent | skill level (1, 3, 5, 6, 9), motive (1, 4, 9), opportunity (0, 4, 7, 9), size (2, 4, 5, 6, 9) |
      | Vulnerability | ease of discovery (1, 3, 7, 9), ease of exploit (1, 3, 5, 9), awareness (1, 4, 6, 9), intrusion detection (1, 3, 8, 9) |
      | Technical impact | loss of confidentiality (2, 6, 7, 9), integrity (1, 3, 5, 7, 9), availability (1, 5, 7, 9), accountability (1, 7, 9) |
      | Business impact | financial damage (1, 3, 7, 9), reputation damage (1, 4, 5, 9), non-compliance (2, 5, 7), privacy violation (3, 5, 7, 9) |

      Likelihood is the average of the 8 threat-agent and vulnerability factors; impact the average of the 4
      technical or the 4 business factors. Each average becomes a level - "0 to <3" LOW, "3 to <6" MEDIUM,
      "6 to 9" HIGH - and the two levels meet in the **Overall Risk Severity** table:

      | Impact \ Likelihood | LOW | MEDIUM | HIGH |
      | --- | --- | --- | --- |
      | **HIGH** | Medium | High | Critical |
      | **MEDIUM** | Low | Medium | High |
      | **LOW** | Note | Low | Medium |

      Which impact? "if they have good business impact information, they should use that instead of the
      technical impact information. But if they have no information about the business, then technical impact
      is the next best thing." The methodology's own example shows why it matters: technical impact 7.25
      (HIGH) but business impact 2.25 (LOW), so the severity is **Low**, not High.

      One surprise when you implement it: that worked example uses values that are **not** in the option lists
      (motive 2, size 1, ease of exploit 6, intrusion detection 2). The exercise therefore accepts any whole
      number 0-9 by default and has a `strict` mode that accepts only the listed options. Agree which one your
      team uses - that is exactly the kind of "customizing" the methodology asks for in its Step 6.

  - id: when
    kind: when
    concepts: [sec-fund-testing-kinds, sec-fund-authorisation-scope]
    title: Which kind of testing, when - and when not to test at all
    body: |
      The WSTG describes testing activities that recur on a cadence rather than one fixed sequence:

      | Activity | Typical cadence | Typical owner |
      | --- | --- | --- |
      | Requirements and policy review | triggered (new feature, regulatory change) | product manager + security |
      | Design, architecture and threat modelling | triggered (architecture change, new user story) | architects + security + developers |
      | Code review, SAST, SCA, secret scanning | continuous (every commit or PR) | developers + automated tooling |
      | DAST and penetration testing | scheduled + triggered (release schedule, on demand) | internal security team or third party |
      | Bug bounty programmes | continuous, always on | external researchers |
      | CI/CD pipeline security gates | continuous (every build or deployment) | developers + automated tooling |
      | Operational monitoring and periodic reassessment | continuous / scheduled | operations + security |

      Rules of thumb for choosing:

      - **You have the source and want fast feedback** - SAST, secret scanning and SCA in the pipeline (white
        box).
      - **You want to know what an outsider can reach** - DAST and a black-box penetration test.
      - **You want the most findings for the time** - grey box: test accounts, documentation and the source.
        SP 800-115 notes that white box techniques "tend to be more efficient and cost-effective for finding
        security defects in custom applications than black box techniques".
      - **You want to know whether the defenders notice** - a red team exercise, usually covert, which SP
        800-115 says "examines the organization from an adversarial perspective" but is "often time-consuming
        and costly".
      - **You want to prove a flaw is exploitable, or chained with others** - a penetration test: "Most
        penetration tests involve looking for combinations of vulnerabilities".

      **When not to test:** with no written authorisation; outside the scope or the agreed time window; against a
      third-party service your application merely calls (a payment provider, a CDN, a mail service) unless that
      party has authorised it; against production when the ROE says staging; and with a technique the ROE rules
      out (denial of service and social engineering are common exclusions). Stop and ask - a test you were not
      allowed to run is a problem even if it finds something.

  - id: visual
    kind: visual
    concepts: [sec-fund-authorisation-scope, sec-fund-testing-kinds]
    title: An engagement, with the scope gate in front of every request
    body: |
      SP 800-115 divides a penetration test into four phases - planning, discovery, attack and reporting - and
      notes that "The reporting phase occurs simultaneously with the other three phases". Planning is where
      "rules are identified, management approval is finalized and documented, and testing goals are set", and
      "No actual testing occurs in this phase." The scope gate is the planning phase's decision, enforced in
      code on every request of the later phases.

      ```mermaid
      flowchart LR
        A["Written authorisation from the system owner"] --> B["Rules of engagement and scope"]
        B --> C["Discovery"]
        C --> D{"Scope gate: host, port, path, method"}
        D -- "in scope" --> E["Send request and keep evidence"]
        D -- "out of scope" --> F["Refuse and log the decision"]
        E --> G["Attack and validate"]
        G --> C
        E --> H["Report: redacted evidence and risk rating"]
        G --> H
        H --> I["Retest after the fix"]
      ```

      Notice two loops. Discovery and attack feed each other (SP 800-115 draws an "Additional Discovery" arrow
      back from attack), and **every** request of that loop passes the gate - including the ones you did not
      plan, such as following a redirect. Reporting is not a final box: evidence is written while you test.

  - id: code-scope
    kind: code
    concepts: [sec-fund-authorisation-scope]
    title: A scope gate that runs before any request
    body: |
      The technical part of a scope, as data, and a check that runs before each request. The practice rule on
      top: a host must be loopback, whatever the document says, because the practice projects only ever test
      the local portal.

      ```python
      from foundations.fund_scope import parse_scope, check

      scope = parse_scope({"hosts": ["127.0.0.1"], "ports": [8765],
                           "excluded_paths": ["/internal/"], "methods": ["GET", "POST"]})
      for method, url in [("GET", "http://127.0.0.1:8765/api/payments"),
                          ("GET", "http://127.0.0.1@evil.example:8765/"),
                          ("GET", "http://127.0.0.1.evil.example:8765/"),
                          ("GET", "http://127.0.0.1:8765/%69nternal/admin"),
                          ("PATCH", "http://127.0.0.1:8765/api/profile"),
                          ("GET", "http://127.0.0.1:9999/")]:
          d = check(scope, url, method)
          print(f"{method:5} {url:45} -> {'ALLOW' if d.allowed else 'REFUSE'}: {d.reason}")
      ```

      Output (19 November 2026):

      ```plaintext
      GET   http://127.0.0.1:8765/api/payments            -> ALLOW: in scope
      GET   http://127.0.0.1@evil.example:8765/           -> REFUSE: user info in the URL hides the real host
      GET   http://127.0.0.1.evil.example:8765/           -> REFUSE: host '127.0.0.1.evil.example' is not in scope
      GET   http://127.0.0.1:8765/%69nternal/admin        -> REFUSE: path '/internal/admin' is excluded (/internal/)
      PATCH http://127.0.0.1:8765/api/profile             -> REFUSE: method PATCH is not allowed
      GET   http://127.0.0.1:9999/                        -> REFUSE: port 9999 is not in scope
      ```

      Each refusal is a real way testers drift out of scope. `127.0.0.1@evil.example` **looks** local but the
      part before `@` is user info - the request goes to `evil.example`. `127.0.0.1.evil.example` is a name
      under `evil.example`, not an address. `%69` is an encoded `i`, so the excluded `/internal/` must be
      checked after decoding.

      **Redirects leave the scope too.** The portal's `/login?next=` redirects anywhere it is told (a flaw for a
      later lesson). With `GuardedClient`, every request - including the one a redirect asks for - goes through
      the gate:

      ```python
      client = GuardedClient(scope, send=requests.request)
      r = client.request("GET", base + "/login", params={"next": "https://evil.example/"},
                         allow_redirects=False, timeout=5)
      print(r.status_code, "Location:", r.headers["Location"])
      client.request("GET", r.headers["Location"])     # raises OutOfScope
      ```

      ```plaintext
      302 Location: https://evil.example/
      OutOfScope: GET https://evil.example/: host 'evil.example' is not in scope
      GET http://127.0.0.1:8765/login True
      GET https://evil.example/ False
      ```

      The last two lines are the client's log - the evidence that the test stayed in scope. Note
      `allow_redirects=False`: `requests` follows redirects by default, and a redirect it follows by itself
      never passes your gate.

  - id: code-probe
    kind: code
    concepts: [sec-fund-authorisation-scope, sec-fund-cia-risk]
    title: A first probe - improper error handling (WSTG-ERRH-01)
    body: |
      The WSTG's test objectives for improper error handling are to "Identify existing error output", "Analyze
      the different output returned" and "Determine whether errors expose sensitive information or cause the
      application to fail open". The raw response from the vulnerable portal (the `Server` header is shown
      after the content type):

      ```plaintext
      500 text/plain SandPayPortal/0.9 Python/3.12
      Traceback (most recent call last):
        File "~/LearnerApp/practice/security/support/sandpay_vuln.py", line 470, in handle
          resp = self._route(req)
                 ^^^^^^^^^^^^^^^^
        File "~/LearnerApp/practice/security/support/sandpay_vuln.py", line 494, in _route
          return fn(req)
                 ^^^^^^^
        File "~/LearnerApp/practice/security/support/sandpay_vuln.py", line 465, in boom
          raise RuntimeError(f"settlement batch failed; db=sqlite:///var/sandpay/portal.db key={JWT_SECRET.decode()}")
      RuntimeError: settlement batch failed; db=sqlite:///var/sandpay/portal.db key=sandpay-practice-only-jwt-key
      ```

      The probe turns that into a finding with redacted evidence:

      ```python
      from foundations.fund_probe import probe_error_handling
      from sandpay_vuln import make_app, serve

      with serve(make_app(), port=8765) as base:
          for f in probe_error_handling(base, ("/health", "/boom", "/no-such-page")):
              print(f.check, f.status, f.url)
              for line in f.evidence:
                  print("   ", line)
      ```

      ```plaintext
      WSTG-ERRH-01 500 http://127.0.0.1:8765/boom
          Traceback (most recent call last):
          raise RuntimeError(f"settlement batch failed; db=sqlite:///var/sandpay/portal.db key=[REDACTED]
          RuntimeError: settlement batch failed; db=sqlite:///var/sandpay/portal.db key=[REDACTED]
      ```

      Three lines prove the finding: there is a stack trace, it shows source code, and it discloses a database
      path and a key. The key itself is not in the report. (The redaction also swallowed the closing `")` of
      the source line, because the pattern takes everything up to whitespace - harmless here, and a reminder to
      read your evidence before you file it.)

      The same probe against the portal with the flaw fixed - `make_app({"verbose-errors"})`:

      ```plaintext
      500 {"error": "internal error", "reference": "8294d4ac"}
      findings: []
      ```

      Still a 500 - the error still happens - but the body is a generic message and a reference that support
      staff can look up in the server's logs. That is correct error handling, so the probe reports **nothing**.
      A probe that flagged every 500 would bury real findings in noise.

  - id: code-risk
    kind: code
    concepts: [sec-fund-cia-risk]
    title: Rating the finding
    body: |
      Scores for the error-page leak, chosen from the methodology's options (so `strict=True` accepts them):
      an anonymous internet user (size 9) with some technical skill (3) and a possible reward (motive 4) needs
      no special access (opportunity 9); the error is easy to discover (7) and the data easy to use (5); it is
      obvious once seen (awareness 6) and the error is logged without review (8). Impact: minimal critical data
      disclosed (confidentiality 6), integrity and availability minimal (1 each), and the attacker is possibly
      traceable (accountability 7). No business figures yet, so technical impact is used.

      ```python
      from foundations.fund_risk import rate

      finding = {"skill_level": 3, "motive": 4, "opportunity": 9, "size": 9,
                 "ease_of_discovery": 7, "ease_of_exploit": 5, "awareness": 6, "intrusion_detection": 8,
                 "loss_of_confidentiality": 6, "loss_of_integrity": 1, "loss_of_availability": 1,
                 "loss_of_accountability": 7}
      print(rate(finding, strict=True))
      print(rate(example))                 # the methodology's worked example, all 16 factors
      rate(example, strict=True)
      ```

      ```plaintext
      Rating(likelihood=6.375, likelihood_level='HIGH', impact=3.75, impact_level='MEDIUM', impact_basis='technical', severity='High')
      Rating(likelihood=4.375, likelihood_level='MEDIUM', impact=2.25, impact_level='LOW', impact_basis='business', severity='Low')
      strict: motive=2 is not one of the methodology's options [1, 4, 9]
      ```

      Likelihood 6.375 is HIGH and technical impact 3.75 is MEDIUM, so the table gives **High**. The second
      line reproduces the methodology's example exactly (4.375 MEDIUM, business 2.25 LOW, severity Low). The
      third shows the trap from the internals section: the official example is not "strict".

      If SandPay's business owner then says that this signing key protects every merchant's session, the
      business factors change and so may the severity. The rating is a conversation starter with numbers
      attached, not a verdict - the methodology says "there is quite a lot of uncertainty in these estimates".

  - id: line-by-line
    kind: line-by-line
    concepts: [sec-fund-authorisation-scope, sec-fund-cia-risk]
    title: The probe, line by line
    body: |
      ```python
      def probe_error_handling(base_url, paths=("/boom",), get=requests.get):
          host = (urllib.parse.urlsplit(base_url).hostname or "").lower()
          if host not in LOOPBACK:
              raise ValueError(f"refusing to probe {host!r}: practice probes only target loopback")
          findings = []
          for path in paths:
              url = base_url.rstrip("/") + path
              resp = get(url, timeout=5, allow_redirects=False)
              if resp.status_code < 500:
                  continue
              lines = leak_lines(resp.text)
              if lines:
                  findings.append(Finding("WSTG-ERRH-01", url, resp.status_code, tuple(lines)))
          return findings
      ```

      - **The host check comes first**, before any request - a refused target is never contacted. The test
        proves it with a fake `get` that records calls and must record none.
      - **`get` is a parameter.** Tests pass a fake to prove the refusal; real runs use `requests.get`. Code
        that can only reach the network cannot be tested for "did not reach the network".
      - **`timeout=5`** - a security test must not hang on a server that stops answering (which may itself be a
        finding).
      - **`allow_redirects=False`** - the probe looks at the answer it got, and a redirect could leave the scope.
      - **`status_code < 500` is skipped** - this probe is about server errors; a 404 page is a different test.
      - **`leak_lines` decides**, not the status code. A 500 with a generic body is good practice.

      ```python
      def leak_lines(body):
          found, seen_trace = [], False
          for line in body.splitlines():
              is_trace = any(m in line for m in TRACE_MARKERS)
              has_secret = SECRET_PATTERN.search(line) is not None
              if has_secret or (is_trace and not seen_trace):
                  found.append(redact(line.strip()))
              seen_trace = seen_trace or is_trace
              if len(found) == MAX_EVIDENCE_LINES:
                  break
          return found
      ```

      - **The first trace line, then the secret lines.** An earlier version kept the first three matching
        lines - all three were stack frames, and the line that proved the leak never reached the report. Evidence
        is chosen for what it proves, not for where it appears.
      - **`redact` runs on every line before it is stored.** Evidence lives in tickets, chats and PDF reports;
        a copied key is a second leak.
      - **`MAX_EVIDENCE_LINES = 3`** - enough to prove, short enough to read. The full response belongs in your
        working notes, stored as carefully as the system's own data.

  - id: steps
    kind: steps
    concepts: [sec-fund-authorisation-scope]
    title: Before your first test on a real system
    body: |
      1. **Get written authorisation** from someone entitled to give it - the system owner, not a friendly
         developer. For a client, that is a signed engagement; inside a company, an approved request.
      2. **Agree the Rules of Engagement.** SP 800-115's template covers purpose, **scope**, assumptions and
         limitations, risks, personnel and points of contact (including the incident response team) and the
         test schedule - for example testing "during evening hours rather than during peak business periods".
      3. **Write the scope down as data** - hosts, ports, paths, methods, accounts, time window, excluded
         techniques - and load it into your tools, as `parse_scope` does.
      4. **Prepare evidence handling** - where notes are stored, who can read them, how secrets are redacted,
         when they are deleted.
      5. **Know how to stop** - who to call if something breaks or you find evidence of a real attacker.
      6. **Test, logging every decision** - in scope or refused - and keeping evidence as you go.
      7. **Report** each finding with what was tested, how, the root cause, remediation, a risk rating and the
         business impact - the WSTG's "Clear, Actionable Reporting" list.
      8. **Retest after the fix** - a finding is closed by a test that now passes, not by a ticket status.

  - id: example
    kind: example
    concepts: [sec-fund-cia-risk, sec-fund-authorisation-scope, sec-fund-testing-kinds]
    title: "Example: the first afternoon on the SandPay portal"
    body: |
      SandPay's portal team asks QA for a first security pass before merchants get access. The written request
      from the portal's product owner names the staging host, the read-only and form-posting endpoints, two test
      merchant accounts and the hours 14:00-18:00; it excludes `/internal/` and any load or denial-of-service
      testing.

      **Grey box, overt.** You have the source (white box) and the running staging portal (black box), and the
      team knows you are testing. That gives the most findings for an afternoon.

      **What you do:**

      - Load the scope into your client; the first request that tries `/internal/admin` is refused by your own
        tool, and the refusal is logged.
      - Run the error-handling probe on pages likely to fail - one finding, WSTG-ERRH-01, on `/boom`.
      - Rate it: likelihood HIGH (6.375), technical impact MEDIUM (3.75), severity **High**.
      - Report: what was sent, the three redacted evidence lines, root cause (unhandled exceptions are rendered
        with `traceback.format_exc()`), remediation (a generic error body with a reference id; details only in
        server logs), the rating and what it would mean if the signing key is real.
      - Agree the retest: after the fix, the same probe must return no findings - and it becomes a regression
        test in the pipeline (a later lesson).

      **What a tester checks that a functional tester would not:** the body of error responses, not just their
      status; which headers reveal versions; what the evidence itself contains before it is shared.

  - id: tests
    kind: tests
    concepts: [sec-fund-authorisation-scope, sec-fund-cia-risk]
    title: Testing the probe and the scope gate
    body: |
      | # | Case | Expected result | Evidence |
      | --- | --- | --- | --- |
      | 1 | Probe the vulnerable portal (`make_app()`) on `/health`, `/boom`, `/no-such-page` | exactly one finding, WSTG-ERRH-01, status 500, on `/boom` | the Finding object |
      | 2 | Same, check the evidence text | starts with `Traceback (most recent call last):`, ends with the redacted `RuntimeError` line, no `File` frames, at most 3 lines | evidence lines |
      | 3 | Search the evidence for the real key | `sandpay-practice-only-jwt-key` absent | joined evidence |
      | 4 | Probe the fixed portal (`make_app({"verbose-errors"})`) | no findings, although `/boom` still returns 500 | empty list |
      | 5 | Probe `https://portal.sandpay.example` with a recording fake `get` | ValueError; the fake recorded **no** calls | the fake's call list |
      | 6 | Scope check for user info, look-alike host, wrong port, default port, encoded excluded path, disallowed method | refused, reason names the rule | Decision objects |
      | 7 | A host listed in the scope that is not loopback | refused by the practice rule | Decision reason |
      | 8 | `GuardedClient` with an allowed and a refused URL | `send` called once; log has `[True, False]` | fake's calls, client log |

      Cases 1 and 4 together are the house pattern for every security exercise in this track: **a test must
      find the flaw and must stay quiet once the flaw is fixed.** Only one half proves little - a probe that
      always reports passes case 1, and a probe that never reports passes case 4.

  - id: mistakes
    kind: mistakes
    concepts: [sec-fund-authorisation-scope, sec-fund-testing-kinds, sec-fund-cia-risk]
    title: Common mistakes and a debugging method
    body: |
      - **"The developer said it was fine."** Permission must come from someone entitled to give it, in
        writing, before testing. A developer rarely owns the system, the data or the hosting contract.
      - **Testing a third party through your own app.** The payment provider your checkout calls is not in your
        scope because your app talks to it. Their own terms decide, and they usually provide a sandbox.
      - **Following a redirect or a link out of scope.** Tools follow redirects by default. Turn that off and
        pass every new URL through the gate.
      - **Matching hosts with `in` or `endswith`.** `"127.0.0.1" in url` is true for
        `http://127.0.0.1.evil.example/`. Parse the URL and compare the host exactly.
      - **Treating every 500 as a vulnerability.** The finding is what the error **reveals** or what it lets
        through (WSTG-ERRH-01 also names failing open), not the status code.
      - **Copying secrets into the report.** Redact before storing; describe what leaked and where.
      - **Severity by gut feeling.** Two testers, two answers. Use an agreed method and show the factors.
      - **"The scanner found nothing, so it is secure."** "No Silver Bullet": scanners find known patterns,
        not broken business rules or access control.
      - **A test that only checks the flaw is there.** Without the fixed-variant check you cannot tell a good
        probe from one that always says "vulnerable".

      **Debugging a probe that reports the wrong thing:**

      1. Look at the raw exchange - request, status, headers, body - before your probe's interpretation of it.
      2. Run the probe against both variants of the portal; note which one is wrong.
      3. If it misses the flaw, find the line in the body that proves it and check your markers against that
         exact text.
      4. If it reports on the fixed portal, find the line it matched and decide whether that line is really
         evidence - then make the rule tighter, not the test weaker.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [sec-fund-testing-kinds, sec-fund-cia-risk]
    title: Trade-offs and alternatives
    body: |
      - **Automated or manual?** Automated checks are cheap to repeat and belong in every build; people find
        business logic and authorisation flaws that tools do not understand. The WSTG's answer is to "layer
        both".
      - **Black, grey or white box?** Black box shows what an outsider sees but spends time rediscovering what
        the team already knows; white box finds more per hour but misses deployment and integration problems -
        SP 800-115 notes white box techniques "cannot detect security defects in interfaces between components".
        Grey box is the usual compromise.
      - **Overt or covert?** SP 800-115: overt testing "is less expensive, carries less risk than covert
        testing, and is more frequently used"; covert testing shows whether the defenders notice but is
        "time-consuming and costly".
      - **Which risk method?** The OWASP method is quick and readable but its own page says there has been
        "debate" about it and points to NIST SP 800-30 and others. For a single vulnerability in a public
        database you will also meet CVSS (a later lesson). Pick one, document your adjustments, use it
        consistently.
      - **Marker lists versus understanding.** `TRACE_MARKERS` catches common stack-trace formats, not every
        framework's error page. A probe is a cheap first filter; a person still reads the responses.

  - id: summary
    kind: summary
    concepts: [sec-fund-cia-risk, sec-fund-testing-kinds, sec-fund-authorisation-scope]
    title: Quick reference
    body: |
      - **CIA** - confidentiality (no unauthorised disclosure), integrity (no improper modification or
        destruction), availability (timely, reliable access).
      - **Vulnerability** = weakness; **threat** = something that could exploit it; **risk** = likelihood x
        impact.
      - **OWASP Risk Rating** - average 0-9 factors; <3 LOW, 3 to <6 MEDIUM, 6-9 HIGH; HIGH x HIGH =
        Critical, LOW x LOW = Note; use business impact when you have it.
      - **Kinds** - scanning (known issues), SAST (code), secret scanning, SCA (dependencies), DAST (running app),
        IAST (instrumented app), penetration test (real attacks, chains), red team (adversary vs defenders), bug
        bounty (outside researchers).
      - **Box** - white (source), black (running system only), grey (both). **Overt** with the staff's
        knowledge, **covert** without.
      - **Permission first** - written authorisation, Rules of Engagement before testing, scope enforced in code
        on every request including redirects.
      - **Evidence** - reproducible, minimal, redacted.
      - **House pattern** - a security test finds the flaw **and** stays quiet once it is fixed.

exercises:
  - id: mcq-cia-key-leak
    type: mcq
    concept: sec-fund-cia-risk
    skill: application
    title: Which property does the error page break?
    prompt: |
      SandPay's portal returns a stack trace that includes the key used to sign session tokens. Nobody has
      used the key yet. Which security property has been lost **so far**?
    options:
      - id: confidentiality
        text: Confidentiality
        feedback: Correct - information (the key, the database path) has been disclosed to people who are not authorised to see it.
      - id: integrity
        text: Integrity
        feedback: Forged tokens would be an integrity loss, but nothing has been modified yet - claim it only once you have shown it.
      - id: availability
        text: Availability
        feedback: The portal still answers; nobody has lost access.
      - id: none
        text: None - an error page is not a security problem
        feedback: The WSTG names "secrets (e.g. connection strings, API keys, or prompts) embedded in error output" as what improper error handling exposes.
    correct: [confidentiality]
    hints:
      - Has anything been changed or made unavailable yet?
      - Look at the FIPS 199 definition of a loss of confidentiality.
    solution: |
      Confidentiality - "the unauthorized disclosure of information". Later consequences (forged sessions,
      changed data) would be integrity losses, but you report what you have shown and describe the rest as
      potential impact.

  - id: mcq-vuln-threat-risk
    type: mcq
    concept: sec-fund-cia-risk
    skill: recognition
    title: Vulnerability, threat or risk?
    prompt: |
      "Anonymous users who probe payment portals for leaked keys." In the vocabulary of this lesson, this is...
    options:
      - id: threat
        text: A threat (a threat source with the potential to cause harm)
        feedback: Correct - it is who or what might exploit a weakness, not the weakness itself.
      - id: vulnerability
        text: A vulnerability
        feedback: A vulnerability is the weakness - here, error pages that show stack traces.
      - id: risk
        text: A risk
        feedback: Risk combines the likelihood of the harm with its impact; this sentence states neither.
      - id: impact
        text: An impact
        feedback: Impact is the harm if the attack succeeds - disclosed data, forged sessions, fines.
    correct: [threat]
    hints:
      - Is it a weakness in the system, something that could exploit one, or a measure of both?
    solution: |
      Threat. The vulnerability is the verbose error page; the risk is how likely those users find and use the
      key, combined with how much harm that would do.

  - id: mcq-which-tool
    type: mcq
    concept: sec-fund-testing-kinds
    skill: application
    title: The SQL in the pull request
    prompt: |
      A pull request builds an SQL query by concatenating a request parameter into the string. The feature is
      not deployed anywhere yet. Which kind of testing can catch this **now**?
    options:
      - id: sast
        text: SAST on the pull request
        feedback: Correct - static analysis scans source code "for known vulnerability patterns", and needs no running application.
      - id: dast
        text: DAST against staging
        feedback: DAST attacks a running application; nothing is deployed yet.
      - id: sca
        text: SCA
        feedback: SCA checks third-party dependencies for known vulnerabilities, not your own query code.
      - id: red-team
        text: A red team exercise
        feedback: Far too slow and broad for one line in a pull request; a red team tests an organisation's defences.
    correct: [sast]
    hints:
      - What exists at this moment - source code, or a running system?
    solution: |
      SAST (and a reviewer reading the diff). The WSTG puts code review, SAST, SCA and secret scanning at
      "every commit / PR" for exactly this reason - the earliest point the flaw exists.

  - id: mcq-sca
    type: mcq
    concept: sec-fund-testing-kinds
    skill: recognition
    title: The library with a published vulnerability
    prompt: |
      A JSON parsing library that SandPay's portal depends on has a newly published vulnerability. Which kind
      of testing is designed to tell you?
    options:
      - id: sca
        text: Software composition analysis (SCA)
        feedback: Correct - SCA tools "scan dependencies for known vulnerabilities".
      - id: secret
        text: Secret scanning
        feedback: Secret scanning looks for committed credentials.
      - id: pentest
        text: A penetration test
        feedback: A tester might find it, but checking every dependency against vulnerability databases is SCA's job, on every build.
      - id: iast
        text: IAST
        feedback: IAST watches the application's behaviour while tests run; it is not a dependency inventory.
    correct: [sca]
    hints:
      - The flaw is in someone else's code that you ship.
    solution: SCA, run continuously, because a dependency that was safe yesterday can have a published vulnerability today.

  - id: mcq-box
    type: mcq
    concept: sec-fund-testing-kinds
    skill: application
    title: Source code plus the running portal
    prompt: |
      You test the staging portal through its web interface and also read its source code to find interesting
      routes. In SP 800-115's terms this is...
    options:
      - id: grey
        text: Grey box
        feedback: Correct - "Many tests use both white box and black box techniques - this combination is known as gray box testing."
      - id: white
        text: White box
        feedback: White box techniques analyse the source; you are also testing the running system from outside.
      - id: black
        text: Black box
        feedback: Black box means "without source code knowledge" - you have the source.
      - id: covert
        text: Covert
        feedback: Covert is about whether the staff know you are testing, not how much you know about the system.
    correct: [grey]
    hints:
      - Two separate questions - how much you know, and whether the staff know.
    solution: Grey box. Overt or covert is a separate axis - here the team asked for the test, so it is also overt.

  - id: mcq-pentest-adds
    type: mcq
    concept: sec-fund-testing-kinds
    skill: analysis
    title: What a penetration test adds to a scan
    prompt: |
      SandPay already runs a vulnerability scanner every week. What does a penetration test add that the
      scanner does not?
    options:
      - id: exploit-chain
        text: Whether flaws can really be exploited, alone or combined, to gain more access than any one gives
        feedback: Correct - "Most penetration tests involve looking for combinations of vulnerabilities ... to gain more access than could be achieved through a single vulnerability."
      - id: more-cves
        text: A longer list of known vulnerabilities
        feedback: Listing known issues is what scanners are good at; a penetration test is about exploitability and impact.
      - id: no-risk
        text: Zero risk to the systems tested
        feedback: The opposite - SP 800-115 warns systems "may be damaged or otherwise rendered inoperable" and the risk "can never be fully eliminated".
      - id: replaces-scan
        text: It replaces the need to scan
        feedback: They answer different questions; the WSTG layers both.
    correct: [exploit-chain]
    hints:
      - The scanner matches against known weaknesses. What does a person do with them?
    solution: |
      Proof of exploitability and of chains - for example the leaked key from the error page used to forge a
      session for an admin. Penetration tests also show "Defenders' ability to detect attacks and respond".

  - id: mcq-red-team
    type: mcq
    concept: sec-fund-testing-kinds
    skill: recognition
    title: What a red team is for
    prompt: Which goal fits a red team exercise best?
    options:
      - id: defenders
        text: Emulate a real adversary to show what a successful attack could do and what works for the defenders
        feedback: Correct - the CSRC definition - "demonstrating the impacts of successful attacks and ... what works for the defenders (i.e., the Blue Team)".
      - id: coverage
        text: Check every page of the portal against the WSTG checklist
        feedback: That is coverage-driven application testing; a red team pursues an objective, not a checklist.
      - id: dependencies
        text: Keep dependency versions up to date
        feedback: That is SCA and patch management.
      - id: unit
        text: Write unit tests for security functions
        feedback: Developers' security unit tests run on every build; a red team is an occasional exercise.
    correct: [defenders]
    hints:
      - Whose performance does a red team exercise test besides the system's?
    solution: A red team tests the organisation - people, processes and detection - by emulating an adversary, usually covertly.

  - id: mcq-redirect-scope
    type: mcq
    concept: sec-fund-authorisation-scope
    skill: application
    title: The redirect to someone else's site
    prompt: |
      In scope: `127.0.0.1:8765`. `GET /login?next=https://evil.example/` returns `302` with
      `Location: https://evil.example/`. What do you do?
    options:
      - id: record
        text: Record the open redirect as a finding and do not request https://evil.example/
        feedback: Correct - the redirect is evidence about YOUR target; the site it points to is outside the scope.
      - id: follow
        text: Follow the redirect to see what the site does with the request
        feedback: That site is not in scope; following it is testing a system you have no permission to test.
      - id: ignore
        text: Ignore it - redirects are normal
        feedback: Redirecting to any URL a parameter names is a known flaw (open redirect), useful in phishing.
      - id: rescan
        text: Add evil.example to the scope yourself and continue
        feedback: Only the system owner can change the scope, in writing.
    correct: [record]
    hints:
      - Who gave you permission, and for which hosts?
    solution: |
      Record it - request, response, the Location header - and stop there. This is why the probe uses
      `allow_redirects=False` and why `GuardedClient` checks every URL, including the one a redirect asks for.

  - id: mcq-who-authorises
    type: mcq
    concept: sec-fund-authorisation-scope
    skill: application
    title: The friendly developer
    prompt: |
      A developer on the portal team messages you - "go ahead and hit production with your scanner tonight, it's
      fine". You have no other authorisation. What do you do?
    options:
      - id: written
        text: Wait for written authorisation from the system owner, with scope and time window, before testing
        feedback: Correct - permission must come from someone entitled to give it, and the ROE is "established before the start of a security test".
      - id: go
        text: Go ahead - a team member asked
        feedback: A developer rarely has the authority to approve risk to production systems, data and contracts.
      - id: quiet
        text: Run only a "light" scan so nobody notices
        feedback: Unauthorised and covert - the worst of both.
      - id: screenshot
        text: Screenshot the message as permission and start
        feedback: A chat message from someone without authority is not authorisation, whatever you keep as evidence.
    correct: [written]
    hints:
      - Who owns the risk if the scan takes production down?
    solution: |
      Ask for written authorisation from the owner, naming targets, techniques and times, plus a contact who
      can stop the test. SP 800-115's ROE template also asks for "the incident response team" in the contact
      list.

  - id: mcq-business-impact
    type: mcq
    concept: sec-fund-cia-risk
    skill: analysis
    title: High technically, low for the business
    prompt: |
      A finding rates likelihood MEDIUM (4.375), technical impact HIGH (7.25) and business impact LOW (2.25).
      Following the OWASP methodology, the severity is...
    options:
      - id: low
        text: Low - use the business impact when you have good business information
        feedback: Correct - MEDIUM likelihood x LOW impact = Low; this is the methodology's own worked example.
      - id: high
        text: High - always use the worst impact
        feedback: The methodology says to use business impact when you have good business information.
      - id: critical
        text: Critical
        feedback: Critical needs HIGH likelihood and HIGH impact.
      - id: medium
        text: Medium - average the two impacts
        feedback: The methodology picks one impact (business if known), it does not average them.
    correct: [low]
    hints:
      - Which impact does the methodology prefer, and when?
      - Find MEDIUM likelihood and LOW impact in the severity table.
    solution: |
      Low. The methodology's comment on this example - "This is why understanding the business context of the
      vulnerabilities you are evaluating is so critical to making good risk decisions."

  - id: mcq-generic-500
    type: mcq
    concept: sec-fund-cia-risk
    skill: analysis
    title: A 500 with a reference id
    prompt: |
      `GET /boom` on the fixed portal returns `500` with `{"error": "internal error", "reference": "8294d4ac"}`.
      Is that a WSTG-ERRH-01 finding?
    options:
      - id: not-a-finding
        text: No - it reveals no internal detail; the reference lets support find the details in server logs
        feedback: Correct - the error still happens, but it is handled without exposing anything.
      - id: yes-500
        text: Yes - any 500 is a security finding
        feedback: The status code is not the problem; what the error reveals (or lets through) is.
      - id: yes-reference
        text: Yes - the reference id leaks information
        feedback: A random reference reveals nothing about the system; it is the recommended pattern.
      - id: maybe
        text: Only if the 500 also appears in the access log
        feedback: Logging is a separate question; nothing sensitive is disclosed here.
    correct: [not-a-finding]
    hints:
      - Re-read the WSTG's list of what improper error handling can disclose.
    solution: |
      Not a finding for error handling. You might still file a functional defect for the failure itself - and
      check that a test which fails open (an authorisation check that throws) is not hiding behind it.

  - id: order-engagement
    type: order
    concept: sec-fund-authorisation-scope
    skill: recall
    title: An engagement in order
    prompt: Put the steps of a small security engagement in order.
    items:
      - id: authorise
        text: Get written authorisation from the system owner
      - id: roe
        text: Agree the rules of engagement - scope, time window, contacts and excluded techniques
      - id: load-scope
        text: Load the scope into your tools so out-of-scope requests are refused
      - id: discover
        text: Discover the attack surface inside the scope
      - id: attack
        text: Test and validate findings, keeping redacted evidence
      - id: report
        text: Report each finding with root cause, remediation and a risk rating
      - id: retest
        text: Retest after the fix and keep the test as a regression check
    hints:
      - Nothing happens before permission; SP 800-115 says no testing occurs in planning.
    solution: |
      Authorisation and ROE are planning - "No actual testing occurs in this phase." The scope gate is ready
      before the first request. Evidence and reporting run alongside testing, and a fix is closed by a retest.

  - id: debug-scope-check
    type: debug
    concept: sec-fund-authorisation-scope
    skill: analysis
    title: The scope check that lets attackers through
    prompt: |
      This check should allow only `127.0.0.1` on port 8765 and never touch `/internal/`. It allows
      `http://127.0.0.1.evil.example:8765/` and `http://127.0.0.1:8765/%69nternal/admin`. Click **every** line
      that causes a defect.
    language: python
    code: |
      def in_scope(url):
          parts = urllib.parse.urlsplit(url)
          if parts.scheme not in ("http", "https"):
              return False
          if not parts.netloc.startswith("127.0.0.1"):
              return False
          if parts.port != 8765:
              return False
          if parts.path.startswith("/internal/"):
              return False
          return True
    correctLines: [5, 9]
    lineNotes:
      - line: 3
        note: Correct - only web schemes.
      - line: 7
        note: Correct - the port comparison is exact (parts.port is None when no port is given, so a missing port is refused too).
    hints:
      - Which part of the URL is compared with startswith, and could another host start the same way?
      - What is %69?
    solution: |
      Line 5 compares the start of the network location, so `127.0.0.1.evil.example` (and
      `127.0.0.1@evil.example`) pass - compare `parts.hostname` exactly and refuse user info. Line 9 checks the
      raw path, so the percent-encoded `/%69nternal/` passes - decode with `urllib.parse.unquote` first.

  - id: short-functional-vs-security
    type: short
    concept: sec-fund-testing-kinds
    skill: analysis
    title: Why 2,000 passing tests say little about security
    prompt: |
      The portal team says "we have 2,000 passing functional tests, so the portal is secure". In a few
      sentences, explain what those tests do and do not tell you, using one SandPay flaw as an example.
    modelAnswer: |
      Functional tests check intended behaviour - the right answer for valid input and a clear error for
      invalid input. Security flaws live in unintended behaviour: what else the system lets someone do. The
      error page is an example - a functional test that triggers an internal error expects a 500 and passes,
      while the body hands out a stack trace, a database path and a signing key. Another is merchant A reading
      merchant B's payment by changing the id, which no test written from A's point of view ever tries.
      Passing tests show the features work; they say nothing about the attacks nobody wrote a test for. That
      needs security testing - threat modelling, SAST/DAST and manual testing - and the findings should then
      become tests too.
    rubric:
      - Distinguishes intended behaviour (functional) from unintended behaviour (security).
      - Gives a concrete SandPay example where a functional test passes but a flaw exists.
      - Names at least one kind of security testing that would find it.
      - Mentions turning confirmed findings into automated tests.
    hints:
      - What does a functional test of an internal error check - the status, or the body?
    solution: Functional tests prove the features work; security testing asks what else the system allows, and the answers then become tests.

  - id: testdesign-error-handling
    type: testdesign
    concept: sec-fund-cia-risk
    skill: application
    title: Test cases for error handling on the portal
    prompt: |
      Design test cases for WSTG-ERRH-01 on the SandPay portal (in scope - `127.0.0.1:8765`, GET and POST, no
      `/internal/`). For each - preconditions, steps, expected result and evidence. Cover at least an unhandled
      exception, malformed input, an unknown route and the fixed variant.
    modelAnswer: |
      Preconditions for all: portal running locally from `sandpay_vuln.py`, scope loaded into the client, alice
      logged in where needed.

      1. **Unhandled exception** - GET `/boom`. Expected - 500 with a generic body and a reference; no stack
         trace, file paths, versions or secrets. Evidence - status, body, the redacted lines if any leak.
      2. **Malformed JSON** - POST `/api/login` with body `{bad`. Expected - 400 with a short message, no parser
         trace. Evidence - request and response.
      3. **Wrong type** - GET `/api/payments?status=` with a very long or odd value. Expected - a normal 200 or
         4xx, no SQL error text. Evidence - body.
      4. **Unknown route** - GET `/no-such-page`. Expected - 404 with no framework banner or path. Evidence -
         body and headers.
      5. **Version disclosure in headers** - any request. Expected - no `Server` header with product versions.
         Evidence - headers.
      6. **Fixed variant** - repeat 1-5 against `make_app({"verbose-errors"})`. Expected - case 1 shows the
         generic body and no finding. Evidence - probe output (empty list).
      7. **Evidence hygiene** - search stored evidence for the key. Expected - absent. Evidence - the search.
    rubric:
      - Every case has preconditions, steps, an expected result and concrete evidence.
      - Includes an unhandled exception and malformed input.
      - Includes the fixed variant and expects no finding.
      - Expected results describe what must NOT be revealed, not just the status code.
      - Stays inside the stated scope (no /internal/).
    hints:
      - Which inputs make code take a path its author never expected?
      - What would prove the probe is not just reporting every 500?
    solution: Each case checks what the error reveals, not only its status - and the fixed variant must produce no finding.

  - id: interview-scan-vs-pentest
    type: interview
    concept: sec-fund-authorisation-scope
    skill: analysis
    title: "Interview: how do you start a security test?"
    prompt: |
      "What is the difference between a vulnerability scan and a penetration test - and what do you do before
      you run either against a client's system?"
    modelAnswer: |
      A vulnerability scan is automated: it identifies hosts, software and configuration and matches them
      against known vulnerabilities - broad, fast and repeatable, but it reports possibilities. A penetration
      test is people mimicking real attacks: it proves what is exploitable, chains weaknesses to gain more access
      than any single one gives, and shows business impact - deeper, slower and riskier, because real attacks
      can break things.

      Before either: written authorisation from someone entitled to give it, and Rules of Engagement agreed
      before testing - scope (hosts, ports, paths, accounts), time window, excluded techniques such as denial of
      service, contacts including incident response, and how to stop. I load the scope into my tools so
      out-of-scope requests are refused - redirects included - and I log every decision. I agree how evidence is
      stored and redacted, and the reporting format: root cause, remediation, a risk rating with an agreed
      method, and a retest after the fix.
    rubric:
      - Scan - automated, known issues, broad; penetration test - manual, exploitation, chaining, impact.
      - Mentions the risk of damage during a penetration test.
      - Written authorisation from the right person, before testing.
      - Names concrete ROE contents - scope, time window, exclusions, contacts.
      - Mentions evidence handling or reporting and retesting.
    followUps:
      - What would you do if you found evidence that someone else had already broken in?
      - The client's payment provider is called by the app - can you test it?
      - How do you decide the severity of what you find?
    hints:
      - Answer in two halves - the difference, then the preparation.
    solution: Scans find known issues broadly; penetration tests prove exploitation and impact - and neither starts without written authorisation and agreed rules of engagement.

  - id: scope-code
    type: coding
    concept: sec-fund-authorisation-scope
    skill: application
    title: Build the scope gate
    prompt: |
      In `foundations/fund_scope.py`, implement `parse_scope`, `check` and `GuardedClient.request`. `check` must
      apply the seven rules in its docstring, in order, and return a `Decision` whose reason names the rule that
      failed. `GuardedClient.request` logs every decision and raises `OutOfScope` - without calling `send` - for
      a refused request.
    project: security
    files:
      - exercises/foundations/fund_scope.py
    test: tests/foundations/test_fund_scope.py
    command: .venv/bin/python -m pytest tests/foundations/test_fund_scope.py
    hints:
      - "`urllib.parse.urlsplit` gives you scheme, hostname, port, username and path; `parts.port` raises ValueError for a bad port."
      - The default port depends on the scheme.
      - Decode the path with `urllib.parse.unquote` before comparing it with the excluded prefixes.
    modelAnswer: |
      ```python
      def check(scope, url, method="GET"):
          parts = urllib.parse.urlsplit(url)
          if parts.scheme not in ("http", "https"):
              return Decision(False, f"scheme {parts.scheme or '(none)'!r} is not http or https")
          if parts.username is not None or "@" in parts.netloc:
              return Decision(False, "user info in the URL hides the real host")
          host = (parts.hostname or "").lower()
          if host not in scope.hosts:
              return Decision(False, f"host {host!r} is not in scope")
          if host not in LOOPBACK:
              return Decision(False, f"host {host!r} is not a loopback address (practice rule)")
          try:
              port = parts.port or (443 if parts.scheme == "https" else 80)
          except ValueError:
              return Decision(False, "invalid port")
          if scope.ports and port not in scope.ports:
              return Decision(False, f"port {port} is not in scope")
          path = urllib.parse.unquote(parts.path or "/")
          for prefix in scope.excluded_paths:
              if path.startswith(prefix):
                  return Decision(False, f"path {path!r} is excluded ({prefix})")
          if method.upper() not in scope.methods:
              return Decision(False, f"method {method.upper()} is not allowed")
          return Decision(True, "in scope")
      ```

      Exact host comparison after parsing, refusing user info, and decoding before comparing paths close the
      three classic bypasses. `GuardedClient.request` appends `(method, url, decision)` to its log first, then
      raises or calls `send` - so the log is complete evidence of what was and was not sent.
    rubric:
      - Every test in tests/foundations/test_fund_scope.py passes.
      - Hosts are compared exactly after parsing - no `in`, `startswith` or `endswith` on the URL.
      - A refused request never reaches `send`, and every decision is logged.
      - Reasons name the failed rule, so a refusal in a log explains itself.
    solution: Parse first, compare exactly, decode before comparing paths, and log every decision before sending or refusing.

  - id: risk-code
    type: coding
    concept: sec-fund-cia-risk
    skill: application
    title: The OWASP risk calculator
    prompt: |
      In `foundations/fund_risk.py`, implement `_average`, `level`, `likelihood`, `impact` and `rate` for the
      OWASP Risk Rating Methodology's "Repeatable Method". The tests check the methodology's worked example,
      the level boundaries, every cell of the severity table, the choice between business and technical impact
      and a `strict` mode that accepts only the listed options.
    project: security
    files:
      - exercises/foundations/fund_risk.py
    test: tests/foundations/test_fund_risk.py
    command: .venv/bin/python -m pytest tests/foundations/test_fund_risk.py
    hints:
      - Likelihood averages 8 factors; impact averages 4 (technical or business).
      - "`level` - 3 is MEDIUM and 6 is HIGH: the bands are \"0 to <3\", \"3 to <6\", \"6 to 9\"."
      - "`True` is an `int` in Python - reject booleans explicitly."
    modelAnswer: |
      ```python
      def _average(scores, names, strict):
          missing = [n for n in names if n not in scores]
          if missing:
              raise ValueError(f"missing factors: {missing}")
          for n in names:
              value = scores[n]
              if not isinstance(value, int) or isinstance(value, bool) or not 0 <= value <= 9:
                  raise ValueError(f"{n} must be a whole number from 0 to 9, not {value!r}")
              if strict and value not in OPTIONS[n]:
                  raise ValueError(f"{n}={value} is not one of the methodology's options {sorted(OPTIONS[n])}")
          return sum(scores[n] for n in names) / len(names)

      def rate(scores, strict=False):
          lk = likelihood(scores, strict)
          basis = "business" if all(n in scores for n in BUSINESS_FACTORS) else "technical"
          im = impact(scores, basis, strict)
          lk_level, im_level = level(lk), level(im)
          return Rating(lk, lk_level, im, im_level, basis, SEVERITY[im_level][lk_level])
      ```

      Validation is most of the work: a calculator that silently accepts `"7"` or `10` gives confident wrong
      answers. `SEVERITY` is indexed impact first, likelihood second, as the methodology's table is drawn.
    rubric:
      - Every test in tests/foundations/test_fund_risk.py passes.
      - Business impact is used only when all four business factors are present.
      - Invalid values (out of range, non-integers, booleans, missing factors) raise ValueError with the factor name.
      - Explains why the worked example fails strict mode.
    solution: Average, band, look up - and validate every input, because the methodology's own example shows how easy it is to drift from the option lists.

  - id: probe-code
    type: coding
    concept: sec-fund-authorisation-scope
    skill: application
    title: The error-handling probe
    prompt: |
      In `foundations/fund_probe.py`, implement `redact`, `leak_lines` and `probe_error_handling`. The probe
      must find WSTG-ERRH-01 on `make_app()`, report nothing on `make_app({"verbose-errors"})`, keep at most
      three redacted evidence lines (the first stack-trace line, then the lines that leak secrets) and refuse a
      non-loopback target without sending anything.
    project: security
    files:
      - exercises/foundations/fund_probe.py
    test: tests/foundations/test_fund_probe.py
    command: .venv/bin/python -m pytest tests/foundations/test_fund_probe.py
    hints:
      - Check the host before the loop - the refusal test passes a fake `get` that must never be called.
      - "`SECRET_PATTERN.sub` with a function keeps the key name and replaces only the value."
      - Keep only the FIRST stack-trace line - later frames add length, not proof.
    modelAnswer: |
      ```python
      def redact(line):
          return SECRET_PATTERN.sub(lambda m: f"{m.group(1)}=[REDACTED]", line)

      def leak_lines(body):
          found, seen_trace = [], False
          for line in body.splitlines():
              is_trace = any(m in line for m in TRACE_MARKERS)
              has_secret = SECRET_PATTERN.search(line) is not None
              if has_secret or (is_trace and not seen_trace):
                  found.append(redact(line.strip()))
              seen_trace = seen_trace or is_trace
              if len(found) == MAX_EVIDENCE_LINES:
                  break
          return found
      ```

      `probe_error_handling` checks the host, then GETs each path with a timeout and without following
      redirects, skips statuses below 500 and reports only when `leak_lines` finds something.
    rubric:
      - Every test in tests/foundations/test_fund_probe.py passes.
      - The probe reports on the vulnerable portal and is silent on the fixed one.
      - The leaked key never appears in a Finding.
      - The non-loopback refusal happens before any request.
    solution: Decide on what the body reveals, not the status; redact before storing; refuse out-of-scope targets before the first request.

placement:
  - id: place-cia
    type: mcq
    concept: sec-fund-cia-risk
    skill: application
    title: The role change
    prompt: |
      A merchant sends `PATCH /api/profile` with `{"role": "admin"}` and the portal saves it. Which property is
      lost, and what kind of weakness is it?
    options:
      - id: integrity
        text: Integrity - data was modified by someone not authorised to modify it
        feedback: Correct - an unauthorised modification; the access it then grants may also cost confidentiality.
      - id: availability
        text: Availability
        feedback: Nobody lost access; something was changed.
      - id: confidentiality-only
        text: Confidentiality only
        feedback: Disclosure may follow, but the first loss is the improper modification.
      - id: none
        text: None - the merchant used a documented endpoint
        feedback: A documented endpoint that accepts fields the user may not change is still a weakness.
    correct: [integrity]
    solution: |
      Integrity - "the unauthorized modification or destruction of information". Using the new admin role to
      read other merchants' data would then be a confidentiality loss as well.

  - id: place-kinds
    type: mcq
    concept: sec-fund-testing-kinds
    skill: application
    title: Do the defenders notice?
    prompt: |
      SandPay's CISO asks - "If a skilled attacker went after us for a month, would our security team notice and
      respond?" Which kind of test answers that?
    options:
      - id: red-team
        text: A red team exercise, usually covert
        feedback: Correct - it emulates an adversary and tests "what works for the defenders".
      - id: sast
        text: SAST on every commit
        feedback: SAST finds code patterns; it says nothing about detection and response.
      - id: scan
        text: A weekly vulnerability scan
        feedback: A scan finds known issues; the security team expects it, so it does not test detection.
      - id: overt-pentest
        text: An announced penetration test of the portal
        feedback: Useful for finding exploitable flaws, but announced (overt) testing does not show whether the team notices a real attack.
    correct: [red-team]
    solution: |
      A red team, typically covert - SP 800-115 says covert testing examines "the damage or impact an adversary
      can cause" and the organisation's response, at higher cost and risk.

  - id: place-scope
    type: debug
    concept: sec-fund-authorisation-scope
    skill: analysis
    title: The probe that leaves the scope
    prompt: |
      This probe should only ever contact the in-scope portal. Click every line that can send a request
      outside the scope.
    language: python
    code: |
      def probe(base_url, paths):
          if "127.0.0.1" not in base_url:
              raise ValueError("out of scope")
          results = []
          for path in paths:
              r = requests.get(base_url + path, timeout=5)
              results.append((path, r.status_code))
          return results
    correctLines: [2, 6]
    lineNotes:
      - line: 6
        note: requests follows redirects by default, so a 302 to another host is requested without any check.
    solution: |
      Line 2 is a substring test - `http://127.0.0.1.evil.example/` and `http://127.0.0.1@evil.example/` pass.
      Line 6 follows redirects by default. Parse and compare the host exactly, and pass `allow_redirects=False`
      (checking any Location you choose to follow).

recall:
  - id: recall-cia
    concept: sec-fund-cia-risk
    prompt: Define confidentiality, integrity and availability in one line each.
    answer: Confidentiality - no unauthorised disclosure. Integrity - no improper modification or destruction (including authenticity and non-repudiation). Availability - timely and reliable access to and use of information.
  - id: recall-vtr
    concept: sec-fund-cia-risk
    prompt: Vulnerability, threat, risk - one line each?
    answer: Vulnerability - a weakness a threat source could exploit. Threat - a circumstance or event with the potential to cause harm. Risk - a function of the likelihood of the harm and its impact.
  - id: recall-owasp-risk
    concept: sec-fund-cia-risk
    prompt: How does the OWASP Risk Rating Methodology turn factors into a severity?
    answer: Average the 0-9 factor scores into likelihood (8 factors) and impact (4 business factors if known, else 4 technical); map each to LOW (<3), MEDIUM (3 to <6), HIGH (6-9); read the severity from the 3x3 table (Note, Low, Medium, High, Critical).
  - id: recall-kinds
    concept: sec-fund-testing-kinds
    prompt: SAST, DAST, SCA, penetration test - what does each look at?
    answer: SAST - source code for vulnerable patterns. DAST - the running application, from outside. SCA - dependencies, for known vulnerabilities. Penetration test - people mimicking real attacks to prove exploitation and chains.
  - id: recall-box
    concept: sec-fund-testing-kinds
    prompt: White, black and grey box?
    answer: White - analysis of the source code. Black - the running system without source knowledge. Grey - both combined.
  - id: recall-roe
    concept: sec-fund-authorisation-scope
    prompt: What are Rules of Engagement, and when are they agreed?
    answer: Detailed guidelines and constraints for executing the security test - scope, schedule, contacts, risks, excluded techniques - established before the test starts, giving the team authority for the defined activities.
  - id: recall-house-pattern
    concept: sec-fund-authorisation-scope
    prompt: What two things must a security test of a flaw prove?
    answer: That it finds the flaw on the vulnerable system, and that it stays quiet (no finding) once the flaw is fixed.

