id: security-testing-fundamentals
title: Security testing fundamentals, ethics and scope
subject: security-testing
module: security-foundations
level: beginner
status: published
estimatedMinutes: 125
summary: What security testing is for and how it differs from functional testing - the CIA triad, vulnerability, threat and risk, the kinds of security testing (scanning, SAST, DAST, SCA, penetration tests, red teams, bug bounties) and black, grey and white box - and the rule that comes before every technique - test only with written permission, inside an agreed scope. You build a scope gate that runs before any request, rate a finding with the OWASP Risk Rating Methodology, and write a first probe that finds verbose error output on the local SandPay practice portal and stays quiet once it is fixed.
