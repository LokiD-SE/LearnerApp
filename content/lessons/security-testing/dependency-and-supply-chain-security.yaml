id: dependency-and-supply-chain-security
title: Dependency and supply chain security
subject: security-testing
module: devsecops
level: intermediate
status: published
estimatedMinutes: 150
summary: Test what you ship but did not write. Build an inventory of every direct and transitive component from a CycloneDX or SPDX SBOM, match it against OSV-shaped advisories with a version-range check that compares numbers and not text, rank what is left with CVSS, a known-exploited list and EPSS, and check that the lockfile and the requirements file pin and hash exactly what was reviewed - all offline, on synthetic SandPay data, with the tools that are not installed quoted from their documentation.
tags:
  [
    dependency security,
    supply chain security,
    software composition analysis,
    SCA,
    SBOM,
    software bill of materials,
    CycloneDX,
    SPDX,
    package URL,
    purl,
    transitive dependencies,
    OSV,
    CVE,
    CVSS,
    KEV,
    EPSS,
    npm audit,
    npm ci,
    package-lock.json,
    pip hash-checking,
    lockfile,
    pinning,
    integrity hash,
    SLSA,
    provenance,
    OWASP A03:2025,
    DevSecOps,
    security testing,
  ]

environment: |
  - **Runtime:** Python 3.12.3 in `practice/security/.venv` with pytest 9.2.0, on Linux. Every output marked as run here
    was printed by the code shown, on 21 November 2026. Nothing in this lesson touches the network: the SBOMs, the
    advisories, the exploitation data and the pinning files are synthetic and live in
    `practice/security/support/sca_fixture.py`. The `SPSA-2026-...` advisory ids, their scores and the "exploited" and
    EPSS values are **made up** - there is no real vulnerability in `sandpay-*` packages, which do not exist.
  - **Sources (read on 21 November 2026, "as documented on" that date):**
    OWASP [Top 10:2025 A03 Software Supply Chain Failures](https://owasp.org/Top10/2025/A03_2025-Software_Supply_Chain_Failures/);
    the OWASP [Vulnerable Dependency Management Cheat Sheet](https://cheatsheetseries.owasp.org/cheatsheets/Vulnerable_Dependency_Management_Cheat_Sheet.html);
    the [CycloneDX specification overview](https://cyclonedx.org/specification/overview/) (current version 1.7, released
    2025-10-21, Ecma standard ECMA-424) and its
    [1.7 JSON schema](https://github.com/CycloneDX/specification/blob/master/schema/bom-1.7.schema.json);
    the [SPDX 2.3.1 specification](https://spdx.github.io/spdx-spec/v2.3.1/) (package information, relationships, external
    references) and the SPDX 2.3 JSON schema; NTIA,
    [The Minimum Elements For a Software Bill of Materials (SBOM)](https://www.ntia.doc.gov/files/ntia/publications/sbom_minimum_elements_report.pdf);
    the [Package-URL project](https://www.packageurl.org/docs/purl/introduction);
    the [OSV schema](https://ossf.github.io/osv-schema/); FIRST
    [CVSS v4.0 specification](https://www.first.org/cvss/v4.0/specification-document) and
    [EPSS](https://www.first.org/epss/); CISA's [Known Exploited Vulnerabilities](https://www.cisa.gov/known-exploited-vulnerabilities)
    page; the npm documentation for [package-lock.json](https://docs.npmjs.com/cli/v10/configuring-npm/package-lock-json),
    [npm ci](https://docs.npmjs.com/cli/v10/commands/npm-ci) and [npm audit](https://docs.npmjs.com/cli/v10/commands/npm-audit)
    (npm CLI 10.9.11 docs - the site labelled that version "Legacy" on that date, so current npm may differ); the pip
    [secure installs](https://pip.pypa.io/en/stable/topics/secure-installs/) page; and
    [SLSA 1.2](https://slsa.dev/spec/v1.2/about). Their wording is quoted where it is quoted.
  - **Not run here (quoted from the documentation):** `npm audit`, `npm ci`, `pip install --require-hashes` and `pip-audit`
    (they contact registries, and I do not send a project's dependency list to an outside service from a lesson run),
    OWASP Dependency-Track and Dependency-Check, Syft, Trivy, Grype, OSV-Scanner, `cyclonedx` generators, GitHub's
    Dependabot, and SLSA provenance tooling. The exercises reimplement the *ideas* in a few lines so you can test them
    offline; they are not substitutes for those tools.
  - **Simplifications you must know about:** the version check handles plain numeric versions (`1.4.2`) and OSV `SEMVER`
    ranges only - real ecosystems have pre-release, epoch and build rules (OSV says `ECOSYSTEM` ranges need the
    ecosystem's own logic). The inventory reads package-level data, not the files inside a package. The priority policy
    (P1 to P4) is **this lesson's example**, not a standard.
  - **Ethics:** scanning your own project's dependencies is routine. Do not run scanners, or probe a package registry or a
    mirror, that you do not own or have **written permission** to test, and never upload a customer's SBOM to a public
    service. An SBOM lists exactly what a system runs, which is valuable to an attacker - treat it as internal.
  - **Not repeated here:** the full CVSS scoring procedure and how to write the finding -
    [Reporting vulnerabilities and scoring with CVSS](#/lesson/vulnerability-reporting-and-cvss); where scans run in a
    pipeline and how gates are built - [Security testing in CI/CD](#/lesson/security-testing-in-ci-cd); static analysis and
    secrets in git - [SAST and secret scanning](#/lesson/sast-and-secret-scanning); the developer's pipeline -
    [CI/CD for web applications](#/lesson/ci-cd-for-web-apps) and
    [Docker and Compose](#/lesson/docker-and-compose).

prerequisites:
  - security-testing-fundamentals
  - owasp-top-10-for-developers
  - testing-security-misconfiguration

concepts:
  - id: sec-sca-inventory
    name: Inventory - know every component you ship
    summary: You cannot patch what you cannot list. An inventory records every component, direct and transitive, with a name, an exact version, a supplier and a package identifier (a package URL, purl), plus the graph of who depends on whom. SBOM formats such as CycloneDX and SPDX carry it. A tester reads the SBOM like any other evidence - checking that it is complete (nested and transitive components, no missing versions or identifiers), that it matches the lockfile, and that two tools describe the same set.
  - id: sec-sca-vulnerabilities
    name: Matching and triage - which known flaws apply, and which first
    summary: A scanner matches each component's ecosystem, name and version against advisories whose affected ranges say "introduced at X, fixed at Y". The match needs a numeric version comparison and an exact ecosystem and name; get either wrong and you miss a flaw or invent one. What is left is ranked with the CVSS severity, whether the flaw is known to be exploited, and EPSS, and a human decides reachability, fix and exceptions. A clean scan proves only that no known advisory in the data used matched.
  - id: sec-sca-integrity
    name: Pinning and integrity - install exactly what you reviewed
    summary: A version range in a manifest is a promise that tomorrow's install may differ from today's. A lockfile records the exact version, where it came from and a hash of the artifact; an install command that obeys it (`npm ci`, pip hash-checking mode) fails when anything differs. The tester checks that every entry is pinned, hashed with a strong algorithm, fetched over https from the intended registry, and that git dependencies name a commit - and that the pipeline really installs from the lock.

objectives:
  - Explain software supply chain failures (OWASP A03:2025) and what an SBOM, a lockfile and an advisory each contribute.
  - Read CycloneDX and SPDX documents into one inventory, separate direct from transitive components and report missing minimum elements.
  - Match components against OSV-shaped advisories with a numeric range check and an exact ecosystem and name, and explain two ways a scanner gives a false negative.
  - Rank findings with the CVSS v4.0 rating, a known-exploited list and EPSS, and explain what none of them tells you.
  - Check a requirements file and an npm lockfile for pinning, hashes, https and the intended registry, and say what `npm ci` and pip hash-checking mode enforce.
  - Design a dependency security test plan for a payment service with evidence for each check.

sections:
  - id: intuition
    kind: intuition
    concepts: [sec-sca-inventory, sec-sca-vulnerabilities, sec-sca-integrity]
    title: The idea in plain language
    body: |
      Think of a restaurant kitchen. The chef cooks the dishes, but almost everything on the plate arrived in a delivery:
      flour, sauce, a pre-made pastry, and inside the pastry a filling from a supplier the chef has never met. If a
      supplier recalls a batch of filling, the chef needs three things. First, **a list of every ingredient in every dish,
      including the ingredients of the ingredients** - otherwise nobody knows which dishes are affected. Second, **the
      recall notice matched against that list**, by exact product and batch, with a sense of which recalls are urgent.
      Third, **proof that the box that arrived is the box that was ordered** - the same product, from the same supplier,
      with an intact seal - because a recall list is useless if boxes can be swapped on the way in.

      A software project is that kitchen. A typical application holds a few dozen libraries you chose and hundreds you
      never heard of, pulled in by the first group. Those are **dependencies**, and the whole route by which code gets
      from someone else's keyboard into your running system - registries, build servers, mirrors, install scripts - is
      the **supply chain**. The three needs become three practices:

      - **Inventory** - a list of every component with its exact version (a *software bill of materials*, SBOM).
      - **Matching and triage** - compare that list with published advisories, then decide what to fix first.
      - **Pinning and integrity** - make the build install exactly the reviewed list, byte for byte.

      Testing this is different from most security testing in this track: you rarely send a request. You read evidence -
      a lockfile, an SBOM, an advisory, a CI log - and check that the three practices hold. The questions are concrete:
      does the inventory cover everything, is the match right, does the install really obey the lock?

  - id: what
    kind: what
    concepts: [sec-sca-inventory, sec-sca-vulnerabilities, sec-sca-integrity]
    title: What the terms mean
    body: |
      OWASP defines the area in the Top 10:2025 as A03 Software Supply Chain Failures: "breakdowns or other compromises in the
      process of building, distributing, or updating software. They are often caused by vulnerabilities or malicious changes in
      third-party code, tools, or other dependencies that the system relies on." (as documented on 21 November 2026). It
      grew out of the 2013 entry "Using Components with Known Vulnerabilities", and now also covers the build and delivery
      path.

      | Term | Meaning |
      | --- | --- |
      | **Dependency** | A library or tool your code needs. **Direct** if you declared it; **transitive** if something you declared needs it. |
      | **Component** | One package at one version - the unit an SBOM lists. |
      | **SBOM** | Software bill of materials: a machine-readable list of components, their identifiers and how they depend on each other. The two common formats are **CycloneDX** (OWASP, now Ecma standard ECMA-424) and **SPDX**. |
      | **purl** | Package URL, such as `pkg:pypi/sandpay-json@1.4.0`: one identifier that names a package in any ecosystem. The Package-URL project says it "eliminates this ambiguity by creating a universal identifier with a predictable structure". |
      | **Advisory** | A published record that a package range is vulnerable. It may carry a CVE id, an ecosystem-specific id, affected ranges and a fixed version. **OSV** is an open schema for such records. |
      | **CVSS** | A score from 0.0 to 10.0 for a vulnerability's *severity*, with a vector string that shows how it was reached. |
      | **KEV** | CISA's Known Exploited Vulnerabilities catalog: CVEs with reliable evidence of exploitation in the wild. |
      | **EPSS** | Exploit Prediction Scoring System: "a data-driven machine-learning model that estimates the probability that a published CVE will be exploited in the wild in the next 30 days", a number from 0 to 1. |
      | **SCA** | Software composition analysis: the tools that build the inventory and do the matching. |
      | **Lockfile** | A file that records the exact tree an install produced - versions, sources and hashes - so the next install is identical. |
      | **Integrity hash** | A digest of the downloaded artifact, checked on install. npm stores it as `integrity`; pip checks `--hash` values. |
      | **Provenance** | Verifiable information about how an artifact was built and from what. SLSA ("salsa") describes it as "incrementally adoptable guidelines for supply chain security". |

      Two cautions on vocabulary. A **CVSS score is not a risk**: the specification says consumers "should enrich the Base metrics
      with Threat and Environmental metric values specific to their use of the vulnerable system" for a score that is a more
      comprehensive input to risk assessment. And **an SBOM is an inventory, not a verdict**: it lists what is there; it does
      not say what is vulnerable.

  - id: why
    kind: why
    concepts: [sec-sca-inventory, sec-sca-vulnerabilities, sec-sca-integrity]
    title: Why a tester cares
    body: |
      - **Most of the code is not yours.** OWASP A03:2025 lists, among the ways you are "likely vulnerable", not
        tracking "the versions of all components that you use (both client-side and server-side)", including "nested
        (transitive) dependencies", and not scanning "for vulnerabilities regularly". Those are checkable facts about a
        project, which is exactly what a tester reports.
      - **A component runs with your privileges.** The A03 page notes that components "typically run with the same
        privileges as the application itself", and names two well-known cases: CVE-2017-5638 (a Struts 2 remote code execution flaw)
        and CVE-2021-44228, "Log4Shell". A payment service that includes a vulnerable parsing library has the library's flaw.
      - **The attack can be in the delivery, not the code.** A03 describes the 2025 Shai-Hulud npm worm: malicious versions of
        popular packages "used a post-install script to harvest and exfiltrate sensitive data", found npm tokens in the victim's
        environment and used them to push more malicious versions. No vulnerability scanner matches that against an advisory
        in time; pinning, hash checks and not running install scripts where you do not need them are what limit it.
      - **The failure is quiet.** A scanner that cannot read a component reports nothing about it, and "nothing" looks the same as
        "clean". Testing the *coverage* of the inventory is as important as reading the findings.
      - **Payments raise the stakes.** SandPay's checkout sits on a payment path, so a compromised dependency is a compromise
        of that path. For what the standard itself asks of software components see
        [PCI DSS awareness](#/lesson/pci-dss-awareness) - this lesson quotes no requirement text, which needs the licence.

  - id: inventory-internals
    kind: internals
    concepts: [sec-sca-inventory]
    title: Inside an inventory - SBOM formats, identifiers and the graph
    body: |
      **CycloneDX** is JSON (or XML or protobuf). The fields this lesson uses, from the 1.7 schema: `bomFormat`
      (`"CycloneDX"`), `specVersion`, `metadata.component` (the application itself), `components[]` and `dependencies[]`.
      A component has `type`, `bom-ref` (an id that the graph points at), `name`, `version`, `supplier.name`, `purl` and
      optionally nested `components`. `dependencies[]` entries are `{"ref": ..., "dependsOn": [...]}`. The overview says
      the dependency graph "is capable of representing both direct and transitive relationships".

      **SPDX 2.3** has a different shape for the same facts: `spdxVersion` (`"SPDX-2.3"`), `SPDXID`, `packages[]` with `name`,
      `versionInfo`, `supplier` and `externalRefs[]`, and `relationships[]`. The root application is a package that the document
      `DESCRIBES`; a dependency is a `DEPENDS_ON` relationship. The package URL is not a field of its own: it sits in an
      external reference with `referenceCategory` `PACKAGE-MANAGER` and `referenceType` `purl`. SPDX also has the
      special value `NOASSERTION` ("Use NOASSERTION if the SPDX Document creator has attempted to but cannot reach a
      reasonable objective determination" - and for two other reasons), which a consumer must not mistake for a name.

      The NTIA's minimum elements for an SBOM name seven **data fields**: Supplier Name, Component Name, Version of the
      Component, Other Unique Identifiers, Dependency Relationship, Author of SBOM Data and Timestamp. For a tester the first
      four per component, and the relationships, decide whether a scanner can use the document.

      The **graph** matters because of reach. In the practice data (`sandpay-checkout`), `sandpay-http` is direct and needs
      `sandpay-json`, which is transitive; `sandpay-log` and `sandpay-template` depend on each other, a cycle. Code that walks
      the graph must stop on a cycle, and must call a component *direct* if the application depends on it directly, even when
      something else needs it too.

      **What can go wrong in the inventory itself:**

      - a component with **no purl**, so a matcher has nothing to look up (the practice data has `sandpay-template`);
      - a component with **no supplier** (`sandpay-idna`) - a gap in the minimum elements, but still matchable;
      - **nested components** missed by a parser that reads only the top level;
      - an SBOM generated from `package.json` ranges rather than the lockfile, so versions are guesses;
      - an SBOM that describes the source tree but not the **container image** or runtime that ships.

  - id: matching-internals
    kind: internals
    concepts: [sec-sca-vulnerabilities]
    title: Inside matching and triage
    body: |
      An OSV record says which versions of which package are affected. The relevant part of the schema:

      ```json
      "affected": [{
        "package": {"ecosystem": "PyPI", "name": "sandpay-json"},
        "ranges": [{"type": "SEMVER", "events": [{"introduced": "0"}, {"fixed": "1.4.2"}]}]
      }]
      ```

      The events are a timeline. `introduced` opens a range (`"0"` "sorts before any other version"), `fixed` closes it,
      `last_affected` closes it inclusively, and "only a single type ... is allowed in each event object" - so
      `{"introduced": "1.0.0", "fixed": "1.0.2"}` is invalid. A version is affected if it lies in a range: at or after
      `introduced`, **before** `fixed`. A range with no end stays open.

      Four places where matching goes wrong - each is a test case in this lesson's exercises:

      1. **Text comparison.** `"2.9.0" < "2.10.0"` is *false* as text, because `"9"` sorts after `"1"`. Version `2.9.0` is older than
         `2.10.0`, so it is affected by an advisory fixed in `2.10.0`; a string comparison says it is not. Always compare
         numbers (or use the ecosystem's own rules).
      2. **The boundary.** `fixed` is exclusive: the fixed version itself is *not* affected. `last_affected` is inclusive.
      3. **Name without ecosystem.** `sandpay-json` on PyPI and `sandpay-json` on npm are different packages. Match both the
         ecosystem and the name.
      4. **Unmatchable components.** No purl, or a package type the matcher does not know, means *no result* - not "no
         vulnerability". A good scanner reports these; a poor one is silent.

      **Ranking what is left.** Three inputs, each with a limit:

      - **CVSS severity.** The v4.0 qualitative scale maps a score to a rating: None 0.0, Low 0.1-3.9, Medium 4.0-6.9, High
        7.0-8.9, Critical 9.0-10.0. The specification calls the use of the ratings "optional" and says they "help
        organizations properly assess and prioritize". A base score says nothing about *your* use of the package.
      - **Known exploitation.** CISA's KEV catalog adds a vulnerability only when it has an assigned CVE ID, "reliable evidence that
        the vulnerability has been actively exploited in the wild" and "a clear remediation action". Being in the list is a strong
        reason to act now, whatever the score; *not* being in it proves nothing.
      - **EPSS.** A probability for the next 30 days, daily, per CVE. It predicts; it does not observe.

      Then a human adds what no number holds: is the package on a production path or only in a test tool; is the vulnerable
      function reachable from our code; is there a fixed version and does it break us? The OWASP cheat sheet says that when a
      transitive dependency is affected "the action will be taken on the direct dependency of the project because acting on a
      transitive dependency often impact the stability of the application", and that an exception in an ignore list "must only cover the CVE
      related to the vulnerability because a dependency can be impacted by several vulnerabilities".

  - id: integrity-internals
    kind: internals
    concepts: [sec-sca-integrity]
    title: Inside pinning and integrity
    body: |
      A manifest says what you *want* (`"sandpay-widgets": "^3.2.0"` - any compatible 3.x). A lockfile says what you *got*. The npm
      documentation: `package-lock.json` "describes the exact tree that was generated, such that subsequent installs are able to
      generate identical trees, regardless of intermediate dependency updates". For each package it records:

      - `version` - the exact version;
      - `resolved` - "the place where the package was actually resolved from" (a registry tarball URL, or for git "the full
        git url with commit sha");
      - `integrity` - "a sha512 or sha1 Standard Subresource Integrity string for the artifact that was unpacked in this location".

      The lockfile only protects you if the install **obeys** it. `npm ci` is "meant to be used in automated environments"; it
      needs an existing lockfile, "will exit with an error, instead of updating the package lock" if `package.json` and the lock
      disagree, and "will never write to package.json or any of the package-locks: installs are essentially frozen".
      `npm install` may update the lock. A pipeline that runs `npm install` has a lockfile as decoration.

      **pip** has the same idea under **hash-checking mode**. The pip documentation: the mode "uses local hashes, embedded in a
      requirements.txt file, to protect against remote tampering and network issues", and it is "an all-or-nothing proposition":
      "Specifying --hash against any requirement will activate this mode globally", "Hashes are required for all requirements"
      and "Requirements must be pinned (either to a URL, filesystem path or using ==)". It recommends sha256 and excludes md5, sha1 and sha224
      "to avoid giving a false sense of security".

      Things a lockfile check looks for beyond "is there a lockfile":

      - **A hash on every registry entry**, strong (this lesson's house rule: sha512 for npm, sha256 for pip).
      - **https only**, from the **intended registry host**. A tarball URL that points at an unexpected host is a mirror or a swap.
      - **Git dependencies** pinned to a full commit, never a branch name - a branch moves.
      - **Drift**: manifest and lock agree (npm ci enforces it), and the lock is committed and reviewed like code.
      - **Install scripts**: npm's `ignore-scripts` option, "If true, npm does not run scripts specified in package.json files",
        stops npm running install scripts, including the post-install script A03 describes, with a cost - some packages need
        their scripts to build.

      Hashes show the artifact is the one that was recorded, not that it is *good*. A hash cannot tell you the package you
      pinned was malicious when you first reviewed it. That is where **provenance** comes in: SLSA's Build track (Levels 1
      to 3 in the 1.2 specification) is about proving how an artifact was built; verifying it on the consumer side is a
      further step this lesson does not run.

  - id: when
    kind: when
    concepts: [sec-sca-inventory, sec-sca-vulnerabilities, sec-sca-integrity]
    title: When to use it, and what it does not replace
    body: |
      **Use dependency checks** from the first commit - the OWASP cheat sheet says automated analysis "from the birth of the
      project", because adding it late "can imply a huge amount of work". Run the inventory and match on every build, the
      match again on a schedule (advisories appear after you ship), and the pinning check on every pull request that touches a
      manifest or a lockfile.

      **What it does not replace:**

      | Need | Use instead |
      | --- | --- |
      | Flaws in your own code | [SAST](#/lesson/sast-and-secret-scanning) and code review |
      | A running app's behaviour | [DAST](#/lesson/dast-with-owasp-zap) and the manual tests in this track |
      | Whether a vulnerable function is *reachable* | Reading the code, call-graph tools, or the vendor's advisory; record it as a VEX statement if your tooling supports it |
      | Unknown or unreported flaws | Nothing in this lesson; prefer fewer, maintained dependencies |
      | Malicious packages with no advisory yet | Pinning, hashes, review of new dependencies, a private registry, install-script policy |
      | Secrets in the repository | Secret scanning |

      A scan is also a snapshot: "clean" on Monday and vulnerable on Friday is normal, because advisories are published
      about versions you already shipped.

  - id: visual-pipeline
    kind: visual
    concepts: [sec-sca-inventory, sec-sca-vulnerabilities, sec-sca-integrity]
    title: From lockfile to decision
    body: |
      ```mermaid
      flowchart LR
        M["package.json or requirements.txt<br/>(what we want)"] --> L["lockfile with versions,<br/>sources and hashes<br/>(what we got)"]
        L -- "npm ci / pip --require-hashes" --> B["build installs exactly the lock"]
        L --> S["SBOM: CycloneDX or SPDX"]
        S --> X["match: ecosystem + name + version<br/>against advisories"]
        A["advisories: OSV, CVE, vendor"] --> X
        X --> T["triage: CVSS rating, KEV, EPSS,<br/>reachability, fix available"]
        T --> G{"gate"}
        G -- "fix now" --> F["upgrade the direct dependency,<br/>test, regenerate lock and SBOM"]
        G -- "accept" --> E["scoped, time-boxed exception"]
        F --> L
      ```

      Notice the loop: a fix changes the lockfile, which changes the SBOM, which is matched again. Notice too that the
      lockfile feeds **both** the install and the SBOM - an SBOM made from the manifest instead lists ranges, not what shipped.

  - id: visual-triage
    kind: visual
    concepts: [sec-sca-vulnerabilities]
    title: The example triage policy
    body: |
      ```mermaid
      flowchart TD
        F["a finding: component matches an advisory"] --> K{"in a known-exploited list<br/>or EPSS at least 0.5?"}
        K -- "yes" --> P1["P1: fix now"]
        K -- "no" --> R{"CVSS rating"}
        R -- "Critical or High" --> P2["P2: this sprint"]
        R -- "Medium" --> P3["P3: next release"]
        R -- "Low or None" --> P4["P4: with normal upgrades"]
      ```

      This policy is the lesson's example and is deliberately small. A real programme also asks whether the package is in
      production, whether the flaw is reachable, and whether a fix exists. Notice that the first question is about the
      world (is it being exploited?), not the score: a Medium finding that attackers use outranks a Critical that nobody does.

  - id: formats-code
    kind: code
    concepts: [sec-sca-inventory, sec-sca-vulnerabilities, sec-sca-integrity]
    title: The documents, shortened
    collapsed: true
    body: |
      The same component in the two SBOM formats (shortened; the full synthetic documents are built in
      `practice/security/support/sca_fixture.py`):

      ```json
      {"bomFormat": "CycloneDX", "specVersion": "1.7",
       "metadata": {"component": {"type": "application", "bom-ref": "sandpay-checkout@4.2.0",
                                  "name": "sandpay-checkout", "version": "4.2.0"}},
       "components": [{"type": "library", "bom-ref": "pkg:pypi/sandpay-json@1.4.0", "name": "sandpay-json",
                       "version": "1.4.0", "supplier": {"name": "SandPay Open Source"},
                       "purl": "pkg:pypi/sandpay-json@1.4.0"}],
       "dependencies": [{"ref": "pkg:pypi/sandpay-http@2.3.1", "dependsOn": ["pkg:pypi/sandpay-json@1.4.0"]}]}
      ```

      ```json
      {"spdxVersion": "SPDX-2.3", "SPDXID": "SPDXRef-DOCUMENT",
       "packages": [{"SPDXID": "SPDXRef-Package-sandpay-json", "name": "sandpay-json", "versionInfo": "1.4.0",
                     "supplier": "Organization: SandPay Open Source",
                     "externalRefs": [{"referenceCategory": "PACKAGE-MANAGER", "referenceType": "purl",
                                       "referenceLocator": "pkg:pypi/sandpay-json@1.4.0"}]}],
       "relationships": [{"spdxElementId": "SPDXRef-DOCUMENT", "relationshipType": "DESCRIBES",
                          "relatedSpdxElement": "SPDXRef-Package-sandpay-checkout"},
                         {"spdxElementId": "SPDXRef-Package-sandpay-http", "relationshipType": "DEPENDS_ON",
                          "relatedSpdxElement": "SPDXRef-Package-sandpay-json"}]}
      ```

      A pip requirements file in hash-checking form (hashes shortened here; the fixture has real SHA-256 digests of made-up
      bytes), and the lockfile entry npm writes for a registry package (quoted shape, from the npm docs: `version`,
      `resolved`, `integrity`):

      ```text
      sandpay-http==2.3.1 \
          --hash=sha256:a589f320...0062e12 \
          --hash=sha256:e41ae069...fea36558
      ```

      ```json
      "node_modules/sandpay-widgets": {
        "version": "3.2.0",
        "resolved": "https://registry.npmjs.org/sandpay-widgets/-/sandpay-widgets-3.2.0.tgz",
        "integrity": "sha512-..."
      }
      ```

      From the docs, not run here: `npm ci` for a frozen install, `npm audit --audit-level=high` for a CI check (the docs
      say the option "does not filter the report output, it simply changes the failure threshold"),
      and `pip install --require-hashes -r requirements.txt` to force hash-checking mode.

  - id: python-code
    kind: code
    concepts: [sec-sca-inventory, sec-sca-vulnerabilities, sec-sca-integrity]
    title: The checks in Python
    collapsed: true
    body: |
      The three files in `practice/security/exercises/devsecops/` are what you write in the exercises below. These are
      the reference solutions, shortened. First, the inventory - both formats into one `Component` type, and the walk over
      the graph that survives a cycle:

      ```python
      def parse_cyclonedx(doc):
          if doc.get("bomFormat") != "CycloneDX":
              raise ValueError("not a CycloneDX document")
          found = [Component(c["name"], c.get("version", ""), c.get("purl", ""),
                             c.get("supplier", {}).get("name", ""))
                   for c in _walk(doc.get("components"))]          # _walk recurses into nested components
          return sorted(found, key=lambda c: (c.name, c.version))

      def transitive_closure(graph, start):
          seen, stack = set(), list(graph.get(start, []))
          while stack:
              node = stack.pop()
              if node in seen or node == start:
                  continue
              seen.add(node)
              stack.extend(graph.get(node, []))
          return seen

      def split_direct_transitive(doc):
          root = doc["metadata"]["component"]["bom-ref"]
          graph = {d["ref"]: list(d.get("dependsOn", [])) for d in doc.get("dependencies", [])}
          direct = set(graph.get(root, []))
          return sorted(direct), sorted(transitive_closure(graph, root) - direct)
      ```

      Second, the range check - numbers, an exclusive `fixed`, an inclusive `last_affected`, and one key per event:

      ```python
      def check(version, ranges):
          v = parse_version(version)                   # (2, 9, 0): numbers, never text
          for rng in ranges:
              if rng.get("type") != "SEMVER":
                  raise ValueError(f"unsupported range type: {rng.get('type')!r}")
              low = None
              for event in rng["events"]:
                  if len(event) != 1:
                      raise ValueError("an event object holds exactly one of introduced, fixed, last_affected")
                  ((kind, value),) = event.items()
                  if kind == "introduced":
                      low = (0,) if value == "0" else parse_version(value)
                  elif kind in ("fixed", "last_affected") and low is not None:
                      high = parse_version(value)
                      below = _cmp(v, high) < 0 if kind == "fixed" else _cmp(v, high) <= 0
                      if _cmp(v, low) >= 0 and below:
                          return True, value if kind == "fixed" else ""
                      low = None
              if low is not None and _cmp(v, low) >= 0:    # never closed: open for ever
                  return True, ""
          return False, ""
      ```

      Third, the pinning checks. For a requirements line, an exact `==` pin and a 64-character sha256 hash; for a lockfile entry,
      a resolved URL on https from an allowed host and a sha512 integrity string:

      ```python
      if not re.fullmatch(r"==\d+(\.\d+)*", rest):
          issues.append(Issue(where, f"{name}: not pinned to an exact version with =="))
      if not any(re.fullmatch(r"--hash=sha256:[0-9a-f]{64}", t) for t in tokens[1:]):
          issues.append(Issue(where, f"{name}: no sha256 --hash"))
      ...
      url = urlparse(resolved)
      if url.scheme != "https":
          issues.append(Issue(path, "resolved over http, not https"))
      if url.hostname not in allowed_hosts:
          issues.append(Issue(path, f"resolved from {url.hostname}, not an allowed registry"))
      ```

  - id: real-runs
    kind: code
    concepts: [sec-sca-inventory, sec-sca-vulnerabilities, sec-sca-integrity]
    title: Real output - the checks on the practice data
    body: |
      The reference solutions on the synthetic `sandpay-checkout` data, run on 21 November 2026. First, both SBOM formats give
      the same inventory (8 components; `-` marks a value the document does not have):

      ```text
      8 8 True
      sandpay-crypto         0.9.2   pkg:pypi/sandpay-crypto@0.9.2        SandPay Open Source
      sandpay-http           2.3.1   pkg:pypi/sandpay-http@2.3.1          SandPay Open Source
      sandpay-idna           2.9.0   pkg:pypi/sandpay-idna@2.9.0          -
      sandpay-json           1.4.0   pkg:pypi/sandpay-json@1.4.0          SandPay Open Source
      sandpay-log            3.1.0   pkg:pypi/sandpay-log@3.1.0           SandPay Open Source
      sandpay-template       5.0.1   -                                    SandPay Open Source
      sandpay-widgets        3.2.0   pkg:npm/sandpay-widgets@3.2.0        SandPay Open Source
      sandpay-widgets-core   1.0.3   pkg:npm/sandpay-widgets-core@1.0.3   SandPay Open Source
      direct     ['pkg:npm/sandpay-widgets@3.2.0', 'pkg:pypi/sandpay-crypto@0.9.2', 'pkg:pypi/sandpay-http@2.3.1', 'pkg:pypi/sandpay-log@3.1.0']
      transitive ['pkg:npm/sandpay-widgets-core@1.0.3', 'pkg:pypi/sandpay-idna@2.9.0', 'pkg:pypi/sandpay-json@1.4.0', 'sandpay-template@5.0.1']
      {'sandpay-idna@2.9.0': ['supplier'], 'sandpay-template@5.0.1': ['purl']}
      ```

      Matching against the seven synthetic advisories gives four findings. `SPSA-2026-0002` and `-0005` do not apply (the version is
      fixed; the shipped `sandpay-log` 3.1.0 *is* the fixed version), and `-0006` names an npm package that shares only the name
      with our PyPI `sandpay-json`. Then the triage with the made-up exploitation data:

      ```text
      Finding(advisory_id='SPSA-2026-0001', name='sandpay-json', version='1.4.0', fixed_in='1.4.2', score=9.1)
      Finding(advisory_id='SPSA-2026-0003', name='sandpay-crypto', version='0.9.2', fixed_in='', score=5.9)
      Finding(advisory_id='SPSA-2026-0004', name='sandpay-widgets-core', version='1.0.3', fixed_in='1.0.10', score=6.1)
      Finding(advisory_id='SPSA-2026-0007', name='sandpay-idna', version='2.9.0', fixed_in='2.10.0', score=3.7)
      ('P1', 'SPSA-2026-0003', 'sandpay-crypto')
      ('P2', 'SPSA-2026-0001', 'sandpay-json')
      ('P3', 'SPSA-2026-0004', 'sandpay-widgets-core')
      ('P4', 'SPSA-2026-0007', 'sandpay-idna')
      ```

      The Medium finding `-0003` (score 5.9, no fixed version) is P1 because the pretend exploited list names it; the Critical
      `-0001` is P2. And why the range check compares numbers - the same two versions, sorted as text and as numbers:

      ```text
      ['2.10.0', '2.9.0'] ['2.9.0', '2.10.0']
      (True, '2.10.0')
      ```

      The pinning checks on the deliberately bad files (the line numbers are where each requirement starts; a requirement can
      give two issues):

      ```text
      line 2 | sandpay-log: no sha256 --hash
      line 2 | sandpay-log: not pinned to an exact version with ==
      line 3 | sandpay-crypto: not pinned to an exact version with ==
      line 4 | sandpay-idna: no sha256 --hash
      line 4 | sandpay-idna: not pinned to an exact version with ==
      line 5 | sandpay-template: no sha256 --hash
      node_modules/a-plain-http | resolved over http, not https
      node_modules/b-other-host | resolved from mirror.sandpay.example, not an allowed registry
      node_modules/c-no-integrity | no integrity hash
      node_modules/d-sha1 | integrity is not sha512
      node_modules/e-git-branch | git dependency not pinned to a commit
      node_modules/g-no-resolved | no resolved URL
      ```

      Finally the lockfile check on a real file - this repository's own `package-lock.json` (lockfileVersion 3):

      ```text
      lockfileVersion 3 entries 459
      issues 0
      ```

      All 459 entries (none of them links) have a resolved URL on `registry.npmjs.org` over https and a sha512 integrity string. That says the lock is
      well formed under this lesson's rules. It does **not** say the 459 packages are free of known vulnerabilities - that needs
      the matching step and an advisory source, which this lesson did not run against the real tree.

  - id: line-by-line
    kind: line-by-line
    concepts: [sec-sca-inventory, sec-sca-vulnerabilities, sec-sca-integrity]
    title: Why the important lines are written that way
    body: |
      | Line | Why |
      | --- | --- |
      | `yield from _walk(comp.get("components"))` | CycloneDX allows components nested inside components. A parser that reads only the top level silently drops them - an incomplete inventory that looks complete. |
      | `if pkg["SPDXID"] in described: continue` | The package the document `DESCRIBES` is the application itself, not a dependency. Listing it would make the application a component of itself. |
      | `ref["referenceType"] == "purl"` | SPDX has no purl field; it hides in an external reference. A parser that looks for a top-level `purl` finds none and reports every component as unmatchable. |
      | `if node in seen or node == start: continue` | Dependency graphs have cycles (`sandpay-log` and `sandpay-template`). Without the `seen` set the walk never ends. |
      | `direct = set(graph.get(root, []))` and `everything - direct` | "Direct" means the application depends on it itself. A component needed by both is direct, so the fix target is clear. |
      | `parse_version` raising `ValueError` | `"1.4.2rc1"` is not a plain numeric version. Raising is honest; guessing would produce wrong matches. |
      | `_cmp` padding with zeros | `1.4` and `1.4.0` are the same version. Tuples of different length would compare unequal. |
      | `(0,) if value == "0"` | OSV's `"0"` means "before everything". It is a marker, not a version to compare as 0.0.0 text. |
      | `kind == "fixed"` uses `<`, `last_affected` uses `<=` | `fixed` is the first good version, so it is excluded; `last_affected` is the last bad version, so it is included. |
      | `if low is not None and ...: return True, ""` after the loop | A range that was introduced and never closed has no fix yet. Dropping it hides the worst case - affected, nothing to upgrade to. |
      | `pkg["ecosystem"] != ecosystem or pkg["name"] != name` | Both must match. A name alone confuses PyPI with npm. |
      | `except ValueError: continue` in `find_findings` | A component the matcher cannot read is *skipped*, which is why the SBOM gap report matters - it is the only place that silence shows up. |
      | `epss.get(f.advisory_id, 0.0)` | A missing EPSS value is "unknown", treated as the lowest value so a gap cannot raise a priority by accident. |
      | `re.fullmatch(r"==\d+(\.\d+)*", rest)` | An exact pin only. `>=`, `~=`, `==1.*` and a bare name all let the install drift. |
      | `--hash=sha256:[0-9a-f]{64}` | A real sha256 digest is 64 hex characters. `md5` and short strings do not count - pip excludes weak algorithms too. |
      | `if resolved.startswith("git+"): ... continue` | A git dependency is identified by its commit, so the check needs a 40-hex commit, not an integrity string. |
      | `url.hostname not in allowed_hosts` | An unexpected host is a swap or a mirror nobody approved. The allow-list is a parameter so a team can add its private mirror on purpose. |

  - id: steps
    kind: steps
    concepts: [sec-sca-inventory, sec-sca-vulnerabilities, sec-sca-integrity]
    title: A dependency security review, step by step
    body: |
      1. **Agree scope and ethics.** Which repositories, which environments, which registries. Written permission, and where
         the SBOM may be stored.
      2. **Collect the evidence.** The manifest, the lockfile, the CI install command, and an SBOM (or generate one *from the lockfile*).
      3. **Check inventory coverage.** Count components in the lockfile and in the SBOM; they should match. Look for nested
         and transitive components, missing versions, missing purls, missing suppliers. Is the container image or runtime
         covered?
      4. **Check pinning.** Every manifest entry resolved in the lock; every lock entry has `resolved` on https from the
         intended registry and a strong `integrity`; git dependencies name a commit; requirements files are `==` pinned and hashed.
      5. **Check that the build obeys the lock.** Find the install command in CI. `npm ci`, not `npm install`; `pip install
         --require-hashes`. A lock that the pipeline ignores is not a control.
      6. **Match against advisories.** Use the project's SCA tool and at least one independent source; compare the two results for
         differences. Record the data date.
      7. **Triage each finding.** Production path or not, reachable or not, CVSS rating, known-exploited, EPSS, fixed version.
         Assign a priority and an owner.
      8. **Fix at the right level.** Upgrade the *direct* dependency that pulls the vulnerable one; test; regenerate the lock and the
         SBOM; re-scan. If there is no fix, record a mitigation and a scoped, time-boxed exception.
      9. **Report with evidence.** Component, version, advisory id, rating, how you confirmed it applies, and the fix.
      10. **Turn it into a regression check.** A pinning check and a scan gate in CI so the next change cannot undo it (see
          [Security testing in CI/CD](#/lesson/security-testing-in-ci-cd)).

  - id: example
    kind: example
    concepts: [sec-sca-inventory, sec-sca-vulnerabilities, sec-sca-integrity]
    title: Worked example - the SandPay checkout release
    body: |
      *This is a made-up scenario on the synthetic data; the advisories are not real.* The release candidate of `sandpay-checkout`
      4.2.0 has a CycloneDX SBOM from the build and a PyPI requirements file.

      1. **Coverage.** The SBOM lists 8 components. The lockfile for the Python side lists 6, and the npm lock 2. They match. Two gaps:
         `sandpay-template` has no purl and `sandpay-idna` no supplier. The first is serious - no matcher can look it up.
         The tester raises it with the build team and asks for the generator to be fixed, not for the field to be filled by hand.
      2. **Pinning.** The requirements file pins `sandpay-http` with `==` and hashes, but `sandpay-log>=3.0` has no pin and no hash.
         Under pip hash-checking mode that line would fail the install; the pipeline runs plain `pip install -r`, so it does not
         notice. Finding: the lock is not enforced.
      3. **Matching.** Four findings: `sandpay-json` 1.4.0 (fixed in 1.4.2), `sandpay-crypto` 0.9.2 (no fix),
         `sandpay-widgets-core` 1.0.3 and `sandpay-idna` 2.9.0. The tester checks `-0007` by hand: the advisory is fixed in `2.10.0`
         and the shipped version is `2.9.0`, which is older - a string comparison would have said "fixed".
      4. **Triage.** The (pretend) exploited list names `-0003`, so `sandpay-crypto` is P1 even though its score is only 5.9, and
         it has no fixed version: the mitigation is to stop using the weak default nonce source and track a replacement. `sandpay-json`
         is P2 and fixed by upgrading `sandpay-http`'s requirement to a release that pulls `sandpay-json` 1.4.2 - the tester asks
         for the direct dependency to change, not a pin on the transitive one.
      5. **Regression.** The team adds the pinning check and the match to CI. The next pull request that adds an unpinned
         requirement fails with the exact line.

  - id: tests
    kind: tests
    concepts: [sec-sca-inventory, sec-sca-vulnerabilities, sec-sca-integrity]
    title: Test cases for a dependency review
    body: |
      | Case | Steps | Expected | Evidence |
      | --- | --- | --- | --- |
      | SBOM completeness | Count components in lockfile and SBOM | Equal; nested and transitive included | Both counts, a diff of names |
      | Missing identifier | List components without purl | None, or each explained | The component list |
      | Direct vs transitive | Walk the graph from the root | Each finding has a path from a direct dependency | The path |
      | Format agreement | Generate CycloneDX and SPDX from the same lock | Same set of name and version | The two lists |
      | Version boundary | Check the fixed version and the one before it | Fixed: clean; before: affected | Both results |
      | Numeric compare | `2.9.0` against a fix in `2.10.0` | Affected | The result and the advisory |
      | Same name, other ecosystem | Match a PyPI and an npm package of one name | Only the right ecosystem matches | The two results |
      | Exploited beats score | A Medium flaw in a known-exploited list | Higher priority than an unexploited Critical | The triage table |
      | Pinning | Lint requirements and lockfile | No unpinned, unhashed, http or unexpected-host entry | The issue list |
      | Drift | Change a version in the manifest only; run the CI install | The install fails (`npm ci`) | The CI log |
      | Gate | Add a known-bad version on a branch | The pipeline fails at the agreed threshold | The failed run |
      | Negative control | Run every check on the known-good fixture | No findings | The empty result |

  - id: mistakes
    kind: mistakes
    concepts: [sec-sca-inventory, sec-sca-vulnerabilities, sec-sca-integrity]
    title: Common mistakes and a debugging method
    body: |
      - **Treating "no findings" as "secure".** It means no known advisory in the data used matched the components the tool could
        read. Report the inventory coverage, the data date and what was skipped.
      - **Comparing versions as text.** `2.9.0` against `2.10.0` is the classic. Use numbers, or the ecosystem's rules.
      - **Matching a name without the ecosystem.** Same name, different package.
      - **Scanning the manifest instead of the lockfile.** Ranges are not versions; you scan what you *might* get.
      - **Fixing a transitive dependency by pinning it.** It can break the direct dependency; upgrade the direct dependency.
        An override is a stopgap with an owner and an end date.
      - **A broad ignore.** Ignoring a whole package hides the next CVE. Scope the exception to the one advisory, and give it an expiry.
      - **Ranking by CVSS alone.** The base score is severity in general, not risk to you; add exploitation and reachability.
      - **A lockfile that the pipeline does not use.** `npm install` can rewrite it; plain `pip install -r` does not check hashes.
      - **Unhashed lines in a hashed file.** Under pip hash-checking mode "Hashes are required for all requirements" - one gap
        is an error, not a warning.
      - **Trusting a hash as a safety proof.** It shows the artifact matches what was recorded. If the recorded one was malicious, the
        hash matches the malice.
      - **Uploading an SBOM to a public service.** It maps your system for an attacker.

      **Debugging method for a finding that looks wrong:** (1) find the exact version in the lockfile, not the manifest;
      (2) find the advisory and read its `affected` ranges and ecosystem; (3) compare the version by hand, as numbers;
      (4) check the identifier (purl) the tool used; (5) rerun a second tool or source and diff; (6) record which side was wrong
      and add the case to the test suite.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [sec-sca-inventory, sec-sca-vulnerabilities, sec-sca-integrity]
    title: Trade-offs and alternatives
    body: |
      | Choice | Benefit | Cost |
      | --- | --- | --- |
      | Strict pins and hashes everywhere | Reproducible, tamper-evident installs | Updates need a deliberate step; more review work |
      | Automated update pull requests | Fixes arrive quickly | Noise; every update needs tests you trust |
      | Failing the build on any finding | Nothing known ships | Blocks releases on flaws that are unreachable; teams learn to bypass |
      | Failing only above a threshold (`npm audit --audit-level`) | Fewer blocks | Lower findings pile up unless a schedule clears them |
      | One SBOM format | Simple tooling | Customers or tools may ask for the other; both can be generated from the same data |
      | Fewer dependencies | Smaller attack surface (A03 advises "removing unused dependencies") | Reinventing code has its own bugs |
      | Private registry or mirror | One place to scan, approve and block | Another system to secure and keep up to date |
      | Disabling install scripts | Limits what a malicious package can do at install time | Some packages need scripts to build |

      Alternatives and extras: for a flaw with no fix, A03 suggests "a virtual patch to monitor, detect, or protect against the
      discovered issue" (the cheat sheet calls its wrapper example a temporary mitigation); the SLSA Build track for provenance; signing and verification of artifacts. These raise the cost of an
      attack; none removes the need for the inventory.

  - id: summary
    kind: summary
    concepts: [sec-sca-inventory, sec-sca-vulnerabilities, sec-sca-integrity]
    title: Quick reference
    body: |
      - Three practices: **inventory** (SBOM from the lockfile), **match and triage**, **pin and verify**.
      - Direct vs transitive: fix the direct dependency; a component needed twice is still direct.
      - SBOM gaps are findings: no purl means no match; no version means no range check.
      - Match on **ecosystem + name + version**; compare **numbers**; `fixed` is exclusive; `last_affected` inclusive.
      - CVSS rating scale: None 0.0, Low 0.1-3.9, Medium 4.0-6.9, High 7.0-8.9, Critical 9.0-10.0. Severity, not risk.
      - Known exploited beats score; EPSS predicts the next 30 days; reachability and fix availability are human calls.
      - A clean scan = no known advisory in the data used matched what the tool could read. Say what was skipped.
      - `npm ci` obeys the lock and fails on drift; pip hash-checking is all or nothing and needs `==` pins.
      - Check https, the intended registry host, sha512 or sha256 hashes, and commits for git dependencies.
      - Scope exceptions to one advisory with an expiry; regenerate the lock and SBOM after every fix.
      - Never upload an SBOM to a public service; treat it as internal.

exercises:
  - id: sca-direct-fix
    type: mcq
    concept: sec-sca-inventory
    skill: application
    title: Where do you fix it?
    prompt: |
      A scan reports `sandpay-json` 1.4.0 as vulnerable (fixed in 1.4.2). You never declared `sandpay-json`; the SBOM
      shows `sandpay-http` 2.3.1 depends on it. What is the best fix?
    options:
      - id: direct
        text: "Upgrade `sandpay-http` to a release that depends on a fixed `sandpay-json`, test, then regenerate the lock and SBOM."
        feedback: "Correct. The OWASP cheat sheet says to act on the direct dependency, because acting on a transitive one often hurts stability."
      - id: pin
        text: "Add `sandpay-json==1.4.2` to your requirements and ship."
        feedback: "An override can work as a stopgap, but it forces a version `sandpay-http` was not tested with. It needs an owner and an end date, and it is not the first choice."
      - id: ignore
        text: "Ignore the finding - you did not choose that package."
        feedback: "The component runs in your process with your privileges whether you chose it or not."
      - id: delete
        text: "Delete the finding from the SBOM."
        feedback: "That hides the evidence, and the package is still installed."
    correct: [direct]
    hints:
      - Who asked for `sandpay-json`?
      - What did the cheat sheet say about transitive dependencies?
    solution: |
      The fix target is the direct dependency that pulls the vulnerable one: upgrade `sandpay-http`, run the tests, regenerate the
      lockfile and SBOM and scan again. A pin on the transitive package is an interim step, recorded with an owner and an
      expiry date.

  - id: sca-no-purl
    type: mcq
    concept: sec-sca-inventory
    skill: analysis
    title: A silent gap
    prompt: |
      Your scanner prints "0 vulnerabilities". The SBOM it read has 40 components, and 3 of them have no `purl` and no `cpe`. What can
      you conclude?
    options:
      - id: gap
        text: "The result covers at most 37 components. The other 3 could not be matched, so the scan says nothing about them."
        feedback: "Correct. A component with no identifier is skipped, and a skipped component looks the same as a clean one."
      - id: clean
        text: "All 40 components are free of known vulnerabilities."
        feedback: "Only the components the tool could identify were checked."
      - id: broken
        text: "The scanner is broken and the result is invalid."
        feedback: "It may be working as designed. The gap is in the SBOM, and it is what you report."
      - id: low
        text: "The 3 components must be low risk because the tool ignored them."
        feedback: "Ignored means unchecked, not low risk."
    correct: [gap]
    hints:
      - How does a matcher look a component up?
      - What does "0 findings" mean for a component that was never looked up?
    solution: |
      The tool can only match what it can identify. Report "0 findings for 37 identifiable components; 3 unmatched" and ask the build
      to emit identifiers. Confirm by listing the components with an empty `purl`.

  - id: sca-minimum
    type: mcq
    concept: sec-sca-inventory
    skill: recall
    title: The minimum elements
    prompt: |
      Which of these is **not** one of the seven data fields in the NTIA's minimum elements for an SBOM?
    options:
      - id: licence
        text: The licence of each component
        feedback: "Correct - licence is not among the seven. The fields are Supplier Name, Component Name, Version, Other Unique Identifiers, Dependency Relationship, Author of SBOM Data and Timestamp."
      - id: supplier
        text: The supplier name
        feedback: "Supplier Name is one of the seven."
      - id: relationship
        text: The dependency relationship
        feedback: "Dependency Relationship is one of the seven."
      - id: timestamp
        text: The timestamp of the SBOM
        feedback: "Timestamp is one of the seven."
    correct: [licence]
    hints:
      - Think about what a vulnerability match needs.
    solution: |
      The seven fields are Supplier Name, Component Name, Version of the Component, Other Unique Identifiers, Dependency Relationship,
      Author of SBOM Data and Timestamp. Licence data is useful for compliance but is not one of the minimum elements.

  - id: sca-version-order
    type: mcq
    concept: sec-sca-vulnerabilities
    skill: application
    title: Is 2.9.0 affected?
    prompt: |
      An advisory says `{"introduced": "2.0.0"}, {"fixed": "2.10.0"}` for a package. You ship version `2.9.0`. Is it affected?
    options:
      - id: yes
        text: "Yes - 2.9.0 is at least 2.0.0 and older than 2.10.0, when compared as numbers."
        feedback: "Correct. Compared as numbers, 9 is less than 10."
      - id: no-text
        text: "No - as text, \"2.9.0\" sorts after \"2.10.0\", so it is already fixed."
        feedback: "That is the text-comparison bug: \"9\" sorts after \"1\", but the versions are numbers."
      - id: no-fixed
        text: "No - 2.9.0 is within a major version of the fix."
        feedback: "Nothing in the range rule works that way. Only the events decide."
      - id: unknown
        text: "Unknown - the advisory has no versions list."
        feedback: "The range events are enough for a SEMVER range."
    correct: [yes]
    hints:
      - Which is bigger, 9 or 10?
    solution: |
      Compare each dot-separated part as a number: (2, 9, 0) is at least (2, 0, 0) and below (2, 10, 0), so it is affected and the
      fix is 2.10.0. Confirm by running the check on both versions on either side of the boundary.

  - id: sca-ecosystem
    type: mcq
    concept: sec-sca-vulnerabilities
    skill: analysis
    title: Same name, different package
    prompt: |
      An advisory is for npm package `sandpay-json` below `9.9.9`. Your project has PyPI package `sandpay-json` 1.4.0. The scanner flags it.
      What is the likely cause, and what should it have done?
    options:
      - id: name-only
        text: "It matched on the name alone. It should match the ecosystem and the name."
        feedback: "Correct. PyPI and npm are different namespaces; one name can be two unrelated packages."
      - id: version
        text: "It compared 1.4.0 with 9.9.9 wrongly."
        feedback: "1.4.0 is below 9.9.9, so the version check passes. The mismatch is the ecosystem."
      - id: right
        text: "It is right - a vulnerable name is a vulnerable package everywhere."
        feedback: "A package is identified by ecosystem and name together."
      - id: cve
        text: "It should have waited for a CVE id."
        feedback: "An advisory does not need a CVE id; the ecosystem and name are the key."
    correct: [name-only]
    hints:
      - Where does a package name live?
    solution: |
      A false positive from matching the name alone. The affected entry carries `package.ecosystem` and `package.name`; compare both. Confirm
      with the purl: `pkg:pypi/...` and `pkg:npm/...` are different packages.

  - id: sca-kev-vs-score
    type: mcq
    concept: sec-sca-vulnerabilities
    skill: analysis
    title: Which first?
    prompt: |
      Two findings. A: CVSS 9.8, no sign of exploitation, EPSS 0.01. B: CVSS 5.9, listed in a known-exploited catalog. Under the lesson's
      example policy, which is fixed first, and why?
    options:
      - id: b
        text: "B - it is exploited in the wild, which outranks the score."
        feedback: "Correct. Known exploitation is the first question; the score only ranks the rest."
      - id: a
        text: "A - 9.8 is Critical."
        feedback: "CVSS is severity in general, not the chance of attack on you."
      - id: both
        text: "Both are equal - fix them in the order found."
        feedback: "The point of triage is to use exploitation data to order the work."
      - id: neither
        text: "Neither - a score under 7 is not worth fixing."
        feedback: "A known-exploited flaw is worth fixing at any score."
    correct: [b]
    hints:
      - What is the first question in the triage diagram?
    solution: |
      B is P1 (exploited) and A is P2 (Critical). Exploitation evidence is the strongest signal; the score and EPSS rank the rest. Both still get
      fixed - this is an order, not a filter.

  - id: sca-clean-scan
    type: mcq
    concept: sec-sca-vulnerabilities
    skill: analysis
    title: What does "clean" prove?
    prompt: |
      Monday's scan was clean. A new advisory is published on Thursday for a package you shipped on Monday. Which statement is right?
    options:
      - id: snapshot
        text: "Monday's scan was correct for the data it had; the package is now known to be affected, so scan on a schedule too."
        feedback: "Correct. A scan is a snapshot of known advisories on a date."
      - id: wrong
        text: "Monday's scan was wrong."
        feedback: "It matched everything known on Monday."
      - id: never
        text: "Scanning only at build time is enough - the build has not changed."
        feedback: "The advisory data changed, not the build."
      - id: ignore
        text: "A package that scanned clean cannot become vulnerable."
        feedback: "Advisories are published about versions already in use."
    correct: [snapshot]
    hints:
      - Did the package change, or the knowledge about it?
    solution: |
      Advisories appear after release. Rerun the match against fresh data on a schedule, using the stored SBOM, so a new advisory is found
      without rebuilding. Confirm by rescanning Monday's SBOM with Thursday's data.

  - id: sca-npm-ci
    type: mcq
    concept: sec-sca-integrity
    skill: application
    title: npm install or npm ci?
    prompt: |
      A pipeline runs `npm install` before the tests. A developer changes a version range in `package.json` and forgets to update the
      lockfile. What happens, and what should the pipeline run?
    options:
      - id: ci
        text: "`npm install` can update the lock and carry on. `npm ci` would exit with an error because the lock and `package.json` disagree."
        feedback: "Correct. The npm docs say npm ci errors instead of updating the lock, and never writes to package.json or the lockfile."
      - id: same
        text: "Both behave the same; the lockfile always wins."
        feedback: "npm install may change the lock; npm ci does not."
      - id: fail
        text: "`npm install` fails on drift."
        feedback: "That is `npm ci`. `npm install` resolves and may rewrite the lock."
      - id: remove
        text: "Delete the lockfile in CI so versions are fresh."
        feedback: "That removes reproducibility and the integrity hashes."
    correct: [ci]
    hints:
      - Which command is "meant to be used in automated environments"?
    solution: |
      Use `npm ci` in automation: it needs a lockfile, fails on a mismatch and never rewrites it, so the build installs exactly what was
      reviewed. Confirm in the CI log which command actually ran.

  - id: sca-pip-hashes
    type: mcq
    concept: sec-sca-integrity
    skill: analysis
    title: Some lines hashed
    prompt: |
      A requirements file has `--hash=sha256:...` on four lines and none on a fifth line `sandpay-log==3.1.0`. What does pip do?
    options:
      - id: error
        text: "Hash-checking mode turns on for the whole install, and the unhashed requirement is an error."
        feedback: "Correct. The pip docs say specifying --hash on any requirement activates the mode globally, and hashes are required for all requirements."
      - id: skip
        text: "It checks the four hashed lines and skips the fifth."
        feedback: "That only happens with --no-require-hashes. By default it is all or nothing."
      - id: warn
        text: "It installs everything and prints a warning."
        feedback: "Hash-checking mode refuses unhashed requirements."
      - id: md5
        text: "It computes an md5 for the fifth line."
        feedback: "pip does not invent hashes; it excludes md5 as weak."
    correct: [error]
    hints:
      - The docs call hash-checking "an all-or-nothing proposition".
    solution: |
      The mode is global once any requirement has a hash, so the unhashed `sandpay-log` is an error. That is the behaviour you want: a
      partly hashed file lets bad code in through the unhashed line.

  - id: sca-audit-level
    type: mcq
    concept: sec-sca-vulnerabilities
    skill: recall
    title: What does --audit-level change?
    prompt: |
      A CI job runs `npm audit --audit-level=high`. The report lists a moderate and a high vulnerability. What does the option do?
    options:
      - id: threshold
        text: "It only changes the exit code: the job fails because of the high one, and the report still lists both."
        feedback: "Correct. The npm docs say the option does not filter the report output, it changes the failure threshold."
      - id: filter
        text: "It hides the moderate vulnerability from the report."
        feedback: "The docs say it does not filter the report output."
      - id: fix
        text: "It fixes the high vulnerability automatically."
        feedback: "That is `npm audit fix`, a different command."
      - id: ignore
        text: "It makes the job ignore all vulnerabilities."
        feedback: "It sets the minimum level that causes a non-zero exit code."
    correct: [threshold]
    hints:
      - Report output and exit code are two different things.
    solution: |
      `--audit-level` sets the minimum level that gives a non-zero exit code; the report is unchanged. Lower findings still need a schedule so
      they are cleared. This is quoted from the docs, not run here.

  - id: sca-order
    type: order
    concept: sec-sca-vulnerabilities
    skill: application
    title: Handle a vulnerable dependency in order
    prompt: Put the steps of handling one scanner finding in a sensible order.
    items:
      - id: confirm
        text: Confirm the exact version in the lockfile and the path from a direct dependency
      - id: match
        text: Check the advisory's ecosystem, name and affected range against that version
      - id: rank
        text: Rank it with the CVSS rating, known exploitation, EPSS and reachability
      - id: fix
        text: Upgrade the direct dependency on a branch and run the tests
      - id: rescan
        text: Regenerate the lockfile and SBOM and scan again
      - id: exception
        text: If no fix exists, record a mitigation and a scoped, time-boxed exception
    hints:
      - You cannot rank a finding you have not confirmed.
      - The re-scan proves the fix; the exception is for when there is no fix.
    solution: |
      Confirm the version and path, check the advisory really applies, rank it, fix the direct dependency, regenerate the lock and SBOM and
      re-scan, and only if no fix exists record an exception scoped to that advisory with an end date.

  - id: sca-debug
    type: debug
    concept: sec-sca-vulnerabilities
    skill: analysis
    title: Which line makes the check miss a flaw?
    prompt: |
      This function decides whether a version is affected. It says `2.9.0` is NOT affected by a fix in `2.10.0`. Pick the line that is wrong.
    language: python
    code: |
      def is_affected(version, introduced, fixed):
          # all three are version strings such as "2.9.0"
          return introduced <= version < fixed
    correctLines: [3]
    hints:
      - What type are the values being compared?
      - Which is greater as text, "2.9.0" or "2.10.0"?
    lineNotes:
      - line: 1
        note: The signature is fine; the problem is what the body does with the strings.
      - line: 2
        note: The comment says the values are strings - which is the clue to the bug.
    solution: |
      Line 3 compares strings, and `"2.9.0" < "2.10.0"` is false as text. Parse each version into a tuple of integers first, then compare
      the tuples, treating `fixed` as exclusive.

  - id: sca-short
    type: short
    concept: sec-sca-vulnerabilities
    skill: analysis
    title: A clean report
    prompt: |
      A teammate says: "The scan is clean, so our dependencies are secure." Write a few sentences on what a clean scan does and does not show.
    modelAnswer: |
      A clean scan shows that none of the advisories in the data the tool used match the components it could identify, on the day it ran.
      It does not cover components with no identifier or an unsupported package type (they are skipped, which looks the same as clean),
      flaws with no advisory yet, malicious packages that have no advisory, or anything in our own code. It also goes stale: advisories are
      published for versions already shipped, so the same SBOM can be vulnerable next week.

      I would report the inventory coverage (how many components were identifiable), the data date, and the skipped components, keep
      the SBOM so it can be re-matched on a schedule, and add pinning and integrity checks so what we scanned is what we ship.
    rubric:
      - States that a clean scan covers only identifiable components, against the advisories known on that date.
      - Names at least two things it misses (unidentified components, unknown flaws, malicious packages, own code).
      - Says what to report or do next (coverage and data date, re-scan on a schedule, pinning).
    hints:
      - What does a scanner do with a component it cannot identify?
      - Does the advisory list change over time?
    solution: A clean scan means no known advisory matched the identifiable components on that day; it misses unidentified components, unknown flaws and bad packages, and it goes stale.

  - id: sca-testdesign
    type: testdesign
    concept: sec-sca-integrity
    skill: application
    title: Test plan for the SandPay checkout dependencies
    prompt: |
      SandPay's checkout service ships a Python backend (requirements file) and a web front end (npm). Design a dependency security test
      plan - preconditions, steps, expected result and evidence for each check.
    modelAnswer: |
      Preconditions: written scope for the repositories and the CI system, read access to the manifests, lockfiles, the CI configuration
      and the build's SBOM, a place to store the SBOM that is not public, and agreement on the advisory sources and the date of the data.

      1. **Coverage** - count components in each lockfile and in the SBOM. Expected: equal, nested and transitive included. Evidence: both
         counts and a diff of names.
      2. **Identifiers** - list components with no purl, version or supplier. Expected: none, or each explained. Evidence: the list.
      3. **Python pinning** - lint the requirements file. Expected: every line `==` pinned with a sha256 hash. Evidence: the issue list
         with line numbers.
      4. **npm lock** - lint the lockfile. Expected: every entry has https `resolved` on the intended registry host and a sha512
         `integrity`; git dependencies name a commit. Evidence: the issue list.
      5. **Install obeys the lock** - read the CI install commands and make a deliberate drift on a branch. Expected: the install fails
         (`npm ci`, `pip --require-hashes`). Evidence: the CI log of the failing run.
      6. **Matching** - match the SBOM against two advisory sources. Expected: the same findings, and each difference explained.
         Evidence: both result sets and the data dates.
      7. **Boundaries** - check the fixed version and the one before it, a version like `2.9.0` against `2.10.0`, and a same-name package in
         another ecosystem. Expected: correct hits and no false positive. Evidence: the results.
      8. **Triage** - for each finding record production use, reachability, CVSS rating, known-exploited status, EPSS and the fix.
         Expected: every finding has an owner and a priority. Evidence: the triage table.
      9. **Gate** - add a known-bad version on a branch. Expected: the pipeline fails at the agreed threshold. Evidence: the failed run.
      10. **Negative control** - run steps 3, 4 and 7 on a known-good fixture. Expected: no findings.
    rubric:
      - Starts from scope, evidence and agreed advisory sources.
      - Checks coverage and identifiers, not only findings.
      - Checks pinning and hashes on both ecosystems and that the CI install obeys the lock.
      - Covers matching boundaries and triage with more than the CVSS score.
      - Every case has preconditions, steps, an expected result and evidence, and includes a negative control.
    hints:
      - What would you check before reading a single finding?
      - How do you prove that the pipeline obeys the lock?
    solution: |
      Coverage and identifiers first; pinning and hash lint for both ecosystems; prove the install obeys the lock with a deliberate drift;
      match against two sources and test the boundaries; triage with exploitation and reachability; a gate; a negative control.

  - id: sca-interview
    type: interview
    concept: sec-sca-vulnerabilities
    skill: analysis
    title: 'Interview: a critical CVE in a transitive dependency'
    prompt: '"A scanner reports a critical vulnerability in a library our service never imports directly. What do you do?"'
    modelAnswer: |
      First I confirm it is real and applies. I find the exact version in the lockfile and the path from a direct dependency in the SBOM,
      check that the advisory's ecosystem, name and affected range really cover that version (comparing numbers, not text), and note
      the data date.

      Then I triage. Critical is the CVSS severity, so I add whether it is known to be exploited, the EPSS probability, whether the package is
      on a production path and whether the vulnerable function is reachable from our code. A known-exploited flaw jumps the queue.

      For the fix I act on the direct dependency that pulls it in: upgrade it, run the tests, regenerate the lockfile and the SBOM and re-scan.
      A pin on the transitive package is only a stopgap with an owner and an end date. If there is no fixed version, I look for a workaround,
      limit exposure, record a mitigation and a time-boxed exception scoped to that one advisory, and track a replacement.

      Afterwards I make sure it cannot come back: the pinning check and the scan run in CI, and the SBOM is re-matched on a schedule because
      new advisories appear after release.
    rubric:
      - Confirms the finding first (exact version, path, ecosystem and name, range) before acting.
      - Triages with exploitation, EPSS, reachability and production use, not only the CVSS score.
      - Fixes the direct dependency, regenerates the lock and SBOM and re-scans; treats a transitive pin as a stopgap.
      - Handles the no-fix case with a mitigation and a scoped, time-boxed exception.
    followUps:
      - How would you decide whether the vulnerable function is reachable?
      - What if the fix needs a major upgrade that breaks the service?
      - How do you make sure the SBOM you scan is the one that shipped?
    hints:
      - Structure it as confirm, triage, fix, no-fix path, regression.
    solution: Confirm version and path, triage with exploitation and reachability, upgrade the direct dependency and re-scan, scope any exception, and add CI checks.

  - id: inventory-code
    type: coding
    concept: sec-sca-inventory
    skill: application
    title: Read two SBOM formats into one inventory
    prompt: |
      In `practice/security/exercises/devsecops/sca_inventory.py`, implement `parse_cyclonedx`, `parse_spdx`, `transitive_closure`,
      `split_direct_transitive` and `minimum_gaps`. The tests read the synthetic CycloneDX and SPDX documents, expect the same inventory
      from both, walk a graph that has a cycle, and report components missing a supplier, version or package identifier.
    project: security
    files: [exercises/devsecops/sca_inventory.py]
    test: tests/devsecops/test_sca_inventory.py
    command: .venv/bin/python -m pytest tests/devsecops/test_sca_inventory.py
    modelAnswer: |
      ```python
      def _walk(items):
          for comp in items or []:
              yield comp
              yield from _walk(comp.get("components"))          # nested components, any depth

      def transitive_closure(graph, start):
          seen, stack = set(), list(graph.get(start, []))
          while stack:
              node = stack.pop()
              if node in seen or node == start:                 # a cycle ends here
                  continue
              seen.add(node)
              stack.extend(graph.get(node, []))
          return seen

      direct = set(graph.get(root, []))
      return sorted(direct), sorted(transitive_closure(graph, root) - direct)
      ```

      For SPDX, collect the ids the document `DESCRIBES` and skip them, read the purl from the external reference whose `referenceType` is
      `purl`, and turn `NOASSERTION` into an empty supplier.
    rubric:
      - Every test in tests/devsecops/test_sca_inventory.py passes.
      - CycloneDX parsing recurses into nested components and leaves out metadata.component.
      - The SPDX parser skips the described package and reads the purl from externalRefs.
      - The graph walk terminates on a cycle and a direct dependency is never listed as transitive.
      - minimum_gaps lists the missing fields in the order supplier, version, purl.
    hints:
      - Write a small recursive generator for nested components first.
      - Keep a `seen` set in the graph walk.
      - SPDX hides the purl in an external reference.
    solution: Recurse through nested components, skip the SPDX described package, read purl from externalRefs, walk the graph with a seen set, subtract direct from the closure.

  - id: match-code
    type: coding
    concept: sec-sca-vulnerabilities
    skill: application
    title: Match components against advisories and rank them
    prompt: |
      In `practice/security/exercises/devsecops/sca_match.py`, implement `parse_version`, `check`, `ecosystem_of`, `find_findings`,
      `rating`, `priority` and `triage`. The tests cover the boundaries (`fixed` exclusive, `last_affected` inclusive, an open range), the
      numeric order of `2.9.0` and `2.10.0`, a same-name package in another ecosystem, components that cannot be matched, the CVSS v4.0
      rating scale and the example priority policy.
    project: security
    files: [exercises/devsecops/sca_match.py]
    test: tests/devsecops/test_sca_match.py
    command: .venv/bin/python -m pytest tests/devsecops/test_sca_match.py
    modelAnswer: |
      ```python
      def parse_version(text):
          if not re.fullmatch(r"\d+(\.\d+)*", text):
              raise ValueError(f"not a plain numeric version: {text!r}")
          return tuple(int(part) for part in text.split("."))

      # inside check(): numbers, an exclusive fixed, an inclusive last_affected
      below = _cmp(v, high) < 0 if kind == "fixed" else _cmp(v, high) <= 0
      if _cmp(v, low) >= 0 and below:
          return True, value if kind == "fixed" else ""

      def priority(score, in_kev, epss):
          if in_kev or epss >= 0.5:
              return "P1"
          return {"Critical": "P2", "High": "P2", "Medium": "P3"}.get(rating(score), "P4")
      ```

      Compare ecosystem and name together in `find_findings`, and skip a component whose purl is empty or unsupported.
    rubric:
      - Every test in tests/devsecops/test_sca_match.py passes.
      - Versions are compared as numbers with trailing zeros ignored, never as text.
      - A fixed version is not affected and last_affected is; a range that was never closed stays open.
      - Matching needs both ecosystem and name, and unmatchable components are skipped rather than reported clean.
      - The rating boundaries and the P1 to P4 policy are exactly as specified.
    hints:
      - Turn each version into a tuple of integers before comparing.
      - Pad the shorter tuple with zeros so 1.4 equals 1.4.0.
      - A range never closed has no `fixed` event - return an empty fixed version.
    solution: Parse versions into integer tuples, walk the events with exclusive fixed and inclusive last_affected, match ecosystem and name, then rate and prioritise.

  - id: pinning-code
    type: coding
    concept: sec-sca-integrity
    skill: application
    title: Lint a requirements file and an npm lockfile
    prompt: |
      In `practice/security/exercises/devsecops/sca_pinning.py`, implement `check_requirements` and `check_lockfile`. The tests give a clean
      and a deliberately bad requirements file and lockfile, and expect an issue with the exact reason for each missing `==` pin, missing
      or weak hash, plain http, unexpected registry host, missing integrity, unpinned git branch and missing resolved URL.
    project: security
    files: [exercises/devsecops/sca_pinning.py]
    test: tests/devsecops/test_sca_pinning.py
    command: .venv/bin/python -m pytest tests/devsecops/test_sca_pinning.py
    modelAnswer: |
      ```python
      if not re.fullmatch(r"==\d+(\.\d+)*", rest):
          issues.append(Issue(where, f"{name}: not pinned to an exact version with =="))
      if not any(re.fullmatch(r"--hash=sha256:[0-9a-f]{64}", t) for t in tokens[1:]):
          issues.append(Issue(where, f"{name}: no sha256 --hash"))

      # lockfile entry
      if resolved.startswith("git+"):
          if not re.search(r"#[0-9a-f]{40}$", resolved):
              issues.append(Issue(path, "git dependency not pinned to a commit"))
          continue
      url = urlparse(resolved)
      if url.scheme != "https":
          issues.append(Issue(path, "resolved over http, not https"))
      if url.hostname not in allowed_hosts:
          issues.append(Issue(path, f"resolved from {url.hostname}, not an allowed registry"))
      ```

      Join `\` continuation lines and strip comments before splitting a requirement, and skip option lines such as `--index-url`.
    rubric:
      - Every test in tests/devsecops/test_sca_pinning.py passes.
      - An exact `==` pin and a 64-character sha256 hash are both required; md5 and short hashes do not count.
      - Continuation lines, comments and option lines are handled and the reported line is where the requirement starts.
      - Lockfile entries are checked for resolved, https, an allowed host and a sha512 integrity string.
      - Git dependencies need a 40-character commit and links and the root entry are skipped.
    hints:
      - Build "logical lines" first - join the `\` continuations.
      - Use fullmatch so `==1.*` does not slip through.
      - urllib.parse.urlparse gives you the scheme and hostname.
    solution: Join continuation lines, require an exact == pin and a sha256 hash per requirement, and check each lock entry for resolved, https, allowed host, sha512 and a commit for git.

placement:
  - id: place-inventory
    type: mcq
    concept: sec-sca-inventory
    skill: analysis
    title: Is the SBOM usable?
    prompt: |
      An SBOM lists 120 components. A quick parse finds 95. Looking at the JSON you see many components under a `components` key inside
      other components. What is the most likely cause, and what is the consequence?
    options:
      - id: nested
        text: "The parser reads only the top level and misses nested components, so the inventory is incomplete and findings for those packages are missed."
        feedback: "Correct. CycloneDX allows nested components; a flat read drops them without any error."
      - id: fine
        text: "Nothing - nested components are duplicates of the top-level ones."
        feedback: "They are additional components, not duplicates."
      - id: format
        text: "The document is invalid CycloneDX."
        feedback: "Nesting is allowed by the specification."
      - id: tool
        text: "The vulnerability database is out of date."
        feedback: "That would change the matches, not the number of components parsed."
    correct: [nested]
    solution: A flat parse silently drops nested components. Count components in the lockfile and in the SBOM and make the parser recurse.

  - id: place-triage
    type: mcq
    concept: sec-sca-vulnerabilities
    skill: application
    title: Which finding is first?
    prompt: |
      Under a policy that puts known-exploited flaws first, then Critical and High, then the rest: finding X is CVSS 9.1 and not exploited;
      finding Y is CVSS 4.3 and in the known-exploited list; finding Z is CVSS 7.4 and not exploited. What is the order?
    options:
      - id: yxz
        text: "Y, then X, then Z."
        feedback: "Correct. Y is exploited so it is first; X (9.1) and Z (7.4) are both Critical or High and follow, with the higher score first."
      - id: xzy
        text: "X, then Z, then Y."
        feedback: "That orders by score alone and puts an exploited flaw last."
      - id: xyz
        text: "X, then Y, then Z."
        feedback: "Y is exploited, so it outranks both unexploited findings."
      - id: zyx
        text: "Z, then Y, then X."
        feedback: "Nothing in the policy puts the lowest score of the Critical and High group first."
    correct: [yxz]
    solution: Exploitation first (Y), then the severity groups by score (X, Z).

  - id: place-integrity
    type: mcq
    concept: sec-sca-integrity
    skill: application
    title: Which line passes hash-checking mode?
    prompt: |
      Which requirement line satisfies pip hash-checking mode?
    options:
      - id: pinned
        text: "`pkg==1.2.3 --hash=sha256:<64 hex characters>`"
        feedback: "Correct. It is pinned with == and has a sha256 hash."
      - id: range
        text: "`pkg>=1.2 --hash=sha256:<64 hex characters>`"
        feedback: "A hash does not fix an unpinned version; requirements must be pinned."
      - id: nohash
        text: "`pkg==1.2.3`"
        feedback: "Pinned, but hashes are required for all requirements once the mode is on."
      - id: md5
        text: "`pkg==1.2.3 --hash=md5:<32 hex characters>`"
        feedback: "pip excludes md5 as too weak."
    correct: [pinned]
    solution: Hash-checking mode needs an exact pin and a strong hash on every requirement.

recall:
  - id: recall-three
    concept: sec-sca-inventory
    prompt: What are the three practices of dependency security?
    answer: Inventory (an SBOM built from the lockfile), matching and triage (against advisories, ranked), and pinning and integrity (install exactly the reviewed lock with hashes).
  - id: recall-gap
    concept: sec-sca-inventory
    prompt: Why is a component with no purl a finding?
    answer: A matcher has no identifier to look up, so it skips the component and the result looks clean. The gap is the only visible sign of the silence.
  - id: recall-direct
    concept: sec-sca-inventory
    prompt: Where do you fix a vulnerable transitive dependency?
    answer: Upgrade the direct dependency that pulls it in, test, regenerate the lock and SBOM, re-scan. A pin on the transitive package is a stopgap with an owner and an end date.
  - id: recall-range
    concept: sec-sca-vulnerabilities
    prompt: How do OSV range events decide if a version is affected?
    answer: At or after introduced and before fixed (exclusive); last_affected is inclusive; a range never closed stays open. Compare numbers, not text, and match ecosystem and name.
  - id: recall-cvss
    concept: sec-sca-vulnerabilities
    prompt: What is the CVSS v4.0 qualitative scale and what does a score not tell you?
    answer: None 0.0, Low 0.1-3.9, Medium 4.0-6.9, High 7.0-8.9, Critical 9.0-10.0. It is severity in general, not risk to you - add exploitation, EPSS and reachability.
  - id: recall-clean
    concept: sec-sca-vulnerabilities
    prompt: What does a clean scan prove?
    answer: Only that no known advisory in the data used matched the components the tool could identify, on that day.
  - id: recall-lock
    concept: sec-sca-integrity
    prompt: What do npm ci and pip hash-checking mode enforce?
    answer: npm ci needs a lockfile, errors if it disagrees with package.json and never rewrites it. pip hash-checking is all or nothing - every requirement pinned with == and hashed.

