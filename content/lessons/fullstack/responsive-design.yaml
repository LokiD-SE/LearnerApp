id: responsive-design
title: Responsive, mobile-first design
subject: fullstack
module: web-platform
level: beginner
status: published
estimatedMinutes: 55
summary: Make one page work from a 320-pixel phone to a wide desktop - the viewport meta tag, mobile-first media queries, fluid units, container queries and responsive images - and test it at real device sizes and zoom levels.
tags:
  [
    responsive design,
    mobile-first,
    media queries,
    viewport,
    meta viewport,
    clamp,
    rem,
    vw,
    dvh,
    container queries,
    srcset,
    sizes,
    picture,
    reflow,
    zoom,
    device mode,
    playwright viewport,
  ]

environment: |
  - **Standards (W3C CSS Working Group, free at [w3.org/TR](https://www.w3.org/TR/)):**
    [Media Queries Level 4](https://www.w3.org/TR/mediaqueries-4/) (Candidate Recommendation Draft) - media
    features, the **range syntax** `(400px <= width <= 700px)` and the `min-`/`max-` prefixes;
    [Media Queries Level 5](https://www.w3.org/TR/mediaqueries-5/) (Working Draft) - the user-preference
    features `prefers-reduced-motion` and `prefers-color-scheme`;
    [CSS Values and Units Level 4](https://www.w3.org/TR/css-values-4/) (Working Draft) - `rem`, `vw`/`vh`,
    the small, large and dynamic viewport units (`svh`, `lvh`, `dvh`) and `clamp()`;
    [CSS Containment Level 3](https://www.w3.org/TR/css-contain-3/) and
    [CSS Conditional Rules Level 5](https://www.w3.org/TR/css-conditional-5/) (Working Drafts) - container
    queries, `container-type` and `@container`; [CSS Viewport Level 1](https://www.w3.org/TR/css-viewport-1/)
    (First Public Working Draft) - the layout and visual viewport.
  - **HTML:** the WHATWG HTML Living Standard,
    [Images](https://html.spec.whatwg.org/multipage/images.html) and
    [Embedded content](https://html.spec.whatwg.org/multipage/embedded-content.html) - `srcset`, `sizes`,
    `picture` and `source`. The `srcset`/`sizes` examples follow the standard's own examples.
  - **Accessibility:** [WCAG 2.2](https://www.w3.org/TR/WCAG22/) success criteria **1.4.4 Resize Text** and
    **1.4.10 Reflow** (both level AA).
  - **Guides:** MDN Web Docs -
    [Responsive design](https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/CSS_layout/Responsive_Design),
    [the viewport meta tag](https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/meta/name/viewport),
    [Container queries](https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Containment/Container_queries)
    and [Responsive images](https://developer.mozilla.org/en-US/docs/Web/HTML/Guides/Responsive_images).
  - **Tools:** Chrome DevTools
    [device mode](https://developer.chrome.com/docs/devtools/device-mode) (its width presets 320, 375, 425,
    768, 1024, 1440 and 2560 px are Chrome's); [Playwright emulation](https://playwright.dev/docs/emulation) -
    the device sizes quoted (`Pixel 7` 412 × 839, `iPhone 13` 390 × 664) were read from **Playwright 1.64**'s
    `devices` list and change between versions.
  - **Support:** the features taught here are in current versions of the major browsers. Specifications
    that are still drafts can change, so check MDN's compatibility tables against the browsers **your**
    users have before relying on the newest ones (`scroll-state` containers, `prefers-reduced-data`).
  - **Examples:** the SandPay Demo Shop and this app are the project's own; their snippets are quoted from
    `practice/shop` and `src/ui/styles.css`. Other CSS and HTML excerpts are illustrative, not complete pages.

prerequisites:
  - css-layout-flexbox-grid

concepts:
  - id: viewport-and-mobile-first-queries
    name: The viewport and mobile-first media queries
    summary: The viewport meta tag makes a phone lay the page out at its own width; mobile-first CSS writes the narrow layout as the default and adds wider layouts with min-width (or width >=) media queries, while user-preference queries respect motion and colour-scheme settings.
  - id: fluid-units-and-container-queries
    name: Fluid units and container queries
    summary: Relative units (rem, %, vw, dvh) and clamp() let sizes scale between limits without breakpoints, and container queries let a component adapt to the space its container gives it rather than to the whole viewport.
  - id: responsive-images
    name: Responsive images
    summary: srcset with width descriptors plus sizes lets the browser pick the right file for the layout width and screen density; picture with source media is for art direction - a different image at different sizes.
  - id: responsive-testing
    name: Testing responsive layouts
    summary: Check layouts at real device widths, at 200% and 400% zoom (WCAG 1.4.4 and 1.4.10), in both orientations and with user preferences on - in device mode for speed and on real devices for confidence.

objectives:
  - Explain what the viewport meta tag changes on a phone, and why `user-scalable=no` and `maximum-scale` must not be used.
  - Write mobile-first CSS with media queries in the right cascade order, including the Media Queries 4 range syntax and user-preference queries.
  - Choose between `rem`, `%`, `vw`, `dvh`, `clamp()` and container queries for a given sizing problem, and justify the choice.
  - Write an `img` with `srcset` and `sizes`, and a `picture` for art direction, and predict which file a browser can choose.
  - Design a responsive test plan with device widths, zoom levels, orientation and user preferences, and the evidence for each case.

sections:
  - id: intuition
    kind: intuition
    concepts: [viewport-and-mobile-first-queries, fluid-units-and-container-queries]
    title: The idea in plain language
    body: |
      Think of water poured into different glasses. The water takes the shape of whatever holds it - a tall
      narrow glass or a wide bowl - without being re-made for each one. A responsive page is the water: **one
      HTML document and one style sheet** that take the shape of the screen they land on.

      Two habits make that work:

      - **Start with the narrowest glass.** Design the phone layout first - one column, big tap targets, the
        essential content - and **add** layout as space appears. This is _mobile-first_. It is easier to add
        columns than to squeeze a desktop page into a phone.
      - **Let things flow instead of fixing them.** Widths in percentages, text in `rem`, a heading that grows
        smoothly between two limits. Then you need only a few **breakpoints** - the widths where the layout
        really changes - rather than one for every phone model.

      Images follow the same idea: the page offers several sizes of a picture, and the **browser** picks the
      smallest one that still looks sharp on that screen.

  - id: what
    kind: what
    concepts: [viewport-and-mobile-first-queries, fluid-units-and-container-queries, responsive-images]
    title: What the parts are called
    body: |
      | Term | Meaning | Defined in |
      |---|---|---|
      | **Viewport** | the area the page is laid out in and shown through | CSS Viewport 1 |
      | **Layout viewport** | the area used to lay the page out - what `width` in a media query and `vw` refer to | CSS Viewport 1 |
      | **Visual viewport** | the part the user actually sees right now - smaller than the layout viewport while zoomed in | CSS Viewport 1 |
      | **Viewport meta tag** | `<meta name="viewport" content="width=device-width, initial-scale=1">` - tells a mobile browser to lay out at the device's width | HTML, CSS Viewport 1, MDN |
      | **Media query** | a condition about the device or user - `(width >= 48em)`, `(prefers-color-scheme: dark)` - that applies CSS only when true | Media Queries 4 and 5 |
      | **Breakpoint** | a width where your layout changes, chosen from the **content**, not from phone models | (practice, not a standard term) |
      | **Mobile-first** | the narrow layout is the default CSS; wider layouts are added with `min-width` / `width >=` queries | (practice) |
      | **CSS pixel** | the unit `px` means - not a device pixel. A phone with a device pixel ratio of 3 uses 3 × 3 device pixels for one CSS pixel | CSS Values 4 |
      | **Relative units** | `rem` (the root element's font size), `%`, `vw`/`vh` (1% of the viewport's width/height), `svh`/`lvh`/`dvh` (small, large and dynamic viewport) | CSS Values 4 |
      | **`clamp(MIN, VAL, MAX)`** | the middle value, kept between a minimum and a maximum | CSS Values 4 |
      | **Container query** | `@container (width > 30em)` - a condition about the size of an **ancestor container**, not the viewport | CSS Containment 3 / Conditional 5 |
      | **`srcset` and `sizes`** | the candidate image files with their widths (`800w`), and how wide the image will be shown at each layout | WHATWG HTML |
      | **`picture` / `source media`** | different images (not just sizes) for different conditions - _art direction_ | WHATWG HTML |

  - id: why
    kind: why
    concepts: [viewport-and-mobile-first-queries, responsive-testing]
    title: Why it matters
    body: |
      - **Most visits are on phones**, and many on small, old or low-powered ones. A checkout that needs
        sideways scrolling or pinch-zoom loses orders.
      - **Without the viewport meta tag, phones pretend to be desktops.** MDN describes it: mobile browsers
        render a page in a **virtual viewport wider than the screen** - its example is a 980 px viewport shrunk
        onto a 640 px screen - so non-mobile pages "look better". For a page designed for phones this makes
        everything tiny, and your media queries see a width of 980, not the phone's.
      - **Accessibility is a requirement, not a polish.** WCAG 2.2 **1.4.4 Resize Text** (AA): text can be
        resized up to **200%** without losing content or functionality. **1.4.10 Reflow** (AA): content works
        without scrolling in two dimensions at a width equivalent to **320 CSS pixels** - which is what a
        1280 px wide desktop window shows at **400% zoom**. A responsive layout is how you pass both.
      - **Wasted bytes cost users money and time.** Sending a 1600-pixel hero image to a 390-pixel phone on
        mobile data is slow and, for many users, paid for.

  - id: internals-viewport
    kind: internals
    concepts: [viewport-and-mobile-first-queries]
    title: How the viewport and media queries work underneath
    body: |
      **The viewport meta tag.** The recommended value (the one this app and the SandPay Demo Shop use) is:

      ```html
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      ```

      `width=device-width` makes the **layout viewport** as wide as the device's screen in CSS pixels - 390 on
      many current phones - so `(width >= 48em)` and `100vw` mean what you expect. MDN notes that
      `initial-scale=1` is common but usually unnecessary. When you **zoom in**, the layout viewport stays
      the same and the **visual viewport** shrinks: you now see part of the page. That is why zooming in
      does not re-lay the page out on a phone, but zooming in a **desktop** browser does - desktop zoom makes
      CSS pixels bigger, so the layout viewport gets narrower in CSS pixels and media queries change.

      **Never block zoom.** `user-scalable=no` and `maximum-scale=1` stop people with low vision zooming in.
      MDN warns against it and notes that iOS 10 and later ignores these by default anyway. This app has an
      end-to-end test that fails if either appears.

      **Media queries.** A media query is true or false; CSS inside it applies only while it is true, and it
      is re-evaluated when the viewport changes (rotating a phone, resizing a window, desktop zoom). Rules
      inside a media query have **no extra specificity** - when two rules tie, the one **later in the style
      sheet wins**, which is why the order of your queries matters.

      Media Queries 4 lets **range** features (such as `width`) be written two ways:

      ```css
      @media (min-width: 48em) { /* ... */ }        /* prefix syntax: width >= 48em */
      @media (width >= 48em) { /* ... */ }          /* range syntax, same meaning */
      @media (400px <= width <= 700px) { /* ... */ } /* a range - example from the specification */
      ```

      An `em` in a media query is relative to the **initial** font size (usually 16 px, or what the user set),
      not to your CSS - so `48em` breakpoints move with the user's font-size setting. That is a reason to
      prefer `em` over `px` for breakpoints.

      **User preferences** (Media Queries 5) - discrete features with keyword values:

      | Feature | Values | Use it to |
      |---|---|---|
      | `prefers-reduced-motion` | `no-preference`, `reduce` | turn off or shorten animations, parallax and auto-scrolling for people who asked their system to minimise motion |
      | `prefers-color-scheme` | `light`, `dark` | offer a dark theme (this app's `styles.css` switches its colour tokens this way) |
      | `pointer` (MQ4) | `none`, `coarse`, `fine` | bigger tap targets for touch - this app sets `min-height: 44px` on links under `(pointer: coarse)` |

  - id: internals-fluid
    kind: internals
    concepts: [fluid-units-and-container-queries]
    title: Fluid sizes and container queries
    body: |
      **Which unit for what.**

      | Unit | Relative to | Good for |
      |---|---|---|
      | `rem` | the root (`html`) element's font size | font sizes, spacing - follows the user's font-size setting |
      | `em` | the element's own font size | padding that should grow with a button's text |
      | `%` | the containing block (for widths) | fluid columns, `max-width: 100%` on media |
      | `ch` | the width of the "0" character | readable line length: `max-width: 70ch` |
      | `vw` / `vh` | 1% of the viewport's width / height | full-bleed sections, part of a fluid formula |
      | `svh` / `lvh` / `dvh` | the small / large / dynamic viewport | full-screen panels on phones whose browser bars slide in and out |
      | `cqi` / `cqw` | 1% of the query container's inline size / width | sizes inside a component, relative to its container |

      **The mobile `100vh` problem.** On phones, the browser's address bar appears and disappears as you
      scroll. CSS Values 4 defines three viewport sizes for this: the **small** viewport (bars shown - `svh`
      is stable and "safer"), the **large** viewport (bars hidden - `lvh`), and the **dynamic** viewport
      (`dvh`, which changes as the bars move). Plain `vh` is defined against the **large** viewport, so
      `100vh` can be hidden behind the bars. `height: 100svh` makes a panel fit even with the bars shown.

      **`clamp()`.** The specification: it "takes three calculations - a minimum value, a central value, and
      a maximum value - and represents its central calculation, clamped according to its min and max", and
      the minimum wins if they conflict. This app's page title uses it:

      ```css
      h1 { font-size: clamp(1.6rem, 1.2rem + 1.6vw, 2.2rem); }
      ```

      The heading grows with the viewport (`1.6vw`) but never below `1.6rem` or above `2.2rem`. Keeping a
      `rem` part in the middle value matters: a size made **only** of `vw` does not grow when the user
      zooms or enlarges text, which can fail WCAG 1.4.4.

      **Container queries.** A media query asks about the **viewport**. But a product card may sit in a wide
      main column on one page and in a narrow sidebar on another - at the same viewport width. A container
      query asks about the **container**:

      ```css
      .card-slot { container-type: inline-size; container-name: card; }

      .product-card { display: grid; gap: 0.5rem; }               /* narrow: stacked */
      @container card (width > 30em) {
        .product-card { grid-template-columns: 8rem 1fr; }         /* wide: image beside text */
      }
      ```

      `container-type: inline-size` makes the element a **query container** for its inline size (width in
      horizontal writing). The query matches the nearest ancestor container (here, the one named `card`), and
      the `em` in the condition is relative to that container's font size. A container cannot query **its
      own** size, only its descendants can - so put `container-type` on a wrapper, not on the card itself.

  - id: internals-images
    kind: internals
    concepts: [responsive-images]
    title: How the browser chooses an image
    body: |
      **Same picture, different sizes** - `srcset` with **width descriptors** and `sizes` (the WHATWG
      standard's own example, slightly shortened):

      ```html
      <img
        srcset="swing-200.jpg 200w, swing-400.jpg 400w, swing-800.jpg 800w, swing-1600.jpg 1600w"
        sizes="(max-width: 30em) 100vw, (max-width: 50em) 50vw, calc(33vw - 100px)"
        src="swing-400.jpg"
        alt="Kettlebell swing"
      />
      ```

      - `srcset` lists files and their **real pixel widths** (`800w` = the file is 800 pixels wide).
      - `sizes` says how wide the image will be **displayed**: the first media condition that is true wins;
        the last entry, without a condition, is the default. At a 29em-wide viewport, `(max-width: 30em)` is
        true, so the image is shown at `100vw` = 29em.
      - The browser divides each width by the display size to get each file's **density**, then chooses one
        for the screen's pixel ratio. The standard leaves the final choice to the browser (it may, for
        example, prefer a smaller file on a slow connection), so you **predict** what it can choose rather
        than force it.
      - The HTML standard says that when `srcset` uses width descriptors, `sizes` **must** be present - the
        browser needs it before the CSS has loaded, because image downloads start early. The only exception
        is `sizes="auto"` on a lazily loaded image (`loading="lazy"`).
      - `src` is the fallback for very old browsers and also takes part in the choice.

      **Different picture** - art direction with `picture`:

      ```html
      <picture>
        <source media="(min-width: 45em)" srcset="large.jpg" />
        <source media="(min-width: 32em)" srcset="med.jpg" />
        <img src="small.jpg" alt="The wolf runs through the snow." />
      </picture>
      ```

      The browser uses the **first** `source` whose `media` matches; the `img` is required and supplies the
      `alt` text and the fallback. Use `picture` when the **content** of the image should change - a tight
      crop on phones - not merely its resolution. Give `width` and `height` attributes (or CSS
      `aspect-ratio`) so the browser reserves space before the image loads and the page does not jump.

  - id: visual
    kind: visual
    concepts: [viewport-and-mobile-first-queries, fluid-units-and-container-queries]
    title: "Flowchart: which tool for which responsive problem"
    body: |
      Start from the problem, not from a list of devices. Notice that a breakpoint is the **last** resort,
      after fluid sizing has done what it can.

      ```mermaid
      flowchart TD
          A[Something looks wrong at some width] --> B{Is the meta viewport tag present?}
          B -- No --> B1[Add width=device-width - everything else depends on it]
          B -- Yes --> C{Does it only need to scale smoothly?}
          C -- Yes --> C1["Fluid units: %, rem, max-width, clamp()"]
          C -- No --> D{Does it depend on the component's own space?}
          D -- Yes --> D1["Container query on a wrapper: container-type inline-size"]
          D -- No --> E{Does the whole page layout change?}
          E -- Yes --> E1["Media query, mobile-first: (width >= Nem), placed after the base rules"]
          E -- No --> F{Is it an image?}
          F -- Same picture --> F1[img srcset with w descriptors + sizes]
          F -- Different crop --> F2[picture with source media]
      ```

  - id: steps
    kind: steps
    concepts: [viewport-and-mobile-first-queries, fluid-units-and-container-queries, responsive-images]
    title: Step by step - build a page mobile-first
    body: |
      1. **Add the viewport meta tag** - `width=device-width, initial-scale=1`, nothing that blocks zoom.
      2. **Write the base CSS for the narrowest screen** (320 CSS px): one column, no fixed widths, text in
         `rem`, `img { max-width: 100%; height: auto; }`, tap targets about 44 px on touch screens.
      3. **Make sizes fluid** - `clamp()` for headings and page padding (this app pads its main column with
         `clamp(1rem, 4vw, 2rem)`), `max-width: 70ch` for readable text.
      4. **Widen the window slowly** (DevTools device mode, responsive) and watch the **content**. Where it
         starts to look stretched or empty - the line is too long, a second column would fit - that is a
         **breakpoint**. Add a `min-width` / `width >=` query **after** the base rules, in `em`.
      5. **Make components container-aware** where they appear in places of different widths: a wrapper with
         `container-type: inline-size` and an `@container` rule.
      6. **Serve images responsively** - `srcset` + `sizes` for photos, `picture` for different crops, `width`
         and `height` attributes to avoid layout shift.
      7. **Respect preferences** - `prefers-reduced-motion: reduce` turns off animation;
         `prefers-color-scheme` if you offer a dark theme.
      8. **Test** at device widths, at 200% and 400% zoom, in both orientations and on at least one real phone
         (next sections).

  - id: example
    kind: example
    concepts: [viewport-and-mobile-first-queries, responsive-testing]
    title: "Real-world example: this app's lesson layout"
    body: |
      The page you are reading is built this way. From `src/ui/styles.css` (trimmed):

      ```css
      .lesson-aside { display: grid; gap: 1rem; align-content: start; }

      @media (min-width: 980px) {
        .lesson-grid { grid-template-columns: 300px minmax(0, 1fr); }
        .lesson-aside { position: sticky; top: 4.5rem; }
      }

      @media (pointer: coarse) {
        .outline-row a { min-height: 44px; }
      }
      ```

      - **Mobile-first:** the base rules give one column; from 980 px the course outline moves into a
        sticky sidebar beside the lesson.
      - `minmax(0, 1fr)` lets the main column shrink below its content's width, so a wide code block or
        diagram scrolls **inside** its box instead of pushing the whole page sideways.
      - **Touch:** on coarse pointers, outline links get a 44 px minimum height.

      It is checked by an end-to-end test that runs at a 390 × 844 mobile viewport and at 1280 × 860:

      ```typescript
      const viewport = await page.locator('meta[name="viewport"]').getAttribute('content');
      expect(viewport).not.toMatch(/maximum-scale|user-scalable\s*=\s*no/);
      const overflow = await page.evaluate(() => document.documentElement.scrollWidth - window.innerWidth);
      expect(overflow).toBeLessThanOrEqual(1);
      ```

      Two cheap, automatable checks: **zoom is never blocked**, and the page is **never wider than the
      viewport** (no horizontal page scroll). A responsive bug that would otherwise be found by a user
      squinting at a phone fails the build instead.

  - id: code-testing
    kind: code
    concepts: [responsive-testing]
    title: Tools - DevTools device mode and Playwright viewports
    collapsed: true
    body: |
      **Chrome DevTools device mode** (Toggle device toolbar, `Ctrl+Shift+M` / `Cmd+Shift+M`): pick a device
      or set any width; the width presets bar has Mobile S 320, Mobile M 375, Mobile L 425, Tablet 768, Laptop
      1024, Laptop L 1440 and 4K 2560 px. **More options → Show media queries** draws your breakpoints as bars
      above the page - click one to jump to that width. Chrome's documentation calls device mode "a
      first-order approximation": it does **not** run your code on a phone, so real touch, real browser bars
      and real performance still need a device. See [Browser DevTools for testers](#/lesson/browser-devtools-for-testers).

      **Playwright** - a project per viewport, or a device descriptor:

      ```typescript
      // playwright.config.ts (illustrative excerpt)
      import { defineConfig, devices } from '@playwright/test';

      export default defineConfig({
        projects: [
          { name: 'desktop', use: { viewport: { width: 1280, height: 860 } } },
          { name: 'phone', use: { ...devices['Pixel 7'] } }, // 412 x 839, touch, mobile, Chromium
          { name: 'small', use: { viewport: { width: 320, height: 640 }, isMobile: true, hasTouch: true } },
        ],
      });
      ```

      ```typescript
      // a test that checks reflow and a preference (illustrative)
      import { test, expect } from '@playwright/test';

      test('checkout reflows at 320 px without sideways scroll', async ({ page }) => {
        await page.setViewportSize({ width: 320, height: 640 });
        await page.goto('/checkout.html');
        const overflow = await page.evaluate(
          () => document.documentElement.scrollWidth - window.innerWidth,
        );
        expect(overflow).toBeLessThanOrEqual(1);
        await expect(page.getByRole('button', { name: 'Pay' })).toBeInViewport({ ratio: 1 });
      });

      test('no animation when the user prefers reduced motion', async ({ page }) => {
        await page.emulateMedia({ reducedMotion: 'reduce' });
        await page.goto('/');
        // assert that the animated element has no running animation, for example with getAnimations()
      });
      ```

      `page.emulateMedia` also takes `colorScheme: 'dark'`. Device descriptors change between Playwright
      versions - print `devices['Pixel 7']` in yours rather than trusting a number from a blog.

  - id: tests
    kind: tests
    concepts: [responsive-testing, viewport-and-mobile-first-queries, responsive-images]
    title: Positive and negative test cases
    body: |
      For the SandPay Demo Shop's checkout page (`practice/shop/checkout.html`):

      | ID | Condition | Expected | Evidence |
      |---|---|---|---|
      | P1 | 320 × 640, portrait | one column, every field and the Pay button usable, no sideways page scroll | screenshot; `scrollWidth - innerWidth <= 1` |
      | P2 | each breakpoint ± 1 px (for example 767 and 768) | the layout switches once, cleanly, at the intended width | screenshots either side |
      | P3 | desktop 1280 px at **400% zoom** (= 320 CSS px) | reflows to one column, no two-way scrolling (WCAG 1.4.10) | screenshot at 400% |
      | P4 | text-only zoom **200%** (browser font-size setting) | nothing cut off or overlapping (WCAG 1.4.4) | screenshot |
      | P5 | rotate phone portrait → landscape mid-form | layout adapts; **typed values are kept** | recording |
      | P6 | `prefers-reduced-motion: reduce` | no processing animation or a non-moving alternative | recording, or `getAnimations()` is empty |
      | P7 | 3× density phone | product images sharp; Network panel shows a large-enough file, not the 4× largest | Network panel (file name, size) |
      | N1 | viewport meta tag removed (a build or template mistake) | test fails: layout viewport 980 px on a phone, tiny text | automated check of the meta tag |
      | N2 | `user-scalable=no` added | test fails - zoom must stay possible | automated check (as in this app) |
      | N3 | a long unbroken string (an order id, a URL, an email) at 320 px | wraps or scrolls inside its box, page does not widen | screenshot |
      | N4 | on-screen keyboard open on a phone | the focused field and the Pay button are not hidden behind it | real-device screenshot |

      N4 and real touch behaviour need a **real device** - device mode cannot open a keyboard.

  - id: mistakes
    kind: mistakes
    concepts: [viewport-and-mobile-first-queries, fluid-units-and-container-queries, responsive-images, responsive-testing]
    title: Common mistakes and how to debug them
    body: |
      - **Missing meta viewport.** The page "looks like a tiny desktop page" on phones and your media queries
        never fire. Check `<head>` first.
      - **Blocking zoom** with `user-scalable=no` or `maximum-scale=1` - an accessibility failure.
      - **Breakpoints for devices** ("iPhone = 390") instead of for content. New phones arrive every year;
        your content does not change.
      - **Queries in the wrong order.** Mobile-first `min-width` rules must go from small to large; a
        `(min-width: 40em)` rule placed **after** a `(min-width: 64em)` rule overrides it on wide screens,
        because later wins when specificity ties.
      - **Fixed widths** (`width: 600px`) on containers, tables or images - the classic cause of sideways
        scrolling. Use `max-width`, `minmax(0, 1fr)` and `overflow-x: auto` on the one element that must
        scroll (a wide table).
      - **`vw`-only font sizes** that ignore zoom. Mix in `rem`: `clamp(1rem, 0.8rem + 1vw, 1.5rem)`.
      - **`100vh` panels on phones** that are cut off by the browser bars - use `svh` or `dvh`.
      - **`container-type` on the element you style** - a container cannot query itself; put it on a wrapper.
      - **`srcset` with `w` descriptors but no `sizes`** - invalid HTML; browsers then assume `100vw` and
        download images far larger than shown.
      - **Testing only in device mode.** It is quick but approximate - confirm on at least one real phone.

      **Debugging method:** in DevTools, select the element that is too wide (Elements → hover shows its box),
      check **Computed** for the width and which rule set it, and use **Show media queries** to see which
      breakpoints are active. Find the **first** element wider than the viewport - everything else is usually
      a consequence:

      ```javascript
      // Paste in the Console: lists elements wider than the viewport (illustrative helper)
      [...document.querySelectorAll('body *')]
        .filter((el) => el.getBoundingClientRect().right > document.documentElement.clientWidth + 1)
        .forEach((el) => console.log(el));
      ```

  - id: tradeoffs
    kind: tradeoffs
    concepts: [fluid-units-and-container-queries, responsive-images]
    title: Trade-offs and alternatives
    body: |
      - **Media queries vs container queries.** Media queries fit **page** layout (header, sidebar, number of
        columns). Container queries fit **reusable components** placed in spaces of different widths. Most
        sites use both. Container queries need a wrapper with `container-type`, which also applies size
        containment in that axis - the container's inline size can no longer depend on its children.
      - **Fluid (`clamp()`) vs stepped (breakpoints).** Fluid sizing removes many breakpoints but makes exact
        sizes harder to predict and to compare with a design file. Keep the limits in `rem`.
      - **Responsive images vs one image.** `srcset` saves bytes but needs several files generated by a build
        step or an image CDN. For icons and logos, an **SVG** scales to any size with one file.
      - **Responsive site vs separate mobile site (`m.`) or native app.** One responsive site means one
        codebase and one URL per page; separate sites can be tuned more tightly but duplicate work and
        content. A native app is a different product decision (offline, device features, store presence) -
        see the mobile testing track.
      - **Newest features.** Range syntax, container queries and `dvh` are widely supported today, but the
        specifications are still drafts; check compatibility for the browsers your users actually have.

  - id: summary
    kind: summary
    title: Summary and quick reference
    body: |
      - `<meta name="viewport" content="width=device-width, initial-scale=1">` - always; **never**
        `user-scalable=no` or `maximum-scale`.
      - **Mobile-first:** base CSS = narrow layout; add `@media (width >= 48em)` (or `min-width`) rules,
        **small to large**, breakpoints in `em`, chosen by content.
      - Preferences: `prefers-reduced-motion: reduce`, `prefers-color-scheme: dark`, `pointer: coarse`.
      - Units: `rem` text, `%`/`fr` widths, `ch` line length, `svh`/`dvh` on phones,
        `clamp(min, fluid, max)` with a `rem` part.
      - Components: wrapper `container-type: inline-size` + `@container (width > 30em)`.
      - Images: `srcset="a-400.jpg 400w, a-800.jpg 800w"` + `sizes` (required with `w`); `picture` +
        `source media` for a different crop; `width`/`height` to reserve space.
      - Test: 320 px, each breakpoint ± 1, 200% text and 400% zoom (WCAG 1.4.4, 1.4.10), both orientations,
        preferences on, `scrollWidth - innerWidth <= 1`, and one real device.

exercises:
  - id: tiny-page-on-phone
    type: mcq
    concept: viewport-and-mobile-first-queries
    skill: application
    title: Why does the phone show a tiny desktop page?
    prompt: |
      A new landing page has mobile-first CSS with `@media (width >= 48em)` for the two-column layout. On a
      390-pixel-wide phone it shows **two columns**, very small text, and the user has to pinch-zoom. In
      What is the most likely cause?
    options:
      - id: no-meta
        text: The page has no viewport meta tag, so the phone lays it out in a wide virtual viewport (often about 980 CSS px) and the 48em query is true.
        feedback: Correct - without `width=device-width` the layout viewport is wider than the screen, so `(width >= 48em)` matches and the result is shrunk to fit.
      - id: em-breakpoint
        text: Breakpoints in em do not work on phones; they must be in px.
        feedback: "`em` breakpoints work everywhere; they are relative to the initial font size (usually 16 px), so 48em is about 768 px. The unit is not why the query matched on a 390 px phone."
      - id: wrong-order
        text: The media query is placed before the base rules, so it is ignored.
        feedback: Rule order matters when two rules tie, but it would not make a 48em query true on a 390 px phone. Something made the viewport wider than the screen.
      - id: dpr
        text: The phone has a device pixel ratio of 3, so its width is 1170 px and the query matches.
        feedback: Media queries use **CSS pixels**, not device pixels. With a correct viewport, a 3× phone is 390 CSS px wide and the query is false.
    correct: [no-meta]
    hints:
      - The query should be false at 390 CSS px. What could make the browser think the viewport is wider?
      - What does a mobile browser do with a page that does not say it is designed for phones?
    solution: |
      **The viewport meta tag is missing.** Mobile browsers lay out such pages in a virtual viewport wider than
      the screen (MDN's example: 980 px shrunk onto 640 px). The page is then 980 CSS px wide, the 48em
      (≈768 px) query is true, two columns appear, and the result is scaled down. **Confirm** by viewing the
      `<head>` and by evaluating `window.innerWidth` on the phone (remote debugging): about 980 instead of
      390. Fix: add `<meta name="viewport" content="width=device-width, initial-scale=1">` - and an automated
      check so it cannot disappear again.
    followUp: |
      The tag is present but reads `width=device-width, maximum-scale=1, user-scalable=no`. The layout is
      right. What is still wrong, and which WCAG criterion does it put at risk?

  - id: query-order-debug
    type: debug
    concept: viewport-and-mobile-first-queries
    skill: analysis
    title: The three-column layout never appears
    prompt: |
      Mobile-first product grid: one column by default, two from 40em, three from 64em. On a 1440 px desktop
      it shows **two** columns. Click the line(s) that cause it.
    language: css
    code: |
      .grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1rem;
      }
      @media (width >= 64em) {
        .grid { grid-template-columns: repeat(3, 1fr); }
      }
      @media (width >= 40em) {
        .grid { grid-template-columns: repeat(2, 1fr); }
      }
    correctLines: [9, 10]
    lineNotes:
      - line: 6
        note: The 64em query is correct and is true at 1440 px - its rule does apply, but it is overridden later.
      - line: 3
        note: The base one-column rule is right for mobile-first; wider rules should override it.
    hints:
      - At 1440 px, which of the two media queries are true?
      - Both rules have the same selector, so the same specificity. Which one wins a tie?
    solution: |
      **Lines 9-10.** At 1440 px **both** queries are true. Both rules use `.grid`, so specificity ties and the
      rule **later in the style sheet** wins - the 40em rule, with two columns. Media queries add no
      specificity. Fix: put mobile-first queries in **ascending** order - 40em, then 64em. Confirm in DevTools
      → Computed → `grid-template-columns`, which shows the 40em rule winning and the 64em rule crossed out.
    followUp: |
      Rewrite the queries so that the order no longer matters, using ranges such as `(40em <= width < 64em)`.
      Why do many teams still prefer ascending open-ended queries?

  - id: choose-container-query
    type: mcq
    concept: fluid-units-and-container-queries
    skill: analysis
    title: Same card, two places
    prompt: |
      The shop's product card appears in the **main grid** (about 600 px wide per card on desktop) and in a
      **"recently viewed" sidebar** (240 px wide) - on the same page, at the same viewport width. The card
      should show the image beside the text when it has room, and stacked when it does not. Which approach fits?
    options:
      - id: container
        text: Wrap each card slot in an element with container-type inline-size and switch the card's layout with an @container rule.
        feedback: Correct - the decision depends on the space the card gets, which differs at the same viewport width. Container queries ask exactly that.
      - id: media
        text: A media query at 48em that puts the image beside the text.
        feedback: The viewport is the same for both cards, so a media query would give both the same layout - the sidebar card would get the wide layout in 240 px.
      - id: vw
        text: Size the image with vw so it shrinks on smaller screens.
        feedback: vw follows the viewport, not the card. Both cards are on the same viewport, so they would get the same image size.
      - id: self-container
        text: Put container-type inline-size on the card itself and write @container rules for the card.
        feedback: A container cannot query its own size - its own rules would not be affected by the query. Put container-type on a wrapper and style the card inside it.
    correct: [container]
    hints:
      - Is the deciding factor the screen, or the space the component gets?
      - Which element can a container query style - the container or its descendants?
    solution: |
      **Container query on a wrapper.** The viewport is identical for both cards, so only a container query
      can tell them apart. Mark the slot (`.card-slot { container-type: inline-size; }`) and write
      `@container (width > 30em) { .product-card { grid-template-columns: 8rem 1fr; } }`. Check in DevTools:
      the Elements panel marks containers, and the Styles pane shows the `@container` rule applying only to
      the main-grid card.
    followUp: |
      The design team also wants the card's title to be 5% of the card's width, never below 1rem or above
      1.5rem. Write the `font-size` declaration using a container unit and `clamp()`.

  - id: fluid-heading-short
    type: short
    concept: fluid-units-and-container-queries
    skill: application
    title: A heading that grows - and still zooms
    prompt: |
      A designer asks for a page title that is **24 px on small phones, 40 px on large desktops**, and grows
      smoothly in between. A developer writes `font-size: 3vw;`. Explain two problems with it and write a
      better declaration.
    hints:
      - What is 3vw at 320 px? At 2560 px?
      - What happens to a vw size when the user zooms text or sets a larger default font?
    modelAnswer: |
      `3vw` has no limits: at 320 px it is 9.6 px (unreadable) and at 2560 px it is 76.8 px (huge). And it is
      made only of viewport units, so it does **not** respond to the user's font-size setting or text zoom,
      which risks WCAG 1.4.4 (resize text to 200%).

      Better: `font-size: clamp(1.5rem, 1rem + 2vw, 2.5rem);` - between 24 px and 40 px at the default 16 px
      root size, growing with the viewport in between, and the `rem` parts scale with the user's settings.
    rubric:
      - Pointed out that a bare vw value has no minimum or maximum
      - Pointed out that a vw-only size ignores text zoom or the user's font-size setting (WCAG 1.4.4)
      - Used clamp() with a minimum, a fluid middle value and a maximum
      - Used rem for the limits (and a rem part in the middle value)
    solution: |
      Compare with the model answer. The exact middle value is a design choice; what matters is **limits**
      and a **rem component**. Verify by resizing from 320 to 2560 px in device mode and by setting the
      browser's default font size to 24 px - the heading should grow with it.

  - id: srcset-pick
    type: mcq
    concept: responsive-images
    skill: application
    title: Which file can the browser choose?
    prompt: |
      ```html
      <img
        srcset="hero-400.jpg 400w, hero-800.jpg 800w, hero-1200.jpg 1200w, hero-2400.jpg 2400w"
        sizes="(width <= 40em) 100vw, 50vw"
        src="hero-800.jpg"
        alt="SandPay merchant dashboard on a phone"
      />
      ```

      A phone with a **390 CSS px** viewport and a **device pixel ratio of 3** loads the page. Which statement
      is right?
    options:
      - id: needs-1170
        text: The image is shown 390 CSS px wide and needs about 1170 device pixels, so hero-1200.jpg is the file that fits best; the browser may still choose differently.
        feedback: Correct - 390 px is below 40em (640 px), so sizes gives 100vw = 390 px; at 3× that needs 1170 pixels, and 1200w is the smallest candidate that covers it. The standard leaves the final choice to the browser.
      - id: always-400
        text: hero-400.jpg, because the viewport is 390 px wide and 400 is the closest width.
        feedback: That ignores the device pixel ratio. A 3× screen needs about three device pixels per CSS pixel to look sharp.
      - id: half
        text: The image is shown at 50vw = 195 px, so hero-800.jpg is enough.
        feedback: The first condition in sizes, (width <= 40em), is true at 390 px, so 100vw applies. The 50vw default is only used when no condition matches.
      - id: src
        text: src is always used on phones; srcset is only for desktops.
        feedback: Modern browsers on phones use srcset and sizes; src is the fallback, and it also takes part in the choice.
    correct: [needs-1170]
    hints:
      - First work out the display width from sizes - which condition is true at 390 px (16 px per em)?
      - Then multiply by the device pixel ratio.
    solution: |
      `(width <= 40em)` = up to 640 px is true at 390 px, so the slot is **100vw = 390 CSS px**. At a pixel
      ratio of 3 the image needs about **1170** device pixels, so **hero-1200.jpg** fits best. The browser is
      allowed to pick another candidate (for example a smaller one on a slow connection or with data saving
      on), so **confirm** in DevTools → Network which file was actually downloaded, and `currentSrc` on the
      image in the Console.
    followUp: |
      The same page on a 1440 px desktop with a pixel ratio of 1: what display width does sizes give, and
      which candidate fits best?

  - id: art-direction-short
    type: short
    concept: responsive-images
    skill: application
    title: Different crop on phones
    prompt: |
      Marketing has a wide banner photo of a shop counter with the SandPay card reader small in the middle. On
      phones they want a **tight square crop** showing only the card reader. Write the HTML and explain why
      `srcset` alone is not the right tool.
    hints:
      - Is this the same picture at a different resolution, or a different picture?
      - Which element lets you switch on a media condition, and which element must stay inside it?
    modelAnswer: |
      ```html
      <picture>
        <source media="(width >= 40em)" srcset="counter-wide-1600.jpg 1600w, counter-wide-800.jpg 800w"
                sizes="100vw" width="1600" height="600" />
        <img src="reader-square-600.jpg" width="600" height="600"
             alt="SandPay card reader on the shop counter" />
      </picture>
      ```

      `srcset` with `w` descriptors offers the **same** picture at different resolutions and lets the browser
      choose; it must not be used for a different crop, because the browser may pick any candidate. Art
      direction - a **different** image for different layouts - needs `picture` with `source media`: the first
      matching `source` is used, otherwise the `img`. The `img` is required and carries the `alt` text;
      `width`/`height` reserve space.
    rubric:
      - Used picture with a source that has a media condition
      - Kept an img inside picture as the fallback, with alt text
      - Explained that srcset alone lets the browser choose any candidate, so it is for resolution, not content
      - Reserved space with width and height (or aspect-ratio)
    solution: |
      Compare with the model answer. A `source` can itself have `srcset` and `sizes`, so art direction and
      resolution switching combine - as in the wide image here.

  - id: build-order
    type: order
    concept: viewport-and-mobile-first-queries
    skill: recall
    title: Building a page mobile-first
    prompt: Put the steps of building a responsive page mobile-first in order.
    items:
      - id: meta
        text: Add the viewport meta tag (width=device-width, no zoom blocking)
      - id: base
        text: Write base CSS for the narrowest screen - one column, no fixed widths, rem text
      - id: fluid
        text: Make sizes fluid with %, max-width and clamp()
      - id: widen
        text: Widen the viewport slowly and note where the content needs a new layout
      - id: queries
        text: Add min-width / width >= media queries for those breakpoints, smallest first
      - id: test
        text: Test at device widths, 200% and 400% zoom, both orientations and on a real phone
    hints:
      - Nothing else works until the browser lays out at the device's width.
      - Breakpoints come from watching the content, after fluid sizing has done what it can.
    solution: |
      Meta tag → base narrow CSS → fluid sizing → find breakpoints by widening → add queries in ascending order
      → test. Breakpoints come **late**: fluid sizing removes many of them, and the content tells you where the
      rest belong.

  - id: responsive-test-plan
    type: testdesign
    concept: responsive-testing
    skill: application
    title: Test plan for a responsive checkout
    prompt: |
      Design responsive tests for the SandPay Demo Shop's checkout page before a redesign ships. Give at least
      six cases with the condition, how you create it, the expected result and the **evidence**. Include at
      least one case that needs a real device.
    hints:
      - Widths - the smallest, the breakpoints, a wide desktop. Zoom - which two WCAG criteria?
      - What do users change besides the window size - orientation, font size, motion and colour settings?
      - What can device mode never simulate?
    modelAnswer: |
      1. **320 × 640** (device mode or Playwright viewport): one column, all fields and Pay usable, no
         sideways scroll. Evidence: screenshot; `scrollWidth - innerWidth <= 1`.
      2. **Each breakpoint ± 1 px**: layout switches once at the intended width. Evidence: two screenshots.
      3. **Desktop 1280 px at 400% zoom** (browser zoom): reflows to one column, no two-dimensional scrolling
         (WCAG 1.4.10). Evidence: screenshot.
      4. **Text 200%** (browser default font size): nothing clipped or overlapping (WCAG 1.4.4). Evidence:
         screenshot.
      5. **Rotate to landscape while typing** (real phone or Playwright viewport change): layout adapts and
         the entered values stay. Evidence: recording.
      6. **`prefers-reduced-motion: reduce`** (OS setting or `page.emulateMedia`): the processing overlay
         does not animate. Evidence: recording, `document.getAnimations()`.
      7. **Long values** - a long email address and order id at 320 px: wrap or scroll inside their box.
         Evidence: screenshot.
      8. **Real phone with the keyboard open**: focused field and Pay button not hidden. Evidence: device
         screenshot, device and browser version.
      9. **Images on a 3× phone**: sharp, and the Network panel shows a suitably sized file. Evidence: file
         name and transfer size.
    rubric:
      - Covered the smallest width (320 CSS px) with a no-horizontal-scroll check
      - Covered the breakpoints themselves (just below and above)
      - Covered 400% zoom reflow and 200% text resize, naming WCAG 1.4.10 and 1.4.4
      - Covered orientation change, with entered data kept
      - Covered a user preference (reduced motion or colour scheme)
      - Included a real-device case (keyboard, touch, browser bars) and said why device mode is not enough
      - Named concrete evidence for each case
    solution: |
      Compare with the model answer. The most often missed cases are **zoom** (an accessibility requirement,
      not a nice-to-have) and the **real device** - device mode is, in Chrome's own words, a first-order
      approximation.
    followUp: |
      Which three of these cases would you automate in Playwright to run on every pull request, and which
      would you keep as manual checks before release? Why?

  - id: interview-responsive
    type: interview
    concept: viewport-and-mobile-first-queries
    skill: application
    title: "Interview: how do you make a page responsive?"
    prompt: |
      *"Walk me through how you would make an existing desktop-only page work well on phones - and how you'd
      know it works."* Answer as you would in a front-end or full stack interview.
    hints:
      - Start with what makes a phone lay out at its own width.
      - Then layout, sizing, components, images - and finish with testing and accessibility.
    modelAnswer: |
      First the **viewport meta tag**, `width=device-width, initial-scale=1`, without blocking zoom - without
      it the phone lays the page out at around 980 px and shrinks it. Then I would restructure the CSS
      **mobile-first**: the single-column layout becomes the default, and wider layouts are added with
      `min-width` or `width >=` media queries in `em`, in ascending order, at breakpoints chosen where the
      **content** breaks, not per device.

      I would remove fixed widths in favour of `%`, `max-width`, `fr` and `minmax(0, 1fr)`, use `rem` for text
      and `clamp()` for fluid headings and spacing, and use **container queries** for components such as
      cards that appear in spaces of different widths. Images get `srcset` with width descriptors and `sizes`,
      `picture` where a different crop is needed, and `width`/`height` to avoid layout shift. I'd respect
      `prefers-reduced-motion`.

      To know it works: DevTools device mode at 320 px and each breakpoint, **400% zoom** and **200% text**
      for WCAG 1.4.10 and 1.4.4, both orientations, and at least one real phone for touch, the keyboard and
      browser bars. I'd automate the cheap checks - viewport tag present, no horizontal overflow at 320 px -
      in Playwright projects with mobile and desktop viewports.
    rubric:
      - Mentioned the viewport meta tag and not blocking zoom
      - Described mobile-first CSS with min-width / range queries in ascending order
      - Chose breakpoints from content rather than devices
      - Used fluid units (%, rem, clamp) and removed fixed widths
      - Mentioned container queries for reusable components
      - Covered responsive images (srcset + sizes, picture)
      - Described testing - device widths, zoom levels (WCAG), real device, automation
    followUps:
      - Why em rather than px for breakpoints?
      - When would you choose a container query over a media query?
      - How do you stop a wide table from making the whole page scroll sideways?
      - What does device mode not simulate?
    solution: |
      Interviewers listen for **order** (viewport, layout, sizing, images, testing), for **content-based
      breakpoints**, and for **accessibility** - zoom and reflow - rather than a list of CSS properties.

placement:
  - id: place-mobile-first
    type: debug
    concept: viewport-and-mobile-first-queries
    skill: analysis
    title: Where is the problem?
    prompt: |
      This page should be one column on phones and two columns from 48em. On a 390-pixel phone it is two
      columns and tiny. Click the line that causes it.
    language: html
    code: |
      <!doctype html>
      <html lang="en">
        <head>
          <meta charset="utf-8" />
          <title>SandPay merchants</title>
          <link rel="stylesheet" href="site.css" />
        </head>
        <body>
          <main class="grid">...</main>
        </body>
      </html>
    correctLines: [3]
    lineNotes:
      - line: 6
        note: The style sheet is linked correctly; the problem is how wide the browser thinks the viewport is.
      - line: 9
        note: The grid element is fine - the media query in the CSS is matching when it should not.
    hints:
      - What does a mobile browser assume about a page that does not declare it is built for phones?
    solution: |
      **Line 3 - the `head` has no viewport meta tag.** Without `<meta name="viewport" content="width=device-width,
      initial-scale=1">` the phone lays out in a wide virtual viewport (about 980 CSS px), so the 48em query is
      true and the page is shrunk to fit. The tag belongs in the `head`.

  - id: place-units
    type: mcq
    concept: fluid-units-and-container-queries
    skill: application
    title: A full-screen panel on phones
    prompt: |
      A full-screen "Payment processing" panel uses `height: 100vh`. On phones, its bottom (with the Cancel
      button) is hidden behind the browser's toolbar until the user scrolls. What is the best fix?
    options:
      - id: svh
        text: Use height 100svh (or 100dvh), the viewport units that account for the browser's bars.
        feedback: Correct - svh uses the small viewport (bars shown), so the panel always fits; dvh follows the bars as they move.
      - id: percent
        text: Use height 100%, which always means the screen height.
        feedback: A percentage height is relative to the containing block's height, not the screen - with an auto-height parent it often does nothing.
      - id: px
        text: Use height 640px, the typical phone height.
        feedback: Phone heights vary widely and change with orientation and browser bars; a fixed value is wrong on most devices.
      - id: maxscale
        text: Add maximum-scale=1 to the viewport meta tag.
        feedback: That blocks zoom (an accessibility failure) and does not change how vh is measured.
    correct: [svh]
    solution: |
      **`100svh` (or `100dvh`).** CSS Values 4 defines the small viewport (UI bars expanded), the large viewport
      (bars retracted) and the dynamic viewport. the plain `vh` unit is defined against the large one, so content hides
      behind the bars when they are shown; `svh` is stable and always fits.

  - id: place-images
    type: mcq
    concept: responsive-images
    skill: application
    title: Resolution or art direction?
    prompt: |
      You need the **same** product photo at 400, 800 and 1600 pixels wide, shown full-width on phones and at
      one third of the page on desktops. Which markup is right?
    options:
      - id: srcset-sizes
        text: One img with srcset listing 400w, 800w and 1600w files and sizes such as "(width < 40em) 100vw, 33vw"
        feedback: Correct - width descriptors plus sizes let the browser pick the right resolution for the layout and the screen density.
      - id: picture
        text: A picture element with one source per file, each with a media query on the screen width
        feedback: That forces a file per viewport width and ignores pixel density - picture with media is for a different image (art direction), not for resolution switching.
      - id: srcset-only
        text: One img with srcset listing the three files with w descriptors, no sizes needed
        feedback: The HTML standard requires sizes when srcset uses width descriptors (apart from sizes=auto on lazy images); without it browsers assume 100vw and over-download on desktop.
      - id: css
        text: A 1600-pixel image scaled down with CSS max-width 100%
        feedback: It fits visually, but every phone downloads the largest file.
    correct: [srcset-sizes]
    solution: |
      **`srcset` with `w` descriptors and `sizes`.** Same picture, different resolutions → resolution switching.
      `picture` + `source media` is for a different picture (a different crop or content).

  - id: place-reflow
    type: mcq
    concept: responsive-testing
    skill: application
    title: Testing reflow
    prompt: |
      You must show that the checkout page meets WCAG 2.2 success criterion 1.4.10 Reflow on desktop. Which
      test does that?
    options:
      - id: zoom-400
        text: In a 1280 px wide desktop window, zoom the browser to 400% and check that the page works without scrolling in two directions.
        feedback: Correct - 1280 px at 400% zoom is 320 CSS px wide, the width 1.4.10 names; desktop zoom makes CSS pixels larger, so the layout reflows.
      - id: dpr
        text: Open the page on a phone with a device pixel ratio of 3.
        feedback: The pixel ratio changes how sharp things are, not the layout width in CSS pixels. Reflow is about 320 CSS px.
      - id: text-200
        text: Increase only the text size to 200% and check nothing is cut off.
        feedback: That is 1.4.4 Resize Text - also required, but a different criterion. Reflow is about the layout at 320 CSS px.
      - id: pinch
        text: On a phone, pinch-zoom to 400% and check the page re-flows.
        feedback: Pinch-zoom on a phone shrinks the visual viewport but keeps the layout viewport, so the page does not re-flow - and is not expected to.
    correct: [zoom-400]
    solution: |
      **400% browser zoom in a 1280 px window** - 320 CSS px, the width named by 1.4.10. Evidence: a
      screenshot at 400% and `document.documentElement.scrollWidth - window.innerWidth <= 1`.

recall:
  - id: recall-meta
    concept: viewport-and-mobile-first-queries
    prompt: What does `width=device-width` in the viewport meta tag do, and what must you never add to it?
    answer: It makes the layout viewport as wide as the device in CSS pixels, so media queries and vw use the real width. Never add user-scalable=no or maximum-scale - they block zoom.
  - id: recall-order
    concept: viewport-and-mobile-first-queries
    prompt: In mobile-first CSS, in what order do min-width media queries go, and why?
    answer: Smallest to largest. Rules in media queries gain no specificity, so when several queries are true the later rule wins.
  - id: recall-em-breakpoints
    concept: viewport-and-mobile-first-queries
    prompt: What is an em in a media query relative to?
    answer: The initial font size (usually 16 px, or the user's setting) - not your CSS - so em breakpoints follow the user's font-size preference.
  - id: recall-clamp
    concept: fluid-units-and-container-queries
    prompt: What does clamp(1.5rem, 1rem + 2vw, 2.5rem) give, and why keep rem in it?
    answer: The middle value, never below 1.5rem or above 2.5rem. The rem parts make it respond to the user's text size and zoom, which vw alone does not.
  - id: recall-container
    concept: fluid-units-and-container-queries
    prompt: Where do you put container-type, and what can an @container rule style?
    answer: On a wrapper (the query container). The rules style its descendants - a container cannot query its own size.
  - id: recall-sizes
    concept: responsive-images
    prompt: When is the sizes attribute required, and what does it tell the browser?
    answer: Whenever srcset uses width (w) descriptors, except sizes=auto on lazy images. It says how wide the image will be displayed at each layout, so the browser can pick a file before CSS loads.
  - id: recall-picture
    concept: responsive-images
    prompt: When do you use picture with source media instead of srcset?
    answer: For art direction - a different image or crop at different sizes. srcset is for the same image at different resolutions.
  - id: recall-wcag
    concept: responsive-testing
    prompt: Which two WCAG 2.2 criteria does responsive testing cover, and how do you test them?
    answer: 1.4.4 Resize Text (text at 200% without loss) and 1.4.10 Reflow (no two-way scrolling at 320 CSS px - a 1280 px window at 400% zoom).

