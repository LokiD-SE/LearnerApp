id: input-validation-and-error-handling
title: Input validation and error handling
subject: fullstack
module: backend-api
level: intermediate
status: published
estimatedMinutes: 65
summary: Treat every input as untrusted, parse it at the boundary with a zod schema into typed data, and turn every failure - bad input, a missing payment, a database outage - into a Problem Details response that helps the client and leaks nothing. Every response and error message shown here came from a real run.
tags:
  [
    input validation,
    validation,
    zod,
    schema,
    safeParse,
    parse don't validate,
    trust boundary,
    allow-list,
    allowlist,
    unknown keys,
    mass assignment,
    coercion,
    query parameters,
    error handling,
    error handler,
    operational errors,
    programmer errors,
    problem details,
    RFC 9457,
    '422',
    application/problem+json,
    JSON pointer,
    stack trace,
    information leak,
    CWE-20,
    CWE-209,
    OWASP ASVS,
    request id,
  ]

environment: |
  - **Runtime and libraries:** **Node.js 24** (v24.21.0, from this repository's `.nvmrc`), **Express 5.3.0** and
    **zod 4.6.7** - the versions pinned in `practice/fullstack`. Every validation result, zod error message and
    HTTP response in this lesson was produced by running the code against these versions (supertest or `tsx`)
    on Linux in November 2026. zod's message wording can change between versions; don't assert on it in
    tests you want to survive upgrades.
  - **zod documentation (v4):** [Basic usage](https://zod.dev/basics) (`parse`, `safeParse`, `z.infer`),
    [Defining schemas](https://zod.dev/api) ("By default, unrecognized keys are stripped", `z.strictObject`,
    `z.looseObject`, coercion, `.refine()` and when refinements run, `.pipe()`) and
    [Formatting errors](https://zod.dev/error-formatting) (`z.treeifyError()`, `z.prettifyError()`,
    `z.flattenError()`).
  - **OWASP:** the [Input Validation Cheat Sheet](https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html)
    (syntax and semantics, allowlist versus denylist, "Parse Safely, Then Validate", common pitfalls), the
    [Error Handling Cheat Sheet](https://cheatsheetseries.owasp.org/cheatsheets/Error_Handling_Cheat_Sheet.html)
    (a global handler that returns a generic response and logs the details) and the
    [Application Security Verification Standard 5.0](https://github.com/OWASP/ASVS/tree/master/5.0/en):
    chapter **V2 Validation and Business Logic** (2.2.1 positive validation, 2.2.2 validation at a trusted
    service layer, 2.2.3 combinations of related items) and chapter **V16 Security Logging and Error
    Handling** (16.5.1 generic message, 16.5.3 fail securely, 16.5.4 last-resort handler, 16.4.1 log
    injection). ASVS 5.0 renumbered every chapter: 4.0's V5 "Validation" and V7 "Error Handling" requirements
    now live mainly in V2 and V16.
  - **Weaknesses:** [CWE-20 Improper Input Validation](https://cwe.mitre.org/data/definitions/20.html) and
    [CWE-209 Generation of Error Message Containing Sensitive Information](https://cwe.mitre.org/data/definitions/209.html).
  - **Problem Details:** [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457) section 3 (the members and the
    422 validation example with an `errors` extension of `detail` and `pointer`), 3.1.4 (`detail` helps the
    client, not debugging), 3.2 (extension members) and 5 (security considerations: no stack dumps).
    [RFC 6901](https://www.rfc-editor.org/rfc/rfc6901) for JSON Pointer escaping (`~0`, `~1`).
  - **Express:** [Error handling](https://expressjs.com/en/guide/error-handling.html) (the default handler
    writes the stack trace outside production) and [Migrating to Express 5](https://expressjs.com/en/guide/migrating-5.html)
    (`req.query` "is no longer a writable property and is instead a getter"; the default query parser
    "has been changed from 'extended' to 'simple'").
  - **Background:** "parse, don't validate" is the title of Alexis King's 2019 essay
    ([lexi-lambda.github.io](https://lexi-lambda.github.io/blog/2019/11/05/parse-don-t-validate/)) - an
    idea, not a standard.
  - **Fictional:** SandPay, its API, problem type URIs under `https://api.sandpay.example/problems/`, every
    payment and refund id and amount. Amounts are integer minor units (2599 is 25.99).
  - **Builds on:** [An HTTP API with Express](#/lesson/express-http-server) (middleware, the error handler,
    `express.json()` errors), [REST API design](#/lesson/rest-api-design) (choosing status codes as a
    designer) and, from the tester's side, [Status codes and errors](#/lesson/status-codes-and-errors).

prerequisites:
  - express-http-server
  - typescript-for-applications

concepts:
  - id: trust-boundary-validation
    name: Trust boundaries and allow-list validation
    summary: Everything that crosses into your service - body, path, query, headers, environment, files, other services' responses - is untrusted until checked on the server. Check syntax and meaning against an allow-list of what is acceptable (types, ranges, lengths, exact choices, known fields), never a deny-list of what looks dangerous, and reject unknown fields that could be mass-assigned.
  - id: schema-parsing-zod
    name: Parsing input with a schema (zod)
    summary: A schema turns unknown input into typed, trusted data or a list of issues - parse, don't just validate. With zod, safeParse returns success and data or an error with issues; z.infer derives the TypeScript type from the same schema; strictObject rejects unknown keys; refinements add cross-field rules; query strings are strings and need careful conversion, not loose coercion.
  - id: error-taxonomy
    name: Classifying errors - client, operational and programmer errors
    summary: Client errors (bad input, a missing resource, a conflict) are expected and get a 4xx the client can act on. Operational failures (a database or provider outage) and programmer errors (bugs) get a 5xx; the client can do nothing about the details. Throw typed errors in the code, and map them to statuses in exactly one place.
  - id: safe-error-responses
    name: Safe error responses with Problem Details
    summary: One last-resort error handler sends application/problem+json for every failure - type, title, status, field errors with JSON pointers for 422, a request id - and, for anything unexpected, a generic 500 while the full error goes to the server log with that request id. Messages, stacks, SQL and host names never reach the client.

objectives:
  - Identify every trust boundary of an API endpoint and list the inputs that must be validated on the server.
  - Write a zod schema that parses a request body into typed data with allow-lists, ranges, unknown-key rejection and a cross-field rule.
  - Convert query-string values safely and explain why loose coercion accepts input it shouldn't.
  - Classify a failure as a client, operational or programmer error, and choose its status code.
  - Write Express middleware that validates and a central error handler that maps errors to RFC 9457 Problem Details.
  - Design tests that prove an API rejects bad input without side effects and never leaks internals in an error.

sections:
  - id: intuition
    kind: intuition
    concepts: [trust-boundary-validation, error-taxonomy]
    title: The idea in plain language
    body: |
      Think of a bank's **cash counter**. Whatever the customer slides under the glass - a form, a
      cheque, a banknote - the cashier checks it **before** it goes into the drawer: is the form complete,
      is the amount written in figures and words the same, is this a currency the bank accepts? The cashier
      checks against a **list of what is acceptable**, not a list of known forgeries, and hands back anything
      that doesn't fit with a clear reason: "the date is missing", "we don't accept this currency".

      When something goes wrong **behind** the counter - the vault is jammed, the computer is down - the
      cashier says "sorry, we can't process this right now, here is your ticket number". They don't read out
      the error on their screen, the vault's combination or the name of the engineer on call. The ticket
      number lets the bank find the details later.

      An API is the same counter:

      - the **glass** is the trust boundary - everything that comes through it is checked, on your side;
      - the **list of what is acceptable** is a schema;
      - "the date is missing" is a **4xx with field errors**;
      - "sorry, here is your ticket number" is a **generic 500 with a request id** - and the real error goes
        into the server log under that id.

  - id: what
    kind: what
    concepts: [trust-boundary-validation, schema-parsing-zod, error-taxonomy]
    title: The vocabulary
    body: |
      - **Trust boundary** - a point where data passes from something you don't control to something you
        do. For an API: the HTTP request (body, path parameters, query string, headers, cookies), uploaded
        files, environment variables and configuration, messages from queues, responses from other
        services (a payment provider, an internal microservice) and even rows written by an older version
        of your own code.
      - **Validation** - checking that input has the properties needed to process it "safely and
        correctly" (CWE-20's wording). The OWASP cheat sheet splits it into **syntax** ("the expected type
        and format") and **semantics** ("whether the value makes sense for the operation").
      - **Allow-list (positive) validation** - define what is accepted and reject the rest. The opposite, a
        **deny-list**, tries to recognise bad values. OWASP: "Do not try to recognize every malicious
        string."
      - **Schema** - a machine-checkable description of acceptable input. A schema library (zod here; JSON
        Schema, Joi, Valibot elsewhere) checks a value against it.
      - **Parsing** (in the "parse, don't validate" sense) - checking input **and** producing a new value
        whose type proves it was checked. `CreateRefundBody.parse(req.body)` returns a `CreateRefund`, not a
        yes/no.
      - **Client error** - the request is wrong; the client can fix it (4xx). **Operational error** - an
        expected failure of the environment (a timeout, a database outage, a provider decline). **Programmer
        error** - a bug (`undefined is not a function`). The last two are server errors (5xx) unless a
        specific code applies (503 with `Retry-After`, 504).
      - **Problem Details** - RFC 9457's JSON format for HTTP API errors, media type
        `application/problem+json`, with the members `type`, `title`, `status`, `detail` and `instance` plus
        any extension members a problem type defines. Track C's [Status codes and
        errors](#/lesson/status-codes-and-errors) shows it from the tester's side.

  - id: why
    kind: why
    concepts: [trust-boundary-validation, safe-error-responses]
    title: Why it matters
    body: |
      Validation and error handling are where a large share of real API defects - and security findings -
      live:

      - **The browser checked it** is not a defence. Anyone can send the request with `curl`. ASVS 5.0
        requirement 2.2.2: "client-side validation improves usability and should be encouraged, it must not
        be relied upon as a security control."
      - **A negative or fractional refund** that reaches the ledger is a money bug, not a 400.
      - **Unknown fields copied into the database** (`"isApproved": true`, `"status": "SETTLED"`) let a
        client change what it should never touch - the mass-assignment weakness.
      - **A 500 for bad input** tells the client "our fault, retry", so retries and alerts fire for what is
        really a client mistake - and it usually means the input reached code that wasn't ready for it.
      - **An error message with SQL, a stack trace or a host name** is reconnaissance for an attacker. The
        OWASP Error Handling cheat sheet starts with exactly that: an attack "always begins with a
        Reconnaissance phase", and "unhandled errors can assist an attacker". CWE-209 is the weakness;
        ASVS 16.5.1 the requirement: a generic message "ensuring no exposure of sensitive internal system
        data such as stack traces, queries, secret keys, and tokens".

      As a tester you have reported all of these. This lesson is about building the API so they can't happen,
      and about knowing exactly where to look when they do.

  - id: boundaries
    kind: internals
    concepts: [trust-boundary-validation]
    title: Where validation belongs, and what it checks
    body: |
      **Validate once, at the edge, on the server, before any side effect.** For each input, the rules come
      from the OWASP cheat sheet's table:

      | Input | Rules to enforce (OWASP) | SandPay refund example |
      |---|---|---|
      | Fixed choices | "Exact membership in the allowed set" | `currency` is one of `EUR`, `GBP`, `INR`, `USD` - not "three capital letters" |
      | Numbers and dates | "Expected type, accepted format, and minimum and maximum values" | `amountMinor` is an integer, 1 to 10 000 000 |
      | Strings | "Length limits and the characters or structure required" | `note` is at most 500 characters after trimming |
      | Objects | "Allowed fields, required fields, and rules for missing or null values" | only `amountMinor`, `currency`, `reason`, `note` |
      | Arrays | "Minimum and maximum item counts and validation of every item" | (a batch refund: 1 to 100 items, each checked) |

      Then **semantics** - rules about combinations and meaning (ASVS 2.2.3, "combinations of related data
      items are reasonable"): a refund with reason `other` needs a note. Some semantic checks need data the
      schema doesn't have - "the refund is not larger than what is left of the captured payment" needs the
      payment from the database. Those belong in the service, after the schema, and fail as a client error
      (409 or 422 with its own problem type), not as a 500.

      What validation is **not**:

      - It doesn't make data safe for SQL or HTML. "A valid account identifier does not mean the caller may
        access that account", and parameterised queries and output encoding are still required (OWASP's
        introduction). Validation reduces the attack surface; it is not the injection defence.
      - It doesn't replace **authorization**: a perfectly valid `paymentId` may belong to another merchant.
      - It isn't "cleaning" input. Stripping `<script>` or apostrophes changes meaning and still doesn't
        protect the query - OWASP lists "denylisting or cleaning input" as a common pitfall.

      **Parse safely first.** "Apply request size limits before buffering or parsing input" (OWASP). In
      Express that is `express.json({ limit })` - body-parser rejects an oversized body with a 413 before
      your schema ever sees it, as the [Express lesson](#/lesson/express-http-server) showed.

  - id: zod-schemas
    kind: code
    concepts: [schema-parsing-zod, trust-boundary-validation]
    title: A refund schema in zod
    body: |
      The create-refund body for `POST /payments/:id/refunds`:

      ```typescript
      import * as z from 'zod';

      export const CURRENCIES = ['EUR', 'GBP', 'INR', 'USD'] as const;
      export const REASONS = ['duplicate', 'fraudulent', 'requested_by_customer', 'other'] as const;
      export const MAX_REFUND_MINOR = 10_000_000;

      export const CreateRefundBody = z
        .strictObject({
          amountMinor: z.number().int().min(1).max(MAX_REFUND_MINOR),
          currency: z.enum(CURRENCIES),
          reason: z.enum(REASONS),
          note: z.string().trim().min(1).max(500).optional(),
        })
        .refine((body) => body.reason !== 'other' || body.note !== undefined, {
          path: ['note'],
          message: 'note is required when reason is other',
        });

      export type CreateRefund = z.infer<typeof CreateRefundBody>;
      // { amountMinor: number; currency: "EUR" | "GBP" | "INR" | "USD";
      //   reason: "duplicate" | ... | "other"; note?: string | undefined }
      ```

      One schema gives you **both** the runtime check and the static type: `z.infer` derives `CreateRefund`
      from it, so the handler can't use a field the schema doesn't promise. `.trim()` is a transformation -
      the parsed value is trimmed, the raw input isn't.

      `safeParse` never throws; it returns `{ success: true, data }` or `{ success: false, error }`. Real
      results:

      ```plaintext
      {"amountMinor":2599,"currency":"EUR","reason":"other","note":"  customer called  "}
        -> success, data {"amountMinor":2599,"currency":"EUR","reason":"other","note":"customer called"}

      {"amountMinor":"2599","currency":"eur","reason":"duplicate","isApproved":true}
        -> amountMinor  Invalid input: expected number, received string
           currency     Invalid option: expected one of "EUR"|"GBP"|"INR"|"USD"
           (root)       Unrecognized key: "isApproved"

      {"amountMinor":2599,"currency":"EUR","reason":"other"}
        -> note         note is required when reason is other

      {"amountMinor":2599,"currency":"EUR","reason":"other","note":"   "}
        -> note         Too small: expected string to have >=1 characters
      ```

      Three decisions in that output:

      - **`"2599"` is rejected.** A JSON body keeps its types; a client that sends a string for an amount
        has a bug you want to hear about. (Query strings are different - see below.)
      - **`"eur"` is rejected.** An exact allow-list, not "fix it up for them".
      - **`isApproved` is rejected.** zod's documentation: "By default, unrecognized keys are stripped from
        the parsed result." Stripping already protects you from mass assignment *if* you only ever use the
        parsed data. `z.strictObject` goes further and **reports** them, so a client with a typo
        (`ammountMinor`) or an attacker probing for fields gets a clear 422 instead of silent success. For
        request bodies of a write endpoint that is usually what you want; `z.looseObject` keeps unknown keys
        and is for data you pass through untouched.

  - id: refinements-and-errors
    kind: internals
    concepts: [schema-parsing-zod]
    title: When refinements run, and the shape of zod's errors
    body: |
      A **refinement** (`.refine`) is a custom check that runs after the shape checks. zod 4 runs an
      object's refinement only when the object's own checks didn't stop on a type problem. Real results:

      ```plaintext
      {"amountMinor":0,"currency":"EUR","reason":"other"}
        -> amountMinor  Too small: expected number to be >=1
           note         note is required when reason is other

      {"amountMinor":"2599","currency":"EUR","reason":"other"}
        -> amountMinor  Invalid input: expected number, received string
      ```

      With `0` (right type, out of range) both problems are reported. With `"2599"` (wrong type) the
      refinement doesn't run, so the missing note appears only after the client fixes the amount. That is
      fine - the type error must be fixed first anyway - but a test that expects every error at once from a
      badly typed body will be surprised. The docs show the same case: "invalid_type: refinement won't be
      executed".

      Every failure is a `ZodError` whose `issues` array holds one object per problem, with a `code`, a
      `path` (an array of keys and indexes) and a `message`:

      ```json
      {
        "code": "invalid_value",
        "values": ["EUR", "GBP", "INR", "USD"],
        "path": ["currency"],
        "message": "Invalid option: expected one of \"EUR\"|\"GBP\"|\"INR\"|\"USD\""
      }
      ```

      zod 4 has three formatters (all checked in 4.6.7): `z.prettifyError(error)` for humans and logs,
      `z.treeifyError(error)` for a nested object mirroring the input (handy for forms), and
      `z.flattenError(error)` for a flat `fieldErrors` map of top-level fields. For an API, you usually map
      `issues` yourself to the response format you promise - next section.

      **Don't** send `issue.input` or the whole issue object back unchanged: it can echo large or sensitive
      input (a password field that failed a length rule), and zod's internal codes become part of your API
      contract by accident.

  - id: query-strings
    kind: code
    concepts: [schema-parsing-zod, trust-boundary-validation]
    title: Query strings are strings - and coercion is too forgiving
    body: |
      Path parameters and query values arrive as **strings** (or, in Express 5, an **array** of strings
      when a parameter repeats). Real output from Express 5.3 for `GET /r?limit=50&limit=60&status[x]=1`:

      ```plaintext
      { limit: [ '50', '60' ], 'status[x]': '1' }
      ```

      The default query parser is now "simple" (the migration guide), so `status[x]` is a plain key, not a
      nested object - and `limit` is an array your code must reject, not crash on.

      The tempting fix is `z.coerce.number()`, which runs `Number(input)` first. Real results for
      `z.coerce.number().int().min(1).max(100)`:

      | `limit=` | result |
      |---|---|
      | `20` | 20 |
      | ` 20` | 20 - leading space accepted |
      | `2e1` | 20 - exponent notation accepted |
      | `0x10` | 16 - hexadecimal accepted |
      | (empty) | `Too small: expected number to be >=1` - the empty string became 0 |
      | `abc` | `Invalid input: expected number, received NaN` |

      None of that is a security hole on its own, but it is not the contract you documented ("a whole number
      from 1 to 100"), the error for an empty value is misleading, and different layers (a cache key, a log
      search, an API gateway) will disagree about what `0x10` means. OWASP: "Converting text to an integer
      only establishes a type: it does not establish an acceptable quantity." A strict version checks the
      text first and converts second:

      ```typescript
      export const ListRefundsQuery = z.object({
        limit: z
          .string()
          .regex(/^[0-9]{1,3}$/, 'limit must be a whole number')
          .transform(Number)
          .pipe(z.number().int().min(1).max(100))
          .default(20),
        status: z.enum(['pending', 'succeeded', 'failed']).optional(),
      });
      ```

      Real results: `{}` gives `{ limit: 20 }`; `limit=50&utm_source=mail` gives `{ limit: 50 }` (unknown
      **query** parameters are stripped - links often carry tracking parameters, so rejecting them would
      break real clients); ` 20`, `2e1` and the empty string give `limit must be a whole number`; `101` gives
      `Too big: expected number to be <=100`; a repeated `limit` gives `Invalid input: expected string,
      received array`.

      **Express 5 detail:** `req.query` is a getter now. Assigning the parsed result to it throws - real
      run: `Cannot set property query of #<IncomingMessage> which has only a getter`. Put parsed query data
      in `res.locals` (or pass it explicitly) instead. `req.body` can still be replaced.

  - id: taxonomy
    kind: internals
    concepts: [error-taxonomy]
    title: Classifying errors - and mapping them in one place
    body: |
      Every failure in an API falls into one of three groups. The status code follows from the group, and
      so does what you tell the client:

      | Group | Examples | Status | What the client gets | Log |
      |---|---|---|---|---|
      | **Client error** - the request is wrong | malformed JSON, schema failure, unknown payment, refund larger than the capture, stale `If-Match` | 400, 404, 409, 412, 413, 415, 422 | what is wrong and how to fix it | info or warn, without the full body |
      | **Operational error** - the world failed | database down, provider timeout, disk full | 500, 502, 503 (+ `Retry-After`), 504 | "temporarily unavailable", a request id | error, with the details |
      | **Programmer error** - a bug | `TypeError: Cannot read properties of undefined`, an `assertNever` that fired | 500 | "something went wrong", a request id | error, with the stack - and fix the bug |

      **Status codes for bad input.** Malformed JSON - the syntax is broken - is **400**. A body that parses
      but fails the schema is **422 Unprocessable Content** (RFC 9110: the content type and syntax are fine,
      but the server was "unable to process the contained instructions"); many APIs use 400 for both, which is
      also acceptable - Track C's lesson says it: be consistent. A body that isn't JSON at all is **415**. Too
      large is **413**. This lesson uses 400 / 413 / 415 / 422; [REST API design](#/lesson/rest-api-design)
      covers choosing codes in general.

      **Express the groups as types**, and decide the status in **one** place. Handlers throw (or forward)
      typed errors; they never build error responses themselves:

      ```typescript
      /** The request failed its schema. */
      export class ValidationError extends Error {
        constructor(readonly errors: FieldError[]) {
          super('request validation failed');
          this.name = 'ValidationError';
        }
      }

      /** An expected failure the client can act on. Its title and detail are written for the client. */
      export class AppError extends Error {
        constructor(
          readonly status: number,
          readonly slug: string,
          readonly title: string,
          readonly detail?: string,
        ) {
          super(title);
          this.name = 'AppError';
        }
      }

      // in a service:
      if (refund.amountMinor > payment.capturedMinor - payment.refundedMinor) {
        throw new AppError(409, 'refund-exceeds-capture', 'Refund exceeds the remaining captured amount');
      }
      ```

      Anything that is **not** one of these known types - a raw `Error` from the database driver, a
      `TypeError` - is, by definition, unexpected, and becomes a generic 500. That default is the safe one:
      you have to *opt in* to showing a message to the client, by writing an `AppError` whose text you
      chose. ASVS 16.5.3 asks for exactly this "fail securely" behaviour - no "processing a transaction
      despite errors resulting from validation logic".

  - id: visual
    kind: visual
    concepts: [trust-boundary-validation, error-taxonomy, safe-error-responses]
    title: From request to response - where each failure is caught
    body: |
      Follow a `POST /payments/pay_1001/refunds`. Every failure leaves the normal path and ends in the same
      error handler, which alone decides what the client sees.

      ```mermaid
      flowchart TD
        A[Request] --> B[express.json - size limit and JSON syntax]
        B -->|malformed - 400 / too large - 413| H[problemHandler]
        B --> C[validateBody - Content-Type and zod schema]
        C -->|not JSON - 415 / schema issues - 422| H
        C -->|parsed and typed data| D[Handler and service]
        D -->|AppError - its 4xx| H
        D -->|unexpected error - generic 500| H
        D -->|201 Created| R[Response]
        H -->|application/problem+json with requestId| R
        H -.->|full error and stack for 500| L[Server log with requestId]
      ```

      What to notice: the handler and service only ever see **typed, parsed** data - nothing unchecked gets
      past `validateBody`. And there is exactly **one** place (`problemHandler`) that turns errors into
      responses, so the format, the status mapping and the "leak nothing" rule are enforced once.

  - id: middleware-and-handler
    kind: code
    concepts: [schema-parsing-zod, safe-error-responses]
    title: Validation middleware and the Problem Details error handler
    body: |
      A middleware factory validates and replaces `req.body`; failures go to `next()` - the middleware never
      sends the response itself:

      ```typescript
      export function validateBody(schema: z.ZodType): RequestHandler {
        return (req, res, next) => {
          if (!req.is('application/json')) {
            next(new AppError(415, 'unsupported-media-type', 'Content-Type must be application/json'));
            return;
          }
          const result = schema.safeParse(req.body);
          if (!result.success) {
            next(new ValidationError(toFieldErrors(result.error)));
            return;
          }
          req.body = result.data; // the parsed, trimmed data - never the raw input
          next();
        };
      }

      app.post('/payments/:id/refunds', validateBody(CreateRefundBody), createRefund);
      ```

      `toFieldErrors` maps each zod issue to RFC 9457's validation example - `detail` plus a JSON Pointer
      `pointer` to the field, so `["note"]` becomes `#/note` and `[]` (the whole body) becomes `#`.

      The error handler, registered last:

      ```typescript
      export const problemHandler: ErrorRequestHandler = (err, req, res, next) => {
        if (res.headersSent) return next(err);
        const requestId = res.locals.requestId as string | undefined;
        const send = (status: number, slug: string, title: string, extra: Record<string, unknown> = {}) => {
          res
            .status(status)
            .type('application/problem+json')
            .json({ type: PROBLEMS + slug, title, status, ...extra, requestId });
        };
        const parserType = typeof err === 'object' && err !== null ? (err as { type?: unknown }).type : undefined;

        if (err instanceof ValidationError) {
          send(422, 'validation-error', 'Your request is not valid.', { errors: err.errors });
        } else if (parserType === 'entity.parse.failed') {
          send(400, 'malformed-json', 'Request body is not valid JSON');
        } else if (parserType === 'entity.too.large') {
          send(413, 'payload-too-large', 'Request body is too large');
        } else if (err instanceof AppError) {
          send(err.status, err.slug, err.title, err.detail === undefined ? {} : { detail: err.detail });
        } else {
          console.error(`[${requestId ?? 'no-request-id'}] unexpected error`, err);
          send(500, 'internal-error', 'Internal Server Error');
        }
      };
      ```

      Real responses from that app (`requestId` set by the request-id middleware from the Express lesson):

      ```plaintext
      POST /payments/pay_1001/refunds {"amountMinor":"2599","currency":"eur","reason":"other","isApproved":true}
      422 application/problem+json; charset=utf-8
      {
        "type": "https://api.sandpay.example/problems/validation-error",
        "title": "Your request is not valid.",
        "status": 422,
        "errors": [
          { "pointer": "#/amountMinor", "detail": "Invalid input: expected number, received string" },
          { "pointer": "#/currency", "detail": "Invalid option: expected one of \"EUR\"|\"GBP\"|\"INR\"|\"USD\"" },
          { "pointer": "#", "detail": "Unrecognized key: \"isApproved\"" }
        ],
        "requestId": "req_7Hq2"
      }

      POST /payments/pay_1001/refunds   (body: {"amountMinor": 2599,   - truncated JSON)
      400 {"type":".../malformed-json","title":"Request body is not valid JSON","status":400,"requestId":"req_7Hq2"}

      GET /payments/pay_9999
      404 {"type":".../payment-not-found","title":"Payment not found","status":404,"detail":"No payment pay_9999","requestId":"req_7Hq2"}

      GET /ledger   (the handler throws Error('relation "ledger_entries" does not exist'))
      500 {"type":".../internal-error","title":"Internal Server Error","status":500,"requestId":"req_7Hq2"}
      ```

      And the server log for that 500 - the only place the real error appears:

      ```plaintext
      [req_7Hq2] unexpected error Error: relation "ledger_entries" does not exist
          at <anonymous> (.../cap.ts:10:40)
          at Layer.handleRequest (.../node_modules/router/lib/layer.js:152:17)
          ...
      ```

      A support ticket that quotes `req_7Hq2` leads straight to this line. That is the "ticket number" from
      the cashier analogy - and RFC 9457 allows it as an extension member (section 3.2: "Problem type
      definitions MAY extend the problem details object with additional members").

  - id: line-by-line
    kind: line-by-line
    concepts: [safe-error-responses, error-taxonomy]
    title: Why the handler is written that way
    body: |
      - **`if (res.headersSent) return next(err);`** - if a stream already started, you can't change the
        status; hand over to Express, which closes the connection (see the Express lesson).
      - **`.type('application/problem+json')`** - the media type RFC 9457 registers; clients and API
        gateways can recognise an error body without parsing it. Without it, `res.json` sends
        `application/json`.
      - **`type: PROBLEMS + slug`** - a stable URI per kind of problem. Clients branch on `type`, never on
        the human-readable `title` or `detail`: RFC 9457 3.1.4 - "Consumers SHOULD NOT parse the detail
        member for information".
      - **`status` in the body** duplicates the HTTP status; RFC 9457 section 5 notes the two can disagree
        if a proxy rewrites the code. Send it for convenience, but make your own clients trust the HTTP
        status.
      - **`err instanceof ValidationError` / `AppError`** - the allow-list of errors that may speak to the
        client. Order matters only between overlapping checks; here each branch is distinct.
      - **The final `else`** - deliberately ignores `err.message`. Even an innocent-looking message ("relation
        ledger_entries does not exist") names a table, and others name hosts, file paths or user data.
        `detail` "ought to focus on helping the client correct the problem, rather than giving debugging
        information" (RFC 9457 3.1.4).
      - **`console.error(..., err)`** - log the whole error object, so the stack is kept, tagged with the
        request id (ASVS 16.3.4: log "unexpected errors"). In production use a structured logger; never log
        whole request bodies or secrets (ASVS 16.2.5), and escape untrusted values so they can't forge log
        lines (16.4.1).
      - **Body-parser errors by `err.type`** - `entity.parse.failed` and `entity.too.large` are the types
        body-parser documents; checking them is more reliable than checking `err.status`, which every
        library sets differently.

  - id: sharing-schemas
    kind: when
    concepts: [schema-parsing-zod, trust-boundary-validation]
    title: When to share schemas with the frontend - and what they don't replace
    body: |
      Because the schema is ordinary TypeScript, the same `CreateRefundBody` can run in the React form
      ([Forms and validation in React](#/lesson/react-forms-and-validation)) for instant feedback and in the
      API as the real check. Put it in a package or folder both import. The pointers in the 422 (`#/note`)
      map straight back to form fields.

      Share when the rules are **purely about the shape** of the request. Keep on the server only:

      - rules that need **server data** - "refund at most the remaining captured amount", "currency must
        match the payment's" - the client can't check them honestly;
      - anything **security-relevant**: the client copy is a convenience the user can switch off (ASVS 2.2.2).

      The server **always** validates, whether or not the client did. The client copy may be older than the
      server (a cached bundle, an old mobile app), so the server's 422 must be readable by a client that
      didn't expect it.

      **What validation doesn't replace:** parameterised SQL (the database lessons), output encoding for HTML
      and authorization checks ([OWASP Top 10 for developers](#/lesson/owasp-top-10-for-developers)), and
      [OpenAPI](#/lesson/openapi-contract-first) for documenting the contract - which can be generated from,
      or checked against, the same schemas.

  - id: example
    kind: example
    concepts: [trust-boundary-validation, error-taxonomy, safe-error-responses]
    title: "A real-world scenario: the refund that wasn't a refund"
    body: |
      A SandPay merchant's integration sends refunds from its own back office. In production, support sees:

      1. A refund of **-25.99** was recorded as a *payout* to the customer's card. The old handler checked
         `if (!amount)` - and `-2599` is truthy.
      2. A refund with `"amountMinor": "2599"` was stored as **25990** in a report, because a later step did
         `amount + '0'` string concatenation on the unparsed value.
      3. When the ledger database failed over, merchants received `500 {"error": "connect ECONNREFUSED
         10.20.4.17:5432"}` - an internal IP address and port in a customer-facing response.

      What the fixed design does:

      - `CreateRefundBody` rejects `-2599` (`min(1)`) and `"2599"` (wrong type) with a **422** that names
        the field. Nothing reaches the ledger, so nothing has to be reversed.
      - The handler receives a `CreateRefund` whose `amountMinor` is a `number` - TypeScript itself now
        refuses `amount + '0'` where a number is required.
      - The failover produces `500 internal-error` with a request id; the log has the `ECONNREFUSED` line.

      What a tester checks for each fix: the status **and** that nothing was written (`GET` the payment's
      refunds afterwards); the `Content-Type` of the error; that the 500 body contains no IP, port, SQL, stack
      or library name; and that the request id in the response finds the log line.

  - id: tests
    kind: tests
    concepts: [trust-boundary-validation, safe-error-responses]
    title: Testing validation and error handling
    body: |
      | # | Case | Request | Expected | Evidence |
      |---|---|---|---|---|
      | V1 | Valid refund | all fields valid, note with spaces | 201, note trimmed | body; GET shows one refund |
      | V2 | Boundaries of amount | 1, 10 000 000 / 0, 10 000 001 | accepted / 422 `#/amountMinor` | status, pointer, no refund stored |
      | V3 | Wrong types | `"2599"`, `25.99`, `null`, `true` | 422 `#/amountMinor` | pointer; ledger unchanged |
      | V4 | Allow-list | `eur`, `JPY`, `" EUR"` | 422 `#/currency` | pointer |
      | V5 | Unknown field | add `"isApproved": true` | 422 `#` naming the key | pointer and detail |
      | V6 | Cross-field | reason `other` without / with blank note | 422 `#/note` | pointer |
      | V7 | Not JSON | form-encoded or `text/plain` | 415 | not 500, not an empty refund |
      | V8 | Malformed JSON | truncated body | 400 `malformed-json` | problem JSON, request id |
      | V9 | Too large | body over the limit | 413 | before any handler runs (no log line from it) |
      | V10 | Query | `limit=0`, `101`, `2e1`, empty, repeated | 422 `#/limit` | pointer |
      | V11 | Unknown payment | `pay_9999` | 404 `payment-not-found` | problem JSON |
      | V12 | Server failure | stop the database or stub it to throw | 500 `internal-error` only | no SQL, host, stack or message in the body; log line with the same request id |

      Two habits that catch most regressions: **assert the state after a rejected request**, not just the
      status, and **assert on `type` and `pointer`**, not on zod's message text, which can change between
      versions.

  - id: mistakes
    kind: mistakes
    concepts: [schema-parsing-zod, error-taxonomy, safe-error-responses]
    title: Common mistakes and how to debug them
    body: |
      - **Validating, then using the raw input.** `schema.parse(req.body)` without keeping the result, then
        `db.insert(req.body)` - the trimming, defaults and key stripping are lost and unknown keys reach the
        database. Use the parsed value only.
      - **`schema.parse` in the handler with no error mapping.** `parse` throws a `ZodError`; with no branch
        for it, the error handler answers **500** for a client mistake. Symptom: alerts for bad input.
        Debug: look at the error class in the log line for that request id.
      - **Coercing everything.** `z.coerce.number()` on a JSON body accepts `"2599"` and `true` (becomes 1).
        Coerce only strings that must be converted (query, path, headers), and then strictly.
      - **Echoing `err.message` to the client.** Fine for your own `AppError`, dangerous for anything else.
        The safe default is "unknown error, generic message".
      - **Different error shapes per route.** One route sends `{ "error": "..." }`, another a Problem Details
        object, a third HTML. Clients then parse three formats. One handler, registered last.
      - **Validating only the body.** Path ids, query parameters and headers (`Idempotency-Key`,
        `X-Request-Id`) are input too. So are the responses of the payment provider you call.
      - **Treating a missing record as a 500.** A `null` from the database flowing into
        `payment.capturedMinor` gives `TypeError` and a 500; check and throw `AppError(404, ...)`.

      **Debugging method:** reproduce with the exact request (`curl -v` or the test), read the response's
      `type` and `requestId`, find the log line by request id, then ask *which layer* rejected it - parser
      (400/413), validation middleware (415/422), service (`AppError`), or nothing (500 = unexpected).

  - id: tradeoffs
    kind: tradeoffs
    concepts: [schema-parsing-zod, safe-error-responses]
    title: Trade-offs and alternatives
    body: |
      - **zod or JSON Schema?** zod is TypeScript-first: one definition, a static type, readable code - but
        it lives only in JavaScript. **JSON Schema** (with a validator such as Ajv) is language-neutral and
        is what OpenAPI 3.1 uses, so other teams and tools can read it. Many projects generate one from the
        other; check each tool's current documentation for what converts losslessly. Valibot, Joi and
        ArkType are other JavaScript options with different trade-offs (bundle size, speed, API style).
      - **Strict or stripping objects?** Strict catches client bugs and probing, but makes adding an optional
        field a breaking change for old servers receiving it from new clients. Stripping is more tolerant to
        evolution. Choose per endpoint, document it, and be consistent.
      - **400 or 422 for schema errors?** Both are used; 422 separates "your JSON is broken" from "your JSON
        is wrong". Pick one and document it.
      - **How much detail in 4xx errors?** Field-level errors help honest clients a lot and attackers very
        little. Be careful with endpoints where the error itself is information - "no account with this
        email" on a login or password-reset form tells an attacker which accounts exist.
      - **Error codes in a library or by hand?** Packages exist that turn errors into Problem Details; the
        handler here is twenty lines and has no dependency. Whatever you use, test that the unexpected-error
        path leaks nothing.

  - id: summary
    kind: summary
    concepts: [trust-boundary-validation, schema-parsing-zod, error-taxonomy, safe-error-responses]
    title: Quick reference
    body: |
      - Every input crossing a trust boundary is untrusted - body, path, query, headers, env, queues, other
        services. Validate **on the server**, at the edge, before any side effect.
      - **Allow-list**: types, ranges, lengths, exact choices, known fields. Never a deny-list or "cleaning".
      - **Parse, don't validate**: `safeParse` → typed `data` or `issues`; use only the parsed data;
        `z.infer` for the type; `z.strictObject` to reject unknown keys.
      - Query values are strings (or arrays): check the text, then convert. `z.coerce.number()` accepts
        ` 20`, `2e1`, `0x10` and turns `""` into 0. Express 5's `req.query` can't be assigned.
      - Client error → 4xx with what to fix; operational or programmer error → 5xx with nothing but a
        request id. Typed errors in code, mapped to statuses in **one** handler.
      - Problem Details: `application/problem+json`, `type`, `title`, `status`, `errors[]` with `pointer` and
        `detail`, `requestId`. Never messages, stacks, SQL or hosts from unexpected errors (CWE-209,
        ASVS 16.5.1); log them with the request id.

exercises:
  - id: boundary-inventory
    type: short
    concept: trust-boundary-validation
    skill: application
    title: List the trust boundaries of an endpoint
    prompt: |
      `POST /payments/:paymentId/refunds` on the SandPay API: the merchant sends a JSON body and an
      `Idempotency-Key` header; the handler loads the payment from PostgreSQL, calls the card processor's
      refund API, stores the result and later receives the processor's webhook confirming it. List every
      input that crosses a trust boundary on this path, and for each, one rule you would enforce.
    hints:
      - Start with the HTTP request - there is more in it than the body.
      - Your service also *receives* data when it calls someone else.
      - Is data from your own database always in the shape this version of the code expects?
    modelAnswer: |
      - **Path `paymentId`** - format (`pay_` plus allowed characters, bounded length); then authorization:
        the payment belongs to the calling merchant.
      - **Body** - the refund schema: integer amount in range, currency allow-list, reason enum, note
        length, no unknown keys; semantics against the payment (not over the remaining captured amount, same
        currency).
      - **`Idempotency-Key` header** - present, bounded length and allowed characters (for example a UUID).
      - **Other headers used** - `Content-Type` must be JSON; `X-Request-Id` only reused if safe.
      - **Database row** - the payment may be missing (404) or have a status this code doesn't handle
        (PENDING, VOIDED) - check before using it.
      - **Processor's refund response** - parse it with a schema too; unknown statuses and missing fields
        are an operational error (502/503 or a pending state), not a crash.
      - **The webhook** - a separate trust boundary: verify the signature first, then parse the payload
        with a schema, and look the refund up by id instead of trusting amounts in it.
      - **Configuration** (processor URL, keys, limits) - validated at start-up so a wrong environment fails
        fast.
    rubric:
      - Includes path parameter, body and at least one header.
      - Includes the response from the external processor, not only incoming requests.
      - Includes the webhook as its own boundary with signature verification before parsing.
      - Mentions a semantic rule that needs server data (remaining captured amount or currency match).
      - Treats the database row as possibly missing or in an unexpected state.
    solution: |
      Path id, body, `Idempotency-Key` and `Content-Type` headers, the payment row (missing or odd status),
      the processor's response, the webhook (signature first, then schema) and configuration. Each gets an
      allow-list rule; the refund amount also needs a semantic check against the payment.

  - id: deny-list-note
    type: mcq
    concept: trust-boundary-validation
    skill: analysis
    title: The note field and the security review
    prompt: |
      A security review flags the refund `note` field (free text, stored and shown in the merchant
      dashboard). A teammate proposes this validation:

      ```typescript
      note: z.string().refine((s) => !/<script|'|--|;/i.test(s), 'note contains forbidden characters')
      ```

      What is the best response?
    options:
      - id: allow-list-plus
        text: Replace it with a length limit (and trimming) on the note, and fix the real risks where they are - parameterised SQL when storing and output encoding when rendering.
        feedback: Correct - for free text, an allow-list is "broad Unicode text while limiting its length" (OWASP); the injection defences belong at the query and the HTML output, which validation can't replace.
      - id: extend
        text: Keep it and add more patterns - onerror=, javascript:, UNION SELECT.
        feedback: That is the deny-list race OWASP warns against - "Do not try to recognize every malicious string." There is always another encoding, and you'll reject honest notes along the way.
      - id: strip
        text: Remove the forbidden characters instead of rejecting the note.
        feedback: OWASP lists "denylisting or cleaning input" as a pitfall - stripping changes the meaning and still doesn't protect the query or the page.
      - id: keep
        text: Keep it - it blocks the common attacks and costs nothing.
        feedback: It rejects legitimate notes ("customer's parcel; resend") and blocks nothing a determined attacker needs. It costs honest users and gives false confidence.
    correct: [allow-list-plus]
    hints:
      - What does a legitimate note look like? Do apostrophes appear in real text?
      - Where does SQL injection actually happen, and where does XSS?
    solution: |
      The OWASP cheat sheet uses this exact example: "Blocking apostrophes, for example, rejects legitimate
      names without making a database query safe." The note's acceptance rules are type and length; the
      injection risks are handled by parameterised queries and context-aware output encoding (React escapes
      text by default). **Confirm** by trying `O'Brien; please resend` - the proposed rule rejects an honest
      note.
    followUp: |
      The same review asks about `merchantReference`, which merchants use to match refunds to their own
      orders (letters, digits, `-` and `_`, up to 64 characters). Is a pattern appropriate here, and why is
      that different from the note?

  - id: parse-or-validate
    type: debug
    concept: schema-parsing-zod
    skill: analysis
    title: Validated - and still the wrong data in the database
    prompt: |
      The refund schema trims `note` and rejects unknown keys. Yet refunds in the database have notes with
      trailing spaces, and one row has `status: 'SETTLED'` set by a client. Click the line that causes both.
    language: typescript
    code: |
      app.post('/payments/:id/refunds', async (req, res) => {
        const result = CreateRefundBody.safeParse(req.body);
        if (!result.success) {
          throw new ValidationError(toFieldErrors(result.error));
        }
        const refund = await refunds.insert({ paymentId: req.params.id, ...req.body });
        res.status(201).location(`/refunds/${refund.id}`).json(refund);
      });
    correctLines: [6]
    lineNotes:
      - line: 2
        note: safeParse is the right call - it returns the parsed data without throwing.
      - line: 4
        note: Throwing a typed error is right; Express 5 forwards it to the error handler.
      - line: 7
        note: Sending the stored refund is fine - the problem is what was stored.
    hints:
      - Which object holds the trimmed note without unknown keys?
      - What does `result` contain when parsing succeeds?
      - The fix replaces two words.
    solution: |
      **Line 6** spreads `req.body` - the **raw** input - into the insert, so the schema's output (trimmed
      note, only known keys) is thrown away. With `z.object` (stripping) a field like `status` would also slip
      through this way; validation passed and the unvalidated data was used anyway. Fix: `...result.data`.
      **Confirm** with a test that sends a note with spaces and an extra key and then reads the stored row.
      This is the core of "parse, don't validate": once parsed, only the parsed value exists for the
      code after it.
    followUp: |
      How would `validateBody` middleware that replaces `req.body` with `result.data` make this bug
      impossible in every route at once?

  - id: coerce-limit
    type: mcq
    concept: schema-parsing-zod
    skill: application
    title: A query parameter that accepts too much
    prompt: |
      `GET /payments?limit=` uses `z.coerce.number().int().min(1).max(100)`. A tester reports that
      `limit=0x10` returns 16 payments and `limit=` (empty) returns a 422 saying "Too small: expected
      number to be >=1". What is the best fix?
    options:
      - id: regex-then-number
        text: Check the string first (digits only, at most three), then convert with Number and check the range with .pipe.
        feedback: Correct - the text is what the client sent; checking it before converting is what makes the contract "a whole number written in digits".
      - id: number-not-coerce
        text: Use z.number() instead of z.coerce.number().
        feedback: Query values are always strings in Express, so z.number() rejects every request, including limit=20.
      - id: parse-int
        text: Use Number.parseInt(req.query.limit) before the schema.
        feedback: parseInt('20abc') is 20, parseInt('1e3') is 1 and parseInt('0x10') is 16 - it trades one set of surprises for another, and a repeated parameter (an array, which becomes the text "1,2") is silently read as 1.
      - id: accept
        text: Nothing - 0x10 is a valid number, and the empty-string message is good enough.
        feedback: The documented contract is a whole number from 1 to 100; other layers (cache keys, gateways, logs) will read 0x10 differently, and the misleading message costs client developers time.
    correct: [regex-then-number]
    hints:
      - What does Number('0x10') return? And Number('')?
      - Which form of the value is the client's real input - the string or the number?
    solution: |
      `z.coerce.number()` runs `Number(input)`, which accepts hex, exponents and surrounding spaces and turns
      `""` into `0` - real results in the lesson. Check the **text** with `z.string().regex(/^[0-9]{1,3}$/)`,
      then `.transform(Number).pipe(z.number().int().min(1).max(100))`. **Confirm** with a table-driven test:
      `20`, `1`, `100` pass; `0`, `101`, `2e1`, ` 20`, `0x10`, empty and a repeated parameter all fail with
      pointer `#/limit`.

  - id: classify-errors
    type: order
    concept: error-taxonomy
    skill: application
    title: Order the error handler's checks
    prompt: |
      Put the branches of SandPay's error handler in the order they should be checked, from first to last,
      so that each error gets the right response and nothing unexpected is ever described to the client.
    items:
      - id: headers-sent
        text: "Response already started (res.headersSent) - hand over with next(err)"
      - id: validation
        text: "ValidationError - 422 validation-error with errors[]"
      - id: parser
        text: "body-parser errors by err.type - 400 malformed-json / 413 payload-too-large"
      - id: app-error
        text: "AppError - its own status, slug, title and detail"
      - id: fallback
        text: "Anything else - log with the request id, send a generic 500"
    hints:
      - Which check makes every other branch impossible to carry out?
      - Which branch must catch everything the others didn't?
    solution: |
      **headersSent first** - if the response has started, no branch can send a new status. Then the
      **known, specific** errors (validation, parser, AppError - their relative order doesn't matter as long
      as they can't overlap), and the **generic 500 last**, as the catch-all. Putting the fallback anywhere
      but last would turn known client errors into 500s; making the fallback describe the error would turn
      any unexpected failure into a leak.

  - id: status-for-failures
    type: mcq
    concept: error-taxonomy
    skill: analysis
    title: Which status for this failure?
    prompt: |
      A merchant refunds 120.00 on a payment of which 100.00 was captured and nothing refunded yet. The body
      passes the schema. The service loads the payment, sees the amount is too high and must reject it.
      Which response is best?
    options:
      - id: conflict
        text: 409 (or 422) with a specific problem type such as refund-exceeds-capture, and a detail saying how much can still be refunded.
        feedback: Correct - it's a client error about the request in relation to the resource's current state; a specific type lets the client handle it, and the detail helps fix it.
      - id: server
        text: 500, because the check happens in the service, not in validation.
        feedback: Where the check runs doesn't decide the group - the client sent a request that can't be honoured and can fix it. A 500 tells it to retry, which will fail the same way.
      - id: bad-request-generic
        text: 400 with the same validation-error type and a pointer to #/amountMinor.
        feedback: Possible, but it hides a business rule behind the generic schema type, so clients can't distinguish "malformed amount" from "too much to refund". A dedicated type is clearer.
      - id: forbidden
        text: 403, because the merchant isn't allowed to refund that much.
        feedback: 403 is about permission - who is asking. Any merchant would get the same answer here; the problem is the amount versus the payment's state.
    correct: [conflict]
    hints:
      - Can the client fix this by changing the request?
      - Is the problem the request's shape, or the request compared with the payment's current state?
    solution: |
      It's a **client error** that needs server data to detect, so it's raised in the service as an
      `AppError` - 409 Conflict (the request conflicts with the payment's state) or 422, depending on your
      documented convention - with its own problem `type` and a client-friendly `detail` ("At most 100.00 EUR
      can be refunded"). Never 500: the client can fix it, and nothing failed on the server.

  - id: leaky-handler
    type: debug
    concept: safe-error-responses
    skill: analysis
    title: The error handler from the first sprint
    prompt: |
      A penetration test reports CWE-209 on the SandPay API: forcing a database error returns the table name
      and the database host. Click the line responsible.
    language: typescript
    code: |
      app.use((err: unknown, req: Request, res: Response, next: NextFunction) => {
        const requestId = res.locals.requestId;
        logger.error({ err, requestId }, 'request failed');
        const status = err instanceof AppError ? err.status : 500;
        const message = err instanceof Error ? err.message : 'Unknown error';
        res.status(status).type('application/problem+json').json({ title: message, status, requestId });
      });
    correctLines: [5]
    lineNotes:
      - line: 3
        note: Logging the full error with the request id on the server is exactly right - the log is where details belong.
      - line: 4
        note: Mapping only AppError to its own status and everything else to 500 is the safe default.
      - line: 6
        note: This line sends the message, but the decision to use the raw message for every error was made on the line before.
    hints:
      - Which errors' messages are safe to show to a client?
      - For a database error, what does err.message contain?
    solution: |
      **Line 5** takes `err.message` from **any** error - including the driver's `relation "ledger_entries"
      does not exist` or `connect ECONNREFUSED 10.20.4.17:5432` - and line 6 sends it as the `title`. Only
      messages you wrote for the client (`AppError.title`) may be sent; for everything else use a fixed
      title ("Internal Server Error"). **Confirm** with a test that makes a stub throw an error containing
      SQL and a host, and asserts the response body contains neither while the log does.
    followUp: |
      The same handler is also missing one check that matters for streamed responses. Which one?

  - id: refund-schema
    type: coding
    concept: schema-parsing-zod
    skill: application
    title: Write the refund schemas
    prompt: |
      In `refund-schema.ts`, replace the loose first drafts with the real boundary schemas: `CreateRefundBody`
      (integer amount 1 to `MAX_REFUND_MINOR`, exact currency allow-list, reason enum, optional trimmed note of
      1-500 characters that is **required** when the reason is `other`, unknown keys rejected),
      `ListRefundsQuery` (`limit` written in digits only, 1-100, default 20; optional `status`; unknown query
      parameters ignored) and `toFieldErrors`, which turns zod issues into `{ pointer, detail }` with RFC 6901
      JSON Pointer escaping.
    project: fullstack
    files:
      - exercises/validation/refund-schema.ts
    test: tests/validation/refund-schema.test.ts
    command: npx vitest run tests/validation/refund-schema.test.ts
    hints:
      - "`z.strictObject({...})` reports unknown keys; `z.enum(CURRENCIES)` is an exact allow-list."
      - "`.refine(fn, { path: ['note'], message })` on the object attaches a cross-field error to the note."
      - "For limit: `z.string().regex(/^[0-9]{1,3}$/).transform(Number).pipe(z.number().int().min(1).max(100)).default(20)`."
      - "A pointer is `'#'` plus `'/' + segment` for each path part, with `~` written `~0` and `/` written `~1` (in that order)."
    modelAnswer: |
      ```typescript
      export const CreateRefundBody = z
        .strictObject({
          amountMinor: z.number().int().min(1).max(MAX_REFUND_MINOR),
          currency: z.enum(CURRENCIES),
          reason: z.enum(REASONS),
          note: z.string().trim().min(1).max(500).optional(),
        })
        .refine((body) => body.reason !== 'other' || body.note !== undefined, {
          path: ['note'],
          message: 'note is required when reason is other',
        });

      export const ListRefundsQuery = z.object({
        limit: z
          .string()
          .regex(/^[0-9]{1,3}$/, 'limit must be a whole number')
          .transform(Number)
          .pipe(z.number().int().min(1).max(100))
          .default(20),
        status: z.enum(['pending', 'succeeded', 'failed']).optional(),
      });

      export function toFieldErrors(error: z.ZodError): FieldError[] {
        return error.issues.map((issue) => ({
          pointer:
            '#' + issue.path.map((part) => '/' + String(part).replaceAll('~', '~0').replaceAll('/', '~1')).join(''),
          detail: issue.message,
        }));
      }
      ```

      `z.number().int()` rejects `"2599"`, `25.99` and `null` without any coercion. `trim()` runs before
      `min(1)`, so a blank note counts as missing. The query schema checks the **text** before converting,
      which is what rejects `2e1`, ` 20`, `0x10` and the empty string; a repeated parameter is an array and
      fails `z.string()`. Escaping `~` before `/` matters: the other order would turn `/` into `~1` and then
      into `~01`.
    rubric:
      - Every test in tests/validation/refund-schema.test.ts passes.
      - No z.coerce anywhere - JSON bodies keep their types and query text is checked before conversion.
      - The currency and reason rules are exact allow-lists (enums), not patterns.
      - The cross-field rule reports its error at the note's path, so a client can show it next to the field.
      - The exported types are derived with z.infer, not written by hand.
    solution: |
      `z.strictObject` with `z.number().int().min(1).max(...)`, two `z.enum` allow-lists, a trimmed optional
      note and a `.refine` with `path: ['note']`; a query `limit` checked as digits then piped to a number
      range with a default; and `toFieldErrors` building `#/...` pointers with `~0` / `~1` escaping. The
      reference is `solutions/validation/refund-schema.ts`.
    followUp: |
      Add `merchantReference` (optional; letters, digits, `-` and `_`; 1-64 characters) and a batch schema
      `CreateRefundsBatch` with 1-100 refunds. What pointer does an error in the third refund's currency get?

  - id: problem-handler
    type: coding
    concept: safe-error-responses
    skill: application
    title: Validation middleware and a Problem Details error handler
    prompt: |
      In `validate.ts` (do `refund-schema.ts` first), replace the first drafts: `validateBody(schema)` (415
      for non-JSON, 422 `ValidationError` on schema failure, replaces `req.body` with the parsed data),
      `validateQuery(schema)` (parsed query in `res.locals.query`, because Express 5's `req.query` can't be
      assigned) and `problemHandler`, which answers every error as `application/problem+json` with `type`,
      `title`, `status` and `requestId` - 422 with `errors` for validation, 400 and 413 for body-parser
      errors, the `AppError`'s own fields, and a generic 500 that leaks nothing while the real error is
      logged with the request id.
    project: fullstack
    files:
      - exercises/validation/validate.ts
    test: tests/validation/validate.test.ts
    command: npx vitest run tests/validation/validate.test.ts
    hints:
      - "`req.is('application/json')` is falsy when the request isn't JSON; pass an `AppError(415, ...)` to `next()`."
      - Middleware should call `next(error)` and return - never send the error response itself.
      - "`res.status(s).type('application/problem+json').json({...})` - `.type()` after `.json()` would be too late."
      - "body-parser errors carry `type: 'entity.parse.failed'` or `'entity.too.large'`."
      - The 500 branch must not read err.message at all - log the whole err, send fixed text.
    modelAnswer: |
      ```typescript
      export function validateBody(schema: z.ZodType): RequestHandler {
        return (req, res, next) => {
          if (!req.is('application/json')) {
            next(new AppError(415, 'unsupported-media-type', 'Content-Type must be application/json'));
            return;
          }
          const result = schema.safeParse(req.body);
          if (!result.success) {
            next(new ValidationError(toFieldErrors(result.error)));
            return;
          }
          req.body = result.data;
          next();
        };
      }

      export function validateQuery(schema: z.ZodType): RequestHandler {
        return (req, res, next) => {
          const result = schema.safeParse(req.query);
          if (!result.success) {
            next(new ValidationError(toFieldErrors(result.error)));
            return;
          }
          res.locals.query = result.data;
          next();
        };
      }

      export const problemHandler: ErrorRequestHandler = (err, req, res, next) => {
        if (res.headersSent) {
          next(err);
          return;
        }
        const requestId = res.locals.requestId as string | undefined;
        const send = (status: number, slug: string, title: string, extra: Record<string, unknown> = {}) => {
          res.status(status).type('application/problem+json').json({ type: PROBLEMS + slug, title, status, ...extra, requestId });
        };
        const parserType = typeof err === 'object' && err !== null ? (err as { type?: unknown }).type : undefined;
        if (err instanceof ValidationError) send(422, 'validation-error', 'Your request is not valid.', { errors: err.errors });
        else if (parserType === 'entity.parse.failed') send(400, 'malformed-json', 'Request body is not valid JSON');
        else if (parserType === 'entity.too.large') send(413, 'payload-too-large', 'Request body is too large');
        else if (err instanceof AppError) send(err.status, err.slug, err.title, err.detail === undefined ? {} : { detail: err.detail });
        else {
          console.error(`[${requestId ?? 'no-request-id'}] unexpected error`, err);
          send(500, 'internal-error', 'Internal Server Error');
        }
      };
      ```

      The first drafts show three classic bugs: `schema.parse` throws a `ZodError` the handler doesn't know
      (a 500 for bad input), assigning `req.query` throws in Express 5, and echoing `err.message` leaks the
      SQL from the `/ledger` test route. The fixed version only describes errors it recognises.
    rubric:
      - Every test in tests/validation/validate.test.ts passes.
      - The middleware never sends responses; every error goes through next() to the one handler.
      - The 500 branch sends fixed text only and logs the full error with the request id.
      - Every error response uses application/problem+json and a stable type URI.
      - The parsed data replaces req.body (or lives in res.locals.query) - routes never see raw input.
    solution: |
      `validateBody` checks `req.is('application/json')`, uses `safeParse`, forwards a `ValidationError` or
      replaces `req.body`; `validateQuery` stores the result in `res.locals.query`; `problemHandler` checks
      `headersSent`, then the known error types in turn, and ends with a logged, generic 500. The reference is
      `solutions/validation/validate.ts`.
    followUp: |
      Add `validateParams(schema)` for `:id` path parameters (`pay_` followed by 4-32 letters or digits). What
      status should a malformed id get - 404 or 422 - and why might an API choose 404?

  - id: test-plan-refunds
    type: testdesign
    concept: trust-boundary-validation
    skill: analysis
    title: A validation and error-handling test plan
    prompt: |
      Design API tests for `POST /payments/:id/refunds` and `GET /payments/:id/refunds?limit=&status=` on the
      SandPay API as built in this lesson. Give at least ten cases with preconditions, the request, the
      expected response **and the evidence**, including how you prove nothing was written and nothing leaked.
    hints:
      - Use boundary values for every range, and every kind of wrong type.
      - Inputs come from more places than the body.
      - How do you produce a 500 on purpose in a test environment?
    modelAnswer: |
      1. **Valid refund** - payment captured 100.00; `amountMinor: 2599`, note with surrounding spaces → 201,
         note trimmed; GET lists one refund.
      2. **Amount boundaries** - `1` and `10000000` accepted; `0`, `-1`, `10000001` → 422 pointer
         `#/amountMinor`; refund list unchanged after each.
      3. **Amount types** - `"2599"`, `25.99`, `null`, `true`, missing → 422 `#/amountMinor`.
      4. **Currency allow-list** - `eur`, `JPY`, `" EUR"`, `978` → 422 `#/currency`.
      5. **Unknown key** - `"status": "SETTLED"` → 422 pointer `#`, detail names the key; DB row not created.
      6. **Cross-field** - reason `other` with no note and with `"   "` → 422 `#/note`.
      7. **Not JSON** - same fields form-encoded → 415 problem JSON.
      8. **Malformed / huge** - truncated JSON → 400 `malformed-json`; body over the limit → 413; both with a
         `requestId`.
      9. **Business rule** - amount above remaining capture → 409 (or 422) `refund-exceeds-capture`, detail
         says the maximum; nothing written.
      10. **Query** - `limit` `0`, `101`, `2e1`, empty, repeated → 422 `#/limit`; `limit=5&utm_source=x` → 200
          with 5 items; `status=SUCCEEDED` → 422 `#/status`.
      11. **Unexpected failure** - stop the database (or inject a failing repository in a test build) → 500
          `internal-error`; body contains exactly `type`, `title`, `status`, `requestId`; grep the body for
          SQL keywords, host names, IPs, `at ` stack lines - none; the log has the error with the same id.
      12. **Content-Type of every error** - `application/problem+json` for all of the above, never HTML.
    rubric:
      - Covers boundaries on both sides of each numeric range.
      - Checks state after rejected requests, not only the status.
      - Separates parser errors (400, 413), media type (415), schema (422) and business rules (409/422).
      - Includes query parameter cases, including a repeated parameter.
      - Forces an unexpected 500 and checks the body for leaks and the log for the request id.
      - Asserts on problem type and pointer, not on message wording.
    solution: |
      A strong plan walks every layer - parser, media type, schema, business rule, unexpected failure - with
      boundary values, checks the state after each rejection, asserts on `type` and `pointer`, and proves the
      500 leaks nothing while the request id finds the log line.

  - id: interview-validation
    type: interview
    concept: error-taxonomy
    skill: analysis
    title: "\"How do you handle validation and errors in your APIs?\""
    prompt: |
      An interviewer asks: "Walk me through how you handle input validation and errors in a Node.js API. What
      does a client see when something goes wrong - and what does your on-call engineer see?"
    modelAnswer: |
      Every request input is untrusted - body, path, query, headers - and so are responses from services I
      call. I validate on the server at the edge with a schema, before any side effect. I use zod in
      TypeScript: a schema per endpoint with allow-lists - exact enums, integer ranges, string lengths, unknown
      keys rejected on write endpoints - and cross-field rules as refinements. `safeParse` gives typed data,
      and only that parsed data goes further; the TypeScript type comes from the schema with `z.infer`.
      Query values are strings, so I check the text before converting instead of loosely coercing.

      Errors fall into client errors, operational failures and bugs. Code throws typed errors - a
      `ValidationError`, an `AppError` with a status and problem type for business rules like "refund exceeds
      capture" - and exactly one Express error handler maps them to RFC 9457 Problem Details: 422 with
      field errors and JSON pointers, 400/413 for parser errors, 404/409 for business errors. Anything it
      doesn't recognise becomes a generic 500. Every response carries a request id.

      The client sees what it can fix and nothing more - no messages from unexpected errors, no stack traces,
      SQL or host names (CWE-209). The on-call engineer searches the logs by the request id and gets the full
      error and stack, structured, without secrets or full bodies. I test the unhappy paths as seriously as the
      happy one: boundaries, wrong types, unknown keys, state after rejection, and a forced 500 that must leak
      nothing.
    rubric:
      - Names several input sources, not just the body, and validates server-side before side effects.
      - Describes allow-list rules and using only the parsed, typed data.
      - Distinguishes client errors from server errors and explains how statuses are chosen.
      - Describes one central handler and a consistent error format (Problem Details or equivalent).
      - Explains the generic 500 plus request-id correlation to logs.
      - Mentions testing failure paths, including leaks.
    followUps:
      - Would you share the validation schemas with the React frontend? What wouldn't you share?
      - A partner sends a field you don't know yet. Reject it or ignore it - and what does that mean for evolving the API?
      - How do you validate a webhook from a payment provider?
      - What would you log for a failed login, and what must you not log?
    hints:
      - Structure the answer - inputs, validation, error types, the handler, what each audience sees.
      - Mention one concrete library and one concrete standard.
    solution: |
      Untrusted inputs validated server-side at the edge with schemas (allow-lists, typed parsed data only);
      typed errors mapped in one handler to Problem Details; clients get actionable 4xx or a generic 500 with
      a request id; engineers find the full error by that id; failure paths are tested, including leaks.

placement:
  - id: place-mass-assignment
    type: mcq
    concept: trust-boundary-validation
    skill: application
    title: The extra field
    prompt: |
      A client sends `{"amountMinor": 500, "currency": "EUR", "reason": "duplicate", "status": "SETTLED"}`
      to the create-refund endpoint, which validates with a zod `z.object` schema (no `status` field) and then
      stores `req.body`. What happens to `status`?
    options:
      - id: stored
        text: It is stored, because the handler stores req.body - the raw input - instead of the parsed data.
        feedback: Correct - z.object strips unknown keys from the parsed result, but the raw req.body still has them. Store result.data (or have middleware replace req.body).
      - id: rejected
        text: The request is rejected with a 422, because the schema doesn't list status.
        feedback: z.object strips unknown keys by default rather than rejecting them; only z.strictObject reports them.
      - id: stripped
        text: It is dropped, because zod removes unknown keys.
        feedback: zod drops them from the parsed result it returns - not from req.body, which this handler stores.
      - id: type-error
        text: TypeScript prevents it at compile time.
        feedback: req.body is any (or unknown) at compile time and the value arrives at runtime; types can't see what a client sends.
    correct: [stored]
    solution: |
      Parsing only protects you if you use what it returns. zod's documentation: "By default, unrecognized keys
      are stripped from the parsed result" - the parsed result, not the input object. Store `result.data`, or
      use middleware that replaces `req.body`, and consider `z.strictObject` to reject such requests outright.

  - id: place-coerce
    type: mcq
    concept: schema-parsing-zod
    skill: application
    title: Coercing a query parameter
    prompt: |
      `z.coerce.number().int().min(1).max(100)` validates `?page=`. Which input does it **accept**?
    options:
      - id: hex
        text: "0x10 - it becomes 16"
        feedback: Correct - coercion runs Number('0x10'), which is 16, an integer within range.
      - id: empty
        text: "An empty value - it becomes the default"
        feedback: There is no default here; Number('') is 0, which fails min(1).
      - id: abc
        text: "abc - it becomes 0"
        feedback: Number('abc') is NaN, which zod rejects as not a number.
      - id: array
        text: "page=1&page=2 - the first value wins"
        feedback: Express 5 gives an array; Number(['1', '2']) is NaN, so it's rejected - no value "wins".
    correct: [hex]
    solution: |
      `z.coerce.number()` applies JavaScript's `Number()`, which accepts hexadecimal, exponent notation and
      surrounding whitespace. Check the text with a pattern first if the contract is "digits only".

  - id: place-status
    type: mcq
    concept: error-taxonomy
    skill: application
    title: The database is down
    prompt: |
      `GET /payments/pay_1001` fails because the database connection pool can't connect. Which response
      follows this lesson's approach?
    options:
      - id: generic-500
        text: "500 with a generic title and a request id; the connection error is logged with that id."
        feedback: Correct - an operational failure the client can't fix; it gets nothing but a way to reference the incident (or a 503 with Retry-After if you detect the outage explicitly).
      - id: not-found
        text: "404, because the payment couldn't be loaded."
        feedback: The payment may well exist - you don't know. A 404 tells the client it is gone, which is false and may make it give up or create a duplicate.
      - id: detailed-500
        text: "500 with the connection error in detail, so the client can report it accurately."
        feedback: That leaks hosts and ports (CWE-209). The request id gives support the same accuracy without the leak.
      - id: bad-request
        text: "400, because the request couldn't be completed."
        feedback: 4xx means the client did something wrong and should change the request. Nothing is wrong with this request.
    correct: [generic-500]
    solution: |
      Operational failures are server errors. The client gets a generic Problem Details 500 (or 503 with
      `Retry-After` when you know it's temporary) and a request id; the details go to the log.

  - id: place-leak
    type: debug
    concept: safe-error-responses
    skill: application
    title: Spot the leak
    prompt: |
      Which line can send internal details to the client?
    language: typescript
    code: |
      app.use((err: unknown, req: Request, res: Response, next: NextFunction) => {
        if (res.headersSent) return next(err);
        if (err instanceof AppError) {
          return res.status(err.status).type('application/problem+json').json({ title: err.title, status: err.status });
        }
        log.error({ err, requestId: res.locals.requestId });
        res.status(500).type('application/problem+json').json({ title: String(err), status: 500 });
      });
    correctLines: [7]
    lineNotes:
      - line: 4
        note: AppError titles are written for clients - sending them is the point.
      - line: 6
        note: Logging the full error server-side, with the request id, is correct.
    solution: |
      **Line 7**: `String(err)` of an unexpected error is `Error: <its message>` - a driver message with SQL, a
      host or a path. Send a fixed title (and the request id) instead.

recall:
  - id: recall-boundaries
    concept: trust-boundary-validation
    prompt: Name five inputs of an API endpoint that cross a trust boundary.
    answer: Path parameters, query string, headers (and cookies), the body, uploaded files - plus responses from services you call, webhooks, queue messages, environment and configuration, and stored rows from older code.
  - id: recall-allowlist
    concept: trust-boundary-validation
    prompt: What does allow-list validation check, and why not a deny-list?
    answer: What is acceptable - types, ranges, lengths, exact choices, known fields. Deny-lists try to recognise every bad value, always miss some and reject honest input; injection is stopped by parameterised queries and output encoding, not by input filters.
  - id: recall-parse
    concept: schema-parsing-zod
    prompt: What does "parse, don't validate" mean in practice with zod?
    answer: Use safeParse to turn unknown input into typed data (or issues), and pass only result.data on - never the raw input. z.infer gives the type from the same schema.
  - id: recall-unknown-keys
    concept: schema-parsing-zod
    prompt: What do z.object, z.strictObject and z.looseObject do with unknown keys?
    answer: z.object strips them from the parsed result; z.strictObject reports them as unrecognized_keys issues; z.looseObject keeps them.
  - id: recall-query
    concept: schema-parsing-zod
    prompt: Why is z.coerce.number() risky for query parameters, and what is the Express 5 catch?
    answer: Number() accepts " 20", "2e1", "0x10" and turns "" into 0. Check the text first, then convert. In Express 5, req.query is a read-only getter - store parsed values in res.locals, and repeated parameters arrive as arrays.
  - id: recall-groups
    concept: error-taxonomy
    prompt: What are the three groups of errors and their status ranges?
    answer: Client errors (bad input, missing resource, conflict) - 4xx with what to fix. Operational failures (outages, timeouts) and programmer errors (bugs) - 5xx with a generic message and a request id.
  - id: recall-problem-details
    concept: safe-error-responses
    prompt: What does a validation error response look like in RFC 9457 style?
    answer: Status 422, Content-Type application/problem+json, members type (a stable URI), title, status, an errors extension of { detail, pointer } with JSON Pointers like #/amountMinor, and a requestId extension.
  - id: recall-500
    concept: safe-error-responses
    prompt: What may a 500 response contain, and where do the details go?
    answer: A fixed title, the status, a problem type and a request id - never the error message, stack, SQL, hosts or paths. The full error and stack go to the server log, tagged with the same request id.

