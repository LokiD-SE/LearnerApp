id: openapi-contract-first
title: Contract-first APIs with OpenAPI
subject: fullstack
module: backend-api
level: intermediate
status: published
estimatedMinutes: 70
summary: Write the OpenAPI 3.1 description of your API as the author - structure, reusable schemas and responses, the JSON Schema 2020-12 dialect - then keep code, documentation and clients in step with a design-first workflow, generated types, spec diffs in CI and conformance tests that check every response your own suite sees.
tags:
  [
    openapi,
    openapi 3.1,
    openapi 3.2,
    contract-first,
    design-first,
    code-first,
    json schema,
    "2020-12",
    $ref,
    components,
    ajv,
    contract testing,
    conformance,
    oasdiff,
    openapi-typescript,
    openapi-generator,
    breaking changes,
    express,
  ]

environment: |
  - **Standard (normative):** the [OpenAPI Specification 3.1.2](https://spec.openapis.org/oas/v3.1.2.html) -
    section 3.5 (path templating), 4.4 (data types), 4.8.1 (OpenAPI Object), 4.8.7 (Components), 4.8.8 (Paths,
    including 4.8.8.2 path matching), 4.8.10 (Operation), 4.8.12 (Parameter), 4.8.13 (Request Body), 4.8.16 and
    4.8.17 (Responses, Response), 4.8.23 (Reference Object), 4.8.24 (Schema Object and the OAS base vocabulary),
    4.8.27 (Security Scheme). Version history from its Appendix A: 3.1.0 on 2021-02-15, 3.1.2 on 2025-09-19,
    [3.2.0](https://spec.openapis.org/oas/v3.2.0.html) on 2025-09-19 and
    [3.2.1](https://spec.openapis.org/oas/v3.2.1.html) on 2026-09-10. The 3.0 comparison uses
    [3.0.4](https://spec.openapis.org/oas/v3.0.4.html). All fetched and quoted November 2026.
  - **JSON Schema:** [draft 2020-12](https://json-schema.org/draft/2020-12) - the dialect OpenAPI 3.1 Schema
    Objects are a superset of.
  - **OpenAPI Initiative guides (not normative):** [learn.openapis.org](https://learn.openapis.org/) - Best
    Practices (design-first, single source of truth, source control) and Upgrading from OpenAPI 3.0 to 3.1.
  - **Tools (tool-specific, check their documentation for current versions):**
    [Ajv](https://ajv.js.org/) 8.20 with its draft 2020-12 build (`ajv/dist/2020`), strict mode and
    [ajv-formats](https://github.com/ajv-validator/ajv-formats) 3.0; [oasdiff](https://github.com/oasdiff/oasdiff)
    (spec diff and breaking-change detection); [openapi-typescript](https://openapi-ts.dev/introduction) and
    [OpenAPI Generator](https://github.com/OpenAPITools/openapi-generator) (code generation). Only Ajv and
    ajv-formats are installed in the practice project; the others are described from their own documentation.
  - **Code:** `practice/fullstack` - TypeScript 6.0, Express 5.3, supertest 7.3, `yaml` 2.9, Ajv 8.20 on Node.js
    24. Every test result, Ajv message and HTTP exchange shown was produced by running the practice project.
  - **Related (tester's view, not repeated here):** [Schema and contract
    validation](#/lesson/schema-and-contract-validation) - JSON Schema keywords, breaking versus non-breaking
    changes, and Pact. This lesson is the **author's** side: writing, structuring and enforcing the document.
  - **Fictional:** SandPay (`https://api.sandpay.example`), its API, ids and amounts. Amounts are integers in
    minor units.

prerequisites:
  - rest-api-design
  - express-http-server
  - schema-and-contract-validation

concepts:
  - id: openapi-document-structure
    name: The structure of an OpenAPI document
    summary: An OpenAPI 3.1 document has a required openapi version and info, then paths whose path items hold one operation per HTTP method. Each operation has a unique operationId, parameters (path ones always required), an optional request body and a Responses object keyed by status code, range (4XX) or default - explicit codes win over ranges - with a description and media types per response.
  - id: openapi-schema-reuse
    name: Schemas, components and $ref in OpenAPI 3.1
    summary: OpenAPI 3.1 Schema Objects are JSON Schema 2020-12 plus a small OAS vocabulary, so 3.0-only keywords such as nullable become type arrays and example becomes examples. Reusable schemas, responses and parameters live in components and are referenced with $ref, so one definition serves every operation, the validator and the generated types.
  - id: contract-first-workflow
    name: Contract-first (design-first) workflow
    summary: The contract is written and reviewed before the code, kept in source control as the single source of truth, diffed against the released version in CI to block unannounced breaking changes, and used to generate types, clients, mocks and documentation - with code-first as a deliberate alternative that still needs one source of truth.
  - id: openapi-conformance-testing
    name: Checking the implementation against the contract
    summary: The API's own test suite validates every response it sees against the document - documented path, method, status, content type and schema - and reports which documented responses no test ever produced, so the document can't silently drift from the code in either direction.

objectives:
  - Write an OpenAPI 3.1 description of an existing API - paths, operations, parameters, request bodies, responses with headers, and Problem Details errors.
  - Organise a document with components and $ref so each schema, parameter and error response is defined once.
  - Convert OpenAPI 3.0 schema habits to 3.1 (nullable, exclusiveMinimum, example) and explain why 3.1 aligned with JSON Schema 2020-12.
  - Compare design-first and code-first workflows and choose one for a team, with a single source of truth.
  - Build a conformance checker that validates real responses against the document and reports uncovered responses.
  - Describe the pipeline checks - lint, spec diff, generation, conformance - that keep code, documentation and clients in step.

sections:
  - id: intuition
    kind: intuition
    concepts: [contract-first-workflow, openapi-document-structure]
    title: The idea in plain language
    body: |
      Before a house is built, the architect draws a **plan**. The plumber, the electrician and the buyer all
      work from the same drawing - and when the builder wants to move a wall, the plan changes first, so
      nobody is surprised.

      An **OpenAPI document** is that plan for an HTTP API: every URL, every method, what you may send, every
      response you can get back and its exact shape - in a machine-readable YAML or JSON file. Because a
      machine can read it, the plan does work by itself:

      - your **React app** gets TypeScript types generated from it instead of hand-copied interfaces;
      - **documentation** is rendered from it, so it can't describe last year's API;
      - **CI** compares it with the released version and stops a change that would break clients;
      - your **tests** check every real response against it, so the code can't quietly drift away.

      **Contract-first** (the OpenAPI Initiative says **design-first**) means drawing the plan before
      building: the document is written, reviewed by the people who will call the API, and only then
      implemented. As a tester you used someone's OpenAPI document as an oracle; in this lesson **you are its
      author**.

  - id: what
    kind: what
    concepts: [openapi-document-structure]
    title: What an OpenAPI 3.1 document contains
    body: |
      The specification calls the whole thing an **OpenAPI Description** (OAD); it may be one file or several,
      and the file where parsing starts is the **entry document**, recommended to be named `openapi.json` or
      `openapi.yaml` (section 4.3). The root **OpenAPI Object** (4.8.1):

      | Field | Required | What it holds |
      | --- | --- | --- |
      | `openapi` | **yes** | the specification version the document uses, for example `3.1.2` - "not related to the `info.version` string, which is the version of the OpenAPI Document" |
      | `info` | **yes** | `title`, `version` (of *your* API document) and a description |
      | `servers` | no | base URLs; if absent, the default is a server with url `/` |
      | `paths` | no in 3.1 (required in 3.0) | the URL templates and their operations |
      | `webhooks` | no (new in 3.1) | requests the API **sends** to its consumers - for SandPay, `payment.succeeded` callbacks |
      | `components` | no | reusable schemas, responses, parameters, examples, security schemes... |
      | `security`, `tags`, `externalDocs`, `jsonSchemaDialect` | no | API-wide security, grouping for docs, links, the default `$schema` for Schema Objects |

      Inside `paths`, each key is a **path template** that "MUST begin with a forward slash" -
      `/orders/{orderId}` - and its **Path Item** holds one **Operation** per method (`get`, `post`, `put`,
      `patch`, `delete`, `head`, `options`, `trace`) plus parameters shared by all of them. An **Operation**
      (4.8.10) has:

      - **`operationId`** - "MUST be unique among all operations described in the API" and is case-sensitive;
        generators use it for function names (`getOrder`), so treat it as part of the contract.
      - **`parameters`** - each has a `name` and an `in`: `path`, `query`, `header` or `cookie` (4.8.12.1).
        For a path parameter, `required` "is REQUIRED and its value MUST be true".
      - **`requestBody`** - `content` keyed by media type, and `required` (default **false** - a common
        omission).
      - **`responses`** - keyed by status code in quotes (`'200'`), by a **range** (`1XX`-`5XX`) or `default`.
        "If a response is defined using an explicit code, the explicit code definition takes precedence over
        the range definition for that code" (4.8.16). Each **Response Object** needs a `description` in 3.1,
        and may declare `headers` (such as `Location`) and `content`.

  - id: why
    kind: why
    concepts: [contract-first-workflow, openapi-conformance-testing]
    title: Why the author should care - drift is the default
    body: |
      Without a process, an API description **drifts**. A developer adds a `409` to the refund handler and
      forgets the document; another renames `amount` to `amountMinor` in the document but not in the code.
      Nothing fails - until a client generated from the document meets the real server.

      The OpenAPI Initiative's Best Practices page puts the reasons for design-first bluntly: "The number of
      APIs that can be created in code is far superior to what can be described in OpenAPI" - so if you code
      first, you can build something the format can't describe and end up twisting the description "so that it
      matches more or less the actual API". It also says to "always keep a single source of truth" and to add
      descriptions to source control because they "are not just a documentation artifact".

      For a full stack developer the payoff is concrete:

      - **The frontend starts on day one.** Types and a mock server come from the agreed document, before the
        backend exists.
      - **Reviews happen where they are cheap.** Arguing about `201` versus `200` in a YAML pull request costs
        minutes; changing it after three mobile releases costs months.
      - **Breaking changes are caught by a machine**, not by a partner's outage.

  - id: structure-example
    kind: code
    concepts: [openapi-document-structure, openapi-schema-reuse]
    title: SandPay's orders API, described
    body: |
      An excerpt of the reference solution (`solutions/openapi/sandpay-openapi.yaml`) - the refund operation
      and the pieces it reuses:

      ```yaml
      openapi: 3.1.2
      info:
        title: SandPay merchant dashboard API
        version: 1.4.0
      servers:
        - url: https://api.sandpay.example/v1
      paths:
        /orders/{orderId}/refunds:
          parameters:
            - $ref: '#/components/parameters/OrderId'   # shared by every method on this path
          post:
            operationId: createRefund
            tags: [refunds]
            requestBody:
              required: true                           # the default is false
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/RefundRequest'
            responses:
              '201':
                description: The refund was created.
                headers:
                  Location:
                    description: URL of the new refund.
                    required: true
                    schema:
                      type: string
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/Refund'
              '400':
                $ref: '#/components/responses/BadRequest'
              '404':
                $ref: '#/components/responses/NotFound'
              '409':
                description: The order is not paid, or the refund exceeds what is left to refund.
                content:
                  application/problem+json:
                    schema:
                      $ref: '#/components/schemas/Problem'
      components:
        parameters:
          OrderId:
            name: orderId
            in: path
            required: true                              # MUST be true for path parameters
            schema:
              type: string
              pattern: '^ord_[0-9]+$'
        schemas:
          RefundRequest:
            type: object
            required: [amountMinor, reason]
            additionalProperties: false
            properties:
              amountMinor:
                type: integer
                minimum: 1
              reason:
                type: string
                minLength: 1
                maxLength: 200
      ```

      And what the running app really answers for a refund larger than what is left (supertest output):

      ```http
      HTTP/1.1 409 Conflict
      Content-Type: application/problem+json; charset=utf-8

      {"type":"https://api.sandpay.example/problems/refund-exceeds-order","title":"Refund not possible","status":409,"detail":"At most 900 can be refunded on ord_1003 (pending)"}
      ```

      Three author decisions are visible: errors use a **different media type**
      (`application/problem+json`, [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457)) and are documented per
      status; the **`Location` header** is part of the 201 contract, not a detail; and the request schema says
      exactly what the handler accepts - `additionalProperties: false` included.

  - id: schemas
    kind: internals
    concepts: [openapi-schema-reuse]
    title: Schemas in 3.1 - JSON Schema 2020-12 plus a small vocabulary
    body: |
      The Schema Object "is a superset of the JSON Schema Specification Draft 2020-12" (4.8.24). That sentence
      is the big change from 3.0, whose Schema Object was "an extended subset" of an older JSON Schema draft.
      In practice:

      | You wrote in 3.0 | Write in 3.1 | Why |
      | --- | --- | --- |
      | `type: string` + `nullable: true` | `type: [string, 'null']` | `nullable` was OpenAPI-only; JSON Schema allows a list of types |
      | `minimum: 7` + `exclusiveMinimum: true` | `exclusiveMinimum: 7` | in 2020-12 the exclusive keywords are numbers |
      | `example: fedora` in a schema | `examples: [fedora]` | the schema `example` "has been deprecated in favor of the JSON Schema `examples` keyword" |
      | `format: binary` for an upload | an empty media type schema, or `contentMediaType` / `contentEncoding` | JSON Schema has keywords for this |

      (The table follows the OpenAPI Initiative's "Upgrading from OpenAPI 3.0 to 3.1" guide.)

      OpenAPI adds a few keywords of its own - the **OAS base vocabulary**: `discriminator`, `xml`,
      `externalDocs` and `example` (4.8.24.2). The specification warns that JSON Schema implementations "MAY
      choose to treat" them as **unknown keywords**. Ajv's strict mode does exactly that - real output:

      ```plaintext
      strict mode: unknown keyword: "example"
      ```

      So a validator for OpenAPI documents has to be told about those keywords - the practice project's
      `oas-ajv.ts` calls `ajv.addVocabulary([...])` with them and with the document's top-level field names.

      **Formats are annotations unless enforced.** In 2020-12, `format: date-time` only describes the value;
      a validator checks it only when configured to. Ajv in strict mode refuses an unknown format rather than
      silently ignoring it (`unknown format "date-time" ignored in schema at path "#"`, thrown when compiling
      without `ajv-formats`); with `ajv-formats` added it enforces it and reports
      `/createdAt must match format "date-time"`.

      **A trap from real tools:** Ajv still supports the 3.0 keyword `nullable` (its documentation lists it
      under "OpenAPI support") - a schema with `nullable: true` accepted `null` in our run. A document written
      in 3.0 style can therefore **pass your Ajv tests and still be wrong** for other 3.1 tools and type
      generators. The practice tests check for 3.0 keywords explicitly for that reason.

  - id: reuse
    kind: steps
    concepts: [openapi-schema-reuse]
    title: Reuse with components and $ref, step by step
    body: |
      The Components Object "Holds a set of reusable objects for different aspects of the OAS" - and they have
      "no effect on the API unless they are explicitly referenced from outside the Components Object"
      (4.8.7). Organise a document so each fact lives in one place:

      1. **Schemas for every resource representation** - `Order`, `Refund`, `RefundRequest`, `Problem` - in
         `components/schemas`. Request and response shapes of the same resource are often **different
         schemas** (`RefundRequest` has no `id` or `createdAt`).
      2. **Shared parameters** - `OrderId`, pagination `limit` and `cursor` - in `components/parameters`, and
         put a path's parameters on the **Path Item** so every method inherits them.
      3. **Shared responses** - `NotFound`, `BadRequest`, `Unauthorized` with their Problem Details content -
         in `components/responses`, referenced from each operation's `'404'` and `'400'`.
      4. **Reference with `$ref`** - `$ref: '#/components/schemas/Order'` is a JSON Pointer (RFC 6901) into
         the document; `$ref: Order.yaml` or `common.yaml#/Problem` points into another file of the same OAD.
      5. **Know the two kinds of `$ref`.** In a Schema Object, `$ref` is JSON Schema's keyword and may sit next
         to other keywords. Elsewhere it is a **Reference Object** (4.8.23), which allows only `summary` and
         `description` beside it - "any properties added SHALL be ignored". So `description` next to a
         response `$ref` overrides the description; a `required: true` next to it is silently dropped.
      6. **Add examples where people read them** - `examples` on media types (named, with a `summary`) for
         documentation, `examples` inside schemas for the schema itself.

      Over-reusing is a smell too: a single `Order` schema used for create, update and read ends up with every
      field optional, and then validates nothing.

  - id: workflow
    kind: visual
    concepts: [contract-first-workflow]
    title: The contract-first pipeline
    body: |
      ```mermaid
      flowchart LR
        A[Write or change openapi.yaml] --> B[Pull request review by API consumers]
        B --> C{CI: lint and spec diff against the released version}
        C -- breaking change, not versioned --> A
        C -- compatible --> D[Generate types, clients, mock server]
        D --> E[Implement or update the handlers]
        E --> F{CI: conformance tests - every response checked against the document}
        F -- mismatch or uncovered response --> E
        F -- conforms --> G[Release API and publish rendered docs]
      ```

      Notice where the document sits: **before** the code, and checked **twice** - once against the previous
      version of itself (did we break clients?) and once against the code (does the server do what we
      promised?). Either check alone leaves a gap: a perfect diff says nothing about a handler that sends a
      string where the document says integer.

  - id: tooling
    kind: when
    concepts: [contract-first-workflow]
    title: Design-first or code-first - and the tools around each
    body: |
      | | **Design-first** (contract-first) | **Code-first** |
      | --- | --- | --- |
      | Source of truth | the OpenAPI document, in the repository | annotations or schemas in the code; the document is generated |
      | Strength | consumers review before anything is built; frontend and backend work in parallel | no second language; the document can't fall behind the code that generates it |
      | Risk | handlers drift from the document unless conformance is tested | the code can do things OpenAPI can't describe; the document follows whatever the code happened to do |
      | Good fit | public or partner APIs, several client teams, payments | an internal API with one client team that iterates fast |

      Either way, keep **one** source of truth. The OpenAPI Initiative's guide warns about the common mix - a
      document generated from annotations, committed, and then edited by hand - after which "newcomers to the
      project will not know which one is actually in use".

      Tools you will meet (from their own documentation; none is required by the specification):

      - **openapi-typescript** "turns OpenAPI 3.0 & 3.1 schemas into TypeScript" and generates "runtime-free
        types" - the React app imports `components['schemas']['Order']` instead of a hand-written interface.
      - **OpenAPI Generator** "allows generation of API client libraries (SDK generation), server stubs,
        documentation and configuration automatically given an OpenAPI Spec" - many languages, heavier output.
      - **oasdiff** - a "Command-line tool to compare and detect breaking changes in OpenAPI specs", with
        `changelog`, `breaking` and `diff` commands and a GitHub Action, so CI can fail on a breaking change.
      - **Documentation renderers** such as Swagger UI and Redoc turn the document into a browsable reference
        site. Check which OpenAPI versions the release you use supports.
      - **Validators** such as Ajv check bodies against the schemas - the practice project uses it.

      **Which version to write?** 3.1 is what this lesson and most current tools target. **3.2.0** was released
      on 2025-09-19 (patch 3.2.1 on 2026-09-10); it adds, among other things, a `query` operation for the HTTP
      QUERY method, `additionalOperations` for other methods, `in: querystring`, `itemSchema` for streamed
      sequential media types, nested tags (`parent`, `kind`), and makes a Response's `description` optional.
      Move to 3.2 when your generator, validator and documentation tools support it - the `openapi` field
      tells every tool which rules to apply.

  - id: conformance
    kind: internals
    concepts: [openapi-conformance-testing, openapi-document-structure]
    title: How a conformance checker reads the document
    body: |
      To check one real response, a checker answers four questions in order - each one a rule from the
      specification:

      1. **Which path?** Strip the query string, then match templates. "When matching URLs, concrete
         (non-templated) paths would be matched before their templated counterparts" (4.8.8): `/orders/summary`
         must not be taken for `/orders/{orderId}`. A template stands for one segment - path parameter values
         "MUST NOT contain any unescaped" `/` (3.5).
      2. **Which operation?** The method, in lower case, on that Path Item. Missing means the server answers a
         method the contract doesn't have.
      3. **Which response?** The explicit status (`'404'`), else its range (`'4XX'`), else `default`. None
         means the server produced an **undocumented status** - the most common drift.
      4. **Which schema?** The media type from `Content-Type` without parameters (`; charset=utf-8`), looked up
         in that response's `content`; then validate the body. If the response is a `$ref` to
         `components/responses`, the schema lives **there**.

      Real output of the reference checker from exercise 2, on a body where the code started sending the
      amount as a string and an extra field:

      ```plaintext
      [
        'body: (body) must NOT have additional properties',
        'body: /amountMinor must be integer'
      ]
      ```

      The checker also remembers which documented responses it has matched. After a run that only fetched
      `ord_1001`, created one refund and was refused one (409), `uncovered()` returned:

      ```plaintext
      [
        'GET /orders 200',
        'GET /orders 400',
        'GET /orders/{orderId} 404',
        'POST /orders/{orderId}/refunds 400',
        'POST /orders/{orderId}/refunds 404'
      ]
      ```

      That list is the other direction of drift: responses the document **promises** that no test has seen the
      server produce - either missing tests, or promises the code no longer keeps.

  - id: lookup-visual
    kind: visual
    concepts: [openapi-conformance-testing]
    title: Finding the documented response for a status
    body: |
      ```mermaid
      flowchart TD
        S[Response with status 422] --> E{responses has 422?}
        E -- yes --> U[Use it]
        E -- no --> R{responses has 4XX?}
        R -- yes --> U
        R -- no --> D{responses has default?}
        D -- yes --> U
        D -- no --> X[Problem - status 422 is not documented]
        U --> C{Content-Type documented for it?}
        C -- no --> Y[Problem - undocumented content type]
        C -- yes --> V[Validate the body against its schema]
      ```

      A `default` response makes every status "documented". That is convenient for unexpected errors, but it
      also hides drift - which is why SandPay documents each **expected** error status explicitly and keeps
      `default` for the truly unexpected.

  - id: example
    kind: example
    concepts: [contract-first-workflow, openapi-conformance-testing]
    title: "Real-world scenario: the refund status nobody documented"
    body: |
      SandPay's mobile team generates a TypeScript client from the published document. The backend team adds
      a new rule: refunds on orders older than 180 days are refused with **`422`** and a problem type
      `refund-window-closed`. The handler and its unit test ship. The document isn't touched.

      In production, the mobile app's generated client has no type for a `422` from `createRefund`; its error
      handling falls into a generic "Something went wrong" screen, and support tickets arrive.

      What each contract-first check would have done:

      - **Conformance check in the backend's own tests** - the new unit test's response `422` matches no
        explicit code, no `4XX` and no `default` on `createRefund`: `status 422 is not documented for POST
        /orders/{orderId}/refunds`. The pull request fails until the response is documented.
      - **Spec diff in CI** - once documented, the diff against the released document (for example oasdiff's
        `changelog` command) shows the new response to reviewers and consumers.
        Whether a new error status is breaking depends on the clients (a strict generated client may treat it
        as unknown) - that judgement is in the [tester's lesson](#/lesson/schema-and-contract-validation); the
        point here is that it becomes **visible and reviewed**.
      - **Design-first review** - the mobile team, reviewing the YAML pull request, asks for a `detail` text
        they can show, and a `refundableUntil` date in the problem body.

      The fix to the process is small: document first, let the checker run on every API test, and publish the
      changelog with each release.

  - id: tests
    kind: tests
    concepts: [openapi-conformance-testing, openapi-document-structure]
    title: Tests that keep the document honest
    body: |
      | # | Check | Expected | Evidence |
      | --- | --- | --- | --- |
      | T1 | The document parses and `openapi` is `3.1.x` | parse succeeds, version matches | test output |
      | T2 | Every operation has a unique `operationId` | no duplicates, none missing | list of ids |
      | T3 | Every `{template}` in a path has an `in: path`, `required: true` parameter | all declared | path and parameter name on failure |
      | T4 | Every schema compiles in a strict 2020-12 validator with formats enforced | no compile errors | validator message |
      | T5 | Every API test's response is checked: documented path, method, status, content type, schema | no problems | checker's problem list |
      | T6 | After the suite, `uncovered()` is empty (or an agreed allow-list) | every documented response produced at least once | the uncovered list |
      | T7 | The request-body schema and the handler agree: bodies the handler accepts validate, bodies it rejects don't | same verdict for each sample body | sample body and both verdicts |
      | T8 | Spec diff against the last release has no unversioned breaking change | `oasdiff breaking` reports nothing | CI log |
      | T9 | A deliberately broken representation (string amount, extra field, bad date) fails the schema | schema rejects each | validator errors |

      T7 and T9 are the ones teams skip. A schema with no `required`, no `additionalProperties: false` and
      `type: number` for an integer amount **passes every real response** - and protects nothing. In the
      practice project, the unfinished document passes both "happy" GET tests for exactly that reason.

  - id: line-by-line
    kind: line-by-line
    concepts: [openapi-schema-reuse, openapi-conformance-testing]
    title: Why the validator setup is written this way
    body: |
      From `exercises/openapi/oas-ajv.ts` (shared by both exercises):

      ```typescript
      const ajv = new Ajv2020({ allErrors: true });   // draft 2020-12 build; report every error, not the first
      addFormats(ajv);                                // enforce date-time, uri... instead of failing on them
      ajv.addVocabulary(OPENAPI_KEYWORDS);            // openapi, info, paths... and discriminator, xml, externalDocs, example
      ajv.addSchema(doc, DOCUMENT_ID);                // the WHOLE document, so '#/components/...' refs resolve
      const validate = ajv.getSchema(`${DOCUMENT_ID}#/paths/~1orders~1%7BorderId%7D/get/responses/200/content/application~1json/schema`);
      ```

      - **`Ajv2020`**, not the default `Ajv` class: Ajv's default build is draft-07; OpenAPI 3.1 needs
        2020-12 (`prefixItems`, type arrays as standard).
      - **`allErrors: true`** - a contract report should list every mismatch in one run.
      - **The whole document is added**, because `$ref: '#/components/schemas/Order'` is relative to the
        document root. Compiling a schema copied out of the document would leave its `$ref`s dangling.
      - **The JSON Pointer is escaped**: `/` becomes `~1` (RFC 6901), and `{` `}` are percent-encoded because
        the pointer is used as a URI fragment.
      - **Strict mode stays on.** Turning it off would also hide typos such as `requried` - the reason Ajv
        made strict mode the default.

  - id: mistakes
    kind: mistakes
    concepts: [openapi-document-structure, openapi-schema-reuse, openapi-conformance-testing]
    title: Common mistakes and how to find them
    body: |
      - **Writing 3.0 in a 3.1 document** (`nullable`, boolean `exclusiveMinimum`, schema `example`). Some
        validators accept parts of it (Ajv accepts `nullable`), so tests pass while generators and other tools
        disagree. Search the file for 3.0 keywords; use type arrays.
      - **Path parameter without `required: true`** - invalid by the specification; tools may reject the
        document or treat the parameter as optional.
      - **Copy-pasted `operationId`** - two operations named `getOrder` produce a broken or overwritten
        generated client. The specification requires uniqueness; check it in CI.
      - **`requestBody` without `required: true`** - the default is `false`, so the contract says the body may
        be omitted while the handler answers 400.
      - **Loose schemas** - no `required`, no `additionalProperties: false`, `number` for minor-unit amounts.
        They pass every response and describe nothing; test them with deliberately broken samples.
      - **Only the happy path documented** - 400, 404 and 409 exist in the code but not in the document, or
        are hidden under `default`.
      - **Extra keys beside a Reference Object `$ref`** - only `summary` and `description` are honoured; the
        rest is ignored without an error.
      - **Two sources of truth** - an annotated controller and a hand-edited YAML that both claim to be the
        contract.

      **Debugging method:** when a contract test fails, read the checker's problem first - it names which of
      the four lookups failed (path, method, status, content type) or which schema path. Then decide which side
      is wrong: if the code's behaviour was agreed, fix the document (and review the diff); if the document was
      agreed, fix the code. Never "fix" it by adding a `default` response.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [contract-first-workflow, openapi-conformance-testing]
    title: Limits and alternatives
    body: |
      - **OpenAPI can't describe everything.** Business rules ("refunds may not exceed the captured amount",
        "pending orders can't be refunded") are outside JSON Schema; they belong in descriptions, examples and
        ordinary tests.
      - **Conformance proves shape, not truth.** A response with the right schema and the wrong amount
        conforms. It complements behaviour tests; it doesn't replace them.
      - **Coverage is per documented response, not per scenario.** One test producing a 409 marks it covered;
        the other causes of a 409 still need their own tests.
      - **Generated code has a cost** - generator versions, regeneration in CI, and reviewing generated diffs.
        Types-only generation (openapi-typescript) is lighter than full SDK generation.
      - **Consumer-driven contracts** (Pact, in the [tester's lesson](#/lesson/schema-and-contract-validation))
        answer a different question: what do my **actual** consumers use? OpenAPI says what the provider
        **offers**. Teams with many internal consumers often use both.
      - **Other description formats** exist for other styles - for example AsyncAPI for event-driven APIs and
        GraphQL's own schema language. OpenAPI is for HTTP APIs.

  - id: summary
    kind: summary
    concepts: [openapi-document-structure, openapi-schema-reuse, contract-first-workflow, openapi-conformance-testing]
    title: Quick reference
    body: |
      - Root: `openapi` (spec version) and `info` (your API's title and version) are required; `paths`,
        `webhooks`, `components`, `servers`, `security`, `tags` are optional in 3.1.
      - Operation: unique case-sensitive `operationId`; path parameters always `required: true`;
        `requestBody.required` defaults to false; responses keyed `'200'`, `'4XX'` or `default` - explicit
        beats range.
      - 3.1 schemas are JSON Schema 2020-12: `type: [string, 'null']`, numeric `exclusiveMinimum`, `examples`.
      - Reuse through `components` and `$ref`; beside a Reference Object only `summary` and `description` count.
      - Design-first: document, review, diff, generate, implement, conformance-test - one source of truth.
      - The API's own tests check every response against the document and report uncovered responses.
      - 3.2 (2025-09-19, 3.2.1 on 2026-09-10) adds QUERY, `additionalOperations`, `querystring`, streaming
        `itemSchema`, nested tags - adopt when your tools support it.

exercises:
  - id: debug-document
    type: debug
    concept: openapi-document-structure
    skill: analysis
    title: Find the invalid parts of the operation
    prompt: |
      This excerpt claims to be OpenAPI 3.1. Click **every** line that breaks a rule of the specification
      (not just style).
    language: yaml
    code: |
      /orders/{orderId}:
        get:
          operationId: getOrder
          parameters:
            - name: orderId
              in: path
              required: false
          responses:
            '200':
              description: The order.
        delete:
          operationId: getOrder
          responses:
            '204':
              description: Cancelled.
    correctLines: [7, 12]
    lineNotes:
      - line: 10
        note: A description on the 200 is exactly what 3.1 requires - this line is fine. (Leaving out content is legal, though a 200 with no schema is a weak contract.)
      - line: 6
        note: "in: path is right for {orderId}; the problem is the required value on the next line."
    hints:
      - Section 4.8.12 has a rule about required for one parameter location.
      - Section 4.8.10 has a rule about operationId across the whole API.
    solution: |
      **Line 7** - for a path parameter, `required` "is REQUIRED and its value MUST be true"; a path template
      can't be optional. **Line 12** - `operationId` "MUST be unique among all operations described in the
      API"; the delete operation reuses `getOrder`, so a generated client would get two functions with the same
      name (or one would overwrite the other). Rename it `cancelOrder`.
    followUp: |
      Add a `'404'` response to both operations without repeating its definition - where does it live, and
      what does the reference look like?

  - id: mcq-nullable
    type: mcq
    concept: openapi-schema-reuse
    skill: application
    title: Upgrading a nullable field to 3.1
    prompt: |
      SandPay's 3.0 document has `customerNote: { type: string, nullable: true }`. You change `openapi` to
      `3.1.2`. What should the property become?
    options:
      - id: type-array
        text: "type: [string, 'null']"
        feedback: Correct - 3.1 Schema Objects are JSON Schema 2020-12, which allows a list of types; nullable was an OpenAPI 3.0 keyword.
      - id: keep
        text: Leave nullable true - Ajv accepts it, so it is still valid
        feedback: Ajv supports nullable for OpenAPI 3.0 compatibility, but it isn't part of 3.1's dialect. Other 3.1 tools and type generators won't honour it - a test passing in one tool doesn't make it standard.
      - id: oneof
        text: "oneOf: [{ type: string }, { type: 'null' }] is the only correct form"
        feedback: That also works in 2020-12, but it isn't the only form - a type array is the simpler, equivalent choice the upgrade guide shows.
      - id: required
        text: Remove customerNote from required - absent and null mean the same thing
        feedback: They don't. The app always sends customerNote, as null when empty. Making it optional changes the contract and still doesn't allow null.
    correct: [type-array]
    hints:
      - What is the 3.1 Schema Object a superset of?
    solution: |
      OpenAPI 3.1 aligned its Schema Object with JSON Schema 2020-12, where `type` may be an array. The upgrade
      guide's replacement for `nullable: true` is `type: [string, 'null']`. Keep `customerNote` in `required` -
      present-but-null and absent are different contracts.

  - id: mcq-ref
    type: mcq
    concept: openapi-schema-reuse
    skill: analysis
    title: The header that never appeared in the docs
    prompt: |
      A developer writes this, and the rendered documentation shows the 404 response without the
      `X-Request-Id` header. Why?

      ```yaml
      responses:
        '404':
          $ref: '#/components/responses/NotFound'
          headers:
            X-Request-Id:
              schema: { type: string }
      ```
    options:
      - id: reference-object
        text: Outside schemas, $ref is a Reference Object, which allows only summary and description beside it - other keys are ignored
        feedback: Correct - section 4.8.23 says the Reference Object "cannot be extended with additional properties, and any properties added SHALL be ignored".
      - id: renderer-bug
        text: The documentation renderer has a bug; the document is fine
        feedback: The renderer is following the specification here - the headers key next to the $ref has no effect.
      - id: order
        text: headers must come before $ref in YAML
        feedback: Key order has no meaning in YAML or JSON mappings.
      - id: schema-ref
        text: $ref only works inside schemas
        feedback: Reference Objects are allowed for responses, parameters, request bodies and more - that's what components/responses is for.
    correct: [reference-object]
    hints:
      - Is this $ref inside a Schema Object or not?
    solution: |
      A Response `$ref` is a **Reference Object** (4.8.23): only `summary` and `description` may sit beside it,
      and other properties "SHALL be ignored". Put `X-Request-Id` into `components/responses/NotFound/headers`
      (or into a shared `components/headers` entry referenced from there). Inside a **Schema Object**, by
      contrast, `$ref` is JSON Schema's keyword and may be combined with other keywords.

  - id: order-workflow
    type: order
    concept: contract-first-workflow
    skill: recall
    title: Order a design-first change
    prompt: |
      SandPay adds a `GET /orders/{orderId}/refunds` operation, design-first. Put the steps in order (first at
      the top).
    items:
      - id: write
        text: Add the operation and its schemas to openapi.yaml in a pull request
      - id: review
        text: Frontend and mobile developers review the YAML in the pull request
      - id: diff
        text: CI lints the document and diffs it against the released version
      - id: generate
        text: Regenerate the TypeScript types and the mock server from the document
      - id: implement
        text: Implement the Express handler
      - id: conform
        text: CI runs the API tests with every response checked against the document
      - id: release
        text: Release and publish the rendered documentation and changelog
    hints:
      - In design-first, what exists before the handler?
    solution: |
      The document changes first and is reviewed by the people who will call the API; CI checks it against the
      released version; generated artefacts let the frontend start; the handler is written to the contract; and
      conformance tests prove it before the release publishes docs and a changelog.

  - id: coding-document
    type: coding
    concept: openapi-document-structure
    skill: application
    title: Describe the SandPay orders API in OpenAPI 3.1
    prompt: |
      The SandPay orders API is built (`exercises/openapi/orders-app.ts`), but its description
      `exercises/openapi/sandpay-openapi.yaml` is unfinished - written in 3.0 style, with missing responses, a
      duplicate operationId and loose schemas. Make it an accurate OpenAPI 3.1 contract for the app: the
      contract tests parse it, check its structure, compile it in strict Ajv, run real requests against the app
      with supertest and validate every response and the request body against it. Read the app's code for
      what it really sends.
    project: fullstack
    files:
      - exercises/openapi/sandpay-openapi.yaml
    test: tests/openapi/sandpay-contract.test.ts
    command: npx vitest run tests/openapi/sandpay-contract.test.ts
    hints:
      - Start with the document itself - openapi 3.1.2, a unique operationId createRefund for the POST, path parameters with required true (put orderId on each Path Item once).
      - Every error the app sends is application/problem+json with type, title, status and an optional detail - define Problem once, and NotFound and BadRequest under components/responses.
      - Make Order strict - every field required, additionalProperties false, amountMinor an integer, the status enum the app really uses (four values), customerNote as a type array, createdAt with format date-time.
      - "The refund's 201 response needs a headers entry for Location, and requestBody needs required: true and a RefundRequest schema matching the handler's checks (integer at least 1, reason 1-200 characters, nothing else)."
    modelAnswer: |
      The key parts of `solutions/openapi/sandpay-openapi.yaml`:

      ```yaml
      openapi: 3.1.2
      paths:
        /orders/{orderId}/refunds:
          parameters:
            - $ref: '#/components/parameters/OrderId'
          post:
            operationId: createRefund
            requestBody:
              required: true
              content:
                application/json:
                  schema: { $ref: '#/components/schemas/RefundRequest' }
            responses:
              '201':
                description: The refund was created.
                headers:
                  Location: { description: URL of the new refund., required: true, schema: { type: string } }
                content:
                  application/json:
                    schema: { $ref: '#/components/schemas/Refund' }
              '400': { $ref: '#/components/responses/BadRequest' }
              '404': { $ref: '#/components/responses/NotFound' }
              '409':
                description: The order is not paid, or the refund exceeds what is left to refund.
                content:
                  application/problem+json:
                    schema: { $ref: '#/components/schemas/Problem' }
      components:
        schemas:
          Order:
            type: object
            required: [id, amountMinor, currency, status, customerNote, createdAt]
            additionalProperties: false
            properties:
              amountMinor: { type: integer, minimum: 0 }
              status: { $ref: '#/components/schemas/OrderStatus' }   # pending, paid, refunded, failed
              customerNote: { type: [string, 'null'] }
              createdAt: { type: string, format: date-time }
              # id, currency ...
      ```

      Reasoning: the tests compare the document with **real behaviour**, so every status the handlers send
      (400 for a bad limit, 404, 409 for unpaid or over-refunded orders) is documented explicitly with the
      Problem Details media type; the schemas are tight enough that broken samples fail; and the request body
      schema agrees with the handler's own validation case by case.
    rubric:
      - Every test in tests/openapi/sandpay-contract.test.ts passes
      - Errors are defined once (Problem schema, NotFound and BadRequest responses) and referenced, not copied
      - No OpenAPI 3.0 keywords remain (nullable, boolean exclusiveMinimum, schema example)
      - Expected errors are explicit status codes, not hidden under default
      - The document is readable as documentation - summaries, descriptions and an example on the request body
    solution: |
      Treat the failing tests as a checklist in their order - document structure first, then schema strictness,
      then each real request. When a real response fails, compare what `orders-app.ts` sends with what the
      document promises and decide which one is right; here the app is the agreed behaviour.

  - id: coding-checker
    type: coding
    concept: openapi-conformance-testing
    skill: application
    title: Build a contract checker with coverage
    prompt: |
      Implement `createContractChecker(doc)` in `exercises/openapi/contract-checker.ts`. `check(observed)`
      returns the problems with one real response - undocumented path, method, status or content type, or the
      body's schema errors - and `uncovered()` lists the documented responses no check has matched yet. The
      tests use their own small document with a range response, a `default`, a `$ref` response, a `204`
      without content and a concrete path beside a templated one. `oas-ajv.ts` gives you the Ajv setup.
    project: fullstack
    files:
      - exercises/openapi/contract-checker.ts
    test: tests/openapi/contract-checker.test.ts
    command: npx vitest run tests/openapi/contract-checker.test.ts
    hints:
      - Build the coverage map once at the start, from every path, method and response key, in document order - a Map keeps insertion order.
      - Match paths in two passes - concrete paths first, then templated ones - comparing segment by segment after splitting off the query string.
      - "For the response, try [String(status), first digit + 'XX', 'default'] in that order and mark the one found as covered before you look at the body."
      - If the response is a $ref, turn '#/components/responses/NotFound' into a path array and validate at that path plus ['content', mediaType, 'schema'] with validatorAt.
    modelAnswer: |
      ```typescript
      function matchPath(url: string): string | undefined {
        const segments = url.split('?')[0]!.split('/');
        const matches = (template: string) => {
          const parts = template.split('/');
          return parts.length === segments.length &&
            parts.every((part, i) => (/^\{[^}]+\}$/.test(part) ? segments[i] !== '' : part === segments[i]));
        };
        // OpenAPI 4.8.8: concrete paths before templated ones
        return paths.find((p) => !p.includes('{') && matches(p)) ?? paths.find((p) => p.includes('{') && matches(p));
      }

      function responseKey(responses: Json, status: number): string | undefined {
        // 4.8.16: the explicit code takes precedence over the range; default covers the rest
        return [String(status), `${String(status)[0]}XX`, 'default'].find((key) => key in responses);
      }

      // in check(): path -> operation -> response key (mark covered) -> follow $ref ->
      // content type without parameters -> validatorAt(ajv, [...at, 'content', type, 'schema'])
      ```

      Reasoning: each step returns as soon as it finds a problem, because later steps depend on it (no schema
      to validate against an undocumented status). Coverage is marked when the status is **found**, before
      validation - an invalid body still proves the server produces that response.
    rubric:
      - Every test in tests/openapi/contract-checker.test.ts passes
      - Path matching follows the specification (concrete first, one segment per template), not a regular expression built from the whole path by string replacement without anchors
      - Ajv is set up once per checker, not per response
      - Problem messages say which of path, method, status, content type or schema failed
    solution: |
      The order of the lookups is the design: path, method, response, media type, schema. Get the first two
      right with the concrete-before-templated rule, then the response lookup with explicit, range, default -
      the rest is following `$ref` and calling the validator.
    followUp: |
      Wire the checker into a supertest helper so every API test is checked automatically, and fail the suite
      in an `afterAll` when `uncovered()` is not empty - with an allow-list for responses you accept not
      testing.

  - id: short-approach
    type: short
    concept: contract-first-workflow
    skill: analysis
    title: Choose the workflow for two APIs
    prompt: |
      SandPay has (1) a public refunds API used by merchants' servers and two mobile apps, and (2) an internal
      admin API used only by one React page that the same two developers own. For each, choose design-first or
      code-first, and say what the single source of truth is and which CI checks you would run.
    hints:
      - Who has to agree before the API exists, and how expensive is a breaking change for each?
      - Whichever you choose, what must never exist twice?
    modelAnswer: |
      (1) **Design-first.** External and mobile consumers can't be updated on demand, so the contract is reviewed
      before code. Source of truth: `openapi.yaml` in the API repository. CI: lint, `oasdiff breaking` against
      the released version (fail on unversioned breaking changes), type and client generation, and conformance
      checks on every API test with the uncovered list reviewed.

      (2) **Code-first is reasonable.** One small team owns both sides and iterates fast. Source of truth: the
      code (schemas or annotations) from which the document is **generated** in CI, never edited by hand. CI:
      generate the document and fail if the committed copy differs, plus conformance on the generated document.
    rubric:
      - Design-first for the public API, with consumer impact as the reason
      - A reasoned choice for the internal API (code-first acceptable with justification)
      - Exactly one source of truth named for each
      - Spec diff for breaking changes and conformance tests named as CI checks
    solution: |
      The deciding factor is how many independent consumers depend on the contract and how hard they are to
      update. Both approaches fail the same way - two sources of truth - so name one and enforce it in CI.

  - id: interview-contract
    type: interview
    concept: contract-first-workflow
    skill: application
    title: "Interview: keeping the API documentation correct"
    prompt: |
      *"Our API docs are always out of date - the mobile team keeps finding endpoints and error codes that
      aren't documented. As a full stack developer joining the team, what would you change?"*
    hints:
      - Think about where the truth lives, and which automated checks would have caught the last few incidents.
    modelAnswer: |
      First, make one **OpenAPI 3.1 document** the source of truth, in the API repository, and render the
      documentation from it - so docs can't be a separate thing to forget. Then close both directions of drift
      with CI:

      - **Code to document:** every API test's response is checked against the document - path, method,
        status, content type, schema. An undocumented 422 fails the pull request. After the suite, a list of
        documented responses never produced shows promises with no test behind them.
      - **Document to clients:** diff the document against the last release (for example with oasdiff) and
        block unannounced breaking changes; publish the changelog.

      Going forward, change the process to **design-first** for anything the mobile team consumes: new
      operations arrive as YAML pull requests the mobile developers review, and they generate types and a mock
      server from it to start before the backend is done. I'd start with the conformance checker because it
      finds today's gaps in one test run.
    rubric:
      - Names a single source of truth and generated documentation
      - Conformance checks on real responses in the backend's own tests
      - Coverage of documented responses (the reverse direction)
      - Spec diff against the released version for breaking changes
      - Design-first review with consumers, and a pragmatic order of introduction
    followUps:
      - Your checker finds 40 mismatches on day one. How do you roll it out without blocking every pull request?
      - Would you generate the document from code instead? What would you lose?
      - How do you document an error status that only some clients understand?
      - What does a conformance check not prove?
    solution: |
      Strong answers treat drift as two problems - the code drifting from the document and the document drifting
      from clients - and give each an automated check, plus a process change so the document leads.

  - id: testdesign-conformance
    type: testdesign
    concept: openapi-conformance-testing
    skill: application
    title: Test the contract of the refund operation
    prompt: |
      Design the tests that prove `POST /orders/{orderId}/refunds` conforms to its OpenAPI description (201 with
      Location, 400, 404, 409). For each, give preconditions, steps, the expected result **and the evidence**
      you would keep.
    hints:
      - Each documented response needs a request that really produces it.
      - The request body schema is part of the contract too.
    modelAnswer: |
      | # | Preconditions | Steps | Expected | Evidence |
      | --- | --- | --- | --- | --- |
      | 1 | paid order ord_1001 (5000) | POST 1200 "Item returned" | 201, Location `/orders/ord_1001/refunds/re_...`, body valid against Refund, Location documented | response, checker output (empty) |
      | 2 | - | POST amountMinor 0 | 400 problem+json valid against Problem | response, checker output |
      | 3 | no order ord_9999 | POST to ord_9999 | 404 problem+json | response, checker output |
      | 4 | unpaid order ord_1003 | POST 100 | 409 problem+json | response, checker output |
      | 5 | paid ord_1002 (2500) | POST 999999 | 409 problem+json, detail names the limit | response |
      | 6 | - | validate sample bodies (valid, 0, 1.5, missing reason, empty reason, 201 chars, extra field) against RefundRequest and send each to the app | schema verdict equals app verdict for every body | table of verdicts |
      | 7 | all above ran | read `uncovered()` | no POST refunds response left | uncovered list |
    rubric:
      - One test per documented response, each producing it for real
      - Checks the Location header is both sent and documented
      - Request-body schema compared with the handler's real validation
      - Evidence is the response plus the checker's problem list, and the coverage list at the end
    solution: |
      Conformance tests are ordinary API tests with one extra assertion - the checker - and one extra report at
      the end - coverage. The request body is checked the other way round: the schema must agree with what the
      handler accepts.

placement:
  - id: place-structure
    type: mcq
    concept: openapi-document-structure
    skill: application
    title: Which response definition applies?
    prompt: |
      An operation's responses are `'200'`, `'404'`, `'4XX'` and `default`. The server answers **409**. Which
      definition describes it?
    options:
      - id: range
        text: The '4XX' response
        feedback: Correct - there is no explicit 409, so the range covers it; default only applies to codes covered by neither.
      - id: default
        text: default
        feedback: default covers codes not covered individually - a range definition covers 409 first.
      - id: "404"
        text: The '404' response, the closest client error
        feedback: Explicit codes apply only to that exact code; there is no "closest" matching.
      - id: none
        text: None - 409 is undocumented
        feedback: The 4XX range documents every status from 400 to 499 that has no explicit entry.
    correct: [range]
    solution: |
      Explicit code first, then its range (`4XX`), then `default` (section 4.8.16). A 409 falls to `4XX`.

  - id: place-schema
    type: mcq
    concept: openapi-schema-reuse
    skill: application
    title: A 3.1 amount schema
    prompt: |
      Which schema says "an integer amount in minor units, greater than 0" correctly in an OpenAPI 3.1 document?
    options:
      - id: correct
        text: "type: integer, exclusiveMinimum: 0"
        feedback: Correct - in JSON Schema 2020-12 exclusiveMinimum is a number.
      - id: old
        text: "type: integer, minimum: 0, exclusiveMinimum: true"
        feedback: That is the OpenAPI 3.0 form; in 3.1 exclusiveMinimum must be a number, so a boolean is invalid.
      - id: number
        text: "type: number, minimum: 1"
        feedback: number allows 12.5 - a minor-unit amount must be an integer.
      - id: string
        text: "type: string, pattern: '^[1-9][0-9]*$'"
        feedback: That describes a string of digits - the API sends a JSON number.
    correct: [correct]
    solution: |
      OpenAPI 3.1 Schema Objects follow JSON Schema 2020-12: `exclusiveMinimum` takes the bound itself. (`minimum:
      1` with `type: integer` is equivalent.)

  - id: place-workflow
    type: order
    concept: contract-first-workflow
    skill: application
    title: The contract-first sequence
    prompt: Put the design-first steps for a new operation in order (first at the top).
    items:
      - id: doc
        text: Change the OpenAPI document
      - id: review
        text: Consumers review the change
      - id: diff
        text: CI diffs the document against the released version
      - id: code
        text: Implement the handler
      - id: conform
        text: Conformance tests check the handler's responses against the document
    solution: |
      In design-first the document leads: change, review, diff against the release, then implement and prove
      the implementation conforms.

  - id: place-conformance
    type: debug
    concept: openapi-conformance-testing
    skill: analysis
    title: The checker that matches the wrong path
    prompt: |
      A response from `GET /orders/summary` is validated against the `Order` schema of `/orders/{orderId}` and
      fails. Click the line that causes it.
    language: typescript
    code: |
      function matchPath(url: string, paths: string[]): string | undefined {
        const segments = url.split('?')[0]!.split('/');
        const matches = (template: string) => {
          const parts = template.split('/');
          return parts.length === segments.length &&
            parts.every((p, i) => (/^\{[^}]+\}$/.test(p) ? segments[i] !== '' : p === segments[i]));
        };
        return paths.find((p) => matches(p));
      }
    correctLines: [8]
    lineNotes:
      - line: 2
        note: Removing the query string before matching is right.
      - line: 6
        note: The segment comparison is right - a template matches one non-empty segment.
    solution: |
      Line 8 returns the **first** matching path in document order. If `/orders/{orderId}` is listed before
      `/orders/summary`, the template wins. OpenAPI 4.8.8: concrete (non-templated) paths are matched before
      templated ones - search concrete paths first, then templates.

recall:
  - id: recall-required-root
    concept: openapi-document-structure
    prompt: Which fields are required at the root of an OpenAPI 3.1 document, and what is the difference between openapi and info.version?
    answer: openapi and info. openapi is the specification version the document uses (3.1.2); info.version is the version of your API document.
  - id: recall-path-param
    concept: openapi-document-structure
    prompt: What does the specification require of a path parameter and of operationId?
    answer: A path parameter must have required set to true; operationId must be unique among all operations (and is case-sensitive).
  - id: recall-response-lookup
    concept: openapi-document-structure
    prompt: In what order are response definitions chosen for a status code?
    answer: The explicit code, then its range (such as 4XX), then default.
  - id: recall-31-schemas
    concept: openapi-schema-reuse
    prompt: How do nullable, exclusiveMinimum and example change from OpenAPI 3.0 to 3.1?
    answer: nullable becomes a type array (type [string, 'null']); exclusiveMinimum becomes the numeric bound; schema example is deprecated in favour of the JSON Schema examples array.
  - id: recall-reference-object
    concept: openapi-schema-reuse
    prompt: What may appear next to a $ref that is a Reference Object (for example a response)?
    answer: Only summary and description; any other property is ignored. Inside a Schema Object, $ref is the JSON Schema keyword and may be combined with others.
  - id: recall-design-first
    concept: contract-first-workflow
    prompt: What is the OpenAPI Initiative's main argument for design-first?
    answer: Code can create APIs OpenAPI can't describe; writing the description first keeps the API describable, lets consumers review early, and gives one source of truth for tools.
  - id: recall-two-drifts
    concept: contract-first-workflow
    prompt: Which two CI checks cover the two directions of drift?
    answer: A spec diff against the released version (document versus clients - breaking changes) and conformance tests of real responses (code versus document), plus coverage of documented responses.
  - id: recall-uncovered
    concept: openapi-conformance-testing
    prompt: What does an uncovered documented response tell you?
    answer: The document promises a response no test produced - either a missing test or a promise the code no longer keeps.

