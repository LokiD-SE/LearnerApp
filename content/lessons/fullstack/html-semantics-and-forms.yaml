id: html-semantics-and-forms
title: Semantic HTML and forms
subject: fullstack
module: web-platform
level: beginner
status: published
estimatedMinutes: 55
summary: Structure pages with landmarks and headings, build forms whose every control has a label, and know exactly what the browser validates and sends when a form is submitted - and what it never protects.
tags:
  [
    html,
    semantic html,
    landmarks,
    headings,
    forms,
    label,
    fieldset,
    autocomplete,
    form submission,
    constraint validation,
    required,
    novalidate,
    requestSubmit,
    accessibility,
    locators,
  ]

environment: |
  - **Standard:** the **WHATWG HTML Living Standard** (checked November 2026) - the only current HTML
    specification. Sections used: [4.3 Sections](https://html.spec.whatwg.org/multipage/sections.html)
    (`article`, `section`, `nav`, `aside`, headings and the outline), [4.4.14 the `main`
    element](https://html.spec.whatwg.org/multipage/grouping-content.html#the-main-element),
    [4.10 Forms](https://html.spec.whatwg.org/multipage/forms.html) (`form`, `label`, `submit()` and
    `requestSubmit()`), [4.10.5 the `input` element](https://html.spec.whatwg.org/multipage/input.html),
    [4.10.6 the `button` element](https://html.spec.whatwg.org/multipage/form-elements.html#the-button-element),
    and [4.10.18-4.10.22 form control infrastructure, autofill, constraints and form
    submission](https://html.spec.whatwg.org/multipage/form-control-infrastructure.html). It is a living
    standard: section numbers move, so search by heading.
  - **Accessibility mappings:** W3C [HTML Accessibility API Mappings
    (HTML-AAM)](https://w3c.github.io/html-aam/) - which ARIA role each element is exposed with (for
    example `section` becomes a `region` only when it has an accessible name). WCAG and ARIA in depth are in
    [Accessibility with WCAG 2.2 and ARIA](#/lesson/web-accessibility-wcag).
  - **Reference:** MDN Web Docs - [Structuring
    content](https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Structuring_content),
    [`<input>`](https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/input),
    [`autocomplete`](https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Attributes/autocomplete),
    [Client-side form
    validation](https://developer.mozilla.org/en-US/docs/Learn_web_development/Extensions/Forms/Form_validation)
    and the [Constraint validation API](https://developer.mozilla.org/en-US/docs/Web/API/Constraint_validation).
  - **Browser-specific:** the wording and look of validation bubbles differ between browsers and languages;
    the spec only says the user is "probably informed". Never assert on that text in tests.
  - **Examples:** markup quoted from the **SandPay Demo Shop** in this repository (`practice/shop`, served at
    [shop/index.html](shop/index.html)) is real; SandPay and every name, email and order in the examples
    are fictional. No real card data appears anywhere.

prerequisites:
  - client-server-request-flow
  - browser-devtools-for-testers

concepts:
  - id: html-semantic-structure
    name: Semantic structure - landmarks and headings
    summary: Elements such as main, nav, header, footer, article and section say what a part of the page is; headings form the outline. Browsers, assistive technology and test tools read that meaning - a div carries none.
  - id: html-labelled-controls
    name: Labelled form controls
    summary: Every control needs a programmatic label (label for/id or wrapping), groups need fieldset and legend, and type and autocomplete tell the browser what data is expected. A placeholder is not a label.
  - id: html-form-submission-validation
    name: Form submission and constraint validation
    summary: On submit the browser validates constraints (unless novalidate), fires a cancelable submit event, builds the entry list from named, enabled, checked controls and sends it with the form's method and enctype. Client-side validation is for users, never for security.

objectives:
  - Mark up a page with landmarks (`header`, `nav`, `main`, `footer`) and a heading outline that does not skip levels, and explain what each element is exposed as.
  - Write form controls that each have an accessible name, grouped with `fieldset` and `legend`, with the right `type` and `autocomplete` tokens.
  - Predict exactly which name-value pairs a form submits, with which method and encoding, and which button submits it.
  - Use the constraint validation attributes and API (`required`, `pattern`, `validity`, `setCustomValidity`, `reportValidity`) and explain why the server must validate again.
  - Design tests that prove a form is labelled, validates correctly on the client, and is still safe when client validation is bypassed.

sections:
  - id: intuition
    kind: intuition
    concepts: [html-semantic-structure, html-labelled-controls]
    title: The idea in plain language
    body: |
      A printed form at a bank has a **title**, **numbered sections**, and a **printed caption next to every
      box** - "Account holder name", "Date of birth (DD/MM/YYYY)". Nobody has to guess what a box is for,
      and the clerk can say "section 3, the second box" over the phone.

      HTML is the same idea for machines. `<main>`, `<nav>` and headings are the **sections and title**;
      `<label>` is the **printed caption**; `type="email"` is the **"(DD/MM/YYYY)" hint the clerk checks**.
      A page built from anonymous `<div>`s with grey placeholder text is a form with no captions: a sighted
      user can guess, but a screen reader, a password manager, a search engine - and **your test
      automation** - cannot.

      The other half of the analogy is the **clerk at the counter**: the form's own checks (`required`,
      `pattern`) catch honest mistakes early, but the bank still checks everything again in the back office.
      The browser's validation is the clerk; your server is the back office.

  - id: what
    kind: what
    concepts: [html-semantic-structure]
    title: The structural elements and what they mean
    body: |
      Definitions are from the WHATWG HTML standard; roles are from HTML-AAM.

      | Element | Meaning (HTML standard) | Exposed to assistive technology as |
      |---|---|---|
      | `<header>` | introductory content for its nearest section or the page | `banner` landmark when it belongs to the page, not to an `article`/`section` |
      | `<nav>` | "a section of a page that links to other pages or to parts within the page" | `navigation` landmark |
      | `<main>` | "the dominant contents of the document" - **at most one** visible `main` | `main` landmark |
      | `<article>` | a complete, self-contained composition - could be syndicated (a product card, a comment) | `article` |
      | `<section>` | "a thematic grouping of content, typically with a heading" - **not a generic container** | `region` landmark **only if it has an accessible name**, otherwise generic |
      | `<aside>` | content tangentially related to what is around it | `complementary` landmark |
      | `<footer>` | footer for its nearest section or the page | `contentinfo` landmark for the page |
      | `<h1>`-`<h6>` | headings; together, in document order, they form the page **outline** | `heading` with a level |
      | `<div>` | "no special meaning at all" - styling and scripting hooks only | generic |

      Two rules from the standard worth memorising:

      - **Heading levels must not skip downwards.** Each heading must be at the same level, any higher
        level, or **one** level deeper than the one before - `h1` then `h3` is non-conforming. At least one
        heading should be an `h1`.
      - **Use `div` when you only need a box.** The standard says `section` is appropriate "only if the
        element's contents would be listed explicitly in the document's outline".

      The SandPay Demo Shop's checkout follows this: one `<main>` with `<h1>Checkout</h1>`, and two
      `<section class="panel" aria-labelledby="...">` blocks whose `<h2>` (Order summary, Payment) also
      gives each section its accessible name - so each becomes a named `region`.

  - id: why
    kind: why
    concepts: [html-semantic-structure, html-labelled-controls]
    title: Why semantics are not optional
    body: |
      Semantic markup is read by far more than the browser's renderer:

      - **Screen-reader users** jump between landmarks and headings instead of reading a page top to
        bottom. A page with no `main` or headings has to be listened to in full.
      - **Keyboard users** get focus, Enter and Space behaviour for free from `<button>`, `<a href>` and
        form controls. A clickable `<div>` gets none of it unless you rebuild it with `tabindex`, key
        handlers and a role.
      - **Browsers and password managers** use `type`, `name` and `autocomplete` to offer the right
        keyboard on a phone, fill addresses and generate passwords.
      - **Test automation** finds elements the way users do. Playwright's `getByRole('button', { name: 'Pay' })`
        and `getByLabel('Email for the receipt')` work only when the role and the accessible name exist in
        the markup. If a locator needs `div.panel > div:nth-child(3) input`, the markup is usually missing a
        label - that is an accessibility defect **and** a testability defect.

      As a full stack developer you write this markup yourself, so these are your bugs to prevent, not
      somebody else's to report.

  - id: controls
    kind: what
    concepts: [html-labelled-controls]
    title: Form controls, labels and autocomplete
    body: |
      **Labels.** A `label` element's labeled control is set "either using the `for` attribute, or by
      putting the form control inside the `label` element itself". `for` must be the **id** of the control,
      in the same document:

      ```html
      <!-- explicit: from practice/shop/checkout.html -->
      <label for="email">Email for the receipt</label>
      <input id="email" name="email" type="email" autocomplete="email" required />

      <!-- implicit: the control is inside the label -->
      <label>Name on card <input name="card-name" autocomplete="cc-name" /></label>
      ```

      Clicking the label focuses (or toggles) the control, which also gives touch users a bigger target.

      **Placeholder is not a label.** The standard is explicit: "The `placeholder` attribute should not be used
      as an alternative to a label." It disappears while typing, is often low contrast, and is not reliably
      used as the accessible name.

      **Groups.** `<fieldset>` groups related controls; its first child `<legend>` is the group's caption.
      Always use it for a set of radio buttons - otherwise "Yes" and "No" have no question.

      ```html
      <fieldset>
        <legend>Receipt delivery</legend>
        <label><input type="radio" name="receipt" value="email" checked /> Email</label>
        <label><input type="radio" name="receipt" value="none" /> No receipt</label>
      </fieldset>
      ```

      **The right `type`.** `email`, `tel`, `url`, `number`, `date`, `checkbox`, `radio`, `password`,
      `search`, `file` and others change the keyboard on phones, the built-in checks (`type=email` must be a
      valid email address) and the control itself. `type="number"` is for quantities, **not** for
      identifiers such as phone numbers or postcodes - those are text that happens to contain digits.

      **Autofill.** `autocomplete` takes tokens defined by the standard, for example `name`, `email`, `tel`,
      `username`, `current-password`, `new-password`, `one-time-code`, `postal-code`, `cc-name`,
      `cc-number`, or `off`. Use `new-password` on sign-up so password managers offer to generate one, and
      `current-password` on sign-in so they fill the saved one.

  - id: visual
    kind: visual
    concepts: [html-form-submission-validation]
    title: "Flowchart: what happens when a form is submitted"
    body: |
      The order comes from the standard's form submission algorithm. Notice that validation and the
      `submit` event both happen **before** any data is collected - and that `form.submit()` skips both.

      ```mermaid
      flowchart TD
          A[User clicks a submit button or presses Enter in a field] --> B{novalidate on the form or formnovalidate on the button?}
          B -- no --> C{All constraints valid?}
          C -- no --> D[Browser shows a message on the first invalid control - nothing is sent]
          C -- yes --> E
          B -- yes --> E[Fire the cancelable submit event]
          E --> F{preventDefault called?}
          F -- yes --> G[Stop - script handles it, usually with fetch]
          F -- no --> H[Build the entry list - named, enabled, checked controls plus the submitter]
          H --> I[Encode with enctype - default application/x-www-form-urlencoded]
          I --> J{method}
          J -- GET default --> K[Navigate to action URL with a query string]
          J -- POST --> L[Navigate with the data in the request body]
          S[form.submit called from script] -. skips validation and the submit event .-> H
      ```

  - id: internals
    kind: internals
    concepts: [html-form-submission-validation]
    title: How submission and validation work underneath
    body: |
      **Defaults** (all from the standard):

      | Setting | Default when missing or invalid |
      |---|---|
      | `method` | **GET** - data goes into the URL's query string |
      | `enctype` | `application/x-www-form-urlencoded` (use `multipart/form-data` for file uploads) |
      | `action` | the document's own URL |
      | `<button>` with no `type` inside a form | a **submit button** (the "Auto" state, unless it uses `command`/`commandfor` or sits inside a `select`) |

      **What goes into the entry list.** Every submittable control in tree order, **except** controls that
      are **disabled**, inside a `datalist`, buttons that are not the submitter, and **unchecked** checkboxes
      and radio buttons. Controls whose `name` is missing or empty are not sent either. So a missing
      `name` and a stray `disabled` are the two most common "the server never got my field" bugs - and
      `readonly` is the way to show a value the user can't edit that **is** submitted.

      **Implicit submission.** Pressing Enter in a text field clicks the form's **default button** - the
      first submit button in tree order. That is why the first `<button>` in a form, if it has no `type`,
      decides what Enter does.

      **Constraint validation.** These attributes set flags on the control's `validity` object:

      | Attribute or type | `validity` flag when broken |
      |---|---|
      | `required` | `valueMissing` |
      | `type="email"` / `type="url"` | `typeMismatch` |
      | `pattern` | `patternMismatch` (the regex must match the **whole** value) |
      | `minlength` / `maxlength` | `tooShort` / `tooLong` (checked after the user edits the value) |
      | `min` / `max` / `step` | `rangeUnderflow` / `rangeOverflow` / `stepMismatch` |
      | `setCustomValidity('message')` | `customError` - cleared only by `setCustomValidity('')` |

      `el.checkValidity()` returns `true`/`false` and fires an `invalid` event; `el.reportValidity()` also
      shows the message to the user. Disabled controls are **barred** from validation. `novalidate` on the
      form (or `formnovalidate` on one button, such as "Save draft") skips interactive validation for that
      submission.

      **Script-driven submission.** `form.submit()` "submits the form, bypassing interactive constraint
      validation and without firing a submit event". `form.requestSubmit()` behaves like clicking a submit
      button - validation and the `submit` event included. Single-page apps usually listen for `submit`,
      call `event.preventDefault()` and send the data with `fetch`.

      **Security.** The standard's own words: "Servers should not rely on client-side validation. Client-side
      validation can be intentionally bypassed by hostile users ... The constraint validation features are
      only intended to improve the user experience, not to provide any kind of security mechanism."

  - id: steps
    kind: steps
    concepts: [html-semantic-structure, html-labelled-controls]
    title: Building a page and a form, step by step
    body: |
      1. **Start with the outline.** Write the headings first: one `h1` for the page, `h2` for each main
         part, never skipping a level. If the outline reads well on its own, the structure is right.
      2. **Add the landmarks.** `header` (site name, `nav`), one `main`, `footer`. Give a `nav` an
         `aria-label` when there is more than one ("Shop", "Account").
      3. **Use `section` only for outline-worthy parts**, each with a heading; name it with
         `aria-labelledby` pointing at that heading. Use `div` for layout boxes.
      4. **For every input, write the `label` first**, then the control with matching `id`, a meaningful
         `name` (the server's field name), the right `type` and an `autocomplete` token.
      5. **Group** radio buttons and related fields in `fieldset` + `legend`.
      6. **Add constraints that match the server's rules** - `required`, `maxlength`, `min`/`max`, `pattern` -
         and connect error text to the field with `aria-describedby`.
      7. **Give every button an explicit `type`**: `submit` for the action, `button` for everything else
         (Cancel, Show password, Add another).
      8. **Check it:** tab through the page with the keyboard only; open the Accessibility pane in DevTools
         and confirm each control's computed name; submit with the Network panel open and read the request.

  - id: example
    kind: example
    concepts: [html-labelled-controls, html-form-submission-validation]
    title: "Example: two forms in the SandPay Demo Shop"
    body: |
      The shop is useful precisely because its two forms make **different, deliberate choices**.

      **Checkout (`checkout.html`)** - the email field is a well-labelled control:

      ```html
      <section class="panel" aria-labelledby="pay-title">
        <h2 id="pay-title">Payment</h2>
        <label for="email">Email for the receipt</label>
        <input id="email" name="email" type="email" autocomplete="email" data-testid="email" required />
        ...
        <p class="error" role="alert" data-testid="payment-error"></p>
        <button type="button" data-testid="pay-button" disabled>Pay</button>
      </section>
      ```

      There is **no `<form>` element** here, and Pay is `type="button"`: the page's JavaScript reads the
      fields and talks to SandPay itself, so `required` never triggers a browser submission check on its
      own. A developer who expects `required` to "protect" this page is wrong twice - nothing calls the
      browser's validation, and nothing would stop a script anyway. The script must check the value, and the
      server must check it again.

      **Card iframe (`sandpay-card.html`)** - a real `<form novalidate>`:

      ```html
      <form data-testid="card-form" novalidate>
        <label for="card">Test card</label>
        <input id="card" name="card" type="text" autocomplete="off" spellcheck="false"
               placeholder="sandpay-success" aria-describedby="card-error" ... />
        <p class="error" id="card-error" data-testid="card-error" aria-live="polite"></p>
      </form>
      ```

      `novalidate` hands validation entirely to the script, which writes its own message into `#card-error`;
      `aria-describedby` makes screen readers read that message with the field, and `aria-live="polite"`
      announces it when it changes. The placeholder shows an example value **in addition** to the label, not
      instead of it. `autocomplete="off"` is used because the field takes SandPay test codes, not real data.

      What a tester checks on both: the label is announced, the error is tied to the field, Pay stays
      disabled until the details are complete - and a direct API call with an invalid email is still
      rejected by the server.

  - id: code
    kind: code
    concepts: [html-labelled-controls, html-form-submission-validation]
    title: "Code: an accessible sign-up form with client-side checks"
    collapsed: true
    body: |
      Illustrative: a complete HTML page for a fictional SandPay merchant sign-up. The script only improves
      the message; the server at `/signup` must apply the same rules.

      ```html
      <!doctype html>
      <html lang="en">
        <head>
          <meta charset="utf-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1" />
          <title>Create a merchant account - SandPay</title>
        </head>
        <body>
          <header>
            <p>SandPay for merchants</p>
            <nav aria-label="Main"><a href="/">Home</a> <a href="/help">Help</a></nav>
          </header>
          <main>
            <h1>Create a merchant account</h1>
            <form action="/signup" method="post">
              <label for="business">Business name</label>
              <input id="business" name="business" autocomplete="organization" required maxlength="80" />

              <label for="signup-email">Email</label>
              <input id="signup-email" name="email" type="email" autocomplete="email" required />

              <label for="password">Password</label>
              <input id="password" name="password" type="password" autocomplete="new-password"
                     required minlength="12" aria-describedby="password-hint" />
              <p id="password-hint">At least 12 characters.</p>

              <fieldset>
                <legend>Expected monthly volume</legend>
                <label><input type="radio" name="volume" value="small" required /> Under 1,000 payments</label>
                <label><input type="radio" name="volume" value="large" /> 1,000 payments or more</label>
              </fieldset>

              <label><input type="checkbox" name="terms" value="accepted" required /> I accept the terms</label>

              <button type="submit">Create account</button>
              <button type="submit" formnovalidate name="intent" value="draft">Save draft</button>
            </form>
          </main>
          <footer><p>SandPay is a fictional provider.</p></footer>
          <script>
            const email = document.getElementById('signup-email');
            email.addEventListener('input', () => {
              // Custom rule on top of type=email; '' clears the error again.
              email.setCustomValidity(email.value.endsWith('.example') ? '' : 'Use your .example business address.');
            });
          </script>
        </body>
      </html>
      ```

      Submitting it with valid values sends a `POST /signup` whose body (URL-encoded, shown decoded) is:

      ```plaintext
      business=Bean There&email=owner@beanthere.example&password=...&volume=small&terms=accepted
      ```

      `intent=draft` appears **only** when Save draft was the submitter; the Create account button has no
      `name`, so it adds nothing.

  - id: line-by-line
    kind: line-by-line
    concepts: [html-labelled-controls, html-form-submission-validation]
    title: Why those lines are written that way
    body: |
      - `<html lang="en">` - screen readers pick the pronunciation from it; it is also needed by
        translation and spell checking.
      - `<nav aria-label="Main">` - names the landmark, so a page with two navs is still clear.
      - `for="signup-email"` / `id="signup-email"` but `name="email"` - `id` links the label (and must be
        unique on the page); `name` is the **field name the server receives**. They are different jobs.
      - `autocomplete="new-password"` + `minlength="12"` - password managers offer a strong password; the
        browser blocks shorter ones before a round trip. The server enforces the same 12.
      - `aria-describedby="password-hint"` - the hint is read together with the label, not lost.
      - `required` on **one** radio button of the group - a radio group is "missing a value" if none of its
        buttons is checked, so one `required` covers the group.
      - `type="submit"` written explicitly on both buttons - no reader has to remember the default.
      - `formnovalidate` on Save draft - a half-filled draft can be saved; the server must accept drafts with
        missing fields **only** for that intent.
      - `setCustomValidity(... ? '' : '...')` - an empty string clears the custom error. Forgetting the
        clearing branch leaves the field invalid forever, even after the user fixes it.

  - id: when
    kind: when
    concepts: [html-semantic-structure, html-form-submission-validation]
    title: When to use what - and what it does not replace
    body: |
      | Need | Use | Not |
      |---|---|---|
      | An action on the page | `<button type="button">` | a clickable `<div>` or `<a href="#">` |
      | Going to another page | `<a href="...">` | a button with `location.href = ...` |
      | Sending data | a `<form>` with a submit button, enhanced with `fetch` if you like | inputs with no form and an `onclick` that skips Enter-to-submit |
      | A box for layout | `<div>` | `<section>` with no heading |
      | A part of the outline | `<section>` + heading, named with `aria-labelledby` | `<div class="section">` |
      | Fully custom error messages | `novalidate` + your own checks and `aria-describedby` | removing all checks |

      **What it does not replace:**

      - **Server-side validation.** Every rule the browser checks, the server must check again. Requests can
        come from `curl`, an old app version or a modified page.
      - **ARIA everywhere.** The first rule of ARIA is to use the native element when one exists; a
        `<button>` beats `<div role="button">`. ARIA is covered in
        [the accessibility lesson](#/lesson/web-accessibility-wcag).
      - **Usability testing.** Valid, labelled markup can still be a confusing form.

  - id: tests
    kind: tests
    concepts: [html-semantic-structure, html-labelled-controls, html-form-submission-validation]
    title: What to test, and the evidence
    body: |
      | # | Case | Expected | Evidence |
      |---|---|---|---|
      | 1 | Tab through the whole form with the keyboard only | every control and button reachable in a logical order; Enter in a field submits | screen recording |
      | 2 | Inspect each control in DevTools > Accessibility | each has a computed **name** equal to its visible label; radios are in a named group | Accessibility pane screenshot |
      | 3 | Locate each field with `getByLabel` / `getByRole` | every locator resolves to exactly one element | passing locator test |
      | 4 | Submit empty | no request sent; the first invalid field is focused with a message | Network panel shows no request |
      | 5 | Enter `owner@` in an email field | `typeMismatch`, no request | `$0.validity` in the Console |
      | 6 | Submit valid data | request has the expected method, URL and **exactly** the expected fields | Network panel > Payload |
      | 7 | Disable client checks (DevTools: remove `required`, or send with curl) and submit invalid data | **server** rejects with a clear error, nothing saved | response body and status, database check |
      | 8 | Press Enter in the first field of a form whose first button is Cancel | Cancel must not submit (it needs `type="button"`) | Network panel |
      | 9 | Use the browser's autofill / a password manager | correct values in correct fields | screenshot |
      | 10 | Headings list (an accessibility extension or the Accessibility tree) | one `h1`, no skipped levels, outline matches the page | headings list |

      Case 7 is the one most often skipped and the one that finds security defects.

  - id: mistakes
    kind: mistakes
    concepts: [html-semantic-structure, html-labelled-controls, html-form-submission-validation]
    title: Common mistakes and how to debug them
    body: |
      - **A field never reaches the server.** Check, in order: does it have a `name`? Is it `disabled`? Is it
        inside the `<form>` (or does it have `form="id"`)? Is it an unchecked checkbox? Read the request
        payload in the Network panel before touching server code.
      - **Cancel submits the form.** A `<button>` without `type` inside a form is a submit button. Add
        `type="button"`.
      - **The form submits but the page "does nothing".** A script calls `preventDefault()` on `submit` and
        then fails. Check the Console for errors and the Network panel for the `fetch`.
      - **Validation never runs.** The code calls `form.submit()` (which bypasses validation) instead of
        `form.requestSubmit()`, or the form has `novalidate`.
      - **A field stays invalid after it is fixed.** `setCustomValidity('message')` without a matching
        `setCustomValidity('')`. Check `$0.validity.customError` in the Console.
      - **`label for` points nowhere.** A typo in `for`, or a duplicated `id` - the label attaches to the
        **first** element with that id. DevTools' Issues panel and the Accessibility pane both show it.
      - **Placeholder used as the label.** The field has no accessible name, and the hint disappears while
        typing.
      - **Every block is a `section`.** The outline fills with unnamed regions. Use `div` for layout.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [html-form-submission-validation]
    title: Trade-offs - native validation or your own
    body: |
      | | Native constraint validation | `novalidate` + your own checks |
      |---|---|---|
      | Effort | attributes only | code for every rule |
      | Message text | browser's own, in the browser's language, styling limited | your wording, design and placement |
      | Accessibility | built in, focus moves to the first invalid field | you must add `aria-describedby`, live regions and focus |
      | Timing | on submit (and `:user-invalid` after interaction) | whenever you choose |
      | Consistency with server | you repeat the rules in attributes | you can share rule code with the server (for example a schema library in TypeScript) |

      A common middle path: keep the attributes (they still drive `validity` and `:user-invalid`), set
      `novalidate` to hide the browser bubbles, and on `submit` call `checkValidity()` and render your own
      messages from the `validity` flags. Whatever you choose, the server's validation is the one that
      counts.

  - id: summary
    kind: summary
    concepts: [html-semantic-structure, html-labelled-controls, html-form-submission-validation]
    title: Quick reference
    body: |
      - Landmarks: `header`, `nav`, one `main`, `footer`; `section` only with a heading (named → `region`).
      - Headings: one `h1`, never skip a level going down; `div` has no meaning.
      - Every control: `label for` = its `id`; `name` = the server's field; right `type`; `autocomplete`
        token. Placeholder is not a label. Radio groups in `fieldset` + `legend`.
      - Defaults: `method` GET, `enctype` urlencoded, `<button>` in a form = submit.
      - Sent: named, enabled, checked controls plus the submitter. Not sent: disabled, unnamed, unchecked.
      - Order: validate → `submit` event (cancelable) → entry list → request. `submit()` skips the first
        two; `requestSubmit()` does not.
      - `validity` flags, `checkValidity()`, `reportValidity()`, `setCustomValidity('')` to clear.
      - Client-side validation is UX; the server validates everything again.

exercises:
  - id: cancel-submits
    type: mcq
    concept: html-form-submission-validation
    skill: application
    title: Why does Cancel save the profile?
    prompt: |
      A bug report says "Clicking Cancel on the edit-profile page saves my changes". The markup:

      ```html
      <form action="/profile" method="post">
        <label for="display-name">Display name</label>
        <input id="display-name" name="displayName" required />
        <button onclick="history.back()">Cancel</button>
        <button type="submit">Save</button>
      </form>
      ```

      What is the cause?
    options:
      - id: default-submit
        text: A button with no type inside a form is a submit button, so Cancel submits the form before (or instead of) going back.
        feedback: Correct - the missing type means the Auto state, which is a submit button here. The fix is type="button".
      - id: onclick-bug
        text: history.back() saves the form because the browser keeps the typed values.
        feedback: history.back() only navigates. Browsers may restore typed values on Back, but they don't send them to the server.
      - id: required
        text: The required attribute forces the form to submit whenever a button is clicked.
        feedback: required only blocks submission when the value is missing. It never starts one.
      - id: server
        text: The server saves on every request to /profile, including GET.
        feedback: Possible in theory, but the form posts; the question is why a POST happens at all when Cancel is clicked. Look at the button.
    correct: [default-submit]
    hints:
      - Compare the two buttons' attributes.
      - What is a button's type when the attribute is missing?
    solution: |
      **Cancel has no `type`.** A `<button>` inside a form with no `type` is in the Auto state and acts as a
      **submit button**, so clicking it submits the form (validation runs first, so it saves whenever the
      name is valid). Also, Cancel comes **first**, so it is the form's default button - pressing Enter in
      the field "clicks" Cancel too. Fix: `type="button"` on Cancel. Confirm in the Network panel: a `POST
      /profile` appears when Cancel is clicked before the fix and none after.
    followUp: |
      After the fix, a user presses Enter in the Display name field. Which button does the browser now
      "click", and why?

  - id: missing-fields-debug
    type: debug
    concept: html-form-submission-validation
    skill: analysis
    title: Which line loses the field?
    prompt: |
      The server logs that `POST /refunds` arrives without `reason`, although users say they fill it in. The
      Network panel's payload shows `orderId=ord_1042&amount=12.50`. Click the line that causes it.
    language: html
    code: |
      <form action="/refunds" method="post">
        <input type="hidden" name="orderId" value="ord_1042" />
        <label for="amount">Amount</label>
        <input id="amount" name="amount" type="number" step="0.01" min="0.01" required />
        <label for="reason">Reason</label>
        <textarea id="reason" required></textarea>
        <label><input type="checkbox" name="notify" value="yes" /> Email the customer</label>
        <button type="submit">Refund</button>
      </form>
    correctLines: [6]
    lineNotes:
      - line: 7
        note: An unchecked checkbox is not sent, which matches the payload - but that is expected behaviour, and it doesn't explain the missing reason.
      - line: 5
        note: The label's for matches the textarea's id, so the label is fine. Labels affect the accessible name, not what is submitted.
      - line: 8
        note: The submit button has no name, so it adds nothing to the payload - normal, and not the bug.
    hints:
      - The entry list contains only controls with a non-empty name.
      - Which control has an id but no name?
    solution: |
      **Line 6.** The textarea has an `id` (so the label works and `required` is enforced) but **no `name`**,
      so it is skipped when the entry list is built. Fix: `name="reason"`. The `id` is for the label and
      scripts; `name` is what the server receives.
    followUp: |
      A teammate "fixes" a different form by adding `disabled` to a field so users can't change it - and now
      that field is missing too. What should they have used instead?

  - id: predict-payload
    type: mcq
    concept: html-form-submission-validation
    skill: analysis
    title: What does the server receive?
    prompt: |
      A user leaves everything as it is and clicks **Search**:

      ```html
      <form action="/orders">
        <input name="q" value="latte" />
        <input name="status" value="paid" disabled />
        <label><input type="checkbox" name="refunded" value="1" /> Refunded only</label>
        <input value="unused" />
        <button name="view" value="list">Search</button>
      </form>
      ```

      Which request is sent?
    options:
      - id: get-correct
        text: "GET /orders?q=latte&view=list"
        feedback: Correct - method defaults to GET, the disabled field and unchecked checkbox are skipped, the unnamed input is skipped, and the submitter button's name and value are included.
      - id: post
        text: "POST /orders with body q=latte&status=paid&view=list"
        feedback: With no method attribute the form uses GET, and disabled controls are never submitted.
      - id: all-fields
        text: "GET /orders?q=latte&status=paid&refunded=&view=list"
        feedback: Disabled controls and unchecked checkboxes are left out entirely - not sent as empty values.
      - id: no-button
        text: "GET /orders?q=latte"
        feedback: The button has no type, so it is a submit button - and the submitter is included in the entry list when it has a name.
    correct: [get-correct]
    hints:
      - What are the defaults for method and for a button's type?
      - Go through the controls one by one - which of them are skipped when the entry list is built?
    solution: |
      **`GET /orders?q=latte&view=list`.** Method defaults to GET, so the pairs go in the query string.
      `status` is disabled (skipped), `refunded` is unchecked (skipped), the fourth input has no name
      (skipped), and the submitter `<button name="view" value="list">` - a submit button by default - adds
      `view=list`. Check by clicking Search with the Network panel open.
    followUp: |
      How would the request change if the user ticked "Refunded only" and the form had `method="post"`?

  - id: order-submission
    type: order
    concept: html-form-submission-validation
    skill: recall
    title: The form submission algorithm, in order
    prompt: A user clicks a submit button on a form without `novalidate`. Put the browser's steps in order.
    items:
      - id: validate
        text: Interactively validate the constraints; stop and inform the user if any control is invalid
      - id: submit-event
        text: Fire the cancelable submit event at the form (scripts may call preventDefault)
      - id: entry-list
        text: Construct the entry list from the named, enabled, checked controls and the submitter (the formdata event fires here)
      - id: encode
        text: Encode the entry list using the form's enctype
      - id: navigate
        text: Send it with the form's method to the action URL - a query string for GET, a request body for POST
    hints:
      - A script that wants to cancel the submission must get the chance before any data is collected.
    solution: |
      Validate → `submit` event → entry list (`formdata` event) → encode → send. `form.submit()` enters this
      sequence at the entry-list step: no validation, no `submit` event. `form.requestSubmit()` starts at the
      top, like a click.

  - id: label-debug
    type: debug
    concept: html-labelled-controls
    skill: analysis
    title: The locator that can't find the field
    prompt: |
      This Playwright locator fails with "element not found":

      ```typescript
      await page.getByLabel('Postcode').fill('560001');
      ```

      The DevTools Accessibility pane shows the postcode input with an **empty** name. Click the line
      responsible.
    language: html
    code: |
      <fieldset>
        <legend>Delivery address</legend>
        <label for="street">Street</label>
        <input id="street" name="street" autocomplete="street-address" />
        <label for="post-code">Postcode</label>
        <input id="postcode" name="postcode" autocomplete="postal-code" />
        <label for="city">City</label>
        <input id="city" name="city" autocomplete="address-level2" />
      </fieldset>
    correctLines: [5]
    lineNotes:
      - line: 6
        note: The input itself is fine - its id is "postcode". The label's for attribute must match that exact id, and it doesn't.
      - line: 2
        note: The legend names the group, not the individual fields.
    hints:
      - A label is linked to the element whose id equals its for attribute.
      - Compare the strings character by character.
    solution: |
      **Line 5.** `for="post-code"` does not match `id="postcode"`, so the label has no labeled control and the
      input has no accessible name. Fix the `for` (or the `id`). The failing locator was a **true** finding:
      screen-reader users had the same problem. Re-check in the Accessibility pane - the computed name
      should now read "Postcode".
    followUp: |
      Instead of changing the markup, a teammate proposes `page.locator('#postcode')`. Why is that a worse fix?

  - id: semantic-markup-choice
    type: mcq
    concept: html-semantic-structure
    skill: application
    title: Fix the outline
    prompt: |
      An order page is built like this:

      ```html
      <div class="top"><div class="links">...</div></div>
      <div class="content">
        <div class="title">Order ord_1042</div>
        <section class="row">...status badge...</section>
        <section class="row">...</section>
        <h4>Items</h4>
        ...
      </div>
      ```

      Screen-reader users report they cannot jump to the items or the main content. Which rewrite is right?
    options:
      - id: landmarks-outline
        text: "Use header and nav for the top bar, main for the content, an h1 for the order title, h2 for Items, and div for the layout rows."
        feedback: Correct - landmarks let users jump to main and nav, headings form an outline with no skipped levels, and layout rows go back to being divs.
      - id: more-sections
        text: Wrap every row in its own section, and give every div role="region".
        feedback: Unnamed sections and regions add noise, not structure. A section belongs only in the outline, with a heading.
      - id: aria-only
        text: Keep the divs and add aria-label to each one.
        feedback: aria-label on a generic div isn't a landmark or a heading, and the outline is still missing. Use the native elements.
      - id: h4-ok
        text: Only change the title div to an h4 so it matches Items.
        feedback: The page then has no h1 and still no landmarks. The outline should start at h1, and Items is a level-2 part of the page.
    correct: [landmarks-outline]
    hints:
      - Which elements create landmarks users can jump to?
      - Which heading level should the page's own title have?
    solution: |
      **Landmarks + a real outline.** `header`/`nav` for the top bar, one `main`, `h1` for "Order ord_1042",
      `h2` for Items - no skipped level - and `div` for rows that are only layout. Verify with the
      Accessibility tree: a `main` landmark, a `navigation` landmark and a heading list of h1 > h2.
    followUp: |
      The status badge area should be something users can jump to as well. What two things does a `section`
      need to become a named region?

  - id: validation-testdesign
    type: testdesign
    concept: html-form-submission-validation
    skill: application
    title: Test the merchant sign-up form's validation
    prompt: |
      Design tests for the sign-up form in the **Code** section (business name, email, password with
      minlength 12, monthly volume radios, terms checkbox, Create account and Save draft). The server at
      `/signup` is supposed to enforce the same rules. Give at least six cases with preconditions, steps,
      the expected result and the **evidence**.
    hints:
      - Cover each constraint, but also the paths that skip the browser entirely.
      - What does formnovalidate change, and what must the server do about it?
      - Where do you see what was actually sent?
    modelAnswer: |
      1. **Empty submit** - Create account with all fields empty → no request; focus on Business name with a
         message. Evidence: Network panel shows no `POST /signup`.
      2. **Invalid email** (`owner@`) → `typeMismatch`, no request. Evidence: `$0.validity.typeMismatch` is
         true in the Console.
      3. **Password of 11 characters** typed by the user → `tooShort`; 12 characters → accepted. Evidence:
         validity flags; request payload for the 12-character case.
      4. **No volume chosen** → the radio group blocks submission (`valueMissing`). Evidence: message on the
         first radio, no request.
      5. **Valid data** → `POST /signup`, body has exactly `business`, `email`, `password`, `volume`, `terms`,
         and no `intent`. Evidence: Payload tab.
      6. **Save draft with empty fields** → request sent with `intent=draft` (formnovalidate); server stores
         a draft, does **not** create an active account. Evidence: payload, response, database row status.
      7. **Bypass the browser**: `curl -X POST` with `email=not-an-email&password=short` and no terms →
         server responds with a 4xx and field errors; nothing saved. Evidence: response status and body,
         no new row.
      8. **Accessibility**: each control's computed name equals its label; the password hint is in its
         description. Evidence: Accessibility pane screenshots.
    rubric:
      - Covered at least three different constraints (required, type, minlength, radio group)
      - Checked the exact payload of a valid submission, not only "it worked"
      - Covered formnovalidate / Save draft and what the server must still enforce
      - Bypassed client validation (curl, removed attributes) and expected the server to reject
      - Named evidence for each case (Network panel, validity flags, response, database)
    solution: |
      Compare with the model answer. Cases **6 and 7** separate a strong answer from a basic one: both send
      data the browser did not validate, and only the server stands between that data and the database.
    followUp: |
      The product owner wants the password rule changed to 14 characters. Which two places must change,
      and which test catches it if only one of them is updated?

  - id: why-server-validates
    type: short
    concept: html-form-submission-validation
    skill: recall
    title: Why validate twice?
    prompt: |
      A developer says: "The email field has `type="email"` and `required`, so the API doesn't need to check
      the email." In three or four sentences, explain why that is wrong, citing what the HTML standard says.
    hints:
      - Who else can send a request to the API?
      - What does the standard's security note about constraint validation say?
    modelAnswer: |
      Client-side constraint validation runs only in a browser that implements it, for a form submitted the
      normal way. The HTML standard says servers should not rely on it: it "can be intentionally bypassed by
      hostile users, and unintentionally bypassed by users of older user agents or automated tools", and it
      is "only intended to improve the user experience, not to provide any kind of security mechanism".
      Anyone can send the request with curl, a script, `form.submit()` or an edited page. So the API must
      validate the email (and everything else) itself and return a clear 4xx error.
    rubric:
      - Says client validation can be bypassed (curl, scripts, devtools, old clients)
      - Says it exists for user experience, not security - ideally quoting the standard
      - Concludes that the server must validate and reject invalid input with a clear error
    solution: |
      Compare with the model answer. The key point is the **direction of trust**: the browser belongs to
      the user, so anything it checks can be skipped; only checks on the server are guaranteed to run.

  - id: interview-semantic-forms
    type: interview
    concept: html-labelled-controls
    skill: application
    title: "Interview: what makes a form accessible and testable?"
    prompt: |
      *"You are reviewing a pull request that adds a checkout form. What do you look for in the HTML so that
      it is accessible, works with autofill, and is easy to automate?"*
    hints:
      - Start with labels and names, then grouping, types and autocomplete.
      - Mention buttons, errors and what you would check in DevTools.
    modelAnswer: |
      First, every control has a **visible label linked programmatically** - `label for` matching the
      control's `id`, or the control inside the label - so it has an accessible name; the placeholder is
      only an example, never the label. Related controls, especially radio buttons, are in a `fieldset`
      with a `legend`. Each control has a meaningful **`name`** for the server, the right **`type`**
      (`email`, `tel`) for the phone keyboard and built-in checks, and an **`autocomplete`** token such as
      `email` or `cc-name` so autofill works.

      Buttons are real `<button>` elements with an explicit `type` - `submit` for the action, `button` for
      the rest - so Enter submits the right thing. Constraints like `required` and `maxlength` match the
      server's rules, and error messages are tied to their fields with `aria-describedby`, with a live
      region or focus management so they are announced. The page has one `main` and a sensible heading
      outline.

      To check, I tab through it with the keyboard, read the computed names in the DevTools Accessibility
      pane, and submit with the Network panel open to see the exact payload. For automation, if I can
      locate every field with `getByLabel` and every button with `getByRole`, the form is usually also
      accessible - and the tests won't break when the CSS changes. Finally, I make sure the server rejects
      invalid data sent directly, because the browser's validation is only UX.
    rubric:
      - Labels linked with for/id or wrapping; placeholder is not a label
      - fieldset and legend for groups such as radio buttons
      - name, type and autocomplete chosen deliberately
      - Buttons with explicit types; Enter-to-submit considered
      - Errors associated with fields and announced
      - Connects accessible names to role/label locators in automation
      - Says the server must validate too
    solution: |
      Compare with the model answer. A strong answer connects three audiences to the same markup -
      assistive technology, autofill and test automation - and ends with the server, because markup alone
      never makes a form safe.
    followUps:
      - "Why is `getByRole('button', { name: 'Pay' })` a better locator than a CSS class - and when is a `data-testid` still the right choice?"
      - "The design calls for a custom dropdown built from divs. What do you ask for?"
      - "How would you test that error messages are announced to screen-reader users?"

placement:
  - id: place-outline
    type: mcq
    concept: html-semantic-structure
    skill: application
    title: Which page structure is correct?
    prompt: Which markup gives a page a correct outline and a main landmark?
    options:
      - id: correct
        text: "<main> with <h1>Refunds</h1>, then <section aria-labelledby=\"open\"><h2 id=\"open\">Open refunds</h2>...</section>"
        feedback: Correct - one main, an h1, and a named section with an h2 that becomes a region.
      - id: skip
        text: "<main> with <h1>Refunds</h1>, then <h3>Open refunds</h3>"
        feedback: Going from h1 straight to h3 skips a level, which the standard says is non-conforming.
      - id: div-main
        text: "<div class=\"main\"> with <h1>Refunds</h1> and <h2>Open refunds</h2>"
        feedback: A class name has no meaning to the browser or assistive technology. A div with class main is not a main landmark.
      - id: two-main
        text: "Two visible <main> elements, one for each half of the page, each with an h1"
        feedback: A document must not have more than one main element without the hidden attribute.
    correct: [correct]
    solution: |
      One visible `main`, an `h1`, no skipped heading levels, and `section` only with a heading - named with
      `aria-labelledby` so it is exposed as a region.

  - id: place-label
    type: mcq
    concept: html-labelled-controls
    skill: application
    title: Which input has an accessible name?
    prompt: Which of these gives the input a proper label?
    options:
      - id: for-id
        text: "<label for=\"iban\">IBAN</label> <input id=\"iban\" name=\"iban\" />"
        feedback: Correct - the label's for attribute matches the input's id, so the label is its caption.
      - id: placeholder
        text: "<input name=\"iban\" placeholder=\"IBAN\" />"
        feedback: The standard says the placeholder should not be used as an alternative to a label - it vanishes when typing and is not a reliable name.
      - id: for-name
        text: "<label for=\"iban\">IBAN</label> <input name=\"iban\" />"
        feedback: for refers to an element's id, not its name. This input has no id, so the label is attached to nothing.
      - id: adjacent
        text: "<span>IBAN</span> <input name=\"iban\" />"
        feedback: Text next to an input is not linked to it - the browser has no way to know they belong together.
    correct: [for-id]
    solution: |
      A label is linked with `for` = the control's **id** (or by wrapping the control). `name` is for the
      server; a placeholder or nearby text is not a label.

  - id: place-submit
    type: mcq
    concept: html-form-submission-validation
    skill: analysis
    title: Why was no validation shown?
    prompt: |
      A form has `<input name="amount" type="number" min="1" required>`. A script runs
      `document.querySelector('form').submit()` when the user presses a custom Pay link. The amount was
      empty, yet the request was sent. Why?
    options:
      - id: submit-bypasses
        text: form.submit() bypasses interactive constraint validation and does not fire the submit event; requestSubmit() would have validated.
        feedback: Correct - submit() enters the algorithm after validation and the submit event.
      - id: number-type
        text: type="number" disables the required attribute.
        feedback: required applies to number inputs - an empty number field has valueMissing.
      - id: link
        text: Links can't run validation, only buttons can.
        feedback: The element the user clicked doesn't matter here; the method the script called does.
      - id: browser-bug
        text: It is a browser bug - validation should always run.
        feedback: It is specified behaviour - the HTML standard says submit() bypasses interactive constraint validation.
    correct: [submit-bypasses]
    solution: |
      `form.submit()` skips validation and the `submit` event. Use `form.requestSubmit()` (or a real submit
      button) - and validate on the server either way.

recall:
  - id: recall-section-region
    concept: html-semantic-structure
    prompt: When is a section element exposed as a region landmark?
    answer: Only when it has an accessible name, for example aria-labelledby pointing at its heading. Otherwise it is generic.
  - id: recall-heading-rule
    concept: html-semantic-structure
    prompt: What is the rule for heading levels in the HTML standard?
    answer: Each heading must be at the same level, a higher level, or at most one level deeper than the previous heading; at least one heading should be an h1.
  - id: recall-label-link
    concept: html-labelled-controls
    prompt: What are the two ways to link a label to its control?
    answer: The label's for attribute equal to the control's id, or the control placed inside the label.
  - id: recall-autocomplete
    concept: html-labelled-controls
    prompt: Which autocomplete tokens belong on a sign-up password field and on a sign-in password field?
    answer: new-password on sign-up (so managers offer to generate one) and current-password on sign-in.
  - id: recall-not-sent
    concept: html-form-submission-validation
    prompt: Which controls are left out of a submitted form's data?
    answer: Disabled controls, controls without a name, unchecked checkboxes and radio buttons, controls inside a datalist, and buttons other than the submitter.
  - id: recall-defaults
    concept: html-form-submission-validation
    prompt: What are the defaults for a form's method and enctype, and for a button's type inside a form?
    answer: Method GET, enctype application/x-www-form-urlencoded, and a button with no type is a submit button.
  - id: recall-submit-vs-request
    concept: html-form-submission-validation
    prompt: What is the difference between form.submit() and form.requestSubmit()?
    answer: submit() skips constraint validation and the submit event; requestSubmit() behaves like clicking a submit button, with both.
  - id: recall-client-validation
    concept: html-form-submission-validation
    prompt: What does the HTML standard say client-side validation is for?
    answer: Only to improve the user experience - not a security mechanism; servers should not rely on it.

