    continuous delivery,
    continuous deployment,
    deployment pipeline,
    github actions,
    workflow,
    jobs,
    needs,
    matrix,
    concurrency,
    timeout-minutes,
    dependency caching,
    actions/cache,
    setup-node,
    artifacts,
    build once,
    promotion,
    environments,
    deployment protection rules,
    required reviewers,
    GITHUB_TOKEN,
    permissions,
    least privilege,
    pinning actions,
    commit SHA,
    actions.lock,
    script injection,
    pull_request_target,
    cache poisoning,
    OIDC,
    DORA metrics,
  ]

environment: |
  - **Runtime and tools:** **Node.js 24** (v24.21.0, from this repository's `.nvmrc`), npm 11.19.0,
    TypeScript 6.0 and **Vitest 5.0.3** with the `yaml` 2.9.1 parser - the versions pinned in
    `practice/fullstack`. The audit output in this lesson is the real output of the reference solution of the
    practice exercise run against this repository's own workflow on 14 November 2026.
  - **Worked example and real run data:** this repository's workflow
    [`.github/workflows/pages.yml`](https://github.com/LokiD-SE/LearnerApp/blob/main/.github/workflows/pages.yml)
    (jobs `check`, `practice`, `deploy`; `actions/checkout@v4`, `setup-node@v4`, `setup-java@v4`,
    `upload-artifact@v4`, `upload-pages-artifact@v3`, `deploy-pages@v4`). Run, job and step timings come from
    the public REST API, `https://api.github.com/repos/LokiD-SE/LearnerApp/actions/runs` and
    `.../actions/runs/<id>/jobs`, read on 14 November 2026: run 43570568369 (commit 14f5919, success) and run
    38203570623 (commit 3ab6d17, the repository's only failed run of 21). No Actions log text is quoted -
    only the API's step names, conclusions and timestamps.
  - **Action versions and SHAs:** resolved with the GitHub REST API on 14 November 2026 - the `v4` tag of
    `actions/checkout` pointed at commit `11d5960a326750d5838078e36cf38b85af677262` and the `v4` tag of
    `actions/setup-node` at `49933ea5288caeca8642d1e84afbd3f7d6820020`; the latest releases were
    `actions/checkout` v7.0.1 and `actions/setup-node` v7.1.0. Tags move - resolve them yourself before
    pinning.
  - **GitHub Actions documentation (checked November 2026):** [Workflow
    syntax](https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax) (`permissions`
    - unspecified scopes become `none`; `concurrency` and `queue`; `jobs.<job_id>.needs`;
    `jobs.<job_id>.timeout-minutes` default 360; `strategy.fail-fast` default `true`; a matrix makes at most
    256 jobs; job `outputs` at most 1 MB per job; `paths` filters and the "Pending" check they leave);
    [Contexts reference](https://docs.github.com/en/actions/reference/workflows-and-actions/contexts)
    (`needs.<job_id>.result` is `success`, `failure`, `cancelled` or `skipped`);
    [Expressions](https://docs.github.com/en/actions/reference/workflows-and-actions/expressions) (status
    check functions, `success()` by default, `!cancelled()` over `always()`); [Dependency
    caching](https://docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching) (key and
    `restore-keys` matching, branch scope, cache poisoning and which triggers may write the default branch's
    caches, 7-day eviction, 10 GB default per repository); [Workflow
    artifacts](https://docs.github.com/en/actions/concepts/workflows-and-actions/workflow-artifacts) and
    [actions/upload-artifact](https://github.com/actions/upload-artifact) (90-day default retention, 1-90
    days); [actions/setup-node](https://github.com/actions/setup-node) (`cache: npm` caches the npm cache, not
    `node_modules`; `package-manager-cache`); [Deployments and
    environments](https://docs.github.com/en/actions/reference/workflows-and-actions/deployments-and-environments)
    (required reviewers, wait timer, deployment branches and tags, environment secrets, plan limits);
    [GITHUB_TOKEN](https://docs.github.com/en/actions/concepts/security/github_token); [Secure use
    reference](https://docs.github.com/en/actions/reference/security/secure-use) (least privilege, pinning to a
    full-length commit SHA, lockfiles, untrusted checkout); [Workflow dependency
    lockfiles](https://docs.github.com/en/actions/concepts/security/workflow-dependency-lockfiles)
    (`.github/workflows/actions.lock`, generated by the `gh actions-lock` CLI extension); [Script
    injections](https://docs.github.com/en/actions/concepts/security/script-injections); [Events that
    trigger workflows](https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows)
    (secrets are not passed to fork pull requests; the token is read-only there); [OpenID
    Connect](https://docs.github.com/en/actions/concepts/security/openid-connect) and its
    [reference](https://docs.github.com/en/actions/reference/security/oidc) (immutable subject claims for
    repositories created after 15 July 2026); [actions/deploy-pages](https://github.com/actions/deploy-pages)
    (needs `pages: write` and `id-token: write`); [aws-actions/configure-aws-credentials](https://github.com/aws-actions/configure-aws-credentials)
    README (v6.3.0, `role-to-assume`, `aws-region`) - named as one provider's example, not run here.
  - **Delivery practice:** Martin Fowler, [Continuous
    Delivery](https://martinfowler.com/bliki/ContinuousDelivery.html) (30 May 2013), which separates
    continuous delivery from continuous deployment; Jez Humble and David Farley, *Continuous Delivery*
    (Addison-Wesley, 2010) - the deployment pipeline and "only build your binaries once"; DORA, [DORA's
    software delivery performance metrics](https://dora.dev/guides/dora-metrics/) (change lead time,
    deployment frequency, failed deployment recovery time, change fail rate, deployment rework rate).
  - **Platform-specific, labelled:** everything about syntax, tokens, caches and environments is **GitHub
    Actions**. GitLab CI, Jenkins, CircleCI and Azure Pipelines have the same ideas (jobs, stages, caches,
    artifacts, protected environments, OIDC) under other names - check their documentation. Several
    environment features (required reviewers, wait timers, environment secrets) are available on private
    repositories only on paid plans; GitHub's defaults change, so check the current documentation before
    quoting one.
  - **Opinion, labelled:** "build once, promote", change freezes and which checks block a deploy are team
    policy and practitioner advice (Humble and Farley, Fowler), not standards.
  - **Fictional:** SandPay, its merchant dashboard, `sandpay-preview` and the `SANDPAY_*` secret names. No real
    credentials appear anywhere.
  - **Not repeated here:** test stages, required status checks and branch protection ([CI pipelines and
    quality gates](#/lesson/ci-quality-gates)), which tests run where ([Testing a full stack
    app](#/lesson/fullstack-testing-strategy)), images ([Containers with Docker and
    Compose](#/lesson/docker-and-compose)) and runtime configuration, health checks and zero-downtime releases
    ([Deployment, configuration and environments](#/lesson/deployment-and-configuration)).

