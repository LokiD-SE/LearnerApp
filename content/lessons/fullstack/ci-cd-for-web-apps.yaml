id: ci-cd-for-web-apps
title: CI/CD for web applications
subject: fullstack
module: quality-and-delivery
level: intermediate
status: published
estimatedMinutes: 75
summary: The developer's side of a pipeline for a React, Express and PostgreSQL app - continuous integration, delivery and deployment as Fowler defines them, a GitHub Actions workflow that tests, builds once and promotes the same artifact through environments, dependency caching versus artifacts, deployment protection rules, and the hardening that keeps a workflow from becoming the easiest way into production (least-privilege GITHUB_TOKEN, pinned actions and lockfiles, script injection, pull_request_target, OIDC instead of stored cloud keys). Every timing and finding shown is real.
