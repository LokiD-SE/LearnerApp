id: passwords-oauth-and-oidc
title: Password storage, OAuth 2.0 and OpenID Connect
subject: fullstack
module: security-auth
level: advanced
status: published
estimatedMinutes: 80
summary: Store passwords so that a stolen database stays useless - a slow, salted, memory-hard function with parameters you can raise - follow NIST's current rules for what to ask of users, and sign people in through an identity provider with the OAuth 2.0 authorization code flow, PKCE and a properly validated OpenID Connect ID token. Every hash, URL and error shown here came from a real run.
