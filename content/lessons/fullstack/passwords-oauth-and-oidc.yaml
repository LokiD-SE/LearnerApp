    RFC 7636,
    RFC 9700,
    jose,
    single sign-on,
  ]

environment: |
  - **Runtime and libraries:** **Node.js 24** (v24.21.0, from this repository's `.nvmrc`) and its built-in
    `node:crypto` (`scrypt`, `argon2`, `randomBytes`, `timingSafeEqual`, `createHash`), and **jose 6.2.14** for
    JSON Web Tokens and key sets - the versions pinned in `practice/fullstack`. Every hash string, timing, URL
    and error message in this lesson came from running the code on Linux (Intel Core Ultra 5 135U) in
    November 2026. Timings depend on the machine; measure on yours.
  - **Password storage:** the OWASP
    [Password Storage Cheat Sheet](https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html)
    (last changed 30 October 2026 when read) - the parameter recommendations quoted here are its exact
    wording; and the OWASP
    [Authentication Cheat Sheet](https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html)
    (generic error messages, safe comparison, account lockout).
  - **What to ask of users:** **NIST SP 800-63B-4**,
    [Digital Identity Guidelines: Authentication and Authenticator Management](https://pages.nist.gov/800-63-4/sp800-63b.html),
    final, published July 2025, superseding SP 800-63B - section 3.1.1.2 *Password Verifiers* (15 characters
    minimum for single-factor passwords, 8 with MFA, at least 64 allowed, no composition rules, no periodic
    changes, blocklist checks, password managers and paste allowed) and section 3.2.2 *Rate Limiting*. It is a
    US federal guideline that much of the industry follows; your regulator may say more.
  - **OAuth 2.0:** **RFC 6749** (the framework - roles 1.1, authorization code grant 4.1, implicit 4.2,
    resource owner password credentials 4.3), **RFC 7636** (PKCE - code verifier 4.1, S256 challenge 4.2, the
    worked example in Appendix B, reproduced by this lesson's tests), **RFC 9700** (January 2025, *Best
    Current Practice for OAuth 2.0 Security*, BCP 240 - sections 2.1, 2.1.1, 2.1.2 and 2.4) and **RFC 9207**
    (the `iss` authorization response parameter). All at [rfc-editor.org](https://www.rfc-editor.org/).
  - **OpenID Connect:** [OpenID Connect Core 1.0](https://openid.net/specs/openid-connect-core-1_0.html)
    (incorporating errata set 2) - section 3.1.3.7 *ID Token Validation* and section 5.7 *Claim Stability
    and Uniqueness*; [OpenID Connect Discovery 1.0](https://openid.net/specs/openid-connect-discovery-1_0.html)
    (`/.well-known/openid-configuration`, `issuer`, `jwks_uri`).
  - **Passkeys:** [Web Authentication Level 3](https://www.w3.org/TR/webauthn-3/), a W3C Recommendation
    (25 August 2026) - mentioned as a pointer only.
  - **Node.js docs:** [crypto](https://nodejs.org/docs/latest-v24.x/api/crypto.html) - `scrypt` options and
    the `maxmem` default (32 MiB), `timingSafeEqual`, and `crypto.argon2` (added in v24.7.0).
    [jose](https://github.com/panva/jose) - `jwtVerify`, `createRemoteJWKSet`, `createLocalJWKSet`.
  - **Related lessons:** Track C's [Authentication and authorization for API testers](#/lesson/authentication-and-authorization)
    covers access tokens, JWT claims and 401 versus 403 from the tester's side; this lesson doesn't repeat it.
    Sessions and cookies after sign-in are in [Sessions, cookies and tokens](#/lesson/sessions-cookies-and-tokens).
  - **Fictional:** SandPay ID (`https://id.sandpay.example`), the merchant dashboard client, every user,
    password, key and token. The example passwords are the textbook "correct horse battery staple" - never a
    real one.

prerequisites:
  - sessions-cookies-and-tokens
  - authentication-and-authorization
  - node-runtime-and-npm

concepts:
  - id: password-hashing-kdf
    name: Storing passwords with a slow, salted password hashing function
    summary: Never store or encrypt passwords - store the output of a deliberately slow, memory-hard function (Argon2id, then scrypt; bcrypt for legacy; PBKDF2 where FIPS-140 is required) with a unique random salt per password and the parameters in the stored string, so you can verify in constant time and raise the cost later. A fast hash such as SHA-256 lets a thief try hundreds of thousands of guesses per second per core.
  - id: password-rules-and-throttling
    name: Password rules, throttling and generic errors
    summary: Following NIST SP 800-63B-4 - require length (15 characters for a password used alone, 8 with MFA), allow at least 64 and any characters, check new passwords against a blocklist of common and breached ones, and impose no composition rules or periodic changes; limit failed attempts per account, give the same generic error whatever went wrong, and offer MFA or passkeys.
  - id: oauth-code-flow-pkce
    name: The OAuth 2.0 authorization code flow with PKCE
    summary: The browser goes to the provider with response_type=code, the exact registered redirect URI, a state and a PKCE S256 code_challenge; the provider sends back a one-time code; the client's server exchanges it, with the code_verifier, for tokens. RFC 9700 makes PKCE the default for all clients and says the implicit grant should not be used and the password grant must not.
  - id: oidc-id-token-validation
    name: OpenID Connect and ID token validation
    summary: OpenID Connect adds authentication to OAuth - the openid scope returns an ID token, a signed JWT about the sign-in. The client must check the signature with the issuer's published keys and an allowed algorithm, iss exactly, aud containing only trusted clients, exp, and the nonce it sent - and must identify the user by iss plus sub, never by email.

objectives:
  - Explain why passwords are hashed with a slow, salted, memory-hard function instead of encrypted or hashed with SHA-256, and choose parameters from the OWASP recommendations.
  - Write password hashing and verification in Node.js with a self-describing format, constant-time comparison and a rehash-on-login upgrade path.
  - Apply NIST SP 800-63B-4's password rules and design throttling and generic error responses that resist guessing and user enumeration.
  - Trace the OAuth 2.0 authorization code flow with PKCE, and explain what state, nonce, PKCE and exact redirect URI matching each prevent.
  - Validate an OpenID Connect ID token step by step, and identify users by issuer and subject.
  - Design tests that prove a login and a sign-in callback reject what they must.

sections:
  - id: intuition
    kind: intuition
    concepts: [password-hashing-kdf, oauth-code-flow-pkce]
    title: The idea in plain language
    body: |
      **Passwords are like fingerprints at a club door.** The club doesn't keep a copy of each member's key -
      it keeps a smudge that only that member's finger makes, and checks whether the finger at the door makes
      the same smudge. If a burglar steals the smudge book, they still don't have anyone's finger. A good
      smudge book has two extra properties: each member's smudge is made on **a different kind of paper** (the
      salt), so the burglar can't compare one prepared stack of fakes against everyone at once, and making a
      smudge takes **a long, deliberate press** (the work factor), so trying millions of fake fingers takes
      years instead of minutes.

      **Signing in with a provider is like a hotel concierge and a valet ticket.** You don't hand your house
      keys to the restaurant; you show your ID **at the hotel desk** (the identity provider), which gives the
      restaurant a **ticket stub** (the authorization code) that only works together with the half you kept
      in your pocket (the PKCE verifier). The restaurant then gets, straight from the desk, **a signed note**:
      "this is guest 8f2c, checked in just now, for the restaurant" - the ID token. The restaurant must check
      the desk's signature, that the note is for **it**, that it is fresh, and that it answers **the request
      it made** - not a note someone found on the floor.

  - id: what
    kind: what
    concepts: [password-hashing-kdf, password-rules-and-throttling, oauth-code-flow-pkce, oidc-id-token-validation]
    title: The vocabulary
    body: |
      | Term | Meaning |
      | --- | --- |
      | **Password hashing function** (KDF) | A deliberately slow one-way function: password + salt + cost parameters → a fixed-size value. Argon2id, scrypt, bcrypt, PBKDF2. Not SHA-256 or MD5, which are designed to be **fast**. |
      | **Salt** | Random bytes, unique per password, stored next to the hash. Makes identical passwords hash differently and makes precomputed tables useless. Not secret. |
      | **Work factor / cost parameters** | How much time and memory one hash costs - Argon2id's memory `m`, passes `t`, lanes `p`; scrypt's `N`, `r`, `p`; bcrypt's cost; PBKDF2's iterations. Stored with the hash so they can be raised later. |
      | **Pepper** | An optional secret added to every hash, stored **outside** the database (a secrets manager or HSM). Defence in depth only. |
      | **Constant-time comparison** | Comparing secrets in a time that doesn't depend on where they first differ (`crypto.timingSafeEqual`). |
      | **Credential stuffing** | Trying username and password pairs leaked from other sites. |
      | **OAuth 2.0** | A framework for **delegated authorization**: a client gets an access token to call an API on a user's behalf (RFC 6749). It doesn't tell the client who the user is. |
      | **OpenID Connect** (OIDC) | An identity layer on top of OAuth 2.0: asking for the `openid` scope returns an **ID token** about the sign-in. |
      | **Roles** | **Resource owner** (the user), **client** (your app), **authorization server** / **OpenID Provider** (SandPay ID, Google, Entra ID, Okta, Keycloak...), **resource server** (an API). |
      | **Authorization code** | A short-lived, one-time code returned to the redirect URI, exchanged by the client for tokens. |
      | **PKCE** | Proof Key for Code Exchange (RFC 7636): a random `code_verifier` kept by the client, its hash `code_challenge` sent first, the verifier sent with the code. |
      | **state** | A random value bound to the user's browser, returned unchanged - lets the client reject callbacks it didn't start. |
      | **nonce** | A random value the client sends; the provider copies it into the ID token - ties the token to this sign-in. |
      | **ID token** | A signed JWT with `iss`, `sub`, `aud`, `exp`, `iat`, `nonce` and more. |
      | **JWKS** | JSON Web Key Set: the provider's public signing keys, at the `jwks_uri` named in its discovery document. |

  - id: why
    kind: why
    concepts: [password-hashing-kdf, password-rules-and-throttling, oidc-id-token-validation]
    title: Why this goes wrong so often
    body: |
      **Databases leak.** A backup in the wrong bucket, an SQL injection, a former employee - when the users
      table leaves the building, how the passwords were stored decides whether the damage is a password
      reset or a takeover of your users' email, bank and work accounts, because people reuse passwords.

      - **Plain text or encryption** - whoever gets the database (or the key, which usually sits next to it)
        gets every password. OWASP: passwords "should be securely hashed ... rather than encrypted or stored
        in plaintext".
      - **A fast hash** - on the machine used for this lesson, one plain JavaScript loop computed **315,463
        SHA-256 hashes in one second on one core**; one scrypt hash with OWASP's parameters took **611 ms**.
        That is roughly 190,000 times more work per guess - before counting GPUs, which make the fast hash's
        side of the comparison far worse.
      - **No salt** - every user with the same password has the same hash, so one guess cracks all of them,
        and precomputed tables work.

      **Rules that annoy users make passwords weaker.** Composition rules ("one capital, one digit, one
      symbol") and forced changes every 90 days push people to `Password1!` and `Password2!`. NIST SP
      800-63B-4 now says verifiers "SHALL NOT impose other composition rules" and "SHALL NOT require
      subscribers to change passwords periodically" - length, a blocklist and throttling work better.

      **Sign-in through a provider is easy to get subtly wrong.** The flow involves redirects through the
      user's browser, which an attacker can watch or drive. Skip one check - state, PKCE, the redirect URI,
      the ID token's audience or nonce - and the attacker can sign a victim into the attacker's account, or
      sign themselves into the victim's. Most failures in OAuth deployments are missing checks, not broken
      cryptography.

  - id: password-internals
    kind: internals
    concepts: [password-hashing-kdf]
    title: What to use, with OWASP's parameters
    body: |
      The OWASP Password Storage Cheat Sheet's summary, quoted exactly:

      - "**Use Argon2id with a minimum configuration of 19 MiB of memory, an iteration count of 2, and 1
        degree of parallelism.**"
      - "**If Argon2id is not available, use scrypt with a minimum CPU/memory cost parameter of (2^17), a
        minimum block size of 8 (1024 bytes), and a parallelization parameter of 1.**"
      - "**For legacy systems using bcrypt, use a work factor of 10 or more and with a password limit of 72
        bytes.**"
      - "**If FIPS-140 compliance is required, use PBKDF2 with a work factor of 600,000 or more and set with
        an internal hash function of HMAC-SHA-256.**"
      - "**Consider using a pepper to provide additional defense in depth (though alone, it provides no
        additional secure characteristics).**"

      The cheat sheet also lists equivalent trade-offs (for scrypt, for example, `N=2^16, r=8, p=2` or
      `N=2^15, r=8, p=3`), and says "As a general rule, calculating a hash should take less than one second" -
      benchmark on your production hardware.

      **Why memory-hard?** Argon2id and scrypt need a lot of memory per guess. GPUs and custom chips are good at
      running many small computations in parallel; making each guess need tens of megabytes is what makes them
      expensive. bcrypt isn't memory-hard and only reads the first 72 bytes; PBKDF2 is neither, which is why its
      iteration count is so high.

      **Upgrading.** Store the algorithm and parameters **in the hash string**. When a user logs in successfully
      with a hash made with weaker parameters (or an older algorithm), you have the plain password in memory for
      a moment: hash it again with today's parameters and save it. OWASP calls this the most common approach -
      and notes that hashes of users who never log in again stay weak unless you expire them and force a reset.

      **In Node.js 24:** `crypto.scrypt` has been available for years, and `crypto.argon2` (Argon2id among
      others) was **added in v24.7.0** - check `process.version` before relying on it, or use scrypt, as this
      lesson's exercise does. Both run on libuv's thread pool, so the event loop keeps serving requests while a
      hash is computed ([The Node.js runtime](#/lesson/node-runtime-and-npm)).

  - id: password-code
    kind: code
    concepts: [password-hashing-kdf]
    title: Hashing and verifying in Node.js
    body: |
      The reference solution's format is `scrypt$N=<N>,r=<r>,p=<p>$<salt>$<hash>` with base64url salt and
      hash - one string that says how it was made. Output from a real run:

      ```plaintext
      scrypt$N=131072,r=8,p=1$GvnouHhwN4GwNZamSERZQw$Nu4VREth1uQZ4S23P1pzI4a1xHWq4aQu5LcFNGcOxQ8
      right password: true
      wrong password: false
      needsRehash (current params): false
      scrypt$N=16384,r=8,p=1 -> needsRehash: true
      ```

      The heart of it:

      ```typescript
      import { randomBytes, scrypt, timingSafeEqual } from 'node:crypto';

      export const OWASP_SCRYPT = { N: 2 ** 17, r: 8, p: 1 };

      function derive(password: string, salt: Buffer, params: typeof OWASP_SCRYPT, keyBytes: number) {
        const maxmem = 256 * params.N * params.r; // Node's default limit is 32 MiB
        return new Promise<Buffer>((resolve, reject) => {
          scrypt(password.normalize('NFC'), salt, keyBytes, { ...params, maxmem }, (error, key) =>
            error ? reject(error) : resolve(key),
          );
        });
      }

      export async function hashPassword(password: string, params = OWASP_SCRYPT) {
        const salt = randomBytes(16);
        const key = await derive(password, salt, params, 32);
        return `scrypt$N=${params.N},r=${params.r},p=${params.p}$${salt.toString('base64url')}$${key.toString('base64url')}`;
      }

      // verifyPassword: parse the string, derive with the STORED salt and parameters,
      // then: return timingSafeEqual(candidate, storedKey);
      ```

      **The `maxmem` trap**, from a real run without it:

      ```plaintext
      default maxmem: ERR_CRYPTO_INVALID_SCRYPT_PARAMS - Invalid scrypt params: error:030000AC:digital envelope routines::memory limit exceeded
      ```

      Node's docs: "It is an error when (approximately) `128 * N * r > maxmem`. **Default:** `32 * 1024 * 1024`."
      OWASP's `N=2^17, r=8` needs 128 MiB, so you must raise `maxmem` - and plan the server's memory: every
      concurrent login uses that much.

      **Argon2id in Node 24.7+** (illustrative of the API; it ran in 89 ms here with OWASP's 19 MiB / 2 passes):

      ```typescript
      import { argon2Sync, randomBytes } from 'node:crypto';
      const tag = argon2Sync('argon2id', {
        message: 'correct horse battery staple',
        nonce: randomBytes(16), // the salt
        parallelism: 1,
        tagLength: 32,
        memory: 19456, // KiB
        passes: 2,
      });
      ```

      In a real server use the asynchronous `argon2` (callback) form, for the same reason as `scrypt`.

  - id: line-by-line
    kind: line-by-line
    concepts: [password-hashing-kdf]
    title: Why the important lines are written that way
    body: |
      - **`randomBytes(16)` per hash** - a unique salt from a cryptographically secure generator. The Node.js
        docs for `scrypt`: "It is recommended that a salt is random and at least 16 bytes long."
      - **The parameters in the string** - `verifyPassword` uses the stored `N`, `r`, `p`, not today's
        defaults, so old hashes keep working while new ones get stronger, and `needsRehash` can spot them.
      - **`password.normalize('NFC')`** - the same visible password typed on two keyboards can be different
        Unicode code point sequences; normalising first makes them hash the same. NIST SP 800-63B-4: "the
        verifier SHOULD apply the normalization process for stabilized strings using the Normalization Form
        Canonical Composition (NFC)", before hashing.
      - **Async `scrypt`, not `scryptSync`** - 600 ms of `scryptSync` would freeze every other request on the
        server. The exercise's test proves it: a 0 ms timer must run while the hash is being computed.
      - **`timingSafeEqual`** - `===` on strings or buffers can stop at the first different byte, so the time
        taken leaks how much matched. Node's docs: it "does not leak timing information". It **throws** if the
        lengths differ, so check the length first and return `false`.
      - **Never throw for bad input in `verifyPassword`** - a malformed or tampered row is "not a match", not a
        500 that tells an attacker something interesting.
      - **A maximum length** - OWASP's safe comparison advice includes "a maximum input length, to protect
        against denial of service attacks with very long inputs". Choose a generous one (1024 here); NIST says
        allow **at least 64**.

  - id: rules-and-throttling
    kind: when
    concepts: [password-rules-and-throttling]
    title: What to ask of users, and how to stop guessing
    body: |
      **NIST SP 800-63B-4, section 3.1.1.2 (Password Verifiers)** - selected requirements, quoted:

      - "Verifiers and CSPs SHALL require passwords that are used as a single-factor authentication mechanism
        to be a minimum of 15 characters in length." With MFA, they "MAY allow passwords ... to be shorter but
        SHALL require them to be a minimum of eight characters".
      - "SHOULD permit a maximum password length of at least 64 characters", accept all printing ASCII and
        space, and Unicode, each code point counting as one character.
      - "SHALL NOT impose other composition rules (e.g., requiring mixtures of different character types)".
      - "SHALL NOT require subscribers to change passwords periodically" - but "SHALL force a change if there
        is evidence that the authenticator has been compromised".
      - New passwords are compared "against a blocklist that contains known commonly used, expected, or
        compromised passwords. The entire password SHALL be subject to comparison".
      - "SHALL allow the use of password managers and autofill functionality" and "SHOULD permit claimants to
        use the 'paste' function".
      - "Passwords SHALL be salted and hashed using a suitable password hashing scheme."

      **Throttling (section 3.2.2).** Verifiers must limit failed attempts **per account**: unless an
      authenticator's own rules say otherwise, "no more than 100" consecutive failures "using a specific
      authenticator on a single subscriber account", after which that authenticator is disabled; "The limit of
      100 attempts is an upper bound, and agencies MAY impose lower limits." Techniques to
      avoid locking out the real user include bot challenges and delays that grow after each failure. The
      OWASP Authentication Cheat Sheet adds: tie the counter "to the account itself, rather than the source IP
      address", consider exponential lockout, and make sure lockout can't be used to deny service to others.

      **Generic errors.** OWASP: respond with a generic message whether "the user ID or password was
      incorrect", "the account does not exist" or "the account is locked or disabled" - "Login failed; Invalid
      user ID or password." The **time** must not differ either: if unknown users return before hashing, the
      response time reveals which emails have accounts. Hash anyway (against a dummy hash) for unknown users.

      **Better than passwords alone.** Offer **MFA**, and **passkeys** - public-key credentials from the Web
      Authentication standard (W3C WebAuthn Level 3, a Recommendation since August 2026), which are bound to
      your site's origin and so resist phishing. Building WebAuthn is its own topic; use a maintained library
      or your identity provider.

  - id: visual
    kind: visual
    concepts: [oauth-code-flow-pkce, oidc-id-token-validation]
    title: The authorization code flow with PKCE and OpenID Connect
    body: |
      Notice that **tokens never pass through the browser's address bar** - only the one-time code does - and
      that the code is useless without the verifier, which never left the dashboard's server.

      ```mermaid
      sequenceDiagram
        participant U as User's browser
        participant D as Dashboard server (client)
        participant P as SandPay ID (provider)
        U->>D: GET /login
        D->>D: create state, nonce, PKCE verifier and challenge, keep them in the session
        D-->>U: 302 to the authorize endpoint with code_challenge, state, nonce
        U->>P: GET /authorize (response_type code, scope openid)
        P->>U: login page, MFA, consent
        U->>P: credentials
        P-->>U: 302 to the redirect URI with code and state
        U->>D: GET /auth/callback?code&state
        D->>D: state equals the one in this session?
        D->>P: POST /token with code, redirect_uri and code_verifier
        P->>P: SHA-256 of verifier equals stored challenge?
        P-->>D: id_token, access_token
        D->>D: validate ID token - signature, iss, aud, exp, nonce
        D-->>U: set session cookie, 302 to the dashboard
      ```

  - id: oauth-internals
    kind: internals
    concepts: [oauth-code-flow-pkce]
    title: The authorization code flow, step by step
    body: |
      1. **Prepare.** The client creates three random values and keeps them **in the user's session**: a
         `state`, a `nonce` and a PKCE `code_verifier`. RFC 7636 section 4.1: 43 to 128 characters from
         `[A-Z] [a-z] [0-9] - . _ ~`; it recommends 32 random octets, base64url-encoded, which gives 43.
      2. **Challenge.** RFC 7636 section 4.2: `code_challenge = BASE64URL-ENCODE(SHA256(ASCII(code_verifier)))`
         with `code_challenge_method=S256`. "If the client is capable of using 'S256', it MUST use 'S256'."
         RFC 9700: S256 is currently the only method that doesn't expose the verifier in the request.
      3. **Authorization request.** Redirect the browser to the provider's `authorization_endpoint` with
         `response_type=code`, `client_id`, the **exact registered** `redirect_uri`, `scope=openid ...`,
         `state`, `nonce`, `code_challenge` and `code_challenge_method`.
      4. **The user authenticates at the provider** - password, MFA, passkey; your app never sees them.
      5. **Callback.** The provider redirects to the redirect URI with `code` and `state` (and, with RFC 9207,
         `iss`). The client checks `state` against the session and `iss` against the expected issuer, and
         handles `error=` responses such as `access_denied`.
      6. **Token request.** The client's **server** POSTs the `code`, `redirect_uri` and `code_verifier` (plus
         its client authentication, if confidential) to the `token_endpoint`. The provider hashes the verifier
         and compares it with the challenge it stored with the code.
      7. **Tokens.** The provider returns an `id_token` (OIDC), an `access_token` and possibly a
         `refresh_token`. Validate the ID token, then create **your own session** for the user
         ([Sessions, cookies and tokens](#/lesson/sessions-cookies-and-tokens)).

      **What each check stops:**

      | Check | Without it |
      | --- | --- |
      | **Exact redirect URI matching** (provider side, RFC 9700 2.1: "MUST utilize exact string matching") | Codes or tokens sent to an attacker-controlled URL that "starts with" yours. |
      | **state** bound to the browser | Login CSRF: an attacker makes your browser complete **their** sign-in, so you work inside the attacker's account. RFC 9700 allows relying on PKCE or the OIDC nonce for CSRF protection instead - checking state as well costs nothing. |
      | **PKCE** | A stolen or injected authorization code can be redeemed. RFC 9700 2.1.1: public clients "MUST use PKCE"; for confidential clients it is "RECOMMENDED"; authorization servers "MUST support PKCE". |
      | **nonce** in the ID token | An ID token from another sign-in replayed or injected into yours. |

      **What's out.** RFC 9700 2.1.2: clients "SHOULD NOT use the implicit grant (response type token)", which
      puts access tokens in URLs. RFC 9700 2.4: "The resource owner password credentials grant [RFC6749] MUST
      NOT be used" - it hands the user's password to the client and can't do MFA.

  - id: pkce-code
    kind: code
    concepts: [oauth-code-flow-pkce]
    title: PKCE and the authorization request in code
    body: |
      ```typescript
      import { createHash, randomBytes } from 'node:crypto';

      export function createPkcePair(random = randomBytes) {
        const verifier = random(32).toString('base64url'); // 43 characters
        const challenge = createHash('sha256').update(verifier, 'ascii').digest('base64url');
        return { verifier, challenge, method: 'S256' as const };
      }

      const url = new URL(config.authorizationEndpoint);
      url.searchParams.set('response_type', 'code');
      url.searchParams.set('client_id', config.clientId);
      url.searchParams.set('redirect_uri', config.redirectUri);
      url.searchParams.set('scope', 'openid email');
      url.searchParams.set('state', state);
      url.searchParams.set('nonce', nonce);
      url.searchParams.set('code_challenge', pkce.challenge);
      url.searchParams.set('code_challenge_method', 'S256');
      ```

      Fed RFC 7636 Appendix B's 32 octets, `createPkcePair` returns exactly the RFC's values -
      `dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk` and `E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM` - and the
      exercise's first test checks that. A real run with fresh random values produced:

      ```plaintext
      https://id.sandpay.example/authorize?response_type=code&client_id=merchant-dashboard&redirect_uri=https%3A%2F%2Fdashboard.sandpay.example%2Fauth%2Fcallback&scope=openid+email&state=ve7EDgR1XJXA7XrwLakuQw&nonce=Xo3ONkaGGbchZwZ71GILtQ&code_challenge=kFWhiCZ2eQ-Dr77o2R55olr2r4hoAvwN_w4d5Ce5d6w&code_challenge_method=S256
      ```

      `URLSearchParams` encodes every value - building the URL by string concatenation lets a `state` or
      redirect URI containing `&` add parameters of its own. The verifier is **not** in the URL; it waits in
      the session for step 6.

  - id: oidc-internals
    kind: internals
    concepts: [oidc-id-token-validation]
    title: Validating the ID token
    body: |
      OpenID Connect Core 1.0 section 3.1.3.7 lists what the client **must** check. In order:

      1. **Signature.** Verify the JWS with "the keys provided by the Issuer" - its JWK Set at the `jwks_uri`
         from discovery - and only with algorithms you expect. The spec allows skipping the signature check
         when the token came straight from the token endpoint over TLS, but checking it costs little and
         protects you if the token is ever passed around; libraries do it by default.
      2. **`iss`** "MUST exactly match" the issuer identifier - `https://id.sandpay.example` is not
         `https://id.sandpay.example/`.
      3. **`aud`** must contain your `client_id`, and the token "MUST be rejected if ... it contains additional
         audiences not trusted by the Client".
      4. **`exp`** - "The current time MUST be before the time represented by the exp Claim." Allow a small
         clock skew at most.
      5. **`nonce`** - "If a nonce value was sent in the Authentication Request, a nonce Claim MUST be present"
         and equal to it.

      **Discovery** (OpenID Connect Discovery 1.0): the provider publishes its configuration at the issuer
      plus `/.well-known/openid-configuration` - `issuer` (which "MUST be identical to the iss Claim value in
      ID Tokens"), `authorization_endpoint`, `token_endpoint`, `userinfo_endpoint`, `jwks_uri` and more. Read it
      at start-up instead of hard-coding endpoints, and let the library cache the JWK Set and refresh it when
      the provider rotates keys.

      **Who is this user?** Core section 5.7: "The sub (subject) and iss (issuer) Claims from the ID Token,
      used together, are the only Claims that an RP can rely upon as a stable identifier for the End-User."
      Key your user table on `(iss, sub)`. An **email address** can change, be reused, or be unverified at
      some providers - linking accounts by email has caused real account takeovers.

      With **jose**, the checks map to options; real results from running a token with each problem against a
      local key set:

      ```plaintext
      wrong iss -> ERR_JWT_CLAIM_VALIDATION_FAILED | unexpected "iss" claim value
      wrong aud -> ERR_JWT_CLAIM_VALIDATION_FAILED | unexpected "aud" claim value
      expired -> ERR_JWT_EXPIRED | "exp" claim timestamp check failed
      tampered -> ERR_JWS_SIGNATURE_VERIFICATION_FAILED | signature verification failed
      alg none -> ERR_JOSE_NOT_SUPPORTED | Unsupported "alg" value for a JSON Web Key Set
      HS256 vs RS256 only -> ERR_JOSE_ALG_NOT_ALLOWED | "alg" (Algorithm) Header Parameter value not allowed
      decodeJwt (no verification): user_123
      ```

      The last line is the trap: `decodeJwt` happily returns the claims of **any** token, signed or not.
      Decoding is for debugging; `jwtVerify` is for deciding.

  - id: oidc-code
    kind: code
    concepts: [oidc-id-token-validation]
    title: ID token validation with jose
    body: |
      ```typescript
      import { createRemoteJWKSet, jwtVerify } from 'jose';

      // Once, at start-up, from the discovery document:
      const keys = createRemoteJWKSet(new URL(discovery.jwks_uri));

      export async function validateIdToken(idToken: string, expectedNonce: string) {
        const { payload } = await jwtVerify(idToken, keys, {
          issuer: discovery.issuer,          // exact match
          audience: CLIENT_ID,               // must be in aud
          algorithms: ['RS256', 'ES256'],    // never 'none', never a symmetric alg you didn't agree
          requiredClaims: ['sub', 'exp', 'iat'],
        });
        const audiences = Array.isArray(payload.aud) ? payload.aud : [payload.aud];
        if (audiences.some((aud) => aud !== CLIENT_ID)) throw new Error('untrusted audience');
        if (payload.nonce !== expectedNonce) throw new Error('nonce does not match');
        return { userKey: `${payload.iss} ${payload.sub}`, claims: payload };
      }
      ```

      jose checks `exp` (and `nbf`) automatically and accepts a `clockTolerance` option. It doesn't know your
      nonce, or your rule about extra audiences - those two checks are yours.

  - id: example
    kind: example
    concepts: [password-hashing-kdf, password-rules-and-throttling, oidc-id-token-validation]
    title: "SandPay's dashboard: what the team owns even with a provider"
    body: |
      SandPay's merchant dashboard offers two ways in: "Sign in with SandPay ID" (the company's OpenID
      Provider, used by most merchants) and a password login kept for small merchants without an SSO account.

      **What the provider takes off their hands:** password storage for SSO users, MFA and passkeys, account
      recovery, breached-password checks and the sign-in UI.

      **What the dashboard team still owns:**

      - The **client side of the flow** - state, nonce and PKCE per sign-in in the session; the callback checks;
        ID token validation; keying users on `(iss, sub)`; then **their own session** with a secure cookie.
      - **Authorization** - an ID token says who the user is, not which merchant's refunds they may approve.
        Roles live in the dashboard's database (see [Track C](#/lesson/authentication-and-authorization)).
      - **The password login** - scrypt (moving to Argon2id now that the runtime supports it), a 15-character
        minimum because it is a single factor, a blocklist check on sign-up and change, per-account throttling,
        one generic error with equal timing, and an upgrade path: each successful login re-hashes old hashes.
      - **Logging** without secrets: failed logins and lockouts per account, never the password or the tokens.

      A tester on this team would check, among other things, that an unknown email and a wrong password give
      the same status, body and roughly the same time; that the callback refuses a mismatched state; that a
      token for another client (`aud: reporting-app`) is refused; and that the users table holds no hash that
      isn't in the `scrypt$` format.

  - id: tests
    kind: tests
    concepts: [password-hashing-kdf, password-rules-and-throttling, oidc-id-token-validation]
    title: Test cases for a login and a sign-in callback
    body: |
      | # | Case | Expected result | Evidence |
      | --- | --- | --- | --- |
      | 1 | Register with a 15-character passphrase containing spaces and accents | Accepted; sign-in works | 201, then 200 with a session cookie |
      | 2 | Register with `password1234567` (on the blocklist) | Rejected with a message asking for a different password | 422 with a specific problem type |
      | 3 | Register with 14 characters, password-only account | Rejected | 422 pointing at the password |
      | 4 | Inspect the stored row | `scrypt$N=131072,r=8,p=1$...`; two users with the same password have different rows | Database query |
      | 5 | Wrong password vs unknown email | Same status, same body, response times within a few percent over 20 tries | Response diff, timing samples |
      | 6 | 10 wrong passwords for one account from 10 IP addresses | Throttling applies to the account | Increasing delay or a challenge; log entries |
      | 7 | Log in with an account hashed with old parameters | Succeeds and the stored hash now has current parameters | Row before and after |
      | 8 | Paste into the password field; use a password manager | Works | Manual check |
      | 9 | Callback with a state from another browser session | Refused, no session created | 400/redirect to an error page; no Set-Cookie |
      | 10 | ID token signed by another key, with `aud` of another client, expired, or with the wrong nonce | Each refused | Error page; log line with the reason; no session |
      | 11 | Authorization request | Contains `code_challenge_method=S256`, `state`, `nonce`; no `code_verifier` | The redirect's Location header |
      | 12 | Logs after all of the above | No password, verifier, code or token appears | `grep` over the log output |

  - id: mistakes
    kind: mistakes
    concepts: [password-hashing-kdf, password-rules-and-throttling, oauth-code-flow-pkce, oidc-id-token-validation]
    title: Common mistakes and how to debug them
    body: |
      - **SHA-256 (even salted) or MD5 for passwords.** Fast hashes are for integrity, not passwords. Look for
        `createHash` near the word "password".
      - **Encrypting passwords "so support can read them".** Support should never be able to; build a reset.
      - **`scryptSync` or `argon2Sync` in a request handler.** Every login blocks the whole server. Use the
        asynchronous forms; load-test the login.
      - **Forgetting `maxmem` with OWASP's scrypt parameters** - `ERR_CRYPTO_INVALID_SCRYPT_PARAMS` at the
        first login, often only in production because tests used cheap parameters.
      - **`===` on hashes, or `timingSafeEqual` without a length check** - a timing leak, or a thrown error
        (`ERR_CRYPTO_TIMING_SAFE_EQUAL_LENGTH`) that becomes a 500.
      - **Hard-coded parameters in `verify`** - the day you raise them, every existing user is locked out.
      - **Different errors or timing for unknown users** - user enumeration.
      - **Composition rules, a short maximum length, blocked paste** - all contrary to NIST SP 800-63B-4.
      - **No state, or a state not bound to the browser** - login CSRF.
      - **Skipping PKCE "because we have a client secret"** - RFC 9700 recommends it for confidential clients
        too.
      - **`decodeJwt` instead of `jwtVerify`**, or not restricting `algorithms`.
      - **Checking `aud` with `includes` only** - accepts tokens also meant for other, untrusted clients.
      - **Users keyed by email** - account takeover through another provider's unverified email.
      - **Redirect URI with wildcards** at the provider, or an open redirect on your site - code theft.

      **Debugging a failed sign-in:** read the provider's error in the callback (`error`,
      `error_description`); decode (don't trust) the ID token at your desk to compare `iss`, `aud`, `exp` and
      `nonce` with what you expect; compare the provider's discovery `issuer` byte for byte with your
      configuration; check server clocks; and check that the session holding state, nonce and verifier
      survived the round trip (a `SameSite=Strict` session cookie, for example, is not sent on the
      provider's redirect back to you - `Lax` is).

  - id: tradeoffs
    kind: tradeoffs
    concepts: [password-hashing-kdf, oidc-id-token-validation]
    title: Trade-offs and alternatives
    body: |
      - **Cost versus capacity.** OWASP's scrypt parameters need 128 MiB and about 0.6 s per login here. Ten
        simultaneous logins need over a gigabyte. Argon2id at 19 MiB is far lighter; choose parameters from
        OWASP's list by benchmarking, and rate-limit logins anyway, since an attacker can use your login as a
        CPU-exhaustion tool.
      - **Pepper.** Adds protection if only the database leaks, but it must live elsewhere, and rotating it
        means every affected user resets their password. Worth it when you already run a secrets manager or HSM.
      - **Build or buy identity.** A provider (a managed service or self-hosted Keycloak) brings MFA, passkeys,
        recovery and audits, and costs money, a dependency and configuration you must still get right. Building
        your own password login is reasonable for a small product if you follow this lesson - but don't build
        your own OAuth **server**.
      - **Certified libraries.** Use a library certified by the OpenID Foundation for your client side - for
        Node.js, [openid-client](https://github.com/panva/openid-client) (by jose's author) states it is certified
        for the Basic, FAPI 1.0 and FAPI 2.0 Relying Party profiles. This lesson's hand-written client is for
        learning what such a library does, not for production.
      - **Token storage.** For a web app with a server, keep tokens on the server and give the browser only a
        session cookie (the "backend for frontend" pattern). Single-page apps that hold tokens in the browser
        need the extra protections RFC 9700 describes (sender-constrained or rotating refresh tokens).

  - id: summary
    kind: summary
    concepts: [password-hashing-kdf, password-rules-and-throttling, oauth-code-flow-pkce, oidc-id-token-validation]
    title: Quick reference
    body: |
      - Passwords: **Argon2id** (19 MiB, t=2, p=1) → **scrypt** (N=2^17, r=8, p=1) → bcrypt (cost ≥ 10, 72
        bytes) → PBKDF2-HMAC-SHA256 (600,000) for FIPS. Unique salt; parameters in the stored string;
        `timingSafeEqual`; async; re-hash on login.
      - NIST SP 800-63B-4: 15 characters for single-factor passwords (8 with MFA), allow ≥ 64 and paste, blocklist,
        **no composition rules, no periodic changes**, per-account throttling (≤ 100 failures).
      - One generic login error, with equal timing.
      - OAuth code flow: `response_type=code`, exact redirect URI, `state`, PKCE **S256**; exchange the code
        with the verifier on the server. No implicit grant, no password grant (RFC 9700).
      - OIDC: `scope=openid` → ID token. Check signature (issuer's JWKS, allowed algs), `iss` exactly, `aud`
        only trusted, `exp`, `nonce`. Identify users by **iss + sub**.
      - An ID token proves who signed in - your app still owns sessions and authorization.

exercises:
  - id: leaked-table
    type: mcq
    concept: password-hashing-kdf
    skill: analysis
    title: The leaked users table
    prompt: |
      A backup of SandPay's old merchant portal leaks. The `password` column holds 64 hexadecimal characters
      per user, and 312 of the 40,000 rows have **exactly the same** value. What does this tell you, and what
      is the right response?
    options:
      - id: unsalted-fast
        text: The passwords were hashed with a fast, unsalted function (probably SHA-256) - the 312 users share one common password. Force resets for everyone, invalidate sessions, and move to a salted password hashing function.
        feedback: Correct - identical values mean no per-user salt, and 64 hex characters is the size of a SHA-256 digest. One guess cracks all 312; the rest fall to fast offline guessing.
      - id: encrypted
        text: The passwords are encrypted, so they are safe as long as the key didn't leak.
        feedback: Encryption with a random IV wouldn't give identical outputs either, and encrypted passwords are only as safe as a key that usually sits next to the data. It is a hash - and a weak one.
      - id: hashed-safe
        text: They are hashed, and hashes can't be reversed, so only the 312 duplicates are at risk.
        feedback: Hashes aren't reversed - they are guessed. A fast hash allows hundreds of thousands of guesses per second per core (315,463 for SHA-256 in this lesson's run), so most human-chosen passwords will be found.
      - id: duplicates-bug
        text: Duplicate rows suggest a data bug; deduplicate the table and keep the scheme.
        feedback: The duplicates are the evidence, not the bug - different users chose the same password and the scheme made their stored values identical.
    correct: [unsalted-fast]
    hints:
      - How long is a SHA-256 digest in hexadecimal?
      - What would a unique random salt per user do to identical passwords?
    solution: |
      Identical stored values for different users can only happen without a per-user salt; 64 hex characters
      is the length of a SHA-256 digest. Treat every password as compromised: force resets, invalidate
      sessions and API keys, tell users who reused the password elsewhere, and store new passwords with
      Argon2id or scrypt and a random salt each. **Confirm** by hashing a guess such as `password1` with
      SHA-256 and searching the column for it.
    followUp: |
      The same backup also has a `password_hint` column. Why does OWASP advise against hints and knowledge-based
      questions?

  - id: login-compare
    type: debug
    concept: password-hashing-kdf
    skill: analysis
    title: The login that leaks
    prompt: |
      This login handler uses scrypt, but a security review still flags it. Click the line with the most
      serious problem.
    language: typescript
    code: |
      app.post('/login', async (req, res) => {
        const user = await users.findByEmail(req.body.email);
        if (!user) return res.status(401).json({ error: 'No account with that email' });
        const [salt, stored] = user.passwordHash.split('$');
        const candidate = await scryptAsync(req.body.password, salt, 32, OWASP_SCRYPT);
        if (!timingSafeEqual(candidate, Buffer.from(stored, 'base64url'))) {
          return res.status(401).json({ error: 'Invalid email or password' });
        }
        await sessions.start(res, user.id);
        res.json({ ok: true });
      });
    correctLines: [3]
    lineNotes:
      - line: 5
        note: Hard-coding today's parameters is a real problem for upgrades, but it doesn't help an attacker today - line 3 does.
      - line: 6
        note: timingSafeEqual is right here; a length check would be good, but both values are 32 bytes in practice.
    hints:
      - Compare what the handler says, and how fast, for an unknown email versus a known email with a wrong password.
    solution: |
      **Line 3** answers "No account with that email" - and returns **before** the 600 ms scrypt - so both the
      message and the response time tell an attacker which emails have accounts (user enumeration). Return the
      same generic error as line 7, and for unknown users run the hash against a dummy hash so the timing
      matches. Also fix line 5 to use the parameters stored in the hash. **Confirm** with a test that compares
      the status, body and median time for an unknown email and a known email with a wrong password.
    followUp: |
      The password-reset form says "We've sent you an email" only when the account exists. What should it say,
      and what should happen behind it?

  - id: password-hash
    type: coding
    concept: password-hashing-kdf
    skill: application
    title: Hash and verify passwords with scrypt
    prompt: |
      In `password-hash.ts`, the first sprint stored unsalted SHA-256. Replace it: `hashPassword` with
      `node:crypto` scrypt, a fresh 16-byte salt, a 32-byte key and the format
      `scrypt$N=<N>,r=<r>,p=<p>$<salt>$<hash>` (base64url), OWASP's parameters by default and without blocking
      the event loop; `verifyPassword` using the stored parameters, constant-time comparison and returning
      `false` - never throwing - for anything malformed; `needsRehash` for hashes weaker than the current
      parameters. Enforce the 1-1024 character length.
    project: fullstack
    files:
      - exercises/auth/password-hash.ts
    test: tests/auth/password-hash.test.ts
    command: npx vitest run tests/auth/password-hash.test.ts
    hints:
      - "`scrypt(password, salt, 32, { N, r, p, maxmem }, callback)` - wrap it in a Promise; `scryptSync` would block the event loop."
      - "With N=2^17 and r=8, Node's default maxmem (32 MiB) is too small - pass something above 128 * N * r."
      - "Parse the stored string with one regular expression; reject anything that doesn't match, or whose N isn't a power of two."
      - "`timingSafeEqual` throws on different lengths - compare lengths first and return false."
    modelAnswer: |
      ```typescript
      function derive(password: string, salt: Buffer, params: ScryptParams, keyBytes: number) {
        const maxmem = 256 * params.N * params.r;
        return new Promise<Buffer>((resolve, reject) => {
          scrypt(password.normalize('NFC'), salt, keyBytes, { ...params, maxmem }, (error, key) =>
            error ? reject(error) : resolve(key),
          );
        });
      }

      export async function hashPassword(password: string, params = OWASP_SCRYPT) {
        if (password.length === 0 || password.length > MAX_PASSWORD_LENGTH) throw new RangeError('...');
        const salt = randomBytes(16);
        const key = await derive(password, salt, params, 32);
        return `scrypt$N=${params.N},r=${params.r},p=${params.p}$${salt.toString('base64url')}$${key.toString('base64url')}`;
      }

      export async function verifyPassword(password: string, stored: string) {
        if (password.length === 0 || password.length > MAX_PASSWORD_LENGTH) return false;
        const parsed = parse(stored); // regex; N a power of two; r, p >= 1
        if (!parsed || parsed.key.length !== 32) return false;
        try {
          const candidate = await derive(password, parsed.salt, parsed.params, parsed.key.length);
          return timingSafeEqual(candidate, parsed.key);
        } catch {
          return false;
        }
      }

      export function needsRehash(stored: string, params = OWASP_SCRYPT) {
        const parsed = parse(stored);
        if (!parsed) return true;
        return parsed.params.N < params.N || parsed.params.r < params.r || parsed.params.p < params.p;
      }
      ```

      The stored string carries everything verification needs, so parameters can be raised without breaking
      old hashes. The asynchronous `scrypt` runs on the thread pool - the test's 0 ms timer proves the event
      loop stayed free. Any parsing or derivation failure is "not a match".
    rubric:
      - Every test in tests/auth/password-hash.test.ts passes.
      - Uses the asynchronous scrypt (or argon2), never a fast hash and never the Sync form in the request path.
      - Verification uses the parameters and salt from the stored string, not hard-coded ones.
      - Compares with timingSafeEqual after a length check.
      - Explains how needsRehash is used on a successful login.
    solution: |
      Async `scrypt` wrapped in a Promise with `maxmem` raised, a 16-byte salt from `randomBytes`, a
      self-describing string, verification with the stored parameters and `timingSafeEqual`, and `false` for
      anything malformed. The reference is `solutions/auth/password-hash.ts`.
    followUp: |
      Add Argon2id with Node 24.7+'s `crypto.argon2` as the new default (`argon2id$m=19456,t=2,p=1$...`), keep
      verifying scrypt hashes, and make `needsRehash` return true for every scrypt hash so users migrate as
      they log in.

  - id: password-policy
    type: mcq
    concept: password-rules-and-throttling
    skill: application
    title: Review the password policy
    prompt: |
      SandPay's product manager proposes this policy for password-only dashboard accounts. Which version follows
      NIST SP 800-63B-4?
    options:
      - id: nist
        text: At least 15 characters, up to 64 or more, any characters including spaces, checked against a list of common and breached passwords, paste allowed, no forced expiry, failed attempts limited per account.
        feedback: Correct - length, a blocklist, password-manager friendliness and throttling, with no composition rules or periodic changes.
      - id: complex
        text: At least 8 characters with an upper-case letter, a digit and a symbol, changed every 90 days.
        feedback: NIST says verifiers "SHALL NOT impose other composition rules" and "SHALL NOT require subscribers to change passwords periodically" - and 8 is the minimum only when the password is part of MFA.
      - id: max-16
        text: 15 to 16 characters, letters and digits only, so the field fits the database column.
        feedback: NIST says verifiers "SHOULD permit a maximum password length of at least 64 characters" and should accept spaces and Unicode. The hash is the same size whatever the length - the column isn't a reason.
      - id: no-paste
        text: At least 15 characters, with paste disabled so bots can't fill the field.
        feedback: NIST "SHALL allow the use of password managers and autofill" and "SHOULD permit ... paste". Blocking paste hurts password-manager users and barely slows a bot.
    correct: [nist]
    hints:
      - Which of these would push a user towards Summer2026! and then Autumn2026!?
      - Does NIST ask for complexity, or for length plus a blocklist?
    solution: |
      NIST SP 800-63B-4 section 3.1.1.2: 15 characters minimum for a password used alone, at least 64 allowed,
      printing ASCII, space and Unicode accepted, a blocklist of commonly used, expected or compromised values,
      no other composition rules, no periodic changes (only on evidence of compromise), password managers and
      paste allowed - plus rate limiting (section 3.2.2). **Confirm** each rule against the published text; it
      is short and quotable in a design review.

  - id: login-abuse-tests
    type: testdesign
    concept: password-rules-and-throttling
    skill: application
    title: Test the login against guessing and enumeration
    prompt: |
      Design test cases for the dashboard's password login that check throttling, generic errors and the
      blocklist. For each, give preconditions, steps, the expected result and the evidence you would collect.
    hints:
      - An attacker can rotate IP addresses - what should the counter be tied to?
      - Compare an unknown email and a wrong password on every observable channel, not just the message.
      - What should happen to the real user while an attacker is guessing?
    modelAnswer: |
      1. **Generic error** - pre: account `ops@merchant.example` exists. Log in with an unknown email and with
         the known email and a wrong password, 20 times each. Expected: identical status, body and headers;
         median times within a few percent. Evidence: response diff and timing samples.
      2. **Per-account throttling** - send 10 wrong passwords for one account from 10 different IP addresses
         (test proxies). Expected: delays grow or a challenge appears for that account regardless of IP. Evidence:
         responses, the throttle log entries.
      3. **Limit and recovery** - continue to the configured limit (≤ 100 per NIST). Expected: the account's
         password authenticator is disabled or locked as designed; the owner can recover through the reset
         flow; an event is logged. Evidence: status, email in the test inbox, audit log.
      4. **No lockout as a weapon** - while 3 runs, the real owner logs in through SSO or completes the reset.
         Expected: works. Evidence: successful session.
      5. **Counter reset** - after a successful login the failure count resets. Evidence: next failure starts
         the delay sequence from the beginning.
      6. **Blocklist** - register or change to `password1234567` and to a known-breached test value. Expected:
         rejected with guidance to choose another. Evidence: 422 with problem type.
      7. **No leaks in logs** - grep logs for the passwords used. Expected: none.
    rubric:
      - Includes the unknown-email versus wrong-password comparison, including timing.
      - Ties throttling to the account and tests it from several IP addresses.
      - Checks that lockout can't lock the real user out permanently or be abused.
      - Includes a blocklist case on registration or password change.
      - Names evidence for every case (responses, timings, logs, emails).
    solution: |
      A good plan compares unknown and known accounts on message, status and timing; proves throttling follows
      the account across IP addresses; checks the limit, recovery and logging; makes sure an attacker can't lock
      the owner out for good; tests the blocklist; and greps the logs for secrets.

  - id: code-flow-order
    type: order
    concept: oauth-code-flow-pkce
    skill: application
    title: Put the sign-in steps in order
    prompt: |
      Order the steps of "Sign in with SandPay ID" for the dashboard, from the click on the button to the
      dashboard page.
    items:
      - id: create-secrets
        text: Server creates state, nonce and a PKCE verifier and keeps them in the user's session
      - id: redirect-authorize
        text: Browser is redirected to the authorize endpoint with code_challenge (S256), state and nonce
      - id: user-authenticates
        text: User signs in at SandPay ID (password, MFA or passkey)
      - id: callback
        text: Provider redirects back to the exact registered redirect URI with code and state
      - id: check-state
        text: Server checks state (and iss) against the session
      - id: token-exchange
        text: Server POSTs code, redirect_uri and code_verifier to the token endpoint
      - id: validate-id-token
        text: Server validates the ID token - signature, iss, aud, exp, nonce
      - id: own-session
        text: Server creates its own session for (iss, sub) and redirects to the dashboard
    hints:
      - The verifier must exist before its challenge can be sent.
      - Which check needs the token response, and which only needs the callback URL?
    solution: |
      Secrets first (the challenge is derived from the verifier), then the redirect, authentication at the
      provider, the callback, the state check (it needs only the callback), the token exchange with the
      verifier, ID token validation (it needs the token response and the stored nonce), and finally the app's
      own session. **Confirm** by watching the redirects and the token request in your browser's DevTools
      Network panel and the server log.

  - id: pkce-what-it-stops
    type: mcq
    concept: oauth-code-flow-pkce
    skill: analysis
    title: What does PKCE add?
    prompt: |
      The dashboard is a confidential client: its server authenticates to the token endpoint with a client
      secret. A colleague says "we have a secret, so PKCE adds nothing". An attacker has obtained a valid
      authorization code issued to the dashboard (for example from a log). What does PKCE change?
    options:
      - id: binds-code
        text: The code can only be redeemed with the verifier created for that sign-in, so the attacker can't inject the stolen code into their own session with the dashboard and get logged in as the victim.
        feedback: Correct - RFC 9700 describes this code injection attack against confidential clients too; the client secret doesn't help because the attacker uses the real client to redeem the code.
      - id: nothing
        text: Nothing - without the client secret the attacker can't redeem the code.
        feedback: The attacker doesn't redeem it directly; they feed it to the real dashboard (injection), which uses its own secret. RFC 9700 recommends PKCE for confidential clients for this reason.
      - id: encrypts
        text: It encrypts the code so the attacker can't read it.
        feedback: PKCE doesn't encrypt anything; the code travels as before. It binds the code to a secret the client kept.
      - id: replaces-state
        text: It replaces TLS on the redirect.
        feedback: PKCE complements TLS, it doesn't replace it. The flow still requires HTTPS everywhere.
    correct: [binds-code]
    hints:
      - Who does the attacker send the stolen code to - the token endpoint, or the dashboard's callback?
      - What does the dashboard look up when a callback arrives?
    solution: |
      With PKCE, the token endpoint only accepts the code together with the verifier whose S256 hash was sent in
      **that** authorization request. When the attacker pastes the victim's code into their own sign-in, the
      dashboard sends the attacker session's verifier, the hashes don't match, and the exchange fails. RFC 9700
      2.1.1: PKCE is "RECOMMENDED" for confidential clients and "MUST" for public ones. **Confirm** in a test
      provider (Keycloak, for instance) by exchanging a code with a different verifier and reading the
      `invalid_grant` error.

  - id: oidc-client
    type: coding
    concept: oidc-id-token-validation
    skill: application
    title: PKCE, the callback and ID token validation
    prompt: |
      In `oidc-client.ts`, a teammate's draft has a gap in every function. Fix them: `createPkcePair` per RFC
      7636 (the test feeds it Appendix B's octets); `buildAuthorizeUrl` with every parameter of an OIDC code
      request, properly encoded; `readCallback` checking error, state and `iss`; and `validateIdToken` checking
      signature, algorithms, `iss`, `aud` (no extra audiences), `exp` and `nonce`.
    project: fullstack
    files:
      - exercises/auth/oidc-client.ts
    test: tests/auth/oidc-client.test.ts
    command: npx vitest run tests/auth/oidc-client.test.ts
    hints:
      - "base64url, not hex or base64: `buffer.toString('base64url')`; the challenge is the SHA-256 of the verifier string."
      - "Build the URL with `new URL()` and `url.searchParams.set(...)` so values are encoded."
      - "`jwtVerify(token, keys, { issuer, audience, algorithms, currentDate })` does signature, iss, aud and exp."
      - "jose doesn't know your nonce or your rule about additional audiences - check them after jwtVerify."
    modelAnswer: |
      ```typescript
      export function createPkcePair(random = randomBytes): PkcePair {
        const verifier = random(32).toString('base64url');
        const challenge = createHash('sha256').update(verifier, 'ascii').digest('base64url');
        return { verifier, challenge, method: 'S256' };
      }

      export function readCallback(config, query, expectedState) {
        const error = query.get('error');
        if (error) throw new OidcError(`provider returned error: ${error}`);
        if (!expectedState || query.get('state') !== expectedState) throw new OidcError('state does not match');
        const iss = query.get('iss');
        if (iss !== null && iss !== config.issuer) throw new OidcError('iss does not match the expected issuer');
        const code = query.get('code');
        if (!code) throw new OidcError('no authorization code');
        return code;
      }

      export async function validateIdToken(config, idToken, check) {
        let payload;
        try {
          ({ payload } = await jwtVerify(idToken, check.keys, {
            issuer: config.issuer,
            audience: config.clientId,
            algorithms: check.algorithms ?? ['RS256', 'ES256'],
            requiredClaims: ['sub', 'exp', 'iat'],
            currentDate: check.now,
          }));
        } catch (error) {
          throw new OidcError(`ID token rejected: ${(error as Error).message}`);
        }
        const audiences = Array.isArray(payload.aud) ? payload.aud : [payload.aud];
        if (audiences.some((aud) => aud !== config.clientId)) throw new OidcError('ID token has an untrusted audience');
        if (!check.nonce || payload.nonce !== check.nonce) throw new OidcError('nonce does not match');
        return payload;
      }
      ```

      The draft decoded the token without verifying it, so a token signed with any key - or edited by hand -
      passed. `buildAuthorizeUrl` uses `URL` and `searchParams` and always includes `openid`, `nonce`,
      `code_challenge` and `code_challenge_method=S256`.
    rubric:
      - Every test in tests/auth/oidc-client.test.ts passes.
      - The ID token is verified with jwtVerify and an explicit list of asymmetric algorithms - decodeJwt is not used to decide anything.
      - The state check fails closed when either value is missing.
      - Explains why the user is identified by iss plus sub.
    solution: |
      base64url PKCE matching RFC 7636 Appendix B, an encoded authorization URL with every parameter, a callback
      check for error, state and iss, and `jwtVerify` with issuer, audience and algorithms plus your own
      audience and nonce checks. The reference is `solutions/auth/oidc-client.ts`.
    followUp: |
      Add `discover(issuer)` that fetches `/.well-known/openid-configuration`, checks that its `issuer` equals
      the expected issuer exactly, and returns a `createRemoteJWKSet` for its `jwks_uri`.

  - id: decode-only
    type: debug
    concept: oidc-id-token-validation
    skill: analysis
    title: The callback that trusts too much
    prompt: |
      Anyone can sign in as any merchant user on a staging copy of the dashboard. Click the line that makes
      this possible.
    language: typescript
    code: |
      app.get('/auth/callback', async (req, res) => {
        const code = readCallback(config, new URLSearchParams(req.query as Record<string, string>), req.session.state);
        const tokens = await exchangeCode(code, req.session.verifier);
        const claims = decodeJwt(tokens.id_token);
        if (claims.nonce !== req.session.nonce) return res.status(400).send('Sign-in failed');
        const user = await users.findByIssuerAndSubject(claims.iss, claims.sub);
        await sessions.start(res, user.id);
        res.redirect('/dashboard');
      });
    correctLines: [4]
    lineNotes:
      - line: 3
        note: Exchanging the code with the stored verifier is correct PKCE.
      - line: 6
        note: Looking users up by issuer and subject is exactly right - once the claims are trustworthy.
    hints:
      - Which line turns a token into claims, and does it check the signature?
    solution: |
      **Line 4** uses `decodeJwt`, which returns the claims of any token without checking the signature,
      issuer, audience or expiry. Anyone who can get a response into this path - a misconfigured token
      endpoint URL, a test stub left on staging - can supply any `sub`. Use `jwtVerify` with the issuer's JWK
      Set, `issuer`, `audience` and `algorithms`, then check the nonce. **Confirm** with a test that sends an
      unsigned token (`alg: none`) and one signed with a different key: both must be refused.

  - id: link-by-email
    type: short
    concept: oidc-id-token-validation
    skill: analysis
    title: "\"Just match users by email\""
    prompt: |
      The dashboard will add a second provider ("Sign in with Partner Bank"). A developer suggests: "When a
      token comes in, find the user by its `email` claim - that way the same person gets the same account with
      either provider." What is the risk, and what would you do instead?
    hints:
      - Who controls what a provider puts in the email claim, and is every email verified?
      - What does OpenID Connect Core section 5.7 say is stable?
    modelAnswer: |
      The `email` claim is whatever that provider asserts. Some providers let users set an unverified email, an
      address can be reassigned, and a compromised or careless second provider could assert someone else's
      email - so matching by email lets an account at one provider take over an account created through
      another. OpenID Connect Core 5.7: "The sub (subject) and iss (issuer) Claims ... used together, are the
      only Claims that an RP can rely upon as a stable identifier". Store identities as `(iss, sub)` rows linked
      to an internal user id. Link a second identity only when the user is signed in to the existing account
      and proves the new one in the same session (or through a deliberate, verified linking flow) - never
      automatically by email.
    rubric:
      - Names account takeover through another provider's email claim.
      - Mentions unverified or reassigned emails.
      - Proposes (iss, sub) as the key, citing OIDC Core 5.7 or equivalent.
      - Describes an explicit linking flow instead of automatic matching.
    solution: |
      Email isn't a stable or trustworthy identifier across providers; key identities on `(iss, sub)` and link
      accounts only through an explicit, authenticated linking step.

  - id: interview-auth
    type: interview
    concept: oauth-code-flow-pkce
    skill: analysis
    title: "\"How would you build login for this app?\""
    prompt: |
      An interviewer asks: "You're building the login for a merchant dashboard - a React front end and a
      Node.js API. Walk me through how users sign in, how you store anything sensitive, and what you'd test."
    modelAnswer: |
      I'd sign users in through an OpenID Connect provider - ours or a managed one - with the authorization code
      flow and PKCE, handled by the Node server, not the browser. The server creates state, nonce and a PKCE
      S256 verifier per sign-in and keeps them in the session; the provider has our exact redirect URI
      registered. On the callback I check state and iss, exchange the code with the verifier, and validate the
      ID token with a certified library: signature against the provider's JWKS with allowed algorithms, issuer
      exactly, audience only us, expiry, nonce. I identify users by issuer plus subject, then start our own
      session in an HttpOnly, Secure, SameSite=Lax cookie; tokens stay on the server. No implicit grant, no
      password grant - RFC 9700 rules them out.

      If we also need our own passwords, I store them with Argon2id or scrypt at OWASP's parameters, a unique
      salt, parameters in the stored string so I can raise them, constant-time comparison and re-hashing on
      login. Policy follows NIST 800-63B-4: 15 characters for a password used alone, long passwords and paste
      allowed, a breached-password blocklist, no composition rules or forced rotation. Login is throttled per
      account, errors are generic with equal timing, and we offer MFA or passkeys.

      I'd test the negative paths: mismatched state, a code redeemed with the wrong verifier, ID tokens with
      the wrong signature, issuer, audience, nonce or an expired one; unknown email versus wrong password on
      message and timing; throttling across IPs; and that no secret ever reaches logs.
    rubric:
      - Chooses the authorization code flow with PKCE, run on the server, and rejects implicit and password grants.
      - Names state, nonce, exact redirect URI and full ID token validation.
      - Identifies users by iss and sub and creates the app's own session.
      - Describes password storage with a slow salted KDF and upgradeable parameters.
      - Mentions NIST-style password rules, throttling and generic errors.
      - Gives concrete negative tests.
    followUps:
      - Why not keep the access token in localStorage in the React app?
      - How would you raise the scrypt cost next year without forcing everyone to reset?
      - A provider rotates its signing keys. What happens in your app?
      - What does an ID token not tell you that your app still has to decide?
    hints:
      - Structure it - sign-in flow, what you validate, sessions, stored secrets, tests.
      - Name the standards (RFC 9700, OIDC Core, OWASP, NIST) - interviewers notice.
    solution: |
      Code flow with PKCE on the server, state and nonce, full ID token validation, users keyed by iss and sub,
      your own HttpOnly session; Argon2id or scrypt with upgradeable parameters for any local passwords; NIST
      rules, throttling and generic errors; and tests of every rejection path.

placement:
  - id: place-hash-choice
    type: mcq
    concept: password-hashing-kdf
    skill: application
    title: Choose the password storage
    prompt: |
      A new Node.js 24 service stores customer passwords. There are no FIPS requirements. Which storage do you
      choose?
    options:
      - id: argon2id
        text: Argon2id (19 MiB, 2 passes, 1 lane) with a random salt per password and the parameters stored with the hash; scrypt at N=2^17, r=8, p=1 if Argon2id isn't available.
        feedback: Correct - OWASP's first choice and its fallback, with a unique salt and upgradeable parameters.
      - id: sha256-salt
        text: SHA-256 of a random salt plus the password.
        feedback: Salting stops precomputed tables, but SHA-256 is fast - hundreds of thousands of guesses per second per core. Password storage needs a deliberately slow function.
      - id: aes
        text: AES-256-GCM encryption with the key in an environment variable.
        feedback: Encryption is reversible by design; whoever gets the key (usually from the same server) gets every password. OWASP says hash, don't encrypt.
      - id: pbkdf2-sha1
        text: PBKDF2-HMAC-SHA1 with 10,000 iterations, because it is in every library.
        feedback: Far below OWASP's guidance (600,000 for HMAC-SHA-256; HMAC-SHA1 is "legacy only") and not memory-hard. PBKDF2 is the choice when FIPS-140 requires it.
    correct: [argon2id]
    solution: |
      OWASP Password Storage Cheat Sheet: Argon2id with at least 19 MiB, 2 iterations and parallelism 1; if
      unavailable, scrypt with N=2^17, r=8, p=1; bcrypt for legacy; PBKDF2-HMAC-SHA-256 at 600,000 iterations
      where FIPS-140 is required. Always a unique salt, and store the parameters with the hash.

  - id: place-nist-rule
    type: mcq
    concept: password-rules-and-throttling
    skill: application
    title: The audit finding
    prompt: |
      An auditor using NIST SP 800-63B-4 reviews a password-only login. Which practice is a **finding**?
    options:
      - id: rotation
        text: Users must change their password every 90 days.
        feedback: Correct - verifiers "SHALL NOT require subscribers to change passwords periodically"; a change is forced only on evidence of compromise.
      - id: blocklist
        text: New passwords are checked against a list of common and breached passwords.
        feedback: That is required - verifiers "SHALL compare the prospective secret against a blocklist".
      - id: fifteen
        text: Passwords must be at least 15 characters.
        feedback: That is required for passwords used as a single factor.
      - id: account-throttle
        text: Failed attempts are limited per account, not only per IP address.
        feedback: Required by section 3.2.2 - and per-account counting is what OWASP recommends too.
    correct: [rotation]
    solution: |
      NIST SP 800-63B-4 section 3.1.1.2 forbids periodic password changes and composition rules, and requires a
      15-character minimum for single-factor passwords, a blocklist, and (section 3.2.2) rate limiting per
      account.

  - id: place-pkce-order
    type: order
    concept: oauth-code-flow-pkce
    skill: application
    title: PKCE from start to finish
    prompt: Order what happens to the PKCE values during one sign-in.
    items:
      - id: make-verifier
        text: Client makes a random code_verifier and stores it in the session
      - id: hash-it
        text: Client computes code_challenge = BASE64URL(SHA256(verifier))
      - id: send-challenge
        text: Authorization request carries code_challenge and code_challenge_method=S256
      - id: server-stores
        text: Provider stores the challenge with the authorization code it issues
      - id: send-verifier
        text: Token request carries the code and the code_verifier
      - id: server-compares
        text: Provider hashes the verifier and compares it with the stored challenge
    solution: |
      The verifier exists first and never travels until the token request; only its hash goes through the
      browser. The provider ties the challenge to the code, then checks the verifier at the token endpoint (RFC
      7636 sections 4.1-4.6).

  - id: place-id-token
    type: mcq
    concept: oidc-id-token-validation
    skill: application
    title: Which token do you accept?
    prompt: |
      The dashboard (client id `merchant-dashboard`, issuer `https://id.sandpay.example`) sent nonce `n-77`.
      Every token below is signed with the issuer's current key. Which one should it accept?
    options:
      - id: good
        text: "iss https://id.sandpay.example, aud merchant-dashboard, exp in 5 minutes, nonce n-77"
        feedback: Correct - right issuer exactly, only this client in aud, not expired, and the nonce this sign-in sent.
      - id: slash
        text: "iss https://id.sandpay.example/, aud merchant-dashboard, exp in 5 minutes, nonce n-77"
        feedback: The issuer "MUST exactly match" - the trailing slash makes it a different string.
      - id: extra-aud
        text: "iss https://id.sandpay.example, aud [merchant-dashboard, reporting-app], exp in 5 minutes, nonce n-77"
        feedback: OIDC Core says to reject tokens with "additional audiences not trusted by the Client".
      - id: other-nonce
        text: "iss https://id.sandpay.example, aud merchant-dashboard, exp in 5 minutes, nonce n-12"
        feedback: The nonce must equal the one sent in this authentication request - n-12 belongs to another sign-in.
    correct: [good]
    solution: |
      OpenID Connect Core 3.1.3.7: valid signature with the issuer's keys, `iss` exactly equal, `aud` containing
      the client and no untrusted audiences, `exp` in the future, and `nonce` equal to the one sent.

recall:
  - id: recall-why-slow
    concept: password-hashing-kdf
    prompt: Why must a password hash be slow and salted?
    answer: Slow (and memory-hard) so each offline guess is expensive - a fast hash allows hundreds of thousands per second per core; salted so identical passwords differ and one guess or a precomputed table can't crack many users at once.
  - id: recall-owasp-params
    concept: password-hashing-kdf
    prompt: What are OWASP's first choice and its scrypt fallback, with parameters?
    answer: Argon2id with at least 19 MiB memory, 2 iterations, parallelism 1; otherwise scrypt with N=2^17, r=8, p=1. bcrypt (cost ≥ 10, 72-byte limit) for legacy; PBKDF2-HMAC-SHA-256 at 600,000 for FIPS.
  - id: recall-upgrade
    concept: password-hashing-kdf
    prompt: How do you raise hashing cost without forcing a reset?
    answer: Store algorithm and parameters in the hash string, verify with the stored ones, and on a successful login re-hash with the current parameters when needsRehash says so.
  - id: recall-nist
    concept: password-rules-and-throttling
    prompt: Name four NIST SP 800-63B-4 password rules.
    answer: 15 characters minimum for single-factor passwords (8 with MFA); allow at least 64 and any characters; check a blocklist of common and breached passwords; no composition rules and no periodic changes; allow password managers and paste; limit failed attempts.
  - id: recall-enumeration
    concept: password-rules-and-throttling
    prompt: How do you stop a login from revealing which accounts exist?
    answer: One generic error for unknown user, wrong password and locked account, the same status and body, and the same timing - hash against a dummy hash for unknown users. Throttle per account.
  - id: recall-pkce
    concept: oauth-code-flow-pkce
    prompt: What does PKCE consist of and what does it prevent?
    answer: A random code_verifier kept by the client, its S256 hash code_challenge sent in the authorization request, and the verifier sent with the code at the token endpoint - so a stolen or injected code can't be redeemed.
  - id: recall-grants
    concept: oauth-code-flow-pkce
    prompt: Which OAuth grants does RFC 9700 rule out, and what replaces them?
    answer: The implicit grant (SHOULD NOT be used - tokens in URLs) and the resource owner password credentials grant (MUST NOT be used). Use the authorization code grant with PKCE.
  - id: recall-id-token
    concept: oidc-id-token-validation
    prompt: List the ID token checks and the stable user key.
    answer: Signature with the issuer's JWKS and an allowed algorithm; iss exactly equal; aud contains the client and no untrusted audience; exp in the future; nonce equal to the one sent. Identify the user by iss plus sub.

