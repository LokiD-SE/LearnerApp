id: postgres-indexes-and-query-plans
title: PostgreSQL indexes and query plans
subject: fullstack
module: databases
level: intermediate
status: published
estimatedMinutes: 70
summary: Find out why a query is slow and fix it with evidence - how PostgreSQL reads a table, what a B-tree index can and can't do, reading EXPLAIN and EXPLAIN ANALYZE, partial, expression, covering and GIN indexes, why the planner ignores an index, what indexes cost on writes, and the N+1 query that no index can fix. Every plan shown here was produced by a real run.
tags:
