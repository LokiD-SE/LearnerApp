id: typescript-for-applications
title: TypeScript for applications
subject: fullstack
module: js-ts-node
level: intermediate
status: published
estimatedMinutes: 60
summary: Use structural types, inference, unions with narrowing, generics and utility types to catch bugs before they run - and know exactly where types stop, so data from outside is checked at runtime.
tags:
  [
    typescript,
    types,
    structural typing,
    type inference,
    union types,
    narrowing,
    discriminated unions,
    never,
    exhaustiveness,
    generics,
    utility types,
    unknown,
    any,
    satisfies,
    type assertions,
    tsconfig,
    strict,
    noUncheckedIndexedAccess,
  ]

environment: |
  - **Language:** **TypeScript 6.0** (6.0.3, the version pinned in `practice/fullstack`). Every compiler
    error quoted in this lesson was produced by running `tsc` 6.0.3 with the practice project's settings
    (`strict`, `noUncheckedIndexedAccess`, `module: NodeNext`) - the `TS` numbers and wording are real.
    Error wording can change between TypeScript versions; the meaning rarely does.
  - **Version-specific:** TypeScript 6.0 changed several defaults (from the [TypeScript 6.0
    announcement](https://devblogs.microsoft.com/typescript/announcing-typescript-6-0/)): **`strict` is now
    `true` by default**, `module` defaults to `esnext`, `target` defaults to the current-year ECMAScript
    version, and **`types` now defaults to `[]`** - so global types such as `@types/node` must be listed
    (`"types": ["node"]`). Projects on TypeScript 5.x had the opposite defaults. A TypeScript 7.x line is
    also published on npm; check its release notes before relying on anything here for 7.
  - **Sources:** the TypeScript Handbook (typescriptlang.org, checked November 2026) -
    [Everyday Types](https://www.typescriptlang.org/docs/handbook/2/everyday-types.html) (type
    annotations, inference, type assertions), [Narrowing](https://www.typescriptlang.org/docs/handbook/2/narrowing.html)
    (typeof, `in`, discriminated unions, `never` and exhaustiveness checking),
    [Generics](https://www.typescriptlang.org/docs/handbook/2/generics.html) (type parameters and
    constraints), [Utility Types](https://www.typescriptlang.org/docs/handbook/utility-types.html),
    [Type Compatibility](https://www.typescriptlang.org/docs/handbook/type-compatibility.html)
    (structural subtyping), the [TSConfig reference](https://www.typescriptlang.org/tsconfig/) (`strict`,
    `noUncheckedIndexedAccess`, `types`) and the [TypeScript 4.9 release
    notes](https://www.typescriptlang.org/docs/handbook/release-notes/typescript-4-9.html) (the `satisfies`
    operator).
  - **Related:** promises, `async`/`await` and TypeScript for test code are in [JavaScript and TypeScript
    for testers](#/lesson/js-ts-async-and-types) (Track H). Runtime validation with a schema library (zod)
    is taught in [Input validation and error handling](#/lesson/input-validation-and-error-handling).
  - **Practice:** the coding exercises run in `practice/fullstack` (Vitest 5, Node.js 24).
  - **Fictional:** the SandPay merchant dashboard, its payment events, ids (`pay_...`) and amounts are
    invented for this course. No real payment data appears anywhere.

prerequisites:
  - modern-javascript-core
  - js-ts-async-and-types

concepts:
  - id: ts-structural-typing-inference
    name: Structural typing, inference and strict settings
    summary: TypeScript compares types by their shape, not their name, and infers most types from values. Strict settings (strict, noUncheckedIndexedAccess) make the checker report the null, undefined and missing-key bugs it would otherwise let through.
  - id: ts-unions-narrowing
    name: Unions, narrowing and exhaustiveness
    summary: A union type is one of several shapes; typeof, in, equality and a discriminant property narrow it to one. Passing the leftover value to a never parameter makes the compiler prove every case is handled.
  - id: ts-generics-utility-types
    name: Generics and utility types
    summary: Type parameters let one function or type work for many types while keeping the link between input and output; constraints (extends) say what a type parameter must have. Utility types such as Partial, Pick, Omit, Record and ReturnType derive new types from existing ones.
  - id: ts-runtime-boundary
    name: Types end at runtime - unknown, assertions and satisfies
    summary: Types are erased when TypeScript compiles to JavaScript, so data from outside (JSON, requests, storage) must be typed unknown and checked at runtime. An as assertion only silences the checker; satisfies checks a value against a type without widening it.

objectives:
  - Explain structural typing and predict whether an assignment compiles, including the excess-property check on fresh object literals.
  - Model a domain with a discriminated union, narrow it with typeof, `in` and a discriminant, and make a switch exhaustive with a `never` check.
  - Write generic functions with constraints, and derive request and update types with Partial, Pick, Omit, Record and ReturnType.
  - Choose between `unknown` and `any`, and between an annotation, `satisfies` and an `as` assertion, and justify the choice.
  - Write a runtime check that turns `unknown` input into a typed value or a list of field errors, and explain why the compiler cannot do it for you.
  - Configure `strict` and `noUncheckedIndexedAccess` and explain which bugs each one surfaces, including TypeScript 6.0's new defaults.

sections:
  - id: intuition
    kind: intuition
    concepts: [ts-structural-typing-inference, ts-runtime-boundary]
    title: The idea in plain language
    body: |
      Think of TypeScript as a **building inspector who only reads the plans**. Before anything is built, the
      inspector checks every drawing: this beam carries that load, this door fits that frame, every room on
      the plan has an exit. Mistakes found on paper are cheap to fix.

      The inspector checks **shapes, not brand names**: a beam is acceptable if it has the required size and
      strength, whoever made it. That is **structural typing**.

      But the inspector **never visits the site**. Once building starts, the plans are rolled up and put
      away - TypeScript's types are **erased** when the code becomes JavaScript. If a delivery truck brings
      the wrong steel (a JSON response with `"amountMinor": "12.50"` instead of `1250`), nobody checks unless
      you put a **gatekeeper at the site entrance**: a runtime check at every boundary where outside data
      comes in.

      Writing good TypeScript is two jobs: make the plans precise enough that the inspector can catch real
      mistakes, and post a gatekeeper wherever the plans can't reach.

  - id: what
    kind: what
    concepts: [ts-structural-typing-inference]
    title: Structural typing and inference
    body: |
      The Handbook's [Type Compatibility](https://www.typescriptlang.org/docs/handbook/type-compatibility.html)
      page puts it in one line: "Type compatibility in TypeScript is based on structural subtyping." A value
      fits a type if it **has at least the members the type requires**, with compatible types. The name of
      the interface does not matter:

      ```typescript
      interface Point { x: number; y: number }
      interface Pair { x: number; y: number }

      const pair: Pair = { x: 1, y: 2 };
      const p: Point = pair; // compiles - same shape, different name

      function logPoint(point: Point) { return point.x; }
      const extra = { x: 1, y: 2, z: 3 };
      logPoint(extra);              // compiles - extra members are fine on a variable
      logPoint({ x: 1, y: 2, z: 3 }); // error - see below
      ```

      The last line fails because of the **excess property check**: when an object **literal** is written
      directly where a type is expected, TypeScript treats unknown properties as a probable typo. Real
      `tsc` 6.0.3 output:

      ```plaintext
      error TS2353: Object literal may only specify known properties, and 'z' does not exist in type 'Point'.
      ```

      **Inference.** You rarely need to write types for local values: `const ids = ['pay_1', 'pay_2']` is
      inferred as `string[]`, and a function's return type is inferred from its `return` statements. Write
      types where they are a **contract** - function parameters, exported functions, API shapes - and let
      inference do the rest.

      **Literal types.** `const status = 'captured'` has the type `'captured'` (it can never change), while
      `let status = 'captured'` is widened to `string`. Unions of literals - `'captured' | 'failed'` - are how
      TypeScript models a fixed set of values.

  - id: why
    kind: why
    concepts: [ts-structural-typing-inference, ts-unions-narrowing]
    title: Why a full stack app needs it
    body: |
      In a full stack app the **same data crosses many layers**: a database row becomes an API response,
      then React state, then a form, then a request body back to the API. Every hand-over is a place where
      a renamed field, a missing case or a `null` can slip through - and in plain JavaScript you only find
      out when a user hits it.

      TypeScript turns many of those into **compile errors**:

      - rename `amount` to `amountMinor` in a shared type, and every place still using `amount` turns red;
      - add a `'disputed'` payment status, and every `switch` that forgot it fails to compile (with the
        exhaustiveness check in this lesson);
      - read `totals[currency]` from a lookup table, and `noUncheckedIndexedAccess` reminds you the key may
        be missing.

      What it **cannot** do is check data it has never seen: the JSON your API receives, the response your
      React app fetches, `localStorage`, environment variables. Those need runtime checks - the last part of
      this lesson.

  - id: strict
    kind: code
    concepts: [ts-structural-typing-inference]
    title: Strict settings and TypeScript 6.0's defaults
    body: |
      The checker is only as strict as `tsconfig.json` tells it to be. The practice project uses:

      ```json
      {
        "compilerOptions": {
          "strict": true,
          "noUncheckedIndexedAccess": true,
          "module": "NodeNext",
          "types": ["node", "vitest/globals"]
        }
      }
      ```

      - **`strict`** turns on a family of checks, including `strictNullChecks` (`null` and `undefined` are
        not assignable to other types) and `noImplicitAny` (an un-inferrable parameter is an error, not
        silently `any`). **In TypeScript 6.0 `strict` is `true` by default**; projects on 5.x had to opt in.
      - **`noUncheckedIndexedAccess`** is **not** part of `strict`. The TSConfig reference: turning it on
        "will add `undefined` to any un-declared field in the type" - index signatures and array elements:

      ```typescript
      const totals: Record<string, number> = { EUR: 1250 };
      const eur: number = totals['EUR'];

      const ids = ['pay_1', 'pay_2'];
      const first: string = ids[0];
      ```

      ```plaintext
      error TS2322: Type 'number | undefined' is not assignable to type 'number'.
        Type 'undefined' is not assignable to type 'number'.
      error TS2322: Type 'string | undefined' is not assignable to type 'string'.
        Type 'undefined' is not assignable to type 'string'.
      ```

      Annoying for `ids[0]` right after you created the array - but exactly right for `totals[currency]`
      where the currency came from a request. Handle it with a check (`if (eur === undefined) ...`), a
      default (`?? 0`) or, when you really know better, `!` - which, like `as`, is a promise to the compiler
      that nothing checks.

      - **`types`** - since TypeScript 6.0 it defaults to `[]`, so globals from `@types/node` (`process`,
        `Buffer`) or a test runner (`describe`, `test`) are only available if listed.

  - id: narrowing
    kind: code
    concepts: [ts-unions-narrowing]
    title: Unions and narrowing
    body: |
      A **union** says a value is one of several types. You can only use what **every** member has, until
      you **narrow** it. The Handbook's [Narrowing](https://www.typescriptlang.org/docs/handbook/2/narrowing.html)
      page lists the type guards the checker understands; the everyday ones:

      ```typescript
      function format(amount: string | number) {
        if (typeof amount === 'string') return amount.trim(); // amount: string here
        return amount.toFixed(2);                              // amount: number here
      }

      type Card = { kind: 'card'; last4: string };
      type Bank = { kind: 'bank'; iban: string };

      function label(method: Card | Bank) {
        if ('last4' in method) return method.last4; // the `in` operator narrows to Card
        return method.iban;                         // only Bank is left
      }
      ```

      **Discriminated unions** are the workhorse for domain events and API responses. Every member has the
      same literal-typed property - the **discriminant** (`type`, `kind`, `status`) - and checking it
      narrows to exactly one member:

      ```typescript
      type PaymentEvent =
        | { type: 'authorized'; paymentId: string; amountMinor: number }
        | { type: 'captured'; paymentId: string; amountMinor: number }
        | { type: 'refunded'; paymentId: string; amountMinor: number; reason: string }
        | { type: 'failed'; paymentId: string; code: string };

      function amount(event: PaymentEvent): number {
        return event.amountMinor; // error - not every member has it
      }
      ```

      ```plaintext
      error TS2339: Property 'amountMinor' does not exist on type 'PaymentEvent'.
        Property 'amountMinor' does not exist on type '{ type: "failed"; paymentId: string; code: string; }'.
      ```

      The compiler even names the member that lacks the property. Narrow first (`if (event.type ===
      'failed') return 0;`) and the error goes away.

  - id: exhaustive
    kind: internals
    concepts: [ts-unions-narrowing]
    title: Exhaustiveness - making the compiler prove every case is handled
    body: |
      Each `case` removes one member from the union. After the last one, nothing is left: the type is
      **`never`**, the type with no values. The Handbook: "you can use narrowing and rely on `never` turning
      up to do exhaustive checking in a switch statement." Pass the leftover value to a function that only
      accepts `never`:

      ```typescript
      function assertNever(value: never): never {
        throw new Error(`Unexpected value: ${JSON.stringify(value)}`);
      }

      function title(event: PaymentEvent): string {
        switch (event.type) {
          case 'authorized': return 'Authorized';
          case 'captured':   return 'Captured';
          case 'refunded':   return 'Refunded';
          default:           return assertNever(event); // 'failed' was forgotten
        }
      }
      ```

      ```plaintext
      error TS2345: Argument of type '{ type: "failed"; paymentId: string; code: string; }' is not assignable to parameter of type 'never'.
      ```

      Read it as: "a `failed` event can reach this line, and you said nothing can". Add the case and it
      compiles. The day someone adds `{ type: 'disputed' }` to the union, **every** switch with this check
      fails to compile until it handles disputes - the compiler hands you the to-do list.

      `assertNever` also **throws at runtime**. That matters because the union is only a compile-time
      promise: if the API starts sending `"disputed"` before your frontend is updated, the code fails loudly
      at that line instead of silently returning `undefined`.

  - id: visual
    kind: visual
    concepts: [ts-runtime-boundary, ts-structural-typing-inference]
    title: "Diagram: what is checked when"
    body: |
      TypeScript checks your code **before** it runs; then the types are removed. Data from outside only
      ever meets the **runtime** checks you wrote.

      ```mermaid
      flowchart LR
        subgraph compile["Compile time - tsc"]
          src["your .ts code"] --> check{"type check"}
          check -- errors --> fix["fix the code"]
          check -- ok --> erase["types erased"]
        end
        erase --> js["plain JavaScript"]
        subgraph run["Runtime - Node.js or the browser"]
          ext["JSON body, fetch response, localStorage, env"] --> gate{"runtime check - parse unknown"}
          gate -- invalid --> reject["400 / error state"]
          gate -- valid --> typed["typed value"]
          typed --> js
        end
      ```

      Notice that **nothing** connects the outside data to `tsc`. A `const body = req.body as RefundRequest`
      changes what the checker believes, not what arrives.

  - id: generics
    kind: code
    concepts: [ts-generics-utility-types]
    title: Generics and constraints
    body: |
      A **type parameter** is a variable for a type. It keeps the link between what goes in and what comes
      out ([Generics](https://www.typescriptlang.org/docs/handbook/2/generics.html)):

      ```typescript
      function firstOrUndefined<T>(items: readonly T[]): T | undefined {
        return items[0];
      }
      const p = firstOrUndefined([{ id: 'pay_1' }]); // p: { id: string } | undefined
      ```

      With `any` instead of `T`, `p` would be `any` and every later typo would compile. **Constraints**
      (`extends`) say what the type parameter must have:

      ```typescript
      function longest<T extends { length: number }>(a: T, b: T): T {
        return a.length >= b.length ? a : b;
      }
      longest('pay_1', 'pay_100'); // ok - strings have length
      longest(10, 20);            // error
      ```

      ```plaintext
      error TS2345: Argument of type 'number' is not assignable to parameter of type '{ length: number; }'.
      ```

      Generic **types** work the same way. A `Result` type forces callers to check for failure before using
      the value - you will write one in the exercises:

      ```typescript
      type Result<T, E> = { ok: true; value: T } | { ok: false; error: E };
      ```

      `K extends PropertyKey` (string, number or symbol) is the usual constraint for something used as an
      object key, as in `groupBy<T, K extends PropertyKey>(items: readonly T[], keyOf: (item: T) => K)`.

  - id: utility
    kind: code
    concepts: [ts-generics-utility-types]
    title: Utility types - derive, don't duplicate
    body: |
      When the same entity appears in several shapes (stored row, create request, update request), derive
      the shapes from one type with the built-in [utility types](https://www.typescriptlang.org/docs/handbook/utility-types.html)
      instead of copying fields - a rename then updates every shape at once.

      | Utility | Meaning | Typical use |
      |---|---|---|
      | `Partial<T>` | every property optional | a PATCH body |
      | `Required<T>` | every property required | config after defaults are applied |
      | `Pick<T, K>` | only the keys `K` | the fields a client may change |
      | `Omit<T, K>` | every key except `K` | a create request without server-set fields |
      | `Record<K, V>` | an object type with keys `K` and values `V` | lookup tables |
      | `ReturnType<F>` | the return type of a function type | type a value from a factory |
      | `Readonly<T>` | every property readonly | state you must not mutate |

      ```typescript
      interface Payment {
        id: string;
        amountMinor: number;
        status: 'captured' | 'failed';
        createdAt: string;
      }
      type NewPayment = Omit<Payment, 'id' | 'createdAt'>; // the server sets id and createdAt
      type PaymentPatch = Partial<Pick<Payment, 'status'>>; // only status may change

      const draft: NewPayment = { amountMinor: 1, status: 'captured', id: 'x' };
      ```

      ```plaintext
      error TS2353: Object literal may only specify known properties, and 'id' does not exist in type 'NewPayment'.
      ```

      `Record<'EUR' | 'GBP', number>` requires **both** keys; `Record<string, number>` allows any key - which
      is why `noUncheckedIndexedAccess` adds `undefined` when you read one. For "some keys may be missing",
      use `Partial<Record<K, V>>`.

  - id: boundary
    kind: code
    concepts: [ts-runtime-boundary]
    title: unknown, any, as and satisfies
    body: |
      **`any` switches the checker off** for a value - everything compiles, including mistakes.
      **`unknown` means "could be anything, so prove it first"** - you can't use it until you narrow it:

      ```typescript
      function shout(value: unknown): string {
        return value.toUpperCase();
      }
      ```

      ```plaintext
      error TS18046: 'value' is of type 'unknown'.
      ```

      The same function with `value: any` compiles - and crashes at runtime when `value` is a number.
      `JSON.parse` and `response.json()` return `any`; assign their results to `unknown` and narrow from
      there.

      **`as` (a type assertion)** tells the checker "trust me". The Handbook is blunt: "Because type
      assertions are removed at compile-time, there is no runtime checking associated with a type
      assertion." It only refuses impossible conversions; everything plausible compiles:

      ```typescript
      type Currency = 'EUR' | 'GBP' | 'INR';
      interface Config { currency: Currency; retries: number }

      const missing = { currency: 'EUR' } as Config;                     // compiles - retries is missing
      const parsed = JSON.parse('{"currency":"JPY"}') as Config;         // compiles - JPY at runtime
      const typo = { currency: 'EUROS', retries: 3 } as Config;          // error TS2352 (no overlap)
      ```

      **`satisfies`** (TypeScript 4.9+) checks a value against a type **without changing the value's
      inferred type**. The release notes: it "lets us validate that the type of an expression matches some
      type, without changing the resulting type of that expression."

      ```typescript
      const viaSatisfies = { currency: 'EUR', retries: 3 } satisfies Config;
      const viaAnnotation: Config = { currency: 'EUR', retries: 3 };

      const a: 'EUR' = viaSatisfies.currency;  // ok - still the literal 'EUR'
      const b: 'EUR' = viaAnnotation.currency; // error - widened to Currency
      const bad = { currency: 'EUROS', retries: 3 } satisfies Config;
      ```

      ```plaintext
      error TS2322: Type 'Currency' is not assignable to type '"EUR"'.
        Type '"GBP"' is not assignable to type '"EUR"'.
      error TS2820: Type '"EUROS"' is not assignable to type 'Currency'. Did you mean '"EUR"'?
      ```

      Rule of thumb: **annotate** contracts, use **`satisfies`** for config objects and lookup tables you want
      checked but still precise, and treat **`as`** as a code-review flag - each one needs a reason.

  - id: steps
    kind: steps
    concepts: [ts-runtime-boundary]
    title: Checking outside data at the boundary
    body: |
      For every place data enters your program - an Express request body, a `fetch` response, a message from
      a queue, `process.env`, `localStorage`:

      1. **Type it `unknown`** at the entry point (`const body: unknown = req.body`).
      2. **Narrow the container**: `typeof input === 'object' && input !== null`.
      3. **Check each field** with `typeof`, `Number.isSafeInteger`, a list of allowed values, a length -
         and **collect every problem**, naming the field, rather than stopping at the first.
      4. **Build the typed value from the checked fields only** - unknown extra fields (`"admin": true`) are
         dropped, not passed along.
      5. **Return a `Result`** (or throw a validation error) so the caller must handle the failure - in an
         API, a 400 response listing the problems.
      6. **Test the checker** with valid input, each invalid field on its own, several at once, and
         non-object bodies (`null`, a string, a number).

      Writing this by hand once teaches you what a schema library does. In a real app you describe the
      shape once with a library such as zod and get both the check and the static type from it - see
      [Input validation and error handling](#/lesson/input-validation-and-error-handling).

  - id: example
    kind: example
    concepts: [ts-unions-narrowing, ts-runtime-boundary]
    title: "In a project: adding a payment status"
    body: |
      The SandPay merchant dashboard (fictional) shows a payment timeline. The backend team adds chargebacks:
      events can now be `{ type: 'disputed', paymentId, amountMinor }`.

      - **With a discriminated union and `assertNever`**: the frontend developer adds the member to
        `PaymentEvent`, runs `tsc`, and gets one TS2345 error per switch that does not handle it - the
        activity feed, the status badge, the totals. Each is fixed before the release.
      - **Without it** (a `string` status and `if/else` chains): it compiles, and disputed payments silently
        show as "Unknown" or fall into the wrong total until a merchant complains.
      - **The runtime side**: the frontend may be deployed *after* the backend. Until then, old frontend
        code receives `disputed` events it has no case for. Because responses are parsed as `unknown` and
        `assertNever` throws, the error is logged with the payment id instead of corrupting a total.

      What a tester checks: an event type the UI does not know yet produces a visible, logged error state -
      not a blank row and not a wrong total.

  - id: mistakes
    kind: mistakes
    concepts: [ts-runtime-boundary, ts-structural-typing-inference, ts-generics-utility-types]
    title: Common mistakes and how to debug them
    body: |
      | Mistake | What goes wrong | Do instead |
      |---|---|---|
      | `const body = req.body as RefundRequest` | compiles; a string amount or missing field crashes later, far from the cause | type it `unknown` and check it |
      | `any` in a shared helper | every caller loses checking - `any` spreads | a type parameter or `unknown` |
      | `!` after every lookup to quiet `noUncheckedIndexedAccess` | the `undefined` case is now unhandled | `?? default`, or a check that returns an error |
      | copying `Payment` into `PaymentResponse`, `PaymentForm`... by hand | a rename updates one copy | derive with `Pick`, `Omit`, `Partial` |
      | `switch` on a status with no `default` / `assertNever` | a new status falls through silently | exhaustive check |
      | `// @ts-ignore` to get the build green | hides this error **and** future ones on that line | fix the type; if you must, `@ts-expect-error` with a reason (it fails when the error is gone) |
      | trusting that tests compile = tests are right | types do not check behaviour or values | keep runtime tests |

      **Debugging a type error:** read the **last** indented line of the message first - it names the exact
      property or member that does not fit (as in the TS2339 example, which names the `failed` member).
      Hover the value in the editor to see what TypeScript inferred; a surprising `any` or a widened
      `string` is often the real cause. Reproduce in a tiny file and run `npx tsc --noEmit`.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [ts-runtime-boundary, ts-generics-utility-types]
    title: Limits and trade-offs
    body: |
      - **Types are not validation.** TypeScript has no runtime; every external input still needs a check.
        Schema libraries remove the duplication between the check and the type.
      - **Structural typing can be too permissive.** A `UserId` and an `OrderId` that are both `string` are
        interchangeable. Teams that need to keep them apart use "branded" types (an intersection with a
        unique marker property) - a pattern, not a built-in feature.
      - **Clever types cost readers.** Deeply nested conditional and mapped types can make errors
        unreadable. Prefer simple, explicit types at module boundaries.
      - **Strictness has a migration cost.** Turning on `strict` or `noUncheckedIndexedAccess` in an existing
        codebase can produce hundreds of errors; teams enable them per folder or fix them in batches. New
        projects should start strict - TypeScript 6.0 now does by default.
      - **Compile step.** TypeScript must be type-checked and turned into JavaScript (by `tsc`, or by a
        bundler that strips types and leaves checking to `tsc --noEmit` in CI). Stripping alone does **not**
        check anything.

  - id: summary
    kind: summary
    concepts: [ts-structural-typing-inference, ts-unions-narrowing, ts-generics-utility-types, ts-runtime-boundary]
    title: Quick reference
    body: |
      - **Structural:** a value fits a type if it has the required members; fresh object literals also get
        an excess-property check.
      - **Infer locals, annotate contracts.** `const` keeps literal types; `let` widens.
      - **Strict:** `strict` (default `true` since TS 6.0) + `noUncheckedIndexedAccess` (separate, adds
        `undefined` to index reads). In TS 6.0 `types` defaults to `[]`.
      - **Narrow** with `typeof`, `in`, `===` and a **discriminant**; end switches with `assertNever(value:
        never)` - a compile-time to-do list and a runtime tripwire.
      - **Generics** keep input and output linked; `extends` constrains them; `K extends PropertyKey` for keys.
      - **Derive** shapes: `Partial`, `Pick`, `Omit`, `Record`, `ReturnType`, `Readonly`.
      - **`unknown` over `any`**; **`satisfies`** checks without widening; **`as`** checks nothing at runtime.
      - **Every boundary** (request, response, storage, env) gets a runtime check that returns a typed value
        or field errors.

exercises:
  - id: structural-assignments
    type: mcq
    concept: ts-structural-typing-inference
    skill: analysis
    title: Which line fails to compile?
    prompt: |
      With `strict` on, which **one** of these lines is a compile error?

      ```typescript
      interface Refund { paymentId: string; amountMinor: number }
      interface Credit { paymentId: string; amountMinor: number }

      function issue(refund: Refund) { return refund.paymentId; }

      const credit: Credit = { paymentId: 'pay_1', amountMinor: 500 };
      const withNote = { paymentId: 'pay_2', amountMinor: 300, note: 'goodwill' };

      issue(credit);                                                     // A
      issue(withNote);                                                   // B
      issue({ paymentId: 'pay_3', amountMinor: 200, note: 'goodwill' }); // C
      ```
    options:
      - id: a
        text: A - a Credit is not a Refund.
        feedback: TypeScript is structural - Credit has exactly the members Refund requires, so it fits. The interface name does not matter.
      - id: b
        text: B - withNote has a property Refund does not declare.
        feedback: Extra members are allowed on a value that is not a fresh literal. withNote is a variable, so there is no excess-property check.
      - id: c
        text: C - an object literal with a property Refund does not declare.
        feedback: Correct - a fresh object literal passed where Refund is expected gets the excess-property check, so note is reported (TS2353).
      - id: none
        text: None - structural typing accepts all three.
        feedback: Structural typing accepts A and B, but object literals get an extra check for unknown properties - a likely typo.
    correct: [c]
    hints:
      - Does the interface's name matter, or only its members?
      - What is special about an object literal written directly in the call?
    solution: |
      **C.** A compiles (same shape), B compiles (extra members are fine on a variable). C is a **fresh
      object literal** written where `Refund` is expected, so TypeScript runs the excess-property check and
      reports `error TS2353: Object literal may only specify known properties, and 'note' does not exist in
      type 'Refund'.` The check exists because a literal's extra property is usually a typo
      (`amountMinr`).
    followUp: |
      If you need `issue` to accept a refund with an optional note, what would you change - the call, or
      the `Refund` type? Why is the other option worse?

  - id: index-access
    type: mcq
    concept: ts-structural-typing-inference
    skill: application
    title: The fee table and noUncheckedIndexedAccess
    prompt: |
      ```typescript
      const feeBps: Record<string, number> = { card: 290, bank: 80 };

      export function fee(method: string, amountMinor: number): number {
        return Math.round((amountMinor * feeBps[method]) / 10_000);
      }
      ```

      With `strict` alone this compiles, and `fee('wallet', 1000)` returns `NaN`. After turning on
      `noUncheckedIndexedAccess`, what happens and what is the best fix?
    options:
      - id: error-check
        text: "feeBps[method] becomes number | undefined, so the multiplication is an error; check for undefined and throw or return an error for an unknown method."
        feedback: Correct - the flag surfaces the missing-key case at compile time, and the fix handles it at runtime with a clear error.
      - id: bang
        text: The line errors; fix it with feeBps[method]! so it compiles.
        feedback: The non-null assertion only silences the checker - 'wallet' still gives NaN at runtime. It hides exactly the bug the flag found.
      - id: nothing
        text: Nothing changes - Record<string, number> promises a number for every key.
        feedback: That promise is what noUncheckedIndexedAccess stops trusting - it adds undefined to reads through an index signature.
      - id: strict-covers
        text: Nothing changes, because strict already includes noUncheckedIndexedAccess.
        feedback: It doesn't - noUncheckedIndexedAccess is a separate option, not part of the strict family.
    correct: [error-check]
    hints:
      - What type does the flag give `feeBps[method]`?
      - Does `!` change what happens at runtime?
    solution: |
      With the flag, `feeBps[method]` is `number | undefined`, so `amountMinor * feeBps[method]` no longer
      compiles - the checker has found the `'wallet'` bug. Fix it at runtime:

      ```typescript
      const bps = feeBps[method];
      if (bps === undefined) throw new Error(`No fee configured for method ${method}`);
      return Math.round((amountMinor * bps) / 10_000);
      ```

      Even better, if the methods are a fixed set, type them as a union and use
      `Record<'card' | 'bank', number>` - then an unknown method is rejected where the string first enters.
    followUp: |
      Rewrite the signature so that `fee('wallet', 1000)` is a **compile** error, and say where the runtime
      check must still live.

  - id: never-error
    type: mcq
    concept: ts-unions-narrowing
    skill: analysis
    title: Read the never error
    prompt: |
      After a teammate's change, the build fails with:

      ```plaintext
      src/feed.ts(31,26): error TS2345: Argument of type '{ type: "disputed"; paymentId: string; amountMinor: number; }' is not assignable to parameter of type 'never'.
      ```

      Line 31 is `default: return assertNever(event);` in the activity feed's switch. What happened and
      what is the right fix?
    options:
      - id: add-case
        text: A 'disputed' member was added to the PaymentEvent union and this switch has no case for it - add a case that renders disputes.
        feedback: Correct - the leftover type at the default is exactly the unhandled member, so the compiler is listing missing work.
      - id: cast
        text: assertNever is too strict - change its parameter to unknown so the build passes.
        feedback: That removes the exhaustiveness check for every switch, so the next missing case ships silently.
      - id: as-never
        text: Change the call to assertNever(event as never).
        feedback: An assertion only silences the checker; disputed events would now throw at runtime in production.
      - id: tsc-bug
        text: The type of event should already be never here - this is a TypeScript bug.
        feedback: The type is never only when every member is handled. The message names the member that still reaches the default.
    correct: [add-case]
    hints:
      - What does the message say the argument's type is?
      - Which cases does the switch handle?
    solution: |
      The `default` branch can be reached by a `disputed` event, so `event` is not `never` there.
      Someone added `disputed` to the union (good) and the compiler now lists every switch that must handle
      it. Add the case - do not weaken `assertNever`:

      ```typescript
      case 'disputed':
        return `${event.paymentId} disputed ${event.amountMinor}`;
      ```
    followUp: |
      The backend starts sending `disputed` a day before the new frontend is deployed. What does the old
      frontend do at line 31, and why is that better than a switch without `assertNever`?

  - id: add-status-order
    type: order
    concept: ts-unions-narrowing
    skill: application
    title: Adding a new event type safely
    prompt: Put the steps in the order that lets the compiler find every place that needs the new `disputed` event.
    items:
      - id: union
        text: Add the new member to the PaymentEvent discriminated union
      - id: tsc
        text: Run tsc --noEmit and list every exhaustiveness (never) error
      - id: cases
        text: Add a case for the new member in each reported switch
      - id: parse
        text: Accept the new type in the runtime parser for API responses
      - id: tests
        text: Add tests with a disputed event, including the unknown-type error path
    hints:
      - The compiler can only report missing cases after the type knows about the new member.
      - The runtime parser is checked by tests, not by tsc.
    solution: |
      Union first, then `tsc` gives you the to-do list, then fix each switch. The runtime parser must also
      accept the new type (or responses with it are rejected as invalid), and tests prove both the new path
      and the "unknown type" error path still work.

  - id: payment-events-coding
    type: coding
    concept: ts-unions-narrowing
    skill: application
    title: Fold payment events with an exhaustive switch
    prompt: |
      `applyEvent` folds the dashboard's payment events into one view per payment, and `describeEvent`
      writes a line for the activity feed. Both are stubs. Implement them with a `switch` on `event.type`
      that ends in `assertNever`, following the rules in the file's comments: captures can't exceed the
      authorized amount and refunds can't exceed the captured amount (both `RangeError`), the view is never
      mutated, and an event the code doesn't know throws.
    project: fullstack
    files:
      - exercises/ts/payment-events.ts
    test: tests/ts/payment-events.test.ts
    command: npx vitest run tests/ts/payment-events.test.ts
    hints:
      - "Inside `case 'refunded':` TypeScript already knows `event.reason` exists - hover it."
      - "Return a new object with spread: `{ ...current, status: 'captured', capturedMinor: event.amountMinor }`."
      - "For capture and refund, a small helper that throws when `view` is undefined (naming the payment id) keeps each case short."
      - "End both switches with `default: return assertNever(event);` - the test passes a fake event cast to PaymentEvent and expects \"Unexpected value\"."
    modelAnswer: |
      ```typescript
      export function applyEvent(view: PaymentView | undefined, event: PaymentEvent): PaymentView {
        switch (event.type) {
          case 'authorized':
            return { paymentId: event.paymentId, status: 'authorized',
                     authorizedMinor: event.amountMinor, capturedMinor: 0, refundedMinor: 0 };
          case 'captured': {
            const current = existing(view, event.paymentId);
            if (event.amountMinor > current.authorizedMinor)
              throw new RangeError(`Capture ${event.amountMinor} exceeds authorized ${current.authorizedMinor}`);
            return { ...current, status: 'captured', capturedMinor: event.amountMinor };
          }
          case 'refunded': {
            const current = existing(view, event.paymentId);
            const refundedMinor = current.refundedMinor + event.amountMinor;
            if (refundedMinor > current.capturedMinor)
              throw new RangeError(`Refunds ${refundedMinor} exceed captured ${current.capturedMinor}`);
            const status = refundedMinor === current.capturedMinor ? 'refunded' : 'partially_refunded';
            return { ...current, status, refundedMinor };
          }
          case 'failed':
            return { ...(view ?? { paymentId: event.paymentId, authorizedMinor: 0, capturedMinor: 0, refundedMinor: 0 }),
                     status: 'failed', failureCode: event.code };
          default:
            return assertNever(event);
        }
      }
      ```

      Each `case` sees a narrowed `event`, so `event.reason` and `event.code` are only available where they
      exist. The spread returns a new object, so the old view is untouched. `describeEvent` is the same
      switch returning strings - the full solution is in `solutions/ts/payment-events.ts`.
    rubric:
      - Every test in payment-events.test.ts passes
      - Both functions switch on the discriminant and end with assertNever(event) in the default branch
      - No any, no as casts on event, and no non-null assertions (!)
      - Adding a fifth member to PaymentEvent would make both functions fail to compile (try it, then undo)
    solution: |
      The tests check every rule: the initial view, partial and full refunds, no mutation, both
      `RangeError`s, unknown payments, failures with and without a view, the feed lines, and that an
      unknown event type reaches `assertNever`. If the last test fails, your default branch returns
      something instead of calling `assertNever` - which also means the compiler would not catch a new
      event type.
    followUp: |
      Add `{ type: 'disputed'; paymentId: string; amountMinor: number }` to the union in your copy and run
      `npx tsc --noEmit`. How many errors do you get, and where? Then remove it again.

  - id: utility-types-mcq
    type: mcq
    concept: ts-generics-utility-types
    skill: application
    title: Types for the payment API's requests
    prompt: |
      ```typescript
      interface Payment {
        id: string;
        merchantId: string;
        amountMinor: number;
        currency: 'EUR' | 'GBP';
        description: string;
        createdAt: string;
      }
      ```

      The server sets `id` and `createdAt`. A `PATCH /payments/:id` may change **only** `description`, and
      may leave it out. Which pair of types is right for the create body and the patch body?
    options:
      - id: omit-partial-pick
        text: "Omit<Payment, 'id' | 'createdAt'> and Partial<Pick<Payment, 'description'>>"
        feedback: Correct - the create body is everything except server-set fields, and the patch body is the one editable field, optional.
      - id: partial-all
        text: "Partial<Payment> for both"
        feedback: That lets a client send id, createdAt or amountMinor on a patch, and makes every create field optional - the types no longer describe the API's rules.
      - id: pick-required
        text: "Pick<Payment, 'id' | 'createdAt'> and Required<Payment>"
        feedback: Pick keeps only the listed keys - the create body would be just the server-set fields. And Required makes the patch need every field.
      - id: copies
        text: Two new interfaces with the fields copied from Payment
        feedback: It works today, but a rename in Payment no longer reaches the copies - deriving keeps them in step.
    correct: [omit-partial-pick]
    hints:
      - Which utility removes keys, and which keeps only some?
      - Which utility makes properties optional?
    solution: |
      `type CreatePayment = Omit<Payment, 'id' | 'createdAt'>` and
      `type PaymentPatch = Partial<Pick<Payment, 'description'>>`. Both are derived from `Payment`, so
      renaming a field updates them. Remember these are compile-time only - the API still has to reject a
      patch body that contains `amountMinor` at runtime.
    followUp: |
      Write the type of a lookup from currency to the total captured amount where **every** currency must
      be present, and the type where a currency may be missing.

  - id: as-debug
    type: debug
    concept: ts-runtime-boundary
    skill: analysis
    title: The refund total that became a string
    prompt: |
      The dashboard shows a refund total of `"01250300"` instead of `1550`. The API sometimes sends
      `amountMinor` as a string. `tsc` reports no errors. Click the line where the program first **trusts**
      data it never checked.
    language: typescript
    code: |
      interface Refund { paymentId: string; amountMinor: number }

      export async function loadRefunds(merchantId: string): Promise<Refund[]> {
        const response = await fetch(`/api/merchants/${merchantId}/refunds`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const refunds = (await response.json()) as Refund[];
        return refunds;
      }

      export function total(refunds: Refund[]): number {
        return refunds.reduce((sum, r) => sum + r.amountMinor, 0);
      }
    correctLines: [6]
    lineNotes:
      - line: 11
        note: This is where the wrong result appears - '0' + '1250' concatenates - but the line is correct for real numbers. The bad data got in earlier.
      - line: 1
        note: The interface correctly describes what the code needs. Types don't check data; the problem is where the data is claimed to match it.
      - line: 5
        note: Checking the HTTP status is right. A 200 response can still carry a body of the wrong shape.
    hints:
      - Where does the data's type change from any to Refund[]?
      - What does an as assertion check at runtime?
    solution: |
      **Line 6.** `response.json()` returns `any`, and `as Refund[]` tells the checker to trust it - but
      assertions are removed at compile time, so nothing checks that `amountMinor` is a number. From then on
      TypeScript believes the lie, and `sum + r.amountMinor` concatenates strings at line 11. Fix: assign the
      body to `unknown`, check each element (`typeof amountMinor === 'number'`), and show an error state for
      invalid data. Confirm by putting the API's real response in a test: the checker must reject it.
    followUp: |
      The API team says strings "can't happen any more". Would you remove the runtime check? What would you
      do instead to find out if it happens in production?

  - id: refund-requests-coding
    type: coding
    concept: ts-runtime-boundary
    skill: application
    title: Parse an unknown refund request into a Result
    prompt: |
      Implement `parseRefundRequest(input: unknown)` and the generic `groupBy` in
      `exercises/ts/refund-requests.ts`. The parser must narrow `unknown` step by step, report **every**
      problem (each message starting with its field name), return only known fields, and never use `any` or
      `as` on the whole input. `groupBy` must keep the key type, so grouping by a status union gives a
      `Partial<Record<Status, T[]>>`.
    project: fullstack
    files:
      - exercises/ts/refund-requests.ts
    test: tests/ts/refund-requests.test.ts
    command: npx vitest run tests/ts/refund-requests.test.ts
    hints:
      - "Start with `if (typeof input !== 'object' || input === null) return err(['body: must be an object']);`"
      - "After that check you can read properties through `input as Record<string, unknown>` - each value is still `unknown`, so you must check it."
      - "`Number.isSafeInteger(x) && x > 0` rejects decimals, NaN, Infinity and huge numbers in one go."
      - "In groupBy, `(groups[key] ??= []).push(item)` creates each array the first time a key is seen."
    modelAnswer: |
      ```typescript
      export function parseRefundRequest(input: unknown): Result<RefundRequest, string[]> {
        if (typeof input !== 'object' || input === null) return err(['body: must be an object']);
        const { paymentId, amountMinor, currency, reason } = input as Record<string, unknown>;
        const errors: string[] = [];
        if (typeof paymentId !== 'string' || !paymentId.startsWith('pay_'))
          errors.push('paymentId: must be a string starting with pay_');
        if (typeof amountMinor !== 'number' || !Number.isSafeInteger(amountMinor) || amountMinor <= 0)
          errors.push('amountMinor: must be a positive integer');
        if (!isCurrency(currency)) errors.push(`currency: must be one of ${CURRENCIES.join(', ')}`);
        if (reason !== undefined && (typeof reason !== 'string' || reason.length > 200))
          errors.push('reason: must be a string of at most 200 characters');
        if (errors.length > 0) return err(errors);
        const request: RefundRequest = { paymentId: paymentId as string,
          amountMinor: amountMinor as number, currency: currency as RefundRequest['currency'] };
        if (typeof reason === 'string') request.reason = reason;
        return ok(request);
      }
      ```

      The `as Record<string, unknown>` is safe - it only says "an object whose values are unknown", which the
      previous line proved. The casts when building the result are needed because TypeScript does not carry
      narrowing from the separate `errors.length` check; a version that builds the value inside the checks
      avoids them. `isCurrency` is a **type guard** (`value is ...`), so it narrows where it is used.
    rubric:
      - Every test in refund-requests.test.ts passes
      - The input is unknown all the way to the checks - no any, no as RefundRequest on the raw input
      - Collects every error, each naming its field; unknown fields are dropped from the result
      - groupBy is generic over T and K extends PropertyKey and returns Partial<Record<K, T[]>>
    solution: |
      The tests send a valid body with an extra `admin` field (it must be dropped), bodies that are not
      objects, a body with four wrong fields (four errors), and each wrong field on its own - including a
      decimal amount, a string amount and `2 ** 53`. `groupBy` is checked for order and for absent keys.
    followUp: |
      Change `parseRefundRequest` so that `currency` defaults to `'EUR'` when it is missing. Which tests
      would you add, and does the `RefundRequest` type change?

  - id: as-vs-satisfies
    type: short
    concept: ts-runtime-boundary
    skill: recall
    title: Annotation, satisfies or as?
    prompt: |
      For each, say which you would use - a type annotation, `satisfies`, or `as` - and why, in one sentence
      each: (1) the parameter of an exported function, (2) a constant lookup table of fee rates per payment
      method where you want typos caught but keep the exact keys, (3) the result of `JSON.parse` on a request
      body.
    hints:
      - Which of the three changes the inferred type, and which checks nothing at runtime?
    modelAnswer: |
      (1) An **annotation** - it is a contract for every caller and documents the API. (2) **`satisfies`** -
      it checks the table against the type (a misspelled method or a string rate is an error) but keeps the
      literal keys, so `fees.card` is known to exist. (3) **None of them**: assign it to `unknown` and check
      it at runtime; `as` would only silence the checker, and an annotation on an `any` value is equally
      unchecked.
    rubric:
      - Annotation for the function contract
      - satisfies for the lookup table, with the reason (checked but not widened)
      - Refuses as for JSON.parse and says to use unknown plus a runtime check
    solution: |
      The key distinction: annotations and `satisfies` are **checks by the compiler** on values it can see;
      `as` is a **claim** the compiler accepts. Outside data is never visible to the compiler, so only a
      runtime check helps.

  - id: interview-ts-migration
    type: interview
    concept: ts-structural-typing-inference
    skill: application
    title: "Interview: TypeScript on a full stack project"
    prompt: |
      *"Our React and Express app is in JavaScript and we are moving it to TypeScript. What compiler
      settings would you insist on, how would you model the API's data, and what does TypeScript still not
      protect us from?"*
    hints:
      - Settings first (strict and which extra flag), then types shared between client and server, then the runtime boundary.
    modelAnswer: |
      I'd start with `strict: true` - since TypeScript 6.0 that is the default, but I'd still write it
      explicitly - plus `noUncheckedIndexedAccess`, because lookups by id or currency are where we get
      `undefined` bugs. In an existing codebase I'd enable them folder by folder, and ban new `any` and
      `@ts-ignore` in review.

      For data, I'd define the domain once - for example payments as a discriminated union on `status` - and
      derive request and response shapes with `Pick`, `Omit` and `Partial` so a rename reaches every layer.
      Switches over statuses end with an `assertNever` check, so adding a status gives a compile error at
      every place that must handle it. Shared types live in a package both the client and server import.

      What it doesn't protect: anything at runtime. Request bodies, `fetch` responses, `localStorage` and
      environment variables are typed `unknown` and validated - I'd use a schema library like zod so the
      check and the type come from one definition. Types also don't check behaviour, so tests stay; and
      every `as` is a reviewed exception.
    rubric:
      - strict plus noUncheckedIndexedAccess, with a reason; mentions TS 6.0 default or explicit config
      - A gradual migration plan (per folder, no new any)
      - Discriminated unions and exhaustiveness for statuses; derived types for requests
      - Clear that types are erased - runtime validation at boundaries (unknown, schema library)
      - Treats as and any as exceptions that need justification
    followUps:
      - How would you share types between the React app and the Express API without duplicating them?
      - A teammate says zod makes TypeScript types redundant. How do you answer?
      - What is the difference between @ts-ignore and @ts-expect-error, and which would you allow?
    solution: |
      Strong answers connect settings to concrete bug classes, plan a gradual migration, and are explicit
      that TypeScript stops at the boundary - with a concrete runtime validation approach.

placement:
  - id: place-structural
    type: mcq
    concept: ts-structural-typing-inference
    skill: application
    title: Does it compile?
    prompt: |
      ```typescript
      interface Customer { id: string; email: string }
      const row = { id: 'cus_1', email: 'a@example.test', createdAt: '2026-11-14' };
      const c: Customer = row;
      ```

      With `strict` on, what happens?
    options:
      - id: compiles
        text: It compiles - row has every member Customer requires, and the extra one is allowed because row is not a fresh literal.
        feedback: Correct - structural typing, and the excess-property check only applies to object literals written in place.
      - id: name
        text: Error - row was never declared as a Customer.
        feedback: TypeScript compares shapes, not declarations or names.
      - id: excess
        text: Error - createdAt does not exist in type Customer.
        feedback: That error appears only when the literal is written directly in the assignment, not for a variable.
      - id: runtime
        text: It compiles, but TypeScript strips createdAt at runtime.
        feedback: TypeScript changes no values at runtime - c is the same object, createdAt included.
    correct: [compiles]
    solution: |
      Compatibility is structural, so `row` fits `Customer`. Extra members are only reported for fresh
      object literals. Nothing changes at runtime either way.

  - id: place-narrowing
    type: mcq
    concept: ts-unions-narrowing
    skill: application
    title: Make the switch exhaustive
    prompt: |
      `type Status = 'pending' | 'captured' | 'failed'`. Which `default` branch makes the compiler report a
      future fourth status that the switch does not handle?
    options:
      - id: never
        text: "default: { const unreachable: never = status; throw new Error(`Unknown status ${unreachable}`); }"
        feedback: Correct - assigning the leftover to never fails to compile as soon as any status is unhandled.
      - id: throw
        text: "default: throw new Error('Unknown status');"
        feedback: This only fails at runtime. The compiler is happy with a throw whatever is left over.
      - id: string
        text: "default: return String(status);"
        feedback: Any leftover status is quietly turned into text - no compile error and no runtime error.
      - id: none
        text: No default - TypeScript always reports a switch that misses a union member.
        feedback: A switch without a default is not checked for completeness by itself; only a never check (or a return type the missing path breaks) makes it an error.
    correct: [never]
    solution: |
      After every handled case is removed, `status` is `never`. Assigning it to a `never` variable (or
      passing it to `assertNever`) compiles only while every member is handled.

  - id: place-generics
    type: mcq
    concept: ts-generics-utility-types
    skill: application
    title: Keep the type through the helper
    prompt: |
      Which signature lets `const p = latest(payments)` give `p` the element type of `payments` (or
      `undefined` for an empty array)?
    options:
      - id: generic
        text: "function latest<T>(items: readonly T[]): T | undefined"
        feedback: Correct - T is inferred from the argument and linked to the result.
      - id: any
        text: "function latest(items: any[]): any"
        feedback: p would be any - every later mistake compiles.
      - id: unknown
        text: "function latest(items: unknown[]): unknown"
        feedback: Safe, but the caller must narrow p again - the link between input and output type is lost.
      - id: object
        text: "function latest(items: object[]): object | undefined"
        feedback: p would be object, so p.id is an error - the specific type is lost.
    correct: [generic]
    solution: |
      A type parameter carries the caller's type through the function. `any` loses checking; `unknown` and
      `object` lose the specific type.

  - id: place-boundary
    type: mcq
    concept: ts-runtime-boundary
    skill: analysis
    title: Is the body checked?
    prompt: |
      An Express handler does `const body = req.body as { amountMinor: number }` and then
      `charge(body.amountMinor)`. A client posts `{"amountMinor": "1000"}`. What happens?
    options:
      - id: string-flows
        text: charge receives the string "1000" - the assertion was removed at compile time and nothing checked the body.
        feedback: Correct - as checks nothing at runtime. The handler must narrow an unknown body itself.
      - id: rejected
        text: TypeScript rejects the request because amountMinor is not a number.
        feedback: TypeScript does not exist at runtime - its types are erased before the server runs.
      - id: converted
        text: The assertion converts "1000" to the number 1000.
        feedback: Assertions never convert values. They only change what the compiler believes.
      - id: compile
        text: The code doesn't compile, because req.body could be anything.
        feedback: The as assertion is exactly what makes it compile - that's the danger.
    correct: [string-flows]
    solution: |
      Type assertions are erased; the string flows into `charge`. Type the body `unknown` and check it (by
      hand or with a schema library), returning 400 with field errors when it is wrong.

recall:
  - id: recall-structural
    concept: ts-structural-typing-inference
    prompt: What decides whether a value is assignable to a type in TypeScript?
    answer: Its structure - it must have the members the type requires, with compatible types (structural subtyping). Names don't matter; fresh object literals also get an excess-property check.
  - id: recall-unchecked-index
    concept: ts-structural-typing-inference
    prompt: What does noUncheckedIndexedAccess change, and is it part of strict?
    answer: Reads through an index signature or array index get undefined added to their type, so missing keys must be handled. It is a separate option, not part of strict.
  - id: recall-ts6-defaults
    concept: ts-structural-typing-inference
    prompt: Which defaults changed in TypeScript 6.0 that matter for a new project?
    answer: strict is true by default, module defaults to esnext, target to the current ECMAScript version, and types defaults to [] - so @types/node and test globals must be listed.
  - id: recall-discriminant
    concept: ts-unions-narrowing
    prompt: What is a discriminated union?
    answer: A union whose members share a literal-typed property (such as type or status); checking that property narrows the value to exactly one member.
  - id: recall-never
    concept: ts-unions-narrowing
    prompt: How do you make the compiler prove a switch handles every union member?
    answer: In the default branch pass the value to a parameter of type never (assertNever). It compiles only if nothing is left; it also throws at runtime for unexpected data.
  - id: recall-utility
    concept: ts-generics-utility-types
    prompt: Which utility types give a create body without server-set fields, and an optional subset for a patch?
    answer: Omit<T, 'id' | 'createdAt'> for the create body; Partial<Pick<T, 'editable' | 'fields'>> for the patch.
  - id: recall-unknown-any
    concept: ts-runtime-boundary
    prompt: Why prefer unknown to any for outside data?
    answer: any turns checking off, so mistakes compile; unknown must be narrowed before use, which forces the runtime checks outside data needs.
  - id: recall-satisfies
    concept: ts-runtime-boundary
    prompt: How do satisfies and as differ?
    answer: satisfies checks a value against a type and keeps its precise inferred type; as only tells the compiler to treat the value as the type - it checks nothing at runtime and accepts most plausible mistakes.

