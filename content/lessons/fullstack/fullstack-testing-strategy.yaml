id: fullstack-testing-strategy
title: Testing a full stack app
subject: fullstack
module: quality-and-delivery
level: intermediate
status: published
estimatedMinutes: 70
summary: The developer's side of testing a React, Express and PostgreSQL app - which layer catches which bug, the portfolio models (pyramid, trophy, honeycomb) and what they really say, test doubles in Vitest, isolation and flaky tests, and why 100% coverage can still let every bug through. Every test run shown here is real.
tags:
  [
    testing strategy,
    test pyramid,
    testing trophy,
    testing honeycomb,
    unit tests,
    integration tests,
    component tests,
    end-to-end tests,
    Testing Library,
    supertest,
    PGlite,
    Testcontainers,
    test doubles,
    mocks,
    stubs,
    spies,
    fakes,
    vi.fn,
    vi.mock,
    fake timers,
    MSW,
    flaky tests,
    test isolation,
    code coverage,
    mutation testing,
    vitest,
  ]

environment: |
  - **Runtime and tools:** **Node.js 24** (v24.21.0, from this repository's `.nvmrc`), **Vitest 5.0.3**, React
    Testing Library 16.3, supertest 7.3 and **PGlite 0.5.14** (PostgreSQL 18.6 compiled to WebAssembly) - the
    versions pinned in `practice/fullstack`. The coverage run used `@vitest/coverage-v8` 5.0.3 in a scratch
    project, not in the practice project. Every test run and output in this lesson was captured on Linux in
    November 2026; durations will differ on your machine.
  - **Portfolio models (practitioner models, not standards):** Martin Fowler, [Test
    Pyramid](https://martinfowler.com/bliki/TestPyramid.html) (1 May 2012), which credits Mike Cohn's "Test
    Automation Pyramid" in *Succeeding with Agile* (2009); Ham Vocke, [The Practical Test
    Pyramid](https://martinfowler.com/articles/practical-test-pyramid.html) (26 February 2018); Kent C. Dodds,
    [The Testing Trophy and Testing
    Classifications](https://kentcdodds.com/blog/the-testing-trophy-and-testing-classifications) (3 June 2021);
    André Schaffer and Rickard Dybeck (Spotify), [Testing of
    Microservices](https://engineering.atspotify.com/2018/01/testing-of-microservices) (11 January 2018), which
    introduces the testing honeycomb.
  - **Test double vocabulary:** Gerard Meszaros, *xUnit Test Patterns: Refactoring Test Code* (Addison-Wesley,
    2007) and [xunitpatterns.com - Test Double](http://xunitpatterns.com/Test%20Double.html); Martin Fowler,
    [TestDouble](https://martinfowler.com/bliki/TestDouble.html) (17 January 2006) and [Mocks Aren't
    Stubs](https://martinfowler.com/articles/mocksArentStubs.html) (2 January 2007).
  - **Vitest documentation:** [Vi API](https://vitest.dev/api/vi.html) (`vi.fn`, `vi.spyOn`, `vi.mock` is hoisted,
    `vi.useFakeTimers`, `vi.advanceTimersByTimeAsync`), [Mocking timers](https://vitest.dev/guide/mocking/timers),
    [Mocking requests](https://vitest.dev/guide/mocking/requests) (recommends MSW),
    [Coverage](https://vitest.dev/guide/coverage.html) (v8 is the default provider) and the recipe [Database
    transaction per test](https://vitest.dev/guide/recipes/db-transaction). Test order shuffling uses the CLI
    options `--sequence.shuffle` and `--sequence.seed`.
  - **Other tools:** Testing Library, [About queries - Priority](https://testing-library.com/docs/queries/about);
    Playwright, [Best practices](https://playwright.dev/docs/best-practices);
    [Testcontainers](https://testcontainers.com/) and [Mock Service Worker](https://mswjs.io/) (described from their
    own home pages, not installed here); [Stryker Mutator - What is mutation
    testing?](https://stryker-mutator.io/docs/) (described, not run - the mutants in the practice exercises are
    written by hand).
  - **Fictional:** SandPay, its merchant dashboard, refund rules (the 180-day window), reminder e-mails and every
    id, address and amount. Amounts are integer minor units (2500 is 25.00).
  - **Not repeated here:** test design techniques ([Equivalence partitioning, boundaries and decision
    tables](#/lesson/test-design-techniques)), risk ([Risk-based testing](#/lesson/risk-based-testing)), contract
    testing ([Schema and contract validation](#/lesson/schema-and-contract-validation), [Contract-first APIs with
    OpenAPI](#/lesson/openapi-contract-first)), Playwright itself ([Playwright locators and
    assertions](#/lesson/playwright-locators-and-assertions)) and pipelines ([CI pipelines and quality
    gates](#/lesson/ci-quality-gates)).

prerequisites:
  - react-components-and-jsx
  - express-http-server
  - test-design-techniques

concepts:
  - id: test-portfolio-and-layers
    name: A test portfolio across the layers of the stack
    summary: Unit, component, API-with-database, contract and end-to-end tests each catch different bugs at different costs. The pyramid, trophy and honeycomb are practitioner models that agree on one thing - many fast, focused tests and few slow, broad ones - and disagree mostly about what to call the middle. Choose the lowest layer that can see the bug.
  - id: test-doubles-and-vitest-mocks
    name: Test doubles and Vitest's mocking tools
    summary: A test double replaces a real dependency - a dummy fills a parameter, a stub returns canned answers, a spy also records calls, a mock is pre-programmed with expectations, a fake is a working shortcut such as an in-memory repository. In Vitest, vi.fn and vi.spyOn make spies, vi.mock replaces a module (and is hoisted), and fake timers control setTimeout, setInterval and Date. A fake earns trust only by passing the same contract tests as the real thing.
  - id: test-isolation-and-flakiness
    name: Test isolation, test data and flaky tests
    summary: Every test must set up what it needs and leave nothing behind - its own data, a fresh database or a rolled-back transaction, real timers restored. Shared state, real clocks, test order, network calls and races make tests flaky; shuffling the order and replaying a seed turns "sometimes" into a reproducible failure.
  - id: test-suite-effectiveness
    name: Measuring whether tests catch bugs
    summary: Coverage shows which code ran, not whether any assertion would notice a mistake there - a suite with 100% coverage can let every bug through. Mutation testing (killing deliberately broken versions) measures what coverage cannot. Run fast, reliable tests on every commit and the slow, broad ones on merge or nightly.

objectives:
  - Choose the lowest test layer that can catch a given bug in a React, Express and PostgreSQL app, and explain the cost of choosing a higher one.
  - Explain what the test pyramid, testing trophy and testing honeycomb each recommend, who proposed them and what they agree on.
  - Name the five kinds of test double, pick the right one for a dependency, and write spies, module mocks and fake-timer tests with Vitest.
  - Design tests that stay isolated - test data per test, a rolled-back transaction or fresh database, restored timers - and diagnose an order-dependent flaky test with a shuffle seed.
  - Explain why line coverage does not measure a suite's ability to find bugs, and write table-driven cases that kill deliberately broken versions of the code.
  - Decide which tests run on every commit, on every merge and nightly.

sections:
  - id: intuition
    kind: intuition
    concepts: [test-portfolio-and-layers]
    title: The idea in plain language
    body: |
      Think of checking a **restaurant**. You can taste each sauce as it is made (cheap, quick, and you know
      exactly which pot is wrong). You can plate a whole dish in the kitchen and taste it (slower, but it
      catches a sauce that is fine alone and wrong with the fish). Or you can sit a customer down, order from
      the menu, wait for the waiter and eat (the only check that proves the whole evening works - and the
      slowest, the most expensive, and when it goes wrong you don't know if it was the cook, the waiter or the
      till).

      A good restaurant does **all three**, in very different amounts: hundreds of sauce tastings, some plated
      dishes, a few full dinners. A full stack app is the same:

      - **unit tests** taste one function or reducer;
      - **component and API tests** plate a dish - a React component in a simulated browser, an Express route
        with a real database behind it;
      - **end-to-end tests** are the customer's dinner - a real browser against the deployed stack.

      As a tester you have spent years mostly at the dinner table. This lesson is about the kitchen: what
      developers test where, and how to tell a suite that **catches bugs** from one that merely runs.

  - id: what
    kind: what
    concepts: [test-portfolio-and-layers, test-doubles-and-vitest-mocks]
    title: The layers of a React, Express and PostgreSQL app
    body: |
      Names vary between teams (Ham Vocke's advice is "don't become too attached to the names of the
      individual layers"), so here is what each layer **means in this course's stack** and what it can see:

      | Layer | What runs | Typical tool here | Catches | Cannot see |
      | --- | --- | --- | --- | --- |
      | **Static** | type checker, linter | `tsc`, ESLint | wrong types, unused code, `any`, typos in names | anything at runtime |
      | **Unit** | one function, reducer or hook, no I/O | Vitest | calculation, boundary and state-transition bugs | wiring between parts |
      | **Component** | a React component in jsdom | Vitest + Testing Library | rendering, user interaction, accessible names, loading and error states | the real API, real browser layout |
      | **API / integration** | an Express app in memory, a real database | Vitest + supertest + PGlite (or Testcontainers) | routing, validation, status codes, SQL, constraints, transactions | the React UI |
      | **Contract** | requests and responses against the agreed schema | Ajv against the OpenAPI document, or Pact | the two sides drifting apart | behaviour behind the schema |
      | **End-to-end** | the deployed app in a real browser | Playwright | the critical journeys working through every layer | *why* something failed |

      A **test double** (Meszaros's term, "think stunt double" in Fowler's words) is anything that stands in
      for a real dependency in a test - a fake mailer, a stubbed processor, an in-memory repository. Doubles
      are what let the lower layers run without the whole world.

      Two more terms you'll meet:

      - **Integrated test** - in the Spotify article (quoting J. B. Rainsberger), "a test that will pass or fail
        based on the correctness of **another** system". It is different from an integration test of *your*
        service with its own database.
      - **Flaky test** - one that passes and fails on the same code. It is a bug in the test or the system,
        never "just CI".

  - id: why
    kind: why
    concepts: [test-portfolio-and-layers, test-suite-effectiveness]
    title: Why the developer's test strategy matters to a tester
    body: |
      - **Speed decides behaviour.** The practice project's whole API test suite runs in a few seconds; one
        Playwright journey takes several. Developers run fast tests on every save and slow ones rarely - so a
        bug that only an end-to-end test can see is found hours or days later.
      - **Diagnosis.** A failing unit test names the function; a failing end-to-end test says "the refund
        button didn't show the success message" and leaves you to find which of six layers broke - exactly the
        defect isolation work of [Defect isolation decision trees](#/lesson/defect-isolation-decision-trees).
      - **Brittleness.** Fowler's summary of tests through the UI: "brittle, expensive to write, and time
        consuming to run". An ice-cream cone (mostly UI tests, few unit tests) slows every release.
      - **False confidence.** A green suite with high coverage feels safe. Later in this lesson a suite with
        **100% coverage** lets **seven out of seven** deliberately broken versions of the refund rules pass.
      - **Your role.** In an interview for a full stack or SDET role you will be asked "how would you test
        this app?" The answer is a portfolio with reasons, not "write Selenium tests".

  - id: models
    kind: internals
    concepts: [test-portfolio-and-layers]
    title: Pyramid, trophy, honeycomb - what each model really says
    body: |
      These are **practitioner models** - heuristics from experienced engineers, not standards. Quote them
      accurately:

      **The test pyramid.** Mike Cohn described the "Test Automation Pyramid" in *Succeeding with Agile*
      (2009); Martin Fowler's 2012 bliki entry made it widely known. Its "essential point is that you should
      have many more low-level UnitTests than high level BroadStackTests running through a GUI". Fowler adds a
      caveat people forget: the pyramid assumes broad tests are slow, brittle and expensive - "If my high
      level tests are fast, reliable, and cheap to modify - then lower-level tests aren't needed." Ham Vocke's
      *Practical Test Pyramid* (2018) reduces it to two rules: write tests with different granularity, and the
      more high-level you get, the fewer tests you should have.

      **The testing trophy.** Kent C. Dodds (2018, explained again in 2021) drew a trophy for JavaScript
      applications: a base of **static** checks, a small band of **unit** tests, the biggest band for
      **integration** tests and a small top of **end-to-end** tests - "a general guide for the return on
      investment" where return is confidence and investment is time. It grew from his post "Write tests. Not
      too many. Mostly integration."

      **The testing honeycomb.** Spotify's engineers (2018) argued that for **microservices**, which are small
      by definition, the interesting complexity is in the interactions, so most tests should be integration
      tests of one service with its real dependencies, a few implementation-detail tests, and "even fewer
      Integrated Tests (ideally none)".

      **What they agree on** is more useful than where they differ:

      1. Have tests at several granularities, not one kind.
      2. Have **few** broad tests through the UI or across services - they are slow, flaky and hard to diagnose.
      3. Prefer tests that check **behaviour** a user or caller sees over tests of internals (Testing Library's
         and Playwright's guidance say the same).

      Much of the disagreement is vocabulary - Fowler notes that a preference for "more integration tests"
      is "probably illusory due to different definitions of 'unit test'". A React component test with
      Testing Library is a "unit" test to some teams and an "integration" test to Dodds. Decide your team's
      definitions, then argue about proportions.

  - id: visual-layer-choice
    kind: visual
    concepts: [test-portfolio-and-layers]
    title: Choose the lowest layer that can see the bug
    body: |
      ```mermaid
      flowchart TD
        A[A behaviour or bug to cover] --> B{Pure logic - a calculation, rule, reducer?}
        B -- yes --> U[Unit test - Vitest]
        B -- no --> C{What the user sees or does in one component?}
        C -- yes --> CT[Component test - Testing Library in jsdom]
        C -- no --> D{Routing, validation, SQL, constraints, transactions?}
        D -- yes --> API[API test - supertest with a real database]
        D -- no --> E{The agreement between client and server?}
        E -- yes --> CO[Contract test - schema or Pact]
        E -- no --> F{A critical journey that crosses every layer?}
        F -- yes --> E2E[One end-to-end test - Playwright]
        F -- no --> R[Ask again - or explore it by hand]
      ```

      Walk down from the top and stop at the **first** yes. Notice that end-to-end is the last resort, not the
      default: it is chosen for a journey's *integration risk*, after the details have been pinned lower down.

  - id: layers-code
    kind: code
    concepts: [test-portfolio-and-layers]
    title: One feature, three layers - real tests from the practice project
    collapsed: true
    body: |
      The practice project already has tests at each lower layer. Read them as examples of *what* each layer
      asserts (excerpts; the full files are in `practice/fullstack/tests`).

      **Unit** - a discriminated-union reducer, no I/O (`tests/ts/payment-events.test.ts`):

      ```typescript
      test('authorized starts a view with nothing captured or refunded', () => {
        expect(applyEvent(undefined, { type: 'authorized', paymentId: 'pay_1', amountMinor: 5000 })).toEqual({
          paymentId: 'pay_1',
          status: 'authorized',
          authorizedMinor: 5000,
          capturedMinor: 0,
          refundedMinor: 0,
        });
      });
      ```

      **Component** - render, act like a user, find fields by role and accessible name
      (`tests/react-forms/refund-form.test.tsx`; `setup()` renders the form with `userEvent.setup()` and
      returns `screen.getByRole('textbox', { name: 'Amount (EUR)' })` and the other fields):

      ```typescript
      it('an empty submit shows both errors, marks the fields invalid, focuses the first and sends nothing', async () => {
        const { api, user, amount, reason, button } = setup();
        await user.click(button);
        expect(api.calls).toHaveLength(0);
        expect(amount.getAttribute('aria-invalid')).toBe('true');
        expect(reason.getAttribute('aria-invalid')).toBe('true');
        expect(screen.getByText('Enter the amount to refund.')).toBeTruthy();
      ```

      **API** - the Express app in memory with supertest, no port (`tests/express/orders-app.test.ts`; the
      database tests in `tests/sql` and `tests/transactions` do the same against PGlite):

      ```typescript
      test('POST /orders creates an order: 201, Location header and the order in the body', async () => {
        const store = memoryStore([paid]);
        const res = await request(createOrdersApp(store))
          .post('/orders')
          .send({ amountMinor: 1250, currency: 'EUR' });
        expect(res.status).toBe(201);
        expect(res.headers.location).toBe('/orders/ord_1002');
      ```

      (Excerpts - the files have the imports, helpers and the rest of each test.)

      What each layer chose **not** to test is as important. The reducer test doesn't render anything; the
      component test doesn't start Express - its `onSubmit` is a spy; the API test doesn't open a browser. The
      one Playwright journey that ties them together lives in `practice/playwright` (see [Network mocking and
      API testing with Playwright](#/lesson/playwright-network-and-api)).

      **Testing Library's query priority** (from its docs, "About Queries"): `getByRole` - "your top preference
      for just about everything" - then `getByLabelText`, `getByPlaceholderText`, `getByText`,
      `getByDisplayValue`; then the semantic queries `getByAltText` and `getByTitle`; and last `getByTestId`,
      because "the user cannot see (or hear) these". If you can't find an element by role, the docs add, "it's
      possible your UI is inaccessible" - the same lesson as [Accessibility with WCAG 2.2 and
      ARIA](#/lesson/web-accessibility-wcag).

      **A real PostgreSQL in tests.** PGlite runs PostgreSQL 18.6 inside the Node process, so every test can
      have its own database in milliseconds. When you need the exact server binary, extensions or several
      connections, [Testcontainers](https://testcontainers.com/) is "an open source library for providing
      throwaway, lightweight instances of databases, message brokers, web browsers, or just about anything
      that can run in a Docker container" - it needs Docker on the machine and in CI.

  - id: doubles
    kind: internals
    concepts: [test-doubles-and-vitest-mocks]
    title: The five test doubles, and which one you need
    body: |
      Meszaros's vocabulary, in Fowler's wording:

      | Double | What it does | SandPay example |
      | --- | --- | --- |
      | **Dummy** | "passed around but never actually used" - fills a parameter list | a logger argument a code path never touches |
      | **Stub** | "provide canned answers to calls made during the test" | a processor client that always answers `{ status: 'DECLINED' }` |
      | **Spy** | a stub that also "record[s] some information based on how they were called" | a mailer `vi.fn()` - afterwards you read `send.mock.calls` |
      | **Mock** | "pre-programmed with expectations" and checked during verification | a strict mock that fails on any call it did not expect |
      | **Fake** | "actually have working implementations, but usually take some shortcut" | an in-memory `PendingOrders` repository |

      Fowler's *Mocks Aren't Stubs* separates two questions. **State verification** asks "is the result
      right?" - after the refund, is the remaining amount 3500? **Behaviour verification** asks "did the code
      make the right calls?" - was `mailer.send` called once with this message? Prefer state verification;
      use behaviour verification for side effects that leave no state you can read, such as an e-mail sent
      or an event published.

      **Choosing:**

      - Don't double what is fast and deterministic. Your own pure functions and a PGlite database are cheap -
        use the real thing.
      - Double what is slow, costly, random or outside your control: a card processor, an e-mail provider, the
        clock, `Math.random`, another team's service.
      - Prefer a **fake** for something with behaviour (a repository) and a **spy** for something you only call
        (a mailer).
      - **Verify the fake.** A fake that behaves differently from production makes every test that uses it
        lie. Run the **same contract tests** against the fake and the real implementation - the second
        practice exercise does exactly this with PostgreSQL and an in-memory repository.

      In Vitest (checked against the Vi API docs for 5.0):

      - `vi.fn(impl?)` "creates a spy on a function"; it "stores its call arguments, returns, and instances".
      - `vi.spyOn(object, 'method')` wraps an existing method; `vi.restoreAllMocks()` puts originals back.
      - `vi.mock(path, factory)` replaces a whole module for the test file. "The call to `vi.mock` is hoisted"
        - it runs before every import, whatever line it is written on.
      - `vi.useFakeTimers()` fakes `setTimeout`, `setInterval` and `Date`; `vi.advanceTimersByTime(ms)` and
        its `Async` form fire due timers; `vi.useRealTimers()` restores them.
      - For HTTP calls, Vitest's own docs recommend [Mock Service Worker](https://mswjs.io/), "an API mocking
        library that allows you to write client-agnostic mocks" - it intercepts requests, so the code under
        test keeps calling the real `fetch`. Stubbing `globalThis.fetch` with `vi.fn` (as the practice
        project's API-client exercise does) is the simpler alternative for a single client.

  - id: doubles-code
    kind: code
    concepts: [test-doubles-and-vitest-mocks]
    title: Spies, a module mock and fake timers - real runs
    body: |
      **A spy and fake timers.** Fake timers move the clock as well as the timers:

      ```typescript
      import { expect, test, vi } from 'vitest';

      test('fake timers move the clock as well as the timers', () => {
        vi.useFakeTimers({ now: Date.UTC(2026, 10, 14, 9, 0, 0) });
        const remind = vi.fn();
        setTimeout(() => remind(new Date().toISOString()), 30 * 60_000);

        vi.advanceTimersByTime(30 * 60_000 - 1);
        expect(remind).not.toHaveBeenCalled();
        vi.advanceTimersByTime(1);
        expect(remind).toHaveBeenCalledTimes(1);
        console.log(remind.mock.calls);
        vi.useRealTimers();
      });
      ```

      ```plaintext
      $ npx vitest run demo/timers.test.ts --reporter=verbose --silent=false
      stdout | demo/timers.test.ts > fake timers move the clock as well as the timers
      [ [ '2026-11-14T09:30:00.000Z' ] ]

       ✓ demo/timers.test.ts > fake timers move the clock as well as the timers 14ms
      ```

      Thirty minutes passed in 14 milliseconds, and the boundary was tested to the millisecond: nothing at
      29:59.999, one call at 30:00.000.

      **A module mock - and the hoisting trap.** `checkout.ts` imports `sendReceipt` from `mailer.ts`, which
      would really send e-mail. This test looks reasonable:

      ```typescript
      import { expect, test, vi } from 'vitest';
      import { completeOrder } from './checkout.js';

      const fakeSend = vi.fn(async () => {});
      vi.mock('./mailer.js', () => ({ sendReceipt: fakeSend }));
      ```

      ```plaintext
       FAIL  demo/hoist-broken.test.ts [ demo/hoist-broken.test.ts ]
      Error: [vitest] There was an error when mocking a module. If you are using "vi.mock" factory, make sure
      there are no top level variables inside, since this call is hoisted to top of the file.
      ...
      Caused by: ReferenceError: Cannot access 'fakeSend' before initialization
      ```

      `vi.mock` was moved above the imports, so when `checkout.ts` imported the mailer, the factory ran
      before `const fakeSend` existed. Create the spy **inside** the factory and reach it through the import:

      ```typescript
      import { expect, test, vi } from 'vitest';
      import { completeOrder } from './checkout.js';
      import { sendReceipt } from './mailer.js';

      vi.mock('./mailer.js', () => ({ sendReceipt: vi.fn(async () => {}) }));

      test('sends a receipt', async () => {
        await expect(completeOrder('ord_a')).resolves.toBe('ord_a:PAID');
        expect(sendReceipt).toHaveBeenCalledWith('ord_a');
        console.log(vi.mocked(sendReceipt).mock.calls);
      });
      ```

      ```plaintext
      stdout | demo/hoist-fixed.test.ts > sends a receipt
      [ [ 'ord_a' ] ]

       ✓ demo/hoist-fixed.test.ts > sends a receipt 8ms
      ```

      (For a variable the factory really must share, the Vitest docs point to `vi.hoisted`.) Module mocks are
      powerful and blunt: they replace the module for the **whole file** and couple the test to the import
      path. Passing the dependency in - `createReminderService({ orders, mailer })` - needs no module mock at
      all, which is why the practice code is written that way.

  - id: isolation
    kind: internals
    concepts: [test-isolation-and-flakiness]
    title: Isolation, test data and where flaky tests come from
    body: |
      Playwright's best-practice guide puts the rule plainly: "Each test should be completely isolated from
      another test and should run independently". The same holds at every layer. A test is isolated when you
      can run it **alone, in any order, in parallel, twice** and get the same result.

      **Test data.** Build what each test needs inside the test, with a **builder** that fills sensible
      defaults so the test states only what matters:

      ```typescript
      const order = (id: string, createdAt: number, extra: Partial<PendingOrder> = {}): PendingOrder => ({
        id, customerEmail: `${id}@customer.example`, createdAt, status: 'PENDING', reminded: false, ...extra,
      });
      await repo.add(order('ord_paid', T - 1000, { status: 'PAID' }));
      ```

      Unique ids per test (or per worker) matter as soon as tests share anything - the same lesson as
      [Parallel runs and thread safety](#/lesson/parallel-runs-and-thread-safety) for Java.

      **The database.** Three ways to give each test a clean one, cheapest first in this stack:

      1. **A fresh database per test file or test** - with PGlite this is `new PGlite()` and a schema script.
      2. **A transaction per test, rolled back afterwards** - nothing ever commits. The Vitest docs have a
         recipe for it ("Database transaction per test"); it needs the code under test to use the same
         connection, and it can't test code that commits or uses several connections.
      3. **Truncate tables between tests** - works with any database, slowest, and parallel files must not
         share the tables.

      **The usual causes of flaky tests:**

      | Cause | Symptom | Fix |
      | --- | --- | --- |
      | Shared state (module variables, a shared DB, a singleton) | passes alone, fails in the suite or in another order | build state per test; reset in `afterEach`; roll back |
      | Real time (`Date.now()`, `setTimeout`, "sleep 2 s") | fails near midnight, at month end, on a slow CI runner | fake timers and an injected clock; wait for conditions, not durations |
      | Order dependence | fails only when tests are shuffled, filtered or run in parallel | shuffle with a seed; make each test self-contained |
      | Real network or third parties | fails when the sandbox is slow or down | stub at the boundary (MSW, a fake); Playwright's guide: "Only test what you control" |
      | Races in the code | fails one run in fifty | a real bug - reproduce with a loop; see [Transactions, isolation and concurrency](#/lesson/transactions-and-isolation) |
      | Timers or mocks not restored | the *next* test fails strangely | `afterEach(() => { vi.useRealTimers(); vi.restoreAllMocks(); })` |

      A flaky test is either a bug in the test or a bug in the product - both deserve a ticket. Quarantining
      it without one is how real races reach production.

  - id: isolation-code
    kind: code
    concepts: [test-isolation-and-flakiness]
    title: An order-dependent test, caught by shuffling - and a rolled-back transaction
    body: |
      Two tests share one module-level array:

      ```typescript
      const refunds: number[] = [];

      test('starts with no refunds', () => {
        expect(refunds).toEqual([]);
      });

      test('records a refund', () => {
        refunds.push(2500);
        expect(refunds).toEqual([2500]);
      });
      ```

      Run in file order they pass. Vitest can shuffle the order, and a seed makes a shuffle repeatable:

      ```plaintext
      $ npx vitest run demo/shared-state.test.ts
            Tests  2 passed (2)
      $ for seed in 1 2 3 4 5; do npx vitest run demo/shared-state.test.ts --sequence.shuffle --sequence.seed=$seed; done
      seed 1:  Tests 2 passed (2)
      seed 2:  Tests 2 passed (2)
      seed 3:  AssertionError: expected [ 2500 ] to deeply equal []   Tests 1 failed | 1 passed (2)
      seed 4:  Tests 2 passed (2)
      seed 5:  Tests 2 passed (2)
      ```

      (Output shortened to one line per seed.) That is what a flaky test looks like from outside: four
      passes and one failure on unchanged code. The seed turns it into a reproducible failure -
      `--sequence.seed=3` fails every time - and the cause is the shared array, not the CI machine.

      The same two tests against PostgreSQL, each wrapped in a transaction that is rolled back:

      ```typescript
      const db = new PGlite();
      beforeAll(async () => {
        await db.exec('CREATE TABLE refunds (id serial PRIMARY KEY, amount_minor bigint NOT NULL)');
      });
      beforeEach(async () => {
        await db.exec('BEGIN');
      });
      afterEach(async () => {
        await db.exec('ROLLBACK'); // nothing a test writes survives it
      });
      ```

      ```plaintext
      seed 1:  Tests  2 passed (2)
      seed 2:  Tests  2 passed (2)
      seed 3:  Tests  2 passed (2)
      seed 4:  Tests  2 passed (2)
      seed 5:  Tests  2 passed (2)
      ```

      Passing in every order is the evidence of isolation that a single green run never gives.

  - id: effectiveness
    kind: internals
    concepts: [test-suite-effectiveness]
    title: Coverage measures what ran, not what was checked
    body: |
      Here are four tests for the refund rules of the first practice exercise - one test per branch:

      ```typescript
      test('rejects a negative amount', () => {
        expect(decideRefund({ capturedMinor: 10000, refundedMinor: 0, requestedMinor: -5, paymentAgeDays: 3 }).ok).toBe(false);
      });
      test('rejects an old payment', () => { /* paymentAgeDays: 400 -> ok false */ });
      test('rejects too much', () => { /* requestedMinor: 99999 -> ok false */ });
      test('accepts a normal refund', () => { /* requestedMinor: 2500 -> ok true */ });
      ```

      With Vitest's default v8 coverage:

      ```plaintext
      $ npx vitest run --coverage --coverage.include=src
       Test Files  1 passed (1)
            Tests  4 passed (4)

       % Coverage report from v8
      No files with missing coverage.
      1 file fully covered.

      =============================== Coverage summary ===============================
      Statements   : 100% ( 9/9 )
      Branches     : 100% ( 8/8 )
      Functions    : 100% ( 1/1 )
      Lines        : 100% ( 7/7 )
      ================================================================================
      ```

      Now the same four inputs against seven broken versions of `decideRefund`, each with one realistic bug
      (they are the mutants the first exercise uses):

      ```plaintext
      SURVIVED accepts a zero amount (< 0 instead of <= 0)
      SURVIVED accepts fractions of a minor unit (no whole-number check)
      SURVIVED closes the window one day early (>= instead of >)
      SURVIVED forgets earlier refunds (refundable = captured)
      SURVIVED rejects refunding exactly what is left (>= instead of >)
      SURVIVED reports the remainder before this refund (forgot to subtract it)
      SURVIVED checks the amount before the window (wrong order of rules)
      ```

      **Every** bug passes a suite with 100% statement, branch, function and line coverage. The inputs sit far
      from every boundary, they never combine two rules, and they assert only `ok` - never the reason or the
      remainder.

      What coverage **does** tell you: code that **no** test runs. An uncovered branch is certainly untested;
      a covered one may be untested too. Use coverage to find gaps, never as proof of quality, and be wary of
      a coverage target that rewards tests with no assertions.

      **Mutation testing** measures what coverage cannot. Stryker's docs describe it: bugs ("mutants") are
      inserted into the code, the tests run against each one, "if your tests fail then the mutant is
      killed", and "the higher the percentage of mutants killed, the more effective your tests are".
      StrykerJS automates this for JavaScript and TypeScript; it is slow (the suite runs once per mutant), so
      teams run it on a module or nightly, not on every commit. The practice exercise uses hand-written
      mutants so you can see each bug.

  - id: when-to-run
    kind: steps
    concepts: [test-suite-effectiveness, test-portfolio-and-layers]
    title: What to run when
    body: |
      A suite is only useful if it runs at the moment a mistake is cheapest to fix. One workable split for
      this stack (adapt the times to your project):

      1. **On save, locally** - `vitest` in watch mode runs the tests related to changed files; `tsc` in the
         editor. Seconds.
      2. **On every push and pull request** - type check, lint, all unit, component, API and contract tests,
         against PGlite or a container database. Minutes; blocks the merge (a required check - see [CI
         pipelines and quality gates](#/lesson/ci-quality-gates)).
      3. **On merge to main, before deploy** - the Playwright journeys against a built app or a preview
         environment: login, create an order, refund it, see the dashboard update. A handful of tests.
      4. **Nightly or weekly** - slow or broad checks: mutation testing of the money rules, the full browser
         matrix, a test run with `--sequence.shuffle` to surface order dependence, dependency audits.
      5. **After deploy** - smoke tests and monitoring of the real system (the next lessons: deployment and
         observability).

      Rule of thumb: a check that blocks merges must be **fast** and **reliable**. A flaky blocking test
      teaches everyone to press "re-run" - move it down a stage and fix it, don't delete the stage.

  - id: example
    kind: example
    concepts: [test-portfolio-and-layers, test-doubles-and-vitest-mocks, test-isolation-and-flakiness]
    title: "Project example: testing \"refund from the merchant dashboard\""
    body: |
      The SandPay team adds a **Refund** button to the order page of the merchant dashboard. The React form
      posts to `POST /payments/:id/refunds`; the API checks the rules, writes the refund in a transaction and
      calls the processor. Where does each test go?

      - **Unit (Vitest):** `decideRefund` - zero, fractions, the remainder after earlier refunds, exactly what
        is left, one minor unit more, day 180 and 181, two rules broken at once. Ten cases, milliseconds.
      - **Component (Testing Library):** the form shows field errors with `aria-invalid`, disables the button
        while submitting, shows the server's error. The submit function is a **spy**; no Express, no network.
      - **API (supertest + PGlite):** 201 with `Location`; 409 when the payment would be over-refunded;
        Problem Details for invalid bodies; the refund row and the payment's `refunded_minor` change together
        or not at all. The processor is a **stub** that can answer approved, declined or time out.
      - **Contract:** the 201 and 409 bodies validate against the OpenAPI document both sides use.
      - **End-to-end (Playwright):** one journey - log in, open a paid order, refund 10.00, see the new
        remaining amount. The processor sandbox is replaced at the network boundary so the test controls the
        outcome.
      - **Not automated:** exploratory testing of odd sequences - refund in two tabs, back button after
        submit, very slow network ([Refresh, back and interruptions](#/lesson/interruptions-refresh-back-navigation)).

      In review a developer proposes a second Playwright test for each validation message. The tester asks:
      "which bug would that catch that the component test can't?" There isn't one - the messages are
      rendered by the component, so they stay at that layer, and the browser suite stays at one journey.

  - id: tests
    kind: tests
    concepts: [test-portfolio-and-layers, test-doubles-and-vitest-mocks, test-isolation-and-flakiness, test-suite-effectiveness]
    title: Tests for the test suite itself
    body: |
      A test strategy can be tested too. Expected results and the evidence to keep:

      | Check | How | Expected result | Evidence |
      | --- | --- | --- | --- |
      | Every layer exists | list test files by folder or tag | unit, component, API, contract and a few end-to-end tests | the CI test summary per job |
      | The suite catches known bugs | revert a past bug fix on a branch, or run mutation testing on the money rules | at least one test fails for each | the failing test names; the mutation score |
      | Tests are isolated | run with `--sequence.shuffle` and several seeds; run one file alone | same result every time | the seeds used and their results |
      | Tests are independent of the clock | run with the system date set to 31 December 23:59 or a leap day, or with fake timers | no failures | the run log |
      | Fakes match reality | run the shared contract tests against fake and real | both pass | the two contract runs |
      | Doubles don't hide real calls | block outbound network in the test job | no test reaches a real third party | the network policy or MSW's `onUnhandledRequest: 'error'` |
      | Blocking checks are fast | time the pull-request job | within the agreed budget (for example 10 minutes) | CI job durations over a month |
      | Flaky tests are tracked | count re-runs and quarantined tests | trending down, each with a ticket | the flake dashboard or ticket list |

      **Negative check:** a test with no `expect` (or one that never awaits its promise) still passes.
      The `expect-expect` rule of `@vitest/eslint-plugin` ("enforce having expectation in test body")
      and code review catch them.

  - id: mistakes
    kind: mistakes
    concepts: [test-doubles-and-vitest-mocks, test-isolation-and-flakiness, test-suite-effectiveness]
    title: Common mistakes and how to debug them
    body: |
      - **Testing everything end-to-end.** Slow, flaky, hard to diagnose. Push each check down to the lowest
        layer that can see it; keep a few journeys on top.
      - **Mocking what you own and is fast.** Mocking your own repository in an API test means the SQL is
        never run - the constraint, the transaction and the query plan all go untested. Use PGlite.
      - **Over-specified mocks.** Asserting that `repo.find` was called before `repo.save` with exact
        arguments makes every refactoring break tests that found no bug. Assert results; spy only on real
        side effects.
      - **Unverified fakes.** The fake returns orders newest first; production returns oldest first; every
        test is green and production sends reminders in the wrong order. Run one contract suite against both.
      - **`vi.mock` with outside variables.** It is hoisted - "Cannot access ... before initialization". Use
        `vi.fn()` inside the factory, `vi.hoisted`, or inject the dependency instead.
      - **Fake timers left on.** The next test hangs or sees a frozen clock. Restore in `afterEach` or a
        `finally`.
      - **Sleeping instead of waiting.** `await sleep(2000)` is slow when the system is fast and flaky when it
        is slow. Wait for a condition (`findByRole`, `expect.poll`, Playwright's web-first assertions).
      - **Asserting too little.** `expect(result.ok).toBe(false)` passes for the wrong reason. Assert the
        whole result - reason, remainder, status code *and* body.
      - **Coverage as a target.** 100% coverage with weak assertions found none of seven bugs in this lesson.

      **Debugging a flaky test:** run it alone in a loop (`for i in $(seq 50); do npx vitest run file; done`);
      run the file shuffled with several seeds and keep the failing seed; look for shared state, real time,
      network and unrestored mocks in that order; if it still fails one run in fifty, suspect a race in the
      product and treat it as a bug.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [test-portfolio-and-layers, test-doubles-and-vitest-mocks]
    title: Limits, trade-offs and alternatives
    body: |
      - **jsdom is not a browser.** Component tests in jsdom have no layout and no CSS rendering, and other
        browser behaviour (focus, scrolling, navigation) is only partly implemented. Vitest's Browser Mode or Playwright component testing run components in a real browser, at
        some cost in speed and set-up.
      - **PGlite is not your production server.** It is real PostgreSQL code, but single-connection, without
        your extensions and server settings. Concurrency tests and extension-specific SQL need a real server
        (Testcontainers or a CI service container).
      - **Doubles drift.** Every stub is a claim about another system. Contract tests and a few broad tests
        keep those claims honest; without them, a double is a guess.
      - **End-to-end tests are still necessary.** They are the only tests that see the deployed configuration,
        the real build and the browser. Few is not zero.
      - **Mutation testing costs time.** Run it where bugs cost most (money, permissions) rather than across
        the whole codebase.
      - **Models are not rules.** Pyramid, trophy and honeycomb are heuristics from different contexts (GUI-heavy
        apps, JavaScript front ends, microservices). Use them to start a discussion about cost and confidence,
        not to settle one.

  - id: summary
    kind: summary
    concepts: [test-portfolio-and-layers, test-doubles-and-vitest-mocks, test-isolation-and-flakiness, test-suite-effectiveness]
    title: Quick reference
    body: |
      - **Layers:** static, unit, component (Testing Library), API with a real DB (supertest + PGlite), contract,
        a few Playwright journeys. Choose the lowest layer that can see the bug.
      - **Models:** pyramid (Cohn, Fowler), trophy (Dodds), honeycomb (Spotify) - practitioner heuristics that
        agree on many fast focused tests and few broad ones.
      - **Doubles:** dummy, stub, spy, mock, fake. Prefer real and fast; double the slow, random or external.
        Verify fakes with shared contract tests.
      - **Vitest:** `vi.fn`, `vi.spyOn`, `vi.mock` (hoisted), `vi.useFakeTimers` + `advanceTimersByTimeAsync`,
        restore in `afterEach`.
      - **Isolation:** data per test via builders; fresh DB or rolled-back transaction; shuffle with a seed to
        prove order independence.
      - **Effectiveness:** coverage shows what ran, not what was checked; mutation testing (killed vs survived
        mutants) measures bug-finding.
      - **When:** fast and reliable on every pull request; journeys on merge; slow and broad nightly.

exercises:
  - id: lowest-layer
    type: mcq
    concept: test-portfolio-and-layers
    skill: application
    title: Where does this test belong?
    prompt: |
      A bug report: for payments in JPY (no minor units), the dashboard's "remaining refundable" figure is 100
      times too large. The figure comes from a pure function `formatRemaining(amountMinor, currency)` used by
      the React component. Which test do you write first?
    options:
      - id: unit
        text: A unit test of formatRemaining with JPY, EUR and a zero-decimal edge case.
        feedback: Correct - the bug lives in a pure function, so the lowest layer sees it directly, runs in milliseconds and names the function when it fails.
      - id: e2e
        text: A Playwright test that refunds a JPY payment and reads the figure on screen.
        feedback: It would catch it, but slowly and needing JPY test data in a deployed environment; when it fails it doesn't say which layer is wrong. End-to-end is for journeys, not for one function's rules.
      - id: api
        text: An API test of GET /payments/:id with supertest.
        feedback: The API returns minor units correctly; the bug is in how the front end formats them, which an API test never runs.
      - id: component
        text: A component test rendering the order page with a JPY payment.
        feedback: It would catch it, but the component adds rendering set-up without adding anything the function test can't see. Pin the rule at unit level; one component test can check the figure is shown at all.
    correct: [unit]
    hints:
      - Where does the wrong number come from?
      - Which layer runs that code and nothing else?
    solution: |
      **A unit test of `formatRemaining`.** The bug is a calculation in a pure function, so the cheapest test
      that can see it is a unit test: currency cases (JPY with 0 decimals, EUR with 2, and an edge such as a
      3-decimal currency if you support one) in a table. A component test can then check only that the
      component *uses* the formatter - one case, not every currency.
    followUp: |
      The same dashboard shows "remaining refundable" as `NaN` only when the API returns the amount as a
      string. Which two layers would you test, and what would each assert?

  - id: renamed-field
    type: mcq
    concept: test-portfolio-and-layers
    skill: analysis
    title: Green tests on both sides, broken in production
    prompt: |
      The API team renames `amount` to `amountMinor` in `GET /orders`. Their supertest tests are updated and
      pass. The React team's component tests pass too - they render the order table from a hard-coded fixture
      that still uses `amount`. In production the table shows empty amounts. Which test would have caught it
      before release, at the lowest cost?
    options:
      - id: contract
        text: A contract test - the front end's fixtures and the API's responses both validated against the same OpenAPI schema (or a Pact contract).
        feedback: Correct - both sides were tested against their own assumptions; a shared contract checks the assumption itself, in seconds, without deploying anything.
      - id: more-unit
        text: More unit tests in the React app.
        feedback: More tests against the same stale fixture stay green. The defect is the disagreement between two codebases, which no test inside one of them can see.
      - id: e2e-all
        text: A Playwright test for every table column.
        feedback: One journey through the real stack would notice an empty amount, but per-column end-to-end tests are slow and brittle; a contract test catches schema drift for every field at once.
      - id: coverage
        text: Raising the coverage target to 90% in both repositories.
        feedback: Both suites could reach 100% coverage and still pass - coverage measures code run, not agreement between client and server.
    correct: [contract]
    hints:
      - Each side tested itself against its own idea of the response.
      - What single artefact could both sides test against?
    solution: |
      **A contract test.** The bug is *drift between two sides*, each green against its own picture of the
      response. Validating the API's real responses and the client's fixtures against one schema (see
      [Contract-first APIs with OpenAPI](#/lesson/openapi-contract-first) and [Schema and contract
      validation](#/lesson/schema-and-contract-validation)) catches it on the next build. One end-to-end
      journey is the safety net; it shouldn't be the first line.

  - id: query-priority
    type: order
    concept: test-portfolio-and-layers
    skill: recall
    title: Testing Library's query priority
    prompt: |
      Put Testing Library's queries in the order its documentation recommends, most preferred first.
    items:
      - id: role
        text: getByRole
      - id: label
        text: getByLabelText
      - id: placeholder
        text: getByPlaceholderText
      - id: text
        text: getByText
      - id: display
        text: getByDisplayValue
      - id: alt
        text: getByAltText
      - id: title
        text: getByTitle
      - id: testid
        text: getByTestId
    hints:
      - The first one works for "just about everything" and uses the accessibility tree.
      - The last one uses something users can neither see nor hear.
    solution: |
      **getByRole, getByLabelText, getByPlaceholderText, getByText, getByDisplayValue, getByAltText,
      getByTitle, getByTestId.** The first five are "accessible to everyone"; alt text and title are semantic
      queries whose support varies; test ids are last because "the user cannot see (or hear) these". The
      order mirrors how users find things - which is why it also pushes your UI towards accessibility.
    followUp: |
      The refund button is an icon with no text. `getByRole('button', { name: 'Refund' })` finds nothing.
      What do you fix - the test or the component - and how?

  - id: which-double
    type: mcq
    concept: test-doubles-and-vitest-mocks
    skill: application
    title: Name the double
    prompt: |
      In a test of the reminder service, `orders` is an `InMemoryPendingOrders` class that stores orders in a
      `Map` and implements the same filtering and sorting as the PostgreSQL repository. `mailer.send` is
      `vi.fn(async () => {})`, and the test later reads `send.mock.calls`. What are these two doubles?
    options:
      - id: fake-spy
        text: orders is a fake; mailer.send is a spy.
        feedback: Correct - the repository is a working implementation with a shortcut (memory instead of a database); the mailer returns a canned answer and records its calls for later checks.
      - id: mock-mock
        text: Both are mocks.
        feedback: In Meszaros's vocabulary a mock is pre-programmed with expectations it verifies itself. Neither double here does that - the test checks the spy's recorded calls afterwards. "Mock" is often used loosely; interviewers notice the difference.
      - id: stub-dummy
        text: orders is a stub; mailer.send is a dummy.
        feedback: A stub only returns canned answers; this repository really filters and sorts. A dummy is never used, but send is called and its calls are checked.
      - id: fake-stub
        text: orders is a fake; mailer.send is a stub.
        feedback: Half right - a stub gives canned answers, but this one also records how it was called and the test reads those records. That makes it a spy.
    correct: [fake-spy]
    hints:
      - Does the repository have real behaviour, or canned answers?
      - Does the test read anything back from the mailer?
    solution: |
      **A fake and a spy.** A fake has a working implementation that takes a shortcut - here memory instead of
      PostgreSQL - so it must be verified against the real repository with shared contract tests. `vi.fn`
      creates a spy: it answers (here, a resolved promise) and records every call, and the test verifies
      behaviour from `send.mock.calls`.

  - id: debug-test-file
    type: debug
    concept: test-isolation-and-flakiness
    skill: analysis
    title: Find what makes this test file flaky or broken
    prompt: |
      This Vitest file for the reminder service sometimes fails and sometimes hangs until the test times
      out. (Imports of `vi`, `mailer`, `InMemoryPendingOrders` and the `order` builder are left out.) Click
      **every** line that is a cause.
    language: typescript
    code: |
      import { createReminderService } from '../src/reminders.js';
      const sent: string[] = [];
      vi.mock('../src/mailer.js', () => ({ mailer: { send: async (m: { orderId: string }) => sent.push(m.orderId) } }));
      const repo = new InMemoryPendingOrders();

      test('reminds a 30-minute-old order', async () => {
        await repo.add(order('ord_a', Date.now() - 30 * 60_000));
        vi.useFakeTimers();
        createReminderService({ orders: repo, mailer }).start();
        await vi.advanceTimersByTimeAsync(60_000);
        expect(sent).toEqual(['ord_a']);
      });

      test('does not remind a paid order', async () => {
        await repo.add(order('ord_b', Date.now() - 30 * 60_000, { status: 'PAID' }));
        createReminderService({ orders: repo, mailer }).start();
        await new Promise((resolve) => setTimeout(resolve, 61_000));
        expect(sent).toEqual([]);
      });
    correctLines: [2, 4, 8, 16, 17]
    lineNotes:
      - line: 3
        note: The factory only refers to `sent` inside the function body, which runs later - so this line alone doesn't throw. The problem is that `sent` (line 2) is shared by both tests.
      - line: 10
        note: Advancing fake timers by one check interval is the right way to drive the service.
      - line: 11
        note: The assertion is fine on its own; it fails only because of the shared state around it.
    hints:
      - Which values live outside the tests and are changed by them?
      - What happens to the clock between the two tests - and is it ever put back?
      - Which line waits for real time?
    solution: |
      - **Line 2** - `sent` is module-level and never reset, so the second test sees `ord_a` from the first
        (and the result depends on order).
      - **Line 4** - one repository shared by both tests: `ord_a` is still due in test two.
      - **Line 8** - fake timers are switched on and never switched off; nothing restores real timers, so the
        second test runs with a frozen, fake clock.
      - **Line 16** - the second service is started but never stopped, and the first one is still running
        too - interval timers leak across tests and keep the worker alive.
      - **Line 17** - a real 61-second sleep: slow, and with fake timers still installed from test one it
        never resolves at all - the hang.

      Fix: build `sent`/the spy, the repository and the service **inside** each test (or in `beforeEach`), use
      `vi.useFakeTimers({ now: ... })` before computing times, `stop()` the service and `vi.useRealTimers()` in
      `afterEach`, and advance fake time instead of sleeping.

  - id: flaky-evidence
    type: mcq
    concept: test-isolation-and-flakiness
    skill: analysis
    title: "\"It only fails in CI\""
    prompt: |
      `refund-summary.test.ts` fails about once a week in CI and never locally. Evidence from the CI logs: the
      failures happened on runs where `vitest run` was given `--sequence.shuffle`; the failing assertion is
      `expected [ 2500 ] to deeply equal []`; the file has no network calls or timers. What is the most
      likely cause, and how do you confirm it?
    options:
      - id: order
        text: Two tests share state and only pass in file order - re-run the file with --sequence.shuffle and the seed from a failing CI run to reproduce it locally.
        feedback: Correct - the failure follows the shuffle, and the assertion shows leftover data from another test. A seed turns the intermittent failure into a deterministic one you can debug.
      - id: ci-slow
        text: The CI machine is slower, so a timeout expires.
        feedback: A timeout would fail with a timeout error, not a wrong value; and the file has no timers.
      - id: vitest-bug
        text: A bug in Vitest's shuffling.
        feedback: Possible in theory, but the assertion shows a value another test wrote. Blame your own shared state first, and prove it with the seed.
      - id: retry
        text: Nothing to confirm - add retry 2 to the file.
        feedback: Retries hide order dependence; the test will pass on the second try and the shared state remains, ready to break a real check.
    correct: [order]
    hints:
      - What is different about the failing runs?
      - Where could [ 2500 ] come from if the test itself writes nothing?
    solution: |
      **Order dependence.** The failure appears only with shuffling, and the leftover `2500` was written by
      another test. Confirm by re-running locally with `--sequence.shuffle --sequence.seed=<the CI seed>`: it
      should fail every time. Then remove the shared state (build data per test, reset in `afterEach`, or roll
      back a transaction) and run several seeds to show it now passes in every order.

  - id: coverage-claim
    type: mcq
    concept: test-suite-effectiveness
    skill: analysis
    title: "\"We have 100% coverage on the refund rules\""
    prompt: |
      A pull request changes `paymentAgeDays > 180` to `paymentAgeDays >= 180` by mistake. CI is green and the
      coverage report for `refund-rules.ts` still shows 100% lines and branches. What does that tell you?
    options:
      - id: no-boundary
        text: No test uses an input of exactly 180 days with an assertion that would notice the change - coverage shows the line ran, not that its boundary was checked.
        feedback: Correct - both versions run the same lines and branches; only a case on the boundary (180 accepted, 181 rejected) separates them.
      - id: cant-happen
        text: This can't happen - 100% branch coverage means every condition was tested both ways.
        feedback: Branch coverage counts that the if took both its true and false path at least once - for example with 3 days and 400 days. Both paths ran; the boundary between them was never checked.
      - id: coverage-tool
        text: The coverage tool is wrong; v8 coverage is inaccurate.
        feedback: The report is accurate - the lines and branches did run. Coverage simply doesn't measure what the assertions check.
      - id: needs-e2e
        text: Only an end-to-end test could catch an off-by-one like this.
        feedback: A unit test with paymentAgeDays 180 and 181 catches it in milliseconds; this is exactly the kind of bug the lowest layer is best at.
    correct: [no-boundary]
    hints:
      - Which inputs would give a different result for > and >=?
      - Did the coverage report run any of those?
    solution: |
      Coverage records that code **ran**; it can't tell whether any assertion would notice a change. `>` and
      `>=` differ only at 180 exactly, so a suite whose inputs are 3 and 400 days covers both branches and
      passes for both versions. Boundary values (180 accepted, 181 rejected - see [Equivalence partitioning,
      boundaries and decision tables](#/lesson/test-design-techniques)) kill this mutant; mutation testing
      would have reported it as **survived**.

  - id: refund-cases
    type: coding
    concept: test-suite-effectiveness
    skill: application
    title: Write the cases that catch seven bugs
    prompt: |
      `refund-rules.ts` contains a correct `decideRefund` (read its rules - they are checked in a fixed
      order). In `refund-cases.ts`, write a table of at most **10** cases - input and the full expected
      decision - so that every case passes against the real rules and at least one case gives a different
      answer for each of **seven** broken versions the checker holds (an off-by-one, a forgotten term, a
      wrong order of checks...). The test output names every bug your cases still miss.
    project: fullstack
    files:
      - exercises/testing/refund-cases.ts
    test: tests/testing/refund-cases.test.ts
    command: npx vitest run tests/testing/refund-cases.test.ts
    hints:
      - "Every `<` or `>` in the rules has a boundary: test exactly on it and one unit beyond."
      - "A case with refundedMinor 0 can't tell captured from captured minus refunded."
      - Assert the whole decision - the reason and remainingAfterMinor - not only ok.
      - "Break two rules at once (old payment and too large an amount) to check which rule wins."
    modelAnswer: |
      ```typescript
      export const refundCases: RefundCase[] = [
        { name: 'a partial refund after an earlier refund leaves the right remainder',
          input: { capturedMinor: 10000, refundedMinor: 4000, requestedMinor: 2500, paymentAgeDays: 3 },
          expected: { ok: true, remainingAfterMinor: 3500 } },
        { name: 'refunding exactly what is left is accepted',
          input: { capturedMinor: 10000, refundedMinor: 4000, requestedMinor: 6000, paymentAgeDays: 3 },
          expected: { ok: true, remainingAfterMinor: 0 } },
        { name: 'one minor unit more than is left is rejected',
          input: { capturedMinor: 10000, refundedMinor: 4000, requestedMinor: 6001, paymentAgeDays: 3 },
          expected: { ok: false, reason: 'exceeds_refundable' } },
        { name: 'a zero refund is invalid',
          input: { capturedMinor: 10000, refundedMinor: 0, requestedMinor: 0, paymentAgeDays: 3 },
          expected: { ok: false, reason: 'invalid_amount' } },
        { name: 'a fractional amount is invalid',
          input: { capturedMinor: 10000, refundedMinor: 0, requestedMinor: 12.5, paymentAgeDays: 3 },
          expected: { ok: false, reason: 'invalid_amount' } },
        { name: 'day 180 is still inside the refund window',
          input: { capturedMinor: 10000, refundedMinor: 0, requestedMinor: 100, paymentAgeDays: 180 },
          expected: { ok: true, remainingAfterMinor: 9900 } },
        { name: 'an old payment with too large an amount reports the closed window',
          input: { capturedMinor: 10000, refundedMinor: 0, requestedMinor: 20000, paymentAgeDays: 181 },
          expected: { ok: false, reason: 'refund_window_closed' } },
      ];
      ```

      Seven cases, each placed where one bug changes the answer: a non-zero `refundedMinor` (forgotten
      term, wrong remainder), exactly-what-is-left and one more (`>` versus `>=`), the smallest invalid
      amounts (0 and 12.5), the last day of the window, and a two-rule case that fixes the order of checks.
      Random "typical" values would need many more cases and still miss most of these.
    solution: |
      Put one case on each boundary or combination the rules create: a refund after an earlier refund with
      its exact remainder, exactly what is left and one minor unit more, 0 and 12.5, day 180, and an old
      payment with too large an amount (the window rule wins). Assert the whole decision. Seven cases kill all
      seven mutants; the model answer shows them.
    rubric:
      - Every test in tests/testing/refund-cases.test.ts passes.
      - Each case sits on a boundary or combines rules for a reason you can name (a comment or a precise name).
      - Every expected value is the full decision, including reason or remainder.
      - No more cases than needed - and no case that only repeats what another already shows.
    followUp: |
      Product adds a rule: refunds over 50000 minor units need `approved: true` in the request, checked after
      the window and before the refundable amount. Which new cases do you add, and which broken versions of
      the new rule would they catch?

  - id: reminder-check
    type: coding
    concept: test-doubles-and-vitest-mocks
    skill: application
    title: A verified fake, a spy and fake timers
    prompt: |
      In `reminder-check.ts`: (1) implement `InMemoryPendingOrders`, a fake of the `PendingOrders`
      repository - the checker runs the **same contract tests** against it and against the real PostgreSQL
      repository; (2) implement `checkReminderService(create)`: build a service with `create`, your fake and a
      **spy** mailer (`vi.fn`), drive it with **fake timers**, and assert with `expect`. It must resolve for
      the real `createReminderService` and reject for each of six broken services (late at the 30-minute
      boundary, duplicate reminders, failed sends never retried, `stop()` ignored, wrong recipient, checking
      too rarely). Always restore real timers.
    project: fullstack
    files:
      - exercises/testing/reminder-check.ts
    test: tests/testing/reminder-check.test.ts
    command: npx vitest run tests/testing/reminder-check.test.ts
    hints:
      - "The fake: a Map of copies; filter PENDING, not reminded, createdAt <= cutoff; sort by createdAt then id; return copies; reject a duplicate id like a primary key would."
      - "`vi.useFakeTimers({ now: fixedTime })` first, then create orders relative to that time; wrap the rest in try/finally with `vi.useRealTimers()`."
      - "Advance to just before 30 minutes, then one check interval: assert nothing, then exactly the right message with toHaveBeenCalledWith."
      - Make the spy fail once for one order, then advance one more minute and compare the full list of orderIds sent; finally stop() and prove nothing more is sent.
    modelAnswer: |
      ```typescript
      export async function checkReminderService(create: CreateReminderService): Promise<void> {
        vi.useFakeTimers({ now: START });
        try {
          const orders = new InMemoryPendingOrders();
          let failOnceFor: string | undefined = 'ord_b';
          const send = vi.fn<Mailer['send']>(async (message) => {
            if (message.orderId === failOnceFor) { failOnceFor = undefined; throw new Error('mail provider timeout'); }
          });
          const service = create({ orders, mailer: { send } });
          await orders.add(order('ord_a', START));            // due at exactly 30 minutes
          await orders.add(order('ord_b', START));            // first send fails
          await orders.add(order('ord_c', START + minutes(1)));
          await orders.add(order('ord_paid', START));
          await orders.setStatus('ord_paid', 'PAID');
          service.start();

          await vi.advanceTimersByTimeAsync(REMIND_AFTER_MS - CHECK_EVERY_MS);
          expect(send).not.toHaveBeenCalled();
          await vi.advanceTimersByTimeAsync(CHECK_EVERY_MS);
          expect(send).toHaveBeenCalledWith({ to: 'ord_a@customer.example', template: 'payment-reminder', orderId: 'ord_a' });
          await vi.advanceTimersByTimeAsync(CHECK_EVERY_MS);
          const sentTo = () => send.mock.calls.map(([m]) => m.orderId);
          expect(sentTo()).toEqual(['ord_a', 'ord_b', 'ord_b', 'ord_c']);

          await vi.advanceTimersByTimeAsync(minutes(10));
          expect(sentTo()).toHaveLength(4);                   // no duplicates
          service.stop();
          await orders.add(order('ord_late', START));
          await vi.advanceTimersByTimeAsync(minutes(10));
          expect(sentTo()).toHaveLength(4);                   // stop() really stops
        } finally {
          vi.useRealTimers();
        }
      }
      ```

      Each expectation is aimed at one broken version: the boundary at exactly 30:00 catches "late", the
      full list of sends catches duplicates, the missing retry and the slow interval, `toHaveBeenCalledWith`
      catches the wrong recipient, and the post-`stop()` order catches the leaking interval. The fake
      (`Map`, filter, sort by `createdAt` then id, copies, duplicate-id rejection) passes the same contract
      tests as PostgreSQL - which is what makes a test that uses it trustworthy.
    solution: |
      The fake stores copies in a Map and filters, sorts and rejects duplicates like the SQL repository - the
      shared contract tests prove it. The check fixes "now" with fake timers, adds orders due exactly at 30
      minutes (one whose first send fails), advances to just before and then onto the boundary, compares the
      full list of sends after one more minute, and proves nothing is sent after stop(), restoring real timers
      in finally.
    rubric:
      - Every test in tests/testing/reminder-check.test.ts passes.
      - The fake returns copies and matches the real repository's filtering and order - proven by the shared contract tests, not by reading the code.
      - The check uses a fixed fake "now", advances fake time instead of sleeping, and restores real timers in finally.
      - Each assertion can be traced to a bug it catches; there are no assertions on internals such as how many times dueForReminder was called.
    followUp: |
      Production starts two instances of the reminder service for availability, and customers get two
      reminders. Which test layer can show that, what double would you need to change, and what would you
      change in the design (hint: the repository, not the timer)?

  - id: test-plan-layers
    type: testdesign
    concept: test-portfolio-and-layers
    skill: application
    title: A layered test plan for "export settlements as CSV"
    prompt: |
      The dashboard gets an **Export CSV** button: the API streams `GET /settlements.csv?from=&to=` from
      PostgreSQL (amounts in minor units, dates in the merchant's time zone) and the React page shows a
      progress state and errors. Design the tests by layer: for each, name what it covers, the doubles you
      use, the expected results and the **evidence** you'd keep.
    hints:
      - Which parts are pure rules (formatting, date ranges) and which need a real database?
      - What is the one journey worth a browser?
    modelAnswer: |
      **Unit:** CSV line formatting (quoting a merchant name with a comma, minor units to `12.50`, negative
      refunds), the `from`/`to` range rules (inclusive start, exclusive end, time-zone conversion at a
      midnight boundary and a DST change). Expected: exact strings. Evidence: the test table.

      **API with PGlite:** seed settlements around the range boundaries and in two time zones; `GET` returns
      200, `text/csv`, the header row and exactly the rows in range in a stable order; 400 Problem Details for
      `from > to` or a range over the limit; 401/403 for another merchant's data. Evidence: response bodies
      compared with a stored expected file; the SQL plan for the range query uses the index (see [PostgreSQL
      indexes and query plans](#/lesson/postgres-indexes-and-query-plans)).

      **Contract:** the 400 and 403 bodies validate against the OpenAPI document; the CSV columns are listed
      there too.

      **Component:** the button shows a busy state and is disabled while exporting; an error from the API is
      announced; the download is triggered with the right URL - `fetch` stubbed. Evidence: Testing Library
      assertions by role.

      **End-to-end (one test):** log in, export last month, assert the downloaded file's header and row count
      with Playwright's download handling. Evidence: the file saved as a test artefact.

      **Not automated / exploratory:** a very large range (memory, time-out), closing the tab mid-download.
    solution: |
      Formatting and date-range rules at unit level; the query, range boundaries, time zones and access control
      as API tests on a seeded real database; error bodies and columns as contract checks; busy and error
      states as component tests with fetch stubbed; one Playwright download journey - each with concrete
      expected results and kept evidence.
    rubric:
      - Splits the feature by layer and puts each check at the lowest layer that can see it.
      - Covers boundaries (range ends, time zones, quoting) at unit level.
      - Uses a real database for the query and access-control checks, with seeded boundary data.
      - Keeps end-to-end to one journey and names the doubles used at each layer.
      - Gives concrete expected results and evidence for each layer.

  - id: commit-vs-nightly
    type: short
    concept: test-suite-effectiveness
    skill: application
    title: What blocks a merge?
    prompt: |
      Your team's suite: 900 unit and component tests (40 s), 250 API tests with PGlite (90 s), 30 contract
      checks (10 s), 12 Playwright journeys (6 min, about one flaky failure a week), a StrykerJS mutation run
      on the money module (35 min) and a shuffled run of everything (3 min). Decide what runs on each pull
      request, on merge to main and nightly - and justify it.
    modelAnswer: |
      **Every pull request (blocking):** type check, lint, unit, component, API and contract tests - about
      2.5 minutes, deterministic, and they cover most bugs at the layer that names them. **On merge to main /
      before deploy:** the 12 Playwright journeys against a preview build - broad but slow; they gate the
      deploy, not every push. The weekly flaky failure gets a ticket and is fixed or moved, never just
      retried. **Nightly:** mutation testing of the money module (too slow per PR, valuable as a trend - a
      falling score means new code without real assertions) and the shuffled run with a logged seed (finds
      order dependence before it becomes CI noise). Optionally run the shuffled suite on PRs too once it is
      green, since 3 minutes is affordable.
    rubric:
      - Blocking checks are fast and reliable; slow or broad suites move later.
      - Places Playwright journeys before deploy rather than nowhere.
      - Uses mutation testing and shuffling as scheduled health checks, with a reason.
      - Treats the flaky journey as a bug to fix, not something to retry silently.
    hints:
      - What makes a check suitable to block every merge?
      - What is each slow job measuring, and how often does that change?
    solution: |
      Fast, deterministic tests (unit, component, API, contract) block every PR; the Playwright journeys gate
      merges/deploys; mutation testing and shuffled runs run nightly as health checks; the flaky journey gets
      fixed rather than retried.

  - id: interview-test-strategy
    type: interview
    concept: test-portfolio-and-layers
    skill: analysis
    title: "\"How would you test our React, Node and Postgres app?\""
    prompt: |
      An interviewer for a full stack role asks: "Our product is a React front end, a Node/Express API and
      PostgreSQL. We have 400 Cypress tests that take 50 minutes and fail randomly, and almost no unit
      tests. How would you test this app, and how would you get from here to there?"
    modelAnswer: |
      I'd aim for a portfolio where each check sits at the lowest layer that can see it. Static checks
      (TypeScript strict, ESLint) catch a class of bugs for free. Unit tests cover rules - money, permissions,
      state machines - with boundary cases. Component tests with Testing Library check what users see and
      do, querying by role. The bulk of confidence for the API comes from tests that run Express in memory
      with supertest against a **real** PostgreSQL - PGlite or Testcontainers - so SQL, constraints and
      transactions are really exercised; external systems like the payment processor are stubbed at the
      boundary and those stubs are kept honest with contract tests. On top, a handful of end-to-end journeys
      for the critical paths. This is roughly the pyramid or trophy - both models agree on many fast tests
      and few broad ones.

      To get there from 400 slow, flaky UI tests: first measure - which tests fail most, which are slow, what
      each one actually checks. Quarantine the flaky ones with tickets so the suite is trusted again. Then,
      feature by feature, push checks down: a UI test that verifies a validation message becomes a component
      test; one that checks a calculation becomes a unit test; one that checks data written becomes an API
      test. Keep one journey per critical flow. Make the fast suite block PRs, the journeys gate deploys,
      and track flakiness and run time as metrics. I'd also check test quality, not just count - mutation
      testing on the money module, shuffled runs for isolation.
    rubric:
      - Describes several layers with what each catches in this specific stack.
      - Insists on a real database for API tests and doubles only at external boundaries.
      - Mentions contract tests to keep doubles and the two sides honest.
      - Has a migration plan - measure, quarantine with tickets, push tests down, keep a few journeys.
      - Treats flakiness and run time as problems to fix, and mentions how to judge test quality beyond coverage.
    followUps:
      - Which of the 400 tests would you delete first, and how would you make sure nothing is lost?
      - How do you stop the new fast suite from becoming flaky too?
      - Coverage is 85% - what does that tell you, and what doesn't it?
    hints:
      - Start with the target portfolio, then the path from today's suite.
      - For each layer, say what bug it catches here.
    solution: |
      Target: static → unit (rules) → component (Testing Library, by role) → API with a real Postgres (most
      confidence) → contract tests for boundaries → a few journeys. Path: measure, quarantine flaky tests
      with tickets, push each UI check down to the lowest layer that sees it, keep one journey per critical
      flow, gate PRs on the fast suite and deploys on the journeys, and judge quality with mutation testing
      and shuffled runs.

placement:
  - id: place-layer
    type: mcq
    concept: test-portfolio-and-layers
    skill: application
    title: The missing unique constraint
    prompt: |
      Two merchants can be created with the same e-mail address because the `merchants` table has no unique
      constraint; the Express handler only checks with a SELECT first. Which test is the cheapest one that
      can reliably catch the missing constraint?
    options:
      - id: api-db
        text: An API or repository test against a real PostgreSQL (PGlite) that inserts the same e-mail twice and expects the second to fail.
        feedback: Correct - only a real database can show a missing constraint, and PGlite makes this test as fast as a unit test.
      - id: unit-mock
        text: A unit test of the handler with the repository mocked to return "exists".
        feedback: The mock decides the answer, so the test passes whether or not the table has a constraint - it never runs the SQL.
      - id: component
        text: A component test of the sign-up form.
        feedback: The form never touches the database; it can't see a schema problem.
      - id: e2e
        text: A Playwright test that signs up twice.
        feedback: It would usually pass, because the SELECT check works one request at a time; the gap shows under concurrent requests, which a single browser journey doesn't produce. And it's the slowest option.
    correct: [api-db]
    solution: |
      Constraints live in the database, so test them against a real database. A mocked repository returns
      whatever the test says; a single end-to-end journey passes the SELECT check. An API or repository test
      on PGlite inserts twice and expects SQLSTATE 23505 (or the API's 409).

  - id: place-hoist
    type: mcq
    concept: test-doubles-and-vitest-mocks
    skill: application
    title: The ReferenceError in a test file
    prompt: |
      A Vitest file declares `const fakeCharge = vi.fn()` near the top and then
      `vi.mock('./processor.js', () => ({ charge: fakeCharge }))`. Running it fails with "Cannot access
      'fakeCharge' before initialization". Why?
    options:
      - id: hoisted
        text: vi.mock is hoisted above the imports, so its factory runs before the const is initialised.
        feedback: Correct - Vitest moves vi.mock to the top of the file; create the vi.fn inside the factory, use vi.hoisted, or inject the dependency instead.
      - id: wrong-path
        text: The module path is wrong, so the import fails.
        feedback: A wrong path gives a "failed to load" or resolution error, not a temporal-dead-zone ReferenceError about your variable.
      - id: vi-fn-async
        text: vi.fn() must be awaited before use.
        feedback: vi.fn() is synchronous and returns a spy immediately; the problem is when the factory runs, not how the spy is created.
      - id: es-modules
        text: vi.mock does not work with ES modules.
        feedback: It does - the practice project is ES modules throughout. The hoisting is what makes it work before imports are evaluated.
    correct: [hoisted]
    solution: |
      "The call to `vi.mock` is hoisted" (Vitest docs) - it runs before every import, so when an import loads
      the mocked module, the factory runs while `const fakeCharge` is still in its temporal dead zone. Create
      the spy inside the factory and read it through the import (`vi.mocked(charge)`), use `vi.hoisted`, or
      pass the processor in as a parameter so no module mock is needed.

  - id: place-shuffle
    type: mcq
    concept: test-isolation-and-flakiness
    skill: analysis
    title: Passes alone, fails in the suite
    prompt: |
      `refund-total.test.ts` passes when run alone and fails when the whole suite runs, with a total that is
      too large. The tests in the file insert refunds into one PGlite database created at the top of the file.
      What is the best fix?
    options:
      - id: isolate
        text: Give each test a clean database state - a transaction rolled back in afterEach, or a fresh database per test - and build its data inside the test.
        feedback: Correct - leftover rows from other tests inflate the total; per-test isolation removes the dependency, and a shuffled run proves it.
      - id: sequential
        text: Run the suite with a single worker so tests run in order.
        feedback: The order dependence remains; the next new test or a filter breaks it again. Isolation, not ordering, is the fix.
      - id: retry
        text: Configure retry 3 for the file.
        feedback: The total is wrong deterministically given the leftover rows - retrying passes only by luck, and hides the shared state.
      - id: bigger-timeout
        text: Raise the test timeout.
        feedback: It isn't timing out; the assertion fails on a wrong value.
    correct: [isolate]
    solution: |
      The tests share database rows, so the result depends on which tests ran first. Roll back a transaction
      after each test (or create a fresh PGlite per test) and build each test's data inside it, then run with
      `--sequence.shuffle` and a few seeds to show it passes in every order.

  - id: place-mutation
    type: mcq
    concept: test-suite-effectiveness
    skill: analysis
    title: Coverage or mutation score?
    prompt: |
      Two suites for the same money module: suite A has 98% line coverage and kills 40% of mutants; suite B
      has 85% line coverage and kills 90% of mutants. Which is more likely to catch the next off-by-one bug in
      code they both cover, and why?
    options:
      - id: b
        text: Suite B - its assertions detect most small changes in the code it runs; A runs more code but notices few changes.
        feedback: Correct - mutation score measures whether tests notice wrong behaviour; coverage only measures what ran.
      - id: a
        text: Suite A - higher coverage means more of the code is tested.
        feedback: More code is executed, but executing is not checking - 60% of A's mutants pass its tests unnoticed.
      - id: same
        text: Neither - the numbers can't be compared.
        feedback: They measure different things, which is the point - for "will a bug be noticed?", the mutation score is the relevant one.
      - id: e2e
        text: Neither - only end-to-end tests catch off-by-one errors.
        feedback: Off-by-one errors are exactly what boundary-value unit tests catch best.
    correct: [b]
    solution: |
      Coverage counts lines that ran; mutation score counts deliberate bugs the tests noticed. Suite B notices
      90% of small changes in the code it covers. Suite A runs more code but lets most changes through - and
      its extra coverage shows where B could add tests, not that A is better at catching bugs.

recall:
  - id: recall-pyramid
    concept: test-portfolio-and-layers
    prompt: What is the essential point of the test pyramid, and who described it?
    answer: Have many more fast, low-level tests than slow, broad tests through the UI. Mike Cohn described the Test Automation Pyramid (Succeeding with Agile, 2009); Martin Fowler's 2012 article popularised it. It assumes broad tests are slow, brittle and expensive.
  - id: recall-trophy-honeycomb
    concept: test-portfolio-and-layers
    prompt: What do the testing trophy and the testing honeycomb emphasise?
    answer: The trophy (Kent C. Dodds) - static checks, some unit tests, mostly integration tests, few end-to-end tests, chosen for return on investment in JavaScript apps. The honeycomb (Spotify, 2018) - for microservices, mostly integration tests of one service, few implementation-detail tests, very few integrated tests.
  - id: recall-lowest-layer
    concept: test-portfolio-and-layers
    prompt: How do you decide which layer a test belongs to?
    answer: Choose the lowest layer that can see the bug - pure logic in a unit test, what one component shows in a component test, routing/SQL/constraints in an API test with a real database, client-server agreement in a contract test, and only critical journeys end to end.
  - id: recall-doubles
    concept: test-doubles-and-vitest-mocks
    prompt: Name the five test doubles and what each does.
    answer: Dummy - fills a parameter, never used. Stub - canned answers. Spy - a stub that records its calls. Mock - pre-programmed with expectations it verifies. Fake - a working implementation with a shortcut, such as an in-memory repository.
  - id: recall-vitest-tools
    concept: test-doubles-and-vitest-mocks
    prompt: What do vi.fn, vi.mock and vi.useFakeTimers do, and what is the trap with vi.mock?
    answer: vi.fn creates a spy that records calls; vi.mock replaces a module for the file; vi.useFakeTimers fakes setTimeout, setInterval and Date (advance with advanceTimersByTime). vi.mock is hoisted above imports, so its factory can't use top-level variables.
  - id: recall-flaky
    concept: test-isolation-and-flakiness
    prompt: Name four common causes of flaky tests.
    answer: Shared state between tests, real time and sleeps, order dependence, real network or third-party calls - plus races in the product and timers or mocks that aren't restored.
  - id: recall-isolation
    concept: test-isolation-and-flakiness
    prompt: How do you prove tests are isolated?
    answer: Run each alone, in any order (--sequence.shuffle with several seeds) and in parallel - and get the same result. Build data per test, use a fresh database or roll back a transaction, and restore timers and mocks in afterEach.
  - id: recall-coverage
    concept: test-suite-effectiveness
    prompt: What does code coverage tell you, and what doesn't it?
    answer: It shows which code ran during the tests - uncovered code is certainly untested. It doesn't show whether any assertion would notice a mistake in covered code; a 100%-coverage suite can let every bug through. Mutation testing measures that.

