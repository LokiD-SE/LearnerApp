id: rest-api-design
title: REST API design
subject: fullstack
module: backend-api
level: intermediate
status: published
estimatedMinutes: 70
summary: Design an HTTP API as its designer - model resources and URLs, choose methods, status codes and headers on purpose, stop lost updates with ETags and If-Match, and shape collections and versions so the API can change without breaking its clients.
tags:
  [
    rest,
    api design,
    resources,
    urls,
    fielding,
    statelessness,
    hateoas,
    "201",
    location,
    "202",
    "409",
    "412",
    "428",
    etag,
    if-match,
    optimistic concurrency,
    problem details,
    cursor pagination,
    link header,
    versioning,
    backward compatibility,
    rfc 3339,
    express,
  ]

environment: |
  - **Standards (normative):** [RFC 9110](https://www.rfc-editor.org/rfc/rfc9110) HTTP Semantics -
    section 9.3.3 (POST), 10.2.2 (Location), 8.8.3 (ETag) and 8.8.3.2 (strong and weak comparison), 13.1.1
    (If-Match), 13.2.1 (when to evaluate preconditions), 15.3.2-15.3.5 (201, 202, 204), 15.5.10 (409), 15.5.13
    (412); [RFC 6585](https://www.rfc-editor.org/rfc/rfc6585) section 3 (428 Precondition Required);
    [RFC 5789](https://www.rfc-editor.org/rfc/rfc5789) (PATCH, Accept-Patch); [RFC 7396](https://www.rfc-editor.org/rfc/rfc7396)
    (JSON Merge Patch); [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457) Problem Details (section 3, 4.2.1
    about:blank); [RFC 8288](https://www.rfc-editor.org/rfc/rfc8288) Web Linking (section 3, examples in 3.5);
    [RFC 3339](https://www.rfc-editor.org/rfc/rfc3339) section 5.6 (Internet date/time format). All fetched and
    checked November 2026.
  - **The origin of REST:** Roy Fielding, _Architectural Styles and the Design of Network-based Software
    Architectures_ (2000), [chapter 5](https://ics.uci.edu/~fielding/pubs/dissertation/rest_arch_style.htm) -
    sections 5.1.2-5.1.7 (the constraints) and 5.2.1.1 (resources). Quotes are from that chapter.
  - **Company guides (not standards - labelled where used):** Google's API Improvement Proposals -
    [AIP-121](https://google.aip.dev/121) resource-oriented design, [AIP-136](https://google.aip.dev/136) custom
    methods, [AIP-154](https://google.aip.dev/154) ETags, [AIP-158](https://google.aip.dev/158) pagination,
    [AIP-180](https://google.aip.dev/180) backwards compatibility, [AIP-185](https://google.aip.dev/185) versioning;
    the [Microsoft Azure REST API Guidelines](https://github.com/microsoft/api-guidelines/blob/vNext/azure/Guidelines.md);
    GitHub's [REST API versions](https://docs.github.com/en/rest/about-the-rest-api/api-versions) page. Each
    describes one organisation's choices; they disagree with each other in places, and the lesson says where.
  - **Code:** Express 5.3 and TypeScript 6.0 in `practice/fullstack`, tested with supertest 7.3 (Node.js 24).
    Every HTTP exchange shown was produced by running the reference solution with supertest; only the
    response lines and headers that matter are shown.
  - **Related (tester's view, not repeated here):** [HTTP methods - safety and
    idempotency](#/lesson/http-methods-safety-idempotency), [Status codes and error
    responses](#/lesson/status-codes-and-errors), [Pagination, filtering, sorting and rate
    limits](#/lesson/pagination-filtering-rate-limits), [Idempotency keys](#/lesson/idempotency-keys). This
    lesson is the **designer's** side of the same contract.
  - **Fictional:** SandPay (`https://api.sandpay.example`), its payments, refunds, ids and amounts are invented
    for this course. Amounts are integers in minor units. No real payment data appears anywhere.

prerequisites:
  - http-methods-safety-idempotency
  - status-codes-and-errors
  - express-http-server

concepts:
  - id: rest-constraints-and-resources
    name: REST constraints and resource modelling
    summary: REST is an architectural style defined by constraints - client-server, stateless, cache, uniform interface, layered system and optional code-on-demand. Designing for it means naming resources (nouns, collections and items, sub-resources) and acting on them through the uniform interface, with custom actions modelled as resources or explicit custom methods.
  - id: api-response-contract-design
    name: Designing the response contract
    summary: The designer chooses, for every operation, the method, the success status (201 with Location, 202 for accepted-but-not-done, 200 or 204), the error statuses (404, 409, 422) and one consistent error shape - Problem Details with stable type URIs - so clients can program against outcomes instead of parsing messages.
  - id: optimistic-concurrency-etags
    name: Optimistic concurrency with ETags and If-Match
    summary: The server sends an ETag with each representation; a client that changes the resource sends it back in If-Match. If the resource changed meanwhile the tags differ and the server answers 412 instead of overwriting - and it can require the header with 428. Checks that need no request content (404, 415) come before the precondition.
  - id: api-design-for-change
    name: Designing for change - cursors, versions and compatible evolution
    summary: An API is a contract clients build on, so design what is hard to change first - opaque cursors and paginated collections from day one, a versioning strategy, and a rule book of additive (compatible) versus breaking changes - and keep formats such as RFC 3339 timestamps and naming consistent.

objectives:
  - Explain Fielding's REST constraints - especially statelessness and the uniform interface - and say honestly which ones a typical JSON "REST API" follows.
  - Model a domain as resources and URLs, including sub-resources and actions that don't fit create-read-update-delete, and justify each choice.
  - Choose the method, success status, headers and error statuses for an operation, and design Problem Details types clients can rely on.
  - Implement optimistic concurrency with ETag, If-Match, 412 and 428 in Express, in the order RFC 9110 requires.
  - Design cursor pagination with opaque cursors and Link headers, and explain why it must exist from the first version.
  - Classify API changes as compatible or breaking, and compare URL, header and query-parameter versioning.

sections:
  - id: intuition
    kind: intuition
    concepts: [rest-constraints-and-resources, api-design-for-change]
    title: The idea in plain language
    body: |
      An API is a **shop counter**. Behind it, the kitchen can change completely - new ovens, new cooks, a
      different storeroom - and customers never notice, as long as the **counter** stays the same: the menu
      (what you can ask for), how you ask (the forms), and what you get back (the receipts, the "sorry, sold
      out" slips).

      Designing an API is designing that counter. Three things make a good one:

      1. **The menu is made of things, not chores.** Customers ask for *a refund on payment 1001*, not for
         "run the refund procedure". Things have names (URLs) and a small, fixed set of actions (HTTP
         methods) work on all of them.
      2. **Every slip means one thing.** "Created, here is where to find it", "accepted, still processing",
         "conflict - only 38.00 left to refund" - each with a stable code a machine can read.
      3. **The counter can grow without surprising regulars.** New dishes can be added; existing ones aren't
         silently changed. When something must change, it's announced and versioned.

      As a tester you checked the counter. As a full stack developer **you build it** - and every choice
      you make is a promise your React app, mobile apps and partners will depend on for years.

  - id: what
    kind: what
    concepts: [rest-constraints-and-resources]
    title: What REST actually is - Fielding's constraints
    body: |
      **REST (Representational State Transfer)** is not a protocol or a standard. It is an **architectural
      style** Roy Fielding described in chapter 5 of his 2000 dissertation, by adding **constraints** one at
      a time and naming the properties each one buys:

      | Constraint (section) | What it requires | What it buys / costs |
      | --- | --- | --- |
      | **Client-server** (5.1.2) | separate user-interface concerns from data storage | UI and server "evolve independently" |
      | **Stateless** (5.1.3) | "each request from client to server must contain all of the information necessary to understand the request, and cannot take advantage of any stored context on the server" | visibility, reliability, scalability - at the cost of repeating data in every request |
      | **Cache** (5.1.4) | responses are "implicitly or explicitly labeled as cacheable or non-cacheable" | fewer interactions - but stale data is possible |
      | **Uniform interface** (5.1.5) | the same interface for every resource | simplicity and visibility - "degrades efficiency" for non-hypermedia use |
      | **Layered system** (5.1.6) | each component only "sees" the layer it talks to | proxies, gateways, shared caches, load balancers |
      | **Code-on-demand** (5.1.7) | clients may download and run code (scripts) | extensibility - "only an optional constraint" |

      The uniform interface itself is four constraints (5.1.5): **identification of resources**,
      **manipulation of resources through representations**, **self-descriptive messages**, and **hypermedia
      as the engine of application state** (HATEOAS).

      **Resource** (5.2.1.1): "Any information that can be named can be a resource" - a document, "today's
      weather in Los Angeles", a collection, a person. A resource is a concept; what travels over the wire is
      a **representation** of its current state (JSON, HTML...). That is why `GET /payments/pay_1001` and the
      payment row in your database are not the same thing - and why you can change the database without
      changing the representation.

  - id: honest
    kind: tradeoffs
    concepts: [rest-constraints-and-resources]
    title: What most "REST APIs" really are - and HATEOAS honestly
    body: |
      Most JSON APIs called "RESTful" follow **some** of the constraints:

      - **Yes:** client-server, resources with URLs, standard methods with their HTTP meaning, status codes,
        cacheable GETs, layered infrastructure (gateways, CDNs).
      - **Often broken:** statelessness - "current page" or "selected merchant" kept in a server session is
        stored context the next request depends on.
      - **Usually skipped:** hypermedia as the engine of application state. In Fielding's style a client
        starts at one URL and **follows links** the server provides; it doesn't build URLs from documentation.
        Most JSON APIs publish URL templates in an OpenAPI document instead, and clients hard-code them.

      That's a design choice, not a crime - but be precise. Google's AIP-121 calls its approach
      **resource-oriented design** and says it "borrows many principles from REST, while also defining its
      own patterns". Calling your API "HTTP API" or "resource-oriented JSON API" is accurate; claiming full
      REST is usually not.

      Hypermedia still earns its place in small doses you'll use in this lesson: the **`Location`** header
      after a create, and **`Link: <...>; rel="next"`** for pagination ([RFC 8288](https://www.rfc-editor.org/rfc/rfc8288)).
      Clients that follow them, instead of building URLs, keep working when you change those URLs.

  - id: why
    kind: why
    concepts: [rest-constraints-and-resources, api-response-contract-design]
    title: Why design matters more than code here
    body: |
      Handler code can be rewritten in an afternoon. The **interface** can't: the moment a React app, a mobile
      app or a merchant's server depends on a URL, a status code or a field name, changing it breaks them -
      and you often can't update or even list those clients.

      Good design pays off in concrete ways:

      - **Clients stay simple.** A client that can trust "201 means created, `Location` says where" and "every
        error has a `type`" needs no special case per endpoint.
      - **Infrastructure helps for free.** Because methods and status codes keep their HTTP meaning, caches,
        gateways, retry libraries, monitoring and the browser all behave correctly - the payoff of Fielding's
        uniform interface and layered system.
      - **Money stays correct.** Conflicts (409), lost updates (412) and duplicate creates are design
        decisions; leaving them out means a support agent's edit silently disappears or a refund goes out
        twice.
      - **The API can grow.** Paginated collections, opaque cursors and a versioning rule decided in v1 let you
        add features for years without a rewrite of every client.

  - id: resources
    kind: steps
    concepts: [rest-constraints-and-resources]
    title: Modelling resources and URLs, step by step
    body: |
      Google's AIP-121 (a company guide, but a widely read one) orders the work "roughly in logical order":
      the **resources** (nouns), their **relationships and hierarchy**, the **schema** of each, then the
      **methods**, "relying as much as possible on the standard verbs". For SandPay's merchant dashboard:

      1. **Name the nouns.** Payments, refunds, customers, payouts. Not "processRefund" - that is a chore.
      2. **Collections and items.** A collection URL is plural; an item is the collection plus an id:
         `/payments` and `/payments/pay_1001`.
      3. **Hierarchy only for real ownership.** A refund exists only for one payment, so it's a
         **sub-resource**: `/payments/pay_1001/refunds/re_0001`. A customer exists without any one payment,
         so it's top-level (`/customers/cus_77`) and a payment refers to it by id.
      4. **Map operations to methods.** Create = `POST` to the collection; read = `GET`; partial change =
         `PATCH`; replace = `PUT`; remove = `DELETE` - with the safety and idempotency each method promises
         (see [HTTP methods](#/lesson/http-methods-safety-idempotency)).
      5. **Actions that don't fit.** "Capture this authorised payment" changes state in a way no standard
         method describes. Two accepted designs:
         - **Make the action's result a resource:** `POST /payments/pay_1001/captures` creates a capture
           (it has an id, an amount, a time - and you can list them, which helps partial captures).
         - **A custom method:** Google's AIP-136 uses a colon: `POST /v1/{name=publishers/*/books/*}:archive`,
           and says custom methods "should only be used for functionality that can not be easily expressed
           via standard methods". Pick one convention and use it everywhere.
      6. **Keep URLs boring.** Lower-case, nouns, no verbs (`/getPayment`), no file extensions, no
         implementation details (`/v1/sql/payments_table`). Microsoft's Azure guidelines, for example, say
         to use kebab-case (preferred) or camelCase for path segments and camelCase for query parameter names;
         other guides choose differently. **Consistency matters more than the particular choice.**

  - id: contract
    kind: when
    concepts: [api-response-contract-design]
    title: Choosing the status code - as the designer
    body: |
      The tester's lesson asked "is this status right?". The designer's question is "**what will the client
      do next**, and does the status tell it?". The RFC 9110 rules that shape the main choices:

      | Situation | Design | Rule |
      | --- | --- | --- |
      | `POST` created a resource | **201** + `Location` of the new resource + its representation | 9.3.3: the server "SHOULD send a 201 (Created) response containing a Location header field" |
      | Request accepted, work happens later (a bank refund that settles tomorrow) | **202** + a body describing the status and pointing to a status monitor | 15.3.3: 202 is "intentionally noncommittal"; the representation "ought to describe the request's current status and point to (or embed) a status monitor" |
      | Done, nothing useful to return | **204** (with the new `ETag` if relevant) | 15.3.5 |
      | Done, return the new state | **200** + representation | saves the client a GET |
      | Request conflicts with the resource's **current state** | **409** + "enough information for a user to recognize the source of the conflict" (15.5.10) | refunding more than is left |
      | Content is well-formed but **invalid** | **422** | field errors |
      | A **precondition** header was false | **412** (15.5.13) | stale `If-Match` - next section |

      **409 or 422?** Ask whether the **same request could succeed later** without changing it. "Refund
      1500 when 1000 is left" is a conflict with current state (409) - if a capture or a cancelled refund
      changes the state, the same body could work. "amountMinor is 12.5" is invalid whatever the state (422).

      **201 or 202 for a refund that a bank processes later?** If you create a refund **record** right away -
      with an id, `"status": "pending"` and a URL the client can poll - the resource exists: **201**. Use 202
      when there is **no resource yet**, only a job (for example a bulk export). SandPay creates the refund
      record, so it answers 201 with `status: pending`.

  - id: errors
    kind: code
    concepts: [api-response-contract-design]
    title: One error shape - Problem Details as a contract
    body: |
      RFC 9457 gives the shape; **you** design the problem **types**. The `type` member is a URI that
      "identifies the problem type", and "Consumers MUST use the 'type' URI ... as the problem type's primary
      identifier" (3.1.1) - a stable code clients compare, so a client never parses `detail` text. SandPay's
      refund API answers a refund that is too large like this (real output of the practice solution):

      ```http
      HTTP/1.1 409 Conflict
      Content-Type: application/problem+json; charset=utf-8

      {
        "type": "https://api.sandpay.example/problems/refund-exceeds-captured",
        "title": "Refund exceeds the refundable amount",
        "status": 409,
        "detail": "Payment pay_1001 has 3800 minor units left to refund.",
        "refundableMinor": 3800
      }
      ```

      and invalid fields with **one** response listing every problem, using the `errors` extension and
      JSON-pointer style `pointer`s modelled on RFC 9457's own section 3 example:

      ```json
      {
        "type": "https://api.sandpay.example/problems/validation-error",
        "title": "Your request is not valid.",
        "status": 422,
        "errors": [
          { "detail": "must be a positive integer (minor units)", "pointer": "#/amountMinor" },
          { "detail": "must be a string of 1 to 200 characters", "pointer": "#/reason" }
        ]
      }
      ```

      Design rules that follow:

      - **The type is the contract.** Document every type; never change what one means. Adding new types is
        safe for clients that fall back to the status code.
      - **Extension members** (`refundableMinor`) give clients what they need to recover without a second call.
      - A problem with no `type` means `about:blank` - "no additional semantics beyond that of the HTTP
        status code" (RFC 9457 4.2.1). Fine for a generic 500; not for errors clients must tell apart.
      - **Not everyone uses RFC 9457.** Microsoft's Azure guidelines, for example, define their own
        `{"error": {"code": ..., "message": ..., "details": [...]}}` body plus an `x-ms-error-code` response
        header. Choose one shape and use
        it for **every** error your API returns - including 404s for unknown routes and malformed JSON, which
        frameworks otherwise answer with HTML.

  - id: etags
    kind: internals
    concepts: [optimistic-concurrency-etags]
    title: ETags, If-Match and the lost update
    body: |
      Two support agents open refund `re_0001` at the same time. Agent A changes the reason to "Damaged on
      arrival" and saves. Agent B, still looking at the old version, changes it to "Customer changed mind"
      and saves. B's write silently replaces A's - the **lost update**. Locking the record while someone has
      it open doesn't work over HTTP (statelessness), so HTTP offers **optimistic concurrency**:

      - **`ETag`** (RFC 9110 8.8.3) - "an opaque validator" for the current representation. The server
        sends it with every GET, and with every response that creates or changes the resource.
      - **`If-Match`** (13.1.1) - the client sends back the ETag it last saw. It is "most often used with
        state-changing methods (e.g., POST, PUT, DELETE) to prevent accidental overwrites ... (i.e., to
        prevent the 'lost update' problem)". If the tag no longer matches, the server "MUST NOT perform the
        requested method" and may answer **412 Precondition Failed**.
      - **Strong comparison.** For If-Match the server "MUST use the strong comparison function": two tags
        match only if **neither is weak** (`W/"..."`) and they are identical character by character
        (8.8.3.2). `W/"v1"` never satisfies If-Match.
      - **`428 Precondition Required`** (RFC 6585 section 3) - "the origin server requires the request to be
        conditional". Without it, a client that simply forgets If-Match bypasses the whole protection.
      - **`*`** matches if the resource has any current representation.

      **What goes in an ETag?** Anything that changes whenever the representation changes: a version counter
      (`"v7"`), a hash of the body, a database row version. Clients must treat it as opaque. Google's AIP-154
      (company guide) also lets a resource carry an `etag` field in its body, which clients send back
      on update.

      **Order matters** (RFC 9110 13.2.1): preconditions are evaluated "after it has successfully performed
      its normal request checks and just before it would process the request content". A server "MUST ignore
      all received preconditions if its response to the same request without those conditions, prior to
      processing the request content, would have been a status code other than a 2xx ... or 412". So an
      unknown refund is **404** even with a stale If-Match, and a wrong `Content-Type` is **415** - both
      before 412. Field validation of the body comes **after** the precondition.

  - id: visual
    kind: visual
    concepts: [optimistic-concurrency-etags]
    title: Two editors, one refund
    body: |
      ```mermaid
      sequenceDiagram
        participant A as Agent A
        participant B as Agent B
        participant API as SandPay API
        A->>API: GET /payments/pay_1001/refunds/re_0001
        API-->>A: 200, ETag "v1"
        B->>API: GET /payments/pay_1001/refunds/re_0001
        API-->>B: 200, ETag "v1"
        A->>API: PATCH reason, If-Match "v1"
        API-->>A: 200, ETag "v2"
        B->>API: PATCH reason, If-Match "v1"
        API-->>B: 412 precondition-failed
        B->>API: GET again
        API-->>B: 200, ETag "v2", A's reason
        Note over B,API: B sees A's change and decides - nothing is lost silently
      ```

      Notice that the server never locks anything and keeps no session: each PATCH carries everything needed
      to decide (the tag), so the design stays stateless.

  - id: patch-order
    kind: visual
    concepts: [optimistic-concurrency-etags]
    title: The order of checks for a conditional PATCH
    body: |
      ```mermaid
      flowchart TD
        R[PATCH arrives] --> F{Refund exists under this payment?}
        F -- no --> N404[404 refund-not-found]
        F -- yes --> C{Content-Type is merge-patch+json?}
        C -- no --> N415[415 plus Accept-Patch]
        C -- yes --> H{If-Match present?}
        H -- no --> N428[428 precondition-required]
        H -- yes --> M{Strong match with current ETag, or star?}
        M -- no --> N412[412 precondition-failed]
        M -- yes --> V{Only allowed fields, valid values?}
        V -- no --> N422[422 validation-error]
        V -- yes --> OK[200, new ETag, representation]
      ```

      Everything above the If-Match checks needs no request **content**; validation reads it. That is the line
      RFC 9110 13.2.1 draws.

  - id: code-concurrency
    kind: code
    concepts: [optimistic-concurrency-etags]
    title: The conversation on the wire
    body: |
      Real exchanges with the practice solution (`solutions/rest-design/refunds-api.ts`), headers trimmed to
      the ones that matter:

      ```http
      POST /payments/pay_1001/refunds
      Content-Type: application/json

      {"amountMinor": 1200, "reason": "Item returned"}

      HTTP/1.1 201 Created
      Location: /payments/pay_1001/refunds/re_0001
      ETag: "v1"
      Content-Type: application/json; charset=utf-8

      {"id": "re_0001", "paymentId": "pay_1001", "amountMinor": 1200, "currency": "EUR",
       "reason": "Item returned", "status": "pending", "createdAt": "2026-11-14T09:30:00.000Z"}
      ```

      ```http
      PATCH /payments/pay_1001/refunds/re_0001
      Content-Type: application/merge-patch+json

      {"reason": "x"}

      HTTP/1.1 428 Precondition Required
      Content-Type: application/problem+json; charset=utf-8

      {"type": "https://api.sandpay.example/problems/precondition-required", "title": "Precondition Required",
       "status": 428, "detail": "Send If-Match with the ETag from your last GET, so you cannot overwrite a newer change."}
      ```

      ```http
      PATCH /payments/pay_1001/refunds/re_0001
      Content-Type: application/merge-patch+json
      If-Match: "v1"

      {"reason": "Damaged on arrival"}

      HTTP/1.1 200 OK
      ETag: "v2"
      ```

      Sending the same `If-Match: "v1"` again now returns **412** with type `precondition-failed` - the
      second editor's change is refused instead of silently overwriting the first.

      The PATCH body uses **JSON Merge Patch** ([RFC 7396](https://www.rfc-editor.org/rfc/rfc7396), media type
      `application/merge-patch+json`): send only the members to change. RFC 5789 defines PATCH itself and the
      `Accept-Patch` header a server uses to say which patch formats it takes - SandPay sends it with its 415.

  - id: line-by-line
    kind: line-by-line
    concepts: [optimistic-concurrency-etags, api-response-contract-design]
    title: The PATCH handler, line by line
    body: |
      From the reference solution (Express 5; `findRefund` sends the 404 itself; abbreviated - illustrative):

      ```typescript
      app.patch('/payments/:paymentId/refunds/:refundId', (req, res) => {
        const refund = findRefund(req, res);                    // 1. 404 first
        if (!refund) return;
        if (!req.is('application/merge-patch+json')) {           // 2. 415 - no content needed
          res.set('Accept-Patch', 'application/merge-patch+json');
          return sendProblem(res, { type: `${PROBLEMS}unsupported-media-type`, title: 'Unsupported Media Type', status: 415 });
        }
        const ifMatch = req.get('If-Match');
        if (ifMatch === undefined)                               // 3. make the request conditional
          return sendProblem(res, { type: `${PROBLEMS}precondition-required`, title: 'Precondition Required', status: 428 });
        const tags = ifMatch.split(',').map((tag) => tag.trim());
        if (!tags.includes('*') && !tags.includes(etagOf(refund))) // 4. strong comparison
          return sendProblem(res, { type: `${PROBLEMS}precondition-failed`, title: 'Precondition Failed', status: 412 });
        // 5. only now read and validate the body, then apply it and send the NEW ETag
      });
      ```

      - **`findRefund` checks the payment too.** `/payments/pay_1002/refunds/re_0001` is 404 when the refund
        belongs to `pay_1001` - a sub-resource URL is a promise about ownership, and it also stops one merchant
        guessing another's ids through a different parent.
      - **`tags.includes(etagOf(refund))`** compares whole strings including the quotes, so `W/"v1"` can never
        equal `"v1"` - that *is* the strong comparison.
      - **The response carries the new ETag**, so the client can make its next change without another GET.
      - **Express adds its own ETags.** By default Express 5 sets a **weak** ETag computed from the body on
        responses it sends (`app.set('etag', 'weak')` in its `application.js`). Running the solution before
        turning that off showed error responses with headers like `ETag: W/"d5-zxTpp..."`. They can't match
        If-Match (weak), but they're confusing, so the solution calls `app.set('etag', false)` and sets ETags
        only where they mean something.

  - id: collections
    kind: tradeoffs
    concepts: [api-design-for-change]
    title: Designing collections - cursors you can live with
    body: |
      How offset and cursor pagination **behave** - skipped and repeated items when data changes - is covered
      in [Pagination, filtering, sorting and rate limits](#/lesson/pagination-filtering-rate-limits). The
      designer's decisions:

      - **Paginate from version one.** Google's AIP-158: list methods "must provide pagination at the outset,
        as it is a backwards-incompatible change to add pagination to an existing method" - clients that
        expected the whole list in one response would silently get only part of it.
      - **Make the cursor opaque.** AIP-158: page tokens "must be opaque (but URL-safe) strings, and must not
        be user-parseable. This is because if users are able to deconstruct these, they will do so." Once a
        client builds cursors itself, your storage and sort keys are part of the contract. (AIP-158 adds that
        base64 alone "is not a sufficient obfuscation mechanism" - the practice solution uses base64url of the
        sort key for readability; a production API would encrypt or sign it.)
      - **A cursor needs a unique, stable order.** Newest first by `createdAt` alone breaks when two payments
        share a timestamp; add a tie-breaker (`id`). The cursor stores the position of the last item, and the
        next page continues strictly after it - new payments at the top never shift a client's pages.
      - **Cap the page size and say how.** AIP-158's example coerces values above the maximum; others reject them. Either
        is fine if documented; a negative or non-numeric `limit` is always a 400.
      - **Signal the end clearly.** Microsoft's Azure guidelines: don't return `nextLink` "at all when returning
        the last page" and never as `null`. A `Link: <...>; rel="next"` header (RFC 8288 section 3) lets generic
        clients follow pages without knowing your body format.

      The practice solution's first page of five payments, `limit=2`:

      ```http
      GET /payments?limit=2

      HTTP/1.1 200 OK
      Link: </payments?limit=2&cursor=WyIyMDI2LTExLTE0VDA4OjAzOjAwLjAwMFoiLCJwYXlfMjAwNCJd>; rel="next"

      {"data": [{"id": "pay_2005", ...}, {"id": "pay_2004", ...}],
       "nextCursor": "WyIyMDI2LTExLTE0VDA4OjAzOjAwLjAwMFoiLCJwYXlfMjAwNCJd"}
      ```

      Decoded, that cursor is `["2026-11-14T08:03:00.000Z","pay_2004"]` - the sort key of the last item. The
      third page has one payment, no `nextCursor` member and no `Link` header.

  - id: versioning
    kind: when
    concepts: [api-design-for-change]
    title: Versioning and compatible evolution
    body: |
      **Which changes break clients?** GitHub's REST API documentation lists, as **breaking**: removing an
      operation, "Removing or renaming a parameter", "Removing or renaming a response field", "Adding a new
      required parameter", making an optional parameter required, "Changing the type of a parameter or
      response field", "Removing enum values", "Adding a new validation rule to an existing parameter" and
      changing authentication or authorization. **Additive** changes: adding an operation, an optional
      parameter, an optional request header, a response field, a response header, and enum values. Google's
      AIP-180 agrees in substance - for example "New required fields must not be added to existing request
      messages", and default values "must not change".

      **Enum values are the trap.** Adding `"disputed"` to a payment `status` is additive for the server, but
      a client with a `switch` that throws on unknown values breaks. AIP-180 says response enums "expected to
      receive new values should document this". Design rule: document that clients must tolerate unknown
      values - and write your own React client that way.

      **Where the version goes** - three strategies, each used by large real APIs:

      | Strategy | Example | Used by (company docs) | Trade-off |
      | --- | --- | --- | --- |
      | URL path | `/v1/payments` | Google: "included as the first part of the URI path" (AIP-185) | visible, easy to route and cache; a version is a different URL for the same resource |
      | Request header | `X-GitHub-Api-Version: 2022-11-28` | GitHub (no header means 2022-11-28; an unsupported version returns 410 Gone) | clean URLs; invisible in a browser bar and easy to forget in tests |
      | Query parameter | `?api-version=2024-01-01` | Azure: a "required query parameter named api-version", date values | explicit per request; every link and `nextLink` must carry it |

      Whatever you choose: **major versions only** for breaking changes (AIP-185: Google APIs "use v1, not
      v1.0, v1.1, or v1.4.2"), additive changes ship in place, and an old version gets a "well-communicated deprecation
      period" (AIP-185) - GitHub supports a previous version "for at least 24 more months" after a new one.

      **Consistent formats** are part of evolution too: timestamps in RFC 3339 (section 5.6, for example
      `2026-11-14T09:30:00.000Z`; "Applications that generate this format SHOULD use upper case letters" for
      `T` and `Z`), amounts as integers in minor units with a currency code, ids as opaque strings, one naming
      style. Changing any of them later is a breaking change.

  - id: example
    kind: example
    concepts: [rest-constraints-and-resources, api-response-contract-design, optimistic-concurrency-etags]
    title: "Real-world scenario: the dashboard's refund feature"
    body: |
      SandPay's merchant dashboard (React) gets a refund feature. A design review produces:

      | Operation | Request | Success | Errors |
      | --- | --- | --- | --- |
      | Create | `POST /payments/{id}/refunds` `{amountMinor, reason}` | 201, `Location`, `ETag`, refund with `status: pending` | 404 payment-not-found, 409 refund-exceeds-captured (+ `refundableMinor`), 422 validation-error |
      | Read | `GET /payments/{id}/refunds/{refundId}` | 200 + `ETag` | 404 refund-not-found |
      | List | `GET /payments/{id}/refunds?limit&cursor` | 200, `data`, `nextCursor`, `Link` | 400 invalid-parameter / invalid-cursor |
      | Edit reason | `PATCH .../{refundId}` merge-patch + `If-Match` | 200 + new `ETag` | 404, 415, 428, 412, 422 |

      Decisions the team wrote down - each one a sentence a reviewer can challenge:

      - Refunds are a sub-resource because a refund never exists without its payment.
      - 201, not 202: the refund record exists immediately; settlement is a later **state** of it.
      - 409 carries `refundableMinor` so the form can say "at most 38.00 can be refunded" without another request.
      - Edits require If-Match (428 without it): two agents edit refunds during busy periods.
      - Creating refunds also needs protection from **duplicate** submissions - a different problem from lost
        updates, solved with an `Idempotency-Key` header ([Idempotency keys](#/lesson/idempotency-keys)).

      **What a tester checks against this design:** every row's status and headers, the problem `type` of every
      error, that a 412 leaves the resource unchanged, that following `Location` and `Link` works as given, and
      that unknown enum values from the API don't crash the dashboard.

  - id: mistakes
    kind: mistakes
    concepts: [rest-constraints-and-resources, api-response-contract-design, optimistic-concurrency-etags, api-design-for-change]
    title: Common mistakes and how to find them
    body: |
      - **Verbs in URLs** (`POST /refundPayment`, `GET /getPayments`). Re-ask "what **thing** is created or
        read?" - usually a sub-resource (`/payments/{id}/refunds`).
      - **200 for everything**, with `{"success": false}` inside. Clients, caches, monitoring and retries all
        read the status code first; a 200 error is invisible to them.
      - **A different error shape per endpoint** - or HTML error pages from the framework for 404s and bad
        JSON. Find them by sending a malformed body and an unknown URL to every route in a test.
      - **ETag sent, If-Match not required.** Clients that forget the header still overwrite. Use 428.
      - **Precondition checked in the wrong place** - after applying the change, or after validating the
        body, or before the 404. Test: stale tag + unknown id must be 404; stale tag + valid body must be 412
        and leave the resource unchanged.
      - **Returning the old ETag after a change.** The client's next If-Match then fails for no reason. Test:
        PATCH twice in a row with the ETag each response returned.
      - **Offset pagination on a feed that changes**, or a cursor built from a non-unique sort key. Test with
        equal timestamps and with inserts between pages.
      - **"It's only a small rename."** Renaming a response field breaks every client that reads it. Add the
        new field, keep the old one, deprecate it, remove it only in a new major version.

      **Debugging method for "the client says the API changed":** diff the OpenAPI document (or recorded
      responses) between releases; classify each difference with the breaking-change list above; then check
      whether the client tolerated unknown fields and enum values.

  - id: tests
    kind: tests
    concepts: [api-response-contract-design, optimistic-concurrency-etags, api-design-for-change]
    title: Tests that pin the contract down
    body: |
      | # | Case | Expected result | Evidence |
      | --- | --- | --- | --- |
      | 1 | POST a valid refund | 201, `Location` to the new refund, quoted `ETag` | GET on `Location` returns the same body and ETag |
      | 2 | Refund more than is left | 409 `refund-exceeds-captured`, `refundableMinor` | no new refund in the list |
      | 3 | Two invalid fields | one 422 with two `errors` entries and pointers | response body |
      | 4 | PATCH without If-Match | 428 | resource unchanged on GET |
      | 5 | PATCH with a stale ETag | 412 | the first editor's value still there |
      | 6 | PATCH with `W/` + current tag | 412 (strong comparison) | |
      | 7 | PATCH unknown id, stale tag | 404, not 412 | |
      | 8 | PATCH with `application/json` | 415 + `Accept-Patch` | |
      | 9 | Walk all pages, inserting items between pages | every original item exactly once, in order | ids collected by the test |
      | 10 | Last page | no `nextCursor` member, no `Link` | headers |
      | 11 | Malformed JSON, unknown route | Problem Details, not HTML | `Content-Type: application/problem+json` |

      Cases 1-8 and 9-10 are exactly what `tests/rest-design/*.test.ts` in the practice project check.

  - id: summary
    kind: summary
    concepts: [rest-constraints-and-resources, api-response-contract-design, optimistic-concurrency-etags, api-design-for-change]
    title: Quick reference
    body: |
      - REST = constraints (client-server, stateless, cache, uniform interface, layered, optional code-on-demand); most JSON APIs are resource-oriented, without HATEOAS - say so.
      - Resources are nouns; collections plural; sub-resources only for real ownership; actions become resources (`/captures`) or explicit custom methods.
      - 201 + `Location` for creates, 202 when only a job exists, 409 for state conflicts, 422 for invalid content.
      - One error shape everywhere; Problem Details `type` URIs are the stable contract; extensions help recovery.
      - `ETag` out, `If-Match` back; 412 on mismatch (strong comparison), 428 when missing; 404 and 415 come first.
      - Paginate from v1; opaque, URL-safe cursors over a unique sort order; no `nextCursor` and no `Link` on the last page.
      - Additive changes are safe (mostly - enums!); renames, removals, new required inputs are breaking; version only for breaking changes.

exercises:
  - id: capture-url
    type: mcq
    concept: rest-constraints-and-resources
    skill: application
    title: Designing "capture a payment"
    prompt: |
      SandPay payments are authorised first and captured later, sometimes in several partial captures. Which
      design fits a resource-oriented API best?
    options:
      - id: verb
        text: "POST /capturePayment with body {paymentId, amountMinor}"
        feedback: A verb endpoint outside the resource tree - nothing to GET or list afterwards, and every action grows its own URL style.
      - id: put-status
        text: "PUT /payments/pay_1001 with the whole payment and status changed to captured"
        feedback: PUT replaces the representation; the client would have to send every field and couldn't express a partial capture amount. Capture is an action with its own data, not a field edit.
      - id: subresource
        text: "POST /payments/pay_1001/captures with body {amountMinor}, answered by 201 and the capture's Location"
        feedback: Correct - the capture becomes a resource with its own id and amount; partial captures are simply several items in /captures.
      - id: get
        text: "GET /payments/pay_1001/capture?amountMinor=1200"
        feedback: GET must be safe - a capture moves money. Caches, prefetchers and crawlers may send GETs freely.
    correct: [subresource]
    hints:
      - What would a client want to GET or list after capturing?
      - Which method creates something new under a collection?
    solution: |
      **POST to a `captures` sub-resource.** The action's result (a capture: id, amount, time, status) is a
      thing the client can read and list later, which partial captures need. 201 with `Location` tells the
      client where it is. The colon custom-method style from Google's AIP-136
      (`POST /v1/payments/pay_1001:capture`) is also defensible if the API uses it consistently - the verb
      endpoint and the GET are not.
    followUp: |
      How would you design "cancel a pending refund" - a `DELETE`, a `PATCH` of `status`, or a
      `/cancellations` sub-resource? What would you return?

  - id: stateless-mcq
    type: mcq
    concept: rest-constraints-and-resources
    skill: analysis
    title: Which design breaks statelessness?
    prompt: |
      Which of these SandPay dashboard API designs violates Fielding's **stateless** constraint?
    options:
      - id: session-merchant
        text: "POST /select-merchant stores the merchant in the server session; later GET /payments returns that merchant's payments"
        feedback: Correct - GET /payments can't be understood on its own; it depends on "stored context on the server" from an earlier request.
      - id: token
        text: Every request carries an Authorization bearer token, and the server looks the token up to find the user
        feedback: The request still carries all it needs; looking up data the request names isn't stored conversational context. Fielding's constraint is about session state between requests.
      - id: cursor
        text: GET /payments?cursor=... where the cursor encodes the last item's position
        feedback: The cursor travels with the request - this is the stateless way to page.
      - id: db
        text: The server stores payments in a database between requests
        feedback: Resource state lives on the server in every REST design. The constraint is about application (session) state, which belongs to the client.
    correct: [session-merchant]
    hints:
      - "Fielding 5.1.3: each request must contain all of the information necessary to understand it."
      - Distinguish resource state (the payments) from session state (what this client did before).
    solution: |
      **The selected-merchant session.** Fielding: requests "cannot take advantage of any stored context on
      the server. Session state is therefore kept entirely on the client." Put the merchant in the URL
      (`/merchants/m_42/payments`) or a query parameter, and any server behind the load balancer can answer
      any request. Resource state in a database is fine; a token is information the request carries.
    followUp: |
      A login with a server-side session cookie also stores context on the server. Many APIs still do it -
      what do they give up, and when is it a reasonable trade-off?

  - id: status-choice
    type: mcq
    concept: api-response-contract-design
    skill: application
    title: The refund that is too large
    prompt: |
      Payment `pay_1001` captured 50.00 EUR and already has a 40.00 refund. A client sends
      `POST /payments/pay_1001/refunds` with `{"amountMinor": 1500, "reason": "Late delivery"}`. What should
      SandPay's API answer?
    options:
      - id: "400"
        text: 400 Bad Request with a message
        feedback: The request is syntactically fine and valid on its own; 400 tells the client its request is malformed, which it isn't.
      - id: "422"
        text: 422 Unprocessable Content with a field error on amountMinor
        feedback: 1500 is a valid amount; it fails only because of the payment's current state. The same body could succeed if that state changed.
      - id: "409"
        text: 409 Conflict, a refund-exceeds-captured problem type and refundableMinor 1000
        feedback: Correct - a conflict with the current state of the resource, with what the client needs to fix it.
      - id: "201-capped"
        text: 201 Created with a refund of 1000, the most allowed
        feedback: Silently changing the amount the client asked for moves a different sum of money than intended - never do that.
    correct: ["409"]
    hints:
      - Would the identical request ever succeed? When?
      - "RFC 9110 15.5.10: what must a 409 response include?"
    solution: |
      **409 with a specific problem type.** RFC 9110 15.5.10: a conflict "with the current state of the
      target resource", where the server "SHOULD generate content that includes enough information for a user
      to recognize the source of the conflict". The `refundableMinor` extension member lets the dashboard show
      the limit at once. 422 is for content that is invalid regardless of state (`12.5`, a missing reason).
    followUp: |
      Your team's convention is 422 for every business rule failure. Is that wrong? What matters more than
      the choice between 409 and 422?

  - id: async-status
    type: short
    concept: api-response-contract-design
    skill: application
    title: 201 or 202?
    prompt: |
      SandPay adds two operations: (1) `POST /payments/{id}/refunds` - the refund record is created at once
      with `status: pending`, and the bank settles it within two days; (2) `POST /exports` - a CSV of a
      year's payments, built by a nightly batch job. For each, choose the success status, the headers and what
      the body contains, and say why.
    hints:
      - "Does a resource with its own URL exist when the response is sent?"
      - "RFC 9110 15.3.3: what should a 202 response's representation point to?"
    modelAnswer: |
      (1) **201 Created** with `Location: /payments/{id}/refunds/{refundId}`, an `ETag`, and the refund with
      `status: "pending"`. The resource exists immediately; settlement is a later state the client sees by
      GETting it (or through a webhook).

      (2) **202 Accepted**. The CSV doesn't exist yet. RFC 9110 15.3.3 says the representation "ought to
      describe the request's current status and point to (or embed) a status monitor" - so return a job, for
      example `{"id": "exp_9", "status": "queued", "monitor": "/exports/exp_9"}` (and a `Location` to the
      monitor if you like). The monitor later links to the finished file.
    rubric:
      - 201 with Location (and ETag) for the refund, because the record exists now
      - 202 for the export, because only a job exists
      - The 202 body describes status and points to a monitor URL
      - Mentions how the client learns the final outcome (poll the resource/monitor, or webhook)
    solution: |
      The test is whether the **resource** exists when you answer. Pending work inside an existing resource is
      a state, not a reason for 202.

  - id: patch-debug
    type: debug
    concept: optimistic-concurrency-etags
    skill: analysis
    title: The conditional PATCH that still loses updates
    prompt: |
      Agents report that their edits to refund reasons sometimes vanish, and that PATCHing an unknown refund
      with an old tag crashes with a 500. Click **every** line that is wrong. (`etagOf` returns strong tags
      such as `"v2"`.)
    language: typescript
    code: |
      app.patch('/payments/:paymentId/refunds/:refundId', (req, res) => {
        const refund = store.refunds.get(req.params.refundId);
        const ifMatch = req.get('If-Match');
        if (ifMatch && ifMatch.replace('W/', '') !== etagOf(refund!))
          return sendProblem(res, { title: 'Precondition Failed', status: 412 });
        if (!refund)
          return sendProblem(res, { title: 'Refund not found', status: 404 });
        const updated = store.updateRefund(refund.id, { reason: req.body.reason });
        res.set('ETag', etagOf(refund)).json(toRepresentation(updated));
      });
    correctLines: [4, 9]
    lineNotes:
      - line: 6
        note: The 404 check itself is right - the bug is that line 4 runs before it and dereferences a missing refund. Moving the precondition below this check fixes the order.
      - line: 8
        note: Applying the change is fine once the checks above it are right.
      - line: 3
        note: Reading the header is correct; what line 4 does with it is not.
    hints:
      - What happens on line 4 when the client sends no If-Match at all? When it sends W/"v1"?
      - Which ETag does the client need after a successful change?
    solution: |
      **Line 4** has three faults: `ifMatch &&` lets a request **without** If-Match through (so forgetful
      clients overwrite - require it with 428); stripping `W/` turns the strong comparison RFC 9110 requires
      into a weak one; and it runs **before** the 404 check, so `refund!` is undefined for an unknown id and
      `etagOf` throws - a 500 instead of 404 (RFC 9110 13.2.1 puts the precondition after normal request
      checks). **Line 9** sends `etagOf(refund)` - the **old** version's tag - so the client's next If-Match
      fails with 412 although nobody else changed anything; it must be `etagOf(updated)`. Confirm each with a
      test: no If-Match must be 428; `W/` + current tag 412; unknown id + stale tag 404; two PATCHes in a row,
      each with the ETag the previous response returned, both 200.
    followUp: |
      Rewrite the handler in the right order: 404, 415, 428, 412, validation, apply, respond with the new tag.

  - id: refunds-api-coding
    type: coding
    concept: optimistic-concurrency-etags
    skill: application
    title: Build the refunds resource with optimistic concurrency
    prompt: |
      Implement SandPay's refunds sub-resource in `exercises/rest-design/refunds-api.ts`: `POST` (201,
      `Location`, `ETag`), `GET` (200 + `ETag`) and a conditional `PATCH` with JSON Merge Patch (415, 428, 412,
      422 in the order the file's comments give), with every error as Problem Details through `sendProblem`.
      `sandpay-store.ts` and `problem.ts` are given. The comment at the top of the exercise file is the full
      contract.
    project: fullstack
    files:
      - exercises/rest-design/refunds-api.ts
    test: tests/rest-design/refunds-api.test.ts
    command: npx vitest run tests/rest-design/refunds-api.test.ts
    hints:
      - "`express.json({ type: ['application/json', 'application/merge-patch+json'] })` parses both body types; `req.is('application/merge-patch+json')` tests the Content-Type."
      - "Start with toRepresentation (destructure version away) and etagOf (`\"v\" + version` inside double quotes), then POST - the GET and PATCH tests reuse it."
      - "Write one helper that finds the refund and checks `refund.paymentId === req.params.paymentId`, sending the 404 itself."
      - "Split If-Match on commas and trim; accept `*` or an exact string match with the current tag - an exact match is the strong comparison."
      - "Add a final error middleware `(error, req, res, next) => ...` - Express passes JSON parse errors to it with `error.status` 400."
    modelAnswer: |
      ```typescript
      app.post('/payments/:paymentId/refunds', (req, res) => {
        const payment = store.findPayment(req.params.paymentId);
        if (!payment) return sendProblem(res, { type: `${PROBLEMS}payment-not-found`, title: 'Payment not found', status: 404 });
        const errors = validate(req.body);                 // collect every field error, with pointers
        if (errors.length) return sendProblem(res, { type: `${PROBLEMS}validation-error`, title: 'Your request is not valid.', status: 422, errors });
        const refunded = store.refundsFor(payment.id).reduce((sum, r) => sum + r.amountMinor, 0);
        const refundableMinor = payment.status === 'captured' ? payment.amountMinor - refunded : 0;
        if (req.body.amountMinor > refundableMinor)
          return sendProblem(res, { type: `${PROBLEMS}refund-exceeds-captured`, title: 'Refund exceeds the refundable amount', status: 409, refundableMinor });
        const refund = store.addRefund({ paymentId: payment.id, amountMinor: req.body.amountMinor, currency: payment.currency, reason: req.body.reason });
        res.status(201).location(`/payments/${payment.id}/refunds/${refund.id}`).set('ETag', etagOf(refund)).json(toRepresentation(refund));
      });
      ```

      The PATCH handler is the one in the "line by line" section, followed by: reject any field other than
      `reason` (422 with its pointer), apply the change with `store.updateRefund`, and respond with
      `etagOf(updated)`. Validation errors are collected into one list so the client sees every problem at
      once. The full solution, including the error middleware, is in `solutions/rest-design/refunds-api.ts`.
    rubric:
      - Every test in refunds-api.test.ts passes
      - The PATCH checks run in the order 404, 415, 428, 412, 422 - and nothing is changed before the last check passes
      - Every error, including malformed JSON, is application/problem+json with a documented type
      - The response to a successful PATCH carries the new ETag
      - No any; request bodies are treated as unknown and checked
    solution: |
      The tests cover the whole contract: the 201 with `Location` that can be fetched, every problem type, the
      lost-update case (two PATCHes with the same tag - the second 412 and the first change kept), the weak
      tag, the list form and `*` of If-Match, 415 with `Accept-Patch` taking precedence over the missing
      If-Match, and 404 before everything. If only the 415 test fails, check that the Content-Type test runs
      **before** the If-Match test.
    followUp: |
      Add `DELETE /payments/:paymentId/refunds/:refundId` for refunds still `pending`: what status for
      success, for a refund that already succeeded, and should it require If-Match too?

  - id: concurrency-order
    type: order
    concept: optimistic-concurrency-etags
    skill: recall
    title: Order the checks of a conditional PATCH
    prompt: |
      Put SandPay's PATCH checks in the order RFC 9110 section 13.2.1 implies (first check at the top).
    items:
      - id: exists
        text: The refund exists under this payment (else 404)
      - id: media
        text: The Content-Type is a supported patch format (else 415)
      - id: required
        text: An If-Match header is present (else 428)
      - id: match
        text: If-Match strongly matches the current ETag or is * (else 412)
      - id: validate
        text: The patch document's fields and values are valid (else 422)
      - id: apply
        text: Apply the change and answer 200 with the new ETag
    hints:
      - "Preconditions are evaluated after the normal request checks and just before the content is processed."
    solution: |
      404 and 415 need no request **content** and would fail the request anyway, so they come first (13.2.1:
      "failures that can be detected before significant processing occurs take precedence over the
      evaluation of preconditions"). Then the precondition (428 for missing, 412 for stale), then the content
      itself, and only then the change.

  - id: payments-list-coding
    type: coding
    concept: api-design-for-change
    skill: application
    title: Cursor pagination with opaque cursors and Link headers
    prompt: |
      Implement `GET /payments` in `exercises/rest-design/payments-list.ts`: newest first with a tie-breaker,
      `limit` (default 20, above 100 treated as 100, invalid values a 400 problem), an opaque URL-safe
      `cursor` that continues strictly after the last item of the previous page, `nextCursor` and a
      `Link: <...>; rel="next"` header when there is more - and neither on the last page.
    project: fullstack
    files:
      - exercises/rest-design/payments-list.ts
    test: tests/rest-design/payments-list.test.ts
    command: npx vitest run tests/rest-design/payments-list.test.ts
    hints:
      - "Write one comparison function (createdAt descending, then id descending) and use it both to sort and to find the items after the cursor."
      - "`Buffer.from(JSON.stringify([createdAt, id])).toString('base64url')` gives a URL-safe cursor; decoding inside try/catch tells you whether it is valid."
      - "Check `limit` with a regular expression for digits only before converting - `Number('')` is 0 and `Number('2.5')` is 2.5."
      - "Build the Link URL with `new URLSearchParams({ limit: String(limit), cursor })` so the cursor is encoded correctly."
    modelAnswer: |
      ```typescript
      function compare(a: Position, b: Position): number {
        if (a.createdAt !== b.createdAt) return a.createdAt < b.createdAt ? 1 : -1; // newest first
        if (a.id !== b.id) return a.id < b.id ? 1 : -1;                         // unique tie-break
        return 0;
      }

      const sorted = [...store.payments].sort(compare);
      const rest = after ? sorted.filter((payment) => compare(payment, after) > 0) : sorted;
      const page = rest.slice(0, limit);
      const body: { data: Payment[]; nextCursor?: string } = { data: page };
      const last = page.at(-1);
      if (rest.length > limit && last) {
        body.nextCursor = encodeCursor(last);
        res.set('Link', `</payments?${new URLSearchParams({ limit: String(limit), cursor: body.nextCursor })}>; rel="next"`);
      }
      res.json(body);
      ```

      The cursor holds the **sort key** of the last item, not an index, so items inserted at the top don't
      move the next page. Comparing with the same function that sorts guarantees "strictly after" means the
      same thing as the order. The full solution, with `limit` and `cursor` validation, is in
      `solutions/rest-design/payments-list.ts`.
    rubric:
      - Every test in payments-list.test.ts passes
      - The sort order is unique (tie-breaker) and the cursor is the last item's sort key, not an offset
      - The last page has no nextCursor member and no Link header
      - Invalid limit and cursor values are 400 Problem Details with distinct types
    solution: |
      The tests walk all 150 payments (with shared timestamps) page by page and require each exactly once in
      order, insert newer payments between pages, follow the `Link` header as given, and send cursors the
      server never issued. If the walk test sees duplicates, your order isn't unique; if the insert test
      fails, your cursor is a position in the list rather than a sort key.
    followUp: |
      Product asks for "jump to page 7". What would you offer instead with cursors, and what would adding a
      `skip` parameter cost (see AIP-158's "Skipping results")?

  - id: breaking-mcq
    type: mcq
    concept: api-design-for-change
    skill: analysis
    title: Which change can ship without a new version?
    prompt: |
      SandPay's `v1` payments API has many external clients. Which change is **additive** - safe to ship in
      `v1` - by the rules in GitHub's REST API documentation and Google's AIP-180?
    options:
      - id: rename
        text: Rename the response field amount to amountMinor to match the new naming rule
        feedback: Renaming a response field breaks every client that reads amount. Add amountMinor, keep amount, deprecate it.
      - id: required
        text: Make the previously optional reference field required on POST /payments
        feedback: Existing clients that don't send it start getting errors - making an optional parameter required is breaking.
      - id: optional-field
        text: Add an optional metadata object to the payment response and accept it on create
        feedback: Correct - an added response field and an added optional parameter are additive. Clients that ignore unknown fields keep working.
      - id: type
        text: Change createdAt from a Unix timestamp number to an RFC 3339 string
        feedback: Changing the type of a response field is breaking, even if the new format is better. That is why formats should be chosen well in v1.
    correct: [optional-field]
    hints:
      - Which option keeps every request that worked yesterday working, and every response field a client read yesterday the same?
    solution: |
      **Adding an optional field** - in a response and as an optional input - is additive in both GitHub's
      list and AIP-180 ("new components ... may be added to existing APIs in the same major version"). Renames,
      new required inputs and type changes are breaking and need a new major version (or a long
      add-then-deprecate migration). One caveat even for additive changes: clients must ignore unknown fields
      and tolerate unknown enum values - document that expectation.
    followUp: |
      Is adding the payment status `"disputed"` additive? What does it depend on, and how would you protect
      your own React dashboard?

  - id: versioning-short
    type: short
    concept: api-design-for-change
    skill: analysis
    title: Choose a versioning strategy
    prompt: |
      SandPay's API serves its own React dashboard, two mobile apps and external merchants' servers. Choose a
      versioning strategy (URL path, header, or query parameter), and describe your rules for what needs a new
      version and how old versions are retired. Justify with at least one trade-off.
    hints:
      - Who is affected by a version change, and how do they discover and test it?
      - Which changes ship without a version change at all?
    modelAnswer: |
      **URL path major versions** (`/v1/...`), as Google's AIP-185 does: visible in logs, docs, browser bars
      and gateway routing, easy for merchants to test with curl. Trade-off: a version is part of every URL, so
      links and cursors must carry it, and the same resource has two URLs during a migration.

      Rules: only **breaking** changes (removals, renames, type changes, new required inputs, new validation on
      existing inputs, removed enum values) create a new major version; **additive** changes ship in place.
      Clients are told to ignore unknown fields and tolerate unknown enum values. Old versions get a dated,
      announced deprecation (a period of many months - GitHub, for comparison, supports the previous version
      at least 24 months), and our own dashboard migrates first. A date-based header (like GitHub's
      `X-GitHub-Api-Version`) is a good alternative when we expect many small breaking changes, at the cost of
      versions being invisible in URLs.
    rubric:
      - Picks one strategy and gives a real trade-off of it
      - Defines breaking versus additive changes concretely
      - Has a deprecation and retirement policy with communication
      - Mentions client tolerance for unknown fields and enum values
    solution: |
      Any of the three strategies is defensible; what reviewers look for is a clear rule for what is breaking,
      that additive changes don't bump the version, and a humane retirement policy.

  - id: interview-design-api
    type: interview
    concept: rest-constraints-and-resources
    skill: application
    title: "Interview: design the refunds API"
    prompt: |
      *"Design the REST API for refunds in our payments dashboard. Agents can create refunds, see them, and
      edit the reason. Walk me through URLs, methods, status codes and errors - and tell me what could go
      wrong in production."*
    hints:
      - Resources and URLs first, then each operation's success and failure statuses, then concurrency, duplicates and evolution.
    modelAnswer: |
      Refunds belong to one payment, so they are a sub-resource: `POST /payments/{id}/refunds` to create,
      `GET /payments/{id}/refunds` (cursor-paginated from day one) and `GET .../refunds/{refundId}`, and
      `PATCH .../refunds/{refundId}` with JSON Merge Patch for the reason.

      Create returns **201** with `Location`, an `ETag` and the refund in `status: pending` - the record exists
      even though the bank settles later. Errors are Problem Details with documented types: 404 for an unknown
      payment, 422 with field pointers for invalid input, **409** when the amount exceeds what is refundable,
      with `refundableMinor` so the UI can show the limit.

      Production risks: two agents editing the same refund - **ETag + If-Match**, 412 on a stale tag and 428
      when the header is missing, checked after 404/415 and before validation. Double-clicks and retries
      creating two refunds - an **Idempotency-Key** header on POST. Clients breaking when we evolve - only
      additive changes in v1, clients must ignore unknown fields and statuses, breaking changes in v2 with a
      deprecation period. And every error, including framework 404s and bad JSON, uses the same shape.
    rubric:
      - Sub-resource URLs with a reason; standard methods with correct semantics
      - 201 + Location (+ ETag) for create, with a justification versus 202
      - Distinguishes 409 (state) from 422 (invalid input); one documented error shape
      - Lost updates handled with ETag/If-Match/412/428
      - Duplicates handled separately with idempotency keys
      - Pagination and evolution (additive vs breaking, versioning) considered
    followUps:
      - Why not lock the refund while an agent has it open?
      - A partner's integration broke after you added a status value. Whose fault is it, and what do you change?
      - How would you test that the 412 really prevents a lost update?
      - When would you use 202 instead of 201 here?
    solution: |
      Strong answers move from resources to per-operation contracts to failure modes, and keep two
      different problems apart: lost updates (ETags) and duplicate creates (idempotency keys).

placement:
  - id: place-resources
    type: mcq
    concept: rest-constraints-and-resources
    skill: application
    title: Where do refunds live?
    prompt: |
      A refund always belongs to exactly one payment. A customer can have many payments, and exists without
      any of them. Which URL design follows resource-oriented conventions?
    options:
      - id: good
        text: /payments/{paymentId}/refunds/{refundId} and /customers/{customerId}, with payments referring to customers by id
        feedback: Correct - hierarchy for real ownership (refunds), separate top-level resources where things exist independently (customers).
      - id: all-nested
        text: /customers/{customerId}/payments/{paymentId}/refunds/{refundId} as the only URL for refunds
        feedback: Payments exist independently of the customer view, so deep nesting forces clients to know the customer for every refund and gives payments two parents.
      - id: verbs
        text: /createRefund, /getRefund and /updateRefundReason
        feedback: Verb endpoints give up the uniform interface - every operation invents its own URL.
      - id: flat-param
        text: /refunds?action=create&paymentId=...
        feedback: Encoding the action in a query parameter hides the operation from HTTP; methods carry the action.
    correct: [good]
    solution: |
      Nest only where ownership is real and unique; give independent things their own top-level collections
      and refer to them by id. Methods, not URLs, carry the action.

  - id: place-contract
    type: mcq
    concept: api-response-contract-design
    skill: application
    title: The response to a successful create
    prompt: |
      `POST /payments/pay_1001/refunds` succeeds and the refund record `re_0007` now exists with
      `status: pending`. What should the response be?
    options:
      - id: "201"
        text: "201 Created, Location: /payments/pay_1001/refunds/re_0007, an ETag, and the refund"
        feedback: Correct - RFC 9110 9.3.3 says a POST that creates a resource SHOULD answer 201 with a Location.
      - id: "200"
        text: '200 OK with {"success": true}'
        feedback: The client can't find the new refund or its state, and 200 says nothing was created.
      - id: "202"
        text: 202 Accepted, because the bank has not settled the refund yet
        feedback: The resource already exists; pending settlement is its state. 202 is for when only a job exists.
      - id: "204"
        text: 204 No Content
        feedback: 204 gives the client no id or Location for the resource it just created.
    correct: ["201"]
    solution: |
      201 with `Location` identifies the new resource; the body and ETag save the client a GET. Settlement is a
      later state of the same resource.

  - id: place-etag
    type: debug
    concept: optimistic-concurrency-etags
    skill: analysis
    title: Find the lost-update bug
    prompt: |
      Which line lets one agent's edit silently overwrite another's? (`etagOf` returns strong tags like `"v3"`.)
    language: typescript
    code: |
      const refund = findRefund(req, res);
      if (!refund) return;
      const ifMatch = req.get('If-Match');
      if (ifMatch !== undefined && ifMatch !== etagOf(refund))
        return sendProblem(res, { title: 'Precondition Failed', status: 412 });
      const updated = store.updateRefund(refund.id, { reason: req.body.reason });
      res.set('ETag', etagOf(updated)).json(toRepresentation(updated));
    correctLines: [4]
    lineNotes:
      - line: 7
        note: Returning the new ETag is correct.
      - line: 1
        note: Finding the refund first (404 before the precondition) is the right order.
    solution: |
      **Line 4** skips the check when If-Match is **missing** (`ifMatch !== undefined && ...`), so any client
      that doesn't send it overwrites freely. Require it: no header means 428 Precondition Required (RFC 6585
      section 3).

  - id: place-change
    type: mcq
    concept: api-design-for-change
    skill: application
    title: Pagination in v1?
    prompt: |
      `GET /merchants/{id}/payouts` returns about 30 payouts per merchant today, so the team wants to ship v1
      without pagination and "add it later if needed". What is the problem?
    options:
      - id: breaking
        text: Adding pagination later is a breaking change - existing clients would silently receive only the first page
        feedback: Correct - AIP-158 requires pagination "at the outset" for exactly this reason.
      - id: performance
        text: Only performance - 30 items is fine, so there is no problem
        feedback: The list grows, and the fix (paginating) changes what existing clients receive. The issue is the contract, not today's speed.
      - id: rest
        text: REST forbids lists without pagination
        feedback: Fielding's constraints say nothing about pagination; this is a contract-evolution concern.
      - id: offset
        text: None, as long as offset pagination is used later
        feedback: Any kind of pagination added later truncates responses for clients that expect the full list.
    correct: [breaking]
    solution: |
      Clients written against an unpaginated list assume one response holds everything. When pagination
      arrives, they get the first page and believe it is complete. Paginate from version one, even with a
      generous default page size.

recall:
  - id: recall-constraints
    concept: rest-constraints-and-resources
    prompt: Name Fielding's REST constraints. Which one is optional?
    answer: Client-server, stateless, cache, uniform interface, layered system, and code-on-demand - which is the optional one.
  - id: recall-stateless
    concept: rest-constraints-and-resources
    prompt: What does the stateless constraint require?
    answer: Each request contains all the information needed to understand it and can't use stored context on the server; session state is kept on the client.
  - id: recall-action
    concept: rest-constraints-and-resources
    prompt: How do you model an action like "capture a payment" without a verb URL?
    answer: Make its result a sub-resource (POST /payments/{id}/captures, 201 + Location), or use one consistent custom-method convention such as Google's POST .../payments/{id}:capture.
  - id: recall-409-422
    concept: api-response-contract-design
    prompt: When is a failure 409 rather than 422?
    answer: 409 when the request conflicts with the resource's current state (the same request could succeed later); 422 when the content itself is invalid whatever the state.
  - id: recall-problem-type
    concept: api-response-contract-design
    prompt: In Problem Details, which member do clients program against, and what does a missing one mean?
    answer: The type URI - a stable, documented identifier. A missing type means about:blank - no meaning beyond the status code.
  - id: recall-if-match
    concept: optimistic-concurrency-etags
    prompt: How do ETag, If-Match, 412 and 428 prevent lost updates?
    answer: The server sends an ETag; the client sends it back in If-Match when changing the resource. A tag that no longer matches (strong comparison) gets 412 and nothing changes; a missing If-Match gets 428 when the server requires it.
  - id: recall-order
    concept: optimistic-concurrency-etags
    prompt: Why is an unknown id 404 even when If-Match is stale?
    answer: RFC 9110 13.2.1 - preconditions are ignored if the request would fail anyway before its content is processed; 404 and 415 take precedence over 412.
  - id: recall-cursor
    concept: api-design-for-change
    prompt: What makes a good pagination cursor?
    answer: Opaque and URL-safe, encoding the last item's position in a unique, stable sort order (a tie-breaker such as id), so pages continue strictly after it; no cursor and no next Link on the last page.

