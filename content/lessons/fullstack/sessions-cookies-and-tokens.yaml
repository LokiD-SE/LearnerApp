id: sessions-cookies-and-tokens
title: Sessions, cookies and tokens
subject: fullstack
module: security-auth
level: intermediate
status: published
estimatedMinutes: 70
summary: How a stateless protocol remembers who you are - cookie attributes and the __Host- prefix, server-side sessions with rotation and timeouts, signed access tokens with jose, refresh-token rotation, where a browser app should keep its credentials, and logging out so that it actually ends something. Every HTTP exchange and token result shown here came from a real run.
tags:
  [
    sessions,
    cookies,
    set-cookie,
    secure,
    httponly,
    samesite,
    __Host- prefix,
    session fixation,
    session timeout,
    logout,
    jwt,
    jose,
    access token,
    refresh token,
    token rotation,
    localStorage,
    csrf,
    backend for frontend,
    express,
    cookie-parser,
  ]

environment: |
  - **Runtime and libraries:** **Node.js 24** (v24.21.0), **Express 5.3.0**, **cookie-parser 1.4.7** and **jose
    6.2.14**, the versions pinned in `practice/fullstack`. Every `Set-Cookie` header, HTTP status and jose result in
    this lesson was captured from real runs with supertest on Linux in November 2026. Session ids and token
    signatures are random or key-dependent and change on every run.
  - **Cookies:** [RFC 6265](https://www.rfc-editor.org/rfc/rfc6265) (2011, the published standard) and its revision
    [draft-ietf-httpbis-rfc6265bis-22](https://datatracker.ietf.org/doc/draft-ietf-httpbis-rfc6265bis/) (December
    2025). The draft is **not yet an RFC**: it was submitted for publication and is in the RFC Editor's queue when
    this was written, but browsers already implement most of it. `SameSite`, the `__Secure-` and `__Host-` prefixes
    and the 400-day lifetime cap come from the draft (sections 4.1.2.7, 4.1.3, 5.5 and 5.7 step 19-21), not from
    RFC 6265. [MDN Set-Cookie](https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Set-Cookie) for
    browser behaviour ("Some browsers use Lax as the default value if SameSite is not specified").
  - **Sessions:** OWASP [Session Management Cheat
    Sheet](https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html) - at least 64 bits
    of entropy, "a CSPRNG with a size of at least 128 bits" if you generate ids yourself, renew the id "after any
    privilege level change", idle and absolute timeouts, `__Host-` "Recommended for session IDs".
  - **Tokens:** [RFC 7519](https://www.rfc-editor.org/rfc/rfc7519) (JWT), [RFC 8725](https://www.rfc-editor.org/rfc/rfc8725)
    (JWT Best Current Practices - 3.1 algorithm verification, 3.5 key entropy, 3.8-3.9 issuer and audience, 3.11
    explicit typing), [RFC 9068](https://www.rfc-editor.org/rfc/rfc9068) (the `at+jwt` type for access tokens),
    [RFC 9700](https://www.rfc-editor.org/rfc/rfc9700) section 4.14 (refresh token rotation and replay detection),
    the OWASP [JSON Web Token Cheat
    Sheet](https://cheatsheetseries.owasp.org/cheatsheets/JSON_Web_Token_Cheat_Sheet.html) (MAC secrets of at least
    the output size, the session-invalidation problem) and the [jose documentation](https://github.com/panva/jose).
  - **Browser storage and CSRF:** OWASP [HTML5 Security Cheat
    Sheet](https://cheatsheetseries.owasp.org/cheatsheets/HTML5_Security_Cheat_Sheet.html) ("Do not store session
    identifiers in local storage") and [CSRF Prevention Cheat
    Sheet](https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html);
    [draft-ietf-oauth-browser-based-apps-27](https://datatracker.ietf.org/doc/draft-ietf-oauth-browser-based-apps/)
    (August 2026, an Internet-Draft intended as a Best Current Practice) section 6.1, "Backend For Frontend (BFF)".
  - **Express:** [res.cookie and res.clearCookie](https://expressjs.com/en/5x/api.html#res.cookie) (`maxAge` is in
    **milliseconds**) and the [cookie-parser README](https://github.com/expressjs/cookie-parser#readme).
  - **Fictional:** SandPay, its dashboard, users, emails, passwords, ids and every key. The keys in code are
    obviously test-only strings; never use a string you can type as a real signing key.
  - **Not covered here:** OAuth 2.0 flows and token checks from the tester's side
    ([Authentication and authorization for API testers](#/lesson/authentication-and-authorization)), password
    hashing and OpenID Connect ([Password storage, OAuth 2.0 and OpenID
    Connect](#/lesson/passwords-oauth-and-oidc)), and XSS and CSRF in depth ([The OWASP Top 10 for
    developers](#/lesson/owasp-top-10-for-developers)).

prerequisites:
  - express-http-server
  - authentication-and-authorization

concepts:
  - id: cookie-attributes-and-prefixes
    name: Cookie attributes and the __Host- prefix
    summary: A Set-Cookie header tells the browser where and when to send a value back. Secure keeps it off plain HTTP, HttpOnly keeps it away from JavaScript, SameSite controls cross-site requests, Path and Domain set the scope and Max-Age or Expires the lifetime. A __Host- name makes the browser refuse the cookie unless it is Secure, Path=/ and has no Domain.
  - id: server-side-session-lifecycle
    name: The server-side session lifecycle
    summary: The server keeps the session and the browser keeps only an unguessable random id. Issue a new id at login (and every privilege change) to stop session fixation, end sessions after an idle timeout and an absolute timeout, and delete the session on the server at logout - clearing the cookie alone ends nothing.
  - id: stateless-access-tokens
    name: Signed access tokens and their limits
    summary: A JWT access token carries signed claims, so an API can check it without a lookup - but only if it verifies the signature with an allowed algorithm and checks iss, aud, typ and exp. The price is revocation - a valid token works until it expires - so access tokens are kept short-lived and refreshed with rotating refresh tokens whose reuse is detected.
  - id: browser-token-storage
    name: Where a browser app keeps its credentials
    summary: Anything JavaScript can read, an XSS bug can steal - so HttpOnly cookies beat localStorage for session ids and tokens. Cookies are sent automatically, which brings CSRF back, handled by SameSite plus a CSRF defence. A Backend for Frontend keeps OAuth tokens on the server and gives the browser only a session cookie.

objectives:
  - Write a Set-Cookie header for a session id with the right attributes, and explain what each attribute and the __Host- prefix protect against.
  - Implement server-side sessions that rotate the id at login, enforce idle and absolute timeouts and invalidate the session at logout.
  - Issue and verify JWT access tokens with jose, rejecting tampered tokens, unexpected algorithms, wrong issuers, audiences and types, and expired tokens.
  - Explain why a stateless token can't be revoked before it expires, and design short-lived access tokens with refresh-token rotation and reuse detection.
  - Choose where a browser app should store its credentials, weighing XSS against CSRF, and describe the Backend for Frontend pattern.
  - Design tests that prove a logout, a timeout or a rotation really happened on the server, not only in the browser.

sections:
  - id: intuition
    kind: intuition
    concepts: [server-side-session-lifecycle, stateless-access-tokens]
    title: The idea in plain language
    body: |
      HTTP forgets you after every request. Two everyday systems show the two ways around that.

      A **cloakroom ticket** is a server-side session. You hand over your coat and get a numbered ticket.
      The ticket itself is worthless - it is just a number - and the cloakroom keeps the list of which number
      goes with which coat. If you lose the ticket, the attendant can cross that number off the list and the
      ticket stops working at once. The attendant can also refuse tickets older than tonight.

      A **festival wristband** is a signed token. It carries everything on it - your name, the days you paid
      for, a hologram that's hard to fake - so any gate can let you in without phoning the office. That is
      fast and needs no shared list. But if someone cuts your wristband off and wears it, every gate keeps
      letting them in until the date printed on it passes, because no gate is checking a list.

      A browser **cookie** is just the pocket the ticket or the wristband travels in: the server asks the
      browser to keep a value and send it back on later requests. This lesson is about choosing the ticket or
      the wristband, putting it in a pocket that pickpockets can't reach, and making "log out" cross the number
      off the list rather than only emptying the pocket.

  - id: what
    kind: what
    concepts: [cookie-attributes-and-prefixes, server-side-session-lifecycle, stateless-access-tokens]
    title: Cookies, sessions and tokens - the vocabulary
    body: |
      - A **cookie** is a name and a value that a server sets with a `Set-Cookie` response header and the
        browser sends back in a `Cookie` request header on later matching requests (RFC 6265).
      - A **cookie attribute** is a rule after the value: `Secure`, `HttpOnly`, `SameSite`, `Path`, `Domain`,
        `Max-Age`, `Expires`. Attributes go only from server to browser - the `Cookie` header the browser sends
        back carries just `name=value`, so the server can't see which attributes a cookie was set with.
      - A **session** is state the server keeps about a logged-in user (who they are, when they logged in,
        when they were last active). The browser holds only the **session id**, an unguessable random value
        that points to it. This is **stateful** authentication.
      - An **access token** is a credential a client sends to an API, usually as `Authorization: Bearer
        <token>`. When it is a **JWT** (RFC 7519), it is self-contained: a header, a set of **claims** (`iss`
        issuer, `sub` subject, `aud` audience, `exp` expiry, `iat` issued at, `jti` token id) and a signature.
        The API checks the signature and claims without a database lookup. This is **stateless**
        authentication.
      - A **refresh token** is a longer-lived credential used only to get new access tokens from the issuer.
      - **Logout** means making the credential stop working - for a session, deleting it on the server; for a
        token, it can only mean "stop using it" unless the server keeps some state (a deny list, or the
        refresh token's record).

      The Track C lesson [Authentication and authorization for API
      testers](#/lesson/authentication-and-authorization) covers what an API tester checks about bearer tokens
      and 401 versus 403. Here you are on the other side: **building** the login, the session and the token
      checks.

  - id: why
    kind: why
    concepts: [server-side-session-lifecycle, browser-token-storage]
    title: Why it matters
    body: |
      Session and token handling is where a lot of serious web bugs live, and they are rarely visible in a
      quick manual test. The draft dashboard in this lesson's first exercise "worked" when clicked through -
      login, view orders, logout - yet a real run showed:

      - a cookie **planted** in the browser before login (`sid=attacker-chosen-id`) became the logged-in
        session - whoever planted it was logged in too (**session fixation**);
      - the session was still valid **16 minutes** after the last click and would have been forever;
      - after **logout**, replaying the old cookie still returned the user's data with **200**.

      OWASP's 2021 Top 10 lists these under *A07 Identification and Authentication Failures*, and the OWASP
      Session Management Cheat Sheet calls renewing the id at login "mandatory". On the token side, the
      classic failures are just as quiet: an API that **decodes** a JWT instead of verifying it, or that
      accepts any algorithm the token asks for, works perfectly with real tokens - and also with forged ones.

      For a full stack developer the decision is architectural too: sessions or tokens, cookies or
      `localStorage`, and what "log out everywhere" will mean when an account is compromised. These choices
      are hard to change after launch.

  - id: internals
    kind: internals
    concepts: [cookie-attributes-and-prefixes]
    title: How the browser stores and sends a cookie
    body: |
      When a response carries `Set-Cookie`, the browser runs the storage algorithm in RFC 6265bis section 5.7.
      The parts that matter for security:

      | Attribute | What the browser does | Protects against |
      |---|---|---|
      | `Secure` | Sends the cookie only over HTTPS (MDN: browsers make an exception for `localhost`). A secure cookie set from plain HTTP is ignored. | Network attackers reading or injecting it on plain HTTP |
      | `HttpOnly` | Hides it from `document.cookie` and other non-HTTP APIs. | Script (an XSS bug) reading the session id |
      | `SameSite=Strict` | Sends it only on same-site requests. Even following a link from another site arrives without it. | Cross-site request forgery |
      | `SameSite=Lax` | Same-site requests, plus cross-site **top-level navigations** with a **safe** method (GET). A cross-site `fetch`, `<img>` or form POST arrives without it. | Most CSRF, while links from email still land logged in |
      | `SameSite=None` | Sends it on cross-site requests too. The browser ignores it unless it is also `Secure` (6265bis 5.7 step 19). | Nothing - only for genuine cross-site use (embedded widgets) |
      | `Path=/` | Sends it for every path on the host. | - |
      | no `Domain` | **Host-only**: sent only to the exact host that set it, not its subdomains. | A compromised `blog.sandpay.example` reading or overwriting the dashboard's cookie |
      | `Max-Age` / `Expires` | Deletes it after that time. Without either, it is a "session cookie" kept until the browser decides the session is over (6265bis 4.1.2.2). Max-Age wins if both are present. Browsers cap lifetimes at 400 days (6265bis 5.5). | Old credentials lingering on shared machines |

      **Cookie prefixes** turn conventions into rules the browser enforces (6265bis 4.1.3):

      - `__Secure-name` is accepted only with `Secure`.
      - `__Host-name` is accepted only with `Secure`, `Path=/` and **no** `Domain`. A subdomain or a plain-HTTP
        page can't set or overwrite it, and the server knows, just from the name, how the cookie was set - even
        though the attributes never travel back. OWASP marks `__Host-` "Recommended for session IDs".

      Two details trip people up. A cookie's identity is its **name, domain and path**: to replace or delete
      a cookie, `Set-Cookie` must repeat the same domain and path, or the browser stores a second cookie next
      to the first. And `SameSite` is about **sites** (scheme plus registrable domain), not origins:
      `dashboard.sandpay.example` and `api.sandpay.example` are the same site, so `SameSite` does not protect
      one subdomain from another.

      The draft also says a `SameSite` value the browser doesn't recognise gets a default equivalent to `Lax`,
      and MDN notes that "some browsers use Lax as the default value if SameSite is not specified" - but not
      all, so always set it explicitly.

  - id: visual
    kind: visual
    concepts: [server-side-session-lifecycle, cookie-attributes-and-prefixes]
    title: A session from login to logout
    body: |
      ```mermaid
      sequenceDiagram
        participant B as Browser
        participant A as Dashboard API
        participant S as Session store
        Note over B: may already hold an old or planted __Host-sid
        B->>A: POST /login with email and password
        A->>A: verify the password
        A->>S: delete the old id, if the request had one
        A->>S: create new id with userId, createdAt, lastSeenAt
        A-->>B: 200 and Set-Cookie __Host-sid=new id, Secure, HttpOnly, SameSite=Lax, Path=/
        B->>A: GET /me with Cookie __Host-sid
        A->>S: look up the id, check idle and absolute timeouts
        S-->>A: session found and fresh, lastSeenAt updated
        A-->>B: 200 with the user
        B->>A: POST /logout with Cookie __Host-sid
        A->>S: delete the session
        A-->>B: 204 and Set-Cookie __Host-sid empty, Expires in 1970
      ```

      Notice where the truth lives: in the **store**. Rotation, timeouts and logout are all store operations;
      the cookie changes only so the browser stops sending a dead id. A test that checks only the cookie
      header can't tell a real logout from a cosmetic one.

  - id: cookie-code
    kind: code
    concepts: [cookie-attributes-and-prefixes]
    title: Setting and clearing cookies in Express 5
    body: |
      Express builds `Set-Cookie` with `res.cookie(name, value, options)`; cookie-parser fills `req.cookies`
      from the request's `Cookie` header. A small app (`cookies.mjs`) and the headers it really produced:

      ```javascript
      import { randomBytes } from 'node:crypto';
      import express from 'express';
      import cookieParser from 'cookie-parser';

      const app = express();
      app.use(cookieParser());

      const session = { secure: true, httpOnly: true, sameSite: 'lax', path: '/' };

      app.post('/login', (req, res) => {
        const id = randomBytes(32).toString('base64url');   // see "Generating the id" below
        res.cookie('__Host-sid', id, session);
        res.status(204).end();
      });
      app.post('/remember', (req, res) => {
        res.cookie('theme', 'dark', { maxAge: 30 * 24 * 60 * 60 * 1000 }); // milliseconds!
        res.status(204).end();
      });
      app.post('/logout', (req, res) => {
        res.clearCookie('__Host-sid', session);             // same path (and domain) as when set
        res.status(204).end();
      });
      app.get('/me', (req, res) => res.json({ cookies: req.cookies }));
      ```

      ```plaintext
      POST /login  -> 204
        Set-Cookie: __Host-sid=M816sybNVWGlXOOrcvYWWhTqQvcAwFTVgd0fIWIrrHQ; Path=/; HttpOnly; Secure; SameSite=Lax
      POST /remember -> 204
        Set-Cookie: theme=dark; Max-Age=2592000; Path=/; Expires=Mon, 14 Dec 2026 07:02:45 GMT
      POST /logout -> 204
        Set-Cookie: __Host-sid=; Path=/; Expires=Thu, 01 Jan 1970 00:00:00 GMT; HttpOnly; Secure; SameSite=Lax
      GET /me  (Cookie: __Host-sid=abc; theme=dark) -> 200
        {"cookies":{"__Host-sid":"abc","theme":"dark"}}
      ```

      What the run shows:

      - Express's `maxAge` option is in **milliseconds**; it wrote `Max-Age=2592000` (seconds) **and** an
        `Expires` date for older browsers. Passing `2592000` to `maxAge` would have made a 43-minute cookie.
      - Express defaults `Path` to `/`, but write it anyway - `__Host-` requires it.
      - `clearCookie` sends an empty value with an `Expires` date in 1970, which tells the browser to delete
        the cookie. It only works if the name, path and domain match the cookie being deleted.
      - The `Cookie` request header carries only names and values. The server can't tell whether `theme` was
        set `Secure` - which is exactly what the `__Host-` name guarantees for `__Host-sid`.

      **Generating the id.** Use the operating system's cryptographically secure generator, not
      `Math.random()` and not a counter:

      ```javascript
      import { randomBytes } from 'node:crypto';
      const id = randomBytes(32).toString('base64url'); // 256 bits, 43 characters
      ```

      OWASP asks for at least 64 bits of entropy and, if you generate ids yourself, "a CSPRNG with a size of
      at least 128 bits". Thirty-two bytes is comfortably above both.

  - id: sessions
    kind: steps
    concepts: [server-side-session-lifecycle]
    title: Server-side sessions done properly
    body: |
      1. **Store sessions on the server**, keyed by id: `{ userId, createdAt, lastSeenAt }` and whatever else
         you need (roles, a CSRF token). In production that is a database table or Redis, not process memory -
         memory disappears on restart and isn't shared between instances.
      2. **At login, after the password check, delete any session id the request arrived with and issue a new
         one.** This is the session fixation defence. If an attacker can get a known id into the victim's
         browser before login (a crafted link on an app that accepts ids in URLs, a cookie set from a
         compromised subdomain, a shared kiosk), keeping that id would hand the attacker the logged-in
         session. Do the same on every **privilege change**: password change, switching to an admin role,
         completing a second factor.
      3. **Set the cookie** as `__Host-sid=<id>; Secure; HttpOnly; SameSite=Lax; Path=/` - or `Strict` if
         landing logged-in from external links isn't needed.
      4. **On every request**, look the id up. Reject unknown ids. Enforce two timeouts:
         - **idle**: `now - lastSeenAt > idleTimeout` - OWASP suggests 2-5 minutes for high-value apps and 15-30
           for low-risk ones;
         - **absolute**: `now - createdAt > absoluteTimeout` - a session can't live for ever even if it is used
           every minute (OWASP: for example 4-8 hours for an app used through an office day).

         Expired sessions are deleted, not just refused. Update `lastSeenAt` on successful use.
      5. **At logout, delete the session on the server**, then clear the cookie with the same attributes.
         Clearing only the cookie leaves a valid session that any copy of the id - in a proxy log, a stolen
         backup, another tab - can still use.
      6. **Log session events** (created, rotated, expired, destroyed) with the user and a request id - but
         never the id itself, which is a credential. Many stores keep only a hash of it for the same reason.

      The real run against this lesson's reference solution, with a planted cookie and a fake clock:

      ```plaintext
      POST /login  (Cookie: __Host-sid=attacker-chosen-id)  -> 200
        Set-Cookie: __Host-sid=63-aPYYDAHU4ONlbopnoGm0GAGuPI8iXg8dgipdOTLw; Path=/; HttpOnly; Secure; SameSite=Lax
      GET /me  with the planted id            -> 401 {"error":"not_authenticated"}
      GET /me  with the issued id             -> 200 {"userId":"usr_1001"}
      GET /me  after 16 idle minutes          -> 401 {"error":"session_expired"}  (and a clearing Set-Cookie)
      POST /logout                            -> 204, clearing Set-Cookie
      GET /me  replaying the logged-out id    -> 401 {"error":"not_authenticated"}
      ```

      The same script against the first draft (a `sid` cookie, the incoming id reused, no timeouts, logout
      only clearing the cookie) gave **200** for the planted id, **200** after 16 idle minutes and **200** for
      the replayed id after logout.

  - id: tokens
    kind: code
    concepts: [stateless-access-tokens]
    title: Issuing and verifying access tokens with jose
    body: |
      An API that accepts JWT access tokens must **verify**, not just decode. jose's `jwtVerify` does the
      checks RFC 8725 asks for - if you give it the options:

      ```typescript
      import { SignJWT, jwtVerify } from 'jose';

      const secret = new TextEncoder().encode('test-only-secret-0123456789abcdef-NOT-FOR-PROD'); // test only
      const iat = Math.floor(Date.parse('2026-11-14T10:00:00Z') / 1000);

      const token = await new SignJWT({ role: 'merchant_admin' })
        .setProtectedHeader({ alg: 'HS256', typ: 'at+jwt' })
        .setIssuer('https://auth.sandpay.example')
        .setAudience('sandpay-dashboard-api')
        .setSubject('usr_1001')
        .setIssuedAt(iat)
        .setExpirationTime(iat + 300)   // five minutes
        .setJti('at_7f3c')
        .sign(secret);

      const { payload } = await jwtVerify(token, secret, {
        algorithms: ['HS256'],                     // RFC 8725 3.1 - an allow-list, never "whatever the header says"
        issuer: 'https://auth.sandpay.example',    // 3.8
        audience: 'sandpay-dashboard-api',         // 3.9 - a token for another API must not work here
        typ: 'at+jwt',                             // 3.11 and RFC 9068 - an ID token is not an access token
        clockTolerance: 30,                        // seconds of clock skew between servers
      });
      ```

      Real results from verifying that token and altered copies (with `currentDate` set to a fixed time):

      ```plaintext
      header:  {"alg":"HS256","typ":"at+jwt"}
      payload: {"role":"merchant_admin","iss":"https://auth.sandpay.example","aud":"sandpay-dashboard-api",
                "sub":"usr_1001","iat":1794650400,"exp":1794650700,"jti":"at_7f3c"}

      valid at 10:02                          -> OK sub=usr_1001
      at 10:05:20 (20 s past exp, tolerance 30) -> OK sub=usr_1001
      at 10:06:00                             -> ERR_JWT_EXPIRED - "exp" claim timestamp check failed
      wrong audience                          -> ERR_JWT_CLAIM_VALIDATION_FAILED - unexpected "aud" claim value
      payload edited (role: platform_admin)   -> ERR_JWS_SIGNATURE_VERIFICATION_FAILED - signature verification failed
      alg none (unsigned, role edited)        -> ERR_JOSE_ALG_NOT_ALLOWED - "alg" (Algorithm) Header Parameter value not allowed
      HS512 token, HS256 allowed              -> ERR_JOSE_ALG_NOT_ALLOWED - "alg" (Algorithm) Header Parameter value not allowed
      typ JWT instead of at+jwt               -> ERR_JWT_CLAIM_VALIDATION_FAILED - unexpected "typ" JWT header value
      ```

      And one result that is **not** a protection: signing with the 5-byte key `short` succeeded. jose
      doesn't police HMAC key strength, so you must. RFC 8725 3.5 says human-memorable passwords "MUST NOT be
      directly used as the key" for HS256, and the OWASP JWT cheat sheet asks for a secret at least as long as
      the hash output (32 bytes for HS256) from a secure random generator.

      **HS256 or a public-key algorithm?** HS256 uses one shared secret to sign and verify, so every service
      that verifies can also mint tokens. When several services verify tokens, use an asymmetric algorithm
      (ES256, EdDSA, RS256): the issuer keeps the private key and publishes public keys (a JWKS); verifiers
      fetch them with `createRemoteJWKSet` and can't forge anything.

      **A JWT is signed, not encrypted.** Anyone holding the token can read the payload with a base64url
      decoder - `decodeJwt` above needed no key. Never put secrets or personal data in it.

  - id: revocation
    kind: internals
    concepts: [stateless-access-tokens]
    title: The revocation problem and refresh-token rotation
    body: |
      The strength of a stateless token is that the API checks it without asking anyone. That is also its
      weakness: **nothing can make a valid JWT stop working before its `exp`**. Logging out deletes it from the
      browser; a copy an attacker already has keeps working. The OWASP JWT cheat sheet puts it bluntly: using
      JWTs for sessions means "you will need a solution for managing session invalidation", typically a deny
      list - at which point the sessions "won't be completely stateless anymore".

      The standard compromise:

      1. **Short-lived access tokens** - minutes, not days. A stolen one is useful only briefly.
      2. **A refresh token** with a longer life, sent **only** to the issuer's token endpoint, never to APIs.
         The issuer keeps state about it - so it *can* be revoked, and logout revokes it.
      3. **Refresh-token rotation** (RFC 9700 section 4.14.2): every refresh returns a **new** refresh token
         and invalidates the old one, but the issuer remembers the family. If an old refresh token is ever
         presented again, either the attacker or the real client is replaying it - the server "cannot
         determine which party submitted the invalid refresh token, but it will revoke the active refresh
         token". Everyone has to log in again, and the theft is stopped.

      ```mermaid
      flowchart TD
        A[Client presents refresh token R1] --> B{R1 known to the issuer?}
        B -- no --> X[Reject - 400 invalid_grant]
        B -- yes --> C{R1 already used?}
        C -- no --> D[Mark R1 used, issue access token and R2 in the same family]
        C -- yes --> E[Reuse detected - revoke the whole family, log a security event]
        E --> F[Reject - user must log in again]
      ```

      If you need "log out everywhere now" or instant role changes, either keep access tokens very short and
      accept the delay, add a check against a deny list keyed by `jti` (more state), or use server-side
      sessions, which give you that for free.

  - id: storage
    kind: tradeoffs
    concepts: [browser-token-storage]
    title: Where should a browser app keep the credential?
    body: |
      | Where | Readable by script (XSS can steal it) | Sent automatically (CSRF risk) | Notes |
      |---|---|---|---|
      | `HttpOnly` cookie | No | Yes - for matching requests | Needs `SameSite` and a CSRF defence for unsafe methods |
      | `localStorage` / `sessionStorage` | **Yes** | No - your code adds the header | OWASP: "Do not store session identifiers in local storage as the data is always accessible by JavaScript" |
      | JavaScript memory only | Yes, while the page runs | No | Lost on reload; still exposed to XSS while running |

      There is no option without trade-offs, but they are not equal. A stolen `localStorage` token can be
      copied to the attacker's machine and used for its whole lifetime. With an `HttpOnly` cookie, XSS can
      still make requests **from the victim's page** while it is open - XSS is game over either way - but it
      can't walk away with the credential. CSRF, the risk cookies bring back, has well-understood defences:
      `SameSite=Lax` or `Strict`, plus a synchronizer or signed double-submit token for state-changing
      requests (see the OWASP CSRF Prevention Cheat Sheet and [The OWASP Top 10 for
      developers](#/lesson/owasp-top-10-for-developers)). OWASP also notes `SameSite` alone is defence in
      depth, not a complete CSRF defence.

      **Backend for Frontend (BFF).** When a single-page app needs OAuth access tokens for APIs, the IETF's
      browser-based-apps draft (section 6.1) describes keeping the tokens **on a small server-side component**
      that belongs to the app. The BFF does the OAuth flow, stores the access and refresh tokens, and gives the
      browser only an `HttpOnly`, `__Host-` session cookie. The SPA calls the BFF, which forwards requests to
      APIs with the token attached. Tokens never reach JavaScript at all. The cost is one more server to run.

      **Choosing sessions or tokens** for your own app's login:

      - One web app talking to its own backend: **server-side sessions in a `__Host-` cookie** are simplest and
        give instant logout.
      - Many independent APIs or third-party clients: **short-lived JWT access tokens** with refresh rotation,
        issued by an identity provider - and for browser apps, held by a BFF.
      - Mobile apps keep tokens in the platform's secure storage (Keychain, Android Keystore-backed storage),
        not in cookies.

  - id: example
    kind: example
    concepts: [server-side-session-lifecycle, browser-token-storage]
    title: "Project example: the SandPay dashboard's login review"
    body: |
      SandPay's merchant dashboard is a React app served from `dashboard.sandpay.example` with an Express API
      on the same site. The first version stored a 24-hour JWT in `localStorage` and sent it as a bearer
      header. A security review raised three findings:

      1. A stored-XSS bug in the order notes field (since fixed) could have read the token with one line of
         script and sent it anywhere - valid for up to 24 hours, from any machine.
      2. "Log out" removed the token from `localStorage`; a copy kept working until it expired. Support had
         no way to cut off a merchant whose laptop was stolen.
      3. Role changes (removing a former employee's `merchant_admin`) took effect only when the token expired.

      The team moved the dashboard to **server-side sessions** in a `__Host-sid` cookie (`Secure`,
      `HttpOnly`, `SameSite=Lax`), rotated at login and at step-up authentication, with a 15-minute idle
      timeout and an 8-hour absolute timeout. The session record holds the roles, so a role change applies
      on the next request, and support can delete a user's sessions. State-changing API calls also need a
      CSRF token header. The public SandPay API for merchants' servers kept JWT access tokens - there,
      there is no browser and no cookie.

      **What a tester checks after such a change:** the `Set-Cookie` attributes on login; a planted id is
      never accepted after login; the old id fails after a re-login; idle and absolute timeouts with a fake
      or controllable clock; a replayed cookie after logout gets 401; no credential in `localStorage` or in
      URLs; and a cross-site POST without the CSRF token is refused.

  - id: tests
    kind: tests
    concepts: [server-side-session-lifecycle, stateless-access-tokens, cookie-attributes-and-prefixes]
    title: Tests that prove it
    body: |
      | # | Case | Steps | Expected result | Evidence |
      |---|---|---|---|---|
      | 1 | Cookie attributes | Log in | One `Set-Cookie` for `__Host-sid` with `Secure`, `HttpOnly`, `SameSite=Lax`, `Path=/`, no `Domain` | Raw response headers |
      | 2 | Id strength | Log in 20 times | 20 different ids, each from at least 16 random bytes | Ids from the headers; code review of the generator |
      | 3 | Fixation | Send a chosen `__Host-sid` with the login | The issued id differs; the chosen id gets 401 | Both `GET /me` statuses |
      | 4 | Rotation | Log in twice in one browser | The first id now gets 401 and is gone from the store | Status, store contents |
      | 5 | Idle timeout | Log in, wait past the idle limit (fake clock) | 401, session deleted | Status, store |
      | 6 | Activity extends idle, not absolute | Use the session every few minutes past the absolute limit | 401 after the absolute limit | Status at each step |
      | 7 | Logout | Log out, replay the old cookie | 204 with a clearing `Set-Cookie`; replay gets 401 | Both responses, store |
      | 8 | Bad login | Wrong password | 401, no `Set-Cookie`, nothing stored | Headers, store |
      | 9 | Tampered token | Change a claim in the payload, keep the signature | Rejected (signature) | API status 401 and log reason |
      | 10 | `alg` confusion | Send `alg: none`, and a token in an algorithm you don't allow | Rejected | Status 401 |
      | 11 | Wrong audience or type | A valid token for another API; an ID token | Rejected | Status 401 |
      | 12 | Expiry | Use a token just past `exp` and past `exp` plus tolerance | Accepted within tolerance, rejected after | Statuses with a fixed clock |

      Cases 3-7 need **two checks each**: the HTTP status **and** the server-side state. A logout that only
      clears the cookie passes a "Set-Cookie was sent" check and fails the replay.

  - id: mistakes
    kind: mistakes
    concepts: [server-side-session-lifecycle, stateless-access-tokens, cookie-attributes-and-prefixes]
    title: Common mistakes and how to debug them
    body: |
      - **Logout that only clears the cookie.** Replay the old `Cookie` header after logout: a 200 means the
        server never ended the session.
      - **Keeping the pre-login id.** Send a made-up id with the login request; if that id then works, you
        have session fixation.
      - **No absolute timeout.** "Remember me" sessions that refresh themselves on every request never end;
        an attacker with a stolen id can keep one alive by polling.
      - **`maxAge` in seconds in Express.** It is milliseconds; `maxAge: 900` is under one second. Read the
        `Max-Age` in the raw header.
      - **Clearing a cookie with a different path or domain.** The browser keeps the original and adds an
        expired twin. Clear with exactly the options you set.
      - **`SameSite=None` without `Secure`.** The browser silently ignores the cookie - check the DevTools
        Application panel and the Network panel's cookie warnings ([Browser DevTools for
        testers](#/lesson/browser-devtools-for-testers)).
      - **Decoding instead of verifying a JWT.** `decodeJwt` (or `jwt.decode` in other libraries) checks
        nothing. Search the code for decode calls on the request path.
      - **Accepting the algorithm the token names.** Always pass an allow-list (`algorithms: ['ES256']`).
      - **Weak HMAC keys.** A typed string as an HS256 key can be brute-forced offline from any token. Use 32+
        random bytes from a secrets manager.
      - **Long-lived access tokens "for convenience".** Shorten them and add refresh rotation instead.
      - **Logging credentials.** Session ids, tokens and `Cookie` headers in logs are credentials in logs.
        Redact them.

      **Debugging method:** reproduce with raw HTTP (curl or supertest), read the exact `Set-Cookie` and
      `Cookie` headers, then inspect the server-side state (session store, refresh-token table). For tokens,
      paste a **test** token into a local decoder - never a production token into a website - and compare
      `iss`, `aud`, `typ`, `exp` and `alg` with what the verifier expects.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [stateless-access-tokens, server-side-session-lifecycle]
    title: Sessions versus tokens - the trade-offs
    body: |
      | | Server-side sessions | Stateless JWT access tokens |
      |---|---|---|
      | Check per request | Store lookup (fast with Redis or an indexed table) | Signature and claims, no lookup |
      | Logout and revocation | Immediate - delete the row | Not before `exp` without extra state |
      | Role changes | Next request | When the token is replaced |
      | Scaling | Needs a shared store | Any instance with the key can verify |
      | Size on the wire | A short id | Hundreds of bytes per request |
      | Works for third-party APIs and mobile | Awkward (cookies) | Natural (Authorization header) |
      | Typical failure | Fixation, missing timeouts, cosmetic logout | Decode-not-verify, alg confusion, weak keys, long lifetimes |

      Neither is "more secure" by itself. Sessions are the simpler correct default for one web app and its
      backend; tokens earn their complexity when many services or clients must verify identity independently.
      Many real systems use both: a session between the browser and its BFF, tokens between services.

  - id: summary
    kind: summary
    concepts:
      [cookie-attributes-and-prefixes, server-side-session-lifecycle, stateless-access-tokens, browser-token-storage]
    title: Quick reference
    body: |
      - Session cookie: `__Host-sid=<32 random bytes>; Secure; HttpOnly; SameSite=Lax; Path=/` - no `Domain`.
      - Express `maxAge` is **milliseconds**; clear cookies with the same path and domain.
      - Rotate the session id at login and every privilege change; delete the old one.
      - Enforce **idle** and **absolute** timeouts on the server; delete expired sessions.
      - Logout deletes the session **on the server**; test it by replaying the old cookie.
      - Verify JWTs with an **algorithm allow-list** and check `iss`, `aud`, `typ`, `exp` (with small clock
        tolerance); never just decode.
      - HS256 keys: 32+ random bytes; prefer asymmetric keys when several services verify.
      - A JWT can't be revoked before `exp`: keep access tokens short, rotate refresh tokens, detect reuse.
      - Keep credentials out of `localStorage`; with cookies, add `SameSite` and a CSRF defence; for SPAs
        that need OAuth tokens, consider a BFF.

exercises:
  - id: host-prefix-accepted
    type: mcq
    concept: cookie-attributes-and-prefixes
    skill: application
    title: Which session cookie will the browser keep?
    prompt: |
      The dashboard at `https://dashboard.sandpay.example` sends one of these headers after login. Which one
      will a browser that implements RFC 6265bis store **and** keep away from JavaScript?
    options:
      - id: correct
        text: "`Set-Cookie: __Host-sid=…; Secure; HttpOnly; SameSite=Lax; Path=/`"
        feedback: Correct - Secure, Path=/ and no Domain satisfy the __Host- rules, and HttpOnly hides it from document.cookie.
      - id: domain
        text: "`Set-Cookie: __Host-sid=…; Secure; HttpOnly; SameSite=Lax; Path=/; Domain=sandpay.example`"
        feedback: A __Host- cookie must not have a Domain attribute - the browser ignores this cookie entirely. The prefix exists precisely to forbid sharing with subdomains.
      - id: path
        text: "`Set-Cookie: __Host-sid=…; Secure; HttpOnly; SameSite=Lax; Path=/app`"
        feedback: __Host- requires Path=/. With any other path the browser rejects the cookie.
      - id: no-secure
        text: "`Set-Cookie: __Host-sid=…; HttpOnly; SameSite=Lax; Path=/`"
        feedback: Without Secure the __Host- (and __Secure-) prefix rules fail, so the cookie is ignored - even on an HTTPS page.
    correct: [correct]
    hints:
      - The __Host- prefix makes three requirements.
      - One of them is about an attribute that must be absent.
    solution: |
      RFC 6265bis 4.1.3.2: a `__Host-` cookie is kept only if it is `Secure`, has `Path=/` and has **no**
      `Domain`. Only the first header meets all three; `HttpOnly` additionally keeps it out of
      `document.cookie`. The browser ignores the others completely - no error, just no cookie - so check
      the DevTools Application panel when a login "doesn't stick".
    followUp: |
      The API at `api.sandpay.example` also needs the session. Why can't it read a host-only cookie set by
      `dashboard.sandpay.example`, and what are your options?

  - id: login-order
    type: order
    concept: server-side-session-lifecycle
    skill: application
    title: Order the login handler
    prompt: |
      Put the steps of a session-based `POST /login` handler in the order they should run.
    items:
      - id: validate
        text: Check the request body has an email and a password (400 if not)
      - id: verify
        text: Verify the password (401 with no cookie if it is wrong)
      - id: delete-old
        text: Delete the session id the request arrived with, if any
      - id: generate
        text: Generate a new id with 32 bytes from a CSPRNG
      - id: store
        text: Store { userId, createdAt, lastSeenAt } under the new id
      - id: cookie
        text: Send Set-Cookie __Host-sid with Secure, HttpOnly, SameSite=Lax, Path=/
    hints:
      - Nothing about sessions should change for a failed login.
      - The fixation defence is about the id that existed before authentication.
      - The cookie points to something - it must exist first.
    solution: |
      **Validate, verify, delete the old id, generate, store, set the cookie.** A failed login must not
      create or rotate anything. The old id is discarded only once the user is authenticated (that is the
      privilege change OWASP says must renew the id), and the cookie is sent last, pointing at a session
      that already exists in the store.
    followUp: |
      Where in this order would you also rotate the CSRF token, and what else should happen when a user
      changes their password?

  - id: fixation-debug
    type: debug
    concept: server-side-session-lifecycle
    skill: analysis
    title: The login that keeps the attacker's id
    prompt: |
      A penetration tester sets `sid=fixed123` in a victim's browser through a vulnerable subdomain, waits for
      the victim to log in, then calls `GET /orders` with `Cookie: sid=fixed123` and sees the victim's orders.
      Click the line that makes this possible.
    language: javascript
    code: |
      app.post('/login', async (req, res) => {
        const userId = await verifyUser(req.body.email, req.body.password);
        if (!userId) return res.status(401).json({ error: 'invalid_credentials' });
        const id = req.cookies.sid ?? randomBytes(32).toString('base64url');
        sessions.set(id, { userId, createdAt: Date.now(), lastSeenAt: Date.now() });
        res.cookie('sid', id, { secure: true, httpOnly: true, sameSite: 'lax', path: '/' });
        res.json({ userId });
      });
    correctLines: [4]
    lineNotes:
      - line: 6
        note: A weak cookie name (no __Host- prefix) is why a subdomain could plant it, but the server would still be safe if it never reused the id.
      - line: 3
        note: The failed-login branch is fine - it creates nothing.
    hints:
      - Which id does the authenticated session end up under?
      - Where does that id come from when the browser already has one?
    solution: |
      **Line 4** reuses the id the browser arrived with. Whoever chose or saw that id before login now shares
      the authenticated session - session fixation. Always generate a new id after authentication (and delete
      the old one from the store): `const id = randomBytes(32).toString('base64url')`. Renaming the cookie to
      `__Host-sid` (line 6) is good hardening - a subdomain can no longer set it - but the rotation is the
      actual fix. A real run of the same bug in this lesson's draft app returned 200 for the planted id.
    followUp: |
      Write the supertest test that would have caught this: what do you send, and which two assertions do you
      make?

  - id: logout-jwt
    type: mcq
    concept: stateless-access-tokens
    skill: analysis
    title: Log out, and then what?
    prompt: |
      An app issues 12-hour JWT access tokens (verified by signature only) and stores them in
      `localStorage`. A merchant reports a stolen laptop; support clicks "log out all devices", which deletes
      the user's refresh tokens. An hour later, the logs show API calls with the stolen access token. Why do
      they succeed?
    options:
      - id: stateless
        text: The API checks only the signature and claims, and the token's exp is still 11 hours away - nothing it checks has changed.
        feedback: Correct - deleting refresh tokens stops new access tokens, but an already-issued JWT stays valid until exp unless the API consults some state (a deny list or a session).
      - id: cache
        text: The API cached the token's validation result for 12 hours.
        feedback: No cache is needed to explain it - a fresh verification of a correctly signed, unexpired token also succeeds.
      - id: refresh
        text: The attacker used the refresh token to mint a new access token.
        feedback: The refresh tokens were deleted; the logs show the stolen access token itself still being accepted.
      - id: storage
        text: Logging out should have cleared localStorage on the stolen laptop.
        feedback: The server can't reach into the stolen laptop's storage - and the attacker may have copied the token elsewhere anyway.
    correct: [stateless]
    hints:
      - What exactly does the API look at to accept a JWT?
      - Which of those things did support's action change?
    solution: |
      A JWT is self-contained: if the signature is valid and `exp` hasn't passed, a signature-only verifier
      accepts it. Revoking refresh tokens prevents **new** access tokens, not existing ones. Fixes: much
      shorter access tokens (minutes), a deny list by `jti` or a per-user "tokens issued before" timestamp
      checked on each request (state again), or server-side sessions. Confirm in the logs that the accepted
      calls carried the old `jti`.
    followUp: |
      If you add a per-user `notBefore` timestamp that support can bump, what does every API now have to do
      on each request, and what does that cost?

  - id: decode-not-verify
    type: debug
    concept: stateless-access-tokens
    skill: analysis
    title: The middleware that trusts any token
    prompt: |
      This Express middleware protects the SandPay dashboard API. A tester changed the `roles` claim in a
      token's payload with a base64url editor, kept the old signature, and became `platform_admin`. Click
      the line responsible.
    language: typescript
    code: |
      export const requireAccess: RequestHandler = async (req, res, next) => {
        const header = req.get('Authorization') ?? '';
        const token = header.startsWith('Bearer ') ? header.slice(7) : '';
        if (!token) return res.status(401).json({ error: 'missing_token' });
        const claims = decodeJwt(token);
        if (!claims.exp || claims.exp * 1000 < Date.now()) return res.status(401).json({ error: 'expired' });
        res.locals.user = { id: claims.sub, roles: claims.roles };
        next();
      };
    correctLines: [5]
    lineNotes:
      - line: 6
        note: The expiry check itself is fine - but it is checking a claim nobody verified.
      - line: 7
        note: Trusting roles is fine once the token is verified; the bug is upstream.
    hints:
      - Which line would need the signing key if it were checking anything?
      - What does decodeJwt check?
    solution: |
      **Line 5** decodes without verifying. `decodeJwt` just base64url-decodes the payload; it checks no
      signature, algorithm, issuer or audience, so any edited token passes. Replace it with `jwtVerify(token,
      key, { algorithms: [...], issuer, audience, typ: 'at+jwt', clockTolerance: 30 })` and map jose errors to
      401. In this lesson's real run, the same edit made `jwtVerify` fail with
      `ERR_JWS_SIGNATURE_VERIFICATION_FAILED`.
    followUp: |
      After the fix, a token signed with `alg: none` arrives. What does jwtVerify do with it, and why do you
      still pass an `algorithms` list?

  - id: refresh-reuse
    type: mcq
    concept: stateless-access-tokens
    skill: application
    title: The refresh token that came back
    prompt: |
      SandPay's identity service rotates refresh tokens. Refresh token `R1` was used at 09:00 and replaced by
      `R2`. At 09:40 a request arrives presenting `R1` again. What should the service do, following RFC 9700
      section 4.14.2?
    options:
      - id: revoke-family
        text: Reject it and revoke R2 (the whole family), so both the attacker and the user must authenticate again.
        feedback: Correct - reuse of an invalidated refresh token means one copy was stolen; the server can't tell which party is which, so it revokes the active token.
      - id: accept
        text: Accept it - R1 was genuine when it was issued.
        feedback: Accepting a used refresh token defeats rotation; an attacker with a copy could keep minting access tokens.
      - id: reject-only
        text: Reject R1 but keep R2 valid, since R2 belongs to the real user.
        feedback: The server can't know who holds R2 - the attacker may have used R1 first at 09:00 and now holds R2, while the real client is presenting the stale R1.
      - id: new-r1
        text: Issue a new R1 to resynchronise the client.
        feedback: That hands a fresh credential to whoever presented a token that is known to be compromised.
    correct: [revoke-family]
    hints:
      - Who could be holding R1 at 09:40?
      - Can the server tell whether R2 is held by the user or the attacker?
    solution: |
      A rotated refresh token should never be seen again. When it is, someone kept a copy. RFC 9700 says the
      server "cannot determine which party submitted the invalid refresh token, but it will revoke the active
      refresh token" - so revoke the family, log a security event, and force a new login. Evidence to check:
      the token family id, both use timestamps and the client details in the logs.
    followUp: |
      Mobile apps on flaky networks sometimes retry a refresh request whose response was lost. How can the
      server tolerate that without weakening reuse detection?

  - id: storage-xss
    type: mcq
    concept: browser-token-storage
    skill: analysis
    title: An XSS bug and two storage designs
    prompt: |
      A stored-XSS bug lets an attacker run script on the dashboard while a merchant has it open. Design A
      keeps a 24-hour JWT in `localStorage`. Design B keeps a session id in an `HttpOnly`, `__Host-` cookie
      with `SameSite=Lax`. Which statement is accurate?
    options:
      - id: accurate
        text: In A the script can copy the token and use it from anywhere for up to 24 hours; in B it can act through the victim's open page but can't read the session id.
        feedback: Correct - HttpOnly limits the damage to what the injected script can do in place, while localStorage lets the credential leave with the attacker.
      - id: b-safe
        text: B is safe from XSS because the cookie is HttpOnly.
        feedback: XSS in B can still send same-origin requests with the cookie attached (the browser adds it) - it just can't exfiltrate the id. Fixing the XSS is still mandatory.
      - id: same
        text: Both are equally bad - XSS can do anything in both.
        feedback: The difference is real - a stolen bearer token works from the attacker's machine after the victim closes the tab; a session the attacker can't read ends when they lose the page (or at the timeout).
      - id: samesite
        text: SameSite=Lax in B blocks the injected script's requests.
        feedback: The injected script runs on the dashboard's own origin, so its requests are same-site and the cookie is sent. SameSite helps against cross-site requests, not XSS.
    correct: [accurate]
    hints:
      - What can document.cookie and localStorage.getItem each return to the script?
      - Where does an attacker want to use the credential - in the victim's browser or their own?
    solution: |
      OWASP: "Do not store session identifiers in local storage as the data is always accessible by
      JavaScript." With `HttpOnly`, XSS can ride the session while the page is open but can't steal it; with
      `localStorage`, the token is exfiltrated and reused remotely until it expires. Both still require
      fixing the XSS - storage choice limits the blast radius, it doesn't prevent the attack.
    followUp: |
      Design B now needs a CSRF defence for POST, PUT and DELETE requests. Why, and which one would you pick?

  - id: session-app
    type: coding
    concept: server-side-session-lifecycle
    skill: application
    title: Fix the dashboard's session handling
    prompt: |
      `createSessionApp(options)` is a first draft of the SandPay dashboard's login, `GET /me` and logout. It
      passes a quick manual click-through and has five session bugs, listed at the top of the file. Fix them
      so the login sets a `__Host-sid` cookie with `Secure`, `HttpOnly`, `SameSite=Lax` and `Path=/`, issues a
      fresh random id of at least 128 bits on every login (never reusing the one the browser sent), enforces
      the idle and absolute timeouts with `options.now()`, and makes logout delete the session on the server
      and clear the cookie with the same attributes.
    project: fullstack
    files:
      - exercises/sessions/session-app.ts
    test: tests/sessions/session-app.test.ts
    command: npx vitest run tests/sessions/session-app.test.ts
    hints:
      - Put the cookie options in one constant and pass it to both res.cookie and res.clearCookie.
      - "`randomBytes(32).toString('base64url')` from node:crypto gives 256 bits in 43 characters."
      - In POST /login, after verifyUser succeeds, delete sessions.get(oldId) - then always generate a new id.
      - "In GET /me, compute both `now - lastSeenAt > idleTimeoutMs` and `now - createdAt > absoluteTimeoutMs`; on either, delete the session and answer 401. Otherwise update lastSeenAt."
    modelAnswer: |
      ```typescript
      const cookieOptions = { httpOnly: true, secure: true, sameSite: 'lax', path: '/' } as const;

      app.post('/login', async (req, res) => {
        // ... validate the body, then:
        const userId = await options.verifyUser(email, password);
        if (userId === null) {
          res.status(401).json({ error: 'invalid_credentials' });
          return;
        }
        const previous = cookieId(req.cookies);
        if (previous !== undefined) sessions.delete(previous);      // fixation defence
        const id = randomBytes(32).toString('base64url');            // 256 bits from the CSPRNG
        const now = options.now();
        sessions.set(id, { userId, createdAt: now, lastSeenAt: now });
        res.cookie(SESSION_COOKIE, id, cookieOptions);
        res.status(200).json({ userId });
      });

      app.get('/me', (req, res) => {
        const id = cookieId(req.cookies);
        const session = id === undefined ? undefined : sessions.get(id);
        if (id === undefined || session === undefined) {
          res.status(401).json({ error: 'not_authenticated' });
          return;
        }
        const now = options.now();
        if (now - session.lastSeenAt > options.idleTimeoutMs || now - session.createdAt > options.absoluteTimeoutMs) {
          sessions.delete(id);
          res.clearCookie(SESSION_COOKIE, cookieOptions);
          res.status(401).json({ error: 'session_expired' });
          return;
        }
        session.lastSeenAt = now;
        res.json({ userId: session.userId });
      });

      app.post('/logout', (req, res) => {
        const id = cookieId(req.cookies);
        if (id !== undefined) sessions.delete(id);                   // the server forgets it
        res.clearCookie(SESSION_COOKIE, cookieOptions);
        res.status(204).end();
      });
      ```

      The store is the source of truth: rotation, expiry and logout are all `sessions.delete` calls. One
      shared `cookieOptions` object guarantees the clearing `Set-Cookie` matches the one that set the cookie.
      The full reference, with body validation and a `cookieId` helper, is in
      `solutions/sessions/session-app.ts`.
    rubric:
      - Every test in tests/sessions/session-app.test.ts passes.
      - Session ids come from node:crypto (randomBytes or randomUUID-sized or larger), never Math.random or a counter.
      - The same cookie options are used to set and to clear the cookie.
      - Expired sessions are deleted from the store, not only refused.
      - The session id is never logged or returned in a response body.
    followUp: |
      Add `POST /sessions/elevate` that re-checks the password before a payout change. Which session fields
      change, and should the id rotate again?
    solution: |
      Name the cookie `__Host-sid` with Secure, HttpOnly, SameSite=Lax and Path=/; generate 32 random bytes per
      login and delete any id the request arrived with; check idle and absolute timeouts against
      `options.now()` and delete expired sessions; at logout delete the session and clear the cookie with the
      same options. Reference: `solutions/sessions/session-app.ts`.

  - id: access-tokens
    type: coding
    concept: stateless-access-tokens
    skill: application
    title: Verify access tokens properly with jose
    prompt: |
      `createTokenService(options)` issues and verifies the dashboard API's access tokens. The draft
      round-trips a token - and accepts forged ones, because `verifyAccessToken` only decodes. Make it issue
      HS256 tokens typed `at+jwt` with `iss`, `aud`, `sub`, `iat`, `exp` (from `accessTtlSeconds`) and a unique
      `jti`, and make verification check the signature with an HS256-only allow-list, the issuer, audience
      and type, and expiry against `options.now()` with 30 seconds of tolerance. Return `{ ok: false, reason:
      'expired' }` for an expired token and `'invalid'` for any other failure - never throw for a bad token.
      Refuse a secret shorter than 32 bytes when the service is created.
    project: fullstack
    files:
      - exercises/sessions/access-tokens.ts
    test: tests/sessions/access-tokens.test.ts
    command: npx vitest run tests/sessions/access-tokens.test.ts
    hints:
      - "jwtVerify takes the options algorithms, issuer, audience, typ, clockTolerance, currentDate and requiredClaims."
      - Set iat from options.now(), not the real clock, so the tests' fake time is used for both issuing and checking.
      - "`errors.JWTExpired` is the expiry case; every other `errors.JOSEError` is 'invalid'."
      - jose signs with a 5-byte HS256 key without complaint - check `secret.byteLength` yourself.
    modelAnswer: |
      ```typescript
      if (options.secret.byteLength < 32) throw new Error('HS256 secret must be at least 32 random bytes');

      async issueAccessToken(userId, roles) {
        const iat = Math.floor(options.now().getTime() / 1000);
        return new SignJWT({ roles })
          .setProtectedHeader({ alg: 'HS256', typ: 'at+jwt' })
          .setIssuer(options.issuer)
          .setAudience(options.audience)
          .setSubject(userId)
          .setIssuedAt(iat)
          .setExpirationTime(iat + options.accessTtlSeconds)
          .setJti(randomUUID())
          .sign(options.secret);
      },

      async verifyAccessToken(token) {
        try {
          const { payload } = await jwtVerify(token, options.secret, {
            algorithms: ['HS256'],
            issuer: options.issuer,
            audience: options.audience,
            typ: 'at+jwt',
            clockTolerance: 30,
            currentDate: options.now(),
            requiredClaims: ['sub', 'exp', 'iat', 'jti'],
          });
          // ... check sub, jti and roles are the expected types, then:
          return { ok: true, userId: payload.sub, roles, tokenId: payload.jti };
        } catch (err) {
          if (err instanceof errors.JWTExpired) return { ok: false, reason: 'expired' };
          if (err instanceof errors.JOSEError) return { ok: false, reason: 'invalid' };
          throw err;   // a real bug in our code, not a bad token
        }
      }
      ```

      Every RFC 8725 check is one option: the algorithm allow-list (3.1), issuer and audience (3.8, 3.9) and
      explicit typing (3.11). `requiredClaims` turns a missing `exp` into a rejection instead of an
      eternal token. Telling `expired` apart lets the client refresh instead of logging the user out.
    rubric:
      - Every test in tests/sessions/access-tokens.test.ts passes.
      - The token is verified with jwtVerify and an explicit algorithms allow-list - no decodeJwt on the verify path.
      - Issuer, audience, type and expiry are checked, with a small clock tolerance and the injected clock.
      - Errors are mapped to expired or invalid without leaking jose's messages to API clients.
      - The key-length check exists and the code never uses a typed password as a production key.
    followUp: |
      Switch the service to ES256 so other SandPay services can verify without being able to sign. What
      changes in issue, in verify and in how keys are distributed?
    solution: |
      Issue HS256 tokens with typ at+jwt, iss, aud, sub, iat and exp from `options.now()`, and a random jti;
      verify with `jwtVerify` using `algorithms: ['HS256']`, issuer, audience, typ, `clockTolerance: 30`,
      `currentDate` and `requiredClaims`; map `JWTExpired` to expired and other `JOSEError`s to invalid; refuse
      secrets under 32 bytes. Reference: `solutions/sessions/access-tokens.ts`.

  - id: session-test-plan
    type: testdesign
    concept: server-side-session-lifecycle
    skill: analysis
    title: A test plan for session management
    prompt: |
      SandPay's dashboard has just moved to server-side sessions in a `__Host-sid` cookie with a 15-minute idle
      timeout and an 8-hour absolute timeout. Design at least eight tests with preconditions, steps, the
      expected result **and the evidence** - including how you control time and how you see server state.
    hints:
      - For each lifecycle event (login, use, idle, absolute, logout, privilege change), what proves it happened on the server?
      - How do you test a 15-minute timeout without waiting 15 minutes?
      - What can a tester learn from the raw Set-Cookie header?
    modelAnswer: |
      Preconditions: a test environment with a controllable clock (an injectable clock, or configurable
      short timeouts) and read access to the session store or an admin endpoint listing a user's sessions.

      1. **Attributes** - log in; raw `Set-Cookie` has `__Host-sid`, `Secure`, `HttpOnly`, `SameSite=Lax`,
         `Path=/`, no `Domain`, no `Max-Age` beyond policy. Evidence: header capture.
      2. **Randomness** - 20 logins give 20 distinct ids of 43+ base64url characters; review that the code uses
         a CSPRNG. Evidence: ids, code reference.
      3. **Fixation** - send `Cookie: __Host-sid=qa-planted` with a valid login; the issued id differs; `GET
         /me` with `qa-planted` gives 401. Evidence: both responses, store has no `qa-planted`.
      4. **Re-login rotation** - log in twice in the same browser; the first id gives 401. Evidence: status,
         store.
      5. **Idle** - log in, advance 15 min + 1 s, `GET /me` → 401 and session row gone. Evidence: status,
         store, log event "session expired (idle)".
      6. **Idle extension** - use every 10 minutes for an hour → 200 throughout.
      7. **Absolute** - use every 10 minutes past 8 hours → 401 at 8 h + 1 s.
      8. **Logout** - log out → 204 with a clearing `Set-Cookie` (same path), then replay the old cookie →
         401. Evidence: both responses, store.
      9. **Privilege change** - change password; the id rotates and other sessions of the user are ended (if
         that is the policy). Evidence: old ids → 401.
      10. **Failed login** - wrong password → 401, no `Set-Cookie`, no new store row, log entry without the
          password.
      11. **Leakage** - the id never appears in URLs, response bodies, `localStorage` or application logs.
          Evidence: DevTools Application panel, log search for the id.
    rubric:
      - Each lifecycle test checks server-side state, not only the HTTP response.
      - Includes fixation (planted id) and re-login rotation as separate cases.
      - Explains how time is controlled for idle and absolute timeouts.
      - Includes a logout replay test.
      - Checks the exact Set-Cookie attributes, including the absence of Domain.
      - Includes at least one leakage check (logs, URLs, storage).
    solution: |
      Cover attributes, randomness, fixation, rotation, idle, idle extension, absolute, logout replay,
      privilege change and failed login - each with the status **and** the store state as evidence - control
      time with an injectable clock or short configured timeouts, and check that the id never leaks into
      logs, URLs or storage.

  - id: storage-choice
    type: short
    concept: browser-token-storage
    skill: analysis
    title: Tokens for a single-page app
    prompt: |
      A new SandPay single-page app must call two APIs (orders and payouts) that require OAuth 2.0 access
      tokens from SandPay's identity provider. A developer proposes keeping the access and refresh tokens in
      `localStorage`. Explain the risk, propose a design that keeps tokens away from JavaScript, and name
      what the new design adds that you must defend.
    hints:
      - What happens to a token in localStorage if the app ever has an XSS bug?
      - Which IETF draft describes a server-side component for exactly this?
      - Cookies are sent automatically - which attack does that enable?
    modelAnswer: |
      Anything in `localStorage` is readable by any script on the origin, so one XSS bug (or a compromised
      third-party script) can copy both tokens and use them from the attacker's machine - the refresh token
      for a long time. OWASP says not to store session identifiers in local storage.

      Use a **Backend for Frontend** (draft-ietf-oauth-browser-based-apps section 6.1): a small server
      component of the app performs the OAuth flow, stores the access and refresh tokens server-side, and
      gives the browser only an `HttpOnly`, `Secure`, `SameSite=Lax` `__Host-` session cookie. The SPA calls
      the BFF, which attaches the access token when forwarding to the orders and payouts APIs and refreshes it
      as needed.

      What it adds: cookies are sent automatically, so the BFF's state-changing endpoints need a **CSRF
      defence** (SameSite plus a synchronizer or signed double-submit token, or a required custom header
      checked with CORS). The BFF also becomes a server to secure and run, with its own session timeouts and
      logout that revokes the refresh token.
    rubric:
      - Explains that XSS can exfiltrate tokens from localStorage, including the long-lived refresh token.
      - Proposes a BFF (or equivalent server-side token holder) with an HttpOnly session cookie.
      - Identifies CSRF as the new risk and names a concrete defence.
      - Mentions that logout must revoke the refresh token at the identity provider.
    solution: |
      localStorage exposes both tokens to any XSS. A BFF keeps the tokens server-side and gives the browser an
      HttpOnly `__Host-` session cookie; the cost is CSRF protection for the BFF's endpoints and one more
      server whose logout must revoke the refresh token.

  - id: interview-sessions-vs-jwt
    type: interview
    concept: stateless-access-tokens
    skill: analysis
    title: "\"Sessions or JWTs for our new web app?\""
    prompt: |
      An interviewer asks: "We're building a React dashboard with a Node.js API. Would you use server-side
      sessions or JWTs for login? Walk me through the trade-offs and how you'd implement your choice
      securely."
    modelAnswer: |
      For one web app talking to its own API on the same site, I'd default to **server-side sessions**. The
      browser gets a `__Host-sid` cookie - `Secure`, `HttpOnly`, `SameSite=Lax`, `Path=/` - holding 32 random
      bytes; the session lives in Redis or a table. I rotate the id at login and on privilege changes to stop
      fixation, enforce idle and absolute timeouts on the server, and logout deletes the record, so it takes
      effect immediately; role changes apply on the next request. Because cookies are sent automatically, I
      add CSRF protection for unsafe methods.

      JWTs shine when many services or third parties must verify identity without a shared store. Their cost
      is revocation: a valid token works until `exp`. If we used them I'd keep access tokens to minutes, use
      rotating refresh tokens with reuse detection (RFC 9700), verify with an algorithm allow-list and check
      `iss`, `aud`, `typ` and `exp` - never decode-only - and prefer asymmetric keys so only the issuer can
      sign. For a browser I wouldn't put tokens in `localStorage`; a BFF would hold them and give the browser
      a session cookie anyway. So: sessions for the dashboard, tokens between services or for the public API.
    rubric:
      - Gives a clear default with reasons tied to the app's shape (one web app, same site).
      - Specifies the cookie attributes and a CSPRNG id.
      - Mentions rotation at login, idle and absolute timeouts and server-side logout.
      - Explains the JWT revocation problem and short lifetimes with refresh rotation.
      - Names verification requirements (alg allow-list, iss, aud, exp) and the localStorage/XSS risk.
      - Mentions CSRF as the cost of cookies.
    followUps:
      - How would you implement "log out of all devices"?
      - The API is moving to its own subdomain. What changes for the cookie?
      - How would you test that logout really works?
    hints:
      - Start from the app's shape - who verifies the credential?
      - For each option, say how logout works.
    solution: |
      Default to server-side sessions in a `__Host-` HttpOnly cookie for a single web app (rotation, timeouts,
      server-side logout, CSRF defence); use short-lived, properly verified JWTs with refresh rotation where
      many services or clients verify independently, and keep tokens out of localStorage.

placement:
  - id: place-cookie-attrs
    type: mcq
    concept: cookie-attributes-and-prefixes
    skill: application
    title: The attribute that stops script from reading it
    prompt: |
      A session cookie must not be readable by JavaScript on the page, must only travel over HTTPS, and must
      not be sent on cross-site POST requests. Which header does all three?
    options:
      - id: right
        text: "`Set-Cookie: sid=…; Secure; HttpOnly; SameSite=Lax; Path=/`"
        feedback: Correct - HttpOnly hides it from script, Secure keeps it on HTTPS, Lax withholds it from cross-site POSTs.
      - id: none
        text: "`Set-Cookie: sid=…; Secure; HttpOnly; SameSite=None; Path=/`"
        feedback: SameSite=None sends the cookie on cross-site requests, POST included.
      - id: no-httponly
        text: "`Set-Cookie: sid=…; Secure; SameSite=Strict; Path=/`"
        feedback: Without HttpOnly, document.cookie returns the session id to any script.
      - id: domain
        text: "`Set-Cookie: sid=…; HttpOnly; SameSite=Lax; Domain=sandpay.example`"
        feedback: Without Secure the cookie is also sent over plain HTTP, and Domain widens it to every subdomain.
    correct: [right]
    solution: |
      `HttpOnly` blocks `document.cookie`, `Secure` restricts it to HTTPS, and `SameSite=Lax` (or `Strict`)
      withholds it from cross-site POST requests. Adding a `__Host-` name would also make the browser enforce
      `Secure`, `Path=/` and no `Domain`.

  - id: place-fixation
    type: mcq
    concept: server-side-session-lifecycle
    skill: analysis
    title: What must happen to the session id at login?
    prompt: |
      A user arrives at the login page already holding a session id (anonymous cart, or planted by an
      attacker). They log in successfully. What should the server do with that id?
    options:
      - id: rotate
        text: Delete it and issue a new random id for the authenticated session (copying over any data you need).
        feedback: Correct - renewing the id after a privilege change is the session fixation defence.
      - id: keep
        text: Keep it and mark the session as authenticated, so the cart survives.
        feedback: That is session fixation - anyone who knew the id before login now shares the logged-in session. Copy the cart into a new session instead.
      - id: both
        text: Keep the old id working and also issue a new one.
        feedback: The old id must stop working, or the attacker who planted it is still in.
      - id: cookie-only
        text: Change the cookie's attributes to HttpOnly and Secure; the id can stay.
        feedback: Attributes don't help when the attacker already knows the value.
    correct: [rotate]
    solution: |
      OWASP: "The session ID must be renewed or regenerated by the web application after any privilege level
      change". Delete the pre-login session (or copy its harmless data into the new one) and issue a fresh id.

  - id: place-jwt-verify
    type: debug
    concept: stateless-access-tokens
    skill: analysis
    title: Which line lets a forged token in?
    prompt: |
      This verifier accepts tokens that the attacker signed with `alg: HS256` using the issuer's **public**
      RSA key as the HMAC secret. Click the line to fix.
    language: typescript
    code: |
      const publicKey = await importSPKI(PEM, 'RS256');
      const secretFromPem = new TextEncoder().encode(PEM);
      const header = decodeProtectedHeader(token);
      const key = header.alg === 'RS256' ? publicKey : secretFromPem;
      const { payload } = await jwtVerify(token, key, { issuer: ISS, audience: AUD });
    correctLines: [4]
    lineNotes:
      - line: 5
        note: Adding algorithms ['RS256'] here would also stop it - but the root cause is choosing the key from the attacker's header.
      - line: 3
        note: Reading the header is harmless; trusting it to choose the key is the problem.
    solution: |
      **Line 4** lets the token's own `alg` header choose the verification key - "key type confusion". The
      attacker picks HS256 and the server uses the public key bytes (which the attacker knows) as the HMAC
      secret. RFC 8725 3.1: the application decides the algorithms; each key is used with exactly one
      algorithm. Use the RSA key only, with `algorithms: ['RS256']`. A real run with jose 6.2 confirmed both
      halves: this code accepted a forged HS256 token claiming `platform_admin`, and `jwtVerify(token, rsaKey,
      { algorithms: ['RS256'] })` rejected it with `ERR_JOSE_ALG_NOT_ALLOWED`.

  - id: place-storage
    type: mcq
    concept: browser-token-storage
    skill: application
    title: Where to put the token
    prompt: |
      A single-page app needs to call APIs with OAuth access tokens and the team wants an XSS bug not to leak
      the tokens. Which design meets that goal?
    options:
      - id: bff
        text: A Backend for Frontend holds the tokens and gives the browser an HttpOnly session cookie.
        feedback: Correct - the tokens never reach JavaScript; the BFF attaches them server-side.
      - id: session-storage
        text: Keep them in sessionStorage instead of localStorage.
        feedback: sessionStorage is just as readable by script on the page - it only clears when the tab closes.
      - id: encrypt
        text: Encrypt the tokens before putting them in localStorage.
        feedback: The decryption key has to be available to the same JavaScript, so XSS can decrypt them too.
      - id: memory
        text: Keep them in a JavaScript variable.
        feedback: Better than localStorage after reload, but script running on the page can still read the variable.
    correct: [bff]
    solution: |
      Anything JavaScript can read, XSS can read. Only a server-side holder - a BFF, per
      draft-ietf-oauth-browser-based-apps section 6.1 - keeps tokens away from script; the browser gets an
      HttpOnly cookie, and the BFF needs a CSRF defence.

recall:
  - id: recall-host-prefix
    concept: cookie-attributes-and-prefixes
    prompt: What does the __Host- cookie prefix require, and why is it recommended for session ids?
    answer: Secure, Path=/ and no Domain - the browser rejects the cookie otherwise. It locks the cookie to one host over HTTPS, so subdomains and plain-HTTP pages can't set or overwrite it, and the server knows how it was set from the name alone.
  - id: recall-samesite
    concept: cookie-attributes-and-prefixes
    prompt: Compare SameSite=Strict, Lax and None.
    answer: Strict - same-site requests only. Lax - also cross-site top-level navigations with safe methods (a link click), not cross-site fetch, images or POST. None - all requests, and only accepted with Secure.
  - id: recall-express-maxage
    concept: cookie-attributes-and-prefixes
    prompt: What unit does Express's res.cookie maxAge use, and what does it write?
    answer: Milliseconds. It writes Max-Age in seconds plus an Expires date - 30 days was Max-Age=2592000.
  - id: recall-fixation
    concept: server-side-session-lifecycle
    prompt: What is session fixation and how do you prevent it?
    answer: An attacker gets a known session id into the victim's browser before login; if the server keeps that id at login, the attacker shares the authenticated session. Issue a new random id at login and every privilege change, and delete the old one.
  - id: recall-timeouts
    concept: server-side-session-lifecycle
    prompt: What are the idle and absolute timeouts, and where are they enforced?
    answer: Idle ends a session unused for a period (OWASP - 2-5 min high-value, 15-30 low-risk); absolute ends it a fixed time after creation however active it is (e.g. 4-8 h). Both on the server, deleting the session.
  - id: recall-logout
    concept: server-side-session-lifecycle
    prompt: How do you prove a logout really ended the session?
    answer: Replay the old cookie after logout - it must get 401 - and check the session is gone from the store. A clearing Set-Cookie alone proves nothing.
  - id: recall-jwt-checks
    concept: stateless-access-tokens
    prompt: What must an API check when it accepts a JWT access token?
    answer: The signature with an algorithm allow-list (never the token's own choice), iss, aud, typ (at+jwt), exp with a small clock tolerance, and required claims. Decoding alone checks nothing.
  - id: recall-revocation
    concept: stateless-access-tokens
    prompt: Why can't a JWT be revoked, and what is refresh-token rotation?
    answer: Verification uses only the token and a key, so it stays valid until exp unless state is consulted. Rotation issues a new refresh token on each use and invalidates the old one; reuse of an old one revokes the whole family (RFC 9700 4.14.2).

