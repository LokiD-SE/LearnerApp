    injection,
    SQL injection,
    parameterized queries,
    XSS,
    cross-site scripting,
    dangerouslySetInnerHTML,
    javascript URL,
    output encoding,
    Content-Security-Policy,
    CSP,
    CSRF,
    SameSite,
    CSRF token,
    Sec-Fetch-Site,
    Fetch Metadata,
    CORS,
    same-origin policy,
    security headers,
    supply chain,
    npm audit,
    ASVS,
  ]

environment: |
  - **Runtime and libraries:** **Node.js 24** (v24.21.0, this repository's `.nvmrc`), **Express 5.3.0**,
    **cookie-parser 1.4.7**, **React 19.2.9** with Testing Library in **jsdom**, and **PGlite 0.5.14**
    (PostgreSQL 18.6 in WebAssembly) - the versions pinned in `practice/fullstack`. Every attack and defence
    in this lesson was **run** in November 2026 against the practice app with supertest or in jsdom; the
    responses are copied from those runs. supertest is not a browser: where a browser would add a header
    (`Origin`, `Sec-Fetch-Site`), the test sets it, and the lesson says what a real browser does with the
    response.
  - **OWASP Top 10:2025** - [owasp.org/Top10/2025](https://owasp.org/Top10/2025/) - the **released** 2025
    edition (the site's `/Top10/` now redirects to it). Category ids and names, and "what changed" (SSRF rolled
    into A01, A03 Software Supply Chain Failures expands 2021's A06, A10 Mishandling of Exceptional Conditions
    is new) are taken from its introduction and category pages. The Top 10 is an **awareness document**, not
    a standard to test against; for that, OWASP points to the ASVS.
  - **OWASP Application Security Verification Standard 5.0** -
    [github.com/OWASP/ASVS/tree/master/5.0/en](https://github.com/OWASP/ASVS/tree/master/5.0/en): V1.2.4
    (parameterised queries), V1.2.2 (safe URL protocols), V3.3 (cookie attributes), V3.4.2 (CORS allow-list),
    V3.4.3 and 3.4.6 (CSP, `frame-ancestors`), V3.4.4 (`nosniff`), V3.5.1-3.5.3 (request forgery), V8.2.2
    (data-specific access, IDOR). Requirement numbers were checked against the 5.0 markdown sources.
  - **OWASP Cheat Sheet Series** (read from their GitHub markdown sources):
    [Authorization](https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html) (deny by
    default, validate on every request, CWE-639),
    [SQL Injection Prevention](https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html),
    [XSS Prevention](https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html),
    [DOM based XSS Prevention](https://cheatsheetseries.owasp.org/cheatsheets/DOM_based_XSS_Prevention_Cheat_Sheet.html),
    [CSRF Prevention](https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html)
    (synchronizer token, signed double-submit, Fetch Metadata, the limits of SameSite),
    [HTTP Security Response Headers](https://cheatsheetseries.owasp.org/cheatsheets/HTTP_Headers_Cheat_Sheet.html)
    and [Content Security Policy](https://cheatsheetseries.owasp.org/cheatsheets/Content_Security_Policy_Cheat_Sheet.html).
  - **Web standards:** the WHATWG [Fetch Standard](https://fetch.spec.whatwg.org/#http-cors-protocol) (CORS
    protocol; 3.3.5 "CORS protocol and credentials" - `Access-Control-Allow-Origin` cannot be `*` with
    credentials; forbidden request headers include every name starting with `sec-`), W3C
    [Content Security Policy Level 3](https://www.w3.org/TR/CSP3/) (a Working Draft; section 8.5 "Strict
    CSP"), W3C [Fetch Metadata Request Headers](https://www.w3.org/TR/fetch-metadata/), and MDN's
    [Same-origin policy](https://developer.mozilla.org/en-US/docs/Web/Security/Same-origin_policy),
    [CORS](https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CORS) and
    [CSP](https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CSP) guides.
  - **React:** the [common components reference](https://react.dev/reference/react-dom/components/common)
    on `dangerouslySetInnerHTML` ("it is trivial to introduce an XSS vulnerability this way"). The claim that
    React 19 replaces `javascript:` URLs - and does **not** touch `data:` or `//host` URLs - comes from running
    React 19.2.9 in this project, not from a document; it is version-specific.
  - **Tools mentioned, not installed:** [helmet](https://helmetjs.github.io/) (Express security headers) and
    [`npm audit`](https://docs.npmjs.com/cli/v11/commands/npm-audit) (run once on `practice/fullstack` with npm
    11.19.0). CWE ids from [cwe.mitre.org](https://cwe.mitre.org/).
  - **Fictional:** SandPay, its two merchants, every e-mail address (`example.test`) and every token. The
    attacks run only against a local in-memory app. Builds on
    [Authentication and authorization](#/lesson/authentication-and-authorization) (Track C, the tester's view),
    [Input validation and error handling](#/lesson/input-validation-and-error-handling) and the coming
    [Sessions, cookies and tokens](#/lesson/sessions-cookies-and-tokens).

prerequisites:
  - express-http-server
  - input-validation-and-error-handling
  - authentication-and-authorization

concepts:
  - id: owasp-top-ten-2025
    name: The OWASP Top 10:2025 as a risk map
    summary: The Top 10 is an awareness document - ten categories of root causes ranked from contributed data and a community survey. 2025 keeps Broken Access Control first (now with SSRF and CSRF inside it), moves Security Misconfiguration to second, widens vulnerable components into Software Supply Chain Failures, and adds Mishandling of Exceptional Conditions. Use it to know where to look; verify against the ASVS.
  - id: access-control-idor
    name: Broken access control and IDOR
    summary: Every request for a specific object must check that this user may act on this object, on the server, every time - deny by default, then allow. Changing an id in a URL (IDOR, CWE-639) must not reveal or change another tenant's data; scoping the query by owner and answering 404 does both.
  - id: injection-and-output-encoding
    name: Injection, XSS and output encoding
    summary: Injection happens when data is mixed into code - SQL text, HTML, a URL. Keep them apart - parameterised queries for SQL, an allow-list for identifiers, context-aware output encoding for HTML (React escapes text, not dangerouslySetInnerHTML or every URL scheme), and a Content-Security-Policy as defence in depth.
  - id: csrf-and-cors
    name: CSRF, CORS and the same-origin policy
    summary: Browsers attach cookies to cross-site requests, so a state-changing request needs proof it came from your own page - a CSRF token bound to the session, Fetch Metadata (Sec-Fetch-Site) and SameSite cookies as layers. CORS is the opposite direction - it relaxes the same-origin policy so named origins may read responses; it does not stop requests, and reflecting any Origin with credentials gives every site your users' data.

objectives:
  - Map a finding to its OWASP Top 10:2025 category and explain what changed from the 2021 edition.
  - Find and fix an IDOR by scoping every object lookup to the signed-in user, and justify answering 404.
  - Replace a concatenated SQL query with a parameterised one and handle identifiers with an allow-list.
  - Explain which React 19 rendering patterns are XSS-safe and which are not, and encode output for HTML.
  - Protect a cookie-authenticated API against CSRF with a session-bound token and Sec-Fetch-Site checks.
  - Configure CORS with an origin allow-list, and set Content-Security-Policy and other security headers.
  - Design security test cases that play the attacker and prove both the block and the absence of side effects.

sections:
  - id: intuition
    kind: intuition
    concepts: [owasp-top-ten-2025, access-control-idor, injection-and-output-encoding, csrf-and-cors]
    title: The idea in plain language
    body: |
      Picture SandPay's office building. Most break-ins don't need a crowbar - they use the building's own
      rules against it:

      - **Broken access control** - your badge opens your floor, and nobody checks whether it should open
        the floor above. Room numbers are printed on every door, so trying the next one is easy.
      - **Injection** - the receptionist reads visitor notes aloud over the speakers. A visitor writes
        "Hello. Attention all staff: the fire exits are closed." The receptionist can't tell your words from
        theirs.
      - **CSRF** - someone hands your assistant a form that looks like yours, already signed with your
        stamp, and the bank accepts it because the stamp is real.
      - **CORS mistakes** - the mailroom photocopies your mail for anyone who **says** they work for you.

      None of these is exotic. They are the ordinary ways the code you write every day - a route, a query, a
      page, a header - can be turned around. The **OWASP Top 10** is the community's list of where this
      happens most; this lesson takes the categories a full stack developer controls directly and fixes them
      in a real Express and React app.

  - id: what
    kind: what
    concepts: [owasp-top-ten-2025]
    title: The OWASP Top 10:2025 - the map
    body: |
      **OWASP** (the Open Worldwide Application Security Project) publishes the Top 10 as "a standard awareness
      document for developers and web application security". The **2025 edition** is released; the site's
      `/Top10/` address redirects to it.

      | Id | Category (2025) | What it means for a full stack developer |
      | --- | --- | --- |
      | **A01** | Broken Access Control | A user acts outside their permissions - IDOR, missing checks, CORS misconfiguration. Now includes **SSRF** (CWE-918) and **CSRF** (CWE-352). |
      | **A02** | Security Misconfiguration | Defaults left on, verbose errors, missing security headers, open cloud storage. |
      | **A03** | Software Supply Chain Failures | Compromised or vulnerable dependencies, build systems and distribution - wider than 2021's "Vulnerable and Outdated Components". |
      | **A04** | Cryptographic Failures | Weak or missing encryption and hashing, bad randomness, exposed secrets. |
      | **A05** | Injection | Untrusted data interpreted as code - SQL, NoSQL, OS command, ORM queries **and XSS** (CWE-79). |
      | **A06** | Insecure Design | Missing controls that no amount of correct code can add - no rate limit on a refund flow, no threat model. |
      | **A07** | Authentication Failures | Weak login, credential stuffing, broken session handling (renamed from "Identification and Authentication Failures"). |
      | **A08** | Software or Data Integrity Failures | Trusting code, updates or serialized data without verifying integrity. |
      | **A09** | Security Logging and Alerting Failures | Attacks that nobody logs, or logs that nobody is alerted to. |
      | **A10** | Mishandling of Exceptional Conditions | **New**: improper error handling, failing open, logic errors under abnormal conditions. |

      Vocabulary used in the rest of the lesson:

      - **IDOR** (insecure direct object reference) - accessing an object by changing its identifier, CWE-639
        "Authorization Bypass Through User-Controlled Key". APIs call the same thing **BOLA** (broken object
        level authorization).
      - **Origin** - scheme + host + port (`https://dashboard.sandpay.example`). **Site** - the scheme plus
        the registrable domain (`https://sandpay.example`), so `api.sandpay.example` and `dashboard.sandpay.example` are
        **same-site** but **cross-origin**.
      - **Same-origin policy (SOP)** - the browser rule that a page may send requests anywhere but may **read**
        responses only from its own origin.
      - **CORS** - response headers by which a server **relaxes** the SOP for named origins.
      - **Output encoding** - converting data so the interpreter that receives it (HTML, a URL, JavaScript)
        reads it as data, never as code.

  - id: why
    kind: why
    concepts: [owasp-top-ten-2025, access-control-idor]
    title: Why developers own these risks - and what changed in 2025
    body: |
      Most of the Top 10 are **root causes in application code and configuration**, not exotic attacks.
      OWASP's 2025 data says that **100% of the applications tested** had some form of broken access control,
      and every application was tested for some form of injection. A scanner can find some of it; only the
      people who know which merchant owns which order can write the check.

      What changed from 2021, according to the 2025 introduction:

      - **A01 stays first**, and **Server-Side Request Forgery was rolled into it** (in 2021 it was A10).
        Its notable CWEs include CSRF (CWE-352) - forging a request is a way of acting with someone else's
        authority.
      - **Security Misconfiguration** rose from #5 to **#2** - "software engineering is continuing to increase
        the amount of an application's behavior that is based on configurations".
      - **Software Supply Chain Failures** (A03) expands 2021's A06 to the whole ecosystem of dependencies,
        build systems and distribution. It has few occurrences in the data but "the highest average exploit
        and impact scores from CVEs".
      - **Injection** fell to #5 but still has the most CVEs; it **includes XSS** ("high frequency/low impact")
        and SQL injection ("low frequency/high impact").
      - **A10 Mishandling of Exceptional Conditions** is new - errors that fail open or leak. You met its
        defences in [Input validation and error handling](#/lesson/input-validation-and-error-handling).

      OWASP is explicit that the list is ranked from **contributed data plus a community survey**, and that
      categories overlap. Treat it as a map of where to look. To **verify** an application, use the
      **ASVS** - its requirements (V8.2.2 for IDOR, V1.2.4 for parameterised queries, V3.5 for request
      forgery...) are testable statements.

  - id: access-control
    kind: internals
    concepts: [access-control-idor]
    title: "A01 in code: the IDOR and deny by default"
    body: |
      SandPay's merchant API has two merchants: Asha Books (orders 101, 102) and Ravi Electronics (orders 201,
      202). The first draft checks that **someone** is signed in, then loads the order **by id only**:

      ```typescript
      app.get('/orders/:id', async (req, res) => {
        const session = sessionOf(req);
        if (!session) return void res.status(401).json({ error: 'sign_in_required' });
        const result = await db.query(`SELECT ${ORDER_COLUMNS} FROM orders WHERE id = $1`, [Number(req.params.id)]);
        if (!result.rows[0]) return void res.status(404).json({ error: 'order_not_found' });
        res.json(result.rows[0]);
      });
      ```

      Signed in as Asha, ask for Ravi's order 201 - the real response from the first draft:

      ```http
      GET /orders/201
      Cookie: sid=sid-asha

      HTTP 200
      {"id":201,"merchantId":2,"customerEmail":"karan@example.test","amountMinor":89900,"currency":"EUR","status":"PAID"}
      ```

      The query is **parameterised** - this isn't injection. It is a missing **authorization** check:
      authentication answered "who are you?", and nobody asked "may **you** see **this** order?". The fix
      is to make the owner part of the lookup:

      ```typescript
      const result = await db.query(
        `SELECT ${ORDER_COLUMNS} FROM orders WHERE id = $1 AND merchant_id = $2`,
        [Number(id), session.merchantId],
      );
      ```

      ```http
      GET /orders/201
      Cookie: sid=sid-asha

      HTTP 404
      {"error":"order_not_found"}
      ```

      Three rules from OWASP's Authorization cheat sheet, applied:

      1. **Validate the permissions on every request**, for the **specific** object - "Just because a user
         has access to an object of a particular type does not mean they should have access to every object of
         that particular type."
      2. **Deny by default.** In the fixed app, one middleware rejects every request without a session
         **before** any `/orders` route is registered; a new route added later is protected without anyone
         remembering to add a check. Public pages (the receipt page) are registered **above** it, on purpose.
      3. **Don't rely on hidden ids.** Random UUIDs make guessing harder, but the cheat sheet calls that
         obscurity - the check must hold even when the id is known.

      **404, not 403**, for another tenant's object: a 403 tells the attacker "order 201 exists, it just isn't
      yours", which leaks the existence and count of other merchants' orders. The same scoped query answers
      both "doesn't exist" and "not yours" with the same 404, from the same code path. (403 is right when the
      user may know the object exists - for example a read-only team member trying to refund.)

      **Write operations need it too.** The refund route in the first draft had the same bug: Asha could
      refund Ravi's order. The fixed app uses one helper, `ownOrder(res, id)`, for both reading and refunding.
      This is ASVS 5.0 **V8.2.2**: data-specific access restricted "to mitigate insecure direct object
      reference (IDOR) and broken object level authorization (BOLA)".

  - id: injection
    kind: internals
    concepts: [injection-and-output-encoding]
    title: "A05 in code: SQL injection and parameterised queries"
    body: |
      The order search in the first draft builds its SQL with a template string:

      ```typescript
      const result = await db.query(
        `SELECT ${ORDER_COLUMNS} FROM orders
         WHERE merchant_id = ${session.merchantId} AND customer_email ILIKE '%${q}%' ORDER BY id`,
      );
      ```

      The `merchant_id = ...` filter looks like access control, but the user controls the text after it.
      Searching for `x' OR merchant_id <> 0 --` makes the database run
      `... ILIKE '%x' OR merchant_id <> 0 --%' ...`. `AND` binds tighter than `OR`, and `--` comments out the
      rest - so the condition is true for **every merchant's** rows. The real response, signed in as Asha:

      ```text
      HTTP 200
      {"orders":[{"id":101,"merchantId":1,...},{"id":102,"merchantId":1,...},
                 {"id":201,"merchantId":2,"customerEmail":"karan@example.test",...},
                 {"id":202,"merchantId":2,"customerEmail":"asha.k@example.test",...}]}
      ```

      An honest customer named O'Brien breaks it too: `q=o'brien` produced
      `syntax error at or near "brien"` (SQLSTATE 42601) and a 500. An input that breaks your SQL is an input
      that can **rewrite** your SQL.

      **The fix** keeps the SQL text fixed and sends the value separately - a **parameterised query**:

      ```typescript
      const result = await db.query(
        `SELECT ${ORDER_COLUMNS} FROM orders
         WHERE merchant_id = $1 AND customer_email ILIKE '%' || $2 || '%' ORDER BY id`,
        [session.merchantId, q],
      );
      ```

      Now the same three searches return `{"orders":[]}` with status 200 - the payload is searched for as
      text. (The `%` and `_` a user types still act as `LIKE` wildcards; that changes which rows match, inside
      the merchant's own data, not what the query does.)

      Things that matter in practice:

      - **Stacked queries were refused here** - `'; DELETE FROM refunds; --` failed with
        `cannot insert multiple commands into a prepared statement`, because PGlite (like node-postgres with
        parameters) uses PostgreSQL's extended query protocol. That is **not** a defence: the `OR` attack
        above still read everything, and a `UNION SELECT` could read other tables.
      - **Identifiers can't be parameters.** `$1` stands for a **value** - not a column name, a table name or
        `ASC`/`DESC`. For a sortable list, map the user's choice to an allow-list of fixed strings in code
        (the SQL Injection cheat sheet's "Allow-List Input Validation").
      - **ORMs help, until you use their raw-query escape hatch** with string building - A05 lists ORM
        injection explicitly.
      - **The same idea everywhere:** OS commands (pass arguments as an array to `execFile`, never a shell
        string), NoSQL queries (never pass a parsed JSON object from the client straight into a query filter
        - `{"$ne": null}` is an operator, not a value), LDAP, templates. Data and code travel separately.

      ASVS 5.0 **V1.2.4**: queries "use parameterized queries, ORMs, entity frameworks, or are otherwise
      protected from SQL Injection". The coming [Migrations and data access](#/lesson/migrations-and-data-access)
      lesson builds the data layer that way from the start.

  - id: xss
    kind: internals
    concepts: [injection-and-output-encoding]
    title: "XSS: injection into HTML - and what React does and doesn't do"
    body: |
      **Cross-site scripting** is injection where the interpreter is the **browser**: attacker text ends up in
      a page as markup or script, and runs with your site's origin - it can read the page, call your API with
      the user's cookies and defeat every CSRF defence (the CSRF cheat sheet: "Cross-Site Scripting (XSS) can
      defeat all CSRF mitigation techniques!").

      | Kind | Where the attacker text comes from |
      | --- | --- |
      | **Reflected** | The request itself - a query parameter echoed in the response |
      | **Stored** | Your database - a comment, a product name, a customer note |
      | **DOM-based** | Client-side code moves a value (URL fragment, `postMessage`) into a dangerous sink like `innerHTML` |

      SandPay's public receipt page reflects the reference from the e-mail link. The first draft, for
      `/receipt?ref=<script>alert(1)</script>`:

      ```text
      HTTP 404
      content-type: text/html; charset=utf-8
      x-powered-by: Express
      <!doctype html><title>Receipt</title><h1>Receipt <script>alert(1)</script> not found</h1>
      ```

      **Output encoding** for the HTML context turns the five special characters into entities, so the browser
      shows them instead of parsing them:

      ```typescript
      export function escapeHtml(text: string): string {
        return text
          .replaceAll('&', '&amp;') // first, or the other entities get double-encoded
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#x27;');
      }
      ```

      ```text
      <!doctype html><title>Receipt</title><h1>Receipt &lt;script&gt;alert(1)&lt;/script&gt; not found</h1>
      ```

      Encoding depends on the **context** - HTML text, an attribute, a URL, JavaScript, CSS each need their own
      rules (the XSS cheat sheet's "Output Encoding" sections). That is why you should let a framework or a
      template engine do it rather than concatenate HTML.

      **React** encodes text children for you. A run with React 19.2.9 in jsdom:

      | JSX | What ended up in the DOM |
      | --- | --- |
      | `<p>{'<img src=x onerror=alert(1)>'}</p>` | `<p>&lt;img src=x onerror=alert(1)&gt;</p>` - text, safe |
      | `<div dangerouslySetInnerHTML={{ __html: '<img src="x" onerror="alert(1)">' }} />` | `<div><img src="x" onerror="alert(1)"></div>` - **a real element** |
      | `<a href="javascript:alert(1)">` (also `' JavaScript:...'`, and on `iframe src`, `form action`) | `href="javascript:throw new Error('React has blocked a javascript: URL as a security precaution.')"` |
      | `<a href="data:text/html,<script>alert(1)</script>">` | the `data:` URL, unchanged |
      | `<a href="//evil.example/x">` | `//evil.example/x`, unchanged - a link to another site |

      So in React 19: text is safe; `dangerouslySetInnerHTML` is exactly as dangerous as its name ("it is
      trivial to introduce an XSS vulnerability this way" - react.dev); `javascript:` URLs are neutralised,
      but that is **not** URL validation - `data:` URLs and links to other sites pass through. Treat any
      user-supplied URL with an **allow-list of schemes** (`https:`, `http:`, `mailto:`), as ASVS **V1.2.2**
      asks ("Ensure that only safe URL protocols are permitted"). When you really must render user HTML
      (a rich-text editor), sanitise it with a maintained HTML sanitiser library first (ASVS V1.3.1).

  - id: csp-and-headers
    kind: code
    concepts: [injection-and-output-encoding, owasp-top-ten-2025]
    title: "Defence in depth: Content-Security-Policy and security headers (A02)"
    body: |
      A **Content-Security-Policy** tells the browser which sources of script, style, frames and so on the
      page may use. If an XSS bug slips through, a good policy stops the injected script from running. The
      W3C CSP Level 3 draft (section 8.5) describes a **strict CSP** as nonce- or hash-based:

      ```http
      Content-Security-Policy: script-src 'strict-dynamic' 'nonce-{RANDOM}'; base-uri 'self';
      ```

      with a fresh random nonce on every response and the same value on each `<script nonce="...">` the
      server writes. OWASP warns against **sole** reliance on CSP - it is a second line, after encoding.

      SandPay's API serves JSON and one HTML page with no scripts at all, so its policy can allow **nothing**.
      The headers the fixed app sends on every response (from the run):

      ```text
      x-content-type-options: nosniff
      content-security-policy: default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'
      referrer-policy: strict-origin-when-cross-origin
      ```

      | Header | What it does | Source |
      | --- | --- | --- |
      | `Content-Security-Policy` ... `frame-ancestors 'none'` | No scripts or resources; the page can't be framed (clickjacking) | ASVS 3.4.3, 3.4.6 |
      | `X-Content-Type-Options: nosniff` | The browser trusts `Content-Type` instead of guessing | ASVS 3.4.4 |
      | `Referrer-Policy: strict-origin-when-cross-origin` | Paths and query strings don't leak to other sites | ASVS 3.4.5 |
      | `Strict-Transport-Security: max-age=...` | HTTPS only for this host (set at the HTTPS edge, not on local HTTP) | ASVS 3.4.1 |
      | no `X-Powered-By` | Don't advertise the framework - `app.disable('x-powered-by')` in Express | Headers cheat sheet |

      ```typescript
      app.disable('x-powered-by');
      app.use((_req, res, next) => {
        res.set('X-Content-Type-Options', 'nosniff');
        res.set('Content-Security-Policy', "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'");
        res.set('Referrer-Policy', 'strict-origin-when-cross-origin');
        next();
      });
      ```

      **helmet** is a widely used Express middleware that sets a set of these headers with sensible defaults;
      it is an option, not a requirement - check its current defaults against your app before relying on them.
      The OWASP headers cheat sheet also recommends **not** setting the legacy `X-XSS-Protection` (or setting
      it to `0`).

  - id: visual
    kind: visual
    concepts: [csrf-and-cors]
    title: A forged refund, and where it is stopped
    body: |
      ```mermaid
      sequenceDiagram
        participant V as Victim's browser
        participant E as evil.example page
        participant A as SandPay API
        V->>A: Sign in - response sets the sid cookie
        V->>E: Victim opens a link to evil.example
        E->>V: Page auto-submits a form to the SandPay API
        V->>A: POST /orders/101/refunds with the sid cookie and Sec-Fetch-Site cross-site
        Note over A: First draft - cookie valid, refund created, 201
        Note over A: Fixed - cross-site or no X-CSRF-Token, 403 and nothing written
        A-->>V: 403 csrf_check_failed
      ```

      Notice that the browser attaches the cookie **because the request goes to SandPay** - not because SandPay's
      page sent it. The attacker never sees the cookie; they don't need to. What the attacker **can't** do is
      read the CSRF token from SandPay's page (the same-origin policy) or set `Sec-Fetch-Site` (the browser
      sets it, and page scripts may not).

  - id: csrf
    kind: internals
    concepts: [csrf-and-cors]
    title: "CSRF: proving a request came from your own page"
    body: |
      OWASP's definition: a CSRF attack "tricks an authenticated user's web browser into performing an
      unwanted action on a trusted site" - and "Since browser requests automatically include all cookies
      including session cookies, this attack works unless proper authorization is used". It only matters
      when the browser **automatically** sends the credential - **cookies** (and HTTP auth). An API that only
      accepts `Authorization: Bearer` tokens set by your JavaScript isn't exposed in the same way, which is one
      reason the choice in [Sessions, cookies and tokens](#/lesson/sessions-cookies-and-tokens) matters.

      The first draft accepts any request with the cookie. A forged refund (supertest sets the header a
      browser would send for a cross-site form):

      ```http
      POST /orders/101/refunds
      Cookie: sid=sid-asha
      Sec-Fetch-Site: cross-site
      Content-Type: application/json

      {"amountMinor":500}

      HTTP 201
      {"refundId":2,"orderId":101,"amountMinor":500}
      ```

      The layers, from OWASP's CSRF Prevention cheat sheet:

      1. **A CSRF token** (synchronizer token pattern) - a large random value created at sign-in, stored with
         the session, given to your page, and required on every state-changing request in a **header or form
         field**. The server compares it with the session's copy; an attacker's page can't read it. Compare
         in constant time (`crypto.timingSafeEqual`). For stateless servers the cheat sheet recommends the
         **signed double-submit cookie** (an HMAC bound to the session); the naive double-submit pattern is
         marked "DISCOURAGED".
      2. **Fetch Metadata** - modern browsers send `Sec-Fetch-Site` (`same-origin`, `same-site`, `cross-site`,
         `none`). Rejecting non-safe methods with `cross-site` is simple and blocks the classic attack. Headers
         starting with `Sec-` are **forbidden request headers** in the Fetch Standard, so a page can't fake
         them. The cheat sheet requires a fallback (Origin/Referer checks) for browsers that don't send them.
      3. **SameSite cookies** - `SameSite=Lax` keeps the cookie off cross-site POSTs, `Strict` off all
         cross-site requests. The cheat sheet treats it as **defence in depth**: it is scoped to the **site**,
         not the origin (a vulnerable `blog.sandpay.example` is "same-site"), Chromium defaults missing
         attributes to `Lax` but "Firefox and Safari do not", and `Lax` doesn't protect a state-changing **GET**.
      4. **Never change state on GET** - ASVS 3.5.3.

      The fixed app, after authentication:

      ```typescript
      app.use((req, res, next) => {
        if (SAFE_METHODS.has(req.method)) return next();
        const session = res.locals.session as Session;
        const token = req.get('X-CSRF-Token') ?? '';
        if (req.get('Sec-Fetch-Site') === 'cross-site' || !sameSecret(token, session.csrfToken)) {
          return void res.status(403).json({ error: 'csrf_check_failed' });
        }
        next();
      });
      ```

      Real results: no token → `403 {"error":"csrf_check_failed"}`; the right token with
      `Sec-Fetch-Site: cross-site` → 403; the right token from the dashboard → 201. A bonus of the custom
      header: a cross-origin `fetch` that sets `X-CSRF-Token` needs a CORS **preflight**, which the API only
      grants to its own dashboard.

  - id: cors
    kind: internals
    concepts: [csrf-and-cors]
    title: "CORS done right: it relaxes, it doesn't protect"
    body: |
      The **same-origin policy** already stops `evil.example`'s scripts from **reading** SandPay's responses.
      **CORS** headers are how SandPay **opts out** for specific origins - the headers cheat sheet: "If you
      don't use this header, your site is protected by default by the Same Origin Policy (SOP). What this
      header does is relax this control".

      The first draft "made CORS work" by echoing the request's `Origin`. From `https://evil.example`, with
      Asha's cookie:

      ```text
      HTTP 200
      access-control-allow-origin: https://evil.example
      access-control-allow-credentials: true
      {"id":101,"merchantId":1,"customerEmail":"meera@example.test",...}
      ```

      Those two headers tell the victim's browser "let `evil.example`'s script read this response, cookies
      included" - any site the merchant visits can read their orders. The Fetch Standard (3.3.5) forbids the
      lazier version - with credentials, `Access-Control-Allow-Origin` "cannot be `*`" - which is exactly why
      people reach for reflection, which is worse.

      The fix is an **allow-list** (ASVS 3.4.2), plus `Vary: Origin` so caches don't serve one origin's
      headers to another:

      ```typescript
      const allowed = new Set(allowedOrigins); // ['https://dashboard.sandpay.example']
      app.use((req, res, next) => {
        res.vary('Origin');
        const origin = req.get('Origin');
        if (origin && allowed.has(origin)) {
          res.set('Access-Control-Allow-Origin', origin);
          res.set('Access-Control-Allow-Credentials', 'true');
          if (req.method === 'OPTIONS') { /* preflight: allowed methods and headers, then 204 */ }
        }
        next();
      });
      ```

      The fixed app's real answer to the same request from `evil.example`:

      ```text
      HTTP 200
      vary: Origin
      {"id":101,"merchantId":1,"customerEmail":"meera@example.test",...}
      ```

      **The server still answered with the data.** CORS never stops a request from reaching your server or a
      response from being produced - the **browser** withholds it from the page because the CORS headers are
      missing. So CORS is not access control (A01) and not CSRF protection: a non-browser client (curl, a
      script, a server) ignores it completely. Your authorization checks and CSRF defences must stand on their
      own.

  - id: supply-chain-and-logging
    kind: when
    concepts: [owasp-top-ten-2025]
    title: The rest of the map - supply chain, logging, exceptional conditions, SSRF
    body: |
      **A03 Software Supply Chain Failures.** Your app runs thousands of lines you didn't write. Practical
      habits:

      - commit the lockfile and install with `npm ci`, so CI builds exactly what you tested (see
        [Node.js runtime and npm](#/lesson/node-runtime-and-npm));
      - run `npm audit` in CI - on `practice/fullstack` today it printed `found 0 vulnerabilities` (npm
        11.19.0); that result changes as advisories are published, which is the point of running it
        continuously;
      - add dependencies deliberately (who maintains it, how many transitive packages), and keep them updated
        in small steps;
      - be wary of install scripts - code a package runs on `npm install`: this project's installs with npm
        11.19.0 printed `npm warn install-scripts` for `esbuild` and pointed to `npm install-scripts approve`
        to allow it.

      **A09 Security Logging and Alerting Failures.** Log security-relevant events - failed sign-ins, 403s
      from CSRF and access checks, validation failures in bulk - with a request id, without secrets or full
      bodies, and **alert** on patterns (OWASP renamed the category to stress that "Great logging with no
      alerting is of minimal value"). The fixed app answers a forged refund with 403; in production that
      403 deserves a log line.

      **A10 Mishandling of Exceptional Conditions.** The first draft's `o'brien` search crashed with a 500 -
      an input bug surfacing as an exception. Fail **closed**: a middleware that can't load the session must
      deny, not skip; an exception in an authorization check must not let the request through. The central
      error handler from [Input validation and error handling](#/lesson/input-validation-and-error-handling)
      is the A10 defence for responses.

      **SSRF (now inside A01).** If your server fetches a URL a user supplies (a webhook URL, an avatar
      import), an attacker can point it at internal addresses. Allow-list schemes, hosts and ports (ASVS
      1.3.6), and don't follow redirects blindly.

  - id: line-by-line
    kind: line-by-line
    concepts: [access-control-idor, csrf-and-cors]
    title: Line by line - the order of the fixed middleware
    body: |
      ```mermaid
      flowchart TD
        R[Request] --> H[Security headers on every response]
        H --> C{Origin on the allow-list?}
        C -- yes --> CH[Add CORS headers; a preflight ends here with 204]
        C -- no --> P
        CH --> P{Public route such as /receipt?}
        P -- yes --> PR[Encode output and respond]
        P -- no --> S{Valid session?}
        S -- no --> U[401 - deny by default]
        S -- yes --> M{Unsafe method?}
        M -- no --> O[Route scopes the query to the merchant]
        M -- yes --> T{Not cross-site and the CSRF token matches?}
        T -- no --> F[403 csrf_check_failed]
        T -- yes --> O
        O --> D[200, 201 - or 404 when it isn't theirs]
      ```

      - **Headers first** - so even a 401 or 403 carries `nosniff` and the CSP.
      - **CORS before authentication** - a browser's preflight (`OPTIONS`) never carries cookies, so it must be
        answered without a session. The real run: the dashboard's preflight got `204` with
        `access-control-allow-methods: GET, POST` and `access-control-allow-headers: Content-Type, X-CSRF-Token`;
        `evil.example`'s preflight fell through to the session check and got a `401` with no CORS headers -
        either way, the browser won't send the real request.
      - **Public routes above the session check** - the one place where "no session" is allowed is visible in
        one spot.
      - **Session check as a middleware, not inside each route** - deny by default.
      - **CSRF after the session check** - the token belongs to the session.
      - **Ownership in the query** - `WHERE id = $1 AND merchant_id = $2` in one helper used by every route
        that touches an order.

  - id: example
    kind: example
    concepts: [access-control-idor, csrf-and-cors]
    title: "A realistic incident: refunds nobody asked for"
    body: |
      _A fictional scenario, assembled from the attacks run in this lesson._

      A SandPay merchant reports three refunds of 5.00 they never issued. The tester's investigation:

      1. **Evidence first.** The refund rows have the merchant's own session id in the audit log - so no
         stolen password. The access log shows `POST /orders/.../refunds` with `Sec-Fetch-Site: cross-site`
         and a `Referer` from a discount-code site the merchant had visited.
      2. **Reproduce.** From a test page on another origin, a form posting to the refund endpoint while signed
         in to the dashboard: 201. CSRF confirmed.
      3. **Look for neighbours.** The same review finds that the API reflects any `Origin` with credentials,
         and that changing the order id in the dashboard's network calls shows another merchant's order -
         three A01 findings in one afternoon.
      4. **Fix and prove.** Session-bound CSRF token plus a `Sec-Fetch-Site` check, an origin allow-list,
         owner-scoped queries. The regression tests are this lesson's practice tests: each plays the attacker
         and asserts both the status (403, 404, no CORS header) **and** that no refund row was written.

      The tester's value here is the same as in any defect: evidence, a minimal reproduction, the root cause,
      and tests that prove the fix - see [Defect reports that get fixed](#/lesson/defect-reports-that-get-fixed).

  - id: tests
    kind: tests
    concepts: [access-control-idor, injection-and-output-encoding, csrf-and-cors]
    title: Security tests that play the attacker
    body: |
      | # | Case | Request | Expected | Evidence |
      | --- | --- | --- | --- | --- |
      | 1 | No session | `GET /orders/101` | 401 | body has no order data |
      | 2 | Own order | Asha, `GET /orders/101` | 200, `merchantId: 1` | body |
      | 3 | IDOR read | Asha, `GET /orders/201` | **404** | body doesn't contain Ravi's customer e-mail |
      | 4 | IDOR write | Asha, `POST /orders/201/refunds` with a valid token | 404 | `refunds` row count unchanged |
      | 5 | SQL injection | `q=x' OR merchant_id <> 0 --` | 200, `[]` | no other merchant's rows |
      | 6 | Quote in data | `q=o'brien` | 200 | not a 500 |
      | 7 | Reflected XSS | `/receipt?ref=<script>alert(1)</script>` | text encoded | body has `&lt;script&gt;`, not `<script>` |
      | 8 | Headers | any route, including 401s | `nosniff`, CSP with `frame-ancestors 'none'`, no `X-Powered-By` | response headers |
      | 9 | CORS allowed | `Origin: https://dashboard.sandpay.example` | ACAO = that origin, credentials true, `Vary: Origin` | headers |
      | 10 | CORS denied | `Origin: https://evil.example` | no ACAO, no ACAC | headers |
      | 11 | CSRF, no token | refund POST without `X-CSRF-Token` | 403 | row count unchanged |
      | 12 | CSRF, wrong token | another session's token | 403 | row count unchanged |
      | 13 | CSRF, cross-site | right token, `Sec-Fetch-Site: cross-site` | 403 | row count unchanged |
      | 14 | Legitimate refund | right token, `same-origin` | 201 | one new row |
      | 15 | Stored XSS in React | comment text `<img src=x onerror=...>` | shown as text | no `img` element in the DOM |
      | 16 | Unsafe link | website `data:text/html,...` | no link rendered | no `a` element |

      Two habits make these tests worth having: always pair the **negative** case with a **positive** one (a
      fix that rejects everything also passes case 13), and check **side effects**, not only status codes.

  - id: mistakes
    kind: mistakes
    concepts: [access-control-idor, injection-and-output-encoding, csrf-and-cors]
    title: Common mistakes and how to debug them
    body: |
      - **Checking access in the UI only.** Hiding a button isn't a control; the API must check (ASVS 8.3.1).
        Debug by replaying the request from DevTools with another id.
      - **Authentication mistaken for authorization.** "The user is signed in" is not "the user may do this
        to this object". Look for queries that select by id alone.
      - **Escaping SQL by hand.** Replacing `'` with `''` misses other contexts; the SQL Injection cheat sheet
        calls manual escaping "STRONGLY DISCOURAGED". Use parameters.
      - **`dangerouslySetInnerHTML` for "a bit of formatting".** Render text and use CSS
        (`white-space: pre-line` for line breaks) or a sanitiser.
      - **Believing React makes URLs safe.** It blocks `javascript:` only. Validate schemes.
      - **`Access-Control-Allow-Origin: *` "to fix CORS errors"** - and then reflection when credentials fail.
        A CORS error in the console means the **browser** refused; fix the allow-list, not the check.
      - **Relying on SameSite alone**, or on a CSRF token in a cookie that the server also reads from the
        cookie. The token must come back in a header or form field.
      - **State-changing GET endpoints** (`GET /refund?order=101`) - SameSite=Lax lets them through.
      - **Testing only that the attack fails.** A route that answers 403 to everyone "passes". Add the
        legitimate request.

      Debugging method: reproduce with the smallest request (curl or supertest), compare the response
      **headers** as well as the body, and for browser-only behaviour (CORS, CSP, SameSite) read the DevTools
      console and the Network panel's request headers - the browser says which rule it applied.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [owasp-top-ten-2025, csrf-and-cors]
    title: Trade-offs and limits
    body: |
      - **The Top 10 is not a checklist.** It's ten categories of roughly 25 CWEs each, ranked partly by
        survey. Passing "a Top 10 scan" says little; the ASVS levels are the testable standard.
      - **404 versus 403** - 404 hides existence but can confuse support ("I can see order 201 in the
        report"); decide per resource and be consistent.
      - **Per-session versus per-request CSRF tokens** - per-request tokens are stronger but break the Back
        button (the cheat sheet notes this); per-session is the common choice.
      - **Fetch Metadata only** is simpler than tokens and covers modern browsers; OWASP requires an
        Origin/Referer fallback. Tokens work everywhere but need plumbing in every form and fetch.
      - **Bearer tokens instead of cookies** avoid CSRF but must live somewhere JavaScript can read - which
        XSS can read too. There is no free option; see
        [Sessions, cookies and tokens](#/lesson/sessions-cookies-and-tokens).
      - **A strict CSP** stops whole classes of XSS but needs nonces wired into server rendering and breaks
        inline scripts and some third-party widgets; start with `Content-Security-Policy-Report-Only`.

  - id: summary
    kind: summary
    concepts: [owasp-top-ten-2025, access-control-idor, injection-and-output-encoding, csrf-and-cors]
    title: Quick reference
    body: |
      - **Top 10:2025:** A01 Broken Access Control (incl. SSRF, CSRF), A02 Misconfiguration, A03 Supply
        Chain, A04 Crypto, A05 Injection (incl. XSS), A06 Insecure Design, A07 Authentication, A08 Integrity,
        A09 Logging and Alerting, A10 Exceptional Conditions. Map with it; verify with the ASVS.
      - **Access control:** session check as middleware (deny by default); every object query scoped by owner;
        404 for other tenants' objects; reads **and** writes.
      - **SQL:** values as parameters (`$1`), identifiers from an allow-list, never string building.
      - **XSS:** React escapes text; `dangerouslySetInnerHTML` doesn't; React 19 blocks `javascript:` URLs only
        - allow-list URL schemes. Encode per context; CSP as a second line.
      - **CSRF:** session-bound token in a header or form field, `Sec-Fetch-Site: cross-site` refused on unsafe
        methods, SameSite cookies as a layer, no state changes on GET.
      - **CORS:** an allow-list of origins plus `Vary: Origin`; never reflect `Origin` with credentials;
        CORS doesn't stop requests - authorization must.
      - **Headers:** `nosniff`, CSP with `frame-ancestors`, Referrer-Policy, HSTS at the edge, no
        `X-Powered-By`.
      - **Tests:** play the attacker, pair each with a legitimate request, check side effects.

exercises:
  - id: map-findings
    type: mcq
    concept: owasp-top-ten-2025
    skill: application
    title: File the finding under the right 2025 category
    prompt: |
      A penetration test of SandPay reports: "The avatar-import feature fetches any URL the merchant enters.
      Entering `http://169.254.169.254/latest/meta-data/` returned the cloud instance's metadata." Under which
      OWASP Top 10:**2025** category does this finding belong?
    options:
      - id: a01
        text: A01:2025 Broken Access Control
        feedback: Correct - Server-Side Request Forgery (CWE-918) was rolled into A01 in 2025. The server is used to reach resources the attacker can't reach directly.
      - id: a10-ssrf
        text: A10 Server-Side Request Forgery
        feedback: That was the 2021 list. In 2025, A10 is Mishandling of Exceptional Conditions and SSRF moved into A01.
      - id: a05
        text: A05:2025 Injection
        feedback: The URL isn't interpreted as code by an interpreter; the server is tricked into making a request with its own network position - an access control problem in OWASP's 2025 grouping.
      - id: a02
        text: A02:2025 Security Misconfiguration
        feedback: Blocking the metadata address at the network is a good hardening step, but the root cause is the feature fetching attacker-chosen URLs; OWASP files SSRF under A01.
    correct: [a01]
    hints:
      - Which category did the 2025 introduction say SSRF was "rolled into"?
      - Is anything being interpreted as code here?
    solution: |
      **A01:2025 Broken Access Control.** The 2025 introduction: "Server-Side Request Forgery (SSRF) has been
      rolled into this category." The fix is an allow-list of schemes, hosts and ports for server-side fetches
      (ASVS 1.3.6). **Confirm** a fix by retrying the metadata address, `localhost`, an internal hostname and a
      redirect from an allowed host to an internal one - all must be refused.
    followUp: |
      The same report says the API returns stack traces with SQL in them when a search fails. Which 2025
      category, and which lesson in this course fixes it?

  - id: spot-idor
    type: debug
    concept: access-control-idor
    skill: analysis
    title: Find the missing check
    prompt: |
      A merchant can download another merchant's settlement report by changing the id in the URL. The route
      requires a session. Click the line that causes the leak.
    language: typescript
    code: |
      app.get('/settlements/:id/report', requireSession, async (req, res) => {
        const merchantId = res.locals.session.merchantId;
        const id = Number(req.params.id);
        if (!Number.isInteger(id)) return void res.status(400).json({ error: 'bad_id' });
        const report = await db.query('SELECT * FROM settlement_reports WHERE id = $1', [id]);
        if (!report.rows[0]) return void res.status(404).json({ error: 'not_found' });
        res.type('text/csv').send(report.rows[0].csv);
      });
    correctLines: [5]
    lineNotes:
      - line: 1
        note: requireSession is the authentication check - it is present and working; it answers who, not which reports.
      - line: 2
        note: The merchant id is read correctly from the server-side session - it just isn't used.
      - line: 6
        note: 404 for a missing row is right; once the query is scoped, this also covers "not yours".
    hints:
      - Where is merchantId used after line 2?
      - Which query decides which rows can be returned?
      - The fix adds a condition and a parameter.
    solution: |
      **Line 5** loads the report by id alone. Scope it: `WHERE id = $1 AND merchant_id = $2` with
      `[id, merchantId]`, so another merchant's report is simply not found (404). **Confirm** with two
      sessions: merchant 1 gets their report (200) and 404 for merchant 2's id - and the response body for the
      404 contains no report data.
    followUp: |
      The same app has `DELETE /settlements/:id`. Write the test that would have caught the same bug there,
      including the check that nothing was deleted.

  - id: idor-status
    type: mcq
    concept: access-control-idor
    skill: analysis
    title: 403 or 404?
    prompt: |
      Asha (merchant 1) requests `GET /orders/201`, which belongs to merchant 2. Which response is best, and
      why?
    options:
      - id: not-found
        text: 404 order_not_found - the same response as for an id that doesn't exist.
        feedback: Correct - it reveals nothing about other merchants' orders, and one scoped query produces it for both cases.
      - id: forbidden
        text: 403 Forbidden - the order exists but isn't hers, and 403 is the honest status.
        feedback: 403 tells the attacker that order 201 exists; iterating ids then maps other tenants' activity. 403 fits when the user may know the object exists.
      - id: ok-redacted
        text: 200 with the customer e-mail removed.
        feedback: Still returns another merchant's amount, currency and status - data she has no right to. Field redaction doesn't fix object-level access.
      - id: unauthorized
        text: 401 Unauthorized.
        feedback: 401 means "authenticate" - she is authenticated. Signing in again wouldn't change the answer.
    correct: [not-found]
    hints:
      - What can an attacker learn from the difference between two status codes?
      - What does 401 ask the client to do?
    solution: |
      **404.** Scoping the query (`AND merchant_id = $2`) makes "not yours" and "doesn't exist"
      indistinguishable, which leaks nothing and needs no separate check. **Confirm** by comparing the
      responses for an existing foreign id and a non-existent id - status and body must be identical.

  - id: sort-injection
    type: debug
    concept: injection-and-output-encoding
    skill: application
    title: Parameterised - and still injectable
    prompt: |
      The order list supports sorting: `GET /orders?sort=created_at`. A tester sends
      `sort=(SELECT CASE WHEN (SELECT count(*) FROM merchants) > 1 THEN id ELSE amount_minor END)` and the
      order of results changes. Click the line that allows it.
    language: typescript
    code: |
      app.get('/orders', requireSession, async (req, res) => {
        const merchantId = res.locals.session.merchantId;
        const sort = String(req.query.sort ?? 'created_at');
        const result = await db.query(
          `SELECT id, amount_minor, created_at FROM orders WHERE merchant_id = $1 ORDER BY ${sort} DESC`,
          [merchantId],
        );
        res.json({ orders: result.rows });
      });
    correctLines: [5]
    lineNotes:
      - line: 3
        note: Reading the parameter is fine; the problem is where it is used.
      - line: 6
        note: The merchant id is a proper parameter - that part is safe.
    hints:
      - Can `$2` stand for a column name?
      - What does the SQL Injection cheat sheet say about table names, column names and sort direction?
    solution: |
      **Line 5** puts the user's text into the SQL. Parameters only stand for **values**, so the fix is an
      allow-list: `const columns = { created_at: 'created_at', amount: 'amount_minor' } as const;` - look up
      the user's choice, reject anything else with 422, and put only the looked-up constant in the SQL.
      **Confirm** with the tester's payload (now 422) and each allowed value (sorted correctly).

  - id: react-xss
    type: mcq
    concept: injection-and-output-encoding
    skill: analysis
    title: Which line is still an XSS hole in React 19?
    prompt: |
      `comment.text` and `comment.website` come from customers. Which line is an XSS risk in React 19.2?
    options:
      - id: inner-html
        text: "<div dangerouslySetInnerHTML={{ __html: marked(comment.text) }} />"
        feedback: Correct - Markdown converters pass raw HTML through unless configured otherwise, and React inserts the result as markup. Sanitise the HTML first or render without HTML.
      - id: text
        text: "<p>{comment.text}</p>"
        feedback: React encodes text children - `<img onerror>` shows as text. This line is safe.
      - id: javascript-href
        text: "<a href={comment.website}>Website</a>, when website is javascript:alert(1)"
        feedback: React 19 replaces javascript URLs with one that throws (seen in this lesson's run). It still needs a scheme allow-list for data URLs and other-site links - but the script doesn't run.
      - id: title-attr
        text: "<span title={comment.text}>i</span>"
        feedback: Attribute values are encoded by React too; quotes can't break out of the attribute.
    correct: [inner-html]
    hints:
      - Which prop's name warns you?
      - What did React do with a javascript URL in the run?
    solution: |
      Only `dangerouslySetInnerHTML` inserts markup. react.dev: "Unless the markup is coming from a completely
      trusted source, it is trivial to introduce an XSS vulnerability this way." **Confirm** with a test that
      renders `<img src=x onerror=alert(1)>` as the comment and asserts there is no `img` element.
    followUp: |
      Product managers want bold and links in comments. What would you propose instead of
      `dangerouslySetInnerHTML` with raw user HTML?

  - id: middleware-order
    type: order
    concept: csrf-and-cors
    skill: application
    title: Order the security middleware
    prompt: |
      Put the fixed SandPay API's middleware and routes in the order they are registered, first to last.
    items:
      - id: headers
        text: Security headers (nosniff, CSP, Referrer-Policy)
      - id: cors
        text: CORS allow-list (answers allowed preflights with 204)
      - id: public
        text: Public routes (the receipt page)
      - id: session
        text: Session check - 401 without a valid session
      - id: csrf
        text: CSRF check on unsafe methods
      - id: routes
        text: Order routes that scope queries to the merchant
    hints:
      - Which responses should carry security headers - all of them?
      - Does a CORS preflight carry cookies?
      - What does the CSRF check compare the token with?
    solution: |
      **Headers** first so every response, even an error, carries them. **CORS** before the session check,
      because preflights never include cookies. **Public routes** above the session check so the exception is
      explicit. The **session check** then denies by default. **CSRF** needs the session's token, so it comes
      after the session check. **Routes** last, each scoping by owner.

  - id: cors-fix
    type: mcq
    concept: csrf-and-cors
    skill: application
    title: The CORS error in the dashboard
    prompt: |
      The new dashboard at `https://dashboard.sandpay.example` calls the API at `https://api.sandpay.example`
      with `fetch(url, { credentials: 'include' })`. The console shows a CORS error. A teammate proposes
      `Access-Control-Allow-Origin: *`. What should the API do?
    options:
      - id: allow-list
        text: Send Access-Control-Allow-Origin with the exact dashboard origin (from an allow-list), Access-Control-Allow-Credentials true and Vary Origin.
        feedback: Correct - named origins only, credentials allowed for them, and caches told the response varies by Origin.
      - id: star
        text: Send Access-Control-Allow-Origin set to * - it allows everyone, so it must work.
        feedback: With credentials, the Fetch Standard says Access-Control-Allow-Origin cannot be * - the browser still refuses. And for credentialed data you wouldn't want everyone.
      - id: reflect
        text: Copy the request's Origin header into Access-Control-Allow-Origin with credentials true.
        feedback: That works for the dashboard - and for every malicious site, which can then read merchants' data with their cookies. This lesson's first draft did exactly this.
      - id: disable
        text: Turn CORS off on the server so the browser stops checking.
        feedback: The browser enforces the same-origin policy; the server can't turn it off. Without CORS headers the browser keeps refusing.
    correct: [allow-list]
    hints:
      - Who enforces CORS - the server or the browser?
      - What does the Fetch Standard say about * with credentials?
    solution: |
      An **allow-list** (ASVS 3.4.2). **Confirm** with two requests: from the dashboard origin the response
      has ACAO equal to that origin and ACAC `true`; from `https://evil.example` neither header is present.
      And remember the response body is still produced - CORS isn't authorization.

  - id: samesite-enough
    type: mcq
    concept: csrf-and-cors
    skill: analysis
    title: Is SameSite=Lax enough here?
    prompt: |
      SandPay sets its session cookie with `SameSite=Lax; Secure; HttpOnly`. A legacy endpoint,
      `GET /orders/101/refund?amount=500`, creates a refund (it's linked from old e-mails). Is the endpoint
      protected from CSRF?
    options:
      - id: no-get
        text: No - Lax still sends the cookie on cross-site top-level GET navigations, so a link or redirect to this URL creates a refund.
        feedback: Correct - the CSRF cheat sheet calls this "the single most common way SameSite-based defenses fail in practice". Make it a POST with a token.
      - id: yes-lax
        text: Yes - SameSite=Lax blocks all cross-site requests.
        feedback: That is Strict. Lax allows the cookie on top-level navigations with safe methods - like following a link.
      - id: yes-httponly
        text: Yes - HttpOnly stops other sites from using the cookie.
        feedback: HttpOnly stops JavaScript from reading the cookie; the browser still attaches it to requests, which is all CSRF needs.
      - id: yes-secure
        text: Yes - Secure means only HTTPS requests carry the cookie.
        feedback: The forged request is HTTPS too; Secure protects the cookie in transit, not against forged requests.
    correct: [no-get]
    hints:
      - What kind of request does Lax still attach cookies to?
      - What does HttpOnly actually restrict?
    solution: |
      **Not protected.** State-changing GETs defeat Lax (and ASVS 3.5.3 forbids them). Change it to POST, require
      the CSRF token, and reject `Sec-Fetch-Site: cross-site`. **Confirm** by opening the URL from a page on
      another site while signed in: before the fix a refund row appears; after, the endpoint answers 405 or
      403 and no row is written.

  - id: fix-merchant-api
    type: coding
    concept: access-control-idor
    skill: application
    title: Fix the vulnerable SandPay merchant API
    prompt: |
      `merchant-api.ts` is a first draft that works for an honest merchant and fails every attacker test.
      Fix it without changing the routes or response shapes: deny by default (401 without a session) and
      scope every order lookup to the signed-in merchant (404 otherwise, for reads and refunds); make the
      search a parameterised query; HTML-encode the reflected receipt reference; send `nosniff` and a CSP with
      `default-src 'none'` and `frame-ancestors 'none'` and no `X-Powered-By`; allow CORS only for
      `allowedOrigins` (with `Vary: Origin`); require the session's CSRF token in `X-CSRF-Token` for refunds
      and refuse `Sec-Fetch-Site: cross-site`. `sandpay-db.ts` seeds two merchants - don't change it.
    project: fullstack
    files:
      - exercises/owasp/merchant-api.ts
    test: tests/owasp/merchant-api.test.ts
    command: npx vitest run tests/owasp/merchant-api.test.ts
    hints:
      - Start with access control - a middleware after the public route that puts the session in `res.locals`, and one `ownOrder` helper with `AND merchant_id = $2`.
      - "For the search: `customer_email ILIKE '%' || $2 || '%'` with `[merchantId, q]`."
      - "`app.disable('x-powered-by')` and one header middleware registered first; `res.vary('Origin')` in the CORS middleware."
      - "For the token: compare with `crypto.timingSafeEqual` on equal-length Buffers; check `req.get('Sec-Fetch-Site') === 'cross-site'` for non-GET methods."
    modelAnswer: |
      ```typescript
      app.disable('x-powered-by');
      app.use((_req, res, next) => {
        res.set('X-Content-Type-Options', 'nosniff');
        res.set('Content-Security-Policy', "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'");
        next();
      });
      const allowed = new Set(allowedOrigins);
      app.use((req, res, next) => {
        res.vary('Origin');
        const origin = req.get('Origin');
        if (origin && allowed.has(origin)) {
          res.set('Access-Control-Allow-Origin', origin);
          res.set('Access-Control-Allow-Credentials', 'true');
        }
        next();
      });
      app.get('/receipt', (req, res) => {
        const ref = escapeHtml(String(req.query.ref ?? ''));
        res.status(404).type('html').send(`<!doctype html><title>Receipt</title><h1>Receipt ${ref} not found</h1>`);
      });
      app.use((req, res, next) => {                       // deny by default
        const session = sessions.get(String(req.cookies.sid));
        if (!session) return void res.status(401).json({ error: 'sign_in_required' });
        res.locals.session = session;
        next();
      });
      app.use((req, res, next) => {                       // CSRF
        if (SAFE_METHODS.has(req.method)) return next();
        const token = req.get('X-CSRF-Token') ?? '';
        if (req.get('Sec-Fetch-Site') === 'cross-site' || !sameSecret(token, res.locals.session.csrfToken)) {
          return void res.status(403).json({ error: 'csrf_check_failed' });
        }
        next();
      });
      // every order route uses: WHERE id = $1 AND merchant_id = $2
      ```

      Order matters: headers before everything so errors carry them; CORS before the session check because
      preflights have no cookies; the public receipt route above the session check; CSRF after it because the
      token lives in the session. The search becomes
      `WHERE merchant_id = $1 AND customer_email ILIKE '%' || $2 || '%'`. The full reference is
      `solutions/owasp/merchant-api.ts`.
    rubric:
      - Every test in tests/owasp/merchant-api.test.ts passes.
      - The session check is one middleware (deny by default), not repeated inside each route.
      - Reads and refunds share one owner-scoped lookup; no query selects an order by id alone.
      - No user input is concatenated into SQL anywhere.
      - The CSRF token is compared in constant time and read from the header, never from a cookie.
      - The CORS allow-list is an exact match on the full origin - no `endsWith` or regex on the host.
    solution: |
      Headers, CORS allow-list, public route, session middleware, CSRF middleware, then owner-scoped,
      parameterised routes. Every attacker test then gets 401, 403, 404 or encoded output, while the
      dashboard's own requests still succeed. The reference is `solutions/owasp/merchant-api.ts`.
    followUp: |
      Add `GET /orders?sort=` with `created_at` and `amount` as the only allowed sorts. Which test proves an
      unknown sort is rejected, and which proves the allowed ones still work?

  - id: safe-comment-view
    type: coding
    concept: injection-and-output-encoding
    skill: application
    title: Render customer comments safely in React
    prompt: |
      `CommentView.tsx` renders customer comments with `dangerouslySetInnerHTML` and puts the customer's
      website straight into `href`. Write `safeHref(raw)` - accept absolute `http:`, `https:` and `mailto:` URLs
      and site paths starting with a single `/`; return `undefined` for everything else (`javascript:`, `data:`,
      `vbscript:`, `file:`, `//host`, text that isn't a URL) - and make `CommentView` render the author and
      text as text (line breaks kept with `white-space: pre-line`) and the website as a link only when
      `safeHref` accepts it, with `rel="nofollow ugc noopener noreferrer"`.
    project: fullstack
    files:
      - exercises/owasp/CommentView.tsx
    test: tests/owasp/comment-view.test.tsx
    command: npx vitest run tests/owasp/comment-view.test.tsx
    hints:
      - Text children are encoded by React - removing `dangerouslySetInnerHTML` is most of the XSS fix.
      - "`new URL(value)` throws for relative input and gives you `.protocol` (with the colon) for absolute URLs."
      - Check the `/path` case before parsing, and reject anything starting with `//`.
    modelAnswer: |
      ```tsx
      const ALLOWED_SCHEMES = new Set(['http:', 'https:', 'mailto:']);

      export function safeHref(raw: string): string | undefined {
        const value = raw.trim();
        if (value.startsWith('/') && !value.startsWith('//') && !value.startsWith('/\\')) return value;
        try {
          const url = new URL(value);
          return ALLOWED_SCHEMES.has(url.protocol) ? url.href : undefined;
        } catch {
          return undefined;
        }
      }

      export function CommentView({ comment }: { comment: Comment }) {
        const href = comment.website === undefined ? undefined : safeHref(comment.website);
        return (
          <article aria-label={`Comment from ${comment.author}`}>
            <p>{comment.author}</p>
            <div style={{ whiteSpace: 'pre-line' }}>{comment.text}</div>
            {href && <a href={href} rel="nofollow ugc noopener noreferrer">Website</a>}
          </article>
        );
      }
      ```

      An **allow-list** of schemes, not a block-list: `new URL` normalises case and whitespace
      (`' JaVaScRiPt:'` has protocol `javascript:`), and anything unusual is simply not on the list. `/\`
      is rejected too because browsers treat a backslash like a slash in URLs. `rel="ugc nofollow"` tells
      search engines the link is user content; `noopener noreferrer` stops the opened page reaching back.
    rubric:
      - Every test in tests/owasp/comment-view.test.tsx passes.
      - No dangerouslySetInnerHTML is left in the component.
      - safeHref is an allow-list of schemes, not a list of blocked prefixes.
      - The returned href is the parsed URL (or the checked path), not the raw input.
    solution: |
      Remove `dangerouslySetInnerHTML` (React encodes text), keep line breaks with CSS, and gate the link
      through an allow-list `safeHref` built on `new URL`. The reference is `solutions/owasp/CommentView.tsx`.
    followUp: |
      Merchants ask for clickable links **inside** comment text. How would you find URLs in the text and
      render them as links without ever producing HTML from the text?

  - id: security-test-plan
    type: testdesign
    concept: csrf-and-cors
    skill: analysis
    title: A security test plan for the refund flow
    prompt: |
      Design tests for SandPay's refund flow (dashboard page plus `POST /orders/:id/refunds`, cookie session,
      CSRF token, CORS for the dashboard origin). Give at least eight cases with preconditions, steps, the
      expected result **and the evidence** - including at least one case that needs a real browser.
    hints:
      - Play each attacker - another merchant, a malicious site, a script with no browser.
      - Which behaviour do only browsers enforce?
      - For every rejected request, how do you prove nothing changed?
    modelAnswer: |
      1. **Legitimate refund** - Asha signed in, token from the page, same-origin → 201; one refund row.
      2. **Another merchant's order** - Asha, valid token, order 201 → 404; row count unchanged; body has no
         order data.
      3. **No token** - valid cookie, no `X-CSRF-Token` → 403; row count unchanged.
      4. **Other session's token** - Ravi's token with Asha's cookie → 403; unchanged.
      5. **Cross-site** - valid token, `Sec-Fetch-Site: cross-site` → 403; unchanged; a security log line
         with the request id.
      6. **Real browser CSRF** - in Playwright, sign in, open a page on another origin with an auto-submitting
         form to the refund URL → refused; refund list in the dashboard unchanged.
      7. **CORS read** - from a page on `https://evil.example` (Playwright), `fetch` the order with
         `credentials: 'include'` → the promise rejects (TypeError) in the page; the network panel shows the
         response arrived without ACAO.
      8. **CORS allowed** - from the dashboard origin → response readable; headers ACAO = dashboard, ACAC
         true, `Vary: Origin`.
      9. **GET can't refund** - `GET /orders/101/refunds?amountMinor=500` → 404 or 405; unchanged.
      10. **Amount abuse** - `amountMinor` 0, negative, larger than the order, a string → 422; unchanged.
    rubric:
      - Includes cross-tenant (IDOR) cases for writes, not only reads.
      - Covers missing, wrong and cross-site tokens separately.
      - Includes at least one real-browser case for behaviour only browsers enforce (CORS, SameSite).
      - Pairs rejections with a legitimate request.
      - States side-effect evidence (row counts, audit or security logs) for every rejected case.
    solution: |
      A strong plan plays each attacker (other tenant, other site, non-browser client), separates the CSRF
      failure modes, uses a real browser where the browser is the enforcer, and proves every rejection left no
      trace while the legitimate path still works.

  - id: interview-owasp
    type: interview
    concept: owasp-top-ten-2025
    skill: analysis
    title: "\"How do you keep a web app safe from the OWASP Top 10?\""
    prompt: |
      An interviewer asks: "You're the full stack developer on a payments dashboard - React frontend, Node API,
      cookie sessions. Which OWASP Top 10 risks worry you most, and what do you actually do about them in the
      code?"
    modelAnswer: |
      I use the Top 10 as a map - the 2025 edition puts Broken Access Control first, and that's where I start.
      Every request that names an object is checked against the signed-in user on the server, in the query
      itself - `WHERE id = $1 AND merchant_id = $2` - so another tenant's order is a 404. The session check is a
      middleware that denies by default, so new routes are protected automatically.

      Injection: all SQL is parameterised; anything structural like a sort column comes from an allow-list.
      For XSS, React encodes text, so the rules are no `dangerouslySetInnerHTML` with user content (sanitise if
      it's unavoidable) and an allow-list of URL schemes for user links - React 19 only blocks `javascript:`.
      A Content-Security-Policy is the second line.

      Because sessions are cookies, CSRF matters: state changes are never GETs, they need a session-bound
      token in a header, I reject `Sec-Fetch-Site: cross-site` on unsafe methods, and cookies are
      `SameSite=Lax; Secure; HttpOnly` as a layer. CORS is an exact allow-list of our dashboard origin with
      credentials and `Vary: Origin` - never a reflected origin, and never treated as access control.

      Around that: security headers (nosniff, CSP, frame-ancestors), lockfiles and `npm audit` in CI for the
      supply chain, a central error handler that never leaks, and security events logged with alerts. And I
      test like an attacker - IDOR, injection payloads, forged requests - always with the legitimate case
      alongside and checks that nothing was written.
    rubric:
      - Names the 2025 ordering or at least puts access control first, with a concrete server-side fix.
      - Parameterised queries plus an allow-list for identifiers.
      - Accurate about what React does and doesn't protect against.
      - Explains CSRF defences appropriate to cookie sessions, and SameSite's limits.
      - Describes CORS as relaxing the same-origin policy, not as protection.
      - Mentions headers, dependencies, logging and testing.
    followUps:
      - Why 404 instead of 403 for another merchant's order?
      - Would switching from cookies to bearer tokens in localStorage remove your CSRF work? What would it cost?
      - How would you roll out a strict CSP on an app with inline scripts and third-party widgets?
      - What does npm audit not catch?
    hints:
      - Lead with the category that is both most common and most in your control.
      - For each risk, name the concrete code-level defence and how you'd test it.
    solution: |
      Access control first (owner-scoped queries, deny by default), parameterised SQL, React-aware XSS rules
      plus CSP, token-based CSRF with Fetch Metadata and SameSite as layers, an allow-listed CORS policy, and
      the supporting practices - headers, dependencies, safe errors, logging - all proven with attacker tests.

placement:
  - id: place-top10-2025
    type: mcq
    concept: owasp-top-ten-2025
    skill: recall
    title: The 2025 edition
    prompt: Which statement about the OWASP Top 10:2025 is correct?
    options:
      - id: a01-ssrf
        text: Broken Access Control is A01, and Server-Side Request Forgery was rolled into it.
        feedback: Correct - SSRF, A10 in 2021, is now part of A01:2025.
      - id: injection-first
        text: Injection is A01 again because it has the most CVEs.
        feedback: Injection has the most CVEs but is A05:2025; Broken Access Control stays A01.
      - id: xss-own
        text: Cross-site scripting has its own category, separate from Injection.
        feedback: XSS (CWE-79) is part of A05:2025 Injection.
      - id: standard
        text: It is a verification standard - passing all ten items certifies an app as secure.
        feedback: OWASP calls it an awareness document; testable requirements are in the ASVS.
    correct: [a01-ssrf]
    solution: |
      A01:2025 Broken Access Control now includes SSRF (and lists CSRF among its CWEs); XSS sits in A05
      Injection; the Top 10 is for awareness, the ASVS for verification.

  - id: place-idor
    type: debug
    concept: access-control-idor
    skill: application
    title: Which line lets a user change someone else's data?
    prompt: |
      Any signed-in merchant can rename any other merchant's store. Click the line to fix.
    language: typescript
    code: |
      app.patch('/stores/:id', requireSession, requireCsrfToken, async (req, res) => {
        const name = StoreName.parse(req.body.name);
        const result = await db.query(
          'UPDATE stores SET name = $1 WHERE id = $2 RETURNING id, name',
          [name, Number(req.params.id)],
        );
        if (result.rowCount === 0) return void res.status(404).json({ error: 'not_found' });
        res.json(result.rows[0]);
      });
    correctLines: [4]
    lineNotes:
      - line: 1
        note: Authentication and CSRF checks are present - neither checks ownership.
      - line: 2
        note: The name is validated with a schema; the problem is which row is updated.
      - line: 5
        note: The values are parameters - this isn't injection.
    solution: |
      **Line 4** updates by id alone. Add `AND merchant_id = $3` with the session's merchant id; a foreign id
      then updates nothing and line 7 answers 404.

  - id: place-xss
    type: mcq
    concept: injection-and-output-encoding
    skill: application
    title: The link from user input
    prompt: |
      In React 19, a profile page renders `<a href={user.website}>Website</a>`. A user sets their website to
      `data:text/html,<script>alert(1)</script>`. What does React render, and what should you do?
    options:
      - id: unchanged-allowlist
        text: The data URL unchanged - validate the URL against an allow-list of schemes (https, http, mailto) before rendering.
        feedback: Correct - in this lesson's React 19.2.9 run only javascript URLs were replaced; data and protocol-relative URLs passed through.
      - id: blocked
        text: React blocks it, like javascript URLs - nothing to do.
        feedback: The run showed the data URL rendered unchanged. React 19 neutralises only javascript URLs.
      - id: escaped
        text: React HTML-escapes it, which makes it harmless.
        feedback: Escaping keeps the attribute well-formed; it doesn't change what URL the link opens.
      - id: csp-only
        text: Nothing in the component - the CSP will handle it.
        feedback: CSP is defence in depth and may not cover navigations; validate the input where it is used.
    correct: [unchanged-allowlist]
    solution: |
      React 19.2.9 rendered `data:` and `//host` URLs unchanged and replaced only `javascript:` URLs. Gate user
      URLs through an allow-list of schemes (ASVS 1.2.2) and render no link for anything else.

  - id: place-cors
    type: mcq
    concept: csrf-and-cors
    skill: application
    title: What CORS does
    prompt: |
      An API sends `Access-Control-Allow-Origin` only for its dashboard origin. A script on `evil.example`
      calls `fetch('https://api.sandpay.example/orders/101', { credentials: 'include' })` while the merchant is
      signed in. What happens?
    options:
      - id: server-answers
        text: The server processes the request and sends the data, but the browser doesn't let evil.example's script read it.
        feedback: Correct - CORS is enforced by the browser on the response; the request still reaches the server and is answered.
      - id: blocked-before
        text: The browser blocks the request before it is sent, so the server never sees it.
        feedback: A simple GET is sent; CORS decides whether the page may read the response. (Only preflighted requests can be stopped early.)
      - id: server-rejects
        text: The server rejects it with 403 because of CORS.
        feedback: CORS headers don't make the server reject anything - your own checks have to do that.
      - id: readable
        text: The script reads the data, because the cookie was valid.
        feedback: The cookie was sent, but without a matching Access-Control-Allow-Origin the browser withholds the response.
    correct: [server-answers]
    solution: |
      In this lesson's run, the fixed app still answered `evil.example`'s request with 200 and the order - only
      without CORS headers, so a browser would hide it from the script. CORS relaxes the same-origin policy for
      named origins; it is not access control or CSRF protection.

recall:
  - id: recall-2025-changes
    concept: owasp-top-ten-2025
    prompt: What are the main changes in the OWASP Top 10:2025 compared with 2021?
    answer: Broken Access Control stays A01 and absorbs SSRF; Security Misconfiguration rises to A02; Software Supply Chain Failures (A03) expands vulnerable components; Injection (with XSS) drops to A05; A10 Mishandling of Exceptional Conditions is new; A07 and A09 were renamed.
  - id: recall-idor
    concept: access-control-idor
    prompt: What is an IDOR and how do you prevent it?
    answer: Accessing another user's object by changing its identifier (CWE-639, BOLA in APIs). Check on the server, on every request, that this user may act on this object - scope the query by owner, deny by default, answer 404 for other tenants' objects, for reads and writes.
  - id: recall-parameters
    concept: injection-and-output-encoding
    prompt: What can a SQL parameter stand for, and how do you handle a user-chosen sort column?
    answer: Only a value - not a table, column or keyword such as ASC/DESC. Map the user's choice to an allow-list of fixed identifiers in code and reject anything else.
  - id: recall-react-xss
    concept: injection-and-output-encoding
    prompt: Which React 19 rendering patterns are safe from XSS, and which are not?
    answer: Text children and attribute values are encoded - safe. dangerouslySetInnerHTML inserts raw markup - unsafe with user content. javascript URLs are replaced by React 19, but data URLs and other-site links are not - allow-list URL schemes.
  - id: recall-csp
    concept: injection-and-output-encoding
    prompt: What is a strict CSP, and why isn't it enough on its own?
    answer: A nonce- or hash-based script-src (optionally with strict-dynamic) plus base-uri - injected scripts without the nonce don't run. It's defence in depth - browser support, legacy pages and other contexts mean output encoding is still the primary fix.
  - id: recall-csrf
    concept: csrf-and-cors
    prompt: What are the layers of CSRF defence for a cookie-session API?
    answer: No state changes on GET; a session-bound CSRF token in a header or form field, compared in constant time; reject Sec-Fetch-Site cross-site on unsafe methods (with an Origin fallback); SameSite cookies as an extra layer.
  - id: recall-samesite
    concept: csrf-and-cors
    prompt: Why isn't SameSite=Lax a complete CSRF defence?
    answer: It still sends the cookie on cross-site top-level GET navigations, it is scoped to the site rather than the origin (sibling subdomains are same-site), and browser defaults differ - Chromium treats a missing attribute as Lax, Firefox and Safari don't.
  - id: recall-cors
    concept: csrf-and-cors
    prompt: What does CORS do, and what is the dangerous misconfiguration?
    answer: It relaxes the same-origin policy so named origins may read responses. Reflecting any Origin with Access-Control-Allow-Credentials true lets every site read users' data; use an exact allow-list plus Vary Origin. CORS never stops the server from answering.

