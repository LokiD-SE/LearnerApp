id: modern-javascript-core
title: Modern JavaScript - scope, closures, modules and async
subject: fullstack
module: js-ts-node
level: beginner
status: published
estimatedMinutes: 65
summary: The ECMAScript features a full stack developer uses every day - block scope and the temporal dead zone, closures, how `this` is decided and why arrow functions differ, ES modules with live bindings and top-level await, equality, optional chaining and nullish coalescing, destructuring, spread and the copies it does not make, and async errors that escape try/catch.
tags:
  [
    javascript,
    ecmascript,
    let,
    const,
    closures,
    this,
    arrow functions,
    es modules,
    top-level await,
    equality,
    nullish coalescing,
    optional chaining,
    destructuring,
    spread,
    immutability,
    async errors,
  ]

environment: |
  - **Standard:** **ECMA-262**, the ECMAScript Language Specification - the living draft at
    [tc39.es/ecma262](https://tc39.es/ecma262/) ("ECMAScript 2027", read on 2026-11-14). Sections used:
    14.3.1 Let, Const, Using, and Await Using Declarations (the temporal dead zone note), 14.3.2 Variable
    Statement, 14.7.4.4 CreatePerIterationEnvironment (a fresh `let` binding per loop iteration), 9.4.4
    ResolveThisBinding, 10.2.1.2 OrdinaryCallBindThis, 15.3 Arrow Function Definitions, 11.2.2 Strict Mode
    Code, 16.2 Modules (16.2.2 Imports, 16.2.3 Exports), 7.2.9-7.2.10 SameValue and SameValueZero, 7.2.13
    IsLooselyEqual, 7.2.14 IsStrictlyEqual, 13.3.9 Optional Chains, 13.13 Binary Logical Operators (`??`),
    13.15.5 Destructuring Assignment, 20.1.2.6 `Object.freeze`, 20.1.2.15 `Object.is`, 23.1.3.16
    `Array.prototype.includes`, 23.1.3.30 `sort`, 23.1.3.34 `toSorted`, 27.5.4.2 `Promise.allSettled`, 27.10.5.3
    Await. Section numbers move between editions; search the spec by name if a number does not match.
  - **Reference:** MDN JavaScript reference -
    [let](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/let) (temporal dead zone),
    [Closures](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Closures),
    [this](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/this),
    [Arrow functions](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Functions/Arrow_functions),
    [JavaScript modules](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Modules),
    [Equality comparisons and sameness](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Equality_comparisons_and_sameness),
    [Nullish coalescing](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Nullish_coalescing),
    [Optional chaining](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Optional_chaining),
    [Spread syntax](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Spread_syntax),
    [structuredClone](https://developer.mozilla.org/en-US/docs/Web/API/Window/structuredClone).
    `structuredClone` is not part of ECMA-262: the WHATWG HTML Standard defines it, and browsers and Node.js
    (17 and later) provide it.
  - **Every output in this lesson was really run** with **Node.js 24.21** as ES module files (`node file.mjs`),
    so module code is strict mode. Error messages are V8's wording; other engines word them differently but
    throw the same error types.
  - **Assumes** you have read [JavaScript and TypeScript for testers](#/lesson/js-ts-async-and-types) for
    promises and `async`/`await`, and [The DOM, events and the event loop](#/lesson/dom-events-event-loop) for
    when callbacks run. This lesson does not repeat them.
  - **Fictional:** the SandPay merchant dashboard, its orders and ids. Amounts are in minor units (cents);
    there is no card data.
  - **Practice project:** `practice/fullstack` (Node.js 24, Vitest). The exercises are plain JavaScript with
    JSDoc types, checked by TypeScript (`checkJs`).

prerequisites: [js-ts-async-and-types, dom-events-event-loop]

concepts:
  - id: js-block-scope-closures
    name: Block scope, the TDZ and closures
    summary: let and const are scoped to their block and can't be touched before their declaration runs (the temporal dead zone); a function keeps access to the variables of the scope it was created in - a closure - which gives private state and explains the classic var-in-a-loop bug.
  - id: js-this-and-arrows
    name: How `this` is decided, and arrow functions
    summary: For an ordinary function, `this` is decided by how it is called - `obj.method()` gives obj, a plain call gives undefined in strict code; an arrow function has no `this` of its own and uses the one of the code around it, which is why it fixes detached callbacks.
  - id: js-modules-and-async-errors
    name: ES modules and async errors
    summary: ES modules are strict, export live read-only bindings and may use top-level await; inside async code an error is a rejected promise, so it is only caught where the promise is awaited.
  - id: js-values-equality-copies
    name: Equality, nullish values and copies
    summary: Use === (and Object.is for NaN and -0), ?? and ?. for missing values without swallowing 0 or '', and remember that spread, destructuring and Object.freeze are shallow - nested objects are still shared.

objectives:
  - Predict what code does when a variable is used before its `let`/`const` declaration, and explain the difference from `var`.
  - Write a function that keeps private state in a closure, and explain why callbacks created in a `var` loop all see the last value.
  - Explain how `this` is decided for a method call, a detached function, `call`/`bind` and an arrow function, and fix a callback that loses its `this`.
  - Explain what a live binding is, why an import can't be assigned, and what top-level await does to the modules that import yours.
  - Find an async error that escapes `try`/`catch` because the promise was returned or not awaited.
  - Choose between `===`, `==` and `Object.is`, and between `??` and `||`, and update nested state without mutating it.

sections:
  - id: intuition
    kind: intuition
    concepts: [js-block-scope-closures, js-this-and-arrows]
    title: The idea in plain language
    body: |
      Think of every block of code - a function body, an `if`, a loop - as a **room**. A variable declared
      with `let` or `const` lives in the room where it was declared. Code inside can see out of the room into
      the corridor (outer scopes), but nobody outside can see in. When a function is created, it **remembers
      the room it was built in** and keeps the door open even after the code that created it has finished.
      That memory is a **closure** - it's how a payment-attempt counter can keep its count private.

      `this` is different: it isn't about the room at all. It's **who is holding the function when it is
      called**. `board.show()` is board holding it; `const show = board.show; show()` is nobody holding it.
      An **arrow function** refuses to have its own `this` - it borrows the `this` of the room it was written
      in. That one difference explains most "`this` is undefined" bugs in callbacks.

  - id: what
    kind: what
    concepts:
      [js-block-scope-closures, js-this-and-arrows, js-modules-and-async-errors, js-values-equality-copies]
    title: The terms, precisely
    body: |
      | Term | Meaning (ECMA-262 unless stated) |
      |---|---|
      | **Block scope** | `let`, `const` and `class` bindings belong to the nearest `{ }` block (14.2, 14.3.1); `var` belongs to the whole function (14.3.2) |
      | **Hoisting** | declarations are created when their scope is entered, before any line runs. A `var` starts as `undefined`; a `let`/`const` exists but is **uninitialised** |
      | **Temporal dead zone (TDZ)** | the time between entering the scope and the `let`/`const` line running; any access throws a `ReferenceError` (14.3.1 "may not be accessed in any way until the variable's LexicalBinding is evaluated") |
      | **Closure** | a function plus the environment it was created in; the function can read and change those variables later (MDN Closures) |
      | **`this` binding** | for an ordinary function, the value supplied by the **call** (10.2.1.2 OrdinaryCallBindThis); in strict code a plain call supplies `undefined` |
      | **Arrow function** | a function with **no own** `this`, `arguments` or `super`; it resolves `this` lexically, from the surrounding code (15.3) |
      | **ES module** | a file loaded with `import`/`export`. Module code is **always strict** (11.2.2) |
      | **Live binding** | an imported name is a read-only **view** of the exporting module's variable - it changes when the exporter changes it (16.2.2) |
      | **Top-level await** | `await` at the top of a module; modules that import it wait until it settles (27.10.5.3 Await, 16.2.1) |
      | **Strict equality `===`** | IsStrictlyEqual (7.2.14): same type and value, no conversion; `NaN !== NaN`, `0 === -0` |
      | **Loose equality `==`** | IsLooselyEqual (7.2.13): converts types first - `'1' == 1`, `0 == ''`, `null == undefined` |
      | **`Object.is`** | SameValue (7.2.9): like `===` except `Object.is(NaN, NaN)` is true and `Object.is(0, -0)` is false |
      | **Nullish** | `null` or `undefined`. `a ?? b` gives `b` only when `a` is nullish (13.13); `a?.b` gives `undefined` instead of throwing when `a` is nullish (13.3.9) |
      | **Shallow copy** | a new outer object or array whose nested objects are the **same** objects as the original's - what spread (`{ ...o }`, `[...a]`) makes |

  - id: why
    kind: why
    concepts: [js-block-scope-closures, js-values-equality-copies]
    title: Why a full stack developer needs these exactly right
    body: |
      These are not trivia. Each one is a daily source of real bugs in a web application:

      - **React compares state by reference.** If you change an order object in place instead of returning a new
        one, `oldOrder === newOrder` stays true and the screen does not update - see
        [State, effects and rendering in React](#/lesson/react-state-and-effects). Shallow copies that still
        share a nested `history` array cause the same bug one level down.
      - **`||` swallows real values.** `amountMinor || 100` turns a free (`0`) order into 100 cents.
        `note || 'none'` hides an empty note the merchant cleared on purpose. `??` exists for exactly this.
      - **Detached methods lose `this`.** Passing `this.handle` to an event source, a timer or a library is a
        crash the first time the callback fires - often only in production, when the event finally happens.
      - **Async errors escape.** `return capture()` inside `try` in an async function does not catch a declined
        capture; the caller gets the rejection. In Node.js an unhandled rejection stops the process.
      - **Modules run once and share state.** Every file that imports a module sees the **same** variables,
        live. That's how a config or a database pool is shared - and why a test that changes module state
        affects the next test.

  - id: internals-scope
    kind: internals
    concepts: [js-block-scope-closures]
    title: "How scope works underneath: environment records"
    body: |
      ECMA-262 describes scope with **Environment Records** - one per function call, block, module and the
      global scope - each pointing to its **outer** record. Looking a name up walks outwards along that chain.

      1. **Entering a scope creates its bindings first.** For a block, BlockDeclarationInstantiation (14.2.3)
         creates every `let`/`const`/`class` binding as **uninitialised**. For a function, `var` bindings are
         created and set to `undefined`. This is "hoisting" - nothing moves, the bindings just exist early.
      2. **The `let` line initialises the binding.** Until then, reading or writing it throws a
         `ReferenceError` - the temporal dead zone. `typeof` doesn't escape it either.
      3. **A function value stores its scope.** When a function is created it records the current Environment
         Record. When it is called later, its own record's **outer** is that stored one - not the caller's.
         That is a closure: the variables stay alive as long as some function can still reach them.
      4. **`for (let ...)` gets a fresh binding per iteration.** CreatePerIterationEnvironment (14.7.4.4) copies
         the loop variable into a new record for each iteration, so each callback created in the body closes
         over its own `j`. A `var` loop has **one** `i` for the whole function, so every callback sees its
         final value.

      Run in Node.js 24.21:

      ```javascript
      console.log(typeof legacy, legacy);
      var legacy = 1;
      try {
        console.log(total);
      } catch (error) {
        console.log(`${error.name}: ${error.message}`);
      }
      let total = 5;
      console.log(total);
      ```

      ```plaintext
      undefined undefined
      ReferenceError: Cannot access 'total' before initialization
      5
      ```

      ```javascript
      const withVar = [];
      for (var i = 0; i < 3; i++) withVar.push(() => i);
      const withLet = [];
      for (let j = 0; j < 3; j++) withLet.push(() => j);
      console.log(withVar.map((read) => read()));
      console.log(withLet.map((read) => read()));
      ```

      ```plaintext
      [ 3, 3, 3 ]
      [ 0, 1, 2 ]
      ```

  - id: visual-this
    kind: visual
    concepts: [js-this-and-arrows]
    title: "Diagram: what is `this` inside this function?"
    body: |
      Ask the questions in this order. Notice that for an ordinary function the answer depends only on the
      **call site**, never on where the function was written - and that an arrow function skips every
      call-site question.

      ```mermaid
      flowchart TD
          A[Function is called] --> B{Arrow function?}
          B -->|yes| C["this of the surrounding code, fixed when the arrow was created"]
          B -->|no| D{"Called with new?"}
          D -->|yes| E[the new object]
          D -->|no| F{"Bound with bind, or called with call or apply?"}
          F -->|yes| G[the value given]
          F -->|no| H{"Called as obj.method()?"}
          H -->|yes| I[obj]
          H -->|no| J["undefined in strict code - modules and classes"]
      ```

  - id: internals-this
    kind: internals
    concepts: [js-this-and-arrows]
    title: "`this` in the specification"
    body: |
      - A call `obj.show()` evaluates `obj.show` as a **property reference**, and the call passes `obj` as the
        `thisArg`. Copy the function into a variable first (`const show = obj.show`) and the reference is just
        a variable - the call passes `undefined`.
      - **OrdinaryCallBindThis** (10.2.1.2) binds that value as the function's `this`. In **strict** code it is
        used as is, so `this` is `undefined`. In sloppy (non-strict) scripts `undefined` is replaced by the
        global object - which is how old code "worked" by accident. Modules and `class` bodies are always
        strict (11.2.2).
      - An **arrow function** has `[[ThisMode]]` *lexical*: no `this` is bound when it is called, so
        ResolveThisBinding (9.4.4) finds the `this` of the surrounding function. `call`, `apply` and `bind`
        can't change it.
      - `fn.bind(obj)` (20.2.3.2) returns a new function whose `this` is fixed to `obj`.

      Run in Node.js 24.21 (a module, so strict):

      ```javascript
      const board = {
        name: 'orders board',
        show() {
          return this?.name;
        },
        later() {
          return ['ord_1'].map((id) => `${id} on ${this.name}`);
        },
        arrowShow: () => typeof this,
      };
      const show = board.show;
      console.log(board.show());
      console.log(show());
      console.log(board.later());
      console.log(board.arrowShow());
      console.log(show.call({ name: 'refunds board' }));
      console.log(show.bind(board)());
      ```

      ```plaintext
      orders board
      undefined
      [ 'ord_1 on orders board' ]
      undefined
      refunds board
      orders board
      ```

      `board.arrowShow()` is `undefined` because an arrow defined in an object literal takes `this` from the
      code **around the literal** - here the module's top level, where `this` is `undefined`. Methods that need
      `this` must be ordinary methods; callbacks **inside** them should be arrows (`later`).

  - id: code-modules
    kind: code
    concepts: [js-modules-and-async-errors]
    title: "ES modules: live bindings and top-level await"
    body: |
      ```javascript
      // counter.mjs
      export let count = 0;
      export function increment() {
        count += 1;
      }
      ```

      ```javascript
      // main.mjs
      import { count, increment } from './counter.mjs';
      console.log(count);
      increment();
      console.log(count);
      try {
        count = 10;
      } catch (error) {
        console.log(`${error.name}: ${error.message}`);
      }
      const config = await Promise.resolve({ currency: 'EUR' });
      console.log(config.currency);
      ```

      `node main.mjs` with Node.js 24.21:

      ```plaintext
      0
      1
      TypeError: Assignment to constant variable.
      EUR
      ```

      - `count` printed `1` after `increment()` - an import is a **live view** of the exporter's variable, not a
        copy taken at import time.
      - Assigning to an import throws: imported bindings are **immutable** for the importer. Only the exporting
        module can change them, through its own functions.
      - `await` at the top level is allowed **only in modules**. A module that imports `main.mjs` doesn't start
        running until this `await` has settled - so a slow top-level `await` (fetching config, connecting to a
        database) delays every module that depends on it.
      - Each module is evaluated **once** per module graph, however many files import it. Its top-level
        variables are effectively singletons.

  - id: code-async-errors
    kind: code
    concepts: [js-modules-and-async-errors]
    title: Async errors are rejections - catch them where you await
    body: |
      Inside an `async` function a thrown error becomes a **rejected promise**. `try`/`catch` only sees it at an
      `await`. Run in Node.js 24.21:

      ```javascript
      async function capture() {
        throw new Error('card declined');
      }
      async function payForgot() {
        try {
          return capture(); // returns the promise - the try block ends before it rejects
        } catch {
          return 'handled';
        }
      }
      async function payFixed() {
        try {
          return await capture(); // waits here, so the rejection is thrown inside try
        } catch {
          return 'handled';
        }
      }
      try {
        console.log(await payForgot());
      } catch (error) {
        console.log(`payForgot rejected: ${error.message}`);
      }
      console.log(await payFixed());
      const results = await Promise.allSettled([capture(), Promise.resolve('ord_2 paid')]);
      console.log(results.map((r) => r.status));
      ```

      ```plaintext
      payForgot rejected: card declined
      handled
      [ 'rejected', 'fulfilled' ]
      ```

      And a promise nobody handles - `capture();` with no `await` and no `.catch` - **ends the process** in
      Node.js 24: it prints the error and exits with code 1, and a timer queued after it never fires. (Node.js
      made `--unhandled-rejections=throw` the default in version 15.) Browsers only log an "Uncaught (in
      promise)" error. Either way the payment failure was lost.

  - id: code-values
    kind: code
    concepts: [js-values-equality-copies]
    title: Equality, missing values, destructuring and copies
    collapsed: true
    body: |
      All run in Node.js 24.21.

      ```javascript
      console.log(0 == '', '1' == 1, null == undefined, null == 0);
      console.log(null === undefined, NaN === NaN, 0 === -0);
      console.log(Object.is(NaN, NaN), Object.is(0, -0));
      console.log([1, 2].includes(NaN), [NaN].includes(NaN), [NaN].indexOf(NaN));
      console.log({ id: 'ord_1' } === { id: 'ord_1' });
      ```

      ```plaintext
      true true true false
      false false true
      true false
      false true -1
      false
      ```

      `includes` uses SameValueZero (finds `NaN`); `indexOf` uses `===` (never finds it). Two object literals are
      never `===`: objects compare by **identity**, not by content.

      ```javascript
      const order = { id: 'ord_1', amountMinor: 0, note: '', customer: null };
      console.log(order.amountMinor || 100, order.amountMinor ?? 100);
      console.log(order.note || 'none', order.note ?? 'none');
      console.log(order.customer?.name, order.customer?.name ?? 'Guest');
      const { id, currency = 'EUR', ...rest } = order;
      console.log(id, currency, rest);
      const [first, , third = 'none'] = ['PENDING', 'PAID'];
      console.log(first, third);
      ```

      ```plaintext
      100 0
      none
      undefined Guest
      ord_1 EUR { amountMinor: 0, note: '', customer: null }
      PENDING none
      ```

      (The second line is `none` followed by the empty string.) Without `?.`, `order.customer.name` throws
      `TypeError: Cannot read properties of null (reading 'name')`. A destructuring default (`currency = 'EUR'`)
      applies only when the value is `undefined` - not `null`.

      ```javascript
      const order = { id: 'ord_1', items: [{ sku: 'TEE', qty: 1 }] };
      const copy = { ...order, id: 'ord_2' };
      copy.items.push({ sku: 'MUG', qty: 2 });
      console.log(order.items.length, copy.items === order.items);
      const deep = structuredClone(order);
      deep.items.push({ sku: 'CAP', qty: 1 });
      console.log(order.items.length, deep.items.length);
      const amounts = [1000, 250, 99];
      console.log(amounts.toSorted(), amounts.toSorted((a, b) => a - b), amounts);
      const frozen = Object.freeze({ status: 'PAID', history: ['PENDING'] });
      frozen.history.push('PAID');
      console.log(frozen.history);
      ```

      ```plaintext
      2 true
      2 3
      [ 1000, 250, 99 ] [ 99, 250, 1000 ] [ 1000, 250, 99 ]
      [ 'PENDING', 'PAID' ]
      ```

      - The spread copy **shares** `items` with the original - pushing to it changed the original order.
      - `structuredClone` copies deeply (it can't clone functions or class instances' methods).
      - `toSorted` returns a new array and leaves `amounts` alone; `sort` sorts **in place**. Without a
        comparator both sort **as strings** - `1000` comes before `250`.
      - `Object.freeze` is shallow: `frozen.status = 'REFUNDED'` throws in strict code (`TypeError: Cannot
        assign to read only property 'status'`), but the nested array can still be pushed to.

  - id: line-by-line
    kind: line-by-line
    concepts: [js-values-equality-copies]
    title: "Line by line: an update that never mutates"
    body: |
      The practice exercise asks for this shape - the one React state, Redux reducers and most API code expect:

      ```javascript
      export function withStatus(order, status, at) {
        return { ...order, status, history: [...order.history, { at, status }] };
      }
      ```

      - `{ ...order, ... }` - a **new** outer object, so `updated !== order` and React sees a change.
      - `status` after the spread - later properties win, so this overrides the old status.
      - `history: [...order.history, ...]` - the spread above copied the **reference** to the old array; this
        makes a new array. Without it, a `push` would change the original order's history too.
      - `{ at, status }` - shorthand for `{ at: at, status: status }`. The old entries are reused unchanged -
        that's fine, because nobody mutates them.
      - No `structuredClone`: copying only the path you change is cheaper and keeps unchanged parts `===`, which
        lets React skip re-rendering them.

  - id: when
    kind: when
    concepts: [js-this-and-arrows, js-values-equality-copies, js-block-scope-closures]
    title: Which one to use, and when
    body: |
      | Choice | Use | Don't |
      |---|---|---|
      | `const` / `let` / `var` | `const` by default, `let` when you reassign | `var` in new code - function scope and no TDZ hide bugs |
      | Method vs arrow | an ordinary method when it uses `this` of its object; an **arrow** for callbacks inside it | an arrow as an object-literal method that needs `this` |
      | `bind` vs arrow wrapper | either fixes a detached method; the arrow (`(u) => this.handle(u)`) is easier to read | binding inside `render` on every call when identity matters (it makes a new function each time) |
      | `===` / `==` / `Object.is` | `===` everywhere; `Object.is` when `NaN` or `-0` matter; `x == null` is a common, deliberate idiom for "null or undefined" | `==` with mixed types |
      | `??` / `\|\|` | `??` for defaults when `0`, `''` or `false` are real values | `\|\|` for numbers, strings or booleans that may legitimately be falsy |
      | Spread vs `structuredClone` | spread along the path you change (cheap, keeps sharing) | assuming spread or `Object.freeze` protects nested data |
      | Closure vs class field | a closure when state must be truly private and the API is small; `#private` class fields are the class equivalent | exposing a mutable `counts` object "for convenience" |

      Closures are not a memory leak by themselves, but a long-lived callback (an event listener, a cache) keeps
      everything it closes over alive. Remove listeners you no longer need.

  - id: tests
    kind: tests
    concepts: [js-values-equality-copies, js-this-and-arrows]
    title: Tests that catch these bugs
    body: |
      | # | Case | Expected result | Evidence |
      |---|---|---|---|
      | 1 | Update an order's status | new status and one more history entry | `toEqual` on the result |
      | 2 | Same update, check identity | result `!==` input, `result.history !==` input history | `not.toBe` |
      | 3 | Update a **frozen** order (`Object.freeze`, nested array frozen too) | no throw, input unchanged | input `toEqual` a fresh copy afterwards |
      | 4 | Customer `null`, `undefined`, `{}` | label `Guest` | three assertions |
      | 5 | Customer name `''` | label `''` - kept | catches `\|\|` used instead of `??` |
      | 6 | Amount `0` | shown as 0, not a default | catches `\|\|` on numbers |
      | 7 | A feed calls the handler as a **plain function** | status stored, no `TypeError` | a fake feed that calls `listener(update)` without a receiver |
      | 8 | Two trackers | counts not shared | record in one, read the other |
      | 9 | Async failure | caller sees the rejection or the handled value - decide which and assert it | `await expect(p).rejects.toThrow('card declined')` |

      Case 3 is the cheapest way to prove "doesn't mutate": a frozen object throws on any write in strict code,
      so a mutating implementation fails loudly. Case 7 is why the practice test's fake feed copies the listener
      into a variable before calling it - exactly what real event emitters do.

  - id: mistakes
    kind: mistakes
    concepts:
      [js-block-scope-closures, js-this-and-arrows, js-modules-and-async-errors, js-values-equality-copies]
    title: Common mistakes and how to debug them
    body: |
      | Symptom | Likely cause | Confirm it |
      |---|---|---|
      | `ReferenceError: Cannot access 'x' before initialization` | used a `let`/`const` in its TDZ - often a function called before the line that declares what it uses | read the stack trace's line; move the declaration up |
      | Every callback sees the last loop value | `var` loop variable shared by all closures | change `var` to `let`; log inside the callback |
      | `TypeError: Cannot read properties of undefined (reading 'x')` inside a method | the method was passed as a callback and lost `this` | `console.log(this)` at the top of the method; look at how it was passed |
      | `TypeError: Assignment to constant variable.` on an imported name | assigning to an import | export a setter function from the module instead |
      | The UI doesn't update after a change | the object was mutated, so its reference didn't change | `Object.freeze` the state in a test - the mutation then throws |
      | A default replaces a real `0` or `''` | `\|\|` instead of `??` | test with `0` and `''` explicitly |
      | `try`/`catch` "doesn't catch" an async error | the promise was returned or started without `await` | add `await`; check for `.then` without `.catch`; Node.js prints the unhandled rejection's stack |
      | A test passes alone but fails after another | module state shared between tests | look for top-level `let` in imported modules; reset it or create state per test |

      **Method:** reproduce with the smallest file you can run with `node file.mjs`, print the value you are
      unsure about (`this`, the reference, the binding), and only then change code.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [js-modules-and-async-errors, js-values-equality-copies]
    title: Trade-offs and limits
    body: |
      - **Immutability costs allocations.** Copying on every update is cheap for UI state, but in a hot loop over
        thousands of rows a local, mutable array that nobody else sees is fine. The rule is "don't mutate what
        you **share**".
      - **Top-level await is convenient but blocking for importers.** Use it at the application's entry point,
        not inside a library everybody imports.
      - **ES modules vs CommonJS.** Node.js still runs CommonJS (`require`), whose exports are a **copied object**,
        not live bindings, and which can't use top-level `await`. You meet both in real projects; the
        [Node.js lesson](#/lesson/node-runtime-and-npm) covers how Node decides which a file is.
      - **`Object.freeze` is a test tool more than a production one.** It is shallow, and freezing everything
        deeply costs time. TypeScript's `readonly` (next lesson) catches most mutations at compile time instead.

  - id: summary
    kind: summary
    concepts:
      [js-block-scope-closures, js-this-and-arrows, js-modules-and-async-errors, js-values-equality-copies]
    title: Quick reference
    body: |
      - `const` by default, `let` to reassign, no `var`. `let`/`const` can't be touched before their line - the TDZ.
      - A closure is a function plus the scope it was created in: private state, and the `var`-loop bug.
      - `this` = how the function is **called**. Detached → `undefined` (strict). Arrow → `this` of the code around it.
      - Modules: strict, evaluated once, imports are live and read-only, top-level `await` delays importers.
      - Async errors are rejections - `return await` inside `try`, never leave a promise unhandled.
      - `===` always; `Object.is` for `NaN`/`-0`; `??` and `?.` for missing values.
      - Spread, destructuring and `Object.freeze` are **shallow**. Copy the path you change.

exercises:
  - id: loop-closure-mcq
    type: mcq
    concept: js-block-scope-closures
    skill: application
    title: Retry buttons that all retry the same order
    prompt: |
      The dashboard builds a Retry button for each failed order:

      ```javascript
      var failed = ['ord_7', 'ord_8', 'ord_9'];
      var handlers = [];
      for (var i = 0; i < failed.length; i++) {
        handlers.push(() => retry(failed[i]));
      }
      handlers[0]();
      ```

      What does `handlers[0]()` call?
    options:
      - id: retry-undefined
        text: "`retry(undefined)` - all three handlers read `failed[3]`"
        feedback: Correct. There is one `i` for the whole function; after the loop it is 3, and every arrow reads that same `i` when it runs.
      - id: retry-first
        text: "`retry('ord_7')` - each arrow captured `i` when it was created"
        feedback: That is what happens with `let i` - a fresh binding per iteration. Closures capture the variable, not its value at creation time, and `var` gives only one variable.
      - id: retry-last
        text: "`retry('ord_9')` - the last order"
        feedback: Close, but the loop stops when `i` is 3, not 2. `failed[3]` is past the end of the array.
      - id: throws-tdz
        text: It throws a ReferenceError, because `i` is in the temporal dead zone
        feedback: The TDZ applies to let and const. A var is initialised to undefined when the function starts, and here it has already been assigned.
    correct: [retry-undefined]
    hints:
      - Does a closure remember a value, or a variable?
      - How many `i` variables does a `var` loop create?
    solution: |
      **`retry(undefined)`.** Closures capture **variables**. A `var` loop has a single function-scoped `i`;
      when a handler runs later, the loop has finished and `i` is `3`. Change `var i` to `let i` and each
      iteration gets its own binding (ECMA-262 CreatePerIterationEnvironment), so `handlers[0]()` calls
      `retry('ord_7')`. Confirm it the same way as in the lesson: push `() => i` and print the results.
    followUp: |
      Without changing `var` to `let`, how would you fix it? (Hint: `failed.map((orderId) => () =>
      retry(orderId))` - why does that work?)

  - id: status-board-coding
    type: coding
    concept: js-this-and-arrows
    skill: analysis
    title: A private attempt counter and a board that loses `this`
    prompt: |
      In `exercises/js/status-board.js`:

      1. Implement `createAttemptTracker(limit)` - per-order failure counts that **nothing outside** can read
         or change, and that two trackers never share.
      2. `StatusBoard` crashes on the first update from its feed. Run the test, read the error, explain
         **why** `this` is `undefined`, and fix it while keeping `handle` as the method that stores updates.
    project: fullstack
    files:
      - exercises/js/status-board.js
    test: tests/js/status-board.test.ts
    command: npx vitest run tests/js/status-board.test.ts
    hints:
      - Where can the counts live so that only the returned functions can reach them?
      - "A `Map` created inside `createAttemptTracker` is new for every call - so trackers don't share it."
      - How does the feed call the listener - as `something.listener(update)` or as `listener(update)`?
      - "Wrap it: `this.feed.subscribe((update) => this.handle(update))` - why does the arrow see the board's `this`?"
    modelAnswer: |
      ```javascript
      export function createAttemptTracker(limit) {
        const failures = new Map();
        const remaining = (orderId) => Math.max(0, limit - (failures.get(orderId) ?? 0));
        return {
          recordFailure(orderId) {
            failures.set(orderId, (failures.get(orderId) ?? 0) + 1);
            return remaining(orderId);
          },
          remaining,
        };
      }

      // in StatusBoard
      start() {
        this.feed.subscribe((update) => this.handle(update));
      }
      ```

      `failures` lives in the call's scope; the two returned functions close over it, and nothing else can
      reach it - `JSON.stringify(tracker)` is `{}`. In the original `start`, `this.handle` is read as a plain
      function value; the feed later calls `listener(update)` with no receiver, and because module and class
      code is strict, `this` is `undefined`, so `this.latest` throws. The arrow has no `this` of its own and
      uses `start`'s `this` - the board. `this.handle.bind(this)` also works.
    rubric:
      - Every test in tests/js/status-board.test.ts passes
      - The counts live in a closure (a local Map or object), not on the returned object or in module scope
      - "`?? 0` (not `|| 0`) or an explicit check is used for a missing count"
      - Explained that the feed calls the method without a receiver, so in strict code `this` is undefined
      - Kept `handle` as the method that stores updates (wrapped with an arrow or bind)
    solution: |
      Keep the counts in a `Map` local to `createAttemptTracker` and return functions that use it. Fix
      `start` with `this.feed.subscribe((update) => this.handle(update))`. The reference solution is
      `solutions/js/status-board.js`.
    followUp: |
      Rewrite `StatusBoard` with a class field `handle = (update) => { ... }` instead. What does that change
      for `vi.spyOn(board, 'handle')`, and for memory when there are thousands of boards?

  - id: detached-this-mcq
    type: mcq
    concept: js-this-and-arrows
    skill: application
    title: The timer that prints undefined
    prompt: |
      In an ES module:

      ```javascript
      class Countdown {
        constructor(orderId) {
          this.orderId = orderId;
        }
        tick() {
          console.log(`expires: ${this.orderId}`);
        }
        start() {
          setTimeout(this.tick, 1000);
        }
      }
      new Countdown('ord_42').start();
      ```

      What happens after one second in Node.js?
    options:
      - id: prints-undefined
        text: "It prints `expires: undefined` - Node.js calls the callback with its own Timeout object as `this`"
        feedback: Correct (run in Node.js 24.21). setTimeout received tick without its object, so this is whatever the timer passes - in Node.js the Timeout object, which has no orderId.
      - id: prints-id
        text: "It prints `expires: ord_42`, because `tick` is defined in the class"
        feedback: Where a method is written doesn't decide this - the call does. Only arrow functions take this from where they are written.
      - id: throws
        text: It throws a TypeError, because `this` is undefined in strict class code
        feedback: That is what happens when a detached method is called as a plain function (the practice feed does that). Node.js's setTimeout supplies its Timeout object as this instead, so there is no throw - just a silently wrong value, which is worse.
      - id: global-object
        text: "It prints `expires: undefined`, because sloppy mode makes `this` the global object"
        feedback: Class bodies are always strict, so there's no sloppy-mode substitution. The output matches, but the reason is the Timeout object Node.js passes.
    correct: [prints-undefined]
    hints:
      - What does `setTimeout` receive - the method bound to the Countdown, or just the function?
      - The host (Node.js) decides what `this` a timer callback gets. Is it ever the Countdown?
    solution: |
      **`expires: undefined`**, as run in Node.js 24.21. `setTimeout(this.tick, 1000)` passes the function
      without its object, so `this` inside `tick` is whatever the **host** calls it with - Node.js uses its
      `Timeout` object, which has no `orderId`. Other hosts and other callback APIs pass something else (a plain
      call in strict code gives `undefined`, which throws instead). What never happens is getting the Countdown
      back. Fix: `setTimeout(() => this.tick(), 1000)` or `setTimeout(this.tick.bind(this), 1000)`.
    followUp: |
      Which of these also fixes it, and why: declaring `tick = () => { ... }` as a class field instead of a
      method?

  - id: live-binding-mcq
    type: mcq
    concept: js-modules-and-async-errors
    skill: application
    title: What does the importer see?
    prompt: |
      ```javascript
      // session.mjs
      export let currentMerchant = null;
      export function signIn(id) {
        currentMerchant = id;
      }
      ```

      ```javascript
      // app.mjs
      import { currentMerchant, signIn } from './session.mjs';
      signIn('m_100');
      console.log(currentMerchant);
      ```

      What does `node app.mjs` print?
    options:
      - id: m100
        text: m_100
        feedback: Correct. An import is a live binding - a read-only view of session.mjs's variable - so it reflects the assignment signIn made.
      - id: null-copy
        text: null - the import copied the value when the module was loaded
        feedback: That's how CommonJS `require` of a primitive behaves (you get a copy in an object). ES module imports are live bindings.
      - id: type-error
        text: It throws TypeError, because currentMerchant was assigned
        feedback: Only the importer can't assign it. The exporting module may change its own variable; the importer then sees the new value.
      - id: reference-error
        text: It throws ReferenceError, because currentMerchant is in the temporal dead zone
        feedback: The exported let was initialised (to null) when session.mjs ran, which happens before app.mjs's body runs.
    correct: [m100]
    hints:
      - Is an import a copy or a view?
      - Who is allowed to assign `currentMerchant`?
    solution: |
      **`m_100`.** ES module imports are **live bindings** (ECMA-262 16.2.2): the importer reads the exporter's
      variable itself. The exporter can assign it; the importer can only read it - `currentMerchant = 'x'` in
      app.mjs would throw `TypeError: Assignment to constant variable.` (as run in this lesson).
    followUp: |
      Two test files import `session.mjs` and the second one fails only when run after the first. Why, and
      how would you fix it?

  - id: return-await-debug
    type: debug
    concept: js-modules-and-async-errors
    skill: analysis
    title: The decline that escapes the error handler
    prompt: |
      `refundOrder` should turn a provider failure into `{ ok: false }`. In production, a failed refund
      instead crashes the Node.js process with an unhandled rejection. Click the line that causes it.
    language: javascript
    code: |
      export async function refundOrder(provider, orderId, amountMinor) {
        if (amountMinor <= 0) {
          return { ok: false, reason: 'amount must be positive' };
        }
        try {
          return provider.refund(orderId, amountMinor);
        } catch (error) {
          log.warn('refund failed', { orderId, message: error.message });
          return { ok: false, reason: error.message };
        }
      }
    correctLines: [6]
    lineNotes:
      - line: 7
        note: The catch is written correctly - it just never runs, because nothing inside try throws. The promise rejects after try has finished.
      - line: 2
        note: The validation path returns normally. The crash happens only when the provider fails.
    hints:
      - What does `provider.refund` return?
      - When does that promise reject - inside the try block, or after it?
    solution: |
      **Line 6.** `provider.refund` returns a promise. `return promise` inside `try` ends the try block at once;
      the promise rejects later, outside it, so the `catch` never runs and `refundOrder`'s own promise rejects
      with the provider error. A caller that doesn't handle it gets an unhandled rejection, which ends a Node.js
      24 process. Fix: `return await provider.refund(orderId, amountMinor);`. Confirm with a fake provider whose
      `refund` rejects: before the fix `await refundOrder(...)` rejects; after it, it resolves to
      `{ ok: false, ... }`.
    followUp: |
      Would `const result = await provider.refund(...); return result;` behave the same as `return await`? And
      `provider.refund(...).catch(...)` without `await`?

  - id: values-mcq
    type: mcq
    concept: js-values-equality-copies
    skill: application
    title: The free order that cost one euro
    prompt: |
      A dashboard shows `order.amountMinor || 100` cents as a "fallback" when the amount hasn't loaded. A
      tester reports that a 100%-discount order (amount `0`) shows €1.00. Which change fixes it without
      breaking the loading case (`amountMinor` is `undefined`)?
    options:
      - id: nullish
        text: "`order.amountMinor ?? 100`"
        feedback: Correct. ?? replaces only null or undefined, so 0 stays 0 and the not-yet-loaded case still gets the fallback.
      - id: strict-check
        text: "`order.amountMinor === 0 ? 0 : order.amountMinor || 100`"
        feedback: It works for 0, but it's a special case bolted on - and the same bug returns for any other falsy value you forget. ?? states the real intent.
      - id: optional
        text: "`order?.amountMinor || 100`"
        feedback: "?. protects against order being null; it doesn't change what || does with 0."
      - id: loose
        text: "`order.amountMinor == null ? 100 : 0`"
        feedback: This returns 0 for every loaded amount - a real 2599 becomes 0. The idea (== null for nullish) is right; the result is wrong.
    correct: [nullish]
    hints:
      - Which values does `||` treat as "missing"?
      - Is there an operator that treats only `null` and `undefined` as missing?
    solution: |
      **`??`.** `||` falls back for every falsy value - `0`, `''`, `false`, `NaN` - so a real `0` is replaced.
      `??` (ECMA-262 13.13) falls back only for `null`/`undefined`. Test both cases: amount `0` shows `0`,
      amount `undefined` shows the fallback (run in this lesson: `0 || 100` is 100, `0 ?? 100` is 0).
    followUp: |
      Where else in a dashboard would `||` silently replace a real value? Think of strings and booleans.

  - id: order-updates-coding
    type: coding
    concept: js-values-equality-copies
    skill: application
    title: Update an order without mutating it
    prompt: |
      Implement `withStatus`, `customerLabel` and `currencyOf` in `exercises/js/order-updates.js`. The
      dashboard keeps orders in state compared by reference, so `withStatus` must return a new order and never
      change the one it receives - not even its `history`. The test freezes the input to prove it.
    project: fullstack
    files:
      - exercises/js/order-updates.js
    test: tests/js/order-updates.test.ts
    command: npx vitest run tests/js/order-updates.test.ts
    hints:
      - "Start with `{ ...order, status }`. What does the result share with `order`?"
      - The history array must be new too - how do you make a new array with one more element?
      - "`customer` may be undefined or null, and `name` may be `''` - which two operators handle that?"
    modelAnswer: |
      ```javascript
      export function withStatus(order, status, at) {
        return { ...order, status, history: [...order.history, { at, status }] };
      }
      export function customerLabel(order) {
        return order.customer?.name ?? 'Guest';
      }
      export function currencyOf(order) {
        return order.currency ?? 'EUR';
      }
      ```

      Spread is shallow, so the history array is copied explicitly; `push` on the original would throw because
      the test froze it. `?.` stops at a null or undefined customer, and `??` keeps an empty name the merchant
      typed - `||` would turn it into `Guest` and fail the test.
    rubric:
      - Every test in tests/js/order-updates.test.ts passes
      - No mutation of the input - no push, splice, sort or property assignment on order or order.history
      - Uses ?? rather than || for the defaults, and can explain the difference with '' and 0
      - Can explain why spread alone is not enough for the history array
    solution: |
      Copy the order with spread, build a new history array with spread plus the new entry, and use `?.` with
      `??` for the label and currency. The reference solution is `solutions/js/order-updates.js`.
    followUp: |
      Write `withItemQuantity(order, sku, qty)` for an order with an `items` array of objects. Which objects must
      be new, and which may be shared?

  - id: const-immutable-short
    type: short
    concept: js-values-equality-copies
    skill: analysis
    title: "\"It's const, so it can't change\""
    prompt: |
      In a code review a colleague says: "`const order = { status: 'PENDING' }` is safe to pass to other modules -
      it's const, so nobody can change it." Explain what `const` actually guarantees, show what still can change,
      and say what you would use instead if the order really must not change.
    modelAnswer: |
      `const` makes the **binding** read-only: `order = somethingElse` throws. It says nothing about the
      **object**: `order.status = 'PAID'` works, and any module that received the object can do it. To stop
      that, freeze it (`Object.freeze(order)` - shallow, so nested arrays and objects need freezing too) or,
      better, never mutate shared objects: return updated copies (`{ ...order, status }`), and use TypeScript
      `readonly` types so mutations fail at compile time.
    rubric:
      - Distinguished the binding (variable) from the object (value)
      - Showed that properties of a const object can still be changed
      - Mentioned Object.freeze and that it is shallow
      - Proposed returning copies and/or readonly types instead
    hints:
      - What exactly does `const` stop - assigning the variable, or changing the object?
    solution: |
      `const` = the variable can't be reassigned; the object is still mutable. Use `Object.freeze` (shallow),
      copy-on-update, and `readonly` types.

  - id: closures-interview
    type: interview
    concept: js-block-scope-closures
    skill: analysis
    title: "Interview: closures in a real application"
    prompt: |
      "What is a closure? Give me an example from a web application you'd actually write, and one bug closures
      can cause."
    modelAnswer: |
      A closure is a function together with the variables of the scope it was created in; the function can
      still read and update them after that scope has returned. In ECMA-262 terms the function keeps a reference
      to its environment record.

      **Useful example:** a rate limiter or attempt tracker - `createAttemptTracker(limit)` keeps a `Map` of
      failures in its own scope and returns `recordFailure` and `remaining`; the counts are private, and two
      trackers never share them. Other everyday ones: event handlers that remember the item they were created
      for, React hooks (every render's handlers close over that render's state), memoisation caches, and
      middleware factories like `requireRole('admin')` in Express.

      **Bug:** closures capture **variables**, not values. In a `var` loop every callback shares one `i` and
      sees its final value; `let` fixes it with a fresh binding per iteration. In React the mirror image is a
      **stale closure**: a `setInterval` callback created on the first render keeps reading the first render's
      state. Also, a long-lived closure (a listener never removed) keeps everything it references in memory.
    rubric:
      - Defined a closure as a function plus the scope or variables it was created in
      - Gave a realistic example with private state or a factory
      - Explained that closures capture variables, not values (the var loop)
      - Mentioned stale closures in React or memory kept alive by long-lived closures
    followUps:
      - How is a closure's private state different from a class's `#private` field?
      - Why does `let` in a for loop fix the bug - what does the engine do differently?
      - How would you find a memory leak caused by a closure in Chrome DevTools?
    hints:
      - Think of a function that returns functions sharing a variable.
    solution: |
      A closure is a function plus the variables of the scope it was created in. Give a factory with private
      state (an attempt tracker, a middleware factory), then the classic bug - closures capture variables, so a
      `var` loop shares one `i` - and its React cousin, the stale closure.

placement:
  - id: place-tdz
    type: mcq
    concept: js-block-scope-closures
    skill: application
    title: Used before declared
    prompt: |
      ```javascript
      function fee() {
        const total = amount * 2;
        let amount = 50;
        return total;
      }
      fee();
      ```

      What happens?
    options:
      - id: ref-error
        text: It throws a ReferenceError
        feedback: Correct. amount exists from the start of the function but is uninitialised until its let line runs - the temporal dead zone.
      - id: nan
        text: It returns NaN, because amount is undefined at that point
        feedback: That would be true with var, which is initialised to undefined. let and const are not initialised until their declaration runs.
      - id: hundred
        text: It returns 100, because declarations are hoisted
        feedback: The declaration is hoisted, but the assignment isn't - and for let, reading it before the line runs throws.
    correct: [ref-error]
    solution: |
      **ReferenceError** ("Cannot access 'amount' before initialization" in V8). `let`/`const` bindings are
      created when the scope starts but stay in the temporal dead zone until their line runs (ECMA-262 14.3.1).
      With `var` the result would be `NaN` (`undefined * 2`).

  - id: place-this
    type: mcq
    concept: js-this-and-arrows
    skill: application
    title: Which call keeps `this`?
    prompt: |
      In a class method, `this.feed.subscribe(...)` registers a callback the feed calls as a plain function.
      Which argument makes `this.save(update)` inside the callback use the class instance?
    options:
      - id: arrow
        text: "`(update) => this.save(update)`"
        feedback: Correct. The arrow has no own this; it uses the method's this, which is the instance.
      - id: function-expr
        text: "`function (update) { this.save(update); }`"
        feedback: An ordinary function gets this from its call. The feed calls it plainly, so in strict code this is undefined.
      - id: method-ref
        text: "`this.save`"
        feedback: Passing the method detaches it from the instance - the feed's plain call gives it this = undefined.
    correct: [arrow]
    solution: |
      **The arrow function.** Arrow functions resolve `this` lexically - from the method they are written in.
      An ordinary function or a detached method gets `this` from the call, and a plain call in strict code gives
      `undefined`. `this.save.bind(this)` would also work.

  - id: place-async
    type: debug
    concept: js-modules-and-async-errors
    skill: analysis
    title: The error the catch never sees
    prompt: Click the line that lets a failed `loadOrders()` escape the `catch`.
    language: javascript
    code: |
      async function showOrders() {
        try {
          const orders = loadOrders();
          render(orders);
        } catch (error) {
          showError(error);
        }
      }
    correctLines: [3]
    lineNotes:
      - line: 4
        note: render receives a pending promise, which is a bug too - but the reason the rejection escapes is that nothing awaits it.
    solution: |
      **Line 3** - `loadOrders()` returns a promise that is never awaited, so its rejection happens outside the
      `try` and becomes an unhandled rejection. Use `const orders = await loadOrders();`.

  - id: place-copy
    type: mcq
    concept: js-values-equality-copies
    skill: application
    title: Did the original change?
    prompt: |
      ```javascript
      const order = { id: 'ord_1', tags: ['vip'] };
      const copy = { ...order };
      copy.tags.push('refund');
      copy.id = 'ord_2';
      ```

      What is `order` now?
    options:
      - id: tags-shared
        text: "`{ id: 'ord_1', tags: ['vip', 'refund'] }`"
        feedback: Correct. Spread made a new outer object (so id is independent) but copied the reference to the same tags array.
      - id: unchanged
        text: "`{ id: 'ord_1', tags: ['vip'] }`"
        feedback: Spread is a shallow copy - the nested array is shared, so the push changed the original's tags too.
      - id: all-changed
        text: "`{ id: 'ord_2', tags: ['vip', 'refund'] }`"
        feedback: copy is a new object, so assigning copy.id doesn't touch order.id. Only the shared nested array is affected.
    correct: [tags-shared]
    solution: |
      **`{ id: 'ord_1', tags: ['vip', 'refund'] }`.** Spread is shallow: `copy.tags === order.tags`. Copy the
      nested array too (`{ ...order, tags: [...order.tags, 'refund'] }`) or use `structuredClone` for a deep
      copy.

recall:
  - id: recall-tdz
    concept: js-block-scope-closures
    prompt: What is the temporal dead zone?
    answer: The time between entering a scope and the let/const/class declaration line running; the binding exists but any access throws a ReferenceError.
  - id: recall-closure
    concept: js-block-scope-closures
    prompt: What does a closure capture - values or variables? What follows for a var loop?
    answer: Variables. A var loop has one shared variable, so callbacks created in it all see its final value; let creates a fresh binding per iteration.
  - id: recall-this-rule
    concept: js-this-and-arrows
    prompt: What decides `this` in an ordinary function, and in an arrow function?
    answer: Ordinary function - the call (obj.m() gives obj, a plain call gives undefined in strict code, call/apply/bind set it). Arrow - the this of the surrounding code; calls can't change it.
  - id: recall-live-binding
    concept: js-modules-and-async-errors
    prompt: What is a live binding, and can an importer assign to an import?
    answer: An import is a read-only view of the exporter's variable, so it sees later changes; assigning to it throws a TypeError - only the exporting module can change it.
  - id: recall-return-await
    concept: js-modules-and-async-errors
    prompt: Why does `return promise` inside try not catch the promise's rejection?
    answer: The try block ends when the promise is returned; the rejection happens later, outside it. `return await promise` waits inside try, so catch runs.
  - id: recall-nullish
    concept: js-values-equality-copies
    prompt: When does `a ?? b` differ from `a || b`?
    answer: When a is falsy but not nullish - 0, '', false, NaN. ?? keeps those; || replaces them with b.
  - id: recall-object-is
    concept: js-values-equality-copies
    prompt: Where do `===` and `Object.is` disagree?
    answer: NaN (=== says false, Object.is true) and 0 vs -0 (=== says true, Object.is false).
  - id: recall-shallow
    concept: js-values-equality-copies
    prompt: Which of spread, destructuring, Object.freeze and structuredClone copy or protect nested objects?
    answer: Only structuredClone copies deeply. Spread and destructuring copy one level; Object.freeze freezes one level.

