id: node-runtime-and-npm
title: The Node.js runtime, npm and package.json
subject: fullstack
module: js-ts-node
level: beginner
status: published
estimatedMinutes: 60
summary: How one JavaScript thread serves thousands of requests, the order in which Node runs your callbacks, ES modules versus CommonJS, package.json, semver ranges and lockfiles, and reading configuration from the environment - every output here was produced by a real run.
tags:
