id: web-accessibility-wcag
title: Accessibility with WCAG 2.2 and ARIA
subject: fullstack
module: web-platform
level: intermediate
status: published
estimatedMinutes: 60
summary: Build pages everyone can use - keyboard, screen readers, contrast - and test them. WCAG 2.2's principles, levels and key success criteria, accessible names and roles, the rules of ARIA, keyboard and focus management, and a test mix of automated scans and manual checks.
tags:
  [
    accessibility,
    a11y,
    wcag,
    wcag 2.2,
    aria,
    accessible name,
    screen reader,
    keyboard,
    focus,
    contrast,
    axe,
    playwright,
  ]

environment: |
  - **Standard:** [Web Content Accessibility Guidelines (WCAG) 2.2](https://www.w3.org/TR/WCAG22/), W3C
    Recommendation, first published 5 October 2023; the version quoted here is dated **12 December 2024**.
    Success criterion numbers, names, levels and wording in this lesson were checked against it. Background
    and examples: [Understanding WCAG 2.2](https://www.w3.org/WAI/WCAG22/Understanding/) and
    [What's new in WCAG 2.2](https://www.w3.org/WAI/standards-guidelines/wcag/new-in-22/) (W3C WAI).
  - **ARIA:** [WAI-ARIA 1.2](https://www.w3.org/TR/wai-aria-1.2/) (W3C Recommendation, 6 June 2023);
    [Accessible Name and Description Computation 1.2](https://www.w3.org/TR/accname-1.2/) (a W3C Working
    Draft - the order of the name steps shown here is from it); the
    [ARIA Authoring Practices Guide (APG)](https://www.w3.org/WAI/ARIA/apg/) - "Read Me First", the Dialog
    (Modal) pattern and "Developing a Keyboard Interface"; the four rules of ARIA use from
    [Notes on ARIA Use in HTML](https://www.w3.org/TR/using-aria/), which the W3C now keeps for reference
    only and points to the APG for current guidance.
  - **Live regions:** [MDN - ARIA live regions](https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Guides/Live_regions).
  - **Testing tools:** [Playwright - Accessibility testing](https://playwright.dev/docs/accessibility-testing)
    (the `@axe-core/playwright` package, `AxeBuilder`, `withTags`); axe-core **4.14** rule list
    ([rule-descriptions.md](https://github.com/dequelabs/axe-core/blob/develop/doc/rule-descriptions.md)) for
    rule ids and tags; Playwright Test **1.64** assertions `toHaveAccessibleName` and `toHaveRole`;
    [Chrome DevTools accessibility reference](https://developer.chrome.com/docs/devtools/accessibility/reference)
    for the Accessibility tab. Screen reader behaviour differs between screen readers and browsers - always
    say which pair you tested with.
  - **Examples:** the SandPay Demo Shop in `practice/shop` (fictional). Its markup and script are quoted as
    they are in the repository; contrast ratios were computed with the WCAG relative-luminance formula.
  - **Not legal advice:** which WCAG level a law or contract requires depends on the jurisdiction and the
    contract - check the regulation that applies to you.

prerequisites: [html-semantics-and-forms]

concepts:
  - id: wcag-conformance-model
    name: The WCAG conformance model
    summary: Four principles (perceivable, operable, understandable, robust), 13 guidelines and testable success criteria at levels A, AA and AAA; conformance is claimed for full pages and complete processes, and AA means every A and AA criterion is met.
  - id: accessible-name-and-role
    name: Accessible names, roles and the rules of ARIA
    summary: Assistive technology sees each control as a role, a name and states, computed from native HTML first and ARIA second; use native elements, and use ARIA only to add what HTML cannot express.
  - id: keyboard-focus-management
    name: Keyboard operation and focus management
    summary: Everything must work from the keyboard, focus must move in a meaningful order, stay visible and not be hidden, and must be placed deliberately when content opens, closes or is re-rendered.

objectives:
  - Explain WCAG 2.2's structure - principles, guidelines, success criteria and levels - and what an AA conformance claim requires.
  - Identify which success criterion a defect fails, by number, name and level, and justify it from the criterion's wording.
  - Predict an element's accessible name and role from its markup, and fix markup that gives a control no name or the wrong one.
  - Design keyboard and focus tests for a checkout flow, including what happens to focus after content changes.
  - Write an automated accessibility scan with Playwright and axe-core, and explain which problems it cannot find.

sections:
  - id: intuition
    kind: intuition
    concepts: [wcag-conformance-model, accessible-name-and-role]
    title: The idea in plain language
    body: |
      A building with only stairs works for most visitors and shuts some out completely. A ramp, a lift,
      signs in large print and a door that opens without much force let **more people** in - and they help
      people carrying boxes or pushing prams too.

      Web accessibility is the same idea for pages. Some people use a **keyboard** instead of a mouse; some
      hear the page through a **screen reader**; some zoom to 400%; some cannot tell red from green; some
      use voice control and say "click Pay". A page works for them only if:

      - every control can be **reached and used** without a mouse;
      - every control has a **name and a role** that software can read out ("Pay, button");
      - text and controls have enough **contrast** and do not depend on colour alone;
      - errors are **explained in text**, not only by a red border.

      WCAG is the shared checklist that turns "accessible" into **testable statements**, so developers,
      testers and auditors can agree whether a page passes.

  - id: what
    kind: what
    concepts: [wcag-conformance-model]
    title: What WCAG 2.2 is - principles, guidelines, criteria and levels
    body: |
      WCAG 2.2 is a W3C Recommendation. It has four layers:

      | Layer | How many | Testable? | Example |
      |---|---|---|---|
      | **Principles** | 4 - **P**erceivable, **O**perable, **U**nderstandable, **R**obust ("POUR") | no | Operable |
      | **Guidelines** | 13 | no | 2.1 Keyboard Accessible |
      | **Success criteria (SC)** | numbered `principle.guideline.criterion` | **yes** | 2.1.1 Keyboard (Level A) |
      | **Techniques** | sufficient techniques and documented failures, in *Understanding WCAG* | informative | C43 - CSS `scroll-padding` |

      Every success criterion has a **level**: **A** (the minimum), **AA** or **AAA**. The conformance
      requirements say:

      - **Level AA** - the page satisfies **all Level A and Level AA** success criteria (or a conforming
        alternate version is provided). AA is the level most policies and contracts ask for.
      - **Full pages** - conformance is for whole pages; you cannot exclude the part that fails.
      - **Complete processes** - if a page is one step of a process (cart → checkout → payment →
        confirmation), **every page in the process** must conform at that level.

      ### Criteria a full stack developer meets most often

      | SC | Name | Level | In one line (paraphrased - read the Recommendation for the exact wording) |
      |---|---|---|---|
      | 1.1.1 | Non-text Content | A | images and icons have a text alternative; controls have a name that says their purpose |
      | 1.3.1 | Info and Relationships | A | structure shown visually (headings, lists, tables, labels) is also in the markup |
      | 1.4.3 | Contrast (Minimum) | AA | text at least **4.5:1**; large text (18 pt, or 14 pt bold) at least **3:1** |
      | 1.4.11 | Non-text Contrast | AA | parts of controls and graphics needed to identify them at least **3:1** |
      | 2.1.1 | Keyboard | A | all functionality works from a keyboard interface |
      | 2.1.2 | No Keyboard Trap | A | if focus can move into a component, it can move out with the keyboard |
      | 2.4.3 | Focus Order | A | focus moves in an order that preserves meaning and operability |
      | 2.4.7 | Focus Visible | AA | the keyboard focus indicator is visible |
      | 2.4.11 | Focus Not Obscured (Minimum) | AA | *new in 2.2* - the focused component is not **entirely** hidden by author-created content |
      | 2.5.3 | Label in Name | A | a control's accessible name contains its visible label text |
      | 2.5.8 | Target Size (Minimum) | AA | *new in 2.2* - pointer targets at least **24 × 24 CSS pixels**, or spaced, or one of the listed exceptions |
      | 3.3.1 | Error Identification | A | a detected input error is identified and described **in text** |
      | 3.3.2 | Labels or Instructions | A | labels or instructions are provided when input is required |
      | 4.1.2 | Name, Role, Value | A | every UI component's name and role can be programmatically determined, and its states and value too |
      | 4.1.3 | Status Messages | AA | status messages can be announced **without receiving focus** |

      **4.1.1 Parsing** is marked "obsolete and removed" in WCAG 2.2 - assistive technology no longer
      parses HTML itself. Duplicate ids still break `<label for>` and `aria-labelledby`, but that now fails
      other criteria (such as 1.3.1 or 4.1.2), not 4.1.1.

  - id: why
    kind: why
    concepts: [wcag-conformance-model]
    title: Why it is a developer's job, not a final audit
    body: |
      - **People are shut out.** A `div` that only reacts to clicks is a wall for keyboard and screen
        reader users - they cannot pay at all, so this is a functional defect, not polish.
      - **It is cheap early and expensive late.** Choosing `<button>` instead of `<div>` costs nothing on
        day one; retrofitting keyboard support, names and focus handling into fifty custom widgets costs a
        sprint.
      - **It is often a requirement.** Public-sector rules, procurement contracts and many companies'
        policies reference WCAG, commonly at Level AA. Which law applies depends on where you operate -
        check it rather than assume.
      - **It helps everyone.** Good contrast helps on a phone in sunlight; real labels help autofill and
        voice control; keyboard support helps power users - and the **same accessible names make UI tests
        stable** (`getByRole('button', { name: 'Pay' })` - see
        [Playwright locators](#/lesson/playwright-locators-and-assertions)).

  - id: internals
    kind: internals
    concepts: [accessible-name-and-role]
    title: How assistive technology sees a page - roles, names and states
    body: |
      The browser builds an **accessibility tree** next to the DOM. Each node exposes:

      - a **role** - `button`, `link`, `textbox`, `checkbox`, `heading`, `dialog`, `status`...;
      - an **accessible name** - what is read out ("Pay €12.00");
      - **states and properties** - disabled, expanded, checked, invalid, required, current value.

      Native HTML gives you all three for free: `<button>` has role `button`, is focusable, and fires
      `click` on Enter and Space. A `<div onclick>` has **no role, no focus and no keyboard behaviour**.

      ### How the accessible name is chosen

      The Accessible Name and Description Computation (accname) tries sources **in order** and stops at the
      first that gives a name (simplified):

      1. **`aria-labelledby`** - the text of the referenced element(s);
      2. **`aria-label`** - the attribute's string;
      3. **the host language's label** - `<label for>`, `alt` on `<img>`, `<caption>`, `<legend>`, SVG
         `<title>`;
      4. **name from content** - the element's text, for roles that allow it (buttons, links, headings,
         table header cells...); **hidden** descendants are skipped;
      5. **tooltip** - the `title` attribute, as a last resort.

      So `aria-labelledby` **overrides** `aria-label`, which overrides the visible text. That is why ARIA
      can quietly **replace** what sighted users read - and why 2.5.3 Label in Name exists.

      ### The rules of ARIA use

      From *Notes on ARIA Use in HTML* and the APG's "No ARIA is better than bad ARIA":

      1. If a **native HTML element** has the semantics and behaviour you need, **use it** instead of
         adding a role to something else.
      2. **Don't change native semantics** unless you really have to.
      3. All interactive ARIA controls must be **usable with the keyboard** - a role is a promise, and
         ARIA adds **no** behaviour: `role="button"` does not make Enter or Space work.
      4. Don't use `role="presentation"` or `aria-hidden="true"` on a **focusable** element - users
         would land on "nothing".

  - id: visual
    kind: visual
    concepts: [accessible-name-and-role]
    title: "Flowchart: where a control's accessible name comes from"
    body: |
      Notice that the visible text is only **fourth** in line - anything above it wins, even when it says
      something different.

      ```mermaid
      flowchart TD
          A["Control needs a name"] --> B{"aria-labelledby points to text?"}
          B -- yes --> N1["Name = referenced text"]
          B -- no --> C{"aria-label not empty?"}
          C -- yes --> N2["Name = aria-label"]
          C -- no --> D{"Native label? label for, alt, legend, caption"}
          D -- yes --> N3["Name = native label"]
          D -- no --> E{"Role allows name from content?"}
          E -- yes --> N4["Name = visible text, hidden parts skipped"]
          E -- no --> F{"title attribute?"}
          F -- yes --> N5["Name = title"]
          F -- no --> X["No name - fails 4.1.2 for a control"]
      ```

  - id: keyboard
    kind: steps
    concepts: [keyboard-focus-management]
    title: Keyboard operation and focus management, step by step
    body: |
      **1. Use elements that are focusable and operable already.** `<a href>`, `<button>`, `<input>`,
      `<select>`, `<textarea>`, `<details>`/`<summary>`. If you really must build a custom widget, add
      `tabindex="0"`, the right role, and the keys the APG pattern lists for it.

      **2. Keep `tabindex` to 0 and -1.** The APG: `tabindex="0"` puts an element in the tab sequence in DOM
      order; `tabindex="-1"` makes it focusable from script (`element.focus()`) but not by Tab; **positive
      values are strongly advised against** - they jump the queue and break 2.4.3 Focus Order.

      **3. Never remove the focus indicator without a replacement** (2.4.7). `outline: none` with no
      `:focus-visible` style leaves keyboard users guessing.

      **4. Keep focus out from under sticky things** (2.4.11). A sticky header, footer or cookie banner must
      not **entirely** cover the focused element - CSS `scroll-padding` (technique C43) is one fix. A
      **semi-transparent** dimming overlay does not entirely hide it, so it does not fail 2.4.11, though the
      dimmed focus indicator may then fail 1.4.11 Non-text Contrast.

      **5. Move focus on purpose when content changes.**

      | Event | Where focus should go |
      |---|---|
      | a modal dialog opens | into the dialog; Tab stays inside it while it is open (it is modal, and Escape closes it, so this is not a keyboard trap) |
      | the dialog closes | back to the element that opened it (APG), or the next logical place if that element is gone |
      | a list re-renders after an action | to the same control in the new DOM, or to a sensible neighbour - never lost to `<body>` |
      | a form submit fails | to the error summary or the first invalid field |
      | a single-page app changes route | to the new page's heading or main region |

      **6. Announce what does not take focus** (4.1.3). "Added to your cart" or "3 results" should be in a
      live region (`role="status"`, or `role="alert"` for urgent errors) so screen readers read it without
      moving focus. MDN's advice: the live region should **exist before** its content changes - an element
      inserted with its text already in it may not be announced, depending on the browser and screen
      reader.

  - id: example
    kind: example
    concepts: [accessible-name-and-role, keyboard-focus-management]
    title: "Real example: auditing the SandPay Demo Shop"
    body: |
      The [practice shop](shop/index.html) gets a lot right, and a few things worth discussing. Everything
      below is what is actually in `practice/shop`.

      **Done well**

      - `<html lang="en">`, a unique `<title>` per page, a labelled `<nav aria-label="Shop">`, one `<h1>`.
      - Real `<label for>` on the sort `<select>`, the email field and the card fields; `autocomplete="email"`.
      - The card iframe has a name, the card field sets `aria-invalid` and points `aria-describedby` at its
        error text, and the payment error is `role="alert"` - errors are described in text (3.3.1).
      - The cart's "+" and "-" buttons have names that say what they do and to which line:
        `aria-label="One more Espresso beans 1 kg"` - a "+" alone would be read as "plus".
      - Buttons and inputs have `min-height: 44px` - comfortably above 2.5.8's 24 × 24 CSS pixels.
      - Text colours have good contrast: the muted grey `#5d636e` on the page background `#f7f7f5` is about
        **5.6:1**; the accent blue `#1f5fbf` on white about **6.1:1** (WCAG luminance formula).

      **Worth fixing or testing by hand**

      - **An empty table header.** The cart table's last header cell is `<th><span hidden>Actions</span></th>`.
        `hidden` removes the span for **everyone**, screen readers included, so the header has no name.
        axe-core reports this as `empty-table-header` (a best-practice rule). A visually-hidden CSS class,
        not the `hidden` attribute, keeps the text for screen readers.
      - **Focus lost after "One more".** The click handler waits, then calls `render()`, which rebuilds every
        row with `replaceChildren`. The button that had focus no longer exists, so focus falls back to the
        document and the next Tab starts again from the top of the page. Nothing is wrong with the markup -
        only a keyboard test finds this.
      - **The toast may not be announced.** "Pour-over kit added to your cart" is a `div` with `role="status"`
        that is created **with its text already in it**. Per MDN, a live region should exist before its
        content changes; test it with a screen reader.
      - **"Remove" has no line context.** Unlike "+" and "-", each row's "Remove" button is just "Remove".
        It is inside a table row, so it is not necessarily a WCAG failure, but in a screen reader's list of
        buttons every one reads the same. `aria-label="Remove Espresso beans 1 kg"` (keeping "Remove" first,
        per 2.5.3) would match the other buttons.

  - id: code
    kind: code
    concepts: [wcag-conformance-model, keyboard-focus-management]
    title: Automated and keyboard checks with Playwright and axe-core
    body: |
      `npm install -D @axe-core/playwright` (the package the Playwright docs use). The scan below runs
      the axe rules tagged for WCAG 2.0, 2.1 and 2.2 at A and AA. The tags are axe-core's (`wcag22aa` covers
      rules such as `target-size`). Illustrative: it assumes `baseURL` points at the shop.

      ```typescript
      import { test, expect } from '@playwright/test';
      import AxeBuilder from '@axe-core/playwright';

      test('checkout has no automatically detectable WCAG A/AA violations', async ({ page }) => {
        await page.goto('index.html');
        await page.getByRole('button', { name: 'Add to cart' }).first().click();
        await page.goto('checkout.html');

        const results = await new AxeBuilder({ page })
          .withTags(['wcag2a', 'wcag2aa', 'wcag21a', 'wcag21aa', 'wcag22aa'])
          .analyze();

        expect(results.violations).toEqual([]);
      });

      test('the pay button has a name and role that match what is shown', async ({ page }) => {
        // ...same setup as above...
        const pay = page.getByTestId('pay-button');
        await expect(pay).toHaveRole('button');
        await expect(pay).toHaveAccessibleName(/^Pay/); // 2.5.3: the name starts with the visible label
      });

      test('keyboard: focus survives a quantity change in the cart', async ({ page }) => {
        // ...add an item, then:
        await page.goto('cart.html');
        const more = page.getByRole('button', { name: /^One more/ });
        await more.focus();
        await page.keyboard.press('Enter');
        await expect(page.getByTestId('line-quantity')).toHaveText('2');
        // Expected by the design rule "never lose focus to <body>":
        await expect(page.getByRole('button', { name: /^One more/ })).toBeFocused();
      });
      ```

      The last test **fails on the shop today** - that is the focus-loss defect from the example, caught by
      a test a scanner could never write.

  - id: line-by-line
    kind: line-by-line
    concepts: [wcag-conformance-model]
    title: Why those lines are written that way
    body: |
      - **`.withTags([...])`** - without tags axe also runs its best-practice rules; tagging keeps the gate
        tied to the WCAG level you claim. Add `best-practice` in a separate, non-blocking report if you want
        those too.
      - **Scanning after adding an item** - axe scans the page **as it is when `analyze()` runs**. An empty
        checkout hides the form, so the form would never be checked.
      - **`expect(results.violations).toEqual([])`** - on failure Playwright prints each violation's rule
        id, impact and the failing nodes, which is the evidence for a bug report.
      - **`toHaveAccessibleName(/^Pay/)`** - checks what a screen reader user hears and what a voice
        control user must say; a regex allows the amount after "Pay".
      - **`toBeFocused()` after the action** - keyboard defects are about **where focus is**, which no
        static scan observes.
      - **`exclude()` and `disableRules()`** exist for known issues, but Playwright's docs warn that
        `exclude()` skips **every** rule for the element and its descendants - prefer disabling one rule
        id, with a ticket.

  - id: when
    kind: when
    concepts: [wcag-conformance-model]
    title: What automated scans catch - and what they cannot
    body: |
      Playwright's own documentation: automated tests "can detect some common accessibility problems such
      as missing or invalid properties. But many accessibility problems can only be discovered through
      manual testing." It recommends combining automated tests, manual assessments and inclusive user
      testing.

      | Check | A scanner (axe) | Needs a person |
      |---|---|---|
      | a control or image with **no** name | yes | - |
      | text contrast of plain text on a solid background | yes | text on images or gradients |
      | a name that **exists but is wrong or unhelpful** ("button", "image123") | rarely | yes |
      | all functionality works by keyboard (2.1.1) | partly (e.g. focusable scroll regions) | yes - Tab through it |
      | focus order makes sense, focus not lost after updates | no | yes |
      | status messages actually announced | no | yes - with a screen reader |
      | errors explained in a way people understand | no | yes |
      | Reflow at 320 CSS px / 400% zoom | no | yes - zoom it |

      Use the scan as a **cheap gate in CI** on every pull request, and a **manual keyboard and
      screen-reader pass** on every new or changed flow. A green scan means "no detectable violations",
      never "WCAG AA conformant".

  - id: tests
    kind: tests
    concepts: [keyboard-focus-management, accessible-name-and-role]
    title: Test cases for an accessible checkout
    body: |
      | # | Case | Steps | Expected result | Evidence |
      |---|---|---|---|---|
      | 1 | Keyboard-only purchase | Unplug the mouse; Tab from the address bar through catalog, cart and checkout; pay with Enter/Space only | every step is reachable and operable; no trap (2.1.1, 2.1.2) | screen recording with visible focus |
      | 2 | Focus always visible | Tab through every page | a visible focus indicator on every stop (2.4.7); never entirely behind a sticky element (2.4.11) | screenshots of each stop |
      | 3 | Focus after updates | Change quantity, remove a line, submit with an error | focus stays on or near the control, or moves to the error; never to the top of the page | Playwright `toBeFocused` assertion |
      | 4 | Names and roles | Inspect each control in DevTools > Elements > **Accessibility** tab | each control has the right role and a name containing its visible text (4.1.2, 2.5.3) | Computed Properties screenshot |
      | 5 | Errors in text | Enter an unknown test card | the field is identified and the error described in text, and linked with `aria-describedby` (3.3.1) | screen reader output or accessibility tree |
      | 6 | Status announced | Add to cart with a screen reader running | "…added to your cart" is announced without moving focus (4.1.3) | note the screen reader and browser versions |
      | 7 | Zoom and reflow | 400% zoom on a 1280 px window | no loss of content or two-way scrolling (1.4.10 Reflow) | screenshots |
      | 8 | Automated gate | axe scan with WCAG tags on each page state | no violations; any disabled rule has a ticket | CI report |

      **Negative check:** a scan of the cart page with the `best-practice` tag should report the
      `empty-table-header` finding described above - a useful check that your scan really runs on the
      rendered cart and not on an empty page.

  - id: mistakes
    kind: mistakes
    concepts: [accessible-name-and-role, keyboard-focus-management, wcag-conformance-model]
    title: Common mistakes and how to debug them
    body: |
      | Mistake | Why it fails | Fix |
      |---|---|---|
      | `<div class="btn" onclick>` | no role, not focusable, no Enter/Space (2.1.1, 4.1.2) | `<button type="button">` |
      | `role="button"` on a `div` and nothing else | ARIA adds no behaviour - the promise is broken | native button, or add `tabindex="0"` and key handling |
      | `aria-label` that differs from the visible text | voice users say "Pay", the name is "Submit" (2.5.3) | name starts with the visible label |
      | Placeholder instead of a label | it disappears on typing and is not a reliable name (3.3.2) | a visible `<label for>` |
      | Red border as the only error signal | colour alone (1.4.1) and no text (3.3.1) | error text, linked with `aria-describedby`, plus `aria-invalid` |
      | `outline: none` | no visible focus (2.4.7) | a clear `:focus-visible` style |
      | Positive `tabindex` | focus jumps out of reading order (2.4.3) | DOM order, `tabindex` 0 or -1 only |
      | `aria-hidden="true"` around a focusable element | users focus on "nothing" (4th rule of ARIA) | `inert` or remove it from the tab order too |
      | `hidden` on text meant only for screen readers | hidden from screen readers too | a visually-hidden CSS class |
      | "We passed axe, so we're AA" | scanners find only part of the problems | add keyboard and screen reader passes |

      **Debugging method:** select the element in DevTools and read the **Accessibility** tab - role,
      computed name and where the name came from. If the name is wrong, walk the accname order: is there an
      `aria-labelledby` or `aria-label` overriding the text? Then Tab to it and check focus, Enter and
      Space. Finally, listen with a screen reader and note which reader and browser you used - behaviour
      varies between them.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [wcag-conformance-model]
    title: Limitations and trade-offs
    body: |
      - **AA is a floor, not a guarantee.** A page can meet every criterion and still be hard to use;
        usability testing with disabled people finds what checklists miss.
      - **AAA is not required as a whole.** WCAG notes it is "not possible to satisfy all Level AAA success
        criteria for some content" and does not recommend requiring AAA site-wide; teams
        adopt individual AAA criteria where they help (2.4.12 Focus Not Obscured (Enhanced), 2.5.5 Target
        Size (Enhanced)).
      - **Custom widgets cost more than you think.** A native `<select>` is less stylable than a custom
        listbox, but the custom one needs a role, states, keyboard model and screen-reader testing on several
        browsers. Prefer native unless the design truly needs more.
      - **Third-party content counts.** A payment iframe or chat widget inside your checkout is part of the
        complete process. Ask vendors for their conformance report and test it with your page.
      - **WCAG 2.2 is the current Recommendation;** many laws still cite 2.1 or 2.0. 2.2 is backwards
        compatible with 2.1, but it removed 4.1.1 Parsing - the W3C notes that authors bound by 2.0 or 2.1
        may still need to test 4.1.1.

  - id: summary
    kind: summary
    concepts: [wcag-conformance-model, accessible-name-and-role, keyboard-focus-management]
    title: Quick reference
    body: |
      - **POUR** - 4 principles, 13 guidelines, testable success criteria at **A / AA / AAA**. AA = all A +
        all AA, for **full pages** and **complete processes**.
      - New in 2.2 at AA: **2.4.11 Focus Not Obscured (Minimum)**, **2.5.8 Target Size (Minimum)** (24 × 24
        CSS px), 3.3.8 Accessible Authentication (Minimum). 4.1.1 Parsing is obsolete and removed.
      - Contrast: text **4.5:1**, large text **3:1**, UI parts and graphics **3:1**.
      - Name order: **aria-labelledby → aria-label → native label/alt → content → title**.
      - ARIA: native first, don't override semantics, roles need keyboard support, no `aria-hidden` on
        focusable things.
      - Keyboard: everything operable, no traps, sensible order, visible focus, focus moved deliberately
        when content opens, closes or re-renders.
      - Testing: axe in CI **plus** keyboard, zoom and screen reader passes. Green scan ≠ conformant.

exercises:
  - id: which-criterion-pay-div
    type: mcq
    concept: accessible-name-and-role
    skill: application
    title: Which criteria does the custom button fail?
    prompt: |
      A redesign replaced the checkout's Pay button with:

      ```html
      <div class="pay-btn" onclick="submitPayment()">Pay €34.50</div>
      ```

      It looks identical and works with a mouse. Which WCAG 2.2 success criteria does it fail?
    options:
      - id: keyboard-and-nrv
        text: 2.1.1 Keyboard (A) and 4.1.2 Name, Role, Value (A) - it is not focusable or operable by keyboard, and it has no button role.
        feedback: Correct - a `div` is not in the tab order and has no role; the text gives it content, but assistive technology does not know it is a control.
      - id: contrast
        text: 1.4.3 Contrast (Minimum) - styled divs are low-contrast.
        feedback: Contrast depends on the colours, not on the element. Nothing says the colours changed.
      - id: parsing
        text: 4.1.1 Parsing - a div with onclick is invalid HTML.
        feedback: The markup is valid HTML, and 4.1.1 Parsing is obsolete and removed in WCAG 2.2 anyway.
      - id: none-has-text
        text: None - it has visible text, so screen readers can read it.
        feedback: Reading the text is not enough. Users must reach it with Tab and know it is a button they can press.
    correct: [keyboard-and-nrv]
    hints:
      - Try to reach it with the Tab key. What happens?
      - What role would a screen reader announce for a div?
    solution: |
      **2.1.1 Keyboard and 4.1.2 Name, Role, Value.** The `div` cannot be focused, so keyboard users cannot
      pay at all, and it exposes no `button` role. Fix: `<button type="button">Pay €34.50</button>` - one
      element gives focus, Enter and Space, the role and the name. `role="button"` on the div would fix only
      the role (rule 3 of ARIA: it adds no keyboard behaviour).
    followUp: |
      The developer adds `tabindex="0"` and `role="button"` but no key handler. Which criterion still fails,
      and how would your keyboard test show it?

  - id: iframe-name
    type: mcq
    concept: accessible-name-and-role
    skill: application
    title: What does the screen reader call the card frame?
    prompt: |
      This is the shop's real checkout markup:

      ```html
      <p class="frame-label" id="card-label">Card details (SandPay)</p>
      <iframe
        id="sandpay-card"
        title="SandPay card details"
        aria-labelledby="card-label"
        src="sandpay-card.html"
      ></iframe>
      ```

      What is the iframe's accessible name?
    options:
      - id: labelledby
        text: '"Card details (SandPay)" - from the element aria-labelledby points to'
        feedback: Correct - aria-labelledby is the first step of the name computation, so it wins over title.
      - id: title
        text: '"SandPay card details" - iframes are always named by their title'
        feedback: title is the usual way to name an iframe, but it is a later step; aria-labelledby comes first.
      - id: both
        text: Both strings joined together
        feedback: The name computation stops at the first step that gives a name. title can become the description instead, not part of the name.
      - id: inner-title
        text: '"SandPay card details" from the framed page''s own title element'
        feedback: The frame's name comes from the iframe element in the parent page, not from the document inside it.
    correct: [labelledby]
    hints:
      - Recall the order of the name computation.
      - Which comes first, aria-labelledby or the title attribute?
    solution: |
      **"Card details (SandPay)".** accname takes `aria-labelledby` first. Both strings are clear here, so
      there is no defect - but if they disagreed, users would hear the labelledby text. Confirm it in Chrome
      DevTools: Elements, select the iframe, Accessibility tab, Computed Properties - the name and its
      source are listed.
    followUp: |
      Someone deletes the `<p id="card-label">` but leaves `aria-labelledby="card-label"`. What is the name
      now, and which axe rule would complain if the title were also removed?

  - id: debug-empty-header
    type: debug
    concept: accessible-name-and-role
    skill: analysis
    title: Find the header with no name
    prompt: |
      The shop's cart table (from `practice/shop/cart.html`, with one rendered row). A screen reader user
      hears an unnamed column when moving across the row. Click the line that causes it.
    language: html
    code: |
      <table class="lines" aria-label="Cart lines">
        <thead>
          <tr>
            <th>Product</th>
            <th>Quantity</th>
            <th class="num">Total</th>
            <th><span hidden>Actions</span></th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Espresso beans 1 kg</td>
            <td><button aria-label="One fewer Espresso beans 1 kg">-</button> 1 <button aria-label="One more Espresso beans 1 kg">+</button></td>
            <td class="num">€18.99</td>
            <td><button>Remove</button></td>
          </tr>
        </tbody>
      </table>
    correctLines: [7]
    lineNotes:
      - line: 1
        note: aria-label on a table is a valid way to name it; the table itself has a name.
      - line: 13
        note: These buttons show "-" and "+" but are named by aria-label - that is the intended fix for symbol-only buttons, and their names start with words, not symbols, so there is no visible text to contradict.
      - line: 15
        note: '"Remove" is a vague name inside a table, but it is a name. The column header is what has none.'
    hints:
      - Which header cell would the name computation give an empty string?
      - What does the hidden attribute do for screen readers?
    solution: |
      **Line 7.** The `hidden` attribute hides the span from **everyone** - it is not rendered and not in the
      accessibility tree - so the header cell's name from content is empty. axe-core reports
      `empty-table-header`. Use a visually-hidden class (text clipped off-screen but still in the
      accessibility tree) instead of `hidden`, so the header reads "Actions".
    followUp: |
      Why would `aria-hidden="true"` on the span have the same effect, and when is `aria-hidden` the right
      tool?

  - id: order-accname
    type: order
    concept: accessible-name-and-role
    skill: recall
    title: The name computation, in order
    prompt: Put the sources of an accessible name in the order the computation tries them.
    items:
      - id: labelledby
        text: aria-labelledby - text of the referenced elements
      - id: arialabel
        text: aria-label - the attribute's string
      - id: native
        text: Native label - label for, alt, legend, caption
      - id: content
        text: Name from content - the element's own text
      - id: title
        text: The title attribute (tooltip)
    hints:
      - ARIA attributes are designed to override what HTML provides.
      - The tooltip is the last resort.
    solution: |
      aria-labelledby → aria-label → native label → content → title. Anything earlier in the list
      **replaces** the visible text, which is why a mismatched `aria-label` breaks 2.5.3 Label in Name.

  - id: focus-after-rerender
    type: mcq
    concept: keyboard-focus-management
    skill: analysis
    title: Why did focus jump to the top?
    prompt: |
      Keyboard test on the shop's cart: focus "One more Espresso beans 1 kg", press Enter. The quantity
      becomes 2, then the next Tab focuses the **"SandPay Demo Shop"** home link at the top of the page.
      The handler (from `practice/shop/shop.js`, trimmed):

      ```javascript
      button.addEventListener('click', async () => {
        button.disabled = true;
        await sleep(400); // the cart is "saved on the server"
        cart.change(line.sku, delta);
        render();          // body.replaceChildren(...new rows...)
        renderCartCount();
      });
      ```

      What is the cause, and the best fix?
    options:
      - id: rerender
        text: render() replaces every row, so the focused button is removed from the DOM and focus is lost; after rendering, focus the matching button in the new row.
        feedback: Correct - when the focused element is removed, focus falls back to the document. Restore it to the equivalent control (found by sku and testid) after render().
      - id: disabled
        text: Disabling the button moves focus to the next element; remove button.disabled.
        feedback: Disabling it may blur it in some browsers, but the button is destroyed by render() anyway - removing disabled alone would not keep focus.
      - id: tabindex
        text: The buttons need tabindex="1" so they come first.
        feedback: Positive tabindex is strongly advised against (APG) and would break the order of the whole page; it does not restore focus.
      - id: browser-bug
        text: It is browser behaviour that cannot be changed; document it.
        feedback: The app controls the DOM and can call focus() - keeping focus after a re-render is the app's job.
    correct: [rerender]
    hints:
      - What happens to the element that has focus when it is removed from the document?
      - After render(), does the old button object still exist on the page?
    solution: |
      **The re-render destroys the focused button.** `replaceChildren` puts new rows in, the old button is
      gone, and focus resets to the document, so the next Tab starts from the top. Fix: after `render()`,
      find the new button for the same sku and action and call `.focus()` (or update the quantity in
      place instead of rebuilding rows). Confirm with a test that asserts `toBeFocused()` after the click -
      it fails before the fix and passes after. This is a 2.4.3 Focus Order problem in practice: users
      must re-tab through the whole page.
    followUp: |
      The **last** line is removed with "Remove", so there is no matching button any more. Where should
      focus go now?

  - id: overlay-not-obscured
    type: mcq
    concept: keyboard-focus-management
    skill: analysis
    title: Does the overlay fail 2.4.11?
    prompt: |
      While a payment runs, the shop shows a fixed overlay over the whole page:
      `background: rgba(20, 22, 26, 0.55)`. A keyboard user presses Tab during processing and focus moves
      to a header link underneath it. Does this fail **2.4.11 Focus Not Obscured (Minimum)**?
    options:
      - id: no-not-entirely
        text: No - the overlay is semi-transparent, so the focused link is not entirely hidden; but check 1.4.11 for the dimmed focus indicator, and ask whether focus should reach the page behind at all.
        feedback: Correct - 2.4.11 fails only when the component is entirely hidden. Understanding 2.4.11 says dimming overlays may pass it while separately failing 1.4.11.
      - id: yes-overlay
        text: Yes - any overlay above the focused element fails 2.4.11.
        feedback: The criterion says "not entirely hidden". A partly visible or dimmed component passes the AA criterion; the AAA one (2.4.12) is stricter.
      - id: aaa
        text: It only matters for AAA, so it can be ignored.
        feedback: 2.4.11 is Level AA. It is 2.4.12 Focus Not Obscured (Enhanced) that is AAA.
      - id: trap
        text: No, but it fails 2.1.2 No Keyboard Trap.
        feedback: A trap means focus cannot leave a component. Here focus moves freely - if anything, too freely.
    correct: [no-not-entirely]
    hints:
      - Read the criterion's exact words - what must not happen to the focused component?
      - Is a 55% dark tint "entirely hidden"?
    solution: |
      **It does not fail 2.4.11**, because the link is dimmed, not entirely hidden. But it raises two real
      questions: the dimmed focus ring may fall below 3:1 (1.4.11 Non-text Contrast), and users can operate
      links behind a "processing" screen. Making the rest of the page `inert` while processing keeps focus
      where it belongs.
    followUp: |
      A sticky cookie banner with an **opaque** white background covers the "Pay" button completely when
      it receives focus. Which criterion, which level, and which CSS technique fixes it?

  - id: toast-announcement
    type: short
    concept: accessible-name-and-role
    skill: analysis
    title: Why might "added to your cart" be silent?
    prompt: |
      The shop's toast (from `practice/shop/shop.js`):

      ```javascript
      function showToast(text) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.setAttribute('role', 'status');
        toast.textContent = text;
        document.body.append(toast);
        setTimeout(() => toast.remove(), 2500);
      }
      ```

      A screen reader user reports that adding to the cart is sometimes silent. Which success criterion is
      at stake, why can this code be unreliable, and how would you change and test it?
    modelAnswer: |
      **4.1.3 Status Messages (AA)** - the message must be announced without taking focus. `role="status"`
      is the right role, but the region is **created with its text already in it**. MDN advises
      establishing the live region first and changing its content afterwards; whether a region inserted
      with content is announced varies by browser and screen reader. Fix: put one empty
      `<div role="status" class="toast-region">` in the page's initial markup and set its `textContent`
      when an item is added (clear it after the timeout). Test with at least two screen reader and browser
      pairs (for example NVDA with Firefox, VoiceOver with Safari), and record which ones you used.
    rubric:
      - Names 4.1.3 Status Messages at Level AA
      - Explains the live region should exist before its content changes
      - Proposes a persistent, initially empty region updated by script
      - Says it must be tested with real screen readers, naming the pair used
    hints:
      - Which criterion is about messages that don't receive focus?
      - When does the region appear compared with when its text appears?
    solution: |
      See the model answer. The key point: the role is fine, the timing is the risk. An automated scan
      cannot hear announcements, so this needs a manual screen reader check.

  - id: keyboard-checkout-tests
    type: testdesign
    concept: keyboard-focus-management
    skill: application
    title: Design keyboard tests for the checkout
    prompt: |
      Design keyboard and focus tests for the shop's checkout page: email field, card iframe (card and name
      fields), "Test cards" details, Pay button that is disabled until the form is complete, an error
      paragraph with `role="alert"`, and a processing overlay. Give preconditions, steps, expected results
      (with criterion numbers) and the evidence you would keep.
    modelAnswer: |
      **Preconditions:** one item in the cart; mouse not used; a note of browser and version.

      1. **Reach everything:** Tab from the address bar. *Expected:* email → into the iframe (card, name) →
         Test cards summary → Pay, in a meaningful order (2.4.3); the iframe does not trap focus (2.1.2).
         *Evidence:* screen recording.
      2. **Visible focus:** at every stop the indicator is visible (2.4.7) and not entirely hidden
         (2.4.11). *Evidence:* screenshots.
      3. **Operate:** open "Test cards" with Enter; type `sandpay-card-declined`, a name, a valid email;
         Pay becomes enabled and activates with Enter and with Space (2.1.1).
      4. **Error:** after the decline, the error is shown in text (3.3.1) and announced via
         `role="alert"`; focus is on or near Pay so the user can retry without re-tabbing.
         *Evidence:* screen reader log, focus screenshot.
      5. **Unknown card:** type `sandpay-wrong`; the card field is `aria-invalid="true"` and its error is
         read as its description. *Evidence:* Accessibility tab.
      6. **Processing:** pay with `sandpay-slow`; while the overlay shows, press Tab - note whether focus
         reaches the page behind it (raise as a finding if it can operate links during payment).
      7. **Disabled Pay:** with the form incomplete, check that a keyboard user can tell why Pay is not
         available (instructions present, 3.3.2).
    rubric:
      - Covers reaching every control including inside the iframe, and leaving it (2.1.1, 2.1.2)
      - Checks focus order and visible, unobscured focus (2.4.3, 2.4.7, 2.4.11)
      - Activates Pay with both Enter and Space
      - Checks focus position and text after an error (3.3.1)
      - Covers the processing overlay
      - Names evidence for each case
    hints:
      - Walk the page once with Tab and list every stop.
      - What happens to focus after the payment is declined?
      - The iframe is a separate document - can focus get in and out?
    solution: |
      See the model answer. The strongest designs pair each step with a criterion number and with evidence
      that another person can check, and they include the moments **after** a change (decline, processing),
      where most focus defects live.

  - id: interview-axe-green
    type: interview
    concept: wcag-conformance-model
    skill: analysis
    title: "\"axe is green, so we are AA compliant\""
    prompt: |
      Interviewer: "Our CI runs axe on every page and it is green. The product owner wants to tell a customer
      we conform to WCAG 2.2 AA. What do you say?"
    modelAnswer: |
      A green axe run means **no automatically detectable violations** on the pages and states it scanned -
      not conformance. Playwright's own docs say many problems can only be found manually.

      Before a conformance claim I would check:

      - **Scope:** AA is for **full pages** and **complete processes** - every page from cart to payment
        confirmation, including third-party parts like the payment iframe, in every state (errors, empty
        cart, processing).
      - **What scanners miss:** keyboard operation and focus order (2.1.1, 2.4.3), focus after updates,
        meaningful names and error text, status messages actually announced (4.1.3), reflow at 400% zoom
        (1.4.10), contrast on images.
      - **Method:** a manual pass against every A and AA criterion, keyboard-only and with at least two screen
        reader and browser pairs, with evidence; then a conformance claim that names the WCAG version,
        level, pages and date.

      Until then, say "we test with automated checks and fix what they find; a full AA evaluation is
      planned".
    rubric:
      - Distinguishes "no detectable violations" from conformance
      - Mentions full pages and complete processes, including third-party content
      - Names concrete things scanners cannot check (keyboard, focus, announcements, meaning)
      - Proposes a manual evaluation with evidence and a scoped claim
    followUps:
      - Which three manual checks would you do first if you had one hour?
      - How would you keep accessibility from regressing after the audit?
      - The payment iframe is from a vendor and fails 2.1.1. Can you still claim AA for checkout?
    hints:
      - What does Playwright's documentation say automated tests can and cannot find?
      - Which conformance requirements talk about pages and processes?
    solution: |
      See the model answer. Interviewers listen for the difference between a tool's result and a standard's
      conformance, and for a concrete plan instead of "it depends".

placement:
  - id: place-contrast
    type: mcq
    concept: wcag-conformance-model
    skill: application
    title: Does the hint text pass?
    prompt: |
      Helper text under a form field is 14 px, normal weight, grey `#777777` on white - a contrast ratio of
      about **4.48:1**. Against WCAG 2.2 Level AA, what is the verdict?
    options:
      - id: fails-143
        text: Fails 1.4.3 Contrast (Minimum) - normal-size text needs at least 4.5:1
        feedback: Correct - 4.48 is below 4.5, and 14 px normal weight is not large text. Thresholds are not rounded up.
      - id: passes-large
        text: Passes - the 3:1 large-text threshold applies
        feedback: Large text is at least 18 point, or 14 point bold. 14 px normal weight is far smaller.
      - id: passes-rounded
        text: Passes - 4.48 rounds to 4.5
        feedback: The ratio must be at least 4.5:1; a value below it fails, even narrowly. (#767676 gives about 4.54:1 and passes.)
      - id: aaa-only
        text: Contrast is only a Level AAA requirement
        feedback: 1.4.3 Contrast (Minimum) is Level AA. 1.4.6 Contrast (Enhanced), 7:1, is the AAA one.
    correct: [fails-143]
    solution: |
      **Fails 1.4.3.** Normal text needs 4.5:1 at AA. Change to a slightly darker grey such as `#767676`
      (about 4.54:1) or darker, and re-measure with a contrast checker.

  - id: place-label-in-name
    type: mcq
    concept: accessible-name-and-role
    skill: application
    title: Which button fails?
    prompt: Each button shows the visible text "Cancel order". Which one fails a WCAG 2.2 success criterion?
    options:
      - id: aria-close
        text: '<button aria-label="Close">Cancel order</button>'
        feedback: Correct - aria-label overrides the content, so the name "Close" does not contain the visible label (2.5.3 Label in Name, Level A). A voice user saying "click Cancel order" gets nothing.
      - id: plain
        text: <button>Cancel order</button>
        feedback: The name comes from the content and matches the visible text exactly. This is the best option.
      - id: extended
        text: '<button aria-label="Cancel order 2214">Cancel order</button>'
        feedback: The name starts with and contains the visible label, which 2.5.3 requires (starting with it is the recommended practice).
      - id: labelledby
        text: '<button id="c" aria-labelledby="c">Cancel order</button>'
        feedback: Referring to itself makes the name its own content, "Cancel order" - unusual but not a failure.
    correct: [aria-close]
    solution: |
      **`aria-label="Close"`.** aria-label is earlier in the name computation than content, so the visible
      words are not part of the name - a 2.5.3 failure. Remove the aria-label, or make it start with
      "Cancel order".

  - id: place-dialog-focus
    type: mcq
    concept: keyboard-focus-management
    skill: application
    title: Closing a dialog
    prompt: |
      A keyboard user activates "Edit address" and a modal dialog opens. They press "Save" and the dialog
      closes. Where should focus go, by default?
    options:
      - id: invoker
        text: Back to the "Edit address" button that opened the dialog
        feedback: Correct - the APG Dialog (Modal) pattern returns focus to the invoking element, unless it no longer exists or another element is a clearly more logical next step.
      - id: body
        text: Nowhere in particular - the browser will handle it
        feedback: When the dialog's elements disappear, focus is lost to the document and the user must start again from the top.
      - id: first
        text: To the first link on the page, so the user can start again
        feedback: That throws away the user's place - they would have to tab back through the whole page.
      - id: heading
        text: To the page's h1
        feedback: Moving to the main heading suits a route change in a single-page app, not closing a dialog the user opened from a specific place.
    correct: [invoker]
    solution: |
      **To the invoker.** The user continues where they were. If the invoker is gone (for example "Delete
      address" removed the row), move focus to the next logical element, such as the next row or the
      list's heading.

recall:
  - id: recall-pour
    concept: wcag-conformance-model
    prompt: What are WCAG's four principles, and what does Level AA conformance require?
    answer: Perceivable, operable, understandable, robust. AA means every Level A and Level AA success criterion is met - for full pages and for every page of a complete process.
  - id: recall-new-22
    concept: wcag-conformance-model
    prompt: Name two Level AA criteria new in WCAG 2.2, and the criterion it removed.
    answer: 2.4.11 Focus Not Obscured (Minimum) and 2.5.8 Target Size (Minimum) (24 by 24 CSS pixels); also 3.3.8 Accessible Authentication (Minimum). 4.1.1 Parsing is obsolete and removed.
  - id: recall-contrast
    concept: wcag-conformance-model
    prompt: What contrast ratios does Level AA ask for?
    answer: 4.5:1 for normal text and 3:1 for large text (1.4.3); 3:1 for the parts of controls and graphics needed to identify them (1.4.11).
  - id: recall-name-order
    concept: accessible-name-and-role
    prompt: In what order is an accessible name computed?
    answer: aria-labelledby, then aria-label, then the native label (label, alt, legend, caption), then the element's content, then title.
  - id: recall-aria-rules
    concept: accessible-name-and-role
    prompt: What is the first rule of ARIA use, and why does role="button" alone not make a button?
    answer: Use a native HTML element with the semantics and behaviour you need instead of adding ARIA. ARIA changes only what assistive technology is told - it adds no focus or keyboard behaviour.
  - id: recall-tabindex
    concept: keyboard-focus-management
    prompt: What do tabindex 0, -1 and positive values do?
    answer: 0 adds the element to the tab order in DOM order; -1 makes it focusable only by script; positive values jump ahead of everything else and are strongly advised against.
  - id: recall-focus-loss
    concept: keyboard-focus-management
    prompt: Why does re-rendering a list often break keyboard use, and how do you catch it?
    answer: The focused element is removed from the DOM, so focus falls back to the document and the user starts from the top. A keyboard test that asserts the focused element after the action catches it; scanners do not.
  - id: recall-scanner-limits
    concept: wcag-conformance-model
    prompt: What does a green axe scan prove?
    answer: Only that no automatically detectable violations were found in the scanned pages and states. Keyboard use, focus, meaningful names, announcements and reflow still need manual checks.

