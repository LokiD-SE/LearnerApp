id: react-routing-and-data-fetching
title: Routing and data fetching
subject: fullstack
module: react-frontend
level: intermediate
status: published
estimatedMinutes: 65
summary: How a single-page app changes pages without reloading - the History API, React Router's routes, params, nested layouts and not-found pages - and how to load data for a page with loaders instead of Effects, with honest loading, empty and error states and a typed fetch client that checks response.ok and can be cancelled.
tags:
  [
    react,
    react router,
    routing,
    single-page app,
    History API,
    pushState,
    popstate,
    route params,
    nested routes,
    layout routes,
    Outlet,
    not found,
    loader,
    useLoaderData,
    useNavigation,
    error boundary,
    isRouteErrorResponse,
    fetch,
    response.ok,
    AbortController,
    AbortSignal,
    API client,
    data fetching,
  ]

environment: |
  - **Versions:** React Router **8.5.1** (the package `react-router`; since v7 it contains what
    `react-router-dom` used to, and v8 removed the `react-router-dom` re-export package), React 19.2.9,
    TypeScript 6.0, Vitest 5.0 with jsdom 30.1, Testing Library, Node.js 24.21 - the versions pinned in
    `practice/fullstack`. React Router v8 requires React 19.2.7 or later.
  - **Sources (read 2026-11-14):** React Router -
    [Picking a Mode](https://reactrouter.com/start/modes),
    [Declarative routing](https://reactrouter.com/start/declarative/routing),
    [Data mode routing](https://reactrouter.com/start/data/routing),
    [Route Object](https://reactrouter.com/start/data/route-object),
    [Data Loading](https://reactrouter.com/start/data/data-loading),
    [Pending UI](https://reactrouter.com/start/framework/pending-ui),
    [Error Boundaries](https://reactrouter.com/how-to/error-boundary),
    [Race Conditions](https://reactrouter.com/explanation/race-conditions),
    [createMemoryRouter](https://reactrouter.com/api/data-routers/createMemoryRouter),
    [data](https://reactrouter.com/api/utils/data),
    [Upgrading from v7](https://reactrouter.com/upgrading/v7);
    WHATWG [HTML - session history APIs](https://html.spec.whatwg.org/multipage/nav-history-apis.html) and
    [Fetch Standard](https://fetch.spec.whatwg.org/) ("An ok status is a status in the range 200 to 299,
    inclusive"; a network error rejects the `fetch()` promise with a `TypeError`); MDN
    [fetch()](https://developer.mozilla.org/en-US/docs/Web/API/Window/fetch),
    [Using the Fetch API](https://developer.mozilla.org/en-US/docs/Web/API/Fetch_API/Using_Fetch),
    [Response.ok](https://developer.mozilla.org/en-US/docs/Web/API/Response/ok),
    [popstate](https://developer.mozilla.org/en-US/docs/Web/API/Window/popstate_event),
    [History.pushState()](https://developer.mozilla.org/en-US/docs/Web/API/History/pushState); react.dev
    [You Might Not Need an Effect](https://react.dev/learn/you-might-not-need-an-effect). Every React Router
    API used here was checked against the type definitions of the installed 8.5.1 package.
  - **Run, not assumed:** the `fetch` output (a 404 resolves with `ok: false`, a refused connection rejects
    with `TypeError: fetch failed`, an abort rejects with `AbortError`) was run in Node.js 24.21 against a
    local server; Node's `fetch` follows the Fetch Standard, and browsers word the network-error message
    differently. That an interrupted navigation keeps the old location while loading and aborts the first
    loader's `request.signal` was observed with `createMemoryRouter` 8.5.1. The warning text "Error handled
    by React Router default ErrorBoundary" was printed by 8.5.1 in the tests. The exercise tests in
    `practice/fullstack/tests/react-routing` fail against the unsolved files and pass against the solutions.
  - **Scope:** declarative and data mode only. Framework mode (a Vite plugin, route modules, server
    rendering) adds more and is not taught here. CORS is only mentioned; it belongs to
    [the OWASP lesson](#/lesson/owasp-top-10-for-developers).
  - **Fictional:** the SandPay merchant dashboard, its API (`/api/orders`,
    `https://dashboard.sandpay.example`) and its orders (`ORD-1001`) are invented. Amounts are integers in
    minor units.

prerequisites: [react-state-and-effects, status-codes-and-errors]

concepts:
  - id: client-side-routing
    name: Client-side routing, route params and nested layouts
    summary: A single-page app changes the URL with the History API (pushState, popstate) instead of loading a new document, and a router matches the URL to a tree of routes - nested routes render through an Outlet in their parent, layout routes add UI without a URL segment, ":id" segments become params, and a "*" route catches everything else.
  - id: route-loaders-and-pending-states
    name: Route loaders, pending UI and error boundaries
    summary: "In data mode a route's loader fetches its data before the route renders, with a request whose AbortSignal is aborted when the navigation is interrupted; useNavigation exposes the pending state, a thrown data(..., { status: 404 }) or error renders the closest route ErrorBoundary, and nesting boundaries keeps the rest of the page usable."
  - id: fetch-response-handling
    name: fetch semantics and a typed API client
    summary: fetch resolves for every HTTP status and rejects only when no response arrives (a network error, a TypeError) or the request is aborted (an AbortError), so a client must check response.ok, turn error statuses into typed errors, let aborts through, and validate the JSON before trusting its type.

objectives:
  - Explain how a single-page app changes pages with pushState and popstate, and why a deep link can 404 on a static host.
  - Configure nested routes with a layout, an index route, a dynamic segment and a not-found route, and read params in a component.
  - Compare loading data in a route loader with fetching in an Effect, and name the race conditions and waterfalls each one has.
  - Design loading, empty and error states for a page, and place error boundaries so an error does not take the navigation with it.
  - Write a typed fetch client that checks response.ok, reads a Problem Details title, passes an AbortSignal and validates the body.
  - Test routes with a memory router and a fake API, including the not-found, failed-request and navigation cases.

sections:
  - id: intuition
    kind: intuition
    concepts: [client-side-routing, route-loaders-and-pending-states]
    title: The idea in plain language
    body: |
      A traditional website is a **library with one book per page**: every link sends you back to the desk, and
      the librarian (the server) hands you a whole new book. A single-page app is **one ring binder**. You load
      it once; when you "go to another page", JavaScript swaps the pages inside the binder and writes the new
      page number on the cover (the URL) so that bookmarks, the Back button and sharing a link still work.

      The **router** is the index at the front of the binder: "page `/orders/ORD-1001` is the order detail
      sheet, filed inside the dashboard section". A **loader** is the assistant who, as soon as you ask for a
      page, goes to fetch the paperwork it needs - and who drops the errand if you change your mind and ask for
      a different page. The page appears when its paperwork is ready, and if the paperwork can't be found, a
      note saying so appears **in the same slot**, without throwing away the rest of the binder.

  - id: what
    kind: what
    concepts: [client-side-routing]
    title: The vocabulary of routing
    body: |
      | Term | Meaning |
      | --- | --- |
      | **Client-side routing** | Changing the page by updating the DOM and the URL in JavaScript, without requesting a new document |
      | **History API** | `history.pushState(state, "", url)` adds a session-history entry with a new URL; `replaceState` replaces the current one; the **`popstate`** event fires when the user traverses history (Back, Forward) |
      | **Route** | A rule that couples a URL pattern to UI: `{ path: 'orders', Component: OrdersPage }` |
      | **Nested route** | A child route; its path is joined to its parent's, and it renders where the parent puts an **`<Outlet />`** |
      | **Layout route** | A route **without a path**: it adds UI around its children but no URL segment |
      | **Index route** | The default child, rendered in the parent's outlet at the parent's own URL (`index: true`) |
      | **Dynamic segment** | A path segment starting with `:` (`:orderId`), parsed into **params** (`useParams()`, or `params` in a loader) |
      | **Splat** | A pattern ending in `*`; `path: '*'` matches any URL nothing else matched - the not-found route |
      | **Loader** | A data-mode function on a route that returns the route's data before it renders (`useLoaderData()`) |

      React Router has **three modes**, and their features are additive: **declarative** (`<BrowserRouter>`,
      `<Routes>`, `<Route>` - URL matching, links, active states), **data** (route objects passed to
      `createBrowserRouter`, adding loaders, actions, pending states and error boundaries) and **framework** (a
      Vite plugin on top of data mode, adding type-safe route modules, code splitting and server rendering).
      "The mode depends on which 'top level' router API you're using."

  - id: history-internals
    kind: internals
    concepts: [client-side-routing]
    title: How client-side routing works underneath
    body: |
      1. **A link is clicked.** React Router's `<Link>` renders a real `<a href>` (so it can be opened in a new
         tab and is announced as a link), but for a normal left-click it calls `preventDefault()` and asks the
         router to navigate instead of letting the browser load a document.
      2. **The URL changes without a request.** The router calls `history.pushState`. The HTML Standard: it
         "adds a new entry into session history ... with its URL set to url". The page is **not** reloaded and
         **no `popstate` event fires** - MDN: "just calling `history.pushState()` or `history.replaceState()`
         won't trigger a popstate event".
      3. **The router matches routes.** It walks the route tree, picks the best match for the path, and
         collects the matching branch: for `/orders/ORD-1001` that is root layout → `orders` → `:orderId`,
         with `params.orderId === 'ORD-1001'`.
      4. **Data mode loads first.** Every matched route with a `loader` runs (in parallel by default), and the
         **old page stays on screen** while they run (`useNavigation().state === 'loading'`).
      5. **React renders the branch**: each parent renders its child through `<Outlet />`.
      6. **Back and Forward** fire `popstate`; the router reads the new URL and repeats steps 3-5.

      **Why a deep link can 404.** Typing `https://dashboard.sandpay.example/orders/ORD-1001` asks the **server**
      for that path. A static host with no file at `orders/ORD-1001` answers 404 unless it is configured to
      serve `index.html` for unknown paths (a "fallback" or "rewrite"). The alternative is a **hash router**: the
      part after `#` is never sent to the server. This app uses that - its routes look like
      `#/lesson/react-routing-and-data-fetching` - because it is served as static files from GitHub Pages.

  - id: visual
    kind: visual
    concepts: [client-side-routing, route-loaders-and-pending-states]
    title: "A navigation in data mode: click, load, render - or cancel"
    body: |
      ```mermaid
      sequenceDiagram
        participant U as Merchant
        participant L as Link
        participant R as Router
        participant LD as Loader of orders/:orderId
        participant API as SandPay API
        U->>L: click ORD-1001
        L->>R: navigate('/orders/ORD-1001')
        R->>R: pushState - URL changes, no reload
        R->>LD: loader with params and request (signal)
        LD->>API: GET /api/orders/ORD-1001 (signal)
        Note over R: old page still shown, navigation.state is loading
        alt merchant clicks another link first
          R-->>LD: request.signal aborted
          LD-->>API: request cancelled
        else response arrives
          API-->>LD: 200 order, or 404
          LD-->>R: order, or throw data('Order not found', status 404)
          R->>U: render OrderDetail, or the closest ErrorBoundary
        end
      ```

      Notice two things. The **URL changes before the data arrives** but the **old page stays** until the
      loader finishes, so the user never sees a half-empty screen. And the router **owns the cancellation**:
      when a newer navigation interrupts this one, it aborts the loader's `request.signal`. React Router's own
      words: "interrupted navigations with links and form submissions will cancel in flight data requests and
      immediately process the new event."

  - id: declarative-code
    kind: code
    concepts: [client-side-routing]
    title: Routes in declarative mode
    body: |
      The smallest useful setup: URL matching, a layout with a navigation, a param and a not-found page.

      ```tsx
      import { BrowserRouter, Link, Outlet, Route, Routes, useParams } from 'react-router';

      function Layout() {
        return (
          <>
            <nav aria-label="Dashboard">
              <Link to="/">Home</Link> <Link to="/orders">Orders</Link>
            </nav>
            <main>
              <Outlet /> {/* the matched child renders here */}
            </main>
          </>
        );
      }

      function OrderDetail() {
        const { orderId } = useParams(); // string | undefined - always a string from the URL
        return <h1>Order {orderId}</h1>;
      }

      export function App() {
        return (
          <BrowserRouter>
            <Routes>
              <Route element={<Layout />}>
                <Route index element={<Home />} />
                <Route path="orders" element={<OrdersPage />} />
                <Route path="orders/:orderId" element={<OrderDetail />} />
                <Route path="*" element={<NotFound />} />
              </Route>
            </Routes>
          </BrowserRouter>
        );
      }
      ```

      The first `<Route>` has no `path`, so it is a **layout route**: `Layout` wraps every page, and the URL is
      unaffected. Params are **strings** (or `undefined` if the segment is optional or the component is used
      outside that route) - convert and validate them before use. In declarative mode, loading the order is
      your job, typically in an Effect inside `OrderDetail`; that is where data mode helps.

  - id: data-mode-code
    kind: code
    concepts: [client-side-routing, route-loaders-and-pending-states]
    title: The same routes in data mode, with loaders and error boundaries
    body: |
      Route objects move the configuration **outside rendering**, which is what lets the router load data before
      it renders. This is the reference solution of the second practice exercise, shortened (an illustrative
      excerpt - imports of the components and `createRoot` are left out):

      ```tsx
      import { createBrowserRouter, data, type RouteObject } from 'react-router';
      import { RouterProvider } from 'react-router/dom';

      export function createRoutes(api: OrdersApi): RouteObject[] {
        return [
          {
            path: '/',
            Component: Layout,
            ErrorBoundary: RouteError, // last line of defence: replaces the whole page
            children: [
              { index: true, Component: Home },
              {
                path: 'orders',
                ErrorBoundary: RouteError, // errors below render inside Layout's <Outlet />
                children: [
                  { index: true, Component: OrdersPage, loader: ({ request }) => api.listOrders(request.signal) },
                  {
                    path: ':orderId',
                    Component: OrderDetail,
                    loader: async ({ params, request }) => {
                      const order = await api.getOrder(params.orderId ?? '', request.signal);
                      if (!order) throw data('Order not found', { status: 404 });
                      return order;
                    },
                  },
                ],
              },
              { path: '*', Component: NotFound },
            ],
          },
        ];
      }

      // Create the router once, outside React, and render it.
      const router = createBrowserRouter(createRoutes(realApi));
      createRoot(document.getElementById('root')!).render(<RouterProvider router={router} />);
      ```

      ```tsx
      function OrderDetail() {
        const order = useLoaderData<Order>(); // already loaded: no loading state inside the page
        return <h1>Order {order.id}</h1>;
      }

      function RouteError() {
        const error = useRouteError();
        if (isRouteErrorResponse(error)) return <p role="alert">{error.status} {String(error.data)}</p>;
        return <p role="alert">Something went wrong. Try again.</p>;
      }
      ```

      React Router v8 imports DOM-specific APIs such as this `RouterProvider` from `react-router/dom`, and
      everything else from `react-router` (the main entry also exports a `RouterProvider`, which the tests use).
      The docs say data routers "should not be held in React state" - create the router once, outside the tree.

  - id: why-loaders
    kind: why
    concepts: [route-loaders-and-pending-states]
    title: Why load in loaders instead of Effects
    body: |
      Fetching in an Effect works, and [the state and effects lesson](#/lesson/react-state-and-effects) shows
      how to do it safely. But each page then repeats the same machinery and inherits three problems:

      - **Waterfalls.** An Effect runs only after its component has rendered. A layout that fetches the merchant,
        then renders a page that fetches orders, then a panel that fetches the order's refunds, makes three
        **sequential** round trips. Loaders of every matched route start **together**, as soon as the
        navigation starts.
      - **Races.** Every Effect needs its own cleanup to ignore or abort a stale response. A loader gets a
        `request.signal` that the router aborts when the navigation is interrupted, and only the latest
        navigation's data is committed.
      - **Flashes of empty UI.** With Effects, the new page renders first with no data, shows a spinner, then
        fills in. With loaders the old page stays until the new one is ready, and `useNavigation()` tells you a
        navigation is pending, so you can show one global indicator.

      react.dev makes the same point: with Effects you still have to think about "caching responses" and "how to
      avoid network waterfalls", which "is why modern frameworks provide more efficient built-in data fetching
      mechanisms than fetching data in Effects". Loaders don't
      replace a server-state cache (see [application state](#/lesson/frontend-state-management)), but they remove
      the most common bugs for page data.

  - id: pending-and-errors
    kind: internals
    concepts: [route-loaders-and-pending-states]
    title: Loading, empty and error states - where each one lives
    body: |
      Every page that shows server data has **four** states, and each has a natural home in data mode:

      | State | Where it lives | Example |
      | --- | --- | --- |
      | **Loading** | the layout, from `useNavigation()` (`state === 'loading'`, or `Boolean(navigation.location)`); `NavLink` children can also receive `isPending` | `{navigation.state === 'loading' && <p role="status">Loading…</p>}` |
      | **Empty** | the page component - the data loaded fine, there is just none | "No orders yet." when the array is empty |
      | **Expected failure** | the loader **throws** `data(message, { status })`; the closest `ErrorBoundary` checks `isRouteErrorResponse(error)` | `throw data('Order not found', { status: 404 })` → "404 Order not found" |
      | **Unexpected failure** | any other thrown value bubbles to the closest `ErrorBoundary` | the API is down → "Something went wrong. Try again." |

      **Error boundaries bubble to the closest route that has one.** If only the root route has an
      `ErrorBoundary`, a missing order replaces the **whole** layout - navigation included - with the error. Put
      a boundary on the `orders` route as well and the error renders inside the layout's `<Outlet />`, so the
      merchant can still click "Orders" or "Home". If **no** route has one, React Router renders its default
      boundary and, in development, logs "Error handled by React Router default ErrorBoundary" - fine as a
      safety net, not as UX.

      The React Router docs add one rule: error boundaries are for errors, not control flow. Throwing a
      `data(..., { status: 404 })` from a loader that can't find its record is the documented exception -
      "Throw a 404 and move on."

  - id: fetch-internals
    kind: internals
    concepts: [fetch-response-handling]
    title: "What fetch() really does with errors - run, not assumed"
    body: |
      The Fetch Standard defines `response.ok` as "a status in the range 200 to 299, inclusive", and it rejects
      the `fetch()` promise with a `TypeError` only when the response is a **network error** - no response at
      all. An HTTP error status is a perfectly good response. MDN: "A fetch() promise does not reject if the
      server responds with HTTP status codes that indicate errors (404, 504, etc.)."

      This script (Node.js 24.21, a local server that knows only `ord_1001`) shows all four outcomes:

      ```javascript
      const ok = await fetch(`${base}/api/orders/ord_1001`);
      console.log('found:', ok.status, ok.ok, await ok.json());

      const missing = await fetch(`${base}/api/orders/ord_9999`);
      console.log('missing:', missing.status, missing.ok, missing.headers.get('content-type'));

      try { await fetch('http://localhost:1/api/orders'); }
      catch (e) { console.log('network error:', e.name, '-', e.message); }

      const controller = new AbortController();
      const pending = fetch(`${base}/api/slow`, { signal: controller.signal });
      controller.abort();
      try { await pending; }
      catch (e) { console.log('aborted:', e.name, '-', e.message); }
      ```

      ```plaintext
      found: 200 true { id: 'ord_1001', status: 'PAID', amount: 2599, currency: 'EUR' }
      missing: 404 false application/problem+json
      network error: TypeError - fetch failed
      aborted: AbortError - This operation was aborted
      ```

      - The 404 **resolved**. Code that does `await (await fetch(url)).json()` happily parses the error body and
        hands `{ title: 'Order not found' }` to a component that expects an order.
      - Nothing reached port 1, so there was no response: a `TypeError`. Browsers word the message differently
        (Chrome reports "Failed to fetch") - check the type, not the text.
      - The abort rejected with a `DOMException` named `AbortError`. It is not a failure the user should see;
        it means "nobody wants this answer any more".
      - A body can't be trusted because TypeScript says so: `response.json()` returns `Promise<any>`. Parse it
        with a validator (the [TypeScript lesson](#/lesson/typescript-for-applications) explains why types
        vanish at runtime).

      **CORS** adds one more outcome in browsers: a cross-origin request the server does not allow is reported
      to your code as a network error (`TypeError`), even though the server may have answered. It is a browser
      security rule, covered in [the OWASP lesson](#/lesson/owasp-top-10-for-developers).

  - id: client-code
    kind: code
    concepts: [fetch-response-handling]
    title: A typed API client
    body: |
      One small function, used by every loader, removes those traps once. This is the reference solution of the
      first practice exercise:

      ```typescript
      export class ApiError extends Error {
        override readonly name = 'ApiError';
        constructor(readonly status: number, readonly title: string, readonly url: string) {
          super(`${status} ${title} (${url})`);
        }
      }

      export interface GetOptions<T> {
        parse: (body: unknown) => T; // checks the JSON and returns it typed
        signal?: AbortSignal;
        baseUrl?: string;
      }

      export async function apiGet<T>(path: string, options: GetOptions<T>): Promise<T> {
        const url = `${options.baseUrl ?? '/api'}${path}`;
        let response: Response;
        try {
          response = await fetch(url, {
            headers: { Accept: 'application/json' },
            ...(options.signal ? { signal: options.signal } : {}),
          });
        } catch (error) {
          if (error instanceof Error && error.name === 'AbortError') throw error;
          throw new ApiError(0, 'Network error', url);
        }
        if (!response.ok) {
          const title = (await problemTitle(response)) ?? (response.statusText || 'Request failed');
          throw new ApiError(response.status, title, url);
        }
        return options.parse(await response.json());
      }
      ```

      `problemTitle` reads the `title` of an [RFC 9457 Problem Details](#/lesson/status-codes-and-errors) body
      when the response is JSON, and returns `undefined` otherwise (an HTML error page from a proxy, for
      example). A loader then becomes one line:
      `loader: ({ params, request }) => apiGet(`/orders/${params.orderId}`, { parse: parseOrder, signal: request.signal })`.

  - id: line-by-line
    kind: line-by-line
    concepts: [fetch-response-handling, route-loaders-and-pending-states]
    title: Why the important lines are written that way
    body: |
      - **`parse: (body: unknown) => T`** - the type parameter `T` is only as true as the parser. Making the
        parser required means nobody can write `apiGet<Order>(...)` and get an unchecked cast.
      - **`...(options.signal ? { signal: options.signal } : {})`** - passes the signal through so the router (or
        an Effect's cleanup) can cancel the request. Without it, aborting the loader does nothing to the network.
      - **`error.name === 'AbortError'` → rethrow unchanged** - callers must be able to tell "cancelled" apart from
        "failed". Wrapping an abort into an `ApiError` would show an error message for a navigation the user
        abandoned on purpose.
      - **`new ApiError(0, 'Network error', url)`** - status 0 mirrors the Fetch Standard's network error, whose
        status is 0. The UI can then say "check your connection" instead of "server error".
      - **`if (!response.ok)`** - the line most hand-written clients forget. Without it, a 404 or 500 becomes
        "data".
      - **`throw data('Order not found', { status: 404 })`** in the loader - a "not found" is an expected outcome
        of a URL a user can type. Throwing it sends the router to the closest `ErrorBoundary`, where
        `isRouteErrorResponse` recognises it, and the page component only ever receives a real order.
      - **`ErrorBoundary` on the `orders` route** - nearest boundary wins, so the error renders inside the layout
        and the navigation survives.

  - id: when
    kind: when
    concepts: [client-side-routing, route-loaders-and-pending-states]
    title: Which mode, and when not to use a loader
    body: |
      - **Declarative mode** when routing is all you need, or your data layer already handles loading, pending
        states and races (for example a server-state cache). It is also the smallest step from older React
        Router versions.
      - **Data mode** when you want loaders, actions, pending UI and route error boundaries, but keep control of
        bundling and the server. This lesson's examples and exercises use it.
      - **Framework mode** when you want React Router to own the build too: type-safe route modules, code
        splitting, server rendering. The docs recommend it to people "too new to have an opinion" about the
        rest.

      Loaders are for **the data a page needs to render**. They are not for:

      - data that changes while you are on the page (live order status) - subscribe in an Effect or poll;
      - data fetched because of a user action (search-as-you-type, "load more") - use an event handler or a
        fetcher;
      - anything you must keep fresh across many pages with caching rules - that is server state, covered in
        [application state](#/lesson/frontend-state-management).

      Hash routing (`/#/orders`) avoids server configuration on static hosts, at the cost of uglier URLs and no
      server rendering. Use history routing whenever you control the server or host.

  - id: example
    kind: example
    concepts: [client-side-routing, route-loaders-and-pending-states, fetch-response-handling]
    title: "Real-world scenario: the order page that showed someone else's order"
    body: |
      SandPay's merchant dashboard fetched each order in an Effect: `fetch('/api/orders/' + id).then(r =>
      r.json()).then(setOrder)`. Two bugs reached support in the same week.

      1. **Wrong order on screen.** A merchant clicked ORD-1001, then quickly ORD-1002. ORD-1001's response
         arrived last and replaced ORD-1002's details - the URL said one order, the page showed another. The
         Effect had no cleanup.
      2. **A blank page for a typo.** A merchant pasted `/orders/ORD-10O1` (letter O). The API answered 404 with
         a Problem Details body; the code parsed it as an order, and `order.amountMinor` was `undefined`, so the
         amount rendered as "INR NaN".

      The fix moved order loading into a route loader using `apiGet` with `request.signal` (the router aborts
      the stale request and commits only the latest navigation), checked `response.ok`, and threw
      `data('Order not found', { status: 404 })` when the API said 404. An `ErrorBoundary` on the `orders`
      route shows "404 Order not found" with the navigation still visible.

      **What a tester checks:** click two orders in quick succession with the second response faster (DevTools
      network throttling, or a mocked API that resolves in reverse order) and confirm the URL and the heading
      agree; open an unknown id directly and confirm a not-found message rather than "NaN" or an empty card; in
      the Network panel, confirm the first request shows as cancelled.

  - id: tests
    kind: tests
    concepts: [client-side-routing, route-loaders-and-pending-states, fetch-response-handling]
    title: Tests for routes and data loading
    body: |
      Use `createMemoryRouter(routes, { initialEntries: ['/orders/ORD-1001'] })` with
      `<RouterProvider router={router} />` and a **fake API** you control - no real network, no browser URL.

      | # | Case | Expected result | Evidence |
      | --- | --- | --- | --- |
      | 1 | Open `/` | layout and home page | heading and nav links by role |
      | 2 | Open `/orders` | order links; loader called once with an `AbortSignal` | `findByRole('link', { name: 'ORD-1001' })`; fake API call log |
      | 3 | No orders | "No orders yet." | text by content |
      | 4 | Open `/orders/ORD-1002` | that order's details; param passed to the API | heading; call log shows `ORD-1002` |
      | 5 | Click an order, then "Back to orders" | URL and page change both times | `router.state.location.pathname`; headings |
      | 6 | Unknown id | "404 Order not found" **and** the nav still visible | `role="alert"` text; nav by role |
      | 7 | API throws | generic error message inside the layout | `role="alert"` text |
      | 8 | Unknown URL `/settings/payouts` | "Page not found" inside the layout | heading |
      | 9 | Interrupted navigation | first loader's `request.signal.aborted === true`; final location is the second URL | signal from the fake API |
      | 10 | `apiGet` on 404 / 502 / network error / abort | `ApiError(404, title)` / `ApiError(502, statusText)` / `ApiError(0)` / the `AbortError` itself | stubbed `fetch` |

      Cases 6, 7 and 9 are the negative paths users actually hit. Test them with promises you resolve or reject
      yourself, never with timers.

  - id: mistakes
    kind: mistakes
    concepts: [client-side-routing, route-loaders-and-pending-states, fetch-response-handling]
    title: Common mistakes and how to debug them
    body: |
      - **Forgetting `<Outlet />`.** The URL changes, the parent renders, the child never appears. If a nested
        route "does nothing", check the parent component for an outlet.
      - **`<a href>` instead of `<Link>`** inside the app. Every click reloads the whole app and loses state.
        In DevTools, a document request in the Network panel on each click is the giveaway.
      - **Not checking `response.ok`.** Symptom: "undefined" or "NaN" on screen for missing records; the error
        body was parsed as data.
      - **Treating an abort as an error.** Symptom: a red "Request failed" flashes when the user navigates
        quickly. Rethrow or ignore `AbortError`.
      - **One error boundary at the root.** Symptom: a missing record wipes out the navigation. Add a boundary
        to the nearest route that should contain the error.
      - **Trusting params.** `params.orderId` is whatever the user typed. Validate it, and let the API's 404
        become your not-found state.
      - **Creating the router inside a component.** It is re-created on every render and loses its state.
        Create it once at module level (or in a `useState` initialiser if it must depend on props, as tests do).
      - **Deep links 404 in production only.** The dev server falls back to `index.html`; the static host
        doesn't. Configure the host's fallback, or use a hash router.

      **Debugging method:** reproduce with the URL alone (open it in a new tab); check the Network panel for
      the request, its status and whether it was cancelled; then check which route matched (React Router's
      `useMatches()`, or a `console.log` in the loader) and which `ErrorBoundary` rendered.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [client-side-routing, route-loaders-and-pending-states, fetch-response-handling]
    title: Trade-offs and alternatives
    body: |
      - **SPA routing vs server-rendered pages.** Client-side routing makes navigation fast after the first load
        but ships more JavaScript and needs care for accessibility (focus and announcements on page change) and
        SEO. Frameworks with server rendering (React Router framework mode and others) bring some of that back.
      - **Loaders vs a server-state cache.** Loaders give each navigation fresh data with no cache; a cache
        library gives deduplication, background refresh and optimistic updates, but you wire pending and error
        states yourself. Many apps use both: loaders for the page, a cache for data shared across pages.
      - **A thin `fetch` client vs a library.** `apiGet` is about 40 lines and covers the traps that matter.
        Libraries add retries, interceptors and timeouts - useful, but each retry of a non-idempotent request
        needs the [idempotency rules](#/lesson/http-methods-safety-idempotency).
      - **Typed params and data.** Data mode infers little: `useLoaderData<Order>()` is your claim, not a check.
        Framework mode generates route types; in data mode, validate at the boundary with a parser.

  - id: summary
    kind: summary
    concepts: [client-side-routing, route-loaders-and-pending-states, fetch-response-handling]
    title: Quick reference
    body: |
      - `pushState` changes the URL without a reload and fires no `popstate`; Back/Forward fire `popstate`.
      - Nested routes render in the parent's `<Outlet />`; a route without `path` is a layout; `index: true` is
        the default child; `:id` becomes a param (a string); `path: '*'` is the not-found route.
      - Static hosts need an `index.html` fallback for deep links - or use a hash router.
      - Loaders run before the route renders, in parallel; the old page stays while they load; the router
        aborts `request.signal` when the navigation is interrupted.
      - `useNavigation().state === 'loading'` for pending UI; `useLoaderData()` for the data.
      - Throw `data(message, { status: 404 })` for "not found"; check `isRouteErrorResponse` in the boundary;
        put boundaries close to where errors happen.
      - `fetch` rejects only on network errors (`TypeError`) and aborts (`AbortError`); check `response.ok`.
      - Pass an `AbortSignal`, rethrow aborts, map statuses to typed errors, parse the body.

exercises:
  - id: fetch-404
    type: mcq
    concept: fetch-response-handling
    skill: recognition
    title: What does fetch do with a 404?
    prompt: |
      ```typescript
      try {
        const order = await (await fetch('/api/orders/ORD-9999')).json();
        setOrder(order);
      } catch {
        setError('Order not found');
      }
      ```

      The API answers `404` with `{"title":"Order not found","status":404}`. What does the merchant see?
    options:
      - id: error-shown
        text: The "Order not found" message, because fetch rejects on 404.
        feedback: That's the most common misconception. fetch only rejects when no response arrives (network error) or the request is aborted. A 404 is a response.
      - id: body-as-order
        text: An order view built from the error body - missing fields show as undefined or NaN.
        feedback: Correct - fetch resolves with ok false, json() parses the Problem Details body, and setOrder stores it as if it were an order.
      - id: json-throws
        text: The error message, because json() throws on a 404 response.
        feedback: json() only throws if the body isn't valid JSON. This body is valid JSON - it's just not an order.
      - id: blank
        text: Nothing - React ignores state set from a 404 response.
        feedback: React has no idea where the value came from; it renders whatever you put into state.
    correct: [body-as-order]
    hints:
      - "When does the Fetch Standard reject the fetch() promise?"
      - "Is a 404 with a JSON body a network error?"
    solution: |
      `fetch` resolves for every HTTP status; `response.ok` is false for anything outside 200-299. `json()`
      parses the Problem Details body successfully, so the `catch` never runs and the component receives
      `{ title, status }` as its "order". Fix: `if (!response.ok) throw new ApiError(...)` before parsing, and
      validate the body before storing it.
    followUp: |
      The same code runs while the merchant's Wi-Fi is off. Which branch runs now, and what does the error object
      look like?

  - id: navigation-order
    type: order
    concept: route-loaders-and-pending-states
    skill: application
    title: One navigation in data mode
    prompt: |
      The merchant is on `/orders` and clicks the link to `/orders/ORD-1001`. The route has a loader. Put what
      happens in order.
    items:
      - id: prevent
        text: Link prevents the browser's document navigation and asks the router to navigate
      - id: url
        text: The URL changes with pushState, without reloading the page
      - id: loader
        text: The matched route's loader runs with params.orderId = 'ORD-1001' and a request with a signal
      - id: pending
        text: The orders list stays on screen while useNavigation().state is 'loading'
      - id: render
        text: The loader returns, and OrderDetail renders in the layout's Outlet with useLoaderData()
    hints:
      - "The page you are leaving does not disappear immediately."
      - "Data mode loads before it renders."
    solution: |
      **prevent → url → loader → pending → render.** The `Link` turns a click into a router navigation; the
      router updates history, then runs the loaders of the matched routes. While they run, the old page stays
      and `useNavigation()` reports `loading`, so a layout can show one indicator. Only when the data is ready
      does the new route render with it.

  - id: missing-outlet
    type: debug
    concept: client-side-routing
    skill: analysis
    title: The order page never appears
    prompt: |
      Opening `/orders/ORD-1001` shows the navigation and nothing else. There is no error in the console and
      the loader was called. Click the line that causes it.
    language: typescript
    code: |
      function Layout() {
        const navigation = useNavigation();
        return (
          <>
            <nav aria-label="Dashboard">
              <Link to="/">Home</Link> <Link to="/orders">Orders</Link>
            </nav>
            {navigation.state === 'loading' && <p role="status">Loading…</p>}
            <main />
          </>
        );
      }
    correctLines: [9]
    lineNotes:
      - line: 2
        note: useNavigation only reports pending state; it doesn't decide what renders.
      - line: 8
        note: This shows a status while loading; when loading ends it renders nothing, which is correct.
    hints:
      - "Where do child routes render?"
      - "The layout must leave a slot for the matched child."
    solution: |
      **Line 9.** Child routes render where the parent puts `<Outlet />`. The `<main />` is empty, so the
      matched `OrderDetail` has nowhere to go - the loader ran and its data is ready, but nothing displays it.
      Fix: `<main><Outlet /></main>`.
    followUp: |
      The same layout is now used for `/orders` and `/orders/:orderId`. Where would you put a second `<Outlet />`
      if the orders list should stay visible beside the order detail?

  - id: deep-link-404
    type: mcq
    concept: client-side-routing
    skill: analysis
    title: Works in dev, 404 in production
    prompt: |
      The dashboard uses `createBrowserRouter`. Clicking from `/` to `/orders/ORD-1001` works everywhere. But
      pasting `https://dashboard.sandpay.example/orders/ORD-1001` into a new tab shows the static host's own
      "404 - File not found" page in production, while it works with the Vite dev server. What is the most likely
      cause?
    options:
      - id: fallback
        text: The production host serves files by path and has no fallback to index.html for app routes.
        feedback: Correct - the request goes to the server, which has no file at that path. The dev server falls back to index.html; the host must be configured to do the same, or the app must use hash routes.
      - id: route-config
        text: The route `orders/:orderId` is missing from the route config.
        feedback: Then clicking the link would fail too. And a missing route renders the app's not-found route, not the host's 404 page.
      - id: pushstate
        text: pushState doesn't work on HTTPS.
        feedback: pushState works on any origin; it only refuses URLs from a different origin.
      - id: loader-404
        text: "The loader threw data('Order not found', { status: 404 })."
        feedback: That would render the app's ErrorBoundary. The host's own 404 page means the app never loaded.
    correct: [fallback]
    hints:
      - "Whose 404 page is it - the app's or the host's?"
      - "What does the browser request when you paste a URL?"
    solution: |
      A pasted URL is a **document request** for `/orders/ORD-1001`. Client-side routing only works once
      `index.html` and the app have loaded. A static host returns 404 for paths that aren't files unless it has a
      rewrite or fallback to `index.html`; Vite's dev server has one built in. Confirm it in the Network panel:
      the document request itself is the 404. Fix the host configuration, or use a hash router as this app does.

  - id: boundary-placement
    type: mcq
    concept: route-loaders-and-pending-states
    skill: application
    title: Where should the error boundary go?
    prompt: |
      Routes: `/` (Layout with the navigation) → `orders` → `:orderId`. Only the root route has an
      `ErrorBoundary`. When an order doesn't exist, the whole screen - navigation included - is replaced by
      "404 Order not found". Product wants the navigation to stay. What do you change?
    options:
      - id: orders-boundary
        text: Add an ErrorBoundary to the orders route (or the :orderId route).
        feedback: Correct - errors render at the closest route with a boundary, inside its parent's Outlet, so the Layout stays.
      - id: catch-in-component
        text: Wrap OrderDetail's JSX in try/catch.
        feedback: The error happens in the loader, before OrderDetail renders, and try/catch around JSX doesn't catch rendering errors anyway.
      - id: return-null
        text: Return null from the loader instead of throwing.
        feedback: Then OrderDetail receives null and must handle a missing order itself - the error path leaks into every page.
      - id: remove-root
        text: Remove the root ErrorBoundary.
        feedback: Then React Router's default boundary renders instead - still replacing the page, and with a developer-facing message.
    correct: [orders-boundary]
    hints:
      - "Errors bubble to the closest route that has a boundary."
      - "The boundary renders where its route would have rendered."
    solution: |
      Route errors render at the **nearest route with an `ErrorBoundary`**, in place of that route's component.
      With the boundary only at the root, the root's Layout is what gets replaced. Adding one on `orders` keeps
      the root Layout and shows the error in its outlet. Keep the root boundary as the last line of defence.

  - id: effect-fetch-bug
    type: debug
    concept: fetch-response-handling
    skill: analysis
    title: The error message that flashes on fast clicks
    prompt: |
      Merchants clicking quickly between orders sometimes see "Could not load the order" for a split second,
      even though every order loads in the end. Click the line that causes it.
    language: typescript
    code: |
      useEffect(() => {
        const controller = new AbortController();
        apiGet(`/orders/${orderId}`, { parse: parseOrder, signal: controller.signal })
          .then(setOrder)
          .catch(() => setError('Could not load the order'));
        return () => controller.abort();
      }, [orderId]);
    correctLines: [5]
    lineNotes:
      - line: 6
        note: Aborting in the cleanup is right - it cancels the request for the previous order.
      - line: 3
        note: Passing the signal is right; it's what makes the abort reach the network.
    hints:
      - "What does the previous request's promise do after the cleanup aborts it?"
      - "Is a cancelled request a failure the user should see?"
    solution: |
      **Line 5.** When `orderId` changes, the cleanup aborts the previous request, and its promise rejects with an
      `AbortError`. The `catch` treats every rejection as a failure and shows the message. Ignore aborts:
      `.catch((e) => { if (e.name !== 'AbortError') setError('Could not load the order'); })` - or move the
      loading into a route loader, where the router handles cancellation.

  - id: code-api-client
    type: coding
    concept: fetch-response-handling
    skill: application
    title: Write a typed apiGet client
    prompt: |
      `apiGet` in the practice project is the naive version: it ignores the status, the signal and the parser.
      Rewrite it so that it sends `GET` with `Accept: application/json` to `baseUrl + path`, passes the
      `AbortSignal`, returns `parse(body)` for 2xx, throws `ApiError(status, title, url)` for other statuses
      (the Problem Details `title` when there is one, else the status text), rethrows aborts unchanged and turns
      network errors into `ApiError(0, 'Network error', url)`. The tests replace the global `fetch`.
    project: fullstack
    files:
      - exercises/react-routing/api-client.ts
    test: tests/react-routing/api-client.test.ts
    command: npx vitest run tests/react-routing/api-client.test.ts
    hints:
      - "Run the tests and read the first failure: which header or URL is wrong?"
      - "Wrap only the fetch call in try/catch; the status check comes after it."
      - "An error body may not be JSON - look at the content-type before calling json(), and catch a parse failure."
    modelAnswer: |
      ```typescript
      export async function apiGet<T>(path: string, options: GetOptions<T>): Promise<T> {
        const url = `${options.baseUrl ?? '/api'}${path}`;
        let response: Response;
        try {
          response = await fetch(url, {
            headers: { Accept: 'application/json' },
            ...(options.signal ? { signal: options.signal } : {}),
          });
        } catch (error) {
          if (error instanceof Error && error.name === 'AbortError') throw error;
          throw new ApiError(0, 'Network error', url);
        }
        if (!response.ok) {
          const title = (await problemTitle(response)) ?? (response.statusText || 'Request failed');
          throw new ApiError(response.status, title, url);
        }
        return options.parse(await response.json());
      }
      ```

      `problemTitle` checks that the content type contains `json`, parses the body inside a try/catch and
      returns `body.title` only if it is a string. The full reference is
      `solutions/react-routing/api-client.ts`.
    solution: |
      Build the URL, call `fetch` with the Accept header and the signal inside a try/catch that rethrows
      `AbortError` and maps everything else to `ApiError(0, 'Network error', url)`. Then check `response.ok`:
      for a non-2xx status read the Problem Details title if the body is JSON, fall back to `statusText`, and
      throw an `ApiError`. Only a 2xx body goes through `parse`.
    rubric:
      - Every test in api-client.test.ts passes
      - The status check uses response.ok (or 200-299), not only 404 and 500
      - An abort is rethrown unchanged, not wrapped or swallowed
      - No type assertion (as T) on the parsed body - parse does the checking
      - A non-JSON error body can't crash the error handling

  - id: code-dashboard-routes
    type: coding
    concept: route-loaders-and-pending-states
    skill: application
    title: Routes, loaders and error boundaries for the dashboard
    prompt: |
      The dashboard's components are written. Write `createRoutes(api)` and `RouteError` in data mode: `/` is the
      Layout with Home as its index; `/orders` loads the list with a loader; `/orders/:orderId` loads one order
      and throws `data('Order not found', { status: 404 })` when the API returns null; errors under `/orders`
      render **inside** the Layout; any other URL shows NotFound inside the Layout; `RouteError` shows
      "404 Order not found" for a route error response and "Something went wrong. Try again." otherwise. Pass
      `request.signal` to the API in every loader.
    project: fullstack
    files:
      - exercises/react-routing/routes.tsx
    test: tests/react-routing/dashboard-routes.test.tsx
    command: npx vitest run tests/react-routing/dashboard-routes.test.tsx
    hints:
      - "Start with the nesting: one root route with Layout and children - index, orders, and '*'."
      - "A loader receives { params, request }; the signal is request.signal."
      - "Import data, isRouteErrorResponse and useRouteError from 'react-router'. Which route needs its own ErrorBoundary so the nav survives?"
    modelAnswer: |
      ```tsx
      export function createRoutes(api: OrdersApi): RouteObject[] {
        return [
          {
            path: '/',
            Component: Layout,
            ErrorBoundary: RouteError,
            children: [
              { index: true, Component: Home },
              {
                path: 'orders',
                ErrorBoundary: RouteError,
                children: [
                  { index: true, Component: OrdersPage, loader: ({ request }) => api.listOrders(request.signal) },
                  {
                    path: ':orderId',
                    Component: OrderDetail,
                    loader: async ({ params, request }) => {
                      const order = await api.getOrder(params.orderId ?? '', request.signal);
                      if (!order) throw data('Order not found', { status: 404 });
                      return order;
                    },
                  },
                ],
              },
              { path: '*', Component: NotFound },
            ],
          },
        ];
      }
      ```

      `RouteError` calls `useRouteError()`, and for `isRouteErrorResponse(error)` renders
      `{error.status} {String(error.data)}` in a `role="alert"` paragraph. The reference is
      `solutions/react-routing/routes.tsx`.
    solution: |
      Nest every page under one root route whose `Component` is `Layout`. Under it: an index route for Home, an
      `orders` route with its own `ErrorBoundary` and two children (an index route with the list loader, and
      `:orderId` with the detail loader that throws `data(..., { status: 404 })`), and a `'*'` route for
      NotFound. Keep an `ErrorBoundary` on the root as well. Each loader passes `request.signal` to the API.
    rubric:
      - Every test in dashboard-routes.test.tsx passes
      - Data is loaded in loaders, not in Effects inside the components
      - The not-found case is thrown from the loader, so OrderDetail never receives null
      - The error boundary that handles order errors is below the Layout route
      - The router is created in the test or at module level, never inside a component

  - id: routing-test-design
    type: testdesign
    concept: route-loaders-and-pending-states
    skill: application
    title: Design the tests for the order detail route
    prompt: |
      Design the tests for `/orders/:orderId` in the dashboard (loader, pending state, not-found and failure
      cases, interrupted navigation). For each test give the preconditions, the steps, the expected result and
      the evidence you would collect. Use a memory router and a fake API.
    hints:
      - "Cover: found, not found, API failure, slow then interrupted."
      - "How do you prove the first request was cancelled without a real network?"
    modelAnswer: |
      **Setup for all:** `createMemoryRouter(createRoutes(fakeApi), { initialEntries: [...] })`, rendered with
      `<RouterProvider>`. The fake API records `(method, orderId, signal)` and returns promises the test settles.

      1. **Found.** Pre: fake has ORD-1001. Steps: open `/orders/ORD-1001`, resolve. Expected: heading "Order
         ORD-1001", amount "INR 1,250.00". Evidence: DOM by role; call log shows `getOrder('ORD-1001')`.
      2. **Not found.** Pre: fake returns null. Steps: open `/orders/ORD-9999`. Expected: alert "404 Order not
         found", navigation still present. Evidence: alert text; nav by role.
      3. **API failure.** Pre: fake rejects with an Error. Expected: alert "Something went wrong. Try again."
         inside the layout. Evidence: alert text, nav present; console spy to keep output clean.
      4. **Pending.** Pre: fake promise unresolved. Steps: from `/orders`, click ORD-1001. Expected: list still
         visible, "Loading…" status shown; after resolving, detail shown. Evidence: DOM before and after
         resolving.
      5. **Interrupted.** Steps: navigate to ORD-1001 (unresolved), then to ORD-1002 and resolve it. Expected:
         ORD-1002 shown, location `/orders/ORD-1002`, first call's `signal.aborted === true`. Evidence: the
         recorded signal and `router.state.location.pathname`.
      6. **Late stale response.** After case 5, resolve ORD-1001's promise. Expected: still ORD-1002. Evidence:
         heading unchanged.
    solution: |
      Good test designs control the API's promises instead of timing, cover found / not found / failure /
      pending / interrupted / late-stale cases, and collect DOM evidence by role plus the fake API's call log and
      `signal.aborted` - the only way to prove cancellation without a network.
    rubric:
      - Uses a memory router and a fake API with controllable promises (no sleeps)
      - Includes not-found and API failure, and checks the navigation survives
      - Proves cancellation with the recorded AbortSignal
      - States expected result and evidence for every test

  - id: interview-data-fetching
    type: interview
    concept: route-loaders-and-pending-states
    skill: analysis
    title: How do you fetch data in a React app?
    prompt: |
      "How do you load data for a page in a React single-page app? Talk me through the error, loading and race
      conditions you handle, and when you'd use something other than your default."
    hints:
      - "Name your default and why, then the failure cases."
      - "Mention fetch's error semantics and cancellation explicitly."
    modelAnswer: |
      My default for page data is a **route loader** (React Router data mode, or the framework's equivalent).
      The loaders of all matched routes start in parallel when the navigation starts, so there's no
      component-by-component waterfall; the old page stays while they load and `useNavigation` gives me one
      pending indicator; and the router aborts the loader's `request.signal` when the user navigates again, so
      a stale response can't overwrite the new page.

      All loaders call one small **typed client**. It checks `response.ok`, because `fetch` resolves for 404 and
      500 and only rejects on network errors and aborts; it maps statuses to a typed `ApiError` with the
      Problem Details title, rethrows aborts so they never show as errors, and validates the JSON with a parser
      because TypeScript types don't exist at runtime.

      For states: empty is the page's job ("No orders yet"); expected failures like a missing record are a
      thrown `data(..., { status: 404 })` handled by an error boundary on the nearest route, so the navigation
      survives; unexpected errors bubble to the same or a higher boundary.

      I'd use something else for data that changes while you're on the page (a subscription or polling in an
      Effect with cleanup), for user-triggered fetches like search-as-you-type (an event handler or fetcher with
      cancellation), and for data shared across many pages with caching rules, where a server-state cache fits
      better.
    solution: |
      Strong answers name a default with reasons (parallel loading, pending UI, cancellation), explain fetch's
      error semantics and the client that handles them, place loading, empty and error states deliberately,
      and know the cases where loaders are the wrong tool.
    rubric:
      - Explains why loaders avoid waterfalls and races (parallel start, abort on interruption)
      - States that fetch does not reject on HTTP error statuses and how the client handles it
      - Treats aborts differently from failures
      - Places error boundaries so the layout survives
      - Names cases for Effects, event handlers or a cache instead
    followUps:
      - How would you show a loading indicator only if loading takes longer than 300 ms?
      - The API returns 401 when the session expires. Where do you handle that, and what does the user see?
      - How do you test that a stale response can never overwrite the current page?

placement:
  - id: place-fetch-network
    type: mcq
    concept: fetch-response-handling
    skill: application
    title: Which one rejects?
    prompt: |
      Four calls to `fetch('/api/orders')`. Which one makes the `fetch()` promise **reject**?
    options:
      - id: dns
        text: The API's host name doesn't resolve, so no connection is made.
        feedback: Correct - no response at all is a network error, and fetch rejects with a TypeError.
      - id: five-hundred
        text: The server answers 500 Internal Server Error.
        feedback: A 500 is a response. fetch resolves with ok false; your code must check it.
      - id: four-oh-one
        text: The server answers 401 because the session expired.
        feedback: Still a response - fetch resolves, status 401, ok false.
      - id: empty
        text: The server answers 200 with an empty JSON array.
        feedback: That's a success with no data - the empty state, not an error.
    correct: [dns]
    solution: |
      `fetch` rejects only when there is no response (a network error, rejected with a `TypeError`) or when the
      request is aborted (`AbortError`). Every HTTP status, including 401 and 500, resolves with a `Response`
      whose `ok` is false outside 200-299. Clients must check `response.ok` themselves.

  - id: place-nested-routes
    type: mcq
    concept: client-side-routing
    skill: application
    title: Which URL renders what?
    prompt: |
      ```typescript
      [{ path: '/', Component: Layout, children: [
          { index: true, Component: Home },
          { path: 'orders/:orderId', Component: OrderDetail },
          { path: '*', Component: NotFound },
      ] }]
      ```

      `Layout` renders a navigation and an `<Outlet />`. What does `/orders` render?
    options:
      - id: layout-notfound
        text: Layout with NotFound in its outlet.
        feedback: Correct - no route matches /orders exactly (orders/:orderId needs a second segment), so the splat route matches, inside Layout.
      - id: layout-home
        text: Layout with Home in its outlet.
        feedback: The index route renders only at the parent's own URL, "/".
      - id: orderdetail-undefined
        text: OrderDetail with params.orderId undefined.
        feedback: A dynamic segment isn't optional unless it ends with "?"; orders/:orderId doesn't match /orders.
      - id: notfound-alone
        text: NotFound without the Layout.
        feedback: The '*' route is a child of the root, so it renders through Layout's Outlet.
    correct: [layout-notfound]
    solution: |
      `orders/:orderId` needs a value for `:orderId`, so `/orders` doesn't match it. The index route only matches
      `/`. The `'*'` splat matches anything else, and because it is a child of the root, it renders in Layout's
      `<Outlet />`: the navigation stays, and NotFound fills the page area.

  - id: place-loader-abort
    type: mcq
    concept: route-loaders-and-pending-states
    skill: application
    title: The slow order and the impatient merchant
    prompt: |
      In data mode, the merchant clicks ORD-1001 (whose loader takes 5 seconds), then after 1 second clicks
      ORD-1002 (fast). The loaders pass `request.signal` to `fetch`. What happens?
    options:
      - id: aborted-latest
        text: ORD-1001's request is aborted and ORD-1002 renders; ORD-1001 never replaces it.
        feedback: Correct - the router cancels the interrupted navigation's request signal and commits only the latest navigation.
      - id: both-render
        text: ORD-1002 renders, then ORD-1001 replaces it when its response arrives.
        feedback: That is the classic Effect race. Loaders don't have it - the router ignores stale navigations and aborts their signal.
      - id: queue
        text: The router waits for ORD-1001 to finish, then loads ORD-1002.
        feedback: Navigations aren't queued; a new one interrupts the pending one, like a browser does.
      - id: blank
        text: The page goes blank until both requests finish.
        feedback: The previous page stays on screen while loading; nothing goes blank.
    correct: [aborted-latest]
    solution: |
      React Router handles navigations like a browser: a new navigation cancels the pending one. It aborts the
      first loader's `request.signal` (so a `fetch` given that signal is cancelled) and commits only the latest
      navigation's data. While loading, the previous page stays on screen.

recall:
  - id: recall-pushstate
    concept: client-side-routing
    prompt: Does history.pushState() fire a popstate event?
    answer: No. pushState adds a history entry and changes the URL without reloading; popstate fires when the user traverses history (Back, Forward, history.back()).
  - id: recall-outlet
    concept: client-side-routing
    prompt: Where does a nested route render, and what is a layout route?
    answer: In its parent's <Outlet />. A layout route has no path - it wraps its children in UI without adding a URL segment.
  - id: recall-deep-link
    concept: client-side-routing
    prompt: Why can a deep link 404 on a static host, and what are the two fixes?
    answer: The browser requests that path from the server, which has no such file. Configure a fallback to index.html, or use hash routes (the part after # is never sent).
  - id: recall-loader-parallel
    concept: route-loaders-and-pending-states
    prompt: Name two problems loaders solve compared with fetching in Effects.
    answer: Waterfalls (all matched loaders start in parallel when the navigation starts) and races (the router aborts an interrupted navigation's request.signal and commits only the latest). Also no flash of empty UI - the old page stays while loading.
  - id: recall-not-found
    concept: route-loaders-and-pending-states
    prompt: How does a loader signal "not found", and how does the boundary recognise it?
    answer: "It throws data('Order not found', { status: 404 }); the closest route ErrorBoundary reads useRouteError() and checks isRouteErrorResponse(error), then shows error.status and error.data."
  - id: recall-boundary-placement
    concept: route-loaders-and-pending-states
    prompt: How do you keep the navigation visible when a page's loader fails?
    answer: Put an ErrorBoundary on a route below the layout route; the error renders in the layout's Outlet instead of replacing the layout.
  - id: recall-fetch-reject
    concept: fetch-response-handling
    prompt: When does the fetch() promise reject?
    answer: Only on a network error (no response - a TypeError) or an abort (AbortError). HTTP error statuses resolve with response.ok false.
  - id: recall-client
    concept: fetch-response-handling
    prompt: Four things a typed fetch client should do.
    answer: Check response.ok and throw a typed error with the status; pass an AbortSignal and rethrow aborts unchanged; map network errors to a clear error; validate the JSON body with a parser instead of casting it.

