id: react-forms-and-validation
title: Forms and validation in React
subject: fullstack
module: react-frontend
level: intermediate
status: published
estimatedMinutes: 65
summary: Build React forms that hold their state predictably, validate on the client for the user and on the server for safety, announce errors accessibly, and submit exactly once - with controlled inputs, React 19 form Actions, useActionState and useFormStatus.
tags:
  [
    react,
    forms,
    controlled input,
    uncontrolled input,
    validation,
    constraint validation,
    aria-invalid,
    aria-describedby,
    WCAG 3.3.1,
    useActionState,
    useFormStatus,
    form action,
    double submit,
    idempotency key,
    server errors,
  ]

environment: |
  - **Versions:** React and React DOM **19.2.9** (pinned in `practice/fullstack`), TypeScript 6.0, Vitest 5.0
    with jsdom 30.1, `@testing-library/react` 16.3.3 and `@testing-library/user-event` 14.6.8, Node.js 24.
    `useActionState` and `useFormStatus` exist in React 19 and later only. react.dev documented React 19.3 when
    it was read (it names `useActionState`'s arguments `reducerAction` and `dispatchAction`); everything taught
    here was also run with 19.2.9.
  - **Sources (read 2026-11-14):** react.dev -
    [Reacting to Input with State](https://react.dev/learn/reacting-to-input-with-state),
    [`<input>`](https://react.dev/reference/react-dom/components/input),
    [`<form>`](https://react.dev/reference/react-dom/components/form),
    [useActionState](https://react.dev/reference/react/useActionState),
    [useFormStatus](https://react.dev/reference/react-dom/hooks/useFormStatus).
    WHATWG HTML Living Standard -
    [4.10.20 Constraints and 4.10.21.4 Security](https://html.spec.whatwg.org/multipage/form-control-infrastructure.html).
    W3C [WCAG 2.2](https://www.w3.org/TR/WCAG22/) success criteria 3.3.1, 3.3.2, 3.3.3 and 4.1.3, and
    [WAI-ARIA 1.2](https://www.w3.org/TR/wai-aria-1.2/) (`aria-invalid`, `aria-describedby`,
    `aria-errormessage`). Quotations are from these pages.
  - **Run, not assumed:** the two React warnings quoted in this lesson were printed by React 19.2.9 under Vitest
    (development build). The form-reset behaviour, the `useFormStatus` placement rule and the entangled-Action
    behaviour were observed in the `practice/fullstack/tests/react-forms` tests, which fail against the
    unsolved exercises and pass against the reference solutions.
  - **Fictional:** the SandPay merchant dashboard, its orders (`ord_1001`), refunds (`re_2001`) and API
    answers are invented. Amounts are integers in minor units (cents).

prerequisites: [react-state-and-effects, html-semantics-and-forms]

concepts:
  - id: react-controlled-inputs
    name: Controlled and uncontrolled inputs
    summary: A controlled input shows the value React state gives it and reports every change through onChange, so the form state is always in React; an uncontrolled input keeps its own value in the DOM and React reads it on submit (FormData, a ref) or sets only a defaultValue. A field must stay one or the other for its whole life.
  - id: form-validation-layers
    name: Client and server validation
    summary: Client-side validation (HTML constraints or your own rules) exists to help the user fix mistakes early; it can be bypassed, so the server validates every request again and the form must show the server's errors on the right fields. Values are parsed into the types the API needs (minor units, not floats) before they are sent.
  - id: accessible-form-errors
    name: Accessible error messages
    summary: Each error is shown as text, the field is marked aria-invalid, the message is tied to the field with aria-describedby (or aria-errormessage), and focus moves to the first invalid field on submit - which is how WCAG 2.2 success criteria 3.3.1 and 3.3.3 are met in practice.
  - id: react-form-submission
    name: Submitting once - pending state, Actions and retries
    summary: A form shows that it is submitting and accepts one submission at a time (an in-flight guard plus a disabled button); React 19 Actions (form action, useActionState, useFormStatus) manage pending state and reset uncontrolled fields after the Action; when the outcome is unknown, a retry of the same request reuses its idempotency key.

objectives:
  - Choose between a controlled and an uncontrolled input for a field, and fix the two warnings React gives when a field is wired wrongly.
  - Explain why client-side validation is for the user and server-side validation is for safety, and map a server's field errors back onto the form.
  - Parse a typed amount into integer minor units and validate it against format, zero and a refundable limit.
  - Write error markup that meets WCAG 2.2 3.3.1 and 3.3.3 - text, aria-invalid, aria-describedby, focus on the first invalid field - and test it.
  - Build a form with React 19 Actions, useActionState and useFormStatus, and predict when React resets its fields.
  - Prevent double submission and design a retry after a network failure that cannot create a second refund.

sections:
  - id: intuition
    kind: intuition
    concepts: [react-controlled-inputs, form-validation-layers]
    title: The idea in plain language
    body: |
      A form is a **conversation with a counter clerk**. You fill in a paper slip (the inputs). A good clerk
      glances at it before you leave the queue - "you wrote the amount with a comma, and there's no reason" -
      so you can fix it on the spot. That glance is **client-side validation**: it is a courtesy.

      Then the slip goes to the back office, which checks everything again, because anyone could have
      forged a slip or skipped the queue. That is **server-side validation**: it is the rule. If the back
      office rejects a line, the clerk has to show you **which line** and why - not just "error".

      Two more habits make a clerk trustworthy. They tell you clearly what is wrong, in words, next to the
      line, even if you can't see well (**accessible errors**). And while your slip is being processed, they
      don't accept the same slip twice because you tapped the counter again (**one submission at a time**).
      If the back office line goes dead mid-call, they don't write a new slip - they call again quoting the
      **same reference number**, so the office can tell it's the same request (the
      [idempotency key](#/lesson/idempotency-keys)).

  - id: what-controlled
    kind: what
    concepts: [react-controlled-inputs]
    title: Controlled and uncontrolled inputs
    body: |
      React gives you two ways to own a field's value.

      | | Controlled | Uncontrolled |
      | --- | --- | --- |
      | Who holds the value | React state | the DOM element itself |
      | Props | `value` (or `checked`) **and** `onChange` | optionally `defaultValue` (or `defaultChecked`) |
      | Read the value | from state, at any time | on submit with `FormData`, or through a ref |
      | Good for | instant feedback, dependent fields, formatting, re-validating as the user types | simple forms, React 19 `<form action>`, big forms where per-keystroke renders matter |

      react.dev puts the contract plainly: when you pass `value` or `checked`, "you must also pass an
      `onChange` handler that updates the passed value". `defaultValue` "specifies the initial value for a
      text input" and is "only relevant for uncontrolled inputs".

      **One field, one mode, for its whole life.** React warns when a field switches - most often because
      `value` started as `undefined` (data not loaded yet) and later became a string. react.dev: "A
      controlled component should always receive a string `value`, not `null` or `undefined`" - initialise
      with `''` or pass `value={someValue ?? ''}`.

  - id: code-controlled
    kind: code
    concepts: [react-controlled-inputs]
    title: Both modes, and the warnings you get when they are mixed
    body: |
      ```typescript
      // Controlled: state is the single source of truth.
      const [amount, setAmount] = useState('');
      <input value={amount} onChange={(e) => setAmount(e.target.value)} />

      // Uncontrolled: the DOM keeps the value; read it when the form is submitted.
      function handleSubmit(e: FormEvent<HTMLFormElement>) {
        e.preventDefault();
        const data = new FormData(e.currentTarget);
        const amount = String(data.get('amount') ?? '');
      }
      <form onSubmit={handleSubmit}>
        <input name="amount" defaultValue="" />
      </form>
      ```

      Run under React 19.2.9 (development build), the two classic mistakes print these warnings:

      ```plaintext
      <input value="12.50" />   (no onChange)
      You provided a `value` prop to a form field without an `onChange` handler. This will render a
      read-only field. If the field should be mutable use `defaultValue`. Otherwise, set either `onChange`
      or `readOnly`.

      <input value={undefined} onChange={...} />  later  value="5"
      A component is changing an uncontrolled input to be controlled. This is likely caused by the value
      changing from undefined to a defined value, which should not happen. Decide between using a
      controlled or uncontrolled input element for the lifetime of the component.
      ```

      The first shows up to a tester as **"I can't type in the field"**; the second as a field that ignores
      the loaded value or loses what the user typed.

  - id: why-two-layers
    kind: why
    concepts: [form-validation-layers]
    title: Why validate twice
    body: |
      The HTML Standard (4.10.21.4 Security) is blunt about the browser's own form checks:

      > Servers should not rely on client-side validation. Client-side validation can be intentionally
      > bypassed by hostile users, and unintentionally bypassed by users of older user agents or automated
      > tools that do not implement these features. The constraint validation features are only intended to
      > improve the user experience, not to provide any kind of security mechanism.

      The same holds for your React checks: anyone can call the API with `curl`, edit the request in DevTools
      or use an old version of the app. So the work splits cleanly:

      | Layer | Purpose | What it checks |
      | --- | --- | --- |
      | **Client** (browser, React) | help the user fix mistakes **before** a round trip | required fields, format, obvious ranges, what the screen already knows (refundable amount) |
      | **Server** (API) | protect data and money, **always** | everything the client checks, plus what only the server knows: current balances, permissions, duplicates, a refund already in progress |

      Two consequences for the form. It must **display server errors** - per field when the API says which
      field (`{ "fieldErrors": { "amount": "..." } }`, or `errors` in a Problem Details body,
      [RFC 9457](#/lesson/status-codes-and-errors)) and as a general message otherwise. And the client rules
      should be a **subset** of the server's, ideally shared code or a shared schema, so the two never
      disagree. Server-side validation is taught in
      [Input validation and error handling](#/lesson/input-validation-and-error-handling).

  - id: visual-submit
    kind: visual
    concepts: [form-validation-layers, accessible-form-errors, react-form-submission]
    title: One submit, from click to result
    body: |
      ```mermaid
      flowchart TD
        A[Submit - click or Enter] --> B{Already submitting?}
        B -- yes --> Z[Ignore]
        B -- no --> C[Validate on the client]
        C --> D{Errors?}
        D -- yes --> E[Show text errors, aria-invalid, focus the first invalid field]
        D -- no --> F[Disable the button, keep or make the idempotency key, send]
        F --> G{Response}
        G -- ok --> H[Show success as a status message]
        G -- field errors --> I[Show them on their fields, focus the first]
        G -- network failure --> J[Outcome unknown - alert, allow retry with the same key]
        J --> A
      ```

      Notice that there are **two** places that produce field errors - the client check and the server's
      answer - and both end in the **same** accessible display. Notice also that the network-failure branch
      loops back with the **same key**: the form doesn't know whether the refund exists.

  - id: internals-constraints
    kind: internals
    concepts: [form-validation-layers]
    title: HTML constraint validation or your own rules
    body: |
      Browsers validate forms by themselves (WHATWG HTML 4.10.20 "Constraints"): `required`, `min`, `max`,
      `pattern`, `maxlength`, `type="email"` and so on. On submit, a form with invalid controls is not
      submitted, and the browser shows its own bubble. The Constraint Validation API lets scripts join in:
      `input.validity.valueMissing`, `checkValidity()`, `reportValidity()` and `setCustomValidity(message)`
      (a non-empty message puts the control into the "custom error" state). The `novalidate` attribute on the
      form, `noValidate` in JSX, switches the browser's check off at submit time
      ([HTML forms](#/lesson/html-semantics-and-forms) covers the details).

      **Which to use in a React app?**

      - **Native only** - zero code, works before JavaScript loads. But the bubble's wording and look come
        from the browser, it disappears after a moment, and some rules can't be expressed (a refundable limit
        that depends on other data, "at most two decimals" in a locale-aware way).
      - **Custom only** (`noValidate` + your rules in React) - your wording, persistent messages next to the
        field, the same rules as the server. This is what most product forms do, and what this lesson builds.
      - **Both** - keep `required` and `type` for semantics and as a fallback, and add `noValidate` only when
        your custom display is ready.

      **When to show errors.** Validating on every keystroke before the first submit shouts at people who
      haven't finished typing. A common, user-friendly pattern: validate **on submit**; after the first failed
      submit, **re-check as the user corrects** each field so the error disappears the moment it is fixed.
      (CSS has the same idea: `:user-invalid` matches only after the user has interacted.)

  - id: code-parse
    kind: code
    concepts: [form-validation-layers]
    title: Parse, then validate - amounts in minor units
    body: |
      A text field gives you a **string**. Don't send `Number("12.5") * 100` - floating point turns some
      amounts into `1249.9999...` ([amounts and rounding](#/lesson/amounts-currency-rounding)). Parse the
      string into integer minor units, then check the rules in order, one message per field:

      ```typescript
      /** "12.5" -> 1250; null when the text is not a plain amount with at most two decimals. */
      export function parseAmount(text: string): number | null {
        const match = /^(\d{1,7})(?:\.(\d{1,2}))?$/.exec(text.trim());
        if (!match) return null;
        const units = Number(match[1]);
        const cents = Number((match[2] ?? '').padEnd(2, '0'));
        return units * 100 + cents;
      }

      function validate(amount: string, reason: string, refundableMinor: number, currency: string) {
        const errors: Partial<Record<'amount' | 'reason', string>> = {};
        if (amount.trim() === '') errors.amount = 'Enter the amount to refund.';
        else {
          const minor = parseAmount(amount);
          if (minor === null) errors.amount = 'Enter the amount like 12.50.';
          else if (minor === 0) errors.amount = 'The amount must be more than 0.00.';
          else if (minor > refundableMinor)
            errors.amount = `You can refund at most ${formatMinor(refundableMinor)} ${currency}.`;
        }
        if (reason === '') errors.reason = 'Choose a reason.';
        return errors;
      }
      ```

      Each message **says how to fix it** ("like 12.50", "at most 30.00 EUR") - that is WCAG 3.3.3 Error
      Suggestion. The pattern accepts only a dot as the decimal separator; a product for several locales
      would parse with the user's locale and still send minor units.

  - id: what-accessible
    kind: what
    concepts: [accessible-form-errors]
    title: Errors everyone can find
    body: |
      WCAG 2.2 has three success criteria that every form error display must meet:

      - **3.3.1 Error Identification (Level A):** "If an input error is automatically detected, the item that
        is in error is identified and the error is described to the user in text."
      - **3.3.2 Labels or Instructions (Level A):** "Labels or instructions are provided when content
        requires user input."
      - **3.3.3 Error Suggestion (Level AA):** "If an input error is automatically detected and suggestions
        for correction are known, then the suggestions are provided to the user, unless it would jeopardize
        the security or purpose of the content."

      In markup, that becomes four habits:

      1. **The message is text** next to the field - not only a red border or an icon.
      2. **The field is marked invalid:** `aria-invalid="true"` - WAI-ARIA: it "indicates the entered value
         does not conform to the format expected by the application". Remove it (or set `false`) once fixed.
      3. **The message is tied to the field:** `aria-describedby="<id of the message>"` - the referenced
         elements are the field's description, so a screen reader reads the label, then the error, when the
         field gets focus. `aria-describedby` can list several ids (a hint **and** an error).
         `aria-errormessage` is the dedicated attribute - WAI-ARIA: "Authors MUST use `aria-invalid` in
         conjunction with `aria-errormessage`" - but `aria-describedby` has wider screen-reader support, which
         is why many teams use it; check current support before relying on `aria-errormessage` alone.
      4. **Focus moves to the first invalid field** on submit, so keyboard and screen-reader users land
         where the work is. Messages that appear **without** focus moving - "Refund re_2001 created", "We
         could not reach SandPay" - are status messages (WCAG 4.1.3): use `role="status"` for news and
         `role="alert"` for problems, as in [the accessibility lesson](#/lesson/web-accessibility-wcag).

  - id: code-accessible
    kind: code
    concepts: [accessible-form-errors]
    title: The markup, generated by React
    body: |
      ```typescript
      const id = useId();
      const amountError = errors.amount;

      <label htmlFor={`${id}-amount`}>Amount ({order.currency})</label>
      <input
        id={`${id}-amount`}
        ref={amountRef}
        name="amount"
        inputMode="decimal"
        value={amount}
        onChange={(e) => change('amount', e.target.value)}
        aria-invalid={amountError ? true : undefined}
        aria-describedby={amountError ? `${id}-hint ${id}-amount-error` : `${id}-hint`}
      />
      {amountError && <p id={`${id}-amount-error`}>{amountError}</p>}
      ```

      `useId` gives ids that are unique per component instance, so two refund forms on one page don't share
      `amount-error`. `aria-invalid={... ? true : undefined}` removes the attribute when the field is valid,
      instead of rendering `aria-invalid="false"` everywhere. After the client check:

      ```typescript
      const found = validate(amount, reason, refundableMinor, order.currency);
      setErrors(found);
      if (found.amount) amountRef.current?.focus();
      else if (found.reason) reasonRef.current?.focus();
      ```

      Focusing in the event handler is fine: the DOM nodes already exist, and the message nodes appear in the
      same commit, so the screen reader reads the label and the new description together.

  - id: what-actions
    kind: what
    concepts: [react-form-submission, react-controlled-inputs]
    title: React 19 form Actions
    body: |
      React 19 adds a second way to submit. Instead of `onSubmit` + `preventDefault()`, pass a **function**
      to the form's `action` prop. react.dev: React "calls the function with a FormData object containing the
      values" of the form's named fields, runs the submission **in a Transition**, and manages pending state.
      Rules worth remembering (react.dev `<form>` caveats):

      - With a function in `action` or `formAction`, "the HTTP method will be POST regardless of the value of
        the `method` prop".
      - "React resets all uncontrolled field elements after the Action succeeds." **Succeeds means "did not
        throw"** - react.dev's troubleshooting: "Returning a validation error instead of throwing also
        triggers this reset." To keep what the user typed, put the value in state and pass it as the field's
        `defaultValue`; "React applies the updated defaults before resetting the form".
      - Errors **thrown** by the action go to the nearest Error Boundary - so expected problems (validation,
        a rejected note) are **returned** as state, not thrown.

      Two hooks build on it:

      - **`useActionState(action, initialState)`** returns `[state, formAction, isPending]`. Your action
        receives the **previous state** first and the `FormData` second, and whatever it returns becomes the
        new state - a reducer that may be async. Calls are queued and run one after another.
      - **`useFormStatus()`** from `react-dom` returns `{ pending, data, method, action }` for the **parent**
        form. react.dev: it "must be called from a component that is rendered inside a `<form>`" and "will not
        return status information for any `<form>` rendered in that same component". Calling it next to the
        `<form>` it should watch is a silent bug: `pending` is always `false`.

  - id: code-actions
    kind: code
    concepts: [react-form-submission]
    title: An order note with useActionState and useFormStatus
    body: |
      ```typescript
      import { useActionState } from 'react';
      import { useFormStatus } from 'react-dom';

      function SaveButton() {
        const { pending } = useFormStatus(); // the status of the <form> this button is inside
        return (
          <button type="submit" disabled={pending}>
            {pending ? 'Saving...' : 'Save note'}
          </button>
        );
      }

      export function OrderNoteForm({ orderId, saveNote }: Props) {
        async function noteAction(previous: NoteState, formData: FormData): Promise<NoteState> {
          const note = String(formData.get('note') ?? '').trim();
          if (note === '') return { ...previous, draft: '', error: 'Write a note first.' };
          const result = await saveNote(orderId, note);
          if (!result.ok) return { ...previous, draft: note, error: result.error }; // keep the text
          return { draft: '', error: '', saved: previous.saved + 1 };
        }

        const [state, formAction] = useActionState(noteAction, { draft: '', error: '', saved: 0 });
        const id = useId();

        return (
          <form action={formAction}>
            <label htmlFor={`${id}-note`}>Internal note</label>
            <textarea
              id={`${id}-note`}
              name="note"
              defaultValue={state.draft}
              aria-invalid={state.error ? true : undefined}
              aria-describedby={state.error ? `${id}-error` : undefined}
            />
            {state.error && <p id={`${id}-error`}>{state.error}</p>}
            {state.saved > 0 && <p role="status">Note saved.</p>}
            <SaveButton />
          </form>
        );
      }
      ```

      The textarea is **uncontrolled**: React resets it after every Action, and `defaultValue={state.draft}`
      decides what it resets to - the rejected note after an error, empty after a save.

  - id: line-by-line
    kind: line-by-line
    concepts: [react-form-submission]
    title: Why the important lines are written that way
    body: |
      - **`function SaveButton()` is a separate component** - `useFormStatus` reports on the `<form>` above
        the component that calls it. Inlined in `OrderNoteForm`, the button would never show "Saving...".
        (`useActionState` also returns `isPending`, which works in the same component; `useFormStatus` is for
        reusable buttons that don't know which form they are in.)
      - **`.trim()` before the empty check** - "   " is not a note. The server should apply the same rule.
      - **`return { ...previous, draft: note, error }`** on failure - returning instead of throwing keeps the
        error in the form; setting `draft` keeps the text across React's reset.
      - **`draft: ''` on success** - the reset then empties the textarea, which is what a user expects after
        "Note saved".
      - **`state.saved > 0 && <p role="status">`** - a status message announced without moving focus
        (WCAG 4.1.3).

  - id: double-submit
    kind: internals
    concepts: [react-form-submission]
    title: Submitting exactly once
    body: |
      A refund form that sends two requests can refund twice. Duplicates come from more places than a double
      click: pressing **Enter** twice, a click while the first request is slow, a retry after a timeout, a
      reload that resubmits. Defend in layers:

      1. **An in-flight guard** in the submit handler: `if (inFlight.current) return;`. A **ref** changes
         immediately; a state flag only changes on the next render, and a handler that already started holds
         the old snapshot ([state as a snapshot](#/lesson/react-state-and-effects)). Note that
         `useActionState` **queues** a second dispatch and runs it after the first - sequential, but still a
         second refund - so it is not a duplicate guard on its own.
      2. **A disabled button with a pending label** ("Refunding...") - feedback for the user, and it stops
         most double clicks. On its own it is not enough: Enter still submits a form whose button the
         handler hasn't disabled yet, and scripts don't care about `disabled`.
      3. **An idempotency key per logical request**, created once and reused for retries of the **same**
         request ([idempotency keys](#/lesson/idempotency-keys)). If the network fails, the form can't know
         whether SandPay created the refund - the outcome is unknown
         ([unknown outcomes](#/lesson/declines-timeouts-unknown-outcomes)). The message must say so, and the
         retry sends the same key so the server returns the first result instead of refunding again.
         **Change the request (a different amount), and it needs a new key.**

      ```typescript
      const inFlight = useRef(false);
      const key = useRef<string | null>(null);

      async function handleSubmit(event: FormEvent<HTMLFormElement>) {
        event.preventDefault();
        if (inFlight.current) return;
        // ... validate; return early on errors ...
        inFlight.current = true;
        setPending(true);
        key.current ??= newKey();             // reuse for a retry of the same request
        try {
          const result = await submitRefund({ ...request, idempotencyKey: key.current });
          if (result.ok) { setRefundId(result.refundId); key.current = null; }
          else { setErrors(result.fieldErrors); focusFirst(result.fieldErrors); }
        } catch {
          setProblem('We could not reach SandPay. The refund may not have been created - try again.');
        } finally {
          inFlight.current = false;
          setPending(false);
        }
      }
      ```

      And in `onChange`: `key.current = null` - editing the form makes it a different request.

  - id: example
    kind: example
    concepts: [form-validation-layers, react-form-submission]
    title: "A real incident: two refunds for one click"
    body: |
      A merchant reports that a customer was refunded 30.00 EUR **twice** for `ord_1001`. The SandPay
      dashboard shows two refunds created 1.8 seconds apart, with **different** idempotency keys.

      Reproduction in DevTools: throttle the network to "Slow 4G", fill the refund form, press **Enter**,
      then click **Refund** while the first request is still pending. Two `POST /v1/refunds` requests appear
      in the Network panel, each with its own `Idempotency-Key` header.

      Root cause, layer by layer:

      - The handler set `pending` in **state** and checked it at the top - but the click arrived before the
        re-render, so the second call still saw `pending === false`.
      - The key was generated **inside** the submit handler on every call, so the server could not tell the
        two requests were the same refund.
      - The server's own limit check passed both times, because the second request was validated before the
        first refund was committed - a race the API team fixed separately
        ([transactions and isolation](#/lesson/transactions-and-isolation)).

      The fix in the form: a ref guard, the button disabled while pending, and a key kept per logical request.
      The regression tests: submit twice before the fake API answers (one call), and fail the network then
      retry (same key).

  - id: tests
    kind: tests
    concepts: [form-validation-layers, accessible-form-errors, react-form-submission]
    title: What to test in a form, and the evidence
    body: |
      | Case | Steps | Expected | Evidence |
      | --- | --- | --- | --- |
      | Empty submit | click Refund with nothing filled | both errors as text, both fields `aria-invalid="true"`, focus on Amount, **no request** | DOM text, attributes, `document.activeElement`, fake API call count 0 |
      | Error is the description | as above | each field's `aria-describedby` points at its error text | resolve the ids and compare text |
      | Format | type `12,50`, `1.234` | "Enter the amount like 12.50." | text, no request |
      | Boundaries | refundable 30.00: type `0.00`, `30.00`, `30.01` | 0.00 rejected, 30.00 sent as `3000`, 30.01 rejected with the limit | request body |
      | Correcting | after a failed submit, type a valid amount | amount error gone, `aria-invalid` removed; reason error stays | DOM |
      | Server field error | API answers `{ ok: false, fieldErrors: { amount } }` | message under Amount, focus on Amount, button enabled | DOM, focus |
      | Double submit | submit twice before the API answers | exactly one request; button disabled with "Refunding..." | call count, `disabled` |
      | Network failure + retry | API rejects; click again | alert says the refund may exist; second request has the **same** key | alert text, both request bodies |
      | Changed request | after a failure, change the amount and submit | new key | request bodies |
      | Bypass | send an invalid amount directly to the API | the **server** rejects it | API response (tested in the backend lesson) |

      Use a fake API whose promises the **test** resolves or rejects - no real timers, no network. Query by
      role and label (`getByRole('textbox', { name: 'Amount (EUR)' })`), which also proves the labels work
      ([locators by role](#/lesson/playwright-locators-and-assertions)).

  - id: mistakes
    kind: mistakes
    concepts: [react-controlled-inputs, accessible-form-errors, react-form-submission]
    title: Common mistakes and how to debug them
    body: |
      - **"I can't type in the field."** `value` without `onChange` - React's warning in the console says
        so. Add `onChange`, or use `defaultValue`.
      - **The loaded value never appears, or typing is lost.** `value` was `undefined` first: the
        "uncontrolled to controlled" warning. Use `value={x ?? ''}`.
      - **"Saving..." never shows.** `useFormStatus` called in the component that renders the `<form>`.
        Move the button into its own component (or use `isPending` from `useActionState`).
      - **The user's text vanishes after a validation error.** The Action returned an error, React counted
        that as success and reset the uncontrolled fields. Keep the value in state and pass it as
        `defaultValue`.
      - **The error is red but silent.** No text, or text not tied to the field: check the field in the
        DevTools Accessibility pane - its **Description** should be the error.
      - **Errors flash while typing the first character.** Validation runs on every change from the start;
        validate on submit first, then on change.
      - **Double refunds.** A state flag as the only guard, or a new idempotency key per click. Reproduce
        with throttling and two submits; check the request headers.
      - **Amounts off by one cent.** `Number(text) * 100` - parse the string into integer minor units.

      **Debugging method:** reproduce with the Network panel open; read the console for React warnings;
      inspect the field in the Accessibility pane; then write a failing component test with a fake API before
      changing code.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [react-controlled-inputs, react-form-submission]
    title: Trade-offs and alternatives
    body: |
      - **Controlled everywhere** gives instant validation and formatting, at the cost of a re-render per
        keystroke. For most forms that cost is invisible; for very large forms, uncontrolled fields read with
        `FormData` (or a form library built on refs) avoid it.
      - **`<form action>` + `useActionState`** removes most of the pending and sequencing code and works
        with Server Functions, but it resets uncontrolled fields after each Action and runs in a Transition -
        learn those rules before switching. `onSubmit` still works in every React version and gives you the
        event.
      - **Form libraries** (for example React Hook Form or TanStack Form) and **schema validators** (for
        example Zod, used in [the API lessons](#/lesson/input-validation-and-error-handling)) remove
        boilerplate and let the client and server share one schema. They don't change the rules in this
        lesson: validate on the server, display errors accessibly, submit once.
      - **Native validation** works before JavaScript loads and costs nothing, but you give up control of the
        wording and placement of messages.
      - **What a form cannot do:** guarantee uniqueness or money correctness. That is the server's job -
        idempotency keys, database constraints and transactions.

  - id: summary
    kind: summary
    concepts:
      [react-controlled-inputs, form-validation-layers, accessible-form-errors, react-form-submission]
    title: Quick reference
    body: |
      - Controlled = `value` + `onChange`; uncontrolled = `defaultValue` + read on submit. Never switch; use
        `value ?? ''`.
      - Client validation helps the user; the server validates again and the form shows the server's field
        errors.
      - Parse strings into the API's types (integer minor units) before validating limits.
      - Errors: text next to the field, `aria-invalid`, `aria-describedby`, focus the first invalid field; a
        message that says how to fix it (WCAG 3.3.1, 3.3.3).
      - Validate on submit, then re-check as the user corrects.
      - React 19: `<form action={fn}>` gets `FormData`; `useActionState` returns `[state, formAction,
        isPending]`; `useFormStatus` must be in a component **inside** the form; uncontrolled fields reset
        after an Action that doesn't throw.
      - Submit once: ref guard + disabled button + one idempotency key per logical request, reused on retry.

exercises:
  - id: read-only-field
    type: mcq
    concept: react-controlled-inputs
    skill: application
    title: The field you can't type in
    prompt: |
      A tester reports that the refund reason field "doesn't accept typing". The console shows:

      ```plaintext
      You provided a `value` prop to a form field without an `onChange` handler. This will render a
      read-only field. If the field should be mutable use `defaultValue`. ...
      ```

      The component renders `<input name="note" value={note} />`, where `note` comes from `useState('')`.
      What is the right fix?
    options:
      - id: add-onchange
        text: Add onChange={(e) => setNote(e.target.value)} so the input is controlled
        feedback: Correct - a controlled input needs both value and an onChange that updates the state it reads.
      - id: add-readonly
        text: Add readOnly so the warning goes away
        feedback: That silences the warning by making the field officially read-only - the opposite of what the tester needs.
      - id: use-key
        text: Give the input a key so React re-creates it
        feedback: A key resets the element's identity; the value would still be pinned to note, which never changes.
      - id: use-effect
        text: Copy the DOM value into state in a useEffect after each render
        feedback: The DOM value never changes - React keeps putting value back. Effects are not how inputs report changes.
    correct: [add-onchange]
    hints:
      - "Who is allowed to change `note`?"
      - "The warning lists the three ways out - which one keeps the field editable and in state?"
    solution: |
      With `value`, React makes the DOM show exactly `note` on every render. Typing fires a change, nothing
      updates `note`, and React restores the old value. Add `onChange={(e) => setNote(e.target.value)}`
      (controlled), or switch to `defaultValue` and read the value on submit (uncontrolled).
    followUp: |
      The note is loaded from the API and is `null` for orders without a note. What do you pass as `value`,
      and which warning do you avoid?

  - id: uncontrolled-to-controlled
    type: debug
    concept: react-controlled-inputs
    skill: analysis
    title: The loaded amount never shows
    prompt: |
      The edit form should show the refund's saved amount after it loads, but the field stays empty and the
      console says "A component is changing an uncontrolled input to be controlled". Click the line that
      causes it.
    language: typescript
    code: |
      function EditRefund({ load }: { load: () => Promise<{ amount: string }> }) {
        const [refund, setRefund] = useState<{ amount: string } | null>(null);

        useEffect(() => {
          let ignore = false;
          load().then((r) => { if (!ignore) setRefund(r); });
          return () => { ignore = true; };
        }, [load]);

        return (
          <input
            aria-label="Amount"
            value={refund?.amount}
            onChange={(e) => setRefund({ amount: e.target.value })}
          />
        );
      }
    correctLines: [13]
    lineNotes:
      - line: 2
        note: Starting with null is fine for the loaded object - the problem is what you pass to value while it is null.
      - line: 5
        note: The fetch and its ignore flag are correct.
    hints:
      - "What is `refund?.amount` before the data arrives?"
      - "React decides controlled versus uncontrolled from whether value is undefined."
    solution: |
      **Line 13.** Before loading, `refund?.amount` is `undefined`, so React treats the input as
      **uncontrolled**; when the data arrives it becomes a string and the input switches to controlled.
      react.dev: a controlled component "should always receive a string value, not null or undefined". Use
      `value={refund?.amount ?? ''}` - or don't render the form until the data is loaded.

  - id: which-layer
    type: mcq
    concept: form-validation-layers
    skill: application
    title: The client check that wasn't enough
    prompt: |
      The refund form blocks amounts above the refundable 30.00 EUR. A tester sends this directly with curl
      and gets `201 Created` for a 500.00 EUR refund:

      ```http
      POST /v1/refunds HTTP/1.1
      Host: api.sandpay.example
      Content-Type: application/json

      {"orderId": "ord_1001", "amountMinor": 50000, "reason": "duplicate"}
      ```

      What is the defect, and where is it fixed?
    options:
      - id: server-missing
        text: The API doesn't validate the limit - fix it on the server; the form's check is only for the user
        feedback: Correct - client validation can be bypassed by design; the server must enforce every rule.
      - id: form-weak
        text: The form's check is too weak - add HTML max as well as the React check
        feedback: The request didn't come from the form at all. No client-side rule can stop curl.
      - id: tester-misuse
        text: Not a defect - real users go through the form
        feedback: Attackers and buggy clients don't. The HTML Standard says servers should not rely on client-side validation.
      - id: cors
        text: CORS should have blocked the request
        feedback: CORS restricts what browsers let pages read; it does nothing to curl or to the server's validation.
    correct: [server-missing]
    hints:
      - "Did this request pass through the React form?"
      - "Which layer exists for safety, and which for convenience?"
    solution: |
      **The API is missing the check.** Client-side validation "can be intentionally bypassed by hostile
      users" (HTML Standard 4.10.21.4) - curl never runs your React code. The server must reject the request
      (for example 422 with a field error for `amountMinor`), and the form keeps its check so honest users get
      instant feedback. File it as a server defect, severity high: money can leave the merchant's account.

  - id: server-error-flow
    type: order
    concept: form-validation-layers
    skill: application
    title: From submit to a server's field error
    prompt: |
      The client check passes, but SandPay rejects the refund because one is already pending. Put the steps
      in order.
    items:
      - id: client-check
        text: Run the client rules; there are no errors
      - id: pending
        text: Mark the form as submitting and disable the button
      - id: send
        text: Send the request with the idempotency key
      - id: server-check
        text: The server validates again and answers with a field error for amount
      - id: map
        text: Put the server's message under the Amount field and set aria-invalid
      - id: focus
        text: Move focus to Amount and re-enable the button
    hints:
      - "Nothing goes on the wire until the client rules pass."
      - "The server's message must end up in the same place as a client error."
    solution: |
      **Client check → pending → send → server check → map to the field → focus and re-enable.** The server
      always has the last word, and its field errors are displayed exactly like the client's - text,
      `aria-invalid`, `aria-describedby`, focus.

  - id: accessible-markup
    type: mcq
    concept: accessible-form-errors
    skill: application
    title: Which error markup is accessible?
    prompt: |
      The amount is invalid. Which markup meets WCAG 2.2 3.3.1 and lets a screen reader read the error when
      the field gets focus?
    options:
      - id: described
        text: |
          <input id="amt" aria-invalid="true" aria-describedby="amt-err"> with <p id="amt-err">Enter the amount like 12.50.</p>
        feedback: Correct - the error is text, the field is marked invalid and the text is the field's description.
      - id: red-border
        text: <input id="amt" class="error"> with a red border in CSS
        feedback: Colour alone doesn't identify the error in text (3.3.1), and a screen reader hears nothing.
      - id: placeholder
        text: <input id="amt" placeholder="Enter the amount like 12.50.">
        feedback: A placeholder disappears when the user types and is not an error state; nothing says the value is invalid.
      - id: title
        text: <input id="amt" title="Invalid">
        feedback: A tooltip only on hover is invisible to keyboard and touch users, and "Invalid" doesn't say how to fix it (3.3.3).
    correct: [described]
    hints:
      - "3.3.1 asks for the error to be described in text."
      - "How does the message get announced together with the field?"
    solution: |
      Text, `aria-invalid="true"` and `aria-describedby` pointing at the message. The message also says how
      to fix it, which covers 3.3.3 Error Suggestion. Add focus on the first invalid field after submit.

  - id: errors-testdesign
    type: testdesign
    concept: accessible-form-errors
    skill: application
    title: Test the error experience, not only the rules
    prompt: |
      Design tests that prove the refund form's errors are accessible - for automated component tests and for
      a short manual check. For each case give preconditions, steps, expected result **and the evidence**.
    hints:
      - "What does a screen-reader user need: where the error is, what it says, how to fix it?"
      - "How can a test read a field's description without a screen reader?"
      - "What should happen to focus, and after the user fixes the field?"
    modelAnswer: |
      Automated (Testing Library, fake API):

      1. **Text and state** - submit empty. Expect each error as text, `aria-invalid="true"` on both fields.
         Evidence: `getByText`, attributes.
      2. **Description** - same state. Resolve each id in `aria-describedby`; expect the error text among them
         (plus the hint). Evidence: the joined text.
      3. **Focus** - after the empty submit, `document.activeElement` is the Amount input; with only the
         reason wrong, focus is on Reason.
      4. **Recovery** - type a valid amount; expect the amount error and `aria-invalid` gone, the reason error
         still there.
      5. **Server errors** - fake API returns a field error; expect the same text/attribute/focus behaviour.
      6. **Status messages** - success shows `role="status"`; a network failure shows `role="alert"`.

      Manual (5 minutes): keyboard only - Tab to Refund, press Enter, confirm focus lands on Amount and a
      screen reader (NVDA, VoiceOver) reads the label, the invalid state and the error (the exact words vary by screen reader);
      check the DevTools Accessibility pane shows the error as the field's Description; zoom to 200% and
      confirm the message is next to its field.
    solution: |
      Cover text, `aria-invalid`, the description (resolve `aria-describedby`), focus on the first invalid
      field, recovery after a fix, server errors displayed the same way, and status/alert roles for messages
      that don't move focus. Back it with a short keyboard and screen-reader check, because automated tests
      can't hear the announcement.
    rubric:
      - Checks text errors and aria-invalid
      - Proves the error is the field's description (aria-describedby resolved)
      - Checks focus on the first invalid field
      - Covers recovery after the user fixes a field
      - Covers server errors and status/alert messages
      - Includes a manual keyboard/screen-reader check with evidence

  - id: form-status-placement
    type: mcq
    concept: react-form-submission
    skill: analysis
    title: Why "Saving..." never appears
    prompt: |
      ```typescript
      function NoteForm({ save }: { save: (data: FormData) => Promise<void> }) {
        const { pending } = useFormStatus();
        return (
          <form action={save}>
            <textarea name="note" />
            <button disabled={pending}>{pending ? 'Saving...' : 'Save note'}</button>
          </form>
        );
      }
      ```

      Saving takes two seconds, but the button never changes. Why?
    options:
      - id: parent-only
        text: useFormStatus reports on a parent form; here the form is rendered by the same component, so pending stays false
        feedback: Correct - move the button into its own component rendered inside the form.
      - id: needs-action-state
        text: useFormStatus only works together with useActionState
        feedback: It works with any function passed to a form's action; the problem is where it is called.
      - id: not-async
        text: save must return a value for React to track it
        feedback: An async function returning nothing is fine - React tracks the promise, not its value.
      - id: button-type
        text: The button needs type="submit"
        feedback: A button in a form submits by default, and the form does submit here - only the status is missing.
    correct: [parent-only]
    hints:
      - "Read the useFormStatus caveat: status of which form?"
      - "Is there a <form> above NoteForm?"
    solution: |
      react.dev: `useFormStatus` "must be called from a component that is rendered inside a `<form>`" and "will
      not return status information for any `<form>` rendered in that same component". Extract
      `function SaveButton() { const { pending } = useFormStatus(); ... }` and render `<SaveButton />` inside
      the form - or use the `isPending` value from `useActionState` in `NoteForm`.

  - id: reset-after-error
    type: mcq
    concept: react-form-submission
    skill: analysis
    title: The note disappears after an error
    prompt: |
      A form uses `useActionState`. Its action returns `{ error: 'Notes are read-only for settled orders.' }`
      when the server refuses. The message appears - but the merchant's text in the uncontrolled textarea is
      gone. What happened?
    options:
      - id: reset-on-success
        text: The Action didn't throw, so React treated it as successful and reset the uncontrolled fields
        feedback: Correct - returning an error is a successful Action for React. Keep the text as state and pass it as defaultValue.
      - id: rerender-loses
        text: Any re-render clears uncontrolled fields
        feedback: Re-renders don't touch an uncontrolled field's DOM value; this is the specific reset after a form Action.
      - id: should-throw
        text: The action must throw on errors to keep the text
        feedback: Throwing does skip the reset, but the error then goes to an Error Boundary instead of next to the field.
      - id: server-cleared
        text: The server cleared the note because it refused it
        feedback: The server can't touch the browser's textarea; the reset happens in React.
    correct: [reset-on-success]
    hints:
      - "Read the <form> caveat: when does React reset uncontrolled fields?"
      - "Is returning an error object 'throwing'?"
    solution: |
      React resets the form's uncontrolled fields after an Action completes **without throwing** - and
      react.dev notes that "returning a validation error instead of throwing also triggers this reset". Return
      the note in the state (`draft: note`) and render `<textarea defaultValue={state.draft} />`; React applies
      the new default before resetting, so the text stays.

  - id: disabled-not-enough
    type: short
    concept: react-form-submission
    skill: analysis
    title: Why a disabled button is not enough
    prompt: |
      A developer says: "We disable the Refund button while the request runs, so duplicate refunds are
      impossible." Give three ways a second refund can still be created, and what stops each one.
    hints:
      - "Think of keyboard, timing and the network."
      - "What happens when the response never arrives?"
    modelAnswer: |
      1. **Enter or a fast second event before the re-render** - the handler starts again with a snapshot where
         `pending` is still false. Stop it with a ref guard (`inFlight.current`) checked and set synchronously.
         (Actions queued by `useActionState` run one after another, so they would still send a second
         request.)
      2. **A retry after a network failure or timeout** - the first refund may exist. Reuse the same
         idempotency key for the retry so the server returns the first result.
      3. **Another client or tab** (or a script calling the API) - the button doesn't exist there. The server
         must enforce idempotency and its limits (refundable amount) in a transaction.
    solution: |
      Disabling only helps when the browser re-renders in time and the request goes through the form.
      Guard the handler with a ref, keep one idempotency key per logical request and reuse it on retry, and
      rely on the server's idempotency and limit checks for everything outside this form.
    rubric:
      - Names a timing case (Enter, fast double event) and the ref guard
      - Names the retry after an unknown outcome and the reused idempotency key
      - Names a path outside the form and the server-side protection

  - id: refund-form-coding
    type: coding
    concept: form-validation-layers
    skill: application
    title: A refund form that validates, explains and submits once
    prompt: |
      `RefundForm` renders and sends a request - and that is all it does. Make it validate on submit (empty,
      format, zero, refundable limit, reason), show accessible errors and focus the first, re-check as the user
      corrects, send amounts in minor units, submit one request at a time with a pending button, show the API's
      field errors, and after a network failure let a retry reuse the same idempotency key. The tests list the
      exact messages.
    project: fullstack
    files:
      - exercises/react-forms/RefundForm.tsx
    test: tests/react-forms/refund-form.test.tsx
    command: npx vitest run tests/react-forms/refund-form.test.tsx
    hints:
      - "Start with the first failing test: an empty submit. Write a validate function that returns an errors object."
      - "Store errors in state; render aria-invalid and aria-describedby from it; focus with refs."
      - "Use a ref for the in-flight guard and another for the idempotency key; clear the key when a field changes or after success."
    modelAnswer: |
      ```typescript
      const inFlight = useRef(false);
      const key = useRef<string | null>(null);

      function change(field: Field, value: string) {
        const next = { amount, reason, [field]: value };
        if (field === 'amount') setAmount(value); else setReason(value);
        key.current = null; // a different request needs a different key
        if (submitted) setErrors(validate(next.amount, next.reason, refundableMinor, order.currency));
      }

      async function handleSubmit(event: FormEvent<HTMLFormElement>) {
        event.preventDefault();
        if (inFlight.current) return;
        setSubmitted(true);
        setProblem('');
        const found = validate(amount, reason, refundableMinor, order.currency);
        setErrors(found);
        if (Object.keys(found).length > 0) { focusFirst(found); return; }
        inFlight.current = true;
        setPending(true);
        key.current ??= newKey();
        try {
          const result = await submitRefund({
            orderId: order.id, amountMinor: parseAmount(amount) ?? 0, reason, idempotencyKey: key.current,
          });
          if (result.ok) { setRefundId(result.refundId); key.current = null; }
          else { setErrors(result.fieldErrors); focusFirst(result.fieldErrors); }
        } catch {
          setProblem('We could not reach SandPay. The refund may not have been created - try again.');
        } finally {
          inFlight.current = false;
          setPending(false);
        }
      }
      ```

      The validation runs before anything is sent; client and server errors share one display (text,
      `aria-invalid`, `aria-describedby`, focus). The ref guard works even before React re-renders, and the key
      survives a failed attempt but not an edit.
    solution: |
      Validate into an errors object, render it accessibly and focus the first invalid field; after the first
      submit, re-validate in `onChange`. Parse the amount with `parseAmount`. Guard with a ref, disable the
      button with a pending label, keep one idempotency key per logical request, and map the API's field
      errors and network failures to the form. The reference is `solutions/react-forms/RefundForm.tsx`.
    rubric:
      - Every test in refund-form.test.tsx passes
      - Amounts are parsed into integer minor units - no Number(text) * 100
      - Client and server errors use the same accessible display (text, aria-invalid, aria-describedby, focus)
      - The in-flight guard does not depend on a re-render (a ref)
      - The idempotency key is reused for a retry of the same request and replaced when the request changes

  - id: order-note-coding
    type: coding
    concept: react-form-submission
    skill: application
    title: Fix the React 19 note form
    prompt: |
      `OrderNoteForm` uses `<form action>` and `useActionState`, but "Save note" never shows "Saving...",
      the merchant's text disappears when the server refuses a note, and an all-spaces note is sent with
      errors that aren't tied to the textarea. Fix the three bugs without changing the labels, messages or
      exported types.
    project: fullstack
    files:
      - exercises/react-forms/OrderNoteForm.tsx
    test: tests/react-forms/order-note-form.test.tsx
    command: npx vitest run tests/react-forms/order-note-form.test.tsx
    hints:
      - "Where is useFormStatus called, and which form does it report on?"
      - "What does React do to uncontrolled fields after an Action that returns (rather than throws)?"
      - "Return the note as draft on errors and render it as the textarea's defaultValue."
    modelAnswer: |
      ```typescript
      function SaveButton() {
        const { pending } = useFormStatus();
        return (
          <button type="submit" disabled={pending}>
            {pending ? 'Saving...' : 'Save note'}
          </button>
        );
      }

      async function noteAction(previous: NoteState, formData: FormData): Promise<NoteState> {
        const note = String(formData.get('note') ?? '').trim();
        if (note === '') return { ...previous, draft: '', error: 'Write a note first.' };
        if (note.length > MAX_NOTE)
          return { ...previous, draft: note, error: `Keep the note to ${MAX_NOTE} characters or fewer.` };
        const result = await saveNote(orderId, note);
        if (!result.ok) return { ...previous, draft: note, error: result.error };
        return { draft: '', error: '', saved: previous.saved + 1 };
      }

      <textarea
        id={`${id}-note`}
        name="note"
        defaultValue={state.draft}
        aria-invalid={state.error ? true : undefined}
        aria-describedby={state.error ? `${id}-error` : undefined}
      />
      {state.error && <p id={`${id}-error`}>{state.error}</p>}
      <SaveButton />
      ```

      `useFormStatus` now runs inside the form. Returning `draft: note` makes React reset the textarea to the
      rejected text instead of to empty; after a save `draft: ''` empties it.
    solution: |
      Move the button into a `SaveButton` component that calls `useFormStatus`, trim and reject an empty note
      before calling the API, return the note as `draft` on every error and render it as `defaultValue`, and
      tie the error to the textarea with `aria-invalid` and `aria-describedby`. The reference is
      `solutions/react-forms/OrderNoteForm.tsx`.
    rubric:
      - Every test in order-note-form.test.tsx passes
      - useFormStatus is called in a component rendered inside the form (or isPending from useActionState is used)
      - Expected errors are returned as state, not thrown, and the text survives React's reset via defaultValue
      - The error is tied to the textarea with aria-invalid and aria-describedby

  - id: forms-interview
    type: interview
    concept: react-form-submission
    skill: analysis
    title: Design a payment-grade form
    prompt: |
      "You're building the refund form in our merchant dashboard. Walk me through how you'd handle state,
      validation, errors and submission so it's usable and can never refund twice."
    hints:
      - "Go layer by layer: state, client rules, server rules, error display, submission, retries."
      - "Give one concrete failure and how your design handles it."
    modelAnswer: |
      **State:** controlled inputs for amount and reason, because I want to re-validate as the user corrects
      and show the remaining refundable amount; the values stay strings and I parse the amount into integer
      minor units before sending.

      **Validation:** on submit first, then on change after a failed submit. Client rules - required, format,
      more than zero, at most the refundable amount - exist for the user; the API validates everything again,
      including what only it knows (pending refunds, permissions), and returns field errors that I map to the
      same fields. Ideally the rules live in a shared schema so client and server can't drift.

      **Errors:** text next to each field, `aria-invalid`, `aria-describedby`, focus on the first invalid
      field, messages that say how to fix it - WCAG 3.3.1 and 3.3.3. Success is a `role="status"` message;
      a network failure is a `role="alert"`.

      **Submission:** one request at a time - a ref guard checked before anything else, a
      disabled "Refunding..." button, and an idempotency key created once per logical refund. If the network
      fails, the outcome is unknown, so the message says the refund may exist and the retry reuses the key;
      editing the amount makes a new key.

      **Failure story:** a double Enter on a slow connection created two refunds because the key was made per
      click. I'd reproduce it with throttling, fix it with the guard and key reuse, and add a test that
      submits twice before the fake API answers.
    solution: |
      A strong answer separates client validation (usability) from server validation (safety), parses money
      into minor units, displays client and server errors the same accessible way, and prevents duplicates at
      three levels - handler guard, button state and idempotency keys reused on retry - with a concrete,
      tested failure scenario.
    rubric:
      - Justifies controlled or uncontrolled inputs
      - Client validation for the user, server validation for safety, server errors mapped to fields
      - Accessible errors - text, aria-invalid, aria-describedby, focus (WCAG 3.3.1/3.3.3)
      - Single submission - guard, pending button, idempotency key reused on retry, new key on change
      - Gives a concrete failure with reproduction and a regression test
    followUps:
      - How would you share validation rules between the React form and the Node.js API?
      - What changes if the form must work before JavaScript loads?
      - How do you test that the screen reader actually announces the error?

placement:
  - id: place-controlled
    type: mcq
    concept: react-controlled-inputs
    skill: application
    title: Pick the controlled input
    prompt: Which input is controlled and stays editable?
    options:
      - id: value-onchange
        text: <input value={amount} onChange={(e) => setAmount(e.target.value)} />
        feedback: Correct - React state supplies the value and onChange updates it.
      - id: value-only
        text: <input value={amount} />
        feedback: Controlled, but read-only - nothing updates amount, and React warns about it.
      - id: default-value
        text: <input defaultValue={amount} />
        feedback: defaultValue only sets the starting value; the field is uncontrolled after that.
      - id: undefined-value
        text: <input value={undefined} onChange={(e) => setAmount(e.target.value)} />
        feedback: value undefined makes it uncontrolled - and React warns if it later becomes a string.
    correct: [value-onchange]
    solution: |
      A controlled input needs a defined `value` **and** an `onChange` that updates the state behind it.
      `defaultValue` (or `value={undefined}`) makes the input uncontrolled.

  - id: place-layers
    type: mcq
    concept: form-validation-layers
    skill: analysis
    title: Where must the refundable limit be checked?
    prompt: |
      The refund form already blocks amounts above the refundable balance. Where else must that limit be
      enforced?
    options:
      - id: server
        text: On the server, for every request - the form's check is only a convenience
        feedback: Correct - client validation can be bypassed; the server must enforce the rule.
      - id: nowhere
        text: Nowhere else - the form already stops it
        feedback: Requests don't have to come from the form. The HTML Standard warns servers not to rely on client-side validation.
      - id: html-max
        text: Also with an HTML max attribute, so the browser enforces it
        feedback: Still client-side - curl, scripts and old clients skip it.
      - id: css
        text: In CSS with :invalid, so the field turns red
        feedback: Styling an invalid value doesn't stop it from being sent.
    correct: [server]
    solution: |
      Client-side checks help honest users; only the server can protect the money. It must reject an amount
      above the refundable balance on every request and return a field error the form can display.

  - id: place-accessible
    type: debug
    concept: accessible-form-errors
    skill: analysis
    title: The error a screen reader can't find
    prompt: The amount error is visible, but a screen reader announces only "Amount, edit text" on the field. Click the line that needs to change.
    language: typescript
    code: |
      <label htmlFor="amount">Amount (EUR)</label>
      <input
        id="amount"
        value={amount}
        onChange={(e) => setAmount(e.target.value)}
        aria-invalid={error ? true : undefined}
      />
      {error && <p id="amount-error">{error}</p>}
    correctLines: [6]
    lineNotes:
      - line: 7
        note: The message has an id and text - but nothing points at it from the field.
    solution: |
      **Line 6.** The field is marked invalid but has no description. Add
      `aria-describedby={error ? 'amount-error' : undefined}` so the error text is read with the field.

  - id: place-submission
    type: mcq
    concept: react-form-submission
    skill: application
    title: Retrying after a timeout
    prompt: |
      A refund request times out - the form doesn't know whether SandPay created the refund. The merchant clicks
      Refund again without changing anything. What should the second request carry?
    options:
      - id: same-key
        text: The same idempotency key as the first request
        feedback: Correct - the server can recognise the retry and return the first result instead of refunding again.
      - id: new-key
        text: A new idempotency key, because it is a new attempt
        feedback: Then the server sees two different refunds and may create both.
      - id: no-key
        text: No key - the timeout proves the first request failed
        feedback: A timeout only proves the client stopped waiting; the server may have finished the refund.
      - id: block
        text: Nothing - block retries until an operator checks
        feedback: Safe but unusable; idempotency keys exist so retries can be safe.
    correct: [same-key]
    solution: |
      A timeout is an unknown outcome. Retrying the **same logical request** with the **same idempotency key**
      lets the server deduplicate it. A changed request (a different amount) gets a new key.

recall:
  - id: recall-controlled
    concept: react-controlled-inputs
    prompt: What makes an input controlled, and what makes it uncontrolled?
    answer: Controlled - a defined value (or checked) plus an onChange that updates state. Uncontrolled - no value (optionally defaultValue); the DOM keeps the value and you read it on submit with FormData or a ref.
  - id: recall-undefined
    concept: react-controlled-inputs
    prompt: Why does React warn that an input changed from uncontrolled to controlled, and how do you fix it?
    answer: Its value was undefined (or null) first and a string later. Always pass a string - value={x ?? ''} - or render the field after the data loads.
  - id: recall-two-layers
    concept: form-validation-layers
    prompt: What is client-side validation for, and what is server-side validation for?
    answer: Client - helping the user fix mistakes early. Server - safety, on every request, because client checks can be bypassed (HTML Standard 4.10.21.4).
  - id: recall-minor-units
    concept: form-validation-layers
    prompt: How should a form turn "12.5" into an amount for a payment API?
    answer: Parse the string into integer minor units (1250) - never Number(text) * 100, which can produce floating-point errors.
  - id: recall-a11y
    concept: accessible-form-errors
    prompt: Name the four parts of an accessible field error.
    answer: Text next to the field, aria-invalid="true", aria-describedby pointing at the message, and focus on the first invalid field after submit (WCAG 3.3.1; suggest the fix for 3.3.3).
  - id: recall-form-status
    concept: react-form-submission
    prompt: Where must useFormStatus be called?
    answer: In a component rendered inside the <form> it reports on - not in the component that renders that form, where pending is always false.
  - id: recall-reset
    concept: react-form-submission
    prompt: When does React reset a form's uncontrolled fields, and how do you keep the user's text?
    answer: After a function passed to action or formAction finishes without throwing - including when it returns an error. Keep the value in state (or useActionState's state) and pass it as defaultValue.
  - id: recall-once
    concept: react-form-submission
    prompt: What three things together make a refund form submit exactly once?
    answer: A guard that doesn't wait for a re-render (a ref), a disabled pending button, and one idempotency key per logical request, reused on retry and replaced when the request changes.

