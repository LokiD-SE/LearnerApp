id: react-components-and-jsx
title: React components, props and JSX
subject: fullstack
module: react-frontend
level: beginner
status: published
estimatedMinutes: 60
summary: Describe a UI as a tree of pure components that take props, write JSX knowing what it compiles to, render conditionally without stray zeros, and give list items keys that keep each row's identity when the list is re-sorted - then test it all by role.
tags:
  [
    react,
    components,
    props,
    children,
    jsx,
    conditional rendering,
    lists,
    keys,
    purity,
    strict mode,
    vite,
    typescript,
    testing library,
    getByRole,
  ]

environment: |
  - **Library:** **React 19** - the practice project pins `react` and `react-dom` **19.2.9**; a fresh Vite
    project in November 2026 installed `^19.3.1`. Everything in this lesson is the same in both.
  - **Primary source:** the official React documentation at [react.dev](https://react.dev) (read November
    2026): [Thinking in React](https://react.dev/learn/thinking-in-react), [Writing Markup with
    JSX](https://react.dev/learn/writing-markup-with-jsx), [JavaScript in JSX with Curly
    Braces](https://react.dev/learn/javascript-in-jsx-with-curly-braces), [Passing Props to a
    Component](https://react.dev/learn/passing-props-to-a-component), [Conditional
    Rendering](https://react.dev/learn/conditional-rendering), [Rendering
    Lists](https://react.dev/learn/rendering-lists), [Keeping Components
    Pure](https://react.dev/learn/keeping-components-pure), [Preserving and Resetting
    State](https://react.dev/learn/preserving-and-resetting-state), [Fragment](https://react.dev/reference/react/Fragment),
    [Components and Hooks must be pure](https://react.dev/reference/rules/components-and-hooks-must-be-pure),
    [Creating a React App](https://react.dev/learn/creating-a-react-app), [Build a React app from
    Scratch](https://react.dev/learn/build-a-react-app-from-scratch) and [Using TypeScript](https://react.dev/learn/typescript).
  - **Build tool:** [Vite - Getting Started](https://vite.dev/guide/). The project layout shown was produced by
    a real run of `npm create vite@latest merchant-dashboard -- --template react-ts --no-interactive`
    (create-vite 9.3.4, Node.js 24). Generated files change between create-vite versions - check yours.
  - **Compiled JSX:** the output in the "What JSX turns into" section was produced by TypeScript 6.0.3 with
    `"jsx": "react-jsx"` - not written by hand.
  - **Testing:** [Testing Library - About Queries](https://testing-library.com/docs/queries/about) (the query
    priority), [Guiding Principles](https://testing-library.com/docs/guiding-principles) and the [React
    Testing Library API](https://testing-library.com/docs/react-testing-library/api) (`render`, `rerender`,
    automatic `cleanup`). Practice tests run in Vitest 5 with jsdom - a simulated browser, so layout and CSS
    are not real.
  - **Real runs:** the claims about index keys (a typed note moving to another order after a re-sort) and
    about `count && ...` rendering `0` were checked by running the practice project's tests against
    deliberately broken copies of the solution.
  - **Fictional:** SandPay, its merchant dashboard, every order id, customer and amount. No real payment data.

prerequisites:
  - html-semantics-and-forms
  - dom-events-event-loop
  - js-ts-async-and-types

concepts:
  - id: react-components-and-props
    name: Components, props and composition
    summary: A component is a function that takes one props object and returns JSX. Props flow down from parent to child and are read-only; nested JSX arrives as the children prop, so you build bigger UIs by composing small components, not by inheritance.
  - id: jsx-and-conditional-rendering
    name: JSX and conditional rendering
    summary: 'JSX is syntax that compiles to function calls (jsx from react/jsx-runtime). It needs one root (or a Fragment), closed tags and camelCase attributes; curly braces embed JavaScript expressions. Conditional rendering uses if, ? : and && - with a boolean, never a number, on the left of &&.'
  - id: react-list-keys
    name: Lists and keys
    summary: Every item rendered from an array needs a key that is unique among its siblings and stable over time - usually the data's own id. React matches items between renders by key; index keys or random keys attach state and DOM to the wrong item when the list is re-sorted, filtered or inserted into.
  - id: react-render-purity
    name: Pure rendering
    summary: A component must be pure while rendering - same props, state and context give the same JSX, and nothing that existed before the call is changed. Side effects belong in event handlers (or, as a last resort, effects). Strict Mode calls components twice in development to expose impure ones.

objectives:
  - Break a screen into a component hierarchy (the five steps of Thinking in React) and write each component as a typed TypeScript function of its props.
  - Pass data and nested JSX (children) from parent to child, and explain why a child must not change its props.
  - "Write JSX that follows its three rules, predict what it compiles to, and render conditionally with if, ? : and && - spotting the `0 &&` bug."
  - Choose keys for rendered lists, and diagnose a "state jumped to another row" bug as an index or unstable key.
  - Identify impure rendering (mutating outside variables, random values) and move side effects into event handlers.
  - Test components the way users find them - Testing Library queries by role and accessible name - and design tests that catch key and conditional-rendering bugs.

sections:
  - id: intuition
    kind: intuition
    concepts: [react-components-and-props, react-list-keys, react-render-purity]
    title: The idea in plain language
    body: |
      Think of a SandPay merchant dashboard as **LEGO built from a printed set of instructions**. Each
      instruction page is a **component**: "a status badge", "an order row", "an order table". A page says
      what to build from the pieces it is handed - the **props** - and you can nest one instruction inside
      another: the table instruction says "now build one order row per order".

      Two rules keep this sane:

      - **An instruction page never changes the pieces it was handed.** If the table wants a different
        order list, it asks its parent for one. That is why props are read-only - and why data in React
        flows **one way**, down the tree.
      - **The same pieces always give the same model.** Following the instructions twice must not give two
        different results, or change anything else in the room. That is **purity**, and React relies on it:
        it may run your instructions as often as it likes.

      And when the parent hands over the same orders **in a new order**, React needs to know which built
      row is which order - otherwise it repaints row 2 with new data and leaves whatever someone typed into
      row 2 where it was. The **key** is the label on each row that says "this is order ORD-1002", wherever
      it moves.

  - id: why
    kind: why
    concepts: [react-components-and-props, react-render-purity]
    title: Why components - the problem they solve
    body: |
      Without components, a dashboard is one long script that finds DOM nodes and changes them by hand: "when
      an order fails, find its row, change the badge's text and class, update the counter above the table,
      and don't forget the summary card". Every new feature adds another place that must be kept in step,
      and the bugs are **inconsistencies** - the counter says 2 failed, the table shows 3.

      React turns this around. You **describe what the screen should look like for the current data**, and
      React works out the DOM changes. Components make that description manageable:

      - **One source of truth per piece of UI.** The failed count is computed from the orders every render,
        so it can't disagree with the table.
      - **Reuse.** One `StatusBadge` is used in the table, the order page and an email preview - fix it once.
      - **Testable units.** A pure component given the same props always renders the same output, so a test
        renders it with chosen data and checks the result - no browser session, no server.
      - **A shared vocabulary.** Designers, developers and testers can all talk about "the order row" and
        point at one file.

      The price is a set of rules you must keep: components are pure, props flow one way, and list items
      have stable keys. The rest of this lesson is those rules and how to test them.

  - id: what-components
    kind: what
    concepts: [react-components-and-props]
    title: Components and props
    body: |
      From react.dev: a React **component** is a JavaScript function that returns markup. Its name **must
      start with a capital letter** - `<StatusBadge />` is your component, `<span>` is an HTML tag.

      | Term | Meaning |
      |---|---|
      | **props** | the single object a component receives - the "attributes" written on its JSX tag. Read them with destructuring: `function StatusBadge({ status })` |
      | **default value** | `function Avatar({ size = 100 })` - used when the prop is missing or `undefined` (not when it is `null`) |
      | **`children`** | the content nested inside the tag: in `<Panel title="Refunds"><RefundList /></Panel>`, `Panel` receives `children` = `<RefundList />` |
      | **spread** | `<Avatar {...props} />` forwards every prop - react.dev: "don't overuse it" |
      | **one-way data flow** | data passes **down** from parent to child as props; a child changes something only by calling a function the parent passed down (covered in the state lesson) |

      **Props are read-only.** react.dev: props are **immutable**; "when a component needs to change its
      props (for example, in response to a user interaction or new data), it will have to 'ask' its parent
      component to pass it different props - a new object!" Changing values the user can change is the job
      of **state**, the subject of [State, effects and rendering in
      React](#/lesson/react-state-and-effects).

      **Composition, not inheritance.** React components don't extend each other. A generic `Panel` takes a
      `title` and `children`, and the page decides what goes inside: an order table, a refund form, a chart.
      Wrapper components with `children` are how React reuses layout - in the practice project you build
      exactly such a `Panel`.

  - id: code-components
    kind: code
    concepts: [react-components-and-props]
    title: "Code: typed components with props and children"
    body: |
      From the practice project's reference solution (`practice/fullstack/solutions/react-components`):

      ```typescript
      import { useId, type ReactElement, type ReactNode } from 'react';
      import type { OrderStatus } from './orders.js';

      const labels: Record<OrderStatus, string> = {
        PENDING: 'Pending', SUCCEEDED: 'Paid', FAILED: 'Failed', REFUNDED: 'Refunded',
      };

      // A component: a capitalised function of one props object, returning JSX.
      export function StatusBadge({ status }: { status: OrderStatus }): ReactElement {
        return <span className={`badge badge-${status.toLowerCase()}`}>{labels[status]}</span>;
      }

      export interface PanelProps {
        title: string;
        children: ReactNode; // anything renderable: elements, strings, numbers, arrays, null
      }

      // Composition: Panel doesn't know or care what goes inside it.
      export function Panel({ title, children }: PanelProps): ReactElement {
        const headingId = useId(); // unique per Panel instance, stable across renders
        return (
          <section className="panel" aria-labelledby={headingId}>
            <h2 id={headingId}>{title}</h2>
            {children}
          </section>
        );
      }

      // Using them:
      <Panel title="Recent orders">
        <StatusBadge status="FAILED" />
      </Panel>
      ```

      Notes:

      - In a `.tsx` file the props type is an ordinary TypeScript type. `ReactNode` is the type for
        `children`; `ReactElement` is what a component returns (React's types come from `@types/react` -
        react.dev's [Using TypeScript](https://react.dev/learn/typescript)).
      - `useId()` is a React Hook (it must be called at the top of the component). It is the reference way
        to generate ids for accessibility attributes - never `Math.random()` during render (see purity
        below). The `section` named by its `h2` becomes a **region** landmark, as in [Semantic HTML and
        forms](#/lesson/html-semantics-and-forms).
      - The status text is in the **words**, not only in the colour class - a badge that is only green or
        red fails users who can't see the colour, and fails text-based tests too.

  - id: jsx-rules
    kind: what
    concepts: [jsx-and-conditional-rendering]
    title: The rules of JSX
    body: |
      JSX is a syntax extension that lets you write markup inside JavaScript. react.dev lists three rules:

      1. **Return a single root element.** Wrap siblings in one parent, or in a **Fragment** - `<>...</>` -
         which groups them without adding a DOM node. (A Fragment that needs a `key` must be written
         `<Fragment key={id}>`; the short syntax can't take one.)
      2. **Close all the tags.** `<img />`, `<input />`, `<br />`, and `<li>oranges</li>` - no unclosed tags.
      3. **camelCase most attributes.** JSX attributes become JavaScript object keys, so `class` is
         `className`, `stroke-width` is `strokeWidth`, `onclick` is `onClick`. **Exceptions:** `aria-*` and
         `data-*` attributes keep their dashes.

      **Curly braces** open a window into JavaScript: `{order.customer}`, `{formatAmount(o.amountMinor,
      o.currency)}`, ``className={`badge badge-${s}`}``. Anything inside must be an **expression** - an `if`
      statement or a `for` loop can't go inside `{}`; use them before the `return`, or use `? :`, `&&` and
      `array.map()`. Double braces `style={{ color: 'red' }}` are simply an object inside the braces.

      What renders: strings and numbers are shown as text; `null`, `undefined`, `true` and `false` render
      **nothing**; arrays render each item (and need keys). Text in braces is **escaped** - `{userInput}`
      containing `<script>` shows the characters, it doesn't run them. That is React's main XSS protection,
      and why `dangerouslySetInnerHTML` is named the way it is (see [The OWASP Top 10 for
      developers](#/lesson/owasp-top-10-for-developers)).

  - id: jsx-compiled
    kind: internals
    concepts: [jsx-and-conditional-rendering]
    title: What JSX turns into
    body: |
      Browsers can't run JSX. A compiler (TypeScript, or Vite's React plugin) turns each tag into a
      **function call** that returns a plain object describing the element. With `"jsx": "react-jsx"` - the
      setting in both the practice project and a fresh Vite `react-ts` template - this component:

      ```typescript
      export function Total({ count }: { count: number }) {
        return (
          <p className="total">
            {count > 0 && <strong>{count} failed</strong>}
          </p>
        );
      }
      ```

      was compiled by TypeScript 6.0.3 into:

      ```javascript
      import { jsxs as _jsxs, jsx as _jsx } from "react/jsx-runtime";
      export function Total({ count }) {
          return (_jsx("p", { className: "total", children: count > 0 && _jsxs("strong", { children: [count, " failed"] }) }));
      }
      ```

      Read it line by line:

      - **The tag becomes the first argument** - a string (`"p"`) for an HTML element, the function itself
        for a component (`_jsx(StatusBadge, { status })`). That is why components must be capitalised: a
        lower-case name is treated as an HTML tag.
      - **Attributes and nested content become one props object** - nested content is just the
        `children` prop. A component sees exactly what `Panel` saw in the previous section.
      - **The import is added for you** from `react/jsx-runtime`, which is why modern React files don't
        need `import React`.
      - **One root**: a function returns one value, so a component can't return two sibling tags without a
        wrapper - the JSX rule is just JavaScript.

      The calls only **describe** the UI. React later compares this description with the previous one and
      updates the real DOM - which is where keys come in.

  - id: conditional
    kind: example
    concepts: [jsx-and-conditional-rendering]
    title: Conditional rendering, and the stray 0
    body: |
      React has no special `v-if` syntax - you use JavaScript (react.dev, Conditional Rendering):

      ```typescript
      // 1. if before the return - for whole different outputs
      if (orders.length === 0) {
        return <p>No orders yet.</p>;
      }

      // 2. ? : inside JSX - "this or that"
      <td>{order.refundable ? <button>Refund</button> : <span>Not refundable</span>}</td>

      // 3. && inside JSX - "this or nothing"
      {failed > 0 && <p>{failed} failed payments</p>}

      // 4. return null - render nothing at all
      if (!visible) return null;
      ```

      **The trap.** react.dev: "Don't put numbers on the left side of `&&`." JavaScript's `a && b` returns
      `a` itself when `a` is falsy - and `0` is falsy **but is a number**, which React renders as text. So
      on a SandPay dashboard where no payment failed:

      ```typescript
      {failedCount && <p>{failedCount} failed payments</p>}   // renders "0" on the page
      {failedCount > 0 && <p>{failedCount} failed payments</p>} // renders nothing
      ```

      The broken version passes every test written with failing data and ships a lonely **0** above the
      table. In the practice project, the `OrderTable` test "renders nothing before the table when no
      payment failed - not even a 0" fails on exactly this bug (checked by running it against a broken copy:
      the first child of the section was a text node, not the table).

      **What a tester checks:** every conditional piece of UI in **both** states, including the zero, empty
      and missing cases - empty list, `0` count, `null` field, very long text.

  - id: keys-internals
    kind: internals
    concepts: [react-list-keys]
    title: Lists and keys - how React tells items apart
    body: |
      You render a list by mapping data to JSX, and give each item a **`key`**:

      ```typescript
      <tbody>
        {orders.map((order) => (
          <tr key={order.id}>
            <th scope="row">{order.id}</th>
            <td>{order.customer}</td>
            <td><input aria-label={`Note for ${order.id}`} /></td>
          </tr>
        ))}
      </tbody>
      ```

      **Why.** react.dev compares keys to file names in a folder: if files had no names you would refer to
      them by position, and "once you delete a file, it would get confusing. The second file would become
      the first file". A key "lets React identify the item throughout its lifetime", even when its position
      changes. React keeps component **state** and the **DOM nodes** attached to a key; it keeps state "for
      as long as you render the same component at the same position in the tree", and the key is part of
      that position.

      **The rules** (react.dev, Rendering Lists):

      - Keys must be **unique among siblings** (two different lists may reuse the same keys).
      - Keys **must not change** - "Don't generate them while rendering."
      - Where to get them: **from the data** - "database keys/IDs, which are unique by nature"; for data
        created in the browser, an incrementing counter or `crypto.randomUUID()` **when the item is
        created**, stored with it.
      - **Not** the array index: "that's what React will use if you don't specify a key at all", and "Index
        as a key often leads to subtle and confusing bugs" once items are inserted, deleted or reordered.
      - **Not** `key={Math.random()}`: keys never match between renders, so every item is recreated each
        time - "all your components and DOM being recreated every time", losing input and focus.
      - Your component **doesn't receive `key` as a prop**. If it needs the id, pass it twice:
        `<OrderRow key={o.id} orderId={o.id} />`.

      Keys aren't only for lists: changing a component's `key` makes React treat it as a **new** component
      and reset its state - a deliberate tool covered in the state lesson.

  - id: keys-visual
    kind: visual
    concepts: [react-list-keys]
    title: "Diagram: index keys versus id keys after a re-sort"
    body: |
      A support agent types "customer called" into the note for **ORD-1002** (row 2). The parent then
      re-sorts the list so ORD-1003 comes first.

      ```mermaid
      flowchart LR
        subgraph before["Before: A, B, C"]
          r0["row 0: ORD-1001"]
          r1["row 1: ORD-1002 - note typed here"]
          r2["row 2: ORD-1003"]
        end
        subgraph idx["After re-sort, key = index"]
          i0["key 0 reused: shows ORD-1003"]
          i1["key 1 reused: shows ORD-1001 - keeps the note"]
          i2["key 2 reused: shows ORD-1002 - empty note"]
        end
        subgraph ids["After re-sort, key = order.id"]
          k0["key ORD-1003 moved first"]
          k1["key ORD-1001"]
          k2["key ORD-1002 - keeps the note"]
        end
        r1 -->|"index keys: same slot"| i1
        r1 -->|"id keys: same order"| k2
      ```

      **What to notice:** with index keys React sees "key 1 still exists", so it keeps that row's DOM -
      including the input's typed value - and just repaints its text with ORD-1001's data. The note now
      sits next to the **wrong order**. With id keys React moves the existing `ORD-1002` row to its new
      place. This is exactly what the practice project's re-sort test checks; against an index-key version
      it fails with the note found under ORD-1001.

  - id: keys-tests
    kind: tests
    concepts: [react-list-keys, jsx-and-conditional-rendering]
    title: "Tests: catching key and rendering bugs"
    body: |
      Key bugs never show on the first render - every row looks right. They appear only when the **same
      component re-renders with a changed list** while something per-row exists: typed text, a checkbox, an
      expanded panel, focus, a running animation. The SandPay Demo Shop has the same trap for automation -
      its product list re-sorts and re-renders (see [Locator strategy](#/lesson/selenium-locators) and
      [Playwright locators](#/lesson/playwright-locators-and-assertions)).

      | # | Case | Steps | Expected | Evidence |
      |---|---|---|---|---|
      | 1 | Re-sort keeps per-row input | type a note in ORD-1002, re-sort by amount | the note is in ORD-1002's input; others empty | `getByRole('textbox', { name: 'Note for ORD-1002' })` value |
      | 2 | Delete keeps per-row input | type in row 3, delete row 1 | note still beside its order | same, after the delete |
      | 3 | Insert at top | type in row 1, a new order arrives first | note stays with its order, new row empty | same |
      | 4 | Empty state | render with `[]` | "No orders yet.", no table | `queryByRole('table')` is null |
      | 5 | Zero count | no FAILED orders | nothing before the table - no "0" | the section's first child is the table |
      | 6 | One / many | one FAILED, then two | "1 failed payment", "2 failed payments" | `getByText` |
      | 7 | Status in words | each status | Pending / Paid / Failed / Refunded text | badge text, not its class |
      | 8 | Console clean | render any list | no "Each child in a list should have a unique key prop" warning | console output in the test run |

      In code, the re-sort test is a **render, act, rerender** sequence with React Testing Library:

      ```typescript
      const { rerender } = render(<OrderTable orders={[a, b, c]} />);
      await user.type(screen.getByRole('textbox', { name: 'Note for ORD-1002' }), 'customer called');
      rerender(<OrderTable orders={[c, a, b]} />);
      expect(screen.getByRole('textbox', { name: 'Note for ORD-1002' })).toHaveProperty('value', 'customer called');
      ```

  - id: purity
    kind: what
    concepts: [react-render-purity]
    title: Components must be pure
    body: |
      react.dev defines a pure function by two properties:

      - **"It minds its own business."** It does not change any objects or variables that existed before
        it was called.
      - **"Same inputs, same output."** Given the same inputs, it always returns the same result.

      React assumes every component is pure **while rendering**: given the same props, state and context it
      returns the same JSX. React may render a component more than once, render it early, or throw a render
      away - so rendering must be safe to repeat.

      ```typescript
      // Impure: changes a variable that existed before the call
      let rowCount = 0;
      function OrderRow({ order }: { order: Order }) {
        rowCount = rowCount + 1;                      // different output every render
        return <tr><td>{rowCount}</td><td>{order.id}</td></tr>;
      }

      // Also impure: a different value each render
      <input id={`note-${Math.random()}`} />           // use useId() instead

      // Pure: computes from props; local variables created during the call are fine
      function OrderRow({ order, position }: { order: Order; position: number }) {
        const label = `${position}. ${order.id}`;     // local mutation is allowed
        return <tr><td>{label}</td></tr>;
      }
      ```

      **Local mutation is fine.** Creating an array inside the component and pushing to it is allowed -
      react.dev calls this "your component's little secret". Only things that existed **before** the call
      are off limits: module variables, props, objects passed in, the DOM.

      **Where side effects go.** Logging an analytics event, calling an API, changing the document title:
      react.dev says "side effects usually belong inside **event handlers**" - they run when the user acts,
      not during rendering. Only when no event fits, use `useEffect` (next lesson), as a last resort.

      **Strict Mode finds impurity.** react.dev: "React offers a 'Strict Mode' in which it calls each
      component's function twice during development." An impure component shows the doubling - a counter
      jumps by 2, a list gets duplicate items. A fresh Vite project wraps the app in `<StrictMode>` in
      `src/main.tsx`; in production builds the double call doesn't happen. If something looks doubled only
      in development, suspect impurity before suspecting React.

  - id: steps
    kind: steps
    concepts: [react-components-and-props]
    title: "Steps: from a mockup to components (Thinking in React)"
    body: |
      react.dev's Thinking in React gives five steps. For the SandPay "Recent orders" screen:

      1. **Break the UI into a component hierarchy.** Draw a box round each part and name it:
         `OrdersPage` → `Panel` → `OrderTable` → `OrderRow` → `StatusBadge`. A component should ideally
         do one thing; split when it grows.
      2. **Build a static version** from data with props only - no state yet. Data flows down: the top
         takes the orders, each level passes what the next needs. This is **one-way data flow**.
      3. **Find the minimal but complete state** - only what changes over time and can't be computed. The
         list of orders and the chosen sort order are state; the failed count and sorted list are
         **computed** during rendering.
      4. **Decide where each piece of state lives** - in the closest common parent of everything that uses
         it.
      5. **Add inverse data flow** - children change state by calling functions the parent passes as props
         (`onSortChange`).

      Steps 3-5 are the subject of [State, effects and rendering in
      React](#/lesson/react-state-and-effects). This lesson is steps 1 and 2.

  - id: project-layout
    kind: code
    concepts: [react-components-and-props]
    title: "Code: a Vite + React + TypeScript project"
    body: |
      react.dev recommends starting new **apps** with a full-stack framework (Next.js, React Router and
      others), and documents building from scratch with a build tool such as **Vite** when you want to learn
      the basics or have needs frameworks don't serve. Track I builds its own Express API, so the frontend
      uses Vite. The command from react.dev and the Vite guide:

      ```bash
      npm create vite@latest merchant-dashboard -- --template react-ts
      cd merchant-dashboard
      npm install
      npm run dev        # dev server; Vite serves index.html on http://localhost:5173
      ```

      Vite requires Node.js 20.19+ or 22.12+ (Vite guide). The real run for this lesson (create-vite 9.3.4)
      generated:

      ```plaintext
      index.html            <div id="root"></div> and <script type="module" src="/src/main.tsx">
      src/main.tsx          createRoot(document.getElementById('root')!).render(<StrictMode><App /></StrictMode>)
      src/App.tsx           the first component - replace it with yours
      src/App.css, src/index.css, src/assets/
      vite.config.ts        plugins: [react()]  (@vitejs/plugin-react)
      tsconfig.app.json     "jsx": "react-jsx" and strict settings for src/
      package.json          scripts: dev (vite), build (tsc -b && vite build), lint (oxlint), preview
      ```

      Unlike many bundlers, Vite treats **`index.html` as the entry point** ("front-and-central"). React
      takes over one element (`#root`) and renders everything inside it. Suggested place for this lesson's
      code: `src/components/StatusBadge.tsx`, `Panel.tsx`, `OrderTable.tsx` - one component per file,
      named after the component.

  - id: testing-by-role
    kind: tests
    concepts: [react-components-and-props, jsx-and-conditional-rendering]
    title: "Testing components the way users find them"
    body: |
      React Testing Library renders a component into a real DOM (jsdom in the practice project) and you
      query it like a user would. Its guiding principle: "The more your tests resemble the way your software
      is used, the more confidence they can give you." Its recommended query priority starts with queries
      "accessible to everyone":

      1. **`getByRole`** with `name` - "your top preference for just about everything... if you can't, it's
         possible your UI is inaccessible";
      2. `getByLabelText`, `getByPlaceholderText`, `getByText`, `getByDisplayValue`;
      3. then `getByAltText`, `getByTitle`; and last **`getByTestId`**.

      ```typescript
      // @vitest-environment jsdom
      import { render, screen, within } from '@testing-library/react';

      it('is a region named by its heading, with the children inside', () => {
        render(<Panel title="Recent orders"><p>Three orders today</p></Panel>);
        const region = screen.getByRole('region', { name: 'Recent orders' });
        expect(within(region).getByRole('heading', { level: 2, name: 'Recent orders' })).toBeTruthy();
        expect(within(region).getByText('Three orders today')).toBeTruthy();
      });
      ```

      - `getBy...` **throws** when there is no match or more than one; `queryBy...` returns `null` (use it
        to assert absence); `findBy...` waits (asynchronous UI).
      - A role query only works if the markup has the role and an accessible name - the same contract as
        Playwright's `getByRole` in [Playwright locators](#/lesson/playwright-locators-and-assertions), and the
        accessible-name rules from [Accessibility with WCAG 2.2](#/lesson/web-accessibility-wcag). A
        component that is easy to test by role is usually accessible, and the reverse.
      - RTL unmounts what it rendered after each test **automatically** when the test framework provides a
        global `afterEach` - true in the practice project (`globals: true`); otherwise call `cleanup()`.
      - Test **behaviour**, not implementation: no reading component state or counting renders. "If it
        relates to rendering components, then it should deal with DOM nodes rather than component
        instances" (Guiding Principles).

  - id: mistakes
    kind: mistakes
    concepts: [react-components-and-props, jsx-and-conditional-rendering, react-list-keys, react-render-purity]
    title: Common mistakes and how to debug them
    body: |
      | Symptom | Likely cause | How to confirm |
      |---|---|---|
      | Typed text, checkbox or expanded state "jumps" to another row after sorting or deleting | index key (or no key - React then uses the index) | React DevTools: the component keeps its key while its data changes; switch to `key={item.id}` and repeat |
      | Every row loses focus or input on each keystroke | `key={Math.random()}` or a key built from changing data | keys differ on every render - log them, or check that inputs are recreated |
      | Console: "Each child in a list should have a unique 'key' prop" | missing key, or duplicate ids in the data | check the data for duplicates; the warning names the component |
      | A lone `0` on the page | `count && <X />` with `count === 0` | search for `&&` with a number on the left; test the zero case |
      | Component renders as an unknown tag, nothing shows | name starts with a lower-case letter | the compiled call has a string `"orderTable"` instead of the function |
      | Counter or list doubled in development only | impure render (mutating outer variables) exposed by Strict Mode | it's correct in a production build; find the mutation during render |
      | "Adjacent JSX elements must be wrapped" | two roots returned | wrap in a Fragment `<>...</>` |
      | Child changed a prop and the screen didn't update (or did, inconsistently) | mutating props | props are read-only - lift the change to the parent's state |

      **Debugging method:** reproduce with the smallest list that shows it (three items is usually enough),
      record which item the state is attached to before and after, and check the keys. With React DevTools
      (browser extension) you can select a component and see its props, key and state.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [react-components-and-props, react-list-keys]
    title: Trade-offs and alternatives
    body: |
      - **Small versus large components.** Small components are easier to test and reuse, but too many
        one-line components make a tree hard to follow. Split when a part has its own reason to change,
        is reused, or needs its own state.
      - **Index keys are acceptable** only when the list is static - never re-ordered, filtered or inserted
        into - and items hold no state. Even then, an id from the data costs nothing.
      - **Vite versus a framework.** react.dev recommends a framework for new production apps (routing,
        data loading, server rendering). Vite from scratch shows every moving part and fits a separate API,
        which suits this course; the capstone revisits the choice.
      - **Testing Library versus end-to-end tests.** Component tests in jsdom are fast and precise but
        don't render real CSS or layout. Visual and cross-browser behaviour still needs browser tests - see
        [Testing a full stack app](#/lesson/fullstack-testing-strategy).

  - id: summary
    kind: summary
    concepts: [react-components-and-props, jsx-and-conditional-rendering, react-list-keys, react-render-purity]
    title: Quick reference
    body: |
      - Component = **capitalised function** of one **props** object, returning JSX. Props are
        **read-only**; data flows **down**.
      - Nested JSX arrives as **`children`** - compose wrappers instead of inheriting.
      - JSX: **one root** (or `<>...</>`), **close every tag**, **camelCase** attributes (`className`,
        `onClick`; `aria-*`/`data-*` keep dashes). Compiles to `jsx(type, props)` from
        `react/jsx-runtime`.
      - Conditional: `if` before return, `cond ? A : B`, `cond && A` with a **boolean** on the left -
        `0 && ...` renders `0`.
      - Lists: `items.map(i => <Row key={i.id} />)`; key **unique among siblings, stable**, from the data.
        Not the index for changing lists, never `Math.random()`. Components don't receive `key`.
      - Pure render: no changing pre-existing values, same inputs → same JSX. Side effects in **event
        handlers**. Strict Mode double-calls components in development to expose impurity.
      - Test with **`getByRole(role, { name })`** first; `queryBy` for absence; `rerender` to test re-sorts.

exercises:
  - id: note-jumps
    type: mcq
    concept: react-list-keys
    skill: analysis
    title: The note that moved to another order
    prompt: |
      Support reports: "I typed a note for ORD-2207, sorted the table by amount, and my note was next to
      ORD-2191." The row component:

      ```typescript
      {orders.map((order, i) => (
        <tr key={i}>
          <td>{order.id}</td>
          <td><input aria-label={`Note for ${order.id}`} /></td>
        </tr>
      ))}
      ```

      What is the cause, and how do you confirm it?
    options:
      - id: index-key
        text: The key is the array index, so after sorting React reuses each position's row - and its input's typed value - for whatever order now sits there. Confirm by retrying with key={order.id} and by checking which key each row has in React DevTools.
        feedback: Correct - React matched rows by key, and index keys describe positions, not orders. With id keys the existing row moves with ORD-2207.
      - id: uncontrolled
        text: Uncontrolled inputs are not supported inside tables; React drops their values on re-render.
        feedback: Uncontrolled inputs are fine - React keeps the DOM node and its value. The problem is which order that DOM node is now attached to.
      - id: aria-label
        text: The aria-label changes after sorting, so the browser moves the typed text to the input with the old label.
        feedback: Browsers never move values between inputs. The label was updated on a reused input, which still holds its old value - a symptom of the key, not the cause.
      - id: sort-mutates
        text: Sorting must have changed the order ids; the data is wrong, not the UI.
        feedback: The ids are fine - each row shows its own order's id. Only the typed note is in the wrong row, which points at reused DOM, not at data.
    correct: [index-key]
    hints:
      - Which row does React think is "the same row" after sorting - the same position or the same order?
      - What does the key describe here?
    solution: |
      **Index keys.** After sorting, the row with key `1` still exists, so React keeps its `<tr>` and
      `<input>` DOM nodes and only updates the text and `aria-label` with the new order's data. The input's
      **typed value lives in the DOM node**, so it stays at that position and appears next to a different
      order. With `key={order.id}`, React moves the existing ORD-2207 row to its new place. **Confirm**:
      reproduce with three orders; inspect the rows' keys in React DevTools; change the key and repeat - the
      note now follows its order. The practice project's re-sort test fails on exactly this bug.
    followUp: |
      The same table has an "Expand" button per row that shows the order's events, using `useState` inside
      `OrderRow`. Users say the wrong order expands after a new order arrives at the top. Same cause? What
      single change fixes both bugs?

  - id: stray-zero-debug
    type: debug
    concept: jsx-and-conditional-rendering
    skill: application
    title: Where does the 0 come from?
    prompt: |
      On days with no refunds, a lone **0** appears above the SandPay refunds table. Click the line that
      causes it.
    language: typescript
    code: |
      export function RefundsPanel({ refunds }: { refunds: Refund[] }) {
        const pending = refunds.filter((r) => r.status === 'PENDING').length;
        const total = refunds.reduce((sum, r) => sum + r.amountMinor, 0);
        return (
          <section aria-label="Refunds">
            {pending && <p>{pending} refunds waiting for approval</p>}
            <p>Total refunded: {formatAmount(total, 'INR')}</p>
            {refunds.length === 0 ? <p>No refunds today.</p> : <RefundTable refunds={refunds} />}
          </section>
        );
      }
    correctLines: [6]
    lineNotes:
      - line: 3
        note: The reduce starts at 0 so an empty list totals 0 - correct, and it is shown inside a sentence with formatting, not as a lone 0.
      - line: 8
        note: The ternary returns one of two elements; neither branch can render a bare number.
      - line: 2
        note: Counting with filter().length is fine - the problem is how the count is used later.
    hints:
      - Which expression can evaluate to a number rather than to JSX?
      - What does `0 && anything` return in JavaScript?
    solution: |
      **Line 6.** With no pending refunds `pending` is `0`; `0 && <p>...</p>` evaluates to `0`, and React
      renders numbers as text. Fix: `{pending > 0 && <p>...</p>}` (or `!!pending &&`, or a ternary with
      `null`). Add a test with zero pending refunds that asserts nothing is rendered before the total.
    followUp: |
      `{order.discountMinor && <Discount value={order.discountMinor} />}` - when does it render a stray
      value, and would a `null` discount show anything?

  - id: thinking-order
    type: order
    concept: react-components-and-props
    skill: recall
    title: Thinking in React, in order
    prompt: Put react.dev's five steps for building a UI from a mockup in order.
    items:
      - id: hierarchy
        text: Break the UI into a component hierarchy
      - id: static
        text: Build a static version that renders from props only
      - id: minimal-state
        text: Find the minimal but complete representation of UI state
      - id: where-state
        text: Identify where each piece of state should live
      - id: inverse
        text: Add inverse data flow (children call functions passed down as props)
    hints:
      - You can't decide where state lives before you know what the state is.
    solution: |
      Hierarchy → static version with props → minimal state → where state lives → inverse data flow. Doing
      the static version first keeps data flowing one way and shows which values are really state and
      which can be computed.

  - id: impure-render
    type: mcq
    concept: react-render-purity
    skill: analysis
    title: Why does the receipt number jump by two?
    prompt: |
      In development, each receipt on the SandPay order page shows numbers 2, 4, 6 instead of 1, 2, 3. In
      the production build they are 1, 2, 3.

      ```typescript
      let next = 0;
      function ReceiptLine({ item }: { item: LineItem }) {
        next = next + 1;
        return <li>Receipt line {next}: {item.name}</li>;
      }
      ```

      What is going on?
    options:
      - id: strict-impure
        text: The component changes a variable that existed before it was called, so it is impure; Strict Mode calls each component twice in development, which exposes it. Pass the position as a prop (from map's index) instead.
        feedback: Correct - the double call is a development check, and it found a real bug. Numbering from data or props is pure.
      - id: react-bug
        text: React renders twice in development by mistake; it is safe to ignore because production is correct.
        feedback: The double call is deliberate (Strict Mode). The component would also break in production whenever React re-renders it, for example when the parent updates.
      - id: key-missing
        text: The list items have no keys, so React renders each one twice.
        feedback: Missing keys cause a warning and identity problems, not double counting. The counter is a module variable changed during render.
      - id: use-random
        text: Use Math.random() for the number so it can't collide.
        feedback: Random values make the output different on every render - also impure, and not a receipt number.
    correct: [strict-impure]
    hints:
      - Does the component change anything that existed before it ran?
      - What does Strict Mode do in development?
    solution: |
      `next` is a **module variable changed during render** - the component is impure. Strict Mode calls
      component functions twice in development, so each render increments twice. In production it would
      still break: any re-render (a parent update) keeps increasing the numbers. Fix: make it a function of
      its inputs - `items.map((item, i) => <ReceiptLine key={item.id} item={item} position={i + 1} />)`.
      Using the index as **display data** is fine; the key stays the item's id.

  - id: change-props
    type: mcq
    concept: react-components-and-props
    skill: application
    title: The child wants a different sort order
    prompt: |
      `OrderTable` receives `orders` and `sortBy` as props from `OrdersPage`. A "Sort by amount" button lives
      inside `OrderTable`. How should clicking it change the sort?
    options:
      - id: callback
        text: OrdersPage keeps sortBy in its state and passes an onSortChange function; the button calls onSortChange('amount'), and OrdersPage re-renders the table with the new prop.
        feedback: Correct - data flows down as props, and the child asks the parent to change it by calling a function the parent passed (inverse data flow).
      - id: assign-prop
        text: In the click handler, set props.sortBy = 'amount' and sort the array in place.
        feedback: Props are read-only, and sorting props.orders in place mutates the parent's data. React won't re-render because nothing it tracks changed.
      - id: global
        text: Store sortBy in a module-level variable that both components read.
        feedback: React doesn't know when a module variable changes, so nothing re-renders - and reading it during render makes components impure.
      - id: inherit
        text: Make SortableOrderTable extend OrderTable and override its render method.
        feedback: React components are composed, not inherited. Function components have no render method to override.
    correct: [callback]
    hints:
      - Who owns sortBy?
      - How does data flow "up" in React?
    solution: |
      The owner of `sortBy` is the parent, so the parent changes it. It passes `sortBy` down and an
      `onSortChange` callback with it; the child calls the callback. This is step 5 of Thinking in React
      (inverse data flow), and it keeps props read-only. Sorting should produce a **new** array
      (`[...orders].sort(...)` or `orders.toSorted(...)`), never mutate the one received as a prop.
    followUp: |
      Two sibling components - a sort drop-down and the table - both need `sortBy`. Where should it live?

  - id: badge-and-panel
    type: coding
    concept: react-components-and-props
    skill: application
    title: StatusBadge and Panel (React + TypeScript)
    prompt: |
      In `StatusBadge.tsx`, write two components:

      - **`StatusBadge`** - renders an order status as a `<span>` with words a person understands (PENDING →
        "Pending", SUCCEEDED → "Paid", FAILED → "Failed", REFUNDED → "Refunded") and the classes
        `badge badge-<status in lower case>`.
      - **`Panel`** - a `<section>` with an `<h2>` showing `title`, then its `children`; the section is
        named by its heading so `getByRole('region', { name: title })` finds it, and two panels on one page
        never share an id.

      The tests render them with React Testing Library and query by role.
    project: fullstack
    files:
      - exercises/react-components/StatusBadge.tsx
    test: tests/react-components/status-badge-and-panel.test.tsx
    command: npx vitest run tests/react-components/status-badge-and-panel.test.tsx
    hints:
      - A `Record<OrderStatus, string>` maps each status to its words - TypeScript then insists on all four.
      - "The class name is a template literal: `badge badge-${status.toLowerCase()}`."
      - "`useId()` gives a unique id; use it as the heading's `id` and the section's `aria-labelledby`."
    modelAnswer: |
      ```typescript
      const labels: Record<OrderStatus, string> = {
        PENDING: 'Pending', SUCCEEDED: 'Paid', FAILED: 'Failed', REFUNDED: 'Refunded',
      };

      export function StatusBadge({ status }: StatusBadgeProps): ReactElement {
        return <span className={`badge badge-${status.toLowerCase()}`}>{labels[status]}</span>;
      }

      export function Panel({ title, children }: PanelProps): ReactElement {
        const headingId = useId();
        return (
          <section className="panel" aria-labelledby={headingId}>
            <h2 id={headingId}>{title}</h2>
            {children}
          </section>
        );
      }
      ```

      The `Record` type makes a missing status a compile error. `aria-labelledby` gives the section its
      accessible name, which turns it into a `region`; `useId` keeps two panels' ids apart without
      `Math.random()` (which would be impure and change every render).
    rubric:
      - Every test in status-badge-and-panel.test.tsx passes
      - The status meaning is in visible text, not only in a class or colour
      - Panel renders children after the heading and adds nothing else around them
      - Ids come from useId (or a prop), not from Math.random or a module counter
    solution: |
      Run the tests, then compare with the model answer and `solutions/react-components/StatusBadge.tsx`.

  - id: order-table
    type: coding
    concept: react-list-keys
    skill: application
    title: OrderTable with stable keys (React + TypeScript)
    prompt: |
      Write `OrderTable` in `OrderTable.tsx` (solve the StatusBadge exercise first - the table uses it). It
      renders, inside `<section aria-label="Orders">`: "No orders yet." for an empty list; a "1 failed
      payment" / "2 failed payments" line only when some failed; and a captioned table with one row per
      order - id as the row header, customer, `formatAmount(...)`, a `StatusBadge` and a note input labelled
      "Note for <id>". A note typed into a row must stay with its order when the parent re-sorts the list.
    project: fullstack
    files:
      - exercises/react-components/OrderTable.tsx
    test: tests/react-components/order-table.test.tsx
    command: npx vitest run tests/react-components/order-table.test.tsx
    hints:
      - "Return early for the empty list with an `if` before the main `return`."
      - Count failed orders during render - it is computed, not stored. Then use a boolean on the left of `&&`.
      - "In `orders.map(...)` the key must identify the order, not its position: `key={order.id}`."
    modelAnswer: |
      ```typescript
      export function OrderTable({ orders }: OrderTableProps): ReactElement {
        if (orders.length === 0) {
          return <section aria-label="Orders"><p>No orders yet.</p></section>;
        }
        const failed = orders.filter((o) => o.status === 'FAILED').length;
        return (
          <section aria-label="Orders">
            {failed > 0 && <p>{failed} failed {failed === 1 ? 'payment' : 'payments'}</p>}
            <table>
              <caption>Orders</caption>
              <thead>
                <tr>
                  <th scope="col">Order</th><th scope="col">Customer</th><th scope="col">Amount</th>
                  <th scope="col">Status</th><th scope="col">Note</th>
                </tr>
              </thead>
              <tbody>
                {orders.map((order) => (
                  <tr key={order.id}>
                    <th scope="row">{order.id}</th>
                    <td>{order.customer}</td>
                    <td>{formatAmount(order.amountMinor, order.currency)}</td>
                    <td><StatusBadge status={order.status} /></td>
                    <td><input aria-label={`Note for ${order.id}`} /></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </section>
        );
      }
      ```

      `key={order.id}` keeps each row - and the DOM value of its uncontrolled input - attached to its order
      when the list is re-sorted; with `key={index}` the re-sort test finds the note under ORD-1001.
      `failed > 0 &&` avoids rendering `0`. The failed count is computed during render, so the component
      stays pure.
    rubric:
      - Every test in order-table.test.tsx passes
      - Keys come from the order id - not the index, not Math.random
      - No number on the left of &&
      - Amounts are formatted from minor units with formatAmount, never by dividing in several places
      - The table has a caption and th scope attributes, so rows and columns are named for assistive technology
    solution: |
      Run the tests, then compare with the model answer and `solutions/react-components/OrderTable.tsx`. To
      see the key bug yourself, change the key to the index and run the re-sort test again.

  - id: jsx-compiles
    type: short
    concept: jsx-and-conditional-rendering
    skill: application
    title: Explain three JSX rules from what it compiles to
    prompt: |
      Using the fact that `<Panel title="Refunds"><RefundList /></Panel>` compiles to roughly
      `jsx(Panel, { title: "Refunds", children: jsx(RefundList, {}) })`, explain (1) why a component name
      must be capitalised, (2) why a component can't return two sibling tags without a wrapper, and (3) how
      `Panel` receives the nested `<RefundList />`.
    hints:
      - What is the first argument for `<div>` compared with `<Panel>`?
      - How many values can a JavaScript function return?
    modelAnswer: |
      (1) The compiler decides the first argument from the tag name: a lower-case name becomes a **string**
      (`"div"`, an HTML element), a capitalised name a **reference to the function**. `<panel>` would ask
      the DOM for an unknown `panel` element. (2) A component returns the value of **one** expression, and
      each tag is one `jsx(...)` call - two sibling calls can't be one return value, so they need a parent
      element or a Fragment (which compiles to a `jsx(Fragment, { children: [...] })` call). (3) Nested
      content is put into the props object as **`children`**, so `Panel` reads it like any other prop:
      `function Panel({ title, children })`.
    rubric:
      - Capitalisation decides string tag versus component reference
      - One return value, so one root (or a Fragment)
      - Nested JSX arrives as the children prop
    solution: |
      Compare with the model answer. Seeing JSX as function calls also explains why only expressions fit in
      braces: they become arguments.

  - id: test-design-order-table
    type: testdesign
    concept: react-list-keys
    skill: analysis
    title: Test plan for the order table component
    prompt: |
      Design component tests for `OrderTable` (empty state, failed-payment line, table rows, status words,
      per-row note input). Give at least six cases with the data you render, the steps, the expected result
      and the **evidence** (which query or assertion proves it). Include the cases that catch key bugs.
    hints:
      - Which bugs only appear when the same component renders a second time with different data?
      - Think of zero, one and many.
      - Which Testing Library query proves something is absent?
    modelAnswer: |
      1. **Empty list** - render `[]` → "No orders yet." and no table. Evidence: `getByText`, and
         `queryByRole('table')` is `null`.
      2. **Zero failed** - three paid/pending orders → nothing before the table. Evidence: the section's
         first child node is the table; `queryByText(/failed/)` is `null` (catches `0 &&`).
      3. **One and many failed** - one FAILED then `rerender` with two → "1 failed payment", "2 failed
         payments". Evidence: `getByText` with the exact strings.
      4. **Row content** - ORD-1001 → row header "ORD-1001", cells "Asha Rao", "INR 1,250.00", "Paid".
         Evidence: `getByRole('rowheader', { name })`, then `within(row).getAllByRole('cell')`.
      5. **Re-sort keeps note** - type in ORD-1002's note, `rerender` with the list re-ordered → the note
         is in ORD-1002's input, others empty. Evidence: input values found by their labels.
      6. **Delete keeps note** - type in the third row, `rerender` without the first order → note stays
         with its order.
      7. **Insert at top** - a new order arrives first → existing notes stay; the new row's note is empty.
      8. **Accessibility** - caption names the table; column headers have `scope`. Evidence:
         `getByRole('table', { name: 'Orders' })`, `getAllByRole('columnheader')`.
      9. **Key warning** - no "unique key" warning in the console during the run.
    rubric:
      - Includes at least one re-render with changed order AND per-row state (typed text) - the only way to catch key bugs
      - Covers the zero / empty cases explicitly
      - Evidence uses role or label queries, not CSS classes or test ids where a role exists
      - Uses queryBy (or equivalent) to assert absence
    solution: |
      Compare with the model answer. The decisive idea is **per-row state + changed order + same
      component instance** - render, type, `rerender` - because a first render can never show a key bug.

  - id: interview-keys
    type: interview
    concept: react-list-keys
    skill: application
    title: "Interview: why does React need keys?"
    prompt: |
      *"Why does React ask for a key on list items? What do you use as a key, and what goes wrong with the
      index?"*
    hints:
      - Explain what React does between two renders of a list.
      - Give a concrete bug, then the rules.
    modelAnswer: |
      When a list re-renders, React has to match the new items with the old ones to decide what to keep,
      move, create or remove - and component state and DOM nodes are attached to that match. The **key** is
      how it matches: an item with the same key is treated as the same item, wherever it moved. Without a
      key React falls back to the **index**, i.e. position.

      So I use a key that is **unique among siblings and stable**: the id from the database, or an id
      generated once when the item is created and stored with it. I never generate keys during render -
      `Math.random()` makes every item new on every render, so inputs lose their text and focus.

      Index keys break as soon as the list is re-ordered, filtered or inserted into **and** items hold state.
      Example: a support table with a note input per order - with index keys, after sorting, the note typed
      for one order sits next to another order, because React reused the row at that position. With id keys
      it moves with the order. Index keys are only acceptable for static lists without state. I'd test it by
      typing into a row, re-ordering the data and checking the value stayed with its item.
    rubric:
      - Explains that React matches items between renders by key, and state/DOM follow the match
      - Stable, unique-among-siblings key from the data
      - Explains the index-key failure with a concrete state-moves-to-another-row example
      - Rejects keys generated during render (Math.random)
      - Mentions how to test or detect it
    solution: |
      Compare with the model answer. Strong answers give a concrete bug and a test, not only "React needs
      it for performance".
    followUps:
      - "The API returns orders without ids. What do you do?"
      - "Your component needs the order id, but you passed it as `key`. Why is `props.key` undefined?"
      - "How can a key be used deliberately to reset a form when the selected customer changes?"

placement:
  - id: place-key
    type: mcq
    concept: react-list-keys
    skill: application
    title: Which key should the refund rows use?
    prompt: |
      A refunds list can be sorted, filtered and has an editable "reason" field per row. Each refund from the
      API has a unique `refundId`. Which key is right?
    options:
      - id: refund-id
        text: key={refund.refundId}
        feedback: Correct - stable and unique among siblings, so each row's typed reason stays with its refund when the list changes.
      - id: index
        text: key={index}
        feedback: Index keys describe positions; after sorting or filtering, typed reasons stay at the old position, next to a different refund.
      - id: random
        text: key={crypto.randomUUID()}
        feedback: Generating the key during render gives a new key every render, so every row is recreated and typed text and focus are lost. Generate ids when items are created, not while rendering.
      - id: amount
        text: key={refund.amountMinor}
        feedback: Amounts aren't unique - two refunds of the same amount would collide, and React warns about duplicate keys.
    correct: [refund-id]
    solution: |
      Use the id from the data: `key={refund.refundId}`. Keys must be unique among siblings and must not
      change between renders. Index keys break with sorting and filtering when rows hold state; keys made
      during render (random values) change every time.

  - id: place-zero
    type: debug
    concept: jsx-and-conditional-rendering
    skill: application
    title: Find the line that can render a stray number
    prompt: The badge in the header sometimes shows a lone "0". Click the line that causes it.
    language: typescript
    code: |
      function Header({ unread, name }: { unread: number; name: string | null }) {
        return (
          <header>
            <h1>SandPay dashboard</h1>
            {name ? <p>Signed in as {name}</p> : null}
            {unread && <span className="badge">{unread} new</span>}
          </header>
        );
      }
    correctLines: [6]
    lineNotes:
      - line: 5
        note: A ternary with null renders nothing for a missing name - correct.
    solution: |
      **Line 6.** `unread && ...` returns `0` when there is nothing unread, and React renders the number.
      Use `unread > 0 && ...`.

  - id: place-purity
    type: mcq
    concept: react-render-purity
    skill: application
    title: Which component is pure?
    prompt: Which of these components is pure while rendering?
    options:
      - id: computes
        text: A component that sorts a copy of its items prop ([...items].sort(...)) into a local variable and renders it
        feedback: Correct - it only changes a new array created during this call, which react.dev calls fine local mutation.
      - id: sorts-prop
        text: A component that calls items.sort(...) on its items prop and renders it
        feedback: Array sort works in place, so this mutates the parent's array - an object that existed before the call.
      - id: title
        text: A component that sets document.title = `${count} orders` in its body
        feedback: Changing the document during render is a side effect. It belongs in an event handler or an effect.
      - id: counter
        text: A component that increments a module-level renderCount variable and shows it
        feedback: Changing a module variable during render is impure; Strict Mode's double call in development shows the count jumping by two.
    correct: [computes]
    solution: |
      Only the copy-then-sort component is pure. Mutating props (in-place `sort`), writing to the document,
      or changing module variables during render are side effects. Copy first (`[...items]`,
      `items.toSorted()`), and move real side effects to event handlers.

  - id: place-children
    type: mcq
    concept: react-components-and-props
    skill: application
    title: How does the panel get its content?
    prompt: |
      `<Panel title="Refunds"><RefundForm /></Panel>` - how does `Panel` show `RefundForm` inside its
      section?
    options:
      - id: children-prop
        text: It renders the children prop, which holds the nested <RefundForm />
        feedback: Correct - nested JSX arrives as the children prop.
      - id: extends
        text: RefundForm must extend Panel so it inherits the section and heading
        feedback: React reuses layout by composition - a wrapper that renders its children - not by inheritance.
      - id: context
        text: React finds the child automatically and places it after the last element Panel returns
        feedback: React only renders what the component returns. If Panel ignores children, RefundForm never appears.
      - id: props-form
        text: It must receive the form as props.form; nested JSX is ignored
        feedback: A named prop works too, but nested JSX is not ignored - it becomes props.children.
    correct: [children-prop]
    solution: |
      Nested JSX becomes `props.children`. `Panel` renders `{children}` where the content belongs - the
      standard React way to build reusable wrappers (composition, not inheritance).

recall:
  - id: recall-component
    concept: react-components-and-props
    prompt: What is a React component, and how does React tell it apart from an HTML tag in JSX?
    answer: A JavaScript function that takes one props object and returns JSX. Its name starts with a capital letter; lower-case tags are HTML elements.
  - id: recall-props-readonly
    concept: react-components-and-props
    prompt: A child needs a prop to change. What does it do?
    answer: It asks the parent - by calling a function the parent passed down. Props are read-only; the parent owns the state and re-renders the child with new props.
  - id: recall-jsx-rules
    concept: jsx-and-conditional-rendering
    prompt: What are the three rules of JSX?
    answer: Return a single root element (or a Fragment), close all the tags, and write most attributes in camelCase (className, onClick) - aria-* and data-* keep their dashes.
  - id: recall-jsx-compiles
    concept: jsx-and-conditional-rendering
    prompt: What does JSX compile to with the react-jsx setting?
    answer: Calls to jsx / jsxs imported from react/jsx-runtime - jsx(type, props), where nested content is the children prop.
  - id: recall-zero
    concept: jsx-and-conditional-rendering
    prompt: Why can `{count && <Badge />}` show a 0?
    answer: When count is 0, the && expression evaluates to 0, and React renders numbers as text. Put a boolean on the left - count > 0.
  - id: recall-key-rules
    concept: react-list-keys
    prompt: What makes a good key?
    answer: Unique among siblings and stable over time - usually the item's id from the data. Not the index for lists that change, and never generated during render.
  - id: recall-key-prop
    concept: react-list-keys
    prompt: Does a component receive its key as a prop?
    answer: No - key is only a hint for React. Pass the id again as a separate prop if the component needs it.
  - id: recall-purity
    concept: react-render-purity
    prompt: What does Strict Mode do to help find impure components?
    answer: In development it calls each component function twice; a component that changes pre-existing values shows doubled results. It doesn't happen in production builds.

