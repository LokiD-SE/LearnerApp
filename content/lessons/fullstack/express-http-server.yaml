id: express-http-server
title: An HTTP API with Node.js and Express
subject: fullstack
module: backend-api
level: beginner
status: published
estimatedMinutes: 65
summary: Build the server side of the request-response cycle - from a ten-line node:http server to an Express 5 API with routes, middleware, JSON bodies, a JSON 404, an error handler that leaks nothing, tests without a running server and a graceful shutdown. Every response shown here came from a real run.
tags:
