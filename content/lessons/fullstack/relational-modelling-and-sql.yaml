id: relational-modelling-and-sql
title: Relational modelling and SQL
subject: fullstack
module: databases
level: beginner
status: published
estimatedMinutes: 70
summary: Model the SandPay merchant dashboard as PostgreSQL tables - keys, the right data types for money and time, constraints that refuse bad rows, normalisation to third normal form - then query it with joins, aggregates, NULL-safe filters, CTEs, RETURNING and upserts. Every result shown here came from a real PostgreSQL 18 run.
