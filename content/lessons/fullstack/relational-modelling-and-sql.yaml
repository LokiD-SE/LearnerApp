  ]

environment: |
  - **Database:** **PostgreSQL 18.6**, run through **PGlite 0.5.14** (`@electric-sql/pglite`, the version pinned in
    `practice/fullstack`) - the real PostgreSQL engine compiled to WebAssembly, so nothing needs installing. Every
    query result and error message in this lesson was captured from that engine with Node.js 24 in November 2026.
    Results are printed as simple tables: NULL shows as an empty cell and booleans as `true` / `false` (the `psql`
    client prints `t` / `f` and right-aligns numbers, but the values are the same). Generated values such as `now()`
    change on every run.
  - **PostgreSQL 18 manual:** [Constraints](https://www.postgresql.org/docs/18/ddl-constraints.html) ("a check
    constraint is satisfied if the check expression evaluates to true or the null value"; RESTRICT versus NO ACTION;
    "a foreign key constraint does not automatically create an index on the referencing columns"; `UNIQUE NULLS NOT
    DISTINCT`), [Numeric types](https://www.postgresql.org/docs/18/datatype-numeric.html) (`numeric` "is especially
    recommended for storing monetary amounts"; `real` and `double precision` are "inexact"; sequences can leave
    "holes" or gaps), [Date/time types](https://www.postgresql.org/docs/18/datatype-datetime.html) (a
    `timestamptz` "is stored internally as UTC" and shown in the session's time zone),
    [Monetary type](https://www.postgresql.org/docs/18/datatype-money.html) (`money` depends on `lc_monetary`),
    [JSON types](https://www.postgresql.org/docs/18/datatype-json.html), [UUID
    functions](https://www.postgresql.org/docs/18/functions-uuid.html) (`gen_random_uuid()`, and `uuidv7()`, new in
    PostgreSQL 18), [Aggregate functions](https://www.postgresql.org/docs/18/tutorial-agg.html) ("WHERE selects input
    rows before groups and aggregates are computed ... whereas HAVING selects group rows after"),
    [Table expressions](https://www.postgresql.org/docs/18/queries-table-expressions.html) (LEFT OUTER JOIN), [Sorting
    rows](https://www.postgresql.org/docs/18/queries-order.html) ("if sorting is not chosen, the rows will be returned
    in an unspecified order"), [Subquery expressions](https://www.postgresql.org/docs/18/functions-subquery.html) (NOT IN
    and NULL), [WITH queries](https://www.postgresql.org/docs/18/queries-with.html), [SELECT](https://www.postgresql.org/docs/18/sql-select.html)
    (the processing order), [INSERT](https://www.postgresql.org/docs/18/sql-insert.html) (`RETURNING`, `ON CONFLICT`,
    `EXCLUDED`), [Sequence functions](https://www.postgresql.org/docs/18/functions-sequence.html) (a `nextval` value
    "is not reclaimed for re-use if the calling transaction later aborts") and [Error
    codes](https://www.postgresql.org/docs/18/errcodes-appendix.html) (23502, 23503, 23505, 23514, 23001, 22001).
  - **The relational model:** E. F. Codd, "A relational model of data for large shared data banks",
    *Communications of the ACM* 13(6), June 1970, pages 377-387
    ([doi:10.1145/362384.362685](https://doi.org/10.1145/362384.362685)). Second and third normal form were defined
    by Codd in "Further Normalization of the Data Base Relational Model" (IBM Research Report RJ909, 1971); the
    definitions below are the standard textbook wording, cited for history only.
  - **Fictional:** SandPay, its merchants, customers, orders and refunds, every email address (`.example` and
    `example.com` domains are reserved for examples) and every amount. Amounts are integer minor units: 2599 is
    25.99.
  - **Not covered here:** indexes and query plans ([PostgreSQL indexes and query
    plans](#/lesson/postgres-indexes-and-query-plans)), transactions and concurrency
    ([Transactions, isolation and concurrency](#/lesson/transactions-and-isolation)), and calling SQL from Node.js
    ([Migrations and data access](#/lesson/migrations-and-data-access)).

prerequisites:
  - amounts-currency-rounding
  - typescript-for-applications

concepts:
  - id: relational-model-and-keys
    name: Tables, rows, primary keys and foreign keys
    summary: A relational database stores facts as rows in tables. A primary key identifies each row; a foreign key says a row refers to a row in another table, and the database refuses references to rows that don't exist. ON DELETE decides what happens to the referring rows when the referenced row goes - refuse (RESTRICT / NO ACTION), delete them too (CASCADE) or clear the reference (SET NULL).
  - id: sql-types-and-constraints
    name: Data types and constraints as the last line of defence
    summary: Choose types that make wrong values impossible - integer minor units in bigint (or numeric) for money, never float; timestamptz for moments in time. Then declare NOT NULL, UNIQUE and CHECK so the database rejects bad rows whatever code writes them. A CHECK passes on NULL, so pair it with NOT NULL.
  - id: normalisation-3nf
    name: Normalisation to third normal form
    summary: Store each fact once. First normal form - one value per cell, no repeating groups. Second - every non-key column depends on the whole key. Third - no non-key column depends on another non-key column (no transitive dependency). Denormalise only on purpose, for example to snapshot what was true at the time of a payment.
  - id: sql-queries-joins-nulls
    name: Querying with joins, aggregates and NULL-safe logic
    summary: SELECT works through FROM and JOIN, WHERE, GROUP BY, HAVING, the select list, ORDER BY and LIMIT. INNER JOIN keeps only matching rows, LEFT JOIN keeps every left row. NULL means unknown, so NULL = NULL is NULL, WHERE keeps only true, COUNT(col) skips NULLs and NOT IN breaks on a NULL - use IS NULL, COALESCE and NOT EXISTS.

objectives:
  - Design tables for a payments domain with primary keys, foreign keys and an ON DELETE rule chosen for each relationship, and explain the choice.
  - Choose PostgreSQL types for money, time, identifiers and flexible data, and justify why float and timestamp without time zone are wrong for amounts and moments.
  - Write NOT NULL, UNIQUE and CHECK constraints that reject bad rows, and predict which SQLSTATE error each violation raises.
  - Normalise a flat spreadsheet to third normal form and identify the dependency each step removes.
  - Write SELECT queries with INNER and LEFT JOIN, GROUP BY, HAVING and aggregates, and place a filter in ON or WHERE deliberately.
  - Explain NULL's three-valued logic, and rewrite queries that silently lose rows because of NULL (= NULL, NOT IN, COUNT(col)).
  - Use CTEs, INSERT ... RETURNING, UPDATE and DELETE with WHERE, and upserts with ON CONFLICT.

sections:
  - id: intuition
    kind: intuition
    concepts: [relational-model-and-keys, normalisation-3nf]
    title: The idea in plain language
    body: |
      Think of a well-run **filing cabinet** at a payment company. There is one drawer per kind of thing -
      merchants, customers, orders, refunds - and each card in a drawer has a **number in the corner** that never
      changes. An order card doesn't copy the merchant's name and address; it says "merchant **1**", and anyone who
      needs the address looks up card 1 in the merchants drawer.

      That one habit buys three things:

      - **One place to change a fact.** When Lumen Books renames itself, you change one card - not every order.
      - **No orphans.** The clerk refuses an order for "merchant 99" if there is no card 99.
      - **Questions across drawers.** "How much did each merchant take yesterday?" is answered by laying cards
        from two drawers side by side - a **join**.

      A relational database is that cabinet with a very strict clerk. The drawers are **tables**, the cards are
      **rows**, the number in the corner is the **primary key**, "merchant 1" on an order is a **foreign key**, and the
      clerk's rules are **constraints**. SQL is how you ask the clerk questions.

      As a tester you have read these tables for years to check what an API really did. This lesson is about
      designing them, so the database itself refuses the bad data you used to hunt for.

  - id: what
    kind: what
    concepts: [relational-model-and-keys]
    title: Tables, keys and relationships
    body: |
      Codd's 1970 paper modelled data as **relations**: sets of tuples whose values come from defined domains. In SQL
      terms:

      | Relational term | SQL term | In SandPay |
      | --------------- | -------- | ---------- |
      | relation | table | `orders` |
      | tuple | row | order 101 |
      | attribute | column | `amount_minor` |
      | domain | data type (plus constraints) | `bigint`, `CHECK (amount_minor > 0)` |
      | primary key | `PRIMARY KEY` | `orders.id` |
      | foreign key | `REFERENCES` | `orders.merchant_id` refers to `merchants.id` |

      - A **primary key** is one or more columns whose values are unique and never NULL - PostgreSQL enforces both.
        Most tables use a **surrogate key**: a meaningless generated number or UUID. A **natural key** such as an
        email address looks attractive but changes in real life, and every table that refers to it would have to
        change too. Keep natural keys as `UNIQUE` columns instead.
      - A **foreign key** says "this value must exist as a key in that table". The database checks it on every insert
        and update, and decides what happens on delete.
      - **Relationships:** one merchant has many orders (the foreign key sits on the "many" side, `orders.merchant_id`);
        an order has many refunds; many-to-many relationships need a third table holding two foreign keys.
      - Rows have **no inherent order**. The manual says it plainly: "if sorting is not chosen, the rows will be
        returned in an unspecified order". A test that relies on the order of an unsorted query is a flaky test.

      Generating keys in PostgreSQL:

      ```sql
      -- a standard SQL identity column (preferred over the older serial types)
      id bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY
      -- or a UUID, when ids are created in several places or must not be guessable
      id uuid PRIMARY KEY DEFAULT gen_random_uuid()   -- random (version 4)
      id uuid PRIMARY KEY DEFAULT uuidv7()            -- time-ordered (version 7), new in PostgreSQL 18
      ```

  - id: why
    kind: why
    concepts: [relational-model-and-keys, sql-types-and-constraints]
    title: Why model carefully - the bugs a schema prevents
    body: |
      Each defect below is the kind testers report against payment systems, and each one is impossible - not
      merely unlikely - with the right table design:

      | Defect seen in production | What the schema does about it |
      | ------------------------- | ----------------------------- |
      | An order for a merchant that was never created | a foreign key refuses it (23503) |
      | Two merchant accounts for `ops@lumen.example` and `OPS@Lumen.example` | a unique index on `lower(email)` refuses the second (23505) |
      | A refund of -5.00 that paid the customer twice | `CHECK (amount_minor > 0)` refuses it (23514) |
      | An order with no amount, shown as "NaN" on the dashboard | `NOT NULL` refuses it (23502) |
      | Settlement totals off by a fraction of a cent | `bigint` minor units can't hold a fraction |
      | Yesterday's report moved by five and a half hours after a server move | `timestamptz` stores the instant, not a wall-clock time |
      | The merchant's new email shown on some orders and the old one on others | 3NF: the email is stored once, in `merchants` |

      Application validation is still needed - it gives users friendly messages - but it runs only in the code paths
      that remember to call it. A migration script, a second service, a support engineer's SQL console and next
      year's rewrite all bypass it. **Constraints are the rules that hold for every writer.** For a tester that
      changes the question from "did every code path validate?" to "does the schema make the bad state impossible?" -
      a question you can answer by reading one file and running a handful of inserts.

  - id: types
    kind: what
    concepts: [sql-types-and-constraints]
    title: Data types that matter in a payments schema
    body: |
      | Need | Use | Avoid, and why |
      | ---- | --- | -------------- |
      | Money | `bigint` of **minor units** (2599 = 25.99), or `numeric(12,2)` | `real` / `double precision` - inexact; `money` - depends on the server's `lc_monetary` setting |
      | A moment in time | `timestamptz` (`timestamp with time zone`) | `timestamp` without time zone - drops the offset |
      | A calendar date (a settlement day) | `date` | text |
      | Identifiers | `bigint` identity, or `uuid` | `integer` for busy tables - its limit is 2147483647 |
      | Free text | `text` (add a CHECK if it has a length limit) | `varchar(n)` chosen at random |
      | Currency code | `char(3)` or `text` with a CHECK | free text |
      | Yes / no | `boolean` | `'Y'`/`'N'` strings |
      | Flexible extra data | `jsonb` | `json` (re-parsed on every use), or jsonb for columns you query and constrain |

      Why float is wrong for money - a real run:

      ```sql
      SELECT 0.1::double precision + 0.2::double precision = 0.3 AS float_equals_0_3,
             0.1::numeric + 0.2::numeric = 0.3 AS numeric_equals_0_3;
      ```

      ```plaintext
       float_equals_0_3 | numeric_equals_0_3
      ------------------+--------------------
       false            | true
      (1 row)
      ```

      The floating-point sum is a tiny amount away from 0.3 (it prints with a 4 in the seventeenth decimal place), so
      equality checks fail and totals of many amounts drift. Integer minor units avoid fractions entirely - but
      remember integer division truncates:

      ```plaintext
       integer_division | numeric_division
      ------------------+------------------
       25               | 25.99
      (1 row)          -- SELECT 2599::bigint / 100, round(2599::numeric / 100, 2)
      ```

      Format amounts for display in the application, not with integer arithmetic in SQL. The lesson
      [Amounts, currencies, rounding and minor units](#/lesson/amounts-currency-rounding) covers currencies whose
      minor unit isn't 2 digits.

      Why `timestamptz` - the same instant, viewed with the session time zone set to `Asia/Kolkata`:

      ```plaintext
       timestamptz_value         | timestamp_value
      ---------------------------+---------------------
       2026-11-14 15:30:00+05:30 | 2026-11-14 10:00:00
      (1 row)          -- input '2026-11-14 10:00:00+00' cast to each type
      ```

      The `timestamptz` value is stored as UTC and **converted** for display; the plain `timestamp` silently threw the
      `+00` away and keeps a wall-clock time with no zone. Two servers in different zones would read different
      instants from it.

  - id: constraints
    kind: internals
    concepts: [sql-types-and-constraints, relational-model-and-keys]
    title: Constraints - the database refuses bad rows
    body: |
      Application validation can be bypassed - a second service, a migration script, someone with a SQL console.
      Constraints can't. This is the SandPay schema used in the rest of the lesson (and the reference solution of the
      first coding exercise):

      ```sql
      CREATE TABLE merchants (
        id         bigint      GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        name       text        NOT NULL CHECK (name <> ''),
        email      text        NOT NULL,
        created_at timestamptz NOT NULL DEFAULT now()
      );
      CREATE UNIQUE INDEX merchants_email_lower_key ON merchants (lower(email));

      CREATE TABLE customers (
        id          bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        merchant_id bigint NOT NULL REFERENCES merchants (id) ON DELETE RESTRICT,
        email       text   NOT NULL,
        UNIQUE (merchant_id, email)
      );

      CREATE TABLE orders (
        id           bigint      GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        merchant_id  bigint      NOT NULL REFERENCES merchants (id) ON DELETE RESTRICT,
        customer_id  bigint      REFERENCES customers (id) ON DELETE SET NULL,
        amount_minor bigint      NOT NULL CHECK (amount_minor > 0),
        currency     char(3)     NOT NULL CHECK (currency ~ '^[A-Z]{3}$'),
        status       text        NOT NULL DEFAULT 'PENDING' CHECK (status IN ('PENDING', 'PAID', 'FAILED')),
        created_at   timestamptz NOT NULL DEFAULT now()
      );

      CREATE TABLE refunds (
        id           bigint      GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        order_id     bigint      NOT NULL REFERENCES orders (id) ON DELETE CASCADE,
        amount_minor bigint      NOT NULL CHECK (amount_minor > 0),
        reason       text,
        created_at   timestamptz NOT NULL DEFAULT now()
      );
      ```

      What each bad insert really produced (PGlite, PostgreSQL 18.6):

      ```plaintext
      INSERT INTO orders (merchant_id, amount_minor, currency) VALUES (1, -500, 'EUR');
      ERROR:  new row for relation "orders" violates check constraint "orders_amount_minor_check"

      INSERT INTO orders (merchant_id, amount_minor, currency) VALUES (99, 500, 'EUR');
      ERROR:  insert or update on table "orders" violates foreign key constraint "orders_merchant_id_fkey"
      DETAIL:  Key (merchant_id)=(99) is not present in table "merchants".

      INSERT INTO orders (merchant_id, amount_minor, currency) VALUES (1, NULL, 'EUR');
      ERROR:  null value in column "amount_minor" of relation "orders" violates not-null constraint

      INSERT INTO merchants (name, email) VALUES ('Lumen Again', 'ops@lumen.example');
      ERROR:  duplicate key value violates unique constraint "merchants_email_key"
      DETAIL:  Key (email)=(ops@lumen.example) already exists.
      ```

      (The last run used a plain `email text NOT NULL UNIQUE` column, hence the constraint name.) Every error carries
      a five-character **SQLSTATE** code that application code should check instead of parsing the message:

      | SQLSTATE | Name | Raised by |
      | -------- | ---- | --------- |
      | 23502 | not_null_violation | a NULL in a NOT NULL column |
      | 23503 | foreign_key_violation | a reference to a missing row, or deleting a referenced row (NO ACTION) |
      | 23505 | unique_violation | a duplicate in a PRIMARY KEY or UNIQUE column or index |
      | 23514 | check_violation | a CHECK that evaluated to false |
      | 23001 | restrict_violation | deleting a referenced row when the foreign key says ON DELETE RESTRICT |
      | 22001 | string_data_right_truncation | a value too long for its type - `'EURO'` into `char(3)` |

      Three rules that surprise people:

      1. **A CHECK passes on NULL.** The manual: "a check constraint is satisfied if the check expression evaluates
         to true or the null value". `amount_minor bigint CHECK (amount_minor > 0)` without `NOT NULL` accepted a
         NULL amount in a real run. Write both.
      2. **UNIQUE allows many NULLs** by default, because NULL is never equal to NULL - two rows with a NULL email
         both went in. Add `NOT NULL`, or `UNIQUE NULLS NOT DISTINCT` (PostgreSQL 15 and later) if at most one NULL is allowed.
      3. **A foreign key doesn't create an index** on the referencing column. The manual: "a foreign key constraint
         does not automatically create an index on the referencing columns". Joins and deletes on `orders.merchant_id`
         want one - see [PostgreSQL indexes and query plans](#/lesson/postgres-indexes-and-query-plans).

      Some rules span rows - "the refunds of an order may not exceed its amount" - and a CHECK can only see one row.
      They need a transaction that locks the order while it checks (taught in [Transactions, isolation and
      concurrency](#/lesson/transactions-and-isolation)) or a trigger.

  - id: on-delete
    kind: when
    concepts: [relational-model-and-keys]
    title: Choosing ON DELETE for each relationship
    body: |
      | Option | When the referenced row is deleted | Use it when |
      | ------ | ---------------------------------- | ----------- |
      | `NO ACTION` (the default) | the delete fails, checked at the end of the statement (or transaction, if deferred) | the default is fine for most references |
      | `RESTRICT` | the delete fails immediately, even if the statement would have fixed it | you never want the parent deleted while children exist |
      | `CASCADE` | the referring rows are deleted too | the children are **part of** the parent (refunds of an order, items of an order) |
      | `SET NULL` / `SET DEFAULT` | the reference is cleared | the child stands on its own (an order outlives a deleted customer account) |

      Real runs against the schema above:

      ```plaintext
      DELETE FROM merchants WHERE id = 2;
      ERROR:  update or delete on table "merchants" violates RESTRICT setting of foreign key constraint "customers_merchant_id_fkey" on table "customers"
      DETAIL:  Key (id)=(2) is referenced from table "customers".

      DELETE FROM customers WHERE id = 3;     -- customer 3 placed order 4; order 5 was a guest checkout
      SELECT id, customer_id FROM orders WHERE merchant_id = 2 ORDER BY id;
       id | customer_id
      ----+-------------
       4  |
       5  |
      (2 rows)

      DELETE FROM orders WHERE id = 4;        -- order 4 had a refund
      SELECT count(*) AS refunds_left FROM refunds;
       refunds_left
      --------------
       1
      (1 row)
      ```

      For money, think twice before CASCADE on anything a regulator or a reconciliation might need. Payments and
      refunds are usually **never deleted**: they get a status, and the merchant is deactivated rather than removed.
      CASCADE on `refunds.order_id` is fine in this teaching schema because orders themselves are only deleted in
      tests.

  - id: visual
    kind: visual
    concepts: [relational-model-and-keys, normalisation-3nf]
    title: The SandPay schema as an entity-relationship diagram
    body: |
      Each box is a table; each line is a foreign key, drawn from the referenced table to the tables that refer to
      it. The crow's foot marks the "many" side.

      ```mermaid
      erDiagram
        MERCHANTS ||--o{ CUSTOMERS : "has"
        MERCHANTS ||--o{ ORDERS : "receives"
        CUSTOMERS |o--o{ ORDERS : "places"
        ORDERS ||--o{ REFUNDS : "is refunded by"
        MERCHANTS {
          bigint id PK
          text name
          text email "unique, case-insensitive"
          timestamptz created_at
        }
        CUSTOMERS {
          bigint id PK
          bigint merchant_id FK
          text email "unique per merchant"
        }
        ORDERS {
          bigint id PK
          bigint merchant_id FK
          bigint customer_id FK "NULL for guests"
          bigint amount_minor "greater than 0"
          char currency "3 capital letters"
          text status "PENDING, PAID or FAILED"
          timestamptz created_at
        }
        REFUNDS {
          bigint id PK
          bigint order_id FK
          bigint amount_minor "greater than 0"
          text reason
          timestamptz created_at
        }
      ```

      What to notice: no table repeats another table's facts. An order knows its merchant only by `merchant_id`; the
      merchant's name lives in one row. The optional circle on the customer side (`|o`) is the guest checkout - an
      order with `customer_id` NULL.

  - id: normalisation
    kind: steps
    concepts: [normalisation-3nf]
    title: Normalising a spreadsheet, step by step
    body: |
      A merchant exports their sales to a spreadsheet and asks you to "just put it in the database":

      | order_ref | merchant | merchant_email | customer_email | items | amount | currency | refunds |
      | --------- | -------- | -------------- | -------------- | ----- | ------ | -------- | ------- |
      | 101 | Lumen Books | ops@lumen.example | asha@example.com | Atlas; Poems | 25.99 | EUR | 5.99 damaged; 10.00 late |
      | 102 | Lumen Books | ops@lumen.example | ben@example.com | Atlas | 12.50 | EUR | |

      1. **First normal form (1NF): one value per cell, no repeating groups.** `items` and `refunds` hold lists. Move
         each list into its own table with one row per element: `order_items (order_id, title)` and
         `refunds (order_id, amount_minor, reason)`. Store `amount` as minor units while you're at it.
      2. **Second normal form (2NF): every non-key column depends on the whole key.** This bites tables with a
         composite key. If `order_items` had the key `(order_id, product_id)` and a `product_title` column, the title
         depends on `product_id` alone - move it to `products`.
      3. **Third normal form (3NF): no non-key column depends on another non-key column.** In `orders`,
         `merchant_email` depends on `merchant`, not on the order. Two orders can then disagree about Lumen's email -
         an **update anomaly**. Move merchant facts to `merchants` and keep only `merchant_id` on the order. The same
         goes for the customer's details.

      The usual summary of 3NF is that every non-key column depends on "the key, the whole key, and nothing but the
      key". The result is the schema in the diagram above.

      **Denormalise on purpose, not by accident.** Copying a value is right when the copy means something different
      from the original:

      - **Snapshots.** The amount, currency and the merchant's legal name **as charged** belong on the payment row,
        even if the merchant later changes them - the receipt and the reconciliation must show what really happened.
      - **Measured performance needs.** A `paid_total_minor` on `merchants` maintained by the application may be
        worth it for a dashboard read millions of times - once you have measured, and with a test that the copy
        stays right.

  - id: queries
    kind: code
    concepts: [sql-queries-joins-nulls]
    title: Reading data - SELECT, joins and aggregates
    body: |
      The manual describes the **processing order** of a SELECT, which is not the order you write it in:
      `WITH`, then `FROM` (including joins), `WHERE`, `GROUP BY` and aggregates, `HAVING`, the select list,
      `DISTINCT`, `ORDER BY`, `LIMIT` / `OFFSET`. It explains most "why doesn't this work?" questions - for example,
      `WHERE` can't use an aggregate because aggregates don't exist yet when `WHERE` runs.

      The data: three merchants (Quiet Cafe has no orders), five orders (order 5 is a guest checkout with no customer)
      and two refunds.

      **INNER JOIN keeps only rows that match on both sides** - the guest order disappears:

      ```sql
      SELECT o.id, m.name AS merchant, c.email AS customer, o.amount_minor, o.status
      FROM orders o
      JOIN merchants m ON m.id = o.merchant_id
      JOIN customers c ON c.id = o.customer_id
      ORDER BY o.id;
      ```

      ```plaintext
       id | merchant    | customer         | amount_minor | status
      ----+-------------+------------------+--------------+--------
       1  | Lumen Books | asha@example.com | 2599         | PAID
       2  | Lumen Books | ben@example.com  | 1250         | PAID
       3  | Lumen Books | asha@example.com | 4000         | FAILED
       4  | Kettle & Co | asha@example.com | 990          | PAID
      (4 rows)
      ```

      **LEFT JOIN keeps every row of the left table**, filling the right side with NULL. With `LEFT JOIN customers`
      the same query returns 5 rows, and order 5 has an empty customer.

      **GROUP BY and aggregates** - paid revenue per merchant, including merchants that sold nothing:

      ```sql
      SELECT m.name,
             count(o.id)                      AS paid_orders,
             coalesce(sum(o.amount_minor), 0) AS paid_minor
      FROM merchants m
      LEFT JOIN orders o ON o.merchant_id = m.id AND o.status = 'PAID'
      GROUP BY m.id, m.name
      ORDER BY m.id;
      ```

      ```plaintext
       name        | paid_orders | paid_minor
      -------------+-------------+------------
       Lumen Books | 2           | 3849
       Kettle & Co | 1           | 990
       Quiet Cafe  | 0           | 0
      (3 rows)
      ```

      Move `o.status = 'PAID'` from `ON` into a `WHERE` clause and **Quiet Cafe disappears** - a real run returned two
      rows. `WHERE` runs after the join, and Quiet Cafe's joined row has `o.status` NULL, which is not `'PAID'`. A
      filter on the right-hand table of a LEFT JOIN belongs in `ON` when you want to keep the unmatched rows.

      Two details in that query: `count(o.id)` counts only non-NULL values, so the unmatched merchant gets 0 (a
      `count(*)` would have said 1 - it counts the joined row). And `sum` of no rows is NULL, not 0 - hence
      `coalesce(..., 0)`.

      **HAVING filters groups**, after aggregation:

      ```sql
      SELECT merchant_id, count(*) AS orders, sum(amount_minor) AS total_minor
      FROM orders
      WHERE status = 'PAID'              -- rows, before grouping
      GROUP BY merchant_id
      HAVING sum(amount_minor) > 1000    -- groups, after aggregating
      ORDER BY merchant_id;
      ```

      ```plaintext
       merchant_id | orders | total_minor
      -------------+--------+-------------
       1           | 2      | 3849
      (1 row)
      ```

  - id: nulls
    kind: internals
    concepts: [sql-queries-joins-nulls]
    title: NULL and three-valued logic
    body: |
      NULL means "unknown" (or "not applicable"), so SQL comparisons have **three** possible results: true, false and
      unknown (NULL). A real run:

      ```plaintext
      SELECT NULL = NULL AS null_eq_null, NULL IS NULL AS is_null, 1 <> NULL AS ne_null;
       null_eq_null | is_null | ne_null
      --------------+---------+---------
                    | true    |
      (1 row)
      ```

      `WHERE` keeps a row only when its condition is **true** - unknown is dropped like false. So:

      - `WHERE customer_id = NULL` returned **0 rows**; `WHERE customer_id IS NULL` returned the guest order. Use
        `IS NULL` / `IS NOT NULL`, or `IS DISTINCT FROM` to compare two values that may be NULL.
      - **Aggregates skip NULLs.** `count(*)` counts rows, `count(reason)` counts non-NULL reasons (2 and 1 for the
        two refunds); `sum` and `avg` ignore NULLs - `round(avg(amount_minor), 2)` over 2599, 1250 and a NULL gave `1924.50`,
        the average of two values, not three.
      - **`NOT IN` breaks on a NULL.** The manual: "if there are no equal right-hand values and at least one right-hand
        row yields null, the result of the NOT IN construct will be null, not true". With a refunds table holding
        order ids `1` and `NULL`, this real query returned nothing:

        ```sql
        SELECT id FROM orders WHERE id NOT IN (SELECT order_id FROM refunds);   -- (0 rows)
        ```

        `NOT EXISTS` asks a different question - "is there a matching row?" - and returned orders 2 and 3 as intended:

        ```sql
        SELECT o.id FROM orders o
        WHERE NOT EXISTS (SELECT 1 FROM refunds r WHERE r.order_id = o.id);
        ```

        Prefer `NOT EXISTS` for "rows without a match" whenever the subquery's column could ever be NULL.

  - id: writing
    kind: code
    concepts: [sql-queries-joins-nulls, sql-types-and-constraints]
    title: Writing data - CTEs, RETURNING, UPDATE, DELETE and upsert
    body: |
      **A CTE (`WITH`) names a subquery** so a long query reads top to bottom. Aggregate refunds per order first,
      then join - joining refunds directly to orders and summing would count an order once per refund:

      ```sql
      WITH refunded AS (
        SELECT order_id, sum(amount_minor) AS refunded_minor
        FROM refunds
        GROUP BY order_id
      )
      SELECT o.id, o.amount_minor,
             coalesce(r.refunded_minor, 0)                  AS refunded_minor,
             o.amount_minor - coalesce(r.refunded_minor, 0) AS net_minor
      FROM orders o
      LEFT JOIN refunded r ON r.order_id = o.id
      WHERE o.status = 'PAID'
      ORDER BY o.id;
      ```

      ```plaintext
       id | amount_minor | refunded_minor | net_minor
      ----+--------------+----------------+-----------
       1  | 2599         | 599            | 2000
       2  | 1250         | 0              | 1250
       4  | 990          | 990            | 0
      (3 rows)
      ```

      Since PostgreSQL 12, a CTE that is not recursive, has no side effects and is referenced once is inlined into
      the main query, so it costs nothing extra; `MATERIALIZED` and `NOT MATERIALIZED` override that choice.

      **`RETURNING` gives you the rows you just wrote** - generated ids and defaults included - without a second
      query:

      ```plaintext
      INSERT INTO merchants (name, email)
      VALUES ('Lumen Books', 'ops@lumen.example'), ('Kettle & Co', 'pay@kettle.example'), ('Quiet Cafe', 'hello@quiet.example')
      RETURNING id, name;
       id | name
      ----+-------------
       1  | Lumen Books
       2  | Kettle & Co
       3  | Quiet Cafe
      (3 rows)
      ```

      **`UPDATE` and `DELETE` affect every row their `WHERE` matches** - and every row if you forget it. Write the
      `WHERE` first, run it as a `SELECT` to see what it matches, and add `RETURNING` to see what changed:

      ```sql
      UPDATE orders SET status = 'PAID' WHERE id = 5 RETURNING id, status;
      ```

      **Upsert with `ON CONFLICT`** - insert, or do something else when a unique constraint would be violated.
      `EXCLUDED` is the row you tried to insert:

      ```plaintext
      INSERT INTO merchants (name, email) VALUES ('Lumen Books Ltd', 'ops@lumen.example')
      ON CONFLICT (email) DO UPDATE SET name = EXCLUDED.name
      RETURNING id, name, email;
       id | name            | email
      ----+-----------------+-------------------
       1  | Lumen Books Ltd | ops@lumen.example
      (1 row)

      ... ON CONFLICT (email) DO NOTHING RETURNING id;
       id
      ----
      (0 rows)
      ```

      `ON CONFLICT` needs a unique constraint or index on exactly the columns you name. `DO NOTHING` returns no row
      for the skipped insert - code that expects an id back must handle that.

      **Generated ids have gaps.** An insert that fails a constraint still uses up its identity value: after inserting
      1, failing on -1 and inserting 2, a real table held ids **1 and 3**. The manual: a value obtained by `nextval`
      "is not reclaimed for re-use if the calling transaction later aborts". Never use a database id as an invoice
      number that must be gapless.

  - id: example
    kind: example
    concepts: [sql-queries-joins-nulls, sql-types-and-constraints]
    title: "Real-world example: the dashboard's daily revenue chart"
    body: |
      The SandPay merchant dashboard shows a bar per day for the last week. The first version grouped orders by day:

      ```sql
      SELECT (created_at AT TIME ZONE 'UTC')::date::text AS day, sum(amount_minor) AS paid_minor
      FROM orders WHERE status = 'PAID'
      GROUP BY 1 ORDER BY 1;
      ```

      ```plaintext
       day        | paid_minor
      ------------+------------
       2026-11-10 | 3849
       2026-11-12 | 700
      (2 rows)
      ```

      The chart had **no bar for 11 November** - not a zero bar, no bar at all - and the frontend drew 10 and 12
      November side by side. Grouping can only produce groups that have rows. The fix generates every day and LEFT
      JOINs the orders to it:

      ```sql
      SELECT d.day::date::text AS day, coalesce(sum(o.amount_minor), 0) AS paid_minor
      FROM generate_series(date '2026-11-10', date '2026-11-12', interval '1 day') AS d(day)
      LEFT JOIN orders o
             ON o.merchant_id = 1
            AND o.status = 'PAID'
            AND (o.created_at AT TIME ZONE 'UTC')::date = d.day::date
      GROUP BY d.day
      ORDER BY d.day;
      ```

      ```plaintext
       day        | paid_minor
      ------------+------------
       2026-11-10 | 3849
       2026-11-11 | 0
       2026-11-12 | 700
      (3 rows)
      ```

      What a tester checks on a report like this: **empty periods** (a day, a merchant, a currency with no sales);
      **boundaries in time zones** - an order at 00:30 in India (+05:30) is still the previous day in UTC, so decide
      which day the merchant expects and test an order near midnight; **refunds and failed payments** excluded or
      netted as specified; and **totals that match** the order list for the same filter.

  - id: tests
    kind: tests
    concepts: [sql-types-and-constraints, relational-model-and-keys]
    title: Testing the schema itself
    body: |
      The schema is code. The first coding exercise checks it with tests like these, run against a real PostgreSQL
      engine:

      | Case | Statement | Expected |
      | ---- | --------- | -------- |
      | Valid data goes in | seed merchants, customers, orders (one guest), refunds | all rows inserted |
      | Money is exact | read `information_schema.columns` | `amount_minor` is `bigint` |
      | Defaults | insert an order without status or time | `PENDING`, `created_at` set |
      | Required fields | omit `amount_minor` | 23502 not_null_violation |
      | Positive amounts | `amount_minor` 0 and -500 | 23514 check_violation |
      | Currency format | `'eur'`, `'EURO'`, `'E1R'` | 23514 (or 22001 for a `char(3)` column) |
      | No duplicate merchants | same email, different capitalisation | 23505 unique_violation |
      | No orphans | merchant 99 | 23503 foreign_key_violation |
      | Parent with children | delete a merchant with orders | 23001 (RESTRICT) or 23503 (NO ACTION) |
      | Child outlives parent | delete a customer | their orders remain, `customer_id` NULL |
      | Child is part of parent | delete an order | its refunds are gone |

      **Evidence:** the SQLSTATE code, not the message text - messages change between versions and languages; the
      code is stable. For "nothing was written", count the rows after the failed statement.

  - id: mistakes
    kind: mistakes
    concepts: [sql-queries-joins-nulls, sql-types-and-constraints]
    title: Common mistakes and how to find them
    body: |
      - **Money in `double precision`.** Totals end in `...00000004`. Use `bigint` minor units or `numeric`.
      - **`timestamp` instead of `timestamptz`.** Reports shift by hours when a server or session changes zone.
      - **CHECK without NOT NULL.** The CHECK passes on NULL, so a NULL amount slips in.
      - **A filter on the right table of a LEFT JOIN in WHERE.** The LEFT JOIN quietly becomes an INNER JOIN; the
        merchants with no sales vanish.
      - **`= NULL`.** Always unknown, so always zero rows. Use `IS NULL`.
      - **`NOT IN` with a nullable subquery.** Zero rows the day a NULL appears. Use `NOT EXISTS`.
      - **Joining two one-to-many tables, then summing.** Orders joined to refunds **and** items multiply rows; sum
        each child table in its own CTE or subquery first.
      - **`count(*)` after a LEFT JOIN.** Counts the NULL-filled row as 1. Count a column from the right table.
      - **UPDATE or DELETE without WHERE.** Run the WHERE as a SELECT first; in a console, start a transaction
        (`BEGIN`) so you can `ROLLBACK`.
      - **Relying on row order** without `ORDER BY`, including a tie in the ORDER BY. Add a unique column (the id) as
        the last sort key.

      **Debugging a query that returns "wrong" rows:** remove `GROUP BY` and the aggregates and look at the raw joined
      rows - duplicated rows mean a one-to-many join multiplied them; missing rows mean an INNER JOIN or a WHERE on a
      LEFT-joined column dropped them; NULLs where you expected values mean the join condition didn't match.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [normalisation-3nf, relational-model-and-keys]
    title: Trade-offs and alternatives
    body: |
      - **`bigint` minor units or `numeric`?** Minor units are fast, exact and map to integers in every language, but
        you must know each currency's exponent. `numeric(12,2)` reads naturally in SQL but arrives in JavaScript as a
        string (or a lossy number) - be deliberate either way.
      - **Identity or UUID keys?** Identity values are small and ordered but guessable and only generated by the
        database. UUIDs can be created by any service and don't reveal volumes; `uuidv7()` keeps them roughly in time
        order, which is kinder to indexes than random version 4 UUIDs.
      - **Normalised or denormalised?** Normalise by default - it makes wrong data hard to write. Denormalise for
        snapshots that must not change, and for measured read-performance needs, with a test that keeps the copy
        right.
      - **`jsonb` or columns?** `jsonb` suits data whose shape you don't control (a processor's raw webhook payload).
        Anything you filter on, join on or constrain deserves a real column.
      - **Constraints or application validation?** Both. The application gives a friendly message
        ([Input validation and error handling](#/lesson/input-validation-and-error-handling)); the constraint
        guarantees the rule for every writer.
      - **What SQL alone can't do:** rules across rows and concurrent writers (two refunds at the same moment) need
        transactions and locks - [Transactions, isolation and concurrency](#/lesson/transactions-and-isolation).

  - id: summary
    kind: summary
    concepts: [relational-model-and-keys, sql-types-and-constraints, normalisation-3nf, sql-queries-joins-nulls]
    title: Quick reference
    body: |
      - Tables hold facts as rows; a **primary key** identifies a row, a **foreign key** refers to one. Prefer
        surrogate keys; keep natural keys UNIQUE.
      - ON DELETE: **RESTRICT/NO ACTION** to refuse, **CASCADE** for parts of a parent, **SET NULL** for independent
        children.
      - Money: **`bigint` minor units** or `numeric`, never float or `money`. Moments: **`timestamptz`**.
      - **NOT NULL + CHECK** together; UNIQUE allows many NULLs; foreign keys need their own index.
      - Check **SQLSTATE codes**: 23502, 23503, 23505, 23514, 23001.
      - **3NF:** one value per cell; depend on the whole key; nothing but the key. Denormalise for snapshots.
      - SELECT runs FROM/JOIN, WHERE, GROUP BY, HAVING, SELECT, ORDER BY, LIMIT.
      - **LEFT JOIN** filter on the right table goes in **ON**. `count(col)` and `coalesce(sum(...), 0)`.
      - NULL: **`IS NULL`**, **`NOT EXISTS`** not `NOT IN`, aggregates skip NULLs.
      - `WITH` for readable steps, **`RETURNING`** for written rows, **`ON CONFLICT`** for upserts, WHERE first for
        UPDATE and DELETE. Ids have gaps.

exercises:
  - id: money-column
    type: mcq
    concept: sql-types-and-constraints
    skill: application
    title: The column for an order amount
    prompt: |
      You are adding `amount` to the SandPay `orders` table. Amounts are summed for settlement reports and must match
      the processor's totals to the cent. Which column definition do you choose?
    options:
      - id: bigint-minor
        text: "amount_minor bigint NOT NULL CHECK (amount_minor > 0) - integer minor units"
        feedback: Correct - exact, fast, maps to integers in application code, and the database refuses missing, zero and negative amounts.
      - id: double
        text: "amount double precision NOT NULL"
        feedback: Floating point is inexact - in a real run 0.1 + 0.2 = 0.3 was false for double precision. Totals drift and reconciliations fail.
      - id: money-type
        text: "amount money NOT NULL"
        feedback: PostgreSQL's money type depends on the server's lc_monetary setting for its fractional precision and output format, and it has no currency - a database moved to another locale can misread it.
      - id: no-check
        text: "amount_minor bigint CHECK (amount_minor > 0)"
        feedback: Right type, but without NOT NULL the CHECK passes on NULL - a real run accepted an order with no amount.
    correct: [bigint-minor]
    hints:
      - Which of these types is exact?
      - What does a CHECK do when the value is NULL?
    solution: |
      **`amount_minor bigint NOT NULL CHECK (amount_minor > 0)`.** Integer minor units are exact (2599 means 25.99).
      `double precision` is inexact; `money` depends on a server setting and carries no currency. The CHECK alone
      lets NULL through, because "a check constraint is satisfied if the check expression evaluates to true or the
      null value" - so pair it with NOT NULL. `numeric(12,2)` would also be exact and acceptable.
    followUp: |
      The same table also stores `currency`. Write its definition so that `'eur'`, `'EURO'` and NULL are all refused.

  - id: on-delete-choice
    type: mcq
    concept: relational-model-and-keys
    skill: application
    title: What happens to a customer's orders?
    prompt: |
      Under data-protection rules a SandPay customer can ask for their account to be deleted. Their past orders must
      stay - the merchant's accounts and the refunds depend on them - but must no longer point at the person. How do
      you declare `orders.customer_id`?
    options:
      - id: set-null
        text: "customer_id bigint REFERENCES customers (id) ON DELETE SET NULL"
        feedback: Correct - the orders survive the delete and their reference is cleared, as a real run showed (customer_id became NULL on both orders).
      - id: cascade
        text: "customer_id bigint REFERENCES customers (id) ON DELETE CASCADE"
        feedback: CASCADE deletes the orders with the customer - and with them the merchant's revenue history and, through their own CASCADE, the refunds.
      - id: restrict
        text: "customer_id bigint NOT NULL REFERENCES customers (id) ON DELETE RESTRICT"
        feedback: RESTRICT refuses the delete while orders exist, so the customer could never be deleted - and NOT NULL would also forbid guest checkouts.
      - id: no-fk
        text: "customer_id bigint, with no foreign key, cleared by the application"
        feedback: Without a foreign key nothing stops orders pointing at customers that don't exist, and any code path that forgets to clear it leaves dangling ids.
    correct: [set-null]
    hints:
      - The orders must survive; what should the reference become?
      - The column must allow NULL for that to work.
    solution: |
      **`ON DELETE SET NULL`** on a nullable column. The child (the order) stands on its own, so it outlives the
      parent; the database clears the link in the same statement as the delete. CASCADE is for children that are
      **part of** the parent (refunds of an order); RESTRICT for parents that must never go while children exist.
      Note that the order may still hold personal data in other columns - deleting a person usually needs more than
      one foreign-key rule.
    followUp: |
      Choose the ON DELETE rule for `refunds.order_id` and for `orders.merchant_id`, and say why each differs.

  - id: left-join-where
    type: mcq
    concept: sql-queries-joins-nulls
    skill: analysis
    title: The merchant who vanished from the report
    prompt: |
      This query should list **every** merchant with their paid revenue, but Quiet Cafe (no orders yet) is missing
      from its results. A real run returned only Lumen Books and Kettle & Co.

      ```sql
      SELECT m.name, count(o.id) AS paid_orders, coalesce(sum(o.amount_minor), 0) AS paid_minor
      FROM merchants m
      LEFT JOIN orders o ON o.merchant_id = m.id
      WHERE o.status = 'PAID'
      GROUP BY m.id, m.name;
      ```

      Why?
    options:
      - id: where-after-join
        text: WHERE runs after the join; Quiet Cafe's joined row has o.status NULL, which is not true for = 'PAID', so the row is dropped.
        feedback: Correct - moving the condition into ON (LEFT JOIN orders o ON o.merchant_id = m.id AND o.status = 'PAID') keeps Quiet Cafe with 0.
      - id: coalesce
        text: coalesce(sum(...), 0) returns NULL for merchants without orders, and GROUP BY removes NULL groups.
        feedback: coalesce turns the NULL sum into 0, and GROUP BY doesn't remove groups - the row was gone before grouping.
      - id: count
        text: count(o.id) is 0 for Quiet Cafe, and groups with a count of 0 are not returned.
        feedback: SQL returns groups with a count of 0 if their rows reach GROUP BY - Quiet Cafe's row never did.
      - id: left-join
        text: LEFT JOIN drops rows from the left table that have no match.
        feedback: That's what INNER JOIN does. LEFT JOIN keeps every left row - the WHERE clause is what removes it here.
    correct: [where-after-join]
    hints:
      - Write down the joined row for Quiet Cafe before WHERE runs. What is o.status?
      - What does WHERE do with a condition that is NULL?
    solution: |
      The LEFT JOIN did keep Quiet Cafe, with NULLs in every `o` column. Then **WHERE `o.status = 'PAID'`** evaluated
      `NULL = 'PAID'` to NULL, and WHERE keeps only true rows. A WHERE condition on the right table of a LEFT JOIN
      turns it into an INNER JOIN. **Confirm** by removing GROUP BY and the aggregates and selecting `m.name, o.*` -
      you see Quiet Cafe's NULL row before the WHERE and not after. Fix by moving the condition into `ON`, which a real
      run confirmed returns Quiet Cafe with `0 | 0`.
    followUp: |
      With the condition in ON, a colleague changes `count(o.id)` to `count(*)`. What does Quiet Cafe show now, and
      why? (A real run is described in the "NULL and three-valued logic" section.)

  - id: not-in-null
    type: mcq
    concept: sql-queries-joins-nulls
    skill: analysis
    title: No unrefunded orders - really?
    prompt: |
      The finance team's "paid orders with no refund" check reported **zero** rows this morning, though most orders
      have no refund. Yesterday it worked. Overnight, an import added refunds that aren't matched to an order yet
      (`order_id` is NULL). The query:

      ```sql
      SELECT id FROM orders
      WHERE status = 'PAID' AND id NOT IN (SELECT order_id FROM refunds);
      ```

      What is the cause?
    options:
      - id: not-in-null
        text: For every order, id NOT IN (..., NULL) is NULL rather than true when no refund matches, so WHERE drops every row.
        feedback: Correct - the manual says the result of NOT IN "will be null, not true" when a right-hand row is NULL and none is equal. A real run returned 0 rows.
      - id: import-locked
        text: The import is still holding a lock on refunds, so the subquery returns nothing.
        feedback: A lock would make the query wait (or time out), not return zero rows - and plain inserts don't block readers in PostgreSQL.
      - id: type
        text: The NULL makes the subquery's column type unknown, so the comparison fails for every row.
        feedback: The column is still bigint; NULL is a value of every type. The comparison doesn't fail - it evaluates to NULL.
      - id: status
        text: The orders' status changed to REFUNDED during the import.
        feedback: Possible in theory, but the evidence says only refunds were imported. Check the cause you can reproduce first - the NULL order_id.
    correct: [not-in-null]
    hints:
      - Evaluate 2 NOT IN (1, NULL) by hand - is 2 <> NULL true?
      - What does WHERE do with NULL?
    solution: |
      `2 NOT IN (1, NULL)` means `2 <> 1 AND 2 <> NULL` - true AND unknown, which is **unknown**. WHERE drops it, for
      every order. **Confirm** with `SELECT count(*) FROM refunds WHERE order_id IS NULL` (non-zero since the import)
      and by running the query with `WHERE order_id IS NOT NULL` in the subquery. Fix it for good with **NOT EXISTS**,
      which a real run showed returning the right orders even with a NULL present:
      `WHERE NOT EXISTS (SELECT 1 FROM refunds r WHERE r.order_id = o.id)`.
    followUp: |
      Would `id IN (SELECT order_id FROM refunds)` - the positive version - also be affected by the NULL? Reason it out
      before you try it.

  - id: schema-debug
    type: debug
    concept: sql-types-and-constraints
    skill: analysis
    title: The settlement total that is off by a fraction
    prompt: |
      Settlement totals computed from this table sometimes differ from the processor's by a fraction of a cent, and
      last week an order with no amount at all appeared in the dashboard. Click the line(s) responsible.
    language: sql
    code: |
      CREATE TABLE orders (
        id           bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        merchant_id  bigint NOT NULL REFERENCES merchants (id),
        amount       double precision CHECK (amount > 0),
        currency     char(3) NOT NULL CHECK (currency ~ '^[A-Z]{3}$'),
        status       text NOT NULL DEFAULT 'PENDING',
        created_at   timestamptz NOT NULL DEFAULT now()
      );
    correctLines: [4]
    lineNotes:
      - line: 2
        note: A bigint identity primary key is a sound choice.
      - line: 3
        note: NOT NULL plus a foreign key - the merchant must exist. Fine (it could use an index for joins, but that isn't today's bug).
      - line: 5
        note: Three capital letters, NOT NULL - this column is fine.
      - line: 6
        note: Missing a CHECK on the allowed statuses is a weakness, but it doesn't explain fractional totals or missing amounts.
    hints:
      - Which column is used for totals?
      - Two problems, one line - its type, and what its constraints allow.
    solution: |
      **Line 4.** `double precision` is inexact, so sums drift (`0.1 + 0.2 = 0.3` was false in a real run), and the CHECK
      without NOT NULL accepts NULL - which is how an order with no amount got in. Fix:
      `amount_minor bigint NOT NULL CHECK (amount_minor > 0)`, and migrate existing values with
      `round(amount * 100)::bigint` after reviewing the rows the rounding changes. Line 6 deserves a CHECK too, but
      it's a separate finding.
    followUp: |
      Write the CHECK for line 6, and the query you would run before adding it to find existing rows it would reject.

  - id: select-order
    type: order
    concept: sql-queries-joins-nulls
    skill: application
    title: The order PostgreSQL processes a SELECT in
    prompt: |
      Put the clauses of this query in the order PostgreSQL's SELECT reference describes processing them:

      ```sql
      SELECT merchant_id, sum(amount_minor) AS total
      FROM orders JOIN merchants ON merchants.id = orders.merchant_id
      WHERE status = 'PAID'
      GROUP BY merchant_id
      HAVING sum(amount_minor) > 1000
      ORDER BY total DESC
      LIMIT 10;
      ```
    items:
      - id: from
        text: FROM and JOIN - build the joined rows
      - id: where
        text: WHERE - drop rows whose condition isn't true
      - id: group
        text: GROUP BY - form groups and compute aggregates
      - id: having
        text: HAVING - drop groups whose condition isn't true
      - id: select
        text: SELECT list - compute the output columns
      - id: order
        text: ORDER BY - sort the output
      - id: limit
        text: LIMIT - keep the first rows
    hints:
      - You can't filter rows you haven't built yet.
      - Aggregates exist only after grouping - which clauses can use them?
      - ORDER BY can use the alias total, so it comes after the select list.
    solution: |
      **FROM/JOIN, WHERE, GROUP BY, HAVING, SELECT, ORDER BY, LIMIT** - as the SELECT reference lists the general
      processing. It explains three rules: WHERE can't use aggregates (they don't exist yet); HAVING can; ORDER BY can
      use a select-list alias like `total` but WHERE can't. (Internally the planner may reorder work, but results are
      always as if this order were followed.)
    followUp: |
      Where does `WITH` fit in this order, and where does `DISTINCT`?

  - id: normalise-sheet
    type: short
    concept: normalisation-3nf
    skill: application
    title: Normalise the subscription spreadsheet
    prompt: |
      A merchant tracks subscriptions in one sheet with the columns `sub_id, customer_email, customer_name, plan_name,
      plan_price_minor, plan_currency, start_date, payments` - where `payments` holds a list like
      `"2026-10-01 999 PAID; 2026-11-01 999 FAILED"`. Normalise it to third normal form. List the tables with their key
      columns and foreign keys, and name the normal form each step fixes. Is there a value you would **deliberately**
      copy?
    modelAnswer: |
      - **1NF:** `payments` is a repeating group - move it to `subscription_payments (id PK, subscription_id FK,
        paid_on date, amount_minor bigint, status)`, one row per payment.
      - **3NF:** `customer_name` depends on `customer_email`, not on the subscription - move to `customers (id PK,
        email UNIQUE, name)`. `plan_price_minor` and `plan_currency` depend on `plan_name` - move to `plans (id PK,
        name UNIQUE, price_minor, currency)`.
      - Result: `customers`, `plans`, `subscriptions (id PK, customer_id FK, plan_id FK, start_date)` and
        `subscription_payments`. (2NF problems appear only with composite keys; with single-column keys the work is
        1NF and 3NF.)
      - **Deliberate copy:** each payment keeps the **amount and currency actually charged**, because the plan's
        price will change and a past payment must not change with it.
    rubric:
      - Moves the payments list into its own table with a foreign key (1NF).
      - Moves customer and plan facts into their own tables, naming the transitive dependency (3NF).
      - Keeps only foreign keys on subscriptions.
      - Keeps the charged amount on each payment as a deliberate snapshot, and explains why.
    hints:
      - Which cell holds more than one value?
      - Which columns would have to change in many rows if a plan's price changed?
    solution: |
      Split out `subscription_payments` (1NF), `customers` and `plans` (3NF - their facts depend on the email and the
      plan name, not on the subscription), keep foreign keys on `subscriptions`, and copy the charged amount and
      currency onto each payment as a snapshot.
    followUp: |
      The merchant now offers discounts per subscription. Where does the discount live, and what is copied onto the
      payment?

  - id: schema-coding
    type: coding
    concept: sql-types-and-constraints
    skill: application
    title: Make the SandPay schema refuse bad data
    prompt: |
      `exercises/sql/schema.sql` creates the four SandPay tables with columns but **no rules** - and with float
      amounts and zone-less timestamps. Change it so that the tests in `tests/sql/schema.test.ts` pass: exact
      `bigint` amounts, `timestamptz` times with defaults, a `PENDING` default status, NOT NULL where data is required,
      one merchant per email **ignoring capitalisation**, a customer email once per merchant, positive amounts, a
      three-capital-letter currency, the three allowed statuses, foreign keys everywhere a row refers to another, and
      the right ON DELETE rule for each: merchants can't be deleted while they have customers or orders, a deleted
      customer's orders remain without a customer, and an order's refunds go with it. The tests run your file in
      PGlite (real PostgreSQL 18) and check the SQLSTATE code of every rejected row.
    project: fullstack
    files:
      - exercises/sql/schema.sql
    test: tests/sql/schema.test.ts
    command: npx vitest run tests/sql/schema.test.ts
    hints:
      - "Start with types: `bigint` for amounts and `timestamptz NOT NULL DEFAULT now()` for every `created_at`."
      - "A UNIQUE constraint can't use an expression, but a unique index can: `CREATE UNIQUE INDEX ... ON merchants (lower(email))`."
      - "A table-level `UNIQUE (merchant_id, email)` allows the same email at two merchants."
      - "ON DELETE RESTRICT for merchants, SET NULL for orders.customer_id (which must allow NULL), CASCADE for refunds.order_id."
    modelAnswer: |
      ```sql
      CREATE TABLE merchants (
        id         bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        name       text        NOT NULL CHECK (name <> ''),
        email      text        NOT NULL,
        created_at timestamptz NOT NULL DEFAULT now()
      );
      CREATE UNIQUE INDEX merchants_email_lower_key ON merchants (lower(email));

      CREATE TABLE customers (
        id          bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        merchant_id bigint NOT NULL REFERENCES merchants (id) ON DELETE RESTRICT,
        email       text   NOT NULL,
        UNIQUE (merchant_id, email)
      );

      CREATE TABLE orders (
        id           bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        merchant_id  bigint NOT NULL REFERENCES merchants (id) ON DELETE RESTRICT,
        customer_id  bigint REFERENCES customers (id) ON DELETE SET NULL,
        amount_minor bigint NOT NULL CHECK (amount_minor > 0),
        currency     char(3) NOT NULL CHECK (currency ~ '^[A-Z]{3}$'),
        status       text NOT NULL DEFAULT 'PENDING' CHECK (status IN ('PENDING', 'PAID', 'FAILED')),
        created_at   timestamptz NOT NULL DEFAULT now()
      );

      CREATE TABLE refunds (
        id           bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        order_id     bigint NOT NULL REFERENCES orders (id) ON DELETE CASCADE,
        amount_minor bigint NOT NULL CHECK (amount_minor > 0),
        reason       text,
        created_at   timestamptz NOT NULL DEFAULT now()
      );
      ```

      The case-insensitive email needs a **unique index on an expression**, because a UNIQUE constraint can only
      list columns. `char(3)` pads `'EU'` to `'EU '`, which the regular expression then rejects; `'EURO'` is refused
      before the CHECK runs, with SQLSTATE 22001 - the tests accept either code. RESTRICT makes the merchant delete
      fail with 23001; the default NO ACTION would fail with 23503, which the tests also accept.
    rubric:
      - Every test in tests/sql/schema.test.ts passes.
      - Amounts are bigint minor units, never float or money; times are timestamptz.
      - Every CHECK column that must have a value is also NOT NULL.
      - Each ON DELETE rule matches the relationship (part of the parent, independent child, protected parent) and you can explain it.
      - Constraint violations are recognised by SQLSTATE code, not message text.
    followUp: |
      Add a `refunds` rule the tests don't check: a refund's `created_at` can't be earlier than its order's. Can a
      CHECK do it? If not, what can?
    solution: |
      Use `bigint` amounts and `timestamptz NOT NULL DEFAULT now()`, NOT NULL with every CHECK, a unique index on
      `lower(email)`, `UNIQUE (merchant_id, email)`, foreign keys with RESTRICT (merchants), SET NULL
      (`orders.customer_id`) and CASCADE (`refunds.order_id`). The full reference is in `solutions/sql/schema.sql`.

  - id: reports-coding
    type: coding
    concept: sql-queries-joins-nulls
    skill: application
    title: Write the dashboard's report queries
    prompt: |
      `exercises/sql/reports.ts` exports four SQL strings for the merchant dashboard, each with a comment saying
      exactly which columns and rows it must return: `revenueByMerchant` (every merchant, 0 for those without paid
      orders), `netPaidOrders` (paid orders net of **all** their refunds), `paidOrdersWithoutRefunds` (correct even
      though some refunds have a NULL `order_id`) and `dailyRevenue` (one merchant's paid revenue for every UTC day
      in a range, 0 on days without sales; parameters `$1`, `$2`, `$3`). `tests/sql/reports.test.ts` creates the
      tables, loads the data and checks every row your queries return - read its data first.
    project: fullstack
    files:
      - exercises/sql/reports.ts
    test: tests/sql/reports.test.ts
    command: npx vitest run tests/sql/reports.test.ts
    hints:
      - Keep merchants without paid orders by putting the status filter in the LEFT JOIN's ON clause, and use count(o.id) and coalesce(sum(...), 0).
      - Order 101 has two refunds. Sum refunds per order in a CTE before joining, or the order is counted twice.
      - The test data has a refund with order_id NULL - use NOT EXISTS, not NOT IN.
      - "For days: `generate_series($2::date, $3::date, interval '1 day')`, LEFT JOIN orders on the merchant, status and `(created_at AT TIME ZONE 'UTC')::date`, and return the day as `::date::text`."
    modelAnswer: |
      ```sql
      -- revenueByMerchant
      SELECT m.name, count(o.id) AS paid_orders, coalesce(sum(o.amount_minor), 0) AS paid_minor
      FROM merchants m
      LEFT JOIN orders o ON o.merchant_id = m.id AND o.status = 'PAID'
      GROUP BY m.id, m.name
      ORDER BY paid_minor DESC, m.name;

      -- netPaidOrders
      WITH refunded AS (SELECT order_id, sum(amount_minor) AS refunded_minor FROM refunds GROUP BY order_id)
      SELECT o.id, o.amount_minor,
             coalesce(r.refunded_minor, 0) AS refunded_minor,
             o.amount_minor - coalesce(r.refunded_minor, 0) AS net_minor
      FROM orders o LEFT JOIN refunded r ON r.order_id = o.id
      WHERE o.status = 'PAID'
      ORDER BY o.id;

      -- paidOrdersWithoutRefunds
      SELECT o.id FROM orders o
      WHERE o.status = 'PAID' AND NOT EXISTS (SELECT 1 FROM refunds r WHERE r.order_id = o.id)
      ORDER BY o.id;

      -- dailyRevenue
      SELECT d.day::date::text AS day, coalesce(sum(o.amount_minor), 0) AS paid_minor
      FROM generate_series($2::date, $3::date, interval '1 day') AS d(day)
      LEFT JOIN orders o ON o.merchant_id = $1 AND o.status = 'PAID'
                        AND (o.created_at AT TIME ZONE 'UTC')::date = d.day::date
      GROUP BY d.day
      ORDER BY d.day;
      ```

      Each query defends against one trap the data sets: a merchant with no paid orders (ON, not WHERE), an order
      with two refunds (aggregate before joining), a NULL in a subquery (NOT EXISTS), and an order placed at 00:30 in
      India that belongs to the previous UTC day (convert with `AT TIME ZONE 'UTC'` before taking the date).
    rubric:
      - Every test in tests/sql/reports.test.ts passes.
      - The status filter for revenueByMerchant is in the ON clause, and you can explain why WHERE loses a merchant.
      - Refunds are aggregated before they are joined, so no order is counted twice.
      - NOT EXISTS is used for "without a match", and you can explain the NOT IN failure.
      - Every query has an ORDER BY that makes its row order deterministic.
    followUp: |
      Change `dailyRevenue` to use the merchant's own time zone (a `time_zone` column on merchants, such as
      `Asia/Kolkata`). Which order in the test data moves to a different day?
    solution: |
      Keep unmatched merchants with the filter in ON, aggregate refunds in a CTE before joining, use NOT EXISTS
      because of the NULL `order_id`, and build the days with `generate_series` LEFT JOINed to orders converted to
      UTC dates. The full reference is in `solutions/sql/reports.ts`.

  - id: schema-test-plan
    type: testdesign
    concept: relational-model-and-keys
    skill: analysis
    title: Test the refunds table at the database level
    prompt: |
      A developer adds the `refunds` table (id, `order_id` referencing orders ON DELETE CASCADE, `amount_minor`
      bigint NOT NULL CHECK > 0, `reason`, `created_at`). Design database-level tests - run straight against
      PostgreSQL, not through the API. For each case give the precondition, the SQL you run, the expected result
      **and the evidence** you would record. Include at least one rule the schema can't enforce on its own.
    hints:
      - One case per constraint, plus the happy path.
      - What happens to refunds when their order is deleted - and is that what the business wants?
      - Which rule involves more than one row?
    modelAnswer: |
      1. **Valid refund** - a PAID order 101 of 2599; insert a refund of 599 with `RETURNING id, created_at` →
         one row, `created_at` set. Evidence: the returned row.
      2. **Zero and negative amounts** - insert 0 and -1 → SQLSTATE 23514 each; `count(*)` unchanged.
      3. **Missing amount** - insert NULL → 23502 (catches a CHECK without NOT NULL).
      4. **Unknown order** - `order_id` 999 → 23503.
      5. **Missing order** - `order_id` NULL → 23502 (the column must be NOT NULL).
      6. **Amount type** - `information_schema.columns` shows `bigint`; inserting 5.5 is rejected or rounded -
         record which, and agree that the API refuses decimals.
      7. **Cascade** - delete order 101 in a test database → its refunds are gone. Evidence: counts before and after.
         Then question it: should orders with refunds ever be deletable? Raise it with the team.
      8. **Over-refund (cross-row rule)** - two refunds of 2000 on an order of 2599 → the schema accepts both. Record
         it as a rule the application or a locked transaction must enforce, and add an API-level test - including two
         refunds sent at the same moment.
      9. **Ids have gaps** - after a failed insert, the next id skips a value; make sure no report treats ids as a
         gapless count.
    rubric:
      - One case per constraint, each expecting a specific SQLSTATE code.
      - Checks that a failed insert wrote nothing (row counts).
      - Tests the CASCADE behaviour and questions whether it is right for money.
      - Identifies the over-refund rule as one the schema can't enforce and moves it to the right layer, including concurrency.
      - Records evidence (returned rows, codes, counts), not just pass or fail.
    solution: |
      Cover each constraint with its SQLSTATE code and a row count, test and question the CASCADE, and identify the
      over-refund rule as one a CHECK can't express - it needs the application or a locked transaction, tested with
      concurrent refunds.
    followUp: |
      Write the SQL for case 8 as a single query that finds every order whose refunds already exceed its amount.

  - id: interview-schema
    type: interview
    concept: normalisation-3nf
    skill: analysis
    title: '"Design the database for a simple payments service"'
    prompt: |
      An interviewer asks: "Design the tables for a service where merchants take payments from customers and can
      issue partial refunds. Walk me through your tables, keys, types and constraints - and tell me what the
      database can't guarantee by itself."
    modelAnswer: |
      Four tables in third normal form, each with a surrogate `bigint` identity (or `uuidv7()`) primary key:
      `merchants` (name, email unique ignoring case), `customers` (merchant_id FK, email unique per merchant),
      `payments` (merchant_id FK RESTRICT, customer_id FK SET NULL for guests and deleted accounts, amount_minor bigint
      NOT NULL CHECK > 0, currency char(3) with a format CHECK, status with an allowed-values CHECK, created_at
      timestamptz) and `refunds` (payment_id FK, amount_minor, reason, created_at). Facts live once: a payment refers
      to its merchant by id - except deliberate snapshots, such as the amount and currency charged.

      Types: integer minor units, never float - floats drift; timestamptz so instants are unambiguous across zones.
      Constraints: NOT NULL with every CHECK, because a CHECK passes on NULL; an index on each foreign key, since
      PostgreSQL doesn't create one. I'd make the application map SQLSTATE codes (23505, 23503, 23514) to clear API
      errors.

      What the schema can't guarantee: rules across rows - refunds summing to more than the payment - and races, such
      as two refund requests at once. Those need a transaction that locks the payment row (`SELECT ... FOR UPDATE`)
      before checking the total, plus idempotency keys so retries don't double-refund. I'd also never delete payments;
      status changes and audit history instead.
    rubric:
      - Separate tables with primary and foreign keys, and a reasoned ON DELETE rule for each relationship.
      - Integer minor units (or numeric) for money and timestamptz for time, with reasons.
      - NOT NULL, UNIQUE and CHECK constraints, including the CHECK-passes-on-NULL point.
      - Explains normalisation and at least one deliberate denormalisation (a snapshot).
      - Names the cross-row and concurrency limits and a way to handle them (transaction with a lock, idempotency).
    followUps:
      - How would you list a merchant's payments with their refunded totals without counting a payment twice?
      - A merchant wants to change their name. Which past records should show the old name?
      - Would you use UUIDs or identity columns here, and why?
    hints:
      - Start from the nouns - merchant, customer, payment, refund - and their relationships.
      - For each column ask "what is the worst value someone could write here?"
      - End with what needs more than one row to check.
    solution: |
      Normalised tables with surrogate keys and foreign keys whose ON DELETE matches each relationship; minor-unit
      integers and timestamptz; NOT NULL alongside every CHECK; deliberate snapshots on payments; and the honest
      limits - cross-row and concurrent rules need a locked transaction and idempotency keys.

placement:
  - id: place-natural-key
    type: mcq
    concept: relational-model-and-keys
    skill: application
    title: The merchant's email as the primary key?
    prompt: |
      A colleague proposes `merchants (email text PRIMARY KEY, name text)`, with `orders.merchant_email` referencing
      it, "because emails are unique anyway". What is the main problem?
    options:
      - id: changes
        text: Emails change; every order referring to the old email would have to change too, so use a surrogate id and keep email as a UNIQUE column.
        feedback: Correct - a primary key should never change. Natural keys stay unique as UNIQUE constraints, while references use a stable surrogate key.
      - id: not-unique
        text: A text column can't be a primary key in PostgreSQL.
        feedback: Any type with equality can be a primary key, text included. The problem is that this value changes.
      - id: nulls
        text: A primary key column allows NULLs, so merchants without an email would collide.
        feedback: The opposite - a primary key is UNIQUE and NOT NULL, enforced by the database.
      - id: slow
        text: Text keys make every query too slow to use.
        feedback: Text keys are larger than bigint, but they work. Speed is a minor concern next to a key that changes.
    correct: [changes]
    solution: |
      Primary keys should be **stable**. An email changes - the merchant rebrands, or a typo is fixed - and with
      `ON UPDATE` rules or manual updates that change ripples into every referring table. Use a surrogate key
      (`bigint` identity or a UUID) and keep the email unique with a constraint or a unique index on `lower(email)`.

  - id: place-check-null
    type: mcq
    concept: sql-types-and-constraints
    skill: application
    title: Does this CHECK stop a missing amount?
    prompt: |
      The table has `amount_minor bigint CHECK (amount_minor > 0)` and nothing else on that column. What does
      `INSERT INTO orders (id, merchant_id, amount_minor) VALUES (3, 1, NULL)` do?
    options:
      - id: accepts
        text: It succeeds - the CHECK evaluates to NULL, which counts as satisfied.
        feedback: Correct - "a check constraint is satisfied if the check expression evaluates to true or the null value". A real run inserted the row.
      - id: check-violation
        text: It fails with a check violation (23514), because NULL is not greater than 0.
        feedback: NULL > 0 is NULL, not false - and only false violates a CHECK.
      - id: not-null-violation
        text: It fails with a not-null violation (23502), because a CHECK implies NOT NULL.
        feedback: A CHECK implies nothing about NULL. Only an explicit NOT NULL (or a primary key) refuses it.
      - id: zero
        text: It succeeds and stores 0, the default for bigint.
        feedback: Columns without a DEFAULT store NULL, not 0 - and 0 would fail the CHECK.
    correct: [accepts]
    solution: |
      The row goes in with a NULL amount. A CHECK fails only when its expression is **false**; `NULL > 0` is NULL. Add
      `NOT NULL` to every column whose CHECK must always apply.

  - id: place-3nf
    type: mcq
    concept: normalisation-3nf
    skill: analysis
    title: Which table breaks third normal form?
    prompt: |
      Every table below has the single-column primary key `id`. Which one is **not** in third normal form?
    options:
      - id: transitive
        text: "payouts (id, merchant_id, merchant_bank_account, amount_minor, paid_on)"
        feedback: Correct - merchant_bank_account depends on merchant_id, a non-key column, not on the payout. Change the account in one row and the payouts disagree.
      - id: fk-only
        text: "refunds (id, payment_id, amount_minor, reason, created_at)"
        feedback: Every column describes the refund itself; payment_id is a foreign key, not a copied fact. This is 3NF.
      - id: snapshot
        text: "payments (id, merchant_id, amount_minor, currency, created_at)"
        feedback: Amount and currency describe this payment - they are its own facts (and a deliberate snapshot of what was charged). This is 3NF.
      - id: merchants
        text: "merchants (id, name, email, created_at)"
        feedback: All columns depend on the merchant's id and nothing else. This is 3NF.
    correct: [transitive]
    solution: |
      In `payouts`, `merchant_bank_account` depends on `merchant_id` - a **transitive dependency** through a non-key
      column. It belongs in `merchants` (or a `bank_accounts` table). If the payout must record which account it was
      paid to, store a reference to that account row - or deliberately snapshot it, and say so.

  - id: place-count-left-join
    type: mcq
    concept: sql-queries-joins-nulls
    skill: analysis
    title: Counting orders per merchant
    prompt: |
      `merchants` holds Lumen Books (3 orders) and Quiet Cafe (no orders). What does this query return for Quiet Cafe?

      ```sql
      SELECT m.name, count(*) AS count_star, count(o.id) AS count_orders
      FROM merchants m LEFT JOIN orders o ON o.merchant_id = m.id
      GROUP BY m.id, m.name;
      ```
    options:
      - id: one-zero
        text: "count_star 1, count_orders 0"
        feedback: Correct - the LEFT JOIN produces one row for Quiet Cafe with NULLs on the orders side; count(*) counts that row, count(o.id) skips the NULL. A real run gave exactly this.
      - id: zero-zero
        text: "count_star 0, count_orders 0"
        feedback: count(*) counts rows, and the LEFT JOIN made one row for Quiet Cafe.
      - id: null-null
        text: "count_star NULL, count_orders NULL"
        feedback: count never returns NULL - it returns 0 when nothing is counted. sum is the aggregate that gives NULL for no input.
      - id: missing
        text: Quiet Cafe isn't in the result.
        feedback: That would happen with an INNER JOIN, or a WHERE on an orders column. LEFT JOIN keeps it.
    correct: [one-zero]
    solution: |
      **1 and 0.** The LEFT JOIN keeps Quiet Cafe as one row with NULL order columns. `count(*)` counts rows (1);
      `count(o.id)` counts non-NULL values (0). For "how many orders", count a column of the right-hand table.

recall:
  - id: recall-keys
    concept: relational-model-and-keys
    prompt: What is the difference between a primary key and a foreign key, and why prefer a surrogate primary key?
    answer: A primary key uniquely identifies a row (UNIQUE and NOT NULL). A foreign key requires its value to exist as a key in another table. Surrogate keys (identity, UUID) never change, so references stay valid; natural keys like email change - keep them as UNIQUE columns.
  - id: recall-on-delete
    concept: relational-model-and-keys
    prompt: Name the ON DELETE options and when to use each.
    answer: NO ACTION (default) and RESTRICT refuse the delete while children exist; CASCADE deletes children that are part of the parent; SET NULL / SET DEFAULT clear the reference for children that stand on their own.
  - id: recall-money-time
    concept: sql-types-and-constraints
    prompt: Which PostgreSQL types do you use for money and for a moment in time, and why?
    answer: Money - bigint minor units (or numeric), because float is inexact and money depends on lc_monetary. Time - timestamptz, stored as UTC and shown in the session's zone; timestamp without time zone drops the offset.
  - id: recall-check-null
    concept: sql-types-and-constraints
    prompt: What surprising things do CHECK, UNIQUE and FOREIGN KEY do with NULL or indexes?
    answer: A CHECK is satisfied when it evaluates to NULL - add NOT NULL. UNIQUE allows many NULLs (unless NULLS NOT DISTINCT). A foreign key does not create an index on the referencing column.
  - id: recall-sqlstate
    concept: sql-types-and-constraints
    prompt: Give the SQLSTATE codes for not-null, foreign-key, unique and check violations.
    answer: 23502 not_null_violation, 23503 foreign_key_violation, 23505 unique_violation, 23514 check_violation (and 23001 restrict_violation for ON DELETE RESTRICT).
  - id: recall-3nf
    concept: normalisation-3nf
    prompt: State 1NF, 2NF and 3NF in one line each, and one good reason to denormalise.
    answer: 1NF - one value per cell, no repeating groups. 2NF - non-key columns depend on the whole key. 3NF - no non-key column depends on another non-key column. Denormalise for snapshots that must not change (the amount charged) or a measured performance need.
  - id: recall-left-join-filter
    concept: sql-queries-joins-nulls
    prompt: Where does a filter on the right-hand table of a LEFT JOIN go, and why?
    answer: In the ON clause. In WHERE it runs after the join and drops the unmatched rows (their columns are NULL), turning the LEFT JOIN into an INNER JOIN.
  - id: recall-null-logic
    concept: sql-queries-joins-nulls
    prompt: Why does NOT IN return nothing when the subquery contains a NULL, and what do you use instead?
    answer: x NOT IN (..., NULL) is unknown rather than true when nothing matches, and WHERE keeps only true. Use NOT EXISTS (SELECT 1 FROM ... WHERE ... = x), which tests for a matching row.

