environment: |
  - **Runtime and tools:** **Node.js 24** (v24.21.0, from this repository's `.nvmrc`), Express 5.3, **zod
    4.6** and Vitest 5.0.3 - the versions pinned in `practice/fullstack`. Every command, log line and exit
    code in this lesson was captured on Linux (bash, curl) in November 2026; timings will differ on your
    machine. Signal behaviour (SIGTERM, exit code 143) is POSIX - Windows has no SIGTERM delivery (see the
    Node.js note below).
  - **Twelve-factor app:** [III. Config](https://12factor.net/config), [IV. Backing
    services](https://12factor.net/backing-services), [V. Build, release, run](https://12factor.net/build-release-run),
    [IX. Disposability](https://12factor.net/disposability), [X. Dev/prod parity](https://12factor.net/dev-prod-parity)
    and [XI. Logs](https://12factor.net/logs) (Adam Wiggins, 12factor.net). A methodology, not a standard.
  - **Node.js 24 documentation:** [Command-line options - `--env-file`](https://nodejs.org/docs/latest-v24.x/api/cli.html#--env-filefile)
    (stable since v24.10.0; the environment wins over the file), [Environment
    variables](https://nodejs.org/docs/latest-v24.x/api/environment_variables.html) (`process.loadEnvFile`,
    `util.parseEnv`), [process - Signal events](https://nodejs.org/docs/latest-v24.x/api/process.html#signal-events)
    ("SIGTERM and SIGINT have default handlers on non-Windows platforms that reset the terminal mode before
    exiting with code 128 + signal number. If one of these signals has a listener installed, its default
    behavior will be removed"; SIGKILL "cannot have a listener installed"), [http -
    `server.close()`](https://nodejs.org/docs/latest-v24.x/api/http.html#serverclosecallback) (closes idle
    connections since v19.0.0), `server.closeAllConnections()` and `server.closeIdleConnections()` (v18.2.0).
  - **Express:** [Health Checks and Graceful
    Shutdown](https://expressjs.com/en/advanced/healthcheck-graceful-shutdown.html).
  - **zod 4:** [Stringbools](https://zod.dev/api#stringbools) (`z.stringbool()` - "valuable to parse certain
    string boolish values" such as environment variables) and [Formatting errors](https://zod.dev/error-formatting).
  - **Secrets:** OWASP [Secrets Management Cheat
    Sheet](https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html) (secret
    lifecycle - creation, rotation, revocation, expiration; section 5.1 on injecting secrets into containers;
    section 9.2 on remediation).
  - **Kubernetes (platform-specific - other platforms differ):** [Liveness, Readiness, and Startup
    Probes](https://kubernetes.io/docs/concepts/configuration/liveness-readiness-startup-probes/), [Configure
    Liveness, Readiness and Startup Probes](https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/)
    (an HTTP probe succeeds for "any code greater than or equal to 200 and less than 400"), [Pod Lifecycle -
    Termination of Pods](https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/#pod-termination)
    (TERM, a grace period that defaults to 30 seconds, then KILL), [Deployments - Rolling Update
    Deployment](https://kubernetes.io/docs/concepts/workloads/controllers/deployment/) (`maxUnavailable` and
    `maxSurge`, both 25% by default) and [Kubernetes API health endpoints](https://kubernetes.io/docs/reference/using-api/health-checks/)
    (where the `/livez` and `/readyz` names come from). No cluster was run for this lesson: the probe YAML is
    illustrative and checked field by field against those pages.
  - **Docker:** [`docker stop`](https://docs.docker.com/reference/cli/docker/container/stop/) - SIGTERM (or
    the image's STOPSIGNAL), then SIGKILL after a timeout that defaults to 10 seconds for Linux containers.
  - **Release techniques (practitioner articles):** Martin Fowler, [BlueGreenDeployment](https://martinfowler.com/bliki/BlueGreenDeployment.html)
    (1 March 2010); Danilo Sato, [CanaryRelease](https://martinfowler.com/bliki/CanaryRelease.html) (25 June
    2014) and [ParallelChange](https://martinfowler.com/bliki/ParallelChange.html) (13 May 2014); Pete
    Hodgson, [Feature Toggles (aka Feature Flags)](https://martinfowler.com/articles/feature-toggles.html) (9
    October 2017). Vendor-neutral flag evaluation: the [OpenFeature specification](https://openfeature.dev/specification/)
    (named, not used here).
  - **Fictional:** SandPay, its dashboard API, every host name (`db.internal`), release id, variable value and
    "secret" in the examples. The secrets in tests are labelled test-only.
  - **Not repeated here:** migrations and locks in depth ([Migrations and data access from
    Node.js](#/lesson/migrations-and-data-access)), images and Compose ([Containers with Docker and
    Compose](#/lesson/docker-and-compose)), the pipeline itself ([CI/CD for web
    applications](#/lesson/ci-cd-for-web-apps)) and logs, metrics and traces ([Observability for web
    applications](#/lesson/observability-for-web-apps)).

prerequisites:
  - express-http-server
  - input-validation-and-error-handling
  - migrations-and-data-access

concepts:
  - id: environment-config-and-secrets
    name: Configuration in the environment, validated at start-up, and secrets kept out of code
    summary: Config is whatever varies between deploys - backing-service URLs, credentials, per-deploy values. Twelve-factor keeps it out of the code in environment variables; the app parses all of it once at start-up into a typed, frozen object and refuses to start with every problem listed, never echoing a value. Secrets have no defaults in code, come from a secret store or the platform, are redacted from logs, and are rotated and revoked through a lifecycle.
  - id: health-checks-and-graceful-shutdown
    name: Liveness, readiness and graceful shutdown
    summary: Liveness asks "should this process be restarted?" and must not depend on the database; readiness asks "should traffic be sent here now?" and turns false while a dependency is down or the process is shutting down. On SIGTERM a web process turns not-ready, keeps serving briefly while load balancers notice, stops accepting connections, lets in-flight requests finish within a deadline, closes the pool last and exits - before the platform's SIGKILL.
  - id: zero-downtime-releases
    name: Rolling, blue-green and canary releases with compatible changes
    summary: A rolling update replaces instances a few at a time; blue-green switches traffic between two complete environments; a canary sends a small share of real traffic to the new version and widens it while the metrics stay healthy. All of them run old and new versions at the same time, so every release - API and schema - must be compatible with the previous one (expand, migrate, contract), and rollback must be a routing change or a redeploy of an immutable earlier release.
  - id: feature-flags
    name: Feature flags that separate deploying from releasing
    summary: A flag lets code that is deployed stay switched off. Release toggles are short-lived and removed once the feature is out; ops toggles and kill switches let operators degrade a feature quickly; experiment and permission toggles route users by cohort. Off means the existing behaviour, every flag has an owner and an expiry, and tests cover the production configuration, the fallback with new flags off and all flags on - not every combination.

objectives:
  - Explain which settings are config in the twelve-factor sense and which are not, and why env vars are not grouped into named "environments".
  - Write a start-up config loader that validates every variable with zod, reports all problems at once without echoing values, and returns a frozen typed object.
  - Decide where a secret should live, how it reaches the process, and what to do when one leaks.
  - Design /livez and /readyz for an Express app and explain the failure each one prevents.
  - Implement graceful shutdown on SIGTERM - readiness, drain delay, server.close, a deadline, closing the pool last - and trace what happens to an in-flight request.
  - Compare rolling, blue-green and canary releases, and plan a schema change and a rollback that work while two versions run.
  - Choose the kind of feature flag for a situation and say which flag configurations to test.

sections:
  - id: intuition
    kind: intuition
    concepts: [environment-config-and-secrets, health-checks-and-graceful-shutdown]
    title: The idea in plain language
    body: |
      Think of a **restaurant chain**. Every branch cooks from the **same recipe book** (the code). What
      differs per branch - the address of the local supplier, the key to the safe, how many tables are open
      - is written on a **card pinned in that branch's kitchen** (the configuration). Nobody copies the safe
      key into the recipe book, because the recipe book is printed for every branch and, one day, maybe
      published.

      A branch also tells the head office two different things. "**Is anyone in the kitchen at all?**" - if
      not, send someone to unlock and restart it. And "**Can we take guests right now?**" - maybe the
      kitchen is fine but the fish supplier is late, so stop sending guests for a while, but don't fire the
      cook. Those are **liveness** and **readiness**.

      Closing a branch for the night is not switching off the lights with guests at the table. You **stop
      seating new guests**, let the people already eating finish, then lock the pantry and leave - and if
      someone is still eating two hours later, the manager makes a call. That is **graceful shutdown**.

      Deployment is doing this **every day, branch by branch, while the chain stays open**: some branches on
      the old menu, some on the new, until all have switched. Anything that only works if every branch
      changes at the same moment will break.

  - id: what
    kind: what
    concepts: [environment-config-and-secrets, health-checks-and-graceful-shutdown, zero-downtime-releases, feature-flags]
    title: The vocabulary
    body: |
      | Term | Meaning here |
      | --- | --- |
      | **Build** | Code at one commit turned into a runnable artefact - an image or a bundle. No config in it. |
      | **Release** | A build **plus** one deploy's config, with a unique, immutable id (`2026-11-14.3`, `v100`). Twelve-factor: "Releases are an append-only ledger". |
      | **Deploy** | An environment where releases run - production, staging, a developer's laptop. |
      | **Config** | "Everything that is likely to vary between deploys" (12factor.net): database and service URLs, credentials, per-deploy values. Not routes or wiring, which are the same everywhere. |
      | **Secret** | Config that grants access - passwords, API keys, signing keys, the session secret. |
      | **Liveness** | "Determine when to restart a container" (Kubernetes) - is the process able to make progress at all? |
      | **Readiness** | "Determine when a container is ready to accept traffic" - should the load balancer send requests here now? |
      | **Startup probe** | Kubernetes only: holds off liveness and readiness checks until a slow-starting app is up. |
      | **Graceful shutdown** | Stop accepting work, finish the work in progress, release resources, exit - in response to SIGTERM. |
      | **Grace period** | How long the platform waits between SIGTERM and SIGKILL - 30 s by default on Kubernetes, 10 s for `docker stop` on Linux. |
      | **Rolling update** | Replace instances in small steps; old and new versions serve side by side meanwhile. |
      | **Blue-green** | Two complete environments; the router points at one; release by switching it, roll back by switching back. |
      | **Canary** | Route a small share of users to the new version first and widen it while the metrics stay good. |
      | **Expand and contract** | A.k.a. **parallel change**: add the new form alongside the old, migrate users, then remove the old. |
      | **Feature flag (toggle)** | A switch that changes behaviour without changing code, so deploying and releasing become separate decisions. |

      Two words cause most confusion. **"Environment"** means a *deploy* (staging) in conversation and an
      *environment variable* in code; this lesson says "deploy" for the first. And **"health check"** on its
      own is ambiguous - always ask: health check *for what decision*, restart or routing?

  - id: why
    kind: why
    concepts: [environment-config-and-secrets, health-checks-and-graceful-shutdown]
    title: What goes wrong without it
    body: |
      Each of these is a real class of incident, and each one is invisible in a local test run:

      - **A default that ships.** `SESSION_SECRET ?? 'dev-secret'` works on every laptop. In production a
        forgotten variable means every session cookie is signed with a string that is in your Git history -
        anyone can forge one. The app started; nothing logged an error.
      - **A flag that can't be turned off.** `Boolean(process.env.FEATURE_NEW_REFUND_FLOW)` is `true` for
        `"false"` (shown below - any non-empty string is truthy). The kill switch is wired, documented and
        useless.
      - **A crash at 3 a.m. instead of at deploy.** Config read lazily (`process.env.X` deep in a request
        handler) fails on the first request that needs it - possibly hours later and only on one code path.
      - **Requests dropped on every deploy.** The platform sends SIGTERM; with no handler Node.js exits
        immediately (code 143). Every request in flight gets a reset connection, so each release costs a
        burst of 502s that "nobody can reproduce".
      - **A restart storm.** Liveness that runs `SELECT 1`: the database has a 20-second blip, every
        instance fails liveness, the platform restarts all of them at once, and they all reconnect together
        when it returns. A partial outage became a full one.
      - **A release that can't be rolled back.** The new version renamed a column in its migration. Rolling
        back the code doesn't rename it back, and the old code can't read the table.

      As a tester you will meet all of these as "it worked in staging". The rest of the lesson is how to
      design them out and how to check that they are.

  - id: config-internals
    kind: internals
    concepts: [environment-config-and-secrets]
    title: Config in the environment - what twelve-factor actually says
    body: |
      [III. Config](https://12factor.net/config) defines config as what varies between deploys and requires
      "strict separation of config from code". Its litmus test is worth remembering word for word: "whether
      the codebase could be made open source at any moment, without compromising any credentials."

      It stores config in **environment variables** because they are "easy to change between deploys without
      changing any code", unlikely to be committed by accident, and "a language- and OS-agnostic standard".
      And it rejects grouping them into named environments (`development`, `test`, `production`, then `qa`,
      `joes-staging`...): env vars are "granular controls, each fully orthogonal to other env vars", managed
      per deploy.

      In practice that gives three rules for an app:

      1. **Read every variable in one module, once, at start-up.** Parse strings into the right types, apply
         documented defaults only where a default is safe, and **refuse to start** if anything is wrong -
         listing every problem, not the first. A process that fails at deploy is cheap; one that fails on a
         request at 3 a.m. is not. Pass the resulting object to the code that needs it; nothing else reads
         `process.env`.
      2. **No defaults for anything that differs between deploys and matters if wrong** - database URL,
         secrets, the public base URL. A default turns "forgot to set it" into "runs against the wrong thing".
         Defaults are fine for the port, the log level, a timeout.
      3. **`NODE_ENV` is not a switch for everything.** Set it to `production` in production, because libraries
         and build tools check it to drop development-only work, and give each of **your** behaviours its
         own variable. "If
         production then also enable X" is exactly the grouping twelve-factor warns about, and staging then
         behaves like neither.

      **`.env` files** are a local convenience, not part of twelve-factor. Node.js 24 can load one itself with
      `--env-file` (stable since v24.10.0) - no package needed - and a variable already set in the environment
      **wins** over the file, so the platform's value always beats a stray file. Keep `.env` out of Git (list
      it in `.gitignore`) and commit a `.env.example` with names and harmless placeholders instead.

      **Validation, not just reading.** Environment variables are always strings. `Number('')` is `0`,
      `parseInt('80a', 10)` is `80`, `Boolean('false')` is `true` - each a silent wrong answer. A schema
      library turns this into one declaration with real error messages; zod 4 even has
      `z.stringbool()`, documented as useful for "parsing environment variables" (accepting `true/1/yes/on/y/enabled`
      and `false/0/no/off/n/disabled`, case-insensitively).

  - id: config-code
    kind: code
    concepts: [environment-config-and-secrets]
    title: Real runs - env files, string traps and a validated loader
    body: |
      A three-line script that prints what it receives, run with Node's built-in `--env-file`:

      ```bash
      $ cat .env
      PORT=3000
      LOG_LEVEL=debug # local only
      FEATURE_NEW_REFUND_FLOW=false

      $ node --env-file=.env env.mjs
      { PORT: '3000', LOG_LEVEL: 'debug', FEATURE_NEW_REFUND_FLOW: 'false' }
      Boolean("false") = true
      Number("") = 0  Number("80a") = NaN  parseInt("80a") = 80

      $ PORT=8080 node --env-file=.env env.mjs
      { PORT: '8080', LOG_LEVEL: 'debug', FEATURE_NEW_REFUND_FLOW: 'false' }
      ...

      $ node --env-file=.env.missing env.mjs
      node: .env.missing: not found
      $ echo $?
      9
      ```

      Notice: the `# local only` comment is stripped; every value is a **string**; `Boolean("false")` is
      `true`; the real environment (`PORT=8080`) beats the file; a missing file stops Node before your code
      runs (`--env-file-if-exists` is the forgiving variant).

      The heart of the practice project's loader (`solutions/deployment/config.ts`), with zod 4:

      ```typescript
      import * as z from 'zod';

      /** Whole numbers written in digits only: "3000" yes; "", " 3000", "3e3", "3000.0", "80a" no. */
      const digits = (name: string, min: number, max: number) =>
        z.string()
          .regex(/^\d+$/, `${name} must be a whole number`)
          .transform(Number)
          .pipe(z.number().int().min(min, `${name} must be at least ${min}`)
                                .max(max, `${name} must be at most ${max}`));

      const Env = z.object({
        NODE_ENV: z.enum(['development', 'test', 'production']).default('development'),
        PORT: digits('PORT', 1, 65_535).default(3000),
        DATABASE_URL: z.string({ error: 'DATABASE_URL is required' }).refine(
          (v) => /^postgres(ql)?:\/\/.+/.test(v) && URL.canParse(v),
          { message: 'DATABASE_URL must be a postgres:// or postgresql:// URL' }),
        SESSION_SECRET: z.string({ error: 'SESSION_SECRET is required' })
          .min(32, 'SESSION_SECRET must be at least 32 characters'),
        LOG_LEVEL: z.enum(['debug', 'info', 'warn', 'error']).default('info'),
        SHUTDOWN_TIMEOUT_MS: digits('SHUTDOWN_TIMEOUT_MS', 1_000, 60_000).default(10_000),
        RELEASE_ID: z.string().min(1).optional(),
        FEATURE_NEW_REFUND_FLOW: z.stringbool({ error: 'FEATURE_NEW_REFUND_FLOW must be true or false' })
          .default(false),
      });

      export function loadConfig(env: Record<string, string | undefined>): AppConfig {
        // An empty value counts as not set, so PORT= falls back to the default.
        const present = Object.fromEntries(
          Object.entries(env).filter(([, v]) => v !== undefined && v !== ''));
        const result = Env.safeParse(present);
        // Messages only - never the received value: it may be a secret.
        const problems = result.success ? [] : result.error.issues.map(/* "NAME: message" */);
        if (present.NODE_ENV === 'production' && present.RELEASE_ID === undefined)
          problems.push('RELEASE_ID is required in production');
        if (!result.success || problems.length > 0) throw new ConfigError(problems);
        return Object.freeze({ /* typed fields */ features: Object.freeze({ /* ... */ }) });
      }

      // At start-up, in the real entry point (illustrative):
      const config = loadConfig(process.env);
      ```

      Fed a production environment with five mistakes, it refuses to start and names them all (real output):

      ```plaintext
      Invalid configuration:
        - PORT must be a whole number
        - DATABASE_URL must be a postgres:// or postgresql:// URL
        - SESSION_SECRET must be at least 32 characters
        - FEATURE_NEW_REFUND_FLOW must be true or false
        - RELEASE_ID is required in production
      ```

      And the start-up log line - `describeConfig(config)` - shows what the process is running with, safely:

      ```plaintext
      {
        nodeEnv: 'development',
        port: 3000,
        databaseUrl: 'postgres://sandpay:REDACTED@db.internal:5432/sandpay',
        sessionSecret: '[redacted]',
        logLevel: 'info',
        shutdownTimeoutMs: 10000,
        releaseId: 'dev',
        'features.newRefundFlow': false
      }
      ```

  - id: config-line-by-line
    kind: line-by-line
    concepts: [environment-config-and-secrets]
    title: Why the loader is written that way
    body: |
      - **`loadConfig(env)` takes a plain object**, not `process.env` directly - so tests pass any
        environment they like without touching the real one.
      - **`regex(/^\d+$/)` before `Number`.** `z.coerce.number()` would call `Number(" 3000")`, which is
        `3000`, and `Number("")`, which is `0`. Digits-only first means every odd input is an error a human
        sees.
      - **`z.stringbool()`** instead of `Boolean(...)` or `=== 'true'`: the first is wrong for `"false"`, the
        second silently treats `"TRUE"` or `"1"` as off. Anything outside the known words is an error.
      - **`{ error: 'DATABASE_URL is required' }`** replaces zod's generic "expected string, received
        undefined" with what an operator needs to read.
      - **No `.default()` on `DATABASE_URL` or `SESSION_SECRET`.** The only safe default for a secret is
        "refuse to start".
      - **The production rule sits outside the schema.** In zod, a refinement on the whole object does not
        run while its fields still have errors, so a `superRefine` would hide the missing `RELEASE_ID` until
        the other five problems were fixed - one deploy per mistake. Checking it beside the parse reports
        everything in one go.
      - **Only messages go into `ConfigError`.** zod issues can carry the input; a config error is printed to
        logs that many people and tools can read.
      - **`Object.freeze`** - config is read once; nothing should change it at runtime ("it is impossible to
        make changes to the code at runtime" is twelve-factor's build-release-run rule, and the same holds
        for a release's config).
      - **`describeConfig`** logs the config at start-up - the fastest answer to "what is this instance
        actually running with?" - with secrets replaced. `new URL()` makes hiding the password in a
        connection string a one-liner instead of a fragile regex.

  - id: secrets
    kind: internals
    concepts: [environment-config-and-secrets]
    title: Where secrets belong
    body: |
      Twelve-factor says "config in the environment"; the OWASP [Secrets Management Cheat
      Sheet](https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html) is more
      cautious for **secrets**. In section 5.1 it lists three ways to get a secret into a container - a
      mounted file, fetching from a secret store, environment variables - and warns that environment
      variables "are generally accessible to all processes and may be included in logs or system dumps",
      so they are "not recommended unless the other methods are not possible". Both are right about their
      own subject: ordinary config in env vars, secrets preferably from a **secret manager** (a cloud
      provider's service or a tool such as Vault) or a file the orchestrator mounts.

      What is not negotiable, from the same cheat sheet:

      - **Never in the code or the image.** Not in Git, not in a Dockerfile `ENV` or `ARG` ("these can easily
        leak with the container definitions"), not as a default in the loader.
      - **Least privilege.** Each secret grants only what its user needs - the app's database user can't
        drop tables; staging's key doesn't work in production.
      - **A lifecycle**: creation (cryptographically strong), **rotation** (regularly, "so that any stolen
        credentials will only work for a short time"), **revocation** and **expiration**. Rotation that has
        never been rehearsed fails on the day it is needed, so design for two valid secrets at once - accept
        the old and the new session-signing key during the switch, then drop the old.
      - **Detect leaks early** - a secret scanner in a pre-commit hook and in CI.
      - **If one leaks**: revoke it immediately, issue and deploy a new one, then remove it from where it
        leaked - "including secrets discovered in code or logs". Deleting the commit is not enough: the
        secret was public from the moment it was pushed, so revocation comes first.

      As a tester, a config review is a quick win: grep the repository and the image history for literal
      keys, check the logs of a start-up for anything that looks like a credential, and check that the app
      refuses to start without its secrets.

  - id: health-internals
    kind: internals
    concepts: [health-checks-and-graceful-shutdown]
    title: Liveness and readiness are different questions
    body: |
      Load balancers and orchestrators poll an HTTP endpoint and act on the **status code**. Kubernetes
      (**platform-specific**, but the clearest documented model) treats any status from 200 to 399 as success
      and runs three kinds of probe:

      | Probe | Question | On failure (Kubernetes) | Must not depend on |
      | --- | --- | --- | --- |
      | **Liveness** | Is the process able to make progress at all? | the kubelet **restarts the container** | the database or any other dependency |
      | **Readiness** | Should traffic be sent here now? | the Pod's address is **removed from the Service's endpoints** - no restart | - (it may check dependencies) |
      | **Startup** | Has a slow-starting app finished starting? | the container is killed; liveness and readiness don't run until it succeeds | - |

      The Kubernetes docs are blunt about liveness: probes "should be used with caution", must "truly
      indicate unrecoverable application failure, for example a deadlock", and a wrong one "can lead to
      cascading failures". A liveness check that calls the database turns a database blip into every
      instance being restarted at once - the restart cannot fix the database, and the reconnection stampede
      makes it worse.

      So, for an Express app:

      - **`GET /livez`** - answer `200` from the process itself. If the event loop is stuck, it can't answer,
        and that is exactly the case a restart fixes. No dependency calls.
      - **`GET /readyz`** - `200` only if this instance can do useful work now: the database answers a cheap
        query within a short time-out, start-up work (migrations checked, caches warmed) is done, and the
        process is **not shutting down**. Otherwise `503`. Keep the body short and **free of error text** -
        an exception message can contain host names or connection strings.

      The names `/livez` and `/readyz` come from the Kubernetes API server's own health endpoints (the older
      `/healthz` is deprecated there since v1.16). Nothing requires them; what matters is two endpoints with
      two meanings. The Express guide [Health Checks and Graceful
      Shutdown](https://expressjs.com/en/advanced/healthcheck-graceful-shutdown.html) describes the same split.

      A readiness probe that checks a **shared** dependency is still a trade-off: if the database is down for
      everyone, every instance goes unready and the load balancer has nowhere to send traffic - users get the
      balancer's error instead of your app's helpful 503. Some teams therefore check only what is local to the
      instance. Decide it deliberately, and document it.

  - id: shutdown-internals
    kind: internals
    concepts: [health-checks-and-graceful-shutdown]
    title: Graceful shutdown, step by step
    body: |
      Every deploy and every scale-down stops processes. Platforms do it the same way: **SIGTERM, wait, then
      SIGKILL**. Kubernetes sends TERM to process 1 in each container and KILL when the grace period expires
      (`terminationGracePeriodSeconds`, 30 seconds by default); `docker stop` sends SIGTERM and kills after 10
      seconds by default on Linux. SIGKILL cannot be caught - Node.js documents that it "cannot have a listener
      installed" - so everything has to happen inside the grace period.

      What Node.js does by itself: SIGTERM and SIGINT have default handlers that exit "with code 128 + signal
      number" - **143** for SIGTERM (15). In-flight requests are cut. Installing a listener removes that
      default, so once you handle SIGTERM, **you** must eventually exit.

      [IX. Disposability](https://12factor.net/disposability) describes the goal for a web process: "ceasing
      to listen on the service port (thereby refusing any new requests), allowing any current requests to
      finish, and then exiting". With a load balancer in front, one more step comes first, because removing an
      instance from rotation is not instant. The order:

      1. **Turn readiness false** at once (`/readyz` answers 503 `shutting_down`).
      2. **Keep serving for a short drain delay** (a few seconds), so health checks and endpoint updates
         catch up and new requests stop arriving. Kubernetes marks a terminating Pod's endpoints not ready
         itself, but that update reaches load balancers asynchronously, while your process already has the
         signal.
      3. **`server.close()`** - stop accepting connections. Since Node.js 19 it also closes idle keep-alive
         connections; busy ones finish their current request.
      4. **Wait for in-flight requests**, but only up to a **deadline** shorter than the grace period. When it
         passes, `server.closeAllConnections()` cuts what is left and the shutdown is reported as forced.
      5. **Close the database pool last** - a request that is still running may need it.
      6. **Exit** with 0 after a clean shutdown, non-zero after a forced one.

      Make the shutdown **idempotent**: a second SIGTERM, or a Ctrl+C after the first, must join the shutdown
      that is running, not start another one that closes the pool twice.

      Workers follow the same idea with different steps: twelve-factor says a worker returns its current job
      to the queue, and jobs must be safe to run twice.

  - id: visual-shutdown
    kind: visual
    concepts: [health-checks-and-graceful-shutdown]
    title: One instance during a rolling deploy
    body: |
      ```mermaid
      sequenceDiagram
        participant P as Platform
        participant LB as Load balancer
        participant A as Old instance (Node.js)
        participant DB as PostgreSQL
        Note over A: GET /reports/slow in flight
        P->>A: SIGTERM
        A->>A: ready = false
        LB->>A: GET /readyz
        A-->>LB: 503 shutting_down
        LB->>LB: stop routing to A
        Note over A: drain delay - late requests still served
        A->>A: server.close() - no new connections
        A-->>LB: 200 for /reports/slow
        A->>DB: pool.end()
        A->>P: exit 0
        Note over P: SIGKILL only if still running after the grace period
      ```

      Notice the order: readiness flips **before** anything closes, the in-flight response goes out **before**
      the pool closes, and the process exits on its own **before** the platform has to kill it.

  - id: shutdown-code
    kind: code
    concepts: [health-checks-and-graceful-shutdown]
    title: Real runs - SIGTERM with and without a shutdown
    collapsed: true
    body: |
      **No handler at all.** A bare `http.createServer` process, sent SIGTERM:

      ```bash
      $ node plain.mjs &
      pid 340890 listening on 38219
      $ kill -TERM 340890; wait 340890; echo "exit code: $?"
      exit code: 143
      ```

      143 = 128 + 15 (SIGTERM): Node's default handler exited at once.

      **The practice project's first draft**, which "handles" SIGTERM by closing the database, cutting all
      connections and exiting 0. A test script starts a 2-second request, sends SIGTERM 0.3 s later, then calls
      `/readyz` and `/livez` (structured log lines are the server's; `t` is milliseconds since start):

      ```plaintext
      $ kill -TERM 366190
      client: GET /readyz ->  000
      client: GET /livez after the drain -> curl exit 7
      server exit code: 0
      client: GET /reports/slow -> 000 after 0.309712s
      {"t":12,"event":"listening","port":3917}
      {"t":1829,"event":"shutdown_started","reason":"SIGTERM"}
      {"t":1829,"event":"database_closed"}
      {"t":1829,"event":"exit","code":0}
      ```

      The in-flight request got **no response** (curl's `000`), and the server exited **0** - its own logs
      look perfectly healthy. Only the client side shows the dropped request.

      **The solution** (`solutions/deployment/lifecycle.ts`, drain delay 1 s, deadline 10 s), same script:

      ```plaintext
      $ kill -TERM 365890
      client: GET /readyz -> {"status":"shutting_down"} 503
      client: GET /livez after the drain -> curl exit 7
      server exit code: 0
      client: GET /reports/slow -> 200 after 2.010595s
      {"t":15,"event":"listening","port":3917}
      {"t":1901,"event":"shutdown_started","reason":"SIGTERM"}
      {"t":3621,"event":"database_closed"}
      {"t":3621,"event":"shutdown_finished","result":"graceful"}
      {"t":3621,"event":"exit","code":0}
      ```

      Readiness said 503 at once; after the drain, new connections were refused (curl exit 7, "failed to
      connect"); the slow request **finished with 200**; the pool closed after it; exit 0.

      **Same solution with a 300 ms deadline** - the request outlives it:

      ```plaintext
      server exit code: 1
      client: GET /reports/slow -> 000 after 1.594302s
      {"t":1981,"event":"shutdown_started","reason":"SIGTERM"}
      {"t":3284,"event":"shutdown_timeout","timeoutMs":300}
      {"t":3285,"event":"database_closed"}
      {"t":3285,"event":"shutdown_finished","result":"forced"}
      {"t":3285,"event":"exit","code":1}
      ```

      Cut off - but on purpose, logged, before the platform's SIGKILL, with the pool still closed cleanly
      and a non-zero exit code that shows up in the platform's records.

      The core of the solution:

      ```typescript
      app.get('/livez', (_req, res) => { res.json({ status: 'ok' }); });

      app.get('/readyz', async (_req, res) => {
        if (shuttingDown) { res.status(503).json({ status: 'shutting_down' }); return; }
        try {
          await options.checkDatabase();
          res.json({ status: 'ready', checks: { database: 'ok' } });
        } catch {
          options.log('readiness_check_failed', { check: 'database' });
          res.status(503).json({ status: 'unavailable', checks: { database: 'fail' } });
        }
      });

      async function runShutdown(reason: string): Promise<ShutdownResult> {
        shuttingDown = true;
        options.log('shutdown_started', { reason });
        await wait(options.drainDelayMs);
        const closed = new Promise<ShutdownResult>((resolve) => server.close(() => resolve('graceful')));
        let timer: NodeJS.Timeout | undefined;
        const timeout = new Promise<ShutdownResult>((resolve) => {
          timer = setTimeout(() => resolve('forced'), options.shutdownTimeoutMs);
        });
        const result = await Promise.race([closed, timeout]);
        clearTimeout(timer);
        if (result === 'forced') {
          options.log('shutdown_timeout', { timeoutMs: options.shutdownTimeoutMs });
          server.closeAllConnections();
        }
        await options.closeDatabase();
        options.log('shutdown_finished', { result });
        return result;
      }

      function shutdown(reason: string) {
        shutdownPromise ??= runShutdown(reason); // a second call joins the first
        return shutdownPromise;
      }

      // In the entry point:
      // running.installSignalHandlers(process, (code) => process.exit(code));
      ```

      Platform side, illustrative Kubernetes YAML (field names from the Kubernetes probe and Pod lifecycle
      pages; not run here - no cluster):

      ```yaml
      spec:
        terminationGracePeriodSeconds: 30   # the default; the app's own deadline must be shorter
        containers:
          - name: dashboard-api
            image: registry.sandpay.example/dashboard-api:2026-11-14.3
            readinessProbe:
              httpGet: { path: /readyz, port: 3000 }
              periodSeconds: 5
              failureThreshold: 2
            livenessProbe:
              httpGet: { path: /livez, port: 3000 }
              periodSeconds: 10
              failureThreshold: 3
            startupProbe:
              httpGet: { path: /livez, port: 3000 }
              periodSeconds: 10
              failureThreshold: 30            # up to 300 s to start before liveness takes over
      ```

  - id: releases
    kind: internals
    concepts: [zero-downtime-releases]
    title: Rolling, blue-green and canary
    body: |
      Graceful shutdown makes one instance leave cleanly. A release strategy decides **how the fleet moves**
      from the old version to the new one:

      | Strategy | How it works | Rollback | Costs and catches |
      | --- | --- | --- | --- |
      | **Rolling update** | Replace instances in batches. Kubernetes Deployments do this by default, keeping at most 25% unavailable and at most 25% extra (`maxUnavailable`, `maxSurge`). | Roll forward the previous release the same way - minutes, not seconds. | Cheap. Old and new serve **at the same time** for the whole rollout. A bad version reaches users gradually; readiness gates each step. |
      | **Blue-green** | Two complete environments, "as identical as possible" (Fowler). Test the new release in the idle one, then "switch the router" so all traffic goes to it. | Switch the router back - seconds. | Double the capacity during the switch. The **database is usually shared**, so the schema must suit both versions. Fowler: separate "the deployment of schema changes from application upgrades". |
      | **Canary** | Deploy the new version beside the old and route "a small subset of users" to it; widen in steps while error rate, latency and business metrics stay healthy. | "Reroute users back to the old version" (Sato). | Needs good metrics and a router that can split traffic. Catches problems no test environment shows, at a small blast radius. Sato calls it an application of parallel change. |

      Whatever the strategy, the tools a release needs are the same:

      - **Immutable, identified releases.** Twelve-factor: every release has a unique id and "a release cannot
        be mutated once it is created". Rollback means running an earlier release again - which only works if
        it was kept and its config is known. Log the release id at start-up and return it from an
        internal endpoint, so "which version answered this?" has an answer.
      - **Readiness that means something**, so the rollout waits for new instances to be really ready.
      - **Automatic stop conditions** - a failing readiness or rising error rate halts the rollout rather than
        finishing it.
      - **Compatibility between neighbouring versions** - the next section.

  - id: compatibility
    kind: internals
    concepts: [zero-downtime-releases]
    title: Two versions at once - expand, migrate, contract
    body: |
      During a rolling or canary release, **version N and N+1 run together**, against **one database**, and
      clients (a browser tab loaded an hour ago, a mobile app) still speak to the API as version N did. A
      change is safe only if every combination works:

      - **Old code, new schema** - the migration runs before or during the rollout.
      - **New code, old data** - rows written by version N.
      - **Old client, new API** - nothing removed or renamed in the response yet.
      - **New code, then rollback** - version N must still run after N+1 has written data.

      [Parallel change](https://martinfowler.com/bliki/ParallelChange.html) - expand, migrate, contract -
      splits a breaking change into steps that each keep all of these true. Renaming `merchants.email` to
      `contact_email`:

      | Release | Database | Application |
      | --- | --- | --- |
      | 1 - **expand** | add `contact_email` (nullable); backfill in batches | writes **both** columns, reads the old one |
      | 2 - migrate | (backfill finished, verified) | reads `contact_email`, still writes both |
      | 3 - **contract** | drop `email` - only once no running release reads it | writes only `contact_email` |

      Every row is one deploy; any of them can be rolled back to the previous one. The cost is time and
      discipline: Sato warns that skipping the contract phase leaves you "in a worse state than you started".
      The locking and backfill details are in [Migrations and data access from
      Node.js](#/lesson/migrations-and-data-access).

      The same rule applies to the **API**: add fields and endpoints first, move clients, remove the old ones
      last - and to **messages and caches** that one version writes and the other reads.

  - id: flags
    kind: internals
    concepts: [feature-flags]
    title: Feature flags - deploying is not releasing
    body: |
      A feature flag lets code reach production switched off, so **deploying** (moving code) and
      **releasing** (exposing behaviour) become two decisions. Pete Hodgson's article sorts flags by how long
      they live and how dynamic they are:

      | Kind | For | Lifetime | Changed by |
      | --- | --- | --- | --- |
      | **Release toggle** | ship unfinished work dark; trunk-based development | short - "should generally not stick around much longer than a week or two" | a config change or a release |
      | **Experiment toggle** | A/B tests; each user consistently in one cohort | hours to weeks | per request |
      | **Ops toggle / kill switch** | turn off an expensive or risky feature under load | short, or long-lived for a few kill switches | operators, **quickly** - not by redeploying |
      | **Permission toggle** | premium, beta or internal-only features | long | per user |

      Rules that keep flags from becoming the problem:

      - **Off means the existing behaviour, on means the new one.** Hodgson calls this "a good convention",
        and the testing advice below depends on it.
      - **Treat flags as inventory with a carrying cost**: an owner, a creation date, an expiry; some teams add
        "time bombs" - a test that fails after the expiry date. Removing the flag and the dead branch is part
        of finishing the feature.
      - **Decide the flag in one place** (a toggle router), not with `if (process.env.X)` scattered through the
        code; pass the decision in, so tests can set it.
      - **Static flags in the environment are fine for release toggles**; a kill switch that needs a deploy to
        flip is too slow. Dynamic flags need a flag service. OpenFeature is a vendor-neutral specification for
        evaluating flags in code if you use one.

      **Testing with flags.** Every flag doubles the number of possible configurations, but you don't test
      them all: "most feature flags will not interact with each other". Hodgson's advice: test the
      configuration **expected in production** (today's flags plus the ones you intend to turn on), the
      **fallback** with those new flags off, and many teams also run **all flags on** to catch surprises in a
      future release.

  - id: visual-flag-lifecycle
    kind: visual
    concepts: [feature-flags, zero-downtime-releases]
    title: A release toggle from first commit to removal
    body: |
      ```mermaid
      stateDiagram-v2
        [*] --> Dark: deployed with flag OFF (existing behaviour)
        Dark --> Internal: ON for internal users
        Internal --> Canary: ON for 5% of merchants
        Canary --> Dark: metrics bad - flag OFF (no redeploy)
        Canary --> Everyone: metrics good - ON for all
        Everyone --> Removed: flag and old branch deleted
        Removed --> [*]
      ```

      Notice that the riskiest step - turning it on - is reversible without a deploy, and that the life of
      the flag ends with **deleting it**, not with leaving it on.

  - id: steps
    kind: steps
    concepts: [environment-config-and-secrets, health-checks-and-graceful-shutdown, zero-downtime-releases]
    title: A deployment-readiness checklist for an Express service
    body: |
      1. **One config module** parses `process.env` at start-up with a schema; nothing else reads env vars.
      2. **No defaults** for URLs of backing services or for secrets; the app refuses to start and lists every
         problem.
      3. **A `.env.example`** with every variable, a comment and a harmless placeholder; `.env` is ignored by Git.
      4. **Secrets** come from a secret manager or the platform, are redacted from logs, have an owner and a
         rotation plan, and a scanner runs in CI.
      5. **`/livez`** checks only the process; **`/readyz`** checks what it must and turns 503 on shutdown.
      6. **SIGTERM** starts a graceful shutdown: readiness off, drain delay, `server.close()`, deadline shorter
         than the grace period, pool closed last, exit code 0 or 1. Logged step by step.
      7. **Each release** has an id, is logged at start-up and can be rolled back by redeploying it.
      8. **Every migration** is backwards-compatible with the running release (expand first, contract later).
      9. **Every new feature** ships behind a flag that is off by default, with an owner and an expiry.
      10. **Rehearse**: a rolling deploy under load with zero failed requests, a rollback, a secret rotation.

  - id: example
    kind: example
    concepts: [health-checks-and-graceful-shutdown, zero-downtime-releases, feature-flags]
    title: "SandPay: \"every deploy costs us 40 errors\""
    body: |
      The SandPay dashboard API runs six instances behind a load balancer. Support notices that every deploy
      is followed by a short burst of `502 Bad Gateway` on the dashboard, and once a refund export failed
      half-way. A developer says "deploys are zero-downtime, it's a rolling update".

      What a tester checks, and what they found:

      - **Exit codes in the platform's records** for the old instances: `143` - Node's default SIGTERM
        handler. There is no shutdown handler, so in-flight requests are cut.
      - **The health check**: the load balancer uses `GET /health`, which runs `SELECT 1`. During last
        month's database fail-over, every instance was marked unhealthy and the platform **restarted all six**
        - the outage lasted three minutes longer than the database's.
      - **A load test during a deploy**: a steady 50 requests per second while rolling a no-op release, and
        count non-2xx responses from the client's side - not from the server's logs, which don't show
        dropped connections.

      The fix, verified the same way: `/livez` without dependencies, `/readyz` with the database check and
      shutdown state, graceful shutdown with a 5-second drain and a 20-second deadline (grace period 30 s).
      The repeat load test: zero non-2xx responses across three rolling deploys, and old instances now exit
      `0`.

      The next feature, a new refund flow, went out behind `FEATURE_NEW_REFUND_FLOW=false`, was turned on for
      internal merchants, then 5%, then everyone - and the flag was deleted two weeks later.

  - id: tests
    kind: tests
    concepts: [environment-config-and-secrets, health-checks-and-graceful-shutdown, zero-downtime-releases, feature-flags]
    title: Test cases for deployability
    body: |
      | # | Case | Steps | Expected | Evidence |
      | --- | --- | --- | --- | --- |
      | 1 | Missing secret | start with `SESSION_SECRET` unset | process exits non-zero before listening; message names `SESSION_SECRET` | start-up log, exit code |
      | 2 | Many bad values | start with bad `PORT`, `DATABASE_URL` and flag | **all three** named in one error; none of the values printed | start-up log |
      | 3 | Flag off really off | `FEATURE_NEW_REFUND_FLOW=false` | old flow used | API response, start-up config line |
      | 4 | Secrets not logged | start normally, grep the logs | no secret, no DB password; `[redacted]` shown | log extract |
      | 5 | Liveness independent | stop the database | `/livez` 200, `/readyz` 503 without error text, no restarts | probe responses, restart count |
      | 6 | Readiness recovers | start the database again | `/readyz` 200 within one probe period | timestamps |
      | 7 | Graceful SIGTERM | long request in flight, send SIGTERM | `/readyz` 503 at once; request completes 200; new connections refused after the drain; exit 0 | client log, server log, exit code |
      | 8 | Deadline | request longer than the deadline | cut at the deadline, `shutdown_timeout` logged, pool closed, exit 1, all before SIGKILL | logs with timestamps |
      | 9 | Zero failed requests | steady load during a rolling deploy | no non-2xx, no connection errors at the client | load tool report |
      | 10 | Rollback | deploy N+1 (with its migration), then redeploy N | N runs and reads data written by N+1 | smoke test results |
      | 11 | Flag configurations | production config; new flags off; all flags on | each suite passes | three CI runs |

      Negative cases are the valuable ones: an environment that is wrong, a dependency that is down, a request
      that is too slow, a rollback after data has changed.

  - id: mistakes
    kind: mistakes
    concepts: [environment-config-and-secrets, health-checks-and-graceful-shutdown, zero-downtime-releases, feature-flags]
    title: Common mistakes and how to debug them
    body: |
      - **Defaults for secrets or service URLs** (`?? 'dev-secret'`, `?? 'localhost'`). Fix: no default;
        refuse to start.
      - **`Boolean(process.env.X)` or `Number(process.env.X)`** without validation. Fix: a schema;
        `z.stringbool()`; digits-only numbers.
      - **`process.env` read all over the code**, so missing config fails on a rare request. Fix: one loader at
        start-up.
      - **Logging the whole config or `process.env`** for debugging. Fix: a redacting `describeConfig`.
      - **Secrets in the image** (`ENV API_KEY=...` in a Dockerfile, a `.env` copied in). Fix: inject at run
        time; check `docker history` of an image in review.
      - **One `/health` for both probes**, calling the database. Fix: `/livez` and `/readyz` with different
        meanings.
      - **Exiting at once on SIGTERM** (`process.on('SIGTERM', () => process.exit(0))`) - worse than no
        handler, because it also hides the problem behind exit code 0. Fix: the shutdown steps above.
      - **Closing the pool before the server** - in-flight requests fail with "pool has ended"-type errors.
        Fix: pool last.
      - **No deadline, or a deadline longer than the grace period** - the platform's SIGKILL decides instead.
      - **The process is not PID 1's child you think it is.** A shell form `CMD npm start` can mean SIGTERM goes
        to `npm` or `sh`, not to Node - check which process receives the signal (details in [Containers with
        Docker and Compose](#/lesson/docker-and-compose)).
      - **Breaking migrations in the same release as the code that needs them**. Fix: expand first.
      - **Flags never removed**, and "on" meaning the old behaviour for some flags. Fix: owner, expiry,
        consistent semantics.

      **Debugging a deploy that drops requests:** measure from the **client** (load tool, load balancer logs
      for 502/504), not from the app's logs; check old instances' exit codes (143 = default handler, 137 =
      SIGKILL - 128 + 9 - so the grace period ran out); compare the timestamps of SIGTERM, readiness 503,
      removal from the load balancer and process exit; then reproduce locally with a slow endpoint and
      `kill -TERM`, as in the runs above.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [environment-config-and-secrets, health-checks-and-graceful-shutdown, zero-downtime-releases, feature-flags]
    title: Trade-offs and alternatives
    body: |
      - **Env vars versus files versus a secret manager.** Env vars are universal and simple; files mounted
        by the orchestrator keep secrets out of process listings and crash dumps; a secret manager adds
        auditing, rotation and short-lived credentials at the cost of a dependency at start-up. Many teams use
        env vars for config and a manager for secrets.
      - **Config files in the repository** (`config/production.json`) give review and history but invite
        secrets in Git and grouping by environment. Fine for non-secret values that don't vary between
        deploys - which, by definition, isn't config.
      - **Readiness depending on shared dependencies**: honest per instance, but all instances fail together
        when the dependency does. Consider what users should see in that case.
      - **Long drain delays and deadlines** make deploys slower and safer; very long requests (exports,
        uploads, WebSockets) are better moved to background jobs or resumable protocols than given a
        ten-minute grace period.
      - **Blue-green** doubles the infrastructure during a release and makes rollback instant; **rolling** is
        cheaper with slower rollback; **canary** needs traffic splitting and good metrics. Most teams roll by
        default and canary the risky changes.
      - **Feature flags** buy safe releases and experiments at the cost of more code paths, more test
        configurations and a cleanup duty. A flag that lives a year is a permanent branch in your code.

  - id: summary
    kind: summary
    concepts: [environment-config-and-secrets, health-checks-and-graceful-shutdown, zero-downtime-releases, feature-flags]
    title: Quick reference
    body: |
      - **Config** = what varies between deploys. Env vars, parsed once at start-up with a schema, every
        problem reported, no value echoed, frozen.
      - **Strings bite**: `Boolean('false')` is `true`, `Number('')` is `0`, `parseInt('80a')` is `80`.
      - **Node 24**: `node --env-file=.env` - the real environment wins over the file.
      - **Secrets**: never in code or image, no defaults, redacted in logs, least privilege, rotate; on a leak,
        revoke first.
      - **`/livez`**: the process only - failing means restart. **`/readyz`**: can serve now - failing means
        no traffic; 503 while shutting down.
      - **SIGTERM** → ready false → drain delay → `server.close()` → wait with a deadline →
        `closeAllConnections()` if needed → pool last → exit 0 / 1. Default without a handler: exit 143.
      - Kubernetes grace period 30 s; `docker stop` 10 s (Linux); then SIGKILL (137).
      - **Rolling** (25% / 25% defaults on Kubernetes), **blue-green** (switch the router), **canary** (a small
        share first). All run two versions at once.
      - **Expand → migrate → contract**, for schema and API alike; rollback = redeploy an immutable release.
      - **Flags**: off = old behaviour; owner and expiry; test production config, fallback and all-on.

exercises:
  - id: what-is-config
    type: mcq
    concept: environment-config-and-secrets
    skill: recognition
    title: Which of these is config?
    prompt: |
      In the twelve-factor sense, which of these belongs in the environment rather than in the code of the
      SandPay dashboard API?
    options:
      - id: db-url
        text: The PostgreSQL connection URL and the session-signing secret.
        feedback: Correct - both vary between deploys (staging and production have different databases and different secrets), and the secret must never be in the code.
      - id: routes
        text: The list of Express routes and which middleware runs on them.
        feedback: That is "internal application config" which "does not vary between deploys" - twelve-factor says it is best done in the code.
      - id: refund-rules
        text: The rule that refunds are allowed for 180 days.
        feedback: A business rule is the same in every deploy; it belongs in code (or, if the business changes it often, in data or a feature flag - not in per-deploy config).
      - id: all-of-them
        text: All of them - the more that is configurable, the better.
        feedback: Making non-varying behaviour configurable multiplies the configurations you must test, and lets staging differ from production in ways nobody intended.
    correct: [db-url]
    hints:
      - Which of these is different in staging and production?
    solution: |
      Config is what varies between deploys - backing-service URLs, credentials, per-deploy values. Routes,
      wiring and business rules are the same in every deploy and stay in code. The litmus test: could the code
      be published without leaking a credential?

  - id: boolean-flag
    type: mcq
    concept: environment-config-and-secrets
    skill: analysis
    title: The kill switch that didn't kill
    prompt: |
      During an incident an operator sets `FEATURE_NEW_REFUND_FLOW=false` and restarts the API. The start-up
      log shows `'features.newRefundFlow': true`, and the new flow keeps running. The code reads
      `newRefundFlow: Boolean(process.env.FEATURE_NEW_REFUND_FLOW)`. What happened, and what is the fix?
    options:
      - id: truthy-string
        text: "\"false\" is a non-empty string, and every non-empty string is truthy - Boolean(\"false\") is true. Parse it with a schema such as z.stringbool(), which rejects anything that isn't a known true or false word."
        feedback: Correct - environment variables are always strings; Boolean() only checks for the empty string.
      - id: not-reloaded
        text: The restart didn't reload the environment, so the old value is still in use.
        feedback: The log shows the value the process read at this start-up; a fresh process reads a fresh environment. The parsing is wrong, not the reload.
      - id: equals-true
        text: Use process.env.FEATURE_NEW_REFUND_FLOW === 'true' instead.
        feedback: Better, but "TRUE", "1" or "on" would now silently mean off, and a typo such as "ture" would too - an unknown value should stop the start-up, not choose a side.
      - id: case
        text: Environment variable names are case-insensitive on Linux, so another variable overrode it.
        feedback: Names are case-sensitive on Linux; and the log clearly shows the value came from this variable's parsing.
    correct: [truthy-string]
    hints:
      - What is the type of every value in process.env?
      - What does Boolean() return for a string?
    solution: |
      `Boolean("false")` is `true` (shown in the lesson's real run). Parse flags with `z.stringbool()` (or an
      explicit list of true and false words) and **fail** on anything else - and test the off value, not
      only the on one.

  - id: debug-loader
    type: debug
    concept: environment-config-and-secrets
    skill: analysis
    title: Find the problems in this config loader
    prompt: |
      This loader is called once at start-up with `process.env`. Click **every** line that is a defect
      (lines 1-2 are fine).
    language: typescript
    code: |
      export function loadConfig(env: NodeJS.ProcessEnv) {
        const port = parseInt(env.PORT ?? '3000', 10);
        if (Number.isNaN(port)) throw new Error(`PORT ${env.PORT} is not a number`);
        if (!env.DATABASE_URL) throw new Error(`DATABASE_URL missing (got ${JSON.stringify(env)})`);
        return {
          port,
          databaseUrl: env.DATABASE_URL,
          sessionSecret: env.SESSION_SECRET ?? 'change-me-in-prod',
          logLevel: env.LOG_LEVEL ?? 'info',
          newRefundFlow: Boolean(env.FEATURE_NEW_REFUND_FLOW),
        };
      }
    correctLines: [2, 3, 4, 8, 10]
    lineNotes:
      - line: 7
        note: Passing the validated URL through is fine - line 4 made sure it exists (though a schema would also check its form).
      - line: 9
        note: A default log level is harmless; ideally it is also checked against the allowed values.
    hints:
      - Which inputs does parseInt accept that it shouldn't?
      - Which line would print every secret the process has?
      - Which value is a secret with a default?
    solution: |
      - **Line 2** - `parseInt('80a', 10)` is `80`, and `' 3000'` and `'3e3'` parse too; the check on line 3
        only catches inputs with no leading digit. Validate digits only.
      - **Line 3** - stops at the **first** problem, so each deploy reveals one more mistake; and it echoes
        the raw value into the error.
      - **Line 4** - prints the **whole environment**, including every secret, into an error message that will
        end up in logs.
      - **Line 8** - a secret with a default: a forgotten variable means production signs sessions with a
        string from the source code.
      - **Line 10** - `Boolean('false')` is `true`.

      Rewrite with a schema that reports all problems, has no defaults for secrets or URLs, never includes
      values in messages, and parses booleans properly.

  - id: secret-leak
    type: order
    concept: environment-config-and-secrets
    skill: application
    title: A database password was pushed to a public repository
    prompt: |
      A developer pushed a commit containing the production database password to a public GitHub repository
      20 minutes ago. Put the response in the right order.
    items:
      - id: revoke
        text: Revoke the exposed credential (change the password or disable the user) so it no longer works.
      - id: rotate
        text: Create a new credential and deploy it to the app through the secret store.
      - id: investigate
        text: Check the database's logs for use of the old credential since it was pushed.
      - id: delete
        text: Remove the secret from the repository and the places it was copied to, accepting that history rewrites have side effects.
      - id: prevent
        text: Add or fix secret scanning in pre-commit and CI, and record what happened.
    hints:
      - From the moment of the push, assume the secret is known. What stops it working?
      - Can the app keep running between revoking and replacing?
    solution: |
      **Revoke first** - the secret was public the moment it was pushed; deleting the commit doesn't
      un-publish it. Then **rotate** (new credential, deployed - plan this so the gap is short; with
      two-user rotation it can be zero), **investigate** use of the old credential, **delete** it from code
      and logs (OWASP notes that rewriting history has consequences), and **prevent** the next one with
      scanning. In a real incident, revocation and rotation are often prepared together to avoid an outage -
      but the old secret must stop working as soon as possible.

  - id: config-loader
    type: coding
    concept: environment-config-and-secrets
    skill: application
    title: A config loader that refuses to start
    prompt: |
      `exercises/deployment/config.ts` holds a first draft that defaults the session secret, accepts `PORT=80a`
      and can't turn the feature flag off. Rewrite `loadConfig` with zod 4 to the rules in the file's header
      (types, ranges, required variables, `z.stringbool()`, `RELEASE_ID` in production, empty means unset),
      report **every** problem in one `ConfigError` without any received value, freeze the result, and make
      `describeConfig` safe to log.
    project: fullstack
    files:
      - exercises/deployment/config.ts
    test: tests/deployment/config.test.ts
    command: npx vitest run tests/deployment/config.test.ts
    hints:
      - "Start from z.object({...}); z.enum for the fixed lists, .default() only where a default is safe."
      - "For numbers: z.string().regex(/^\\d+$/).transform(Number).pipe(z.number().int().min(...).max(...))."
      - "Filter out empty strings before parsing, so PORT= behaves like an unset PORT."
      - "An object-level refinement doesn't run while fields have errors - check RELEASE_ID beside safeParse and merge the problems."
      - "Build each problem from issue.path[0] and issue.message only; in describeConfig use new URL() and set url.password."
    modelAnswer: |
      The schema shown in the lesson's code section, plus:

      ```typescript
      export function loadConfig(env: Record<string, string | undefined>): AppConfig {
        const present = Object.fromEntries(
          Object.entries(env).filter(([, value]) => value !== undefined && value !== ''));
        const result = Env.safeParse(present);
        const problems = result.success ? [] : result.error.issues.map((issue) => {
          const name = String(issue.path[0] ?? 'environment');
          return issue.message.startsWith(name) ? issue.message : `${name}: ${issue.message}`;
        });
        if (present.NODE_ENV === 'production' && present.RELEASE_ID === undefined)
          problems.push('RELEASE_ID is required in production');
        if (!result.success || problems.length > 0) throw new ConfigError(problems);
        const e = result.data;
        return Object.freeze({
          nodeEnv: e.NODE_ENV, port: e.PORT, databaseUrl: e.DATABASE_URL,
          sessionSecret: e.SESSION_SECRET, logLevel: e.LOG_LEVEL,
          shutdownTimeoutMs: e.SHUTDOWN_TIMEOUT_MS, releaseId: e.RELEASE_ID ?? 'dev',
          features: Object.freeze({ newRefundFlow: e.FEATURE_NEW_REFUND_FLOW }),
        });
      }

      export function describeConfig(config: AppConfig) {
        const url = new URL(config.databaseUrl);
        if (url.password) url.password = 'REDACTED';
        return { /* every field */ databaseUrl: url.toString(), sessionSecret: '[redacted]' };
      }
      ```

      The schema states every rule once; messages come from the schema, never from the input; the
      production rule is checked outside the schema so it is reported together with the rest.
    solution: |
      Declare the variables in one zod object (enums, digits-only numbers with ranges, required URL and
      secret without defaults, `z.stringbool()` for the flag), drop empty values first, map issues to
      "NAME: message" without values, add the production `RELEASE_ID` rule beside the parse, freeze the
      result, and redact the secret and the URL's password in `describeConfig`. The model answer shows it.
    rubric:
      - Every test in tests/deployment/config.test.ts passes.
      - Nothing outside loadConfig reads process.env, and there is no default for a secret or a URL.
      - No error message or log line can contain a received value.
      - The rules are declared once (in the schema), not repeated in if-statements.
    followUp: |
      SandPay starts signing sessions with a new key. During the rotation the app must accept cookies signed
      with the old **or** the new key and sign new ones with the new key. Which variables do you add, how do
      you validate them, and which test proves the old key can be dropped later?

  - id: probe-choice
    type: mcq
    concept: health-checks-and-graceful-shutdown
    skill: analysis
    title: The restart storm
    prompt: |
      The database fails over and is unreachable for 40 seconds. Within that time the platform restarts all
      eight API instances, and when the database returns, it is flooded with 8 × 20 new connections at once.
      The liveness probe is `GET /health`, which runs `SELECT 1`. What should change?
    options:
      - id: split
        text: "Liveness must not depend on the database: /livez answers from the process only; the database check moves to /readyz, so instances stop receiving traffic but are not restarted."
        feedback: Correct - a restart can't fix the database. Readiness takes the instances out of rotation; liveness restarts only a process that is itself stuck.
      - id: higher-threshold
        text: Raise the liveness failureThreshold so it takes two minutes to fail.
        feedback: That only delays the storm until the next, longer outage - and slows the detection of a really stuck process. The probe is checking the wrong thing.
      - id: remove-probes
        text: Remove all probes; they cause more trouble than they prevent.
        feedback: Without readiness, traffic goes to instances that can't serve it and to ones that are shutting down; without liveness, a deadlocked process is never restarted.
      - id: pool-size
        text: Reduce the pool size so reconnection is lighter.
        feedback: It treats a symptom; the instances should not have been restarted in the first place.
    correct: [split]
    hints:
      - What can a restart fix, and what can't it?
      - Which probe stops traffic without restarting?
    solution: |
      Separate the questions. `/livez` - can this process make progress? - no dependencies. `/readyz` - can it
      serve now? - checks the database. During the fail-over every instance becomes unready (the load balancer
      stops sending requests) and none is restarted; when the database returns, they turn ready on their own.
      Kubernetes' own docs warn that a wrong liveness probe "can lead to cascading failures".

  - id: shutdown-order
    type: order
    concept: health-checks-and-graceful-shutdown
    skill: application
    title: Order the graceful shutdown
    prompt: |
      The API behind a load balancer has just received SIGTERM. Put the steps of a graceful shutdown in order.
    items:
      - id: not-ready
        text: Mark the instance not ready, so /readyz answers 503.
      - id: drain
        text: Keep serving for a short drain delay while the load balancer stops routing new requests here.
      - id: close
        text: Call server.close() to stop accepting new connections.
      - id: wait
        text: Wait for in-flight requests to finish, up to a deadline shorter than the grace period.
      - id: pool
        text: Close the database pool.
      - id: exit
        text: Exit with 0, or with 1 if the deadline forced connections closed.
    hints:
      - What must the load balancer know before you stop accepting connections?
      - Who might still need the database while requests are in flight?
    solution: |
      Readiness first (so traffic stops coming), a drain delay (because the load balancer notices with a
      delay), then `server.close()`, then wait for in-flight work with a deadline, then the pool (no request
      can need it any more), then exit with a code that tells the platform how it went.

  - id: exit-codes
    type: mcq
    concept: health-checks-and-graceful-shutdown
    skill: analysis
    title: What do the exit codes say?
    prompt: |
      After a rolling deploy on Kubernetes (grace period 30 s), the old instances' records show exit codes
      `137` for some and `0` for others. The app has a SIGTERM handler with a 45-second deadline for in-flight
      requests. What is the most likely explanation?
    options:
      - id: sigkill
        text: "137 is 128 + 9 (SIGKILL): those instances were still waiting for slow requests when the 30-second grace period ended, so the platform killed them. The app's deadline must be shorter than the grace period."
        feedback: Correct - SIGKILL can't be caught, so the app never got to close its pool or log the end; the 0s finished within the grace period.
      - id: oom
        text: 137 always means the container ran out of memory.
        feedback: An out-of-memory kill is also SIGKILL and also shows 137, so check the platform's reason field - but here the 45 s deadline against a 30 s grace period explains it without any memory problem.
      - id: crash
        text: 137 is an uncaught exception in the shutdown handler.
        feedback: An uncaught exception exits with code 1 in Node.js, not 137.
      - id: normal
        text: Both are normal; Kubernetes reports 137 for any container it stops.
        feedback: A process that exits on its own after SIGTERM reports its own code (0 here). 137 means it was killed.
    correct: [sigkill]
    hints:
      - Exit codes above 128 are 128 + a signal number.
      - Which is longer, the app's deadline or the platform's patience?
    solution: |
      128 + 9 = 137: SIGKILL. With a 45-second deadline inside a 30-second grace period, any instance with a
      slow request still open is killed mid-shutdown. Set the deadline below the grace period (for example
      20 s of 30 s, leaving room for the drain delay), or raise `terminationGracePeriodSeconds` if long
      requests are really needed - and confirm with the platform's termination reason that it wasn't memory.

  - id: lifecycle-coding
    type: coding
    concept: health-checks-and-graceful-shutdown
    skill: application
    title: Health checks and a graceful shutdown that loses nothing
    prompt: |
      `exercises/deployment/lifecycle.ts` starts the API with one `/health` endpoint for both probes, and a
      SIGTERM handler that closes the database, cuts every connection and exits 0 at once - the run in the
      lesson shows it dropping an in-flight request. Implement `/livez`, `/readyz` and `shutdown` to the rules
      in the file's header (readiness first, drain delay, `server.close()`, deadline with
      `closeAllConnections()`, pool last and once, idempotent) and `installSignalHandlers` for SIGTERM and
      SIGINT with the right exit code. The tests run a real HTTP server on a random port.
    project: fullstack
    files:
      - exercises/deployment/lifecycle.ts
    test: tests/deployment/lifecycle.test.ts
    command: npx vitest run tests/deployment/lifecycle.test.ts
    hints:
      - "A boolean shuttingDown that /readyz checks first; /livez never calls checkDatabase."
      - "Wrap server.close(callback) in a promise that resolves 'graceful', and race it against a setTimeout promise that resolves 'forced'."
      - "Clear the timer when close wins, or the process stays alive for the full deadline."
      - "Keep the promise of the first shutdown in a variable (??=) and return it on later calls."
      - "In installSignalHandlers, register both signals and call exit only once, after the shutdown promise resolves."
    modelAnswer: |
      See the lesson's "Real runs - SIGTERM with and without a shutdown" section for `/livez`, `/readyz`,
      `runShutdown` and the idempotent `shutdown`. The signal handlers:

      ```typescript
      installSignalHandlers(target, exit) {
        let exiting = false;
        for (const signal of ['SIGTERM', 'SIGINT'] as const) {
          target.on(signal, () => {
            if (exiting) return; // a second signal joins the shutdown already running
            exiting = true;
            void shutdown(signal).then((result) => exit(result === 'graceful' ? 0 : 1));
          });
        }
      },
      ```

      Taking `target` and `exit` as parameters (instead of `process` and `process.exit`) is what lets the
      tests send fake signals without stopping the test runner.
    solution: |
      Split the endpoints (liveness without dependencies; readiness with the database check and the
      shutdown flag, error text kept out of the body), then shut down in order - flag, drain delay,
      `server.close()` raced against a deadline, `closeAllConnections()` if forced, pool last - keeping the
      first shutdown's promise for later calls; handle SIGTERM and SIGINT once and exit 0 or 1 from the
      result.
    rubric:
      - Every test in tests/deployment/lifecycle.test.ts passes.
      - The database is closed after the server has closed (or been forced), in every path.
      - The deadline timer is cleared when the server closes in time.
      - Each lifecycle step writes a structured log line, and no error text reaches a health response.
    followUp: |
      The API also serves Server-Sent Events streams that stay open for hours. What happens to them during
      this shutdown, and how would you end them politely so clients reconnect to another instance?

  - id: rollout-choice
    type: mcq
    concept: zero-downtime-releases
    skill: application
    title: Which release strategy?
    prompt: |
      SandPay is replacing the fee calculation engine. Unit and contract tests pass, but the team worries about
      unusual real merchant data that no test set contains, and wants to limit how many merchants could see a
      wrong fee and undo it within a minute. The platform can split traffic by percentage and by merchant id.
      What fits best?
    options:
      - id: canary
        text: A canary - deploy beside the current version, route a small share of merchants to it, compare fee metrics and error rates, and widen in steps; reroute everyone back if anything looks wrong.
        feedback: Correct - real data at a small blast radius, with a fast, routing-only rollback.
      - id: rolling
        text: A standard rolling update with readiness probes.
        feedback: Readiness checks that instances are up, not that fees are right; the share of traffic on the new version grows as fast as instances are replaced, and rollback is another rollout.
      - id: big-bang
        text: Stop all instances, deploy, start them - simplest to reason about.
        feedback: Downtime, every merchant exposed at once, and rollback means another outage.
      - id: staging-longer
        text: Keep it in staging for another month.
        feedback: Staging doesn't have the unusual production data the team is worried about - that is exactly what a canary exposes safely.
    correct: [canary]
    hints:
      - Which strategy uses real production data while limiting who is affected?
    solution: |
      A canary: production data, a chosen and small group first (a random sample, or internal merchants - a
      flag targeting merchant ids does the same), metrics that compare old and new, widening in steps, and
      rollback by routing. Sato describes the rollback as simply rerouting users back to the old version.

  - id: rollback-migration
    type: mcq
    concept: zero-downtime-releases
    skill: analysis
    title: The rollback that failed
    prompt: |
      Release 41 shipped a migration `ALTER TABLE merchants RENAME COLUMN email TO contact_email` and code
      that uses `contact_email`. During the rolling update, the dashboard showed errors for some users; the
      team rolled back to release 40, and now **every** request that reads merchants fails with
      `column "email" does not exist`. What went wrong, and how should the change have been shipped?
    options:
      - id: expand-contract
        text: The rename broke the running and the previous release; it should have been expand (add contact_email, write both, backfill), migrate (read the new column), and only later contract (drop email) - each step compatible with the release before it.
        feedback: Correct - during a rollout and after a rollback, old code meets the new schema; only additive steps keep both working.
      - id: down-migration
        text: The team forgot to run the down migration during the rollback.
        feedback: A down migration might restore the column, but while release 41 instances are still running they break instead - and a down migration that drops data written by 41 is risky. The real fix is never needing it.
      - id: blue-green
        text: A blue-green deployment would have avoided it.
        feedback: Blue-green usually shares the database, so the renamed column breaks the blue side too. Fowler's advice is precisely to separate schema changes from application upgrades.
      - id: lock
        text: The rename held a lock for too long.
        feedback: A rename is quick in PostgreSQL (it changes the catalogue, not the rows); the errors are about the column name, not waiting.
    correct: [expand-contract]
    hints:
      - Which version of the code was running against the new schema during the rollout?
      - What does a rollback change - the code, the schema, or both?
    solution: |
      Rolling back code does not roll back the schema. A rename is a breaking change for every running
      instance of the previous release, during the rollout and after a rollback. Ship it as expand, migrate
      and contract across releases, so each release works with the schema of its neighbours. See [Migrations
      and data access from Node.js](#/lesson/migrations-and-data-access) for the batched backfill and locks.

  - id: release-plan
    type: testdesign
    concept: zero-downtime-releases
    skill: application
    title: Prove a release is zero-downtime
    prompt: |
      The team claims the next SandPay dashboard API release, which adds a nullable column and a new endpoint,
      can be deployed with a rolling update and rolled back with "zero failed requests". Design the tests that
      would prove it before it goes to production: preconditions, steps, expected results and **evidence**.
    hints:
      - Where do you measure failed requests, and why not in the app's own logs?
      - What must work in the middle of the rollout, not only before and after?
      - What does the rollback have to cope with?
    modelAnswer: |
      **Preconditions:** a staging deploy with at least three instances behind the same kind of load balancer
      and probes as production; release N running; the migration for N+1 not applied; a load tool with a
      realistic mix including a slow endpoint (for example the CSV export).

      **1. Rolling deploy under load:** start steady load (for example 50 req/s) and keep it running; apply the
      migration; roll out N+1. Expected: zero non-2xx responses and zero connection errors at the **client**;
      old instances exit with code 0; each logs `shutdown_started` → `shutdown_finished graceful`; `/readyz`
      turns 503 before each instance stops. Evidence: the load tool report, exit codes from the platform,
      log extracts with timestamps.

      **2. Mixed versions:** pause the rollout half-way; call the existing endpoints and the new one through the
      load balancer repeatedly. Expected: existing endpoints identical from both versions; the new endpoint
      either works or is behind a flag that is off until the rollout finishes (no 404 roulette). Evidence:
      responses with the release id header.

      **3. Rollback under load:** after N+1 has written rows (with the new column filled), roll back to N
      under the same load. Expected: zero failed requests; N reads those rows without errors. Evidence: load
      report; a smoke test of N against the new data.

      **4. Long request:** start the slow export just before an instance is stopped. Expected: it completes, or
      - if longer than the deadline - is cut at the deadline with `shutdown_timeout` logged, not by SIGKILL.
      Evidence: client timing, server log, exit code.

      **5. Probes:** stop the database for 30 s mid-test. Expected: instances unready, none restarted; ready again
      afterwards. Evidence: restart counts before and after.
    solution: |
      Measure at the client under steady load through a rollout, a paused half-way state, and a rollback after
      new data exists; add a long request around a shutdown and a dependency outage for the probes. Keep the
      load report, exit codes, timestamps and restart counts as evidence.
    rubric:
      - Measures failed requests at the client or the load balancer, under load, during the rollout.
      - Tests the mixed-version state, not only before and after.
      - Tests rollback after the new version has written data.
      - Covers a request that spans a shutdown and checks it ends before SIGKILL.
      - Names concrete evidence for each step (reports, exit codes, log timestamps, restart counts).

  - id: flag-kind
    type: mcq
    concept: feature-flags
    skill: application
    title: Which kind of flag?
    prompt: |
      The new merchant analytics panel runs an expensive query. Product wants it live for everyone next week,
      but operations want to be able to switch it off within a minute if the database is struggling on
      Black Friday - without a deploy. Which kind of toggle is this, and what does that imply?
    options:
      - id: ops
        text: An ops toggle (a kill switch) - it must be changeable at runtime by operators, quickly, so it needs a dynamic flag source rather than an environment variable read at start-up.
        feedback: Correct - Hodgson notes that needing to roll out a new release to flip an ops toggle is "unlikely to make an Operations person happy".
      - id: release
        text: A release toggle - set FEATURE_ANALYTICS_PANEL in the environment and redeploy to change it.
        feedback: A release toggle hides unfinished work and changes rarely; a redeploy is far too slow for an incident on the busiest day of the year.
      - id: experiment
        text: An experiment toggle, so half the merchants see it.
        feedback: An experiment compares cohorts to measure an effect; nothing here is being measured, and the goal is a fast global off switch.
      - id: permission
        text: A permission toggle for premium merchants.
        feedback: Who sees it isn't the question; how fast operators can turn it off is.
    correct: [ops]
    hints:
      - Who flips it, and how fast must it take effect?
    solution: |
      An ops toggle / kill switch. It needs a runtime source (a flag service, or config the app re-reads), a
      safe default when that source is unreachable, an owner in operations, and a rehearsal: flip it under
      load in staging and check the panel degrades gracefully.

  - id: flag-tests
    type: short
    concept: feature-flags
    skill: application
    title: Which flag configurations do you test?
    prompt: |
      The release candidate contains 12 flags. Today in production 7 are on. This release will turn on two
      more: `newRefundFlow` and `bulkExport`. With 2^12 = 4096 possible combinations, which configurations
      do you run the automated suite against, and what convention makes that choice valid?
    modelAnswer: |
      Three configurations, following Hodgson's advice: **(1) the expected production configuration** - the 7
      flags on today plus `newRefundFlow` and `bulkExport`; **(2) the fallback** - today's 7 on with the two new
      ones **off**, which is what production runs if they are switched off again; **(3) all flags on**, to
      catch surprises in a future release. Not all 4096: most flags don't interact, and most releases change
      one or two. This is valid only if flags follow one convention - **off = existing behaviour, on = new
      behaviour** - so "all on" means "everything new" and "off" is always the safe fallback. Where two flags
      do interact (both touch refunds), add their combination explicitly.
    rubric:
      - Names the expected production configuration and the fallback with the new flags off.
      - Mentions all-on as an extra safety run.
      - States the off-means-old convention and why it matters.
      - Adds targeted combinations only where flags interact.
    hints:
      - Which configuration will really run on Monday - and which one if you turn the new flags off?
    solution: |
      Production-to-be (today's 7 + the 2 new), fallback (today's 7 only) and all-on, plus specific
      combinations where flags interact - valid because off always means the existing behaviour.

  - id: interview-deploy
    type: interview
    concept: zero-downtime-releases
    skill: analysis
    title: "\"Walk me through deploying a Node.js API with zero downtime\""
    prompt: |
      An interviewer for a full stack role asks: "You have a Node.js and Express API with PostgreSQL, running
      several instances behind a load balancer. Walk me through how you deploy a new version with zero
      downtime - and what can still go wrong."
    modelAnswer: |
      I'd separate build, release and run: CI builds one immutable image per commit; a release is that image
      plus the environment's config, with a release id, so rollback means redeploying an earlier release.

      Config comes from the environment and is validated at start-up with a schema - the process refuses to
      start and lists every problem, there are no defaults for secrets, and secrets come from a secret store.

      Each instance has two endpoints: `/livez` that only says the process is alive, so the platform restarts
      a stuck process but not a healthy one during a database outage, and `/readyz` that checks the database
      and turns 503 when shutting down. On SIGTERM the app marks itself unready, keeps serving for a few
      seconds while the load balancer notices, calls `server.close()`, waits for in-flight requests up to a
      deadline shorter than the platform's grace period, closes the pool and exits.

      Then a rolling update - or a canary for risky changes - gated on readiness and error rates. The thing
      that still breaks most often is compatibility: old and new versions run together, so schema and API
      changes go expand, migrate, contract over several releases, and new behaviour ships behind flags that
      are off by default. I'd prove it with a load test during a deploy and a rollback, measuring failed
      requests at the client.

      What can still go wrong: long requests and WebSockets outliving the grace period, a migration that takes
      a lock, caches or messages written by one version and unreadable by the other, and flags that
      are never cleaned up.
    rubric:
      - Covers config and secrets (validated at start-up, not in the image).
      - Distinguishes liveness from readiness and says why.
      - Describes graceful shutdown in the right order, with a deadline inside the grace period.
      - Explains that versions overlap and how schema/API changes stay compatible (expand and contract).
      - Says how to verify it (load during deploy and rollback, measured at the client) and names residual risks.
    followUps:
      - How would you roll back if the new version has already written data in a new format?
      - Your readiness probe checks the database. What happens to users if the database is down for everyone?
      - How do you handle WebSocket connections during this?
    hints:
      - Go from the artefact, to config, to one instance's lifecycle, to the fleet, to compatibility, to proof.
    solution: |
      Immutable build + config = release with an id; validated env config and managed secrets; `/livez` versus
      `/readyz`; SIGTERM → unready → drain → close → deadline → pool → exit; rolling or canary gated on
      readiness and metrics; expand/contract and flags for compatibility; proven with load during deploy and
      rollback. Residual risks: long connections, locks, cross-version data, stale flags.

placement:
  - id: place-config
    type: mcq
    concept: environment-config-and-secrets
    skill: application
    title: A safe start-up
    prompt: |
      Production starts a new release with `DATABASE_URL` set but `SESSION_SECRET` missing because of a typo
      in the variable name in the deploy configuration. Which loader behaviour is right?
    options:
      - id: refuse
        text: Refuse to start, with an error that names SESSION_SECRET (and every other problem) but no values.
        feedback: Correct - the rollout stops at the first instance, nobody is exposed, and the message says exactly what to fix.
      - id: default
        text: Start with a built-in development secret and log a warning.
        feedback: Sessions would be signed with a key that is in the source code - anyone can forge one. Warnings are not read in time.
      - id: random
        text: Generate a random secret at start-up so the app still works.
        feedback: Each instance would sign with a different key, so sessions break whenever a request lands on another instance or after a restart - and the real misconfiguration stays hidden.
      - id: lazy
        text: Start normally and fail when the first request needs the secret.
        feedback: The broken release would pass readiness and take traffic, then fail users one by one.
    correct: [refuse]
    solution: |
      Validate all configuration at start-up and refuse to start on any problem, naming the variables without
      their values. A default, a random value or a lazy failure each turn a deploy-time error into a
      production incident.

  - id: place-probes
    type: mcq
    concept: health-checks-and-graceful-shutdown
    skill: application
    title: Shutting down and readiness
    prompt: |
      An instance receives SIGTERM while 30 requests are in flight. Which response from its health endpoints is
      right during the next few seconds?
    options:
      - id: ready-503
        text: /readyz answers 503 at once, /livez still answers 200, and the instance keeps serving for a short drain delay before closing.
        feedback: Correct - stop new traffic, don't trigger a restart, finish the work in progress.
      - id: both-503
        text: Both answer 503, so the platform knows the instance is going away.
        feedback: A failing liveness probe asks for a restart; mid-shutdown that can kill the process before the in-flight requests finish.
      - id: both-200
        text: Both answer 200 until the last request has finished.
        feedback: The load balancer keeps sending new requests, so the instance never drains - or they are refused when it closes.
      - id: exit-now
        text: Neither - exit immediately; the load balancer retries failed requests.
        feedback: In-flight requests are cut, and a POST that was half-processed is not something a load balancer can safely retry.
    correct: [ready-503]
    solution: |
      Readiness is the routing signal: turn it off first. Liveness is the restart signal: leave it alone
      while shutting down. Keep serving for a short drain delay, then close and wait for in-flight requests.

  - id: place-release
    type: mcq
    concept: zero-downtime-releases
    skill: analysis
    title: The safe first step
    prompt: |
      A new version needs `orders.status` (text) to become `orders.state` (an enum). The team deploys with
      rolling updates. What should the **first** release contain?
    options:
      - id: expand
        text: Add the new state column, write both columns, keep reading status, and backfill - removing status only in a later release.
        feedback: Correct - expand first; every running and previous release still works.
      - id: rename
        text: Rename status to state and change its type, with the code that uses state.
        feedback: The running release breaks during the rollout, and rollback can't restore it.
      - id: maintenance
        text: Take a maintenance window - schema changes can't be done without downtime.
        feedback: Expand and contract exists precisely to avoid that.
      - id: flag
        text: Put the code that uses state behind a feature flag and rename the column.
        feedback: The flag protects the code, not the schema - the rename still breaks the running release, flag or not.
    correct: [expand]
    solution: |
      Expand, migrate, contract: add the new column alongside the old one and write both, backfill, switch
      reads in a later release, and drop the old column only when no running or rollback-target release reads
      it.

  - id: place-flags
    type: mcq
    concept: feature-flags
    skill: application
    title: The flag after launch
    prompt: |
      A release toggle for the new refund flow has been on for every merchant for three weeks without problems.
      What should happen to it?
    options:
      - id: remove
        text: Remove the flag and the old code path in the next release.
        feedback: Correct - release toggles are transitionary; every week it stays is carrying cost and an untested fallback.
      - id: keep-forever
        text: Keep it forever as a safety switch.
        feedback: The old path is no longer tested against today's data and code, so switching back is a gamble - and the flag inventory keeps growing. If a real kill switch is needed, make it a deliberate ops toggle.
      - id: rename
        text: Convert it into an experiment toggle to measure the effect.
        feedback: The rollout is complete; an experiment needs a hypothesis and cohorts from the start.
      - id: env
        text: Move it into an environment variable so it costs nothing.
        feedback: Where the flag lives doesn't change the extra code path it keeps alive.
    correct: [remove]
    solution: |
      Delete it: release toggles "should generally not stick around much longer than a week or two" (Hodgson).
      Give every flag an owner and an expiry so this happens on schedule.

recall:
  - id: recall-config
    concept: environment-config-and-secrets
    prompt: What is config in the twelve-factor sense, and what is the litmus test?
    answer: Everything likely to vary between deploys - backing-service URLs, credentials, per-deploy values - kept out of code (in env vars). Litmus test - could the code be made open source at any moment without compromising any credentials?
  - id: recall-loader
    concept: environment-config-and-secrets
    prompt: Name four properties of a good start-up config loader.
    answer: Reads every variable once in one place; parses with a schema (types, ranges, z.stringbool for booleans); has no defaults for secrets or service URLs; refuses to start listing every problem without echoing values; returns a frozen object; logs a redacted copy.
  - id: recall-secrets
    concept: environment-config-and-secrets
    prompt: What are the stages of a secret's lifecycle, and what comes first when one leaks?
    answer: Creation, rotation, revocation, expiration (OWASP). On a leak - revoke it first, then rotate in a new one, investigate use, remove it from code and logs, and add scanning.
  - id: recall-probes
    concept: health-checks-and-graceful-shutdown
    prompt: What is the difference between liveness and readiness?
    answer: Liveness - should this process be restarted? Answer from the process only, no dependencies. Readiness - should traffic be sent here now? May check the database; 503 when not ready or shutting down; failing removes the instance from rotation without a restart.
  - id: recall-shutdown
    concept: health-checks-and-graceful-shutdown
    prompt: List the steps of a graceful shutdown on SIGTERM.
    answer: Readiness false; short drain delay; server.close(); wait for in-flight requests with a deadline shorter than the grace period (closeAllConnections if it passes); close the pool; exit 0 (or 1 if forced). Idempotent if the signal repeats.
  - id: recall-exit-codes
    concept: health-checks-and-graceful-shutdown
    prompt: What do exit codes 143 and 137 tell you about a Node.js process that was stopped?
    answer: 143 = 128 + 15 - it died from SIGTERM through Node's default handler (no graceful shutdown). 137 = 128 + 9 - it was SIGKILLed, for example when the grace period ran out (or an out-of-memory kill).
  - id: recall-strategies
    concept: zero-downtime-releases
    prompt: Compare rolling, blue-green and canary releases in one line each.
    answer: Rolling - replace instances in batches, cheap, old and new side by side. Blue-green - two full environments, switch the router, instant rollback, double capacity. Canary - a small share of users first, widen while metrics are good, rollback by rerouting.
  - id: recall-flags
    concept: feature-flags
    prompt: Name the four kinds of feature toggle and which flag configurations to test.
    answer: Release, experiment, ops (kill switch) and permission toggles. Test the expected production configuration, the fallback with the new flags off, and all flags on - with off always meaning the existing behaviour.

