id: deployment-and-configuration
title: Deployment, configuration and environments
subject: fullstack
module: quality-and-delivery
level: intermediate
status: published
estimatedMinutes: 75
summary: How a Node.js and Express app gets from a build to production without dropping requests - configuration in the environment and validated at start-up, where secrets really belong, liveness and readiness checks, graceful shutdown on SIGTERM, rolling, blue-green and canary releases, schema changes that old and new versions both survive, and feature flags that separate deploying from releasing. Every run shown here is real.
