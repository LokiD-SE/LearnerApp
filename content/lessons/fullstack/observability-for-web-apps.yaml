id: observability-for-web-apps
title: Observability for web applications
subject: fullstack
module: quality-and-delivery
level: advanced
status: published
estimatedMinutes: 80
summary: The developer's side of observability for a Node.js and Express API - structured logs that join up with traces, the W3C traceparent header and how a trace crosses services, OpenTelemetry auto-instrumentation, request-duration histograms in the Prometheus format without a cardinality explosion, and SLOs with burn-rate alerts. Every span, log line and metrics scrape shown here is real output.
