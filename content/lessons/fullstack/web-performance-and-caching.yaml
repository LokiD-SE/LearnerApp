id: web-performance-and-caching
title: Web performance and HTTP caching
subject: fullstack
module: quality-and-delivery
level: advanced
status: published
estimatedMinutes: 85
summary: How fast a web app feels and how to make it faster without guessing - the three Core Web Vitals (LCP, INP, CLS) and their thresholds, measured in the field and in the lab; what a production bundle really weighs and how code splitting helps; and HTTP caching from the standards - freshness, age, Cache-Control directives, ETags, conditional requests and 304, stale-while-revalidate, and the hashed-asset pattern every Vite app relies on. Every header, build report and measurement shown here is real.
