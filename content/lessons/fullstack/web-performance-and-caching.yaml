environment: |
  - **Runtime and tools:** **Node.js 24** (v24.21.0, from this repository's `.nvmrc`), **Express 5.3.0** (with its
    `etag` 1.8.1 and `fresh` 2.0.0 dependencies), curl, **Vite 8.3.4** building this app, and Google Chrome driven by
    Playwright for the lab measurements. The practice exercises use Vitest 5.0.3 and supertest 7.3, as pinned in
    `practice/fullstack`. Every header, build report and timing in this lesson was captured on Linux on 14
    November 2026; your numbers will differ.
  - **Core Web Vitals (web.dev, Google):** [Web Vitals](https://web.dev/articles/vitals) (last updated 31 October
    2024), [Largest Contentful Paint](https://web.dev/articles/lcp) (updated 4 September 2025), [Interaction to Next
    Paint](https://web.dev/articles/inp) (updated 2 September 2025), [Cumulative Layout
    Shift](https://web.dev/articles/cls) (updated 12 April 2023) and [Defining the Core Web Vitals metrics
    thresholds](https://web.dev/articles/defining-core-web-vitals-thresholds) (updated 7 May 2025). The thresholds
    are Google's recommendations, not a standard; they can change - check the articles.
  - **HTTP standards:** [RFC 9111 - HTTP Caching](https://www.rfc-editor.org/rfc/rfc9111) (June 2022: sections
    4.2 freshness, 4.2.3 age, 4.2.4 serving stale, 4.3 validation, 5.2 Cache-Control); [RFC 9110 - HTTP
    Semantics](https://www.rfc-editor.org/rfc/rfc9110) (section 8.8.3 ETag and its weak/strong comparison, 12.5.5
    Vary, 13.1.2 If-None-Match, 13.2.2 precedence of preconditions, 15.4.5 304 Not Modified); [RFC 5861 - HTTP
    Cache-Control Extensions for Stale Content](https://www.rfc-editor.org/rfc/rfc5861) (stale-while-revalidate,
    stale-if-error; Informational); [RFC 8246 - HTTP Immutable
    Responses](https://www.rfc-editor.org/rfc/rfc8246).
  - **Reference pages:** MDN, [Cache-Control](https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Cache-Control)
    (the cache-busting pattern and `no-cache` versus `no-store`); Vite, [Building for
    Production](https://vite.dev/guide/build) (chunking, `vite:preloadError`, "set `Cache-Control: no-cache` on the
    HTML file"), [Features - Build Optimizations](https://vite.dev/guide/features#build-optimizations) (CSS code
    splitting, modulepreload, async chunk loading) and [Build Options](https://vite.dev/config/build-options)
    (`build.chunkSizeWarningLimit` default 500, `build.assetsInlineLimit` default 4096). Express behaviour was
    read from its source in `node_modules` (`res.send` computes the ETag, then checks `req.fresh`).
  - **What was measured, and how:** the build report is `npx vite build` of this repository. The response headers
    come from a 20-line Express 5 server (shown in the lesson) on `localhost`. The lab LCP and CLS come from a
    Playwright script using `PerformanceObserver` in Chrome with a 412 x 915 viewport, served by a small Node
    server that gzips responses; "slow" means Chrome DevTools Protocol network emulation at 150 ms latency and 1.6
    Mbps down with a 4x CPU slowdown. These are **lab** numbers from one machine - not field data and not a
    Lighthouse score.
  - **Fictional:** SandPay, its merchant dashboard, merchant ids and amounts. Amounts are integer minor units.
  - **Not repeated here:** HTTP message basics ([HTTP request and response
    anatomy](#/lesson/http-request-response-anatomy)), safe and idempotent methods ([HTTP methods, safety and
    idempotency](#/lesson/http-methods-safety-idempotency)), the event loop behind long tasks ([DOM events and the
    event loop](#/lesson/dom-events-event-loop)), and the app's own offline cache (a service worker is a separate,
    programmable cache - not covered here).

prerequisites:
  - express-http-server
  - rest-api-design
  - react-routing-and-data-fetching
  - dom-events-event-loop

concepts:
  - id: core-web-vitals
    name: Core Web Vitals - measuring what users feel
    summary: LCP (loading - good at 2.5 s or less), INP (responsiveness - good at 200 ms or less) and CLS (visual stability - good at 0.1 or less), each judged at the 75th percentile of real page loads, split by mobile and desktop. Field data (CrUX, your own RUM) is the verdict; lab tools reproduce and diagnose, and cannot measure INP without a user - TBT is their proxy.
  - id: bundle-size-and-code-splitting
    name: Bundle size, code splitting and the hashed-asset pattern
    summary: Every kilobyte of JavaScript on the critical path must be downloaded, parsed and run before the page can render or respond. Read the build report, keep the entry chunk small, load rarely used code with dynamic import(), and give every built file a content hash in its name so it can be cached for a year while the HTML that points to it is revalidated on every visit.
  - id: http-cache-freshness
    name: HTTP cache freshness and Cache-Control
    summary: A cache may reuse a stored response without asking the origin while it is fresh - while its freshness lifetime (s-maxage for shared caches, else max-age, else Expires minus Date, else a heuristic) is greater than its current age. Cache-Control directives decide who may store it (private, no-store), when it must be revalidated (no-cache, must-revalidate) and whether stale copies may be served (stale-while-revalidate).
  - id: conditional-requests-and-validation
    name: Validators, conditional requests and 304
    summary: An ETag (or Last-Modified) identifies a representation. A cache revalidates by sending If-None-Match with the tags it holds; when one matches under the weak comparison, the server answers 304 Not Modified with no body and the cache reuses its copy. If-None-Match takes precedence over If-Modified-Since. A 304 saves bandwidth always and saves server work only if the server checks the validator before building the response.

objectives:
  - State the three Core Web Vitals with their good and poor thresholds and the percentile they are judged at, and explain why lab tools cannot measure INP.
  - Diagnose a slow page from evidence - a build report, a lab trace or field percentiles - and name the change most likely to help.
  - Read a Vite build report, identify what is on the critical path, and use dynamic import() to move rarely used code out of the entry chunk.
  - Calculate a stored response's freshness lifetime and current age from its headers as RFC 9111 defines them, and decide whether a cache may reuse it.
  - Choose Cache-Control for hashed assets, the HTML entry point, private API responses and public API responses, and explain no-cache versus no-store.
  - Implement ETag validation in Express that answers 304 without building the response, and write tests that prove it.

sections:
  - id: intuition
    kind: intuition
    concepts: [core-web-vitals, http-cache-freshness]
    title: The idea in plain language
    body: |
      Think of a **kitchen with a fridge**. Every dish you serve needs ingredients. Fetching them from the market
      every time is slow; keeping them in the fridge is fast - but only while they are still good.

      - Each item in the fridge has a **use-by date** (its *freshness lifetime*). Before the date you just use it.
      - After the date you don't throw it away at once: you **phone the supplier** - "is the batch with label 42
        still current?" If the supplier says "yes, same batch" (**304 Not Modified**), you keep using it; the call
        took seconds, not a trip to the market. If not, they send the new batch (**200** with a new label).
      - Some things must never go in the fridge (`no-store`), some only in your *own* fridge, not the shared one
        at the restaurant next door (`private`), and some must be checked with the supplier every single time,
        even though you keep them (`no-cache`).
      - Jars labelled with the **exact recipe version** on the lid never change - a new recipe gets a new jar with
        a new label. Those you can keep for a year without ever phoning (`immutable` hashed assets).

      And how do you know the kitchen is fast? Not by timing the chef alone in an empty restaurant at 3 a.m. (lab
      data), but by asking real customers on a busy night how long the first plate took, how quickly the waiter
      reacted, and whether their table wobbled - and looking at the **slowest quarter** of them, not the average.
      That is what the Core Web Vitals measure.

  - id: what
    kind: what
    concepts: [core-web-vitals, http-cache-freshness, conditional-requests-and-validation]
    title: The terms, precisely
    body: |
      **Performance (web.dev, Google's recommendations):**

      | Term | Meaning |
      | --- | --- |
      | **LCP** - Largest Contentful Paint | when "the largest image, text block, or video visible in the viewport" was rendered, from the start of navigation |
      | **INP** - Interaction to Next Paint | the latency of clicks, taps and key presses through the whole visit - from input, through the event handlers, to the next painted frame; the reported value is the longest interaction, ignoring one outlier per 50 interactions |
      | **CLS** - Cumulative Layout Shift | the largest burst ("session window") of unexpected layout shifts during the page's life |
      | **Field data** | measured on real users' devices - the Chrome User Experience Report (CrUX) or your own real-user monitoring (RUM) |
      | **Lab data** | measured by a tool in a controlled environment (Lighthouse, DevTools, a Playwright script) |
      | **TBT** - Total Blocking Time | a lab metric of main-thread blocking, "a proxy for INP" |
      | **Critical path** | what must be downloaded and run before the page can show its main content |

      **Caching (RFC 9111 and RFC 9110):**

      | Term | Meaning |
      | --- | --- |
      | **Private cache** | belongs to one user - the browser's HTTP cache |
      | **Shared cache** | serves many users - a CDN, a reverse proxy |
      | **Fresh / stale** | a response is fresh while `freshness_lifetime > current_age`; otherwise stale |
      | **Freshness lifetime** | how long, from generation at the origin, the response may be reused without asking |
      | **Age** | the cache's estimate of the seconds since the origin generated or last validated the response |
      | **Validator** | metadata to check a stored copy is still current: an **ETag** (entity tag) or **Last-Modified** |
      | **Conditional request** | a request with `If-None-Match` / `If-Modified-Since` (and, for writes, `If-Match`) |
      | **304 Not Modified** | "you already have a valid representation" - no body; the cache reuses its copy |
      | **Revalidation** | sending a conditional request to make a stale stored response usable again |
      | **Cache key** | what a stored response is filed under - by default method and URI, extended by `Vary` |

  - id: why
    kind: why
    concepts: [core-web-vitals, bundle-size-and-code-splitting, http-cache-freshness]
    title: Why this matters to a full stack developer and a tester
    body: |
      - **Users leave slow pages** - and slow is measured on *their* phones and networks, not on your laptop.
        Later in this lesson the same build of this very app paints its main content in **0.84 s** on a desktop
        connection and in **8.6 s** with a slow network and CPU - over three times the 2.5 s "good" LCP.
      - **Caching is the cheapest speed-up there is.** A response that is reused from the browser cache costs no
        network at all; a 304 costs one round trip and a few hundred bytes instead of the whole body. A CDN that
        caches public responses takes load off your origin.
      - **Caching is also a correctness risk.** Cache the wrong thing and users see someone else's data (a
        `public` dashboard response on a CDN), stale prices, or a blank page after a deploy (an HTML file cached
        for a day that points at JavaScript files the deploy deleted).
      - **Performance regressions creep in silently.** One import of a large library on the entry path adds
        hundreds of kilobytes to every first visit; nobody notices until the field data drops a month later. A
        build-size check in CI or a lab measurement per release catches it the day it happens.
      - **Interviews ask about it.** "The dashboard is slow - what do you do?" and "How do you cache an API
        response?" are standard full stack questions; the answer is measurement first, then the right header.

  - id: vitals
    kind: internals
    concepts: [core-web-vitals]
    title: The three Core Web Vitals and how they are judged
    body: |
      From web.dev's [Web Vitals](https://web.dev/articles/vitals) and [thresholds
      article](https://web.dev/articles/defining-core-web-vitals-thresholds):

      | Metric | Measures | Good | Needs improvement | Poor |
      | --- | --- | --- | --- | --- |
      | **LCP** | loading | at most 2500 ms | 2500-4000 ms | over 4000 ms |
      | **INP** | responsiveness | at most 200 ms | 200-500 ms | over 500 ms |
      | **CLS** | visual stability | at most 0.1 | 0.1-0.25 | over 0.25 |

      **Judged at the 75th percentile**: "a good threshold to measure is the 75th percentile of page loads,
      segmented across mobile and desktop devices", and a page passes when it "meets the recommended targets at
      the 75th percentile for all three". The 75th percentile means three users in four had it at least this
      good - an average would hide the slow quarter.

      **LCP** considers `<img>` elements, `<video>` posters or first frames, elements with a `url()` background
      image, and block-level elements containing text. It can change while the page loads: text may be the
      largest element first, then a hero image replaces it as the LCP candidate. LCP "includes any unload time
      from the previous page, connection set up time, redirect time, and other Time To First Byte (TTFB) delays"
      - so a slow server or a redirect chain shows up as slow LCP.

      **INP** observes "all click, tap, and keyboard interactions" in the visit; hovering and scrolling are not
      counted. Each interaction has three parts: **input delay** (until the handlers start - often a long task
      already running on the main thread), **processing duration** (all the event handlers) and **presentation
      delay** (until the next frame is painted). INP replaced First Input Delay as a Core Web Vital in 2024; FID
      only measured the *input delay* of the *first* interaction.

      **CLS** scores each unexpected shift as **impact fraction x distance fraction** - an element covering half
      the viewport that moves down by a quarter of its height scores 0.75 x 0.25 = 0.1875 in web.dev's example.
      Shifts are grouped into session windows (less than 1 s between shifts, at most 5 s per window), and CLS is
      the worst window. Shifts within 500 ms of user input are excluded - a menu that opens when you click is
      expected. Typical causes: images without dimensions, late-loading fonts, ads and banners inserted above
      content.

      **Field versus lab.** Field data (CrUX powers PageSpeed Insights and Search Console; your own RUM with the
      `web-vitals` library gives per-page-view detail) is the verdict - it is what users experienced. Lab tools
      give a repeatable trace to **diagnose** and to **catch regressions before release**. They disagree for good
      reasons: different devices, networks, caches, and lab runs have no user - "Tools like Lighthouse ... cannot
      measure INP, as there is no user input. However, the Total Blocking Time (TBT) metric is lab-measurable and
      is a proxy for INP."

  - id: vitals-code
    kind: code
    concepts: [core-web-vitals]
    title: Measuring LCP and CLS in the lab - a real run on this app
    collapsed: true
    body: |
      The browser exposes the raw entries through `PerformanceObserver`; the `web-vitals` library wraps the same
      APIs with the edge cases handled. This Playwright script records the last LCP candidate and adds up layout
      shifts (lab only - a simplified CLS without session windows, which is enough to spot shifts):

      ```javascript
      import { chromium } from 'playwright';

      const [url, cpu = '1', net] = process.argv.slice(2);
      const browser = await chromium.launch({ channel: 'chrome' });
      const page = await browser.newPage({ viewport: { width: 412, height: 915 } });
      const cdp = await page.context().newCDPSession(page);
      await cdp.send('Emulation.setCPUThrottlingRate', { rate: Number(cpu) });
      if (net === 'slow') {
        await cdp.send('Network.enable');
        await cdp.send('Network.emulateNetworkConditions', {
          offline: false, latency: 150,
          downloadThroughput: (1.6 * 1024 * 1024) / 8, uploadThroughput: (750 * 1024) / 8,
        });
      }
      await page.addInitScript(() => {
        window.__vitals = { lcp: 0, cls: 0, lcpElement: '' };
        new PerformanceObserver((list) => {
          const last = list.getEntries().at(-1);
          window.__vitals.lcp = last.startTime;
          window.__vitals.lcpElement = last.element?.tagName ?? '';
        }).observe({ type: 'largest-contentful-paint', buffered: true });
        new PerformanceObserver((list) => {
          for (const e of list.getEntries()) if (!e.hadRecentInput) window.__vitals.cls += e.value;
        }).observe({ type: 'layout-shift', buffered: true });
      });
      await page.goto(url, { waitUntil: 'networkidle' });
      // ...then read window.__vitals and the navigation timing entry, and print them
      ```

      (Excerpt - the run also printed the class of the LCP element and the navigation timing.) Three runs against
      this app's production build, served gzipped from `localhost`:

      ```plaintext
      $ node measure.mjs "http://localhost:4181/index.html#/" 1
      {"cpuSlowdown":1,"network":"unthrottled","ttfb":6,"domContentLoaded":755,"lcpMs":844,"lcpElement":"P.lead","cls":0}
      $ node measure.mjs "http://localhost:4181/index.html#/" 4
      {"cpuSlowdown":4,"network":"unthrottled","ttfb":5,"domContentLoaded":1714,"lcpMs":1880,"lcpElement":"P.lead","cls":0}
      $ node measure.mjs "http://localhost:4181/index.html#/" 4 slow
      {"cpuSlowdown":4,"network":"150ms RTT, 1.6 Mbps","ttfb":154,"domContentLoaded":8479,"lcpMs":8604,"lcpElement":"P.lead","cls":0}
      ```

      Read it like evidence:

      - **The LCP element is a paragraph** (`P.lead`), not an image - so image optimisation would not help.
      - **TTFB is tiny** (5-154 ms - the 154 is the emulated 150 ms latency). The server is not the problem.
      - **LCP follows DOMContentLoaded closely** in every run: the page has nothing to show until the JavaScript
        has downloaded and run. This is a client-rendered app - the `<body>` is an empty `<div id="app">`.
      - **CPU alone** (4x slower) more than doubles LCP; **network plus CPU** quadruples it again. Something big is
        on the critical path. CLS is 0 - nothing moves.

      The next section finds the big thing.

  - id: bundles
    kind: internals
    concepts: [bundle-size-and-code-splitting]
    title: What the build really ships - reading a Vite build report
    body: |
      `vite build` prints every output file with its size and gzip size. Excerpt from this repository's build
      (paths shortened to `dist/`; 98 JavaScript chunks in total):

      ```plaintext
      vite v8.3.4 building client environment for production...
      ✓ 2380 modules transformed.
      dist/index.html                                           1.26 kB │ gzip:     0.67 kB
      dist/assets/index-BAh0CVWW.css                           24.82 kB │ gzip:     6.17 kB
      dist/assets/pie-XZMESJXO-Ccncp66t.js                      0.10 kB │ gzip:     0.12 kB
      ...
      dist/assets/mermaid.core-CLdIdrYJ.js                     84.90 kB │ gzip:    29.30 kB
      dist/assets/katex-DJhrJSbw.js                           258.59 kB │ gzip:    77.43 kB
      dist/assets/cytoscape.esm-CHBj4VkZ.js                   434.61 kB │ gzip:   137.74 kB
      dist/assets/elk-IJKZMXRS-B5ZKbSvv.js                  1,462.50 kB │ gzip:   455.73 kB
      dist/assets/index-LMGHeB4I.js                         4,426.39 kB │ gzip: 1,432.64 kB

      (!) Some chunks are larger than 1500 kB after minification. Consider:
      - Using dynamic import() to code-split the application
      - Use build.rolldownOptions.output.codeSplitting to improve chunking: https://rolldown.rs/reference/OutputOptions.codeSplitting
      - Adjust chunk size limit for this warning via build.chunkSizeWarningLimit.
      ✓ built in 4.52s
      ```

      And the built `index.html` references only two of those files:

      ```html
      <script type="module" crossorigin src="./assets/index-LMGHeB4I.js"></script>
      <link rel="stylesheet" crossorigin href="./assets/index-BAh0CVWW.css">
      ```

      What it tells you:

      - **The critical path is `index-LMGHeB4I.js` - 1.43 MB gzipped.** The app is static and offline-first, so
        every lesson's text is bundled into the entry chunk (the course content is most of those 4.4 MB). At 1.6
        Mbps, 1.43 MB alone takes about 7 seconds to arrive - the 8.6 s LCP above. That is a design choice
        (offline, no server) with a measurable cost on first visit; splitting lesson content into per-subject
        chunks loaded on demand would shrink it.
      - **Code splitting already works for diagrams.** `src/ui/mermaid.ts` loads Mermaid with
        `import('mermaid')`, a **dynamic import**. Vite turns each dynamic import into a separate chunk - which is
        why `mermaid.core`, `elk`, `cytoscape`, `katex` and dozens of diagram types are separate files that are
        **never downloaded** until a lesson actually shows a diagram. Without that one line, about 1 MB more
        (gzipped) would sit on every first visit.
      - **The warning is configurable, not a law.** Vite's default `build.chunkSizeWarningLimit` is 500 (kB); this
        repository raised it to 1500. A warning limit is a budget - raising it should be a decision, not a way to
        silence the build.
      - **Look at gzip, but remember parse cost.** Transfer is the gzip column; the browser still has to parse and
        compile the full minified size - 4.4 MB of JavaScript - which is why the 4x CPU slowdown hurt so much.

      Vite helps without configuration: it adds `<link rel="modulepreload">` for the entry's direct imports,
      extracts CSS per async chunk ("CSS code splitting"), and when an async chunk A needs a common chunk C it
      fetches both in parallel instead of A then C. Assets under `build.assetsInlineLimit` (4096 bytes) are inlined
      as data URIs.

      **The content hash.** `LMGHeB4I` is a hash of the file's content: building twice without changes produced
      the same names, and any change produces a new name. That is what makes long caching safe - next section.

  - id: freshness
    kind: internals
    concepts: [http-cache-freshness]
    title: Freshness, age and the Cache-Control directives (RFC 9111)
    body: |
      **The one rule:** `response_is_fresh = (freshness_lifetime > current_age)`. A fresh response may be reused
      without contacting the origin; a stale one normally has to be revalidated first.

      **Freshness lifetime** (section 4.2.1) - use the **first** that applies:

      1. a **shared** cache and `s-maxage` is present - its value;
      2. `max-age` is present - its value;
      3. `Expires` is present - `Expires` minus `Date` (or minus the receive time if there is no `Date`);
      4. otherwise none is explicit; a cache MAY use a **heuristic** - the RFC mentions 10% of the time since
         `Last-Modified` as "a typical setting". A heuristic is never used when an explicit time is present.

      Invalid values mean stale: an invalid `Expires` - "especially the value 0" - is "already expired", and caches
      are encouraged to treat a non-integer `max-age` as stale. If a directive appears twice, use the first or
      treat the response as stale; if directives conflict, "the most restrictive directive should be honored".

      **Current age** (section 4.2.3) uses the `Age` header (seconds the response spent in caches upstream - a CDN
      adds it), the `Date` header, and the cache's own clock:

      ```plaintext
      apparent_age          = max(0, response_time - date_value)
      corrected_age_value   = age_value + (response_time - request_time)
      corrected_initial_age = max(apparent_age, corrected_age_value)
      current_age           = corrected_initial_age + (now - response_time)
      ```

      Example: a response requested at 10:00:00, received at 10:00:01 with `Age: 250`, `Cache-Control:
      max-age=600`. Corrected age = 250 + 1 = 251. Ten seconds later its current age is 261 - fresh (600 > 261);
      it goes stale 339 seconds later, even though *your* copy is only a few minutes old. The CDN's time counts.

      **Response directives** (section 5.2.2, plus extensions):

      | Directive | Meaning |
      | --- | --- |
      | `max-age=N` | fresh for N seconds of age |
      | `s-maxage=N` | for **shared** caches, overrides `max-age`/`Expires` - and once stale they must revalidate |
      | `no-cache` | may be **stored**, but "MUST NOT be used to satisfy any other request without forwarding it for validation" |
      | `no-store` | must not be stored at all, by any cache |
      | `private` | a shared cache "MUST NOT store the response"; the browser may |
      | `public` | explicitly cacheable, even where it otherwise wouldn't be (for example with `Authorization`) |
      | `must-revalidate` | once stale, never reuse without successful validation - not even when disconnected (then a 504) |
      | `proxy-revalidate` | the same, for shared caches only |
      | `immutable` (RFC 8246) | the response will not change while fresh - skip conditional requests even on reload |
      | `stale-while-revalidate=N` (RFC 5861) | after going stale, may be served for up to N more seconds while the cache revalidates in the background |
      | `stale-if-error=N` (RFC 5861) | when the origin returns 500, 502, 503 or 504, a stale copy may be served for up to N seconds |

      **`no-cache` is not "don't cache".** MDN: "`no-cache` allows caches to store a response but requires them to
      revalidate it before reuse. If the sense of 'don't cache' that you want is actually 'don't store', then
      `no-store` is the directive to use." With an ETag, `no-cache` is cheap: every use costs a 304 round trip,
      not a download.

      **Serving stale** is forbidden by `no-cache`, `must-revalidate`, and (for shared caches) `s-maxage` and
      `proxy-revalidate`; otherwise a cache may serve stale only when disconnected or explicitly allowed - for
      example by `stale-while-revalidate`. RFC 5861's example: `max-age=600, stale-while-revalidate=30` is "fresh
      for 600 seconds, and it may continue to be served stale for up to an additional 30 seconds while an
      asynchronous validation is attempted".

      Note the scope labels: RFC 9111 and RFC 8246 are standards-track; RFC 5861 is Informational. Browsers and
      CDNs implement `stale-while-revalidate` and `immutable` to different degrees - check your CDN's documentation.

  - id: visual-decision
    kind: visual
    concepts: [http-cache-freshness, conditional-requests-and-validation]
    title: What a cache does with a stored response
    body: |
      ```mermaid
      flowchart TD
        A[Request arrives - a stored response matches the cache key] --> B{no-store, or private in a shared cache?}
        B -- yes --> X[Not stored - forward to the origin]
        B -- no --> C{no-cache?}
        C -- yes --> V[Validate - conditional request to the origin]
        C -- no --> D{freshness_lifetime > current_age?}
        D -- yes --> R[Reuse it - no network]
        D -- no --> E{must-revalidate, or shared with s-maxage or proxy-revalidate?}
        E -- yes --> V
        E -- no --> F{Within stale-while-revalidate?}
        F -- yes --> S[Serve stale now and revalidate in the background]
        F -- no --> V
        V --> G{Origin answers 304?}
        G -- yes --> H[Freshen the stored headers and reuse the body]
        G -- no --> I[Store and use the new 200]
      ```

      Notice that validation is the default for anything not fresh - the cache does not simply throw the copy
      away, because a 304 is much cheaper than a full response. This decision is what the first coding exercise
      implements.

  - id: validation
    kind: internals
    concepts: [conditional-requests-and-validation]
    title: ETags, conditional requests and 304 (RFC 9110)
    body: |
      An **ETag** is an opaque string in quotes that changes when the representation changes. A `W/` prefix makes
      it **weak** - "equivalent", not byte-for-byte identical. RFC 9110 section 8.8.3.2 defines two comparisons:

      | ETag 1 | ETag 2 | Strong comparison | Weak comparison |
      | --- | --- | --- | --- |
      | `W/"1"` | `W/"1"` | no match | match |
      | `W/"1"` | `W/"2"` | no match | no match |
      | `W/"1"` | `"1"` | no match | match |
      | `"1"` | `"1"` | match | match |

      **`If-None-Match` uses the weak comparison** ("A recipient MUST use the weak comparison function when
      comparing entity tags for If-None-Match"). Its value is `*` or a list of tags. The condition is **false**
      when a listed tag matches the current one - and then the server "MUST respond with ... the 304 (Not
      Modified) status code if the request method is GET or HEAD" (412 for other methods).

      **Precedence** (section 13.2.2): `If-Match`, then `If-Unmodified-Since`, then **`If-None-Match`**, then
      `If-Modified-Since` only "when ... If-None-Match is not present". A recipient must ignore
      `If-Modified-Since` when `If-None-Match` is there - tags are more precise than one-second dates.

      **A 304** "cannot contain content", but the server "MUST generate" any of `Content-Location`, `Date`,
      `ETag`, `Vary`, `Cache-Control` and `Expires` that a 200 would have had - the cache uses them to freshen its
      stored copy (RFC 9111 section 4.3.4).

      **How Express does it** (read from Express 5.3's source): `res.send` - which `res.json` calls - builds the
      body, hashes it into a weak ETag (the default `etag` setting is `'weak'`; the tag is the body length in hex
      and a hash), then checks `req.fresh`. `req.fresh` uses the `fresh` package: it returns false for anything
      but GET, HEAD and QUERY, false when the request has `Cache-Control: no-cache` (an end-to-end reload),
      compares `If-None-Match` weakly, and only falls back to `If-Modified-Since` when there is no
      `If-None-Match`. If fresh, Express sets 304 and drops the body.

      The consequence most people miss: **Express's automatic ETag saves bandwidth, not work.** The database
      query and the JSON serialisation have already happened when the comparison runs. To save the work too,
      compute a cheap validator first - a row version, an `updated_at`, a counter - compare it with
      `If-None-Match`, and only build the response when it doesn't match. The second coding exercise does that.

      `express.static` (serve-static) and `res.sendFile` (send) generate their ETags from the file size and
      modification time, and also send `Last-Modified`.

  - id: headers-code
    kind: code
    concepts: [http-cache-freshness, conditional-requests-and-validation, bundle-size-and-code-splitting]
    title: Real headers from Express - assets, HTML and an API
    body: |
      A deliberately small Express 5 server with the three caching policies a single-page app needs:

      ```javascript
      import express from 'express';
      const app = express();
      // Hashed build output: cache for a year, never revalidate.
      app.use('/assets', express.static('public/assets', { maxAge: '1y', immutable: true }));
      // The HTML entry point: store it, but check with the server before every reuse.
      app.get('/', (req, res) => {
        res.set('Cache-Control', 'no-cache');
        res.sendFile('index.html', { root: 'public' });
      });
      // A JSON API response for one merchant: Express adds a weak ETag by default.
      app.get('/api/merchants/m_1001/summary', (req, res) => {
        res.set('Cache-Control', 'private, no-cache');
        res.json({ merchantId: 'm_1001', settledMinor: 1250000, currency: 'EUR' });
      });
      app.listen(3123);
      ```

      ```http
      $ curl -sI http://localhost:3123/
      HTTP/1.1 200 OK
      X-Powered-By: Express
      Cache-Control: no-cache
      Accept-Ranges: bytes
      Last-Modified: Sat, 14 Nov 2026 07:49:33 GMT
      ETag: W/"4ec-1a1d90879c5"
      Content-Type: text/html; charset=utf-8
      Content-Length: 1260
      Date: Sat, 14 Nov 2026 07:49:38 GMT

      $ curl -sI http://localhost:3123/assets/index-LMGHeB4I.js
      HTTP/1.1 200 OK
      X-Powered-By: Express
      Accept-Ranges: bytes
      Cache-Control: public, max-age=31536000, immutable
      Last-Modified: Sat, 14 Nov 2026 07:49:33 GMT
      ETag: W/"13-1a1d90879c6"
      Content-Type: text/javascript; charset=utf-8
      Content-Length: 19
      Date: Sat, 14 Nov 2026 07:49:38 GMT

      $ curl -sI http://localhost:3123/api/merchants/m_1001/summary
      HTTP/1.1 200 OK
      X-Powered-By: Express
      Cache-Control: private, no-cache
      Content-Type: application/json; charset=utf-8
      Content-Length: 63
      ETag: W/"3f-F3zwab0tSfjIjkDYnVAfFhuWa2k"
      Date: Sat, 14 Nov 2026 07:49:38 GMT
      ```

      (`Connection` and `Keep-Alive` lines removed. The asset is a 19-byte stand-in for the real bundle.)

      Revalidating the API response with the tag it gave us:

      ```http
      $ curl -si http://localhost:3123/api/merchants/m_1001/summary -H 'If-None-Match: W/"3f-F3zwab0tSfjIjkDYnVAfFhuWa2k"'
      HTTP/1.1 304 Not Modified
      X-Powered-By: Express
      Cache-Control: private, no-cache
      ETag: W/"3f-F3zwab0tSfjIjkDYnVAfFhuWa2k"
      Date: Sat, 14 Nov 2026 07:49:45 GMT
      ```

      And four more conditional requests, status line only:

      ```plaintext
      If-None-Match: "3f-F3zwab0tSfjIjkDYnVAfFhuWa2k"   (strong form of the weak tag)   -> 304 Not Modified
      If-None-Match: W/"3f-stale"                                                       -> 200 OK
      / with If-Modified-Since: Sat, 14 Nov 2026 07:49:33 GMT                           -> 304 Not Modified
      / with If-None-Match: W/"wrong" AND the same If-Modified-Since                    -> 200 OK
      ```

  - id: line-by-line
    kind: line-by-line
    concepts: [http-cache-freshness, conditional-requests-and-validation, bundle-size-and-code-splitting]
    title: What each header line is doing
    body: |
      - **`maxAge: '1y', immutable: true`** became `public, max-age=31536000, immutable` - 365 days in seconds.
        Safe only because the file name contains a content hash: a new build means a new URL, and the old file is
        never changed. `immutable` tells the browser not to send conditional requests for it even on reload (RFC
        8246's motivation: reloads were sending "hundreds of conditional requests" that all came back 304).
      - **`no-cache` on the HTML.** The HTML is the only file whose URL never changes and the one that names the
        current hashed files. Vite's deployment docs say it directly: "make sure to set `Cache-Control: no-cache` on
        the HTML file, otherwise the old assets will be still referenced." With the ETag, each visit costs one small
        304.
      - **`private, no-cache` on the merchant summary.** `private` keeps it out of every CDN and proxy - it is one
        merchant's data. `no-cache` makes the browser revalidate before each use, so the dashboard is never older
        than the last request, but unchanged data costs a 304.
      - **`ETag: W/"4ec-1a1d90879c5"`** - for files, the size (0x4ec = 1260 bytes) and the modification time in
        hex. **`W/"3f-F3zw..."`** - for `res.json`, the length (0x3f = 63 bytes) and a hash of the body. Both are
        weak by default.
      - **The 304 keeps `ETag` and `Cache-Control`** and drops `Content-Type` and `Content-Length` - exactly what
        RFC 9110 section 15.4.5 asks for.
      - **The strong form `"3f-..."` still got a 304** - If-None-Match uses the weak comparison, which ignores the
        `W/` on either side.
      - **The last request got a 200** even though `If-Modified-Since` alone would have matched: with
        `If-None-Match` present, `If-Modified-Since` is ignored - section 13.2.2 in action.
      - **`X-Powered-By: Express`** has nothing to do with caching; production apps usually turn it off with
        `app.disable('x-powered-by')` so they don't advertise the framework.

  - id: visual-deploy
    kind: visual
    concepts: [bundle-size-and-code-splitting, http-cache-freshness]
    title: A repeat visit after a deploy
    body: |
      ```mermaid
      sequenceDiagram
        participant B as Browser cache
        participant C as CDN
        participant O as Origin
        Note over B: Has index.html (ETag "v41") and assets/index-LMGHeB4I.js
        B->>C: GET / (If-None-Match "v41")
        C->>O: GET / (If-None-Match "v41")
        O-->>C: 200 OK, ETag "v42" - new HTML names index-Q8ZpX2aa.js
        C-->>B: 200 OK, Cache-Control no-cache
        Note over B: index-LMGHeB4I.js is still fresh but no longer referenced
        B->>C: GET /assets/index-Q8ZpX2aa.js
        C->>O: GET /assets/index-Q8ZpX2aa.js (first request for it)
        O-->>C: 200 OK, max-age=31536000, immutable
        C-->>B: 200 OK - stored for a year
        Note over B: The CSS file did not change, so its URL did not change - reused, no request at all
      ```

      Notice what made this safe: the HTML is revalidated, so the browser learns about the new build at once;
      every changed asset has a new URL, so a year-long cache can never serve an old version of it; and unchanged
      assets keep their names, so returning users download only what changed. (The `Q8ZpX2aa` hash and the
      ETags are illustrative.)

  - id: steps
    kind: steps
    concepts: [http-cache-freshness, bundle-size-and-code-splitting]
    title: A caching policy for a single-page app and its API
    body: |
      1. **Hashed build assets** (`/assets/*-<hash>.js|css|woff2|png`): `public, max-age=31536000, immutable`.
         Make sure only content-hashed files live under that path - a fixed name like `logo.png` with a one-year
         cache can never be updated.
      2. **The HTML entry point** (`index.html`, every client route that returns it): `no-cache` with an ETag or
         `Last-Modified`. Never a long `max-age`.
      3. **Files with fixed names that change** (`favicon.ico`, `manifest.webmanifest`, `robots.txt`): a short
         `max-age` (minutes to a day) or `no-cache`.
      4. **Private API responses** (anything about the signed-in user or merchant): `private, no-cache` with an
         ETag - or `no-store` for data that must not sit on disk at all (card details, one-time tokens).
      5. **Public API responses** (exchange-rate lists, product catalogue): `public, max-age=N` sized to how stale
         the data may be, possibly `s-maxage` for the CDN and `stale-while-revalidate` to hide revalidation
         latency. Remember RFC 5861's arithmetic: `max-age=600, stale-while-revalidate=600` means a copy may be up
         to 20 minutes old.
      6. **Responses that vary** (by language or encoding): send `Vary` with the request headers that changed the
         response, so caches key on them.
      7. **Errors**: don't let a 404 or 500 inherit the one-year header; mutation responses (POST, PUT, DELETE)
         are not reused by caches for later GETs anyway, but keep them `no-store` if they contain secrets.
      8. **Verify with evidence**: `curl -sI` every class of URL in the deployed environment - including through
         the CDN, where the `Age` header shows a cached hit - and keep the output with the release.

  - id: example
    kind: example
    concepts: [bundle-size-and-code-splitting, http-cache-freshness]
    title: "SandPay incident - \"the dashboard is blank after every release\""
    body: |
      After each release some merchants report a blank dashboard until they press reload twice. The browser
      console of an affected merchant shows:

      ```plaintext
      Failed to fetch dynamically imported module: https://dashboard.sandpay.example/assets/Reports-Bk3vW7Ty.js
      ```

      and the response headers of their `index.html` (from the CDN) are:

      ```http
      HTTP/2 200
      cache-control: public, max-age=86400
      age: 41210
      ```

      **What happened.** The HTML was cached for a day. After the release, the old HTML - 11 hours old according
      to `Age` - still pointed at the old entry chunk, which lazily imports `Reports-Bk3vW7Ty.js`. The deploy had
      replaced the `assets` folder, so that old chunk was gone: 404, and the dynamic import failed. Vite's docs
      describe exactly this: "When a new deployment occurs, the hosting service may delete the assets from
      previous deployments", and recommend `Cache-Control: no-cache` on the HTML.

      **What a tester checks:**

      - `curl -sI` on `/` through the CDN after a release: `no-cache`, an ETag, and the HTML names the new hashes.
      - An old asset URL from the previous release: is it still served (keep at least the previous release's
        assets for a while), and if not, does the app recover? Vite fires a `vite:preloadError` event when a
        dynamic import fails, so the app can reload once.
      - A session left open across a release, then navigating to a lazily loaded page - the real user journey
        that hit the bug.
      - The CDN purge or invalidation step in the release checklist, and whether the HTML is purged.

  - id: tests
    kind: tests
    concepts: [http-cache-freshness, conditional-requests-and-validation, core-web-vitals]
    title: Test cases for caching and performance
    body: |
      | Test | Steps | Expected | Evidence |
      | --- | --- | --- | --- |
      | Hashed asset policy | `curl -sI` a built `/assets/*.js` file | `public, max-age=31536000, immutable` | header output |
      | Missing asset is not cached long | request `/assets/does-not-exist-123.js` | 404 without the one-year header | header output |
      | HTML is revalidated | `curl -sI /` and a client route such as `/reports` | `no-cache` (or `max-age=0, must-revalidate`) and a validator | header output |
      | Private data stays private | `curl -sI` an authenticated API URL through the CDN | `private` or `no-store`; no `Age` header, no CDN hit | headers from two different users |
      | Conditional GET | request, then repeat with `If-None-Match: <etag>` | 304, no body, same `ETag` and `Cache-Control` | both responses |
      | Change invalidates | change the data, repeat the conditional GET with the old tag | 200 with a new ETag and the new data | both responses |
      | 304 saves work (if designed to) | conditional GET with a matching tag | the expensive query is not run | query log or a test spy |
      | Weak comparison | send `If-None-Match` with the strong form of a weak tag | 304 | response |
      | Precedence | wrong `If-None-Match` plus a matching `If-Modified-Since` | 200 | response |
      | Bundle budget | build in CI | entry chunk under the agreed gzip budget | build report |
      | Lab LCP and CLS | run a lab measurement with throttling | LCP at most 2.5 s, CLS at most 0.1 on the agreed profile | trace or JSON output |
      | Field Core Web Vitals | read CrUX or RUM for the release | 75th percentile within "good" for mobile and desktop | dashboard screenshot with the date range |

      Negative cases worth adding: a `Cache-Control` with a typo (`max-age=1y`) - caches should treat it as stale;
      a response with both `max-age` and `no-cache` - most restrictive wins; an API that sends `public` on a
      per-user response (the most dangerous caching bug).

  - id: mistakes
    kind: mistakes
    concepts: [http-cache-freshness, conditional-requests-and-validation, bundle-size-and-code-splitting, core-web-vitals]
    title: Common mistakes and how to debug them
    body: |
      - **Using `no-cache` to mean "don't store".** It means "store, but revalidate". For secrets use `no-store`.
      - **A long `max-age` on the HTML** - users run old code for hours and lazy chunks 404 after a deploy.
      - **A long `max-age` on files without a hash in the name** - `logo.png` can never be changed for those users.
      - **`public` (or no `private`) on per-user responses behind a CDN** - one merchant's data served to another.
        Shared caches also store responses to requests with `Authorization` only when told to (`public`,
        `s-maxage`, `must-revalidate`), so adding `public` "for speed" is exactly how this leaks.
      - **Setting `Cache-Control` before the static middleware for the whole path** - a 404 for a missing asset
        then carries `immutable` and a year of caching (the coding exercise has a test for this).
      - **Forgetting `Vary`** when the response depends on `Accept-Language` or `Accept-Encoding` - a cache serves
        the German page to an English user. (Compression middleware and CDNs normally add `Vary: Accept-Encoding`.)
      - **Believing a 304 makes the endpoint cheap.** With Express's automatic ETag the query has already run.
      - **Strong comparison for If-None-Match** - a hand-written check that does `header === etag` misses `W/`
        forms and lists, so clients never get a 304.
      - **Optimising the average.** Core Web Vitals are judged at the 75th percentile, mobile and desktop
        separately; a fast median hides a slow quarter.
      - **Measuring on a fast laptop only.** Use CPU and network throttling in the lab, and check field data.
      - **Fixing the wrong thing.** The LCP element in the measurement above is text - image compression would not
        have moved it. Find the LCP element first.

      **Debugging method:** (1) reproduce with the headers in front of you - `curl -sI`, or DevTools' Network panel
      with "Disable cache" off, looking at Size ("memory cache", "disk cache") and Status (200 or 304); (2) through
      the CDN, read `Age` and any cache-status header your CDN documents; (3) compute freshness by hand with the
      RFC 9111 rules; (4) for slowness, start from the metric that fails, its element or interaction, then the
      waterfall and the main-thread trace - and confirm the fix with the same measurement.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [http-cache-freshness, bundle-size-and-code-splitting, core-web-vitals]
    title: Trade-offs and alternatives
    body: |
      - **Freshness versus correctness.** A longer `max-age` or `stale-while-revalidate` means fewer requests and
        more stale data. Size it to the business: exchange rates for display might tolerate a minute; a refund
        status must not.
      - **CDN caching of API responses** takes huge load off the origin but needs purging when data changes and
        careful keys (`Vary`, query strings). Purge APIs and cache-status headers are provider-specific.
      - **Revalidate-always (`no-cache` + ETag)** keeps data current at the cost of one round trip per use - fine
        on a fast network, noticeable at 150 ms RTT.
      - **Splitting the bundle** reduces the first download but adds requests and a loading state when the split
        code is needed. Split by route or by rarely used feature (diagram rendering, reports), not into hundreds of
        tiny files.
      - **Server rendering** (sending HTML with the content already in it) can improve LCP for client-rendered
        apps, at the price of a server and more complexity. Static, offline-first apps like this one trade a
        heavier first visit for no server and instant repeat visits.
      - **A service worker** is a programmable cache in the browser - it can serve the app offline, but it is code
        you must update and test; it does not replace correct HTTP headers.
      - **Lab budgets versus field truth.** A lab LCP budget in CI catches regressions; only field data says
        whether users are fine. Use both.

  - id: summary
    kind: summary
    concepts: [core-web-vitals, bundle-size-and-code-splitting, http-cache-freshness, conditional-requests-and-validation]
    title: Quick reference
    body: |
      - **Core Web Vitals:** LCP at most 2.5 s, INP at most 200 ms, CLS at most 0.1 - at the 75th percentile,
        mobile and desktop separately. Poor: LCP over 4 s, INP over 500 ms, CLS over 0.25.
      - **Field is the verdict, lab is the microscope.** Lab tools can't measure INP; use TBT as the proxy.
      - **Read the build report.** Know your entry chunk's gzip size; move rarely used code behind `import()`.
      - **Fresh** = `freshness_lifetime > current_age`. Lifetime: `s-maxage` (shared) > `max-age` > `Expires -
        Date` > heuristic. Age includes upstream `Age` and the response delay.
      - **`no-cache`** = store, revalidate each use. **`no-store`** = never store. **`private`** = browser only.
      - **Hashed assets:** `public, max-age=31536000, immutable`. **HTML:** `no-cache`. **Per-user API:**
        `private, no-cache` + ETag, or `no-store`.
      - **If-None-Match** uses the weak comparison and beats If-Modified-Since. **304** has no body but keeps
        `ETag`, `Cache-Control`, `Vary`, `Date`, `Expires`.
      - **Express's ETag saves bytes, not work** - check a cheap version before building the response.

exercises:
  - id: pick-cache-control
    type: mcq
    concept: http-cache-freshness
    skill: application
    title: The header for a merchant's balance
    prompt: |
      `GET /api/merchants/m_1001/balance` returns the signed-in merchant's current balance. The dashboard polls it
      every 30 seconds; it changes a few times a day. The app is served through a CDN. Which response header is
      best?
    options:
      - id: private-no-cache
        text: "`Cache-Control: private, no-cache` with an ETag"
        feedback: Correct - private keeps it off the CDN, no-cache makes the browser check before each use, and the ETag turns most polls into a small 304.
      - id: public-max-age
        text: "`Cache-Control: public, max-age=30`"
        feedback: public invites the CDN to store one merchant's balance and serve it to whoever requests the same URL - a data leak. And 30 seconds of staleness is allowed for no reason.
      - id: no-cache-only
        text: "`Cache-Control: no-cache` with an ETag"
        feedback: Close, but without private a shared cache may store it. no-cache only forces revalidation; it does not keep the response out of the CDN.
      - id: no-store-poll
        text: "`Cache-Control: no-store`"
        feedback: Safe, but every poll downloads the full body - no validator can be used because nothing is stored. A balance is not secret enough to need that; private, no-cache gives the same freshness more cheaply.
    correct: [private-no-cache]
    hints:
      - Who may store it - only this merchant's browser, or a CDN too?
      - How stale may the balance be when it is shown?
      - Which header lets an unchanged balance cost almost nothing?
    solution: |
      Per-user data must be `private` so no shared cache stores it. It must be current on each poll, so the browser
      must revalidate - `no-cache`. An ETag (or a version-based tag) makes those revalidations 304s with no body
      most of the time. `no-store` is reserved for data that must not sit on disk at all.

  - id: freshness-arithmetic
    type: mcq
    concept: http-cache-freshness
    skill: analysis
    title: Is the CDN's copy still fresh?
    prompt: |
      The browser requested `/api/rates` at 12:00:00 and received this at 12:00:02 (its clock and the origin's
      agree):

      ```http
      HTTP/1.1 200 OK
      Date: Sat, 14 Nov 2026 11:55:40 GMT
      Age: 230
      Cache-Control: public, max-age=300, stale-while-revalidate=60
      ```

      (12:00 is local time, UTC+0 - so `Date` is 11:55:40 on the same clock.) The page asks for `/api/rates` again
      at 12:01:20. What may the browser's cache do?
    options:
      - id: swr
        text: Serve its stored copy immediately and revalidate in the background.
        feedback: Correct - the current age is 340 s, stale by 40 s, which is inside the 60-second stale-while-revalidate window.
      - id: fresh
        text: Reuse it without any request - it was received only 78 seconds ago.
        feedback: The age is not the time in your cache. RFC 9111 counts from when the origin generated it - Date and Age show it was already almost 4 minutes old on arrival.
      - id: validate
        text: Send a conditional request and wait for the answer before showing anything.
        feedback: That would be right outside the stale-while-revalidate window or with must-revalidate; here the response is only 40 seconds stale and allows 60.
      - id: refetch
        text: Discard it and fetch a new copy unconditionally.
        feedback: A stale response is not discarded - at worst it is revalidated. Here it may even be served while revalidating.
    correct: [swr]
    hints:
      - "apparent_age = response_time - date_value. corrected_age_value = Age + (response_time - request_time)."
      - Take the larger of the two, then add the time it has been in the cache since 12:00:02.
      - "Compare with max-age=300, then with the extra 60 seconds."
    solution: |
      apparent_age = 12:00:02 - 11:55:40 = 262 s. corrected_age_value = 230 + 2 = 232 s. corrected_initial_age =
      max(262, 232) = 262 s. Resident time = 12:01:20 - 12:00:02 = 78 s, so current_age = 340 s. Lifetime is 300 s,
      so it is stale by 40 s - within `stale-while-revalidate=60`: serve it now and revalidate in the background
      (RFC 5861). Note that apparent_age won here: the origin's Date says the response was older than the Age
      header suggested.

  - id: freshness-rule-order
    type: order
    concept: http-cache-freshness
    skill: recall
    title: Where the freshness lifetime comes from
    prompt: |
      A shared cache (a CDN) stores a response. Put the sources of its freshness lifetime in the order RFC 9111
      section 4.2.1 checks them - the first one that is present wins.
    items:
      - id: s-maxage
        text: the s-maxage directive
      - id: max-age
        text: the max-age directive
      - id: expires
        text: Expires minus Date
      - id: heuristic
        text: a heuristic, such as 10% of the time since Last-Modified
    hints:
      - Which directive exists only for shared caches - and overrides the others there?
      - Directives beat the older Expires header.
    solution: |
      `s-maxage` (shared caches only), then `max-age`, then `Expires` minus `Date`, and only when none is present a
      heuristic. A private cache skips the first step. Because `s-maxage` wins in a CDN, you can cache a response
      for an hour at the edge (`s-maxage=3600`) while browsers keep it for a minute (`max-age=60`).

  - id: debug-cache-setup
    type: debug
    concept: bundle-size-and-code-splitting
    skill: analysis
    title: Find the caching bugs in this server
    prompt: |
      This Express server serves a Vite build (`dist/index.html` and hashed files in `dist/assets`) and one API.
      Users report old versions after releases, and once a merchant saw another merchant's numbers. Click
      **every** line that is a bug.
    language: javascript
    code: |
      const app = express();
      app.use('/assets', (req, res, next) => {
        res.set('Cache-Control', 'public, max-age=31536000, immutable');
        next();
      });
      app.use('/assets', express.static('dist/assets'));
      app.get('/logo.png', (req, res) => res.sendFile('logo.png', { root: 'dist', maxAge: '1y', immutable: true }));
      app.get('/api/me/summary', requireLogin, async (req, res) => {
        res.set('Cache-Control', 'public, max-age=60');
        res.json(await summaryFor(req.user.merchantId));
      });
      app.get('*splat', (req, res) => {
        res.set('Cache-Control', 'max-age=86400');
        res.sendFile('index.html', { root: 'dist' });
      });
    correctLines: [3, 7, 9, 13]
    lineNotes:
      - line: 6
        note: Serving the hashed build folder with express.static is right; the problem is the header set before it on line 3, which also applies to 404s.
      - line: 10
        note: res.json is fine - the problem is the Cache-Control set on line 9.
      - line: 12
        note: A catch-all route that returns index.html for client-side routes is normal for a single-page app (Express 5 needs the named wildcard). Its header on line 13 is the bug.
    hints:
      - What happens to a request for an asset file that no longer exists?
      - Which file has no hash in its name?
      - Who may store a public response - and whose data is this?
      - Which single file must every visit check with the server?
    solution: |
      - **Line 3** - the header is set for every `/assets` request before `express.static` runs, so a 404 for a
        deleted chunk is also cached for a year as immutable. Use `express.static(dir, { maxAge: '1y', immutable:
        true })`, which only sets it on files it actually serves.
      - **Line 7** - `logo.png` has a fixed name; a year of `immutable` means it can never be changed for anyone who
        has it. Give it a short max-age or put a hashed copy under `/assets`.
      - **Line 9** - `public` on per-merchant data lets the CDN store one merchant's summary and serve it to the next
        request for `/api/me/summary` - the leak. Use `private, no-cache` (plus an ETag) or `no-store`.
      - **Line 13** - the HTML cached for a day: users keep running the old build, and its lazy chunks 404 after
        the next deploy. Use `no-cache`.

  - id: weak-match
    type: mcq
    concept: conditional-requests-and-validation
    skill: application
    title: 304 or 200?
    prompt: |
      The current representation of `/api/rates` has `ETag: W/"r-77"`. A client sends `GET /api/rates` with
      `If-None-Match: "r-76", "r-77"` and `If-Modified-Since` set to a date long before the last change. What must
      the server answer?
    options:
      - id: "304"
        text: 304 Not Modified - "r-77" matches W/"r-77" under the weak comparison, and If-Modified-Since is ignored.
        feedback: Correct - If-None-Match uses the weak comparison, any listed tag can match, and with If-None-Match present the date header is not evaluated.
      - id: "200-strong"
        text: 200 OK - "r-77" is strong and W/"r-77" is weak, so they don't match.
        feedback: That is the strong comparison. RFC 9110 requires the weak comparison for If-None-Match.
      - id: "200-date"
        text: 200 OK - If-Modified-Since says the client's copy predates the last change.
        feedback: If-Modified-Since must be ignored when If-None-Match is present (RFC 9110 sections 13.1.3 and 13.2.2).
      - id: "412"
        text: 412 Precondition Failed - the list contains a tag that doesn't match.
        feedback: 412 is for failed preconditions on other methods (or If-Match). For GET a false If-None-Match condition means 304, and one matching tag in the list is enough.
    correct: ["304"]
    hints:
      - Which comparison does If-None-Match use?
      - Does every tag in the list need to match, or one?
      - Which wins when both conditional headers are present?
    solution: |
      If-None-Match is evaluated first; under the weak comparison `"r-77"` matches `W/"r-77"`, so the condition is
      false and the answer for GET is **304** with the current ETag. If-Modified-Since is ignored entirely because
      If-None-Match is present.

  - id: cwv-diagnose
    type: mcq
    concept: core-web-vitals
    skill: analysis
    title: What do you fix first?
    prompt: |
      Field data (CrUX) for the SandPay dashboard's reports page:

      | | LCP p75 | INP p75 | CLS p75 |
      | --- | --- | --- | --- |
      | Mobile | 2.1 s | 610 ms | 0.04 |
      | Desktop | 1.2 s | 180 ms | 0.03 |

      A lab trace with 4x CPU slowdown shows a 900 ms task when the "Group by week" button is pressed, running a
      sort over 40 000 rows and re-rendering the whole table. What is the most effective first fix?
    options:
      - id: long-task
        text: Break up or move the work behind the button - sort on the server or in a worker, render only visible rows - to cut mobile INP.
        feedback: Correct - mobile INP is poor (over 500 ms) and the trace shows the long task behind the interaction. LCP and CLS are already good.
      - id: images
        text: Compress the images to improve LCP.
        feedback: LCP is good on both (at most 2.5 s). Nothing in the evidence points at images.
      - id: cdn
        text: Put the API behind a CDN to cut TTFB.
        feedback: TTFB affects loading (LCP), which is already good. The poor metric is INP, caused by work on the main thread after the click.
      - id: average
        text: Nothing - the average INP across mobile and desktop is about 400 ms, under the poor threshold.
        feedback: Core Web Vitals are judged per device type at the 75th percentile, not averaged. Mobile users have a poor experience.
    correct: [long-task]
    hints:
      - Which metric is outside "good", and on which device type?
      - Which part of an interaction does a 900 ms task delay?
    solution: |
      Only mobile INP fails (610 ms > 500 ms, so "poor"). The lab trace explains it: a 900 ms main-thread task runs
      in the click handler - processing duration, and input delay for anything clicked meanwhile. Fix that work
      (move the sort off the main thread or to the server, render fewer rows, yield between chunks), confirm with
      the lab trace (and TBT), then watch field INP over the following weeks.

  - id: bundle-budget
    type: short
    concept: bundle-size-and-code-splitting
    skill: application
    title: Shrink the critical path
    prompt: |
      A pull request adds a "Download PDF statement" button to the SandPay dashboard. After it, the build report
      shows the entry chunk grew from 180 kB to 610 kB gzipped; the new dependency is a PDF library used only when
      the button is clicked. Explain what this does to users, and what you would change - with the code.
    modelAnswer: |
      Every first visit now downloads, parses and runs 430 kB more gzipped JavaScript before the dashboard can
      render - on a slow phone that is seconds of LCP (and longer main-thread tasks during load) for a button most
      sessions never press. Load the library only when it is needed, with a dynamic import that Vite turns into its
      own chunk:

      ```typescript
      async function downloadStatement(month: string) {
        const { renderStatementPdf } = await import('./statement-pdf.js'); // pulls in the PDF library lazily
        const blob = await renderStatementPdf(await fetchStatement(month));
        saveAs(blob, `statement-${month}.pdf`);
      }
      ```

      Show a busy state while it loads, handle a failed chunk load (offline, or an old chunk after a deploy), and
      add a CI check that fails when the entry chunk's gzip size exceeds the agreed budget, so the next regression
      is caught in review.
    rubric:
      - Explains the cost for every visit (download, parse, execute, LCP) rather than only "bigger".
      - Uses a dynamic import() so the library becomes a separate chunk loaded on click.
      - Handles the loading state and a failed chunk load.
      - Proposes a size budget check in CI or a review step using the build report.
    hints:
      - Who pays for code in the entry chunk - and how often?
      - What does Vite do with an import() call?
    solution: |
      The library is on every visit's critical path but used rarely. Move it behind `await import(...)` so Vite
      emits it as a separate chunk loaded on click, handle loading and chunk-load errors, and add a bundle budget
      check in CI.

  - id: cache-freshness-coding
    type: coding
    concept: http-cache-freshness
    skill: application
    title: Implement an RFC 9111 cache decision
    prompt: |
      In `cache-freshness.ts`, implement `parseCacheControl`, `freshnessLifetime`, `currentAge` and `decide` as the
      comments describe - the rules of RFC 9111 sections 4.2.1, 4.2.2, 4.2.3, 4.2.4 and 5.2, plus RFC 5861's
      stale-while-revalidate. The tests check quoted arguments, duplicate directives, invalid values, clock skew,
      the exact freshness boundary, private and s-maxage in shared caches, and the heuristic.
    project: fullstack
    files:
      - exercises/performance/cache-freshness.ts
    test: tests/performance/cache-freshness.test.ts
    command: npx vitest run tests/performance/cache-freshness.test.ts
    hints:
      - "Split on commas that are not inside double quotes; lower-case the name; strip the quotes from the argument."
      - "A delta-seconds value is digits only - `/^\\d+$/`. Anything else present for max-age means 0 (stale)."
      - "Fresh means lifetime > age, strictly - at age == lifetime the response is already stale."
      - "Check the 'never serve stale' directives before the stale-while-revalidate window."
    modelAnswer: |
      ```typescript
      export function freshnessLifetime(response: StoredResponse, shared: boolean): number | undefined {
        const d = parseCacheControl(response.headers['cache-control']);
        if (shared && d.has('s-maxage')) return deltaSeconds(d.get('s-maxage')) ?? 0;
        if (d.has('max-age')) return deltaSeconds(d.get('max-age')) ?? 0;
        if (response.headers.expires !== undefined) {
          const expires = parseHttpDate(response.headers.expires);
          if (expires === undefined) return 0; // "Expires: 0" and other invalid dates are already expired
          const date = parseHttpDate(response.headers.date) ?? response.responseTime;
          return Math.max(0, expires - date);
        }
        return undefined;
      }

      export function currentAge(response: StoredResponse, now: number): number {
        const ageValue = deltaSeconds(response.headers.age?.split(',')[0]?.trim()) ?? 0;
        const dateValue = parseHttpDate(response.headers.date) ?? response.responseTime;
        const apparentAge = Math.max(0, response.responseTime - dateValue);
        const corrected = ageValue + (response.responseTime - response.requestTime);
        return Math.max(apparentAge, corrected) + (now - response.responseTime);
      }
      ```

      `decide` then checks, in order: `no-store` / `private` in a shared cache, `no-cache`, the lifetime (explicit,
      else 10% of Date minus Last-Modified, else 0), `lifetime > age`, the directives that forbid serving stale
      (`must-revalidate`; `proxy-revalidate` and `s-maxage` in a shared cache), and finally the
      `stale-while-revalidate` window. The order matters: a response with `must-revalidate` and
      `stale-while-revalidate` must still be validated. The full solution is in
      `solutions/performance/cache-freshness.ts`.
    rubric:
      - Every test in tests/performance/cache-freshness.test.ts passes.
      - The freshness lifetime follows the first-match order of RFC 9111 section 4.2.1, and s-maxage applies only to shared caches.
      - Age uses both apparent_age and corrected_age_value and never goes negative with clock skew.
      - The decision checks the directives that forbid stale responses before stale-while-revalidate.
    solution: |
      Parse the directives (case-insensitive names, quoted arguments, first occurrence wins), take the lifetime from
      the first of s-maxage (shared only), max-age, Expires minus Date - invalid values meaning 0 - compute the age
      from apparent_age and corrected_age_value plus the resident time, and decide in order: not storable,
      no-cache, fresh, forbidden to serve stale, inside stale-while-revalidate, otherwise validate.

  - id: dashboard-caching-coding
    type: coding
    concept: conditional-requests-and-validation
    skill: application
    title: Cache headers and a 304 that skips the work
    prompt: |
      In `dashboard-caching.ts`, implement `ifNoneMatchMatches` (RFC 9110's weak comparison, lists and `*`) and
      `createDashboardApp`: hashed assets with a one-year immutable policy that 404s never inherit, the HTML with
      `no-cache`, and a merchant summary API whose strong ETag comes from a cheap version number - answering a
      matching `If-None-Match` with 304 **without calling the expensive `store.summary()`**.
    project: fullstack
    files:
      - exercises/performance/dashboard-caching.ts
    test: tests/performance/dashboard-caching.test.ts
    command: npx vitest run tests/performance/dashboard-caching.test.ts
    hints:
      - "`express.static` has `maxAge` and `immutable` options - and only sets headers on files it serves."
      - "Extract the tags with a regular expression such as `/(?:W\\/)?\"[^\"]*\"/g`, then compare them without the `W/`."
      - Set the ETag and Cache-Control before deciding between 304 and 200, so both responses carry them.
      - Ask the store for the version first; call summary() only when you are going to send a 200.
    modelAnswer: |
      ```typescript
      export function ifNoneMatchMatches(fieldValue: string, currentEtag: string): boolean {
        if (fieldValue.trim() === '*') return true;
        const opaque = (tag: string) => tag.replace(/^W\//, '');
        const listed = fieldValue.match(/(?:W\/)?"[^"]*"/g) ?? [];
        return listed.some((tag) => opaque(tag) === opaque(currentEtag));
      }

      // inside createDashboardApp
      app.use('/assets', express.static(`${publicDir}/assets`, { maxAge: '1y', immutable: true }));
      app.get('/', (req, res) => {
        res.set('Cache-Control', 'no-cache');
        res.sendFile('index.html', { root: publicDir });
      });
      app.get('/api/merchants/:id/summary', async (req, res) => {
        const version = await store.version(req.params.id);
        if (version === undefined) {
          res.set('Cache-Control', 'no-store').status(404).json({ error: 'merchant_not_found' });
          return;
        }
        const etag = `"${req.params.id}-v${version}"`;
        res.set({ ETag: etag, 'Cache-Control': 'private, no-cache' });
        const ifNoneMatch = req.get('If-None-Match');
        if (ifNoneMatch !== undefined && ifNoneMatchMatches(ifNoneMatch, etag)) {
          res.status(304).end(); // no summary() call - the point of a version-based ETag
          return;
        }
        res.json(await store.summary(req.params.id));
      });
      ```

      Because the route sets its own ETag, Express does not generate one, and the version check runs before the
      expensive aggregation. HEAD requests reach the same handler in Express, so they are conditional too.
    rubric:
      - Every test in tests/performance/dashboard-caching.test.ts passes.
      - If-None-Match uses the weak comparison, handles lists and `*`, and compares whole quoted tags.
      - The 304 path never calls the expensive summary, and both 200 and 304 carry ETag and Cache-Control.
      - The one-year immutable header is set only on assets that exist; per-merchant data is private.
    solution: |
      Compare If-None-Match weakly (strip `W/`, any listed tag or `*` matches). Serve assets with
      `express.static`'s `maxAge` and `immutable` options so only real files get the header, send the HTML with
      `no-cache`, and in the API read the cheap version first, set the strong ETag and `private, no-cache`, and
      answer 304 before calling `summary()`.

  - id: caching-test-design
    type: testdesign
    concept: conditional-requests-and-validation
    skill: application
    title: Test the caching of a release
    prompt: |
      SandPay's dashboard is a Vite build behind a CDN, with an Express API under `/api`. Design the tests you would
      run on the staging environment before a release to check its caching - assets, HTML, the per-merchant API
      and a public exchange-rate endpoint (`public, max-age=60, stale-while-revalidate=30`). Give preconditions,
      steps, expected results and the evidence you'd keep.
    hints:
      - One test per class of URL, plus the cases where caching goes wrong - a deploy, two users, a changed record.
      - What evidence shows a response came from the CDN cache rather than the origin?
    modelAnswer: |
      **Preconditions:** the release deployed to staging behind the same CDN configuration as production; two
      merchant test accounts (A and B); the previous release's asset list; curl and a browser with DevTools.

      1. **Hashed assets** - `curl -sI` the entry chunk named in the HTML. Expected: 200, `public,
         max-age=31536000, immutable`; a second request through the CDN shows a non-zero `Age`. Evidence: both
         header outputs.
      2. **Missing asset** - request `/assets/index-doesnotexist.js`. Expected: 404 without the one-year header.
      3. **HTML** - `curl -sI /` and `/reports`. Expected: `no-cache` and a validator; the body names this release's
         hashes. Repeat with `If-None-Match`: 304.
      4. **Deploy with an open session** - open the dashboard on the previous release, deploy, navigate to a
         lazily loaded page. Expected: it loads (old assets kept) or the app reloads once; no blank page.
         Evidence: console log and a screen recording.
      5. **Private API** - as A, `GET /api/merchants/A/summary` through the CDN twice; then as B the same path for
         B. Expected: `private, no-cache`, no `Age`, B never sees A's numbers. Evidence: headers and bodies.
      6. **Conditional GET and change** - repeat A's request with its ETag: 304 with the same ETag and no body.
         Make a payment for A; repeat with the old ETag: 200 with a new ETag and the new total.
      7. **Public rates** - two requests 10 s apart through the CDN: the second has `Age` around 10 and the same
         body. Change a rate at the origin; it appears within max-age plus the stale window (at most 90 s).
         Evidence: timestamps with headers.
      8. **Negative** - request the private API with `Authorization` of A through the CDN and then without; the
         second must be 401, not a cached 200.
    rubric:
      - Covers hashed assets, a missing asset, the HTML, the private API and the public API separately.
      - Includes the deploy-with-an-open-session case and the two-user leak case.
      - Checks conditional requests and that a change produces a new ETag.
      - Uses evidence that shows where the response came from (Age header, CDN status, timestamps).
      - States the expected Cache-Control for each class of URL.
    solution: |
      One test per URL class (hashed asset, missing asset, HTML, private API, public API), plus a deploy with an
      open session, a two-merchant leak check, conditional GET before and after a change, and the public endpoint's
      maximum staleness - each with headers, Age values and timestamps as evidence.

  - id: interview-slow-dashboard
    type: interview
    concept: core-web-vitals
    skill: analysis
    title: "\"Our dashboard is slow. What would you do?\""
    prompt: |
      An interviewer says: "Merchants complain that our React dashboard is slow, especially on phones. You have a
      week. Walk me through what you would do."
    modelAnswer: |
      First I'd turn "slow" into numbers. I'd look at field data - CrUX for the origin if it has enough traffic, or
      add the `web-vitals` library to send LCP, INP and CLS to our analytics - split by mobile and desktop at the
      75th percentile, and per page. That tells me *which* metric fails and where: loading (LCP), responsiveness
      (INP) or stability (CLS).

      Then I'd reproduce in the lab with a mid-range phone profile - CPU and network throttling - and record a
      trace. For LCP I'd find the LCP element and break the time down: TTFB (server, redirects), the download of
      what blocks rendering (often the JavaScript bundle for a client-rendered app), and render. For INP I'd find
      the slow interaction and the long task behind it.

      Typical fixes follow from that evidence: read the build report and move rarely used code behind dynamic
      imports; cache properly - hashed assets for a year with immutable, HTML with no-cache, API responses with
      ETags so repeat visits cost 304s; reduce work in event handlers (virtualise big tables, move sorting to the
      server or a worker); reserve space for images and banners to fix CLS. Each change is verified with the same
      lab measurement.

      Finally I'd stop it regressing: a bundle-size budget and a lab performance check in CI, and an alert on the
      field metrics. After a week I'd report the before and after lab numbers, and remind people that field data is
      aggregated over a rolling window, so it reflects a change only gradually.
    rubric:
      - Starts with measurement - field data at p75, by device type - before proposing fixes.
      - Names the three Core Web Vitals with thresholds and what each indicates.
      - Uses lab traces to diagnose the specific element or interaction.
      - Proposes fixes tied to evidence (bundle splitting, caching headers, long tasks, layout space).
      - Adds regression prevention (budgets, CI checks, monitoring).
    followUps:
      - The lab says LCP is 1.5 s but CrUX says 3.8 s. Why might they differ, and which do you trust?
      - Which Cache-Control headers would you put on the HTML, the JS bundle and the API?
      - How would you prove that your change - not seasonality - improved INP?
    hints:
      - Measure first - which metric, which device type, which page?
      - Diagnose with a lab trace, then fix what the evidence shows, then prevent regressions.
    solution: |
      Measure (field CWV at p75 by device and page), reproduce and diagnose in the lab with throttling (LCP element
      and breakdown, long tasks behind slow interactions), fix what the evidence shows (code splitting, caching
      headers, less main-thread work, reserved layout space), verify with the same measurement, and add budgets and
      monitoring.

placement:
  - id: place-thresholds
    type: mcq
    concept: core-web-vitals
    skill: application
    title: Does this page pass?
    prompt: |
      Mobile field data at the 75th percentile: LCP 2.4 s, INP 230 ms, CLS 0.05. Does the page pass the Core Web
      Vitals assessment on mobile?
    options:
      - id: fails-inp
        text: No - INP needs improvement (over 200 ms), and all three must be good.
        feedback: Correct - LCP and CLS are good, but INP is above 200 ms, and passing needs all three at p75.
      - id: passes
        text: Yes - every value is under its "poor" threshold.
        feedback: Under "poor" is not "good". INP between 200 and 500 ms is "needs improvement", and the assessment requires good on all three.
      - id: fails-lcp
        text: No - LCP must be under 2 seconds.
        feedback: The good LCP threshold is 2.5 s; 2.4 s is good.
      - id: passes-average
        text: Yes - two out of three good is a pass.
        feedback: The assessment passes only when all three metrics meet their good threshold at the 75th percentile.
    correct: [fails-inp]
    solution: |
      Good thresholds: LCP at most 2.5 s, INP at most 200 ms, CLS at most 0.1, all at p75. INP 230 ms is "needs
      improvement", so mobile fails even though LCP and CLS are good.

  - id: place-hashed-assets
    type: mcq
    concept: bundle-size-and-code-splitting
    skill: application
    title: Headers for a Vite build
    prompt: |
      A Vite build produces `index.html` and `assets/index-LMGHeB4I.js`. Which pair of Cache-Control headers is
      right?
    options:
      - id: right
        text: "HTML `no-cache`; asset `public, max-age=31536000, immutable`"
        feedback: Correct - the HTML is checked on every visit and points at content-hashed files that never change at the same URL.
      - id: both-long
        text: "Both `public, max-age=31536000, immutable`"
        feedback: The HTML's URL never changes, so users would keep the old HTML - and old code - for a year.
      - id: both-no-store
        text: "Both `no-store`"
        feedback: Always correct but always slow - every visit downloads the whole bundle again, even though hashed files can never be stale.
      - id: asset-no-cache
        text: "HTML `max-age=86400`; asset `no-cache`"
        feedback: Backwards - a day-old HTML points at assets a deploy may have removed, while the hashed asset is revalidated for no reason.
    correct: [right]
    solution: |
      The content hash in the asset's name changes whenever its content changes, so the asset can be cached for a
      year as immutable. The HTML has a fixed URL and names the current hashes, so it must be revalidated:
      `no-cache` with a validator.

  - id: place-age
    type: mcq
    concept: http-cache-freshness
    skill: application
    title: Fresh or stale?
    prompt: |
      A browser received a response 20 seconds ago (request and response took no measurable time, clocks agree, the
      `Date` is the moment it was received) with `Cache-Control: max-age=60` and `Age: 50`. Is it fresh now?
    options:
      - id: stale
        text: No - its current age is 70 seconds, more than 60.
        feedback: Correct - the 50 seconds it spent in an upstream cache count, plus 20 seconds in this one.
      - id: fresh
        text: Yes - it has been in this cache for only 20 seconds.
        feedback: Age counts from generation at the origin. The Age header says 50 seconds had already passed when it arrived.
      - id: never
        text: It was never fresh - Age 50 is close to max-age 60.
        feedback: At arrival its age was 50, under 60 - fresh for 10 more seconds. It is stale now, not from the start.
    correct: [stale]
    solution: |
      corrected_age_value = Age (50) + response delay (0) = 50; current_age = 50 + 20 = 70. Fresh requires 60 > 70,
      which is false - the response is stale and must be revalidated (or served stale only if a directive allows).

  - id: place-304
    type: mcq
    concept: conditional-requests-and-validation
    skill: application
    title: What does the 304 save?
    prompt: |
      An Express route runs a 400 ms database aggregation and then calls `res.json(result)`, relying on Express's
      default ETag. A client revalidates with a matching `If-None-Match`. What happens?
    options:
      - id: bytes-only
        text: Express answers 304 with no body - but only after the 400 ms aggregation has run.
        feedback: Correct - res.send computes the ETag from the finished body, then checks req.fresh. Bandwidth is saved, work is not.
      - id: skips-query
        text: Express answers 304 before the route runs, so the aggregation is skipped.
        feedback: Express can't know the ETag before the body exists - it hashes the body inside res.send.
      - id: full-200
        text: Express sends a full 200 - automatic ETags are only for static files.
        feedback: res.send and res.json generate weak ETags by default (the etag setting is 'weak') and answer 304 when the request is fresh.
    correct: [bytes-only]
    solution: |
      With the automatic ETag, Express builds the body, hashes it, compares with If-None-Match and then sends 304
      without the body. To save the 400 ms too, compute a cheap validator (a version or updated_at) first and answer
      304 before running the aggregation.

recall:
  - id: recall-cwv
    concept: core-web-vitals
    prompt: Name the three Core Web Vitals with their good thresholds and how they are judged.
    answer: LCP (loading) at most 2.5 s, INP (responsiveness) at most 200 ms, CLS (visual stability) at most 0.1 - at the 75th percentile of page loads, for mobile and desktop separately; all three must be good to pass.
  - id: recall-lab-field
    concept: core-web-vitals
    prompt: Why can't Lighthouse measure INP, and what does it use instead?
    answer: INP needs real user interactions and a lab run has no user. Lab tools use Total Blocking Time (TBT) as a proxy; field data (CrUX or your own RUM) gives the real INP.
  - id: recall-code-splitting
    concept: bundle-size-and-code-splitting
    prompt: How do you move a rarely used library out of the entry chunk in a Vite app?
    answer: Import it with a dynamic import() where it is needed. Vite emits it as a separate chunk that is downloaded only when that code runs; the build report shows the entry chunk shrink.
  - id: recall-hashed
    concept: bundle-size-and-code-splitting
    prompt: Why can hashed assets be cached for a year, and what must the HTML do?
    answer: The content hash in the file name changes whenever the content changes, so a URL always means the same bytes - public, max-age=31536000, immutable is safe. The HTML has a fixed URL and names the current hashes, so it gets no-cache and is revalidated every visit.
  - id: recall-fresh
    concept: http-cache-freshness
    prompt: When is a stored response fresh, and where does its lifetime come from?
    answer: When freshness_lifetime > current_age. Lifetime is the first of s-maxage (shared caches), max-age, Expires minus Date, or a heuristic. Age includes the upstream Age header and the response delay.
  - id: recall-no-cache
    concept: http-cache-freshness
    prompt: What is the difference between no-cache, no-store and private?
    answer: no-cache - may be stored, but must be revalidated before every reuse. no-store - must not be stored by any cache. private - shared caches (CDNs, proxies) must not store it; the browser may.
  - id: recall-if-none-match
    concept: conditional-requests-and-validation
    prompt: How does a server evaluate If-None-Match on a GET?
    answer: With the weak comparison (W/ is ignored); if any listed tag - or * - matches the current representation, it answers 304 Not Modified with no body but with ETag, Cache-Control, Vary, Date and Expires. If-Modified-Since is ignored when If-None-Match is present.
  - id: recall-304-work
    concept: conditional-requests-and-validation
    prompt: Does Express's automatic ETag save server work?
    answer: No - res.send builds the body, hashes it and then checks req.fresh, so the query already ran. To save work, compare a cheap version-based ETag with If-None-Match before building the response.

