id: fullstack-system-design-interview
title: Full stack system design and mock interview
subject: fullstack
module: fullstack-capstone-module
level: advanced
status: published
estimatedMinutes: 95
summary: How to design, size and defend a web application in a system design interview - a repeatable method (requirements, estimates, API, data model, deep dives), scaling reads with caches, keyset pagination and read replicas, absorbing load with queues, the outbox and rate limits, and choosing where you need strong consistency. Worked on a fictional SandPay merchant dashboard, with every database and HTTP transcript run for real.
