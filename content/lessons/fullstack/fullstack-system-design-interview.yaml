environment: |
  - **Databases (primary source):** the PostgreSQL 18 manual - [26.1 Comparison of Different
    Solutions](https://www.postgresql.org/docs/18/different-replication-solutions.html), [26.2 Log-Shipping
    Standby Servers](https://www.postgresql.org/docs/18/warm-standby.html) ("Streaming replication is asynchronous
    by default ... typically under one second"; `remote_apply` "allows for load balancing with causal
    consistency"), [26.4 Hot Standby](https://www.postgresql.org/docs/18/hot-standby.html) ("data on the standby
    is eventually consistent with the primary"), [19.5 Write Ahead Log](https://www.postgresql.org/docs/18/runtime-config-wal.html)
    (`synchronous_commit`), [19.6 Replication](https://www.postgresql.org/docs/18/runtime-config-replication.html)
    (`recovery_min_apply_delay`), [19.3 Connections](https://www.postgresql.org/docs/18/runtime-config-connection.html)
    (`max_connections` "typically 100"), [7.6 LIMIT and OFFSET](https://www.postgresql.org/docs/18/queries-limit.html)
    and [SELECT - the locking clause](https://www.postgresql.org/docs/18/sql-select.html) (`SKIP LOCKED` "can be
    used to avoid lock contention with multiple consumers accessing a queue-like table"). Quotes were checked
    against the pages, fetched November 2026.
  - **Every database transcript was run** on PostgreSQL 18.6 (the official server binaries, started with the
    `embedded-postgres` npm package) through `pg` (node-postgres) on Node.js 24.21, `lc_messages = 'C'`,
    `TimeZone = 'UTC'`. The replica was a real hot standby streaming from the primary (a base backup taken with
    `pg_backup_start`/`pg_backup_stop`); in one run `recovery_min_apply_delay = '3s'` was set **on purpose** to
    make lag visible. Both servers ran on one laptop, so real networks will show more lag, not less. Timings
    are from that machine and will differ on yours.
  - **HTTP:** [RFC 6585 section 4](https://www.rfc-editor.org/rfc/rfc6585#section-4) (429 Too Many Requests; "MUST
    NOT be stored by a cache"), [RFC 9110 section 10.2.3](https://www.rfc-editor.org/rfc/rfc9110#section-10.2.3)
    (Retry-After), [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457) (problem details). **Draft, not a
    standard:** [draft-ietf-httpapi-ratelimit-headers-11](https://datatracker.ietf.org/doc/draft-ietf-httpapi-ratelimit-headers/)
    (RateLimit-Policy and RateLimit fields, published 23 May 2026) and
    [draft-ietf-httpapi-idempotency-key-header-08](https://datatracker.ietf.org/doc/draft-ietf-httpapi-idempotency-key-header/)
    (22 October 2026) - field syntax may still change. The **token bucket** as a metering idea is described in
    [RFC 2697](https://www.rfc-editor.org/rfc/rfc2697) (Informational, 1999); the limiter in this lesson applies
    the same idea to HTTP requests.
  - **Operations (practitioner sources):** Google, *Site Reliability Engineering* (O'Reilly, 2016), free at
    [sre.google](https://sre.google/sre-book/table-of-contents/) - chapter 4 [Service Level
    Objectives](https://sre.google/sre-book/service-level-objectives/), chapter 21 [Handling
    Overload](https://sre.google/sre-book/handling-overload/) and chapter 22 [Addressing Cascading
    Failures](https://sre.google/sre-book/addressing-cascading-failures/) ("Always use randomized exponential
    backoff"; a server-wide retry budget). Marc Brooker, [Timeouts, retries, and backoff with
    jitter](https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/) (Amazon Builders'
    Library, 2019).
  - **Vendor guidance (labelled as such - cloud-neutral ideas, described by a vendor):** Azure Architecture
    Center patterns [Cache-Aside](https://learn.microsoft.com/en-us/azure/architecture/patterns/cache-aside),
    [Queue-Based Load Leveling](https://learn.microsoft.com/en-us/azure/architecture/patterns/queue-based-load-leveling),
    [Throttling](https://learn.microsoft.com/en-us/azure/architecture/patterns/throttling) and [Rate
    Limiting](https://learn.microsoft.com/en-us/azure/architecture/patterns/rate-limiting-pattern); AWS
    Prescriptive Guidance [Transactional outbox
    pattern](https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/transactional-outbox.html);
    the [AWS Well-Architected Framework - Reliability
    Pillar](https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/welcome.html) (6 November 2024).
  - **Theory:** S. Gilbert and N. Lynch, "Brewer's conjecture and the feasibility of consistent, available,
    partition-tolerant web services", *ACM SIGACT News* 33(2), 2002 (the CAP theorem); J. D. C. Little, "A
    proof for the queuing formula L = λW", *Operations Research* 9(3), 1961.
  - **The interview method is a convention, not a standard.** No body defines how a system design interview
    runs; the steps here are the common shape of the round, and companies vary it. Practise with your own
    timer and check the format with your recruiter.
  - **Practice:** `practice/fullstack` (Node.js 24, TypeScript 6, Express 5, Vitest 5, supertest 7) - the
    token-bucket rate limiter exercise. The 429 response shown in the lesson is real `curl` output from the
    reference solution.
  - **Fictional:** SandPay, its merchant dashboard, merchants (`mer_1001`), payments, refunds, every traffic
    figure and every estimate. Amounts are integers in minor units (2500 is 25.00).

prerequisites:
  - rest-api-design
  - postgres-indexes-and-query-plans
  - transactions-and-isolation

concepts:
  - id: sd-interview-method
    name: A repeatable method for the system design round
    summary: Clarify functional and non-functional requirements, turn them into numbers (requests per second, storage, an SLO), sketch the API and the data model, draw the simplest design that meets the numbers, then go deep where the risk is and state the trade-offs. Each step produces something the next step uses; interviewers grade the reasoning, not the boxes.
  - id: sd-scaling-reads
    name: Scaling reads - caches, pagination and read replicas
    summary: Most web apps read far more than they write. Make each read cheaper first (an index, keyset pagination instead of a large OFFSET), then avoid reads (HTTP caching, cache-aside with expiry and invalidation), then spread them (read replicas). Every copy - a cache entry or a replica - can be stale, so decide per screen how stale is acceptable.
  - id: sd-async-and-overload
    name: Absorbing load - queues, the outbox and rate limits
    summary: Move slow or bursty work off the request path into a queue the workers drain at their own pace; publish events with a transactional outbox so the database write and the event never disagree; let workers claim jobs with FOR UPDATE SKIP LOCKED; and protect the service with per-client rate limits (token bucket, 429 with Retry-After) and clients that back off with jitter inside a retry budget.
  - id: sd-consistency-tradeoffs
    name: Choosing where you need strong consistency
    summary: Money movements, balances and anything a user just changed need a read-your-writes guarantee - the primary, a synchronous replica with remote_apply, or an LSN check. Dashboards, charts and search can be eventually consistent. Asynchronous replicas, caches and at-least-once queues all trade freshness or duplicates for speed and availability; idempotency and explicit staleness budgets make that trade safe.

objectives:
  - Run a 45-minute system design conversation in a fixed order - requirements, estimates, API, data model, high-level design, deep dives, trade-offs - and say what each step produces.
  - Turn a product description into numbers - average and peak requests per second, read-to-write ratio, storage per year, concurrent database work with Little's law - and state every assumption.
  - Explain with evidence why a large OFFSET is slow and design keyset (cursor) pagination with a matching index.
  - Explain replication lag from PostgreSQL's documentation and a real transcript, and choose a read-your-writes strategy (primary reads, remote_apply, an LSN check) for a given screen.
  - Design asynchronous work with a queue, a transactional outbox and SKIP LOCKED workers, and explain why consumers must be idempotent.
  - Implement and test a per-merchant token-bucket rate limiter that answers 429 with Retry-After, and explain randomized backoff and retry budgets.
  - Defend a design in a mock interview - name the trade-offs, the failure modes and what you would measure.

sections:
  - id: intuition
    kind: intuition
    concepts: [sd-interview-method]
    title: The idea in plain language
    body: |
      Ask an architect to "design a house" and a good one does not start drawing rooms. They ask **who lives
      there**, how many people, the budget, the plot, whether grandparents visit at Christmas. Then they do some
      sums - floor area, number of bathrooms, the load the roof must carry. Only then do they sketch a plan,
      and they spend the rest of the meeting on the parts that could go wrong: the damp basement, the stairs a
      wheelchair can't use, the wall the kitchen extension will need to break through.

      A **system design interview** is the same meeting with software. "Design a merchant dashboard for a
      payment company" is deliberately vague. The interviewer wants to watch you:

      - **ask** what it must do and how well (requirements);
      - **size** it with a few honest sums (estimates);
      - **sketch** the contract and the data (API and data model);
      - **draw** the simplest thing that works, and then
      - **go deep** where it will break first - and say what you are trading for what.

      There is no single right design. There are designs that meet the numbers you agreed and designs that
      don't, and candidates who can say *why*.

  - id: what
    kind: what
    concepts: [sd-interview-method]
    title: The shape of the round
    body: |
      The round is usually 45-60 minutes with one interviewer and a shared whiteboard or drawing tool. No
      standard defines it; this is the common shape, with a time budget for a 45-minute slot:

      | Step | Minutes | You produce | Signals the interviewer looks for |
      | --- | --- | --- | --- |
      | 1. Requirements | 5 | a short list of **functional** requirements (what users do) and **non-functional** ones (scale, latency, availability, consistency, security, cost) - and what is **out of scope** | you narrow the problem before solving it |
      | 2. Estimates | 5 | average and peak requests per second, read/write ratio, data per day and per year, an SLO | numbers drive the design, not fashion |
      | 3. API | 5 | the main endpoints, their inputs and outputs, pagination, idempotency, errors | a usable contract; you think about clients |
      | 4. Data model | 5 | tables, keys, the indexes the main queries need, which data must be transactional | the data and its access paths, not just "a database" |
      | 5. High-level design | 5-10 | a diagram: clients, edge/CDN, API servers, database, cache, queue, workers - and one request traced through it | the simplest design that meets the numbers |
      | 6. Deep dives | 10-15 | two or three areas taken apart: hot reads, a burst of writes, a failure, a consistency question | depth, trade-offs, failure modes |
      | 7. Wrap-up | 2-3 | what you'd measure, what you'd do next, what you deliberately left out | judgement and honesty |

      Some vocabulary you will use, from the Google SRE book (chapter 4):

      - **SLI** (service level indicator) - "a carefully defined quantitative measure of some aspect of the level
        of service", such as request latency or error rate;
      - **SLO** (service level objective) - "a target value or range of values for a service level that is
        measured by an SLI", for example *99% of dashboard API requests complete in under 300 ms over 28 days*;
      - percentiles over averages - the book's advice is that "a high-order percentile, such as the 99th or
        99.9th, shows you a plausible worst-case value", which an average hides.

  - id: why
    kind: why
    concepts: [sd-interview-method]
    title: Why a method beats a memorised diagram
    body: |
      Candidates who fail this round rarely lack knowledge of caches or queues. They fail because they:

      - start drawing boxes in the first minute and design for a problem nobody asked about;
      - add Kafka, Redis, sharding and microservices to an app with 30 writes a second;
      - never write down a number, so nothing they say can be checked;
      - describe components without saying what happens when one of them **fails** or is **stale**.

      A fixed order protects you from all four. Each step hands the next one something concrete: the
      requirements give you the numbers, the numbers tell you whether one PostgreSQL server is enough (it often
      is), the API tells you which queries the data model must serve, and the queries tell you which indexes
      and caches you need. When the interviewer interrupts with "what if traffic grows 10x?", you go back to
      the numbers rather than guessing.

      For a full stack developer the round has a particular flavour: interviewers expect you to connect the
      **browser** (pagination, caching, optimistic UI) with the **API** (contracts, rate limits, idempotency)
      and the **database** (indexes, transactions, replicas) - the whole of this track in 45 minutes.

  - id: requirements
    kind: steps
    concepts: [sd-interview-method]
    title: Step 1 and 2 - requirements and estimates for the SandPay merchant dashboard
    body: |
      **The prompt (fictional):** *"SandPay processes card payments for online shops. Design the merchant
      dashboard: merchants sign in, see their payments, search and filter them, see today's totals, issue
      refunds and download settlement reports."*

      **1. Ask, then write down the answers.** Good questions, with the answers this lesson assumes:

      | Question | Assumed answer |
      | --- | --- |
      | Who uses it, and how many? | 20,000 merchants; up to 5,000 staff signed in at the busiest hour |
      | How many payments? | 3 million a day across SandPay; the payment processing system already exists - we only read its data and create refunds |
      | Which screens matter most? | the payments list (newest first, filters by status and date), today's totals, refund |
      | How fresh must data be? | a new payment visible within 10 s; a refund the merchant just made visible **immediately** to them; totals may lag 1 minute |
      | Latency and availability targets? | p99 under 300 ms for list and detail; 99.9% monthly availability for reads |
      | Reports? | CSV for any date range up to 1 year, can take minutes, e-mailed when ready |
      | Out of scope | payment processing itself, fraud checks, the mobile app, multi-region |

      **2. Turn the answers into numbers.** Round hard and say every assumption out loud:

      ```plaintext
      Writes (new payments arriving from the processor)
        3,000,000 / 86,400 s            ≈ 35 per second on average
        assume the busiest hour carries 10% of the day: 300,000 / 3,600 ≈ 83 per second at peak

      Reads (dashboard API)
        5,000 staff, a page every 10 s, about 4 API calls per page
        5,000 × 4 / 10                   = 2,000 requests per second at peak
        read : write ≈ 2,000 : 83        ≈ 24 : 1   → a read-heavy system

      Storage (payments only)
        assume ~1 KB per payment row including its indexes
        3,000,000 × 1 KB                 ≈ 3 GB per day ≈ 1.1 TB per year

      Concurrent database work (Little's law, L = λW)
        2,000 requests/s × 20 ms average query time = 40 queries in flight
      ```

      What the numbers tell you, before any box is drawn:

      - **83 writes a second is small** for one PostgreSQL primary on ordinary hardware - no sharding needed for
        the write path.
      - **2,000 reads a second** is where the work is: indexes, caching, keyset pagination and perhaps replicas.
      - **40 concurrent queries** fits a connection pool, but remember PostgreSQL's `max_connections` default is
        "typically 100" for the whole server - 20 API instances each opening 20 connections would exhaust it.
      - **1.1 TB a year** means old payments need a plan: an index that serves "newest first per merchant",
        and eventually partitioning by month or archiving - a deep-dive topic, not a day-one feature.
      - **Freshness rules differ by screen** - the refund rule ("immediately, for the merchant who made it")
        is a consistency requirement you must design for, not hope for.

  - id: api
    kind: code
    concepts: [sd-interview-method, sd-scaling-reads]
    title: Step 3 - the API
    body: |
      Sketch the contract the screens need - resource names, the important parameters and the error cases. In
      an interview this is a list on the whiteboard, not a full OpenAPI document (that is the
      [contract-first OpenAPI](#/lesson/openapi-contract-first) lesson):

      ```http
      GET  /v1/payments?status=succeeded&from=2026-11-01&limit=50&cursor=<opaque>
           → 200 { "data": [ ... 50 payments, newest first ... ], "next_cursor": "<opaque>" | null }

      GET  /v1/payments/{payment_id}
           → 200 { payment with its refunds } | 404

      GET  /v1/summaries/today
           → 200 { "currency": "EUR", "count": 1834, "gross_minor": 9127450, "as_of": "2026-11-14T09:00:00Z" }

      POST /v1/payments/{payment_id}/refunds
           Idempotency-Key: 6c1f6c3e-...      (one key per refund attempt)
           { "amount_minor": 2500, "reason": "requested_by_customer" }
           → 201 refund | 409 already refunded | 422 invalid amount | 429 rate limited

      POST /v1/reports        { "type": "settlements", "from": "...", "to": "..." }
           → 202 { "report_id": "rep_...", "status": "queued" }
      GET  /v1/reports/{report_id}
           → 200 { "status": "queued" | "running" | "ready", "download_url": ... }
      ```

      Decisions worth saying out loud:

      - **Cursor pagination**, not page numbers - the list is append-heavy and deep pages must stay fast
        (the deep dive below shows why with a real query plan).
      - **Merchant identity comes from the session**, never from a query parameter - every query is scoped to
        the signed-in merchant.
      - **Refunds take an Idempotency-Key** so a retried POST after a timeout cannot refund twice (the
        [idempotency keys](#/lesson/idempotency-keys) lesson; the header is an IETF draft, widely implemented).
      - **Reports are asynchronous** - `202 Accepted` with a resource to poll, because a year of CSV takes
        minutes.
      - **Totals carry `as_of`** - the client can show "updated 40 seconds ago" honestly when the number comes
        from a cache.

  - id: data-model
    kind: code
    concepts: [sd-interview-method, sd-async-and-overload]
    title: Step 4 - the data model and its indexes
    collapsed: true
    body: |
      Start from the queries the API needs and give each one an index (illustrative DDL, PostgreSQL 18):

      ```sql
      CREATE TABLE payments (
        id            bigint PRIMARY KEY,
        merchant_id   bigint NOT NULL REFERENCES merchants (id),
        status        text   NOT NULL CHECK (status IN ('authorized', 'succeeded', 'failed', 'refunded', 'partially_refunded')),
        amount_minor  bigint NOT NULL CHECK (amount_minor > 0),
        currency      char(3) NOT NULL,
        created_at    timestamptz NOT NULL
      );
      -- "newest payments for one merchant", and the keyset cursor (created_at, id)
      CREATE INDEX payments_merchant_created ON payments (merchant_id, created_at DESC, id DESC);

      CREATE TABLE refunds (
        id               bigint PRIMARY KEY,
        payment_id       bigint NOT NULL REFERENCES payments (id),
        merchant_id      bigint NOT NULL,
        amount_minor     bigint NOT NULL CHECK (amount_minor > 0),
        idempotency_key  text   NOT NULL,
        created_at       timestamptz NOT NULL DEFAULT now(),
        UNIQUE (merchant_id, idempotency_key)        -- a retried POST finds the first refund
      );

      -- Transactional outbox: written in the SAME transaction as the refund
      CREATE TABLE outbox (
        id          bigserial PRIMARY KEY,
        topic       text  NOT NULL,                  -- e.g. 'refund.created'
        payload     jsonb NOT NULL,
        created_at  timestamptz NOT NULL DEFAULT now(),
        published_at timestamptz                     -- NULL until the relay has sent it
      );

      -- Background jobs (report generation) claimed by workers with SKIP LOCKED
      CREATE TABLE jobs (
        id          bigserial PRIMARY KEY,
        kind        text NOT NULL,
        status      text NOT NULL DEFAULT 'queued',
        payload     jsonb NOT NULL,
        attempts    int  NOT NULL DEFAULT 0,
        run_after   timestamptz NOT NULL DEFAULT now()
      );
      CREATE INDEX jobs_ready ON jobs (run_after) WHERE status = 'queued';
      ```

      Say which data **must be transactional**: a refund, the payment's refunded total and the outbox row are
      written in one transaction (see [transactions and isolation](#/lesson/transactions-and-isolation) for the
      lost-update problem a refund invites). Today's totals and reports are **derived** data - they can be
      recomputed, so they may lag and may be cached.

  - id: visual-architecture
    kind: visual
    concepts: [sd-interview-method, sd-scaling-reads, sd-async-and-overload]
    title: Step 5 - the high-level design
    body: |
      ```mermaid
      flowchart LR
        B[Browser - React dashboard] -->|HTTPS| CDN[CDN - static assets only]
        B -->|HTTPS /v1| LB[Load balancer]
        LB --> API1[API server 1 - Express]
        LB --> API2[API server N - Express]
        API1 --> RL[(Rate limit counters)]
        API1 --> C[(Cache - totals, merchant settings)]
        API1 -->|writes, read-your-writes| P[(PostgreSQL primary)]
        API1 -->|list and search reads| R[(Read replica)]
        P -->|streaming replication| R
        P --> OB[Outbox relay] --> Q[[Queue]]
        Q --> W[Workers - reports, e-mails]
        W -->|claim jobs - SKIP LOCKED| P
        PS[Payment processing - existing] -->|new payments| P
      ```

      Trace one request out loud: *the browser asks for page 1 of payments → the load balancer picks an API
      server → the rate limiter takes a token for this merchant → the API reads the replica with the keyset
      query → JSON with `next_cursor`*. Then trace a refund: *POST with an Idempotency-Key → primary, one
      transaction writes the refund, updates the payment and inserts an outbox row → 201 → the relay publishes
      `refund.created` → a worker e-mails the merchant*. Notice that **everything right of the API servers is
      optional at 83 writes a second** - you add the replica, the cache and the queue because the reads, the
      freshness rules and the slow reports ask for them, and you say so.

  - id: pagination
    kind: internals
    concepts: [sd-scaling-reads]
    title: Deep dive - make each read cheaper first (keyset pagination)
    body: |
      Before adding caches or replicas, make the expensive read cheap. The PostgreSQL manual warns that "the
      rows skipped by an OFFSET clause still have to be computed inside the server; therefore a large OFFSET
      might be inefficient." Here is the evidence on a table of 2,000,000 payments (40,000 for merchant 7),
      with the index `(merchant_id, created_at DESC, id DESC)`:

      ```sql
      EXPLAIN (ANALYZE, COSTS OFF, TIMING OFF, SUMMARY ON)
      SELECT id, created_at, amount_minor FROM payments
      WHERE merchant_id = 7 ORDER BY created_at DESC, id DESC LIMIT 50 OFFSET 39000;
      ```

      ```plaintext
      Limit (actual rows=50.00 loops=1)
        Buffers: shared hit=14906
        ->  Sort (actual rows=39050.00 loops=1)
              Sort Key: created_at DESC, id DESC
              Sort Method: quicksort  Memory: 3837kB
              Buffers: shared hit=14906
              ->  Bitmap Heap Scan on payments (actual rows=40000.00 loops=1)
                    Recheck Cond: (merchant_id = 7)
                    Heap Blocks: exact=14706
                    Buffers: shared hit=14906
                    ->  Bitmap Index Scan on payments_merchant_created (actual rows=40000.00 loops=1)
                          Index Cond: (merchant_id = 7)
                          Index Searches: 1
                          Buffers: shared hit=200
      Planning Time: 0.744 ms
      Execution Time: 51.128 ms
      ```

      To return 50 rows the server fetched all 40,000 of the merchant's rows, touched 14,906 buffers and
      sorted 39,050 rows. **Keyset pagination** remembers where the last page ended - the `(created_at, id)` of
      its last row, sent back to the client inside an opaque cursor - and asks for the rows *after* it:

      ```sql
      EXPLAIN (ANALYZE, COSTS OFF, TIMING OFF, SUMMARY ON)
      SELECT id, created_at, amount_minor FROM payments
      WHERE merchant_id = 7 AND (created_at, id) < ('2026-01-01T13:53:26.000Z', 50006)
      ORDER BY created_at DESC, id DESC LIMIT 50;
      ```

      ```plaintext
      Limit (actual rows=50.00 loops=1)
        Buffers: shared hit=21 read=1
        ->  Index Scan using payments_merchant_created on payments (actual rows=50.00 loops=1)
              Index Cond: ((merchant_id = 7) AND (ROW(created_at, id) < ROW('2026-01-01 13:53:26+00'::timestamp with time zone, 50006)))
              Index Searches: 1
              Buffers: shared hit=21 read=1
      Planning Time: 0.189 ms
      Execution Time: 0.112 ms
      ```

      Same page, **22 buffers instead of 14,906** and about 0.1 ms instead of 51 ms on this machine: the row
      comparison `(created_at, id) < (...)` matches the index order, so PostgreSQL starts at the cursor and
      reads exactly 50 entries. The `id` is in the key because `created_at` alone is not unique - two payments
      in the same microsecond would otherwise be skipped or repeated between pages. The trade-off: keyset pages
      can't jump to "page 780", which a payments list doesn't need (filters and date pickers do that job
      better). See [indexes and query plans](#/lesson/postgres-indexes-and-query-plans) for reading plans.

  - id: caching
    kind: internals
    concepts: [sd-scaling-reads, sd-consistency-tradeoffs]
    title: Deep dive - avoid reads (caching) and spread them (replicas)
    body: |
      Once each read is cheap, **avoid** the ones you can, closest to the user first:

      | Layer | Good for | Freshness control |
      | --- | --- | --- |
      | Browser and CDN (HTTP caching) | JavaScript, CSS, fonts with hashed file names; public, non-personal data | `Cache-Control` (RFC 9111) - covered in [web performance and HTTP caching](#/lesson/web-performance-and-caching) |
      | Application cache (cache-aside, e.g. Redis) | today's totals, merchant settings, feature flags - shared by many requests | a TTL plus invalidation on write |
      | Database buffer cache | hot index and table pages | automatic |

      **Cache-aside**, as Microsoft's Azure Architecture Center describes the pattern (vendor guidance; the idea
      is cloud-neutral): read the cache; on a miss, read the database, store the item and return it; "when an
      application updates information, it writes the change to the data store and then invalidates the
      corresponding item in the cache." The same page warns about **staleness after writes** - "between the
      write and the next read, a reader can experience a cache miss or briefly see stale data" - and about
      choosing the expiry: too short and the app "continually retrieve[s] data from the data store".

      For SandPay: cache **today's totals per merchant** for 30-60 s with an `as_of` time (the requirement says
      totals may lag a minute). Do **not** cache the payments list for a merchant who just refunded - that is
      the read-your-writes rule.

      Then **spread** the reads that remain. A PostgreSQL **hot standby** accepts read-only queries while it
      replays the primary's WAL. The manual is precise about the cost: "Streaming replication is asynchronous
      by default ..., in which case there is a small delay between committing a transaction in the primary and
      the changes becoming visible in the standby", "typically under one second"; and "data on the standby is
      eventually consistent with the primary." A standby also refuses writes - this is the real error:

      ```plaintext
      replica> INSERT INTO refunds (id, payment_id, amount_minor) VALUES ('rf_2002', 'pay_1001', 100)
         ERROR: cannot execute INSERT in a read-only transaction (SQLSTATE 25006)
      ```

      Replicas also have operational costs worth naming in an interview: long queries on a standby can be
      cancelled by conflicts with WAL replay (manual section 26.4.2), and every replica is another server to
      monitor, patch and fail over.

  - id: replica-lag
    kind: internals
    concepts: [sd-consistency-tradeoffs, sd-scaling-reads]
    title: Deep dive - replication lag, measured
    body: |
      "Under a second" sounds harmless until a merchant refunds a payment and the list they reload still shows
      it as `succeeded`. Two real runs on one laptop (primary and hot standby on the same machine - real networks
      add lag).

      **Run 1 - make the lag visible.** The standby was started with `recovery_min_apply_delay = '3s'`, a real
      setting for a *delayed* standby ("the standby will replay each transaction commit only when the system
      time on the standby is at least [that long] past the commit time reported by the primary"):

      ```plaintext
      primary> SELECT application_name, state, sync_state FROM pg_stat_replication
         walreceiver | streaming | async
      primary> INSERT INTO refunds (id, payment_id, amount_minor) VALUES ('rf_2001', 'pay_1001', 2500) RETURNING id
         rf_2001
      replica> SELECT id, amount_minor FROM refunds WHERE id = 'rf_2001'
         (0 rows)
      -- 1557 ms after the commit
      replica> SELECT id, amount_minor FROM refunds WHERE id = 'rf_2001'
         (0 rows)
      primary> SELECT pg_current_wal_lsn() AS primary_lsn
         0/30075D8
      replica> SELECT pg_last_wal_receive_lsn() AS received, pg_last_wal_replay_lsn() AS replayed
         0/30075D8 | 0/30075B0
      -- 4064 ms after the commit
      replica> SELECT id, amount_minor FROM refunds WHERE id = 'rf_2001'
         rf_2001 | 2500
      replica> SELECT pg_last_wal_receive_lsn() AS received, pg_last_wal_replay_lsn() AS replayed
         0/30075D8 | 0/30075D8
      ```

      Notice the two LSNs (log sequence numbers - positions in the WAL): the replica had **received** the
      commit at once but had not **replayed** it, and a row becomes visible only when its commit record is
      replayed.

      **Run 2 - no delay at all.** The same standby with `recovery_min_apply_delay = '0'`, 1,000 times: insert
      on the primary, then immediately read the same row from the replica:

      ```plaintext
      async: 947 of 1000 immediate replica reads missed the row; 1.31 s for 1000 insert+read pairs
      primary> SELECT application_name, state, sync_state FROM pg_stat_replication
         walreceiver | streaming | sync
      primary> SET synchronous_commit = remote_apply
      remote_apply: 0 of 1000 immediate replica reads missed the row; 2.31 s for 1000 insert+read pairs
      ```

      (An earlier run of the asynchronous loop missed 919 of 1,000.) Even on one machine, a read that follows a
      write by a millisecond **usually** misses it. After `synchronous_standby_names = '*'` made the standby
      synchronous and the session set `synchronous_commit = remote_apply`, every read found its row - and the
      same 1,000 writes took about 75% longer, because each commit now waited for the standby to replay it. The
      manual: `remote_apply` makes "each commit ... wait until the current synchronous standbys report that they
      have replayed the transaction, making it visible to user queries. In simple cases, this allows for load
      balancing with causal consistency."

  - id: visual-stale-read
    kind: visual
    concepts: [sd-consistency-tradeoffs]
    title: The stale read, and three ways to avoid it
    body: |
      ```mermaid
      sequenceDiagram
        participant M as Merchant browser
        participant A as API server
        participant P as Primary
        participant R as Async replica
        M->>A: POST /payments/pay_1001/refunds
        A->>P: INSERT refund, UPDATE payment (one transaction)
        P-->>A: COMMIT ok
        A-->>M: 201 Created
        M->>A: GET /payments (reload)
        A->>R: SELECT ... (replica has not replayed the commit yet)
        R-->>A: pay_1001 still "succeeded"
        A-->>M: stale list - "my refund disappeared"
      ```

      Three fixes, from cheapest to strongest:

      1. **Read your own writes from the primary** - after a write, mark the session (a short-lived cookie or a
         flag in the server session) and send that merchant's reads to the primary for, say, 5 seconds. Other
         merchants keep using the replica.
      2. **Wait for the replica to catch up** - after the commit, read `pg_current_wal_lsn()` on the primary and
         keep it with the session; before reading from a replica, check `pg_last_wal_replay_lsn()` there is at
         least that value (a `pg_lsn` comparison), or fall back to the primary.
      3. **Make the commit wait** - a synchronous standby with `synchronous_commit = remote_apply` for the
         transactions that need it (it can be set per transaction). Every such commit pays the replica's
         round trip, and if the synchronous standby is down, commits wait - an availability cost you must state.

      For the dashboard, option 1 is usually enough. And keep reads that **decide** something - "how much of this
      payment can still be refunded?" - on the primary inside the refund transaction, never on a replica or a
      cache.

  - id: async-work
    kind: internals
    concepts: [sd-async-and-overload]
    title: Deep dive - queues, the outbox and SKIP LOCKED workers
    body: |
      A settlement report for a year of payments takes minutes. Doing it inside the HTTP request would hold a
      connection, hit load balancer timeouts and let ten merchants clicking at 9 a.m. starve everyone else.
      **Queue-based load leveling** (Azure Architecture Center, vendor guidance) is the fix: "use a queue that
      acts as a buffer between a task and the service that it invokes", so workers drain it at a steady pace. The
      same page says when **not** to: when "the caller requires a low-latency, synchronous response" or "the
      workload volume is predictably low and stable".

      **Do you need a message broker?** At this scale, a PostgreSQL table is a fine queue. The manual says
      `SKIP LOCKED` "can be used to avoid lock contention with multiple consumers accessing a queue-like table".
      Two workers, each in its own transaction, real output:

      ```plaintext
      -- worker 1
      => SELECT id FROM jobs WHERE status = 'queued' ORDER BY id LIMIT 2 FOR UPDATE SKIP LOCKED
      1
      2
      -- worker 2
      => SELECT id FROM jobs WHERE status = 'queued' ORDER BY id LIMIT 2 FOR UPDATE SKIP LOCKED
      3
      4
      -- worker 2 without SKIP LOCKED, timeout 500ms
      => SELECT id FROM jobs WHERE status = 'queued' ORDER BY id LIMIT 2 FOR UPDATE
      ERROR: canceling statement due to lock timeout
      ```

      Each worker gets different jobs without waiting; without `SKIP LOCKED`, worker 2 queues behind worker 1's
      locks. The manual adds the caveat: skipping "provides an inconsistent view of the data, so this is not
      suitable for general purpose work" - it is for queues.

      **The dual-write problem.** After a refund you also want to publish `refund.created` (e-mail, ledger,
      webhooks). Writing to the database and *then* to a broker can fail between the two - a refund with no
      event, or an event for a refund that rolled back. AWS Prescriptive Guidance describes the **transactional
      outbox**: write the event to an `outbox` table **in the same transaction** as the refund; a relay reads
      unpublished rows and sends them. The same page is explicit about the consequence: the relay "might send
      out duplicate messages or events, so we recommend that you make the consuming service idempotent by
      tracking the processed messages." Queues are **at-least-once**; every consumer must tolerate a repeat -
      the same idea as [webhooks and async status](#/lesson/webhooks-and-async-status).

  - id: overload
    kind: internals
    concepts: [sd-async-and-overload]
    title: Deep dive - rate limits, backoff and retry budgets
    body: |
      One merchant's script polling `/v1/payments` 200 times a second should not slow the dashboard for
      everyone else. The SRE book's chapter on overload describes per-customer quotas so that the service
      responds badly only "to misbehaving customers, while other customers remain unaffected".

      **The token bucket.** Each merchant has a bucket holding at most `capacity` tokens (the burst allowed);
      tokens flow in at `refillPerSecond` (the sustained rate); a request takes one token or is refused. RFC 2697
      describes the same metering idea for network traffic: buckets that "are initially (at time 0) full" and
      are refilled at a committed rate up to their maximum size. Nothing needs a timer - the refill is computed
      from the time since the bucket was last used:

      ```typescript
      // the heart of it (illustrative - the exercise asks for the full rules)
      const elapsedMs = Math.max(0, now() - bucket.updatedAt);
      bucket.tokens = Math.min(capacity, bucket.tokens + (elapsedMs / 1000) * refillPerSecond);
      ```

      **What the client sees.** RFC 6585 defines 429 Too Many Requests: "the user has sent too many requests in
      a given amount of time", with an optional `Retry-After`; and "responses with the 429 status code MUST NOT
      be stored by a cache." Real `curl` output from the practice solution (capacity 2, refill 0.2 tokens per
      second - the third request in a burst):

      ```http
      HTTP/1.1 429 Too Many Requests
      X-Powered-By: Express
      Retry-After: 5
      Content-Type: application/problem+json; charset=utf-8
      Content-Length: 97

      {"title":"Too Many Requests","status":429,"detail":"Rate limit exceeded. Retry after 5 seconds."}
      ```

      An IETF **draft** (draft-ietf-httpapi-ratelimit-headers-11, not yet an RFC) proposes fields that advertise
      the quota before clients hit it, for example `RateLimit-Policy: "default";q=100;w=10` and
      `RateLimit: "default";r=50;t=30` - mention it as a draft if you mention it at all.

      **Where the counters live.** One API server can keep buckets in memory. With N servers behind a load
      balancer, each in-memory limiter allows N times the limit - use a shared store (an atomic
      read-modify-write in Redis or the database) or route each merchant to the same server, and say which.

      **Clients must back off.** The SRE book: "Always use randomized exponential backoff when scheduling
      retries", because otherwise "a small perturbation (e.g., a network blip) can cause retry ripples to
      schedule at the same time"; "limit retries per request"; and consider "a server-wide retry budget. For
      example, only allow 60 retries per minute in a process". Retries multiply load exactly when the service
      is weakest; jitter spreads them and the budget caps them.

  - id: consistency
    kind: when
    concepts: [sd-consistency-tradeoffs]
    title: Where you need strong consistency - and where you don't
    body: |
      The CAP theorem (Brewer's conjecture, proved by Gilbert and Lynch in 2002) says a replicated system that
      suffers a network **partition** must give up either **consistency** (every read sees the latest write) or
      **availability** (every request gets a non-error answer) for the duration. It is about partitions, not a
      menu where you "pick two" on a normal day. Day to day, the trade you actually make is **freshness for
      speed**: every replica, cache and queue in your design is a copy that may be behind.

      Decide per piece of data, and write it next to the diagram:

      | Data | Needs | Read from |
      | --- | --- | --- |
      | Refundable amount when creating a refund | strong, inside the transaction | primary, `SELECT ... FOR UPDATE` |
      | The merchant's list right after their own refund | read-your-writes | primary for a few seconds, or an LSN check |
      | Payments list otherwise | fresh within 10 s | replica |
      | Today's totals | fresh within 1 minute, labelled `as_of` | cache, refreshed from a replica |
      | Settlement report | consistent snapshot of a closed day | replica or a nightly copy; the job records the snapshot time |
      | Events to e-mail and webhooks | at-least-once, no loss | outbox → queue, idempotent consumers |

      **Not consistency, but often confused with it:** idempotency. A retried refund POST is a duplicate
      *request*, not a stale read; the unique `(merchant_id, idempotency_key)` constraint handles it whatever
      the replication setup.

  - id: example
    kind: example
    concepts: [sd-interview-method, sd-scaling-reads, sd-async-and-overload, sd-consistency-tradeoffs]
    title: A mock interview, condensed
    collapsed: true
    body: |
      **Interviewer:** Design the SandPay merchant dashboard. *(the prompt above)*

      **Candidate:** Before I design anything - who uses it, how much data, and how fresh must it be? *(asks the
      requirement questions; writes the answers; agrees an out-of-scope list)* Let me size it: 3 million payments
      a day is about 35 writes a second, 83 at a peak hour if 10% of the day lands there. 5,000 staff online,
      a page every 10 seconds with four calls each, is 2,000 reads a second - read-heavy, about 24 to 1. Around
      1 KB a row is 1.1 TB a year. One PostgreSQL primary handles these writes; the work is in reads.

      **Interviewer:** OK. What does the API look like?

      **Candidate:** *(lists the endpoints)* Cursor pagination for the list, merchant scoped from the session,
      an Idempotency-Key on refunds, reports as 202 plus polling.

      **Interviewer:** Draw it.

      **Candidate:** Stateless Express servers behind a load balancer, PostgreSQL primary, static assets on a
      CDN. *(traces a list request and a refund)* I'd start there and add three things because the numbers ask
      for them: a read replica for list and search, a small cache for today's totals, and a job table with
      workers for reports.

      **Interviewer:** The payments list is slow for big merchants.

      **Candidate:** First I'd look at the plan. If it's OFFSET pagination, deep pages read and sort every row
      before the offset - keyset pagination on `(merchant_id, created_at DESC, id DESC)` reads only the page.
      The `id` breaks ties. Then caching won't help much - lists are per merchant and per filter - so the
      replica takes the load.

      **Interviewer:** A merchant refunds, reloads, and the refund isn't there.

      **Candidate:** Replication lag - asynchronous by default, usually under a second, but a reload is faster
      than that. For that merchant I'd send reads to the primary for a few seconds after a write, or track the
      commit LSN and check the replica has replayed it. `remote_apply` on a synchronous standby also works but
      every commit then waits for the standby, and commits block if it is down - too high a price for a
      dashboard. And the refund itself reads the refundable amount on the primary, in the transaction, with a
      row lock.

      **Interviewer:** One merchant's integration hammers the API.

      **Candidate:** A per-merchant token bucket - burst and sustained rate - answering 429 with Retry-After,
      counters in a shared store because we have several API servers. Our own front end retries with randomized
      exponential backoff and a retry budget so we don't amplify an outage.

      **Interviewer:** What would you measure?

      **Candidate:** The SLIs behind the SLOs - p99 latency and error rate per endpoint - plus replica lag in
      bytes and seconds, queue depth and job age, cache hit ratio, 429s per merchant, and connection pool
      saturation. I left out multi-region and partitioning; partitioning by month is my first step when the
      payments table passes a few terabytes.

  - id: tests
    kind: tests
    concepts: [sd-scaling-reads, sd-consistency-tradeoffs, sd-async-and-overload]
    title: How you would prove the design's claims
    body: |
      A design is a set of claims. In the interview, say how you'd check them - this is where a tester's
      instincts score:

      | Claim | Test | Expected result | Evidence |
      | --- | --- | --- | --- |
      | Deep pages are as fast as page 1 | `EXPLAIN (ANALYZE, BUFFERS)` the keyset query at the start, middle and end of a big merchant's history | Index Scan, ~`LIMIT` rows read, buffers flat | the three plans |
      | A merchant sees their own refund on reload | API test: refund, then list immediately, 1,000 times, with replica lag injected (`recovery_min_apply_delay`) | 0 stale reads for the writer; other merchants still served by the replica | counts per run, the routing log |
      | Rate limits isolate merchants | load test: merchant A at 10x its limit, merchant B at normal rate | A gets 429 with Retry-After; B's p99 unchanged | 429 count per merchant, latency histogram |
      | A refund event is never lost | kill the relay between commit and publish, restart it | the event is delivered (perhaps twice); the consumer processes it once | outbox rows, consumer dedupe table |
      | Reports never starve the API | queue 500 report jobs during a load test | API p99 within SLO; job age grows, then drains | queue depth and job age graphs |
      | The service survives the replica failing | stop the replica | reads fall back to the primary within the health-check interval; primary CPU rises | failover time, error rate during it |

      Negative cases matter as much: a cursor from another merchant is rejected (it must not leak data), a
      malformed cursor gives 400 rather than 500, and a 429 is never cached by a proxy.

  - id: mistakes
    kind: mistakes
    concepts: [sd-interview-method, sd-scaling-reads, sd-consistency-tradeoffs]
    title: Common mistakes in the round
    body: |
      - **Designing before asking.** Five minutes of questions save you from designing a global, multi-region
        system for 83 writes a second.
      - **Numbers without assumptions,** or no numbers at all. "Lots of traffic" can't be checked; "2,000 reads a
        second, assuming 5,000 users and a page every 10 s" can be challenged and corrected - which is the point.
      - **Reaching for scale first.** Sharding, Kafka and microservices each bring operational cost; propose
        them when a number demands them, and name the number.
      - **"Add a cache" with no invalidation or staleness rule.** Say what is cached, for how long, how it is
        invalidated and what the user sees when it is stale.
      - **Read replicas without the lag.** Saying "replicas" and never "replication lag" is a red flag; the
        transcript above shows how often an immediate read misses.
      - **Queues without duplicates.** At-least-once delivery means idempotent consumers; say how you dedupe.
      - **Retries without backoff.** Immediate retries turn a blip into an outage; randomized exponential
        backoff plus a retry budget.
      - **Monologue.** It is a conversation: check in ("I'll go deeper on reads unless you'd prefer the refund
        flow?") and let the interviewer steer the deep dives.
      - **Forgetting security.** Every query scoped by the session's merchant, cursors that can't be forged to
        read another merchant's data, rate limits per authenticated identity - see the
        [OWASP Top 10](#/lesson/owasp-top-10-for-developers) lesson.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [sd-scaling-reads, sd-async-and-overload, sd-consistency-tradeoffs]
    title: Trade-offs to state out loud
    body: |
      | Choice | You gain | You pay |
      | --- | --- | --- |
      | Keyset instead of OFFSET pagination | constant-cost deep pages; no skipped or repeated rows when new payments arrive | no "jump to page N"; the cursor must encode the sort key |
      | Application cache (cache-aside) | fewer database reads, lower latency | staleness, invalidation code, a cold cache after restarts |
      | Asynchronous read replica | read capacity, a warm standby | replication lag; read-your-writes logic; another server to run |
      | Synchronous replica with `remote_apply` | replicas consistent with the primary for those commits | slower commits (about 75% slower in the run above); commits wait if the standby is down |
      | PostgreSQL table as a queue (`SKIP LOCKED`) | one system, transactional enqueue | load on the primary; fine for modest volumes, not a firehose |
      | Dedicated broker | throughput, fan-out, retention | another system; the outbox to keep it consistent with the database |
      | In-memory rate limiter | simple, no network hop | per-server limits; lost on restart |
      | Shared-store rate limiter | one limit across servers | a network call per request; the store becomes critical |

  - id: summary
    kind: summary
    concepts: [sd-interview-method, sd-scaling-reads, sd-async-and-overload, sd-consistency-tradeoffs]
    title: Quick reference
    body: |
      - **Order:** requirements → estimates → API → data model → high-level design → deep dives → wrap-up.
      - **Estimates:** per second = per day / 86,400; peak = an assumed share of the day in an hour; storage =
        rows × size; concurrency = rate × time (Little's law). Say every assumption.
      - **SLI/SLO:** measure percentiles (p99), set targets on them.
      - **Reads:** make them cheap (index, keyset pagination), avoid them (HTTP cache, cache-aside with TTL and
        invalidation), spread them (replicas).
      - **Replicas lag:** asynchronous by default; an immediate read usually misses a just-committed row. Fix
        with primary reads after writes, an LSN check, or `remote_apply` (slower commits).
      - **Async work:** queue slow jobs; `FOR UPDATE SKIP LOCKED` workers; transactional outbox; consumers
        idempotent.
      - **Overload:** per-client token bucket; 429 + Retry-After (never cached); clients back off with jitter
        inside a retry budget.
      - **Consistency:** decide per piece of data; money decisions on the primary in a transaction.

exercises:
  - id: interview-order
    type: order
    concept: sd-interview-method
    skill: recall
    title: Put the round in order
    prompt: Put the steps of a 45-minute system design interview in the order that lets each step use the previous one's output.
    items:
      - id: requirements
        text: Clarify functional and non-functional requirements, and what is out of scope
      - id: estimates
        text: Estimate requests per second, read/write ratio, storage and an SLO
      - id: api
        text: Sketch the API the screens need
      - id: data-model
        text: Design the data model and the indexes the main queries need
      - id: high-level
        text: Draw the simplest high-level design and trace a request through it
      - id: deep-dives
        text: Go deep on the riskiest parts - hot reads, bursts, failures, consistency
      - id: wrap-up
        text: Summarise trade-offs, what you would measure and what you left out
    hints:
      - Which step gives you the numbers that decide whether you need a cache at all?
      - The data model serves queries - which step tells you what the queries are?
    solution: |
      Requirements give the numbers; the numbers size the design; the API defines the queries; the data model
      serves those queries; the diagram puts it together; deep dives test it where it is weakest; the wrap-up
      states the trade-offs. Drawing first means designing for a problem you haven't agreed on.

  - id: estimate-writes
    type: mcq
    concept: sd-interview-method
    skill: application
    title: Size the write path
    prompt: |
      A booking site expects 8.64 million new bookings a day, and the busiest hour carries 5% of the day's
      bookings. What are the average and peak write rates, and what do they suggest?
    hints:
      - "How many seconds are in a day?"
      - "The peak hour carries 5% of the day - how many bookings is that, spread over 3,600 seconds?"
    options:
      - id: right
        text: About 100 per second on average and 120 per second at peak - a single well-indexed PostgreSQL primary can take it; the design effort goes elsewhere.
        feedback: Correct - 8,640,000 / 86,400 = 100 per second; 5% of the day is 432,000 in 3,600 s = 120 per second.
      - id: hour-as-day
        text: About 2,400 per second at peak, so the writes must be sharded.
        feedback: That divides 8.64 million by 3,600 - treating the whole day as one hour. Peak is 5% of the day in that hour, 120 per second.
      - id: no-math
        text: Too many to estimate without a load test; start with sharding to be safe.
        feedback: Interviewers want a rough number with stated assumptions - it is what decides whether sharding is needed at all (here it isn't).
      - id: per-minute
        text: About 6,000 per second on average.
        feedback: That is per minute (8,640,000 / 1,440). Per second divides by 86,400.
    correct: [right]
    solution: |
      Per second = per day / 86,400 → 100. Peak hour = 5% × 8,640,000 = 432,000 in 3,600 s → 120 per second.
      That is modest for one primary; state it, and spend the interview on what the numbers say is hard.

  - id: offset-evidence
    type: mcq
    concept: sd-scaling-reads
    skill: analysis
    title: Why is page 800 slow?
    prompt: |
      The payments list uses `ORDER BY created_at DESC, id DESC LIMIT 50 OFFSET $1`. Page 1 takes 2 ms, page
      800 takes 60 ms. Its plan shows `Sort (actual rows=40050.00)` above a Bitmap Heap Scan that returned
      40,000 rows and 14,906 shared buffers. The index `(merchant_id, created_at DESC, id DESC)` exists. What
      is the cause, and what is the fix?
    hints:
      - "The plan already uses the index - so what is the extra work?"
      - "How many rows were produced to return 50?"
    options:
      - id: offset
        text: OFFSET makes the server produce and discard every row before the page; switch to keyset pagination - WHERE (created_at, id) < (last row's values) with LIMIT 50.
        feedback: Correct - the manual says skipped rows "still have to be computed inside the server". The keyset query reads only the page from the index.
      - id: missing-index
        text: The index is missing; add one on created_at.
        feedback: The plan uses the existing index (the Bitmap Index Scan); an index on created_at alone wouldn't filter by merchant or avoid producing the skipped rows.
      - id: cache
        text: Cache every page in Redis.
        feedback: Lists are per merchant, per filter and change with every new payment - the hit rate would be poor and staleness high. Fix the query first.
      - id: replica
        text: Move the query to a read replica.
        feedback: The replica would do the same 40,000-row work. Replicas add capacity; they don't make a wasteful query cheap.
    correct: [offset]
    solution: |
      The plan proves the cost: 40,000 rows fetched and sorted to return 50. Keyset pagination starts at the
      cursor in the index order and reads 50 entries - 22 buffers instead of 14,906 in this lesson's run. Make a
      read cheap before caching or replicating it.

  - id: cache-staleness
    type: mcq
    concept: sd-scaling-reads
    skill: application
    title: What to cache, and how
    prompt: |
      Which caching decision fits the SandPay requirements (totals may lag one minute; a merchant must see their
      own refund immediately)?
    hints:
      - "Which data is shared by many requests and allowed to lag?"
      - "Which data must reflect the merchant's own write at once - and is any of it private?"
    options:
      - id: totals
        text: Cache each merchant's today's totals with a 60-second TTL and an as_of time; don't cache the payments list; delete the totals entry when that merchant refunds.
        feedback: Correct - the totals are shared, expensive and allowed to lag; the list is per filter and must show the merchant's own changes.
      - id: list-long
        text: Cache the payments list for 10 minutes to cut database load.
        feedback: A merchant who refunds would see the old list for up to 10 minutes - it breaks the read-your-writes requirement.
      - id: http-public
        text: Serve the payments list with Cache-Control public, max-age=60 so the CDN caches it.
        feedback: The list is per merchant and private - a shared cache could serve one merchant's payments to another. Personal data is never public in a shared cache.
      - id: no-cache
        text: Cache nothing - caches always cause bugs.
        feedback: Caching the totals is safe because the requirement allows lag and you label it with as_of. Refusing every cache gives up an easy win.
    correct: [totals]
    solution: |
      Cache what is shared, costly and allowed to be stale - with a TTL that matches the requirement and
      invalidation on the merchant's own writes - and show its age. Keep private, per-filter, read-your-writes
      data out of shared caches.

  - id: stale-refund
    type: mcq
    concept: sd-consistency-tradeoffs
    skill: analysis
    title: The refund that disappeared
    prompt: |
      After a release that moved `GET /v1/payments` to a read replica, support reports: "I refunded pay_1001,
      the page reloaded and it still says succeeded; a few seconds later it was fine." The refund row exists on
      the primary with the right `created_at`. `pg_stat_replication` shows the standby `streaming`, `sync_state`
      `async`. What is the most likely cause and the most proportionate fix?
    hints:
      - "What changed in the release, and what does sync_state async imply?"
      - "The page fixed itself a few seconds later - what does that rule out?"
    options:
      - id: lag
        text: Replication lag - the reload read the replica before it replayed the commit. Send a merchant's reads to the primary for a few seconds after they write (or check the replica's replay LSN).
        feedback: Correct - asynchronous replicas are eventually consistent; the writer needs read-your-writes, other merchants don't.
      - id: lost
        text: The refund transaction was lost and retried later.
        feedback: The row exists on the primary with the original time, and the page became correct by itself - that is a delayed copy, not a lost write.
      - id: remote-apply-all
        text: Set synchronous_commit = remote_apply for every transaction in the system.
        feedback: It would fix the symptom, but every commit would wait for the standby (about 75% slower in this lesson's run) and stall if it is down. Use it only for the transactions that need it, if at all.
      - id: cache
        text: The browser cached the old response.
        feedback: Possible in general, but the API moved to a replica in this release and the replica is asynchronous - test that first (check the replica for the row right after a refund).
    correct: [lag]
    solution: |
      Confirm: refund, then immediately query the replica - it misses the row; the replay LSN is behind the
      primary's. Fix it where the requirement is: read-your-writes for the writer (primary for a short window or
      an LSN check), replicas for everyone else.

  - id: retry-storm
    type: mcq
    concept: sd-async-and-overload
    skill: analysis
    title: The outage that got worse
    prompt: |
      The API had a 30-second database hiccup. Graphs afterwards show requests per second tripling exactly at
      1 s, 2 s and 4 s after the hiccup began, across all clients, and the API stayed down for 4 minutes. The
      front end's fetch wrapper retries failed requests after 1 s, 2 s, 4 s, 8 s, ... with no limit. What is the
      best change?
    hints:
      - "Why do the spikes line up at the same instants for every client?"
      - "What spreads retries out, and what caps their total?"
    options:
      - id: jitter-budget
        text: Randomize each delay (jitter), cap the number of retries per request, and add a retry budget so clients stop retrying when many requests fail.
        feedback: Correct - the synchronized spikes are the "retry ripples" the SRE book warns about; jitter spreads them and the budget caps the extra load.
      - id: faster
        text: Retry immediately so users wait less.
        feedback: Immediate retries add load at the moment the service is weakest - the outage would last longer.
      - id: more-servers
        text: Double the API servers.
        feedback: The bottleneck was the database; more API servers send it even more retries.
      - id: no-backoff-fixed
        text: Retry every 500 ms instead.
        feedback: A fixed, shared interval keeps every client synchronized - the spikes come back, just more often.
    correct: [jitter-budget]
    solution: |
      The evidence - spikes at the same instants for every client - shows synchronized retries. "Always use
      randomized exponential backoff", limit retries per request, and use a retry budget so retries can't
      multiply load during an outage. Honour Retry-After when the server sends one.

  - id: debug-worker
    type: debug
    concept: sd-async-and-overload
    skill: analysis
    title: Find the bugs in the report worker
    prompt: |
      Several copies of this worker run at once. Reports are sometimes generated twice, and workers often sit
      idle while jobs are queued. Click **every** line that causes one of these problems. (`pool` is a
      node-postgres Pool; `generateReport` is slow.)
    language: typescript
    code: |
      async function workOnce(): Promise<boolean> {
        const client = await pool.connect();
        try {
          const { rows } = await client.query(
            `SELECT id, payload FROM jobs WHERE status = 'queued' ORDER BY id LIMIT 1`,
          );
          if (rows.length === 0) return false;
          const job = rows[0];
          await client.query(`UPDATE jobs SET status = 'running' WHERE id = $1`, [job.id]);
          await generateReport(job.payload);
          await client.query(`UPDATE jobs SET status = 'done' WHERE id = $1`, [job.id]);
          return true;
        } finally {
          client.release();
        }
      }
    correctLines: [5]
    lineNotes:
      - line: 5
        note: "No transaction and no row lock: two workers can read the same queued job before either marks it running, so both generate it. Claim it atomically - `UPDATE jobs SET status = 'running' WHERE id = (SELECT id FROM jobs WHERE status = 'queued' ORDER BY id LIMIT 1 FOR UPDATE SKIP LOCKED) RETURNING id, payload` - which also stops workers queueing behind each other."
      - line: 9
        note: "Marking the job running is fine - the problem is that it happens after an unlocked read (line 5), so the race is already lost."
      - line: 10
        note: "Slow, but it runs after the claim; holding no lock during the slow work is actually good. Generating twice is caused by the claim, not by this call."
    hints:
      - What stops two workers from reading the same row between the SELECT and the UPDATE?
      - Which clause lets a second worker take the next job instead of the same one, without waiting?
    solution: |
      The SELECT on line 5 neither locks nor claims the row, so concurrent workers pick the same job. Claim and
      mark it in one statement with `FOR UPDATE SKIP LOCKED` inside the UPDATE's subquery (or a transaction
      around SELECT ... FOR UPDATE SKIP LOCKED and the UPDATE). Also make `generateReport` idempotent - a worker
      that crashes after generating but before `done` will be retried.

  - id: rate-limiter
    type: coding
    concept: sd-async-and-overload
    skill: application
    title: A per-merchant token-bucket rate limiter
    prompt: |
      Implement `createRateLimiter` and the Express middleware `rateLimit` in
      `exercises/system-design/rate-limiter.ts`. The comment at the top lists the rules: a full bucket per new
      merchant, continuous refill up to the capacity with no timers, refused requests take nothing,
      `retryAfterSeconds` rounded up and at least 1, a RangeError for a bad cost, a clock that steps backwards
      adds nothing, and a 429 with Retry-After and a problem details body that never reaches the route handler.
      The tests use a fake clock, so nothing waits.
    project: fullstack
    files:
      - exercises/system-design/rate-limiter.ts
    test: tests/system-design/rate-limiter.test.ts
    command: npx vitest run tests/system-design/rate-limiter.test.ts
    hints:
      - "Store two numbers per key: tokens (a fraction is fine) and the time they were last updated."
      - "Refill on every take: tokens = min(capacity, tokens + elapsedSeconds × refillPerSecond)."
      - "When refusing, the wait is (cost - tokens) / refillPerSecond seconds - round it up with Math.ceil and use at least 1."
      - "For a clock that goes backwards, use max(0, elapsed) and never move updatedAt to an earlier time."
    modelAnswer: |
      ```typescript
      export function createRateLimiter({ capacity, refillPerSecond, now }: RateLimiterOptions): RateLimiter {
        const buckets = new Map<string, { tokens: number; updatedAt: number }>();
        return {
          take(key, cost = 1) {
            if (!Number.isSafeInteger(cost) || cost < 1 || cost > capacity) {
              throw new RangeError(`cost must be a whole number from 1 to ${capacity}`);
            }
            const time = now();
            const bucket = buckets.get(key) ?? { tokens: capacity, updatedAt: time };
            const elapsedMs = Math.max(0, time - bucket.updatedAt);
            bucket.tokens = Math.min(capacity, bucket.tokens + (elapsedMs / 1000) * refillPerSecond);
            bucket.updatedAt = Math.max(bucket.updatedAt, time);
            buckets.set(key, bucket);
            if (bucket.tokens >= cost) {
              bucket.tokens -= cost;
              return { allowed: true, remaining: Math.floor(bucket.tokens) };
            }
            return {
              allowed: false,
              remaining: Math.floor(bucket.tokens),
              retryAfterSeconds: Math.max(1, Math.ceil((cost - bucket.tokens) / refillPerSecond)),
            };
          },
        };
      }

      export function rateLimit(limiter: RateLimiter, keyOf: (req: Request) => string): RequestHandler {
        return (req, res, next) => {
          const result = limiter.take(keyOf(req));
          if (result.allowed) return next();
          res.status(429).set('Retry-After', String(result.retryAfterSeconds))
            .type('application/problem+json')
            .json({ title: 'Too Many Requests', status: 429,
                    detail: `Rate limit exceeded. Retry after ${result.retryAfterSeconds} seconds.` });
        };
      }
      ```

      Lazy refill means no timers and exact behaviour under a fake clock. Refused requests leave the bucket
      alone, so a client that keeps retrying still gets in after the stated wait. `Math.max` on both the elapsed
      time and `updatedAt` makes a backwards clock step harmless and stops it counting the same seconds twice.
    solution: |
      Keep `{ tokens, updatedAt }` per key, refill lazily from the elapsed time (never negative, capped at
      capacity), take only when enough tokens are there, compute Retry-After from the missing tokens, and in the
      middleware answer 429 with Retry-After and problem details instead of calling `next()`. The reference
      solution is `solutions/system-design/rate-limiter.ts`.
    rubric:
      - Every test in tests/system-design/rate-limiter.test.ts passes.
      - No timers or intervals - refill is computed from elapsed time.
      - A refused request leaves the bucket unchanged.
      - Retry-After is whole seconds, rounded up, from the missing tokens and the rate.
      - You can explain what changes when the API runs on several servers (a shared store or sticky routing).
    followUp: |
      SandPay runs six API servers. Sketch a shared-store version: what is stored per merchant, which operation
      must be atomic, and what happens to requests if the store is unreachable - fail open or fail closed? Say
      which you'd choose for a dashboard and for a refund endpoint, and why.

  - id: slo-dashboard
    type: short
    concept: sd-interview-method
    skill: application
    title: Write the SLOs
    prompt: |
      Write two SLOs for the SandPay merchant dashboard API (one latency, one availability) in the SLI → target
      form the SRE book uses, and say why you chose percentiles and a time window.
    modelAnswer: |
      - **Latency:** 99% of `GET /v1/payments` and `GET /v1/payments/{id}` requests that return 2xx complete in
        under 300 ms, measured at the load balancer, over a rolling 28 days.
      - **Availability:** 99.9% of dashboard API requests over 28 days return a non-5xx response (429s and other
        4xx are excluded - they are the client's or the rate limiter's answer, not a failure).

      Percentiles because an average hides the slow tail that real merchants feel; the SRE book notes a
      high-order percentile "shows you a plausible worst-case value". A window because an SLO is a budget -
      99.9% over 28 days allows about 40 minutes of failed requests' worth, which tells the team when to stop
      shipping features and fix reliability. Measured at the load balancer so it counts requests the servers
      never answered.
    rubric:
      - Each SLO names the SLI, how and where it is measured, the target and the window.
      - Uses a percentile for latency, not an average.
      - Says which responses count as failures (excluding 4xx such as 429).
      - Explains the window as an error budget.
    hints:
      - "An SLO is SLI ≤ target over a window - which SLI, measured where?"
      - Is a 429 a failure of the service?
    solution: |
      p99 latency under 300 ms for the list and detail endpoints, and 99.9% non-5xx, both over 28 days and
      measured at the load balancer, with 4xx excluded from errors. Percentiles show the tail; the window is the
      error budget.

  - id: test-read-your-writes
    type: testdesign
    concept: sd-consistency-tradeoffs
    skill: application
    title: Test the read-your-writes rule
    prompt: |
      The team implemented "after a merchant writes, send that merchant's reads to the primary for 5 seconds;
      everyone else reads the replica". Design the tests: preconditions, steps, expected results and the
      **evidence** you would keep. You can configure the test replica's `recovery_min_apply_delay`.
    hints:
      - How do you make lag large and deterministic so a stale read can't pass by luck?
      - What must stay on the replica, and how would you prove it did?
      - What happens at exactly 5 seconds, and with two browser tabs?
    modelAnswer: |
      **Preconditions:** a primary and a hot standby with `recovery_min_apply_delay = '3s'` (lag made larger
      than the network so stale reads are certain without the fix); two merchants A and B; each response
      tagged (in a test-only header or log) with the server that served it.

      1. **Writer sees own write:** A refunds pay_1001, then lists payments immediately. Expected: the refund
         shows; served by the primary. Evidence: response body, routing log entry.
      2. **Repeated:** 1,000 refund-then-list pairs. Expected: 0 stale reads. Evidence: the count (the lesson's
         run without the fix missed 947 of 1,000).
      3. **Others stay on the replica:** B lists during A's window. Expected: served by the replica. Evidence:
         routing log - proves the primary isn't taking all reads.
      4. **Window ends:** A lists at 4.9 s and 5.1 s after the write. Expected: primary, then replica (by then
         lag-free in a test with delay < 5 s - or set the delay to 6 s and show the stale read reappears, which
         documents the window's limit). Evidence: routing log with timestamps.
      5. **Second tab / device:** A's other session lists immediately. Expected: decide and document - if the
         flag is per session, the other tab may be stale; the test records which.
      6. **Replica down:** stop the standby. Expected: all reads go to the primary; no errors. Evidence: error
         rate and failover time.
    solution: |
      Make lag deterministic with `recovery_min_apply_delay`, then check the writer reads from the primary
      (single and repeated), other merchants stay on the replica, the window's boundary behaves as designed,
      the multi-session behaviour is documented and replica failure falls back - with routing logs and counts as
      evidence.
    rubric:
      - Makes replica lag deterministic instead of hoping to observe it.
      - Checks both sides - the writer gets fresh data and other users still use the replica.
      - Tests the time window boundary and a second session.
      - Includes a failure case (replica down).
      - Names concrete evidence for each - routing logs, counts, bodies.

  - id: interview-design-dashboard
    type: interview
    concept: sd-interview-method
    skill: analysis
    title: "\"Design a merchant dashboard for a payments company\""
    prompt: |
      The interviewer says: "Design the dashboard merchants use to see their payments, refund them and download
      reports. You have 45 minutes." Talk through your design.
    hints:
      - Spend the first five minutes on questions and the next five on numbers.
      - Tell the interviewer where you will go deep, and check they agree.
    modelAnswer: |
      **Requirements:** who and how many (20,000 merchants, 5,000 staff online at peak), what they do (list,
      filter, detail, today's totals, refund, reports), freshness (new payments within 10 s, own refunds
      immediately, totals within a minute), SLOs (p99 < 300 ms, 99.9%), out of scope (processing, fraud,
      multi-region).

      **Estimates:** 3 M payments a day ≈ 35 writes/s, ~83 at peak; ~2,000 reads/s; ~24:1 read-heavy;
      ~1.1 TB a year; ~40 queries in flight.

      **API:** cursor-paginated list scoped by session merchant; detail; totals with `as_of`; refund POST with
      Idempotency-Key returning 201/409/422/429; reports as 202 + polling.

      **Data model:** payments with an index on (merchant_id, created_at DESC, id DESC); refunds with
      UNIQUE (merchant_id, idempotency_key); outbox; jobs.

      **Design:** CDN for assets; stateless Express behind a load balancer; PostgreSQL primary; a read
      replica for lists; a cache for totals; a job table with SKIP LOCKED workers; an outbox relay to a queue
      for e-mails and webhooks.

      **Deep dives:** keyset pagination (OFFSET reads every skipped row); replication lag and read-your-writes
      for the refunding merchant; the refund transaction (lock the payment, check refundable amount on the
      primary, write refund + outbox together); per-merchant token bucket with 429 + Retry-After in a shared
      store; clients with jittered backoff and a retry budget.

      **Wrap-up:** measure p99 and error rate, replica lag, queue depth and job age, cache hit ratio, pool
      saturation and 429s per merchant; next steps - partition payments by month, consider a broker if event
      volume grows.
    rubric:
      - Asks requirement questions and agrees scope before designing.
      - Gives estimates with stated assumptions and uses them to justify (or avoid) components.
      - Defines an API with pagination, idempotency for refunds and asynchronous reports.
      - Designs indexes from the queries.
      - Addresses replication lag or cache staleness with a concrete read-your-writes strategy.
      - Covers overload (rate limits, backoff) and duplicates (idempotent consumers).
      - States trade-offs and what to measure.
    followUps:
      - Traffic grows 10x next year. What breaks first, and what do you change?
      - The payments table reaches 5 TB. What do you do about it?
      - A merchant asks for real-time updates instead of reloading. How would you push them?
      - How would you test that refunds can never exceed the captured amount under concurrent requests?
    solution: |
      Follow the order - requirements, estimates, API, data model, design, deep dives, wrap-up - and let the
      numbers decide the components. Go deep on pagination, read-your-writes, the refund transaction and rate
      limits, and close with trade-offs and what you'd measure.

  - id: interview-ten-x
    type: interview
    concept: sd-scaling-reads
    skill: analysis
    title: "\"Reads grow 10x - what do you do?\""
    prompt: |
      Follow-up from the interviewer: "Your dashboard handles 2,000 reads a second today. Marketing expects
      20,000 next year. Walk me through what you would do, in order."
    hints:
      - Measure first - which queries dominate, and where is the time going?
      - Cheaper reads, fewer reads, then more places to read from.
    modelAnswer: |
      First, **measure**: top queries by total time (for example `pg_stat_statements`), p99 by endpoint, cache
      hit ratio, connection pool saturation, replica lag. Then in order of cost:

      1. **Make reads cheaper** - check plans; keyset pagination everywhere; covering indexes for the hottest
         list; avoid N+1 queries from the API.
      2. **Avoid reads** - HTTP caching for static and public data; cache-aside for shared aggregates (totals,
         settings) with TTLs from the freshness rules; ETags for detail pages so unchanged data costs a 304.
      3. **Spread reads** - more replicas behind a pool or proxy; read-your-writes routing for writers; watch
         lag as a health signal and take a lagging replica out of rotation.
      4. **Protect the system** - per-merchant rate limits so one integration can't take the 10x for itself;
         connection pooling sized against `max_connections`.
      5. **Only then** consider partitioning or splitting data, if a number says the primary or storage is the
         limit.

      At each step, say what metric would tell you it worked and what it costs (staleness, operations, money).
    rubric:
      - Starts with measurement, naming concrete metrics.
      - Orders the changes cheapest-first - query, cache, replicas.
      - Mentions staleness and read-your-writes when adding caches and replicas.
      - Considers connection limits and rate limits, not only capacity.
      - Saves sharding/partitioning for when a number demands it.
    followUps:
      - Replica lag spikes to 30 seconds every night at 2 a.m. What do you look at?
      - How do you size the connection pool on each API server?
      - Which of these changes would you load-test before release, and how?
    solution: |
      Measure, then cheaper reads (plans, keyset, indexes), fewer reads (HTTP and application caches with
      freshness rules), more read capacity (replicas with read-your-writes and lag checks), protection (rate
      limits, pool sizing) - and partitioning only when the numbers demand it.

placement:
  - id: place-peak
    type: mcq
    concept: sd-interview-method
    skill: application
    title: Size the peak
    prompt: |
      A ticketing site sells 1.8 million tickets a day; 20% of a day's sales happen in the hour tickets go on
      sale. Roughly how many purchases per second must the write path handle at that peak?
    options:
      - id: hundred
        text: About 100 per second
        feedback: Correct - 20% of 1,800,000 is 360,000 in 3,600 seconds.
      - id: twenty-one
        text: About 21 per second
        feedback: That is the daily average (1,800,000 / 86,400). The question asks for the peak hour.
      - id: five-hundred
        text: About 500 per second
        feedback: 1,800,000 / 3,600 treats the whole day's sales as one hour - only 20% of them are.
      - id: six-thousand
        text: About 6,000 per second
        feedback: That would be 360,000 per minute, not per hour. Divide the peak-hour volume by 3,600 seconds.
    correct: [hundred]
    solution: |
      Peak-hour volume = 20% × 1,800,000 = 360,000; per second = 360,000 / 3,600 = 100. Always separate the
      average from the peak, and say the assumption that produced the peak.

  - id: place-keyset
    type: mcq
    concept: sd-scaling-reads
    skill: application
    title: The cursor's key
    prompt: |
      You switch a list ordered by `created_at DESC` to keyset pagination. Which cursor condition and index give
      correct, fast pages?
    options:
      - id: tuple
        text: WHERE (created_at, id) < ($1, $2) ORDER BY created_at DESC, id DESC, with an index on (merchant_id, created_at DESC, id DESC)
        feedback: Correct - the id breaks ties, and the index order matches the sort so the scan starts at the cursor.
      - id: created-only
        text: WHERE created_at < $1 ORDER BY created_at DESC, with an index on created_at
        feedback: Rows sharing the last row's created_at are skipped; and without merchant_id first the index can't serve one merchant's list efficiently.
      - id: offset
        text: Keep OFFSET but add an index on (created_at, id)
        feedback: OFFSET still produces and discards every skipped row - an index doesn't remove that work.
      - id: id-only
        text: WHERE id < $1 ORDER BY created_at DESC
        feedback: The cursor must use the sort key - ids don't have to follow created_at order, so pages could skip or repeat rows.
    correct: [tuple]
    solution: |
      Use the full sort key plus a unique tiebreaker in the cursor, compare it as a row value in the same
      direction as the ORDER BY, and give it an index in that order (after the equality filter column).

  - id: place-outbox
    type: mcq
    concept: sd-async-and-overload
    skill: application
    title: Publishing an event safely
    prompt: |
      After committing a refund, the API publishes `refund.created` to a message broker. Occasionally the API
      process crashes between the commit and the publish, and the merchant never gets the refund e-mail. Which
      design fixes it?
    options:
      - id: outbox
        text: Insert the event into an outbox table in the same transaction as the refund; a relay publishes unpublished rows, and consumers ignore events they have already processed.
        feedback: Correct - the refund and its event commit or roll back together; the relay can repeat, so consumers dedupe.
      - id: publish-first
        text: Publish the event first, then commit the refund.
        feedback: Now a failed commit leaves an event for a refund that doesn't exist - the same dual-write problem in reverse.
      - id: retry
        text: Wrap the publish in three retries.
        feedback: Retries don't help when the process has crashed - nothing is left to retry.
      - id: exactly-once
        text: Configure the broker for exactly-once delivery and skip deduplication.
        feedback: The gap is between the database and the broker, which no broker setting closes; and the outbox relay itself can send twice.
    correct: [outbox]
    solution: |
      The transactional outbox makes the database the single source: the event row commits with the refund, a
      relay publishes it (at least once), and consumers are idempotent.

  - id: place-remote-apply
    type: mcq
    concept: sd-consistency-tradeoffs
    skill: application
    title: The cost of a synchronous replica
    prompt: |
      To stop stale reads on replicas, a colleague proposes `synchronous_commit = remote_apply` for every
      transaction with one synchronous standby. What should you point out?
    options:
      - id: cost
        text: Every commit then waits for the standby to replay it - slower writes, and commits block while the standby is unavailable; use it only where read-your-writes on a replica is really needed, or route writers' reads to the primary instead.
        feedback: Correct - consistency is bought with commit latency and availability; spend it only where needed.
      - id: free
        text: Nothing - it removes stale reads at no cost.
        feedback: In this lesson's run the same 1,000 writes took about 75% longer, and commits wait if the synchronous standby is down.
      - id: no-effect
        text: It has no effect on read visibility; it only affects durability.
        feedback: remote_apply specifically waits until the standby has replayed the commit, "making it visible to user queries" (PostgreSQL manual).
      - id: async-better
        text: It makes the replica asynchronous.
        feedback: The opposite - it only has an effect when the standby is listed in synchronous_standby_names.
    correct: [cost]
    solution: |
      remote_apply gives causal consistency for reads on the synchronous standby, paid for with slower commits
      and blocked commits when the standby is down. Prefer targeted fixes - primary reads for the writer, an LSN
      check - unless the requirement justifies the cost.

recall:
  - id: recall-order
    concept: sd-interview-method
    prompt: What are the steps of a system design interview, in order?
    answer: Requirements (functional, non-functional, out of scope) → estimates (rps, read/write ratio, storage, SLO) → API → data model and indexes → high-level design with a traced request → deep dives on the riskiest parts → wrap-up with trade-offs and what to measure.
  - id: recall-estimates
    concept: sd-interview-method
    prompt: How do you turn daily volume into requests per second, and what is Little's law used for?
    answer: Divide by 86,400 for the average; for the peak, take an assumed share of the day in one hour and divide by 3,600. Little's law (L = λW) gives work in flight - rate × time per request - for sizing connection pools and workers.
  - id: recall-sli-slo
    concept: sd-interview-method
    prompt: What are an SLI and an SLO, and why use percentiles?
    answer: An SLI is a measured indicator of service (latency, error rate); an SLO is a target for it over a window (p99 < 300 ms over 28 days). Percentiles show the tail users feel, which averages hide.
  - id: recall-offset
    concept: sd-scaling-reads
    prompt: Why is a large OFFSET slow, and what replaces it?
    answer: The server still computes every skipped row. Keyset pagination - WHERE (created_at, id) < (cursor) ORDER BY created_at DESC, id DESC LIMIT n, with a matching index - reads only the page.
  - id: recall-cache-aside
    concept: sd-scaling-reads
    prompt: How does cache-aside work, and what is its main risk?
    answer: Read the cache; on a miss load from the database and store it; on a write update the database and invalidate the entry. Between the write and the next read, readers can see stale data - set TTLs from freshness rules and keep read-your-writes data out of it.
  - id: recall-lag
    concept: sd-consistency-tradeoffs
    prompt: What does PostgreSQL's manual say about reads on an asynchronous standby, and how do you give a writer read-your-writes?
    answer: Streaming replication is asynchronous by default with a small delay; data on the standby is eventually consistent. Route the writer's reads to the primary for a short window, check the replica's replay LSN against the commit LSN, or use remote_apply on a synchronous standby (slower commits).
  - id: recall-outbox
    concept: sd-async-and-overload
    prompt: What problem does the transactional outbox solve, and what must consumers do?
    answer: The dual write - a database change and an event that could disagree if one fails. The event is written in the same transaction and a relay publishes it; delivery is at-least-once, so consumers must be idempotent.
  - id: recall-rate-limit
    concept: sd-async-and-overload
    prompt: How does a token bucket limit requests, and what should the response and clients do?
    answer: Each client's bucket holds up to capacity tokens and refills at a fixed rate; a request takes a token or is refused. Answer 429 Too Many Requests with Retry-After (never cached); clients retry with randomized exponential backoff within a retry budget.

