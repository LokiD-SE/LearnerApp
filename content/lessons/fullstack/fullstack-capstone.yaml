id: fullstack-capstone
title: Capstone - ship the SandPay merchant dashboard
subject: fullstack
module: fullstack-capstone-module
level: advanced
status: published
estimatedMinutes: 150
summary: Build one feature of the SandPay merchant dashboard through every layer - a PostgreSQL schema, an Express API and a React page - with a refund that is safe to retry from the button to the database. Start with a walking skeleton, finish against a definition of done, and record the decisions you will defend in a review. Every run and response shown here is real.
tags:
  [
    capstone,
    walking skeleton,
    vertical slice,
    end to end,
    idempotency,
    Idempotency-Key,
    idempotent retry,
    ON CONFLICT,
    transactions,
    Problem Details,
    RFC 9457,
    React,
    Express,
    PostgreSQL,
    PGlite,
    definition of done,
    release readiness,
    health check,
    architecture decision record,
    ADR,
    portfolio project,
  ]

environment: |
  - **Runtime and tools:** **Node.js 24** (v24.21.0, from this repository's `.nvmrc`), **Express 5.3**,
    **React 19.2**, **zod 4.6**, cookie-parser 1.4, **PGlite 0.5.14** (PostgreSQL 18.6 compiled to WebAssembly),
    **Vitest 5.0.3**, React Testing Library 16.3 with user-event 14.6, supertest 7.3 - the versions pinned in
    `practice/fullstack`. The HTTP responses were captured with curl 8.5.0 against the reference solution
    started with `tsx` on Linux in November 2026; the test runs are from the same day. Dates, ETags and
    durations will differ on your machine.
  - **Idempotency key:** [draft-ietf-httpapi-idempotency-key-header-08](https://datatracker.ietf.org/doc/draft-ietf-httpapi-idempotency-key-header/)
    (checked 14 November 2026, -08 is still the latest version and still an Internet-Draft, **not an RFC**):
    a key "MUST NOT be reused with a different request payload" (2.2), a fingerprint is optional (2.4), and
    the resource SHOULD answer 400 for a missing key, 422 for a key reused with a different payload and 409
    while the first request is still being processed (2.6, 2.7). The lesson [Idempotency keys and duplicate
    payment requests](#/lesson/idempotency-keys) covers the contract from the tester's side.
  - **Standards:** [RFC 9457 - Problem Details for HTTP APIs](https://www.rfc-editor.org/rfc/rfc9457.html)
    (the `application/problem+json` media type); [RFC 9110](https://www.rfc-editor.org/rfc/rfc9110.html)
    section 15.5.21 (422 is named "Unprocessable Content").
  - **PostgreSQL 18 manual:** [INSERT](https://www.postgresql.org/docs/18/sql-insert.html) (`ON CONFLICT DO
    NOTHING` "simply avoids inserting a row as its alternative action") and [Transaction
    Isolation](https://www.postgresql.org/docs/18/transaction-iso.html) (in Read Committed, `ON CONFLICT DO
    NOTHING` "may have insertion not proceed for a row due to the outcome of another transaction whose
    effects are not visible to the INSERT snapshot", and each statement sees a fresh snapshot). The
    two-connection behaviour is described from the manual, **not run here** - PGlite has one connection.
  - **Express and React:** Express, [Error handling](https://expressjs.com/en/guide/error-handling.html)
    (async handlers "call next(value) automatically when they reject or throw an error"; error handlers
    have four arguments); react.dev, [Synchronizing with
    Effects](https://react.dev/learn/synchronizing-with-effects) (the `ignore` flag for fetching in an
    Effect); MDN, [Crypto.randomUUID()](https://developer.mozilla.org/en-US/docs/Web/API/Crypto/randomUUID)
    ("a randomly generated, 36 character long v4 UUID").
  - **Practice and process sources:** Alistair Cockburn's definition of a walking skeleton, as quoted on the
    [WikiWikiWeb page WalkingSkeleton](https://wiki.c2.com/?WalkingSkeleton) (Cockburn's own page has
    moved); Steve Freeman and Nat Pryce, *Growing Object-Oriented Software, Guided by Tests* (2009), chapter
    4 "Kick-Starting the Test-Driven Cycle" (read in the [authors' online draft, archived
    2009](https://web.archive.org/web/2009/http://mockobjects.com/book/kickstarting-tdd.html)); Michael Nygard, [Documenting Architecture
    Decisions](https://www.cognitect.com/blog/2011/11/15/documenting-architecture-decisions) (15 November
    2011); [The Scrum Guide](https://scrumguides.org/scrum-guide.html) (November 2020), "Commitment:
    Definition of Done". These are practitioner sources, not standards.
  - **Fictional:** SandPay, its merchant dashboard, merchants (Asha Books, Ravi Electronics), payment ids,
    amounts, the `Idempotent-Replayed` response header and every problem type URI under
    `https://api.sandpay.example/problems/`. Amounts are integer minor units (1250 is 12.50).
  - **Not run here:** containers, pipelines and a real deployment - Docker is not installed on the machine
    these outputs came from. Those steps link to [Containers with Docker and
    Compose](#/lesson/docker-and-compose), [CI/CD for web applications](#/lesson/ci-cd-for-web-apps),
    [Deployment, configuration and environments](#/lesson/deployment-and-configuration) and [Observability
    for web applications](#/lesson/observability-for-web-apps).

prerequisites:
  - transactions-and-isolation
  - input-validation-and-error-handling
  - react-state-and-effects
  - fullstack-testing-strategy
  - idempotency-keys

concepts:
  - id: walking-skeleton-vertical-slice
    name: Walking skeleton and vertical slices
    summary: Build the thinnest path that links every layer first - a React page that shows rows an Express route read from PostgreSQL, tested and runnable from a clean checkout - then grow the product in vertical slices, each one feature through every layer. Integration risk is retired on day one instead of in the last week.
  - id: end-to-end-idempotent-refund
    name: A refund that is safe to retry through every layer
    summary: The browser makes one idempotency key per refund attempt and reuses it on every retry, and disables the button while a request is in flight; the API requires the key and validates the body; the database reserves the key with a primary key and ON CONFLICT DO NOTHING, checks the fingerprint, does the refund and stores the outcome in one transaction - so a lost response, a double click or a crash can never refund twice.
  - id: capstone-definition-of-done
    name: Definition of done and release readiness
    summary: A shared checklist decides when a slice is finished - tests at the right layers, errors as Problem Details, a health check, configuration from the environment, migrations, a container image, a green pipeline and logs you can search. If an item is missing, the slice is not done, however good the demo looks.
  - id: architecture-decision-records
    name: Recording and defending design decisions
    summary: An architecture decision record (Michael Nygard, 2011) is a short file - title, context, decision, status, consequences - written for a future developer. It records why the team chose one option and what it costs, which is exactly what a reviewer or an interviewer asks you to defend.

objectives:
  - Plan a full stack feature as a walking skeleton followed by vertical slices, and explain which risk each step retires.
  - Implement an idempotent refund in one PostgreSQL transaction - key reservation with ON CONFLICT DO NOTHING, fingerprint check, the refund itself and the stored outcome - and explain why each part must be in the same transaction.
  - Build the Express route and the React page around it so that a retry, a double click or a lost response never creates a second refund, and errors reach the user as clear messages.
  - Trace a reported duplicate refund through the layers using keys, logs and database rows to find which layer broke the contract.
  - Write a definition of done for a slice and check a feature against it, including health checks, configuration, containers and the pipeline.
  - Write an architecture decision record and defend its consequences in a design review or interview.

sections:
  - id: intuition
    kind: intuition
    concepts: [walking-skeleton-vertical-slice]
    title: The idea in plain language
    body: |
      Imagine building a **bridge** across a river. One team could spend months building perfect pillars, a
      second team the perfect road surface, a third the perfect railings - and find out on opening day that
      the road doesn't fit on the pillars. A better team first strings a **rope bridge** all the way across:
      flimsy, ugly, but someone can walk from one bank to the other on day three. Then they replace it,
      plank by plank, with the real thing - and every evening, people can still cross.

      That rope bridge is a **walking skeleton**: the smallest version of the system that goes through every
      layer. Every plank after it is a **vertical slice**: one feature, all the way from the screen to the
      database.

      This capstone builds the SandPay merchant dashboard that way. The rope bridge is "the merchant sees a
      list of payments". The first plank is the riskiest feature in any payments product: **refunding** - and
      refunding exactly **once**, even when the network drops the answer, the merchant double-clicks, or the
      server crashes halfway.

  - id: what
    kind: what
    concepts: [walking-skeleton-vertical-slice, end-to-end-idempotent-refund]
    title: The capstone brief
    body: |
      **The product.** Merchants sign in to the SandPay dashboard, see their payments and refund them.

      **In scope for this capstone:**

      | Layer | What you build | Practice file | Earlier lesson it builds on |
      | --- | --- | --- | --- |
      | Database | `payments`, `refunds`, `idempotency_keys` with constraints | `capstone/dashboard-db.ts` (given) | [Relational modelling and SQL](#/lesson/relational-modelling-and-sql) |
      | Domain | `createRefund` - idempotent, in one transaction | `capstone/refund-service.ts` | [Transactions and isolation](#/lesson/transactions-and-isolation) |
      | API | `GET /api/payments`, `POST /api/payments/:id/refunds`, `GET /healthz` | `capstone/dashboard-api.ts` | [REST API design](#/lesson/rest-api-design), [Input validation and error handling](#/lesson/input-validation-and-error-handling) |
      | UI | the payments page with loading, error, refund and retry states | `capstone/PaymentsPage.tsx` | [React state and effects](#/lesson/react-state-and-effects) |
      | Delivery | container, pipeline, configuration, logs | (lessons, not files) | the five lessons of the *Testing, delivery and operations* module |

      **Out of scope:** signing in (a session map stands in for [Sessions, cookies and
      tokens](#/lesson/sessions-cookies-and-tokens)), pagination, and talking to a card processor.

      **Terms:**

      - **Walking skeleton** - in Alistair Cockburn's words, "a tiny implementation of the system that
        performs a small end-to-end function. It need not use the final architecture, but it should link
        together the main architectural components."
      - **Vertical slice** - one user-visible feature implemented through every layer it needs, so it can be
        tested, demonstrated and released on its own. The opposite is a *horizontal* layer: "all the tables",
        "all the endpoints".
      - **Idempotency key** - a client-chosen unique value sent with a non-idempotent request (here
        `POST .../refunds`) so the server can recognise a retry and answer it with the first result.
      - **Fingerprint** - a hash of the parts of the request that matter (payment and amount), stored with the
        key so a key reused for a *different* request can be refused.
      - **Definition of done** - "a formal description of the state of the Increment when it meets the
        quality measures required for the product" (The Scrum Guide 2020).
      - **Architecture decision record (ADR)** - a short document for one "architecturally significant"
        decision: its context, the decision, its status and its consequences (Nygard).

  - id: why
    kind: why
    concepts: [walking-skeleton-vertical-slice, end-to-end-idempotent-refund]
    title: Why build it this way
    body: |
      - **Integration is where projects slip.** Each layer can be "done" and the whole still not work: the
        API returns `amount`, the page reads `amountMinor`; the container can't reach the database; CI has no
        browser. A walking skeleton finds those on day one, while they are cheap.
      - **Every slice is releasable.** After the skeleton and the refund slice you could ship. A project
        built in horizontal layers has nothing to show until the last layer lands.
      - **Duplicate refunds are a real-money bug.** A refund that goes out twice is money the merchant has to
        chase back from a customer. The causes are ordinary - a mobile network that drops the response, a
        double click, a load balancer that retries, a process killed mid-request - so the protection must be
        designed into **every** layer, not added to one.
      - **Interviews ask for exactly this.** "Walk me through a project you built end to end" and "how do you
        stop a payment being made twice?" are standard full stack questions. A capstone you can run, test and
        defend with written decisions answers both with evidence.

  - id: visual-architecture
    kind: visual
    concepts: [walking-skeleton-vertical-slice]
    title: The skeleton, then the refund slice
    body: |
      ```mermaid
      flowchart LR
        subgraph Browser
          P[PaymentsPage - React]
        end
        subgraph Server[Node.js process]
          A[Express - /api/payments, /healthz]
          S[createRefund - domain]
        end
        D[(PostgreSQL - payments, refunds, idempotency_keys)]
        P -- "GET /api/payments (skeleton)" --> A
        P -- "POST /api/payments/:id/refunds + Idempotency-Key (slice 1)" --> A
        A --> S
        A -- SELECT --> D
        S -- "one transaction" --> D
      ```

      Notice that the skeleton already touches **every box** - only with a `GET`. The refund slice adds one
      arrow per layer and nothing else. Containers and the pipeline wrap the whole picture and are added to
      the skeleton too, not at the end.

  - id: skeleton-steps
    kind: steps
    concepts: [walking-skeleton-vertical-slice]
    title: Building the walking skeleton, then the slices
    body: |
      Freeman and Pryce (*Growing Object-Oriented Software, Guided by Tests*, chapter 4) define it as "an
      implementation of the thinnest possible slice of real functionality that we can automatically build,
      deploy, and test end-to-end", and build that **before** the first real feature: "Deploying and testing
      right from the start of a project forces the team to understand how their system fits into the world."
      For this dashboard:

      1. **One table, one row.** `payments` with a seed row, created by a migration (see [Migrations and data
         access](#/lesson/migrations-and-data-access)).
      2. **One route.** `GET /api/payments` returns the seeded row as JSON. One supertest test.
      3. **One page.** `PaymentsPage` renders the row in a table. One Testing Library test with the client
         stubbed.
      4. **One end-to-end test.** A browser opens the page against the real API and database and sees the row.
      5. **Ship the skeleton.** A container image, a pipeline that runs all four tests on every push, a
         health check and configuration from environment variables - the delivery lessons, applied to a
         system that does almost nothing. Fixing a broken pipeline now costs minutes.
      6. **Slice 1 - list properly.** Merchant scoping, newest first, formatted money, loading, error and
         empty states.
      7. **Slice 2 - refund once.** The schema for refunds and keys, `createRefund`, the `POST` route, the
         refund button and the retry banner - each with its tests.
      8. **Slice 3 and on** - partial refunds with an amount field, pagination, a refund history page... each
         through every layer, each meeting the definition of done before the next starts.

      **Order inside a slice:** start from the riskiest layer for that feature. For the refund it is the
      database transaction - if that is wrong, nothing above can save it - so the practice exercises go
      database, API, page.

  - id: refund-internals
    kind: internals
    concepts: [end-to-end-idempotent-refund]
    title: "Refunding exactly once: what each layer must do"
    body: |
      **The database (the guarantee).** `idempotency_keys` has `PRIMARY KEY (merchant_id, key)` - keys are
      scoped per merchant, so two merchants that happen to pick the same key never collide. Inside **one**
      transaction:

      1. **Reserve the key** with `INSERT ... ON CONFLICT (merchant_id, key) DO NOTHING RETURNING key`. One
         row back: this request owns the key. No row: someone used it before.
      2. **If the key existed**, read it: a different fingerprint → `422` (the key was reused for another
         request); no stored outcome yet → `409` (still in progress); otherwise **replay** the stored status
         and body, and change nothing.
      3. **Do the refund** with the check-and-change `UPDATE payments ... WHERE ... AND refunded_minor + $3 <=
         amount_minor` from [Transactions and isolation](#/lesson/transactions-and-isolation), scoped to the
         merchant (another merchant's payment is a 404 - [OWASP A01](#/lesson/owasp-top-10-for-developers)).
      4. **Store the outcome** (status code and body) on the key row.
      5. **Commit.** The key, the refund and the stored answer become visible together - or, if anything threw,
         none of them exist and a retry with the same key starts from scratch.

      **Why one transaction matters.** If the key were stored in its own transaction before the refund, a
      crash between the two would leave a key with no outcome: every retry would get `409` forever. If it
      were stored after the refund in a separate transaction, a crash in between would leave a refund with no
      key: the retry refunds again. Same transaction, same fate.

      **Two requests at once.** The manual describes Read Committed (PostgreSQL's default): the second
      `INSERT ... ON CONFLICT DO NOTHING` with the same key waits on the unique index until the first
      transaction ends. If the first committed, the insert does nothing, and the next statement - which takes
      a **fresh snapshot** in Read Committed - sees the committed key and replays it. If the first rolled back,
      the second inserts and proceeds. (Under Repeatable Read the later `SELECT` could not see the other
      transaction's row - one more reason this code assumes Read Committed.) PGlite has a single connection,
      so in the tests `Promise.all` runs the two transactions one after the other; the result is the same.

      **When is `409 in progress` needed?** Only when the outcome is stored *after* something that can't be in
      the transaction - a call to a card processor, for example. Then the key is committed first, the
      external call happens, and the outcome is stored later; a retry in between gets `409`. This capstone's
      refund is entirely inside PostgreSQL, so with correct code the `409` path is reached only by a key row
      left without an outcome - the test inserts one by hand.

      **The API (the contract).** It refuses a request without a key (`400`), validates the body with zod
      (`422` with a JSON pointer per field), passes the merchant from the **session** - never from the body -
      and sends the service's answer, adding `Idempotent-Replayed: true` (a SandPay header) on a replay.

      **The browser (the key's owner).** The key is made **once per refund attempt** with
      `crypto.randomUUID()` and kept with the attempt. A **retry** of that attempt reuses it; a **new** refund
      gets a new key. While a request is in flight, the refund buttons are disabled, so a double click sends
      one request. (Disabling is the UI's half only: a second tab or a client retry loop can still send a
      duplicate, which is why the server must not depend on it.)

  - id: visual-retry
    kind: visual
    concepts: [end-to-end-idempotent-refund]
    title: A lost response, then a retry
    body: |
      ```mermaid
      sequenceDiagram
        participant U as Merchant
        participant P as PaymentsPage
        participant A as Express API
        participant D as PostgreSQL
        U->>P: click "Refund €12.50 on pay_1002"
        Note over P: key = randomUUID() - stored with the attempt
        P->>A: POST /refunds, Idempotency-Key k1, amountMinor 1250
        A->>D: BEGIN, reserve k1, UPDATE payment, INSERT refund, store 201, COMMIT
        A--xP: response lost (Wi-Fi drops)
        P-->>U: "did not complete. Try again - it will not be refunded twice."
        U->>P: Try again
        P->>A: POST /refunds, Idempotency-Key k1 (same), amountMinor 1250
        A->>D: reserve k1 - conflict, same fingerprint, outcome stored
        A-->>P: 201 + Idempotent-Replayed true, the same body
        P-->>U: "Refunded €12.50 on pay_1002."
      ```

      The refund happened on the **first** request; the user just never heard about it. The retry finds the
      key and replays the answer. If the page had made a new key for the retry, the server would have had no
      way to tell it from a second refund.

  - id: service-code
    kind: code
    concepts: [end-to-end-idempotent-refund]
    title: The transaction - the reference solution's core
    collapsed: true
    body: |
      From `solutions/capstone/refund-service.ts` (excerpt; `problem()` builds a Problem Details body and
      `refundPayment()` is the check-and-change `UPDATE` plus the `INSERT INTO refunds`):

      ```typescript
      export async function createRefund(db: PGlite, command: RefundCommand, hooks: RefundHooks = {}) {
        const { merchantId, idempotencyKey } = command;
        const fingerprint = fingerprintOf(command); // sha256 of {"paymentId":...,"amountMinor":...}

        return db.transaction(async (tx): Promise<ServiceResponse> => {
          const reserved = await tx.query(
            `INSERT INTO idempotency_keys (merchant_id, key, fingerprint) VALUES ($1, $2, $3)
             ON CONFLICT (merchant_id, key) DO NOTHING RETURNING key`,
            [merchantId, idempotencyKey, fingerprint],
          );

          if (reserved.rows.length === 0) {
            const existing = await tx.query<{ fingerprint: string; status_code: number | null; response: Record<string, unknown> | null }>(
              'SELECT fingerprint, status_code, response FROM idempotency_keys WHERE merchant_id = $1 AND key = $2',
              [merchantId, idempotencyKey],
            );
            const row = existing.rows[0]!;
            if (row.fingerprint !== fingerprint) {
              return problem(422, 'idempotency-key-reused', 'Idempotency key reused', {
                detail: 'This Idempotency-Key was already used for a different request.',
              });
            }
            if (row.status_code === null || row.response === null) {
              return problem(409, 'request-in-progress', 'A request with this key is still being processed');
            }
            return { status: row.status_code, body: row.response, replayed: true };
          }

          const outcome = await refundPayment(tx, command, hooks);
          await tx.query(
            'UPDATE idempotency_keys SET status_code = $3, response = $4 WHERE merchant_id = $1 AND key = $2',
            [merchantId, idempotencyKey, outcome.status, JSON.stringify(outcome.body)],
          );
          return outcome;
        });
      }
      ```

      ```sql
      -- refundPayment(): check and change in one statement, scoped to the merchant
      UPDATE payments SET refunded_minor = refunded_minor + $3
       WHERE id = $1 AND merchant_id = $2 AND refunded_minor + $3 <= amount_minor
       RETURNING amount_minor::integer, refunded_minor::integer, currency;
      ```

      If the `UPDATE` returns no row, a second `SELECT` tells "not found" (404) from "too much" (409 with
      `refundableMinor`). Both are **business outcomes**: they are stored on the key and replayed, so a retry
      gets the same answer - only an exception rolls the key back.

  - id: line-by-line
    kind: line-by-line
    concepts: [end-to-end-idempotent-refund]
    title: Why the important lines are written that way
    body: |
      - **`PRIMARY KEY (merchant_id, key)`** - uniqueness is the database's job. A `SELECT` to check, then an
        `INSERT`, has a gap between them that two requests can both fall into; the first draft in the
        exercise does exactly that and fails with `duplicate key value violates unique constraint
        "idempotency_keys_pkey"` when two requests arrive together.
      - **`ON CONFLICT (merchant_id, key) DO NOTHING RETURNING key`** - one statement that both reserves the
        key and tells you whether you got it: a returned row means "yours".
      - **`fingerprintOf(command)`** - hashes only what defines the request (payment and amount), in a fixed
        key order. Hashing the raw body would make `{"amountMinor":1500}` and `{ "amountMinor": 1500 }`
        "different" requests.
      - **`db.transaction(async (tx) => ...)`** - every query uses `tx`, not `db`. One stray `db.query`
        inside runs outside the transaction (and on PGlite would wait for the transaction to end - a
        deadlock in your own process).
      - **`WHERE id = $1 AND merchant_id = $2`** - the merchant comes from the session, so another merchant's
        payment simply isn't found.
      - **`hooks.afterRefund?.(tx)`** - a test seam: the test throws from it to simulate a crash after the
        refund row is written, and then proves that neither the refund nor the key survived.
      - **`return outcome` after storing it** - the caller gets exactly what a replay will get later.

  - id: api-code
    kind: code
    concepts: [end-to-end-idempotent-refund, capstone-definition-of-done]
    title: The API answering real requests
    body: |
      The reference solution, started with `tsx` (a session map with `sid-asha` for merchant 1), answering
      curl. Real output, trimmed only of the `Date`, `ETag`, `Connection` and `Keep-Alive` lines:

      ```http
      $ curl -s -i http://localhost:3070/healthz
      HTTP/1.1 200 OK
      Content-Type: application/json; charset=utf-8

      {"status":"ok"}

      $ curl -s -i http://localhost:3070/api/payments
      HTTP/1.1 401 Unauthorized
      Content-Type: application/problem+json; charset=utf-8

      {"type":"https://api.sandpay.example/problems/sign-in-required","title":"Sign in required","status":401}
      ```

      A refund, then the **same request again** (a retry with the same key):

      ```http
      $ curl -s -i -b sid=sid-asha -H 'Idempotency-Key: "5b0c3a1e-4f7d-4a8e-9c2b-1d6e8f0a2c4b"' \
          -H 'Content-Type: application/json' -d '{"amountMinor":1500}' \
          http://localhost:3070/api/payments/pay_1001/refunds
      HTTP/1.1 201 Created
      Location: /api/payments/pay_1001/refunds/1
      Content-Type: application/json; charset=utf-8

      {"refundId":1,"paymentId":"pay_1001","amountMinor":1500,"currency":"EUR","refundableMinor":3500}

      $ curl ... the same command again
      HTTP/1.1 201 Created
      Idempotent-Replayed: true
      Location: /api/payments/pay_1001/refunds/1
      Content-Type: application/json; charset=utf-8

      {"currency":"EUR","refundId":1,"paymentId":"pay_1001","amountMinor":1500,"refundableMinor":3500}
      ```

      The same key with a **different amount**, then **no key**, then a **bad amount**:

      ```http
      HTTP/1.1 422 Unprocessable Entity
      Content-Type: application/problem+json; charset=utf-8

      {"type":"https://api.sandpay.example/problems/idempotency-key-reused","title":"Idempotency key reused","status":422,"detail":"This Idempotency-Key was already used for a different request."}

      HTTP/1.1 400 Bad Request
      Content-Type: application/problem+json; charset=utf-8

      {"type":"https://api.sandpay.example/problems/idempotency-key-missing","title":"Idempotency-Key header is required","status":400}

      HTTP/1.1 422 Unprocessable Entity
      Content-Type: application/problem+json; charset=utf-8

      {"type":"https://api.sandpay.example/problems/validation-error","title":"The request is not valid","status":422,"errors":[{"detail":"Invalid input: expected int, received number","pointer":"#/amountMinor"}]}
      ```

      And the list afterwards - one refund of 1500, not two:

      ```json
      {"payments":[
        {"id":"pay_1002","amountMinor":1250,"currency":"EUR","refundedMinor":0,"refundableMinor":1250,"createdAt":"2026-11-12T14:02:00Z"},
        {"id":"pay_1001","amountMinor":5000,"currency":"EUR","refundedMinor":1500,"refundableMinor":3500,"createdAt":"2026-11-10T09:15:00Z"},
        {"id":"pay_1003","amountMinor":2599,"currency":"EUR","refundedMinor":2599,"refundableMinor":0,"createdAt":"2026-11-01T08:30:00Z"}]}
      ```

      (Line breaks added to the last body.)

  - id: run-findings
    kind: internals
    concepts: [end-to-end-idempotent-refund]
    title: Three things the real run showed
    body: |
      Running the capstone - rather than only reading about it - turned up details worth knowing:

      1. **The replay is the same JSON, but not the same bytes.** Compare the two `201` bodies above: the
         replay starts with `"currency"`. The outcome is stored in a `jsonb` column, and `jsonb` stores
         objects in its own internal form, not your key order - so the replayed body, and its `ETag`, differ
         from the first response. Every JSON client reads them as equal. If your contract promises a
         **byte-identical** replay, store the response as `text` (or `json`, which keeps the input text).
      2. **Express says "Unprocessable Entity".** RFC 9110 (2022) renamed 422 "Unprocessable Content"; the
         reason phrase Express sends comes from Node's `http.STATUS_CODES`, which still has the old name.
         Clients must act on the **number** - reason phrases are not part of the contract (and HTTP/2 has
         none at all).
      3. **The first draft fails in the way production would.** Run against the exercise's starting code
         (look up the key, then refund, then store the key, no transaction), the service tests report
         `Tests 10 failed | 1 passed (11)`. The one that passes is the simple retry - which is why a "we tested
         retries" claim proves little. The concurrent test fails with `error: duplicate key value violates
         unique constraint "idempotency_keys_pkey"` - in production that is a 500 after the money moved.

  - id: page-code
    kind: code
    concepts: [end-to-end-idempotent-refund]
    title: The page - one key per attempt
    body: |
      From `solutions/capstone/PaymentsPage.tsx` (excerpt). An **attempt** carries its key; "Try again"
      re-runs the same attempt object:

      ```typescript
      interface Attempt { paymentId: string; amountMinor: number; currency: string; key: string }

      async function run(attempt: Attempt): Promise<void> {
        setPending(attempt);          // disables every refund button
        setInterrupted(null);
        try {
          const result = await client.refund(attempt.paymentId, attempt.amountMinor, attempt.key);
          if (result.ok) { /* update the row, announce "Refunded €12.50 on pay_1002." */ }
          else setError(`Refund failed: ${result.title}`);   // the server answered - no retry
        } catch {
          setInterrupted(attempt);    // no answer: it may or may not have happened - keep the key
        } finally {
          setPending(null);
        }
      }

      // the row's button: a NEW attempt, so a NEW key
      <button type="button" disabled={pending !== null}
        onClick={() => void run({ paymentId: p.id, amountMinor: p.refundableMinor, currency: p.currency, key: newKey() })}>
        Refund {formatMoney(p.refundableMinor, p.currency)} on {p.id}
      </button>

      // the banner's button: the SAME attempt, so the SAME key
      <button type="button" disabled={pending !== null} onClick={() => void run(interrupted)}>Try again</button>
      ```

      `newKey` is a prop: the app passes `() => crypto.randomUUID()`, the tests pass a counter (`key-1`,
      `key-2`) so they can assert which key was sent. The list is loaded in an Effect with the `ignore` flag
      from react.dev, so a slow first response can't overwrite a newer one.

      Two kinds of failure, two messages: a **refusal** (`{ ok: false }` - the server decided) will not change
      on retry, so there is no "Try again"; **no answer** (`fetch` rejected, a time-out) is the ambiguous case,
      and only there is retrying with the same key both safe and necessary.

  - id: definition-of-done
    kind: steps
    concepts: [capstone-definition-of-done]
    title: The capstone's definition of done
    body: |
      The Scrum Guide: "If a Product Backlog item does not meet the Definition of Done, it cannot be released
      or even presented at the Sprint Review." Agree the list **before** the first slice; check every slice
      against it. For this dashboard:

      **Code and tests**

      1. Type check and lint are clean (`tsc --noEmit`, ESLint, no `any`).
      2. Rules have unit tests; the database code has tests against a real PostgreSQL (PGlite here); the
         routes have supertest tests; the page has Testing Library tests by role; one end-to-end journey per
         critical flow ([Testing a full stack app](#/lesson/fullstack-testing-strategy)).
      3. Negative paths are tested at the lowest layer that can see them: missing key, reused key, another
         merchant's payment, too large an amount, a crash mid-transaction, two requests at once.

      **Interfaces**

      4. Every error is Problem Details; no stack trace or SQL error reaches a client
         ([Input validation and error handling](#/lesson/input-validation-and-error-handling)).
      5. The OpenAPI document describes the new route and its errors ([Contract-first APIs with
         OpenAPI](#/lesson/openapi-contract-first)).

      **Running it**

      6. Configuration (database URL, port, allowed origins) comes from the environment, and secrets are
         never in the image or the repository ([Deployment, configuration and
         environments](#/lesson/deployment-and-configuration)).
      7. `GET /healthz` checks what the process needs (the database) and is wired to the platform's health
         check.
      8. The schema change is a migration that runs before the new code and is safe for the old code
         ([Migrations and data access](#/lesson/migrations-and-data-access)).
      9. The image builds from a clean checkout and runs with the database in Compose ([Containers with
         Docker and Compose](#/lesson/docker-and-compose)).
      10. The pipeline runs all of the above on every pull request and deploys `main` ([CI/CD for web
          applications](#/lesson/ci-cd-for-web-apps)).
      11. Logs are structured, carry a request id, and say "refund created" or "refund replayed" with the
          key - never the full card data or the session ([Observability for web
          applications](#/lesson/observability-for-web-apps)).

      **Explaining it**

      12. The README says how to run it; significant decisions have an ADR.

      Items 6, 9, 10 and 11 are taught in the delivery lessons and **not** run in this lesson's practice files.

  - id: adr
    kind: what
    concepts: [architecture-decision-records]
    title: Architecture decision records - writing down the "why"
    body: |
      Michael Nygard's 2011 post proposes keeping "a collection of records for 'architecturally significant'
      decisions: those that affect the structure, non-functional characteristics, dependencies, interfaces, or
      construction techniques". Each record has five parts:

      | Part | What goes in it (Nygard) |
      | --- | --- |
      | **Title** | a short noun phrase - "ADR 1: Deployment on Ruby on Rails 3.0.10" |
      | **Context** | "the forces at play, including technological, political, social, and project local" - value-neutral facts |
      | **Decision** | "our response to these forces" in full sentences, active voice: "We will ..." |
      | **Status** | proposed, accepted, or later deprecated or superseded (with a link to the replacement) |
      | **Consequences** | "All consequences should be listed here, not just the 'positive' ones" |

      The whole record "should be one or two pages long", written "as if it is a conversation with a future
      developer". Records are numbered and never rewritten - a changed mind is a **new** ADR that supersedes
      the old one, so the history stays readable.

      An ADR from this capstone:

      ```plaintext
      ADR 3: Idempotency keys stored in PostgreSQL, in the refund's transaction

      Status: Accepted

      Context
      Refund requests are retried by browsers on flaky networks, by our own retry
      logic and possibly by load balancers. A duplicate refund costs a merchant real
      money. The refund is a change to PostgreSQL only - no external call. We run one
      PostgreSQL primary and do not run Redis. The IETF Idempotency-Key draft (-08)
      is not an RFC but is what our clients will expect.

      Decision
      We will require an Idempotency-Key on POST /api/payments/:id/refunds. We will
      store keys in an idempotency_keys table with PRIMARY KEY (merchant_id, key) and
      a fingerprint of payment and amount, and reserve the key, do the refund and
      store the response in one transaction.

      Consequences
      + A retry, a double submit or a crash can never create a second refund.
      + No new infrastructure; the guarantee is tested against real PostgreSQL.
      - Every refund writes one more row; keys need a clean-up job (we keep 24 hours).
      - Replays are equal JSON but not byte-identical (jsonb), so ETags differ.
      - If refunds ever call a processor, the key must be committed before the call
        and a 409 "in progress" state added - this ADR will be superseded.
      ```

      Notice the **negative** consequences. In a review or an interview, the person who names the costs of
      their own decision is the one who is believed about its benefits.

  - id: example
    kind: example
    concepts: [walking-skeleton-vertical-slice, architecture-decision-records]
    title: Presenting the capstone in a review
    body: |
      A ten-minute review of the finished slice, the way a hiring panel or a tech lead would want it:

      1. **One sentence of product.** "Merchants can refund a payment from the dashboard, and a refund can
         never happen twice."
      2. **Demo the happy path and one failure.** Refund `pay_1002`; then, with the browser's network
         throttled to offline at the right moment, show the "did not complete" banner, go online, click "Try
         again" and show the row refunded **once** - and the second request's `Idempotent-Replayed: true` in
         the network tab.
      3. **Show the evidence, not adjectives.** The test run (`30 passed` for the three capstone test files),
         the concurrent-requests test, the crash test, the database rows.
      4. **Walk the layers top-down in one minute each:** page (key per attempt), API (key required,
         validation, session), database (one transaction).
      5. **Open the ADRs.** ADR 3 above; ADR 1 "PGlite in tests, PostgreSQL in production"; ADR 2 "Problem
         Details for every error".
      6. **Say what is missing.** "No pagination yet; keys are never cleaned up yet; the processor isn't
         integrated - here is the plan."

      What a tester on the panel checks: the failure demo is real (not a mocked screen), the numbers in the
      database match the screen, and the "what is missing" list matches what they find.

  - id: tests
    kind: tests
    concepts: [end-to-end-idempotent-refund, capstone-definition-of-done]
    title: What the capstone's tests check
    body: |
      | # | Case | Layer | Expected | Evidence |
      | --- | --- | --- | --- | --- |
      | P1 | First refund | service | 201, one `refunds` row, `refunded_minor` 1500, `refundableMinor` 3500 | rows counted in the test |
      | P2 | Retry, same key and body | service + API | same body, `replayed: true`, `Idempotent-Replayed: true`, still one row | replay header, row count |
      | P3 | Exactly what is left | service | 201, `refundableMinor` 0 | body |
      | P4 | Lost response, Try again | page | second call has the **same** key; one "Refunded" message | `refund.mock.calls` |
      | P5 | `/healthz` | API | 200 `{"status":"ok"}` without a session | response |
      | N1 | Same key, other amount | service + API | 422 `idempotency-key-reused`, nothing changed | problem body, rows |
      | N2 | No key / bad key | API | 400 `idempotency-key-missing` / `-invalid`, checked before the body | problem body |
      | N3 | `12.5`, `{}`, an extra `status` field | API | 422 `validation-error`, pointer `#/amountMinor` | problem body |
      | N4 | Another merchant's payment | service + API | 404, payment untouched | `refunded_minor` still 0 |
      | N5 | 1 more than is left | service | 409 `refund-exceeds-refundable`, `refundableMinor` 1250 | problem body |
      | N6 | Crash after the refund row | service | throws; no refund and **no key** kept; retry → 201 once | rows before and after |
      | N7 | Two requests, same key, together | service | one refund; one fresh answer, one replay, same `refundId` | rows, `replayed` flags |
      | N8 | Database error | API | 500 `internal-error`, no SQL or table names in the body | body text |
      | N9 | Double click | page | one `refund` call; all buttons disabled until the answer | mock call count |
      | N10 | Refusal from the server | page | "Refund failed: ..." and **no** "Try again" | alert text |

      All of these run in `practice/fullstack` in a few seconds - no browser, no server, no Docker. The one
      end-to-end journey (P4 through a real browser and network) belongs in the Playwright project.

  - id: mistakes
    kind: mistakes
    concepts: [end-to-end-idempotent-refund, walking-skeleton-vertical-slice]
    title: Common mistakes and how to find them
    body: |
      - **A new key on every retry.** The UI calls `randomUUID()` inside the retry handler. Every retry is a
        new request to the server. *Find it:* two refunds with different keys a few seconds apart for the
        same payment and amount, from the same session.
      - **Check, then insert.** `SELECT` the key, then `INSERT` it later. Two requests both see "no key".
        *Find it:* a unique-violation error (SQLSTATE 23505) in the logs right after a successful refund.
      - **Key stored outside the refund's transaction.** A crash leaves a refund without a key (double refund
        on retry) or a key without an outcome (409 forever). *Find it:* the crash test - throw between the
        steps and look at both tables.
      - **No fingerprint.** A client bug reuses a key for a different payment and silently gets the old
        payment's success. *Find it:* same key, different body - expect 422.
      - **Keys not scoped to the merchant.** Merchant B's refund is "replayed" with merchant A's response -
        a data leak. *Find it:* the same key from two sessions.
      - **Merchant id from the request body.** Anyone can refund anyone's payment. *Find it:* an IDOR test as
        in [The OWASP Top 10 for developers](#/lesson/owasp-top-10-for-developers).
      - **Retrying a refusal.** The page offers "Try again" for a 409 "exceeds refundable"; the user clicks
        it forever. Only "no answer" is worth retrying.
      - **Building horizontally.** All tables, then all endpoints, then all pages - and the first time
        anything runs together is the demo. *Find it:* ask "what can a user do today?" If the answer is
        "nothing yet", you have no skeleton.
      - **Skeleton without delivery.** It runs on one laptop, but there is no pipeline or container yet; the
        first deploy fails in the last week. The skeleton must be *deployed*, not just started.

      **Debugging a reported double refund** - follow the key: (1) the two `refunds` rows - same payment,
      same amount, how far apart? (2) the `idempotency_keys` rows for that merchant in that window - one key
      or two? (3) two keys → the client made a second key (UI or client retry code); one key with two refunds
      → the server's transaction is broken; (4) confirm with the request logs (key, request id, replayed or
      not) before changing any code.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [end-to-end-idempotent-refund, architecture-decision-records]
    title: Trade-offs and alternatives
    body: |
      - **Keys in PostgreSQL vs Redis.** PostgreSQL lets the key and the refund commit together - the
        strongest guarantee, no extra system. A separate store (Redis) is faster for very high volumes but
        can't join the database transaction, so you need the "reserve, act, record" states and the 409 path.
        Choose by whether the work is all in one database.
      - **Store every outcome vs only successes.** Replaying a 404 or 409 keeps retries predictable (the IETF
        draft and the idempotency lesson discuss both). Not storing errors lets a client retry after fixing
        the data - but then the same key can mean different results over time. Write the choice in the ADR.
      - **Expiry.** Keys kept forever grow the table; the draft lets a resource publish an expiry policy (2.3).
        A nightly `DELETE ... WHERE created_at < now() - interval '24 hours'` is simple; after it, a very late
        retry is a new request - document that.
      - **jsonb vs text for the stored response.** jsonb is queryable and compact but reorders keys; text keeps
        the bytes. Byte-identical replays matter only if clients compare raw bodies or ETags.
      - **A walking skeleton costs days that show "nothing".** Stakeholders see one table on a page. The
        payoff is that every later slice ships on a pipeline that already works - make the trade-off visible
        by demoing the deploy, not just the page.
      - **ADRs are overhead.** Nygard limits them to architecturally significant decisions; a record for
        every library bump is noise nobody reads.

  - id: summary
    kind: summary
    concepts:
      [
        walking-skeleton-vertical-slice,
        end-to-end-idempotent-refund,
        capstone-definition-of-done,
        architecture-decision-records,
      ]
    title: Quick reference
    body: |
      - **Walking skeleton first:** one row from PostgreSQL through Express to a React table, tested and
        deployed by a pipeline. Then vertical slices, riskiest layer first.
      - **Refund once - browser:** one key per attempt (`crypto.randomUUID()`), the same key on retry, buttons
        disabled in flight; retry only "no answer", never a refusal.
      - **Refund once - API:** key required (400), body validated (422 with pointers), merchant from the
        session, the service's answer sent as is, `Idempotent-Replayed` on replays.
      - **Refund once - database:** `PRIMARY KEY (merchant_id, key)`; in ONE transaction: `INSERT ... ON
        CONFLICT DO NOTHING RETURNING`, fingerprint check (422), outcome check (409), the conditional
        `UPDATE`, the refund row, the stored outcome.
      - **Crash = nothing kept,** so the retry works. **Two at once = one refund,** one replay.
      - **Definition of done:** tests by layer, Problem Details, OpenAPI, env config, `/healthz`, migration,
        image, pipeline, logs, README, ADRs.
      - **ADR:** title, context, decision ("We will ..."), status, consequences - including the bad ones.

exercises:
  - id: skeleton-order
    type: order
    concept: walking-skeleton-vertical-slice
    skill: application
    title: Put the first week in order
    prompt: |
      You start the SandPay dashboard from an empty repository. Put these steps in the order a walking
      skeleton approach would do them.
    items:
      - id: migration
        text: Create the payments table with one seeded row through a migration
      - id: route
        text: Add GET /api/payments returning that row, with a supertest test
      - id: page
        text: Render the row in PaymentsPage, with a Testing Library test
      - id: e2e
        text: Add one end-to-end test that sees the row through the real API and database
      - id: pipeline
        text: Build the container image and a pipeline that runs every test and deploys it
      - id: list-slice
        text: Add merchant scoping, loading, error and empty states to the list
      - id: refund-slice
        text: Build the refund slice - schema, service, route, button - each with its tests
    hints:
      - What is the thinnest thing that touches every layer?
      - When should the pipeline exist - before or after the first real feature?
      - Inside the skeleton, go from the data outwards.
    solution: |
      Data, route, page and one end-to-end test make the skeleton; packaging and the pipeline come **next**,
      while the system still does almost nothing, so a broken build is cheap to fix. Only then the first real
      slice (the list done properly) and the refund slice. Freeman and Pryce put the automated build, deploy
      and test of the skeleton before the first feature for exactly this reason.

  - id: horizontal-trap
    type: mcq
    concept: walking-skeleton-vertical-slice
    skill: analysis
    title: Six weeks in, nothing works together
    prompt: |
      A team planned the dashboard by layer: weeks 1-2 every table, weeks 3-4 every endpoint, weeks 5-6 every
      page. In week 6 the pages show "NaN" for amounts, the container can't reach the database, and CI has
      never run the API tests. Each layer's own tests are green. What is the most useful diagnosis?
    options:
      - id: horizontal
        text: The plan built horizontal layers, so integration was first tried at the end; a walking skeleton in week 1 would have exposed the field mismatch, the container networking and the missing CI job when they were cheap.
        feedback: Correct - all three problems are integration problems that only appear when layers run together, which this plan postponed to the last week.
      - id: more-unit
        text: The layers need more unit tests.
        feedback: Every layer's own tests are green; the bugs are between layers (field names, network, pipeline). More unit tests can't see them.
      - id: e2e-only
        text: They should have written only end-to-end tests from the start.
        feedback: One end-to-end test early is part of the skeleton, but a suite of only end-to-end tests is slow and hard to diagnose. The fix is the order of work, not the test type.
      - id: bad-luck
        text: Late integration problems are normal; add a week of integration at the end of every project.
        feedback: That schedules the risk at the most expensive time. A skeleton moves it to the cheapest time.
    correct: [horizontal]
    hints:
      - Are any of the three problems inside a single layer?
      - When did the layers first run together?
    solution: |
      All three failures live **between** layers - the API's field name versus the page's, the container's
      network versus the database, the pipeline versus the tests. A horizontal plan runs the layers together
      for the first time at the end. A walking skeleton (one row through every layer, deployed by the pipeline
      in week 1) would have shown each problem when it took minutes to fix.

  - id: capstone-refund-service
    type: coding
    concept: end-to-end-idempotent-refund
    skill: application
    title: Exercise 1 - the idempotent refund transaction
    prompt: |
      `exercises/capstone/refund-service.ts` holds a first draft of `createRefund` that works when nothing
      goes wrong: it looks the key up, refunds, then stores the key - three separate steps, no transaction,
      no fingerprint and no merchant check. Rewrite it to meet the contract in the file's header: keys scoped
      per merchant, fingerprint check (422), in-progress check (409), replay of stored outcomes, 404 for
      another merchant's payment, 409 with `refundableMinor` for too large an amount, and **everything in one
      transaction** so a crash keeps nothing and two simultaneous requests refund once. The schema is in
      `dashboard-db.ts`.
    project: fullstack
    files:
      - exercises/capstone/refund-service.ts
    test: tests/capstone/refund-service.test.ts
    command: npx vitest run tests/capstone/refund-service.test.ts
    hints:
      - "Start with db.transaction(async (tx) => ...) and use only tx inside it."
      - Reserve the key first with INSERT ... ON CONFLICT (merchant_id, key) DO NOTHING RETURNING key - no row back means the key was used before.
      - The refund is the conditional UPDATE from the transactions lesson, with AND merchant_id = $2 added; if it returns no row, a SELECT tells 404 from 409.
      - Store status_code and response on the key row before the transaction ends, and return the same thing.
    modelAnswer: |
      ```typescript
      return db.transaction(async (tx) => {
        const reserved = await tx.query(
          `INSERT INTO idempotency_keys (merchant_id, key, fingerprint) VALUES ($1, $2, $3)
           ON CONFLICT (merchant_id, key) DO NOTHING RETURNING key`,
          [merchantId, idempotencyKey, fingerprint]);
        if (reserved.rows.length === 0) {
          const row = (await tx.query(`SELECT fingerprint, status_code, response FROM idempotency_keys
                                         WHERE merchant_id = $1 AND key = $2`, [merchantId, idempotencyKey])).rows[0];
          if (row.fingerprint !== fingerprint) return problem(422, 'idempotency-key-reused', ...);
          if (row.status_code === null) return problem(409, 'request-in-progress', ...);
          return { status: row.status_code, body: row.response, replayed: true };
        }
        const outcome = await refundPayment(tx, command, hooks);   // conditional UPDATE + INSERT refund
        await tx.query(`UPDATE idempotency_keys SET status_code = $3, response = $4
                         WHERE merchant_id = $1 AND key = $2`,
                       [merchantId, idempotencyKey, outcome.status, JSON.stringify(outcome.body)]);
        return outcome;
      });
      ```

      The primary key makes reservation atomic; the fingerprint stops a key being reused for a different
      request; storing the outcome in the same transaction means the key and the refund share one fate - a
      crash leaves neither, so the retry succeeds once.
    rubric:
      - Every test in tests/capstone/refund-service.test.ts passes.
      - All queries run on the transaction (tx), none on db, inside one db.transaction call.
      - The key is reserved with the primary key and ON CONFLICT, not checked with a SELECT first.
      - The payment is looked up with the merchant id, so another merchant's payment is a 404.
      - Business outcomes (201, 404, 409) are stored and replayed; an exception stores nothing.
    solution: |
      One `db.transaction`: reserve the key with `ON CONFLICT DO NOTHING RETURNING`; if it existed, compare
      the fingerprint (422), check the stored outcome (409 if none) or replay it; otherwise run the
      merchant-scoped conditional `UPDATE`, insert the refund, store the outcome on the key row and return
      it. The reference is `solutions/capstone/refund-service.ts`.

  - id: capstone-dashboard-api
    type: coding
    concept: end-to-end-idempotent-refund
    skill: application
    title: Exercise 2 - the dashboard API
    prompt: |
      In `exercises/capstone/dashboard-api.ts`, `/healthz` already works. Add the session middleware for
      `/api` (deny by default), `GET /api/payments` (the merchant's payments, newest first, with
      `refundableMinor` and an ISO 8601 `createdAt`), `POST /api/payments/:paymentId/refunds` with the checks
      in the order the file's header gives (key, key format, content type, zod body), the replay header and
      `Location`, and an error handler that turns malformed JSON into a 400 problem and anything else into a
      500 problem that leaks nothing. Do exercise 1 first - the route calls `createRefund`.
    project: fullstack
    files:
      - exercises/capstone/dashboard-api.ts
    test: tests/capstone/dashboard-api.test.ts
    command: npx vitest run tests/capstone/dashboard-api.test.ts
    hints:
      - "app.use('/api', ...) runs before every /api route - put the session check there and keep the merchant in res.locals."
      - "z.strictObject({ amountMinor: z.number().int().min(1).max(10_000_000) }) rejects 12.5, {} and extra fields; map issue.path to a pointer like #/amountMinor."
      - "express.json() reports broken JSON as an error with status 400 and type 'entity.parse.failed' - handle it in the four-argument error handler."
      - "to_char(created_at AT TIME ZONE 'UTC', 'YYYY-MM-DD\"T\"HH24:MI:SS\"Z\"') gives the createdAt format straight from SQL."
    modelAnswer: |
      ```typescript
      app.disable('x-powered-by');
      app.use('/api', (req, res, next) => {
        const merchantId = sessions.get(String(req.cookies.sid));
        if (merchantId === undefined) return void sendProblem(res, 401, 'sign-in-required', 'Sign in required');
        res.locals.merchantId = merchantId;
        next();
      });

      app.post('/api/payments/:paymentId/refunds', async (req, res) => {
        const key = idempotencyKeyOf(req);
        if (key === undefined) return void sendProblem(res, 400, 'idempotency-key-missing', ...);
        if (!KEY.test(key)) return void sendProblem(res, 400, 'idempotency-key-invalid', ...);
        if (!req.is('application/json')) return void sendProblem(res, 415, 'unsupported-media-type', ...);
        const parsed = RefundBody.safeParse(req.body);
        if (!parsed.success) return void sendProblem(res, 422, 'validation-error', 'The request is not valid', {
          errors: parsed.error.issues.map((i) => ({ detail: i.message, pointer: `#/${i.path.join('/')}` })) });
        const outcome = await createRefund(db, { merchantId: res.locals.merchantId, paymentId: req.params.paymentId,
                                                 amountMinor: parsed.data.amountMinor, idempotencyKey: key });
        if (outcome.replayed) res.set('Idempotent-Replayed', 'true');
        if (outcome.status === 201) res.set('Location', `/api/payments/${req.params.paymentId}/refunds/${outcome.body.refundId}`);
        res.status(outcome.status);
        if (outcome.status >= 400) res.type('application/problem+json');
        res.json(outcome.body);
      });
      ```

      Plus `GET /api/payments` with `WHERE merchant_id = $1 ORDER BY created_at DESC`, and the error handler
      last. The key is checked before the body so a client without keys learns that first; the merchant always
      comes from the session.
    rubric:
      - Every test in tests/capstone/dashboard-api.test.ts passes.
      - One middleware protects all of /api; no route reads the merchant from the request body or URL.
      - Every error response is application/problem+json with a type under the SandPay problems URI.
      - The 500 handler logs the error on the server and sends no message, SQL or stack to the client.
    solution: |
      A session middleware on `/api`, the merchant-scoped list query, the refund route with its four checks
      in order and the service's answer passed through (with the replay header and `Location`), and a
      four-argument error handler. The reference is `solutions/capstone/dashboard-api.ts`.

  - id: capstone-payments-page
    type: coding
    concept: end-to-end-idempotent-refund
    skill: application
    title: Exercise 3 - the payments page
    prompt: |
      `exercises/capstone/PaymentsPage.tsx` shows the payments when everything goes well, but has no loading,
      error or empty state, no "Fully refunded", no messages, no protection against a double click - and it
      makes a **new** key whenever a refund is attempted. Make it meet the contract in the file's header,
      including the "did not complete" banner whose "Try again" resends the same payment, amount and key.
    project: fullstack
    files:
      - exercises/capstone/PaymentsPage.tsx
    test: tests/capstone/payments-page.test.tsx
    command: npx vitest run tests/capstone/payments-page.test.tsx
    hints:
      - Model the list as one state - loading, failed or ready with payments - instead of separate booleans.
      - "Represent a refund attempt as an object { paymentId, amountMinor, currency, key }; make the key when the attempt is created, not when it is sent."
      - Keep the pending attempt in state and disable every refund button while it is set.
      - "A rejected promise from client.refund means \"no answer\" - keep the attempt for Try again; { ok: false } is an answer - show it and offer no retry."
    modelAnswer: |
      ```typescript
      const [pending, setPending] = useState<Attempt | null>(null);
      const [interrupted, setInterrupted] = useState<Attempt | null>(null);

      async function run(attempt: Attempt) {
        setPending(attempt); setInterrupted(null); setMessage(''); setError('');
        try {
          const result = await client.refund(attempt.paymentId, attempt.amountMinor, attempt.key);
          if (result.ok) { /* update the row's refundableMinor; setMessage(`Refunded ... on ${attempt.paymentId}.`) */ }
          else setError(`Refund failed: ${result.title}`);
        } catch {
          setInterrupted(attempt);       // same attempt object = same key on Try again
        } finally {
          setPending(null);
        }
      }
      // row button:   onClick={() => void run({ ..., key: newKey() })}  disabled={pending !== null}
      // Try again:    onClick={() => void run(interrupted)}
      ```

      The key belongs to the attempt, so it is made once, when the merchant asks for a refund; "Try again"
      re-runs the stored attempt. Loading uses an Effect with an `ignore` flag and a reload counter for Retry.
    rubric:
      - Every test in tests/capstone/payments-page.test.tsx passes.
      - The key is created once per refund attempt and reused by Try again; a new refund gets a new key.
      - Only "no answer" offers a retry; a refusal from the server does not.
      - States and messages are reachable by role (status, alert, table caption, button names), not test ids.
    solution: |
      One load state with an Effect and a reload counter; an attempt object that carries its key; a pending
      attempt that disables the buttons; a status message on success, an alert on refusal, and an alert with
      "Try again" that re-runs the same attempt when the call throws. The reference is
      `solutions/capstone/PaymentsPage.tsx`.

  - id: debug-retry-key
    type: debug
    concept: end-to-end-idempotent-refund
    skill: analysis
    title: Two refunds for one click
    prompt: |
      Support reports that some merchants on mobile networks see two refunds for one payment, a few seconds
      apart, with **different** idempotency keys. This is the client code. Which lines cause the duplicates
      (select all)?
    language: typescript
    code: |
      async function refundWithRetry(paymentId: string, amountMinor: number): Promise<RefundResult> {
        for (let attempt = 1; attempt <= 3; attempt++) {
          const key = crypto.randomUUID();
          try {
            const res = await fetch(`/api/payments/${paymentId}/refunds`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Idempotency-Key': `"${key}"` },
              body: JSON.stringify({ amountMinor }),
              signal: AbortSignal.timeout(5000),
            });
            return await res.json();
          } catch {
            await new Promise((resolve) => setTimeout(resolve, 1000 * attempt));
          }
        }
        throw new Error('refund failed after 3 attempts');
      }
    correctLines: [3]
    lineNotes:
      - line: 7
        note: Sending the key as a quoted Structured Field String is what the draft shows, and the API accepts it. The value is the problem, not the quoting.
      - line: 9
        note: A 5-second time-out is reasonable; timing out is exactly the ambiguous case a retry with the same key exists for. The bug is what the retry sends.
      - line: 13
        note: Backing off between attempts is good practice. It doesn't create duplicates.
    hints:
      - The reports say the keys were different. Where is the key made?
      - How many keys does one call of refundWithRetry create when the first attempt times out?
    solution: |
      **Line 3** makes a new key on every attempt. When attempt 1 times out after the server already refunded,
      attempt 2 arrives with a new key - a new request as far as the server knows - and refunds again. Move
      the key above the loop so every attempt of one refund sends the same key; the server then replays the
      first answer. Confirm with the logs before fixing: the two refunds' keys should both come from one
      client request id or one session, a few seconds apart, matching the time-out plus back-off.

  - id: duplicate-evidence
    type: mcq
    concept: end-to-end-idempotent-refund
    skill: analysis
    title: One key, two refunds
    prompt: |
      A different incident: two `refunds` rows for `pay_1001` (1500 each, 40 ms apart) and **one**
      `idempotency_keys` row for that merchant and key. The logs show both requests answered 201, neither with
      `Idempotent-Replayed`. Which layer broke the contract, and what do you check next?
    options:
      - id: server
        text: The server - one key produced two refunds, so reservation, refund and outcome are not one atomic unit. Check createRefund for a SELECT-then-INSERT or queries run outside the transaction.
        feedback: Correct - with one key the client did its job; two fresh 201s mean the server did not serialise on the key.
      - id: client
        text: The client - it made two keys.
        feedback: There is only one key row, and both requests carried it. The client behaved correctly.
      - id: network
        text: The load balancer duplicated the request; nothing can stop that.
        feedback: Duplicated requests are exactly what idempotency keys handle - the second should have been a replay. A duplicate reaching the server is not the bug; the server treating it as new is.
      - id: database-bug
        text: A PostgreSQL bug in ON CONFLICT.
        feedback: Possible in theory, but code that doesn't reserve the key atomically produces exactly this pattern. Rule out your own code first.
    correct: [server]
    hints:
      - How many keys were involved?
      - What should the second request have received?
    solution: |
      One key, two fresh refunds: the server let two requests both believe they owned the key. Look for a
      check-then-insert, a key stored in a separate transaction, or `db.query` used inside `db.transaction`.
      Reproduce it with the concurrent test (two `createRefund` calls in `Promise.all`) before changing code.

  - id: done-checklist
    type: testdesign
    concept: capstone-definition-of-done
    skill: application
    title: Is the refund slice done?
    prompt: |
      A developer says the refund slice is done: the three capstone test files pass and the demo works on
      their laptop. Using a definition of done, list what you would check before agreeing - for each item,
      the check and the **evidence** you would expect to see.
    hints:
      - Tests are one part. What about interfaces, running it and explaining it?
      - Which items can only be proven outside the laptop?
    modelAnswer: |
      - **Tests by layer:** service, API and page tests pass in CI (not only locally) - the pipeline run link;
        the negative cases (reused key, other merchant, crash, concurrency) exist - test names in the report;
        one end-to-end journey for refund-and-retry - Playwright report with trace.
      - **Static checks:** `tsc` and ESLint clean in the same pipeline run.
      - **Errors:** every error is Problem Details and no SQL leaks - the 500 test and a manual request.
      - **Contract:** the OpenAPI document has the new route, the `Idempotency-Key` header and each problem -
        diff of the spec, contract test run.
      - **Migration:** `refunds` and `idempotency_keys` created by a migration that has run on staging - the
        migration log.
      - **Config and secrets:** database URL from the environment; nothing secret in the image - the
        deployment config and an image scan.
      - **Health:** `/healthz` returns 503 when the database is down - a test or a staging check.
      - **Deployed:** the image built by the pipeline is running on staging - the deploy log and the version
        endpoint or image digest.
      - **Logs:** a refund and a replay each produce one structured log line with request id and key - the
        log search.
      - **Docs:** README run instructions work from a clean checkout; ADR for the idempotency design.
    solution: |
      "Tests pass on my laptop" covers one item. Done means the pipeline proves the tests and static checks,
      errors and the contract are right, the migration ran, configuration and secrets are external, the health
      check reflects the database, the pipeline-built image runs on staging, logs show refunds and replays,
      and the README and ADR exist - each with evidence someone else can open.
    rubric:
      - Covers tests, interfaces, running it (config, health, migration, image, pipeline, logs) and documentation.
      - Asks for evidence another person can check (pipeline run, logs, spec diff), not statements.
      - Includes the negative and concurrency cases, not only the happy path.
      - Distinguishes "works on my laptop" from deployed and observable.

  - id: healthz-choice
    type: mcq
    concept: capstone-definition-of-done
    skill: analysis
    title: The health check that always says OK
    prompt: |
      The first `/healthz` returned `200 {"status":"ok"}` without touching anything. During a database outage
      the platform kept sending traffic to every instance, and merchants saw 500s for 20 minutes. The
      capstone's version runs `SELECT 1` and answers 503 if it fails. What is the trade-off to discuss before
      shipping it?
    options:
      - id: tradeoff
        text: A check that depends on the database tells the platform an instance can't serve - but if the database is down for every instance, all of them fail the check at once; decide whether it is a readiness check (stop routing) or a liveness check (restart), because restarting every instance won't fix the database.
        feedback: Correct - the dependency check is right for readiness; wiring it to restarts turns a database outage into a restart storm. The deployment lesson covers the distinction.
      - id: none
        text: None - checking the database is always better.
        feedback: Better for routing decisions, but if a platform restarts instances on this check, a database outage restarts every instance for nothing.
      - id: deeper
        text: It should also call the card processor and every other dependency.
        feedback: A check that fails whenever any external service blips takes healthy instances out of service. Check what this process needs to serve its own requests.
      - id: slower
        text: It is too slow - health checks must not do I/O.
        feedback: SELECT 1 is cheap and is the whole point - the first check proved that "no I/O" means "no information".
    correct: [tradeoff]
    hints:
      - What does the platform do when the check fails?
      - What happens if every instance fails it at the same moment?
    solution: |
      The `SELECT 1` check gives the platform real information, which the first version didn't. The question
      is what the platform does with it: as a **readiness** check it stops routing to instances that can't
      reach the database; as a **liveness** check it restarts them - useless when the database itself is
      down. Wire it to readiness (see [Deployment, configuration and
      environments](#/lesson/deployment-and-configuration)) and keep liveness to "the process responds".

  - id: write-adr
    type: short
    concept: architecture-decision-records
    skill: application
    title: Write ADR 1 - PGlite in tests, PostgreSQL in production
    prompt: |
      The team runs all database tests on PGlite (PostgreSQL 18.6 in WebAssembly, in-process) and production
      on a managed PostgreSQL 18 server. Write the ADR in Nygard's format: title, context, decision, status and
      consequences - including the negative ones.
    hints:
      - The context states facts and forces, not the decision.
      - What can PGlite not show you that a real server can?
    modelAnswer: |
      **ADR 1: PGlite for automated database tests**

      **Status:** Accepted.

      **Context:** API and repository tests need a real PostgreSQL to check SQL, constraints and transactions.
      Docker is not available on every developer machine or CI runner. A full suite against a shared test
      server would be slow and tests would interfere. PGlite runs PostgreSQL 18.6 in-process, starts in about
      a second, and each test file can have its own database. Production runs PostgreSQL 18 as a separate
      server with many connections.

      **Decision:** We will run every automated database test against PGlite, one database per test file,
      reset between tests. We will run the migration and a smoke test against a real PostgreSQL 18 in the
      deploy pipeline before production.

      **Consequences:** + Fast, isolated, real SQL with no infrastructure; the same constraints and
      transactions as production. - PGlite has one connection, so tests cannot show two sessions blocking each
      other - concurrency behaviour comes from the manual and the staging check, not from tests. - Extensions
      and server settings may differ from production. - The version can drift; we pin PGlite and upgrade it
      with the server.
    rubric:
      - Has all five parts, with the decision written as "We will ...".
      - The context gives forces (speed, Docker availability, isolation), not the conclusion.
      - Lists negative consequences - especially single-connection concurrency and drift from production.
      - Is short enough to read in two minutes.
    solution: |
      Title, status, context (needs real SQL, no Docker everywhere, speed and isolation, production is a real
      server), decision ("We will run database tests on PGlite ... and a smoke test on real PostgreSQL in the
      pipeline"), and consequences with both benefits and costs - above all, no multi-connection behaviour in
      tests.

  - id: interview-capstone
    type: interview
    concept: architecture-decision-records
    skill: analysis
    title: "\"Walk me through a project you built end to end\""
    prompt: |
      A hiring manager for a full stack role says: "Walk me through something you built end to end. What was
      the hardest decision, and what would you do differently?"
    modelAnswer: |
      I built a merchant dashboard for a fictional payments provider: React and TypeScript on the front end,
      Express on Node, PostgreSQL. I started with a walking skeleton - one payment row from the database to a
      table on the page, with a test at each layer and a pipeline - before building any real feature, so
      integration problems showed up on the first day.

      The hardest decision was how to make refunds safe to retry. Refunds get retried - flaky mobile networks,
      double clicks, our own retry logic - and a duplicate costs the merchant real money. I required an
      Idempotency-Key header, following the IETF draft, and stored keys in PostgreSQL with a primary key on
      merchant and key. The key reservation, the refund and the stored response all happen in one transaction,
      so a crash leaves nothing behind and the retry works, and two simultaneous requests produce one refund and
      one replay. On the page, the key belongs to the refund attempt, so "Try again" resends the same key. I
      have tests for each case, including a simulated crash and concurrent requests, and I wrote it up as an
      ADR with the costs: an extra row per refund, a clean-up job, and replays that are equal JSON but not
      byte-identical because of jsonb.

      What I'd do differently: I'd store the response as text if clients need identical bytes, and I'd design
      the 409 "in progress" path properly from the start, because the moment refunds call a real processor the
      single-transaction design no longer holds.
    rubric:
      - Describes the system and the order of work (skeleton first, then slices) concisely.
      - Picks a genuinely hard decision and explains the forces, not just the choice.
      - Backs claims with evidence - tests for crash and concurrency, an ADR.
      - Names real costs and what they would change, without being defensive.
    followUps:
      - Why not just disable the button? Isn't that enough?
      - What happens if the refund has to call the card processor?
      - How would you know in production that duplicates are not happening?
    hints:
      - Product in one sentence, then the order you built it in.
      - One decision, its forces, its evidence, its costs.
    solution: |
      Product and stack in a sentence; skeleton first, then slices; the idempotent refund as the hard decision
      with its forces (retries cost money), its design across the layers, its evidence (crash and concurrency
      tests) and its costs from the ADR; and an honest "differently" - text storage for byte-identical replays
      and a designed 409 path before integrating a processor.

placement:
  - id: place-skeleton
    type: mcq
    concept: walking-skeleton-vertical-slice
    skill: application
    title: What to build first
    prompt: |
      A new project: a React page, an Express API, PostgreSQL, deployed by a pipeline. The first feature is a
      payments list. Which is the best first deliverable?
    options:
      - id: skeleton
        text: One payment row read from PostgreSQL by an Express route and shown on the React page, with a test at each layer, built and deployed by the pipeline.
        feedback: Correct - the thinnest path through every layer, deployed, retires integration risk first.
      - id: schema
        text: The complete database schema for every planned feature.
        feedback: A horizontal layer - nothing runs end to end, and later features will change it anyway.
      - id: ui
        text: The finished payments page with mocked data, so stakeholders can see it.
        feedback: Useful for feedback on design, but it proves nothing about the API, the database or deployment.
      - id: pipeline-last
        text: The full payments list feature, then the pipeline once there is something worth deploying.
        feedback: The pipeline is cheapest to fix while the system does almost nothing; adding it last moves deployment risk to the end.
    correct: [skeleton]
    solution: |
      A walking skeleton - "a tiny implementation of the system that performs a small end-to-end function"
      (Cockburn) - links every architectural part, including the build and deploy, before features are added.

  - id: place-idempotent
    type: mcq
    concept: end-to-end-idempotent-refund
    skill: analysis
    title: Where does the key go?
    prompt: |
      A refund's server code first runs `SELECT ... FROM idempotency_keys WHERE key = $1`; if no row, it
      refunds in one transaction and stores the key in a second transaction. Which failure can still refund
      twice?
    options:
      - id: both
        text: Two requests with the same key arriving together (both SELECTs see nothing), and a crash after the refund commits but before the key is stored.
        feedback: Correct - the check-then-insert has a race, and the separate transactions let a refund exist without its key.
      - id: none
        text: None - the SELECT catches every retry.
        feedback: Only retries that arrive after the key was stored. Simultaneous requests and a crash between the transactions both slip through.
      - id: only-crash
        text: Only the crash - SELECT is enough for concurrency.
        feedback: Two SELECTs at the same moment both see no key; nothing stops both refunding.
      - id: only-race
        text: Only the race - two transactions are as safe as one.
        feedback: If the process dies after the refund commits and before the key is stored, the retry finds no key and refunds again.
    correct: [both]
    solution: |
      Reserve the key with the primary key and `ON CONFLICT DO NOTHING` **inside** the refund's transaction,
      and store the outcome in that same transaction - then simultaneous requests serialise on the key, and a
      crash keeps neither the refund nor the key.

  - id: place-done
    type: mcq
    concept: capstone-definition-of-done
    skill: application
    title: Done or not?
    prompt: |
      A slice has passing tests at every layer and a successful demo on the developer's laptop. The image has
      not been built by the pipeline, and the new table was created by hand on staging. Is it done?
    options:
      - id: not-done
        text: No - it has not been built and deployed by the pipeline, and the schema change is not a migration; both are on any reasonable definition of done.
        feedback: Correct - "works on my laptop" plus hand-made staging changes is the opposite of a releasable increment.
      - id: done
        text: Yes - the tests and the demo prove it works.
        feedback: They prove it works on one machine. Nobody can reproduce the staging database, and the shipped image has never been built.
      - id: almost
        text: Yes, if the tests ran in CI at least once.
        feedback: The hand-made table still means production will not match staging.
      - id: depends
        text: It depends on the reviewer's opinion.
        feedback: That is what a definition of done exists to avoid - an agreed checklist, not a judgement call per slice.
    correct: [not-done]
    solution: |
      The Scrum Guide: an item that doesn't meet the definition of done "cannot be released or even presented
      at the Sprint Review". Pipeline-built and deployed, with schema changes as migrations, are standard items.

  - id: place-adr
    type: mcq
    concept: architecture-decision-records
    skill: application
    title: Changing your mind
    prompt: |
      ADR 3 (accepted) says idempotency keys live in PostgreSQL. A year later the team moves them to Redis.
      What should happen to the ADRs?
    options:
      - id: supersede
        text: Write a new ADR for the Redis decision with its own context and consequences, and mark ADR 3 as superseded with a link to it.
        feedback: Correct - records are not rewritten; the history of why each decision was made stays readable.
      - id: edit
        text: Edit ADR 3 to say Redis, so the documentation is current.
        feedback: Then nobody can see why PostgreSQL was chosen, or what changed. Nygard's format keeps the old record and marks it superseded.
      - id: delete
        text: Delete ADR 3 - it is wrong now.
        feedback: It was right in its context. Deleting it loses the reasoning a future developer needs.
      - id: nothing
        text: Nothing - ADRs are only for the start of a project.
        feedback: Decisions keep being made; a changed decision is exactly what needs a record.
    correct: [supersede]
    solution: |
      Nygard: "If a later ADR changes or reverses a decision, it may be marked as 'deprecated' or 'superseded'
      with a reference to its replacement." The new ADR explains what changed in the context.

recall:
  - id: recall-skeleton
    concept: walking-skeleton-vertical-slice
    prompt: What is a walking skeleton, and what does it include in a web project?
    answer: '"A tiny implementation of the system that performs a small end-to-end function" that links the main architectural components (Cockburn). In a web project - one row from the database through the API to the page, a test at each layer, and the build, pipeline and deploy.'
  - id: recall-vertical
    concept: walking-skeleton-vertical-slice
    prompt: What is a vertical slice, and why prefer it to building by layer?
    answer: One user-visible feature through every layer it needs, testable and releasable alone. Building by layer postpones integration to the end, when problems are most expensive; slices integrate every time.
  - id: recall-key-browser
    concept: end-to-end-idempotent-refund
    prompt: When does the browser make a new idempotency key, and when does it reuse one?
    answer: A new key for each new refund attempt the user asks for; the same key for every retry of that attempt (after a time-out or network error). Never a new key in the retry loop.
  - id: recall-key-db
    concept: end-to-end-idempotent-refund
    prompt: What happens inside the refund's single transaction?
    answer: Reserve the key (INSERT ... ON CONFLICT (merchant_id, key) DO NOTHING RETURNING); if it existed, check the fingerprint (422), the stored outcome (409 if none) or replay it; otherwise do the conditional UPDATE, insert the refund and store the status and body on the key row.
  - id: recall-retry-what
    concept: end-to-end-idempotent-refund
    prompt: Which failures should the page offer to retry, and which not?
    answer: Retry only "no answer" (network error, time-out) - the refund may or may not have happened, and the same key makes retrying safe. A refusal from the server (404, 409, 422) is an answer and won't change on retry.
  - id: recall-dod
    concept: capstone-definition-of-done
    prompt: Name six items on a definition of done for a full stack slice.
    answer: Tests at the right layers passing in CI; static checks clean; errors as Problem Details with nothing leaked; OpenAPI updated; schema change as a migration; config from the environment; health check; image built and deployed by the pipeline; structured logs; README and ADRs.
  - id: recall-adr
    concept: architecture-decision-records
    prompt: What are the parts of an ADR, and how is a changed decision recorded?
    answer: Title, context, decision ("We will ..."), status, consequences (good and bad). A changed decision gets a new ADR; the old one is marked superseded with a link - never rewritten.

