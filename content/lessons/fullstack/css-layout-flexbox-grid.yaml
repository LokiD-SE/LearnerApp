id: css-layout-flexbox-grid
title: CSS layout - the box model, flexbox and grid
subject: fullstack
module: web-platform
level: beginner
status: published
estimatedMinutes: 60
summary: Lay out any page with the cascade, the box model, flexbox and grid - which rule wins and why, how big a box really is, how flex items share a line, how grid tracks share a page, and when to choose flexbox or grid.
tags: [css, cascade, specificity, inheritance, cascade layers, box model, box-sizing, flexbox, grid, layout, frontend]

environment: |
  - **Standards (W3C, free to read):**
    [CSS Cascading and Inheritance Level 5](https://www.w3.org/TR/css-cascade-5/) (Candidate
    Recommendation, 13 January 2022) - the cascade sort order, cascade layers, inheritance and the
    `initial`, `inherit`, `unset`, `revert` and `revert-layer` keywords;
    [Selectors Level 4](https://www.w3.org/TR/selectors-4/) section 15 (Working Draft, 22 January 2026) -
    specificity; [CSS Box Model Level 3](https://www.w3.org/TR/css-box-3/) (Recommendation, 11 April 2024)
    and [CSS 2.1 section 8.3.1](https://www.w3.org/TR/CSS2/box.html#collapsing-margins) - the boxes and
    collapsing margins; [CSS Box Sizing Level 3](https://www.w3.org/TR/css-sizing-3/) - `box-sizing`;
    [CSS Flexible Box Layout Level 1](https://www.w3.org/TR/css-flexbox-1/) (Candidate Recommendation
    Draft, 14 October 2025); [CSS Grid Layout Level 2](https://www.w3.org/TR/css-grid-2/) (Candidate
    Recommendation Draft, 26 March 2025).
  - **HTML Standard:** the browser's default style for the `hidden` attribute -
    [section 15.3.1 Hidden elements](https://html.spec.whatwg.org/multipage/rendering.html#hidden-elements).
  - **Reference:** MDN Web Docs -
    [Introduction to the cascade](https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Cascade/Introduction),
    [Specificity](https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Cascade/Specificity),
    [@layer](https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/At-rules/@layer),
    [The box model](https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Styling_basics/Box_model),
    [Flexbox](https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/CSS_layout/Flexbox) and
    [Grids](https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/CSS_layout/Grids).
  - **Browsers:** everything here works in current Chrome, Edge, Firefox and Safari; cascade layers need
    browsers from 2022 or later. Check [MDN's compatibility tables](https://developer.mozilla.org/) if you
    support older ones.
  - **Examples:** quoted rules marked *SandPay Demo Shop* are real lines from this repository's
    fictional practice shop (`practice/shop/shop.css`, served at [shop](shop/index.html)). Open it with
    DevTools and inspect them yourself. Other snippets are illustrative.

prerequisites: [html-semantics-and-forms]

concepts:
  - id: css-cascade-specificity
    name: The cascade, specificity and inheritance
    summary: When several declarations set the same property on an element, the cascade picks one - by origin and importance, inline style, layer, specificity, then order of appearance; properties that nothing sets are inherited or take their initial value.
  - id: css-box-model
    name: The box model and box-sizing
    summary: Every element is a box of content, padding, border and margin; box-sizing decides whether width and height measure the content box or the border box, and vertical margins between blocks can collapse.
  - id: flexbox-layout
    name: Flexbox
    summary: A one-dimensional layout - items share a main axis; flex-grow, flex-shrink and flex-basis decide their sizes, justify-content aligns along the main axis and align-items across it.
  - id: css-grid-layout
    name: Grid layout and choosing between grid and flexbox
    summary: A two-dimensional layout of rows and columns - tracks sized with lengths, fr and minmax(), items placed by line or named area; grid for page structure and two-dimensional alignment, flexbox for content flowing in one direction.

objectives:
  - Predict which of several conflicting CSS declarations applies, by working through origin, importance, layers, specificity and order, and calculate a selector's specificity.
  - Calculate the rendered size of a box from its width, padding, border and box-sizing, and explain when vertical margins collapse.
  - Build a one-dimensional layout with flexbox, and explain how flex-grow, flex-shrink and flex-basis share the free space.
  - Build a responsive two-dimensional layout with grid using fr, minmax(), repeat() and named areas.
  - Choose flexbox or grid for a given layout and justify the choice.
  - Debug a layout bug in DevTools by reading the Styles, Computed and Layout panels.

sections:
  - id: intuition
    kind: intuition
    concepts: [css-cascade-specificity, css-box-model, flexbox-layout, css-grid-layout]
    title: The idea in plain language
    body: |
      Think of styling a page as **furnishing a house with many decorators**. The browser arrives first
      with sensible defaults, the user may have preferences (a bigger font), and you - the author - bring
      your own plans, often from several style sheets at once. When two of them disagree about the same
      wall, there must be a **rule for who wins**. That rule is the **cascade**.

      Every piece of furniture is a **box in a box**: the item itself (content), the bubble wrap around
      it (padding), the crate (border) and the space you leave around the crate (margin). If you order a
      crate "60 cm wide", you have to know whether that includes the bubble wrap - that is
      **`box-sizing`**.

      Then you arrange the boxes. **Flexbox** is a **shelf**: items sit in one row (or one column) and you
      decide how they share the spare space and line up. **Grid** is a **floor plan**: rows and columns
      at once, and each item is given its cell or region. Most real pages use both - grid for the
      rooms, flexbox for the things on each shelf.

  - id: what
    kind: what
    concepts: [css-cascade-specificity, css-box-model]
    title: What the terms mean
    body: |
      | Term | Precise meaning | Source |
      |---|---|---|
      | **Declaration** | a property and a value - `color: red` | CSS Cascade 5 |
      | **Cascade** | the algorithm that picks one value when several declarations set the same property on the same element | CSS Cascade 5, section 6 |
      | **Origin** | where a declaration comes from - **user agent** (the browser's defaults), **user**, or **author** (the site) | CSS Cascade 5, 6.2 |
      | **Cascade layer** | a named group of author styles created with `@layer`; layers are ordered, and the order beats specificity | CSS Cascade 5, 6.4 |
      | **Specificity** | a three-part weight (A, B, C) computed from a selector - IDs, then classes / attributes / pseudo-classes, then types / pseudo-elements | Selectors 4, section 15 |
      | **Inheritance** | an element takes the parent's value for an **inherited property** (such as `color`, `font-family`) that nothing sets on it | CSS Cascade 5, 7.2 |
      | **Initial value** | the value a property has when nothing sets it and it is not inherited (`box-sizing` is `content-box`) | each property's definition |
      | **Content / padding / border / margin box** | the four nested areas of every box | CSS Box Model 3 |
      | **`box-sizing`** | `content-box` (initial): `width` sizes the content; `border-box`: `width` includes padding and border | CSS Box Sizing 3 |

      **The cascade sort order** (CSS Cascade 5, 6.1), highest priority first - the first criterion that
      differs decides:

      1. **Origin and importance** - for normal declarations author beats user beats the browser; for
         `!important` the order is reversed (browser `!important` beats user `!important` beats author
         `!important`), and every `!important` beats every normal declaration. (Animations and transitions
         also sit in this list.)
      2. **Context** - styles inside a shadow tree versus outside it (relevant to web components).
      3. **Element-attached styles** - a `style="..."` attribute beats rules from style sheets of the same
         importance, **whatever their specificity**.
      4. **Layers** - for normal rules the **later** layer wins, and styles **not in any layer** count as
         the last layer, so they beat every layered style. For `!important` the order flips.
      5. **Specificity** - the higher (A, B, C) wins.
      6. **Order of appearance** - the last declaration wins.

      **Specificity** (Selectors 4, section 15): count **A** = ID selectors, **B** = class selectors,
      attribute selectors and pseudo-classes, **C** = type selectors and pseudo-elements; ignore `*`.
      Compare A first, then B, then C - so one ID beats any number of classes. `:is()`, `:not()` and
      `:has()` take the specificity of their **most specific** argument; `:where()` always counts as
      **zero**.

      | Selector | (A, B, C) |
      |---|---|
      | `button` | (0, 0, 1) |
      | `.site-header nav a` | (0, 1, 2) |
      | `button.secondary` | (0, 1, 1) |
      | `input[type='email']` | (0, 1, 1) |
      | `#pay-button` | (1, 0, 0) |
      | `:where(.card) h2` | (0, 0, 1) |

  - id: why
    kind: why
    concepts: [css-cascade-specificity, css-box-model]
    title: Why this matters to a full stack developer
    body: |
      Most "CSS is broken" bugs are not mysterious. They are one of four things:

      - **The wrong declaration won the cascade.** A component library's `.btn` rule beats yours because
        it is more specific or loaded later. The fix is knowing *why* it won - not adding `!important`
        until the problem moves elsewhere.
      - **The box is bigger than you think.** `width: 50%` plus `padding: 1rem` plus a border is more
        than half the row under the initial `content-box`, so two "half" columns wrap onto two lines.
      - **The wrong layout tool.** Floats and absolute positioning to build what flexbox or grid do in
        one rule - fragile, and broken by the first long product name.
      - **Not knowing what a layout algorithm does by default** - flex items that refuse to shrink below
        their content, grid tracks that stay empty, margins that collapse in block layout but not in
        flex.

      Every one of these is diagnosable in DevTools in minutes once you know the rules. That is also
      what front-end interviews probe: "why does this rule not apply?", "what is the difference between
      `auto-fill` and `auto-fit`?", "flexbox or grid?"

  - id: visual
    kind: visual
    concepts: [css-cascade-specificity]
    title: "Flowchart: which declaration wins?"
    body: |
      Work down the chart only as far as the first difference. Notice that **specificity is checked
      late** - origin, `!important`, inline styles and layers all come first, which is why a
      very specific selector can still lose.

      ```mermaid
      flowchart TD
          S[Two declarations set the same property on the same element] --> O{Different origin or importance?}
          O -- yes --> O1[Higher origin and importance wins - any !important beats any normal declaration]
          O -- no --> I{One in a style attribute?}
          I -- yes --> I1[The style attribute wins]
          I -- no --> L{Different cascade layers?}
          L -- yes --> L1[Normal - the later layer wins, unlayered counts as last. Important - the earlier layer wins]
          L -- no --> P{Different specificity?}
          P -- yes --> P1[Higher A, then B, then C wins]
          P -- no --> D[The one that appears last wins]
      ```

      If **no** declaration sets the property, the element **inherits** the parent's value (for
      inherited properties) or gets the **initial** value.

  - id: internals
    kind: internals
    concepts: [css-box-model]
    title: How a box is sized
    body: |
      ```mermaid
      flowchart LR
          M[margin - outside the border, transparent] --> B[border]
          B --> P[padding - inside the border, shows the background]
          P --> C[content - text, images, child boxes]
      ```

      With `width: 300px; padding: 16px; border: 2px solid`:

      | `box-sizing` | Content width | Width on screen (border box) |
      |---|---|---|
      | `content-box` (initial) | 300px | 300 + 2 × 16 + 2 × 2 = **336px** |
      | `border-box` | 300 − 32 − 4 = **264px** | **300px** |

      Margins are added **outside** in both cases. That is why so many style sheets start like the
      *SandPay Demo Shop*:

      ```css
      * {
        box-sizing: border-box;
      }
      ```

      `box-sizing` is **not inherited** (CSS Box Sizing 3 lists "Inherited: no"), so it is set on every
      element with `*` rather than once on `html`.

      **Collapsing margins.** In normal block layout, adjoining **vertical** margins of blocks collapse
      into one margin the size of the larger (CSS 2.1, 8.3.1): a heading with `margin-bottom: 24px` above
      a paragraph with `margin-top: 16px` are 24px apart, not 40px. Margins **do not collapse** between
      flex items or grid items, or between a flex or grid container and its contents (Flexbox 1, Grid 2).
      That is one reason `gap` on a flex or grid container is easier to predict than margins.

      **Inline versus block.** `width`, `height` and vertical margins do not apply to non-replaced inline
      boxes such as a `<span>`; use `display: inline-block`, `block`, or put it in a flex or grid
      container, where every child becomes a flex or grid item.

  - id: steps
    kind: steps
    concepts: [flexbox-layout]
    title: "Flexbox step by step: a header bar"
    body: |
      The *SandPay Demo Shop* header is a brand on the left and the navigation on the right, wrapping
      on narrow screens:

      ```css
      .site-header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem 1.25rem;
      }
      .brand {
        margin-right: auto;
      }
      ```

      1. **`display: flex`** makes the header a flex container; its children become **flex items**.
      2. **The main axis** follows `flex-direction` - `row` (the initial value) runs in the text
         direction, so left to right in English; `column` runs top to bottom. The **cross axis** is
         perpendicular to it.
      3. **`flex-wrap: wrap`** lets items move onto a new line when they don't fit; the initial `nowrap`
         keeps one line and shrinks or overflows.
      4. **`gap`** sets the space between items - here 0.5rem between lines and 1.25rem between items.
      5. **`align-items: center`** aligns items on the **cross axis** - vertically centred in a row.
         `justify-content` aligns them on the **main axis** (Flexbox 1, 8.2 and 8.3).
      6. **`margin-right: auto`** on the brand absorbs all the free space on its right, which pushes
         the navigation to the far end. Auto margins are applied before `justify-content` (Flexbox 1,
         8.1).

      **How items share space** - the `flex` shorthand is `flex-grow flex-shrink flex-basis`:

      | Shorthand | Means | Behaviour (Flexbox 1, 7.1.1) |
      |---|---|---|
      | `flex: initial` | `0 1 auto` - the initial value | sized by width or content, doesn't grow, may shrink |
      | `flex: auto` | `1 1 auto` | starts at its content size, then grows and shrinks |
      | `flex: none` | `0 0 auto` | fixed at its content size, never shrinks - can overflow |
      | `flex: 1` (any positive number) | `1 1 0%` | basis zero, so free space is shared **in proportion** to the numbers |

      The algorithm, simplified: take each item's **flex basis**; add them up; if there is space left,
      share it out by `flex-grow`; if there isn't enough, take it back in proportion to `flex-shrink`
      (weighted by the basis). Items never shrink below their **minimum size**, which for flex items
      defaults to their content's minimum (`min-width: auto`) - see the mistakes section.

  - id: example
    kind: example
    concepts: [css-grid-layout, flexbox-layout]
    title: "Grid in the real world: a product list that fits any screen"
    body: |
      The *SandPay Demo Shop* product list is one grid rule - no media queries:

      ```css
      .products {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 1rem;
      }
      ```

      Reading it from the inside out (Grid 2, section 7.2):

      - **`minmax(200px, 1fr)`** - each column is at least 200px and at most one **fraction** of the
        leftover space. The **`fr` unit** "represents a fraction of the leftover space in the grid
        container".
      - **`repeat(auto-fill, ...)`** - create as many columns as fit. A 960px container fits four
        (4 × 200 + 3 × 16 gap = 848px), and the spare space is shared by `1fr`; a 375px phone fits one.
      - **`gap: 1rem`** - gutters between rows and columns.

      **`auto-fill` versus `auto-fit`.** With only two products on a wide screen, `auto-fill` keeps the
      empty column tracks, so the two cards stay one-column wide. With `auto-fit`, "any empty repeated
      tracks are collapsed" after placement, so the two cards **stretch** across the whole row. Choose
      by how a sparse list should look.

      Inside each grid cell the card itself is a **flex column** - title, price and button stacked with
      a gap:

      ```css
      .product-card {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      ```

      That is the usual division of labour: **grid places the cards in two dimensions; flexbox stacks
      the content inside each card in one**.

  - id: code
    kind: code
    concepts: [css-grid-layout, css-cascade-specificity]
    title: Grid areas, layers and the defaulting keywords
    collapsed: true
    body: |
      **A page layout with named areas** (illustrative). Each string in `grid-template-areas` is a row;
      a name repeated across cells makes a rectangular area; `.` is an empty cell:

      ```css
      .page {
        display: grid;
        grid-template-columns: 240px 1fr;
        grid-template-rows: auto 1fr auto;
        grid-template-areas:
          'header header'
          'nav    main'
          'footer footer';
        min-height: 100vh;
        gap: 1rem;
      }
      .page > header { grid-area: header; }
      .page > nav    { grid-area: nav; }
      .page > main   { grid-area: main; }
      .page > footer { grid-area: footer; }

      @media (max-width: 600px) {
        .page {
          grid-template-columns: 1fr;
          grid-template-areas: 'header' 'nav' 'main' 'footer';
        }
      }
      ```

      The HTML stays in a meaningful reading order; only the CSS moves the areas. Placing by line numbers
      works too: `grid-column: 1 / 3` spans from line 1 to line 3, `grid-column: 1 / -1` spans the whole
      explicit grid.

      **Cascade layers** (illustrative). The first `@layer` statement fixes the order; later layers beat
      earlier ones for normal declarations, and unlayered styles beat all of them:

      ```css
      @layer reset, library, components;

      @layer library {
        #checkout .btn { background: gray; }   /* (1,1,0) but in an earlier layer */
      }
      @layer components {
        .btn { background: blue; }             /* (0,1,0) - wins: later layer */
      }
      ```

      The later layer wins **although** its selector is far less specific - layers are compared before
      specificity. This is how teams tame third-party CSS: put the library in an early layer.

      **The defaulting keywords** (CSS Cascade 5, section 7.3) work on any property:

      | Keyword | Effect |
      |---|---|
      | `initial` | the property's initial value |
      | `inherit` | the parent's value, even for non-inherited properties |
      | `unset` | `inherit` for inherited properties, `initial` for the rest |
      | `revert` | roll back to what the previous origin (for author styles: the browser's defaults) would give |
      | `revert-layer` | roll back to what the previous cascade layer would give |

  - id: line-by-line
    kind: line-by-line
    concepts: [css-cascade-specificity]
    title: "Line by line: why the shop needs one !important"
    body: |
      The *SandPay Demo Shop* hides its payment overlay with the HTML `hidden` attribute and shows it by
      removing the attribute:

      ```html
      <div class="overlay" data-testid="processing-overlay" role="status" hidden>
      ```

      ```css
      .overlay {
        position: fixed;
        inset: 0;
        display: flex;
      }
      [hidden] {
        display: none !important;
      }
      ```

      - **The browser's default style sheet** hides `[hidden]` elements with `display: none` (HTML
        Standard, 15.3.1). That rule is in the **user-agent origin**.
      - **`.overlay { display: flex }`** is a normal **author** declaration. Author normal beats
        user-agent normal at the very first step of the cascade - specificity never comes into it. Without
        the last rule, the overlay would be **visible on page load**, covering the checkout.
      - **`[hidden] { display: none !important }`** is an author `!important` declaration, which beats
        every normal declaration, so `hidden` hides again whatever `display` the element's class sets.

      This is one of the few places where `!important` is the right tool: a small, global **utility**
      rule whose whole job is to win. Using it to settle specificity fights between components is not.

  - id: when
    kind: when
    concepts: [css-grid-layout, flexbox-layout]
    title: Grid or flexbox - when to use which
    body: |
      Grid Layout 2 calls grid "a two-dimensional grid-based layout system"; flexbox lays items out along
      **one** main axis at a time. A practical rule:

      | Use **flexbox** when | Use **grid** when |
      |---|---|
      | content flows in **one direction** - a toolbar, a nav bar, a row of tags, a card's stacked content | you need **rows and columns to line up** - a product grid, a form with aligned labels, a dashboard |
      | item sizes should come **from the content** - each button as wide as its label | the **layout** decides sizes - columns of fixed proportions, regardless of content |
      | items should **wrap** naturally, each line on its own | wrapped items should still align in **columns** |
      | you push one item away with an auto margin | you place items in **named areas** or span cells |

      Neither replaces the other, and they nest freely: a grid item can be a flex container and vice
      versa. What they **do** replace: floats for layout, `inline-block` grids, table layouts for
      non-tabular content, and most absolute positioning. Keep `position: fixed` / `absolute` for things
      that truly sit on top - like the shop's overlay and toast.

      Not covered here: making layouts adapt with media queries, container queries and fluid units -
      that is the next lesson, [responsive, mobile-first design](#/lesson/responsive-design).

  - id: tests
    kind: tests
    concepts: [flexbox-layout, css-grid-layout, css-box-model]
    title: Positive and negative checks for a layout
    body: |
      Layout bugs show up with real data and real screens, not with "Lorem ipsum" on a laptop. Checks a
      developer (or tester) runs before calling a layout done:

      | ID | Condition | Expected | Evidence |
      |---|---|---|---|
      | P1 | typical content, 1280px wide | matches the design; grid columns aligned | screenshot; DevTools grid overlay |
      | P2 | 375px wide (a phone) | one column, **no horizontal page scroll** | screenshot; `document.documentElement.scrollWidth` equals `clientWidth` |
      | N1 | a very long word or URL in a flex item | item shrinks or wraps; nothing overflows the container | screenshot; Computed panel `min-width` |
      | N2 | one product only / none | sensible layout (`auto-fill` versus `auto-fit` chosen deliberately); an empty state | screenshot |
      | N3 | browser zoom 200% / large default font | text not clipped, nothing overlaps | screenshot at zoom |
      | N4 | element with the `hidden` attribute and a `display` class | stays hidden | Styles panel shows which rule won |
      | N5 | translated text 40% longer (German) | buttons and nav wrap, not cut off | screenshot |

      **DevTools makes the rules visible.** In Chrome or Firefox: the **Styles** panel lists matching
      rules in cascade order with losing declarations struck through; **Computed** shows the final value
      of each property and which rule supplied it, plus a diagram of the box's margin, border, padding
      and content; the **flex** and **grid** badges next to a container in the Elements panel draw
      overlays of lines, tracks, gaps and areas.

  - id: mistakes
    kind: mistakes
    concepts: [css-cascade-specificity, css-box-model, flexbox-layout, css-grid-layout]
    title: Common mistakes and how to debug them
    body: |
      - **Fixing a lost cascade with `!important`.** It moves the fight to the importance step, where the
        *next* override also needs `!important`. Find out why the other rule won: specificity, layer or
        order. Lower specificity (single classes, `:where()`) or a layer order fixes it for good.
      - **IDs in selectors.** One ID outweighs any number of classes, so ID-based rules become hard to
        override. Style with classes; keep IDs for links and scripts.
      - **Forgetting `box-sizing`.** `width: 50%` plus padding is wider than half under `content-box`.
      - **Expecting margins to collapse in flex or grid** - or being surprised that they do in block
        layout. Use `gap` in flex and grid.
      - **The flex item that won't shrink.** A flex item's minimum size defaults to its content's
        minimum (`min-width: auto`), so a long URL or a wide table forces overflow. Set `min-width: 0`
        on the item (or `overflow: hidden`, which also makes the automatic minimum zero - Flexbox 1,
        4.5).
      - **`flex: 1` versus `flex: auto`.** `flex: 1` (basis `0%`) makes items **equal** widths;
        `flex: auto` (basis `auto`) shares only the **leftover** space, so longer content stays wider.
      - **Mixing up the axes.** `justify-content` is the **main** axis; with `flex-direction: column`
        that is vertical. `align-items` is the cross axis.
      - **`auto-fill` when you wanted `auto-fit`** (or the reverse) - visible only with few items.
      - **Reordering with CSS so the visual order differs from the HTML order** (`order`, grid
        placement). Keyboard and screen-reader users follow the HTML. Keep them consistent.

      **Debugging method:** select the element in DevTools → **Computed** → find the property → it links
      to the rule that won. If that is the wrong rule, the **Styles** panel shows the losing declarations
      struck through - compare the two with the cascade order above. For a size problem, read the box
      diagram in Computed. For layout, turn on the flex or grid overlay. Change one value at a time in
      the panel until the bug disappears, then put that change in the source.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [css-cascade-specificity, css-grid-layout]
    title: Trade-offs and alternatives
    body: |
      - **Global CSS versus scoped CSS.** Plain style sheets share one cascade, so names can clash.
        CSS Modules, framework-scoped styles (Vue, Svelte), web components with shadow DOM and
        utility-class frameworks such as Tailwind all reduce clashes - but each still produces CSS that
        follows the cascade, so the rules in this lesson still decide the outcome.
      - **Layers versus naming conventions (BEM).** Conventions keep specificity flat by discipline;
        layers make the order explicit in the language. Layers need 2022-or-later browsers.
      - **Grid versus flexbox for card lists.** `repeat(auto-fill, minmax(...))` aligns columns across
        rows; `flex-wrap` lets each row size itself and can leave a last row with stretched or ragged
        items. Prefer grid when columns should line up.
      - **Subgrid** (Grid Layout 2) lets a nested grid reuse its parent's tracks - useful for aligning the
        prices of cards with different-length titles. Check browser support before relying on it.

  - id: summary
    kind: summary
    title: Summary and quick reference
    body: |
      - **Cascade:** origin and importance → context → style attribute → layers → specificity → order.
        Unlayered beats layered (normal); `!important` reverses origin and layer order.
      - **Specificity (A, B, C):** IDs / classes, attributes, pseudo-classes / types, pseudo-elements.
        `:where()` = 0; `:is()`, `:not()`, `:has()` = their most specific argument.
      - **Nothing set?** Inherited properties (`color`, `font-*`) come from the parent; others take their
        initial value. Keywords: `initial`, `inherit`, `unset`, `revert`, `revert-layer`.
      - **Box:** content → padding → border → margin. `box-sizing: border-box` makes `width` include
        padding and border. Vertical margins collapse in block layout, never in flex or grid.
      - **Flexbox:** one axis. `flex: grow shrink basis`; `flex: 1` = `1 1 0%`; `justify-content` main
        axis, `align-items` cross axis; `min-width: 0` lets an item shrink below its content.
      - **Grid:** two axes. `fr` = share of leftover space; `repeat(auto-fill | auto-fit, minmax(min,
        max))`; `grid-template-areas` for page structure.
      - **Choose:** grid for the page and aligned columns, flexbox for content in one direction - usually
        both.

exercises:
  - id: which-color-wins
    type: mcq
    concept: css-cascade-specificity
    skill: application
    title: Which declaration wins?
    prompt: |
      ```html
      <nav class="site-nav" id="main-nav"><a class="link active" href="/cart">Cart</a></nav>
      ```

      ```css
      #main-nav a       { color: navy; }    /* rule 1 */
      .site-nav .active { color: green; }   /* rule 2 */
      a.link.active     { color: orange; }  /* rule 3 */
      a                 { color: red; }     /* rule 4 */
      ```

      All four rules are in the same author style sheet, none in a layer, none `!important`. What colour
      is the link?
    options:
      - id: navy
        text: navy
        feedback: Correct - rule 1 is (1,0,1). One ID outweighs any number of classes, so it beats (0,2,0) and (0,2,1).
      - id: green
        text: green
        feedback: Rule 2 is (0,2,0) - two classes. Rule 1 has an ID, and A is compared before B.
      - id: orange
        text: orange
        feedback: Rule 3 is (0,2,1), the most classes plus a type - but specificity compares the ID count first, and rule 1 has one ID.
      - id: red
        text: red
        feedback: Rule 4 is last, but order of appearance only decides between equal specificities. (0,0,1) is the weakest here.
    correct: [navy]
    hints:
      - Write each selector's specificity as (IDs, classes, types).
      - Compare the first number first - only a tie moves you on to the second.
    solution: |
      Specificities: rule 1 `#main-nav a` = **(1,0,1)**; rule 2 = (0,2,0); rule 3 = (0,2,1); rule 4 =
      (0,0,1). Everything before specificity in the cascade is equal (same origin, no importance, no
      style attribute, no layers), so the highest specificity wins: **navy**. Confirm in DevTools: the
      Styles panel shows rules 2-4's `color` struck through.
    followUp: |
      Move rule 1 into `@layer base { ... }` and leave the others unlayered. What colour is the link now,
      and why does specificity no longer matter?

  - id: box-width
    type: mcq
    concept: css-box-model
    skill: application
    title: How wide is the card?
    prompt: |
      ```css
      .card {
        width: 320px;
        padding: 20px;
        border: 4px solid #d9dbe0;
        margin: 10px;
      }
      ```

      With **no** `box-sizing` rule anywhere, how wide is the card's border box on screen, and how much
      horizontal space does it take including its margins?
    options:
      - id: correct-368
        text: Border box 368px; 388px including margins
        feedback: Correct - under the initial content-box, 320 + 2 × 20 + 2 × 4 = 368px, plus 2 × 10px of margin = 388px.
      - id: border-box-320
        text: Border box 320px; 340px including margins
        feedback: That is what border-box would give. The initial value of box-sizing is content-box, so width sets the content only.
      - id: forgot-border
        text: Border box 360px; 380px including margins
        feedback: You added the padding but forgot the borders - both left and right borders (2 × 4px) count.
      - id: one-side
        text: Border box 344px; 354px including margins
        feedback: Padding, border and margin each apply on both sides - left and right.
    correct: [correct-368]
    hints:
      - What is the initial value of box-sizing, and what does width measure under it?
      - Count each of padding, border and margin twice - left and right.
    solution: |
      `box-sizing` is `content-box` initially, so `width: 320px` is the **content**. Border box = 320 +
      20 + 20 + 4 + 4 = **368px**; with margins 368 + 10 + 10 = **388px**. With `box-sizing: border-box`
      the border box would be exactly 320px and the content 320 − 48 = 272px. DevTools' box-model diagram
      in the Computed panel shows all four numbers.
    followUp: |
      Two such cards with `width: 50%` sit in a 800px flex container with `flex-wrap: wrap`. Do they fit
      on one line? What single change makes them fit?

  - id: flex-share
    type: mcq
    concept: flexbox-layout
    skill: analysis
    title: Equal columns that aren't equal
    prompt: |
      A checkout summary should show three equal-width columns. The developer wrote:

      ```css
      .summary { display: flex; }
      .summary > div { flex: auto; }
      ```

      With the content "Items", "Delivery to 42 Long Example Road" and "Total", the middle column is much
      wider. Why, and what fixes it?
    options:
      - id: basis-zero
        text: "`flex: auto` starts each item at its content size and shares only the leftover space; `flex: 1` (basis 0%) shares all the space, giving equal widths."
        feedback: "Correct - flex: auto is 1 1 auto, so the content width is the starting point; flex: 1 is 1 1 0%, so every item starts from zero and gets an equal share."
      - id: grow-bigger
        text: The middle item needs a smaller flex-grow, such as flex-grow 0.5.
        feedback: Tuning grow factors by hand fights the content and breaks when the text changes. The cause is the flex-basis, not the grow factor.
      - id: justify
        text: Add justify-content space-between to the container.
        feedback: "justify-content distributes free space between items; here flex: auto already absorbs all of it, and the widths stay unequal."
      - id: width
        text: Flexbox can't make equal columns; you must use grid.
        feedback: "Grid is a good option, but flexbox does equal columns with flex: 1 - the basis of zero is the key."
    correct: [basis-zero]
    hints:
      - "Expand the shorthand - what are grow, shrink and basis for `flex: auto`?"
      - Where does the algorithm start each item before sharing free space?
    solution: |
      `flex: auto` = `1 1 auto`: each item starts at its **content width**, then the leftover space is
      shared equally - so the long address stays longer. `flex: 1` = `1 1 0%`: every item starts at
      **zero**, so all the space is shared in proportion 1 : 1 : 1. If the address is too long to fit a
      third, also give the items `min-width: 0` so they may shrink below their content and wrap the text.
      Alternatively: `display: grid; grid-template-columns: repeat(3, 1fr)` - but note `1fr` has a
      minimum of `auto` too, so `minmax(0, 1fr)` is the exact grid equivalent.
    followUp: |
      Make the middle column twice as wide as the others, whatever the content. Which `flex` values do you
      use?

  - id: order-cascade
    type: order
    concept: css-cascade-specificity
    skill: recall
    title: The cascade sort order
    prompt: Put the cascade's criteria in the order they are checked - the first one that differs decides.
    items:
      - id: origin
        text: Origin and importance (browser, user, author; !important)
      - id: context
        text: Encapsulation context (shadow trees)
      - id: attached
        text: Element-attached styles (the style attribute)
      - id: layers
        text: Cascade layers
      - id: specificity
        text: Specificity
      - id: appearance
        text: Order of appearance
    hints:
      - Specificity is checked surprisingly late.
      - The last resort is the simplest - whichever comes last.
    solution: |
      Origin and importance → context → element-attached styles → layers → specificity → order of
      appearance (CSS Cascade 5, 6.1). Knowing that layers come before specificity explains why a
      `.btn` in a later layer beats `#checkout .btn` in an earlier one.

  - id: debug-hidden-overlay
    type: debug
    concept: css-cascade-specificity
    skill: analysis
    title: The overlay that is always visible
    prompt: |
      After a refactor, a fictional checkout page shows its grey "Processing..." overlay as soon as it
      loads, although the HTML has `<div class="overlay" hidden>`. The script only removes `hidden` after
      Pay is clicked. Click the line that explains why the overlay shows.
    language: css
    code: |
      @layer base, components;
      @layer base {
        [hidden] { display: none; }
      }
      .overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    correctLines: [3]
    lineNotes:
      - line: 8
        note: display flex is legitimate - the overlay must be flex when shown. The defect is that the hide rule loses to it.
      - line: 1
        note: Declaring the layer order is fine; what matters is which declarations are layered and which are not.
    hints:
      - Which of the two `display` declarations is in a layer, and which is not?
      - For normal declarations, how do unlayered styles compare with layered ones?
    solution: |
      **Line 3.** `[hidden] { display: none }` is in the `base` **layer**, while `.overlay { display:
      flex }` is **unlayered**. For normal declarations, unlayered styles count as the last layer and beat
      every layered style - before specificity is even compared. So `display: flex` wins and the overlay
      shows. Fix: `[hidden] { display: none !important; }` (for `!important`, the earlier layer wins, and
      any `!important` beats normal declarations) - the rule the SandPay Demo Shop uses. Confirm in
      DevTools: Computed → `display` shows `flex` from `.overlay`.
    followUp: |
      Would moving `.overlay` into the `components` layer also fix it? Explain with the layer order.

  - id: grid-for-dashboard
    type: short
    concept: css-grid-layout
    skill: application
    title: Write the grid for a responsive card list
    prompt: |
      Write the CSS for a list of order cards that shows as many columns as fit, each at least 260px wide,
      with 1.5rem gaps, where **two** cards on a wide screen **stretch to fill** the row. Then say in one
      sentence what changes if the client wants two cards to stay card-sized instead.
    hints:
      - You need repeat(), minmax() and one of the two auto-repeat keywords.
      - Which keyword collapses empty tracks?
    modelAnswer: |
      ```css
      .orders {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 1.5rem;
      }
      ```

      `auto-fit` collapses the empty repeated tracks after placement, so two cards share the whole row.
      To keep them card-sized, use `auto-fill`, which keeps the empty tracks.
    rubric:
      - Used display grid on the container
      - Used repeat() with minmax(260px, 1fr)
      - Chose auto-fit for stretching and explained it collapses empty tracks
      - Named auto-fill for keeping card-sized columns
      - Used gap rather than margins on the cards
    solution: |
      Compare with the model answer. The two keywords look the same with a full row of items - test with
      one or two items before choosing.
    followUp: |
      A card with a long unbroken order reference overflows its column. Which change to the track
      definition stops that?

  - id: flex-or-grid
    type: interview
    concept: css-grid-layout
    skill: analysis
    title: "Interview: flexbox or grid?"
    prompt: |
      *"When do you use flexbox and when do you use grid? Walk me through a page you have built."* Answer
      as you would in a front-end or full stack interview.
    hints:
      - Start from one dimension versus two.
      - Content-out versus layout-in sizing.
      - Give a concrete page with both.
    modelAnswer: |
      Flexbox lays items out along one axis - a row or a column - and sizes them from their content
      outwards: flex-basis, then grow or shrink to share the free space. It suits toolbars, navigation,
      button groups and the stacked content of a card, and things like pushing one item to the end with
      an auto margin.

      Grid is two-dimensional: I define rows and columns and place items into them, so the layout sizes
      the items. It suits page structure - header, sidebar, main, footer with grid-template-areas - and
      anything where columns must line up across rows, such as a product list with repeat(auto-fill,
      minmax(200px, 1fr)) that needs no media queries.

      In practice I use both: on a shop page, grid places the product cards, and each card is a flex
      column for title, price and button. I also keep the HTML in reading order and use CSS only for
      placement, because keyboard and screen-reader users follow the source order. And I prefer gap over
      margins because flex and grid margins don't collapse.
    rubric:
      - Said flexbox is one-dimensional and grid two-dimensional
      - Explained content-out (flex) versus layout-in (grid) sizing
      - Gave suitable examples for each
      - Mentioned using both together (nesting)
      - Mentioned a grid feature such as fr, minmax(), auto-fill or named areas
      - Mentioned an accessibility or maintainability concern (source order, gap)
    followUps:
      - What is the difference between auto-fill and auto-fit?
      - Why might a flex item overflow its container with a long URL, and how do you fix it?
      - How would you align the prices of cards whose titles have different lengths?
    solution: |
      Interviewers listen for the **one versus two dimensions** distinction and a **real example** - not
      "grid is newer so I always use it". The follow-ups test the details from the mistakes section.

  - id: shrink-overflow
    type: mcq
    concept: flexbox-layout
    skill: analysis
    title: Why does the row overflow on a phone?
    prompt: |
      On a 375px phone, an order row overflows sideways and the page scrolls horizontally:

      ```css
      .order-row { display: flex; gap: 1rem; }
      .order-row .reference { flex: 1; }   /* shows a 48-character reference with no spaces */
      .order-row .amount { flex: none; }
      ```

      DevTools' Computed panel shows `.reference` at 412px. What is the cause?
    options:
      - id: min-auto
        text: A flex item's minimum width defaults to its content's minimum (min-width auto), so the unbreakable reference won't shrink below its full length.
        feedback: Correct - the automatic minimum size of a flex item is content-based; min-width 0 (or overflow hidden) lets it shrink, and overflow-wrap anywhere lets the text break.
      - id: flex-none
        text: flex none on the amount forces the reference to grow.
        feedback: flex none keeps the amount at its own size; it doesn't make the reference wider. The reference itself refuses to shrink.
      - id: gap
        text: gap adds 1rem on every side, which pushes the row wider.
        feedback: gap is a single 1rem between the two items - 16px can't explain an item 412px wide.
      - id: wrap
        text: The row needs flex-wrap wrap; flex items never shrink without it.
        feedback: Flex items do shrink in a nowrap container (flex-shrink is 1 by default) - down to their minimum size. Wrapping would only move the amount to a new line.
    correct: [min-auto]
    hints:
      - flex 1 allows shrinking - so what stops it?
      - What is the default min-width of a flex item?
    solution: |
      `flex: 1` means `1 1 0%`, so the item may shrink - but never below its **minimum size**, and for a
      flex item `min-width: auto` resolves to its **content-based minimum** (Flexbox 1, 4.5): the width of
      the longest unbreakable string. Fix: `.reference { min-width: 0; overflow-wrap: anywhere; }` (or
      `overflow: hidden; text-overflow: ellipsis; white-space: nowrap` to truncate). Confirm: after the
      change, `scrollWidth` equals `clientWidth` on the document at 375px.
    followUp: |
      The same bug appears in a grid with `grid-template-columns: 1fr 120px`. Why, and what is the
      grid fix?

  - id: margins-collapse
    type: short
    concept: css-box-model
    skill: analysis
    title: The gap that changed
    prompt: |
      A form's fields are `<div class="field">` blocks with `margin: 12px 0`. In normal block layout the
      fields are 12px apart. After the container got `display: flex; flex-direction: column`, they are
      24px apart. Explain why, and give the cleaner way to space them.
    hints:
      - What happens to adjoining vertical margins in block layout?
      - Does that happen between flex items?
    modelAnswer: |
      In block layout, the bottom margin of one field and the top margin of the next are adjoining
      vertical margins, so they collapse into one 12px margin (CSS 2.1, 8.3.1). Margins of flex items do
      not collapse (Flexbox 1), so 12 + 12 = 24px. The cleaner way is to remove the margins and set
      `gap: 12px` on the flex container, which gives exactly 12px between items and none at the ends.
    rubric:
      - Explained that vertical margins collapse in block layout
      - Stated that margins don't collapse between flex items
      - Proposed gap on the container instead of margins
    solution: |
      Compare with the model answer. `gap` works the same way in flex and grid, which is why modern
      layouts space items with it rather than with margins.

placement:
  - id: place-specificity
    type: mcq
    concept: css-cascade-specificity
    skill: application
    title: Layer or specificity?
    prompt: |
      ```css
      @layer theme, overrides;
      @layer theme     { #pay.primary { background: blue; } }
      @layer overrides { button { background: green; } }
      button.primary   { background: orange; }
      ```

      All rules match `<button id="pay" class="primary">`. What is its background?
    options:
      - id: orange
        text: orange
        feedback: Correct - the unlayered rule counts as the last layer, which beats every layer for normal declarations, before specificity is compared.
      - id: blue
        text: blue
        feedback: "#pay.primary has the highest specificity, but layers are compared before specificity - and theme is the earliest layer."
      - id: green
        text: green
        feedback: overrides is the later of the two named layers, but unlayered styles count as an implicit final layer after it.
    correct: [orange]
    solution: |
      **Orange.** All three are normal author declarations, so the cascade reaches the **layers** step:
      `theme` < `overrides` < unlayered. The unlayered `button.primary` wins regardless of the
      `(1,1,0)` specificity of `#pay.primary` in `theme`.

  - id: place-box
    type: mcq
    concept: css-box-model
    skill: application
    title: Border box
    prompt: "With `box-sizing: border-box; width: 200px; padding: 10px; border: 5px solid;` how wide is the content area?"
    options:
      - id: w170
        text: 170px
        feedback: Correct - under border-box, width includes padding and border, so the content is 200 − 20 − 10 = 170px.
      - id: w200
        text: 200px
        feedback: That is the content width under content-box. With border-box, 200px is the outer border edge.
      - id: w230
        text: 230px
        feedback: 230px would be the border box under content-box (200 + 20 + 10). The question asks for the content width under border-box.
      - id: w185
        text: 185px
        feedback: Padding and border both apply on the left and the right - subtract each twice.
    correct: [w170]
    solution: |
      **170px.** `border-box` means `width` is the border box: 200 − (2 × 10 padding) − (2 × 5 border) =
      170px of content.

  - id: place-flex
    type: mcq
    concept: flexbox-layout
    skill: application
    title: Centre it
    prompt: |
      A flex container has `flex-direction: column` and a fixed height. You want its children centred
      **vertically**. Which property do you set?
    options:
      - id: justify
        text: "justify-content: center"
        feedback: Correct - with flex-direction column the main axis is vertical, and justify-content aligns along the main axis.
      - id: align-items
        text: "align-items: center"
        feedback: align-items works on the cross axis, which is horizontal in a column container - it would centre the children left to right.
      - id: text-align
        text: "text-align: center"
        feedback: text-align centres inline content such as text inside a box. It does not position flex items.
      - id: vertical-align
        text: "vertical-align: middle"
        feedback: vertical-align applies to inline-level and table-cell boxes. It has no effect on flex items.
    correct: [justify]
    solution: |
      **`justify-content: center`.** The axes follow `flex-direction`: in a column the **main** axis is
      vertical, and `justify-content` is the main-axis alignment.

  - id: place-grid
    type: mcq
    concept: css-grid-layout
    skill: application
    title: auto-fill or auto-fit
    prompt: |
      `grid-template-columns: repeat(auto-fit, minmax(200px, 1fr))` on a 1000px-wide container with two
      items, no gap. How wide is each item?
    options:
      - id: w500
        text: 500px each
        feedback: Correct - auto-fit creates four 200px tracks, then collapses the two empty ones, so the 1fr tracks share the full 1000px.
      - id: w250
        text: 250px each
        feedback: That is auto-fill - it keeps four tracks of 250px, two of them empty.
      - id: w200
        text: 200px each
        feedback: 200px is only the minimum of minmax(); the 1fr maximum shares the leftover space.
      - id: w1000
        text: 1000px each, on two rows
        feedback: Each item gets one track per row. Two items fit side by side, since each track can be as narrow as 200px.
    correct: [w500]
    solution: |
      **500px.** Four tracks fit at the 200px minimum. After placement, `auto-fit` collapses the two empty
      ones, so the two used `1fr` tracks share 1000px. With `auto-fill` the empty tracks remain and each
      item is 250px.

recall:
  - id: recall-cascade-order
    concept: css-cascade-specificity
    prompt: In what order does the cascade compare two declarations?
    answer: Origin and importance, context (shadow trees), element-attached (style attribute), cascade layers, specificity, order of appearance.
  - id: recall-specificity
    concept: css-cascade-specificity
    prompt: How is specificity calculated and compared?
    answer: (A, B, C) = IDs; classes, attributes and pseudo-classes; types and pseudo-elements. Compare A, then B, then C. :where() counts zero; :is(), :not() and :has() take their most specific argument.
  - id: recall-unlayered
    concept: css-cascade-specificity
    prompt: How do unlayered styles compare with layered styles?
    answer: For normal declarations, unlayered styles count as the last layer and beat every layered style. For !important declarations, the earliest layer wins and unlayered loses.
  - id: recall-box-sizing
    concept: css-box-model
    prompt: What does box-sizing border-box change?
    answer: width and height include padding and border, so the box's outer size is exactly what you set. The initial content-box sizes the content only.
  - id: recall-margin-collapse
    concept: css-box-model
    prompt: When do vertical margins collapse?
    answer: Between adjoining blocks in normal block layout, to the larger margin. Never between flex items or grid items.
  - id: recall-flex-1
    concept: flexbox-layout
    prompt: What do flex 1 and flex auto expand to, and how do they differ?
    answer: flex 1 is 1 1 0% - equal shares of all the space. flex auto is 1 1 auto - starts at content size and shares only the leftover space.
  - id: recall-flex-min
    concept: flexbox-layout
    prompt: Why does a flex item refuse to shrink below a long word, and what fixes it?
    answer: Its min-width defaults to auto, a content-based minimum. Set min-width 0 (or a non-visible overflow) so it can shrink.
  - id: recall-grid-vs-flex
    concept: css-grid-layout
    prompt: When do you choose grid over flexbox?
    answer: When rows and columns must line up together (two dimensions) or the layout should size the items - page structure, aligned card lists. Flexbox for content in one direction sized by its content.

