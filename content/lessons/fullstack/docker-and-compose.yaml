id: docker-and-compose
title: Containers with Docker and Compose
subject: fullstack
module: quality-and-delivery
level: intermediate
status: published
estimatedMinutes: 75
summary: Package the SandPay merchant API as an image and run it with PostgreSQL in a Compose stack - what images, layers and containers really are, a multi-stage Dockerfile for Node.js with a non-root user and a working build cache, why a container must handle SIGTERM (and why `CMD npm start` or the shell form hides it), health checks that mean something, and a compose.yaml whose database waits to be healthy and keeps its data.
tags:
  [
    docker,
    containers,
    images,
    layers,
    OCI,
    Dockerfile,
    multi-stage build,
    build cache,
    .dockerignore,
    non-root user,
    exec form,
    shell form,
    PID 1,
    SIGTERM,
    SIGKILL,
    graceful shutdown,
    docker stop,
    HEALTHCHECK,
    liveness,
    readiness,
    docker compose,
    compose.yaml,
    depends_on,
    service_healthy,
    volumes,
    bind mounts,
    networking,
    secrets,
    interpolation,
    postgres image,
  ]

environment: |
  - **No Docker on the machine that wrote this lesson.** Docker was not installed, so **no `docker` or
    `docker compose` output in this lesson was captured here.** Every Docker command output shown is quoted
    from the official documentation and labelled "from the Docker documentation". The Dockerfile and
    compose.yaml are **illustrative** - written to the documented behaviour, but not built or run here. What
    *was* run, on Linux in November 2026 with **Node.js 24** (v24.21.0, from this repository's `.nvmrc`):
    the signal and shutdown experiments with plain Node processes (outside a container), the `yaml` 2.9.1
    parsing output, and both practice exercises (Express 5.3, Vitest 5.0.3, supertest 7.3).
  - **Docker documentation (docs.docker.com, read November 2026):** [Dockerfile
    reference](https://docs.docker.com/reference/dockerfile/) (shell and exec form, CMD, ENTRYPOINT and how
    they interact, EXPOSE, ENV, ARG, USER, HEALTHCHECK, STOPSIGNAL); [Building best
    practices](https://docs.docker.com/build/building/best-practices/); [Multi-stage
    builds](https://docs.docker.com/build/building/multi-stage/); [Optimize cache usage in
    builds](https://docs.docker.com/build/cache/optimize/); [Build context and
    .dockerignore](https://docs.docker.com/build/concepts/context/); [Understanding the image
    layers](https://docs.docker.com/get-started/docker-concepts/building-images/understanding-image-layers/);
    [docker container stop](https://docs.docker.com/reference/cli/docker/container/stop/); [Running
    containers - exit status](https://docs.docker.com/engine/containers/run/#exit-status);
    [Volumes](https://docs.docker.com/engine/storage/volumes/).
  - **Compose:** the [Compose file reference - services](https://docs.docker.com/reference/compose-file/services/)
    (depends_on, healthcheck, init, ports, volumes, env_file, stop_grace_period), which implements the
    [Compose Specification](https://compose-spec.io/); [Interpolation](https://docs.docker.com/reference/compose-file/interpolation/);
    [Control startup and shutdown order](https://docs.docker.com/compose/how-tos/startup-order/); [Networking in
    Compose](https://docs.docker.com/compose/how-tos/networking/); [Secrets in
    Compose](https://docs.docker.com/compose/how-tos/use-secrets/); [Use Compose in
    production](https://docs.docker.com/compose/how-tos/production/); [docker compose
    down](https://docs.docker.com/reference/cli/docker/compose/down/).
  - **Image format:** the [OCI Image Format Specification](https://github.com/opencontainers/image-spec/blob/main/spec.md)
    - [image manifest](https://github.com/opencontainers/image-spec/blob/main/manifest.md) and [image
    configuration](https://github.com/opencontainers/image-spec/blob/main/config.md) (Entrypoint, Cmd, User,
    ExposedPorts, StopSignal).
  - **Official images:** [Docker and Node.js Best
    Practices](https://github.com/nodejs/docker-node/blob/main/docs/BestPractices.md) (signals and PID 1,
    the `node` user with uid 1000, `CMD ["node", ...]` instead of npm); the node image's
    [24/bookworm-slim Dockerfile](https://github.com/nodejs/docker-node/blob/main/24/bookworm-slim/Dockerfile)
    (it installs curl only to download Node, then purges it); the [postgres image
    documentation](https://hub.docker.com/_/postgres) (`POSTGRES_PASSWORD`, the `_FILE` variants, and the
    PostgreSQL 18 change of `PGDATA` and the volume to `/var/lib/postgresql`). Tags `node:24-slim` and
    `postgres:18` were current in the [official-images
    library](https://github.com/docker-library/official-images/tree/master/library) in November 2026
    (24.22.3 and 18.7). Tags move - check before you copy.
  - **Node.js:** [process signal events](https://nodejs.org/api/process.html#signal-events) (default
    SIGTERM/SIGINT handlers exit with 128 + signal number) and [http
    server.close / closeIdleConnections / closeAllConnections](https://nodejs.org/api/http.html#serverclosecallback).
  - **Fictional:** SandPay, its merchant API, image names such as `sandpay/merchant-api`, and every
    password and id. No real credentials appear anywhere.
  - **Not repeated here:** the Express app itself ([An Express HTTP API](#/lesson/express-http-server)), reading
    configuration ([The Node.js runtime and npm](#/lesson/node-runtime-and-npm)), pipelines that build and
    push images ([CI/CD for web applications](#/lesson/ci-cd-for-web-apps)) and production rollouts
    ([Deployment, configuration and environments](#/lesson/deployment-and-configuration)).

prerequisites:
  - node-runtime-and-npm
  - express-http-server
  - relational-modelling-and-sql

concepts:
  - id: container-images-and-dockerfiles
    name: Images, layers and Dockerfiles
    summary: An image is an ordered stack of read-only filesystem layers plus a configuration (entrypoint, command, user, environment, exposed ports) - the OCI image format. A Dockerfile builds it instruction by instruction, and the build cache reuses a layer only while the instruction and its files are unchanged, so copy the dependency manifests and install before copying the source. Multi-stage builds leave compilers and dev dependencies behind; .dockerignore keeps them out of the context; USER drops root; tags move, digests don't.
  - id: container-process-lifecycle
    name: The container's process, signals and health
    summary: A container is a process (PID 1 in its own namespace) running on the image's filesystem plus a thin writable layer that disappears with the container. docker stop sends SIGTERM, waits a grace period (10 s by default on Linux) and then SIGKILL - so the app must catch SIGTERM, stop accepting work, finish what is in flight and exit. Exec-form CMD runs node directly; shell form and npm start put a process in between that doesn't pass the signal on. HEALTHCHECK reports whether the app can serve; liveness and readiness are different questions.
  - id: compose-local-stack
    name: A local stack with Docker Compose
    summary: A compose.yaml declares services, networks and volumes. Services reach each other by service name on the project's default network, on the container port; published ports are for the host and bind to every interface unless you give 127.0.0.1. depends_on only orders start-up - add condition service_healthy plus a healthcheck to wait for readiness. Database data belongs on a named volume at the image's data directory; secrets come from secret files or ${VAR:?} interpolation, never literals in the file.

objectives:
  - Explain what an image, a layer, a container and a registry tag or digest are, using the OCI image format's manifest, layers and configuration.
  - Write a multi-stage Dockerfile for a Node.js API that caches dependency installs, excludes local files with .dockerignore, runs as a non-root user and starts node in exec form.
  - Trace what happens on docker stop - SIGTERM, grace period, SIGKILL - and implement a graceful shutdown with liveness and readiness endpoints that passes tests.
  - Write a compose.yaml for an API and PostgreSQL in which the API waits for a healthy database, data survives container re-creation, the database port is not exposed to the network and no secret is written in the file.
  - Diagnose common container failures - connection refused on localhost, a 10-second stop, lost database data, an always-reinstalling build - from their evidence.

sections:
  - id: intuition
    kind: intuition
    concepts: [container-images-and-dockerfiles, container-process-lifecycle]
    title: The idea in plain language
    body: |
      Think of a **ready meal from a factory kitchen**. The recipe card (the **Dockerfile**) lists the steps:
      start from a base sauce, add the vegetables, add the meat, seal. The factory follows it once and
      freezes the result in a sealed tray - the **image**. Every tray is identical; you can ship it to any
      kitchen with a microwave (a machine with a container runtime) and get the same meal, whatever that
      kitchen has in its cupboards.

      Heating one tray and eating it is a **container**: a running copy of the image. You can heat ten trays
      from the same batch at once. Whatever you add on your plate (salt, a spill) is gone when you wash the
      plate - the tray in the freezer never changes. That is why a container's own files are temporary and
      anything worth keeping - a database's data - goes into a separate, labelled box: a **volume**.

      **Compose** is the menu for a whole dinner: "the API, with PostgreSQL next to it, the database ready
      before the API sits down". One file, one command, and every developer and tester gets the same table.

      And when the restaurant closes (**docker stop**), the waiter politely says "we are closing" (SIGTERM)
      and, ten seconds later, turns off the lights whether you have finished or not (SIGKILL). An app that
      ignores the polite message loses whatever it was in the middle of.

  - id: what
    kind: what
    concepts: [container-images-and-dockerfiles, container-process-lifecycle, compose-local-stack]
    title: The vocabulary, precisely
    body: |
      | Term | Meaning |
      | --- | --- |
      | **Image** | An OCI image: a **manifest** naming one **configuration** and an ordered list of **layers** for one platform (an **image index** lists manifests for several platforms). Read-only. |
      | **Layer** | A filesystem changeset - files added, changed or deleted - stored as a (usually compressed) tar archive and identified by its digest. The manifest lists the base layer first, then the rest "in stack order". |
      | **Image configuration** | JSON with the defaults for running the image: `Entrypoint`, `Cmd`, `Env`, `User`, `WorkingDir`, `ExposedPorts`, `StopSignal`, `Volumes`. Each Dockerfile instruction such as `CMD` or `USER` sets one of these. |
      | **Container** | A running (or stopped) instance of an image: its process, plus a writable layer on top of the image's layers. Remove the container and the writable layer goes with it. |
      | **Registry, repository, tag, digest** | A registry stores images; `docker.io/library/postgres` is a repository; `:18` is a **tag** - a movable name; `@sha256:...` is a **digest** - the content hash, which never changes meaning. |
      | **Dockerfile** | The build instructions: `FROM`, `RUN`, `COPY`, `ENV`, `USER`, `CMD`... |
      | **Build context** | The files the builder may `COPY` from - usually `.`, minus what `.dockerignore` excludes. |
      | **Volume / bind mount** | Storage outside the container's writable layer. A **volume** is managed by Docker; a **bind mount** maps a host path. Both survive container removal. |
      | **Compose project, service** | A `compose.yaml` defines **services** (each backed by one or more identical containers), plus networks and volumes; `docker compose up` creates them as one project. |

      Two things people mix up:

      - **`EXPOSE` doesn't publish anything.** The Dockerfile reference calls it "a type of documentation"
        about which ports the app listens on; it sets `ExposedPorts` in the configuration. Publishing a port
        to the host is `-p 8080:3000` on `docker run`, or `ports:` in Compose.
      - **`RUN` vs `CMD`.** "`RUN` actually runs a command and commits the result; `CMD` doesn't execute
        anything at build time, but specifies the intended command for the image" (Dockerfile reference).

      Docker is one implementation of these formats. The image format and runtime are standardised by the
      **Open Container Initiative**, so images built by Docker also run in Podman, containerd or Kubernetes.

  - id: why
    kind: why
    concepts: [container-images-and-dockerfiles, compose-local-stack]
    title: Why a full stack developer - and a tester - wants containers
    body: |
      - **The same artefact everywhere.** The image that passed the tests in CI is the image that runs in
        staging and production - same Node version, same OS libraries, same files. "It works on my machine"
        becomes "it works in this image", and the image has a digest you can name in a bug report.
      - **A whole stack in one command.** A new developer or tester runs `docker compose up` and gets the API
        and PostgreSQL 18 at the right version, with the right extensions, without installing PostgreSQL.
        Tearing it down and starting clean takes seconds - perfect for test data that must start empty.
      - **Disposable environments.** Containers are meant to be "stopped and destroyed, then rebuilt and
        replaced with an absolute minimum set up and configuration" (Docker's building best practices,
        citing the Twelve-Factor App). Bugs that only appear when an instance restarts - lost uploads, lost
        sessions, a dropped request on shutdown - show up in development instead of in production.

      For a tester, this lesson is also a checklist of **container bugs** that ship surprisingly often: a
      stop that always takes exactly ten seconds, a health check that restarts the API whenever the database
      blips, a database whose data disappears on `docker compose down`, a secret readable with `docker
      history`, a database published to the whole network. Each one is visible if you know where to look.

  - id: layers
    kind: internals
    concepts: [container-images-and-dockerfiles]
    title: Layers, the build cache and why order matters
    body: |
      **Each instruction that changes files creates a layer.** The OCI manifest lists the layers "base layer
      at index 0" and then "in stack order", and the final filesystem "MUST match the result of applying the
      layers to an empty directory". At run time a union filesystem stacks them into one view and adds the
      container's own writable layer on top (Docker's *Understanding the image layers*). Layers are shared:
      ten images built `FROM node:24-slim` store the Node layers once.

      **The build cache.** Docker's cache page: "a layer is reused from the build cache if the instruction
      and the files it depends on hasn't changed since it was previously built" - and "a change causes a
      rebuild for steps that follow". So the order of instructions decides what a code change costs:

      | Order | You change one line of `src/` | Result |
      | --- | --- | --- |
      | `COPY . .` then `RUN npm ci` | the `COPY` layer changes | every following step reruns: a full reinstall on every build |
      | `COPY package.json package-lock.json ./`, `RUN npm ci`, then `COPY . .` | only the last `COPY` changes | the install is reused from cache; only the source copy and build rerun |

      **What gets into an image stays in it.** Deleting a file in a later `RUN` adds a "deleted" marker in a
      new layer; the bytes are still in the earlier layer and in every copy of the image. That is why:

      - **multi-stage builds** exist: "you can selectively copy artifacts from one stage to another, leaving
        behind everything you don't want in the final image" - compilers, dev dependencies, the TypeScript
        source;
      - **`.dockerignore`** matters: it removes files from the build context *before* it reaches the builder,
        so `node_modules`, `.git`, `.env` and test output can't be copied in by a broad `COPY . .`;
      - **secrets never go in `ENV` or `ARG`**: `ENV` values "persist when a container is run from the
        resulting image" and are visible with `docker inspect`; the reference warns that build arguments
        "are visible in the `docker history` command". For a build-time secret (a private npm token), the
        reference provides `RUN --mount=type=secret`, which mounts it for that one step only.

      **Pinning.** Docker's best-practices page: "Image tags are mutable" - `node:24-slim` will point at a
      newer 24.x next month. That is usually what you want (security fixes), and you get repeatability by
      pinning a **digest** (`FROM node:24-slim@sha256:...`) and letting a bot such as Dependabot raise pull
      requests to update it - "you're in control and you have an audit trail".

  - id: dockerfile-code
    kind: code
    concepts: [container-images-and-dockerfiles, container-process-lifecycle]
    title: A Dockerfile for the SandPay merchant API (illustrative)
    body: |
      The API is TypeScript compiled to `dist/` by `npm run build`. Written to the Dockerfile reference and
      the Node.js image's best practices; **not built here** (no Docker on this machine).

      ```dockerfile
      # syntax=docker/dockerfile:1

      # ---- build stage: dev dependencies and the TypeScript compiler live only here
      FROM node:24-slim AS build
      WORKDIR /app
      COPY package.json package-lock.json ./
      RUN npm ci
      COPY tsconfig.json ./
      COPY src ./src
      RUN npm run build

      # ---- runtime stage: production dependencies and compiled JavaScript only
      FROM node:24-slim AS runtime
      ENV NODE_ENV=production
      WORKDIR /app
      COPY package.json package-lock.json ./
      RUN npm ci --omit=dev && npm cache clean --force
      COPY --from=build /app/dist ./dist
      USER node
      EXPOSE 3000
      HEALTHCHECK --interval=10s --timeout=3s --start-period=20s --retries=3 \
        CMD ["node", "dist/healthcheck.js"]
      CMD ["node", "dist/server.js"]
      ```

      ```plaintext
      # .dockerignore
      node_modules
      dist
      .git
      .env
      *.log
      coverage
      Dockerfile
      compose*.yaml
      ```

      The health check script - the slim image has no curl (its Dockerfile installs curl to download Node
      and purges it again), and a Node script avoids adding a package just for health checks:

      ```typescript
      // src/healthcheck.ts - exit 0 when /healthz answers 200 within 2 s, otherwise exit 1
      fetch('http://127.0.0.1:3000/healthz', { signal: AbortSignal.timeout(2000) })
        .then((res) => process.exit(res.status === 200 ? 0 : 1))
        .catch(() => process.exit(1));
      ```

      Build and run (commands from the Dockerfile and CLI references; output not shown because it wasn't
      captured here):

      ```bash
      docker build -t sandpay/merchant-api:dev .
      docker run --rm -p 127.0.0.1:3000:3000 --env-file .env sandpay/merchant-api:dev
      docker build --target build -t sandpay/merchant-api:build .   # stop at the build stage, for debugging
      ```

  - id: dockerfile-lines
    kind: line-by-line
    concepts: [container-images-and-dockerfiles, container-process-lifecycle]
    title: Why each line is written that way
    body: |
      - **`# syntax=docker/dockerfile:1`** - a parser directive selecting the current Dockerfile frontend, as
        in every example in Docker's docs.
      - **Two `FROM ... AS` stages** - stages are numbered from 0, but naming them means "even if the
        instructions in your Dockerfile are re-ordered later, the `COPY` doesn't break" (multi-stage builds).
      - **`COPY package.json package-lock.json ./` then `RUN npm ci`** - the cache rule: dependencies reinstall
        only when the manifests change, not on every source edit. `npm ci` installs exactly the lockfile.
      - **`npm ci --omit=dev` in the runtime stage** - TypeScript, Vitest and ESLint stay in the build stage.
        Only `dist/` crosses over with `COPY --from=build`.
      - **`ENV NODE_ENV=production`** - the Node.js image's best practices ask for it; Express and many
        libraries switch to production behaviour. Not a secret, so `ENV` is fine.
      - **`USER node`** - the node images "provide the `node` user with uid 1000"; the best practices note
        that "by default, Docker runs commands inside the container as root". Put it after the `RUN`s that
        need root, and avoid switching back and forth.
      - **`EXPOSE 3000`** - documentation for whoever runs the image; it publishes nothing.
      - **`HEALTHCHECK ... CMD [...]`** - exit status 0 means healthy, 1 unhealthy ("2: reserved - don't use
        this exit code"). Defaults are `--interval=30s --timeout=30s --start-period=0s --retries=3`; failures
        during the start period don't count. Only the last `HEALTHCHECK` in a Dockerfile counts.
      - **`CMD ["node", "dist/server.js"]`** - **exec form**: a JSON array with double quotes, run without a
        shell, so `node` itself receives SIGTERM from `docker stop`. Not `CMD npm start`: the Node.js image's
        best practices say baking `node` into `CMD` "causes exit signals such as `SIGTERM` and `SIGINT` to be
        received by the Node.js process instead of npm swallowing them".

  - id: lifecycle
    kind: internals
    concepts: [container-process-lifecycle]
    title: What docker stop really does - and the ten-second stop
    body: |
      From the `docker container stop` reference: "The main process inside the container will receive
      `SIGTERM`, and after a grace period, `SIGKILL`." The first signal can be changed with `STOPSIGNAL` (or
      `--stop-signal`); the grace period with `--timeout` / `--stop-timeout`, and "if no default is
      configured for the container, the Daemon determines the default, and is 10 seconds for Linux
      containers, and 30 seconds for Windows containers". Compose's `stop_grace_period` also defaults to 10
      seconds.

      **Which process is "the main process"?** The one the image's `ENTRYPOINT`/`CMD` start - PID 1 inside
      the container. The reference's table of `ENTRYPOINT` / `CMD` combinations shows that shell form wraps
      the command in `/bin/sh -c`, and warns that shell-form `ENTRYPOINT` runs "as a subcommand of `/bin/sh
      -c`, which does not pass signals ... your executable doesn't receive a `SIGTERM` from `docker stop`".
      Its own example then shows the cost (output **from the Docker documentation**):

      ```plaintext
      $ /usr/bin/time docker stop test

      test
      real	0m 10.19s
      user	0m 0.04s
      sys	0m 0.03s
      ```

      Ten seconds: SIGTERM went to the shell, nothing happened, and the daemon sent SIGKILL when the grace
      period ran out. That exact "always 10 seconds" is the symptom to recognise.

      **Two more PID 1 details.** The Node.js image's best practices: "Node.js was not designed to run as PID
      1 which leads to unexpected behaviour when running inside of Docker. For example, a Node.js process
      running as PID 1 will not respond to `SIGINT` (`CTRL-C`) and similar signals" - unless it installs
      handlers. The fix they recommend is a tiny init process: `docker run --init`, or `init: true` in
      Compose, which "runs an init process (PID 1) inside the container that forwards signals and reaps
      processes". Either way, **your app still has to handle SIGTERM** - the init only delivers it.

      **What Node does with SIGTERM.** Node's docs: SIGTERM and SIGINT "have default handlers on non-Windows
      platforms that reset the terminal mode before exiting with code `128 + signal number`. If one of these
      signals has a listener installed, its default behavior will be removed." Without a listener, Node
      exits immediately - requests in flight are cut off, the database pool isn't closed. With a listener,
      Node doesn't exit at all until *you* make it.

      **Graceful shutdown, step by step:** mark the app as shutting down (so readiness fails and a load
      balancer stops sending traffic), `server.close()` to stop accepting connections, let requests in flight
      finish, close the database pool, exit 0 - and give up with exit 1 before the grace period ends, rather
      than be killed mid-write.

  - id: lifecycle-runs
    kind: code
    concepts: [container-process-lifecycle]
    title: Signals and shutdown - real runs with plain Node (no container)
    body: |
      These ran on Linux with Node 24.21.0, **outside any container** - they show what Node and the shell do
      with SIGTERM, which is exactly what happens inside one.

      **1. No handler: Node exits at once with 128 + 15.**

      ```javascript
      // plain.mjs
      import { createServer } from 'node:http';
      createServer((req, res) => res.end('ok')).listen(3000, () => console.log('listening on 3000'));
      ```

      ```plaintext
      $ node plain.mjs &  then kill -TERM
      listening on 3000
      [1]+  Terminated              node plain.mjs
      exit code: 143
      ```

      **2. A handler that drains: the request in flight (2 s) still gets its answer.**

      ```javascript
      // graceful.mjs - each request takes 2 seconds
      const server = createServer((req, res) => setTimeout(() => res.end('done'), 2000));
      server.listen(3000, () => console.log('listening on 3000'));
      process.on('SIGTERM', () => {
        console.log('SIGTERM received, closing the server');
        server.close(() => {
          console.log('server closed, exiting 0');
          process.exit(0);
        });
      });
      ```

      ```plaintext
      listening on 3000
      SIGTERM received, closing the server
      done <- response
      server closed, exiting 0
      exit code: 0
      ```

      **3. A shell in between: the signal stops at the shell, Node keeps running.** The machine's `/bin/sh`
      is dash 0.5.12, like the `/bin/sh` that shell-form `CMD` uses in Debian-based images:

      ```plaintext
      $ sh -c 'node plain.mjs; echo "node ended"' &
      listening on 3000
      shell pid 361302
          PID    PPID CMD
       361302  361100 sh -c node plain.mjs; echo "node ended"
       361304  361302 node plain.mjs
      [1]+  Terminated              sh -c 'node plain.mjs; echo "node ended"'
      after kill -TERM 361302:
          PID    PPID CMD
       361304    3586 node plain.mjs
      ```

      The shell died; Node never heard anything and was re-parented. In a container the shell is PID 1 and
      nothing reaps that Node - the stop ends with SIGKILL after 10 s. (Even `sh -c 'node plain.mjs'` with a
      single command kept `sh` as the parent on this machine; some shells replace themselves with the last
      command, some don't - so don't depend on it. Use exec form.)

      **4. The keep-alive trap.** `server.close()` "stops the server from accepting new connections and keeps
      existing connections"; since Node 19 it also closes connections that are idle *at that moment*. But a
      keep-alive connection whose request finishes *after* close() stays open until the client or the
      keep-alive timeout drops it. Measured with `fetch` (which keeps connections alive) and a 500 ms request:

      ```plaintext
      $ node ka.mjs
        115 ms  SIGTERM: server.close()
        544 ms  response: done
       3553 ms  server closed

      $ node ka.mjs fix      # also calls server.closeIdleConnections() every 100 ms
        115 ms  SIGTERM: server.close()
        540 ms  response: done
        618 ms  server closed
      ```

      Three wasted seconds of a ten-second budget. Behind a proxy that holds connections open, it can be all
      ten. The practice exercise makes you handle it.

  - id: health
    kind: internals
    concepts: [container-process-lifecycle]
    title: Health checks that mean something - liveness and readiness
    body: |
      The Dockerfile reference: a `HEALTHCHECK` "can detect cases such as a web server stuck in an infinite
      loop and unable to handle new connections, even though the server process is still running". A
      container's health status starts as `starting`, becomes `healthy` when a check passes and `unhealthy`
      after `--retries` consecutive failures. Compose can wait for `healthy` (`condition: service_healthy`);
      orchestrators can act on it.

      Two different questions hide in "is it healthy?":

      | | **Liveness** - `GET /healthz` | **Readiness** - `GET /readyz` |
      | --- | --- | --- |
      | Question | Can this process serve at all? | Should it get traffic right now? |
      | Checks | Only the process itself - the event loop answers | Dependencies it needs (a `SELECT 1` with a short timeout), and not shutting down |
      | Failing means | Restart it | Stop routing to it; don't restart |
      | Trap | Checking the database here: a database outage restarts every API container, in a loop | Never failing during shutdown: traffic keeps arriving at a closing server |

      Docker's own `HEALTHCHECK` has one status, so point it at **liveness** - unless something (Compose
      `service_healthy`, a load balancer) uses it to mean "ready", then decide consciously. Kubernetes has
      separate liveness and readiness probes; that is outside this lesson.

      Both endpoints should be cheap, unauthenticated only on an internal port or path, and never cached
      (`Cache-Control: no-store`). A health endpoint that takes the full 30 s default timeout to fail is
      worse than useless - set `--timeout` shorter than the interval.

  - id: visual-stop
    kind: visual
    concepts: [container-process-lifecycle]
    title: A graceful stop, and the forced one
    body: |
      Notice that the app has to finish **inside** the grace period, and that readiness fails first so new
      traffic goes elsewhere.

      ```mermaid
      sequenceDiagram
        participant D as Docker daemon
        participant N as node (PID 1)
        participant C as Client with a request in flight
        participant P as PostgreSQL pool
        D->>N: SIGTERM
        N->>N: shuttingDown = true, /readyz now 503
        N->>N: server.close() - no new connections
        C->>N: request in flight continues
        N-->>C: 200 response
        N->>N: closeIdleConnections() until the server is closed
        N->>P: pool.end()
        N->>D: exit 0 (well before 10 s)
        Note over D,N: If node is still running after the grace period
        D->>N: SIGKILL - no cleanup, requests cut off
      ```

  - id: compose
    kind: internals
    concepts: [compose-local-stack]
    title: Compose - services, names, ports, start-up order and data
    body: |
      **Networking by name.** "By default, Compose sets up a single network for your app. Each container for a
      service joins the default network and is both reachable by other containers on that network, and
      discoverable by its service name" (Networking in Compose). The network is `<project>_default`, the
      project name coming from the directory. So inside the API container the database is **`db:5432`** -
      not `localhost:5432`, which is the API container itself. "Networked service-to-service communication
      uses the `CONTAINER_PORT`. The host port is only used when accessing the service from outside the
      network." Always use names: container IPs change every time a container is recreated.

      **Published ports.** `ports: ["8001:5432"]` publishes container port 5432 as host port 8001. The
      reference warns: "If you do not specify a host IP (such as `127.0.0.1`), Docker binds to all interfaces
      (`0.0.0.0`), bypassing host firewall rules." A database published as `"5432:5432"` on a laptop on
      hotel Wi-Fi - or on a cloud VM - is reachable by others. Use `"127.0.0.1:5432:5432"`, or don't publish
      the database at all if only the API needs it. Quote port mappings: the reference says `HOST:CONTAINER`
      "should always be specified as a (quoted) string, to avoid conflicts with YAML base-60 float". Real
      output from the `yaml` package, 2.9.1:

      ```plaintext
      YAML 1.2 (default): {"ports":["22:22","22:22","5432:5432"]}
      YAML 1.1:           {"ports":[1342,"22:22","5432:5432"]}
      ```

      Under YAML 1.1 rules, unquoted `22:22` is the number 22 x 60 + 22 = 1342.

      **Start-up order is not readiness.** "On startup, Compose does not wait until a container is 'ready',
      only until it's running." `depends_on: [db]` (short syntax) just starts `db` first; PostgreSQL may still
      be initialising when the API's first query arrives. The long syntax with `condition: service_healthy`
      makes Compose wait for the dependency's **healthcheck** to pass - so the dependency needs one.
      `restart: true` also restarts the API when Compose restarts `db`. Your app should still retry its first
      connection: a dependency can restart later, and outside Compose nothing waits for you.

      **Data that survives.** A container's writable layer is destroyed with the container; "using a volume
      ensures that the data is persisted even if the container using it is removed" (Volumes). For the
      official postgres image the mount point changed in **PostgreSQL 18**: the image documentation says
      `PGDATA` is now `/var/lib/postgresql/18/docker` and "the defined `VOLUME` was changed in 18 and above to
      `/var/lib/postgresql`. Mounts and volumes should be targeted at the updated location." Mount at the old
      `/var/lib/postgresql/data` on 18 and the data is written to the image's anonymous volume instead - and
      is lost when the container is re-created. For 17 and below, mount at `/var/lib/postgresql/data`.

      **`down` and `down -v`.** `docker compose down` "stops containers and removes containers, networks,
      volumes, and images created by `up`" - but named volumes only with `-v` / `--volumes`, and "networks
      and volumes defined as external are never removed". `down -v` is the clean-slate button for tests,
      and the data-loss button by mistake.

      **Configuration and secrets.** Compose interpolates `${VAR}` from the shell and a `.env` file:
      `${VAR:-default}` gives a default, `${VAR:?message}` stops with an error if it is unset or empty, and
      `$$` is a literal `$`. "If Compose can't resolve a substituted variable and no default value is
      defined, it displays a warning and substitutes the variable with an empty string" - so required values
      deserve `:?`. For passwords, Compose **secrets** mount a file at `/run/secrets/<name>`, readable only by
      services granted it, because environment variables "can also be printed in logs when debugging errors
      without your knowledge". The postgres image reads `POSTGRES_PASSWORD_FILE` for exactly this.

  - id: compose-code
    kind: code
    concepts: [compose-local-stack]
    title: compose.yaml for the API and PostgreSQL 18 (illustrative)
    body: |
      Written to the Compose file reference; **not run here**. The `checkCompose` exercise finds no problems
      in this file.

      ```yaml
      services:
        api:
          build: .
          image: sandpay/merchant-api:dev
          init: true
          ports:
            - "127.0.0.1:3000:3000"
          environment:
            DATABASE_HOST: db                   # the service name, on the default network
            DATABASE_PORT: "5432"               # the CONTAINER port
            DATABASE_PASSWORD_FILE: /run/secrets/db_password
            SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
          depends_on:
            db:
              condition: service_healthy
              restart: true
          secrets:
            - db_password
          stop_grace_period: 15s

        db:
          image: postgres:18
          environment:
            POSTGRES_DB: sandpay
            POSTGRES_PASSWORD_FILE: /run/secrets/db_password
          healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d sandpay"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
          volumes:
            - db-data:/var/lib/postgresql       # PostgreSQL 18+: the parent directory
          ports:
            - "127.0.0.1:5432:5432"             # for your SQL client only; drop it if you don't need it
          secrets:
            - db_password

      volumes:
        db-data:

      secrets:
        db_password:
          file: ./db_password.txt               # in .gitignore and .dockerignore
      ```

      The everyday commands (from the Compose CLI reference):

      ```bash
      docker compose up --build -d     # build if needed, start in the background
      docker compose ps                # state and health of each service
      docker compose logs -f api       # follow one service's logs
      docker compose exec db psql -U postgres -d sandpay
      docker compose down              # remove containers and the network; keep db-data
      docker compose down -v           # ...and the named volumes: an empty database next time
      ```

      For production-like runs the Compose docs suggest a second file applied on top - `docker compose -f
      compose.yaml -f compose.production.yaml up -d` - that removes source-code bind mounts, changes ports and
      logging and adds a restart policy.

      What the reviewer exercise reports for a typical first draft (real output of the reference solution):

      ```plaintext
      healthy-dependency     api: wait for "db" with condition: service_healthy
      literal-secret         api: DATABASE_PASSWORD is written in the file - use a secret or ${DATABASE_PASSWORD:?}
      image-not-pinned       db: image "postgres" has no version tag - pin a tag or a digest
      literal-secret         db: POSTGRES_PASSWORD is written in the file - use a secret or ${POSTGRES_PASSWORD:?}
      db-port-public         db: port 5432 is published on every interface - bind it to 127.0.0.1
      db-data-not-persisted  db: mount a volume at /var/lib/postgresql or /var/lib/postgresql/data
      ```

  - id: steps
    kind: steps
    concepts: [container-images-and-dockerfiles, container-process-lifecycle, compose-local-stack]
    title: Containerising an API, step by step
    body: |
      1. **Make the app container-friendly first.** Configuration from environment variables, read once at
         start-up; logs to stdout; listen on `0.0.0.0` (inside the container `127.0.0.1` is unreachable from
         outside); a SIGTERM handler; `/healthz` and `/readyz`.
      2. **Write `.dockerignore`** before the Dockerfile: `node_modules`, `.git`, `.env`, build output,
         coverage.
      3. **Write a multi-stage Dockerfile**: pinned base image, manifests then `npm ci`, source, build; a
         runtime stage with production dependencies and the build output; `USER node`; exec-form `CMD`.
      4. **Build and inspect.** `docker image history` shows each layer and its size - and any build argument
         you shouldn't have used. `docker inspect` shows `User`, `Env`, `Cmd` and `Healthcheck` in the
         configuration.
      5. **Write `compose.yaml`**: the API, the database with a healthcheck and a named volume at its data
         directory, `service_healthy`, secrets, loopback-only ports.
      6. **Prove the lifecycle**: `docker compose up`, wait for `healthy`, send a slow request, `docker
         compose stop api` - the request completes and the stop takes well under 10 s.
      7. **Prove persistence**: create a row, `docker compose down` and `up` - the row is there; `down -v` -
         it's gone.
      8. **Put the image build in CI** - covered in [CI/CD for web applications](#/lesson/ci-cd-for-web-apps).

  - id: example
    kind: example
    concepts: [container-process-lifecycle, compose-local-stack]
    title: "Project example: \"payments sometimes fail during deploys\""
    body: |
      **Report:** during each deploy of the merchant API, a handful of refund requests fail with "connection
      reset" or 502 at the proxy, and two refunds were recorded in SandPay's ledger but never acknowledged to
      the merchant. Deploys replace containers one by one.

      **What a tester checks - with evidence:**

      1. **How long does a stop take?** `time docker compose stop api` in staging: 10.2 s, every time. A
         number that equals the grace period means the app didn't exit on SIGTERM - it was killed.
      2. **What is PID 1?** `docker compose exec api ps` (if the image has `ps`) or `docker inspect` the
         configuration: `Cmd` is `["/bin/sh","-c","npm start"]` - shell form and npm, two processes between
         Docker and Node. The app's "SIGTERM received" log line never appears in `docker compose logs api`.
      3. **Does the app drain?** After switching to `CMD ["node", "dist/server.js"]`, start a slow request
         (a refund against a delayed SandPay sandbox), stop the container, and check the response arrives and
         the log shows the shutdown sequence. Then check the stop time is a little over the slowest request,
         not 10 s.
      4. **Does readiness fail first?** Poll `/readyz` during the stop: it should answer 503 before the
         server closes, so the proxy stops sending new requests.
      5. **Is the refund idempotent?** The two "recorded but not acknowledged" refunds are the classic result
         of a request killed after the side effect. A retry from the merchant must not refund twice - see
         [Idempotency keys](#/lesson/idempotency-keys).

      **Bug report core:** "`docker compose stop api` always takes 10.2 s (grace period); image config `Cmd`
      is shell form `npm start`; no SIGTERM log; requests in flight are cut off (evidence: proxy 502 log
      lines at the stop timestamps, two ledger entries without responses)."

  - id: tests
    kind: tests
    concepts: [container-images-and-dockerfiles, container-process-lifecycle, compose-local-stack]
    title: Test cases for a containerised API
    body: |
      | # | Check | Steps | Expected result | Evidence |
      | --- | --- | --- | --- | --- |
      | 1 | Runs as non-root | `docker compose exec api id` | uid 1000 (`node`), not 0 | command output |
      | 2 | Graceful stop | slow request in flight, then `docker compose stop api` | response 200; exit within a few seconds; log shows shutdown sequence | timings, logs |
      | 3 | Readiness during shutdown | poll `/readyz` while stopping | 503 `shutting_down` before the port closes | poll log |
      | 4 | Liveness ignores the database | `docker compose stop db` | `/healthz` 200, `/readyz` 503 `db_unavailable`; API container not restarted | responses, `docker compose ps` |
      | 5 | Start-up order | `docker compose down -v && docker compose up` | API starts only after db is `healthy`; no connection errors in the API's first log lines | logs |
      | 6 | Data survives re-creation | insert a row; `down`; `up` | row present | query output |
      | 7 | Clean slate | `down -v`; `up` | empty schema (migrations only) | query output |
      | 8 | No secrets in the image | `docker image history --no-trunc`, `docker inspect` | no password, token or `.env` content | outputs |
      | 9 | No local files baked in | list `/app` in the image | no `.git`, `.env`, `node_modules` from the host, tests | listing |
      | 10 | Database not exposed | `ss -tlnp` (or `docker compose ps`) on the host | 5432 bound to 127.0.0.1 only, or not at all | output |
      | 11 | Cache works | change one source file, rebuild | dependency install step reported as cached | build log |

      **Negative cases:** start with `SESSION_SECRET` unset - Compose should refuse (`:?`) instead of starting
      with an empty secret; break the database password - `/readyz` 503 and a clear log line, not a crash loop;
      make `/readyz` slow - it answers 503 after its timeout instead of hanging the health check.

  - id: mistakes
    kind: mistakes
    concepts: [container-images-and-dockerfiles, container-process-lifecycle, compose-local-stack]
    title: Common mistakes and how to debug them
    body: |
      - **`ECONNREFUSED 127.0.0.1:5432` from the API container.** `localhost` is the API container. Use the
        service name (`db`) and the container port.
      - **The API crashes on start "sometimes".** `depends_on` without `service_healthy`, or no healthcheck on
        the database. Add both, and retry the first connection anyway.
      - **Every stop takes exactly 10 s.** Shell-form `CMD`, `npm start`, or no SIGTERM handler - check the
        image config and look for your shutdown log line.
      - **Every build reinstalls dependencies.** `COPY . .` before `npm ci`, or no `.dockerignore` so a changing
        file (logs, `.git`) invalidates the copy.
      - **"It works locally, not in the image."** The host's `node_modules` (built for another OS or
        architecture) was copied in - exclude it and install in the image.
      - **Database data vanished.** Volume at the wrong path for the image version (`/var/lib/postgresql` for
        18+), an anonymous volume, or someone ran `down -v`.
      - **Permission denied writing files.** After `USER node`, directories created earlier as root aren't
        writable - `COPY --chown=node:node` or create them before switching, and keep writes in volumes or
        `/tmp`.
      - **Secrets in `ENV`, `ARG` or a `COPY`'d `.env`.** They are in the image for anyone who pulls it.
      - **The container listens on 127.0.0.1.** The port is published but nothing answers: listen on
        `0.0.0.0` inside the container.
      - **Alpine surprises.** Alpine uses musl instead of glibc; native npm modules can behave differently.
        Prefer the slim Debian-based image unless you have tested Alpine.

      **Debugging method:** state first (`docker compose ps` - running? healthy? restart count?), then logs
      (`docker compose logs --since 5m api`), then configuration (`docker inspect` - `Cmd`, `User`, `Env`,
      mounts, health log: the health check's output is kept, up to 4096 bytes), then inside (`docker compose
      exec api sh` if the image has a shell). Change one thing, rebuild, re-check the same evidence.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [container-images-and-dockerfiles, compose-local-stack]
    title: Limits, trade-offs and alternatives
    body: |
      - **Compose is not an orchestrator.** It runs a project on one Docker host. Production across many
        machines - rolling updates, rescheduling, autoscaling - is Kubernetes, ECS, Nomad or a platform
        service; see [Deployment, configuration and environments](#/lesson/deployment-and-configuration).
      - **Smaller images vs debuggability.** `slim` drops compilers and docs; distroless-style images drop the
        shell too - fewer vulnerabilities to patch, but no `sh` to `exec` into. Pick per environment.
      - **Tags vs digests.** Tags give automatic fixes but unrepeatable builds; digests give repeatability but
        need an update bot.
      - **Containers aren't a security boundary like a VM.** They share the host kernel. Non-root, no
        unnecessary capabilities and patched base images reduce risk; they don't remove it.
      - **Bind-mounting source for live reload** is great for development (Compose also has `develop.watch`),
        and should never reach production - the production file removes it.
      - **Docker Desktop, Podman, Colima.** Licensing and platforms differ; the images and the Compose file
        format are portable between them, but check each tool's own docs for Compose support.
      - **Testcontainers vs Compose for tests.** Compose gives a shared stack; Testcontainers starts
        throw-away containers from test code per suite - better isolation, slower start. PGlite (used in this
        course's practice project) avoids containers altogether for many database tests.

  - id: summary
    kind: summary
    concepts: [container-images-and-dockerfiles, container-process-lifecycle, compose-local-stack]
    title: Quick reference
    body: |
      - **Image** = OCI manifest + config + ordered read-only layers. **Container** = a process on those layers
        plus a writable layer that dies with it.
      - Order the Dockerfile for the cache: manifests, `npm ci`, then source. Multi-stage; `.dockerignore`;
        `USER node`; no secrets in `ENV`/`ARG`; tags move, digests don't.
      - `EXPOSE` documents; `-p` / `ports:` publishes - to `127.0.0.1` unless you mean every interface.
      - `docker stop`: SIGTERM, grace period (10 s default on Linux), SIGKILL. Exec-form `CMD ["node", ...]`,
        no `npm start`, optionally `init: true`.
      - Graceful shutdown: readiness 503, `server.close()`, reap idle keep-alive connections, close the pool,
        exit 0 - with a forced exit 1 before the grace period ends.
      - `HEALTHCHECK` exit 0 healthy, 1 unhealthy; liveness never checks the database; readiness does.
      - Compose: services find each other by **name** on the **container** port; `depends_on` +
        `condition: service_healthy` + a healthcheck; named volume at the image's data directory
        (`/var/lib/postgresql` for postgres 18+); `${VAR:?}` and secrets files; `down -v` deletes data.

exercises:
  - id: cache-order
    type: mcq
    concept: container-images-and-dockerfiles
    skill: application
    title: The build that always reinstalls
    prompt: |
      The API's Dockerfile runtime stage reads:

      ```dockerfile
      FROM node:24-slim
      WORKDIR /app
      COPY . .
      RUN npm ci --omit=dev
      CMD ["node", "dist/server.js"]
      ```

      Every build takes four minutes, almost all in `npm ci`, even when only one line of `src/` changed.
      What is the best fix?
    options:
      - id: split-copy
        text: Copy package.json and package-lock.json, run npm ci, then copy the rest - and add a .dockerignore for node_modules, .git and logs.
        feedback: Correct - the install layer now depends only on the manifests, so a source change reuses it from cache; .dockerignore stops unrelated files from invalidating copies.
      - id: no-cache
        text: Build with --no-cache so the cache can't be stale.
        feedback: That disables the cache entirely - every step reruns every time. It's for deliberately clean builds, not for speed.
      - id: npm-install
        text: Use npm install instead of npm ci; it is faster because it reuses node_modules.
        feedback: There is no node_modules to reuse in a fresh layer, and npm install may change the lockfile. The problem is the cache invalidation, not the npm command.
      - id: bigger-base
        text: Switch to node:24 (the full image) which has more packages preinstalled.
        feedback: The base image isn't what reruns; the npm ci layer reruns because the COPY above it changed.
    correct: [split-copy]
    hints:
      - Which layer changes when a source file changes?
      - The cache reuses a step only if the step and everything before it are unchanged.
    solution: |
      `COPY . .` makes the next layer depend on **every** file in the context, so any edit invalidates the
      install. Docker's cache guide gives exactly this fix: copy the package management files, install, then
      copy the source. Confirm it by rebuilding after a one-line change: the install step is reported as
      cached. A `.dockerignore` keeps `.git`, logs and the host's `node_modules` from changing the context.
    followUp: |
      After the fix, builds are fast, but upgrading one dev dependency (only used in the build stage)
      reinstalls the runtime stage's dependencies too. Why, and is that a problem?

  - id: localhost-in-container
    type: mcq
    concept: compose-local-stack
    skill: analysis
    title: ECONNREFUSED in the stack
    prompt: |
      With the stack running, the API logs `Error: connect ECONNREFUSED 127.0.0.1:5432` on every request.
      From the host, `psql -h localhost -p 5432` works. The API's environment has
      `DATABASE_URL=postgres://sandpay@localhost:5432/sandpay`; the db service publishes `"127.0.0.1:5432:5432"`.
      What is wrong?
    options:
      - id: name
        text: Inside the API container, localhost is the API container itself - use the service name, db:5432.
        feedback: Correct - containers reach each other by service name on the project network; the published port is for the host.
      - id: publish-all
        text: The port is bound to 127.0.0.1; publish it as "5432:5432" so the API can reach it.
        feedback: Publishing affects the host, not other containers. It would also expose the database to the network - and the API would still be dialling its own localhost.
      - id: not-ready
        text: The database isn't ready yet; add depends_on with service_healthy.
        feedback: It fails on every request, long after start-up, and the host can connect - so the database is up. Readiness ordering matters, but this is an address problem.
      - id: expose
        text: The postgres image is missing EXPOSE 5432.
        feedback: EXPOSE is documentation; containers on the same network can reach any port the process listens on.
    correct: [name]
    hints:
      - Which machine does "localhost" mean for a process in a container?
      - How does Compose let services find each other?
    solution: |
      Each container has its own network namespace, so `127.0.0.1` in the API container is the API. Compose
      puts both services on `<project>_default` and registers their names in its DNS: use
      `postgres://sandpay@db:5432/sandpay` (the **container** port). The host works because the published
      port maps the host's 127.0.0.1:5432 to the container. Confirm with `docker compose exec api getent
      hosts db` (if the image has getent) or by changing the URL and watching the error disappear.

  - id: stop-sequence
    type: order
    concept: container-process-lifecycle
    skill: recall
    title: The order of a graceful stop
    prompt: |
      Put the steps of `docker compose stop api` with a graceful Node app in order.
    items:
      - id: sigterm
        text: Docker sends SIGTERM to the container's main process
      - id: flag
        text: The app marks itself as shutting down, so /readyz answers 503
      - id: close
        text: server.close() stops accepting new connections
      - id: drain
        text: Requests in flight finish and idle keep-alive connections are closed
      - id: pool
        text: The database pool is closed
      - id: exit
        text: The process exits with code 0, before the grace period ends
    hints:
      - The signal comes first; the exit code comes last.
      - Stop new traffic before closing what the old traffic uses.
    solution: |
      SIGTERM → mark shutting down (readiness fails) → `server.close()` → drain in-flight requests and reap
      idle keep-alive connections → close the pool → exit 0. If anything hangs, the app forces exit 1 itself
      before the daemon's SIGKILL at the end of the grace period.

  - id: debug-dockerfile
    type: debug
    concept: container-process-lifecycle
    skill: analysis
    title: Why does every stop take ten seconds?
    prompt: |
      `docker stop` on this image always takes about 10 seconds, and the app's "SIGTERM received" log line
      never appears - although `dist/server.js` does register a SIGTERM handler. Click the line that causes it.
    language: dockerfile
    code: |
      FROM node:24-slim
      ENV NODE_ENV=production
      WORKDIR /app
      COPY package.json package-lock.json ./
      RUN npm ci --omit=dev
      COPY dist ./dist
      USER node
      EXPOSE 3000
      HEALTHCHECK --interval=10s --timeout=3s CMD ["node", "dist/healthcheck.js"]
      CMD npm start
    correctLines: [10]
    lineNotes:
      - line: 9
        note: The health check runs in a separate process every 10 s; it has nothing to do with which process receives SIGTERM.
      - line: 7
        note: Running as node is good practice. A non-root process still receives signals sent to it.
      - line: 8
        note: EXPOSE only documents the port; it doesn't affect stopping.
    hints:
      - Which process is PID 1 in this container?
      - Shell form wraps the command in /bin/sh -c - and what does npm start add?
    solution: |
      **Line 10.** Shell form runs `/bin/sh -c "npm start"`, so PID 1 is a shell, which starts npm, which
      starts node. The Dockerfile reference warns that `/bin/sh -c` "does not pass signals"; the Node.js image
      best practices add that npm swallows them. SIGTERM never reaches node; after the 10 s grace period the
      daemon sends SIGKILL. Fix: `CMD ["node", "dist/server.js"]`. Confirm with `docker inspect` (Cmd) and a
      timed stop that now finishes in well under a second with the log line present.

  - id: ten-seconds-evidence
    type: mcq
    concept: container-process-lifecycle
    skill: analysis
    title: Stops take 10.2 s - after the CMD fix
    prompt: |
      The image now uses `CMD ["node", "dist/server.js"]`. `docker compose stop api` with no traffic takes
      0.3 s. But during a load test it takes 10.2 s, the log shows "SIGTERM received, shutting down" at once
      and no "server closed" line. The load generator keeps HTTP keep-alive connections open. The handler is:

      ```javascript
      process.on('SIGTERM', () => {
        log('SIGTERM received, shutting down');
        server.close(async () => { await pool.end(); log('server closed'); process.exit(0); });
      });
      ```

      What is the most likely cause?
    options:
      - id: keepalive
        text: Keep-alive connections that become idle after close() are never closed, so close()'s callback waits until the grace period ends in SIGKILL.
        feedback: Correct - close() stops new connections and closes only those idle at that moment; the rest linger. Reap them with closeIdleConnections() and add a forced exit before the grace period.
      - id: still-shell
        text: node still isn't PID 1.
        feedback: The handler ran - the log line appeared - so node received SIGTERM.
      - id: pool
        text: pool.end() hangs.
        feedback: Possible in general, but pool.end() only runs inside close()'s callback, and "server closed" timing would show it. With no traffic the whole sequence takes 0.3 s.
      - id: grace
        text: The grace period is too short; set stop_grace_period to 60s.
        feedback: That would make each stop take up to 60 s instead. The server isn't busy - it is waiting for connections that will never close by themselves.
    correct: [keepalive]
    hints:
      - What differs between the fast stop and the slow one?
      - What exactly does server.close() wait for?
    solution: |
      Only under load, with keep-alive clients, and the close callback never runs: `server.close()` waits for
      every connection to end, and since Node 19 it closes only the connections idle at the moment it is
      called. Connections that finish a request later stay open (in this lesson's run, about 3 s; with a
      client that keeps them longer, past the grace period). Confirm by counting open sockets during the stop
      (`server.getConnections`) or logging when each closes. Fix: call `server.closeIdleConnections()`
      periodically while shutting down, and add a forced `closeAllConnections()` and exit 1 shortly before the
      grace period.

  - id: liveness-db
    type: mcq
    concept: container-process-lifecycle
    skill: application
    title: The health check that restarts everything
    prompt: |
      An orchestrator restarts containers whose health check fails. The team's `/healthz` runs `SELECT 1` and
      returns 500 if it fails. During a 2-minute database failover, all eight API containers restart
      repeatedly, and after the database returns they take another minute to be ready. What should change?
    options:
      - id: split
        text: Make /healthz (liveness) check only the process; move the database check to /readyz (readiness), which stops traffic without restarting.
        feedback: Correct - a restart can't fix a database outage. Readiness failing keeps the containers alive and ready to serve as soon as the database is back.
      - id: retries
        text: Keep the check but raise --retries to 20.
        feedback: That delays the restarts; a longer outage still restarts everything, and a genuinely stuck process is now detected much later.
      - id: remove
        text: Remove the health check; containers restart when they crash anyway.
        feedback: A process can be alive but stuck (an infinite loop, a blocked event loop) - exactly what HEALTHCHECK exists to catch.
      - id: cache
        text: Cache the health result for 5 minutes.
        feedback: Health answers must be fresh; a cached "healthy" hides a stuck process and a cached "unhealthy" keeps failing after recovery.
    correct: [split]
    hints:
      - Would restarting the API fix the database?
      - Which question does the orchestrator act on by restarting?
    solution: |
      Separate the questions. **Liveness** - can this process answer at all? - drives restarts, so it must not
      depend on anything a restart can't fix. **Readiness** - should it get traffic? - checks the database
      with a short timeout and fails during the outage, so traffic stops but the containers stay up.

  - id: pg18-volume
    type: mcq
    concept: compose-local-stack
    skill: analysis
    title: The test data that disappears
    prompt: |
      A tester's stack uses:

      ```yaml
      db:
        image: postgres:18
        volumes:
          - pgdata:/var/lib/postgresql/data
      ```

      with `pgdata` declared. After `docker compose down` and `up` (no `-v`), the seeded merchants are gone.
      `docker volume ls` shows `pgdata` and an extra volume with a long hexadecimal name. Why?
    options:
      - id: path
        text: For PostgreSQL 18 the image's data directory and VOLUME moved to /var/lib/postgresql, so the data went to an anonymous volume, which a re-created container doesn't reuse.
        feedback: Correct - the postgres image docs say 18+ uses PGDATA /var/lib/postgresql/18/docker with the VOLUME at /var/lib/postgresql; mount the named volume there.
      - id: down
        text: docker compose down always deletes volumes.
        feedback: Named volumes are removed only with -v / --volumes; pgdata still exists, as docker volume ls shows.
      - id: init
        text: The image re-runs initdb on every start and wipes the data.
        feedback: The image initialises only an empty data directory. The data directory was empty because it was never on the named volume.
      - id: bind
        text: Named volumes don't persist; only bind mounts do.
        feedback: Volumes are Docker's preferred persistent storage; they outlive containers.
    correct: [path]
    hints:
      - What is the extra volume with a hexadecimal name?
      - Where does PostgreSQL 18 in the official image keep its data?
    solution: |
      The hexadecimal volume is an **anonymous volume** - created for the image's own `VOLUME` because nothing
      was mounted at that path. From 18, the postgres image documents `PGDATA=/var/lib/postgresql/18/docker`
      and `VOLUME /var/lib/postgresql`; the mount at `/var/lib/postgresql/data` was beside the data, not on
      it. Confirm with `docker compose exec db sh -c 'echo $PGDATA'` and by inspecting the container's mounts.
      Fix: `pgdata:/var/lib/postgresql`. (For 17 and below the old path is right.)

  - id: compose-check
    type: coding
    concept: compose-local-stack
    skill: application
    title: A reviewer for compose.yaml files
    prompt: |
      In `compose-check.ts`, implement `checkCompose(yamlText)`. Parse the file with the `yaml` package and
      return one problem per finding for nine rules: no services, an unpinned image, an unknown dependency,
      a database dependency that doesn't wait for `service_healthy`, a `service_healthy` dependency without a
      usable healthcheck, a literal secret in `environment` (mapping or list), the database port published on
      every interface (short and long syntax), database data not on a volume at the right directory for the
      postgres version, and an undeclared named volume. The doc comment gives the exact rules.
    project: fullstack
    files:
      - exercises/docker/compose-check.ts
    test: tests/docker/compose-check.test.ts
    command: npx vitest run tests/docker/compose-check.test.ts
    hints:
      - Normalise first - depends_on (list or map), environment (map or list of NAME=value), volumes (string or object), ports (number, string or object) - then apply the rules to the normalised form.
      - "The image tag is after the last \":\" that comes after the last \"/\" - \"registry.example:5000/api\" has no tag."
      - Collect the services that others wait for with service_healthy in a Set, and check their healthchecks after the loop - that reports each once.
      - "For the data directory, read the tag's leading number: 18 or more needs /var/lib/postgresql, less needs /var/lib/postgresql/data, no number accepts either."
    modelAnswer: |
      ```typescript
      export function checkCompose(yamlText: string): ComposeProblem[] {
        const doc = asRecord(parse(yamlText));
        const services = asRecord(doc?.services);
        if (!services || Object.keys(services).length === 0)
          return [{ rule: 'no-services', message: 'the file has no services' }];
        const problems: ComposeProblem[] = [];
        const add = (rule: RuleId, service: string, message: string) => problems.push({ rule, service, message });
        const declaredVolumes = new Set(Object.keys(asRecord(doc?.volumes) ?? {}));
        const needsHealthcheck = new Set<string>();

        for (const [name, raw] of Object.entries(services)) {
          const service = asRecord(raw) ?? {};
          const image = typeof service.image === 'string' ? service.image : undefined;
          if (image !== undefined && !isPinned(image)) add('image-not-pinned', name, `image "${image}" has no version tag`);
          for (const [dependency, condition] of dependencies(service.depends_on)) {
            if (!(dependency in services)) { add('unknown-dependency', name, `no service "${dependency}"`); continue; }
            if (condition === 'service_healthy') needsHealthcheck.add(dependency);
            else if (isDatabase(asRecord(services[dependency])?.image)) add('healthy-dependency', name, `wait for "${dependency}"`);
          }
          for (const [variable, value] of environment(service.environment))
            if (/(PASSWORD|SECRET|TOKEN|API_KEY)$/.test(variable) && value !== '' && !value.includes('${'))
              add('literal-secret', name, `${variable} is written in the file`);
          const mounts = volumeMounts(service.volumes);
          for (const volume of new Set(mounts.filter((m) => m.named && !declaredVolumes.has(m.source)).map((m) => m.source)))
            add('undeclared-volume', name, `volume "${volume}" is not declared`);
          if (isDatabase(image)) {
            if (publishesPublicly(service.ports)) add('db-port-public', name, 'bind 5432 to 127.0.0.1');
            const targets = dataDirectories(image as string);
            if (!mounts.some((m) => targets.includes(m.target))) add('db-data-not-persisted', name, `mount ${targets.join(' or ')}`);
          }
        }
        for (const name of needsHealthcheck)
          if (!hasHealthcheck(asRecord(services[name]))) add('missing-healthcheck', name, 'no healthcheck');
        return problems;
      }
      ```

      The helpers normalise each Compose shape (`splitImage` finds the tag after the last `/`, `dependencies`
      treats short syntax as `service_started`, `environment` splits `NAME=value`, `volumeMounts` marks a
      source not starting with `.`, `/` or `~` as named). The full file is `solutions/docker/compose-check.ts`.
    solution: |
      Normalise each Compose shape into one form, then apply each rule to it: named services and image tags,
      dependency conditions (short syntax = service_started), environment variables, port mappings and mount
      targets. Collect service_healthy targets and check their healthchecks once at the end.
    rubric:
      - Every test in tests/docker/compose-check.test.ts passes.
      - Each Compose syntax variant (short and long depends_on, ports, volumes; mapping and list environment) is normalised once, not handled ad hoc in every rule.
      - The rules trace to documented behaviour - Compose waits only for service_healthy, ports bind to 0.0.0.0 without a host IP, the postgres 18 data directory - and you can cite where.
      - The function never throws on a valid YAML file with unexpected shapes; it reports what it can.
    followUp: |
      Add a rule `secret-file-not-ignored`: a top-level secret with `file:` must be listed in `.gitignore`.
      What extra input does `checkCompose` need, and how would you test it without touching the real file
      system?

  - id: graceful-shutdown
    type: coding
    concept: container-process-lifecycle
    skill: application
    title: Health endpoints and a graceful shutdown
    prompt: |
      In `graceful-shutdown.ts`, implement `createHealthApp` - `/healthz` that never touches the database and
      `/readyz` that answers 503 while shutting down or when the database ping fails or exceeds its timeout,
      both with `Cache-Control: no-store` - and `installGracefulShutdown`, which on the first SIGTERM or SIGINT
      marks the app as shutting down, closes the server, lets requests in flight finish, reaps idle
      keep-alive connections, closes resources and exits 0 (1 if closing fails), forces exit 1 after
      `graceMs`, and ignores further signals. The tests use a real HTTP server and real requests.
    project: fullstack
    files:
      - exercises/docker/graceful-shutdown.ts
    test: tests/docker/graceful-shutdown.test.ts
    command: npx vitest run tests/docker/graceful-shutdown.test.ts
    hints:
      - "/readyz: check isShuttingDown first; then Promise.race the ping against a timer that rejects after pingTimeoutMs - and clear the timer in finally."
      - Keep two booleans - shuttingDown and exited - so a second signal and a late callback both do nothing.
      - "server.close(callback) only closes connections idle right now; setInterval(() => server.closeIdleConnections(), 100) until the callback runs."
      - "The forced path: setTimeout(graceMs) that calls server.closeAllConnections() and exit(1). unref() both timers so they never keep a finished process alive."
    modelAnswer: |
      ```typescript
      const shutdown = (signal: string) => {
        if (shuttingDown) return;
        shuttingDown = true;
        log(`${signal} received, shutting down`);

        const reaper = setInterval(() => deps.server.closeIdleConnections(), 100);
        reaper.unref();
        const force = setTimeout(() => {
          clearInterval(reaper);
          deps.server.closeAllConnections();
          exitOnce(1);
        }, deps.graceMs);
        force.unref();

        deps.server.close(() => {
          clearInterval(reaper);
          deps.closeResources().then(
            () => { clearTimeout(force); exitOnce(0); },
            () => { clearTimeout(force); exitOnce(1); },
          );
        });
      };
      signals.on('SIGTERM', () => shutdown('SIGTERM'));
      signals.on('SIGINT', () => shutdown('SIGINT'));
      ```

      `exitOnce` guards a single exit, because the forced path and a late `close` callback can both fire.
      Resources close only **after** the server has closed - requests in flight still use the pool. The
      health app checks `isShuttingDown()` before pinging and races the ping against a timeout, so a hung
      database makes `/readyz` answer 503 instead of hanging the health check. The full file is
      `solutions/docker/graceful-shutdown.ts`.
    solution: |
      Readiness checks the shutdown flag, then races the ping against a timeout; liveness answers without
      dependencies. Shutdown runs once: flag, reaper interval, forced-exit timer, `server.close()`, then
      close resources and exit 0 (or 1), with a single-exit guard.
    rubric:
      - Every test in tests/docker/graceful-shutdown.test.ts passes.
      - Resources are closed after the server has closed, never while requests are in flight.
      - graceMs is documented as shorter than the container's stop grace period, and the forced path destroys the remaining connections.
      - The code would work with process as the signal source and process.exit as exit - nothing test-specific.
    followUp: |
      Your API also consumes a job queue. Where in the shutdown sequence do you stop taking new jobs, and what
      happens to a job half-processed when the forced exit fires?

  - id: test-plan-image
    type: testdesign
    concept: container-images-and-dockerfiles
    skill: application
    title: Test plan for a new API image
    prompt: |
      The team has containerised the merchant API (multi-stage Dockerfile, compose.yaml with PostgreSQL 18)
      and asks QA to sign it off before it replaces the VM deployment. Write test cases covering the image
      itself, its run-time behaviour and the Compose stack: preconditions, steps, expected results and the
      evidence you keep.
    modelAnswer: |
      **Preconditions:** image built from the release commit, digest recorded; stack started with `docker
      compose up -d` from an empty volume; a seed script.

      **Image:** (1) `docker image history --no-trunc` and `docker inspect` - no secrets in layers, `ENV` or
      build args; `User` is `node`/1000; `Cmd` is exec form `["node","dist/server.js"]`. (2) List `/app` - no
      `.git`, `.env`, tests, TypeScript sources or dev dependencies. (3) Rebuild after a one-line source change
      - dependency step cached. Evidence: command outputs, build log, digest.

      **Run time:** (4) Health goes `starting` → `healthy` within the start period (`docker compose ps`).
      (5) Stop the database: `/healthz` stays 200, `/readyz` 503, the API isn't restarted; start it again:
      ready within one interval. (6) Graceful stop: start a slow request, `docker compose stop api` - the
      response arrives, logs show the shutdown sequence, stop time well under the grace period. (7) Start with
      a required variable missing - Compose refuses with the `:?` message. Evidence: timings, logs, responses.

      **Stack:** (8) Fresh `up` - API waits for db healthy; no connection errors. (9) Data persists across
      `down`/`up`, and `down -v` gives an empty database. (10) Port 5432 bound to 127.0.0.1 only (`ss -tlnp`).
      (11) The API reaches the database by service name. Evidence: query outputs, socket listing.
    rubric:
      - Covers the image contents (secrets, user, files, command form), not only behaviour.
      - Tests the stop path with a request in flight and measures the stop time.
      - Separates liveness from readiness and tests a database outage.
      - Checks persistence both ways (down keeps, down -v clears) and port exposure.
      - Gives concrete expected results and evidence for each case.
    hints:
      - Three groups - what is in the image, how the container behaves, how the stack behaves.
      - What does a stop look like with a request in flight?
    solution: |
      Image contents (no secrets, non-root, exec form, no stray files, cache works), run-time behaviour
      (health states, database outage keeps liveness, graceful stop with a request in flight, missing
      configuration refused), stack (health-gated start-up, persistence with down / down -v, loopback-only
      database port, service-name addressing) - each with commands, expected results and kept evidence.

  - id: secrets-short
    type: short
    concept: container-images-and-dockerfiles
    skill: recall
    title: Where does the npm token go?
    prompt: |
      The build needs a private npm registry token. A colleague proposes `ARG NPM_TOKEN` and
      `RUN echo "//registry.example/:_authToken=$NPM_TOKEN" > .npmrc && npm ci && rm .npmrc`. Explain what is
      wrong and what to do instead.
    modelAnswer: |
      Build arguments are visible in `docker history` (the Dockerfile reference warns against using them for
      secrets), and although `.npmrc` is deleted in the same `RUN`, the token was still passed through a build
      argument that is recorded with the image. Use a **secret mount**: `RUN --mount=type=secret,id=npmrc,target=/app/.npmrc
      npm ci`, passing the file with `docker build --secret id=npmrc,src=$HOME/.npmrc` (the `--secret` format is `id=mysecret[,src=/local/secret]`). The secret is available
      to that one step and isn't stored in a layer. In a multi-stage build, do the install in the build stage
      only. Never put it in `ENV` - `ENV` values persist into the image and every container.
    rubric:
      - States that ARG values are visible in the image history.
      - Proposes RUN --mount=type=secret (a build secret) instead.
      - Mentions that ENV persists into containers and is equally wrong.
    hints:
      - Where can someone with the image see build arguments?
      - Which RUN option exists for build-time secrets?
    solution: |
      ARG is visible in docker history; use `RUN --mount=type=secret` so the token is mounted for the one
      install step only, never in ENV, never in a layer.

  - id: interview-containerise
    type: interview
    concept: compose-local-stack
    skill: analysis
    title: "\"How would you containerise our Node API with Postgres?\""
    prompt: |
      An interviewer asks: "We run a Node/Express API with PostgreSQL on hand-built VMs. How would you
      containerise it and give developers a local stack? What would you watch out for?"
    modelAnswer: |
      First the app: configuration from environment variables, logs to stdout, listening on 0.0.0.0, a
      SIGTERM handler that drains, and separate liveness and readiness endpoints. Then a multi-stage
      Dockerfile: a pinned `node:24-slim` (digest pinned, updated by a bot), copy the lockfile and `npm ci`
      before the source for caching, build in the first stage, production dependencies and `dist` only in the
      runtime stage, `USER node`, exec-form `CMD ["node", "dist/server.js"]` - not `npm start`, which keeps
      SIGTERM from node - and a `.dockerignore`. A HEALTHCHECK on liveness, with a short timeout.

      For the local stack, a `compose.yaml`: the API built from the Dockerfile and `postgres:18` with a
      `pg_isready` healthcheck; the API `depends_on` the database with `condition: service_healthy`, and still
      retries its first connection. Database data on a named volume at `/var/lib/postgresql` (the 18+ path).
      Passwords as Compose secrets or `${VAR:?}` from an untracked `.env`, never in the file. Ports bound to
      127.0.0.1. Services talk by name - `db:5432`.

      Watch-outs: the ten-second stop that means signals aren't arriving; keep-alive connections holding
      close() open; secrets in `ENV`/`ARG`; `down -v` wiping data; a liveness check on the database causing
      restart storms; the host's `node_modules` leaking into the image. And I'd prove each with a test: timed
      stop with a request in flight, `id` in the container, `docker image history`, persistence across
      re-creation.
    rubric:
      - Prepares the app (config, logs, 0.0.0.0, SIGTERM, health endpoints) before writing the Dockerfile.
      - Dockerfile choices with reasons - cache order, multi-stage, non-root, exec form, pinning.
      - Compose with service_healthy, a healthcheck, a named volume at the right path, secrets, loopback ports.
      - Names concrete failure modes and how to test for them.
    followUps:
      - Why not run PostgreSQL in the same container as the API?
      - How would the same image get to production - what changes between the local stack and production?
      - "docker stop takes 10 seconds - where do you look first?"
    hints:
      - App changes first, then image, then stack, then risks.
      - For each choice, give the failure it prevents.
    solution: |
      App ready for containers (env config, stdout logs, 0.0.0.0, SIGTERM drain, liveness/readiness); a
      multi-stage, cache-friendly, non-root, exec-form Dockerfile with .dockerignore and pinned base; Compose
      with a healthy-gated database, named volume at the version's data path, secrets, loopback ports and
      name-based addressing; and tests for the known failure modes.

placement:
  - id: place-cache
    type: mcq
    concept: container-images-and-dockerfiles
    skill: application
    title: Smaller and safer
    prompt: |
      An image for a TypeScript API is 1.1 GB and contains `typescript`, `vitest`, the `src/` folder and
      `.git`. Which change addresses all of that most directly?
    options:
      - id: multi
        text: A multi-stage build - compile in a build stage, copy only dist and production dependencies into the runtime stage - plus a .dockerignore.
        feedback: Correct - the build stage keeps the toolchain and sources out of the final image, and .dockerignore keeps .git out of the context.
      - id: rm
        text: Add RUN rm -rf src .git node_modules/typescript at the end of the Dockerfile.
        feedback: Deleting in a later layer hides the files but the earlier layers still contain them - the image doesn't shrink.
      - id: alpine
        text: Switch the base image to Alpine.
        feedback: A smaller base saves some megabytes but still ships the dev tools, sources and .git.
      - id: squash
        text: Use a bigger registry plan.
        feedback: Storage isn't the problem - shipping build tools and repository history in a runtime image is.
    correct: [multi]
    solution: |
      Files written in one layer stay in the image even if a later layer deletes them. A multi-stage build
      copies only the artefacts into a fresh stage, and `.dockerignore` keeps `.git` and local files out of
      the build context in the first place.

  - id: place-signal
    type: mcq
    concept: container-process-lifecycle
    skill: application
    title: Which CMD?
    prompt: |
      The API registers `process.on('SIGTERM', ...)` to drain requests. Which `CMD` lets that handler run on
      `docker stop`?
    options:
      - id: exec
        text: CMD ["node", "dist/server.js"]
        feedback: Correct - exec form starts node directly as the container's main process, so it receives SIGTERM.
      - id: shell
        text: CMD node dist/server.js
        feedback: Shell form runs /bin/sh -c, which doesn't pass the signal on; the stop ends with SIGKILL after the grace period.
      - id: npm
        text: CMD ["npm", "start"]
        feedback: Exec form, but npm is the main process; the Node.js image's best practices warn that npm swallows SIGTERM.
      - id: entry-shell
        text: ENTRYPOINT node dist/server.js
        feedback: Shell-form ENTRYPOINT runs under /bin/sh -c too - the reference says the executable "doesn't receive a SIGTERM from docker stop".
    correct: [exec]
    solution: |
      Only exec form with node itself as the command puts node where `docker stop` sends SIGTERM. Shell form
      and npm both put another process in between.

  - id: place-compose
    type: mcq
    concept: compose-local-stack
    skill: application
    title: The API starts before the database is ready
    prompt: |
      The API crashes on `docker compose up` about one time in three with "the database system is starting
      up". It has `depends_on: [db]`. What is the right Compose fix?
    options:
      - id: healthy
        text: Give db a healthcheck (pg_isready) and use depends_on with condition service_healthy.
        feedback: Correct - Compose then waits for the dependency to be healthy, not just running.
      - id: sleep
        text: Change the API command to sleep 10 before starting node.
        feedback: A guess that's too long on fast machines and too short on slow ones - and it puts a shell in front of node.
      - id: restart
        text: Add restart always to the API.
        feedback: It hides the crash by restarting, but the crashes, logs and delays remain.
      - id: links
        text: Replace depends_on with links.
        feedback: links is a legacy option and also only orders start-up; it doesn't wait for readiness.
    correct: [healthy]
    solution: |
      Short-syntax `depends_on` only waits until the database container is **running**. `condition:
      service_healthy` waits for its healthcheck - so add one. Keep a retry on the first connection in the
      app too.

recall:
  - id: recall-image
    concept: container-images-and-dockerfiles
    prompt: What is an image made of, according to the OCI image format?
    answer: A manifest that names a configuration (Entrypoint, Cmd, Env, User, ExposedPorts, StopSignal...) and an ordered list of filesystem layers, base layer first. An image index can list manifests for several platforms.
  - id: recall-cache
    concept: container-images-and-dockerfiles
    prompt: When does Docker reuse a layer from the build cache, and how do you order a Node Dockerfile for it?
    answer: When the instruction and the files it depends on are unchanged - and a change rebuilds every later step. Copy package.json and the lockfile, run npm ci, then copy the source.
  - id: recall-secrets
    concept: container-images-and-dockerfiles
    prompt: Why must secrets not be passed with ENV or ARG?
    answer: ENV persists into the image and every container (docker inspect shows it); ARG values are visible in docker history. Use RUN --mount=type=secret at build time and secret files or an injected environment at run time.
  - id: recall-stop
    concept: container-process-lifecycle
    prompt: What does docker stop do?
    answer: Sends SIGTERM (or the STOPSIGNAL) to the container's main process, waits the grace period - 10 s by default on Linux - then sends SIGKILL.
  - id: recall-exec-form
    concept: container-process-lifecycle
    prompt: Why use CMD ["node", "dist/server.js"] rather than CMD npm start?
    answer: Exec form starts node directly as the main process, so it receives SIGTERM. Shell form runs /bin/sh -c, which doesn't pass signals, and npm swallows them - the stop ends in SIGKILL.
  - id: recall-liveness
    concept: container-process-lifecycle
    prompt: What is the difference between liveness and readiness?
    answer: Liveness - can the process serve at all? Failing means restart, so it must not check dependencies. Readiness - should it get traffic now? It checks the database and fails while shutting down; failing stops traffic without a restart.
  - id: recall-compose-network
    concept: compose-local-stack
    prompt: How does the API container reach PostgreSQL in a Compose stack?
    answer: By the service name on the project's default network and the container port - db:5432. localhost is the API container itself; published ports are for the host.
  - id: recall-depends-on
    concept: compose-local-stack
    prompt: What does depends_on guarantee, and how do you wait for a ready database?
    answer: Short syntax only starts the dependency first - Compose waits until it is running, not ready. Use condition service_healthy and give the dependency a healthcheck such as pg_isready.

