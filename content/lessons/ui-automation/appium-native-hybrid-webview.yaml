id: appium-native-hybrid-webview
title: Native, hybrid and WebView contexts
subject: ui-automation
module: appium
level: advanced
status: published
estimatedMinutes: 55
summary: How Appium automates web content inside apps - contexts, waiting for a webview, switching back - and what differs between Android and iOS, with payment pages as the running example.
tags: [appium, hybrid apps, webview, contexts, chromedriver, android, ios, xcuitest, uiautomator2, payments, interview]

environment: |
  - **Appium 3** with the UiAutomator2 (Android) and XCUITest (iOS) drivers; `io.appium:java-client`
    10.1.1. Sources: the Appium "Managing contexts" guide, the UiAutomator2 driver documentation (web
    contexts, Chromedriver) and the XCUITest driver's hybrid-app guide.
  - **Platform-specific, labelled:** on Android, a webview is reachable only if it is debuggable (the app
    calls `WebView.setWebContentsDebuggingEnabled(true)`), and the driver drives it through a Chromedriver
    whose major version must match the webview's. On iOS, a WKWebView must be inspectable (`isInspectable`),
    real devices need Web Inspector switched on in Safari's settings, and the host must be a Mac with Xcode
    (other hosts have only limited support).
  - **Context names:** `NATIVE_APP` for the native context. Webview names are driver-specific: the
    UiAutomator2 driver names an app's webview `WEBVIEW_` plus the app package (for example
    `WEBVIEW_com.sandpay.demo`); the XCUITest driver's examples use names like `WEBVIEW_1`. Always read the
    names from `getContextHandles()`.
  - **No device needed for the exercises.** The SandPay demo app is fictional.

prerequisites:
  - appium-architecture

concepts:
  - id: app-types
    name: Native, hybrid and mobile web
    summary: Native apps use platform widgets, hybrid apps show web content in a WebView inside a native shell, and mobile web runs in the browser - each needs different locators and tools.
  - id: context-switching
    name: Contexts and switching
    summary: A session has one native context and zero or more webview contexts; a webview context appears only once the webview has loaded and is debuggable, and you must switch to it - and back.
  - id: platform-differences
    name: Android and iOS differences
    summary: Android drives webviews through a version-matched Chromedriver and needs debuggable webviews; iOS needs inspectable WKWebViews, Web Inspector on devices and a macOS host.

objectives:
  - Classify an app as native, hybrid or mobile web and choose the automation approach.
  - Switch between native and webview contexts safely, including waiting for a webview to appear.
  - Diagnose a webview that doesn't appear or can't be driven, on Android and on iOS.
  - Design tests for a checkout that moves between native screens and web pages.

sections:
  - id: intuition
    kind: intuition
    concepts: [context-switching, app-types]
    title: The idea in plain language
    body: |
      A hybrid app is a **house with a television**. The house - rooms, doors, light switches - is native. The
      programme on the television is a web page. To change channels you use the TV's remote, not the light
      switch.

      Appium gives you both remotes, but you hold **one at a time**: the native context or a webview context.
      Pick up the TV remote before the TV is on and nothing happens; forget to put it down and the light switch
      "doesn't exist". Payment apps are full of televisions: card forms, 3-D Secure challenges and bank pages
      are often web content inside the app.

  - id: what
    kind: what
    concepts: [app-types, context-switching]
    title: What app types and contexts are
    body: |
      | App type | What it is | Automate with |
      |---|---|---|
      | **Native** | platform UI (Android views, Jetpack Compose, UIKit, SwiftUI) | the native context and mobile locators |
      | **Hybrid** | a native app showing web pages in a WebView (or WKWebView) | native context for the shell, a webview context for the pages |
      | **Mobile web** | a website in the phone's browser | a browser session (`browserName`) and web locators |

      **Contexts:**

      - Every session has exactly one native context, conventionally `NATIVE_APP`, and zero or more webview
        contexts.
      - `driver.getContextHandles()` lists the contexts; `driver.context(name)` switches; `driver.getContext()`
        says where you are.
      - In a webview context, commands go to the web content - **CSS selectors, XPath on the DOM, `get`,
        JavaScript**. Native elements (the app's header, system dialogs, the keyboard) need the native context.
      - `appium:autoWebview` starts the session directly in the webview context.

  - id: why
    kind: why
    concepts: [app-types, platform-differences]
    title: Why hybrid flows break test suites
    body: |
      - **The webview is late.** Its context appears only after the page has loaded - a test that switches
        straight after tapping "Checkout" fails sometimes, depending on the network.
      - **Switching back is forgotten.** After the web payment, the test looks for a native "Close" button
        while still in the web context, and gets "element not found".
      - **The webview isn't there at all** in release builds, because web debugging is switched off - a
        build-configuration issue, not a test bug.
      - **Version drift on Android:** the device's WebView updates, and the Chromedriver no longer matches.
      - **Payment pages are external:** a 3-D Secure page or a wallet's sign-in may open in a webview, a
        browser tab or a separate app - each needs a different strategy.

  - id: internals
    kind: internals
    concepts: [context-switching, platform-differences]
    title: How webview automation works on each platform
    body: |
      **Android (UiAutomator2).** In the native context, commands go to the UiAutomator2 server on the
      device. The driver discovers webviews through their DevTools debugging sockets - only webviews of apps
      that enabled debugging - and, when you switch to one, **starts a Chromedriver** for it and forwards web
      commands there. Chromedriver's major version must match the webview's (Chrome-based) major version;
      the driver can fetch a matching one automatically if the server runs with the
      `uiautomator2:chromedriver_autodownload` feature enabled.

      **iOS (XCUITest).** Native commands go to WebDriverAgent. Web content is reached through Safari's
      remote web inspector, so a WKWebView must be **inspectable** (`isInspectable = true`, which needs a
      change in the app's code), and on real devices Web Inspector must be on (Settings → Safari → Advanced).
      If the webview appears in Safari's remote debugger list, Appium should see it too.

      **In both cases** the webview context exists only while the webview exists and has loaded - so contexts
      come and go as screens change, and names can differ between runs on some drivers.

  - id: visual
    kind: visual
    concepts: [context-switching]
    title: "Sequence: paying through a webview on Android"
    body: |
      ```mermaid
      sequenceDiagram
          participant T as Test
          participant A as Appium - UiAutomator2 driver
          participant C as Chromedriver
          participant W as WebView in the app
          T->>A: tap Checkout - native context
          loop until the webview is listed
              T->>A: getContextHandles
              A-->>T: NATIVE_APP ...
          end
          T->>A: context WEBVIEW_com.sandpay.demo
          A->>C: start a Chromedriver for this webview
          T->>A: find by CSS, type the email, tap Pay
          A->>C: forward web commands
          C->>W: DevTools protocol
          T->>A: context NATIVE_APP
          T->>A: tap Close - native again
      ```

      Two moments decide whether the test is stable: **waiting** until the webview is listed, and
      **switching back** before the next native step.

  - id: steps
    kind: steps
    concepts: [context-switching]
    title: Driving a hybrid checkout, step by step
    body: |
      1. **Native:** navigate to the screen that opens the webview (tap "Checkout").
      2. **Wait for the webview context** - poll `getContextHandles()` until the expected one is listed, with
         a timeout (the coding exercise).
      3. **Switch** with `driver.context(name)`.
      4. **Wait for the page,** as on the web - a visible element, not a sleep.
      5. **Use web locators** (`data-testid`, CSS) and the same page-object style as for the browser.
      6. **Switch back** to `NATIVE_APP` before any native step - ideally in a `finally` block inside the
         component that owns the webview.
      7. **Check the outcome natively** (the app's confirmation screen) and, where possible, through the API.

  - id: example
    kind: example
    concepts: [platform-differences, context-switching]
    title: "Real-world example: the context list that only said NATIVE_APP"
    body: |
      A team automated a payment app whose card form was a webview. On the QA build everything worked. On the
      release-candidate build, `getContextHandles()` returned only `NATIVE_APP`, and every payment test failed
      waiting for the webview.

      **Evidence:** the page was clearly visible on the screenshot; `chrome://inspect` on the desktop didn't
      list the app's webview for the release candidate, but did for the QA build.

      **Cause:** the app enabled `WebView.setWebContentsDebuggingEnabled(true)` only in debug builds, and the
      release candidate was built in release mode. **Fix:** a dedicated, clearly labelled test build of the
      release candidate with web debugging on (never the store build), and a smoke test that fails fast with
      "webview not debuggable" instead of a 30-second timeout. Waiting would never have helped.

  - id: code
    kind: code
    concepts: [context-switching]
    title: "Code: switching contexts safely"
    collapsed: true
    body: |
      ```java
      // tap a native button that opens the web checkout
      driver.findElement(AppiumBy.accessibilityId("Checkout")).click();

      // wait for the webview, then switch (the coding exercise's helper)
      String webview = Contexts.waitForWebview(driver::getContextHandles, "com.sandpay.demo", Duration.ofSeconds(15));
      driver.context(webview);
      try {
          WebDriverWait wait = new WebDriverWait(driver, Duration.ofSeconds(10));
          wait.until(ExpectedConditions.visibilityOfElementLocated(By.cssSelector("[data-testid='email']")))
              .sendKeys("learner@example.com");
          driver.findElement(By.cssSelector("[data-testid='pay-button']")).click();
      } finally {
          driver.context(Contexts.NATIVE);      // always back to native, even when the web part fails
      }

      // native again
      new WebDriverWait(driver, Duration.ofSeconds(20))
          .until(d -> !d.findElements(AppiumBy.accessibilityId("Payment received")).isEmpty());
      ```

      Server flags and capabilities for webviews on Android:

      ```bash
      appium server --allow-insecure uiautomator2:chromedriver_autodownload
      ```

      ```java
      UiAutomator2Options options = new UiAutomator2Options()
          .setApp("/builds/sandpay-demo.apk")
          .setAutoWebview(false);                // start in NATIVE_APP; switch when needed
      ```

  - id: tests
    kind: tests
    concepts: [app-types]
    title: Test design for a hybrid checkout
    body: |
      | ID | Scenario | What to check |
      |---|---|---|
      | H1 | native → web → native happy path | the right context at each step; the native confirmation matches the web payment |
      | H2 | slow network while the webview loads | the test waits for the context and the page, and the user sees a loading state |
      | H3 | the webview fails to load (offline, server error) | the app shows a native error and a way back - not a blank screen |
      | H4 | Android back button / iOS swipe back on the web page | where the user lands, and whether a payment can be submitted twice |
      | H5 | app sent to the background during the web payment, then resumed | the page and the payment status survive, or are re-checked |
      | H6 | keyboard over the web form, rotation | fields and the Pay button stay usable |
      | H7 | the payment page opens in the browser or another app instead | the app handles the return (deep link) and confirms the status from the server |

  - id: mistakes
    kind: mistakes
    concepts: [context-switching, platform-differences]
    title: Common mistakes
    body: |
      - **Switching immediately** after opening the webview - wait for the context.
      - **Hard-coding a webview name** that differs per platform, per driver or per run - choose from
        `getContextHandles()`.
      - **Forgetting to switch back** to `NATIVE_APP`; put the switch back in `finally`.
      - **Native locators in a web context** (or CSS selectors in the native context) - "not found" either way.
      - **Testing only debug builds** - and being surprised when release builds hide the webview.
      - **Pinning one Chromedriver** while the devices' WebView updates itself.
      - **`autoWebview` for apps that start natively** - the session waits for a webview that isn't there yet.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [app-types, platform-differences]
    title: Trade-offs
    body: |
      | Approach | Gains | Costs |
      |---|---|---|
      | drive the webview through its context | real web locators, page objects reusable from web tests | debuggable builds, Chromedriver matching (Android), inspectable webviews (iOS) |
      | stay native and use the accessibility tree of the web content | no context switching | weaker locators, platform-specific, slower |
      | test the web pages separately in a mobile browser | fast, simple, no app | misses the app's integration - navigation, cookies, deep links |
      | `autoWebview` | simpler for apps that are mostly web | awkward when native screens come first |
      | cover the web part in API and web tests, keep app tests to the hand-over | fewer, more stable app tests | relies on good coverage elsewhere |

  - id: summary
    kind: summary
    title: Summary and quick reference
    body: |
      - Native, hybrid (WebView in a native shell), mobile web (browser session).
      - Contexts: one `NATIVE_APP`, webviews as they appear; `getContextHandles()`, `context(name)`.
      - Wait for the webview context, switch, wait for the page, use web locators, switch back in `finally`.
      - Android: debuggable webview (`setWebContentsDebuggingEnabled`), matching Chromedriver
        (`uiautomator2:chromedriver_autodownload`). iOS: inspectable WKWebView, Web Inspector on devices, a
        Mac host.
      - Design tests for the hand-overs: loading, failure, back navigation, backgrounding, external pages.

exercises:
  - id: which-app-type
    type: mcq
    concept: app-types
    skill: recognition
    title: What kind of app is it?
    prompt: |
      The SandPay app's product screens are built with Jetpack Compose. Tapping "Pay" shows the payment form,
      which the app loads from `https://pay.sandpay.example/form` into a WebView inside the app. What kind of
      app is it?
    options:
      - id: hybrid
        text: Hybrid - a native app that shows web content in a WebView
        feedback: Correct - the shell is native, the payment form is web content inside it.
      - id: native
        text: Native - it is installed from the store
        feedback: Being installed doesn't make every screen native; the payment form is a web page.
      - id: mobile-web
        text: Mobile web
        feedback: Mobile web runs in the phone's browser; here the page is inside the app.
      - id: cross-platform
        text: It can't be automated with Appium
        feedback: Appium automates both parts - the native context for the screens and a webview context for the form.
    correct: [hybrid]
    hints:
      - Where does the payment form's content come from, and where is it shown?
    solution: |
      **Hybrid.** Automate the Compose screens in the native context and the payment form in its webview
      context.
    followUp: |
      The team moves the payment form to the system browser (a Custom Tab) instead. What changes for the
      automation?

  - id: wait-for-webview
    type: coding
    concept: context-switching
    skill: application
    title: Wait for the right webview
    prompt: |
      Implement `Contexts.waitForWebview`: ask for the context names repeatedly until the app's webview is
      there, and return its name - `WEBVIEW_` plus the package if it is listed, otherwise the only `WEBVIEW_`
      context; refuse at once (IllegalStateException) when several unknown webviews make the choice unclear,
      and time out when none appears. The tests hand in context lists that change over time, so no device is
      needed.
    project: framework
    files:
      - src/exercises/java/learnerapp/exercises/appium/Contexts.java
    test: src/test/java/learnerapp/exercises/ContextsTest.java
    command: mvn test -Dtest=ContextsTest
    hints:
      - "Selenium's `FluentWait` works with any input, not only a WebDriver: `new FluentWait<>(contexts)`."
      - "`until(source -> ...)` - return the chosen name, or `null` for \"not yet\"."
      - FluentWait doesn't ignore IllegalStateException unless you tell it to - so throwing it ends the wait at once.
    modelAnswer: |
      ```java
      public static String waitForWebview(Supplier<? extends Collection<String>> contexts, String appPackage, Duration timeout) {
          return new FluentWait<>(contexts)
              .withTimeout(timeout)
              .pollingEvery(Duration.ofMillis(250))
              .withMessage("a webview context for " + appPackage)
              .until(source -> choose(List.copyOf(source.get()), appPackage));
      }

      private static String choose(List<String> available, String appPackage) {
          String expected = "WEBVIEW_" + appPackage;
          if (available.contains(expected)) return expected;
          List<String> webviews = available.stream().filter(n -> n.startsWith("WEBVIEW_")).toList();
          if (webviews.size() == 1) return webviews.get(0);
          if (webviews.size() > 1)
              throw new IllegalStateException("Several webviews and none for " + appPackage + ": " + available);
          return null;   // no webview yet
      }
      ```
    rubric:
      - Every test in ContextsTest passes
      - Polls with a timeout instead of sleeping
      - Prefers the app's own webview, accepts a single unknown one, refuses to guess between several
      - Explained why waiting is needed before switching
    solution: |
      The tests simulate a webview that appears after a second, numbered iOS-style names, an ambiguous list
      and a webview that never appears. With a real driver: `driver.context(Contexts.waitForWebview(
      driver::getContextHandles, appPackage, timeout))`. Reference:
      `src/solutions/java/learnerapp/exercises/appium/Contexts.java`.
    followUp: |
      Write the matching `inWebview(driver, appPackage, Runnable steps)` helper that switches in, runs the
      steps and always switches back. Where in your framework would it live?

  - id: context-bugs
    type: debug
    concept: context-switching
    skill: analysis
    title: A hybrid payment that fails at random
    prompt: |
      This test fails at two different lines on different runs. Click the lines that cause the failures.
    language: java
    code: |
      driver.findElement(AppiumBy.accessibilityId("Checkout")).click();
      driver.context("WEBVIEW_com.sandpay.demo");
      driver.findElement(By.cssSelector("[data-testid='email']")).sendKeys("learner@example.com");
      driver.findElement(By.cssSelector("[data-testid='pay-button']")).click();
      driver.findElement(AppiumBy.accessibilityId("Close")).click();
    correctLines: [2, 5]
    lineNotes:
      - line: 1
        note: Tapping a native button in the native context is correct.
      - line: 3
        note: A CSS selector is the right locator inside a webview context - assuming the page has loaded, which deserves a wait too.
      - line: 4
        note: The click itself is fine; the next step is the problem.
    hints:
      - When does the webview context exist?
      - Which context is the test in when it looks for "Close"?
    solution: |
      **Lines 2 and 5.** Line 2 switches straight after the tap; on a slow run the webview context isn't
      listed yet and the switch fails. Line 5 looks for a **native** button while the test is still in the web
      context. Wait for the context before switching, and switch back to `NATIVE_APP` - in a `finally` - before
      native steps.
    followUp: |
      Rewrite the test with a page object for the web form and a component that handles the switching. What
      does the test body look like now?

  - id: hybrid-flow
    type: order
    concept: context-switching
    skill: recall
    title: The hybrid hand-over
    prompt: |
      Put the steps of a stable native → web → native flow in order.
    items:
      - id: native-tap
        text: Tap the native button that opens the webview
      - id: wait-context
        text: Wait until the webview context is listed
      - id: switch-web
        text: Switch to the webview context
      - id: wait-page
        text: Wait for an element of the web page
      - id: web-actions
        text: Fill in and submit the web form with web locators
      - id: switch-native
        text: Switch back to NATIVE_APP
      - id: native-check
        text: Check the native confirmation screen
    hints:
      - There are two separate waits.
    solution: |
      **Tap → wait for the context → switch → wait for the page → web actions → switch back → native check.**
      The context and the page are two different things to wait for.
    followUp: |
      Which of these steps belong in the test, and which in a reusable component?

  - id: chromedriver-mismatch
    type: mcq
    concept: platform-differences
    skill: analysis
    title: The switch that stopped working
    prompt: |
      Android payment tests started failing when switching to the webview context. Nothing changed in the
      app or the tests; the device lab's emulators updated Android System WebView overnight. The Appium
      server log says no Chromedriver was found that can automate the webview's version. What is the fix?
    options:
      - id: matching-chromedriver
        text: Use a Chromedriver matching the webview's major version - for example run the server with the uiautomator2:chromedriver_autodownload feature, or point appium:chromedriverExecutable at the right binary
        feedback: Correct - the driver needs a Chromedriver whose major version matches the webview's.
      - id: longer-timeout
        text: Increase the wait timeout for the webview context
        feedback: The context is listed - switching fails because the driver can't start a compatible Chromedriver. Waiting won't change that.
      - id: native-locators
        text: Stay in the native context and use XPath on the web form
        feedback: A workaround that gives up web locators and page objects - fix the Chromedriver instead.
      - id: downgrade-app
        text: Roll back the app to last week's build
        feedback: The app didn't change - the WebView on the device did.
    correct: [matching-chromedriver]
    hints:
      - What does the UiAutomator2 driver start when you switch to a webview?
    solution: |
      **A matching Chromedriver.** The driver forwards web commands to a Chromedriver it starts for the
      webview, and Chromedriver supports one major browser version. Automatic download keeps it in step with
      device updates.
    followUp: |
      How would you stop device updates from surprising the suite in the first place?

  - id: only-native-listed
    type: mcq
    concept: platform-differences
    skill: application
    title: Only NATIVE_APP
    prompt: |
      On Android, the payment form is visible on the screenshot, but `getContextHandles()` returns only
      `NATIVE_APP` - even after waiting 30 seconds. Which explanation fits best?
    options:
      - id: not-debuggable
        text: The app's webview isn't debuggable in this build (WebView.setWebContentsDebuggingEnabled is off)
        feedback: Correct - the driver can only list webviews whose debugging is enabled; check with chrome://inspect on the desktop.
      - id: slow
        text: The page is still loading - wait longer
        feedback: After 30 seconds with the form visible, loading isn't the issue.
      - id: ios
        text: It needs isInspectable set
        feedback: That is the iOS (WKWebView) setting; on Android it is WebView debugging.
      - id: wrong-locator
        text: The CSS locator is wrong
        feedback: Locators don't affect the list of contexts.
    correct: [not-debuggable]
    hints:
      - What must be true of a webview for any external tool to connect to it?
    solution: |
      **The webview isn't debuggable.** Ask for a test build with web debugging enabled, and confirm with
      Chrome's remote debugging page that the webview is listed.
    followUp: |
      Why is it a bad idea to enable web debugging in the store build just for testing?

  - id: ios-host
    type: mcq
    concept: platform-differences
    skill: application
    title: iOS in a Linux CI
    prompt: |
      Your CI agents are Linux machines. The team wants to add XCUITest-based Appium tests on iOS simulators.
      What do they need?
    options:
      - id: mac
        text: A macOS machine with Xcode to run the Appium server and the simulators
        feedback: Correct - the XCUITest driver's primary requirements are a macOS host and Xcode.
      - id: docker
        text: An iOS simulator Docker image on the Linux agents
        feedback: iOS simulators come with Xcode, which runs on macOS.
      - id: driver-only
        text: Just `appium driver install xcuitest` on the Linux agents
        feedback: The driver installs, but it needs Xcode and XCTest to build and run WebDriverAgent.
      - id: android-emulator
        text: Nothing - the Android emulators can run iOS apps
        feedback: Android emulators run Android only.
    correct: [mac]
    hints:
      - Which Apple tools does WebDriverAgent depend on, and where do they run?
    solution: |
      **A Mac with Xcode** - your own or in a device cloud. The Linux agents can still run the test code and
      talk to a remote Appium server on the Mac.
    followUp: |
      Sketch a CI setup where Linux agents run Android tests and a Mac runs iOS tests from the same suite.

  - id: hybrid-checkout-tests
    type: testdesign
    concept: app-types
    skill: application
    title: Test the hybrid checkout
    prompt: |
      SandPay's app is native until "Pay"; the card form and the 3-D Secure challenge are web pages in a
      WebView; afterwards a native confirmation screen shows the result. Design the test cases you would
      automate or run for the hand-overs between native and web. Include what you check and the evidence.
    hints:
      - Think about loading, failure, navigation, interruptions and how the result gets back to the native screen.
      - Where can a payment be submitted twice, or lost?
    modelAnswer: |
      1. Happy path: native → form → 3-D Secure → native confirmation; the confirmation's amount and status
         match the payment in the API.
      2. Slow network while the form loads: a loading state, no blank screen; the test waits for context and
         page.
      3. Form fails to load (offline, server error): native error with retry; nothing charged.
      4. Back navigation on the form and on the challenge: where the user lands; resubmitting doesn't create a
         second payment (idempotency).
      5. App backgrounded during the challenge and resumed: status re-checked from the server, not assumed.
      6. Declined card and abandoned challenge: correct native message; order not marked paid.
      7. Keyboard and rotation on the form: fields and Pay usable.
      Evidence: screenshots per context, server-side payment records, app logs, Appium server logs.
    rubric:
      - Covered the happy path with a server-side check of the result
      - Covered loading and load failure of the webview
      - Covered back navigation and double submission
      - Covered interruptions such as backgrounding
      - Covered declines or abandoned challenges
      - Named evidence beyond screenshots, such as API records or logs
    solution: |
      The risky parts of hybrid checkouts are the **hand-overs** - and the safest check of the outcome is the
      server's record, not only what the screen says.
    followUp: |
      Which of these cases would you automate with Appium, which with API tests, and which would you leave to
      exploratory testing?

  - id: interview-hybrid
    type: interview
    concept: context-switching
    skill: application
    title: "Interview: automating a hybrid app"
    prompt: |
      **Interviewer:** "How do you automate a hybrid app with Appium? What problems have you seen with
      webviews?"
    hints:
      - Contexts, waiting, switching back, platform requirements, a real problem.
    modelAnswer: |
      - Native parts in the native context with mobile locators; web parts in the webview context with web
        locators and page objects.
      - List contexts with getContextHandles, wait until the webview is listed, switch with context(name),
        wait for the page, and switch back to NATIVE_APP in a finally block.
      - Android: the webview must be debuggable; the driver uses a Chromedriver that must match the webview's
        major version - auto-download or a configured executable. iOS: the WKWebView must be inspectable, Web
        Inspector on for devices, a Mac host.
      - Problems: switching too early, forgetting to switch back, release builds without debugging, Chromedriver
        mismatches after WebView updates.
    followUps:
      - How do you choose the right webview when several are listed?
      - How would you test a payment page that opens in the system browser instead?
      - Where would you check the payment result other than the screen?
    rubric:
      - Explained native and webview contexts and switching
      - Waited for the webview context and switched back reliably
      - Named Android requirements (debuggable webview, matching Chromedriver)
      - Named iOS requirements (inspectable webview, Web Inspector, macOS)
      - Described a concrete webview problem and its fix
    solution: |
      Strong answers describe **the hand-over discipline** and the platform prerequisites - the two places
      where hybrid automation actually fails.

recall:
  - id: recall-app-types
    concept: app-types
    prompt: What is a hybrid app?
    answer: A native app that shows web content in a WebView (WKWebView on iOS) - automated with a native context for the shell and a webview context for the pages.
  - id: recall-mobile-web
    concept: app-types
    prompt: How do you automate mobile web in Appium?
    answer: A browser session - browserName (for example Chrome on Android) and no app - with web locators.
  - id: recall-contexts
    concept: context-switching
    prompt: Which Java client calls list and switch contexts?
    answer: driver.getContextHandles() lists them; driver.context(name) switches; driver.getContext() returns the current one.
  - id: recall-switch-back
    concept: context-switching
    prompt: Why switch back to NATIVE_APP in a finally block?
    answer: So native steps work even if the web part failed - in a webview context, native elements can't be found.
  - id: recall-android-webview
    concept: platform-differences
    prompt: What does Android need for Appium to drive a webview?
    answer: A debuggable webview (setWebContentsDebuggingEnabled) and a Chromedriver matching the webview's major version.
  - id: recall-ios-webview
    concept: platform-differences
    prompt: What does iOS need for Appium to drive a webview?
    answer: An inspectable WKWebView (isInspectable), Web Inspector switched on for real devices, and a macOS host with Xcode.

