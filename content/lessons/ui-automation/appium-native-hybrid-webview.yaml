placement:
  - id: place-context
    type: mcq
    concept: context-switching
    skill: application
    title: Not found in the webview
    prompt: |
      After switching to the webview context and paying, the test can't find the app's native "Close" button,
      which is clearly on screen. What is wrong?
    options:
      - id: still-web
        text: The test is still in the webview context - switch back to NATIVE_APP first
        feedback: Correct.
      - id: locator
        text: Native buttons need XPath
        feedback: Any native locator works - but only in the native context.
      - id: wait
        text: The button needs a longer wait
        feedback: It is on screen - the test is looking in the wrong context.
      - id: restart
        text: The session must be restarted to leave a webview
        feedback: driver.context("NATIVE_APP") switches back at any time.
    correct: [still-web]
    solution: |
      **Switch back to `NATIVE_APP`.**

  - id: place-app-type
    type: mcq
    concept: app-types
    skill: application
    title: The right session
    prompt: |
      You need to test the SandPay shop's web pages as a phone user sees them in Chrome on Android - no app
      involved. Which session?
    options:
      - id: browser
        text: A browser session - browserName Chrome with UiAutomator2, no app
        feedback: Correct - mobile web.
      - id: app-webview
        text: An app session, then switch to a webview
        feedback: There is no app here - the pages run in the browser.
      - id: native
        text: A native session with XPath on the page text
        feedback: You would lose web locators; a browser session gives you the DOM directly.
      - id: desktop
        text: Desktop Chrome at phone width is the same
        feedback: Useful and cheaper, but not the same - real mobile Chrome differs in keyboard, viewport and touch behaviour.
    correct: [browser]
    solution: |
      **A browser session** (`browserName`, no `app`).

  - id: place-platform
    type: mcq
    concept: platform-differences
    skill: application
    title: The iOS webview requirement
    prompt: |
      On iOS, Appium doesn't list the app's WKWebView. Which change in the app is usually required?
    options:
      - id: inspectable
        text: Setting the WKWebView's isInspectable property to true in a test build
        feedback: Correct - the XCUITest driver's guide lists it as a requirement.
      - id: chromedriver
        text: Bundling a Chromedriver with the app
        feedback: Chromedriver is the Android mechanism; iOS uses Safari's remote web inspector.
      - id: debug-flag
        text: Calling WebView.setWebContentsDebuggingEnabled(true)
        feedback: That is the Android API.
      - id: nothing
        text: Nothing - every WKWebView is visible to Appium
        feedback: It must be inspectable, and Web Inspector must be on for real devices.
    correct: [inspectable]
    solution: |
      **`isInspectable = true`** (plus Web Inspector on for real devices).
