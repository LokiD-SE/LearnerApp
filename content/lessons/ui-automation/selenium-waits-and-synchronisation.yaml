id: selenium-waits-and-synchronisation
title: Explicit waits and synchronisation
subject: ui-automation
module: selenium-webdriver
level: intermediate
status: published
estimatedMinutes: 55
summary: Why UI tests race the application, how WebDriverWait waits for a condition instead of for time, and how to diagnose the stale elements, intercepted clicks and timeouts behind "flaky" tests.
tags: [selenium, waits, webdriverwait, expectedconditions, flaky tests, stale element, implicit wait, synchronisation, interview]

environment: |
  - **Tools:** Selenium 4 with Java (the practice framework uses Selenium 4.51), Google Chrome.
  - **Selenium specifics (checked in the selenium-support 4.51.0 jar):** `WebDriverWait` is a `FluentWait`
    that polls every **500 ms** by default and ignores `NotFoundException` (so `NoSuchElementException`)
    while it waits; `FluentWait.until` runs the condition on the calling thread and checks the timeout
    only between polls. The implicit wait is a WebDriver session timeout (0 by default). The Selenium
    documentation says "Do not mix implicit and explicit waits".
  - **Standards:** the W3C WebDriver specification defines the implicit-wait timeout (section 9, initially
    0), the "find" loop that repeats a search until it finds something or the implicit wait runs out
    (12.3), the page-load strategy (`driver.get` returns when the page has loaded under the default
    "normal" strategy), what Element Click waits for (12.5.1) and the errors named here, such as "stale
    element reference" and "element click intercepted" (6.6).
  - **Practice target:** the SandPay Demo Shop (`practice/shop`, or [the published copy](shop/index.html)).
    Its delays are deliberate and fictional: products load after 0.8 s, payments take 1 to 4 s, and some
    orders stay PENDING for about 3 s (`TEST_CARDS` in `practice/shop/shop.js`).
  - **Sources:**
    - Selenium documentation: [Waiting strategies](https://www.selenium.dev/documentation/webdriver/waits/)
      (implicit wait default 0, the warning against mixing waits and its 10 s + 15 s example).
    - Selenium Java API: [WebDriverWait](https://www.selenium.dev/selenium/docs/api/java/org/openqa/selenium/support/ui/WebDriverWait.html),
      [FluentWait](https://www.selenium.dev/selenium/docs/api/java/org/openqa/selenium/support/ui/FluentWait.html),
      [ExpectedConditions](https://www.selenium.dev/selenium/docs/api/java/org/openqa/selenium/support/ui/ExpectedConditions.html).
    - W3C, [WebDriver Level 2](https://www.w3.org/TR/webdriver2/) - 9 "Timeouts", 12.3 "Element retrieval",
      12.5 "Interaction" (Element Click, Clear and Send Keys), 6.6 "Errors".
    - [Playwright actionability checks](https://playwright.dev/docs/actionability) for the comparison in
      the trade-offs.
prerequisites:
  - selenium-locators

concepts:
  - id: explicit-waits
    name: Explicit waits
    summary: WebDriverWait asks a condition repeatedly until it holds or a timeout ends - wait for the state the test needs, never for a fixed time.
  - id: synchronisation-failures
    name: Synchronisation failures
    summary: Flaky UI tests usually race the application - fixed sleeps, mixed implicit and explicit waits, stale elements, overlays and asynchronous status.

objectives:
  - Explain why a UI test and the application run concurrently, and which events driver calls do and do not wait for.
  - Write explicit waits for visibility, clickability, invisibility, text and custom conditions, with sensible timeouts.
  - Diagnose stale elements, intercepted clicks and timeouts from their error messages and evidence.
  - Explain why fixed sleeps and mixed implicit and explicit waits make suites slow and flaky.

sections:
  - id: intuition
    kind: intuition
    concepts: [explicit-waits, synchronisation-failures]
    title: The idea in plain language
    body: |
      You order a coffee. You can:

      - **Stare at the clock for exactly 3 minutes**, then grab whatever is on the counter. Sometimes the
        coffee isn't ready (you grab nothing); usually it was ready after 1 minute (you wasted 2). That is
        `Thread.sleep`.
      - **Glance at the counter every few seconds, and leave if nothing comes within 10 minutes.** You
        take the coffee the moment it appears, and you don't wait forever. That is an **explicit wait**.

      A UI test and the application run **at the same time**. The test clicks "Pay"; the page shows a
      spinner, calls a server, and seconds later shows the result. A test that doesn't wait for the
      *result* - only for time, or not at all - is racing the application, and it loses sometimes.

  - id: what
    kind: what
    concepts: [explicit-waits]
    title: What Selenium gives you
    body: |
      | Wait | What it does | Use it? |
      |---|---|---|
      | `Thread.sleep(ms)` | pauses for a fixed time, whatever happens | no - too slow when the app is fast, too short when it is slow |
      | **Implicit wait** - `driver.manage().timeouts().implicitlyWait(d)` | every `findElement` and `findElements` keeps retrying up to `d` until at least one element *exists* (the spec also lets `clear` and `sendKeys` use it to wait for an element to become interactable) | not with explicit waits; it does not wait for "visible", "clickable" or "has this text" |
      | **Explicit wait** - `new WebDriverWait(driver, timeout).until(condition)` | asks the condition repeatedly until it returns a value (not null or false), or throws `TimeoutException` | **yes** - for every state change the test depends on |

      **Ready-made conditions** in `ExpectedConditions`: `visibilityOfElementLocated`,
      `elementToBeClickable` (visible and enabled), `invisibilityOfElementLocated`,
      `textToBePresentInElementLocated`, `urlContains`, `frameToBeAvailableAndSwitchToIt`,
      `stalenessOf`, `numberOfElementsToBe`, `attributeToBe` and more.

      **Custom conditions** are lambdas: `wait.until(d -> d.findElement(STATUS).getText().equals("PAID"))`.
      Return the value you need, or null / false for "not yet".

  - id: why
    kind: why
    concepts: [synchronisation-failures]
    title: Why synchronisation is the main source of flaky tests
    body: |
      Driver calls wait for some things and not others:

      - `driver.get(url)` waits for the page to **load** (under the default page-load strategy) - not for
        the JavaScript that loads data afterwards, starts timers or polls a server.
      - `click()` returns once the click has been **dispatched** - and, if the click itself starts a
        navigation, once that page has loaded (W3C Element Click, 12.5.1). It does not wait for a request
        the click triggers in JavaScript, or for a page that script opens later - as the shop's Pay button
        does after a 1-4 s "payment".
      - `findElement` returns elements that exist - possibly still hidden, disabled, covered or about to
        be replaced.

      So every place where the application does something **later** - after a request, a timer, an
      animation, a webhook - is a race. The test passes when the application happens to be fast enough,
      and fails on a slower CI machine, under load, or on a bad network day. Teams then retry and label
      the test "flaky", and real defects start hiding among the noise.

  - id: internals
    kind: internals
    concepts: [explicit-waits, synchronisation-failures]
    title: How WebDriverWait works
    body: |
      `until(condition)` runs a loop (it is `FluentWait` underneath):

      1. Call the condition with the driver.
      2. If it returned a value other than `null` or `false`, **return that value** - the wait ends at
         once.
      3. If it threw an exception the wait ignores - `NotFoundException` by default, so
         `NoSuchElementException` - treat that as "not yet".
      4. If the timeout has passed, throw `TimeoutException` (with your `withMessage` text, if set).
      5. Sleep for the polling interval (500 ms by default) and go back to step 1.

      Things that follow from the loop:

      - **A wait ends as soon as the condition holds**, so a generous timeout costs nothing when the app is
        fast. Timeouts should be generous; sleeps can't be.
      - **Exceptions that are not ignored end the wait immediately** - for example
        `StaleElementReferenceException` from an element you found *before* the page re-rendered. Find
        elements **inside** the condition, so every poll gets a fresh one.
      - **An implicit wait runs inside every `findElement` of the condition.** With an implicit wait of
        10 s, a condition that looks for an element that has gone takes 10 s per poll - the explicit
        timeout is no longer what decides how long you wait. This is why the Selenium documentation says
        not to mix them.

  - id: visual
    kind: visual
    concepts: [synchronisation-failures, explicit-waits]
    title: "Sequence: the test and the shop run at the same time"
    body: |
      ```mermaid
      sequenceDiagram
          participant T as Test
          participant B as Browser - shop page
          T->>B: click Pay
          B-->>T: click dispatched, returns at once
          Note over B: overlay shown, payment processing
          T->>B: read the status - too early, it is not there yet
          Note over B: about 1.5 s later the order page opens
          T->>B: wait.until status is final - asks every 500 ms
          B-->>T: SUCCEEDED
      ```

      The click returns long before the payment finishes. Reading the status straight after the click is
      a race; a sleep "long enough" is a guess; the explicit wait asks until the page shows the state the
      test needs.

  - id: when
    kind: when
    concepts: [explicit-waits]
    title: What to wait for, situation by situation
    body: |
      | Situation | Wait for |
      |---|---|
      | content loads after the page (a list, a search result) | the loading indicator to end, or the expected items to be visible |
      | a button enables after the form is valid | `elementToBeClickable` |
      | a spinner or overlay covers the page | `invisibilityOfElementLocated` before the next click |
      | a click navigates | `urlContains` or a heading of the next page - in the next page object's constructor |
      | a status changes later (PENDING to SUCCEEDED) | a custom condition on the status text, returning it |
      | a list re-renders (sort, filter) | the re-render to finish, then find the elements again |
      | an iframe's content | `frameToBeAvailableAndSwitchToIt` |

      **Where waits live:** in page objects, next to the action that causes the change. `addToCart`
      waits until the cart count has changed; `pay` returns the next page object only once it has loaded.
      Tests then read like the user's story and never sleep.

      **Timeouts:** one configured default (the practice framework uses 10 s, set with
      `-Dtimeout.seconds`), longer only where the system really is slower - and never a sleep "to be
      safe".

  - id: example
    kind: example
    concepts: [synchronisation-failures]
    title: "Real-world example: 1 failure in 20 runs, only in CI"
    body: |
      A checkout test failed about once in twenty CI runs with
      `ElementClickInterceptedException: element click intercepted ... Other element would receive the
      click: <div class="overlay" ...>`. It never failed on developers' laptops.

      **Evidence:** the failure screenshot showed the "Processing your payment..." overlay over the
      page. The test had clicked "Pay" with a declined card, then immediately clicked "Pay" again to retry
      with another card. On a laptop the decline came back fast enough; on the busier CI machine the overlay
      was still there.

      **What did not help:** retries (they hid it), `Thread.sleep(1000)` (slower, and still failed
      occasionally), and a JavaScript click (it clicks through the overlay - the test then does something
      no user could, and stops testing the real page).

      **Fix:** the page object's `payAndExpectDecline()` waits for the overlay to disappear and the
      decline message to appear before returning. The retry click then always happens on a usable page.
      The failure rate went to zero - and the suite got faster, because nothing sleeps.

  - id: code
    kind: code
    concepts: [explicit-waits]
    title: "Code: explicit waits in the practice framework"
    collapsed: true
    body: |
      ```java
      WebDriverWait wait = new WebDriverWait(driver, Duration.ofSeconds(10));

      // ready-made conditions
      wait.until(ExpectedConditions.elementToBeClickable(PAY)).click();
      wait.until(ExpectedConditions.invisibilityOfElementLocated(OVERLAY));
      wait.until(ExpectedConditions.urlContains("order.html"));

      // custom condition: find the element inside the lambda, return the value you need
      String status = wait
          .withMessage("a final order status")
          .until(d -> {
              String text = d.findElement(STATUS).getText().trim();
              return Set.of("SUCCEEDED", "FAILED").contains(text) ? text : null;
          });

      // wait for a change you caused: compare with the value before the action
      int before = header.cartCount();
      driver.findElement(addToCart).click();
      wait.until(d -> header.cartCount() == before + 1);

      // FluentWait when you need a different polling interval or more ignored exceptions
      new FluentWait<>(driver)
          .withTimeout(Duration.ofSeconds(30))
          .pollingEvery(Duration.ofSeconds(2))
          .ignoring(StaleElementReferenceException.class)
          .until(d -> d.findElement(STATUS).getText().equals("SUCCEEDED"));
      ```

  - id: tests
    kind: tests
    concepts: [synchronisation-failures, explicit-waits]
    title: Making timing problems show up before CI finds them
    body: |
      | ID | Check | Why |
      |---|---|---|
      | W1 | run the suite with the browser throttled (DevTools network and CPU throttling, or a slow test environment) | races that a fast laptop hides appear |
      | W2 | run a suspicious test 50 times in a loop | a 1-in-20 failure becomes visible in minutes |
      | W3 | search the code for `Thread.sleep` and `implicitlyWait` | each one is a candidate race or slowdown |
      | W4 | a wait helper returns at once when the condition already holds (time it) | catches hidden sleeps |
      | W5 | a wait helper throws after its timeout when the condition never holds | catches waits that ignore the timeout or swallow failures |
      | W6 | every failure keeps a screenshot and the page source | timing failures are diagnosed from evidence, not by re-running |

      The coding exercise's tests use W4 and W5 to check your waits.

  - id: mistakes
    kind: mistakes
    concepts: [synchronisation-failures, explicit-waits]
    title: Common mistakes and how to debug them
    body: |
      - **`Thread.sleep`** anywhere in tests or page objects.
      - **Mixing implicit and explicit waits** - wait times become unpredictable; the Selenium documentation's
        example is a 10 s implicit and a 15 s explicit wait timing out after 20 s.
      - **Waiting for presence when you need visibility or clickability** - the element exists but is
        hidden, disabled or covered.
      - **Holding elements across re-renders** - `StaleElementReferenceException`. Find elements again
        after anything that re-renders, or inside the wait condition.
      - **Waiting in the test instead of the page object** - every test repeats (and forgets) the wait.
      - **JavaScript clicks to "fix" intercepted clicks** - they skip the real user interaction and hide
        real defects such as an overlay that never closes.
      - **Retrying flaky tests instead of fixing them** - retries turn a visible race into an invisible one.

      **Debugging method - read the exception, then the evidence:**

      | Exception | Usually means | Look at |
      |---|---|---|
      | `NoSuchElementException` | not there *yet*, wrong locator, or wrong frame | the screenshot at failure: is the element on screen? |
      | `TimeoutException` | the condition never held - the app really failed, or the condition is wrong | the last state on the screenshot; the wait's message |
      | `StaleElementReferenceException` | the page replaced the element after you found it | what re-rendered between finding and using it |
      | `ElementClickInterceptedException` | something covers the element | the "other element would receive the click" in the message |
      | `ElementNotInteractableException` | hidden, zero-sized or disabled | CSS state at failure; responsive layouts |

  - id: tradeoffs
    kind: tradeoffs
    concepts: [explicit-waits]
    title: Trade-offs
    body: |
      | Approach | Strengths | Costs |
      |---|---|---|
      | explicit waits in page objects | fast, precise, readable tests | every asynchronous behaviour must be known and modelled |
      | one global implicit wait | almost no code | only covers "exists"; hides slow locators; conflicts with explicit waits |
      | waiting on application signals (`aria-busy`, a "loaded" attribute, network idle) | robust, one rule for many pages | needs cooperation from developers; Selenium has no built-in network-idle wait |
      | auto-waiting tools (Playwright waits for actionability before each action) | fewer waits to write | still need explicit waits for business state such as PENDING to SUCCEEDED |
      | retries of failed tests | green builds quickly | hide real races and real defects; use only with tracking and a deadline to fix |

      The demo shop marks its product list with `aria-busy` while loading - one example of an application
      signal that makes waits simple. Ask for such signals; they help screen-reader users as well.

  - id: summary
    kind: summary
    title: Summary and quick reference
    body: |
      - The test and the app run concurrently; `click()` and `get()` don't wait for what happens later.
      - Wait for **state**, not time: `new WebDriverWait(driver, timeout).until(condition)`.
      - The wait returns as soon as the condition returns a value; polls every 500 ms; ignores
        `NoSuchElementException`; throws `TimeoutException` at the end.
      - Find elements **inside** the condition. Never mix implicit and explicit waits. No `Thread.sleep`.
      - Put waits in page objects, next to the action that causes the change.
      - Diagnose from the exception and the screenshot: not yet, covered, stale, or never.

exercises:
  - id: until-returns
    type: mcq
    concept: explicit-waits
    skill: recognition
    title: When does until return?
    prompt: |
      `wait.until(condition)` with a 10-second timeout. When does it return normally?
    options:
      - id: value
        text: As soon as the condition returns something other than null or false - and it returns that value.
        feedback: Correct - which is why a custom condition can return the status text it found.
      - id: full-timeout
        text: After the full 10 seconds, if the condition held at some point.
        feedback: The timeout is a limit, not a duration. The wait ends at the first poll where the condition holds.
      - id: first-true-boolean
        text: Only when the condition returns the boolean true; other values are ignored.
        feedback: Any non-null value ends the wait (false is the only non-null value that means "not yet"), so conditions can return elements, strings or numbers.
      - id: exception
        text: When the condition throws any exception.
        feedback: Ignored exceptions (NotFoundException by default) mean "not yet"; other exceptions end the wait by propagating - not by returning.
    correct: [value]
    hints:
      - Think about why a lambda returning a String is allowed as a condition.
    solution: |
      **At the first poll where the condition returns a value other than null or false**, and `until`
      returns that value. If that never happens before the timeout, it throws `TimeoutException`.
    followUp: |
      Write a condition that waits until the cart count is at least 2 and returns the count.

  - id: which-line-is-stale
    type: debug
    concept: synchronisation-failures
    skill: analysis
    title: Where does it go stale?
    prompt: |
      This test throws `StaleElementReferenceException`. Click the line where it is thrown.
    language: java
    code: |
      CatalogPage.open(driver, shop);
      List<WebElement> names = driver.findElements(By.cssSelector("[data-testid='product-name']"));
      new Select(driver.findElement(SORT)).selectByVisibleText("Price: low to high");
      wait.until(d -> "false".equals(d.findElement(PRODUCT_LIST).getDomAttribute("aria-busy")));
      String cheapest = names.get(0).getText();
      assertEquals("Oat milk 1 L", cheapest);
    correctLines: [5]
    lineNotes:
      - line: 2
        note: Finding the names here is fine for the page as it is at this moment - but the re-sort on line 3 replaces every card, and these references are not refreshed.
      - line: 4
        note: This wait is correct - it waits until the re-sort has finished. The problem is what happens after it.
      - line: 3
        note: Changing the sort order is a legitimate action; it triggers the re-render that makes the old references stale.
    hints:
      - Which elements exist after the list is re-rendered - the old ones, or new ones?
      - The exception is thrown when an old reference is *used*.
    solution: |
      **Line 5.** The names found on line 2 belong to cards the re-sort replaced. Using one of those
      references afterwards throws `StaleElementReferenceException`.

      Fix: find the names **after** the wait - move line 2 below line 4 - or better, let the page object
      return data: `catalog.sortBy("Price: low to high").productNames().get(0)`. Data can't go stale;
      element references can.
    followUp: |
      Why would wrapping line 5 in a `WebDriverWait` with the default settings not help either?

  - id: wait-loop-order
    type: order
    concept: explicit-waits
    skill: recall
    title: Inside WebDriverWait.until
    prompt: |
      Put the steps of one round of `WebDriverWait.until(condition)` in order.
    items:
      - id: call
        text: Call the condition with the driver
      - id: return
        text: If it returned a value other than null or false, return that value
      - id: ignore
        text: If it threw an ignored exception (NotFoundException by default), treat it as "not yet"
      - id: timeout
        text: If the timeout has passed, throw TimeoutException
      - id: sleep
        text: Sleep for the polling interval (500 ms by default), then start again
    hints:
      - The check for the timeout comes after the condition has had its chance.
    solution: |
      **Call → return a value if there is one → ignore "not found" → timeout check → sleep and repeat.**
      Because the condition is called first, a wait for something that is already true costs one call.
    followUp: |
      With this loop in mind, explain why an implicit wait of 10 s can make a 5 s explicit wait for a
      removed spinner take more than 10 s.

  - id: order-status-waits
    type: coding
    concept: explicit-waits
    skill: application
    title: Wait for the payment, not for time
    prompt: |
      Implement `OrderWaits.waitForFinalStatus` (wait until the order page shows SUCCEEDED or FAILED and
      return it) and `waitForProcessingToFinish` (wait until the checkout overlay is gone). The tests use
      test cards that stay PENDING for about 3 seconds, check that your waits give up when their timeout
      runs out, and check that they return at once when there is nothing to wait for - so `Thread.sleep`
      fails them.
    project: framework
    files:
      - src/exercises/java/learnerapp/exercises/waits/OrderWaits.java
    test: src/test/java/learnerapp/exercises/OrderWaitsTest.java
    command: mvn test -Dtest=OrderWaitsTest
    hints:
      - "`new WebDriverWait(driver, timeout).until(...)` - the timeout comes from the parameter."
      - For the status, write a lambda that finds the status element, reads its text, and returns it if it is final - otherwise null.
      - For the overlay, one of the ready-made `ExpectedConditions` does exactly this, and is true at once when the overlay is hidden.
    modelAnswer: |
      ```java
      public static String waitForFinalStatus(WebDriver driver, Duration timeout) {
          return new WebDriverWait(driver, timeout)
              .withMessage("a final order status (SUCCEEDED or FAILED)")
              .until(d -> {
                  String status = d.findElement(STATUS).getText().trim();
                  return FINAL.contains(status) ? status : null;   // null: not yet
              });
      }

      public static void waitForProcessingToFinish(WebDriver driver, Duration timeout) {
          new WebDriverWait(driver, timeout).until(ExpectedConditions.invisibilityOfElementLocated(OVERLAY));
      }
      ```

      The status element is found **inside** the lambda, so every poll reads the current page.
    rubric:
      - Every test in OrderWaitsTest passes
      - No Thread.sleep and no implicit wait
      - The status condition returns the final status itself, not just true
      - The given timeout is used, and a clear message is set for timeouts
    solution: |
      The tests check behaviour, not code: a PENDING order is followed to SUCCEEDED or FAILED, an 800 ms
      timeout ends in `TimeoutException` within 2.5 s, and an already-final status or a hidden overlay
      returns in well under 1.5 s. The reference solution is in
      `src/solutions/java/learnerapp/exercises/waits/OrderWaits.java`.
    followUp: |
      The real SandPay sandbox might take up to 2 minutes to settle. Would you raise the timeout of this
      UI wait, or check the outcome another way? Argue both sides.

  - id: implicit-plus-explicit
    type: mcq
    concept: synchronisation-failures
    skill: application
    title: Two waits, one surprise
    prompt: |
      The suite sets `implicitlyWait(Duration.ofSeconds(10))`. A helper then waits up to **5 seconds** with
      `wait.until(ExpectedConditions.invisibilityOfElementLocated(SPINNER))` for a loading spinner that the
      page **removes** from the DOM when loading ends. Loading ends after 1 second. Roughly when does the
      helper return?
    options:
      - id: one-second
        text: After about 1 second, when the spinner is removed
        feedback: The condition looks for the spinner with findElement - and with an implicit wait, findElement keeps trying for 10 seconds before it reports that the spinner is gone.
      - id: five-seconds
        text: After 5 seconds, with a TimeoutException
        feedback: The timeout is only checked between polls. The condition is still inside its first slow findElement when 5 seconds pass, and then it returns true.
      - id: ten-seconds
        text: After about 11 seconds - 1 second of loading, then a findElement that waits the full implicit wait for the missing spinner
        feedback: Correct - the implicit wait, not the explicit timeout, decides the duration. This is why the two must not be mixed.
      - id: never
        text: Never - invisibility conditions don't work with removed elements
        feedback: invisibilityOfElementLocated treats a missing element as invisible; it just finds out slowly here.
    correct: [ten-seconds]
    hints:
      - What does findElement do, with a 10-second implicit wait, when the element does not exist?
    solution: |
      **About 11 seconds.** While the spinner is there, each poll finds it quickly. Once it is removed, the
      condition's `findElement(SPINNER)` retries for the full 10-second implicit wait before throwing
      `NoSuchElementException`, which the condition turns into "invisible" - long after the 5-second
      timeout. Remove the implicit wait (set it to 0) and the helper returns after about 1 s.
    followUp: |
      A team says "we need the implicit wait for old tests". How would you migrate them away from it
      without breaking the suite in one go?

  - id: intercepted-click
    type: mcq
    concept: synchronisation-failures
    skill: analysis
    title: An intercepted click
    prompt: |
      A retry click fails with:

      ```
      ElementClickInterceptedException: element click intercepted: Element <button data-testid="pay-button">
      is not clickable at point (640, 712). Other element would receive the click:
      <div class="overlay" data-testid="processing-overlay" role="status">
      ```

      The failure screenshot shows "Processing your payment...". What is the right fix?
    options:
      - id: wait-overlay
        text: Wait until the processing overlay is invisible (and the result is shown) before clicking again
        feedback: Correct - the click happened while the previous payment was still processing; wait for the state that makes the click meaningful.
      - id: js-click
        text: Click with JavaScript (executeScript arguments[0].click()) so the overlay can't intercept it
        feedback: That clicks through an overlay no user could click through. The test stops testing the real page and can mask a real defect.
      - id: sleep
        text: Add Thread.sleep(2000) before the click
        feedback: A guess. Too long when the decline is fast, too short when CI is slow - the race is still there.
      - id: clickable
        text: Wait for elementToBeClickable(PAY) before clicking
        feedback: elementToBeClickable checks only visible and enabled - not whether another element covers the button. The demo shop happens to disable Pay while processing, so it would help here; on a page that leaves the button enabled under an overlay it is true at once. Wait for what actually blocks the click - the overlay.
    correct: [wait-overlay]
    hints:
      - The message names the element that would receive the click. What is it, and when does it go away?
    solution: |
      **Wait for the overlay to disappear** (and for the decline message), ideally inside the page object's
      pay method. The exception message is the evidence: it names the covering element.
    followUp: |
      Which page object method in the practice framework already does this, and what does it return?

  - id: interview-flaky-test
    type: interview
    concept: synchronisation-failures
    skill: application
    title: "Interview: a flaky UI test"
    prompt: |
      **Interviewer:** "A UI test fails about once in twenty runs, only in CI. How do you investigate and
      fix it?"
    hints:
      - Evidence first, then reproduce, then the root cause, then a fix that removes the race.
    modelAnswer: |
      - **Collect evidence** from the failing runs: exception and message, screenshot, page source, logs,
        timing. Group the failures - same line and same exception means one cause.
      - **Reproduce:** run the test in a loop, locally with throttled CPU and network, or on the CI
        machine; a 1-in-20 failure shows up in minutes.
      - **Find the race:** what did the test do just before the failure, and what was the page still
        doing? Typical causes: a sleep, a missing wait after an action, an element held across a re-render,
        an overlay, mixed implicit and explicit waits, shared test data between parallel tests.
      - **Fix the cause:** an explicit wait for the right state, in the page object, or isolate the data.
        Not retries, longer sleeps or JavaScript clicks.
      - **Prove it:** run the loop again; keep evidence on failure so the next one is quick to analyse.
    followUps:
      - When, if ever, would you allow automatic retries in CI?
      - The failure is a TimeoutException waiting for SUCCEEDED. Is it the test or the product?
      - How would you find all the sleeps and implicit waits in a large suite?
    rubric:
      - Started from evidence of the failing runs, not from guessing
      - Reproduced it (loop, throttling, CI-like environment)
      - Named concrete synchronisation causes
      - Fixed the race with explicit waits for state, not retries or sleeps
      - Verified the fix by repeating the runs
    solution: |
      Strong answers treat a flaky test as **a defect with evidence** - in the test or in the product -
      not as bad luck, and they distinguish hiding the symptom from removing the race.

  - id: why-not-sleep
    type: short
    concept: explicit-waits
    skill: recall
    title: Why not Thread.sleep?
    prompt: |
      In two to four sentences: why is `Thread.sleep` the wrong way to wait in a UI test, and what do you
      use instead?
    hints:
      - Consider what happens when the application is faster than the sleep, and when it is slower.
    modelAnswer: |
      A sleep waits a fixed time regardless of what the application does: when the app is faster, every
      run wastes the difference; when it is slower (CI, load), the test acts too early and fails at
      random. An explicit wait - WebDriverWait with a condition - polls for the state the test needs,
      returns as soon as it holds, and fails with a TimeoutException only if it never does.
    rubric:
      - Said a sleep is too slow when the app is fast
      - Said a sleep is too short when the app is slow, causing random failures
      - Named explicit waits for a condition as the alternative
      - Said the explicit wait returns as soon as the condition holds
    solution: |
      Short version: **sleeps wait for time, tests need state.**

recall:
  - id: recall-explicit
    concept: explicit-waits
    prompt: What does WebDriverWait.until return, and when?
    answer: The condition's value, at the first poll where it is neither null nor false. Otherwise TimeoutException when the timeout passes.
  - id: recall-defaults
    concept: explicit-waits
    prompt: What are WebDriverWait's default polling interval and ignored exception?
    answer: 500 ms, and NotFoundException (which covers NoSuchElementException).
  - id: recall-inside
    concept: explicit-waits
    prompt: Why find elements inside the wait condition rather than before it?
    answer: Every poll then reads the current page; an element found earlier may have been replaced, and StaleElementReferenceException ends the wait.
  - id: recall-mixing
    concept: synchronisation-failures
    prompt: Why not mix implicit and explicit waits?
    answer: The implicit wait runs inside every findElement of the explicit wait's condition, so wait times become unpredictable - often far longer than the explicit timeout.
  - id: recall-stale
    concept: synchronisation-failures
    prompt: What does StaleElementReferenceException mean?
    answer: The page replaced or removed the element after you found it (re-render, re-sort, reload). Find it again.
  - id: recall-intercepted
    concept: synchronisation-failures
    prompt: What does ElementClickInterceptedException tell you, and what is the usual fix?
    answer: Another element (named in the message) covers the target - often an overlay or spinner. Wait until it is gone; don't click with JavaScript.

