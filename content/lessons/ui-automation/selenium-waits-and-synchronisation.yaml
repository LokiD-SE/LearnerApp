placement:
  - id: place-payment-wait
    type: mcq
    concept: explicit-waits
    skill: application
    title: Waiting for a payment
    prompt: |
      After clicking Pay, the order page shows SUCCEEDED after 1 to 4 seconds, depending on the test card.
      Which approach fits best?
    options:
      - id: sleep-five
        text: "`Thread.sleep(5000)`, then read the status"
        feedback: Always slow, and still fails the day the payment takes longer than 5 seconds.
      - id: explicit
        text: A WebDriverWait with a generous timeout whose condition returns the status once it is final
        feedback: Correct - it returns as soon as the status is final and fails clearly if it never is.
      - id: implicit
        text: An implicit wait of 10 seconds, then read the status
        feedback: The status element exists at once (showing PENDING), so an implicit wait doesn't wait for the text to change.
      - id: retry
        text: Read the status at once, and retry the whole test if it fails
        feedback: Retrying hides the race and makes the suite slower and less trustworthy.
    correct: [explicit]
    solution: |
      **An explicit wait for the final status.** Wait for state, with a timeout that bounds the wait - not
      for a fixed time.

  - id: place-stale
    type: mcq
    concept: synchronisation-failures
    skill: application
    title: After re-sorting
    prompt: |
      A test stores the product cards in a list, changes the sort order, waits until the list has
      re-rendered, then reads the first stored card's name. What happens?
    options:
      - id: stale
        text: StaleElementReferenceException - the stored cards were replaced by the re-render
        feedback: Correct - find the cards again after the re-render.
      - id: old-first
        text: It reads the name of the product that was first before sorting
        feedback: The old element objects are gone from the page; Selenium can't read them at all.
      - id: new-first
        text: It reads the new first product, because Selenium refreshes stored elements
        feedback: Selenium never re-finds elements by itself.
      - id: no-such
        text: NoSuchElementException
        feedback: That is thrown when findElement finds nothing. Here the problem is using an element found earlier.
    correct: [stale]
    solution: |
      **StaleElementReferenceException.** Element references are tied to the element objects in the page;
      a re-render replaces them. Read data after the change, or find the elements again.
