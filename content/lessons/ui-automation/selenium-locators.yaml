id: selenium-locators
title: Locator strategy - CSS, XPath and stable attributes
subject: ui-automation
module: selenium-webdriver
level: beginner
status: published
estimatedMinutes: 50
summary: How Selenium finds elements, what CSS selectors and XPath can each express, and how to write locators that survive redesigns, re-sorting and every new page load.
tags: [selenium, webdriver, locators, css selectors, xpath, data-testid, flaky tests, devtools, interview]

environment: |
  - **Tools:** Selenium 4 with Java (the practice framework uses Selenium 4.51 and JUnit 6), Google Chrome
    and its DevTools.
  - **Standards:** the W3C WebDriver specification defines five locator strategies - CSS selector, link
    text, partial link text, tag name and XPath. Browsers evaluate XPath 1.0. Selenium's `By.id`,
    `By.name` and `By.className` are conveniences that the Java bindings send as CSS selectors.
  - **Practice target:** the SandPay Demo Shop (`practice/shop`), also published with this app at
    [shop/](shop/index.html). It is fictional. Its element ids and one CSS class are generated anew on
    every page load - on purpose.
  - **Practice project:** `practice/framework` - see the coding exercise.

prerequisites:
  - java-types-and-variables
  - browser-devtools-for-testers

concepts:
  - id: locator-strategies
    name: Locator strategies
    summary: How Selenium searches the page, and what CSS selectors, XPath, link text and relative locators can and cannot express.
  - id: stable-locators
    name: Stable locators
    summary: Locators built on attributes meant for tests or on what the user sees, matching exactly one element - never generated ids, styling classes, positions or absolute paths.

objectives:
  - Explain how findElement and findElements search the page and what each returns when nothing matches.
  - Choose between CSS selectors, XPath and the other strategies for a given element, and write the locator.
  - Recognise brittle locators - generated ids, styling classes, positions, absolute paths - and replace them with stable ones.
  - Check a locator in DevTools for exactly one match, across reloads and re-renders.

sections:
  - id: intuition
    kind: intuition
    concepts: [stable-locators, locator-strategies]
    title: The idea in plain language
    body: |
      A locator is **directions to an element**. Compare directions to a friend's house:

      - "The third house on the left" - correct today, wrong as soon as someone builds a house in between.
        That is a **positional** locator: `(//button)[3]`.
      - "The blue house" - wrong when they repaint. That is a **styling** locator: `.btn-blue`.
      - "Number 14, Rao on the name plate" - survives new houses and new paint. That is a locator on an
        attribute that exists **to identify** the element: `[data-testid='pay-button']`, or on what the
        user sees, such as the product's name.

      A good locator describes the element by **what it is**, not by where it happens to be or how it
      happens to look.

  - id: what
    kind: what
    concepts: [locator-strategies]
    title: What Selenium offers
    body: |
      | Strategy (Java) | Matches | Example |
      |---|---|---|
      | `By.id("email")` | the `id` attribute | `By.id("email")` |
      | `By.name("email")` | the `name` attribute (form fields) | `By.name("card-name")` |
      | `By.cssSelector(...)` | any CSS selector: attributes, classes, structure | `By.cssSelector("[data-testid='sort']")` |
      | `By.xpath(...)` | XPath 1.0: attributes, structure **and text**, and moving up to parents | `By.xpath("//h2[normalize-space()='Pour-over kit']")` |
      | `By.linkText(...)` / `By.partialLinkText(...)` | the visible text of `<a>` links only | `By.linkText("Checkout")` |
      | `By.tagName(...)` / `By.className(...)` | one tag or one class | `By.tagName("iframe")` |
      | `RelativeLocator.with(...)` | an element above, below, left or right of, or near another | `with(By.tagName("button")).below(nameLocator)` |

      **Two ways to search:**

      - `findElement(locator)` returns the **first** match in document order, and throws
        `NoSuchElementException` when there is none.
      - `findElements(locator)` returns **all** matches - an empty list when there are none, never an
        exception. Use it to check that something is *absent*, or that a locator matches exactly one.

      Both can be called on a `WebElement` too, to search only inside it.

  - id: why
    kind: why
    concepts: [stable-locators]
    title: Why locators decide whether a suite survives
    body: |
      Locators are where UI tests meet the markup, so they are where most UI-test maintenance happens:

      - **A redesign renames CSS classes** and dozens of tests fail at once - although the product works.
      - **A list is re-sorted or a banner is added** and positional locators click the wrong item. That is
        worse than failing: the test continues with the wrong product and fails later with a confusing
        message, or passes when it shouldn't.
      - **Generated ids** (frameworks and CSS-in-JS libraries create them) change between builds or even
        between page loads, so a locator copied from DevTools works once.

      Every such failure looks like a product defect until someone investigates. A team that trusts its
      UI tests is mostly a team with stable locators.

  - id: internals
    kind: internals
    concepts: [locator-strategies]
    title: How finding an element works
    body: |
      1. Your Java call `driver.findElement(By.cssSelector("..."))` becomes an HTTP request to the browser
         driver (ChromeDriver), with a W3C **strategy** (`css selector`) and a **value**.
      2. The driver searches the **current browsing context** - the page, or the iframe you switched to -
         from the document root, or from an element if you called `findElement` on one.
      3. It returns references to the matching elements, in **document order**. `findElement` takes the
         first one.
      4. The reference is tied to that element *object* in the page. If the page later replaces the
         element - a re-render, a re-sort, a reload - using the old reference throws
         `StaleElementReferenceException`, even when an identical-looking element is now there.

      Consequences:

      - **Elements in an iframe are invisible** until you `driver.switchTo().frame(...)`; elements in a
        shadow root need `element.getShadowRoot()` first.
      - **A locator that matches several elements "works"** with `findElement` - it silently takes the
        first. Which one is first can change.
      - **CSS cannot match text**, and cannot step up to a parent by text. XPath can - for example "the
        card whose name is X, then its button".

  - id: visual
    kind: visual
    concepts: [stable-locators, locator-strategies]
    title: "Flowchart: choosing a locator"
    body: |
      ```mermaid
      flowchart TD
          A["An element to locate"] --> B{"Does it have a test id or a stable, unique id?"}
          B -- Yes --> T["CSS on that attribute"]
          B -- No --> C{"Does it have a stable label, name or accessible name?"}
          C -- Yes --> L["CSS or XPath on that attribute"]
          C -- No --> D{"Is it identified by visible text or by a stable element near it?"}
          D -- Yes --> X["XPath: anchor on the stable text or element, then step to the target"]
          D -- No --> R["Ask the developers for a test id"]
      ```

      Notice what never appears: **positions**, **generated ids**, **styling classes** and **absolute
      paths**. And at every step, check the locator matches exactly one element.

  - id: steps
    kind: steps
    concepts: [stable-locators]
    title: Building and checking a locator, step by step
    body: |
      1. **Inspect the element** in DevTools (right-click → Inspect). Look for `data-testid`, a meaningful
         `id`, `name`, a label, or text the user sees.
      2. **Reload the page and inspect again.** Any attribute that changed is generated - don't use it.
      3. **Write the locator.** CSS for attributes; XPath when you need text or a parent.
      4. **Count the matches** in the DevTools console: `$$("[data-testid='product-card']")` for CSS,
         `$x("//h2[normalize-space()='Oat milk 1 L']")` for XPath. Or press Ctrl+F (Cmd+F) in the
         Elements panel, which accepts both. It must be **exactly one** (or the exact list you want).
      5. **Change the page's state** - sort, filter, resize to phone width, open a dialog - and count
         again.
      6. **Put it in a page object**, as a private constant, with a name that says what it is.

  - id: example
    kind: example
    concepts: [stable-locators]
    title: "Real-world example: a redesign broke 140 tests"
    body: |
      A team's checkout suite located elements by CSS classes such as `.btn.btn-primary.checkout-pay`.
      A design-system upgrade renamed the classes, and 140 tests failed overnight. Nothing was wrong with
      checkout.

      **Evidence:** every failure was `NoSuchElementException`, the screenshots showed the expected pages,
      and the failing locators all used class names that no longer existed in the new markup.

      **Fix:** the testers and developers agreed on `data-testid` attributes for elements the tests use,
      added by the developers as part of each feature. Locators became `[data-testid='pay-button']`.
      The next redesign changed hundreds of classes and broke no tests. The agreement also made a rule
      visible: **removing or renaming a test id is a change that needs a test update**, reviewed like any
      other interface change.

  - id: code
    kind: code
    concepts: [locator-strategies, stable-locators]
    title: "Code: locators for the demo shop"
    collapsed: true
    body: |
      ```java
      // attributes that exist for tests
      By cartCount = By.cssSelector("[data-testid='cart-count']");
      By sort = By.cssSelector("[data-testid='sort']");
      By productCards = By.cssSelector("[data-testid='product-card']");

      // CSS can combine attributes and structure
      By oatMilkCard = By.cssSelector("[data-testid='product-card'][data-sku='oat-milk']");

      // XPath when the anchor is visible text: the card whose name is exactly this, then its button
      By addOatMilk = By.xpath(
          "//*[@data-testid='product-card']"
              + "[.//*[@data-testid='product-name'][normalize-space()='Oat milk 1 L']]"
              + "//button");

      // searching inside an element
      WebElement card = driver.findElement(oatMilkCard);
      String price = card.findElement(By.cssSelector("[data-testid='product-price']")).getText();

      // checking for exactly one match
      List<WebElement> found = driver.findElements(addOatMilk);
      if (found.size() != 1) throw new IllegalStateException(found.size() + " matches for " + addOatMilk);
      ```

      `normalize-space()` trims and collapses whitespace, so line breaks in the markup don't matter.
      `contains(., 'Oat milk')` would also match "Oat milk 1 L" *and* "Oat milk barista" - use exact text
      unless you really want a partial match.

  - id: tests
    kind: tests
    concepts: [stable-locators]
    title: How to test your locators
    body: |
      | ID | Check | Catches |
      |---|---|---|
      | L1 | `findElements(locator).size() == 1` | locators that match several elements and pick the first |
      | L2 | the found element is the intended one (its test id, text or data attribute) | locators that match the wrong element |
      | L3 | reload the page, check L1 and L2 again | generated ids and classes |
      | L4 | re-sort or filter the list, check again | positional locators |
      | L5 | phone-width window, check again | elements duplicated or hidden in responsive layouts |
      | L6 | the locator for something absent returns an empty list | over-broad `contains()` matches |

      The coding exercise's tests do exactly this against the demo shop.

  - id: mistakes
    kind: mistakes
    concepts: [stable-locators, locator-strategies]
    title: Common mistakes and how to debug them
    body: |
      - **Copying the absolute XPath from DevTools** (`/html/body/main/ul/li[4]/button`). It encodes the
        whole page structure; any change above the element breaks it.
      - **Generated ids and hashed classes** (`btn-k2j4l1`, `card-x8f2k`, `css-1q2w3e`). Reload and
        compare before you trust an id.
      - **Positions** (`li[4]`, `(//button)[2]`). They depend on order, which sorting, filtering and A/B
        tests change.
      - **Styling classes** (`.btn-primary`) - they describe looks, not meaning.
      - **Over-broad matches** - `findElement(By.tagName("button"))` takes the first button, whichever that
        is today.
      - **Text locators for translated text** - fine for one language, broken in another.
      - **Forgetting frames** - `NoSuchElementException` for an element you can see usually means it is in
        an iframe (or a shadow root).

      **Debugging method:** when a locator fails, run it in the DevTools console on the *same* page state
      the test saw (the failure screenshot and page source show it). Zero matches: wrong locator, wrong
      frame, or the element isn't there yet - which is a waiting problem, the [next
      lesson](#/lesson/selenium-waits-and-synchronisation). Several matches: make it more specific.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [locator-strategies, stable-locators]
    title: Trade-offs
    body: |
      | Approach | Strengths | Costs |
      |---|---|---|
      | **Test ids** (`data-testid`) | stable, explicit, fast CSS | developers must add and keep them; they say nothing about what the user sees |
      | **Accessible names and labels** | test what users and screen readers rely on; break when accessibility breaks - usually a real defect | change with copy edits and translation |
      | **CSS selectors** | fast, readable, well known | no text matching, can't select a parent by its content |
      | **XPath** | text, parents, siblings, conditions | verbose; easy to write brittle absolute paths |
      | **Relative locators** | readable for layout-defined elements | depend on rendered geometry, which changes with window size |

      Other tools lean towards user-facing locators: Playwright's `getByRole` and Testing Library's
      queries put roles, labels and text first, and test ids last. Both approaches work; what matters is a
      rule the team agrees on and keeps.

  - id: summary
    kind: summary
    title: Summary and quick reference
    body: |
      - `findElement`: first match or `NoSuchElementException`. `findElements`: all matches, maybe none.
      - Prefer test ids and stable attributes; then labels or visible text; ask for a test id rather than
        settling for something brittle.
      - Never: generated ids, styling classes, positions, absolute paths.
      - CSS for attributes and structure; XPath for text and parents; exact text with `normalize-space()`.
      - Check: exactly one match, after a reload, after re-sorting, at phone width.
      - Elements in iframes and shadow roots need a switch or `getShadowRoot()` first.

exercises:
  - id: text-strategies
    type: mcq
    concept: locator-strategies
    skill: recognition
    title: Which strategies can match visible text?
    prompt: |
      Which of these Selenium strategies can find an element **by its visible text**? Select every one that
      applies.
    options:
      - id: xpath
        text: "`By.xpath`"
        feedback: Correct - for example `//h2[normalize-space()='Pour-over kit']`, on any element.
      - id: link-text
        text: "`By.linkText`"
        feedback: Correct, but only for `<a>` links - it can't find a heading or a button by text.
      - id: css
        text: "`By.cssSelector`"
        feedback: CSS selectors match attributes, classes and structure, not text. (`:contains` was a jQuery extension, never standard CSS.)
      - id: class-name
        text: "`By.className`"
        feedback: It matches one class name - styling information, not text.
    correct: [xpath, link-text]
    hints:
      - Which of these were designed around attributes and structure only?
    solution: |
      **XPath** (any element) and **link text** (links only). CSS can't match text, which is why "the card
      whose name is X" needs XPath, or a test id that contains the product's identity.
    followUp: |
      Write an XPath that finds the "Checkout" link in the shop's header *without* `By.linkText`, and say
      when you would prefer one over the other.

  - id: brittle-locators
    type: debug
    concept: stable-locators
    skill: analysis
    title: Spot the brittle locators
    prompt: |
      A teammate's locators for the demo shop's product page. Lines 1, 3, 4, 6 and 8 are all meant to find
      **Oat milk's "Add to cart" button**; line 5 the oat milk card; lines 2 and 7 the cart count and the
      sort drop-down. Click every line that will break when the page is reloaded, re-sorted or restyled.
    language: java
    code: |
      By.id("btn-k2j4l1")
      By.cssSelector("[data-testid='cart-count']")
      By.xpath("/html/body/main/ul/li[4]/button")
      By.xpath("(//button[text()='Add to cart'])[4]")
      By.cssSelector(".product-card.card-x8f2k")
      By.xpath("//*[@data-testid='product-card'][.//h2[normalize-space()='Oat milk 1 L']]//button")
      By.cssSelector("[data-testid='sort']")
      By.cssSelector("button")
    correctLines: [1, 3, 4, 5, 8]
    lineNotes:
      - line: 6
        note: Stable - it anchors on the test id of the cards and the product's exact visible name, then steps to the button. Sorting moves the card, but the locator follows it.
      - line: 2
        note: Stable - a test id that exists so tests can find the badge.
      - line: 7
        note: Stable - a test id on the drop-down.
    hints:
      - Reload the shop and compare the ids and classes with this list. Then change the sort order.
      - Which lines describe *where* the element is, or *how it looks*, instead of *what* it is?
    solution: |
      **Lines 1, 3, 4, 5 and 8.**

      - **1** - the button ids are generated on every load.
      - **3** - an absolute path: the fourth list item is oat milk only in the default order.
      - **4** - a position among all "Add to cart" buttons; sorting changes it.
      - **5** - `card-x8f2k` is regenerated on every load, like a CSS-in-JS hashed class - and it is on
        every card, so it never meant "oat milk" anyway.
      - **8** - matches every button; `findElement` takes the first, which is some other product.

      Line 6 is the pattern to copy: test ids plus the user-visible name.
    followUp: |
      Rewrite line 5 so it finds the oat milk card without XPath. (Hint - look at the card's other
      attributes in DevTools.)

  - id: build-and-check
    type: order
    concept: stable-locators
    skill: recall
    title: Build and check a locator
    prompt: |
      Put the steps for building a locator you can trust in order.
    items:
      - id: inspect
        text: Inspect the element and note its attributes and visible text
      - id: reload
        text: Reload the page and discard any attribute whose value changed
      - id: write
        text: Write the locator on what is left - a test id, a label, or text plus a stable anchor
      - id: count
        text: Count the matches in the DevTools console - exactly one
      - id: change-state
        text: Re-sort, resize or otherwise change the page, and count again
      - id: page-object
        text: Put it in the page object as a private, well-named constant
    hints:
      - You can only discard generated attributes after you have seen them change.
    solution: |
      **Inspect → reload → write → count → change state → page object.** The reload step is what catches
      generated ids; the state change catches positions.
    followUp: |
      Which step would have caught each brittle locator in the "Spot the brittle locators" exercise?

  - id: write-shop-locators
    type: coding
    concept: stable-locators
    skill: application
    title: Locators for the demo shop
    prompt: |
      Write the five locators in `ShopLocators`: the cart count, the sort drop-down, all product cards,
      and - by the product's **visible name** - a product's "Add to cart" button and its price. The tests
      open the shop in Chrome, reload it and re-sort it, and check that each locator finds exactly the
      right element(s) every time.

      Explore the page first: open the shop (`practice/shop`, or the [published copy](shop/index.html))
      with DevTools, and reload it a few times to see what changes.
    project: framework
    files:
      - src/exercises/java/learnerapp/exercises/locators/ShopLocators.java
    test: src/test/java/learnerapp/exercises/ShopLocatorsTest.java
    command: mvn test -Dtest=ShopLocatorsTest
    hints:
      - Reload the shop in DevTools and compare - which attributes keep their values?
      - The first three are CSS on `data-testid` attributes.
      - "For the name-based ones, CSS can't match text: use XPath to find the card whose `product-name` element has exactly that text, then step down to its button or price."
    modelAnswer: |
      ```java
      public static By cartCount() { return By.cssSelector("[data-testid='cart-count']"); }
      public static By sortSelect() { return By.cssSelector("[data-testid='sort']"); }
      public static By productCards() { return By.cssSelector("[data-testid='product-card']"); }

      public static By addToCartButton(String productName) {
          return By.xpath(card(productName) + "//button");
      }

      public static By priceOf(String productName) {
          return By.xpath(card(productName) + "//*[@data-testid='product-price']");
      }

      private static String card(String productName) {
          return "//*[@data-testid='product-card']"
              + "[.//*[@data-testid='product-name'][normalize-space()='" + productName + "']]";
      }
      ```

      A product name with an apostrophe would break the XPath string; a general helper has to escape it
      (XPath 1.0 has no escape character, so it builds the text with `concat()`).
    rubric:
      - Every test in ShopLocatorsTest passes
      - No generated ids, hashed classes, positions or absolute paths
      - The name-based locators use the exact name, not a partial match
      - Checked each locator in DevTools before running the tests
    solution: |
      The tests encode the checks from this lesson: exactly one match, the right element, after a reload
      (new ids and classes) and after re-sorting (new positions), and no match for a name that isn't a
      product. The reference solution is in `src/solutions/java/learnerapp/exercises/locators/`.
    followUp: |
      Add `quantityInput(String productName)` for the cart page (`cart.html`). Which anchor would you use
      there, and why can't you reuse the catalog's card locator?

  - id: which-locator-works
    type: mcq
    concept: locator-strategies
    skill: application
    title: The button in the card named "Oat milk 1 L"
    prompt: |
      You need the "Add to cart" button in the product card whose heading reads "Oat milk 1 L". The card's
      test id is the same for every card. Which locator finds it?
    options:
      - id: css-contains
        text: "`By.cssSelector(\"[data-testid='product-card']:contains('Oat milk 1 L') button\")`"
        feedback: "`:contains()` is not CSS - browsers reject the selector. It came from jQuery."
      - id: xpath-anchor
        text: "`By.xpath(\"//*[@data-testid='product-card'][.//h2[normalize-space()='Oat milk 1 L']]//button\")`"
        feedback: Correct - XPath finds the card by the text inside it, then steps down to its button.
      - id: link-text
        text: "`By.linkText(\"Oat milk 1 L\")`"
        feedback: The product name is a heading, not a link - link text only matches `<a>` elements, and even then it would find the link, not the button.
      - id: partial-xpath
        text: "`By.xpath(\"//*[contains(text(),'Oat milk')]/following::button[1]\")`"
        feedback: It probably finds the right button today, but `contains` would also match a future "Oat milk barista", and `following::button[1]` relies on document order rather than on the card.
    correct: [xpath-anchor]
    hints:
      - Which strategy can look at an element's text *and* move to a related element?
    solution: |
      **The XPath anchored on the card.** It reads like the requirement: "the card whose name is exactly
      this, then its button". CSS can't select by text at all.
    followUp: |
      The developers offer to add `data-sku` to every card. Rewrite the locator in CSS, and name one thing
      the XPath version checks that the CSS version doesn't.

  - id: first-of-many
    type: mcq
    concept: locator-strategies
    skill: analysis
    title: The test that bought the wrong product
    prompt: |
      A test is meant to buy espresso beans. It does
      `driver.findElement(By.cssSelector("[data-testid='product-card'] button")).click()`, and it passed for
      months. Today it fails because the order contains a pour-over kit. Nothing in the test changed. What
      is the most likely explanation?
    options:
      - id: first-match
        text: The locator matches every product's button, and findElement clicks the first - the default sort order now puts a different product first.
        feedback: Correct - a locator that matches many elements "works" until the order changes.
      - id: selenium-bug
        text: Selenium clicked the wrong coordinates.
        feedback: Selenium clicks the element it found. The element was the wrong one because the locator matched several.
      - id: stale
        text: The element went stale and Selenium re-found a different one.
        feedback: Selenium does not re-find stale elements by itself; a stale reference throws StaleElementReferenceException.
      - id: cache
        text: The browser cached an old version of the page.
        feedback: The page is the current one - the products are just in a different order.
    correct: [first-match]
    hints:
      - How many elements does that selector match on the product page?
    solution: |
      **The locator was never specific.** It matches six buttons, and `findElement` returns the first in
      document order. When the "featured" order changed, the first product changed. Check locators with
      `findElements(...).size() == 1`, and locate by the product's identity.
    followUp: |
      Write the assertion you would add to the test helper so that a locator matching several elements
      fails immediately with a clear message.

  - id: interview-locator-strategy
    type: interview
    concept: stable-locators
    skill: application
    title: "Interview: how do you choose locators?"
    prompt: |
      **Interviewer:** "How do you choose locators in Selenium? And what do you do when the developers
      won't add test ids?"
    hints:
      - Cover your order of preference, what you avoid, how you check a locator, and how you negotiate.
    modelAnswer: |
      - Prefer attributes that exist to identify elements - `data-testid` or a stable unique `id` - then
        labels, names and accessible names, then visible text anchored with XPath.
      - Avoid generated ids, styling classes, positions and absolute paths; reload and re-sort to prove a
        locator is stable; make sure it matches exactly one element.
      - Keep locators in page objects, so a markup change is fixed in one place.
      - Without test ids: use accessible names and labels (which also tests accessibility), anchor XPath on
        stable text; and make the case with data - how many failures came from locator changes, and how
        cheap a test id is to add. Treat test ids as an interface: changes are reviewed.
    followUps:
      - When would you choose XPath over CSS?
      - How do you find an element inside an iframe?
      - A locator works locally and fails in CI. What do you check first?
    rubric:
      - Gave an order of preference starting with test ids or stable unique attributes
      - Named the brittle kinds - generated ids, styling classes, positions, absolute paths
      - Described checking for exactly one match across state changes
      - Mentioned keeping locators in page objects
      - Gave a constructive answer for missing test ids (accessible names, anchored text, making the case)
    solution: |
      Strong answers show a **rule and a check**, not just a favourite syntax - and treat test ids as a
      shared interface with developers.

  - id: find-element-vs-elements
    type: short
    concept: locator-strategies
    skill: recall
    title: findElement or findElements?
    prompt: |
      In two to four sentences: what is the difference between `findElement` and `findElements`, and which
      one do you use to check that an error message is **not** shown?
    hints:
      - What does each return, or throw, when nothing matches?
    modelAnswer: |
      `findElement` returns the first matching element in document order and throws
      `NoSuchElementException` when nothing matches. `findElements` returns all matches as a list, and an
      empty list when there are none. To check that an error message is absent, use
      `findElements(...).isEmpty()` (or check it is not displayed) - catching an exception from
      `findElement` is clumsy and slow if an implicit wait is set.
    rubric:
      - findElement returns the first match and throws when there is none
      - findElements returns a list, empty when there is none
      - Used findElements (or a visibility check) to check absence
    solution: |
      Also remember: "absent from the page" and "present but hidden" are different - an error element that
      is always in the page but hidden needs `isDisplayed()`, not a count.

recall:
  - id: recall-find-element
    concept: locator-strategies
    prompt: What does findElement do when several elements match, and when none do?
    answer: Several - it returns the first in document order. None - it throws NoSuchElementException.
  - id: recall-css-text
    concept: locator-strategies
    prompt: Can a CSS selector match an element by its text?
    answer: No. Use XPath (for example normalize-space()='...'), link text for links, or a test id.
  - id: recall-w3c-strategies
    concept: locator-strategies
    prompt: Which locator strategies does the W3C WebDriver standard define?
    answer: CSS selector, link text, partial link text, tag name and XPath. By.id, By.name and By.className are sent as CSS selectors.
  - id: recall-brittle
    concept: stable-locators
    prompt: Name four kinds of brittle locator.
    answer: Generated ids, styling or hashed classes, positions (li[4], (//button)[2]) and absolute paths (/html/body/...).
  - id: recall-check-locator
    concept: stable-locators
    prompt: How do you check that a locator is stable?
    answer: It matches exactly one element, the right one - and still does after a reload, after re-sorting or filtering, and at phone width.
  - id: recall-iframe
    concept: locator-strategies
    prompt: You can see an element but findElement can't find it. What are two likely reasons?
    answer: It is inside an iframe (switch to the frame first) or a shadow root (getShadowRoot()), or it hasn't appeared yet when the code runs (a waiting problem).

