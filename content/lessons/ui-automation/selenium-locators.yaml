placement:
  - id: place-generated-id
    type: mcq
    concept: stable-locators
    skill: application
    title: The id from DevTools
    prompt: |
      In DevTools the "Pay" button shows `id="btn-7fk2q9"` and `data-testid="pay-button"`. After a reload
      the id is `btn-x01mzp`. Which locator should the page object use?
    options:
      - id: by-id
        text: "`By.id(\"btn-7fk2q9\")`"
        feedback: The id changed on reload - it is generated, so this locator works at most once.
      - id: test-id
        text: "`By.cssSelector(\"[data-testid='pay-button']\")`"
        feedback: Correct - the test id is stable and exists for exactly this purpose.
      - id: id-prefix
        text: "`By.cssSelector(\"[id^='btn-']\")`"
        feedback: Every generated button id starts with btn-, so this matches all buttons and findElement takes the first.
      - id: absolute
        text: The absolute XPath copied from DevTools
        feedback: An absolute path breaks whenever anything above the button changes.
    correct: [test-id]
    solution: |
      **The test id.** An attribute that changes on reload is generated; never build a locator on it.

  - id: place-text-anchor
    type: mcq
    concept: locator-strategies
    skill: application
    title: Price of a named product
    prompt: |
      Which strategy lets you locate "the price inside the card whose heading is exactly Hand grinder" in a
      single locator?
    options:
      - id: css
        text: A CSS selector
        feedback: CSS can't match the heading's text, so it can't choose the card by name.
      - id: xpath
        text: XPath
        feedback: Correct - XPath can select the card by the text of its heading and then step to the price.
      - id: link-text
        text: Link text
        feedback: Link text only finds links by their text - it cannot step from a heading to a price.
      - id: tag-name
        text: Tag name
        feedback: A tag name matches every element of that type - nothing about the heading's text.
    correct: [xpath]
    solution: |
      **XPath** - for example
      `//*[@data-testid='product-card'][.//h2[normalize-space()='Hand grinder']]//*[@data-testid='product-price']`.
