placement:
  - id: place-architecture
    type: mcq
    concept: appium-architecture
    skill: application
    title: Where does XCTest run?
    prompt: |
      In an iOS Appium session, which component uses Apple's XCTest framework?
    options:
      - id: wda
        text: WebDriverAgent, installed on the device or simulator by the XCUITest driver
        feedback: Correct.
      - id: server
        text: The Appium server itself
        feedback: The server routes commands to the driver; the XCTest calls happen in WebDriverAgent.
      - id: client
        text: The Java client
        feedback: The client only sends HTTP requests.
      - id: uia2
        text: The UiAutomator2 server
        feedback: That is the Android side.
    correct: [wda]
    solution: |
      **WebDriverAgent.**

  - id: place-capabilities
    type: mcq
    concept: appium-capabilities
    skill: application
    title: The missing prefix
    prompt: |
      Which capability map is written correctly for an Appium 3 Android app session?
    options:
      - id: prefixed
        text: "`platformName: Android`, `appium:automationName: UiAutomator2`, `appium:app: /builds/app.apk`"
        feedback: Correct - the standard name plain, everything else prefixed.
      - id: unprefixed
        text: "`platformName: Android`, `automationName: UiAutomator2`, `app: /builds/app.apk`"
        feedback: automationName and app aren't W3C capabilities, so they need the appium prefix - Appium rejects the session with "All non-standard capabilities should have a vendor prefix".
      - id: all-prefixed
        text: "`appium:platformName: Android`, `appium:automationName: UiAutomator2`, `appium:app: /builds/app.apk`"
        feedback: platformName is a W3C standard capability and is sent without a prefix. Appium strips the prefix and logs a warning, so the session may still start - but the map is not written correctly.
      - id: both
        text: "`platformName: Android`, `appium:app: /builds/app.apk`, `browserName: Chrome`"
        feedback: An app and a browser in one session - choose one.
    correct: [prefixed]
    solution: |
      **Standard names plain, everything else `appium:`.**

  - id: place-locators
    type: mcq
    concept: mobile-locators
    skill: application
    title: The fastest stable locator
    prompt: |
      A screen's button has a content description set by the developers. Which strategy is usually fastest and
      most stable for it?
    options:
      - id: accessibility
        text: accessibility id
        feedback: Correct.
      - id: xpath
        text: XPath on the visible text
        feedback: Slower, and text changes with translations and copy edits.
      - id: class-index
        text: Class name plus an index
        feedback: Positional - breaks when the layout changes.
      - id: image
        text: Image matching
        feedback: Useful for canvases and games, but slower and fragile for ordinary buttons.
    correct: [accessibility]
    solution: |
      **accessibility id.**
