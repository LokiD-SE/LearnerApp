id: appium-architecture
title: Appium architecture, drivers and capabilities
subject: ui-automation
module: appium
level: intermediate
status: published
estimatedMinutes: 55
summary: Who does what between your test, the Appium server, its drivers and the device; how capabilities choose the driver, app and device; and which mobile locators are fast and stable.
tags: [appium, mobile, android, ios, uiautomator2, xcuitest, capabilities, w3c webdriver, locators, interview]

environment: |
  - **Appium 3** (a Node.js server; `engines` in its package.json: Node `^20.19.0 || ^22.12.0 || >=24.0.0`
    and npm `>=10`; checked against appium 3.9.0), with drivers installed separately: UiAutomator2 for
    Android (since driver version 5.0.0 it works only with Appium 3; checked against 8.7.3) and XCUITest for
    iOS (checked against 12.22.3).
  - **Java client:** `io.appium:java-client` 10.1.1 with Selenium 4.51 - as in `practice/framework`.
  - **Platform-specific, labelled:** iOS automation needs a macOS host with Xcode (other hosts have only
    limited support); Android needs the Android SDK tools (`adb`) and an emulator or a device.
  - **No device needed for the exercises.** The coding exercise checks the capabilities a session would be
    created with. The "try it on an emulator" code below is illustrative and not run in CI.
  - **Real output (jshell, java-client 10.1.1):** the `UiAutomator2Options` in the code section produce
    `{appium:app=/builds/sandpay-demo.apk, appium:appActivity=.MainActivity, appium:appPackage=com.sandpay.demo,
    appium:autoGrantPermissions=true, appium:automationName=UIAutomator2, appium:newCommandTimeout=120,
    appium:udid=emulator-5554, platformName=ANDROID}` (sorted). Drivers match `automationName`
    case-insensitively, so `UiAutomator2` and `UIAutomator2` both work.
  - **Fictional:** the SandPay demo app (`com.sandpay.demo`); the SandPay shop's web pages are real and
    published with this app.
  - **Sources:**
    - Appium docs: [Migrating from Appium 1 to 2](https://appium.io/docs/en/latest/guides/migrating-1-to-2/)
      (base path `/` instead of `/wd/hub`, `appium:` prefix, drivers installed separately),
      [Migrating from Appium 2 to 3](https://appium.io/docs/en/latest/guides/migrating-2-to-3/) (Node and npm
      versions, insecure features need a driver scope such as `uiautomator2:`),
      [Capabilities](https://appium.io/docs/en/latest/guides/caps/).
    - Appium source, [base-driver `capabilities.ts`](https://github.com/appium/appium/blob/master/packages/base-driver/lib/basedriver/capabilities.ts):
      unprefixed non-standard capabilities are rejected with `InvalidArgumentError` ("All non-standard
      capabilities should have a vendor prefix"); a prefixed standard one (`appium:platformName`) is only
      logged as a warning.
    - [UiAutomator2 driver README](https://github.com/appium/appium-uiautomator2-driver) - capabilities
      (`appium:deviceName` "is not used to select a device", `appium:udid` "if unset ... the first connected
      device", `appium:app` "Do not provide both `app` and `browserName`", `appium:newCommandTimeout` 60 s by
      default), element location strategies and their speed ranking (XPath uses the page-source XML tree),
      and `uiautomator2:chromedriver_autodownload`.
    - [XCUITest driver system requirements](https://appium.github.io/appium-xcuitest-driver/latest/getting-started/system-requirements/)
      (macOS host and Xcode; Windows and Linux hosts have limited support).
    - W3C [WebDriver Level 2](https://www.w3.org/TR/webdriver2/) - capabilities (7) and the
      `POST /session/{session id}/element` endpoint.

prerequisites:
  - selenium-waits-and-synchronisation
  - java-oop-pillars

concepts:
  - id: appium-architecture
    name: Appium's architecture
    summary: A client sends W3C WebDriver commands over HTTP to the Appium server, which routes them to a platform driver; the driver uses the device's own automation framework (UiAutomator2, or XCTest through WebDriverAgent).
  - id: appium-capabilities
    name: Capabilities
    summary: W3C capabilities plus appium:-prefixed ones choose the platform, the driver (automationName), the app or browser, the device (udid) and session behaviour.
  - id: mobile-locators
    name: Mobile locator strategies
    summary: accessibility id and id are fast and stable; platform strategies (-android uiautomator, -ios predicate string, -ios class chain) are powerful; XPath works over the whole page source and is slower.

objectives:
  - Explain the path of one command from a test to the device, and which component runs where.
  - Write capabilities for an app session and a mobile-browser session, and explain each one.
  - Choose mobile locators by speed and stability, and justify the choice.
  - Diagnose common session-start failures from their symptoms.

sections:
  - id: intuition
    kind: intuition
    concepts: [appium-architecture]
    title: The idea in plain language
    body: |
      Appium is a **switchboard operator**. Your test phones in instructions in one language - WebDriver.
      The operator doesn't tap screens itself: it connects you to a **specialist** for the phone in question -
      the UiAutomator2 driver for Android, the XCUITest driver for iOS - and that specialist talks to the
      phone's **own** testing machinery, which Google and Apple provide.

      Your Selenium knowledge mostly carries over: the same protocol, the same idea of sessions, elements,
      waits and page objects. What changes is the world on the other end - native screens, two platforms,
      devices that are slow to start and easy to leave in a strange state.

  - id: what
    kind: what
    concepts: [appium-architecture, appium-capabilities]
    title: What the parts are
    body: |
      | Part | What it is | Runs on |
      |---|---|---|
      | Client library | your test's API - for Java, `io.appium:java-client` on top of Selenium | the test machine |
      | Appium server | a Node.js HTTP server speaking the W3C WebDriver protocol | any machine the test can reach (default `http://127.0.0.1:4723`) |
      | Driver | a plugin-like package for one platform, installed with `appium driver install` | inside the Appium server |
      | UiAutomator2 server | an app the Android driver installs, which turns commands into Google's UiAutomator calls | the Android device |
      | WebDriverAgent | an app the XCUITest driver installs, built on Apple's XCTest | the iOS device or simulator |
      | Plugins | optional extensions of the server (for example image matching) | inside the Appium server |

      **Capabilities** are the key-value settings sent when a session starts. Standard W3C ones
      (`platformName`, `browserName`, ...) are written as they are; everything else needs the **`appium:`
      prefix** - `appium:automationName`, `appium:app`, `appium:udid`.

      | Capability | Meaning |
      |---|---|
      | `platformName` | `Android` or `iOS` |
      | `appium:automationName` | which driver: `UiAutomator2`, `XCUITest`, ... |
      | `appium:app` | path or URL of the app to install (on the server's machine) |
      | `browserName` | a browser instead of an app (for example `Chrome` on Android) - never both |
      | `appium:udid` | which device (Android: from `adb devices -l`; if unset, UiAutomator2 takes the first connected device) - always set it when several are connected |
      | `appium:appPackage`, `appium:appActivity` | (Android) which app and screen to start |
      | `appium:noReset`, `appium:fullReset` | keep app data between sessions, or reinstall |
      | `appium:newCommandTimeout` | seconds without a command before the server ends the session (60 by default for UiAutomator2) |
      | `appium:autoGrantPermissions` | (Android) grant the app's permissions on start |

  - id: why
    kind: why
    concepts: [appium-architecture, appium-capabilities]
    title: Why the architecture matters to a tester
    body: |
      - **Failures happen at different layers**, and the fix depends on the layer: a wrong capability
        (server rejects the session), a missing driver (server can't find it), the device's automation app
        failing to start, the app itself crashing, or a locator problem in your test.
      - **Mobile sessions are expensive** - installing apps and starting the on-device servers takes tens of
        seconds - so capabilities such as `noReset` trade speed against clean state.
      - **Payments on mobile** mix native screens and web pages (3-D Secure pages and payment forms are often
        web content inside the app), which the [next lesson](#/lesson/appium-native-hybrid-webview) covers.
      - **Interviews** for mobile automation roles almost always start with "explain Appium's architecture".

  - id: internals
    kind: internals
    concepts: [appium-architecture]
    title: How one command travels
    body: |
      Take `driver.findElement(AppiumBy.accessibilityId("Pay")).click()` on Android:

      1. The Java client turns `findElement` into an HTTP request - `POST /session/{id}/element` with the
         strategy and value - and sends it to the Appium server.
      2. The server looks up the session and hands the command to its driver, UiAutomator2.
      3. The driver forwards it to the **UiAutomator2 server** on the device, which asks Google's UiAutomator
         framework for the element whose content description is "Pay" and returns an element id.
      4. `click()` is a second HTTP request with that element id, travelling the same way; UiAutomator performs
         the tap.

      On iOS, step 3 goes to **WebDriverAgent**, which uses Apple's XCTest. Every command is a network round
      trip through several processes - which is why mobile tests are slower than web tests, and why waiting
      for state matters even more.

      **Session start** is the expensive part: the server validates capabilities, the driver checks the
      device, installs the app (unless told not to), installs and starts its on-device server, and launches
      the app.

  - id: visual
    kind: visual
    concepts: [appium-architecture]
    title: "Diagram: from the test to the device"
    body: |
      ```mermaid
      flowchart LR
          T["Test - java-client"] -->|"HTTP, W3C WebDriver"| S["Appium server"]
          S --> A["UiAutomator2 driver"]
          S --> I["XCUITest driver"]
          A -->|"adb and HTTP"| U["UiAutomator2 server - on the Android device"]
          I --> W["WebDriverAgent - on the iPhone or simulator"]
          U --> G["Google UiAutomator"]
          W --> X["Apple XCTest"]
          G --> AA["the Android app"]
          X --> IA["the iOS app"]
      ```

      Your test only ever talks to the server. The drivers - and the apps they install on the device - are
      what make the same protocol work on two very different platforms.

  - id: steps
    kind: steps
    concepts: [appium-capabilities, appium-architecture]
    title: Starting a first Android session, step by step
    body: |
      1. **Install Appium 3** with npm (`npm install -g appium`) on a supported Node version.
      2. **Install the driver:** `appium driver install uiautomator2`.
      3. **Check the device:** `adb devices -l` lists emulators and devices with their udid.
      4. **Start the server:** `appium` (it listens on port 4723).
      5. **Write capabilities** with the client's options class (`UiAutomator2Options`) - it sets
         `platformName` and `appium:automationName` and prefixes everything else.
      6. **Create the driver** with the server URL and the options; on failure, read the **server log** first -
         it says which layer failed.
      7. **Inspect the screen** with Appium Inspector (a desktop app that connects to a session) to find
         accessibility ids and resource ids.

  - id: example
    kind: example
    concepts: [appium-capabilities]
    title: "Real-world example: the Appium 1 suite that stopped starting"
    body: |
      A team upgraded their device lab from Appium 1 to Appium 2, and every session failed to start. Their
      capabilities were a `DesiredCapabilities` map copied from years-old examples: `deviceName`,
      `automationName`, `app`, `udid` - no prefixes - sent to `http://hub:4723/wd/hub`.

      **Evidence:** the client error said the session could not be created; the **server log** said "All
      non-standard capabilities should have a vendor prefix" and listed them; a second error showed the old `/wd/hub` base path, which Appium 2
      no longer uses by default.

      **Fix:** `UiAutomator2Options` (which adds the `appium:` prefix itself), the server URL without
      `/wd/hub`, and `appium:udid` instead of relying on `deviceName` - which the UiAutomator2 driver
      documents as not used to select the device. The coding exercise is this migration.

  - id: code
    kind: code
    concepts: [appium-capabilities, mobile-locators]
    title: "Code: options, a session and locators"
    collapsed: true
    body: |
      ```java
      UiAutomator2Options app = new UiAutomator2Options()        // platformName Android, automationName UiAutomator2
          .setApp("/builds/sandpay-demo.apk")
          .setAppPackage("com.sandpay.demo")
          .setAppActivity(".MainActivity")
          .setUdid("emulator-5554")
          .setAutoGrantPermissions(true)
          .setNewCommandTimeout(Duration.ofSeconds(120));
      // sent as: platformName, appium:automationName, appium:app, appium:appPackage, ...

      UiAutomator2Options chrome = new UiAutomator2Options()     // a browser session - no app
          .setUdid("emulator-5554")
          .withBrowserName("Chrome");

      AndroidDriver driver = new AndroidDriver(URI.create("http://127.0.0.1:4723").toURL(), app);

      driver.findElement(AppiumBy.accessibilityId("Pay"));                     // content description
      driver.findElement(AppiumBy.id("com.sandpay.demo:id/pay_button"));      // resource id
      driver.findElement(AppiumBy.androidUIAutomator(
          "new UiSelector().text(\"Pay\")"));                                    // Android-only
      driver.findElement(AppiumBy.iOSNsPredicateString("label == 'Pay'"));     // iOS-only
      ```

      **Try it on an emulator (optional, not run in CI)** - the published SandPay shop in mobile Chrome:

      ```bash
      npm install -g appium
      appium driver install uiautomator2
      appium server --allow-insecure uiautomator2:chromedriver_autodownload   # fetch a matching Chromedriver
      adb devices -l                                                           # note the emulator's udid
      ```

      ```java
      AndroidDriver driver = new AndroidDriver(
          URI.create("http://127.0.0.1:4723").toURL(), AndroidSessions.forChrome("emulator-5554"));
      driver.get("https://lokid-se.github.io/LearnerApp/shop/");
      // the framework's page objects work here too - it is the same web page
      ```

  - id: tests
    kind: tests
    concepts: [appium-capabilities, appium-architecture]
    title: Checking a mobile setup
    body: |
      | ID | Check | Catches |
      |---|---|---|
      | A1 | unit-test the capabilities your framework builds (as the coding exercise does) | missing prefixes, app plus browserName, wrong driver |
      | A2 | `appium driver list --installed` and `appium driver doctor <driver>` on every agent | missing drivers and system dependencies |
      | A3 | a smoke session per device: start, read the page source, quit | device, app install and on-device server problems |
      | A4 | the server log is kept as evidence with every failed test | failures that only the server can explain |
      | A5 | sessions always end (`quit()` in `finally` or an extension) | devices left busy or apps left running |

  - id: mistakes
    kind: mistakes
    concepts: [appium-capabilities, mobile-locators, appium-architecture]
    title: Common mistakes
    body: |
      - **Unprefixed capabilities** in raw maps - use the options classes, or write `appium:` yourself.
      - **Both `appium:app` and `browserName`** - choose an app session or a browser session.
      - **No `appium:udid`** with several devices connected - UiAutomator2 takes the first connected device,
        maybe the wrong one.
      - **The Appium 1 URL (`/wd/hub`)** against Appium 2 or 3 - the default base path is `/` now.
      - **XPath for everything** - it is evaluated over the whole page source and is slower; prefer
        accessibility ids and resource ids, and ask developers to add them.
      - **Ignoring the server log** - the client often only says "could not start a new session".
      - **Long `noReset` chains** - tests that depend on what earlier tests left in the app.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [mobile-locators, appium-capabilities]
    title: Trade-offs
    body: |
      | Choice | Gains | Costs |
      |---|---|---|
      | accessibility id | fast, stable, cross-platform if both apps use the same ids; improves accessibility | needs developers to set it |
      | resource id (Android) | fast and stable | Android only |
      | `-android uiautomator` / `-ios predicate string` / `-ios class chain` | expressive and fast | platform-specific - separate locators per platform; the UiAutomator2 README warns that Google plans to remove `UiSelector`, which `-android uiautomator` is built on |
      | XPath | works on anything in the page source | slower, brittle with layout changes |
      | `noReset` | much faster sessions | state leaks between tests |
      | emulators and simulators | cheap, scriptable, parallel | not every device behaviour (biometrics, performance, OEM quirks) |
      | real devices or a device cloud | real behaviour | cost, availability, signing (iOS) |

  - id: summary
    kind: summary
    title: Summary and quick reference
    body: |
      - Test → HTTP (W3C WebDriver) → Appium server → driver → on-device automation (UiAutomator2 server /
        WebDriverAgent) → app.
      - Appium 3 on a supported Node version; drivers installed with `appium driver install`.
      - Capabilities: W3C names plain, everything else `appium:`; `automationName` picks the driver; `app` or
        `browserName`, not both; `udid` picks the device.
      - Use the options classes (`UiAutomator2Options`, `XCUITestOptions`).
      - Locators: accessibility id and id first; platform strategies when needed; XPath last.
      - On failure: the server log names the layer.

exercises:
  - id: who-runs-where
    type: mcq
    concept: appium-architecture
    skill: recognition
    title: What runs on the Android device?
    prompt: |
      During an Appium session with the UiAutomator2 driver, which of these run **on the Android device**?
      Select every one that applies.
    options:
      - id: ua2-server
        text: The UiAutomator2 server installed by the driver
        feedback: Yes - it receives commands from the driver and calls Google's UiAutomator.
      - id: app
        text: The app under test
        feedback: Yes, of course.
      - id: appium-server
        text: The Appium server
        feedback: No - the Appium server is a Node.js process on a computer (local, a lab machine or a cloud), not on the phone.
      - id: java-client
        text: Your Java test and java-client
        feedback: No - the test runs on your machine or a CI agent and talks to the server over HTTP.
    correct: [ua2-server, app]
    hints:
      - Which component turns commands into actual taps and lookups on the phone?
    solution: |
      **The UiAutomator2 server and the app.** The test and the Appium server run on computers; the driver
      installs its own server app on the device to do the automation there. On iOS that role is played by
      WebDriverAgent.
    followUp: |
      A session fails to start and the server log says the on-device server didn't respond. Which component
      would you look at, and with which tool?

  - id: command-journey
    type: order
    concept: appium-architecture
    skill: recall
    title: The journey of a tap
    prompt: |
      Put the steps of `element.click()` in an Android Appium session in order.
    items:
      - id: client
        text: The Java client sends an HTTP request to the Appium server
      - id: server
        text: The Appium server finds the session and passes the command to the UiAutomator2 driver
      - id: driver
        text: The driver forwards it to the UiAutomator2 server on the device
      - id: uiautomator
        text: The on-device server asks Google's UiAutomator to tap the element
      - id: response
        text: The result travels back to the test as the HTTP response
    hints:
      - Follow the path from your machine to the phone and back.
    solution: |
      **Client → server → driver → on-device server → UiAutomator → response.** Each arrow is a process
      boundary, which is why mobile commands are slower than browser ones.
    followUp: |
      Where in this chain would an "element not found" be decided, and where would a "no such driver" error
      come from?

  - id: android-capabilities
    type: coding
    concept: appium-capabilities
    skill: application
    title: Migrate Appium 1 capabilities
    prompt: |
      `AndroidSessions` still builds Appium 1-style capabilities - unprefixed keys in `DesiredCapabilities`,
      and a "browser" session that also carries an app. Rewrite `forApp` and `forChrome` as their Javadoc
      describes. The tests check the capabilities a session would be created with, so no device or Appium
      server is needed.
    project: framework
    files:
      - src/exercises/java/learnerapp/exercises/appium/AndroidSessions.java
    test: src/test/java/learnerapp/exercises/AndroidSessionsTest.java
    command: mvn test -Dtest=AndroidSessionsTest
    hints:
      - "`io.appium.java_client.android.options.UiAutomator2Options` sets platformName and automationName for you."
      - "Its setters: `setApp`, `setAppPackage`, `setAppActivity`, `setUdid`, `setAutoGrantPermissions`, `setNewCommandTimeout(Duration)`."
      - "A browser session: `withBrowserName(\"Chrome\")` - and no app."
    modelAnswer: |
      ```java
      public static Capabilities forApp(String apkPath, String udid) {
          return new UiAutomator2Options()
              .setApp(apkPath)
              .setAppPackage(APP_PACKAGE)
              .setAppActivity(APP_ACTIVITY)
              .setUdid(udid)
              .setAutoGrantPermissions(true)
              .setNewCommandTimeout(Duration.ofSeconds(120));
      }

      public static Capabilities forChrome(String udid) {
          return new UiAutomator2Options().setUdid(udid).withBrowserName("Chrome");
      }
      ```
    rubric:
      - Every test in AndroidSessionsTest passes
      - Uses UiAutomator2Options rather than raw maps
      - Every non-standard capability carries the appium prefix
      - The browser session has browserName and no app
    solution: |
      The tests read the capabilities back: platform, driver, app, device, package, activity, permissions and
      timeout - and that every key is either a W3C standard name or contains a colon. Reference:
      `src/solutions/java/learnerapp/exercises/appium/AndroidSessions.java`.
    followUp: |
      Add `forIosApp(String ipaPath, String udid)` with `XCUITestOptions`. Which capabilities differ from the
      Android version, and which machine must the Appium server run on?

  - id: broken-capabilities
    type: debug
    concept: appium-capabilities
    skill: analysis
    title: Why won't the session start?
    prompt: |
      These capabilities are sent to an Appium 3 server with the UiAutomator2 driver. The session doesn't
      start. Click every line that is wrong.
    language: json
    code: |
      {
        "platformName": "Android",
        "appium:automationName": "UiAutomator2",
        "deviceName": "Pixel 8",
        "appium:app": "/builds/sandpay-demo.apk",
        "browserName": "Chrome",
        "appium:udid": "emulator-5554"
      }
    correctLines: [4, 6]
    lineNotes:
      - line: 2
        note: platformName is a W3C standard capability - no prefix needed.
      - line: 7
        note: Correctly prefixed, and the right way to pick a device.
    hints:
      - Which keys are neither W3C standard names nor prefixed?
      - Is this an app session or a browser session?
    solution: |
      **Lines 4 and 6.** `deviceName` is not a W3C capability, so it needs the `appium:` prefix (and the
      UiAutomator2 driver doesn't use it to choose a device - `appium:udid` does). Appium 3 rejects the
      unprefixed key with "All non-standard capabilities should have a vendor prefix". And a session is either
      an app session or a browser session: the driver documentation says "Do not provide both `app` and
      `browserName` capabilities at once".
    followUp: |
      Write the same capabilities with `appium:options` grouping. Which keys still go outside the group?

  - id: accessibility-first
    type: mcq
    concept: mobile-locators
    skill: application
    title: Locating the Pay button
    prompt: |
      The Android Pay button has the resource id `com.sandpay.demo:id/pay_button` and the content description
      "Pay"; the iOS app's button has the accessibility identifier "Pay". You want one page object for both
      platforms. Which locator?
    options:
      - id: accessibility
        text: "`AppiumBy.accessibilityId(\"Pay\")`"
        feedback: Correct - it maps to the content description on Android and the accessibility identifier on iOS, and it is fast.
      - id: xpath
        text: "`By.xpath(\"//*[@text='Pay']\")`"
        feedback: Slower (evaluated over the whole page source), attribute names differ per platform, and the visible text changes with translations.
      - id: resource-id
        text: "`AppiumBy.id(\"com.sandpay.demo:id/pay_button\")`"
        feedback: Fast and stable on Android, but resource ids don't exist on iOS.
      - id: uiautomator
        text: "`AppiumBy.androidUIAutomator(\"new UiSelector().description(\\\"Pay\\\")\")`"
        feedback: Works on Android only.
    correct: [accessibility]
    hints:
      - Which strategy exists on both platforms?
    solution: |
      **Accessibility id.** It is the best cross-platform choice when developers set the same ids in both
      apps - and it makes the app better for screen-reader users too.
    followUp: |
      The iOS developers say they can't use "Pay" because VoiceOver would read it oddly. What do you suggest?

  - id: slow-xpath
    type: mcq
    concept: mobile-locators
    skill: analysis
    title: A slow product list
    prompt: |
      A test that taps items in a long product list spends most of its time in `findElement` calls like
      `By.xpath("//android.widget.TextView[@text='Oat milk 1 L']")`. Why are they slow, and what helps?
    options:
      - id: page-source
        text: The driver builds an XML tree of the page source to evaluate XPath - use accessibility ids or resource ids, or a UiAutomator selector
        feedback: Correct - the UiAutomator2 driver documents that XPath uses the page-source XML, and ranks it slower than id-based strategies.
      - id: network
        text: XPath requests are bigger, so the network is slow
        feedback: The request size is tiny; the cost is on the device, building and searching the tree.
      - id: implicit
        text: XPath always waits for the implicit wait
        feedback: Waiting only happens if the element isn't found; slow successful lookups are a different cost.
      - id: cache
        text: Appium caches XPath results, which makes them stale
        feedback: There is no such cache - each lookup works on a fresh tree, which is part of why it costs time.
    correct: [page-source]
    hints:
      - What does the driver have to produce before it can run an XPath query?
    solution: |
      **XPath is evaluated over the page-source XML,** which the driver has to build from the whole screen
      hierarchy. id-based strategies go straight to UiAutomator's own selectors. Ask developers for
      accessibility ids on list items.
    followUp: |
      Some list items are off-screen. How does that change which locator strategy you would use?

  - id: interview-appium
    type: interview
    concept: appium-architecture
    skill: application
    title: "Interview: explain Appium"
    prompt: |
      **Interviewer:** "Explain Appium's architecture. What happens when your test calls driver.findElement on
      an Android device - and what would you check if the session doesn't even start?"
    hints:
      - Components, the path of a command, capabilities, then a failure checklist by layer.
    modelAnswer: |
      - The client sends W3C WebDriver commands over HTTP to the Appium server; the server routes them to a
        driver (UiAutomator2 for Android, XCUITest for iOS), installed separately since Appium 2.
      - UiAutomator2 installs an on-device server that turns commands into Google UiAutomator calls; XCUITest
        uses WebDriverAgent on top of Apple's XCTest.
      - findElement travels test → server → driver → on-device server → UiAutomator and back, as HTTP.
      - Session start: capabilities (platformName, appium:automationName, appium:app or browserName,
        appium:udid) are validated, the app and the on-device server are installed and started.
      - If it doesn't start: read the server log; check the driver is installed (`appium driver list`), the
        device is visible (`adb devices`), the capabilities are prefixed and consistent, the app path exists on
        the server's machine, and the URL has no Appium 1 `/wd/hub`.
    followUps:
      - Why does iOS automation need a Mac?
      - What does noReset change, and what is the risk?
      - How would you run the same tests on Android and iOS?
    rubric:
      - Described client, server, driver and on-device automation correctly
      - Traced a command through the layers
      - Named the key capabilities including the appium prefix
      - Gave a layer-by-layer checklist for a session that won't start, starting with the server log
    solution: |
      Strong answers can **locate a failure by layer** - that is the practical value of knowing the
      architecture.

recall:
  - id: recall-protocol
    concept: appium-architecture
    prompt: Which protocol does an Appium client use to talk to the server?
    answer: The W3C WebDriver protocol, over HTTP.
  - id: recall-on-device
    concept: appium-architecture
    prompt: What does the UiAutomator2 driver install on the device, and what is the iOS equivalent?
    answer: The UiAutomator2 server, which calls Google's UiAutomator. On iOS, WebDriverAgent, built on Apple's XCTest.
  - id: recall-prefix
    concept: appium-capabilities
    prompt: Which capabilities need the appium prefix?
    answer: Every capability that isn't a W3C standard one - for example appium:automationName, appium:app, appium:udid. The Java options classes add it for you.
  - id: recall-app-or-browser
    concept: appium-capabilities
    prompt: Can a session have both appium:app and browserName?
    answer: No - it is either an app session or a browser session.
  - id: recall-locator-order
    concept: mobile-locators
    prompt: Which mobile locator strategies do you try first, and which last?
    answer: Accessibility id and resource id first; platform strategies (UiAutomator, predicate string, class chain) when needed; XPath last.
  - id: recall-driver-install
    concept: appium-architecture
    prompt: How do you add Android support to an Appium 3 server?
    answer: appium driver install uiautomator2

