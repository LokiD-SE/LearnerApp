placement:
  - id: place-timeout-next
    type: mcq
    concept: unknown-outcome-recovery
    skill: application
    title: After the timeout
    prompt: |
      The merchant API's call to SandPay times out after 10 seconds. What should it do next?
    options:
      - id: lookup
        text: Look the payment up by its reference (or retry with the same key) before reporting anything.
        feedback: Correct - the outcome is unknown, so find out first.
      - id: failed
        text: Mark the payment failed and tell the customer to try again.
        feedback: The payment may have succeeded - this is how double charges start.
      - id: new-key
        text: Retry immediately with a new idempotency key.
        feedback: A new key creates a second payment if the first one went through.
      - id: refund
        text: Send a refund request just in case.
        feedback: Refunding a payment that may not exist (or that should stand) creates a new mess.
    correct: [lookup]
    solution: |
      **Look it up, or retry with the same key.** Unknown must be resolved before anyone is told "failed".

  - id: place-stolen-message
    type: mcq
    concept: decline-handling
    skill: application
    title: The stolen-card decline
    prompt: |
      SandPay declines a payment with the reason "card reported stolen". What should the customer see?
    options:
      - id: generic
        text: A generic decline, with the option to use another payment method
        feedback: Correct - helpful without revealing a fraud signal.
      - id: stolen
        text: "\"This card has been reported stolen\""
        feedback: This tells whoever holds the card exactly why it failed.
      - id: auto-retry
        text: Nothing - the system retries automatically three times
        feedback: Hard declines won't change, and rapid automatic retries can break card-network rules.
      - id: wait
        text: "\"Please try again in five minutes\""
        feedback: Misleading - a stolen-card decline won't succeed later.
    correct: [generic]
    solution: |
      **A generic decline.** Fraud-related reasons stay internal; the customer can use another method or contact
      their bank.
