placement:
  - id: place-weak-row
    type: mcq
    concept: scenario-matrix-design
    skill: analysis
    title: What's missing from this row?
    prompt: |
      A matrix row reads: *"iOS, saved card, approve - expected: payment works."* What is the most important thing
      missing?
    options:
      - id: state-evidence
        text: The expected transaction state, records and the evidence that proves them
        feedback: Correct - "works" can't be verified; a state such as captured, checked in the provider's records, can.
      - id: more-channels
        text: More channels
        feedback: Channels are a coverage question; this row can't be verified even on the one channel it names.
      - id: decline-codes
        text: A list of decline codes
        feedback: This row is about an approval; decline codes belong in other rows.
      - id: screenshots
        text: A screenshot of the success screen
        feedback: A screenshot proves only what the screen said, not that money moved correctly.
    correct: [state-evidence]
    solution: |
      **Expected state, records and evidence.** Without them the row passes whenever the screen looks right, even
      if no capture exists.

  - id: place-pairwise-min
    type: mcq
    concept: risk-based-selection
    skill: application
    title: How small can a pairwise set be?
    prompt: |
      A matrix has three dimensions: channel (3 values), payment method (5 values) and outcome (4 values). What is
      the smallest number of rows a pairwise set can have?
    options:
      - id: twenty
        text: "20"
        feedback: Correct - every method-outcome pair (5 × 4) must appear in some row, and each row holds only one such pair.
      - id: twelve
        text: "12"
        feedback: That is 3 + 5 + 4 - enough to use every value once, but not every pair.
      - id: fifteen
        text: "15"
        feedback: That covers channel-method pairs (3 × 5) but can't fit all 20 method-outcome pairs.
      - id: sixty
        text: "60"
        feedback: That is every combination (3 × 5 × 4) - the full set pairwise is meant to avoid.
    correct: [twenty]
    solution: |
      **20.** The two largest dimensions (5 × 4) set the minimum, since each row covers one of their pairs; the
      channel values can be spread across those 20 rows.
