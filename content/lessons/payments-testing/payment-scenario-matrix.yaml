id: payment-scenario-matrix
title: Building a payment scenario matrix
subject: payments-testing
module: payment-test-design
level: intermediate
status: published
estimatedMinutes: 50
summary: Turn payment methods, outcomes, channels and interruptions into a matrix with expected states and evidence - and cut it down by risk and pairwise selection without losing what matters.
tags: [payments, test design, scenario matrix, risk-based testing, pairwise, release sign-off, invariants]

environment: |
  - **Syllabus (primary source):** the **ISTQB Certified Tester Foundation Level syllabus v4.0.1**
    ([free PDF from ISTQB](https://www.istqb.org/wp-content/uploads/2024/11/ISTQB_CTFL_Syllabus_v4.0.1.pdf)):
    section 4.2.1 **Equivalence Partitioning** (one test per partition; with several sets of partitions
    the simplest criterion is **Each Choice coverage**, which "does not take into account combinations of
    partitions") and section 5.2 **Risk Management** (risk level from **risk likelihood** and **risk
    impact**; product risk analysis focuses the test effort).
  - **Beyond the foundation syllabus:** pairwise (all-pairs) testing is a combinatorial technique the
    CTFL syllabus does not cover. NIST's combinatorial-testing research reports that "most software bugs
    and failures are caused by one or two parameters, with progressively fewer by three or more"
    ([NIST ACTS project](https://csrc.nist.gov/projects/automated-combinatorial-testing-for-software)) -
    the reason pairwise works and the reason risky triples are added by hand.
  - **Tools:** pairwise sets can be generated by tools such as Microsoft's
    [PICT](https://github.com/microsoft/pict) ("Pairwise Independent Combinatorial Tool"), or by hand for
    small matrices. Spreadsheets or a test-management tool hold the matrix; the format matters less than
    the columns.
  - **Common practice, not a standard:** the matrix columns, the invariants and the "always keep" set
    are this course's recommendations for payment testing.
  - **Fictional:** SandPay, its statuses and test payment methods, as in the earlier lessons of this path.

prerequisites:
  - sandbox-test-data
  - declines-timeouts-unknown-outcomes
  - webhooks-and-async-status

concepts:
  - id: scenario-matrix-design
    name: Scenario matrix design
    summary: Rows that state preconditions, steps, expected customer view, expected transaction state, records and evidence.
  - id: risk-based-selection
    name: Risk-based and pairwise selection
    summary: Keep every money-critical scenario in full; cover lower-risk combinations with pairwise sets.

objectives:
  - List the dimensions of a payment feature and the values worth testing in each.
  - Write matrix rows that state the expected transaction state, records and evidence - not only what the screen shows.
  - Reduce a combinatorial explosion with risk-based selection and pairwise sets, and explain what pairwise misses.
  - Review a matrix against financial invariants and use it for release sign-off.

sections:
  - id: intuition
    kind: intuition
    concepts: [scenario-matrix-design, risk-based-selection]
    title: The idea in plain language
    body: |
      Testing payments from memory is like packing for a long trip without a list: you remember the
      passport and forget the charger. A **scenario matrix** is the list - but a smart one. Each line says
      not just *what* to try, but **what must be true afterwards** and **how you'll prove it**.

      The catch: write down *every* combination of payment method, outcome, device and interruption and
      the list has hundreds of lines nobody will ever finish. The skill is choosing which lines must be
      there in full, and which can be covered more cleverly.

  - id: what
    kind: what
    concepts: [scenario-matrix-design]
    title: What a good matrix row contains
    body: |
      | Column | Example |
      |---|---|
      | **ID** | `PM-014` |
      | **Dimensions** | Android app · saved card · 3-D Secure challenge · app killed during the challenge |
      | **Preconditions** | logged-in customer with a saved `pm_sandpay_3ds_challenge` method; cart of 49.90 EUR |
      | **Steps** | Pay → challenge opens → force-stop the app → relaunch |
      | **Expected customer view** | "Confirming your payment", then the real result; no second charge offered |
      | **Expected transaction state** | `requires_action` → `authorized` if completed later, otherwise `declined` or expired as documented |
      | **Expected records** | one order, at most one payment; order paid only if the payment is authorised or captured |
      | **Events** | `payment.authorized` or `payment.failed` received once |
      | **Evidence** | screen recording, order record, SandPay payment list, event log, app log with the reference |
      | **Risk / priority** | high - double charge or lost order possible |

      The three columns teams leave out - **transaction state, records and evidence** - are the ones that
      catch real payment defects. A screen can say "Success" while no capture exists.

  - id: why
    kind: why
    concepts: [scenario-matrix-design]
    title: Why a matrix instead of a list of test cases
    body: |
      - **Payments have many dimensions** that interact: method, outcome, channel, amount and currency,
        customer state, timing and interruptions.
      - **Coverage becomes visible.** You can see which outcomes were never tried on iOS, or which methods
        have no refund row.
      - **Release decisions need evidence.** A matrix with results and evidence is what lets someone sign
        off a payments release instead of hoping.
      - **Change impact is traceable.** When a new payment method or 3-D Secure flow changes, you know
        which rows to rerun.

  - id: internals
    kind: internals
    concepts: [risk-based-selection]
    title: How to build it - dimensions, risk and pairwise
    body: |
      **1. List dimensions and their values** (equivalence partitions - one value per behaviour, not per
      possible input; ISTQB CTFL 4.2.1):

      | Dimension | Values |
      |---|---|
      | Channel | web, Android, iOS |
      | Method | new card, saved card, wallet, bank payment |
      | Outcome | approve, insufficient-funds decline, fraud decline, authentication completed, authentication abandoned, unknown (timeout) |
      | Interruption | none, refresh / back, app killed, network lost |

      **2. Count.** 3 × 4 × 6 × 4 = **288** combinations - too many to run by hand for every release.

      **3. Keep the high-risk rows in full.** Anything that can charge twice, lose an order or show a wrong
      final state: approvals on every channel, unknown outcomes and interruptions on the money path,
      refunds per method.

      **4. Cover the rest with pairwise.** Covering every value once (ISTQB's *Each Choice* coverage) needs
      only 6 rows here, but ignores combinations. A pairwise set makes sure **every pair of values** of any
      two dimensions appears in at least one row. For the dimensions above it needs at least 6 × 4 = **24**
      rows (all pairs of the two largest dimensions must appear), and tools generate sets close to that
      minimum.

      **5. Know what pairwise misses.** A defect that needs **three** specific values at once (for example
      iOS + wallet + app killed) is only caught if that triple happens to be in the set. That is why
      step 3 comes first: put the risky triples in by hand.

      **6. Add invariants that every row must satisfy** - see the tests section.

  - id: visual
    kind: visual
    concepts: [scenario-matrix-design, risk-based-selection]
    title: "Flowchart: from dimensions to sign-off"
    body: |
      ```mermaid
      flowchart TD
          A[List dimensions and values] --> B[Count the combinations]
          B --> C[Mark high-risk combinations - keep in full]
          B --> D[Generate a pairwise set for the rest]
          C --> E[Matrix rows]
          D --> E
          E --> F[Add expected state, records and evidence to every row]
          F --> G[Review against financial invariants]
          G --> H[Execute and record results with evidence]
          H --> I{All high-risk rows pass?}
          I -- Yes --> J[Sign-off with known gaps listed]
          I -- No --> K[Defects, fix, rerun affected rows]
          K --> H
      ```

  - id: steps
    kind: steps
    concepts: [scenario-matrix-design, risk-based-selection]
    title: Step by step - a matrix for a release
    body: |
      1. **Scope:** which features changed? Start from them, plus the core money paths that every release
         must prove.
      2. **Dimensions and values:** from the product, the provider's capabilities and past incidents.
      3. **Risk-rate** combinations: impact (money lost, double charge, order lost, wrong message) and
         likelihood (changed code, complexity, history) give the risk level (ISTQB CTFL 5.2.1).
      4. **Select:** high risk in full; pairwise for the rest.
      5. **Write rows** with the full set of columns; link each to the test data catalogue.
      6. **Review** with a developer and a product owner: missing outcomes, wrong expectations, provider
         behaviour that differs from assumptions.
      7. **Execute** in the sandbox (and the controlled live check for production configuration), attach
         evidence, and record known gaps explicitly in the sign-off.

  - id: example
    kind: example
    concepts: [scenario-matrix-design]
    title: "Real-world example: an excerpt for a checkout release"
    body: |
      | ID | Channel | Method | Outcome / condition | Expected customer view | Expected state and records |
      |---|---|---|---|---|---|
      | PM-001 | web | new card | approve | order confirmation | `captured`; order paid; one payment |
      | PM-002 | Android | new card | approve | order confirmation | as PM-001 |
      | PM-003 | iOS | new card | approve | order confirmation | as PM-001 |
      | PM-007 | web | new card | insufficient funds | decline message, try another method | `declined`; order unpaid |
      | PM-011 | Android | saved card | authentication abandoned | back to checkout, no error loop | `requires_action` then expired/declined; order unpaid |
      | PM-014 | Android | saved card | app killed during authentication | confirming, then the real result | at most one payment; order matches it |
      | PM-019 | iOS | wallet | unknown (response lost) | confirming, then the real result | exactly one payment |
      | PM-022 | web | new card | refresh during "processing" | no second payment; real result shown | one payment |
      | PM-030 | any | any | partial refund then full refund of the rest | refund confirmations | `refunded`; total refunded = captured |

      Each row also has preconditions, steps, events and evidence in the full sheet - shortened here to fit.

  - id: tests
    kind: tests
    concepts: [scenario-matrix-design]
    title: Invariants to check on every row
    body: |
      Whatever the scenario, these must hold - check them in the data, not on the screen:

      - **No double charge:** at most one successful payment per order (unless split payments are a
        feature).
      - **Paid means paid:** an order is "paid" only if a payment is authorised or captured as your rules
        define - and vice versa.
      - **Money adds up:** total refunded ≤ total captured; captured ≤ authorised (unless your provider
        documents over-capture for your business type).
      - **Amounts are exact:** stored in minor units or exact decimals, never binary floating point;
        currency always stored with the amount.
      - **Every final state is reachable and stable:** no payment stays non-final beyond the agreed time
        without an alert.
      - **Evidence exists:** each row's evidence lets someone else confirm the result later.

  - id: mistakes
    kind: mistakes
    concepts: [scenario-matrix-design, risk-based-selection]
    title: Common mistakes
    body: |
      - **"Expected result: works."** Name the exact message, state and records.
      - **No transaction-state or evidence columns** - defects where the UI and the money disagree slip
        through.
      - **Only happy paths per channel** - interruptions and unknowns are where mobile payments break.
      - **A matrix nobody can finish.** 288 rows run once are worth less than 40 well-chosen rows run every
        release.
      - **Pairwise as the whole strategy** - the risky triples need to be added by hand.
      - **A stale matrix** - when a provider adds a method or the flow changes, the matrix must change in
        the same pull request or sprint.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [risk-based-selection]
    title: Trade-offs
    body: |
      | Approach | Strength | Weakness |
      |---|---|---|
      | Full combination | finds any interaction | explodes; rarely finished |
      | Pairwise | small and systematic | misses three-way interactions |
      | Risk-based only | focuses on what hurts | depends on the quality of risk judgement; blind spots |
      | Risk-based + pairwise | focus plus breadth | needs maintenance and discipline |

      Automation changes the economics: rows that run automatically every build can be more numerous than
      rows a person executes by hand. The matrix still decides *what* to automate.

  - id: summary
    kind: summary
    title: Summary and quick reference
    body: |
      - Row = dimensions + preconditions + steps + **customer view + transaction state + records + events +
        evidence** + risk.
      - Dimensions: channel, method, outcome, interruption, amount/currency, customer state.
      - High-risk combinations in full; pairwise for the rest; risky triples added by hand.
      - Check **invariants** on every row: no double charge, paid means paid, refunds ≤ captured, exact
        amounts.
      - Sign-off lists results, evidence and known gaps.

exercises:
  - id: invariants
    type: mcq
    concept: scenario-matrix-design
    skill: recognition
    title: Which are real invariants?
    prompt: |
      Which of these must hold after **every** scenario in a card checkout matrix? Select every one that
      applies.
    options:
      - id: refunds
        text: Total refunded never exceeds total captured.
        feedback: True - refunding more than was captured means paying out money that was never received.
      - id: one-success
        text: An order has at most one successful payment (unless split payments are a feature).
        feedback: True - this is the double-charge invariant.
      - id: declined-refund
        text: Every declined payment has a matching refund.
        feedback: False - a declined payment never took money, so there is nothing to refund.
      - id: settled-equals-authorised
        text: The settled amount always equals the authorised amount.
        feedback: False - partial captures, partial refunds and fees all make them differ legitimately.
      - id: floats
        text: Amounts are stored as floating-point numbers so decimals are exact.
        feedback: False - binary floating point can't represent many decimal amounts exactly. Use minor units or exact decimal types.
    correct: [refunds, one-success]
    hints:
      - An invariant is something that must be true no matter which path a scenario takes.
    solution: |
      **Refunds never exceed captures, and at most one successful payment per order.** The others are
      false: declines take no money, settlement differs from authorisation for good reasons, and floating
      point is the wrong type for money.
    followUp: |
      Write the SQL-style check (in words is fine) you would run after a test cycle to find any order that
      breaks the one-successful-payment invariant.

  - id: keep-in-full
    type: mcq
    concept: risk-based-selection
    skill: application
    title: What must stay in full?
    prompt: |
      You are cutting a 288-combination checkout matrix down with a pairwise tool. Which rows would you
      **add by hand and always keep**, regardless of the pairwise set? Select every one that applies.
    options:
      - id: approve-each-channel
        text: An approved payment on web, Android and iOS
        feedback: Keep - the core revenue path must be proven on every channel every release.
      - id: unknown-mobile
        text: An unknown outcome (lost response) in the mobile app
        feedback: Keep - this is where double charges and lost orders come from.
      - id: refund
        text: A full refund of a captured payment
        feedback: Keep - money going back must be proven every release.
      - id: theme-currency
        text: Every combination of saved card, currency and dark or light theme
        feedback: Low risk - the theme rarely interacts with payment logic; pairwise coverage is enough.
      - id: all-decline-codes
        text: Each of 12 decline codes on each of 3 channels
        feedback: Over the top - declines matter, but one representative per message type the product shows is enough; the rest is coverage of a mapping table, better done in an automated or unit test.
    correct: [approve-each-channel, unknown-mobile, refund]
    hints:
      - Which rows protect against money being lost, taken twice or not returned?
    solution: |
      **Approvals per channel, the unknown outcome on mobile and the refund.** Each protects against
      revenue loss, double charges or money not returned. Theme combinations are low risk, and decline
      codes are better covered once per customer-visible message plus an automated mapping test.
    followUp: |
      Name one more scenario you would always keep in full, and the incident it protects against.

  - id: matrix-gap
    type: mcq
    concept: scenario-matrix-design
    skill: analysis
    title: Which gap let this through?
    prompt: |
      After a release, some orders show "Payment successful" but the merchant was never paid: the
      payments were authorised and never captured. Every matrix row had passed. The rows looked like
      this:

      | ID | Steps | Expected result |
      |---|---|---|
      | PM-002 | Android, new card, approve | "Payment successful" screen |

      Which gap in the matrix let the defect through?
    options:
      - id: channel
        text: Not enough channels were covered.
        feedback: The defect appears on a channel that was covered. More channels with the same columns would have passed too.
      - id: state-evidence
        text: Rows checked only the customer's screen, not the expected transaction state and provider records.
        feedback: Correct - an expected state of `captured`, checked in SandPay's records, would have failed this row.
      - id: declines
        text: Not enough decline scenarios.
        feedback: The defect is on the approval path; declines wouldn't have found it.
      - id: too-many-rows
        text: The matrix had too many rows to run properly.
        feedback: The rows were run and passed - they just checked the wrong thing.
    correct: [state-evidence]
    hints:
      - The screen was right. What else should the row have required?
    solution: |
      **The rows had no expected transaction state or evidence.** "Payment successful" on screen was true
      at authorisation; only a check of the payment state (`captured`) in the provider's records would
      have caught the missing capture.

      **Fix to the matrix:** add expected state, records and evidence columns to every row, and an invariant
      check for "paid orders have a capture".
    followUp: |
      Write the improved PM-002 row with all the columns from this lesson.

  - id: build-steps
    type: order
    concept: scenario-matrix-design
    skill: recall
    title: Order the matrix-building steps
    prompt: |
      Put the steps for building a payment scenario matrix in order.
    items:
      - id: dimensions
        text: List the dimensions and their equivalence-class values
      - id: risk
        text: Rate the risk of the combinations
      - id: select
        text: Keep high-risk combinations in full and generate a pairwise set for the rest
      - id: columns
        text: Write expected customer view, transaction state, records and evidence for each row
      - id: invariants
        text: Review the rows against the financial invariants
      - id: execute
        text: Execute, record results with evidence, and list known gaps for sign-off
    hints:
      - You can't rate the risk of combinations you haven't listed.
      - Reviewing against invariants needs the expected states to exist.
    solution: |
      **Dimensions → risk → select → expected columns → invariant review → execute and sign off.**
    followUp: |
      Which step would you repeat when a new payment method is added, and which rows would change?

  - id: write-rows
    type: testdesign
    concept: scenario-matrix-design
    skill: application
    title: Write the rows for saved cards on mobile
    prompt: |
      SandPay checkout adds "pay with a saved card, with 3-D Secure when required" to the Android and iOS
      apps. Write at least six matrix rows with: dimensions, preconditions, expected customer view,
      expected transaction state and records, and evidence.
    hints:
      - Cover outcomes (approve, decline, authentication completed and abandoned) and interruptions (app killed, network lost).
      - Each row needs proof from outside the app.
    modelAnswer: |
      1. Android, saved card, no authentication needed, approve → confirmation; `captured`; one payment;
         evidence: screen, order, SandPay list.
      2. iOS, same → same.
      3. Android, saved card, challenge completed → confirmation after the challenge; `captured`.
      4. iOS, challenge abandoned (closed) → back to checkout with a clear message; payment not captured;
         order unpaid.
      5. Android, app killed during the challenge, relaunched → confirming, then real result; at most one
         payment.
      6. iOS, network lost after Pay → confirming, resolves on reconnect; exactly one payment.
      7. Android, saved card declined (insufficient funds) → decline message, option to use another
         method; order unpaid.
      8. Saved card removed on the web while the app shows it → clear error, no crash, no payment.
      Every row: event log entry, app log with reference, SandPay record.
    rubric:
      - Covered approval on both Android and iOS
      - Covered authentication completed and abandoned
      - Covered at least one interruption (app killed or network lost)
      - Covered a decline with a saved card
      - Stated an expected transaction state for every row
      - Named evidence outside the app (provider records, order data, events)
    solution: |
      Rows that stand out cover the **interruption during authentication** - the app switch to a bank
      screen is the most fragile point of mobile card payments - and state the expected transaction state
      for each.
    followUp: |
      Which of your rows would you automate first, and which must stay manual on real devices? Explain
      why for each.

  - id: explain-pairwise
    type: short
    concept: risk-based-selection
    skill: recall
    title: Explain pairwise - and its limit
    prompt: |
      In two to four sentences: what does a pairwise test set guarantee, and what kind of defect can it
      miss?
    hints:
      - Think about how many dimensions must line up for a defect to appear.
    modelAnswer: |
      A pairwise set guarantees that every combination of values for any two dimensions appears in at
      least one test. Research such as NIST's finds most interaction failures are triggered by one or two
      parameters, so it catches most of them with far fewer tests than all combinations.
      It can miss defects that only appear when three or more specific values occur together, so risky
      triples should be added by hand.
    rubric:
      - Said every pair of values of any two dimensions appears at least once
      - Said it greatly reduces the number of tests compared with all combinations
      - Said it can miss interactions of three or more specific values
    solution: |
      The key idea: **pairs are guaranteed, triples are luck** - so add the risky triples deliberately.

  - id: interview-two-days
    type: interview
    concept: risk-based-selection
    skill: application
    title: "Interview: two days before a payments release"
    prompt: |
      **Interviewer:** "We release checkout changes in two days and you can't run everything. How do you
      decide what to test, and what do you tell the release manager?"
    hints:
      - Cover how you choose, what you run first, and how you communicate gaps.
    modelAnswer: |
      - Start from what changed and the money paths it touches; list the dimensions it affects.
      - Rank by risk: double charges, lost orders, wrong final state and refunds first; then declines and
        messages; then cosmetic combinations.
      - Run the always-keep set first (approval per channel, unknown outcome and interruptions on mobile,
        refund), then the changed areas, then a pairwise sample.
      - Check invariants in the data after each run, not only screens.
      - Report results with evidence and an explicit list of what was not tested and the residual risk,
        so the release decision is informed.
    followUps:
      - Which single test would you run if you had only one hour?
      - How would you decide whether an untested area is acceptable to release?
      - What would you set up so this is easier next release?
    rubric:
      - Started from the change and the money paths it affects
      - Ranked by impact such as double charges, lost orders and refunds
      - Ran the always-keep high-risk set first
      - Checked invariants in data, not only screens
      - Reported results with evidence and an explicit list of untested areas and risk
    solution: |
      Interviewers want to hear **risk-based choices and honest communication** - a release manager can
      accept known risk, but not hidden risk.

recall:
  - id: recall-columns
    concept: scenario-matrix-design
    prompt: Which three columns most often missing from payment matrices catch real defects?
    answer: Expected transaction state, expected records (orders, ledger, provider), and evidence.
  - id: recall-invariants
    concept: scenario-matrix-design
    prompt: Name three financial invariants to check after every scenario.
    answer: At most one successful payment per order; total refunded ≤ total captured; an order is paid only if a payment is authorised or captured (and amounts stored exactly).
  - id: recall-pairwise
    concept: risk-based-selection
    prompt: What does pairwise selection guarantee?
    answer: Every pair of values for any two dimensions appears in at least one test.
  - id: recall-pairwise-limit
    concept: risk-based-selection
    prompt: What does pairwise selection miss, and what do you do about it?
    answer: Defects that need three or more specific values together - add the risky combinations by hand.
  - id: recall-keep
    concept: risk-based-selection
    prompt: Which checkout scenarios belong in every release, whatever else is cut?
    answer: Approval on every channel, unknown outcomes and interruptions on the money path, and refunds - the ones that can lose money, charge twice or lose orders.

