id: payment-ecosystem-roles
title: Merchants, gateways, processors, acquirers, networks and issuers
subject: payments-testing
module: payment-lifecycle
level: beginner
status: published
estimatedMinutes: 45
summary: Who does what in a card payment - cardholder, merchant, gateway or PSP, acquirer, card network and issuer - how authorisation, clearing and settlement move between them, and which of them a test environment really includes.
tags: [payments, card payments, issuer, acquirer, card network, psp, gateway, four-party model, clearing, settlement, interchange]

environment: |
  - **Scheme rules (primary source):** role and process definitions follow the **Visa Core Rules and Visa
    Product and Service Rules**, edition of **18 April 2026**
    ([public PDF](https://usa.visa.com/dam/VCOM/download/about-visa/visa-rules-public.pdf)) - its Glossary
    defines Acquirer, Issuer, Clearing, Settlement, Interchange, Authorization Reversal and Payment
    Facilitator. Other networks (Mastercard, RuPay, American Express, Discover, JCB, UnionPay) have their own
    rules with similar roles and different names and details.
  - **Security standard:** the **PCI SSC glossary**
    ([pcisecuritystandards.org/glossary](https://www.pcisecuritystandards.org/glossary/)) defines acquirer
    and merchant for PCI DSS purposes.
  - **Industry terms, not scheme terms:** "payment gateway", "payment service provider (PSP)" and
    "processor" are used differently by different companies. One company often plays several roles.
  - **Fictional:** SandPay and the demo shop. Fee amounts in the examples are invented to show the shape of
    the money flow - real interchange and scheme fees are set by each network and region.

prerequisites:
  - payment-lifecycle-overview

concepts:
  - id: four-party-model
    name: The four-party card model
    summary: Cardholder and issuer on one side, merchant and acquirer on the other, the card network in between - with gateways, PSPs and processors acting for one side.
  - id: clearing-and-settlement
    name: Authorisation, clearing and settlement between the parties
    summary: Authorisation asks the issuer for approval in real time; clearing exchanges the transaction records later; settlement moves the net money between members, minus fees.
  - id: test-environment-boundaries
    name: Which parties a test environment includes
    summary: A sandbox usually simulates the PSP and stands in for the acquirer, network and issuer - so defects in those parties' behaviour can't be found there.

objectives:
  - Name every party in a card payment and describe what each one does and owns.
  - Trace an authorisation request and the later clearing and settlement through the parties.
  - Explain where interchange and other fees are taken and why the merchant receives less than the purchase amount.
  - Say which parties a sandbox simulates, and which defects therefore need other evidence.

sections:
  - id: intuition
    kind: intuition
    concepts: [four-party-model]
    title: The idea in plain language
    body: |
      Paying by card is like paying with a **cheque guaranteed by your bank**, carried by a courier network
      that every bank in the world has agreed to use.

      - **You** (the cardholder) hand over the card details.
      - **Your bank** (the issuer) gave you the card and decides whether to pay.
      - **The shop's bank** (the acquirer) signed the shop up and will receive the money for it.
      - **The courier network** (Visa, Mastercard, RuPay and others) carries messages and money between the
        two banks and sets the rules everyone follows.
      - **Helpers** - a payment gateway or PSP - connect the shop's website to the shop's bank, so the shop
        doesn't have to speak bank protocols itself.

      The shop never talks to your bank directly. Every answer it gets - "approved", "declined", "try again"
      - has passed through several companies. When a tester asks "why did this payment fail?", the first
      question is: **which of them said no?**

  - id: what
    kind: what
    concepts: [four-party-model]
    title: What each party does
    body: |
      | Party | Also called | What it does | Owns |
      |---|---|---|---|
      | **Cardholder** | customer, payer | pays with a card or a token of it | the card account |
      | **Merchant** | seller, shop | accepts the payment for goods or services | the order, the customer relationship, the refund decision |
      | **Payment gateway / PSP** | payment service provider, payment processor (industry terms) | gives the merchant an API or payment page, forwards requests, often holds card data so the merchant doesn't | integration, tokens, fraud tools, reporting |
      | **Acquirer** | merchant bank, acquiring bank | "a Member that signs a Merchant or Payment Facilitator ... and directly or indirectly enters a Transaction into Interchange" (Visa Glossary) | the merchant's settlement, risk for that merchant |
      | **Card network** | card scheme, payment brand | routes authorisations between acquirers and issuers, runs clearing and settlement, writes the rules | the rules, dispute processes, interchange framework |
      | **Issuer** | card-issuing bank | "a Member that enters into a contractual relationship with a Cardholder for the issuance of one or more Card products" (Visa Glossary) | the approval decision, the cardholder's account and statement, fraud checks, 3-D Secure authentication |

      Variations you will meet:

      - **Four-party model** - issuer and acquirer are different companies, connected by the network (Visa,
        Mastercard and most domestic schemes).
      - **Three-party model** - the network itself is issuer and acquirer for many of its cards (American
        Express has traditionally worked this way in many markets). Fewer hops, same ideas.
      - **Payment facilitator** - a company that signs up small "sponsored merchants" under its own acquirer
        relationship (a role the Visa rules define). Many online-payment companies work like this.
      - One company can be gateway, PSP, payment facilitator **and** acquirer at once.

  - id: why
    kind: why
    concepts: [four-party-model, test-environment-boundaries]
    title: Why a tester needs the map
    body: |
      - **Every response has an author.** A decline can come from the PSP's fraud rules, the acquirer, the
        network or the issuer. The response codes and messages differ - and so does who can fix it.
      - **Responsibilities are split.** The merchant decides whether to refund; the issuer decides whether to
        approve and whether a chargeback is valid; the network decides disputes between members. Test what
        *your* system owns, and know what it only receives.
      - **Timing differs per party.** Authorisation is real time; clearing and settlement happen later in
        batches; a refund reaches the cardholder's statement days afterwards (the Visa rules give issuers a
        fixed number of days after settlement to post a refund, varying by region). Many "the refund didn't
        work" reports are timing, not defects.
      - **Test environments include only some parties.** Knowing which ones are simulated tells you which
        risks remain untested before production.

  - id: visual
    kind: visual
    concepts: [four-party-model, clearing-and-settlement]
    title: "Sequence diagram: one card payment, authorisation to settlement"
    body: |
      The upper part happens in seconds while the customer waits. The lower part happens later, usually
      once a day, without the customer.

      ```mermaid
      sequenceDiagram
          participant CH as Cardholder
          participant M as Merchant
          participant P as Gateway or PSP
          participant A as Acquirer
          participant N as Card network
          participant I as Issuer
          CH->>M: Pay 50.00 EUR
          M->>P: Create payment
          P->>A: Authorisation request
          A->>N: Authorisation request
          N->>I: Authorisation request
          I-->>N: Approved, funds held
          N-->>A: Approved
          A-->>P: Approved
          P-->>M: Authorised
          Note over M,I: Later - capture, clearing and settlement
          M->>P: Capture 50.00 EUR
          P->>A: Clearing record in the next batch
          A->>N: Clearing - transaction records
          N->>I: Clearing - issuer posts to the statement
          I->>N: Settlement - pays the net amount
          N->>A: Settlement - minus interchange and network fees
          A->>M: Payout - minus the acquirer or PSP fee
      ```

  - id: internals
    kind: internals
    concepts: [clearing-and-settlement]
    title: How the money and the messages move
    body: |
      **Authorisation** asks the issuer: will you pay this? The issuer checks the account, available funds,
      fraud signals and authentication, and answers with an approval or a decline. An approval **reserves**
      the amount on the cardholder's account; no money has moved yet. Cancelling an approval before it is
      cleared is an **authorisation reversal** - "a V.I.P. System message that cancels an Approval Response"
      in the Visa Glossary.

      **Clearing** is "a processing service for the validation and valuation of financial and non-financial
      records exchanged between Visa and Members" (Visa Glossary). The acquirer sends the transaction records
      - usually after the merchant has **captured** the payment - and the issuer posts them to the
      cardholder's statement.

      **Settlement** is "the reporting and funds transfer of Settlement Amounts owed by one Member to another,
      or to Visa, as a result of Clearing" (Visa Glossary). Settlement is **net**: members exchange the
      daily balance of everything that cleared, not one transfer per payment.

      **Fees on the way** (the shape is universal, the amounts are not):

      | Fee | Paid by | Paid to | Set by |
      |---|---|---|---|
      | Interchange | acquirer | issuer | the network's interchange framework, by region, card type and transaction type |
      | Network (scheme) fees | issuer and acquirer | the network | the network |
      | Acquirer / PSP fee (merchant service charge) | merchant | acquirer or PSP | the merchant's contract |

      So a merchant that sold for 50.00 EUR may receive, say, 49.20 EUR (invented figure). Reconciliation
      tests check that **gross amount, fees and net payout** agree - see
      [Reconciliation for testers](#/lesson/reconciliation-for-testers).

  - id: example
    kind: example
    concepts: [four-party-model, test-environment-boundaries]
    title: "Real-world example: \"declined\" - but by whom?"
    body: |
      After a release, 3 % of card payments at the demo shop fail with "Payment declined". The developers
      say the code didn't change in the payment path. The tester collects, for ten failed payments, what each
      party returned (SandPay's fictional API exposes this in the payment object):

      ```json
      {
        "id": "pay_4Tq8",
        "status": "declined",
        "decline": {
          "source": "psp_risk",
          "code": "risk_threshold",
          "network_response": null
        }
      }
      ```

      All ten have `"source": "psp_risk"` and no network response - **the request never reached the
      acquirer or the issuer**. The PSP's risk rules declined them. Comparing with the release notes shows the
      checkout started sending the customer's IP address in a new field, which the PSP's rules weighted
      heavily.

      Without knowing the parties, the team would have opened a ticket with the issuing banks or blamed
      customers' cards. With it, the right owner - the PSP risk configuration and the field mapping - was
      found in an afternoon.

  - id: when
    kind: when
    concepts: [test-environment-boundaries]
    title: Which parties your test environment includes
    body: |
      | Party | In a PSP sandbox | In a mock you build | In production |
      |---|---|---|---|
      | Merchant (your system) | real | real | real |
      | Gateway / PSP API | **real API, test mode** | simulated | real |
      | PSP risk rules | simplified or off | absent | real, tuned on live traffic |
      | Acquirer | simulated | absent | real |
      | Card network | simulated | absent | real |
      | Issuer decisions | **simulated by test card or test payment method** | simulated by your stub | real, per bank |
      | 3-D Secure | simulated challenge pages | absent | real issuer pages and apps |
      | Clearing, settlement, payouts | often simulated, sometimes not at all | absent | real, on real schedules |

      What follows for testing:

      - **Issuer behaviour can't be tested in a sandbox** - only the PSP's simulation of it. A real bank's
        unusual response code, its 3-D Secure page on a small phone, or its slowness are production facts.
      - **Settlement and payout timing** need the provider's documentation and, ideally, a controlled check
        in production with small real amounts (if your organisation allows it).
      - **What you can test thoroughly** is your own system's handling of every response the PSP documents -
        see [Test cards, sandboxes and mock services](#/lesson/sandbox-test-data).

  - id: tests
    kind: tests
    concepts: [four-party-model, clearing-and-settlement]
    title: Test cases that follow the parties
    body: |
      | ID | Scenario | Expected | Evidence |
      |---|---|---|---|
      | T1 | Approved payment | order paid; payment record shows the PSP reference and the authorisation result | payment object, order record |
      | T2 | Decline by the issuer (sandbox test method) | clear customer message; decline source and code stored for support | stored decline details, message text |
      | T3 | Decline by PSP risk rules | different internal reason from T2, same safe customer message | stored source = PSP risk |
      | T4 | Authorised, then cancelled before capture | authorisation reversed (void); no settlement line for it | payment status, settlement report |
      | T5 | Captured payment | appears in the next settlement report with gross, fee and net | settlement report row |
      | T6 | Refund after settlement | refund recorded; customer told how long it takes to appear | refund record, message text |
      | T7 | PSP unreachable | no order marked paid; payment status checked later | logs, order status |

      T2 and T3 check that your system **keeps who declined and why**. Support teams need it, and the customer
      should get a message that is honest without revealing fraud rules.

  - id: mistakes
    kind: mistakes
    concepts: [four-party-model, clearing-and-settlement, test-environment-boundaries]
    title: Common mistakes and how to avoid them
    body: |
      - **Treating "authorised" as "paid".** Authorisation reserves money; capture, clearing and settlement
        move it.
      - **Calling every decline "the bank".** Find the source - PSP risk, acquirer, network or issuer.
      - **Expecting refunds to appear instantly.** Posting to the cardholder's account follows clearing and
        settlement, on the issuer's schedule within the network's rules.
      - **Assuming the sandbox proves issuer behaviour.** It proves your handling of the PSP's simulated
        responses.
      - **Using one company's vocabulary as universal.** "Processor" or "gateway" means different things at
        different companies; check the contract and the documentation.
      - **Ignoring fees in tests.** Net payout = gross - fees. A report that only shows gross amounts can't be
        reconciled.

  - id: summary
    kind: summary
    title: Summary and quick reference
    body: |
      - Four parties around the network: **cardholder ↔ issuer**, **merchant ↔ acquirer**; gateways and PSPs
        act for the merchant side.
      - **Authorisation** (real time, reserves funds) → **capture** → **clearing** (records exchanged) →
        **settlement** (net funds moved) → **payout** to the merchant.
      - **Interchange** goes from acquirer to issuer; network fees to the network; the merchant pays the
        acquirer or PSP.
      - Every decline has a **source** - record it.
      - Sandboxes simulate the parties beyond the PSP. Source: Visa Core Rules (Glossary), 18 April 2026.

exercises:
  - id: who-decides
    type: mcq
    concept: four-party-model
    skill: application
    title: Who makes the approval decision?
    prompt: A customer's card payment for 80.00 EUR is approved. Which party made the decision to approve it?
    options:
      - id: issuer
        text: The issuer - the bank that issued the customer's card
        feedback: Correct - the issuer holds the cardholder's account and decides whether to approve; the others route or forward the request.
      - id: acquirer
        text: The acquirer - the merchant's bank
        feedback: The acquirer forwards the merchant's request into the network and receives the answer, but the approval belongs to the issuer.
      - id: network
        text: The card network
        feedback: The network routes the request between acquirer and issuer and sets the rules. In some cases it can answer on the issuer's behalf (stand-in), but normally the issuer decides.
      - id: psp
        text: The PSP, because it sends the "authorised" response to the shop
        feedback: The PSP relays the issuer's answer. It can decline on its own (risk rules), but an approval comes from the issuer.
    correct: [issuer]
    hints:
      - Who holds the customer's account and knows whether the money is there?
    solution: |
      **The issuer.** The request travels merchant → PSP → acquirer → network → issuer, and the answer comes
      back the same way. Each party may add its own checks, but approval of the cardholder's funds is the
      issuer's decision.
    followUp: |
      Name two ways a payment can be declined **before** the request reaches the issuer, and how you would tell
      them apart from an issuer decline in the evidence.

  - id: order-flow
    type: order
    concept: clearing-and-settlement
    skill: recall
    title: From "Pay" to the merchant's bank account
    prompt: Put the stages of a card payment in order.
    items:
      - id: auth
        text: Authorisation - the issuer approves and reserves the amount
      - id: capture
        text: Capture - the merchant confirms it wants the money
      - id: clearing
        text: Clearing - transaction records are exchanged and posted to the statement
      - id: settlement
        text: Settlement - net funds move between issuer, network and acquirer
      - id: payout
        text: Payout - the acquirer or PSP pays the merchant, minus fees
    hints:
      - The customer waits only for the first stage.
    solution: |
      Authorisation → capture → clearing → settlement → payout. Only authorisation happens while the
      customer waits; the rest runs later in batches.

  - id: fee-direction
    type: mcq
    concept: clearing-and-settlement
    skill: application
    title: Where does interchange go?
    prompt: In the four-party model, which statement about interchange is correct?
    options:
      - id: acq-to-iss
        text: It is paid by the acquirer to the issuer, and the acquirer usually passes the cost on to the merchant.
        feedback: Correct - interchange flows from the acquiring side to the issuing side; the merchant pays it indirectly through its service charge.
      - id: merchant-to-network
        text: It is paid by the merchant directly to the card network.
        feedback: The merchant pays its acquirer or PSP. Network fees exist, but interchange goes to the issuer.
      - id: cardholder
        text: It is added to the cardholder's purchase amount.
        feedback: The cardholder normally pays the purchase amount. Interchange is taken between the banks.
      - id: iss-to-acq
        text: It is paid by the issuer to the acquirer to reward it for the transaction.
        feedback: The direction is the other way round for purchases - from acquirer to issuer.
    correct: [acq-to-iss]
    hints:
      - Which side bears the cost of providing the card and the credit?
    solution: |
      **Acquirer to issuer.** That is why the merchant's payout is lower than the sale - interchange, network
      fees and the acquirer's or PSP's margin are all taken on the way.
    followUp: |
      A settlement report shows gross 1,000.00 EUR and net 982.40 EUR. What would you check to decide whether
      the 17.60 EUR difference is correct?

  - id: debug-decline-source
    type: debug
    concept: four-party-model
    skill: analysis
    title: Read the decline
    prompt: |
      Support says "the customer's bank declined it". Click the line in SandPay's (fictional) payment object
      that shows this is **not** what happened.
    language: json
    code: |
      {
        "id": "pay_7Hn3",
        "status": "declined",
        "amount": 12900,
        "currency": "EUR",
        "decline": {
          "source": "psp_risk",
          "code": "velocity_limit",
          "network_response": null
        }
      }
    correctLines: [7]
    lineNotes:
      - line: 3
        note: The status confirms a decline, but not who declined it.
      - line: 9
        note: A null network response supports the conclusion - but line 7 names the source directly.
    hints:
      - Look for the field that names who declined it.
    solution: |
      **Line 7.** The source is the PSP's risk rules (`velocity_limit` - too many attempts in a short time),
      and line 9 confirms there was no network response: the request never reached the issuer. The customer's
      bank didn't decline anything; telling the customer to call their bank would waste their time.
    followUp: |
      What would the same object look like if the issuer had declined for insufficient funds? Which fields would
      change?

  - id: sandbox-limits-design
    type: testdesign
    concept: test-environment-boundaries
    skill: application
    title: What can't the sandbox prove?
    prompt: |
      Your team plans to sign off a new card checkout using only the PSP sandbox. List what the sandbox **can**
      prove, at least four risks it **can't**, and for each of those, the evidence or extra test you would
      propose before or right after go-live.
    hints:
      - Go through the parties in the table - which are real in the sandbox?
      - Think about real issuers' 3-D Secure pages, response codes, timing and settlement.
    modelAnswer: |
      **Can prove:** our integration with the PSP API - request format, every documented response handled,
      statuses and webhooks, idempotency, error messages, order updates.

      **Can't prove, and what to do:**

      1. Real issuers' 3-D Secure pages and apps on real phones → a controlled production check with team cards
         from several banks, if allowed; monitor 3-D Secure completion rates after launch.
      2. Real decline codes and their frequency → monitor decline sources and codes per issuer in the first week;
         alert on spikes.
      3. Live PSP risk rules (simplified in the sandbox) → review the rules with the PSP; watch risk declines
         after launch.
      4. Settlement, fees and payout timing → check the first real settlement report against orders (gross, fees,
         net) - see reconciliation.
      5. Real latency of acquirer and issuer → check timeouts against production latency figures from the PSP;
         monitor.
    rubric:
      - Said what the sandbox does prove (the integration with the PSP)
      - Named issuer behaviour (3-D Secure pages, real response codes) as unprovable in the sandbox
      - Named live risk rules
      - Named settlement, fees or payout timing
      - Proposed a concrete check or monitoring for each risk
      - Mentioned controlled production checks only within the organisation's rules
    solution: |
      Compare with the model answer. The usual gap is **settlement and fees** - nothing in a sandbox checkout
      shows that the money actually arrives, correctly, on time.
    followUp: |
      Which of your post-launch checks would you automate as monitoring, and what threshold would trigger an alert?

  - id: interview-explain-flow
    type: interview
    concept: clearing-and-settlement
    skill: application
    title: "Interview: explain a card payment"
    prompt: |
      *"Explain what happens, end to end, when a customer pays 50 euros by card on our website - and where you, as
      a tester, would look for problems."* Answer as you would in the interview.
    hints:
      - Name the parties first, then the stages.
      - For each stage, say what can go wrong and what your evidence would be.
    modelAnswer: |
      The customer enters their card in our checkout - usually in the PSP's hosted fields, so we never handle the
      card number. Our backend creates a payment with the PSP, which sends an authorisation request through the
      acquirer and the card network to the issuer. The issuer checks funds, fraud and possibly 3-D Secure
      authentication, approves and reserves 50 euros. The answer comes back the same way; we mark the order
      authorised.

      Later we capture - immediately or at shipping. Captured payments go into clearing, where the records are
      exchanged and the issuer posts them to the customer's statement, and then settlement, where the net amounts
      move between the banks. The PSP pays us out, minus interchange, network fees and its own fee.

      Where I'd test: our handling of every response - approve, each decline source, timeouts and unknown outcomes;
      idempotency on retries; 3-D Secure flows and returns; capture and void timing; webhooks and status consistency;
      and reconciliation - that orders, settlement reports and payouts agree, including fees and refunds.
    rubric:
      - Named the parties in the right order (merchant, PSP or gateway, acquirer, network, issuer)
      - Explained that authorisation reserves funds and capture or settlement moves them
      - Mentioned clearing and settlement as later, batched stages
      - Mentioned fees and that the payout is net
      - Linked stages to concrete test risks (declines, timeouts, idempotency, 3-D Secure, reconciliation)
      - Mentioned keeping card data out of the merchant's systems (hosted fields or tokens)
    followUps:
      - What changes if the customer pays with Apple Pay or Google Pay?
      - Where does a chargeback enter this picture?
      - How would you test that payouts are correct?
    solution: |
      Interviewers want both **the map and the tester's eye**: who does what, when money really moves, and what
      you would verify at each step.

  - id: explain-net-settlement
    type: short
    concept: clearing-and-settlement
    skill: recall
    title: Why the payout is not the sum of the orders
    prompt: In two or three sentences, explain why a merchant's daily payout rarely equals the total of that day's orders.
    hints:
      - Think about fees, timing and refunds.
    modelAnswer: |
      Settlement is net: interchange, network fees and the acquirer's or PSP's fee are deducted, and refunds and
      chargebacks of earlier payments are subtracted. Timing also differs - payments are captured and cleared in
      batches, so a day's payout can contain orders from other days and miss some of today's.
    rubric:
      - Mentioned fees deducted before payout
      - Mentioned refunds or chargebacks netted against payments
      - Mentioned timing or batching differences
    solution: |
      Reconciliation exists for exactly this reason - matching each order to its line in the settlement report.

placement:
  - id: place-roles
    type: mcq
    concept: four-party-model
    skill: application
    title: The merchant's bank
    prompt: Which party signs up the merchant to accept card payments and enters its transactions into the card network?
    options:
      - id: acquirer
        text: The acquirer
        feedback: Correct - the Visa rules define the acquirer as the member that signs a merchant and enters its transactions into interchange.
      - id: issuer
        text: The issuer
        feedback: The issuer has the relationship with the cardholder, not the merchant.
      - id: network
        text: The card network
        feedback: The network connects the members and writes the rules; merchants sign with an acquirer (or a payment facilitator).
      - id: cardholder-bank
        text: The cardholder's bank
        feedback: That is another name for the issuer, which is on the cardholder's side.
    correct: [acquirer]
    solution: |
      **The acquirer** (merchant bank). PSPs and payment facilitators may sit in between, but the transaction
      enters the network through an acquirer.

  - id: place-settlement
    type: mcq
    concept: clearing-and-settlement
    skill: application
    title: Has the money moved?
    prompt: A payment shows "authorised" in the PSP dashboard. What is true?
    options:
      - id: reserved
        text: The issuer has approved and reserved the amount, but no funds have been settled to the merchant yet.
        feedback: Correct - authorisation reserves; capture, clearing and settlement move the money later.
      - id: paid
        text: The merchant has received the money.
        feedback: Payouts happen after settlement, usually days later.
      - id: cleared
        text: The transaction has been cleared and posted to the cardholder's statement.
        feedback: Clearing follows capture; an authorisation is usually shown as a pending hold, not a posted transaction.
      - id: nothing
        text: Nothing has happened at the issuer yet.
        feedback: The issuer has already made its decision and placed a hold - that is what authorisation is.
    correct: [reserved]
    solution: |
      **Approved and reserved, not settled.** If the merchant never captures, the authorisation is reversed or
      eventually expires, and no money moves.

  - id: place-boundaries
    type: mcq
    concept: test-environment-boundaries
    skill: analysis
    title: Proven in the sandbox?
    prompt: Which of these can a PSP sandbox test **reliably**?
    options:
      - id: handling
        text: That your checkout handles each decline response the PSP documents with the right message and order status
        feedback: Correct - your own handling of the PSP's documented responses is exactly what a sandbox is for.
      - id: issuer-3ds
        text: That a particular bank's 3-D Secure page works on small phones
        feedback: The sandbox shows the PSP's simulated challenge page, not the real issuer's page or app.
      - id: decline-rate
        text: What share of real customers' payments will be declined
        feedback: Decline rates depend on real issuers, cards and live risk rules - production data only.
      - id: payout-timing
        text: That payouts will arrive in your bank account on the expected day
        feedback: Sandboxes rarely run real settlement and payouts; check the provider's schedule and the first real reports.
    correct: [handling]
    solution: |
      **Your handling of documented responses.** Everything that depends on real issuers, live risk rules or real
      money movement needs production evidence or monitoring.

recall:
  - id: recall-parties
    concept: four-party-model
    prompt: Name the parties in the four-party card model.
    answer: Cardholder, issuer, card network, acquirer and merchant - with gateways or PSPs acting for the merchant side.
  - id: recall-issuer
    concept: four-party-model
    prompt: What does the issuer own in a card payment?
    answer: The relationship with the cardholder, the approval decision, the cardholder's account and statement, fraud checks and 3-D Secure authentication.
  - id: recall-auth-vs-settle
    concept: clearing-and-settlement
    prompt: What is the difference between authorisation and settlement?
    answer: Authorisation is the issuer's real-time approval that reserves the amount; settlement is the later transfer of net funds between members after clearing.
  - id: recall-interchange
    concept: clearing-and-settlement
    prompt: Who pays interchange to whom?
    answer: The acquirer pays it to the issuer; the merchant pays for it indirectly through its acquirer's or PSP's fees.
  - id: recall-sandbox-parties
    concept: test-environment-boundaries
    prompt: Which parties does a PSP sandbox usually simulate rather than include?
    answer: The acquirer, the card network and the issuer - including 3-D Secure, clearing, settlement and payouts.

