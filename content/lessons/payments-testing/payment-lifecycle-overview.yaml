placement:
  - id: place-who-declined
    type: mcq
    concept: payment-roles
    skill: application
    title: Who made the decision?
    prompt: |
      A card payment is declined with the reason "insufficient funds". Which party made that decision?
    options:
      - id: issuer
        text: The issuer (the cardholder's bank)
        feedback: Correct - only the issuer knows the cardholder's balance or credit.
      - id: acquirer
        text: The acquirer (the merchant's bank)
        feedback: The acquirer doesn't see the cardholder's funds; it forwards the authorisation.
      - id: merchant
        text: The merchant
        feedback: The merchant can block payments with its own risk rules, but can't know the cardholder's funds.
      - id: network
        text: The card network
        feedback: The network routes the request between acquirer and issuer; it doesn't hold the account.
    correct: [issuer]
    solution: |
      **The issuer.** It holds the cardholder's account, so funds decisions are always the issuer's.

  - id: place-void-or-refund
    type: mcq
    concept: authorization-capture-settlement
    skill: application
    title: Cancel before shipping
    prompt: |
      A customer cancels an order before it ships. The payment is authorised but not captured. What should the
      merchant do?
    options:
      - id: void
        text: Void the authorisation.
        feedback: Correct - nothing has been captured, so cancelling the authorisation releases the hold.
      - id: refund
        text: Refund the payment.
        feedback: There is nothing to refund yet - no money has been captured.
      - id: capture-refund
        text: Capture it, then refund it.
        feedback: It would work in many systems, but it moves money for no reason, takes longer for the customer and may cost fees.
      - id: wait
        text: Do nothing and let the authorisation expire.
        feedback: The hold stays on the customer's account until it expires - a poor experience, and the order stays half-open.
    correct: [void]
    solution: |
      **Void it.** Before capture, a void cancels the authorisation and releases the hold; refunds are for money
      that has been captured.

  - id: place-status-order
    type: order
    concept: payment-state-transitions
    skill: application
    title: A valid status history
    prompt: |
      Put these SandPay statuses in the order a payment passes through them when it is later refunded in two
      parts.
    items:
      - id: created
        text: "`created`"
