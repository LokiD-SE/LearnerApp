id: sandbox-test-data
title: Test cards, sandboxes and mock services
subject: payments-testing
module: payment-test-design
level: beginner
status: published
estimatedMinutes: 40
summary: How payment sandboxes simulate outcomes, what they can't tell you, how to design a test-data catalogue, and how to keep card data out of places it must never be.
tags: [payments, sandbox, test data, test cards, mocks, pci dss, luhn, masking]

environment: |
  - **Universal:** sandboxes, mocks and stubs; the Luhn checksum used by card numbers (ISO/IEC 7812).
  - **Standard:** PCI DSS (Payment Card Industry Data Security Standard) sets the rules for storing,
    processing and transmitting card data. Statements here are a tester's awareness summary, not legal
    or compliance advice - your security team owns the details.
  - **Provider-specific:** how a sandbox chooses an outcome (special test payment methods, test card
    numbers, magic amounts or names), which scenarios it can simulate, and its rate limits. Use only the
    test data your provider publishes, in its test mode.
  - **Fictional:** SandPay and its test payment methods (`pm_sandpay_...`). This lesson deliberately
    shows **no card numbers**, not even published test ones.
  - Code: Java 17+.

prerequisites:
  - payment-lifecycle-overview

concepts:
  - id: sandbox-limits
    name: What sandboxes can and can't prove
    summary: Sandboxes simulate the provider's API, not real issuers, networks or bank timing.
  - id: payment-test-data-design
    name: Payment test-data design
    summary: A deliberate catalogue of inputs that reliably produce each outcome, isolated per test.
  - id: card-data-safety
    name: Handling card data safely
    summary: Real card data never enters test systems, logs, screenshots or bug reports; displayed numbers are masked.

objectives:
  - Explain what a payment sandbox simulates and list what it cannot prove about production.
  - Choose between a sandbox, a mock service and a controlled production check for a given test.
  - Build a test-data catalogue that produces each payment outcome on demand.
  - Recognise card data that must never be stored or shared, and act correctly when it leaks into test artefacts.

sections:
  - id: intuition
    kind: intuition
    title: The idea in plain language
    body: |
      Pilots train in a **flight simulator**. It behaves like the real aircraft for the things it was built
      to simulate - and you can make an engine fail on purpose, which you'd never do in the sky. But a
      simulator isn't the real weather, the real airport or the real passengers.

      A **payment sandbox** is that simulator for a payment provider's API. You send real-looking
      requests, and special test inputs make the "bank" approve, decline, ask for authentication or time
      out - whenever you want. No money moves. But the sandbox isn't a real issuer, a real card network or
      real settlement, so some questions it simply cannot answer.

  - id: what
    kind: what
    title: What the tools are
    body: |
      | Tool | What it is | Typical use |
      |---|---|---|
      | **Sandbox** (test mode) | the provider's API running against simulated banks | end-to-end flows, outcome coverage, webhooks |
      | **Test payment methods** | provider-published inputs that trigger an outcome (test cards, tokens, special values) | choosing approve / decline / 3-D Secure / errors |
      | **Mock service** | your own fake of the provider's API | unit and integration tests, fault injection, offline work |
      | **Stub** | a canned response for one call | a single test that needs one fixed answer |
      | **Controlled live check** | a small, agreed production transaction with a company-owned card, then refunded | proving production configuration after a release - only under an agreed process |

      SandPay's (fictional) test payment methods:

      | Test method | Outcome |
      |---|---|
      | `pm_sandpay_approve` | approved |
      | `pm_sandpay_decline_insufficient_funds` | declined - insufficient funds |
      | `pm_sandpay_decline_stolen` | declined - card reported stolen |
      | `pm_sandpay_3ds_challenge` | requires authentication, then approves if completed |
      | `pm_sandpay_processing_delay` | responds after a long delay - for timeout tests |

  - id: why
    kind: why
    title: Why deliberate test data matters
    body: |
      - **Reproducibility.** "Use any card" makes failures impossible to reproduce. A named test method
        makes the outcome deterministic.
      - **Coverage.** Declines, authentication and delays are where defects live - you need inputs that
        produce them on demand.
      - **Safety.** Real card data in a test system is a security incident: test environments have
        weaker controls, more people with access and logs nobody reviews.
      - **Isolation.** Shared sandbox accounts and reused orders make tests interfere with each other -
        one test's refund changes another test's balance.

  - id: internals
    kind: internals
    title: How a sandbox decides the outcome
    body: |
      Behind the sandbox API there is no issuer - the provider's simulator inspects your request and
      picks a scripted outcome. Common triggers (each provider uses its own):

      - a **test payment method or test card number** mapped to an outcome;
      - a **special amount** (for example a particular number of minor units);
      - a **special value in another field**, such as a name or reference.

      What follows from that:

      - **Outcomes are scripted.** Real issuers decline for reasons a script doesn't have, and in
        proportions no sandbox reproduces.
      - **Timing is artificial.** Authorisation is instant, settlement is simulated or skipped, and holds
        don't behave like a real bank's.
      - **Authentication is simplified.** A 3-D Secure "challenge" is a provider test page, not each bank's
        real screen.
      - **Webhooks usually work**, but timing, ordering and retry behaviour may differ from production.

  - id: when
    kind: when
    title: Which environment for which question?
    body: |
      ```mermaid
      flowchart TD
          Q[What do you need to prove?] --> A{Your code's logic for a given response?}
          A -- Yes --> M[Mock or stub - fast, deterministic, can inject any fault]
          A -- No --> B{The integration with the provider's API and events?}
          B -- Yes --> S[Sandbox with published test methods]
          B -- No --> C{Production configuration, keys and real bank behaviour?}
          C -- Yes --> L[Controlled live check with a company card, under an agreed process]
          C -- No --> R[Revisit the question]
      ```

      A healthy strategy uses all three: **mocks** for breadth and faults, the **sandbox** for
      integration, and a **small controlled live check** for what only production can prove.

  - id: steps
    kind: steps
    title: Step by step - building a test-data catalogue
    body: |
      1. **List the outcomes** your flows must handle: approve, each decline type you treat differently,
         authentication required (completed, failed, abandoned), delays, errors.
      2. **Map each outcome to a published trigger** from the provider's test documentation, and record
         the documentation link and date - test data changes.
      3. **Add the dimensions you care about:** currency, amount boundaries, saved versus new payment
         method, customer type.
      4. **Decide isolation:** a fresh order and reference per test; separate sandbox accounts per team or
         pipeline where possible; no reliance on data another test creates.
      5. **Store the catalogue with the tests** (a table or data file), not in someone's notes.
      6. **Review it** whenever the provider changes its test data or you add a payment method.

  - id: example
    kind: example
    title: "Real-world example: the flaky refund suite"
    body: |
      A team's refund tests pass alone but fail in the nightly run about one night in five. The
      investigation shows two suites share one sandbox account and one hard-coded order reference. When
      they run in parallel, suite B refunds the payment suite A is about to refund, and A sees "nothing
      left to refund".

      **Fix:** each test creates its own payment with a unique reference, and the pipelines use separate
      sandbox accounts. **Lesson:** "flaky" payment tests are often a test-data isolation defect, not a
      product defect - but check before you dismiss them.

  - id: code
    kind: code
    title: "Code: using test methods, and the Luhn check"
    collapsed: true
    body: |
      Create a sandbox payment that will be declined for insufficient funds:

      ```bash
      curl -i "https://api.sandpay.example/v1/payments" \
        -H "Authorization: Bearer $SANDPAY_TEST_KEY" \
        -H "Content-Type: application/json" \
        -d '{"amount": 2500, "currency": "EUR", "payment_method": "pm_sandpay_decline_insufficient_funds", "reference": "T-REFUND-0042"}'
      ```

      Card numbers carry a check digit computed with the **Luhn algorithm**. Forms often use it to catch
      typing mistakes before sending anything - so a tester needs to know it. Starting from the rightmost
      digit (the check digit), double every second digit; if a doubled value is over 9, subtract 9; the
      number is valid when the total is a multiple of 10.

      ```java
      static boolean passesLuhn(String digits) {
          int sum = 0;
          boolean doubleIt = false;                   // the check digit itself is not doubled
          for (int i = digits.length() - 1; i >= 0; i--) {
              int digit = digits.charAt(i) - '0';
              if (doubleIt) {
                  digit *= 2;
                  if (digit > 9) digit -= 9;
              }
              sum += digit;
              doubleIt = !doubleIt;
          }
          return sum % 10 == 0;
      }
      ```

      The classic worked example `79927398713` passes. Passing Luhn says only that the digits are
      self-consistent - **not** that a card exists, and never a reason to try a number against a real
      service.

  - id: tests
    kind: tests
    title: Tests that depend on test data
    body: |
      | ID | Test | Data | Expected |
      |---|---|---|---|
      | D1 | Approval end to end | `pm_sandpay_approve`, unique reference | `authorized`/`captured` as configured; order paid |
      | D2 | Insufficient funds | `pm_sandpay_decline_insufficient_funds` | decline shown with a helpful, non-technical message; order not paid |
      | D3 | Stolen card | `pm_sandpay_decline_stolen` | generic decline message (don't reveal fraud reasons); no retry offered automatically |
      | D4 | Authentication completed / failed / abandoned | `pm_sandpay_3ds_challenge` | each path ends in the right status and message |
      | D5 | Slow response | `pm_sandpay_processing_delay` | timeout handling as designed (see the timeouts lesson) |
      | D6 | Card number field validation (UI) | a mistyped number failing Luhn | rejected in the form before any request |
      | D7 | Masking | any test method | receipts, order pages and logs show at most the allowed digits |
      | D8 | Parallel isolation | two runs at once | no test changes another's data |

  - id: mistakes
    kind: mistakes
    title: Common mistakes
    body: |
      - **Using a real card "just once" in a test environment.** It's a security incident. Use published
        test data only; production checks only with company cards and an agreed process.
      - **Assuming sandbox success means production success.** Different keys, configuration, fraud rules,
        authentication and bank behaviour.
      - **Hard-coding magic amounts across the code base.** When the provider changes them, tests break
        mysteriously. Keep them in one catalogue.
      - **Shared accounts and fixed references** - parallel runs interfere.
      - **Card data in artefacts.** HAR files, screenshots, logs and bug reports are copied widely. Check
        them before attaching, and redact.
      - **Logging full request bodies at checkout** "for debugging". Report it as a defect.

  - id: card-data
    kind: tradeoffs
    title: "Card data: what may exist where"
    body: |
      PCI DSS distinguishes **cardholder data** (the card number - PAN - plus name, expiry date and
      service code) from **sensitive authentication data** (the card verification code, full magnetic
      stripe/chip data, PINs).

      - Cardholder data may be stored **only if needed and protected** - for example, the PAN rendered
        unreadable.
      - Sensitive authentication data **must not be stored after authorisation**, even encrypted.
      - When a PAN is displayed, it must be masked so that **at most the first digits (BIN) and the
        last four** show. Only people with a legitimate business need may see more than that.

      Most merchants avoid the problem by letting the provider's hosted fields or SDK collect card data
      and receiving only a **token**. A tester's job: verify that the raw number and CVV never reach your
      servers, logs or analytics - and that what *is* displayed is masked.

  - id: summary
    kind: summary
    title: Summary and quick reference
    body: |
      - Sandbox = the provider's API with **scripted** banks. Great for integration and outcomes; can't
        prove real issuer behaviour, real authentication screens or settlement timing.
      - Mocks for logic and faults, sandbox for integration, controlled live checks for production
        configuration.
      - Keep a **test-data catalogue**: outcome → published trigger → documentation link.
      - Isolate tests: unique references, separate accounts, no shared state.
      - **Never** real card data in test systems, logs, screenshots or bug reports. CVV is never stored
        after authorisation. Displayed PANs are masked.

exercises:
  - id: what-pan-data-may-be-stored
    type: mcq
    concept: card-data-safety
    skill: recognition
    title: What may be stored after authorisation?
    prompt: |
      Under PCI DSS, which of these may a merchant system store after authorisation, assuming it has a
      business need and protects it as required? Select every one that applies.
    options:
      - id: pan
        text: The card number (PAN), rendered unreadable
        feedback: Allowed when needed and protected - it is cardholder data, not sensitive authentication data.
      - id: name
        text: The cardholder's name
        feedback: Allowed when there is a business need - the name is cardholder data, so it may be kept if it is protected.
      - id: expiry
        text: The expiry date
        feedback: Allowed when there is a business need - the expiry date is cardholder data too, not sensitive authentication data.
      - id: cvv
        text: The card verification code (CVV/CVC), encrypted
        feedback: Never after authorisation - it is sensitive authentication data, and encryption doesn't make storing it acceptable.
      - id: pin
        text: The PIN or PIN block
        feedback: Never - sensitive authentication data.
    correct: [pan, name, expiry]
    hints:
      - PCI DSS splits card data into two groups. One group may be kept if protected; the other never.
    solution: |
      **The protected PAN, the name and the expiry date** (cardholder data) may be stored when needed and
      protected. The **CVV/CVC and PIN** are sensitive authentication data and must never be stored after
      authorisation - encryption doesn't change that.
    followUp: |
      Where in a typical checkout could a CVV accidentally be stored? List three places you would check.

  - id: sandbox-cannot-prove
    type: mcq
    concept: sandbox-limits
    skill: application
    title: What can't the sandbox tell you?
    prompt: |
      Before a launch, your manager asks which of these questions the **sandbox alone** cannot answer
      reliably. Select every one that applies.
    options:
      - id: issuer-behaviour
        text: How often real issuers will decline your customers' cards
        feedback: Correct - sandbox declines are scripted; real decline rates depend on real issuers and customers.
      - id: bank-3ds-screens
        text: Whether each bank's real 3-D Secure screen works inside your mobile app
        feedback: Correct - the sandbox shows a provider test page, not each bank's real authentication page.
      - id: settlement-timing
        text: When captured money will arrive in your bank account
        feedback: Correct - settlement in a sandbox is simulated or skipped.
      - id: request-format
        text: Whether your API requests are formatted the way the provider expects
        feedback: The sandbox answers this well - it validates requests like production does.
      - id: decline-handling
        text: Whether your checkout shows the right message for an insufficient-funds decline
        feedback: The sandbox answers this well - a test method produces that decline on demand.
    correct: [issuer-behaviour, bank-3ds-screens, settlement-timing]
    hints:
      - Which of these depend on real banks, real customers or real time - things a script can't contain?
    solution: |
      **Real decline rates, real bank authentication screens and real settlement timing** need
      production (or production-like) evidence: monitoring after launch, controlled live checks, and the
      provider's reports. Request formats and your handling of each scripted outcome are exactly what the
      sandbox is for.
    followUp: |
      For each of the three, describe the evidence you would gather after launch instead, and who owns
      it.

  - id: luhn-bug
    type: debug
    concept: payment-test-data-design
    skill: analysis
    title: The form rejects valid numbers
    prompt: |
      The checkout form's Luhn check rejects the classic valid example `79927398713`, so testers
      can't even enter a provider's published test number. Click the line that causes it.
    language: java
    code: |
      static boolean passesLuhn(String digits) {
          int sum = 0;
          boolean doubleIt = true;
          for (int i = digits.length() - 1; i >= 0; i--) {
              int digit = digits.charAt(i) - '0';
              if (doubleIt) {
                  digit *= 2;
                  if (digit > 9) digit -= 9;
              }
              sum += digit;
              doubleIt = !doubleIt;
          }
          return sum % 10 == 0;
      }
    correctLines: [3]
    lineNotes:
      - line: 8
        note: Subtracting 9 from a doubled digit over 9 is correct - it is the same as adding the two digits of the result (16 becomes 1 + 6 = 7).
      - line: 4
        note: Walking from the rightmost digit is correct - the algorithm is defined from the check digit leftwards.
    hints:
      - Which digit is the rightmost one, and should it be doubled?
      - Trace the first two loop iterations for 79927398713.
    solution: |
      **Line 3.** The loop starts at the rightmost digit - the **check digit** - which must **not** be
      doubled. Starting with `doubleIt = true` doubles the check digit and every other digit after it,
      which is the wrong set. With `false`, the classic example sums to 70 and passes.

      Regression test to add: a known-valid number passes and the same number with one digit changed
      fails.
    followUp: |
      Write three more unit tests for this method: one that a correct implementation must pass, one it
      must reject, and one edge case (an input with spaces, or an empty string). What should happen for
      each?

  - id: leaked-card-in-har
    type: mcq
    concept: card-data-safety
    skill: analysis
    title: A real card in a bug report
    prompt: |
      A bug report on the staging checkout has a HAR file attached. You open it and find a request body
      with a full card number, expiry and CVV. The reporter says it is "my own card, I just used it to
      test quickly". What should you do first?
    options:
      - id: private
        text: Mark the bug report private and continue investigating the bug.
        feedback: The data stays stored and copied - in the tracker, notifications and backups. Restricting access isn't enough.
      - id: remove-and-report
        text: Remove the attachment (and any copies), follow your organisation's incident process, and redo the test with published test data.
        feedback: Correct - get the data out of the artefact first, let the security process decide what else is needed, and continue the investigation with safe data.
      - id: staging-ok
        text: Nothing - staging isn't production, so PCI rules don't matter.
        feedback: Real card data is in scope wherever it is stored. Staging usually has weaker controls, which makes it worse.
      - id: ask-retest
        text: Ask the reporter to retest with a different real card and attach a new HAR.
        feedback: That repeats the incident. Real cards don't belong in test environments at all.
    correct: [remove-and-report]
    hints:
      - The first priority isn't the bug - it is the data that should not exist where it is.
      - Who in your organisation decides how to handle exposed card data?
    solution: |
      **Remove the data, follow the incident process, and retest with test data.** Bug trackers copy
      attachments into notifications, exports and backups, so speed matters. The security team decides
      on follow-up (for example whether the card should be replaced).

      There is often a **second finding**: the staging checkout sent the raw number and CVV through your
      own servers at all. If the design is supposed to use the provider's hosted fields, that is a defect
      to report - without the card data.
    followUp: |
      Write the second defect report: the title, the evidence (without any card data), and why it
      matters even if only test cards are ever used in staging.

  - id: test-data-catalogue
    type: testdesign
    concept: payment-test-data-design
    skill: application
    title: Design the test-data catalogue
    prompt: |
      Design a test-data catalogue for SandPay checkout testing. Cover the outcomes your checkout must
      handle and, for each, the trigger, the expected result, and how you keep tests isolated.
    hints:
      - Start from outcomes, not from cards.
      - How will two test runs avoid touching the same payment?
    modelAnswer: |
      | Outcome | Trigger (SandPay) | Expected |
      |---|---|---|
      | Approve | `pm_sandpay_approve` | authorised/captured, order paid |
      | Decline - insufficient funds | `pm_sandpay_decline_insufficient_funds` | helpful decline message, order unpaid |
      | Decline - stolen card | `pm_sandpay_decline_stolen` | generic decline message, no auto-retry |
      | Authentication completed / failed / abandoned | `pm_sandpay_3ds_challenge` | correct status and message for each path |
      | Slow response | `pm_sandpay_processing_delay` | timeout handling as designed |

      Plus: currencies and amount boundaries (smallest amount, maximum, minor-unit edge values), saved
      versus new payment method. Isolation: unique reference per test, a fresh payment per test, separate
      sandbox accounts per pipeline. Each row links to the provider documentation page it came from.
    rubric:
      - Organised by outcome, with a published trigger for each
      - Covered at least two different decline types handled differently
      - Covered authentication completed, failed and abandoned
      - Covered a slow response or timeout trigger
      - Added amount or currency dimensions
      - Described how tests stay isolated (unique references, separate accounts or fresh data)
      - Recorded where each trigger is documented so the catalogue can be maintained
    solution: |
      The two most valuable lines are the ones people skip: **isolation** and **documentation links**.
      Without them the catalogue silently rots and the suite turns flaky.
    followUp: |
      The provider announces it will retire one of your test methods next quarter. Describe how your
      catalogue lets you find every affected test in minutes.

  - id: explain-three-environments
    type: short
    concept: sandbox-limits
    skill: recall
    title: Mock, sandbox or live?
    prompt: |
      In three to five sentences, explain when you would use a mock service, the provider's sandbox and a
      controlled live check - and what each one cannot prove.
    hints:
      - Think about who controls each environment, and how close each is to real banks.
    modelAnswer: |
      A mock is my own fake of the provider: fast, deterministic and able to inject any fault, but it only
      proves my code against my assumptions about the API. The sandbox is the provider's real API with
      scripted banks: it proves the integration and lets me trigger each outcome, but not real issuer
      behaviour, real authentication screens or settlement. A controlled live check with a company card
      proves production configuration and keys, but only for one card and one bank, and it needs an
      agreed process because real money moves.
    rubric:
      - Said a mock tests own code and faults but rests on own assumptions about the API
      - Said the sandbox proves the integration and scripted outcomes but not real banks or settlement
      - Said a controlled live check proves production configuration but is narrow and needs an agreed process
    solution: |
      The key idea: each environment answers a **different question**, and none of them answers all of
      them.

recall:
  - id: recall-sandbox
    concept: sandbox-limits
    prompt: Name three things a payment sandbox cannot prove about production.
    answer: Real issuer decisions and decline rates, each bank's real authentication (3-D Secure) screens, and real settlement timing (also production keys and configuration).
  - id: recall-trigger
    concept: payment-test-data-design
    prompt: How does a sandbox decide whether to approve or decline?
    answer: From scripted triggers in the request - provider-published test payment methods or card numbers, special amounts or special field values.
  - id: recall-isolation
    concept: payment-test-data-design
    prompt: Why do payment tests need unique references and separate accounts?
    answer: So tests running in parallel don't change each other's payments - shared data makes suites flaky and hides real defects.
  - id: recall-cvv
    concept: card-data-safety
    prompt: May a merchant store the CVV after authorisation if it is encrypted?
    answer: No. The CVV is sensitive authentication data and must never be stored after authorisation, encrypted or not.
  - id: recall-masking
    concept: card-data-safety
    prompt: How much of a card number may be displayed?
    answer: By default at most the BIN (first digits) and the last four. Only people with a legitimate business need may see more.
  - id: recall-luhn
    concept: payment-test-data-design
    prompt: What does passing the Luhn check prove about a card number?
    answer: Only that its digits are self-consistent (no simple typing mistake) - not that the card exists or is valid for payments.

