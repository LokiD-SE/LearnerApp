placement:
  - id: place-sandbox-gap
    type: mcq
    concept: sandbox-limits
    skill: application
    title: What still needs production evidence?
    prompt: |
      All sandbox tests for the new mobile checkout pass. Which of these can the sandbox **not** have proven?
    options:
      - id: bank-screens
        text: That each real bank's 3-D Secure screen works inside the app
        feedback: Correct - the sandbox shows the provider's test page, not each bank's real authentication screen.
      - id: request-format
        text: That the app's payment requests have the format SandPay expects
        feedback: The sandbox validates requests like production does, so this is proven.
      - id: decline-message
        text: That an insufficient-funds decline shows the right message
        feedback: A sandbox decline trigger produces exactly this case, so it is proven.
      - id: webhooks
        text: That the backend accepts SandPay's webhook signatures
        feedback: The sandbox sends signed webhooks, so the verification code path is exercised.
    correct: [bank-screens]
    solution: |
      **Real banks' 3-D Secure screens.** Scripted sandboxes can't reproduce each issuer's authentication page -
      that needs controlled live checks and monitoring after launch.

  - id: place-flaky-refunds
    type: mcq
    concept: payment-test-data-design
    skill: analysis
    title: Refund tests fail in parallel
    prompt: |
      Two refund suites pass on their own but sometimes fail with "nothing left to refund" when the nightly run
      executes them in parallel. What is the most likely cause?
    options:
      - id: shared-data
        text: Both suites use the same sandbox account and payment reference.
        feedback: Correct - one suite refunds the payment the other is about to refund.
      - id: outage
        text: A SandPay sandbox outage at night.
        feedback: An outage would fail far more than refunds, and not only when the two suites overlap.
      - id: luhn
        text: The test card numbers fail the Luhn check.
        feedback: Luhn failures would stop payments from being created at all, every time.
      - id: key-expired
        text: The sandbox API key expires overnight.
        feedback: An expired key would fail every request with an authentication error, not this message.
    correct: [shared-data]
    solution: |
      **Shared test data.** Give every test its own payment and unique reference, and separate sandbox accounts per
      pipeline.

  - id: place-what-to-show
    type: mcq
    concept: card-data-safety
    skill: application
    title: What may the confirmation page show?
    prompt: |
      Which of these may appear on an order confirmation page for the customer?
    options:
      - id: last-four
        text: "\"Paid with Visa ending 7731\""
        feedback: Correct - the last four digits identify the card without exposing it.
      - id: full-number
        text: The full card number, so the customer can check it
        feedback: A full card number must never be displayed like this.
      - id: cvv
        text: The expiry date and the security code (CVV)
        feedback: The CVV must never be stored after authorisation, so it can't be shown either.
      - id: hidden-field
        text: The full card number in a hidden form field for "buy again"
        feedback: Hidden fields are still in the page source - this exposes the full number.
    correct: [last-four]
    solution: |
      **The last four digits.** Show the minimum needed for the customer to recognise the card; never the full
      number or the CVV, visible or hidden.
