id: card-payments-and-tokenisation
title: Card payments, saved cards and tokenisation
subject: payments-testing
module: checkout-and-methods
level: beginner
status: published
estimatedMinutes: 45
summary: What card data is, what a token replaces - PSP vault tokens, EMV network tokens and device tokens - and how to test saved cards, cardholder- and merchant-initiated payments, card updates and declines on stored credentials.
tags: [payments, cards, pan, tokenisation, network tokens, saved cards, card on file, stored credentials, cit, mit, pci dss]

environment: |
  - **Standards and scheme rules:**
    - **EMV Payment Tokenisation** - EMVCo's specification and overview
      ([emvco.com/emv-technologies/payment-tokenisation](https://www.emvco.com/emv-technologies/payment-tokenisation/));
      the Visa rules define a Token as "a type of Payment Credential issued in accordance with the EMV Payment
      Tokenisation Specification - Technical Framework".
    - **Visa Core Rules and Visa Product and Service Rules**, 18 April 2026
      ([public PDF](https://usa.visa.com/dam/VCOM/download/about-visa/visa-rules-public.pdf)) - Glossary
      (Stored Credential, Token, Token Requestor) and Table 5-22 "Processing Requirements for Transactions
      Using Stored Credentials".
    - **PCI DSS v4.0.1** (PCI Security Standards Council, June 2024) - requirement 3.3.1 (sensitive
      authentication data not kept after authorisation), 3.4.1 (PAN masked when displayed) and 3.5.1 (PAN
      unreadable wherever stored). This is awareness for testers, not compliance advice.
  - **Provider-specific:** how your PSP names tokens and saved payment methods, whether it uses network
    tokens, and its card-updater service. Mastercard and other networks have equivalent stored-credential
    rules with their own details.
  - **Fictional:** SandPay ids (`pm_...`, `cus_...`). **No card numbers appear in this lesson.**

prerequisites:
  - payment-ecosystem-roles

concepts:
  - id: card-data-elements
    name: Card data elements
    summary: The PAN, expiry date and cardholder name are cardholder data; the card verification code, full track data and PIN are sensitive authentication data that must not be kept after authorisation.
  - id: token-types
    name: PSP tokens, network tokens and device tokens
    summary: A PSP vault token stands in for a card at one provider; an EMV network token is issued by a token service and restricted to a merchant, device or use; device tokens power mobile wallets.
  - id: stored-credential-payments
    name: Stored credential payments
    summary: Saving a card needs a verified first transaction; later payments are cardholder-initiated or merchant-initiated, flagged as such, and declines on merchant-initiated ones need customer notice.

objectives:
  - Tell cardholder data from sensitive authentication data and say what may be stored, shown and logged.
  - Explain what PSP tokens, network tokens and device tokens replace and why they reduce risk.
  - Distinguish cardholder-initiated from merchant-initiated payments on a saved card and name the rules each must follow.
  - Design tests for saving a card, paying with it, card updates and declines on stored credentials.

sections:
  - id: intuition
    kind: intuition
    concepts: [token-types]
    title: The idea in plain language
    body: |
      A hotel doesn't give you the master key to every room. It gives you a **key card that only opens your
      room, only until checkout**. If you lose it, the hotel cancels it and nobody can use it anywhere else -
      and the master key was never at risk.

      A **payment token** works the same way. Instead of storing your real card number (the master key), the
      shop stores a stand-in value that only works **for that shop, or that phone, or that kind of payment**.
      If the shop is hacked, the stolen tokens are close to worthless. If your card is replaced, the bank can
      update what the token points to - your subscription keeps working.

      For testers, tokens change what you check: not "is the card number stored safely?" but "does the token
      work only where it should, does it survive card changes, and does nothing else leak the real number?"

  - id: what
    kind: what
    concepts: [card-data-elements]
    title: What card data is - and what may be kept
    body: |
      PCI DSS divides account data into two groups:

      | Group | Elements | After authorisation |
      |---|---|---|
      | **Cardholder data** | primary account number (PAN), cardholder name, expiry date, service code | may be stored only if needed - the PAN must be **unreadable** wherever it is stored (req. 3.5.1: strong cryptography, truncation, index tokens or one-way hashes) |
      | **Sensitive authentication data (SAD)** | full track data, card verification code (the 3- or 4-digit code on the card), PIN / PIN block | **must not be stored** after authorisation, even encrypted (req. 3.3.1) |

      When a PAN is **displayed**, it is masked: the BIN (the first six or eight digits, which identify the
      issuer) and the last four digits are the most anyone may see without a documented business need
      (req. 3.4.1). Most checkout screens show only the brand and the last four digits.

      Most merchants avoid all of this by never receiving card data: the card is typed into the **PSP's hosted
      fields or payment page**, and the merchant gets back a **token**.

  - id: internals
    kind: internals
    concepts: [token-types]
    title: How the three kinds of token differ
    body: |
      | | PSP vault token | EMV network token | Device token (mobile wallets) |
      |---|---|---|---|
      | Issued by | your PSP | a **token service provider** run by or for the card network | a token service, provisioned to a phone or watch |
      | Replaces the PAN | inside the PSP only - the PSP still sends the real PAN to the network | **everywhere** - the network maps it back to the PAN for the issuer | everywhere, like a network token |
      | Usable | only with that PSP | restricted to a merchant, device or payment scenario ("domain controls") | only from that device's wallet |
      | Survives a new card | depends on the PSP's card-updater service | the issuer can update the mapping, often "without any interaction from the cardholder" (EMVCo) | updated by the issuer and the wallet |
      | Per-payment proof | none | often a **cryptogram** per transaction | a cryptogram per transaction |

      EMVCo's description: a payment token replaces the PAN with "a unique alternative value", is "constrained in
      how it can be used", and "should not be usable beyond a specific merchant, device or payment scenario".
      The **Payment Account Reference (PAR)** links all the tokens of one card account without revealing the
      PAN - useful, for example, to recognise a returning customer across a card and its tokens.

      The merchant usually sees only its PSP's id (a `pm_...` style value in SandPay) - which one of these sits
      behind it is the PSP's business, but it changes behaviour you can test: card updates, decline rates,
      which errors appear.

  - id: why
    kind: why
    concepts: [stored-credential-payments, card-data-elements]
    title: Why saved cards need their own tests
    body: |
      - **Card data leaks happen around the payment, not in it.** Logs, analytics events, error messages,
        screenshots and support tools are where full card numbers turn up. Tokens only help if nothing else
        carries the real data.
      - **Stored credentials have rules.** The Visa rules (Table 5-22) require, before a credential is stored,
        an authorisation for the amount or - if nothing is due - an **account verification**; if it isn't
        approved, "the Merchant must not store the credential". Payments with stored credentials must be
        flagged correctly (for example as recurring, instalment or unscheduled credential-on-file).
      - **Two kinds of later payments behave differently.** A **cardholder-initiated** payment (the customer
        clicks "Pay" with a saved card) requires the merchant to validate the cardholder's identity, for
        example by login. A **merchant-initiated** payment (a subscription renewal at night) happens without
        the customer - and if it is declined, the merchant "must notify the Cardholder in writing and allow
        the Cardholder at least 7 calendar days to pay by other means" (Visa rules, Table 5-22).
      - **Cards change.** Expiry, replacement after loss, a new number from the bank: without updates, saved
        cards and subscriptions start failing quietly.

  - id: visual
    kind: visual
    concepts: [stored-credential-payments, token-types]
    title: "Sequence diagram: saving a card, then a merchant-initiated renewal"
    body: |
      Notice that the merchant's server never sees the card number - and that the first payment is what makes
      the later renewal legitimate.

      ```mermaid
      sequenceDiagram
          participant C as Customer browser
          participant M as Merchant server
          participant P as PSP
          participant N as Network token service
          participant I as Issuer
          C->>P: Card details typed into PSP hosted fields
          P-->>C: Payment method pm_8Xc1
          C->>M: Subscribe with pm_8Xc1
          M->>P: First payment, cardholder present, flag - save for recurring
          P->>N: Request network token
          N-->>P: Token for this merchant
          P->>I: Authorisation, initial recurring transaction
          I-->>P: Approved
          P-->>M: Approved, pm_8Xc1 saved
          Note over M,I: One month later, customer not present
          M->>P: Renewal with pm_8Xc1, merchant-initiated recurring
          P->>I: Authorisation with token and the initial transaction reference
          I-->>P: Approved or declined
          P-->>M: Result - on decline, notify the customer
      ```

  - id: steps
    kind: steps
    concepts: [stored-credential-payments]
    title: Step by step - testing a saved card
    body: |
      1. **Save** - pay or verify with a sandbox test method and "save card" ticked. Expect a saved payment
         method shown as brand + last four + expiry, and a stored PSP id - never a PAN - in your database.
      2. **Refuse to save on failure** - a declined first payment or failed verification must leave **no**
         saved card.
      3. **Pay with it (cardholder-initiated)** - signed in; check the request is flagged as using a stored
         credential and that a step-up such as 3-D Secure appears when the sandbox asks for it.
      4. **Merchant-initiated renewal** - trigger the subscription job; check the flag (recurring /
         unscheduled), the reference to the initial transaction if your PSP needs it, and the result handling.
      5. **Decline on renewal** - the customer is notified, has time to pay another way, and the subscription
         isn't cancelled or retried in a tight loop.
      6. **Card update** - simulate an expired or replaced card (many sandboxes have test methods or webhooks
         for updater events); check the saved card's display and the next renewal.
      7. **Delete** - the customer removes the card; it can't be used again, including by the renewal job.
      8. **Search for leaks** - logs, events, error reports and support views for anything that looks like a
         card number or a verification code.

  - id: example
    kind: example
    concepts: [card-data-elements]
    title: "Real-world example: the card number in the error log"
    body: |
      The shop never receives card numbers - the PSP's hosted fields handle them. Yet a security scan of the
      log platform flags 14-to-16-digit numbers in one service's error logs.

      The tester traces them: when the PSP's hosted fields fail to load (blocked by a browser extension), the
      checkout **falls back** to a plain HTML form that posts the card details to the merchant's own server -
      a leftover from an old integration. The server rejects the request and logs the whole body.

      What makes this a test finding, not just a security one:

      - The fallback was never in the test plan, because "we don't handle card data".
      - Reproduction is simple: block the PSP's script in DevTools (see
        [browser DevTools for testers](#/lesson/browser-devtools-for-testers)) and submit the form.
      - The fix removes the fallback; the regression test blocks the PSP script and asserts that the checkout
        shows "payment unavailable" and **sends nothing**.

      Under PCI DSS the merchant's environment that the cards passed through is now in scope - expensive. The
      cheapest defence is the test that proves card data never reaches your systems.

  - id: code
    kind: code
    concepts: [stored-credential-payments, token-types]
    title: Saved-card requests (fictional SandPay API)
    collapsed: true
    body: |
      First payment that also saves the card for future merchant-initiated renewals:

      ```http
      POST /v1/payments HTTP/1.1
      Host: api.sandpay.example
      Authorization: Bearer <sandbox key>
      Content-Type: application/json
      Idempotency-Key: sub-ORD-2001

      {
        "amount": 999,
        "currency": "EUR",
        "customer": "cus_5Rf2",
        "payment_method": "pm_8Xc1",
        "save_for_future": "recurring",
        "initiated_by": "customer"
      }
      ```

      The renewal a month later, without the customer:

      ```http
      POST /v1/payments HTTP/1.1
      Host: api.sandpay.example
      Authorization: Bearer <sandbox key>
      Content-Type: application/json
      Idempotency-Key: renewal-SUB-77-2026-11

      {
        "amount": 999,
        "currency": "EUR",
        "customer": "cus_5Rf2",
        "payment_method": "pm_8Xc1",
        "initiated_by": "merchant",
        "reason": "recurring",
        "initial_payment": "pay_2Kd9"
      }
      ```

      What the saved payment method looks like to the merchant - brand, last four and expiry for display, no
      PAN:

      ```json
      {"id": "pm_8Xc1", "type": "card", "brand": "visa", "last4": "4242", "exp_month": 8, "exp_year": 2029}
      ```

      Field names are SandPay's; real PSPs use their own (for example "off-session", "merchant-initiated" or
      "unscheduled"). The idempotency key of the renewal includes the subscription and the period, so a job that
      runs twice can't charge twice.

  - id: tests
    kind: tests
    concepts: [stored-credential-payments, card-data-elements, token-types]
    title: Positive and negative test cases
    body: |
      | ID | Scenario | Expected | Evidence |
      |---|---|---|---|
      | P1 | save card on an approved first payment | saved method shown as brand + last four + expiry | UI, database row holds only the PSP id |
      | P2 | pay with saved card, signed in | approved; request flagged as stored-credential, customer-initiated | PSP request log |
      | P3 | monthly renewal job | approved; flagged merchant-initiated recurring with the initial reference | PSP request, payment object |
      | P4 | card updated by the issuer (sandbox updater event) | next renewal succeeds with the updated card; display shows new expiry | webhook, saved method |
      | N1 | first payment declined with "save card" ticked | **no** card saved | saved methods list empty |
      | N2 | renewal declined | customer notified with a way to pay; retries spaced, not looped | email, retry schedule |
      | N3 | renewal job runs twice for the same period | one payment | payment list, idempotency key |
      | N4 | deleted card used by the renewal job | refused before calling the PSP | job log, no PSP request |
      | N5 | another customer's `pm_` id sent in a payment request | refused - payment methods belong to one customer | API error |
      | N6 | PSP hosted fields fail to load | no fallback that sends card data to the merchant | Network log shows nothing sent |
      | N7 | search logs and events after a test run | nothing that looks like a PAN or a verification code | log search results |

  - id: mistakes
    kind: mistakes
    concepts: [card-data-elements, stored-credential-payments, token-types]
    title: Common mistakes and how to avoid them
    body: |
      - **"We use tokens, so card data is not our problem."** Fallback forms, logs and support tools still leak
        it. Test for leaks explicitly.
      - **Storing the verification code "for renewals".** It must never be stored after authorisation; renewals
        don't need it.
      - **Saving a card after a decline.** The first transaction or verification must be approved.
      - **Wrong or missing initiator flags.** Merchant-initiated payments sent as customer-initiated (or the
        reverse) get unexpected declines or authentication requests.
      - **Retrying declined renewals in a loop.** It annoys issuers and customers; follow a schedule and notify.
      - **Not testing card changes.** Expiry dates pass in production even if they never do in a sandbox.
      - **Using real cards "just once" in test.** Never - use the PSP's published test methods in test mode only.

  - id: summary
    kind: summary
    title: Summary and quick reference
    body: |
      - **Cardholder data** (PAN, name, expiry) - unreadable if stored, masked when shown (BIN + last four
        maximum). **Sensitive authentication data** (verification code, track, PIN) - never stored after
        authorisation. (PCI DSS 3.3.1, 3.4.1, 3.5.1)
      - **PSP token** - stands in at one PSP. **Network token** - EMV-specified, restricted by domain, updatable
        by the issuer. **Device token** - wallet on a phone or watch.
      - Saving a card needs an **approved first payment or account verification**.
      - **CIT** - customer present, identity validated. **MIT** - customer absent, flagged; on decline, notify and
        allow at least 7 days to pay another way (Visa rules, Table 5-22).
      - Test save, use, renew, update, delete, double-run and **leaks**.

exercises:
  - id: what-may-be-stored
    type: mcq
    concept: card-data-elements
    skill: application
    title: What may the merchant keep?
    prompt: After an approved payment, which of these may a merchant's system keep, under PCI DSS? Select every one that applies.
    options:
      - id: last4
        text: The card brand and the last four digits of the PAN, for display
        feedback: Correct - a masked or truncated PAN is how saved cards are shown to customers.
      - id: psp-token
        text: The PSP's payment method id for the saved card
        feedback: Correct - the token or payment method id is what the merchant uses for later payments.
      - id: cvv
        text: The card verification code, encrypted, for faster repeat purchases
        feedback: Sensitive authentication data must not be stored after authorisation, even if encrypted (req. 3.3.1).
      - id: full-pan-log
        text: The full PAN in an application log, for troubleshooting
        feedback: A full PAN in a log is stored PAN that is readable - against req. 3.5.1, and a classic leak.
      - id: expiry
        text: The expiry month and year, to remind the customer before the card expires
        feedback: Correct - expiry is cardholder data that may be kept when there is a business need, and is commonly shown with saved cards.
    correct: [last4, psp-token, expiry]
    hints:
      - Separate cardholder data from sensitive authentication data.
      - Where is a stored value readable by anyone with access?
    solution: |
      **Brand + last four, the PSP id and the expiry.** The verification code is sensitive authentication data -
      never stored after authorisation - and a full PAN in a log is readable stored card data.
    followUp: |
      Your logs contain the last four digits next to the customer's email. Is that a problem? What would you ask
      the security team?

  - id: token-scope
    type: mcq
    concept: token-types
    skill: application
    title: The stolen token database
    prompt: |
      An attacker steals a merchant's database of **EMV network tokens** (not PANs). Why is the damage much smaller
      than if PANs had been stolen?
    options:
      - id: domain
        text: Network tokens are restricted to a merchant, device or payment scenario, and the issuer can replace them.
        feedback: Correct - EMVCo describes tokens as constrained in use and controllable by issuers, so a stolen token is of little use elsewhere.
      - id: encrypted
        text: Tokens are encrypted card numbers that the attacker can't decrypt.
        feedback: A token is a substitute value, not an encrypted PAN - there is nothing to decrypt.
      - id: expire-daily
        text: Tokens expire every day.
        feedback: Tokens don't expire daily; their protection comes from domain restrictions and lifecycle control.
      - id: no-value
        text: Tokens can't be used for payments at all.
        feedback: They are used for payments - by the right merchant or device. That is why the restriction matters.
    correct: [domain]
    hints:
      - What does EMVCo say a token should not be usable beyond?
    solution: |
      **Domain restrictions and lifecycle control.** A token works only within its domain (this merchant, this
      device, this use), and issuers can suspend or replace it.
    followUp: |
      Would the same be true for a PSP vault token stolen from the merchant? What would the attacker still need?

  - id: debug-mit-flag
    type: debug
    concept: stored-credential-payments
    skill: analysis
    title: The renewal sent as if the customer were there
    prompt: |
      Monthly renewals are declined much more often than expected, and some ask for 3-D Secure - which nobody can
      complete at 3 a.m. Click the line that sends the renewal with the wrong initiator.
    language: java
    code: |
      PaymentRequest renewal(Subscription sub) {
          return PaymentRequest.builder()
              .amountMinor(sub.priceMinor())
              .currency(sub.currency())
              .customer(sub.customerId())
              .paymentMethod(sub.paymentMethodId())
              .initiatedBy(Initiator.CUSTOMER)
              .reason(Reason.RECURRING)
              .initialPayment(sub.firstPaymentId())
              .idempotencyKey("renewal-" + sub.id() + "-" + sub.currentPeriod())
              .build();
      }
    correctLines: [7]
    lineNotes:
      - line: 10
        note: The key per subscription and period is right - a job that runs twice can't charge twice.
      - line: 9
        note: Referencing the initial payment is what makes the merchant-initiated renewal legitimate.
    hints:
      - Who starts a renewal at 3 a.m.?
    solution: |
      **Line 7.** A renewal without the customer is **merchant-initiated**. Flagging it as customer-initiated tells
      the issuer the customer is present, which invites authentication challenges nobody can complete and more
      declines. It must be `Initiator.MERCHANT`.
    followUp: |
      Write the test that would have caught this - what do you assert in the PSP request, and how do you capture it?

  - id: saved-card-test-design
    type: testdesign
    concept: stored-credential-payments
    skill: application
    title: Test a subscription with a saved card
    prompt: |
      Design tests for a monthly subscription paid with a saved card: sign-up, monthly renewals, a declined renewal,
      a card update, card deletion and a job that runs twice. For each, give the preconditions, steps, expected result
      and evidence. Include at least one test proving no card data reaches your systems.
    hints:
      - What must be true before a card may be saved?
      - Which renewal behaviour do the Visa rules require after a decline?
      - How do you prove absence - of a second charge, of card data?
    modelAnswer: |
      1. Sign-up with an approving test method, "save" ticked → card saved (brand, last four, expiry), first payment
         flagged as customer-initiated and "save for recurring". Evidence: saved method, PSP request.
      2. Sign-up with a declining test method → no card saved, no subscription. Evidence: empty saved methods.
      3. Renewal job → payment flagged merchant-initiated recurring, referencing the first payment. Evidence: PSP
         request, payment object.
      4. Renewal with a declining test method → customer emailed with a payment link, subscription in a grace
         period of at least 7 days, retries on a schedule. Evidence: email, subscription status, retry times.
      5. Simulated card-updater event → saved card shows the new expiry; next renewal approved. Evidence: webhook,
         saved method, payment.
      6. Customer deletes the card → renewal job doesn't call the PSP, subscription marked "payment method needed".
         Evidence: job log, no PSP request.
      7. Renewal job run twice for the same period → one payment. Evidence: payment list, same idempotency key.
      8. After the whole run, search logs, events and error reports for card-number-like values and verification
         codes → none. Evidence: search query and result.
    rubric:
      - Saving only after an approved first payment or verification
      - Renewal flagged as merchant-initiated with the initial reference
      - Declined renewal handled with customer notice and time to pay
      - Card update tested
      - Deleted card not used
      - Double job run produces one payment
      - A leak test showing no card data in logs or events
      - Evidence named for each test
    solution: |
      Compare with the model answer. The leak search (8) and the double run (7) are the ones most teams skip - and
      the ones that prevent the most expensive incidents.
    followUp: |
      The PSP offers network tokens as an option. Which of your tests would you repeat after switching them on, and
      what might change?

  - id: order-save-card
    type: order
    concept: stored-credential-payments
    skill: recall
    title: Saving a card correctly
    prompt: Put the steps of saving a card for future payments in order.
    items:
      - id: consent
        text: The customer agrees to the terms for storing the card and future payments
      - id: hosted
        text: The customer enters the card in the PSP's hosted fields
      - id: verify
        text: The first payment or an account verification is authorised
      - id: approved
        text: Only if it was approved, the PSP stores the card and returns a payment method id
      - id: store-id
        text: The merchant stores the payment method id against the customer
    hints:
      - The credential may only be stored after an approval.
    solution: |
      Consent → hosted fields → first payment or verification → store only if approved → merchant keeps the id. The
      Visa rules (Table 5-22) require the agreement first and forbid storing the credential if the initial
      authorisation or verification isn't approved.

  - id: interview-tokenisation
    type: interview
    concept: token-types
    skill: application
    title: "Interview: what is tokenisation?"
    prompt: |
      *"What is tokenisation in payments, and how would you test a feature that saves customers' cards?"* Answer as
      you would in the interview.
    hints:
      - Say what is replaced, by what, and why it reduces risk.
      - Mention the kinds of tokens, then move to the tests.
    modelAnswer: |
      Tokenisation replaces the card number with a substitute value that is useless outside its context. Most
      merchants get a PSP token - the card is entered in the PSP's hosted fields, and we store only an id, so card
      data never touches our systems, which keeps PCI DSS scope small. Networks also issue EMV network tokens, which
      replace the PAN all the way to the network, are restricted to a merchant or device, and can be updated by the
      issuer when the card changes; mobile wallets use device tokens with a cryptogram per payment.

      For a save-card feature I'd test: the card is only saved after an approved first payment or verification;
      the display shows brand, last four and expiry only; payments with the saved card are flagged correctly as
      customer- or merchant-initiated; declined renewals notify the customer and retry sensibly; card updates and
      deletion work; renewals are idempotent; one customer can't use another's payment method id; and - often
      forgotten - no card data ends up in logs, events, error reports or fallback forms.
    rubric:
      - Explained what a token replaces and why that reduces risk
      - Distinguished PSP tokens from network tokens (or device tokens)
      - Mentioned PCI DSS scope reduction through hosted fields
      - Tested saving only after approval
      - Tested CIT and MIT flags and declined renewals
      - Tested access control on payment method ids
      - Tested for card-data leaks in logs or events
    followUps:
      - What changes for the merchant when the customer's card is replaced by the bank?
      - Why must the card verification code never be stored?
      - How would you test that tokens are restricted to your merchant?
    solution: |
      Strong answers connect **what tokenisation protects** with **what still has to be tested** - flags, lifecycle and
      leaks.

  - id: explain-cit-mit
    type: short
    concept: stored-credential-payments
    skill: recall
    title: Customer- or merchant-initiated?
    prompt: In two or three sentences, explain the difference between a cardholder-initiated and a merchant-initiated payment with a stored card, with an example of each.
    hints:
      - Is the customer there when the payment happens?
    modelAnswer: |
      A cardholder-initiated payment happens while the customer takes part - for example clicking "Pay" with a
      saved card at checkout - and the merchant must validate their identity, for example by login. A
      merchant-initiated payment happens without the customer, under an earlier agreement - for example a monthly
      subscription renewal - and must be flagged as such, referencing the agreement and initial transaction.
    rubric:
      - Said CIT means the customer is present and taking part
      - Said MIT happens without the customer under a prior agreement
      - Gave a correct example of each
    solution: |
      The flag matters: it tells the issuer whether a challenge such as 3-D Secure is even possible.

placement:
  - id: place-sad
    type: mcq
    concept: card-data-elements
    skill: application
    title: Never after authorisation
    prompt: Which data element must **never** be stored after authorisation, even if encrypted?
    options:
      - id: cvc
        text: The card verification code printed on the card
        feedback: Correct - it is sensitive authentication data (PCI DSS req. 3.3.1).
      - id: expiry
        text: The expiry date
        feedback: The expiry date is cardholder data and may be kept with a business need.
      - id: name
        text: The cardholder's name
        feedback: The name is cardholder data, not sensitive authentication data.
      - id: last4
        text: The last four digits of the PAN
        feedback: A truncated PAN like the last four digits is commonly kept for display.
    correct: [cvc]
    solution: |
      **The card verification code.** Full track data and PINs are in the same group.

  - id: place-token
    type: mcq
    concept: token-types
    skill: application
    title: Which token travels to the network?
    prompt: Which kind of token replaces the PAN all the way to the card network, and can be updated by the issuer when the card is replaced?
    options:
      - id: network
        text: An EMV network token
        feedback: Correct - network tokens are issued under the EMV Payment Tokenisation framework and mapped back to the PAN by the token service.
      - id: psp
        text: A PSP vault token
        feedback: A PSP token stands in for the card inside the PSP; the PSP still sends the PAN onwards.
      - id: session
        text: A browser session token
        feedback: Session tokens identify a logged-in user; they have nothing to do with card data.
      - id: idempotency
        text: An idempotency key
        feedback: An idempotency key identifies a request for safe retries, not a card.
    correct: [network]
    solution: |
      **An EMV network token.** That is why network tokens often keep subscriptions working after a card is replaced.

  - id: place-mit
    type: mcq
    concept: stored-credential-payments
    skill: analysis
    title: The renewal is declined
    prompt: A merchant-initiated subscription renewal with a stored card is declined. Under the Visa rules, what must the merchant do?
    options:
      - id: notify
        text: Notify the cardholder in writing and allow at least 7 calendar days to pay by other means
        feedback: Correct - this is in Table 5-22 of the Visa rules (April 2026 edition).
      - id: retry-loop
        text: Retry every hour until it is approved
        feedback: Rapid retries annoy issuers and customers and don't meet the notice requirement.
      - id: cancel
        text: Cancel the subscription immediately
        feedback: The customer must get notice and time to pay another way first.
      - id: cvv
        text: Retry with the stored verification code
        feedback: The verification code must never be stored after authorisation.
    correct: [notify]
    solution: |
      **Notify in writing and allow at least 7 days.** Test it: the email, the grace period and a sensible retry schedule.

recall:
  - id: recall-sad
    concept: card-data-elements
    prompt: Which account data is sensitive authentication data, and what is the rule for it?
    answer: Full track data, the card verification code and the PIN or PIN block - none may be stored after authorisation, even encrypted.
  - id: recall-mask
    concept: card-data-elements
    prompt: How much of a PAN may be displayed without a business need?
    answer: At most the BIN (first six or eight digits) and the last four digits; most screens show only the last four.
  - id: recall-token-kinds
    concept: token-types
    prompt: What are the three kinds of payment token a tester meets?
    answer: PSP vault tokens, EMV network tokens issued by a token service, and device tokens used by mobile wallets.
  - id: recall-par
    concept: token-types
    prompt: What is a Payment Account Reference (PAR)?
    answer: A value that links a card account's tokens (and its PAN) without revealing the PAN.
  - id: recall-before-store
    concept: stored-credential-payments
    prompt: What must happen before a card may be stored for future payments?
    answer: The cardholder's agreement, then an approved authorisation for the amount or an account verification; if not approved, the card must not be stored.
  - id: recall-mit-decline
    concept: stored-credential-payments
    prompt: What does the Visa rulebook require after a declined merchant-initiated payment?
    answer: Written notice to the cardholder and at least 7 calendar days to pay by other means.

