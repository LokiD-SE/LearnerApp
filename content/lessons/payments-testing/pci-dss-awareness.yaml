id: pci-dss-awareness
title: PCI DSS awareness for testers
subject: payments-testing
module: payment-test-design
level: beginner
status: published
estimatedMinutes: 40
summary: What PCI DSS is, its twelve requirements, what "scope" and the cardholder data environment mean, how hosted payment pages shrink it, and the requirements that change a tester's daily work - test data, test accounts, logs, evidence and payment-page scripts.
tags: [payments, pci dss, security, compliance, cardholder data environment, scope, saq, test data, payment page scripts]

environment: |
  - **Standard:** **PCI DSS v4.0.1** (Payment Card Industry Data Security Standard), published by the **PCI Security
    Standards Council** in June 2024, with its **Self-Assessment Questionnaires (SAQs)** - document library at
    [pcisecuritystandards.org](https://www.pcisecuritystandards.org/document_library/), glossary at
    [pcisecuritystandards.org/glossary](https://www.pcisecuritystandards.org/glossary/). Requirement numbers in this
    lesson are v4.0.1's. The PCI SSC updated **SAQ A** in January 2025 (v4.0.1) with new eligibility criteria about
    script attacks on the merchant's site.
  - **This is awareness, not compliance advice.** Your organisation's security team, its Qualified Security Assessor
    (QSA) or acquirer decide how PCI DSS applies. Which validation a merchant needs (SAQ or a Report on Compliance) is
    set by the payment brands and the acquirer.
  - **Fictional:** the demo shop's architecture. **No card numbers appear in this lesson.**

prerequisites:
  - card-payments-and-tokenisation

concepts:
  - id: pci-dss-structure
    name: What PCI DSS is
    summary: A security standard from the PCI SSC for every entity that stores, processes or transmits cardholder data, organised as 12 requirements under 6 goals, validated by self-assessment or an assessor.
  - id: cde-scope
    name: Scope and the cardholder data environment
    summary: The cardholder data environment is every system that stores, processes or transmits account data, plus what connects to it; hosted payment pages, tokens and segmentation keep it small.
  - id: pci-for-testers
    name: PCI DSS in a tester's daily work
    summary: No live card numbers in pre-production, test data and accounts removed before go-live, no card data in logs, screenshots or tickets, and checks on the scripts that run on payment pages.

objectives:
  - Explain what PCI DSS is, who must comply, and name its twelve requirements.
  - Describe what puts a system in scope and how hosted fields, tokens and segmentation reduce scope.
  - Apply the requirements that affect testing - test data, test accounts, logs, evidence and payment-page scripts.
  - Recognise test activities that would accidentally bring a test environment into scope.

sections:
  - id: intuition
    kind: intuition
    concepts: [cde-scope]
    title: The idea in plain language
    body: |
      A bank vault has strict rules: who may enter, what is logged, how the doors are checked. The rules apply to
      **everything inside the vault and every door into it** - not to the coffee room down the hall.

      PCI DSS is the rule book for the **vault where card data lives**. The smaller the vault, the fewer rooms the rules
      apply to. That is why most shops try hard to keep card numbers **out of their own systems entirely** - the
      payment provider's hosted page collects them, and the shop only ever sees a token.

      For testers, the lesson is simple: **don't carry card data out of the vault** - not into a test database, a log
      file, a screenshot, a bug report or a chat. Each time that happens, the vault quietly grows.

  - id: what
    kind: what
    concepts: [pci-dss-structure]
    title: What PCI DSS contains
    body: |
      PCI DSS applies to "all entities that store, process or transmit cardholder data and/or sensitive authentication
      data" - merchants, PSPs, processors, service providers. It is maintained by the PCI SSC, founded by American
      Express, Discover, JCB, Mastercard and Visa; the **payment brands** enforce it through their agreements with
      acquirers and merchants.

      The **12 requirements** in **6 goals** (v4.0.1 titles):

      | Goal | Requirement |
      |---|---|
      | Build and Maintain a Secure Network and Systems | 1. Install and Maintain Network Security Controls · 2. Apply Secure Configurations to All System Components |
      | Protect Account Data | 3. Protect Stored Account Data · 4. Protect Cardholder Data with Strong Cryptography During Transmission Over Open, Public Networks |
      | Maintain a Vulnerability Management Program | 5. Protect All Systems and Networks from Malicious Software · 6. Develop and Maintain Secure Systems and Software |
      | Implement Strong Access Control Measures | 7. Restrict Access to System Components and Cardholder Data by Business Need to Know · 8. Identify Users and Authenticate Access to System Components · 9. Restrict Physical Access to Cardholder Data |
      | Regularly Monitor and Test Networks | 10. Log and Monitor All Access to System Components and Cardholder Data · 11. Test Security of Systems and Networks Regularly |
      | Maintain an Information Security Policy | 12. Support Information Security with Organizational Policies and Programs |

      **Validation:** smaller merchants usually complete a **Self-Assessment Questionnaire (SAQ)**; larger ones and
      service providers have a **Report on Compliance (ROC)** by a Qualified Security Assessor. Which applies is decided
      by the brands and the acquirer, by volume and channel.

  - id: why
    kind: why
    concepts: [cde-scope]
    title: Why scope matters so much
    body: |
      Every system in scope must meet the applicable requirements - hardening, access control, logging, vulnerability
      scans, penetration tests, change control. A shop that receives card numbers on its own servers needs all of that
      for its web servers, application servers, databases, log platform, and every system that can reach them.

      A shop whose checkout uses the PSP's **hosted payment page** or **hosted fields** (an iframe from the PSP) never
      receives card numbers, so its own systems are far less exposed - which is what the shorter SAQ types reflect:

      | SAQ (simplified) | Typical e-commerce set-up |
      |---|---|
      | **SAQ A** | all card data functions outsourced to PCI DSS-compliant providers - redirect or hosted fields; since the January 2025 update, the merchant must also confirm its site is not susceptible to attacks from scripts that could affect its e-commerce systems |
      | **SAQ A-EP** | the merchant's website controls the payment page that collects card data and posts it to the provider (for example direct post or JavaScript-built forms) |
      | **SAQ D** | the merchant stores, processes or transmits card data on its own systems |

      These are summaries - the official SAQ documents list the exact eligibility criteria. For a tester, the takeaway:
      **a change that sends card data to the shop's own systems can move the whole company into a much larger scope.**

  - id: internals
    kind: internals
    concepts: [pci-for-testers]
    title: The requirements a tester meets in daily work
    body: |
      | Requirement (v4.0.1) | What it says, in short | What it means for testing |
      |---|---|---|
      | **3.3.1** | sensitive authentication data is not kept after authorisation | never store or log the verification code, even in test |
      | **3.4.1** | PAN masked when displayed - BIN and last four digits at most | check screens, receipts, emails and exports |
      | **3.5.1** | PAN unreadable wherever stored | search databases and logs for full PANs |
      | **6.4.3** | scripts on payment pages are authorised, their integrity assured, and inventoried | test that only approved scripts run on the payment page |
      | **6.5.5** | live PANs aren't used in pre-production, unless that environment is in the CDE and protected accordingly | **only provider test data in test**; a "quick test with my own card" puts the environment in scope |
      | **6.5.6** | test data and test accounts are removed before the system goes into production | check releases for test users, test cards configured, debug endpoints |
      | **10.x** | access to system components and card data is logged and monitored | logs must not themselves contain card data |
      | **11.6.1** | a change- and tamper-detection mechanism alerts on unauthorised changes to payment pages | test that the alert fires when a payment-page script or header changes |

      Requirements 6.4.3 and 11.6.1 target **e-skimming** - malicious scripts injected into checkout pages that copy what
      customers type. They became mandatory in **March 2025** for the entities they apply to.

  - id: visual
    kind: visual
    concepts: [cde-scope]
    title: "Flowchart: is this system in scope?"
    body: |
      A simplified way to think about scope. Your security team and assessor make the real decision.

      ```mermaid
      flowchart TD
          A[A system or environment] --> B{Does it store, process or transmit card data?}
          B -- Yes --> C[In the cardholder data environment - all applicable requirements]
          B -- No --> D{Can it connect to the CDE or affect its security?}
          D -- Yes --> E[In scope as a connected or security-impacting system]
          D -- No --> F{Could card data reach it by accident - logs, tickets, test data?}
          F -- Yes --> G[Fix the leak - otherwise it is in scope]
          F -- No --> H[Out of scope - keep it that way]
      ```

  - id: steps
    kind: steps
    concepts: [pci-for-testers]
    title: Step by step - PCI-aware testing habits
    body: |
      1. **Use only the provider's test data, in its test mode.** Never a real card - yours, a colleague's or a
         customer's - in any non-production system.
      2. **Keep evidence clean.** Before attaching screenshots, HAR files or logs, check them for card numbers,
         verification codes, tokens and personal data (see [browser DevTools](#/lesson/browser-devtools-for-testers)).
      3. **Search for leaks** after test runs: logs, analytics events, error-tracking tools, message queues - for
         anything that looks like a PAN.
      4. **Test masking everywhere** the card appears: checkout, account page, receipts, emails, admin tools, exports.
      5. **Test the payment page's scripts**: compare the scripts loaded on the payment page with the approved inventory;
         add a script in a test environment and check that change detection alerts.
      6. **Check the release** for test accounts, test configuration and debug features before go-live.
      7. **Never test production card handling with real cards** unless your organisation has an approved, controlled
         procedure - and then only within it.
      8. **Report suspected card data exposure immediately** to the security team - it is an incident, not just a defect.

  - id: example
    kind: example
    concepts: [pci-for-testers, cde-scope]
    title: "Real-world example: the helpful production copy"
    body: |
      To reproduce a customer's problem, a developer restores last night's production database backup into the staging
      environment. The orders table has a `card_last4` column - harmless - but an old `payment_notes` column contains
      free-text notes from support agents, some with **full card numbers typed in by customers over the phone**.

      Staging now holds live PANs. Under requirement 6.5.5 that is only acceptable if staging is part of the CDE and
      protected as such - it isn't: wide developer access, no extra logging, shared credentials.

      The tester notices it while searching test data for a different defect and raises it with the security team as an
      incident. Outcomes: the copy is deleted and access logs reviewed; the old column is cleaned in production and
      blocked by a validation that rejects PAN-like text; restores into test environments now go through a masking job; a
      test checks that the masking job leaves nothing PAN-like.

  - id: tests
    kind: tests
    concepts: [pci-for-testers, cde-scope]
    title: Checks a tester can run
    body: |
      | ID | Check | Expected | Evidence |
      |---|---|---|---|
      | K1 | search application logs after a full checkout run | no PAN-like values, no verification codes | search query and result |
      | K2 | inspect the checkout form in DevTools | card fields are inside the PSP's iframe; the merchant's page never posts card data | Elements and Network panels |
      | K3 | block the PSP's script | no fallback form posting card data to the merchant | Network log |
      | K4 | saved card on the account page, receipt, email, admin tool | brand + last four only | screenshots |
      | K5 | scripts on the payment page versus the approved list | identical; unknown script → alert (in test) | script inventory, alert |
      | K6 | release candidate | no test accounts, test payment configuration or debug endpoints in production config | config review |
      | K7 | data restored into test environments | masked; no PAN-like values | masking job report |
      | K8 | support ticket form with a PAN typed into a free-text field | rejected or masked before storage | stored value |

  - id: mistakes
    kind: mistakes
    concepts: [pci-for-testers, cde-scope, pci-dss-structure]
    title: Common mistakes and how to avoid them
    body: |
      - **"Just once with my own card."** It puts the environment in scope and your card at risk. Use test data.
      - **Pasting full requests into tickets.** Bodies and headers can carry card data and tokens - redact first.
      - **"We use a PSP, PCI isn't our problem."** Scope shrinks, it doesn't vanish - the payment page and its scripts
        still matter, and leaks can bring card data back in.
      - **Testing only the checkout.** Card data leaks through support tools, logs, exports and free-text fields.
      - **Quoting PCI DSS from memory or blogs.** Requirement wording and SAQ eligibility change between versions -
        check the current documents.
      - **Treating a leak as a normal defect.** Card data exposure is a security incident; follow the incident process.

  - id: summary
    kind: summary
    title: Summary and quick reference
    body: |
      - **PCI DSS v4.0.1** (PCI SSC): for everyone who stores, processes or transmits card data; **12 requirements, 6
        goals**; validated by **SAQ** or **ROC**.
      - **Scope** = the cardholder data environment + connected and security-impacting systems. Hosted pages, tokens and
        segmentation shrink it; leaks grow it.
      - Tester requirements: **3.3.1** no SAD after authorisation, **3.4.1** masking, **3.5.1** PAN unreadable,
        **6.5.5** no live PANs in pre-production, **6.5.6** remove test data and accounts, **6.4.3 / 11.6.1** payment-page
        scripts and tamper detection.
      - Test data only from the provider; clean evidence; search for leaks; report exposure as an incident.

exercises:
  - id: in-scope
    type: mcq
    concept: cde-scope
    skill: application
    title: Which change grows the scope?
    prompt: The shop uses the PSP's hosted fields today. Which proposed change would most likely bring the shop's own servers into the cardholder data environment?
    options:
      - id: own-form
        text: Replace the hosted fields with the shop's own card form that posts to the shop's API, which forwards to the PSP
        feedback: Correct - the shop's servers would then receive and transmit card data, putting them in the CDE.
      - id: style
        text: Change the colours of the hosted fields through the PSP's styling options
        feedback: Styling the PSP's iframe doesn't send card data to the shop.
      - id: token-store
        text: Store the PSP's payment method ids for saved cards
        feedback: Tokens or payment method ids aren't card data; storing them is the usual scope-reducing design.
      - id: webhook
        text: Receive payment status webhooks from the PSP
        feedback: Webhooks carry statuses and ids, not card numbers - as long as your PSP doesn't include them, which you can check.
    correct: [own-form]
    hints:
      - Which option makes card numbers pass through the shop's servers?
    solution: |
      **The shop's own form.** Even "just forwarding" means transmitting card data. Raise such designs with the security
      team early - the compliance cost is often far larger than the development cost.
    followUp: |
      How would you test that the current checkout never sends card data to the shop's servers?

  - id: live-pan-test
    type: mcq
    concept: pci-for-testers
    skill: application
    title: The colleague's card
    prompt: A test of a new card brand fails in staging with the PSP's test data. A colleague offers their own real card "just to check". What is right?
    options:
      - id: refuse
        text: Don't - live PANs must not be used in pre-production unless that environment is in the CDE and protected accordingly; ask the PSP for the right test data
        feedback: Correct - this is PCI DSS requirement 6.5.5, and the PSP's test documentation or support can provide test methods.
      - id: once
        text: Use it once and delete the logs afterwards
        feedback: The card number may already be in logs, databases and monitoring tools you can't fully clean - and the environment is now in scope.
      - id: masked
        text: Use it, but only type the last four digits
        feedback: A partial number won't work for a payment, and the intent - testing with real cards in staging - is the problem.
      - id: production
        text: Test in production instead with the real card
        feedback: Production tests with real cards need an approved, controlled procedure; a spontaneous test isn't one.
    correct: [refuse]
    hints:
      - Which requirement covers live PANs in test environments?
    solution: |
      **Don't use it.** Ask the PSP for test data for that brand, or simulate the response. If the brand truly can't be
      tested in the sandbox, plan a controlled production check through the approved process.
    followUp: |
      Write the message you'd send to the PSP's support asking for test data, without including any real card details.

  - id: debug-log-line
    type: debug
    concept: pci-for-testers
    skill: analysis
    title: Which log line is a problem?
    prompt: These lines come from the checkout service's log after a test run with provider test data. Click every line that must not exist.
    language: plaintext
    code: |
      2026-10-12T09:41:07Z INFO  payment.create order=ORD-1042 amount=2500 currency=EUR method=pm_8Xc1
      2026-10-12T09:41:08Z INFO  payment.authorized id=pay_81Fz brand=visa last4=4242
      2026-10-12T09:41:08Z DEBUG psp.request body={"card":{"number":"<16 digits>","cvc":"<3 digits>","exp":"08/29"}}
      2026-10-12T09:41:09Z WARN  webhook.retry event=evt_5Kd2 attempt=2
      2026-10-12T09:41:10Z INFO  receipt.sent order=ORD-1042 to=customer@example.com
    correctLines: [3]
    lineNotes:
      - line: 2
        note: Brand and last four digits are the masked form - acceptable to log when needed.
      - line: 5
        note: An email address is personal data - check your data-protection rules - but it isn't card data.
    hints:
      - Which line would contain a full card number and verification code if the placeholders were real values?
    solution: |
      **Line 3.** A debug log of the PSP request body with the card number and verification code. Even with test data, the
      code path would log real cards in production - a breach of 3.3.1 (verification code) and 3.5.1 (readable PAN).
      Report it as a security defect: remove the logging, and add a test that searches logs for PAN-like values after a
      run.
    followUp: |
      The team says "it's only DEBUG level, disabled in production". Why is that still not acceptable?

  - id: pci-checks-design
    type: testdesign
    concept: pci-for-testers
    skill: application
    title: A PCI-aware test checklist for a release
    prompt: |
      Write a checklist of PCI-related tests for a checkout release that changes the payment page. Give at least six
      checks with the expected result and the evidence, covering card data handling, masking, payment-page scripts and
      test data.
    hints:
      - Think about where card data must never appear, where it must be masked, and what runs on the payment page.
      - What must be removed before go-live?
    modelAnswer: |
      1. Card fields are rendered by the PSP's hosted fields; no card data in requests to our servers. Evidence: Network
         panel during checkout.
      2. With the PSP script blocked, no fallback form sends card data. Evidence: Network log.
      3. Logs, analytics events and error reports after a full run contain no PAN-like values or verification codes.
         Evidence: search queries and results.
      4. Saved cards, receipts, emails and admin views show brand and last four only. Evidence: screenshots.
      5. Scripts loaded on the payment page match the approved inventory; adding an unapproved script in test triggers the
         change-detection alert. Evidence: inventory comparison, alert.
      6. No test accounts, test payment configuration or debug endpoints in the production configuration. Evidence: config
         review.
      7. Test data in the test environment is provider test data only; restored data is masked. Evidence: data check.
    rubric:
      - Checked that card data never reaches the merchant's servers
      - Checked for leaks in logs, events or error tracking
      - Checked masking wherever the card is shown
      - Checked payment-page scripts against an inventory and change detection
      - Checked removal of test accounts and configuration before go-live
      - Checked that only provider test data is used in test
    solution: |
      Compare with the model answer. Check 5 is the newest and most often missing - script attacks on payment pages are
      exactly what requirements 6.4.3 and 11.6.1 address.
    followUp: |
      Which of these checks would you automate in CI, and how?

  - id: order-scope-questions
    type: order
    concept: cde-scope
    skill: recall
    title: Deciding scope
    prompt: Put the questions in the order you would ask them to decide whether a system is in PCI DSS scope.
    items:
      - id: card-data
        text: Does it store, process or transmit card data?
      - id: connected
        text: Can it connect to the CDE or affect its security?
      - id: accidental
        text: Could card data reach it by accident - logs, tickets, test data?
      - id: decide
        text: Confirm the decision with the security team or assessor
    hints:
      - Start with the strongest reason to be in scope.
    solution: |
      Card data? → connected or security-impacting? → accidental leaks? → confirm with security. The last step matters:
      scope decisions belong to the security team and the assessor.

  - id: interview-pci
    type: interview
    concept: pci-dss-structure
    skill: application
    title: "Interview: what does PCI DSS mean for you as a tester?"
    prompt: |
      *"What is PCI DSS, and how does it affect the way you test payments?"* Answer as you would in the interview.
    hints:
      - One sentence on what it is and who owns it, then the practical habits.
    modelAnswer: |
      PCI DSS is the card industry's security standard from the PCI Security Standards Council - twelve requirements for
      any organisation that stores, processes or transmits card data, covering network security, protecting stored data,
      secure development, access control, logging, regular testing and policies. Merchants usually keep their scope small
      with the PSP's hosted fields and tokens, so card numbers never reach their systems.

      As a tester it changes my habits. I only use the provider's test data - never a real card in a test environment,
      because live PANs in pre-production would bring it into scope. I keep evidence clean: no card data, tokens or
      verification codes in screenshots, HAR files or tickets. I test for leaks - logs, analytics, error tracking,
      fallbacks when the hosted fields fail - and masking wherever cards are displayed. I check releases for test accounts
      and test configuration, and on the payment page I test that only approved scripts run and that tampering is detected.
      And I treat any exposure of card data as a security incident, not just a bug.
    rubric:
      - Described PCI DSS and its owner correctly
      - Explained scope reduction with hosted fields or tokens
      - Said only provider test data is used in test environments
      - Mentioned keeping evidence free of card data
      - Mentioned testing for leaks and masking
      - Mentioned payment-page scripts or removal of test data and accounts
      - Treated exposure as an incident
    followUps:
      - What is the difference between SAQ A and SAQ D?
      - Why are payment-page scripts a PCI concern?
      - What would you do if you found card numbers in a log?
    solution: |
      Interviewers want to hear that you know **what the standard is for** and that your **habits** protect card data.

  - id: explain-skimming
    type: short
    concept: pci-for-testers
    skill: recall
    title: Why payment-page scripts matter
    prompt: In two or three sentences, explain why PCI DSS v4.0 added requirements about scripts on payment pages.
    hints:
      - What can a malicious script on the checkout page read?
    modelAnswer: |
      A malicious or compromised script on a payment page can read what customers type and send it to an attacker - known
      as e-skimming - even if the card fields come from a provider. Requirement 6.4.3 makes the merchant authorise,
      inventory and assure the integrity of payment-page scripts, and 11.6.1 requires detecting unauthorised changes to the
      page so such attacks are noticed.
    rubric:
      - Described e-skimming by malicious scripts
      - Named authorising and inventorying scripts (6.4.3)
      - Named change or tamper detection (11.6.1)
    solution: |
      The January 2025 SAQ A update reflects the same risk through its new eligibility criterion about script attacks.

placement:
  - id: place-requirements
    type: mcq
    concept: pci-dss-structure
    skill: application
    title: Who must comply?
    prompt: To whom does PCI DSS apply?
    options:
      - id: all
        text: Any entity that stores, processes or transmits cardholder data or sensitive authentication data
        feedback: Correct - merchants, PSPs, processors and service providers alike.
      - id: banks
        text: Only banks that issue cards
        feedback: Issuers are covered, but so is everyone else who handles card data, including merchants.
      - id: large
        text: Only merchants above a certain sales volume
        feedback: Volume affects how compliance is validated (SAQ or ROC), not whether PCI DSS applies.
      - id: eu
        text: Only companies in the EU, because it is a European regulation
        feedback: PCI DSS is a global industry standard from the PCI SSC, not a regional law.
    correct: [all]
    solution: |
      **Everyone who stores, processes or transmits card data.** How they prove it depends on volume and channel.

  - id: place-scope
    type: mcq
    concept: cde-scope
    skill: application
    title: Scope reduction
    prompt: Which design keeps a merchant's own web servers out of the cardholder data environment most effectively?
    options:
      - id: hosted
        text: Card details are entered in the PSP's hosted fields or hosted payment page, and the merchant only receives a token
        feedback: Correct - card data never reaches the merchant's servers.
      - id: encrypt
        text: The merchant's servers receive card numbers but encrypt them immediately
        feedback: Receiving and encrypting still means processing card data - the servers stay in scope.
      - id: delete
        text: The merchant receives card numbers and deletes them after forwarding
        feedback: Transmitting card data is enough to be in scope, however briefly it is held.
      - id: https
        text: The merchant uses HTTPS on its checkout form
        feedback: HTTPS is required for transmission, but card data still reaches the merchant's servers.
    correct: [hosted]
    solution: |
      **Hosted fields or a hosted page.** The remaining responsibility moves to the page around them - and its scripts.

  - id: place-testing
    type: mcq
    concept: pci-for-testers
    skill: analysis
    title: Before the release goes live
    prompt: Which item in a release checklist reflects PCI DSS requirement 6.5.6?
    options:
      - id: test-data
        text: Test data and test accounts are removed from system components before the system goes into production
        feedback: Correct - that is requirement 6.5.6.
      - id: perf
        text: The checkout responds within two seconds
        feedback: Performance matters, but it isn't a PCI DSS requirement.
      - id: colours
        text: The payment page matches the brand guidelines
        feedback: Branding isn't a PCI DSS concern.
      - id: coverage
        text: Unit test coverage is above 80 %
        feedback: PCI DSS doesn't set code coverage thresholds.
    correct: [test-data]
    solution: |
      **Remove test data and accounts.** Test accounts with known passwords are a common way in for attackers.

recall:
  - id: recall-what
    concept: pci-dss-structure
    prompt: Who publishes PCI DSS, and what is the current version?
    answer: The PCI Security Standards Council; version 4.0.1, published June 2024.
  - id: recall-twelve
    concept: pci-dss-structure
    prompt: Name four of the twelve PCI DSS requirements.
    answer: For example - network security controls, secure configurations, protect stored account data, strong cryptography in transmission, anti-malware, secure software, need-to-know access, authentication, physical access, logging and monitoring, regular security testing, policies.
  - id: recall-cde
    concept: cde-scope
    prompt: What is the cardholder data environment?
    answer: The systems that store, process or transmit cardholder data or sensitive authentication data, plus systems connected to them or able to affect their security.
  - id: recall-saq
    concept: cde-scope
    prompt: What distinguishes SAQ A from SAQ D for an e-commerce merchant?
    answer: SAQ A fits merchants that fully outsource card data functions (hosted page or fields) and meet its eligibility criteria; SAQ D applies when the merchant itself stores, processes or transmits card data.
  - id: recall-655
    concept: pci-for-testers
    prompt: What does PCI DSS 6.5.5 say about test environments?
    answer: Live PANs aren't used in pre-production environments unless those environments are in the CDE and protected accordingly.
  - id: recall-incident
    concept: pci-for-testers
    prompt: What do you do if you find card numbers where they shouldn't be?
    answer: Treat it as a security incident - report it to the security team at once, don't copy the data further, and help remove the cause.

