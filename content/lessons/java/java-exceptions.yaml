id: java-exceptions
title: Exceptions and resource management
subject: java
module: java-oop
level: intermediate
status: published
estimatedMinutes: 50
summary: Checked versus unchecked exceptions, how to handle failures without hiding them, custom exceptions with causes, and try-with-resources for anything that must be closed.
tags: [java, exceptions, checked, unchecked, try-with-resources, autocloseable, suppressed, error handling, interview]

environment: |
  - **Language:** Java 17 or later. The rules come from **The Java Language Specification**: checked
    exceptions in chapter 11 (11.1.1 and 11.2), `try` statements in section 14.20, and try-with-resources
    in 14.20.3. Try-with-resources and multi-catch arrived in Java 7; using an existing effectively final
    variable as a resource (`try (source; sink)`) in Java 9.
  - **Sources:** the Javadoc of `Throwable` (causes, `addSuppressed`, `getSuppressed`) and
    `AutoCloseable`.
  - **Practice project:** `practice/java` - JDK 17+, Maven 3.8+, JUnit 6.
  - **Examples:** SandPay and its gateway are fictional.

prerequisites:
  - java-oop-pillars

concepts:
  - id: checked-unchecked
    name: Checked and unchecked exceptions
    summary: Checked exceptions must be caught or declared - for conditions callers are expected to handle; unchecked exceptions (RuntimeException, Error) signal programming errors and serious failures.
  - id: exception-handling-practice
    name: Handling exceptions well
    summary: Catch only what you can handle, add context, keep the cause, never swallow - and let programming errors through.
  - id: resource-management
    name: Resource management
    summary: try-with-resources closes AutoCloseable resources in reverse order whatever happens, and attaches close failures to the original exception as suppressed.

objectives:
  - Classify exceptions as checked or unchecked and choose the right kind for a new failure.
  - Handle a failure by translating it with context and its cause, without swallowing or over-catching.
  - Use try-with-resources so resources close in every case, and explain suppressed exceptions.
  - Read a stack trace with causes and suppressed exceptions to find the original failure.

sections:
  - id: intuition
    kind: intuition
    concepts: [exception-handling-practice, checked-unchecked]
    title: The idea in plain language
    body: |
      An exception is a **report that something went wrong**, handed up the chain until someone can deal
      with it.

      - A **checked** exception is a problem the caller should plan for, like "the bank didn't answer" -
        Java makes the caller decide: handle it or pass it on (`throws`).
      - An **unchecked** exception is a bug or misuse, like "you asked for a refund of minus five euros" -
        the fix is to change the code, not to handle the report.

      A good report says **what** failed, **for which payment**, and attaches the **original note** from
      whoever noticed first (the cause). A bad one says "error" - or worse, is thrown in the bin
      (swallowed), and the payment silently stays in limbo.

  - id: what
    kind: what
    concepts: [checked-unchecked]
    title: What the exception types are
    body: |
      | Type | Checked? | Means | Examples |
      |---|---|---|---|
      | `Exception` (not `RuntimeException`) | **checked** | a condition callers should expect and handle | `IOException`, `SocketTimeoutException`, `InterruptedException`, `SQLException` |
      | `RuntimeException` | unchecked | a programming error or broken precondition | `IllegalArgumentException`, `IllegalStateException`, `NullPointerException`, `NumberFormatException` |
      | `Error` | unchecked | serious problems an application normally can't recover from | `OutOfMemoryError`, `StackOverflowError` |

      **Checked** means the compiler checks it: a method that can throw one must catch it or declare it
      with `throws`.

      Useful parts of `Throwable`:

      - `getMessage()`, `getCause()` - the message and the exception that caused this one;
      - `getSuppressed()` - exceptions that happened while cleaning up (closing resources) after this one;
      - the stack trace, printed with every cause (`Caused by:`) and suppressed exception (`Suppressed:`).

  - id: why
    kind: why
    concepts: [exception-handling-practice, resource-management]
    title: Why error handling decides how debuggable a system is
    body: |
      - **Swallowed exceptions hide failures.** A helper that catches everything and returns `null` turns
        a timeout into a `NullPointerException` three classes later - or into a test that passes when it
        shouldn't.
      - **Missing causes hide root causes.** "Payment failed" without the underlying `SocketTimeoutException`
        sends you to the wrong team.
      - **Unclosed resources leak.** Browsers, files, connections and HTTP responses that aren't closed
        after a failure pile up until CI agents run out of memory, file handles or ports.
      - **In payments, a lost failure is a money problem:** a timeout means the outcome is *unknown*, and
        the caller must check before retrying ([declines, timeouts and unknown outcomes](#/lesson/declines-timeouts-unknown-outcomes)).

  - id: internals
    kind: internals
    concepts: [checked-unchecked, resource-management]
    title: How exceptions and try-with-resources work
    body: |
      **Propagation.** `throw` ends the current method. The JVM unwinds the call stack until a `catch`
      clause whose type matches (the first matching clause, in order). `finally` blocks run on the way out,
      whether or not an exception was thrown.

      **A `return` in `finally` wins** - it replaces a pending exception, which is then lost. Never return
      from `finally`.

      **try-with-resources:**

      ```java
      try (Source source = open(); Sink sink = create()) {
          // body
      }
      ```

      1. Resources are initialised left to right.
      2. The body runs.
      3. Resources are closed in **reverse order** (`sink`, then `source`) - whether the body completed
         or threw.
      4. If the body threw, and a `close()` also throws, the close's exception is **added as suppressed**
         to the body's exception, which is the one that propagates.
      5. If only a `close()` throws, that exception propagates - and the remaining resources are still
         closed.

      Any class that implements `AutoCloseable` (or `Closeable`) can be a resource - streams, readers,
      JDBC connections, HTTP clients' responses, your own classes.

  - id: visual
    kind: visual
    concepts: [checked-unchecked]
    title: "Diagram: the exception hierarchy"
    body: |
      ```mermaid
      flowchart TD
          T["Throwable"] --> E["Error - unchecked"]
          T --> X["Exception - checked"]
          E --> OOM["OutOfMemoryError"]
          X --> IO["IOException - checked"]
          X --> IE["InterruptedException - checked"]
          X --> R["RuntimeException - unchecked"]
          IO --> STE["SocketTimeoutException and other IOExceptions"]
          R --> IAE["IllegalArgumentException"]
          R --> ISE["IllegalStateException"]
          R --> NPE["NullPointerException"]
          IAE --> NFE["NumberFormatException"]
      ```

      Everything under `RuntimeException` and `Error` is unchecked; every other `Exception` is checked.
      `NumberFormatException` is an `IllegalArgumentException` - catching the parent catches it too.

  - id: when
    kind: when
    concepts: [checked-unchecked, exception-handling-practice]
    title: Which exception, and when to catch
    body: |
      **Throwing:**

      | Situation | Throw |
      |---|---|
      | the caller passed a bad argument (negative amount, null id) | `IllegalArgumentException` (or `NullPointerException` via `Objects.requireNonNull`) |
      | the object is in the wrong state for the call (refund before capture) | `IllegalStateException` |
      | an external failure the caller should handle (network, provider down) | a **checked** exception - an existing one (`IOException`) or your own with a cause |
      | an external failure nobody near can handle | an unchecked exception with context and the cause |

      **Catching:** catch an exception only where you can do something useful with it - retry, use a
      fallback, translate it into the caller's terms with context, or report it at the top level (a test
      failure, an HTTP 500). Otherwise let it propagate.

  - id: example
    kind: example
    concepts: [exception-handling-practice]
    title: "Real-world example: the null that came from a timeout"
    body: |
      A test helper fetched payments from the SandPay sandbox:

      ```java
      try { return client.getPayment(id); }
      catch (Exception e) { return null; }
      ```

      Tests failed with `NullPointerException` at `payment.status()`, in a different class. The team
      suspected the test data for a week. The real failure - `SocketTimeoutException: Read timed out` from a
      slow sandbox - was swallowed in the helper.

      **Evidence that finally pinned it:** adding `e` to a log line in the catch block showed the timeouts,
      all between 02:00 and 02:30, when the sandbox ran its nightly maintenance.

      **Fix:** the helper declares `throws PaymentLookupException` (checked), wrapping only the
      `IOException` with the payment id and the cause. Programming errors propagate unchanged. The next
      failure message read `Could not fetch payment pay_81Fz ... Caused by: SocketTimeoutException` - and
      the night-time runs were moved.

  - id: code
    kind: code
    concepts: [exception-handling-practice, resource-management, checked-unchecked]
    title: "Code: translate, keep the cause, close everything"
    collapsed: true
    body: |
      ```java
      public class PaymentFailedException extends Exception {          // checked
          public PaymentFailedException(String message, Throwable cause) {
              super(message, cause);
          }
      }

      public static String submit(Gateway gateway, String paymentId) throws PaymentFailedException {
          try {
              return gateway.send(paymentId);
          } catch (IOException e) {                                    // only what we can handle
              throw new PaymentFailedException(
                  "Could not submit payment " + paymentId + " - outcome unknown", e);   // context + cause
          }
          // RuntimeExceptions from the gateway propagate unchanged
      }

      public static int copy(Source source, Sink sink) throws IOException {
          try (source; sink) {                                         // closed sink-then-source, always
              int count = 0;
              for (String line; (line = source.read()) != null; count++) sink.write(line);
              return count;
          }
      }

      // Interrupted while waiting: restore the flag so callers can see it
      try {
          Thread.sleep(500);
      } catch (InterruptedException e) {
          Thread.currentThread().interrupt();
          throw new IllegalStateException("Interrupted while waiting for settlement", e);
      }
      ```

  - id: tests
    kind: tests
    concepts: [exception-handling-practice, resource-management]
    title: Testing failure paths
    body: |
      | ID | Test | Expect |
      |---|---|---|
      | X1 | the dependency throws the expected failure (a fake that throws `IOException`) | your exception type, a message with context, `getCause()` is the original |
      | X2 | the dependency throws a programming error (`IllegalStateException`) | it propagates unchanged |
      | X3 | invalid arguments | `IllegalArgumentException`, and no state changed |
      | R1 | the body fails | every resource closed |
      | R2 | the body and a `close()` fail | the body's exception propagates; the close's is in `getSuppressed()` |
      | R3 | only `close()` fails | that exception propagates; other resources still closed |

      Fakes that throw on demand - a lambda for a single-method interface - make all of these quick to write.
      JUnit's `assertThrows` returns the exception, so you can check its message, cause and suppressed
      exceptions.

  - id: mistakes
    kind: mistakes
    concepts: [exception-handling-practice, resource-management, checked-unchecked]
    title: Common mistakes and how to read stack traces
    body: |
      - **Swallowing:** `catch (Exception e) {}`, or returning `null` or a default value.
      - **Catching too broadly:** `catch (Exception e)` also catches the `NullPointerException` from your
        own bug and disguises it.
      - **Losing the cause:** `throw new MyException(e.getMessage())` - pass `e` as the cause.
      - **Log and rethrow:** the same failure appears in the log twice or more; either handle it (and log)
        or rethrow it (and let the handler log).
      - **`return` in `finally`:** silently discards the exception.
      - **Closing in the `try` block** instead of try-with-resources - skipped as soon as something fails.
      - **Swallowing `InterruptedException`** - restore the interrupt flag.
      - **Checked exceptions for programming errors** - every caller is forced to "handle" a bug.

      **Reading a stack trace:** start at the top line (what was thrown, with its message), find the first
      line from *your* code, then read every `Caused by:` - the **last** cause is usually where it started.
      `Suppressed:` blocks are cleanup failures that happened afterwards.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [checked-unchecked]
    title: "Trade-offs: checked or unchecked?"
    body: |
      | | Checked | Unchecked |
      |---|---|---|
      | Strength | the compiler makes callers face the failure | no noise for callers who can't do anything anyway |
      | Cost | `throws` clauses spread up the call chain; awkward in lambdas and streams (`Function` can't throw them) | failures can be forgotten until run time |
      | Typical use | recoverable external conditions close to where they can be handled | programming errors; failures handled far away (at the test or request boundary) |

      Many modern libraries throw unchecked exceptions only (Selenium's `WebDriverException` is a
      `RuntimeException`, for example). The JDK's I/O uses checked ones. Within one codebase, pick a rule
      and keep it.

  - id: summary
    kind: summary
    title: Summary and quick reference
    body: |
      - Checked = `Exception` but not `RuntimeException`: catch or declare. Unchecked = `RuntimeException` and
        `Error`.
      - Bad arguments → `IllegalArgumentException`; wrong state → `IllegalStateException`.
      - Catch only what you can handle; translate with **context and the cause**; let bugs propagate.
      - Never swallow, never `return` in `finally`, restore the flag on `InterruptedException`.
      - try-with-resources: closes in reverse order, always; close failures become **suppressed**.
      - Stack traces: top line, first line of your code, then the last `Caused by:`.

exercises:
  - id: checked-or-not
    type: mcq
    concept: checked-unchecked
    skill: recognition
    title: Which are checked?
    prompt: |
      Which of these exceptions are **checked**? Select every one that applies.
    options:
      - id: io
        text: "`IOException`"
        feedback: Checked - it extends Exception, not RuntimeException.
      - id: interrupted
        text: "`InterruptedException`"
        feedback: Checked - which is why Thread.sleep forces you to handle it.
      - id: illegal-argument
        text: "`IllegalArgumentException`"
        feedback: Unchecked - a RuntimeException for bad arguments, a programming error.
      - id: number-format
        text: "`NumberFormatException`"
        feedback: Unchecked - it extends IllegalArgumentException, a RuntimeException.
      - id: npe
        text: "`NullPointerException`"
        feedback: Unchecked - a RuntimeException.
    correct: [io, interrupted]
    hints:
      - Is it a RuntimeException (or an Error)? Then it is unchecked.
    solution: |
      **`IOException` and `InterruptedException`.** The others are `RuntimeException`s. Note that
      `Integer.parseInt` throws the unchecked `NumberFormatException` - nothing forces you to handle bad
      numbers in test data.
    followUp: |
      `Thread.sleep` throws `InterruptedException`. Why did the Java designers make it checked?

  - id: swallowed-failure
    type: debug
    concept: exception-handling-practice
    skill: analysis
    title: The helper that hides failures
    prompt: |
      Tests using this helper fail with `NullPointerException` in other classes, and nobody can tell why.
      Click every line that contributes to hiding the real failure.
    language: java
    code: |
      public Payment fetch(String id) {
          try {
              return client.getPayment(id);
          } catch (Exception e) {
              log.warn("could not fetch payment");
              return null;
          }
      }
    correctLines: [4, 5, 6]
    lineNotes:
      - line: 3
        note: Calling the client is the work itself; the problem is what happens when it fails.
      - line: 1
        note: The signature is fine as such - though once the method stops returning null, it may need a throws clause.
    hints:
      - What does the catch clause catch - only network failures?
      - What does the log line keep about the failure, and what does the caller receive?
    solution: |
      **Lines 4, 5 and 6.**

      - **4** - `catch (Exception e)` also catches programming errors and disguises them.
      - **5** - the log line has neither the payment id nor the exception, so the stack trace and its cause
        are lost.
      - **6** - returning `null` moves the failure elsewhere: a `NullPointerException` far from the cause.

      Fix: catch only `IOException`, throw a domain exception with the id and the cause, and let everything
      else propagate.
    followUp: |
      Rewrite the method. If the caller is a test, what should a fetch failure look like in the test report?

  - id: submit-payment
    type: coding
    concept: exception-handling-practice
    skill: application
    title: Report a failed payment properly
    prompt: |
      Fix `PaymentSubmitter.submit` and `PaymentFailedException`: a network failure (`IOException`) must
      become a `PaymentFailedException` whose message names the payment and whose cause is the original
      exception. Programming errors from the gateway (any `RuntimeException`) must pass through unchanged.
      Nothing may be swallowed.
    project: java
    files:
      - src/exercises/java/learnerapp/exceptions/PaymentSubmitter.java
      - src/exercises/java/learnerapp/exceptions/PaymentFailedException.java
    test: src/test/java/learnerapp/exceptions/PaymentSubmitterTest.java
    command: mvn test -Dtest=PaymentSubmitterTest
    hints:
      - Which exception type should the catch clause name - Exception, or something narrower?
      - "`PaymentFailedException` needs a constructor that takes a cause: `super(message, cause)`."
    modelAnswer: |
      ```java
      public PaymentFailedException(String message, Throwable cause) {
          super(message, cause);
      }

      public static String submit(Gateway gateway, String paymentId) throws PaymentFailedException {
          try {
              return gateway.send(paymentId);
          } catch (IOException e) {
              throw new PaymentFailedException(
                  "Could not submit payment " + paymentId + " - outcome unknown, check it before retrying", e);
          }
      }
      ```
    rubric:
      - Every test in PaymentSubmitterTest passes
      - Only IOException is caught; RuntimeExceptions propagate unchanged
      - The new exception's message names the payment and its cause is the original exception
      - Nothing is printed and swallowed, and null is never returned for a failure
    solution: |
      The tests use lambdas as fake gateways that throw on demand - one `IOException`, one
      `IllegalStateException` - and check the type, the message, the cause and that bugs are not wrapped.
      Reference: `src/solutions/java/learnerapp/exceptions/`.
    followUp: |
      Callers of `submit` will want to retry some failures. Which information would you add to
      `PaymentFailedException` so they can decide, and how would you test it?

  - id: close-everything
    type: coding
    concept: resource-management
    skill: application
    title: Close both, whatever happens
    prompt: |
      `Transfers.copy` copies lines from a `Source` to a `Sink` and must always close both - the sink first,
      then the source - even when reading, writing or closing fails. When the copy fails and closing fails
      too, the copy's exception must be the one thrown, with the closing failure attached as suppressed.
      Make the tests pass.
    project: java
    files:
      - src/exercises/java/learnerapp/exceptions/Transfers.java
    test: src/test/java/learnerapp/exceptions/TransfersTest.java
    command: mvn test -Dtest=TransfersTest
    hints:
      - Both Source and Sink are AutoCloseable.
      - Since Java 9 you can list existing variables in a try-with-resources header - in which order are they closed?
    modelAnswer: |
      ```java
      public static int copy(Source source, Sink sink) throws IOException {
          try (source; sink) {          // closed in reverse order: sink, then source
              int count = 0;
              String line;
              while ((line = source.read()) != null) {
                  sink.write(line);
                  count++;
              }
              return count;
          }
      }
      ```

      Writing the same behaviour by hand needs nested `try`/`finally` blocks and explicit `addSuppressed`
      calls - exactly what try-with-resources generates for you.
    rubric:
      - Every test in TransfersTest passes
      - Uses try-with-resources instead of manual close calls
      - Explained why the sink is closed before the source
      - Explained what a suppressed exception is
    solution: |
      The fake source and sink record every event, so the tests can check the order of closing, that both
      close after every kind of failure, and which exception wins. Reference:
      `src/solutions/java/learnerapp/exceptions/Transfers.java`.
    followUp: |
      A Selenium test opens a WebDriver. `WebDriver` isn't `AutoCloseable`. How would you guarantee
      `quit()` is called after a failure - in a plain method, and in a JUnit extension?

  - id: twr-sequence
    type: order
    concept: resource-management
    skill: recall
    title: Inside try-with-resources
    prompt: |
      `try (Source a = ...; Sink b = ...) { ... }` - the body throws X, and `b.close()` throws Y. Put the
      events in order.
    items:
      - id: open-a
        text: Resource a is initialised
      - id: open-b
        text: Resource b is initialised
      - id: body
        text: The body runs and throws X
      - id: close-b
        text: b is closed first, and its exception Y is added to X as suppressed
      - id: close-a
        text: a is closed
      - id: propagate
        text: X propagates to the caller, carrying Y in getSuppressed()
    hints:
      - Closing happens in the reverse order of opening.
    solution: |
      **Open a → open b → body throws → close b (Y suppressed into X) → close a → X propagates.** The
      exception that explains the failure (X) wins; the cleanup failure isn't lost.
    followUp: |
      What would propagate if the body completed normally and `b.close()` threw Y? Would `a` still be
      closed?

  - id: finally-return
    type: mcq
    concept: exception-handling-practice
    skill: analysis
    title: The status that hid an outage
    prompt: |
      ```java
      static String status() {
          try {
              throw new IllegalStateException("gateway down");
          } finally {
              return "UNKNOWN";
          }
      }
      ```

      What does calling `status()` do?
    options:
      - id: returns-unknown
        text: Returns "UNKNOWN" - the exception is discarded
        feedback: Correct - a return in finally replaces the pending exception, which is lost without a trace.
      - id: throws
        text: Throws IllegalStateException("gateway down")
        feedback: That would happen without the return in finally. The return completes the method normally and the exception is dropped.
      - id: both
        text: Returns "UNKNOWN" and prints the exception
        feedback: Nothing prints it - the exception simply disappears.
      - id: compile
        text: It doesn't compile
        feedback: It compiles (IDEs warn about it). That's what makes it dangerous.
    correct: [returns-unknown]
    hints:
      - Which completes the method - the throw, or the return that runs after it?
    solution: |
      **It returns "UNKNOWN".** A `return` (or a `throw`) in `finally` overrides how the `try` ended. Keep
      `finally` for cleanup - and prefer try-with-resources even for that.
    followUp: |
      Rewrite the method so a gateway outage is reported, and an UNKNOWN status is returned only when the
      gateway really says so.

  - id: which-exception
    type: mcq
    concept: checked-unchecked
    skill: application
    title: A negative refund amount
    prompt: |
      `CapturedPayment.refund(long amountMinor)` is called with -500. Which exception should it throw?
    options:
      - id: iae
        text: "`IllegalArgumentException`"
        feedback: Correct - the caller passed an invalid argument; that is a programming error, so unchecked.
      - id: checked-custom
        text: A new checked `InvalidRefundException`
        feedback: That forces every caller to catch a mistake they should simply not make. Checked exceptions are for conditions callers can recover from.
      - id: io
        text: "`IOException`"
        feedback: Nothing here involves input/output - the type would mislead whoever reads the stack trace.
      - id: runtime
        text: "`RuntimeException(\"bad amount\")`"
        feedback: Unchecked is right, but the generic type says nothing; IllegalArgumentException tells the reader exactly what kind of mistake it was.
    correct: [iae]
    hints:
      - Whose mistake is a negative amount - the caller's, or the outside world's?
    solution: |
      **`IllegalArgumentException`**, with a message that includes the value. Use the most specific
      standard exception that fits; create your own types for failures callers will want to tell apart.
    followUp: |
      `refund` is called before the payment was captured. Which exception fits now, and why is it a
      different one?

  - id: interview-checked-unchecked
    type: interview
    concept: checked-unchecked
    skill: application
    title: "Interview: checked or unchecked?"
    prompt: |
      **Interviewer:** "What's the difference between checked and unchecked exceptions? When do you use
      each - and how do you handle exceptions in a test framework?"
    hints:
      - Definition, when to use which, then concrete framework practice.
    modelAnswer: |
      - Checked exceptions (subclasses of Exception but not RuntimeException) must be caught or declared;
        unchecked ones (RuntimeException, Error) need not be.
      - Checked for recoverable external conditions the caller should handle (I/O, a provider timeout);
        unchecked for programming errors and broken preconditions (IllegalArgumentException,
        IllegalStateException).
      - In a framework: don't catch in tests unless the test is about the failure - let exceptions fail the
        test with their full stack trace. In helpers, catch only what you can translate, add context (ids,
        URLs) and keep the cause.
      - Always close resources with try-with-resources (or quit drivers in a finally / extension); never
        swallow; restore the interrupt flag.
    followUps:
      - Why can't you throw a checked exception from inside a stream's map?
      - What is a suppressed exception?
      - How do you test that a method throws the right exception with the right cause?
    rubric:
      - Defined checked and unchecked correctly
      - Gave a sound rule for when to use each
      - Said tests should let unexpected exceptions fail the test rather than catching them
      - Mentioned keeping the cause and adding context when translating
      - Mentioned closing resources reliably
    solution: |
      Strong answers go beyond the definition to **practice**: what the framework does with failures and
      how evidence is kept.

recall:
  - id: recall-checked
    concept: checked-unchecked
    prompt: Which exceptions are checked?
    answer: Exception and its subclasses, except RuntimeException and its subclasses. Error is unchecked too.
  - id: recall-iae-ise
    concept: checked-unchecked
    prompt: IllegalArgumentException or IllegalStateException - which for what?
    answer: IllegalArgumentException when the caller passed a bad argument; IllegalStateException when the object is in the wrong state for the call.
  - id: recall-translate
    concept: exception-handling-practice
    prompt: What should a catch block that translates an exception always do?
    answer: Throw an exception that adds context (ids, what was attempted) and passes the original as the cause.
  - id: recall-swallow
    concept: exception-handling-practice
    prompt: Name three ways an exception gets lost.
    answer: An empty catch, returning null or a default from a catch, and a return in finally. (Also wrapping without the cause.)
  - id: recall-twr-order
    concept: resource-management
    prompt: In which order does try-with-resources close its resources?
    answer: In reverse order of initialisation - the last opened is closed first - whether or not the body threw.
  - id: recall-suppressed
    concept: resource-management
    prompt: What is a suppressed exception?
    answer: An exception thrown while closing a resource after the body had already thrown. It is attached to the body's exception (getSuppressed) instead of replacing it.

