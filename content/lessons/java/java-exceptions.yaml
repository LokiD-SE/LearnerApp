placement:
  - id: place-checked
    type: mcq
    concept: checked-unchecked
    skill: application
    title: Must it be caught?
    prompt: |
      A method calls `Files.readString(path)`, which declares `throws IOException`. What must the method do?
    options:
      - id: catch-or-declare
        text: Catch the IOException or declare throws IOException (or a supertype)
        feedback: Correct - IOException is checked, so the compiler insists.
      - id: nothing
        text: Nothing - exceptions are handled by the JVM
        feedback: That's true for unchecked exceptions only; for a checked one the code doesn't compile.
      - id: catch-only
        text: It must catch it; declaring isn't allowed for I/O
        feedback: Declaring it with throws is equally valid - the caller then has to handle it.
      - id: runtime
        text: Wrap the call in a RuntimeException constructor
        feedback: That is one way to handle it inside a catch, but it isn't required, and wrapping without a reason hides the failure type.
    correct: [catch-or-declare]
    solution: |
      **Catch it or declare it.** That is what "checked" means.

  - id: place-cause
    type: mcq
    concept: exception-handling-practice
    skill: application
    title: Translating a failure
    prompt: |
      Inside `catch (IOException e)`, which line translates the failure best?
    options:
      - id: with-cause
        text: "`throw new PaymentFailedException(\"Could not submit \" + paymentId, e);`"
        feedback: Correct - context in the message, and the original exception as the cause.
      - id: message-only
        text: "`throw new PaymentFailedException(e.getMessage());`"
        feedback: The original exception's type and stack trace are lost - only its message survives.
      - id: print
        text: "`e.printStackTrace(); return null;`"
        feedback: The caller receives null and has no idea a failure happened.
      - id: generic
        text: "`throw new RuntimeException(e);`"
        feedback: The cause is kept, but no context is added and the caller can't tell this failure apart from any other.
    correct: [with-cause]
    solution: |
      **Context plus cause.** The stack trace then reads "Could not submit pay_81Fz ... Caused by:
      SocketTimeoutException".

  - id: place-close
    type: mcq
    concept: resource-management
    skill: application
    title: Closing after a failure
    prompt: |
      `try (Connection c = open()) { c.send(request); }` - `send` throws, then `c.close()` throws too. What
      reaches the caller?
    options:
      - id: send-with-suppressed
        text: The exception from send, with the close exception in getSuppressed()
        feedback: Correct - the body's exception wins; the cleanup failure is attached, not lost.
      - id: close-only
        text: The exception from close
        feedback: That's what a hand-written finally block often does - and try-with-resources exists to prevent it.
      - id: both-separately
        text: Both, one after the other
        feedback: A method can throw only one exception; the second is attached to the first.
      - id: neither
        text: Nothing - try-with-resources swallows close failures
        feedback: Nothing is swallowed; close failures are either thrown or attached as suppressed.
    correct: [send-with-suppressed]
    solution: |
      **send's exception, with close's exception suppressed in it.**
