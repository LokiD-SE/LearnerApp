id: java-equals-hashcode
title: equals, hashCode and why HashMap needs both
subject: java
module: java-collections-generics
level: intermediate
status: published
estimatedMinutes: 55
summary: The equals and hashCode contract, the classic bugs that make HashMap and HashSet lose or duplicate entries, and how to test both.
tags: [java, equals, hashcode, hashmap, hashset, records, value objects, collections, contract, interview]

environment: |
  - **Language:** Java 17 or later. The contract is the Javadoc of `java.lang.Object` - the methods
    `equals(Object)` and `hashCode()`. Records (Java 16+, JEP 395) and pattern matching for `instanceof`
    (Java 16+) are used in examples.
  - **Implementation details:** how `HashMap` arranges entries internally (buckets, resizing, tree bins)
    describes OpenJDK and is given for intuition. Code may rely only on the documented contract.
  - **Practice project:** `practice/java` in the LearnerApp repository - JDK 17+, Maven 3.8+, JUnit 6.
  - **Examples:** SandPay ids and amounts are fictional.

prerequisites:
  - java-types-and-variables

concepts:
  - id: equals-contract
    name: The equals contract
    summary: equals must be reflexive, symmetric, transitive, consistent and false for null, and should compare exactly the fields that define what the object is.
  - id: hashcode-contract
    name: hashCode and hash-based collections
    summary: Equal objects must have equal hash codes. HashMap and HashSet find entries by hash code first, so a missing or changing hash code loses entries.

objectives:
  - State the equals and hashCode contract and explain what breaks when each rule is violated.
  - Implement equals and hashCode for a value object and for an entity, and justify which fields each uses.
  - Explain how HashMap uses hashCode and equals to find an entry, and predict lookups with broken keys.
  - Design tests that verify an equals and hashCode implementation.

sections:
  - id: intuition
    kind: intuition
    concepts: [hashcode-contract, equals-contract]
    title: The idea in plain language
    body: |
      Picture a library that shelves books by a number computed from the title - the **hash code**. To
      find a book, the librarian computes the number, walks to that one shelf, and compares the books there
      with the one you asked for - that comparison is **equals**.

      Two things go wrong:

      - **Two copies of the same book get different shelf numbers** (equal objects, different hash codes).
        The librarian searches one shelf and never sees the copy on the other. Your `HashSet` holds
        "duplicates" and your `HashMap` returns `null` for a key that is "there".
      - **Someone changes a book's title after it was shelved** (a key whose hash code changes). It now
        sits on the wrong shelf for its new number, and nobody finds it again.

      `equals` decides *what counts as the same*. `hashCode` must agree with it, so that "the same" things
      always land on the same shelf.

  - id: what
    kind: what
    concepts: [equals-contract, hashcode-contract]
    title: What the contract says
    body: |
      From the Javadoc of `java.lang.Object`. For non-null references `x`, `y` and `z`, **`equals`** must
      be:

      | Rule | Meaning |
      |---|---|
      | reflexive | `x.equals(x)` is true |
      | symmetric | `x.equals(y)` is true exactly when `y.equals(x)` is true |
      | transitive | if `x.equals(y)` and `y.equals(z)`, then `x.equals(z)` |
      | consistent | repeated calls give the same answer while the compared information doesn't change |
      | null | `x.equals(null)` is false |

      **`hashCode`** must:

      - return the same value on repeated calls during one run, while the information used by `equals`
        doesn't change;
      - return **equal values for objects that are equal** by `equals`;
      - and it **may** return equal values for unequal objects (a *collision*). That is allowed, but many
        collisions make hash-based collections slow.

      **Defaults.** `Object.equals` is identity (`==`). `Object.hashCode` is typically derived from the
      object's identity. A class that overrides neither treats every object as different from every other
      - which is right for some classes (a WebDriver session) and wrong for values (an amount, an id).

  - id: why
    kind: why
    concepts: [hashcode-contract, equals-contract]
    title: Why testers meet this constantly
    body: |
      Test frameworks are full of hash-based collections and equality checks:

      - `assertEquals(expected, actual)` calls `equals`. Without it, two `Money` objects for 19.99 EUR
        "differ", and the failure message is baffling: both sides print the same text.
      - `assertEquals(Set.of(...), actualSet)` and `List.contains` rely on the elements' `equals` (and the
        set on their `hashCode`).
      - Evidence, retries and test data are kept in `HashMap`s keyed by payment, order or user objects -
        a broken key silently loses entries or stores the same thing twice.
      - Deduplicating test data with a `HashSet` does nothing if the class doesn't define `equals` and
        `hashCode`.

      These bugs don't throw. They produce wrong counts and missing lookups - the kind of failure that
      looks random until you know the contract.

  - id: internals
    kind: internals
    concepts: [hashcode-contract]
    title: How HashMap finds an entry
    body: |
      `HashMap` keeps an array of **buckets**. In OpenJDK, `get(key)` works like this:

      1. Call `key.hashCode()` and mix its high bits into the low bits.
      2. Pick the bucket: the mixed hash modulo the table size (a power of two, so a bit mask).
      3. Walk the entries in that bucket. For each one, compare the stored hash first, then check
         `stored == key || key.equals(stored)`.
      4. Return the first match's value, or `null` when the bucket has none.

      `put` does the same search and replaces the value if it finds the key, or adds an entry. When the
      map grows past its capacity times the **load factor** (0.75 by default, documented in the Javadoc),
      it doubles the table and redistributes the entries. Since Java 8, OpenJDK turns a bucket with many
      entries into a balanced tree - a defence against collisions, not something to rely on.

      **Consequences:**

      - Equal keys with different hash codes are usually looked for in the **wrong bucket**, so `equals`
        is never even called.
      - A key whose hash code changes after `put` sits in the bucket of its *old* hash code.
      - `HashSet` is a `HashMap` underneath (its Javadoc says so), so all of this applies to sets.

  - id: visual
    kind: visual
    concepts: [hashcode-contract]
    title: "Flowchart: HashMap.get(key)"
    body: |
      ```mermaid
      flowchart TD
          A["get(key)"] --> B["h = key.hashCode(), mixed"]
          B --> C["bucket = h masked by table size"]
          C --> D{"Any entry left in this bucket?"}
          D -- No --> N["return null"]
          D -- Yes --> E{"Same hash and (same object or key.equals(entry key))?"}
          E -- Yes --> V["return the entry's value"]
          E -- No --> D
      ```

      Notice that **`equals` is only reached inside one bucket**. If two equal keys produce different hash
      codes, the search usually happens in a bucket that doesn't contain the other key, and `equals` never
      gets a chance to say "these are the same".

  - id: steps
    kind: steps
    concepts: [equals-contract, hashcode-contract]
    title: Writing equals and hashCode, step by step
    body: |
      1. **Decide what "the same" means.** A *value object* (an amount, a currency code, an address) is
         equal when all its value fields are equal. An *entity* (a payment, a customer) is the same thing
         over time - compare its **immutable id**, not its changing state.
      2. **Make those fields final** if you can. Equality on mutable fields is a trap for hash-based
         collections.
      3. **`equals`:** return true for `this == other`; return false unless `other` is the right type;
         then compare the chosen fields - primitives with `==` (`Double.compare` for floating point),
         objects with `equals` or `Objects.equals` when they may be null.
      4. **`hashCode`:** combine **the same fields** - `Objects.hash(a, b)`, or `31 * h + field.hashCode()`
         by hand. Using fewer fields than `equals` is legal but causes collisions; using a field that
         `equals` ignores breaks the contract.
      5. **Annotate both with `@Override`**, so the compiler catches a wrong signature.
      6. **Test the contract** (see "Tests" below) - or let a library check it for you.
      7. **Or use a record.** `record Money(long minorUnits, String currency) {}` generates `equals`,
         `hashCode` and `toString` from its components.

  - id: example
    kind: example
    concepts: [hashcode-contract]
    title: "Real-world example: evidence that disappeared"
    body: |
      A payments test framework collects evidence per payment:

      ```java
      Map<Payment, List<String>> evidence = new HashMap<>();
      evidence.computeIfAbsent(payment, p -> new ArrayList<>()).add("request sent");
      payment.setStatus("SUCCEEDED");              // the webhook arrived
      evidence.get(payment);                        // null - where did it go?
      ```

      `Payment.equals` and `hashCode` included the **status**. The entry was filed under the hash code of
      `pay_81Fz (PENDING)`. After the status changed, `get` computed a different hash code, searched another
      bucket and found nothing. The next `computeIfAbsent` created a *second* entry for the same payment,
      and the report showed two half-empty evidence lists.

      **How it was confirmed:** printing `payment.hashCode()` before and after `setStatus` showed two
      different numbers, and `evidence.size()` was 2 for one payment. **Fix:** a payment *is* its id -
      `equals` and `hashCode` use only the immutable `id`. You fix exactly this in the coding exercise.

  - id: code
    kind: code
    concepts: [equals-contract, hashcode-contract]
    title: "Code: a value object, by hand and as a record"
    collapsed: true
    body: |
      ```java
      public final class Money {
          private final long minorUnits;
          private final String currency;

          public Money(long minorUnits, String currency) {
              this.minorUnits = minorUnits;
              this.currency = Objects.requireNonNull(currency);
          }

          @Override
          public boolean equals(Object other) {
              if (this == other) return true;
              if (!(other instanceof Money that)) return false;
              return minorUnits == that.minorUnits && currency.equals(that.currency);
          }

          @Override
          public int hashCode() {
              return Objects.hash(minorUnits, currency);
          }
      }
      ```

      The same value object as a record (Java 16+):

      ```java
      public record Money(long minorUnits, String currency) {
          public Money {
              Objects.requireNonNull(currency);
          }
      }
      ```

      An entity compares only its identity:

      ```java
      @Override
      public boolean equals(Object other) {
          return this == other || (other instanceof Payment that && id.equals(that.id));
      }

      @Override
      public int hashCode() {
          return id.hashCode();
      }
      ```

  - id: line-by-line
    kind: line-by-line
    concepts: [equals-contract]
    title: Why the equals lines are written that way
    body: |
      - **`equals(Object other)`, with `@Override`.** The parameter must be `Object`. `equals(Money other)`
        compiles too, but it is an *overload* - collections call `equals(Object)` and never see it.
      - **`if (this == other) return true;`** A fast path, and it guarantees reflexivity.
      - **`instanceof Money that`** is false for `null`, so it also handles the null rule. Because `Money`
        is `final`, no subclass can add fields and break symmetry. For a non-final class, some teams use
        `getClass() != other.getClass()` instead - see the trade-offs.
      - **`minorUnits == that.minorUnits`** - `==` is right for a primitive `long`.
      - **`currency.equals(that.currency)`** - `equals` for an object field; `Objects.equals` if it could
        be null.
      - **`Objects.hash(minorUnits, currency)`** - the same two fields as `equals`, so equal objects get
        equal hash codes. (It boxes the arguments into an array; hand-written `31 * h + ...` avoids that in
        hot code.)

  - id: tests
    kind: tests
    concepts: [equals-contract, hashcode-contract]
    title: Tests for an equals and hashCode implementation
    body: |
      | ID | Test | Expected |
      |---|---|---|
      | Q1 | `x.equals(x)` | true |
      | Q2 | two separately built objects with the same values | equal, both ways round |
      | Q3 | three equal objects | transitive |
      | Q4 | change **each** significant field in turn | not equal |
      | Q5 | `x.equals(null)`, and an object of another type | false, no exception |
      | H1 | equal objects | equal hash codes |
      | H2 | `hashCode()` called twice | same value |
      | C1 | add two equal objects to a `HashSet` | size 1 |
      | C2 | `put` with one object, `get` with an equal one | the value is found |
      | C3 | (entity) change mutable state after `put` | still found |

      Q4 matters most - it catches a field forgotten in `equals`. Writing all of this for every class is
      tedious, so libraries exist that check the whole contract in one line (EqualsVerifier is a
      well-known one for Java).

  - id: mistakes
    kind: mistakes
    concepts: [equals-contract, hashcode-contract]
    title: Common mistakes and how to debug them
    body: |
      - **Overloading instead of overriding:** `public boolean equals(Money other)`. Direct calls work,
        collections don't. `@Override` turns it into a compile error.
      - **`equals` without `hashCode`.** Lists work (they only use `equals`), sets and maps don't.
      - **Mutable fields in `equals`/`hashCode` of objects used as keys** - entries get lost when the
        field changes.
      - **A field in `hashCode` that `equals` ignores** - equal objects get different hash codes.
      - **Symmetry broken by "helpful" equality** - a `CurrencyCode` that says it equals the `String`
        `"eur"`, while `String.equals` says the opposite.
      - **`instanceof` in a non-final class whose subclass adds fields** - symmetry or transitivity
        breaks between parent and child objects.
      - **Arrays as fields** (also in records): arrays use identity `equals`; compare them with
        `Arrays.equals` and hash with `Arrays.hashCode`.
      - **`BigDecimal` fields:** `equals` includes the scale, so `2.0` and `2.00` differ - decide whether
        that is what your type means, and normalise (`stripTrailingZeros()`) if not.

      **Debugging method:** when a map "loses" an entry or a set "keeps duplicates", print the key's
      `hashCode()` at `put` time and at lookup time, and call `a.equals(b)` and `b.equals(a)` directly. A
      changed hash code points to mutable keys; different hash codes for equal objects point to
      `hashCode`; an asymmetric `equals` points to the type check.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [equals-contract]
    title: Trade-offs
    body: |
      | Choice | When it fits | Watch out for |
      |---|---|---|
      | **record** | immutable value objects - DTOs, amounts, ids | every component takes part in equality; arrays compare by identity |
      | **hand-written** | entities (equality by id), special rules such as normalised text | easy to get wrong - test it |
      | **IDE-generated** | quick and readable | regenerate when fields change, or it drifts |
      | **`instanceof`** | final classes; when subclasses add no state | a subclass that adds fields breaks symmetry |
      | **`getClass()`** | non-final classes whose subclasses add state | a subclass can never equal its parent - surprising for proxies and mocks |
      | **no override (identity)** | objects with identity only: drivers, connections, page objects | `assertEquals` on them compares identity |

      Value equality versus id equality is a design decision, not a detail: two `Payment` objects with
      the same id but different statuses are "the same payment" for a map of evidence, and "different
      snapshots" for an assertion about state. Compare the fields you care about explicitly in such
      assertions instead of bending `equals`.

  - id: summary
    kind: summary
    title: Summary and quick reference
    body: |
      - `equals`: reflexive, symmetric, transitive, consistent, `equals(null)` is false.
      - `hashCode`: equal objects → equal hash codes; stable while the compared fields don't change;
        collisions are allowed.
      - `HashMap`/`HashSet` look in **one bucket** chosen by the hash code, then use `equals` there.
      - Override **both**, with `@Override`, over **the same fields**.
      - Value object: all value fields (or a record). Entity: the immutable id only.
      - Never let a key's hash code change while it is in a hash-based collection.
      - Test each field's effect, null, other types, hash consistency, and real collections.

exercises:
  - id: contract-rules
    type: mcq
    concept: equals-contract
    skill: recognition
    title: Which rules does the contract require?
    prompt: |
      Which of these does the `java.lang.Object` contract **require** of `equals`? Select every one that
      applies.
    options:
      - id: reflexive
        text: "`x.equals(x)` is true"
        feedback: Required - reflexivity.
      - id: symmetric
        text: "`x.equals(y)` is true exactly when `y.equals(x)` is true"
        feedback: Required - symmetry.
      - id: transitive
        text: If `x.equals(y)` and `y.equals(z)`, then `x.equals(z)`
        feedback: Required - transitivity.
      - id: null-false
        text: "`x.equals(null)` returns false"
        feedback: Required - and it must return false, not throw.
      - id: same-hash-equal
        text: Objects with the same hash code are equal
        feedback: Not required - unequal objects may share a hash code (a collision). Only the reverse is required - equal objects must have equal hash codes.
      - id: all-fields
        text: equals compares every field of the class
        feedback: Not required - equals compares the fields that define what the object *is*. An entity often compares only its id.
    correct: [reflexive, symmetric, transitive, null-false]
    hints:
      - Separate the rules about `equals` itself from rules people often assume about hash codes and fields.
    solution: |
      **Reflexive, symmetric, transitive, and false for null** (plus *consistent*, not listed). Equal hash
      codes do not imply equality, and which fields to compare is a design decision.
    followUp: |
      Write the one rule about `hashCode` that connects it to `equals`, and the one thing the contract
      explicitly allows.

  - id: case-insensitive-symmetry
    type: mcq
    concept: equals-contract
    skill: analysis
    title: A "helpful" equals
    prompt: |
      ```java
      public final class CurrencyCode {
          private final String code;   // stored upper-case, e.g. "EUR"

          @Override
          public boolean equals(Object other) {
              if (other instanceof CurrencyCode c) return code.equals(c.code);
              if (other instanceof String s) return code.equalsIgnoreCase(s);   // "eur" counts too
              return false;
          }
          // hashCode returns code.hashCode()
      }
      ```

      Which rule of the contract does this break, and how would it show up?
    options:
      - id: symmetry
        text: "Symmetry - `eur.equals(\"eur\")` is true but `\"eur\".equals(eur)` is false, so results depend on which side you call."
        feedback: Correct - String.equals knows nothing about CurrencyCode. A list's `contains` may then answer differently depending on how it compares.
      - id: reflexive
        text: Reflexivity - a CurrencyCode is not equal to itself.
        feedback: "`code.equals(c.code)` is true when `c` is the same object, so reflexivity holds."
      - id: null-rule
        text: The null rule - `equals(null)` throws.
        feedback: "`instanceof` is false for null, so the method returns false - the null rule holds."
      - id: none
        text: None - accepting strings is a convenience, not a violation.
        feedback: It is a violation. Equality must work the same way from both sides, and String's equals will never return true for a CurrencyCode.
    correct: [symmetry]
    hints:
      - Call it the other way round - what does `String.equals` do when given a CurrencyCode?
    solution: |
      **Symmetry.** `eur.equals("eur")` is true, `"eur".equals(eur)` is false. The hash codes disagree too:
      `"eur".hashCode()` differs from `"EUR".hashCode()`, so equal-by-this-method objects get different
      hash codes. Only compare with your own type; give callers an explicit method instead, such as
      `CurrencyCode.of("eur")` that normalises the text.
    followUp: |
      If two CurrencyCode objects should be equal regardless of case, where should the normalisation happen
      so that equals and hashCode stay simple?

  - id: overload-not-override
    type: debug
    concept: equals-contract
    skill: analysis
    title: Duplicates in the set
    prompt: |
      `set.add(new Money(1999, "EUR"))` twice leaves the `HashSet` with **two** elements, yet
      `a.equals(b)` returns true when you call it directly on two such objects. Click the line that causes
      it.
    language: java
    code: |
      public final class Money {
          private final long minorUnits;
          private final String currency;

          public Money(long minorUnits, String currency) {
              this.minorUnits = minorUnits;
              this.currency = currency;
          }

          public boolean equals(Money other) {
              return other != null
                  && minorUnits == other.minorUnits
                  && currency.equals(other.currency);
          }

          @Override
          public int hashCode() {
              return Objects.hash(minorUnits, currency);
          }
      }
    correctLines: [10]
    lineNotes:
      - line: 18
        note: hashCode is right - equal values get equal hash codes, so both objects land in the same bucket. The set then calls equals(Object), which this class never overrides.
      - line: 11
        note: The null check is correct and needed.
      - line: 13
        note: Comparing the currency with equals is right for a String field.
    hints:
      - Which `equals` method does `HashSet` call - what is its parameter type?
      - Your direct call compiled against the static type `Money`. Which overload did that pick?
    solution: |
      **Line 10.** `equals(Money other)` is an **overload**, not an override of `equals(Object)`. Your
      direct call `a.equals(b)` chooses it because `b`'s static type is `Money`; `HashSet` calls
      `equals(Object)`, which is still `Object`'s identity check - so the two objects are different.

      Fix: `public boolean equals(Object other)` with an `instanceof Money` check, and `@Override` on it -
      with the annotation, the original mistake would not have compiled.
    followUp: |
      Without changing `Money`, write a two-line test that would have caught this bug.

  - id: hashmap-lookup-order
    type: order
    concept: hashcode-contract
    skill: recall
    title: How HashMap.get finds a value
    prompt: |
      Put the steps of `HashMap.get(key)` in order (OpenJDK's implementation).
    items:
      - id: hash
        text: Call `key.hashCode()` and mix the high bits into the low bits
      - id: bucket
        text: Choose the bucket from the mixed hash and the table size
      - id: walk
        text: Walk the entries in that bucket only
      - id: compare
        text: For each entry, compare the stored hash, then identity or `equals`
      - id: result
        text: Return the matching entry's value, or `null` if none matched
    hints:
      - "`equals` is the last check, and it only runs inside one bucket."
    solution: |
      **hashCode → bucket → walk that bucket → hash, then identity or equals → value or null.** Because
      `equals` only runs inside the chosen bucket, a wrong or changing hash code makes an equal key
      invisible.
    followUp: |
      Using these steps, explain why a `HashMap` with a `hashCode()` that returns the constant 42 still
      gives correct answers, and what it costs.

  - id: implement-money-equality
    type: coding
    concept: equals-contract
    skill: application
    title: Make Money a value object
    prompt: |
      Add `equals` and `hashCode` to `Money` so that two objects with the same amount and currency are
      equal, are one element in a `HashSet`, and find each other in a `HashMap`. Keep the constructor and
      accessors as they are. Run the tests first and read which ones fail before you write any code.
    project: java
    files:
      - src/exercises/java/learnerapp/equality/Money.java
    test: src/test/java/learnerapp/equality/MoneyTest.java
    command: mvn test -Dtest=MoneyTest
    hints:
      - The method signature is `public boolean equals(Object other)` - with `@Override`.
      - Check identity, then the type, then compare `minorUnits` with `==` and `currency` with `equals`.
      - "`hashCode` must use the same two fields: `Objects.hash(minorUnits, currency)`."
    modelAnswer: |
      ```java
      @Override
      public boolean equals(Object other) {
          if (this == other) return true;
          if (!(other instanceof Money)) return false;
          Money that = (Money) other;
          return minorUnits == that.minorUnits && currency.equals(that.currency);
      }

      @Override
      public int hashCode() {
          return Objects.hash(minorUnits, currency);
      }
      ```

      `instanceof` is safe here because the class is `final`. Afterwards, try replacing the whole class
      with `record Money(long minorUnits, String currency) {}` - the tests still pass, because a record
      generates the same behaviour.
    rubric:
      - Every test in MoneyTest passes
      - equals takes an Object parameter and is marked with @Override
      - equals returns false for null and other types without throwing
      - hashCode uses exactly the fields that equals compares
    solution: |
      Before the fix, `Money` inherited identity equality from `Object`, so `assertEquals` reported two
      objects that print the same text as different, and the `HashSet` kept both. The reference solution
      is in `src/solutions/java/learnerapp/equality/Money.java`.
    followUp: |
      Add a `BigDecimal amount` field instead of `minorUnits`. Should `new Money(new BigDecimal("2.0"),
      "EUR")` equal one built from `"2.00"`? Change equals and hashCode to match your answer, and add a
      test for it.

  - id: fix-lost-payment
    type: coding
    concept: hashcode-contract
    skill: analysis
    title: Find the lost payment
    prompt: |
      A framework keeps evidence in a `HashMap<Payment, List<String>>`. After a payment's status changes,
      its evidence can't be found, and a second entry appears for the same payment. Run the tests, explain
      the failure in one sentence, then fix `Payment`. Keep `setStatus` - payments really do change status.
    project: java
    files:
      - src/exercises/java/learnerapp/equality/Payment.java
    test: src/test/java/learnerapp/equality/PaymentTest.java
    command: mvn test -Dtest=PaymentTest
    hints:
      - Print `payment.hashCode()` before and after `setStatus`. What changed?
      - The map filed the entry under the hash code the key had at `put` time.
      - What makes a payment *the same payment* over its whole life?
    modelAnswer: |
      ```java
      @Override
      public boolean equals(Object other) {
          if (this == other) return true;
          if (!(other instanceof Payment)) return false;
          return id.equals(((Payment) other).id);
      }

      @Override
      public int hashCode() {
          return id.hashCode();
      }
      ```

      Explanation: equals and hashCode included the mutable status, so changing the status changed the
      hash code and the map searched a different bucket. A payment is identified by its immutable id.
    rubric:
      - Every test in PaymentTest passes
      - equals and hashCode use only the immutable id
      - Explained that the hash code changed after the key was stored, so the map searched the wrong bucket
      - setStatus still exists and the status is still updated
    solution: |
      The general rule: **never let a key's hash code change while it is in a hash-based collection.**
      Either base equality on something immutable (an id), or make the object immutable. The reference
      solution is in `src/solutions/java/learnerapp/equality/Payment.java`.
    followUp: |
      An assertion wants to check that the payment you fetched is in state SUCCEEDED. With id-based
      equality, why is `assertEquals(expectedPayment, actualPayment)` now the wrong assertion, and what
      would you write instead?

  - id: equals-without-hashcode
    type: mcq
    concept: hashcode-contract
    skill: application
    title: equals without hashCode
    prompt: |
      `Refund` overrides `equals` (comparing payment id and amount) but **not** `hashCode`.

      ```java
      Set<Refund> refunds = new HashSet<>();
      refunds.add(new Refund("pay_81Fz", 500));
      refunds.add(new Refund("pay_81Fz", 500));
      System.out.println(refunds.size());
      ```

      What is printed?
    options:
      - id: one
        text: "`1` - the set calls `equals` and sees a duplicate"
        feedback: The set only calls equals within one bucket. With identity-based hash codes, the two objects almost always land in different buckets, so equals is never called.
      - id: two
        text: "Usually `2` - each object gets an identity-based hash code, so the set looks in different buckets and never compares them"
        feedback: Correct - the contract is broken (equal objects, different hash codes), and the set behaves as if they were different.
      - id: compile
        text: It does not compile - overriding equals requires overriding hashCode.
        feedback: The compiler does not enforce this. IDEs and static analysers warn about it, which is a good reason to read warnings.
      - id: throws
        text: It throws an exception when the second refund is added.
        feedback: Hash-based collections never detect a broken contract - they silently give wrong answers.
    correct: [two]
    hints:
      - Which method does the set call first, and what does `Object`'s version of it return?
    solution: |
      **Usually 2.** `HashSet` picks a bucket with `hashCode()` - `Object`'s identity-based version - so the
      two equal refunds are filed in different buckets and `equals` is never called. ("Usually", because
      two identity hash codes could collide by chance; you can't rely on either result.) Override
      `hashCode` over the same fields as `equals`.
    followUp: |
      Would `List<Refund>.contains(new Refund("pay_81Fz", 500))` work with this class? Why is the answer
      different from the set's?

  - id: test-refund-equality
    type: testdesign
    concept: equals-contract
    skill: application
    title: Test a value object's equality
    prompt: |
      A teammate wrote `equals` and `hashCode` for `Refund(String paymentId, long amountMinor, String
      reason)` - two refunds are equal when all three fields are. Design the unit tests you would ask for
      before trusting it in `HashMap` keys. Include what each test proves.
    hints:
      - Go through the contract rule by rule, then through the fields one by one.
      - What about null fields, and the collections where the class will be used?
    modelAnswer: |
      1. Reflexive: `r.equals(r)`.
      2. Two refunds built separately with the same values are equal - in both directions.
      3. Transitive across three equal refunds.
      4. Change each field in turn (paymentId, amountMinor, reason) - not equal. Catches a forgotten field.
      5. `equals(null)` is false and `equals("pay_81Fz")` is false - no exceptions.
      6. If `reason` may be null: two refunds with null reasons are equal; null versus "duplicate" is not.
      7. Equal refunds have equal hash codes; `hashCode()` twice gives the same value.
      8. `HashSet` of two equal refunds has size 1; a `HashMap` `put` with one and `get` with an equal one
         finds the value.
      Evidence: the assertion results; optionally a contract-checking library run for every field.
    rubric:
      - Covered reflexive, symmetric and transitive
      - Changed each significant field in turn and expected inequality
      - Covered null and another type without exceptions
      - Checked equal objects have equal and stable hash codes
      - Exercised a real HashSet or HashMap
      - Considered null field values
    solution: |
      The test that finds the most real bugs is **changing each field in turn** - it catches fields left
      out of `equals` and `hashCode` when someone adds one later. Contract-checking libraries automate this.
    followUp: |
      A new field `createdAt` (a timestamp) is added to `Refund`. Should it take part in equality? Which of
      your tests would tell you if someone added it to hashCode but not to equals?

  - id: interview-why-hashcode
    type: interview
    concept: hashcode-contract
    skill: application
    title: "Interview: why override hashCode with equals?"
    prompt: |
      **Interviewer:** "Why must you override `hashCode` when you override `equals`? What actually goes
      wrong if you don't?"
    hints:
      - Explain how a HashMap looks things up, then what happens to two equal keys.
    modelAnswer: |
      - The contract says equal objects must have equal hash codes.
      - `HashMap` and `HashSet` use the hash code to choose a bucket, and only call `equals` for entries in
        that bucket.
      - If `equals` is overridden but `hashCode` isn't, two equal objects get identity-based hash codes,
        land in different buckets and are never compared: sets keep duplicates and `get` with an equal key
        returns null.
      - It doesn't throw - it silently gives wrong results, so it is easy to miss.
      - The related bug: hash codes that change because they use mutable fields - the entry is filed under
        the old hash and lost.
    followUps:
      - Is it a problem if two unequal objects have the same hash code?
      - What does a record give you here?
      - Which fields would you use for equality on a Payment entity, and why?
    rubric:
      - Stated the rule that equal objects need equal hash codes
      - Explained that the hash code chooses the bucket and equals is only used inside it
      - Described the symptom (duplicates in sets, null from get)
      - Mentioned mutable fields in keys as a related failure
      - Said collisions are allowed but slow things down
    solution: |
      Strong answers walk through **the lookup** - hash code, bucket, equals - and name the silent symptom.
      Weak answers only repeat "because the contract says so".

recall:
  - id: recall-equals-rules
    concept: equals-contract
    prompt: Name the five rules of the equals contract.
    answer: Reflexive, symmetric, transitive, consistent, and x.equals(null) is false.
  - id: recall-equals-signature
    concept: equals-contract
    prompt: What is wrong with public boolean equals(Money other)?
    answer: It overloads instead of overriding equals(Object). Collections call equals(Object) and never see it. @Override would make it a compile error.
  - id: recall-value-vs-entity
    concept: equals-contract
    prompt: Which fields should equals compare for a value object, and for an entity?
    answer: A value object - all its value fields (or use a record). An entity - only its immutable id.
  - id: recall-hash-rule
    concept: hashcode-contract
    prompt: What is the one rule linking hashCode to equals?
    answer: Equal objects must have equal hash codes. Unequal objects may share one (a collision).
  - id: recall-hashmap-lookup
    concept: hashcode-contract
    prompt: How does HashMap.get use hashCode and equals?
    answer: The hash code picks a bucket; equals (after a hash and identity check) is used only on the entries in that bucket.
  - id: recall-mutable-key
    concept: hashcode-contract
    prompt: What happens if a HashMap key's hash code changes after put?
    answer: The entry stays in the bucket of the old hash code, so lookups search the wrong bucket and miss it. Base equality on immutable fields.

