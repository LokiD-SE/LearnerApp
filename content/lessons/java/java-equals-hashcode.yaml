placement:
  - id: place-symmetry
    type: mcq
    concept: equals-contract
    skill: application
    title: Which equals is broken?
    prompt: |
      Which of these `equals` implementations violates the contract?
    options:
      - id: record
        text: A record's generated equals, comparing every component
        feedback: Records generate a correct equals and hashCode from their components.
      - id: id-only
        text: An entity comparing only its immutable id, with hashCode from the same id
        feedback: Comparing only an immutable id is a valid design for entities.
      - id: string-too
        text: A class that also returns true for a String with the same text, ignoring case
        feedback: Correct - String.equals will never return true for it, so symmetry breaks.
      - id: final-instanceof
        text: A final class using instanceof and comparing all its fields
        feedback: With a final class, instanceof cannot let a subclass break symmetry - this is fine.
    correct: [string-too]
    solution: |
      **Equality with a different type (String) breaks symmetry** - the other class's equals doesn't know
      about yours. Compare only with your own type.

  - id: place-mutable-key
    type: mcq
    concept: hashcode-contract
    skill: application
    title: After the status changes
    prompt: |
      `Order.hashCode()` and `equals` use the fields `id` and `status`.

      ```java
      Set<Order> open = new HashSet<>();
      open.add(order);
      order.setStatus("PAID");
      System.out.println(open.contains(order));
      ```

      What is printed?
    options:
      - id: same-object
        text: "`true` - it is the same object"
        feedback: The set doesn't start by checking identity - it first picks a bucket using the new hash code, which is usually a different bucket.
      - id: usually-false
        text: "Usually `false` - the hash code changed, so the set looks in a different bucket"
        feedback: Correct - the entry is still in the set, filed under its old hash code, and lookups miss it.
      - id: throws
        text: It throws ConcurrentModificationException.
        feedback: That exception is about changing a collection's structure while iterating it - not about changing an element's fields.
      - id: compile
        text: It does not compile, because set elements must be immutable.
        feedback: Java doesn't enforce immutability of set elements - which is why this bug is possible.
    correct: [usually-false]
    solution: |
      **Usually `false`.** `contains` computes the new hash code, searches that bucket and misses the entry
      filed under the old one. Use immutable fields (such as the id) for equality.

  - id: place-collision
    type: mcq
    concept: hashcode-contract
    skill: application
    title: Two different objects, one hash code
    prompt: |
      Two **unequal** `Money` objects return the same `hashCode()`. Is that a bug?
    options:
      - id: allowed
        text: No - collisions are allowed; they only make lookups slower if they are common.
        feedback: Correct - the contract only requires equal objects to have equal hash codes.
      - id: bug
        text: Yes - unequal objects must have different hash codes.
        feedback: The contract explicitly does not require that; with 2^32 possible values it couldn't be guaranteed for most types.
      - id: equals
        text: Yes - it means they will be treated as equal by HashMap.
        feedback: HashMap still calls equals within the bucket, so unequal objects stay separate entries.
      - id: depends
        text: Only if the objects are records.
        feedback: The same contract applies to every class, records included.
    correct: [allowed]
    solution: |
      **Not a bug.** Collisions are allowed - HashMap separates colliding keys with equals. Only the
      opposite (equal objects, different hash codes) breaks the contract.
