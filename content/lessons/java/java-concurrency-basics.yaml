placement:
  - id: place-lost-update
    type: mcq
    concept: shared-mutable-state
    skill: application
    title: A shared total
    prompt: |
      Several threads add amounts to `long total` with `total += amount`. The final total is sometimes too
      small. What is the best fix?
    options:
      - id: atomic
        text: Use an AtomicLong (addAndGet) or LongAdder
        feedback: Correct - an atomic add can't lose updates.
      - id: volatile
        text: Declare total volatile
        feedback: Visibility doesn't make += atomic; updates are still lost.
      - id: sleep
        text: Add a short sleep between additions
        feedback: It changes the odds, not the race.
      - id: thread-priority
        text: Give the threads different priorities
        feedback: Priorities don't stop interleaving.
    correct: [atomic]
    solution: |
      **An atomic accumulator.** Even better, if each thread can sum its own part and the parts are added at
      the end, nothing needs to be shared at all.

  - id: place-execution-exception
    type: mcq
    concept: executors-and-futures
    skill: application
    title: A failed task
    prompt: |
      A task submitted to an ExecutorService throws `IOException("sandbox unreachable")`. What does
      `future.get()` throw?
    options:
      - id: execution
        text: ExecutionException, whose cause is the IOException
        feedback: Correct - unwrap it with getCause() before reporting.
      - id: io
        text: The IOException itself
        feedback: get() wraps the task's exception in ExecutionException.
      - id: nothing
        text: Nothing - it returns null
        feedback: A failed task never yields a result; get() reports the failure.
      - id: interrupted
        text: InterruptedException
        feedback: That is thrown when the waiting thread is interrupted - not when the task fails.
    correct: [execution]
    solution: |
      **ExecutionException wrapping the IOException.**

  - id: place-static-driver
    type: mcq
    concept: thread-confinement
    skill: application
    title: One driver field for all
    prompt: |
      A base test class declares `protected static WebDriver driver;` and assigns a new ChromeDriver in
      `@BeforeEach`. What happens when tests run in parallel?
    options:
      - id: shared
        text: Tests overwrite the shared field, then use and quit each other's browsers
        feedback: Correct - give each test its own driver.
      - id: fine
        text: Nothing - each test assigns its own driver
        feedback: They assign it to the same static field; there is only one.
      - id: slow
        text: It works, just more slowly
        feedback: It fails - wrong pages, NoSuchSessionException, browsers closed under running tests.
      - id: compile
        text: It doesn't compile with parallel execution enabled
        feedback: It compiles; the problem appears at run time.
    correct: [shared]
    solution: |
      **They share - and break - one browser slot.** Confine drivers to the test.
