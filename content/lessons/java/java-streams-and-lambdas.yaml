placement:
  - id: place-terminal
    type: mcq
    concept: stream-pipelines
    skill: application
    title: Does it run?
    prompt: |
      `payments.stream().filter(p -> { checked.add(p.id()); return true; });` - how many ids are added to
      `checked`?
    options:
      - id: none
        text: None - there is no terminal operation
        feedback: Correct - intermediate operations are lazy.
      - id: all
        text: All of them
        feedback: filter only describes the work; without a terminal operation it never runs.
      - id: first
        text: Only the first
        feedback: Not even the first - no element is ever pulled from the source.
      - id: throws
        text: It throws IllegalStateException
        feedback: Building a pipeline without running it is allowed; it simply does nothing.
    correct: [none]
    solution: |
      **None.** Add a terminal operation - and collect results with `collect`/`toList`, not with side effects.

  - id: place-duplicates
    type: mcq
    concept: collectors
    skill: application
    title: Two attempts, one id
    prompt: |
      `payments.stream().collect(Collectors.toMap(Payment::id, p -> p))` - the list contains attempts 1 and 2
      of `pay_93Qa`. What happens?
    options:
      - id: ise
        text: IllegalStateException for the duplicate key pay_93Qa
        feedback: Correct - toMap refuses duplicates unless you give it a merge function.
      - id: last-wins
        text: The later element replaces the earlier one
        feedback: That's Map.put's behaviour, not toMap's - toMap throws.
      - id: first-wins
        text: The first element is kept
        feedback: Only with a merge function like (a, b) -> a.
      - id: list
        text: The map's value becomes a list of both payments
        feedback: That's what groupingBy does; toMap maps each key to one value.
    correct: [ise]
    solution: |
      **IllegalStateException.** Use `toMap(Payment::id, p -> p, mergeFunction)` or `groupingBy`.

  - id: place-lambda-capture
    type: mcq
    concept: lambdas-functional-interfaces
    skill: application
    title: Counting with a lambda
    prompt: |
      `int failures = 0; payments.forEach(p -> { if (p.status().equals("FAILED")) failures++; });` - what
      happens?
    options:
      - id: compile
