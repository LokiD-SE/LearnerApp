id: java-streams-and-lambdas
title: Lambdas, functional interfaces and streams
subject: java
module: java-modern
level: intermediate
status: published
estimatedMinutes: 55
summary: Lambdas and method references, how a stream pipeline runs, and the collectors - grouping, counting, toMap - that turn test data and API responses into answers.
tags: [java, lambda, functional interface, method reference, stream, collectors, groupingBy, toMap, optional, interview]

environment: |
  - **Language:** Java 17 or later. Lambdas, method references and streams arrived in Java 8;
    `Stream.toList()` in Java 16; `Optional.orElseThrow()` without arguments in Java 10. The rules for
    captured variables are in **The Java Language Specification**, section 15.27.2.
  - **Sources:** the Javadoc of `java.util.function`, `java.util.stream` (including its package summary on
    laziness, non-interference and statelessness) and `java.util.stream.Collectors`.
  - **Practice project:** `practice/java` - JDK 17+, Maven 3.8+, JUnit 6. The exercises use a `Payment`
    record (id, attempt, status, method, currency, amount in minor units).
  - **Examples:** SandPay payments are fictional.

prerequisites:
  - java-collections-choice

concepts:
  - id: lambdas-functional-interfaces
    name: Lambdas and functional interfaces
    summary: A lambda implements the single abstract method of a functional interface; method references are shorthand; captured local variables must be effectively final.
  - id: stream-pipelines
    name: Stream pipelines
    summary: A source, lazy intermediate operations and one terminal operation; elements flow through one at a time; a stream is used once and shouldn't change outside state.
  - id: collectors
    name: Collectors
    summary: toList, groupingBy, counting, mapping, partitioningBy, joining and toMap - including toMap's failure on duplicate keys and how a merge function fixes it.

objectives:
  - Write lambdas and method references for the standard functional interfaces, and explain the effectively-final rule.
  - Write and read stream pipelines, and explain laziness, single use and short-circuiting.
  - Group, count, partition and index data with collectors, and handle duplicate keys.
  - Decide when a loop is clearer than a stream.

sections:
  - id: intuition
    kind: intuition
    concepts: [stream-pipelines, lambdas-functional-interfaces]
    title: The idea in plain language
    body: |
      A stream is an **assembly line**. Items come off a belt (the source), pass stations that **drop**
      some (filter) or **change** them (map), and land in a box at the end (collect).

      - Nothing moves until someone stands at the end to receive items - the **terminal operation**. Build
        the line without one and nothing happens at all.
      - Items travel **one at a time** through every station, not station by station.
      - Each station is given a small instruction - "keep only failed payments" - written as a **lambda**.

      A lambda is a piece of behaviour you can pass around: "here's what to do with each payment".

  - id: what
    kind: what
    concepts: [lambdas-functional-interfaces, stream-pipelines, collectors]
    title: What the pieces are
    body: |
      **Functional interfaces** have exactly one abstract method, so a lambda can implement them:

      | Interface | Method | Example |
      |---|---|---|
      | `Predicate<T>` | `boolean test(T)` | `p -> p.status().equals("FAILED")` |
      | `Function<T, R>` | `R apply(T)` | `Payment::amountMinor` |
      | `Consumer<T>` | `void accept(T)` | `p -> log.info(p.id())` |
      | `Supplier<T>` | `T get()` | `ArrayList::new` |
      | `BinaryOperator<T>` | `T apply(T, T)` | `Long::sum` |
      | `Comparator<T>` | `int compare(T, T)` | `Comparator.comparingLong(Payment::amountMinor)` |

      **Method references:** static (`Integer::parseInt`), on a particular object (`settled::contains`), on
      any object of a type (`Payment::id`) and constructors (`ArrayList::new`).

      **Stream operations:**

      - *intermediate* (lazy, return a stream): `filter`, `map`, `mapToLong`, `flatMap`, `distinct`,
        `sorted`, `limit`, `peek`;
      - *terminal* (run the pipeline): `toList`, `collect`, `count`, `sum`, `min`, `max`, `anyMatch`,
        `findFirst`, `forEach`, `reduce`.

      **Collectors** (`java.util.stream.Collectors`): `toList`, `toSet`, `joining`, `groupingBy`,
      `partitioningBy`, `counting`, `mapping`, `toMap`.

  - id: why
    kind: why
    concepts: [stream-pipelines, collectors]
    title: Why testers use streams every day
    body: |
      Test code constantly asks questions of data: "the total of succeeded EUR payments", "how many of each
      status", "the latest attempt per payment", "the ids of failed webhooks". A pipeline states the
      question directly; the equivalent loops spread it over temporary variables.

      They are also a common source of confusing failures: an `IllegalStateException` from `toMap` when
      test data contains a retry, an empty result because a pipeline had no terminal operation, a
      `NullPointerException` from `Optional.get()`. And interviewers ask stream questions to see whether
      you can write Java beyond the basics.

  - id: internals
    kind: internals
    concepts: [stream-pipelines, lambdas-functional-interfaces]
    title: How a pipeline runs
    body: |
      - **Laziness.** Intermediate operations only describe the work. The terminal operation pulls elements
        from the source, and each element travels through the whole chain before the next one starts.
      - **Short-circuiting.** `findFirst`, `anyMatch` and `limit` stop pulling as soon as they have their
        answer - so a `filter` may run on far fewer elements than the source has.
      - **Single use.** After a terminal operation the stream is spent; using it again throws
        `IllegalStateException: stream has already been operated upon or closed`.
      - **Behavioural parameters must not interfere** with the source (don't change the list you are
        streaming) and should be **stateless** (don't depend on or change variables outside). Parallel
        streams make violations fail randomly.
      - **Captured variables:** a lambda may read local variables only if they are final or *effectively
        final* (never reassigned). That is why `total += p.amountMinor()` inside `forEach` doesn't compile -
        use `mapToLong(...).sum()`. Fields and the contents of objects are not protected by this rule.

  - id: visual
    kind: visual
    concepts: [stream-pipelines]
    title: "Diagram: a pipeline, element by element"
    body: |
      ```mermaid
      flowchart LR
          S["payments.stream() - source"] --> F["filter: status is SUCCEEDED"]
          F --> M["mapToLong: amountMinor"]
          M --> T["sum() - terminal, starts the work"]
          F -.->|dropped| X["not passed on"]
      ```

      When `sum()` runs, it pulls the first payment through `filter` and, if it passes, through
      `mapToLong` - then the next payment. Remove `sum()` and no payment is ever looked at.

  - id: when
    kind: when
    concepts: [stream-pipelines, collectors]
    title: Streams or loops?
    body: |
      | Prefer a stream | Prefer a loop |
      |---|---|
      | transforming, filtering, grouping, summing - a question about a collection | the steps have side effects (clicking, sending requests) |
      | the result is a new collection or a value | you need to `break` on complex conditions or handle checked exceptions per element |
      | the pipeline reads as one sentence | the stream needs nested lambdas and comments to be understood |

      `Function` and friends can't throw checked exceptions, so I/O inside a pipeline needs wrapping - often
      a sign that a loop is clearer.

  - id: example
    kind: example
    concepts: [collectors]
    title: "Real-world example: the report that crashed on retries"
    body: |
      A test report built an index of the day's payments:

      ```java
      Map<String, Payment> byId = payments.stream().collect(Collectors.toMap(Payment::id, p -> p));
      ```

      It ran for months - until the payment service started retrying failed card payments under the same id
      with a higher attempt number. The report job then failed with:

      ```text
      IllegalStateException: Duplicate key pay_93Qa (attempted merging values ... and ...)
      ```

      **Evidence:** the message names the key; the data showed two rows for `pay_93Qa`, attempts 1 and 2.
      **Fix:** a merge function that keeps the latest attempt, and a `LinkedHashMap` so the report keeps the
      original order - the second coding exercise. The team also added a retried payment to the report's
      test data, so the next format change would be caught before production.

  - id: code
    kind: code
    concepts: [lambdas-functional-interfaces, stream-pipelines, collectors]
    title: "Code: common pipelines over payments"
    collapsed: true
    body: |
      ```java
      long succeededEur = payments.stream()
          .filter(p -> p.status().equals("SUCCEEDED"))
          .filter(p -> p.currency().equals("EUR"))
          .mapToLong(Payment::amountMinor)
          .sum();

      Map<String, Long> countByStatus = payments.stream()
          .collect(groupingBy(Payment::status, counting()));          // {SUCCEEDED=3, FAILED=2, ...}

      Map<String, List<String>> idsByMethod = payments.stream()
          .collect(groupingBy(Payment::method, TreeMap::new, mapping(Payment::id, toList())));

      Map<Boolean, List<Payment>> bigOrSmall = payments.stream()
          .collect(partitioningBy(p -> p.amountMinor() >= 10_000));

      Optional<Payment> largestFailed = payments.stream()
          .filter(p -> p.status().equals("FAILED"))
          .max(Comparator.comparingLong(Payment::amountMinor));

      Map<String, Payment> latest = payments.stream()
          .collect(toMap(Payment::id, p -> p,
                         (a, b) -> b.attempt() > a.attempt() ? b : a,   // duplicate ids: keep the later attempt
                         LinkedHashMap::new));

      String ids = payments.stream().map(Payment::id).collect(joining(", "));
      boolean anyPending = payments.stream().anyMatch(p -> p.status().equals("PENDING"));
      ```

  - id: tests
    kind: tests
    concepts: [collectors, stream-pipelines]
    title: Test data that breaks pipelines
    body: |
      | ID | Data | Catches |
      |---|---|---|
      | P1 | an empty list | `get()` on an empty `Optional`, division by a zero count |
      | P2 | duplicate keys (a retried payment) | `toMap` without a merge function |
      | P3 | `null` values where the data allows them | `toMap` rejects null values; `groupingBy` rejects null keys |
      | P4 | elements in an unusual order | code that relies on encounter order where it isn't promised |
      | P5 | only elements that the filter drops | pipelines that assume at least one result |
      | P6 | a large input with a time limit | repeated `contains` on lists inside lambdas |

  - id: mistakes
    kind: mistakes
    concepts: [stream-pipelines, collectors, lambdas-functional-interfaces]
    title: Common mistakes
    body: |
      - **No terminal operation** - the pipeline never runs.
      - **Collecting through side effects** (`forEach(list::add)`, `peek(...)`) instead of `collect` or
        `toList`.
      - **`toMap` with possible duplicate keys** and no merge function.
      - **`Optional.get()` without checking** - use `orElse`, `orElseThrow` with a message, or `ifPresent`.
      - **Reusing a stream** stored in a variable.
      - **Expecting `toList()` results to be modifiable** - `Stream.toList()` returns an unmodifiable list.
      - **Changing the source collection inside the pipeline.**
      - **`parallel()` for small test data or with shared state** - slower, and racy.
      - **Long chains with nested lambdas** that nobody can read - extract a well-named method.

      **Debugging method:** break the pipeline after each step and look at the intermediate result (assign
      `filter(...).toList()` to a variable in the debugger), or use `peek(x -> System.out.println(x))`
      temporarily. Some IDEs - IntelliJ IDEA, for example - can also trace a stream chain stage by stage in
      the debugger.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [stream-pipelines]
    title: Trade-offs
    body: |
      | | Streams | Loops |
      |---|---|---|
      | Readability | excellent for transformations and grouping | better for step-by-step actions with side effects |
      | Checked exceptions | awkward | natural |
      | Debugging | needs breaking up or a stream-aware debugger | step through line by line |
      | Performance | similar for typical test data; small overhead per stage | similar; easier to optimise by hand |
      | Parallelism | one call away - and easy to misuse | explicit (executors) |

  - id: summary
    kind: summary
    title: Summary and quick reference
    body: |
      - Lambda = implementation of a single-abstract-method interface. Captured locals must be effectively
        final.
      - Pipeline = source + lazy intermediate operations + one terminal operation; elements flow one at a
        time; use a stream once.
      - `mapToLong(...).sum()`, `groupingBy(key, counting())`, `groupingBy(key, TreeMap::new, mapping(...))`,
        `partitioningBy`, `joining`.
      - `toMap` throws on duplicate keys - pass a merge function (and a map factory for order).
      - Return data from pipelines; don't collect through side effects.

exercises:
  - id: lambda-targets
    type: mcq
    concept: lambdas-functional-interfaces
    skill: recognition
    title: Where can a lambda go?
    prompt: |
      A lambda can be used wherever the target type is a functional interface. Which of these types can be
      the target of a lambda? Select every one that applies.
    options:
      - id: predicate
        text: "`Predicate<Payment>`"
        feedback: Yes - one abstract method, test.
      - id: runnable
        text: "`Runnable`"
        feedback: Yes - one abstract method, run.
      - id: comparator
        text: "`Comparator<Payment>`"
        feedback: Yes - compare is its only abstract method (equals comes from Object and doesn't count).
      - id: list
        text: "`List<Payment>`"
        feedback: No - List has many abstract methods, so there's no single method for a lambda to implement.
    correct: [predicate, runnable, comparator]
    hints:
      - Count the abstract methods each type declares.
    solution: |
      **`Predicate`, `Runnable` and `Comparator`.** Methods that every object already has from `Object`
      (like `equals`) don't count. Your own single-method interfaces work too - the
      `@FunctionalInterface` annotation just makes the compiler check it.
    followUp: |
      The practice project's `FeePolicy` interface is annotated `@FunctionalInterface`. Write a lambda for a
      flat fee of 50, and a method reference that could also implement it.

  - id: no-terminal
    type: debug
    concept: stream-pipelines
    skill: analysis
    title: Why is the list empty?
    prompt: |
      `failedIds.size()` prints `0`, although the test data contains two failed payments. Click the line
      that explains why nothing was added.
    language: java
    code: |
      List<String> failedIds = new ArrayList<>();
      payments.stream()
          .filter(p -> p.status().equals("FAILED"))
          .peek(p -> failedIds.add(p.id()))
          .map(Payment::amountMinor);
      System.out.println(failedIds.size());
    correctLines: [5]
    lineNotes:
      - line: 4
        note: Collecting results through a side effect in peek is fragile and bad style - but the reason nothing is added here is that no element ever reaches peek.
      - line: 3
        note: The filter is correct; it simply never runs.
    hints:
      - Which operation in this pipeline would make elements start flowing?
    solution: |
      **Line 5.** The pipeline ends with `map`, an intermediate operation, so there is no terminal
      operation and nothing runs - not the filter, not the `peek`. Write it as a question with an answer:
      `List<String> failedIds = payments.stream().filter(p -> p.status().equals("FAILED")).map(Payment::id).toList();`
    followUp: |
      Add `.count()` to the end of the original pipeline. How many ids are now added - and why is that
      still not a good way to collect them?

  - id: payment-stats
    type: coding
    concept: stream-pipelines
    skill: application
    title: Questions about payments
    prompt: |
      Implement the four methods of `PaymentStats` - the total of succeeded payments in a currency, the
      count per status, the largest failed payment, and the payment ids per method (methods sorted) - each
      as one stream pipeline, without loops or changing variables outside the stream.
    project: java
    files:
      - src/exercises/java/learnerapp/streams/PaymentStats.java
    test: src/test/java/learnerapp/streams/PaymentStatsTest.java
    command: mvn test -Dtest=PaymentStatsTest
    hints:
      - "Totals: two filters, then `mapToLong(Payment::amountMinor).sum()`."
      - "Counts: `groupingBy(Payment::status, counting())`. Largest: `max` with `Comparator.comparingLong`."
      - "Sorted keys: the three-argument `groupingBy` takes a map factory - `TreeMap::new` - and `mapping(Payment::id, toList())`."
    modelAnswer: |
      ```java
      return payments.stream()
          .filter(p -> p.status().equals("SUCCEEDED"))
          .filter(p -> p.currency().equals(currency))
          .mapToLong(Payment::amountMinor)
          .sum();

      return payments.stream().collect(groupingBy(Payment::status, counting()));

      return payments.stream()
          .filter(p -> p.status().equals("FAILED"))
          .max(Comparator.comparingLong(Payment::amountMinor));

      return payments.stream()
          .collect(groupingBy(Payment::method, TreeMap::new, mapping(Payment::id, toList())));
      ```
    rubric:
      - Every test in PaymentStatsTest passes
      - Each method is a single pipeline with no loops and no external mutable variables
      - Used mapToLong and sum (not a reduce with boxing) for the total
      - Used a map factory to sort the methods rather than sorting afterwards
    solution: |
      Each answer is a source, some filtering or mapping, and one terminal operation that states the
      question. Reference: `src/solutions/java/learnerapp/streams/PaymentStats.java`.
    followUp: |
      Add `averageAmountByMethod` returning `Map<String, Double>`. Which collector computes an average, and
      what does it return for a method with no payments?

  - id: latest-attempts
    type: coding
    concept: collectors
    skill: analysis
    title: Retried payments in a map
    prompt: |
      `LatestAttempts.byId` builds a map from payment id to payment. It works for yesterday's data and
      throws for today's, which contains retried payments (same id, higher attempt number). Run the tests,
      read the exception, and fix the method - keeping it one pipeline: each id maps to its **latest**
      attempt, in the order ids first appear.
    project: java
    files:
      - src/exercises/java/learnerapp/streams/LatestAttempts.java
    test: src/test/java/learnerapp/streams/LatestAttemptsTest.java
    command: mvn test -Dtest=LatestAttemptsTest
    hints:
      - Read the exception's message - which key is duplicated?
      - "`Collectors.toMap` has a three-argument form with a merge function: `(a, b) -> ...` decides which value stays."
      - The four-argument form also takes a map factory; which map keeps insertion order?
    modelAnswer: |
      ```java
      BinaryOperator<Payment> later = (a, b) -> b.attempt() > a.attempt() ? b : a;
      return payments.stream()
          .collect(Collectors.toMap(Payment::id, payment -> payment, later, LinkedHashMap::new));
      ```
    rubric:
      - Every test in LatestAttemptsTest passes
      - Explained the IllegalStateException - toMap rejects duplicate keys without a merge function
      - The merge function compares attempt numbers, so the list order doesn't matter
      - LinkedHashMap keeps the first-appearance order
    solution: |
      The merge function is called whenever a key repeats, with the value already in the map and the new
      one. Comparing attempts (rather than "keep the newer element") makes the result independent of the
      list's order - one of the tests reverses it. Reference:
      `src/solutions/java/learnerapp/streams/LatestAttempts.java`.
    followUp: |
      Write the same with `groupingBy(Payment::id, LinkedHashMap::new, maxBy(...))`. What type do the map's
      values have now, and why?

  - id: element-order
    type: order
    concept: stream-pipelines
    skill: recall
    title: In which order do the stages run?
    prompt: |
      ```java
      Stream.of("pay_1", "pay_2")
          .filter(s -> { System.out.println("filter " + s); return true; })
          .map(s -> { System.out.println("map " + s); return s.toUpperCase(); })
          .toList();
      ```

      Put the printed lines in order.
    items:
      - id: filter-1
        text: "`filter pay_1`"
      - id: map-1
        text: "`map pay_1`"
      - id: filter-2
        text: "`filter pay_2`"
      - id: map-2
        text: "`map pay_2`"
    hints:
      - Does each stage process all elements before the next stage starts?
    solution: |
      **filter pay_1, map pay_1, filter pay_2, map pay_2.** Elements flow through the whole pipeline one at
      a time (stateful operations such as `sorted` are the exception - they must see every element first).
    followUp: |
      Add `.sorted()` between `filter` and `map`. What is printed now, and why?

  - id: effectively-final
    type: mcq
    concept: lambdas-functional-interfaces
    skill: analysis
    title: Summing inside forEach
    prompt: |
      ```java
      long total = 0;
      payments.forEach(p -> total += p.amountMinor());
      ```

      What happens?
    options:
      - id: compile-error
        text: "It doesn't compile: local variables referenced from a lambda must be final or effectively final"
        feedback: Correct - total is reassigned, so the lambda may not capture it.
      - id: works
        text: It sums the amounts correctly
        feedback: The compiler stops it first. If it were allowed, a parallel forEach would make it a race.
      - id: zero
        text: It compiles, and total stays 0 because the lambda gets a copy
        feedback: Java refuses to compile it rather than silently working on a copy.
      - id: runtime
        text: It throws an exception at run time
        feedback: The rule is checked by the compiler - this never runs.
    correct: [compile-error]
    hints:
      - Which local variables may a lambda use?
    solution: |
      **A compile error.** Ask the question as a pipeline instead:
      `long total = payments.stream().mapToLong(Payment::amountMinor).sum();`. (Wrapping the counter in an
      `AtomicLong` or a one-element array "works", but it is a side effect - and racy in parallel.)
    followUp: |
      Why does the same rule not stop a lambda from adding to a list held in a local variable?

  - id: interview-streams
    type: interview
    concept: collectors
    skill: application
    title: "Interview: streams in test code"
    prompt: |
      **Interviewer:** "How do you use streams in your test code? Give me an example with grouping, and tell
      me about a stream bug you've seen."
    hints:
      - A concrete pipeline, a collector, a pitfall and its fix.
    modelAnswer: |
      - Streams for questions about test data and API responses: filter, map, and a collector - for example
        `groupingBy(Payment::status, counting())` to check a report's counts, or `mapToLong(...).sum()` for
        totals.
      - Laziness: nothing runs without a terminal operation; streams are single-use.
      - A bug: `toMap` throwing IllegalStateException when retried payments shared an id - fixed with a merge
        function keeping the latest attempt, and a test case with duplicates.
      - Loops are still better for steps with side effects (UI actions, requests) or checked exceptions.
    followUps:
      - What is the difference between map and flatMap?
      - When would you avoid parallel streams?
      - What does Stream.toList() return compared with Collectors.toList()?
    rubric:
      - Gave a realistic pipeline with a collector
      - Explained laziness or the terminal operation
      - Described a real pitfall such as toMap duplicates, Optional.get or side effects
      - Said when a loop is the better choice
    solution: |
      Strong answers show **judgement** - streams for questions about data, loops for actions - and real
      pitfalls, not just syntax.

recall:
  - id: recall-functional
    concept: lambdas-functional-interfaces
    prompt: What makes an interface a functional interface?
    answer: Exactly one abstract method (methods inherited from Object don't count). @FunctionalInterface asks the compiler to check it.
  - id: recall-effectively-final
    concept: lambdas-functional-interfaces
    prompt: Which local variables can a lambda use?
    answer: Only final or effectively final ones - never reassigned after initialisation.
  - id: recall-lazy
    concept: stream-pipelines
    prompt: When does a stream pipeline actually run?
    answer: Only when a terminal operation (toList, collect, sum, count, forEach ...) is called; intermediate operations are lazy.
  - id: recall-single-use
    concept: stream-pipelines
    prompt: What happens if you use a stream twice?
    answer: IllegalStateException - "stream has already been operated upon or closed". Create a new stream from the source.
  - id: recall-tomap
    concept: collectors
    prompt: What does Collectors.toMap do with duplicate keys, and how do you handle them?
    answer: It throws IllegalStateException. Pass a merge function as the third argument (and a map factory as the fourth for order).
  - id: recall-groupingby
    concept: collectors
    prompt: How do you count elements per key, and get the keys sorted?
    answer: groupingBy(keyFunction, TreeMap::new, counting()) - the map factory sorts, counting() counts (as Long).

