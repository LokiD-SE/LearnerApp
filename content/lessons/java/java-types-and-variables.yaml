placement:
  - id: place-shared-object
    type: mcq
    concept: primitive-and-reference-types
    skill: application
    title: Two variables, one payment?
    prompt: |
      ```java
      Payment p1 = new Payment("pay_1", "PENDING");
      Payment p2 = p1;
      p2.setStatus("SUCCEEDED");
      System.out.println(p1.status());
      ```

      What is printed?
    options:
      - id: succeeded
        text: "`SUCCEEDED`"
        feedback: Correct - `p2 = p1` copied the reference, so both variables lead to the same object.
      - id: pending
        text: "`PENDING`"
        feedback: "`p2 = p1` does not copy the payment - it copies the reference. There is only one payment object."
      - id: compile
        text: It does not compile.
        feedback: Assigning one reference variable to another of the same type is ordinary Java.
      - id: prints-null
        text: "`null`"
        feedback: Nothing sets the status to null - the object's status was changed to SUCCEEDED through `p2`.
    correct: [succeeded]
    solution: |
      **`SUCCEEDED`.** Assigning a reference variable copies the reference, not the object - `p1` and `p2`
      lead to one payment. Copy the object explicitly (a copy constructor, or an immutable record) when
      you need two.

  - id: place-parsed-status
    type: mcq
    concept: reference-equality
    skill: application
    title: Comparing a parsed status
    prompt: |
      `status` was read from a JSON response body and holds the text `SUCCEEDED`. What does
      `status == "SUCCEEDED"` evaluate to?
    options:
      - id: always-true
        text: Always true - the text is identical.
        feedback: "`==` does not compare text. It compares whether both sides are the same object."
      - id: unreliable
        text: Not reliably true - `==` compares identity, and a parsed string is normally a separate object from the literal.
        feedback: Correct - literals are shared (interned), strings built at run time are not. Use `"SUCCEEDED".equals(status)`.
      - id: throws
        text: It throws an exception because `==` cannot compare strings.
        feedback: "`==` compiles and runs for any two references - that is exactly why this bug is easy to write."
      - id: java17
        text: True since Java 17, which compares strings by value.
        feedback: No Java version changed `==` to compare string contents.
    correct: [unreliable]
    solution: |
      **Not reliably true.** A parsed string is created at run time, so it is usually a different object
      from the `"SUCCEEDED"` literal, and `==` is false. Compare text with `equals` - literal first so a
      null status gives false.

  - id: place-money-type
    type: mcq
    concept: numeric-types-for-money
    skill: application
    title: A type for daily totals
    prompt: |
      A test framework sums all refund amounts for a large merchant's day and compares the total with the
      provider's settlement report. Which representation fits best?
    options:
      - id: double-round
        text: "`double`, rounded to two decimals at the end"
        feedback: Binary floating point cannot hold most decimal amounts exactly; the error accumulates and rounding at the end can still land on the wrong cent.
      - id: long-or-bigdecimal
        text: "`long` minor units with exact addition, or `BigDecimal` built from strings"
        feedback: Correct - both are exact; `Math.addExact` or `BigDecimal` also refuse silent overflow.
      - id: int-minor
        text: "`int` minor units"
        feedback: Exact, but an `int` holds only about 21 million in major units - a large merchant's daily total can overflow it, silently.
      - id: float
        text: "`float`, because amounts only need two decimals"
        feedback: "`float` has the same representation problem as `double`, with even less precision."
    correct: [long-or-bigdecimal]
    solution: |
      **`long` minor units or `BigDecimal` from strings.** Both are exact. Avoid floating point for money,
      and avoid `int` where totals can grow - overflow wraps around without an error.
