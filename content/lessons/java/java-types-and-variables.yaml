id: java-types-and-variables
title: Primitive and reference types
subject: java
module: java-basics
level: beginner
status: published
estimatedMinutes: 50
summary: What a variable really holds, why == surprises people, and which number types are safe for money.
tags: [java, primitives, references, equality, autoboxing, integer cache, string pool, pass by value, money, double, long, BigDecimal, interview]

environment: |
  - **Language:** Java 17 or later. The rules come from **The Java Language Specification (JLS)**: types
    and values in chapter 4, floating point in section 4.2.3, boxing conversion in section 5.1.7, string
    literals in section 3.10.5, method parameters in section 8.4.1, integer overflow in section 15.18.2 and
    the equality operators in section 15.21. Nothing in this lesson changed between Java 17 and 21.
  - **The `Integer` cache - two different guarantees.** JLS 5.1.7 guarantees shared objects only when the
    boxed value is a *constant expression* from -128 to 127. The Javadoc of `Integer.valueOf(int)`
    (which javac uses for autoboxing) goes further: it "will always cache values in the range -128 to
    127, inclusive, and may cache other values outside of this range" - so it also covers values parsed at
    run time. HotSpot can cache more (`-XX:AutoBoxCacheMax`), so results outside that range are not
    guaranteed either way.
  - **Outputs** in the code section were produced by running the code on OpenJDK 17.0.20.
  - **Practice project:** `practice/java` in the LearnerApp repository - JDK 17+, Maven 3.8+, JUnit 6.1.3.
  - **Examples:** SandPay and every id and amount are fictional.
  - **Sources:**
    - [JLS (Java SE 17) chapter 4, Types, Values, and Variables](https://docs.oracle.com/javase/specs/jls/se17/html/jls-4.html) - 4.2.3 floating point
    - [JLS 17 section 5.1.7, Boxing Conversion](https://docs.oracle.com/javase/specs/jls/se17/html/jls-5.html#jls-5.1.7)
    - [JLS 17 section 3.10.5, String Literals](https://docs.oracle.com/javase/specs/jls/se17/html/jls-3.html#jls-3.10.5)
    - [JLS 17 section 8.4.1, Formal Parameters](https://docs.oracle.com/javase/specs/jls/se17/html/jls-8.html#jls-8.4.1)
    - [JLS 17 sections 15.18.2 (overflow) and 15.21 (equality operators)](https://docs.oracle.com/javase/specs/jls/se17/html/jls-15.html#jls-15.21)
    - [Javadoc: `Integer.valueOf(int)`](https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/lang/Integer.html#valueOf(int)),
      [`BigDecimal`](https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/math/BigDecimal.html) (`equals` vs `compareTo`, `valueOf(double)`),
      [`Math.addExact`](https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/lang/Math.html#addExact(int,int)),
      [`Currency.getDefaultFractionDigits`](https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/util/Currency.html#getDefaultFractionDigits())
    - [SpotBugs bug descriptions](https://spotbugs.readthedocs.io/en/stable/bugDescriptions.html) - `ES_COMPARING_STRINGS_WITH_EQ`
    - [JUnit User Guide: test execution order](https://docs.junit.org/current/writing-tests/test-execution-order.html) - "deterministic but intentionally nonobvious"

concepts:
  - id: primitive-and-reference-types
    name: Primitive and reference variables
    summary: A primitive variable holds a value; a reference variable holds a reference to an object. Assigning or passing either copies what the variable holds.
  - id: reference-equality
    name: == versus equals
    summary: == compares primitive values, or whether two references point to the same object; equals compares what objects mean.
  - id: numeric-types-for-money
    name: Number types for money
    summary: double cannot hold most decimal fractions exactly and integer arithmetic overflows silently, so money needs long minor units or BigDecimal and exact operations.

objectives:
  - Explain what a primitive and a reference variable hold, and predict the effect of assigning and passing each.
  - Predict == and equals for primitives, strings and boxed numbers, and explain why == on objects passes some tests and fails others.
  - Choose a type for money amounts and justify it with the failure each wrong choice causes.
  - Find and fix equality and aliasing bugs in test code, and write tests that expose them.

prerequisites: []

sections:
  - id: intuition
    kind: intuition
    concepts: [primitive-and-reference-types, reference-equality]
    title: The idea in plain language
    body: |
      A **primitive variable** is a box with the value inside. `int retries = 3` - the box holds 3.

      A **reference variable** is a box holding an *address card*. `Payment p = new Payment(...)` - the
      payment object lives somewhere else, and the box holds directions to it.

      - Copy a primitive and you get a second box with its own 3. Change one, the other stays 3.
      - Copy a reference and you get a second card with the **same address**. Both lead to one object;
        change the object through either and both "see" the change.

      `==` compares **what is in the boxes**. For primitives, that is the value. For references, it is the
      address - "is this the *same object*?" - not "do these *mean* the same thing?". That second question
      is what `equals` is for.

  - id: what
    kind: what
    concepts: [primitive-and-reference-types, numeric-types-for-money]
    title: What Java's types are
    body: |
      **Eight primitive types** - the value itself, never `null`:

      | Type | Holds | Range or precision |
      |---|---|---|
      | `byte`, `short` | small whole numbers | 8 and 16 bits |
      | `int` | whole numbers | 32 bits: about ±2.1 billion |
      | `long` | whole numbers | 64 bits: about ±9.2 × 10^18 |
      | `float`, `double` | binary floating point (IEEE 754) | about 7 and 15-16 significant decimal digits |
      | `char` | one UTF-16 code unit | 0 to 65,535 |
      | `boolean` | `true` or `false` | - |

      **Reference types** - everything else: classes, interfaces, arrays, enums and records. A reference
      variable holds a reference to an object, or `null`.

      **Wrapper classes** (`Integer`, `Long`, `Double`, `Boolean`, ...) are reference types that wrap one
      primitive value. Java converts automatically:

      - **Autoboxing:** `Integer count = 5;` becomes `Integer.valueOf(5)`.
      - **Unboxing:** `int n = count;` becomes `count.intValue()` - and throws `NullPointerException` if
        `count` is `null`.

      Generic collections can only hold references, which is why `List<Integer>` exists and `List<int>`
      does not.

  - id: why
    kind: why
    concepts: [reference-equality, numeric-types-for-money, primitive-and-reference-types]
    title: Why a tester has to know this
    body: |
      Test and automation code compares statuses, ids and amounts all day. Three classic failures come
      straight from this lesson:

      - **`==` on objects.** `status == "SUCCEEDED"` works with a literal in a unit test and fails with
        a status parsed from a real response. A wait loop built on it never ends, and the test is
        labelled "flaky".
      - **The wrong number type for money.** Summing `double` amounts drifts by fractions of a cent, so
        totals stop reconciling. Summing `int` cents overflows above about 21 million in major units -
        silently, with a negative total.
      - **Shared references in test data.** A builder hands out the same list to every test. One test
        adds an item, and a different test fails - but only when they run in a certain order.

      Interviewers ask about `==` versus `equals` and "why not `double` for money" constantly, because the
      answers show whether you understand what a variable holds.

  - id: internals
    kind: internals
    concepts: [primitive-and-reference-types, reference-equality]
    title: How it works underneath
    body: |
      **Variables and objects.** Local variables live in the method's frame; objects live on the heap.
      (That is the language model. The JIT compiler may place things differently, but your code cannot
      tell.)

      **Assignment and parameters copy the variable's value.** Java is always *pass by value* (JLS 8.4.1):
      a parameter is a new variable initialised with the argument's value. For a reference, that value
      *is the reference*. So a method can change the object the caller's variable points to
      (`items.add(...)`), but not make the caller's variable point elsewhere (`items = new ArrayList<>()`
      only changes the parameter).

      **Boxing and the cache.** `Integer a = 127;` compiles (with javac) to `Integer.valueOf(127)`. The
      JLS (5.1.7) requires boxing a *constant expression* from -128 to 127 to give the same object every
      time, and the `Integer.valueOf` Javadoc promises to "always cache values in the range -128 to 127" -
      including values parsed at run time. Outside that range a default HotSpot JVM creates new objects -
      but that is not guaranteed either way.

      **String literals are shared.** Every `"SUCCEEDED"` literal in the program is the same `String`
      object (JLS 3.10.5), and so is a compile-time constant such as `"SUCC" + "EEDED"`. Strings built
      at run time - `substring`, concatenation with a variable, anything read from JSON, a file or an
      HTTP response - are separate objects.

      **Mixed comparisons unbox.** `Integer a = 1000; int b = 1000; a == b` is `true`: when one side is
      a primitive number, `==` unboxes the other and compares values (JLS 15.21.1). With `a` null, it
      throws `NullPointerException`.

      **Overflow wraps.** `int` and `long` addition keeps only the low-order bits (JLS 15.18.2):
      `Integer.MAX_VALUE + 1` is the most negative `int`, with no error. `Math.addExact` and friends throw
      `ArithmeticException` instead.

  - id: visual
    kind: visual
    concepts: [primitive-and-reference-types, reference-equality]
    title: "Diagram: three variables, two objects"
    body: |
      ```mermaid
      flowchart LR
          subgraph frame["Variables in the method"]
              r["retries = 3"]
              a["a"]
              b["b"]
              c["c"]
          end
          subgraph heap["Objects on the heap"]
              m1["Money 19.99 EUR - object 1"]
              m2["Money 19.99 EUR - object 2"]
          end
          a --> m1
          b --> m1
          c --> m2
      ```

      `Money b = a;` copied the reference, so `a` and `b` lead to **one** object; `c` was created with
      `new`. Then:

      - `a == b` is `true` - the same object; a change made through `b` is visible through `a`.
      - `a == c` is `false` - two objects, even though they hold the same amount.
      - `a.equals(c)` is `true` **only if `Money` overrides `equals`** - the next Java lesson,
        [equals and hashCode](#/lesson/java-equals-hashcode).

  - id: when
    kind: when
    concepts: [numeric-types-for-money, primitive-and-reference-types]
    title: Which type to use when
    body: |
      | Need | Use | Why |
      |---|---|---|
      | counters, sizes, indexes | `int` | fast; overflow is not a practical risk |
      | ids, epoch-millisecond timestamps, large totals | `long` | `int` overflows |
      | **money** | `long` minor units, or `BigDecimal` | exact; see the trade-offs below |
      | measurements where tiny errors are fine (durations, percentages for a chart) | `double` | fast, approximate |
      | a number that may be missing (an optional JSON field) | `Integer` / `Long` | `null` means unknown - and unboxing it throws |
      | elements of a collection | wrappers (`List<Long>`) | generics need reference types |

      **Minor units depend on the currency.** EUR and INR have two decimal places, JPY has none, and some
      currencies have three (ISO 4217 lists them). `java.util.Currency.getInstance("JPY")
      .getDefaultFractionDigits()` returns 0. Never hard-code "multiply by 100" without knowing the
      currency.

      **Compare with:** `equals` for objects, `==` for primitives and enums, `assertSame` in a test that
      really means "the same object".

  - id: example
    kind: example
    concepts: [reference-equality]
    title: "Real-world example: the wait that never finished"
    body: |
      An automation helper waits for a SandPay payment to settle:

      ```java
      String status = client.getPayment(paymentId).status();
      while (status != "SUCCEEDED") {          // compares references, not text
          Thread.sleep(500);
          status = client.getPayment(paymentId).status();
      }
      ```

      Its unit test used a stubbed client returning the literal `"SUCCEEDED"`, so it passed. Against the
      real sandbox the JSON parser builds a **new** `String` for every response, `!=` is always `true`,
      and the loop runs until the test times out. The team retried it twice and marked it "flaky".

      **Evidence that pins it down:** the log prints `status=SUCCEEDED` while the loop continues; in the
      debugger `status.equals("SUCCEEDED")` is `true` while `status == "SUCCEEDED"` is `false`.
      **Fix:** `"SUCCEEDED".equals(status)`, or better, parse the text once into an `enum` at the edge of
      the client - enum constants are single objects, so `==` on them is correct. IDE inspections and
      static analysers (SpotBugs reports it as `ES_COMPARING_STRINGS_WITH_EQ`) flag the original line.

  - id: code
    kind: code
    concepts: [reference-equality, numeric-types-for-money]
    title: "Code: what each comparison prints"
    collapsed: true
    body: |
      ```java
      int x = 1000, y = 1000;
      System.out.println(x == y);              // true  - primitive values

      Integer a = 127, b = 127;
      System.out.println(a == b);              // true  - boxed from the guaranteed cache

      Integer c = 1000, d = 1000;
      System.out.println(c == d);              // false on a default JVM - never rely on either result
      System.out.println(c.equals(d));         // true

      String s1 = "SUCCEEDED";
      String s2 = "SUCCEEDED";
      String s3 = "status=SUCCEEDED".substring(7);
      System.out.println(s1 == s2);            // true  - literals are shared
      System.out.println(s1 == s3);            // false - built at run time
      System.out.println(s1.equals(s3));       // true

      System.out.println(0.1 + 0.2 == 0.3);    // false - neither side is exactly 0.3
      System.out.println(new BigDecimal("0.1").add(new BigDecimal("0.2")));   // 0.3
      System.out.println(new BigDecimal("2.0").equals(new BigDecimal("2.00"))); // false - scale differs
      System.out.println(new BigDecimal("2.0").compareTo(new BigDecimal("2.00"))); // 0 - same value

      System.out.println(Integer.MAX_VALUE + 1);          // -2147483648 - the most negative int, silently
      System.out.println(Math.addExact(Integer.MAX_VALUE, 1)); // throws ArithmeticException: integer overflow
      ```

      `new BigDecimal(0.1)` (from a `double`) is **not** 0.1: it is the exact value of the nearest binary
      fraction - on JDK 17 it prints `0.1000000000000000055511151231257827021181583404541015625`. Build `BigDecimal` from text (`new BigDecimal("0.1")`) or with
      `BigDecimal.valueOf(0.1)`, which goes through `Double.toString` and so gives 0.1.

  - id: tests
    kind: tests
    concepts: [reference-equality, numeric-types-for-money, primitive-and-reference-types]
    title: Tests that catch these bugs
    body: |
      Bugs from this lesson hide behind "convenient" test data. Choose data that removes the hiding place:

      | ID | Test | Why it catches the bug |
      |---|---|---|
      | E1 | compare a status **parsed** from a recorded response, not only a literal | `==` passes with literals |
      | E2 | boxed numbers **above 127** (use 1000) | the cache hides `==` for small values |
      | E3 | `null` wherever the contract allows it | unboxing and `null.equals` throw |
      | M1 | amounts such as 1.15, 0.29, and 0.10 + 0.20 | binary floating point cannot hold them |
      | M2 | totals near the type's limit | overflow wraps silently |
      | M3 | a zero-decimal currency (JPY) and a three-decimal one | hard-coded "times 100" |
      | A1 | build two objects from one test-data builder, change one, check the other | shared references |
      | A2 | run the test class in a different order, or one test alone | order-dependent shared state |

  - id: mistakes
    kind: mistakes
    concepts: [reference-equality, numeric-types-for-money, primitive-and-reference-types]
    title: Common mistakes and how to debug them
    body: |
      - **`==` on `String`, `Integer`, `Long`, `BigDecimal`.** Use `equals` (or `Objects.equals` when
        both sides may be null). `assertTrue(a == b)` in a test has the same bug - use `assertEquals`.
      - **Calling `equals` on something that may be null.** `status.equals("SUCCEEDED")` throws when
        `status` is null; `"SUCCEEDED".equals(status)` returns false.
      - **Unboxing null.** `int total = totals.get(key);` throws when the key is missing.
      - **`double` for money**, and `new BigDecimal(0.1)` instead of `new BigDecimal("0.1")`.
      - **`BigDecimal.equals` for values.** It compares scale too (`2.0` vs `2.00`); compare values with
        `compareTo(...) == 0`.
      - **Integer division.** `paid / total * 100` with `int`s is 0 for any partial payment; divide last
        or use `BigDecimal` with an explicit `RoundingMode`.
      - **Expecting a method to replace the caller's object** by assigning to its parameter.
      - **Handing out shared mutable objects** from constants and builders; give each caller a copy, or
        make the data immutable (`List.of`, records).

      **Debugging method:** when an equality "should" be true, print or inspect *identity* and *value*
      separately - `System.identityHashCode(x)` and `x.equals(y)` - or watch the object ids your debugger
      shows next to each variable. Two ids for "the same" value means `==` will be false.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [numeric-types-for-money]
    title: "Trade-offs: long minor units, BigDecimal or double"
    body: |
      | Option | Strengths | Costs |
      |---|---|---|
      | `long` minor units | exact, fast, trivial equality; matches APIs that send integer minor units (many payment APIs do - check each provider's documentation) | you must know each currency's decimals; percentages and splits need explicit rounding rules |
      | `BigDecimal` | exact decimal arithmetic at any scale; rounding is explicit (`RoundingMode`) | verbose; immutable (use the returned value); `equals` includes scale; slower |
      | `double` | fast and convenient | inexact for decimal money - totals drift and comparisons fail |

      In a real codebase, wrap the choice in a `Money` type with an amount and a currency, so nobody adds
      euros to rupees. Libraries implementing the Java Money API (JSR 354) provide one; it is not part
      of the JDK.

  - id: summary
    kind: summary
    title: Summary and quick reference
    body: |
      - Primitive variable = the value. Reference variable = a reference to an object, or `null`.
      - Assignment and parameters copy the variable's value; Java is always pass by value.
      - `==`: values for primitives, **identity** for references. `equals`: meaning.
      - Literals and boxed -128..127 are shared objects - that is why `==` passes small tests.
      - Unboxing `null` throws. Compare nullable values with `"LITERAL".equals(x)` or `Objects.equals`.
      - Money: `long` minor units or `BigDecimal` from strings; never `double`. Use `Math.addExact` and
        friends to stop silent overflow.
      - Test with parsed strings, numbers above 127, nulls, awkward amounts and limits.

exercises:
  - id: what-gets-printed
    type: mcq
    concept: primitive-and-reference-types
    skill: recognition
    title: What gets printed?
    prompt: |
      ```java
      int a = 5;
      int b = a;
      b++;

      List<String> x = new ArrayList<>(List.of("card"));
      List<String> y = x;
      y.add("wallet");

      System.out.println(a + " " + x.size());
      ```
    options:
      - id: five-two
        text: "`5 2`"
        feedback: Correct - `b` got its own copy of 5, but `y` got a copy of the reference, so both names lead to one list.
      - id: six-two
        text: "`6 2`"
        feedback: "`b = a` copies the value 5 into a separate variable; incrementing `b` cannot change `a`."
      - id: five-one
        text: "`5 1`"
        feedback: "`y = x` does not copy the list - it copies the reference. Adding through `y` changes the one list both variables lead to."
      - id: six-one
        text: "`6 1`"
        feedback: This mixes up both cases - primitives are copied by value, and copying a reference shares the object.
    correct: [five-two]
    hints:
      - Ask what each variable *holds* - a value, or directions to an object?
    solution: |
      **`5 2`.** `int b = a` copies the value, so `a` stays 5. `List<String> y = x` copies the
      *reference*, so `x` and `y` lead to the same list, which now has two elements. To get an
      independent list, copy it: `new ArrayList<>(x)`.
    followUp: |
      Replace `List<String> y = x;` with `List<String> y = List.copyOf(x);`. What does `y.add("wallet")`
      do now, and why might that be *better* behaviour for shared test data?

  - id: aliasing-in-test-data
    type: debug
    concept: primitive-and-reference-types
    skill: analysis
    title: The test that fails only in a full run
    prompt: |
      `standardOrderHasOneItem` passes when you run it alone and fails when the whole class runs. (JUnit
      runs test methods in an order that is deterministic but intentionally not obvious.) Click the line
      that causes the failure.
    language: java
    code: |
      class OrderData {
          static final List<String> DEFAULT_ITEMS = new ArrayList<>(List.of("coffee"));

          static Order standardOrder() {
              Order order = new Order();
              order.items = DEFAULT_ITEMS;
              return order;
          }
      }

      class OrderTest {
          @Test
          void orderWithTwoItems() {
              Order order = OrderData.standardOrder();
              order.items.add("cake");
              assertEquals(2, order.items.size());
          }

          @Test
          void standardOrderHasOneItem() {
              assertEquals(1, OrderData.standardOrder().items.size());
          }
      }
    correctLines: [6]
    lineNotes:
      - line: 2
        note: "`final` stops the variable from being reassigned - it does not stop the list from changing. Making it `List.of(...)` would turn the bug into an exception in the test that adds, which is louder, but every order would still share one list."
      - line: 15
        note: Adding to your own order is reasonable test code - it would be harmless if the order had its own list.
      - line: 21
        note: This assertion is right. It fails because another test changed the shared list.
    hints:
      - Which object does every order's `items` field point to?
      - Find the line where the builder hands out something that is not a fresh copy.
    solution: |
      **Line 6.** Every order gets a reference to the **same** `DEFAULT_ITEMS` list. When
      `orderWithTwoItems` runs first, it adds "cake" to that shared list, and every later order starts
      with two items.

      Fix: `order.items = new ArrayList<>(DEFAULT_ITEMS);` - each order gets its own list. Making the
      constant immutable (`List.of("coffee")`) as well turns any future accidental change into an
      immediate exception instead of a hidden one.

      **How to confirm before fixing:** run the class with `orderWithTwoItems` alone, then the other test
      alone, then both. Or print `System.identityHashCode(order.items)` for two orders - the same number
      means a shared list.
    followUp: |
      A `@BeforeAll static` method creates one `Customer` object that several tests modify. Which test
      symptoms would you expect, and what are two ways to fix it?

  - id: reassign-parameter
    type: mcq
    concept: primitive-and-reference-types
    skill: application
    title: Can a method replace the caller's list?
    prompt: |
      ```java
      static void clearItems(List<String> items) {
          items = new ArrayList<>();
      }

      List<String> cart = new ArrayList<>(List.of("coffee", "cake"));
      clearItems(cart);
      System.out.println(cart.size());
      ```

      What is printed?
    options:
      - id: two
        text: "`2`"
        feedback: Correct - the method only pointed its own parameter at a new list. The caller's `cart` still leads to the original list.
      - id: zero
        text: "`0`"
        feedback: That would be true if Java passed variables by reference. It passes the *value* of the reference, so assigning to the parameter cannot change `cart`.
      - id: compile
        text: It does not compile - parameters cannot be reassigned.
        feedback: Parameters are ordinary local variables; reassigning them compiles unless they are declared `final`.
      - id: npe
        text: It throws `NullPointerException`.
        feedback: Nothing here is null - both lists exist. The method simply changes which list its own parameter refers to.
    correct: [two]
    hints:
      - "`items` is a new variable that starts with a copy of `cart`'s value. What is that value?"
    solution: |
      **`2`.** The parameter `items` starts as a copy of the reference in `cart`. `items = new
      ArrayList<>()` makes the *parameter* refer to a new list; `cart` is untouched. To empty the
      caller's list, change the object instead: `items.clear()`.
    followUp: |
      Write a method `void addFee(long fee, List<Long> lines)` that adds the fee to the caller's list.
      Then explain why `void addFee(long fee, long total)` cannot change the caller's total.

  - id: fix-status-checks
    type: coding
    concept: reference-equality
    skill: analysis
    title: Fix the checks that pass quick tests
    prompt: |
      `PaymentChecks` has two methods that compile, look right and pass quick tests with literals and
      small numbers. Run the tests, read the failures, and fix both methods without changing their
      signatures. Before you change anything, write down *why* `isSucceeded` returns false for a status
      parsed from a response.
    project: java
    files:
      - src/exercises/java/learnerapp/basics/PaymentChecks.java
    test: src/test/java/learnerapp/basics/PaymentChecksTest.java
    command: mvn test -Dtest=PaymentChecksTest
    hints:
      - Look at the failing tests' inputs. Where do the strings come from, and how big are the numbers?
      - "`==` on two references asks whether they are the same object. Literals and boxed numbers from -128 to 127 happen to be shared objects."
      - Use `equals` - and check which side can be null, and what the Javadoc says about two unknown counts.
    modelAnswer: |
      ```java
      public static boolean isSucceeded(String status) {
          return "SUCCEEDED".equals(status);     // literal first: null gives false, not an exception
      }

      public static boolean sameAttemptCount(Integer clientCount, Integer serverCount) {
          return clientCount != null && clientCount.equals(serverCount);
      }
      ```

      `==` passed for `"SUCCEEDED"` literals (shared, interned objects) and for 3 (from the `Integer`
      cache). A status cut out of a response body and a boxed 1000 are separate objects, so `==` was
      false. `Objects.equals(a, b)` would be wrong for the second method: it returns true for two nulls,
      and the Javadoc says unknown never matches.
    rubric:
      - Every test in PaymentChecksTest passes
      - isSucceeded compares with equals and returns false for null without throwing
      - sameAttemptCount returns false when either count is null, including both
      - Explained why == passed for literals and small numbers but failed for parsed or large values
    solution: |
      The habit to build: **`equals` for objects, every time** - and when you write a test for an
      equality check, feed it values that are equal but *not the same object* (parsed text, numbers above
      127). The reference solution is in `src/solutions/java/learnerapp/basics/PaymentChecks.java`.
    followUp: |
      Replace the `String` status with an `enum PaymentStatus { PENDING, SUCCEEDED, FAILED }` parsed once
      with `PaymentStatus.valueOf(text)`. Why is `==` correct for enum constants, and what happens when the
      provider sends a status your enum does not know?

  - id: integer-cache
    type: mcq
    concept: reference-equality
    skill: application
    title: Passes for 3 retries, fails for 200
    prompt: |
      A test helper compares retry counts read from two JSON responses:

      ```java
      Integer expected = expectedResponse.retries();
      Integer actual = actualResponse.retries();
      assertTrue(expected == actual);
      ```

      It passes when both responses say 3 retries and fails when both say 200. What is the most likely
      cause?
    options:
      - id: cache
        text: "Boxed values from -128 to 127 are shared objects, so `==` happens to be true for 3; 200 is boxed into two separate objects."
        feedback: Correct - `==` compares identity. The cache makes small values look fine and hides the bug.
      - id: parser
        text: The JSON parser reads numbers above 127 incorrectly.
        feedback: The parser reads 200 correctly in both responses - print them and you'll see 200 twice. The comparison is what's wrong.
      - id: hash
        text: "`==` compares hash codes, and 200 has two different hash codes."
        feedback: "`==` on references compares identity, not hash codes. (Two `Integer`s holding 200 have the same hash code: 200.)"
      - id: byte
        text: 200 does not fit in a `byte`, so it overflows.
        feedback: Nothing here is a `byte` - the values are `Integer` objects, which hold any `int`.
    correct: [cache]
    hints:
      - What does `==` compare when both sides are objects?
      - Which `Integer` values does Java guarantee to share?
    solution: |
      **The `Integer` cache.** `Integer.valueOf` returns shared objects for -128 to 127, so two boxed 3s
      are one object and `==` is true. Two boxed 200s are normally two objects. Fix:
      `assertEquals(expected, actual)` - it uses `equals` and gives a readable failure message.
    followUp: |
      Change one line so the comparison works by *value* while still using `==`. (Hint - what happens
      when one side of `==` is a primitive?) Then explain why `assertEquals` is still the better choice.

  - id: money-in-minor-units
    type: coding
    concept: numeric-types-for-money
    skill: application
    title: Money as minor units
    prompt: |
      Implement `MinorUnits.parse`, `sum` and `format` as their Javadoc describes. The tests use amounts
      that binary floating point cannot hold exactly, so don't use `double` or `float` anywhere -
      including "just for parsing".
    project: java
    files:
      - src/exercises/java/learnerapp/basics/MinorUnits.java
    test: src/test/java/learnerapp/basics/MinorUnitsTest.java
    command: mvn test -Dtest=MinorUnitsTest
    hints:
      - Check the text's shape first - a regular expression for "digits, optionally a dot and one or two digits" is fine - then convert.
      - "`new BigDecimal(text)` is exact. `movePointRight(2)` turns 19.99 into 1999, and one `BigDecimal` method converts to `long` but throws if the value does not fit."
      - "`Math.addExact` throws instead of wrapping. `BigDecimal.valueOf(minorUnits, 2).toPlainString()` formats with two decimals."
    modelAnswer: |
      ```java
      private static final Pattern AMOUNT = Pattern.compile("\\d+(\\.\\d{1,2})?");

      public static long parse(String amount) {
          if (amount == null || !AMOUNT.matcher(amount).matches()) {
              throw new IllegalArgumentException("Not an amount with at most two decimals: " + amount);
          }
          try {
              return new BigDecimal(amount).movePointRight(2).longValueExact();
          } catch (ArithmeticException tooLarge) {
              throw new IllegalArgumentException("Amount does not fit in a long: " + amount, tooLarge);
          }
      }

      public static long sum(long... amounts) {
          long total = 0;
          for (long amount : amounts) total = Math.addExact(total, amount);
          return total;
      }

      public static String format(long minorUnits) {
          return BigDecimal.valueOf(minorUnits, 2).toPlainString();
      }
      ```

      Splitting on the dot and using `Long.parseLong` with `Math.multiplyExact` works too.
    rubric:
      - Every test in MinorUnitsTest passes
      - No double or float anywhere in the solution
      - Invalid text is rejected with IllegalArgumentException before any conversion
      - Overflow throws instead of wrapping around (longValueExact, addExact or explicit checks)
    solution: |
      The tests encode the classic traps: `1.15 * 100` is slightly less than 115 as a `double` (114.999...,
      so a cast gives 114), `0.10 + 0.20` is not `0.30`, and a total past `Long.MAX_VALUE` wraps to a negative number
      unless something checks. The reference solution is in
      `src/solutions/java/learnerapp/basics/MinorUnits.java`.
    followUp: |
      Change `parse` to take a `java.util.Currency` and use `getDefaultFractionDigits()` instead of
      assuming two decimals. Which test cases would you add for JPY?

  - id: exact-total
    type: mcq
    concept: numeric-types-for-money
    skill: application
    title: Which totals are exact?
    prompt: |
      A reconciliation test sums refund amounts that arrive as text, such as `"0.10"` and `"0.20"`, and
      compares the total with the provider's report. Which approaches give an **exact** total? Select
      every one that applies.
    options:
      - id: double-sum
        text: "`double total += Double.parseDouble(text)`, then compare with the expected `double`"
        feedback: 0.10 and 0.20 have no exact binary representation, so the sum is slightly off and an exact comparison fails.
      - id: double-round
        text: "Sum as `double`, then round to two decimals at the end"
        feedback: Rounding hides small errors in small sums, but the error grows with the number of lines, and rounding at the end can still land on the wrong cent. It is not exact arithmetic.
      - id: bigdecimal-text
        text: "`BigDecimal` built from the text, summed with `add`"
        feedback: Correct - `new BigDecimal("0.10")` is exactly 0.10, and `add` is exact.
      - id: bigdecimal-double
        text: "`new BigDecimal(Double.parseDouble(text))`, summed with `add`"
        feedback: The damage is done by the `double` - this builds a BigDecimal from the inexact binary value, with dozens of digits.
      - id: long-minor
        text: "`long` minor units (10 and 20), summed with `Math.addExact`"
        feedback: Correct - whole numbers are exact, and `addExact` refuses to overflow silently.
    correct: [bigdecimal-text, long-minor]
    hints:
      - Which of these ever passes the amount through a binary floating-point value?
    solution: |
      **`BigDecimal` from text, and `long` minor units.** Every option that goes through a `double`
      inherits its representation error, even if a `BigDecimal` comes later.
    followUp: |
      The provider reports amounts as integers in minor units, and your test data is decimal text. Where
      would you convert, and which tests prove the conversion right?

  - id: interview-equals-vs-double-equals
    type: interview
    concept: reference-equality
    skill: application
    title: "Interview: == versus equals"
    prompt: |
      **Interviewer:** "What is the difference between `==` and `equals` in Java? Give me an example where
      using the wrong one causes a bug in test automation."
    hints:
      - Cover primitives, references, the default `equals`, and why the bug can hide in tests.
    modelAnswer: |
      - For primitives, `==` compares values. For references, it compares identity - whether both point
        to the same object.
      - `equals` compares meaning. `Object.equals` is identity by default; `String`, `Integer`,
        `BigDecimal`, records and well-written value classes override it.
      - Example: `status == "SUCCEEDED"` in a wait loop. Literals are interned, so a unit test with a
        literal passes; a status parsed from a real response is a separate object, so the loop never
        exits. The same happens with boxed numbers above 127.
      - Use `"SUCCEEDED".equals(status)` (null-safe), `Objects.equals`, or parse into an enum; in tests,
        `assertEquals` - and `assertSame` only when identity really matters.
    followUps:
      - "Why does `Integer a = 100, b = 100; a == b` return true, but not for 1000?"
      - When is `==` the right choice for objects?
      - "What happens with `Integer count = null; if (count == 0) ...`?"
    rubric:
      - Distinguished value comparison for primitives from identity comparison for references
      - Said equals is identity unless the class overrides it
      - Gave a concrete automation bug such as a status check or wait loop
      - Explained why the bug hides in tests (interned literals or the Integer cache)
      - Named the fix (equals with the literal first, Objects.equals, enums, assertEquals)
    solution: |
      Strong answers explain **why the bug survives testing** - the shared literals and the `Integer`
      cache - not only the definitions.

  - id: explain-pass-by-value
    type: short
    concept: primitive-and-reference-types
    skill: recall
    title: Pass by value, with objects
    prompt: |
      In two to four sentences: is Java pass-by-value or pass-by-reference? Use a method that receives a
      `List` to show what it can and cannot do to the caller's list.
    hints:
      - What exactly is copied into the parameter when the argument is a reference?
    modelAnswer: |
      Java is always pass-by-value: the parameter is a new variable holding a copy of the argument's
      value. For an object, that value is a reference, so the method can change the object the caller's
      variable points to - `items.add("x")` or `items.clear()` are visible to the caller. But assigning a
      new list to the parameter (`items = new ArrayList<>()`) only changes the parameter, not the caller's
      variable.
    rubric:
      - Said Java is always pass-by-value
      - Said that for objects the value copied is the reference
      - Showed the method can change the object (add, clear)
      - Showed that reassigning the parameter does not affect the caller
    solution: |
      The one-line version for interviews: **"Java passes references by value."**

recall:
  - id: recall-reference-holds
    concept: primitive-and-reference-types
    prompt: What does a reference variable hold?
    answer: A reference to an object, or null - never the object itself. Copying the variable copies the reference, so both variables lead to one object.
  - id: recall-pass-by-value
    concept: primitive-and-reference-types
    prompt: Can a method make the caller's variable refer to a different object?
    answer: No. Java passes the value of the reference; the method can change the object, but assigning to its parameter only changes the parameter.
  - id: recall-double-equals
    concept: reference-equality
    prompt: What does == compare for two references?
    answer: Identity - whether both refer to the same object. Use equals to compare meaning.
  - id: recall-integer-cache
    concept: reference-equality
    prompt: Which boxed int values does Java guarantee to be shared objects?
    answer: -128 to 127 - the Integer.valueOf Javadoc promises to always cache that range (JLS 5.1.7 guarantees it for constant expressions). That is why == on small boxed numbers seems to work.
  - id: recall-null-safe
    concept: reference-equality
    prompt: How do you compare a possibly-null String with a constant without risking an exception?
    answer: Put the constant first - "SUCCEEDED".equals(status) - or use Objects.equals(a, b).
  - id: recall-money-double
    concept: numeric-types-for-money
    prompt: Why not use double for money?
    answer: Most decimal fractions (0.1, 1.15) have no exact binary representation, so sums drift and exact comparisons fail. Use long minor units or BigDecimal from strings.
  - id: recall-bigdecimal-equals
    concept: numeric-types-for-money
    prompt: Is new BigDecimal("2.0").equals(new BigDecimal("2.00")) true?
    answer: No - BigDecimal.equals compares the scale too. Compare values with compareTo(...) == 0.
  - id: recall-overflow
    concept: numeric-types-for-money
    prompt: What happens when long or int addition overflows, and how do you stop it?
    answer: It wraps around silently to the opposite sign. Math.addExact (and multiplyExact, subtractExact) throw ArithmeticException instead.

