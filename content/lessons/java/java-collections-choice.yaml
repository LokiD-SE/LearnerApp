placement:
  - id: place-lookup
    type: mcq
    concept: collection-types
    skill: application
    title: Payments by id
    prompt: |
      A test helper repeatedly needs "the payment with id X" from 50,000 payments. Which structure fits?
    options:
      - id: map
        text: "`Map<String, Payment>` - a HashMap from id to payment"
        feedback: Correct - one lookup per question, constant time on average.
      - id: list-scan
        text: "`List<Payment>` and a loop that compares ids"
        feedback: Each lookup scans up to 50,000 payments.
      - id: treeset
        text: "`TreeSet<Payment>` sorted by amount"
        feedback: Sorted by the wrong thing for this question, and a set doesn't look things up by id.
      - id: deque
        text: "`ArrayDeque<Payment>`"
        feedback: A deque is for the ends - finding by id is a scan.
    correct: [map]
    solution: |
      **A map by id.** Build it once (`toMap` or a loop), then every lookup is cheap.

  - id: place-quadratic
    type: mcq
    concept: collection-performance
    skill: application
    title: How long will it take?
    prompt: |
      `for (String id : ours) if (!theirs.contains(id)) missing.add(id);` - both are ArrayLists with
      200,000 ids. About how many string comparisons can this need in the worst case?
    options:
      - id: forty-billion
        text: About 40 billion (200,000 × 200,000)
        feedback: Correct - each contains can scan the whole other list.
      - id: four-hundred-thousand
        text: About 400,000
        feedback: That's what a HashSet-based version needs, roughly - not this one.
      - id: two-hundred-thousand
        text: About 200,000
        feedback: That counts the outer loop only; each contains is a scan of its own.
      - id: log
        text: About 3.5 million (n log n)
        feedback: There's no sorting or tree here - just a scan per element.
    correct: [forty-billion]
    solution: |
      **About 40 billion** - quadratic. With `new HashSet<>(theirs)` it's about 400,000 operations.

  - id: place-remove
    type: mcq
    concept: collection-pitfalls
    skill: application
    title: Removing while iterating
    prompt: |
      Which way of removing every settled id from an `ArrayList` is correct?
    options:
      - id: remove-if
        text: "`pending.removeIf(settled::contains);`"
        feedback: Correct - safe and clear.
      - id: for-each
        text: A for-each loop calling `pending.remove(id)` for settled ids
        feedback: Changing the list behind the loop's iterator throws ConcurrentModificationException.
      - id: index-forward
        text: A `for (int i = 0; i < pending.size(); i++)` loop calling `pending.remove(i)` for settled ids
        feedback: No exception, but after each removal the next element shifts into position i and is skipped.
      - id: stream-foreach
        text: "`pending.stream().filter(settled::contains).forEach(pending::remove);`"
        feedback: Modifying the source of a stream while it runs breaks the stream's non-interference rule and the result is not defined. On OpenJDK 17 it threw ConcurrentModificationException when settled was a HashSet - and NullPointerException when settled was a Set.of, because the shifted array exposed a null.
    correct: [remove-if]
    solution: |
      **`removeIf`** (or an explicit iterator with `iterator.remove()`).
