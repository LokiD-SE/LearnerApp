id: java-collections-choice
title: Choosing the right collection
subject: java
module: java-collections-generics
level: intermediate
status: published
estimatedMinutes: 50
summary: Lists, sets, maps and queues by what they guarantee and what they cost - and the unmodifiable, fixed-size and concurrent-modification traps that break test code.
tags: [java, collections, list, set, map, deque, hashmap, treemap, big o, performance, immutability, interview]

environment: |
  - **Language:** Java 17 or later. `List.of`, `Set.of` and `Map.of` arrived in Java 9, `List.copyOf` in
    Java 10. Complexities and guarantees come from the Javadoc of the collection interfaces and classes
    in `java.util`.
  - **Implementation details, labelled:** iteration orders that the Javadoc leaves unspecified (for
    `HashMap`, `HashSet`, `Set.of`, `Map.of`) can differ between Java versions - and for `Set.of` and
    `Map.of`, between runs of the same program. Big-O figures are the documented or typical costs, not
    measurements.
  - **Practice project:** `practice/java` - JDK 17+, Maven 3.8+, JUnit 6.
  - **Examples:** the four-hour reconciliation is an illustrative scenario. The exceptions in the code
    and the debug exercise were checked by running the lines on OpenJDK 17.0.20.
  - **Sources (Java SE 17 Javadoc):**
    - [`List`](https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/util/List.html) (unmodifiable lists: `List.of`, `List.copyOf`, "disallow null elements"),
      [`Set`](https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/util/Set.html) ("the iteration order of set elements is unspecified and is subject to change"),
      [`Map`](https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/util/Map.html).
    - [`ArrayList`](https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/util/ArrayList.html) (constant-time `get`, amortized constant-time `add`, fail-fast iterators
      "on a best-effort basis"), [`LinkedList`](https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/util/LinkedList.html), [`ArrayDeque`](https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/util/ArrayDeque.html)
      ("likely to be faster than Stack when used as a stack, and faster than LinkedList when used as a queue").
    - [`HashMap`](https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/util/HashMap.html), [`HashSet`](https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/util/HashSet.html), [`LinkedHashMap`](https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/util/LinkedHashMap.html)
      (insertion or access order), [`TreeMap`](https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/util/TreeMap.html) (Red-Black tree, "guaranteed log(n) time cost
      for the containsKey, get, put and remove operations").
    - [`Arrays.asList`](https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/util/Arrays.html#asList(T...)) (fixed-size, writes through to the array),
      [`Collections.unmodifiableList`](https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/util/Collections.html#unmodifiableList(java.util.List)) (a view),
      [`Collection.removeIf`](https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/util/Collection.html#removeIf(java.util.function.Predicate)),
      [`ConcurrentModificationException`](https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/util/ConcurrentModificationException.html),
      [`Stream.toList`](https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/util/stream/Stream.html#toList()) (Java 16, unmodifiable, allows nulls).

prerequisites:
  - java-equals-hashcode

concepts:
  - id: collection-types
    name: Collection types
    summary: List, Set, Map and Queue or Deque - what each guarantees about order, duplicates and lookup by key, and the common implementations.
  - id: collection-performance
    name: Choosing by access pattern
    summary: The operations you repeat decide the collection - contains is a scan on a list and constant time on average on a hash set; sorted structures cost log n.
  - id: collection-pitfalls
    name: Collection pitfalls
    summary: List.of is unmodifiable, Arrays.asList is fixed-size, unmodifiable views follow the original, and removing during a for-each loop throws ConcurrentModificationException.

objectives:
  - Choose a collection from the guarantees a task needs - order, uniqueness, lookup by key, ends of a queue.
  - Estimate the cost of a loop over collections and replace a quadratic algorithm with a linear one.
  - Avoid unmodifiable, fixed-size and concurrent-modification surprises, and order-dependent assertions.
  - Explain the trade-offs between common implementations in an interview.

sections:
  - id: intuition
    kind: intuition
    concepts: [collection-types, collection-performance]
    title: The idea in plain language
    body: |
      - A **list** is a queue of people in order. Finding "is Asha here?" means looking at everyone.
      - A **set** is a guest list at the door: no one is on it twice, and the bouncer checks a name
        instantly (a hash set) - or keeps it alphabetical (a sorted set), which takes a little longer.
      - A **map** is a cloakroom: you hand in a ticket (the key) and get exactly your coat back.
      - A **deque** is a stack of trays or a ticket queue: you work at the ends.

      Pick by **what you will ask most often**. Asking "is it there?" 200,000 times of a list of 200,000
      means 40 billion looks in the worst case; asking a set means 200,000.

  - id: what
    kind: what
    concepts: [collection-types]
    title: What each type guarantees
    body: |
      | Interface | Guarantees | Main implementations |
      |---|---|---|
      | `List` | order by index; duplicates allowed | `ArrayList` (default), `LinkedList` (rarely better) |
      | `Set` | no duplicates (by `equals`/`hashCode`, or by comparison for sorted sets) | `HashSet` (no order), `LinkedHashSet` (insertion order), `TreeSet` (sorted) |
      | `Map` | one value per key | `HashMap` (no order), `LinkedHashMap` (insertion or access order), `TreeMap` (sorted keys) |
      | `Queue` / `Deque` | work at one or both ends | `ArrayDeque` (stack and queue), `PriorityQueue` (smallest first) |

      **Typical costs** (n = size):

      | Operation | `ArrayList` | `LinkedList` | `HashSet` / `HashMap` | `TreeSet` / `TreeMap` |
      |---|---|---|---|---|
      | get by index | O(1) | O(n) | - | - |
      | contains / get by key | O(n) | O(n) | O(1) average | O(log n) |
      | add at the end | O(1) amortised | O(1) | O(1) average | O(log n) |
      | insert or remove in the middle | O(n) | O(1) once you are there, but getting there is O(n) | - | - |

      `ArrayDeque`'s Javadoc says it is likely faster than `Stack` as a stack and faster than `LinkedList`
      as a queue - use it for both.

  - id: why
    kind: why
    concepts: [collection-performance, collection-pitfalls]
    title: Why testers need to choose well
    body: |
      - **Reconciliation and data checks** compare large lists - payments versus settlement reports, sent
        webhooks versus received ones. A list-based comparison that is fine for 100 rows takes hours for a
        day's data.
      - **Assertions depend on guarantees.** Asserting the *order* of a `HashSet` or `Map.of` makes a test
        that passes today and fails on another JVM version - or on the next run.
      - **Test data built with `List.of` or `Arrays.asList`** throws `UnsupportedOperationException` the
        first time a helper tries to add to it.
      - **Cleanup loops** that remove items while iterating throw `ConcurrentModificationException`.

  - id: internals
    kind: internals
    concepts: [collection-performance, collection-types]
    title: How the common implementations work
    body: |
      - **`ArrayList`** holds an array. `get(i)` is a direct index. Adding at the end is usually a write;
        when the array is full it is copied into a larger one (about 1.5 times larger in OpenJDK), which
        averages out ("amortised O(1)"). Inserting or removing in the middle shifts everything after it.
      - **`LinkedList`** holds nodes that point to each other. Inserting is cheap *at a node you already
        have*, but finding the node walks the list - and the nodes are scattered in memory, which makes
        iteration slower than an array in practice.
      - **`HashMap` / `HashSet`** pick a bucket from the key's `hashCode` and compare with `equals` inside
        it ([equals and hashCode](#/lesson/java-equals-hashcode)). Average constant time; order is whatever
        the buckets give.
      - **`TreeMap` / `TreeSet`** are red-black trees ordered by `compareTo` or a `Comparator`. Lookups take
        log n steps; iteration is sorted; you get range queries (`headMap`, `ceilingKey`, ...).
      - **`LinkedHashMap` / `LinkedHashSet`** add a linked list through the entries to remember insertion
        order - hash speed with predictable iteration.

      **Fail-fast iterators.** `ArrayList`, `HashMap` and most other `java.util` collections count
      structural changes. If the collection changes while an iterator is in use - except through the
      iterator's own `remove` - the iterator throws `ConcurrentModificationException`, "on a best-effort
      basis" (the Javadoc's words: it is a bug detector, not a guarantee).

  - id: visual
    kind: visual
    concepts: [collection-types]
    title: "Flowchart: choosing a collection"
    body: |
      ```mermaid
      flowchart TD
          A["What will you do most?"] --> B{"Look up values by a key?"}
          B -->|Yes| M{"Order of keys?"}
          M -->|None needed| HM["HashMap"]
          M -->|Insertion order| LHM["LinkedHashMap"]
          M -->|Sorted| TM["TreeMap"]
          B -->|No| C{"Each element at most once?"}
          C -->|Yes| S{"Order of elements?"}
          S -->|None needed| HS["HashSet"]
          S -->|Insertion order| LHS["LinkedHashSet"]
          S -->|Sorted| TS["TreeSet"]
          C -->|No| D{"Add and remove at the ends?"}
          D -->|Yes| AD["ArrayDeque"]
          D -->|No| AL["ArrayList"]
      ```

      When unsure: `ArrayList`, `HashMap`, `HashSet` - and a deliberate reason for anything else.

  - id: when
    kind: when
    concepts: [collection-pitfalls, collection-types]
    title: Unmodifiable, fixed-size, view or copy?
    body: |
      | Expression | Can you add or remove? | Can you `set`? | Nulls? | Follows the original? |
      |---|---|---|---|---|
      | `new ArrayList<>(other)` | yes | yes | yes | no - a copy |
      | `List.of(a, b)` | no | no | **no** - even `contains(null)` throws | - |
      | `List.copyOf(other)` | no | no | no | no - a copy |
      | `Arrays.asList(a, b)` | **no** (fixed size) | yes | yes | writes go through to the array |
      | `Collections.unmodifiableList(other)` | no | no | yes | **yes** - a read-only view |
      | `stream.toList()` (Java 16+) | no | no | yes | no |

      Use the unmodifiable ones for constants and for data you hand out; copy into an `ArrayList` when a
      helper needs to change it.

  - id: example
    kind: example
    concepts: [collection-performance]
    title: "Real-world example: the nightly reconciliation that took four hours"
    body: |
      A nightly job compared the day's SandPay payments with the provider's settlement report:

      ```java
      for (String id : ours) {
          if (!theirs.contains(id)) missing.add(id);     // theirs is an ArrayList
      }
      ```

      It took seconds in the test environment (a few hundred payments) and four hours in production
      (around 200,000 on each side). Nobody noticed until the job overran into the morning.

      **Evidence:** a profiler showed almost all the time in `ArrayList.indexOf`, called from `contains`.
      The work was proportional to n × m.

      **Fix:** one line - `Set<String> settled = new HashSet<>(theirs);` - and `settled.contains(id)`. The
      job ran in under a second. A performance test with a realistic data volume now runs in CI. You fix
      the same code in the coding exercise.

  - id: code
    kind: code
    concepts: [collection-types, collection-pitfalls]
    title: "Code: the right collection, and the traps"
    collapsed: true
    body: |
      ```java
      // membership checks: a set
      Set<String> settled = new HashSet<>(reportIds);
      List<String> missing = ourIds.stream().filter(id -> !settled.contains(id)).toList();

      // counting per key: a map with merge
      Map<String, Long> totals = new TreeMap<>();                 // sorted by currency
      for (Payment p : payments) totals.merge(p.currency(), p.amountMinor(), Long::sum);

      // a work queue
      Deque<String> toCheck = new ArrayDeque<>(pendingIds);
      while (!toCheck.isEmpty()) check(toCheck.poll());

      // removing while iterating
      pending.removeIf(settled::contains);                        // safe
      for (Iterator<String> it = pending.iterator(); it.hasNext(); ) {
          if (settled.contains(it.next())) it.remove();           // also safe
      }

      // traps
      List<String> fixed = Arrays.asList("pay_1", "pay_2");
      fixed.add("pay_3");                                         // UnsupportedOperationException
      List.of("pay_1").contains(null);                            // NullPointerException
      ```

  - id: tests
    kind: tests
    concepts: [collection-performance, collection-pitfalls]
    title: Tests that catch collection bugs
    body: |
      | ID | Test | Catches |
      |---|---|---|
      | C1 | a realistic data volume (a day's payments), with a time limit | quadratic algorithms |
      | C2 | duplicates in the input | lists used where uniqueness was assumed |
      | C3 | assert collections by content, not by `toString` or iteration order (unless order is promised) | order-dependent assertions |
      | C4 | pass `List.of(...)` and `Arrays.asList(...)` into helpers | helpers that try to modify their input |
      | C5 | remove several items, including the first and the last | `ConcurrentModificationException` and skipped elements |
      | C6 | `null` elements and keys where the API allows them | `List.of` / `Map.of` rejecting nulls |

      For C3, JUnit's `assertEquals` on two `Set`s or two `Map`s compares contents, whatever the order.

  - id: mistakes
    kind: mistakes
    concepts: [collection-pitfalls, collection-performance, collection-types]
    title: Common mistakes
    body: |
      - **`list.contains` inside a loop** over another large list.
      - **`LinkedList` "because we insert a lot"** - it is rarely faster in practice than `ArrayList`.
      - **Asserting the order of a `HashSet`, `HashMap`, `Set.of` or `Map.of`** - unspecified; `Set.of`
        and `Map.of` can change order between runs.
      - **Modifying `List.of` or `Arrays.asList` results.**
      - **Expecting `Collections.unmodifiableList` to be a snapshot** - it shows later changes to the
        original.
      - **Removing in a for-each loop** - use `removeIf` or the iterator's `remove`.
      - **Mutable objects as keys** whose `hashCode` changes after insertion.
      - **Raw types** (`List` instead of `List<String>`) - the compiler can no longer check what goes in.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [collection-performance, collection-types]
    title: Trade-offs
    body: |
      | Choice | Gains | Costs |
      |---|---|---|
      | `HashMap` over `TreeMap` | faster lookups | no ordering; iteration order unspecified |
      | `TreeMap` over `HashMap` | sorted iteration, range queries | log n per operation; needs comparable keys |
      | `LinkedHashMap` | predictable order with hash speed | a little more memory |
      | unmodifiable collections | safe to share, intent is clear | copies cost memory; helpers must copy to change |
      | streams over loops | declarative, fewer mutable variables | can hide repeated `contains` scans just as well as loops do |

  - id: summary
    kind: summary
    title: Summary and quick reference
    body: |
      - List = order and duplicates; Set = unique; Map = by key; Deque = ends.
      - Defaults: `ArrayList`, `HashSet`, `HashMap`, `ArrayDeque`. Sorted: `Tree*`. Insertion order:
        `LinkedHash*`.
      - Repeated membership checks → a set; repeated lookups by id → a map.
      - `List.of` (no changes, no nulls), `Arrays.asList` (fixed size), `unmodifiableList` (a view),
        `copyOf` (a copy).
      - Remove while iterating with `removeIf` or `iterator.remove()`.
      - Never assert an unspecified order.

exercises:
  - id: which-collection
    type: mcq
    concept: collection-types
    skill: recognition
    title: Ids seen so far
    prompt: |
      A webhook listener must record every payment id it has seen and answer "have I seen this id before?"
      thousands of times a second. Order doesn't matter. Which collection fits?
    options:
      - id: hashset
        text: "`HashSet<String>`"
        feedback: Correct - unique elements and constant-time membership checks on average.
      - id: arraylist
        text: "`ArrayList<String>`"
        feedback: contains scans the whole list, and duplicates would pile up.
      - id: treeset
        text: "`TreeSet<String>`"
        feedback: Correct answers, but log n per check and sorting nobody needs.
      - id: deque
        text: "`ArrayDeque<String>`"
        feedback: A deque is for working at the ends; contains is a scan.
    correct: [hashset]
    hints:
      - Which operation is repeated, and which collection makes it cheap?
    solution: |
      **`HashSet`** - and if many threads record ids at once, a concurrent set
      (`ConcurrentHashMap.newKeySet()`), which the [concurrency lesson](#/lesson/java-concurrency-basics)
      covers.
    followUp: |
      The listener now also needs "the ids in the order they arrived". What would you change?

  - id: unsupported-operations
    type: debug
    concept: collection-pitfalls
    skill: analysis
    title: Which lines throw?
    prompt: |
      Click every line that throws an exception at run time.
    language: java
    code: |
      List<String> ids = Arrays.asList("pay_1", "pay_2");
      List<String> pending = new ArrayList<>(ids);
      List<String> settled = List.of("pay_1");
      pending.removeAll(settled);
      ids.set(0, "pay_9");
      ids.add("pay_3");
      settled.add("pay_2");
    correctLines: [6, 7]
    lineNotes:
      - line: 2
        note: Copying into a new ArrayList gives a fully modifiable list - the usual fix for both traps.
      - line: 4
        note: pending is the modifiable copy, so removing from it is fine; settled is only read here.
      - line: 5
        note: Arrays.asList is fixed-size but not read-only - set is allowed (it writes through to the backing array).
    hints:
      - Which of these lists can change size?
    solution: |
      **Lines 6 and 7.** `Arrays.asList` returns a fixed-size list - `set` works, `add` throws
      `UnsupportedOperationException`. `List.of` returns an unmodifiable list - every change throws.
    followUp: |
      A helper `addDefaultItems(List<String> items)` is called with `List.of(...)` in some tests. How should
      the helper be written so that it works whatever list it gets?

  - id: fast-reconciliation
    type: coding
    concept: collection-performance
    skill: application
    title: Reconcile a day of payments
    prompt: |
      `Reconciliation.missing` returns the right ids, but with 200,000 payments on each side it doesn't
      finish in time. Make it fast. Keep the result the same: our order, each id once.
    project: java
    files:
      - src/exercises/java/learnerapp/collections/Reconciliation.java
    test: src/test/java/learnerapp/collections/ReconciliationTest.java
    command: mvn test -Dtest=ReconciliationTest
    hints:
      - How many times does `theirs.contains` run, and how much of the list does each call scan?
      - Put their ids into a HashSet once.
      - For "each id once, in our order", a LinkedHashSet does both.
    modelAnswer: |
      ```java
      public static List<String> missing(List<String> ours, List<String> theirs) {
          Set<String> settled = new HashSet<>(theirs);
          Set<String> missing = new LinkedHashSet<>();
          for (String id : ours) {
              if (!settled.contains(id)) missing.add(id);
          }
          return new ArrayList<>(missing);
      }
      ```
    rubric:
      - Every test in ReconciliationTest passes
      - A HashSet (or similar) answers the membership question
      - Duplicates are removed without a list scan, and our order is kept
      - Explained the cost before (n times m) and after (about n plus m)
    solution: |
      Two `List.contains` calls per id made the original quadratic. Building the set costs one pass over
      their ids; each check is then constant time on average. Reference:
      `src/solutions/java/learnerapp/collections/Reconciliation.java`.
    followUp: |
      Extend it to also return the ids that are in their report but not in ours. Can you do both in one
      pass over each list?

  - id: retry-queue
    type: coding
    concept: collection-pitfalls
    skill: analysis
    title: Remove the settled payments
    prompt: |
      `RetryQueue.removeSettled` should remove, in place, every id that has settled. It crashes on most
      inputs. Run the tests, read the exception, explain it, and fix the method.
    project: java
    files:
      - src/exercises/java/learnerapp/collections/RetryQueue.java
    test: src/test/java/learnerapp/collections/RetryQueueTest.java
    command: mvn test -Dtest=RetryQueueTest
    hints:
      - Which exception do you get, and on which line of the loop?
      - The for-each loop uses an iterator. Who else changes the list while it runs?
      - "`Collection.removeIf` exists since Java 8."
    modelAnswer: |
      ```java
      public static void removeSettled(List<String> pending, Set<String> settled) {
          pending.removeIf(settled::contains);
      }
      ```

      Or with an explicit iterator: `for (Iterator<String> it = pending.iterator(); it.hasNext();) if
      (settled.contains(it.next())) it.remove();`
    rubric:
      - Every test in RetryQueueTest passes
      - Explained ConcurrentModificationException - the list changed behind the for-each loop's iterator
      - Used removeIf or Iterator.remove, not an index loop that skips elements
    solution: |
      The for-each loop iterates with an `Iterator`; `pending.remove(id)` changes the list behind its back,
      and the iterator's next call detects it. Removing by index in a forward `for` loop would avoid the
      exception but skip the element after each removal - one of the tests catches that too. Reference:
      `src/solutions/java/learnerapp/collections/RetryQueue.java`.
    followUp: |
      Why does removing the second-to-last element in a for-each loop *not* throw? Why is that worse, not
      better?

  - id: order-assertion
    type: mcq
    concept: collection-types
    skill: application
    title: A flaky assertion
    prompt: |
      A test builds `Set<String> expected = Set.of("pay_1", "pay_2", "pay_3")` and asserts
      `assertEquals("[pay_1, pay_2, pay_3]", actual.toString())`, where `actual` is a `HashSet` filled by
      the code under test. It fails now and then with the same three ids in another order. What is the
      best fix?
    options:
      - id: compare-sets
        text: "`assertEquals(expected, actual)` - compare the sets, not their text"
        feedback: Correct - Set equality ignores order, which is exactly what the code promises.
      - id: sort-string
        text: Sort the characters of both strings before comparing
        feedback: It might pass, but it compares letters, not ids - "pay_12" and "pay_21" would look equal.
      - id: retry
        text: Retry the test until the order matches
        feedback: The order is unspecified; retrying hides a test bug and wastes CI time.
      - id: linked
        text: Change the production code to use a LinkedHashSet so the order is stable
        feedback: Only if the order is a real requirement. Changing production code to fit a fragile test gets it the wrong way round.
    correct: [compare-sets]
    hints:
      - What does the code under test actually promise about order?
    solution: |
      **Compare the sets.** Assert only what is promised. If order *is* part of the contract, the code
      should return a `List` or a `LinkedHashSet` - and the test should say so explicitly.
    followUp: |
      The API returns ids as a JSON array whose order is documented as "unspecified". How do you assert it
      in a test without making it flaky?

  - id: interview-list-map-choices
    type: interview
    concept: collection-performance
    skill: application
    title: "Interview: ArrayList, LinkedList, HashMap, TreeMap"
    prompt: |
      **Interviewer:** "When would you use ArrayList versus LinkedList, and HashMap versus TreeMap? Give me
      an example from testing."
    hints:
      - Costs of the common operations, a recommendation, and a concrete testing example.
    modelAnswer: |
      - ArrayList: array-backed, O(1) get by index and amortised O(1) append; the default. LinkedList: O(1)
        insert or remove at a known node but O(n) to reach it, and poorer memory locality - rarely better;
        for queues and stacks ArrayDeque is the better choice.
      - HashMap: O(1) average lookups, no order. TreeMap: O(log n), sorted keys and range queries.
      - Example: reconciling 200,000 payments - put the report's ids in a HashSet, not a List; a summary
        of totals per currency in a TreeMap so the report is sorted.
      - And the traps: unspecified iteration order in assertions, List.of being unmodifiable.
    followUps:
      - What happens to HashMap when many keys have the same hash code?
      - How do you remove items from a list while iterating over it?
      - Which collection would you use for a set of ids shared between threads?
    rubric:
      - Correct costs for ArrayList and LinkedList, and ArrayList as the default
      - Correct costs and ordering for HashMap and TreeMap
      - A concrete testing example where the choice matters
      - Mentioned a pitfall such as unspecified order or unmodifiable lists
    solution: |
      Strong answers turn Big-O into **consequences** - "this is why the reconciliation took four hours" -
      instead of reciting a table.

  - id: view-or-copy
    type: short
    concept: collection-pitfalls
    skill: recall
    title: View or copy?
    prompt: |
      In two or three sentences: what is the difference between `Collections.unmodifiableList(list)` and
      `List.copyOf(list)`?
    hints:
      - What happens to each when the original list changes afterwards?
    modelAnswer: |
      Both are read-only for whoever receives them. `unmodifiableList` is a view: later changes to the
      original list are visible through it. `List.copyOf` is an independent snapshot (and rejects null
      elements), so later changes to the original don't affect it.
    rubric:
      - Both prevent changes through the returned list
      - unmodifiableList is a view that shows later changes to the original
      - copyOf is an independent copy
    solution: |
      Use a **view** when callers should see the live state cheaply; a **copy** when they should get a
      stable snapshot.

recall:
  - id: recall-defaults
    concept: collection-types
    prompt: Which collection implementations are the sensible defaults?
    answer: ArrayList, HashMap, HashSet and ArrayDeque - TreeMap/TreeSet when sorted order is needed, LinkedHashMap/LinkedHashSet for insertion order.
  - id: recall-ordered
    concept: collection-types
    prompt: Which sets keep insertion order, and which keep sorted order?
    answer: LinkedHashSet keeps insertion order; TreeSet keeps sorted order. HashSet promises no order.
  - id: recall-contains-cost
    concept: collection-performance
    prompt: What does contains cost on an ArrayList and on a HashSet?
    answer: O(n) - a scan - on an ArrayList; O(1) on average on a HashSet.
  - id: recall-linkedlist
    concept: collection-performance
    prompt: Why is LinkedList rarely the right choice?
    answer: Reaching a position is O(n), and its scattered nodes make iteration slower than an array; ArrayList is better for lists, ArrayDeque for queues and stacks.
  - id: recall-list-of
    concept: collection-pitfalls
    prompt: What can't you do with List.of(...) and Arrays.asList(...)?
    answer: List.of - no changes at all and no nulls (even contains(null) throws). Arrays.asList - no add or remove (fixed size), though set works.
  - id: recall-cme
    concept: collection-pitfalls
    prompt: Why does removing in a for-each loop throw ConcurrentModificationException, and what do you use instead?
    answer: The loop's iterator detects that the list changed behind it. Use removeIf, or Iterator.remove().

