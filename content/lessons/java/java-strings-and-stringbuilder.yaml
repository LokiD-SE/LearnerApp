placement:
  - id: place-ignored-result
    type: mcq
    concept: string-immutability
    skill: application
    title: After replace
    prompt: |
      ```java
      String id = "pay-81Fz";
      id.replace("-", "_");
      System.out.println(id);
      ```

      What is printed?
    options:
      - id: dash
        text: "`pay-81Fz`"
        feedback: Correct - replace returned a new String that was not kept.
      - id: underscore
        text: "`pay_81Fz`"
        feedback: replace never changes the String it is called on; the result was discarded.
      - id: compile
        text: It does not compile, because the result is unused
        feedback: Java compiles it; only IDEs and static analysis warn about the ignored result.
      - id: regex-error
        text: It throws, because "-" is not a valid regex
        feedback: replace is literal, not regex-based (replaceAll takes a regex) - and "-" would be valid anyway.
    correct: [dash]
    solution: |
      **`pay-81Fz`.** Keep the result: `id = id.replace("-", "_");`.

  - id: place-builder
    type: mcq
    concept: string-building
    skill: application
    title: An export with 200,000 rows
    prompt: |
      A test helper builds a 200,000-row CSV export as one String. Which approach fits best?
    options:
      - id: plus-loop
        text: "`csv += row + \"\\n\"` inside the loop"
        feedback: Each pass copies the whole export so far - quadratic work that becomes minutes at this size.
      - id: builder
        text: A StringBuilder, appending each row and calling toString once
        feedback: Correct - each row is copied once.
      - id: concat
        text: "`csv = csv.concat(row)` inside the loop"
        feedback: concat also creates a new String each time - the same quadratic copying as +=.
      - id: intern
        text: Interning each row with intern() before adding it
        feedback: Interning is about sharing equal Strings, not about building one large String.
    correct: [builder]
    solution: |
      **A StringBuilder.** (Or `String.join("\n", rows)` / `Collectors.joining` if the rows are already in a
      list.)

  - id: place-split-pipe
    type: mcq
    concept: string-api-pitfalls
    skill: application
    title: Three fields, one of them empty
    prompt: |
      Which call returns exactly `["a", "b", ""]` for the line `"a|b|"`?
    options:
      - id: plain
        text: "`line.split(\"|\")`"
        feedback: "\"|\" is regex alternation - it splits between every character."
      - id: escaped
        text: "`line.split(\"\\\\|\")`"
        feedback: The pipe is quoted correctly, but the default limit drops the trailing empty field - you get [a, b].
      - id: escaped-limit
        text: "`line.split(Pattern.quote(\"|\"), -1)`"
        feedback: Correct - a quoted separator and a negative limit that keeps trailing empty strings.
      - id: tokenizer
        text: "`new StringTokenizer(line, \"|\")` read into a list"
        feedback: StringTokenizer skips empty tokens entirely - you get [a, b].
    correct: [escaped-limit]
    solution: |
      **`split(Pattern.quote("|"), -1)`.** Quote the separator and pass a negative limit whenever empty
      fields at the end matter.
