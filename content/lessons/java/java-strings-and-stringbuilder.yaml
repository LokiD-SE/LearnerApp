id: java-strings-and-stringbuilder
title: Strings, immutability and StringBuilder
subject: java
module: java-basics
level: beginner
status: published
estimatedMinutes: 45
summary: Why a String never changes, how to build long text without slowing to a crawl, and the String API traps - split, trim, case and length - that break test code.
tags: [java, string, immutability, stringbuilder, split, regex, strip, locale, unicode, interview]

environment: |
  - **Language:** Java 17 or later. `String.strip`, `isBlank` and `repeat` arrived in Java 11; text
    blocks and `String.formatted` in Java 15. Since Java 9, the compiler turns `+` concatenation into an
    `invokedynamic` call (JEP 280) - but a loop still creates a new String on every pass.
  - **Sources:** the Javadoc of `java.lang.String`, `StringBuilder`, `java.util.regex.Pattern` and
    `java.util.Locale`.
  - **Practice project:** `practice/java` - JDK 17+, Maven 3.8+, JUnit 6.
  - **Examples:** SandPay report lines, ids and amounts are fictional.

prerequisites:
  - java-types-and-variables

concepts:
  - id: string-immutability
    name: String immutability
    summary: A String never changes; methods such as toUpperCase, replace and strip return a new String, which you must use.
  - id: string-building
    name: Building strings
    summary: Repeated + in a loop copies everything built so far; StringBuilder appends into one growing buffer, and String.join or Collectors.joining handle lists.
  - id: string-api-pitfalls
    name: String API pitfalls
    summary: split takes a regular expression and drops trailing empty strings; trim is not strip; case conversion depends on the locale; length counts UTF-16 units.

objectives:
  - Explain what immutability means for String methods and spot code that throws their results away.
  - Build long strings efficiently and explain why repeated concatenation in a loop is slow.
  - Split, strip and compare text from reports and responses without the regex, whitespace and locale traps.
  - Write tests with the inputs that expose these bugs.

sections:
  - id: intuition
    kind: intuition
    concepts: [string-immutability, string-building]
    title: The idea in plain language
    body: |
      A Java String is like **text printed on a card**. You can't rub out a letter. "Changing" it means
      printing a new card - `"pending".toUpperCase()` prints `"PENDING"` on a new card and leaves the old
      one as it was. If you don't keep the new card, the change is lost.

      Building a long text with `+` in a loop is like reprinting the whole card every time you add a word:
      fine for ten words, hopeless for a hundred thousand. A `StringBuilder` is a **notepad**: you keep
      writing on the same page and print the card once at the end.

  - id: what
    kind: what
    concepts: [string-immutability, string-api-pitfalls]
    title: What a String is
    body: |
      - **Immutable:** no method changes a String. `trim`, `strip`, `replace`, `toUpperCase`, `substring`,
        `concat` all **return a new String** (or the same one, if nothing changed).
      - **A sequence of UTF-16 code units:** `length()` counts `char` values. Most characters are one unit;
        some - many emoji, for example - are two (a *surrogate pair*). `codePointCount` counts characters.
      - **Compared with `equals`**, not `==` (the [previous lesson](#/lesson/java-types-and-variables)).

      Common methods and what they really do:

      | Method | Does | Watch out |
      |---|---|---|
      | `split(regex)` | splits around matches of a **regular expression** | `.` `\|` `$` `+` `*` `?` `(` `[` are regex syntax; trailing empty strings are dropped |
      | `split(regex, -1)` | the same, keeping trailing empty strings | - |
      | `trim()` | removes characters up to U+0020 from both ends | not other Unicode spaces |
      | `strip()` | removes all Unicode white space from both ends (Java 11+) | - |
      | `toUpperCase()` | upper-cases using the **default locale** | Turkish and Azeri rules differ for `i` |
      | `toUpperCase(Locale.ROOT)` | locale-neutral upper case | use for codes and identifiers |
      | `equalsIgnoreCase` | compares character by character, ignoring case | - |
      | `isBlank()` | empty or only white space (Java 11+) | `isEmpty()` is true only for `""` |

  - id: why
    kind: why
    concepts: [string-immutability, string-api-pitfalls]
    title: Why testers trip over strings
    body: |
      Test code is full of text from outside: response bodies, CSV exports, settlement reports, log lines,
      UI labels. That text has extra spaces, unusual characters, empty fields and separators that happen to
      be regex syntax. Three things go wrong again and again:

      - **A result thrown away.** `status.trim();` on its own line changes nothing; the comparison after it
        fails, and the test reports a "product bug".
      - **A parser that is wrong for the edge cases.** `line.split("|")` splits between every character;
        `"a,b,,".split(",")` silently loses two empty fields - the report's last columns vanish.
      - **A report builder that works on test data and times out on real data**, because it concatenates
        in a loop.

  - id: internals
    kind: internals
    concepts: [string-immutability, string-building]
    title: How it works underneath
    body: |
      **Immutability.** A String's characters live in a private array that no method writes to after
      construction. That is what makes Strings safe to share between threads, to use as `HashMap` keys
      (the hash code can be cached because it can never change) and to share in the string pool.

      **Concatenation.** `a + b` creates a new String containing copies of both. In a loop -

      ```java
      String out = "";
      for (Line line : lines) out += render(line);   // n times
      ```

      - pass 1 copies 1 line, pass 2 copies 2 lines, ... pass n copies n lines: about n²/2 line-copies in
      total. For 100,000 lines that is about 5 billion. Since Java 9 the compiler generates `+` with
      `invokedynamic` (JEP 280), which makes each single concatenation efficient - it doesn't change the
      quadratic total in a loop.

      **StringBuilder** keeps a resizable buffer. `append` copies only the new text; when the buffer is
      full it grows by a factor (so growth costs are amortised). `toString()` copies once at the end.
      `StringBuilder` is not thread-safe; the older `StringBuffer` is synchronized and rarely needed.

      **split** compiles its argument as a regular expression (single ordinary characters take a fast
      path, but the meaning is still the regex meaning). With the default limit, trailing empty strings are
      removed from the result; a negative limit keeps them.

  - id: visual
    kind: visual
    concepts: [string-building, string-immutability]
    title: "Diagram: concatenating in a loop versus a StringBuilder"
    body: |
      ```mermaid
      flowchart LR
          subgraph plus["out += line - a new String every pass"]
              p1["L1"] --> p2["L1 L2"] --> p3["L1 L2 L3"] --> p4["L1 L2 L3 L4"]
          end
          subgraph builder["StringBuilder - one buffer, appended to"]
              b1["L1"] --> b2["L1 L2"] --> b3["L1 L2 L3"] --> b4["L1 L2 L3 L4"] --> s["toString once"]
          end
      ```

      Both rows end with the same text. On the top row every box is a **new String** that copies all the
      lines before it, and the old ones become garbage. On the bottom row the boxes are the **same buffer**
      growing - each append copies only the new line.

  - id: when
    kind: when
    concepts: [string-building]
    title: Which way to build text
    body: |
      | Situation | Use |
      |---|---|
      | a few parts in one expression | `+` - readable, and efficient since Java 9 |
      | a loop, or text built across methods | `StringBuilder` |
      | a list joined with a separator | `String.join(", ", ids)` or `stream.collect(Collectors.joining(", "))` |
      | a template with values | `String.format(...)` or `"...".formatted(...)` (Java 15+) |
      | multi-line literal text (JSON or SQL in a test) | text blocks `"""..."""` (Java 15+) |
      | secrets such as passwords | `char[]`, which can be overwritten after use - a String can't be wiped |

  - id: example
    kind: example
    concepts: [string-api-pitfalls]
    title: "Real-world example: the report with missing columns"
    body: |
      A reconciliation job read SandPay's settlement report, one payment per line, fields separated by
      `|`:

      ```text
      pay_81Fz|SUCCEEDED|1999|EUR|
      pay_93Qa|REFUNDED|500|EUR|partial
      ```

      The parser used `line.split("|")` - and every line came back as single characters. Someone "fixed"
      it with `split("\\|")`; now the first line had four fields instead of five, because the empty last
      field (no refund note) was dropped, and the code read the currency from the wrong column on some
      lines. A third problem only showed on one bank's files: a field padded with an em space
      (U+2003), which `trim()` doesn't remove.

      **Evidence:** a test with the two lines above, asserting the exact list of fields for each, failed in
      three different ways as each bug was fixed. **Fix:** `Pattern.quote("|")`, a limit of `-1`, and
      `strip()` - the coding exercise below.

  - id: code
    kind: code
    concepts: [string-api-pitfalls, string-building, string-immutability]
    title: "Code: the traps and the fixes"
    collapsed: true
    body: |
      ```java
      String status = "  succeeded ";
      status.strip();                                        // result thrown away - status unchanged
      status = status.strip().toUpperCase(Locale.ROOT);      // "SUCCEEDED"

      "a.b.c".split(".");                                    // length 0 - "." matches every character
      "a.b.c".split("\\.");                                  // [a, b, c]
      "a|b|".split(Pattern.quote("|"));                      // [a, b]      - trailing empty dropped
      "a|b|".split(Pattern.quote("|"), -1);                  // [a, b, ""]

      "\u2003EUR".trim();                                    // still starts with the em space
      "\u2003EUR".strip();                                   // "EUR"

      "title".toUpperCase(Locale.forLanguageTag("tr"));     // "TİTLE" - dotted capital I
      "title".toUpperCase(Locale.ROOT);                      // "TITLE"
      "TITLE".equalsIgnoreCase("title");                     // true, whatever the locale

      "💳".length();                                          // 2 - one character, two UTF-16 units
      "💳".codePointCount(0, "💳".length());                  // 1

      StringBuilder out = new StringBuilder();
      for (String id : ids) out.append(id).append('\n');
      String joined = String.join(", ", ids);
      ```

  - id: tests
    kind: tests
    concepts: [string-api-pitfalls, string-building]
    title: Test inputs that expose string bugs
    body: |
      | ID | Input | Catches |
      |---|---|---|
      | S1 | separators that are regex syntax: `\|`, `.`, `+`, `$` | unquoted `split` |
      | S2 | empty fields in the middle and at the end: `a\|\|b\|` | dropped trailing fields |
      | S3 | leading and trailing spaces, tabs, and a non-ASCII space (U+2003) | `trim` instead of `strip`, missing normalisation |
      | S4 | lower-case and mixed-case codes, and a run with `-Duser.language=tr` | locale-dependent case conversion |
      | S5 | text with emoji or accented characters, near a length limit | `length()` counting UTF-16 units |
      | S6 | 100,000 lines | concatenation in a loop |
      | S7 | `null` and `""` | missing null checks, `isEmpty` vs `isBlank` |

  - id: mistakes
    kind: mistakes
    concepts: [string-immutability, string-api-pitfalls, string-building]
    title: Common mistakes and how to debug them
    body: |
      - **Ignoring a method's result** - `s.trim();`, `s.replace("a", "b");` on their own lines. IDEs and
        static analysers warn about ignored results of String methods; read the warnings.
      - **Unquoted regex in `split`, `replaceAll` and `matches`** - use `Pattern.quote` or escape, or
        `replace` (which is literal) instead of `replaceAll`.
      - **Losing trailing empty fields** - pass `-1` as the limit when every column matters.
      - **`trim` for user or file input** - `strip` handles all Unicode white space.
      - **`toUpperCase()` / `toLowerCase()` without a locale** for codes, statuses and keys - use
        `Locale.ROOT`.
      - **`+=` in loops** over large data.
      - **Assuming `length()` is the number of characters** a user sees.

      **Debugging method:** print the string *with delimiters and code points*, not just the string -
      `"[" + s + "]"` shows invisible spaces at the ends, and `s.codePoints().forEach(c ->
      System.out.printf("U+%04X ", c))` shows exactly which characters are there.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [string-api-pitfalls]
    title: Trade-offs
    body: |
      | Choice | Strengths | Costs |
      |---|---|---|
      | `split` with a quoted pattern | built in, short | easy to get wrong without tests; no quoting rules (fields containing the separator) |
      | a CSV library | handles quoting, escaping and embedded separators | a dependency; overkill for simple internal formats |
      | `Pattern` compiled once (`static final`) | no re-compilation per call; clearer intent | one more line |
      | `strip` everywhere | robust to odd input | hides data problems you might want to report - decide per field |

  - id: summary
    kind: summary
    title: Summary and quick reference
    body: |
      - Strings never change: **use the returned value** of every String method.
      - Loops: `StringBuilder`. Lists: `String.join` / `Collectors.joining`. One expression: `+` is fine.
      - `split` takes a regex - quote the separator; pass `-1` to keep trailing empty fields.
      - `strip` > `trim` for real-world input. `toUpperCase(Locale.ROOT)` for codes. `equalsIgnoreCase` for
        case-insensitive comparison.
      - `length()` counts UTF-16 units, not visible characters.
      - Test with regex separators, empty fields, odd spaces, other locales, emoji and big inputs.

exercises:
  - id: immutable-result
    type: mcq
    concept: string-immutability
    skill: recognition
    title: What gets printed?
    prompt: |
      ```java
      String status = "pending";
      status.toUpperCase();
      String copy = status.concat("!");
      System.out.println(status + " " + copy);
      ```
    options:
      - id: lower
        text: "`pending pending!`"
        feedback: Correct - toUpperCase returned a new String that nobody kept; concat's result was kept in copy.
      - id: upper
        text: "`PENDING PENDING!`"
        feedback: toUpperCase does not change status - it returns a new String, and that return value was thrown away.
      - id: both-bang
        text: "`pending! pending!`"
        feedback: concat doesn't change status either; it returns a new String, which went into copy.
      - id: mixed
        text: "`PENDING pending!`"
        feedback: Neither method changes status. Only the value kept in copy reflects a method call.
    correct: [lower]
    hints:
      - Which of these lines stores a result in a variable?
    solution: |
      **`pending pending!`.** String methods never change the String they are called on. Keep the result:
      `status = status.toUpperCase(Locale.ROOT);`.
    followUp: |
      Name three String methods whose result people often forget to use, and one way your IDE can warn you.

  - id: ignored-results
    type: debug
    concept: string-immutability
    skill: analysis
    title: The order that was never marked paid
    prompt: |
      SandPay returns the status `" succeeded "` (lower case, with spaces). The order is never marked paid.
      Click the lines that cause it.
    language: java
    code: |
      String status = response.status();
      status.strip();
      status.toUpperCase(Locale.ROOT);
      if (status.equals("SUCCEEDED")) {
          markPaid(order);
      }
    correctLines: [2, 3]
    lineNotes:
      - line: 4
        note: equals is the right comparison - but status still holds the original " succeeded ", because the results of lines 2 and 3 were thrown away.
      - line: 1
        note: Reading the status is fine; the text arrives as the provider sent it.
    hints:
      - After line 3, what does the variable status contain?
    solution: |
      **Lines 2 and 3.** Both return a new String, and both results are discarded. Fix:
      `String status = response.status().strip().toUpperCase(Locale.ROOT);` - or compare with
      `"SUCCEEDED".equalsIgnoreCase(response.status().strip())`.
    followUp: |
      Should the test framework normalise the provider's status like this, or report `" succeeded "` as a
      defect in the API? Argue both sides in two sentences.

  - id: fix-report-line
    type: coding
    concept: string-api-pitfalls
    skill: analysis
    title: Split the settlement report correctly
    prompt: |
      `ReportLine.fields` splits a settlement report line into its fields. It returns something for every
      input - but not the right thing. Run the tests, find each bug from its failure, and fix them without
      changing the signature. Write down the cause of each failure before you fix it.
    project: java
    files:
      - src/exercises/java/learnerapp/strings/ReportLine.java
    test: src/test/java/learnerapp/strings/ReportLineTest.java
    command: mvn test -Dtest=ReportLineTest
    hints:
      - Print `"a|b".split("|")` - what does `|` mean in a regular expression?
      - Read the Javadoc of `split(String regex, int limit)` - what happens to trailing empty strings?
      - Which method removes U+2003 from the ends of a String - `trim` or `strip`?
    modelAnswer: |
      ```java
      private static final Pattern SEPARATOR = Pattern.compile(Pattern.quote("|"));

      public static List<String> fields(String line) {
          if (line == null) throw new IllegalArgumentException("line is null");
          return Arrays.stream(SEPARATOR.split(line, -1)).map(String::strip).toList();
      }
      ```

      Three bugs: `|` is regex alternation (an empty pattern that splits between every character), the
      default limit drops trailing empty fields, and `trim` leaves Unicode spaces above U+0020. Plus a
      missing null check.
    rubric:
      - Every test in ReportLineTest passes
      - The separator is quoted (Pattern.quote or an escaped backslash pipe)
      - A negative limit keeps trailing empty fields
      - strip instead of trim, and an IllegalArgumentException for null
      - Wrote down the cause of each failure before fixing it
    solution: |
      Each failing test pointed at one bug: single characters (unquoted regex), a missing last field (the
      default limit), a leftover em space (`trim`). The reference solution is in
      `src/solutions/java/learnerapp/strings/ReportLine.java`.
    followUp: |
      The provider announces that a field may contain `|` if it is wrapped in double quotes. Why can't
      `split` handle that, and what would you use instead?

  - id: fast-receipt
    type: coding
    concept: string-building
    skill: application
    title: A receipt with 100,000 lines
    prompt: |
      `Receipt.render` produces exactly the right text, and takes far too long for a merchant's daily export
      of 100,000 lines. Make it fast without changing its output. Run the tests first: the correctness
      tests pass, the large one times out.
    project: java
    files:
      - src/exercises/java/learnerapp/strings/Receipt.java
    test: src/test/java/learnerapp/strings/ReceiptTest.java
    command: mvn test -Dtest=ReceiptTest
    hints:
      - Which line does the loop repeat 100,000 times, and how much text does it copy each time?
      - Replace the String accumulator with a StringBuilder and append each part.
    modelAnswer: |
      ```java
      public static String render(List<Line> lines) {
          StringBuilder receipt = new StringBuilder(lines.size() * 40 + 20);
          long total = 0;
          for (Line line : lines) {
              receipt.append(line.quantity()).append(" x ").append(line.name()).append(": ")
                  .append(amount(line.totalMinor())).append('\n');
              total = Math.addExact(total, line.totalMinor());
          }
          return receipt.append("Total: ").append(amount(total)).toString();
      }
      ```

      Sizing the builder up front is optional; it avoids a few buffer resizes.
    rubric:
      - Every test in ReceiptTest passes
      - A single StringBuilder is used, and toString is called once
      - The output is unchanged, including the missing line break after the total
      - Explained why += in the loop was quadratic
    solution: |
      `receipt += ...` copied the whole receipt so far on every pass - about five billion line-copies for
      100,000 lines. A StringBuilder copies each line once. On a typical laptop the reference solution
      renders the 100,000 lines in well under a second. Reference:
      `src/solutions/java/learnerapp/strings/Receipt.java`.
    followUp: |
      Rewrite `render` with a stream and `Collectors.joining("\n")`. Where does the total line go, and how
      do you compute the total in the same pass - or should you not?

  - id: split-surprise
    type: mcq
    concept: string-api-pitfalls
    skill: application
    title: Splitting a version number
    prompt: |
      A test reads the app version `"4.51.0"` and splits it to compare the major version:
      `String[] parts = "4.51.0".split(".");`. What is `parts.length`?
    options:
      - id: three
        text: "3"
        feedback: That is what the author expected - but split takes a regular expression, and "." matches any character.
      - id: zero
        text: "0"
        feedback: Correct - "." matches every character, so every piece is empty, and split removes trailing empty strings - which is all of them.
      - id: six
        text: "6"
        feedback: Splitting around six one-character matches gives seven empty strings, and then the trailing ones are removed.
      - id: throws
        text: It throws PatternSyntaxException
        feedback: "\".\" is a valid regular expression - it just doesn't mean a dot."
    correct: [zero]
    hints:
      - What does `.` match in a regular expression?
      - What does split do with empty strings at the end?
    solution: |
      **0.** Escape the dot: `split("\\.")`, or `split(Pattern.quote("."))`. A test that compared
      `parts[0]` would throw `ArrayIndexOutOfBoundsException` - a confusing failure for a one-line bug.
    followUp: |
      Which other characters would cause the same kind of surprise as a separator? Name four.

  - id: locale-trap
    type: mcq
    concept: string-api-pitfalls
    skill: analysis
    title: Passes everywhere except one build agent
    prompt: |
      A test checks `assertEquals("TITLE", heading.toUpperCase())` where `heading` is `"title"`. It passes
      on every machine except one CI agent, whose default locale is Turkish (`tr_TR`). What explains it, and
      what is the fix?
    options:
      - id: locale
        text: The default-locale upper case of "i" in Turkish is the dotted capital "İ" - use toUpperCase(Locale.ROOT)
        feedback: Correct - case conversion follows the locale's rules unless you pass a locale.
      - id: encoding
        text: The agent's file encoding corrupts the source file - set UTF-8
        feedback: Encoding problems look different (garbled characters in literals); this is a case-conversion rule.
      - id: jdk
        text: A bug in that agent's JDK version
        feedback: It is documented behaviour - the Javadoc of toUpperCase warns about locale-sensitive results.
      - id: font
        text: The agent has no Turkish font installed
        feedback: Fonts affect display, not the characters a String contains.
    correct: [locale]
    hints:
      - Which argument does toUpperCase() use when you don't pass one?
    solution: |
      **The locale.** `"title".toUpperCase()` uses the default locale; in Turkish, lower-case `i` becomes
      dotted capital `İ`. For codes, statuses and identifiers use `toUpperCase(Locale.ROOT)` - or compare
      with `equalsIgnoreCase`.
    followUp: |
      How would you make sure the whole suite is tested against this class of bug, not just this one test?

  - id: interview-immutable-strings
    type: interview
    concept: string-immutability
    skill: application
    title: "Interview: why are Strings immutable?"
    prompt: |
      **Interviewer:** "Why are Strings immutable in Java, and what does that mean for code you write?"
    hints:
      - Give reasons, then consequences for everyday code and for performance.
    modelAnswer: |
      - **Why:** Strings are shared everywhere - as map keys, in the string pool, between threads, as
        class and file names. If they could change, one holder could break all the others.
      - **Benefits:** safe sharing and thread safety without locks; the hash code can be cached, which makes
        Strings fast `HashMap` keys; literals can be pooled.
      - **Consequences:** every "modifying" method returns a new String - you must use the result;
        building text in a loop with `+` copies everything each time, so use `StringBuilder`.
      - **Security note:** a password in a String can't be wiped from memory, which is why `char[]` is
        preferred for secrets.
    followUps:
      - What is the difference between StringBuilder and StringBuffer?
      - Is "a" + "b" + "c" in one expression slow? What about in a loop?
      - How would you make your own class immutable?
    rubric:
      - Gave reasons such as safe sharing, thread safety, hash code caching or pooling
      - Said that String methods return new Strings whose results must be used
      - Explained the performance consequence in loops and named StringBuilder
      - Mentioned a practical consequence such as char arrays for passwords or safe map keys
    solution: |
      Strong answers connect the design decision to **everyday bugs and performance**, not only to "the
      string pool".

  - id: builder-when
    type: short
    concept: string-building
    skill: recall
    title: When does + become a problem?
    prompt: |
      In two to four sentences: when is `+` concatenation fine, when should you use a StringBuilder, and
      why?
    hints:
      - Think about one expression versus many passes of a loop.
    modelAnswer: |
      `+` is fine within a single expression - the compiler builds the result efficiently. In a loop (or when
      text is built step by step across many calls), each `+=` creates a new String that copies everything
      so far, so the total work grows with the square of the number of parts. A StringBuilder appends into
      one buffer and copies each part once; call toString once at the end.
    rubric:
      - Said + is fine in a single expression
      - Said += in a loop copies everything built so far, growing quadratically
      - Named StringBuilder with append and one toString
    solution: |
      Rule of thumb: **a loop or a long-lived accumulator → StringBuilder; one expression → `+`; a list →
      `String.join`.**

recall:
  - id: recall-immutable
    concept: string-immutability
    prompt: What does s.trim() on its own line change?
    answer: Nothing - Strings are immutable. trim returns a new String; write s = s.trim() (or better, s.strip()).
  - id: recall-why-immutable
    concept: string-immutability
    prompt: Name two benefits of String immutability.
    answer: Safe sharing between threads and holders (map keys, the string pool), and a cacheable hash code.
  - id: recall-builder
    concept: string-building
    prompt: Why is += in a loop slow for building a long String?
    answer: Each pass creates a new String that copies everything built so far, so the work grows with the square of the number of parts. Use a StringBuilder.
  - id: recall-join
    concept: string-building
    prompt: How do you join a list of ids with ", " in one call?
    answer: String.join(", ", ids) - or ids.stream().collect(Collectors.joining(", ")).
  - id: recall-split
    concept: string-api-pitfalls
    prompt: Name the two traps of String.split.
    answer: Its argument is a regular expression (quote separators such as . or |), and trailing empty strings are dropped unless the limit is negative.
  - id: recall-strip
    concept: string-api-pitfalls
    prompt: What is the difference between trim and strip?
    answer: trim removes characters up to U+0020; strip (Java 11+) removes all Unicode white space.
  - id: recall-locale
    concept: string-api-pitfalls
    prompt: Why pass Locale.ROOT to toUpperCase for codes and statuses?
    answer: Without it the default locale's rules apply - in Turkish, "i" becomes the dotted capital "İ", so comparisons fail.

