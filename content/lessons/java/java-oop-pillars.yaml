placement:
  - id: place-leaky-getter
    type: mcq
    concept: encapsulation
    skill: application
    title: A getter that leaks
    prompt: |
      `Cart.getLines()` returns the cart's private `ArrayList` directly. The cart's total is updated only
      in `addLine`. What is the risk?
    options:
      - id: bypass
        text: Callers can change the lines through the returned list without the total changing
        feedback: Correct - the internal list escaped, and with it control over the cart's rule.
      - id: none
        text: None - the field is private
        feedback: The field is private, but the object it refers to was handed out and can be changed.
      - id: slow
        text: Returning a list is slow
        feedback: Returning a reference is cheap; the problem is control, not speed.
      - id: npe
        text: It throws NullPointerException when the cart is empty
        feedback: An empty ArrayList is not null.
    correct: [bypass]
    solution: |
      **Callers can bypass the rule.** Return `Collections.unmodifiableList(lines)` or `List.copyOf(lines)`.

  - id: place-dispatch
    type: mcq
    concept: polymorphism-and-abstraction
    skill: application
    title: Which baseUrl?
    prompt: |
      `PaymentClient client = new SandboxClient();` - `SandboxClient` implements `PaymentClient` and
      overrides `baseUrl()`. Which implementation does `client.baseUrl()` run?
    options:
      - id: sandbox
        text: SandboxClient's
        feedback: Correct - instance methods are dispatched on the object's runtime class.
      - id: interface
        text: The interface's, because the variable is declared as PaymentClient
        feedback: The declared type decides which methods you may call, not which implementation runs.
      - id: default
        text: A default method in PaymentClient, if there is one
        feedback: A default method runs only when the class doesn't override it - SandboxClient does.
      - id: compile
        text: It doesn't compile without a cast
        feedback: baseUrl() is declared in PaymentClient, so no cast is needed.
    correct: [sandbox]
    solution: |
      **SandboxClient's** - dynamic dispatch on the runtime class. That is what lets tests swap clients.

  - id: place-reuse
    type: mcq
    concept: composition-over-inheritance
    skill: application
    title: Sharing helpers between page objects
    prompt: |
      Ten page objects need the same three helper methods (wait for a spinner, read a toast, dismiss a
      cookie banner). Which design ages best?
    options:
      - id: components
        text: Small components (a Spinner, a Toast, a CookieBanner) that pages use where they need them
        feedback: Correct - composition; each page takes only what it needs, and each part is tested once.
      - id: base-page
        text: A BasePage with the three helpers that all pages extend
        feedback: Workable at first, but every new shared helper lands in BasePage, and every page inherits all of them.
      - id: copy
        text: Copy the three helpers into each page object
        feedback: Ten copies to keep in sync - one change becomes ten.
      - id: static-utils
        text: A static utility class with a global static driver
        feedback: A static driver shares one browser between tests and blocks parallel runs.
    correct: [components]
    solution: |
      **Components** - composition over inheritance. A tiny abstract base that only holds the driver is
      fine; helpers belong in components.
