id: java-oop-pillars
title: Encapsulation, inheritance, polymorphism and abstraction
subject: java
module: java-oop
level: intermediate
status: published
estimatedMinutes: 55
summary: The four pillars of object-oriented Java, shown with payment objects, fee policies and page objects - and why composition usually beats inheritance in test frameworks.
tags: [java, oop, encapsulation, inheritance, polymorphism, abstraction, interfaces, composition, interview]

environment: |
  - **Language:** Java 17 or later. Interfaces can have `default` methods (Java 8) and `private` methods
    (Java 9); records (Java 16) and sealed types (Java 17, JEP 409) appear in examples. Method dispatch
    rules come from **The Java Language Specification**, section 15.12 (method invocation).
  - **Sources:** "favour composition over inheritance" is item 18 of Joshua Bloch's *Effective Java*
    (3rd edition), and its `HashSet` example is reproduced in this lesson. The Liskov substitution
    principle is named after Barbara Liskov.
  - **Implementation detail, labelled:** that `HashSet.addAll` calls `add` for each element is how
    OpenJDK's `AbstractCollection` works; the `HashSet` documentation doesn't promise it.
  - **Practice project:** `practice/java` - JDK 17+, Maven 3.8+, JUnit 6.

prerequisites:
  - java-types-and-variables

concepts:
  - id: encapsulation
    name: Encapsulation
    summary: An object keeps its own state valid - private fields, changes only through methods that check the rules, and read-only views for callers.
  - id: polymorphism-and-abstraction
    name: Polymorphism and abstraction
    summary: Code depends on an abstraction (an interface or abstract class); the object's runtime class decides which implementation runs.
  - id: composition-over-inheritance
    name: Composition over inheritance
    summary: Prefer having collaborators to extending classes; inheritance ties a subclass to its parent's internals.

objectives:
  - Explain each pillar with an example from payments or test automation.
  - Design a class that keeps its invariants, and spot classes that leak their state.
  - Replace type checks and switch statements with polymorphic objects, and predict which method runs.
  - Choose between inheritance and composition and justify the choice.

sections:
  - id: intuition
    kind: intuition
    concepts: [encapsulation, polymorphism-and-abstraction, composition-over-inheritance]
    title: The idea in plain language
    body: |
      Think of a **cash machine**.

      - **Encapsulation:** you can't open it and take notes out; you ask through the keypad, and it checks
        your balance first. The machine protects its own rules.
      - **Abstraction:** you know "insert card, enter PIN, choose amount". You don't know - or need to know -
        how it talks to your bank.
      - **Polymorphism:** the same steps work at every bank's machine. Each machine does them its own way
        behind the same keypad.
      - **Inheritance vs composition:** a new machine model can be *built on* an old model's design
        (inheritance) and inherit its quirks - or *contain* a card reader, a printer and a cash dispenser
        that each do one job (composition), which are easier to swap and test.

  - id: what
    kind: what
    concepts: [encapsulation, polymorphism-and-abstraction, composition-over-inheritance]
    title: What the four pillars are
    body: |
      | Pillar | Meaning | In a payments test framework |
      |---|---|---|
      | **Encapsulation** | state is private; methods keep it valid | a `CapturedPayment` that can't be refunded beyond its amount |
      | **Abstraction** | expose *what*, hide *how* | `checkout.payAndExpectOrder()` hides locators, frames and waits |
      | **Inheritance** | a class extends another and reuses its code (`extends`) | a `SandboxClient` extending an `ApiClient` |
      | **Polymorphism** | one type, many implementations; the runtime object decides | a `FeePolicy` per payment method; a `WebDriver` that is Chrome or Firefox |

      **Interfaces and abstract classes:**

      - An **interface** declares what an object can do. A class can implement many. Since Java 8 it can
        have `default` methods, but no instance fields.
      - An **abstract class** can hold state and partial implementations; a class can extend only one.
      - **Sealed** interfaces and classes (Java 17) list exactly which classes may implement or extend them.

  - id: why
    kind: why
    concepts: [encapsulation, polymorphism-and-abstraction]
    title: Why it matters for testers
    body: |
      - **Test frameworks are object-oriented code** - page objects, API clients, builders, drivers. Good
        design keeps them small enough to change; bad design produces a `BaseTest` nobody dares touch.
      - **Encapsulation bugs are invariant bugs:** a refund larger than the payment, a total that doesn't
        match the items. Knowing where invariants live tells you what to test - and what *can't* go wrong
        because the class prevents it.
      - **Polymorphism is how WebDriver works:** your tests use the `WebDriver` interface; Chrome, Firefox
        and remote drivers are implementations. The same idea lets a test framework switch between the
        sandbox and a stub server.
      - **Interviewers ask for the pillars** - and then for an example from your own framework.

  - id: internals
    kind: internals
    concepts: [polymorphism-and-abstraction]
    title: How Java decides which method runs
    body: |
      Two different decisions, at two different times:

      1. **Overloading - at compile time.** When several methods share a name, the compiler picks one by
         the **static (declared) types** of the arguments. `describe(Object)` vs `describe(String)` is
         decided from the variable's declared type, not the object's real class.
      2. **Overriding - at run time.** For the chosen signature, the JVM runs the implementation of the
         object's **runtime class** (dynamic dispatch). `PaymentClient client = new SandboxClient();
         client.baseUrl()` runs `SandboxClient.baseUrl()`.

      Things that are **not** polymorphic: `static` methods (hidden, not overridden), fields (chosen by the
      declared type), and `private` methods.

      **Liskov substitution:** a subclass must work wherever its parent is expected - same promises, no
      surprising exceptions, no stricter preconditions. A `ReadOnlyList` that extends a list and throws on
      `add` breaks code written against the parent.

  - id: visual
    kind: visual
    concepts: [polymorphism-and-abstraction, composition-over-inheritance]
    title: "Diagram: a checkout that uses any fee policy"
    body: |
      ```mermaid
      classDiagram
          class FeePolicy {
              <<interface>>
              +feeFor(amountMinor) long
          }
          class PercentPlusFixed {
              +feeFor(amountMinor) long
          }
          class PercentWithMinimum {
              +feeFor(amountMinor) long
          }
          class Checkout {
              -FeePolicy policy
              +totalFor(amountMinor) long
          }
          FeePolicy <|.. PercentPlusFixed
          FeePolicy <|.. PercentWithMinimum
          Checkout --> FeePolicy : has a
      ```

      `Checkout` **has a** `FeePolicy` (composition) and only knows the interface (abstraction). Which
      policy runs is decided by the object it was given (polymorphism). A new payment method is a new class
      - `Checkout` doesn't change.

  - id: example
    kind: example
    concepts: [encapsulation]
    title: "Real-world example: the refund that exceeded the payment"
    body: |
      A test-data helper modelled a captured payment with public fields and a public list of refunds. A
      test for partial refunds added refunds directly to the list and never noticed when the total went
      above the captured amount; the *product* rejected such refunds, but the helper's expected values said
      they were fine, and two tests asserted the wrong behaviour for months.

      **Evidence:** the helper's `remainingMinor()` returned a negative number in a debugger session; the
      product returned an error that the test treated as unexpected and retried.

      **Fix:** the helper became an encapsulated class - private state, validation in `refund`, an
      unmodifiable view of the refunds - so it could no longer represent an impossible payment. The two
      wrong tests failed immediately and were corrected. You build exactly this class in the coding
      exercise.

  - id: code
    kind: code
    concepts: [encapsulation, polymorphism-and-abstraction, composition-over-inheritance]
    title: "Code: the pillars in practice"
    collapsed: true
    body: |
      ```java
      // Encapsulation: the rules live with the data
      public final class CapturedPayment {
          private final long capturedMinor;
          private final List<Long> refunds = new ArrayList<>();
          private long refundedMinor;

          public void refund(long amountMinor) {
              if (amountMinor <= 0 || amountMinor > remainingMinor())
                  throw new IllegalArgumentException("Invalid refund: " + amountMinor);
              refunds.add(amountMinor);           // validate first, change state last
              refundedMinor += amountMinor;
          }

          public List<Long> refunds() {
              return Collections.unmodifiableList(refunds);   // callers read, never write
          }
          // constructor and other methods omitted
      }

      // Abstraction + polymorphism: callers depend on the interface
      public interface FeePolicy { long feeFor(long amountMinor); }

      FeePolicy card = amount -> (amount * 150 + 5_000) / 10_000 + 25;   // a lambda is an implementation too
      FeePolicy bankTransfer = amount -> 50;

      // Composition: a checkout has a policy - it doesn't extend one
      public final class Checkout {
          private final FeePolicy policy;
          public Checkout(FeePolicy policy) { this.policy = policy; }
          public long totalFor(long amountMinor) { return amountMinor + policy.feeFor(amountMinor); }
      }
      ```

  - id: tests
    kind: tests
    concepts: [encapsulation, polymorphism-and-abstraction]
    title: Tests that follow from the design
    body: |
      | ID | Test | Pillar |
      |---|---|---|
      | O1 | every operation that could break an invariant is rejected, and **changes nothing** | encapsulation |
      | O2 | getters can't be used to change state (modify the returned list, expect an exception or no effect) | encapsulation |
      | O3 | no public mutable fields (a reflection check, as in the coding exercise) | encapsulation |
      | O4 | each implementation of an interface passes the **same contract tests** | polymorphism |
      | O5 | code under test works with a stub implementation of the interface | abstraction |
      | O6 | a subclass passes its parent's tests (Liskov substitution) | inheritance |

      O4 is a powerful pattern: write the tests once against the interface (for example an abstract test
      class with a factory method) and run them for every implementation.

  - id: mistakes
    kind: mistakes
    concepts: [encapsulation, polymorphism-and-abstraction, composition-over-inheritance]
    title: Common mistakes
    body: |
      - **Getters and setters for every field** - a setter that accepts anything is not encapsulation.
        Offer operations (`refund`), not raw setters (`setRefunded`).
      - **Returning internal collections** - return an unmodifiable view or a copy (`List.copyOf`).
      - **`final` mistaken for immutable** - a `final List` can still be changed; only the reference is
        fixed.
      - **`instanceof` chains and `switch` on a type field** where each case should be an implementation.
      - **Deep inheritance for reuse** - `LoginPage extends BasePage extends Helpers extends ...` - every
        page inherits everything, and a change at the top breaks pages at the bottom.
      - **Overriding methods you didn't design for** - the parent may call them in ways you can't see
        (the `HashSet` example below).
      - **Confusing overloading with overriding** - overloads are chosen by declared types at compile time.

  - id: tradeoffs
    kind: tradeoffs
    concepts: [composition-over-inheritance]
    title: "Trade-offs: inheritance or composition?"
    body: |
      | | Inheritance (`extends`) | Composition (has a) |
      |---|---|---|
      | Reuse | automatic - all public and protected members | explicit - forward only what you need |
      | Coupling | to the parent's implementation, including details it may change | to the collaborator's public interface |
      | Flexibility | fixed at compile time; one parent only | swap collaborators at run time, combine several |
      | Testing | the parent comes along in every test | collaborators can be replaced with stubs |
      | Fits when | a true "is a" relationship designed for extension (often an abstract class) | almost everything else |

      Inheritance is not wrong: a small abstract base for page objects that only holds the driver and a
      wait is reasonable. Trouble starts when inheritance is used **to share helpers** instead of to model
      an "is a" relationship.

  - id: summary
    kind: summary
    title: Summary and quick reference
    body: |
      - **Encapsulation:** private state, operations that check the rules, read-only views; reject invalid
        changes without changing anything.
      - **Abstraction:** depend on what an object does (an interface), not how.
      - **Polymorphism:** the runtime object decides which implementation runs; overloads are chosen at
        compile time by declared types.
      - **Inheritance:** for real "is a" relationships designed for extension; it couples you to the parent.
      - **Prefer composition** for reuse - especially in test frameworks.

exercises:
  - id: which-pillar
    type: mcq
    concept: polymorphism-and-abstraction
    skill: recognition
    title: Which pillar?
    prompt: |
      Your tests call methods on a `WebDriver` variable. On your laptop it holds a `ChromeDriver`; in CI a
      `RemoteWebDriver`. The tests don't change. Which pillar does this show most directly?
    options:
      - id: polymorphism
        text: Polymorphism
        feedback: Correct - one interface, several implementations, and the runtime object decides what runs.
      - id: encapsulation
        text: Encapsulation
        feedback: Encapsulation is about an object protecting its own state - not about swapping implementations.
      - id: inheritance
        text: Inheritance
        feedback: The tests don't extend anything; they use objects through an interface.
      - id: composition
        text: Composition
        feedback: Composition is about objects containing collaborators. Here the point is that one type has interchangeable implementations.
    correct: [polymorphism]
    hints:
      - What stays the same, and what changes between the laptop and CI?
    solution: |
      **Polymorphism** (resting on **abstraction**: the tests depend on the `WebDriver` interface, not on a
      browser).
    followUp: |
      Name another place in a test framework where depending on an interface lets you swap implementations.

  - id: leaky-test-order
    type: debug
    concept: encapsulation
    skill: analysis
    title: An order that can lie about its total
    prompt: |
      `TestOrder` should always satisfy one rule: the total equals the sum of its items' prices. Click every
      line that lets other code break that rule.
    language: java
    code: |
      public class TestOrder {
          private final List<String> items = new ArrayList<>();
          private long totalMinor;

          public List<String> getItems() {
              return items;
          }

          public void setTotalMinor(long totalMinor) {
              this.totalMinor = totalMinor;
          }

          public void addItem(String sku, long priceMinor) {
              items.add(sku);
              totalMinor += priceMinor;
          }
      }
    correctLines: [6, 9]
    lineNotes:
      - line: 2
        note: "private final is right - but final only stops the field being reassigned. The list itself can still change, which matters once line 6 hands it out."
      - line: 13
        note: An operation that changes the items and the total together is exactly how to keep the rule.
    hints:
      - Which methods let a caller change items or total without the other?
    solution: |
      **Lines 6 and 9.** Line 6 returns the internal list - a caller can `getItems().add("cake")` without
      changing the total. Line 9 lets a caller set any total. Return `Collections.unmodifiableList(items)`
      (or `List.copyOf(items)`), and remove the setter - `addItem` is the only way to change both.
    followUp: |
      Add a `removeItem(String sku)`. What does it need to know that the class doesn't store yet?

  - id: captured-payment
    type: coding
    concept: encapsulation
    skill: application
    title: A payment that can't be over-refunded
    prompt: |
      Make `CapturedPayment` keep its rules itself: the captured amount is positive, every refund is
      positive, and refunds never add up to more than was captured. A refund that breaks a rule throws
      `IllegalArgumentException` and changes nothing. Callers must not be able to change state except
      through `refund` - not through fields, and not through the list `refunds()` returns.
    project: java
    files:
      - src/exercises/java/learnerapp/oop/CapturedPayment.java
    test: src/test/java/learnerapp/oop/CapturedPaymentTest.java
    command: mvn test -Dtest=CapturedPaymentTest
    hints:
      - Start with the fields - which of them should anyone outside the class see?
      - Validate in the constructor and in `refund`, and change state only after every check passed.
      - "`Collections.unmodifiableList` gives callers a view they can't change."
    modelAnswer: |
      ```java
      private final long capturedMinor;
      private final List<Long> refunds = new ArrayList<>();
      private long refundedMinor;

      public CapturedPayment(long capturedMinor) {
          if (capturedMinor <= 0) throw new IllegalArgumentException("Captured amount must be positive");
          this.capturedMinor = capturedMinor;
      }

      public void refund(long amountMinor) {
          if (amountMinor <= 0) throw new IllegalArgumentException("Refund must be positive");
          if (amountMinor > remainingMinor())
              throw new IllegalArgumentException("Refund exceeds the remaining " + remainingMinor());
          refunds.add(amountMinor);
          refundedMinor += amountMinor;
      }

      public List<Long> refunds() {
          return Collections.unmodifiableList(refunds);
      }
      ```
    rubric:
      - Every test in CapturedPaymentTest passes
      - All fields are private, and the captured amount is final
      - Every check happens before any state changes
      - refunds() returns an unmodifiable view or a copy
    solution: |
      The tests check behaviour (rejections that change nothing), the returned list, and - with reflection -
      that no public fields remain. The reference solution is in
      `src/solutions/java/learnerapp/oop/CapturedPayment.java`.
    followUp: |
      Make `CapturedPayment` immutable instead: `refund` returns a new object. What changes for callers, and
      what gets easier to test?

  - id: fee-policies
    type: coding
    concept: polymorphism-and-abstraction
    skill: application
    title: One fee policy per payment method
    prompt: |
      Implement `FeePolicies.forMethod`: return a `FeePolicy` for `card`, `bank-transfer` and `wallet`
      following the prices in the class's Javadoc, and reject unknown methods. Write each rule as its own
      policy - a class or a lambda - so that code charging fees only ever sees a `FeePolicy`, and a new
      payment method means a new policy rather than another branch in a big `switch`.
    project: java
    files:
      - src/exercises/java/learnerapp/oop/FeePolicies.java
    test: src/test/java/learnerapp/oop/FeePoliciesTest.java
    command: mvn test -Dtest=FeePoliciesTest
    hints:
      - "`FeePolicy` has one method, so a lambda can implement it: `amount -> 50`."
      - "Rounding half up without floating point: `(amount * basisPoints + 5_000) / 10_000` for non-negative amounts (1% = 100 basis points)."
      - A `Map<String, FeePolicy>` can choose the policy; check for null before you look up.
    modelAnswer: |
      ```java
      record PercentPlusFixed(long basisPoints, long fixedMinor) implements FeePolicy {
          public long feeFor(long amountMinor) { return percent(amountMinor, basisPoints) + fixedMinor; }
      }

      record PercentWithMinimum(long basisPoints, long minimumMinor) implements FeePolicy {
          public long feeFor(long amountMinor) {
              return Math.max(percent(amountMinor, basisPoints), minimumMinor);
          }
      }

      private static final Map<String, FeePolicy> POLICIES = Map.of(
          "card", new PercentPlusFixed(150, 25),
          "bank-transfer", amountMinor -> 50,
          "wallet", new PercentWithMinimum(100, 10));

      public static FeePolicy forMethod(String method) {
          FeePolicy policy = method == null ? null : POLICIES.get(method);
          if (policy == null) throw new IllegalArgumentException("Unknown payment method: " + method);
          return policy;
      }
      ```

      `Map.of(...)` maps throw `NullPointerException` for `get(null)`, hence the explicit check.
    rubric:
      - Every test in FeePoliciesTest passes
      - Each pricing rule is its own FeePolicy (class, record or lambda), not a branch inside one method
      - No floating point in the fee calculations
      - Unknown and null methods throw IllegalArgumentException
    solution: |
      The choice of policy happens once, in `forMethod`; everything after that is polymorphic. Adding a
      method is one map entry and, at most, one new class. Reference:
      `src/solutions/java/learnerapp/oop/FeePolicies.java`.
    followUp: |
      Write one parameterised JUnit test that checks a property every fee policy must have (for example,
      the fee is never negative) and runs it for all three methods.

  - id: overload-or-override
    type: mcq
    concept: polymorphism-and-abstraction
    skill: analysis
    title: Which describe runs?
    prompt: |
      ```java
      class Report {
          String describe(Object value) { return "object"; }
          String describe(String value) { return "text"; }
      }
      class AuditReport extends Report {
          @Override String describe(Object value) { return "audited object"; }
      }

      Report report = new AuditReport();
      Object id = "pay_81Fz";
      System.out.println(report.describe(id));
      ```

      What is printed?
    options:
      - id: audited
        text: "`audited object`"
        feedback: Correct - the compiler picked describe(Object) from the declared type of id; at run time, AuditReport's override of that method ran.
      - id: text
        text: "`text`"
        feedback: Overloads are chosen at compile time by declared types. id is declared Object, so describe(String) is never a candidate here.
      - id: object
        text: "`object`"
        feedback: The signature describe(Object) was chosen correctly - but the object is an AuditReport, and dynamic dispatch runs its override.
      - id: compile-error
        text: It does not compile - the call is ambiguous
        feedback: With an argument declared as Object, only describe(Object) applies - there is no ambiguity.
    correct: [audited]
    hints:
      - Two decisions - which signature (compile time, declared types), then which implementation (run time, real class).
    solution: |
      **`audited object`.** Compile time: `id` is declared `Object` → `describe(Object)`. Run time: `report`
      is an `AuditReport` → its override runs. `report.describe("pay_81Fz")` with a String literal would
      choose `describe(String)` and print `text`.
    followUp: |
      Change one declaration so the same call prints `text`, without changing either class.

  - id: inherited-hashset
    type: mcq
    concept: composition-over-inheritance
    skill: analysis
    title: Counting what was added
    prompt: |
      A test helper counts how many ids were ever added to a set:

      ```java
      class CountingSet extends HashSet<String> {
          int added = 0;
          @Override public boolean add(String id) { added++; return super.add(id); }
          @Override public boolean addAll(Collection<? extends String> ids) {
              added += ids.size();
              return super.addAll(ids);
          }
      }

      CountingSet set = new CountingSet();
      set.addAll(List.of("pay_1", "pay_2", "pay_3"));
      ```

      What is `set.added` on OpenJDK 17?
    options:
      - id: three
        text: "3"
        feedback: That's what the author intended - but HashSet's addAll (inherited from AbstractCollection) calls add for each element, and add is overridden too.
      - id: six
        text: "6"
        feedback: Correct - addAll counted 3, then super.addAll called the overridden add three times.
      - id: zero
        text: "0"
        feedback: Both overrides run - the question is how often.
      - id: undefined
        text: It doesn't compile
        feedback: Both overrides are valid; the problem only shows at run time.
    correct: [six]
    hints:
      - How does super.addAll add the elements?
    solution: |
      **6.** The subclass depends on an implementation detail of its parent - that `addAll` calls `add`. A
      fix that removes the `addAll` override would work today and break if that detail changed. The robust
      fix is **composition**: a class that *has* a `Set`, counts in its own `add` and `addAll`, and forwards
      to the set. (This is the classic example from *Effective Java*.)
    followUp: |
      Rewrite CountingSet with composition. Which methods do you forward, and what does your class no
      longer promise compared with a full Set?

  - id: interview-pillars-in-framework
    type: interview
    concept: composition-over-inheritance
    skill: application
    title: "Interview: OOP in your framework"
    prompt: |
      **Interviewer:** "Explain the four OOP pillars using examples from a test automation framework. Where
      would you use inheritance, and where not?"
    hints:
      - One concrete framework example per pillar, then a judgement on inheritance.
    modelAnswer: |
      - **Encapsulation:** page objects keep locators and waits private and expose actions; test-data
        objects validate themselves.
      - **Abstraction:** tests call `checkout.payAndExpectOrder()` without knowing about frames or overlays.
      - **Polymorphism:** tests use the `WebDriver` interface - Chrome locally, a remote driver in CI; a
        `PaymentClient` interface with a sandbox and a stub implementation.
      - **Inheritance:** fine for a small abstract base that holds the driver and a wait, or for a true "is
        a" relationship. Not for sharing helpers - deep `BasePage`/`BaseTest` hierarchies become rigid.
      - **Composition instead:** pages *have* components (a header, a payment iframe); a JUnit extension
        provides the browser instead of a base class.
    followUps:
      - What is the difference between an interface and an abstract class today?
      - What is the Liskov substitution principle? Give an example of breaking it.
      - How do you test several implementations of one interface without duplicating tests?
    rubric:
      - Gave a concrete framework example for each pillar
      - Explained polymorphism through an interface with several implementations
      - Limited inheritance to real is-a relationships or a small base
      - Named composition as the default for reuse, with an example
      - Mentioned a risk of deep inheritance such as fragility or rigidity
    solution: |
      Strong answers use **their own framework's classes** as examples and show judgement about inheritance.
      Textbook definitions alone are the weak answer.

  - id: interface-or-abstract
    type: short
    concept: polymorphism-and-abstraction
    skill: recall
    title: Interface or abstract class?
    prompt: |
      In two to four sentences: what can an abstract class do that an interface can't, and why do most
      designs start with an interface?
    hints:
      - Think about state, constructors, and how many of each a class can have.
    modelAnswer: |
      An abstract class can have instance fields, constructors and protected members, so it can hold shared
      state and partial implementations; an interface can't hold instance state (it can have default,
      static and private methods). A class can extend only one class but implement many interfaces. Designs
      start with an interface because it commits to the least - callers depend only on what an object does,
      and any class can implement it, including lambdas for single-method interfaces.
    rubric:
      - Abstract classes can have instance state and constructors; interfaces cannot
      - A class can extend one class but implement many interfaces
      - Gave a reason to prefer interfaces, such as less coupling or lambdas
    solution: |
      Rule of thumb: **interface first; an abstract class only when implementations really share state or
      code.**

recall:
  - id: recall-encapsulation
    concept: encapsulation
    prompt: What does encapsulation mean beyond "private fields"?
    answer: The object keeps its own state valid - changes only through operations that check the rules, invalid changes rejected without side effects, and no internals (such as mutable lists) handed out.
  - id: recall-final-list
    concept: encapsulation
    prompt: Does private final List<String> items make the list immutable?
    answer: No - final fixes the reference only. The list can still change; return an unmodifiable view or a copy.
  - id: recall-dispatch
    concept: polymorphism-and-abstraction
    prompt: When is an overloaded method chosen, and when is an overridden one?
    answer: Overloads at compile time, by the declared types of the arguments. Overrides at run time, by the real class of the object.
  - id: recall-not-polymorphic
    concept: polymorphism-and-abstraction
    prompt: Name three things in Java that are not polymorphic.
    answer: Static methods (hidden, not overridden), fields (chosen by declared type) and private methods.
  - id: recall-composition
    concept: composition-over-inheritance
    prompt: Why prefer composition over inheritance for reuse?
    answer: Inheritance couples a subclass to its parent's implementation details and fixes the relationship at compile time; composition depends only on a collaborator's public interface and can be swapped and stubbed.
  - id: recall-liskov
    concept: composition-over-inheritance
    prompt: What does the Liskov substitution principle require?
    answer: A subclass must work wherever its parent is expected - keep the parent's promises, no stricter preconditions, no surprising exceptions.

