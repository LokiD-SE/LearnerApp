# Interview practice: round types, the competencies feedback is given on, and company interview
# profiles. Questions live in content/interviews/questions/*.yaml; lesson exercises are used too.

asOf: '2026-10-12'

note: |
  These interview loops are compiled from **publicly reported** candidate experiences and interview-prep
  guides (listed with each profile), checked on the date above. Real processes vary by team, level,
  location, role (SWE, SDET, QA) and year, and companies change them - confirm the format with your
  recruiter. Questions are written for practice in the style of each round; they are not leaked questions
  from any company.

competencies:
  - id: motivation-and-communication
    name: Motivation and communication
    improve: |
      Prepare a 90-second story of your background that ends with why *this* role is the next step. Name
      one concrete thing you know about the company's product, and keep answers short enough that the
      interviewer can ask follow-ups.
  - id: career-and-offer
    name: Career story and offer conversation
    improve: |
      Research the salary band for the role and city before the call, give a range you can justify, state
      notice period and constraints plainly, and keep the conversation about fit and growth rather than only
      money.
  - id: ownership
    name: Ownership and initiative
    improve: |
      Use STAR (situation, task, action, result) and make *your* actions the centre of the story - "I", not
      "we". End with a measurable result and what you changed afterwards so it doesn't happen again.
  - id: collaboration-and-conflict
    name: Collaboration and handling conflict
    improve: |
      Show that you disagreed with evidence, not opinion; that you understood the other person's
      constraints; and how you reached a decision together. Avoid stories where you were simply right and
      someone else was wrong.
  - id: ambiguity-and-learning
    name: Ambiguity, feedback and learning
    improve: |
      Describe how you reduced uncertainty - questions you asked, assumptions you wrote down, a small
      experiment - and what you learned. Interviewers look for curiosity and for changing course when the
      evidence changes.
  - id: judgement-and-prioritisation
    name: Judgement and prioritisation
    improve: |
      Explain the trade-off you faced, the risk of each option, who you involved, and why you chose as you
      did. Risk-based reasoning ("what breaks for customers if we're wrong?") is the signal.
  - id: quality-leadership
    name: Leading quality
    improve: |
      Talk in outcomes: escaped defects, lead time, flaky-test rate, time to diagnose a failure. Show how you
      influenced developers and product managers, not only how you tested.
    lesson: reference-framework-skeleton
  - id: coding-problem-solving
    name: Coding and problem solving
    improve: |
      Restate the problem, ask about edge cases, propose a simple solution and its complexity, then improve
      it. Write the code in small steps and test it with two or three examples - including an edge case -
      before saying "done".
    lesson: java-collections-choice
  - id: automation-skills
    name: Automation coding
    improve: |
      Write automation that would survive in a real suite: stable locators, waits for state (never sleeps),
      page objects that hide mechanics, and assertions that state the expected outcome. Explain each choice
      as you write it.
    lesson: selenium-waits-and-synchronisation
  - id: test-design-coverage
    name: Test design and coverage
    improve: |
      Structure the answer: clarify the feature and risks first, then cover positive, negative, boundary,
      state and integration cases, prioritise them (P0/P1), and say what evidence each test collects.
    lesson: payment-scenario-matrix
  - id: framework-architecture
    name: Framework architecture
    improve: |
      Describe layers (tests, page objects, infrastructure), isolation, configuration, reporting and CI - and
      the reason each part exists. Interviewers probe trade-offs, so say what you left out and why.
    lesson: reference-framework-skeleton
  - id: system-test-strategy
    name: Test strategy for systems
    improve: |
      Start from the system's risks and architecture, then map test levels (unit, contract, integration,
      end-to-end, performance, resilience) to those risks. Include observability and production checks -
      not every risk is best caught before release.
    lesson: webhooks-and-async-status
  - id: debugging-and-rca
    name: Debugging and root-cause analysis
    improve: |
      Gather evidence before guessing: logs with request and correlation ids, timings, recent changes. State
      hypotheses, the test that would confirm or reject each, and the fix plus the check that prevents a
      repeat.
    lesson: declines-timeouts-unknown-outcomes
  - id: testing-fundamentals
    name: Testing fundamentals
    improve: |
      Revise the vocabulary interviewers use for screening: test levels and types, severity and priority,
      boundary values and equivalence classes, smoke versus sanity, regression versus re-test.
  - id: sql-and-data
    name: SQL and data checks
    improve: |
      Practise SELECT with WHERE, JOIN, GROUP BY and HAVING on a small payments table, and explain how you
      would use queries to verify what the application stored.
  - id: consulting-and-estimation
    name: Scoping, estimation and client communication
    improve: |
      Structure the problem before solving it: goals, constraints, scope, risks. Make estimates explicit
      (assumptions, ranges, what drives them) and say how you would report progress to the client.
  - id: payments-domain
    name: Payments domain knowledge
    improve: |
      Be precise about the payment lifecycle (authorise, capture, settle, refund), unknown outcomes after
      timeouts, idempotency and webhooks - and connect each to a test you would write.
    lesson: payment-lifecycle-overview

roundTypes:
  - id: recruiter-screen
    title: Recruiter or HR screen
    minutes: 25
    questions: 3
    summary: A first conversation about your background, motivation and logistics.
    assesses:
      - A clear, short story of your experience
      - Why this role and company
      - Practical fit - location, notice period, expectations
    tips:
      - Have your 90-second introduction ready.
      - Research the product before the call.
  - id: online-assessment
    title: Online assessment
    minutes: 60
    questions: 5
    summary: A timed, auto-graded test - multiple choice on testing and technical basics, sometimes aptitude or a small coding task.
    assesses:
      - Accuracy on fundamentals under time pressure
      - Reading questions carefully
    tips:
      - Don't get stuck - skip and come back.
      - Eliminate wrong options by naming the misconception behind them.
    fromLessons:
      types: [mcq, order, debug]
  - id: coding-dsa
    title: Coding - data structures and algorithms
    minutes: 45
    questions: 2
    summary: Live problem solving in code, usually one or two problems with follow-ups on complexity.
    assesses:
      - Clarifying the problem and its edge cases
      - A correct, readable solution
      - Time and space complexity
      - Testing your own code
    tips:
      - Talk through your approach before coding.
      - Start simple, then optimise.
  - id: automation-coding
    title: Automation coding
    minutes: 50
    questions: 3
    summary: Writing or fixing test automation - locators, waits, page objects, API tests - and explaining the choices.
    assesses:
      - Robust locators and waits for state
      - Clean structure such as page objects
      - Clear assertions and failure messages
    tips:
      - Say why you chose each locator and wait.
      - Mention how the test would fail and what it would report.
    fromLessons:
      types: [coding, debug]
      subjects: [java, ui-automation, frameworks, playwright]
  - id: test-design
    title: Test design
    minutes: 45
    questions: 2
    summary: Designing test cases and coverage for a feature, with priorities and evidence.
    assesses:
      - Clarifying requirements and risks
      - Coverage of positive, negative, boundary and state cases
      - Prioritisation and evidence
    tips:
      - Ask questions before listing cases.
      - Group cases and say which are P0.
    fromLessons:
      types: [testdesign]
  - id: framework-design
    title: Framework design
    minutes: 50
    questions: 2
    summary: Designing a test automation framework end to end - structure, data, reporting, CI and parallel runs.
    assesses:
      - Layering and responsibilities
      - Isolation, configuration and reporting
      - Justified trade-offs
    tips:
      - Draw the layers first, then fill in the parts.
      - Give a reason for every component.
    fromLessons:
      types: [interview, short]
      subjects: [frameworks, playwright, ui-automation]
  - id: system-test-strategy
    title: Test strategy and system design
    minutes: 50
    questions: 2
    summary: How you would test a distributed system or service - levels, environments, data, resilience and observability.
    assesses:
      - Understanding the architecture and its risks
      - Mapping test levels to risks
      - Non-functional and production concerns
    tips:
      - Ask about scale, dependencies and failure modes.
      - Cover what you would check after release too.
  - id: debugging-rca
    title: Debugging and root-cause analysis
    minutes: 45
    questions: 3
    summary: Finding the cause of a failure from code, logs or symptoms - flaky tests, production incidents, wrong results.
    assesses:
      - Evidence before conclusions
      - Hypotheses and how to test them
      - A fix and a guard against recurrence
    tips:
      - Ask for logs, ids and timings.
      - Say how you would confirm the cause before fixing it.
    fromLessons:
      types: [debug, mcq]
      skills: [analysis]
  - id: domain-deep-dive
    title: Domain deep dive
    minutes: 45
    questions: 3
    summary: Depth in the course's subject - the domain or the tools the role uses - and how it shapes your testing.
    assesses:
      - Accurate domain knowledge
      - Connecting the domain to concrete tests
    tips:
      - Use precise terms, and say where you are unsure.
      - Turn every concept into a test idea.
    fromLessons:
      types: [interview, short, mcq]
      skills: [application, analysis, recall]
  - id: behavioural
    title: Behavioural
    minutes: 45
    questions: 3
    summary: Past situations told as stories - ownership, conflict, ambiguity, failure, feedback.
    assesses:
      - Specific, real situations
      - Your own actions and their results
      - Reflection and learning
    tips:
      - Use STAR and keep each story to about two minutes.
      - Prepare five or six stories that cover different themes.
  - id: hiring-manager
    title: Hiring manager or managerial round
    minutes: 45
    questions: 3
    summary: Your experience in depth - how you work, lead quality, handle pressure and fit the team.
    assesses:
      - Depth on past projects and decisions
      - How you measure and improve quality
      - Working with developers and managers
    tips:
      - Bring numbers - defects found, run times, flakiness.
      - Be honest about what didn't work.
  - id: take-home
    title: Take-home assignment
    minutes: 120
    questions: 1
    summary: A task done in your own time - often automation code or a test plan - reviewed in a later round.
    assesses:
      - Working, readable deliverables
      - A README with assumptions and how to run it
      - Sensible scope for the time given
    tips:
      - Ask how long it is expected to take, and stick to it.
      - Organise the deliverable so a reviewer finds things fast.
    fromLessons:
      types: [coding]
  - id: case-study
    title: Client case study
    minutes: 45
    questions: 2
    summary: A consulting-style scenario - scope, approach, estimate and risks for a client's testing problem.
    assesses:
      - Structured thinking
      - Realistic estimates with assumptions
      - Client communication
    tips:
      - Restate the goal and constraints first.
      - State assumptions out loud.
  - id: hr-final
    title: HR and offer discussion
    minutes: 25
    questions: 3
    summary: Expectations, notice period, location and questions about the company before an offer.
    assesses:
      - Professional, clear expectations
      - Realistic logistics
      - Genuine interest in the role
    tips:
      - Know your numbers and your constraints.
      - Prepare two questions for them.

profiles:
  - id: google
    name: Google
    category: Big tech
    summary: A recruiter screen, one or two technical screens, then a loop of about four to five interviews - mostly coding, with a behavioural ("Googleyness and leadership") round and design for more senior levels.
    notes:
      - Coding rounds are usually about 45 minutes with one or two problems; interviewers expect you to explain your approach and discuss complexity.
      - A hiring committee reviews the interviewers' written feedback; team matching is reported either before or after the committee.
      - Test-focused roles keep the same shape, with testing and automation questions in some rounds.
    sources:
      - title: Exponent - Google software engineer interview guide
        url: https://www.tryexponent.com/guides/google-software-engineer-interview
      - title: IGotAnOffer - Googleyness and leadership interview questions
        url: https://igotanoffer.com/blogs/tech/googleyness-leadership-interview-questions
      - title: Codemia - Google software engineer guide
        url: https://codemia.io/guides/google-software-engineer
    stages:
      - label: Recruiter screen
        rounds: [recruiter-screen]
      - label: Technical phone screen
        rounds: [coding-dsa]
      - label: Onsite - coding
        rounds: [coding-dsa]
      - label: Onsite - coding or testing
        rounds: [coding-dsa, automation-coding, test-design]
      - label: Googleyness and leadership
        rounds: [behavioural]
      - label: Design (more often at senior levels)
        rounds: [system-test-strategy]
        chance: 0.5

  - id: meta
    name: Meta
    category: Big tech
    summary: Sometimes an online assessment, a recruiter screen, a coding screen, then an onsite with coding, design and behavioural rounds. Since late 2025 Meta has piloted an AI-assisted coding round that works in an existing codebase.
    notes:
      - Coding screens are reported as about 45 minutes with two problems.
      - The AI-assisted round (a pilot reported from October 2025) gives a multi-file codebase with failing tests and bugs to debug and extend; whether it replaces or adds to a coding round varies by report.
      - Design is product architecture or system design depending on the track; team matching happens before the offer.
    sources:
      - title: Hello Interview - Meta E4 interview guide
        url: https://www.hellointerview.com/guides/meta/e4
      - title: interviewing.io - Meta interview questions
        url: https://interviewing.io/meta-interview-questions
      - title: Inside Meta's AI-enabled coding round (Substack)
        url: https://dglearning.substack.com/p/inside-metas-new-ai-enabled-coding
      - title: YourStory - Meta lets candidates use AI tools in job interviews
        url: https://yourstory.com/ai-story/meta-ai-job-interviews-hiring-pilot-2025
    stages:
      - label: Online assessment
        rounds: [online-assessment]
        chance: 0.5
      - label: Recruiter screen
        rounds: [recruiter-screen]
      - label: Technical screen
        rounds: [coding-dsa]
      - label: Onsite - coding
        rounds: [coding-dsa]
      - label: Onsite - AI-assisted coding in a codebase
        rounds: [debugging-rca, automation-coding]
      - label: Onsite - design
        rounds: [system-test-strategy, framework-design]
      - label: Onsite - behavioural
        rounds: [behavioural]

  - id: big4
    name: Big 4 (Deloitte, PwC, EY, KPMG)
    category: Consulting
    summary: Often an online test, one or two technical rounds on testing, automation, SQL and coding puzzles, a managerial round on process and client situations, and HR.
    notes:
      - The sources found are candidate reports for Deloitte and KPMG; no reports for PwC or EY were found, so treat this profile as indicative for those firms.
      - Reported technical topics include XPath and Selenium, Java collections and OOP, SQL queries and testing fundamentals; some offices have used recorded video interviews.
    sources:
      - title: Glassdoor - KPMG interview review (QA automation)
        url: https://www.glassdoor.co.uk/Interview/KPMG-Interview-E2867-RVW73835423.htm
      - title: Glassdoor - Deloitte interview review
        url: https://www.glassdoor.co.uk/Interview/Deloitte-Interview-E2763-RVW72411212.htm
      - title: Glassdoor - Deloitte interview review (testing)
        url: https://static.glassdoor.de/Interview/Deloitte-Interview-E2763-RVW25205091.htm
    stages:
      - label: Online test
        rounds: [online-assessment]
        chance: 0.6
      - label: Technical round 1
        rounds: [automation-coding, domain-deep-dive]
      - label: Technical round 2
        rounds: [test-design, debugging-rca, coding-dsa]
      - label: Managerial round
        rounds: [hiring-manager, case-study]
      - label: HR round
        rounds: [hr-final]

  - id: it-services
    name: IT services MNCs (TCS, Infosys, Accenture, Cognizant)
    category: MNC - IT services
    summary: For freshers an online aptitude and technical test first; then a technical interview on Selenium, Java and testing, a managerial or project round, and HR.
    notes:
      - Experienced hires often skip the aptitude test and go straight to technical and project discussions.
      - Reported topics include Selenium and framework questions, Java OOP, writing small programs, XPath, API testing basics, defect management and smoke versus regression testing.
    sources:
      - title: Glassdoor - Infosys interview review (automation testing)
        url: https://www.glassdoor.co.in/Interview/Infosys-Interview-E7927-RVW91297518.htm
      - title: Design Gurus - What is the TCS interview process like?
        url: https://www.designgurus.io/answers/detail/what-is-the-tcs-interview-process-like-round-by-round
      - title: Taro - Accenture senior test engineer interview experience
        url: https://www.jointaro.com/interviews/companies/accenture/work-experiences/senior-test-engineer-may-8-2022-3-c602732a
      - title: Glassdoor - Cognizant interview review
        url: https://www.glassdoor.fr/Entretien/Cognizant-Entretien-E8014-RVW47303996.htm
    stages:
      - label: Online aptitude and technical test
        rounds: [online-assessment]
        chance: 0.7
      - label: Technical interview
        rounds: [automation-coding]
      - label: Technical or project discussion
        rounds: [domain-deep-dive, test-design]
        chance: 0.6
      - label: Managerial round
        rounds: [hiring-manager]
      - label: HR round
        rounds: [hr-final]

  - id: mid-market
    name: Mid-market product companies (SDET)
    category: Product company
    summary: A talent-acquisition screen, coding, test planning and debugging, framework design, and a hiring-manager conversation - closer to the day-to-day work of an SDET.
    notes:
      - Reported loops include a test plan with P0 coverage for a feature, debugging a flaky automation test, and designing a feature's automation end to end.
      - Coding is usually moderate - strings, arrays, maps, trees - rather than the hardest algorithm problems.
    sources:
      - title: Glassdoor - Netskope SDET interview questions
        url: https://static.glassdoor.com.au/Interview/Netskope-Interview-Questions-E717917.htm
      - title: Glassdoor - Apple interview review (test engineering)
        url: https://www.glassdoor.co.in/Interview/Apple-Interview-E1138-RVW97410617.htm
      - title: Glassdoor - Amazon SDET interview questions
        url: https://static-pc.glassdoor.de/Interview/Amazon-Software-Development-Engineer-In-Test-SDET-Interview-Questions-EI_IE6036.0,6_KO7,49_IP4.htm
    stages:
      - label: Talent-acquisition screen
        rounds: [recruiter-screen]
      - label: Coding
        rounds: [coding-dsa]
      - label: Test planning
        rounds: [test-design]
      - label: Debugging
        rounds: [debugging-rca]
        chance: 0.7
      - label: Framework design
        rounds: [framework-design]
      - label: Hiring manager
        rounds: [hiring-manager]

  - id: startup
    name: Startups
    category: Startup
    summary: A short screen, a take-home assignment, a technical round that reviews it, and a culture or founder conversation.
    notes:
      - Take-homes are reported at a few hours to a couple of days of work; it is reasonable to ask how long it should take, whether it is paid, and what the rubric is.
      - An organised deliverable - a README with structure and assumptions - matters; one reported rejection cited test cases that were "scattered and unorganized".
    sources:
      - title: Underdog.io - Startup interview process
        url: https://underdog.io/blog/startup-interview-process
      - title: Shapr3D - Interview hacks for QA specialist candidates
        url: https://www.shapr3d.com/it/life/interview-hacks-qa-specialist
      - title: Dataford - QA automation engineer role guide
        url: https://dataford.io/roles/qa-automation-engineer
      - title: The QA hiring challenge (course module)
        url: https://yrkan.com/course/module-12-leadership/qa-hiring/
    stages:
      - label: Intro call
        rounds: [recruiter-screen]
      - label: Take-home assignment
        rounds: [take-home]
      - label: Technical review of the take-home
        rounds: [automation-coding, test-design, domain-deep-dive]
      - label: Team or culture round
        rounds: [behavioural, hiring-manager]
      - label: Founder conversation
        rounds: [hiring-manager, behavioural]
        chance: 0.6
