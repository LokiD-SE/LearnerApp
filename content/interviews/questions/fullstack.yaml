# Track I (full stack: TypeScript, React, Node.js/Express, PostgreSQL) interview questions. Each is limited to
# the fullstack subject, so it is asked in courses about that track. Written for practice in the style of the
# round; not questions from any company.
questions:
  - rounds: [domain-deep-dive, online-assessment]
    subjects: [fullstack]
    exercise:
      id: fs-event-loop-order
      type: mcq
      concept: fullstack-engineering
      skill: application
      title: Microtasks before timers
      prompt: |
        What does this print in a browser or in Node.js?

        ```javascript
        console.log('A');
        setTimeout(() => console.log('B'), 0);
        Promise.resolve().then(() => console.log('C'));
        console.log('D');
        ```
      options:
        - id: acdb
          text: A D C B
          feedback: Correct - synchronous code runs first; the promise reaction is a microtask, run as soon as the current task ends; the timer callback is a later task.
        - id: abcd
          text: A B C D
          feedback: Callbacks never interrupt running synchronous code - B and C wait until the script has finished.
        - id: adbc
          text: A D B C
          feedback: A zero-delay timer still queues a new task; the microtask queue is drained before the next task, so C comes before B.
        - id: acbd
          text: A C B D
          feedback: D is synchronous and prints before any queued callback.
      correct: [acdb]
      hints:
        - Which lines run synchronously, and which are queued?
        - Is a promise reaction a task or a microtask?
      solution: |
        The script is one task: A, D. When it ends, the microtask queue (C) is drained, then the next task - the
        timer (B). See [DOM events and the event loop](#/lesson/dom-events-event-loop).

  - rounds: [domain-deep-dive]
    subjects: [fullstack]
    exercise:
      id: fs-effect-stale-response
      type: interview
      concept: fullstack-engineering
      skill: analysis
      title: The search box that shows the wrong results
      prompt: |
        A React search box fetches results in a `useEffect` whenever the query changes. Users typing fast
        sometimes see results for an earlier query. Why, and how do you fix it?
      hints:
        - Do responses always arrive in the order the requests were sent?
        - What does an effect's cleanup function run before?
      modelAnswer: |
        It is a race: each keystroke starts a request, and an older, slower response can arrive after a newer
        one and overwrite it. React runs an effect's **cleanup** before the effect runs again with new
        dependencies (and on unmount), so the fix is to make each effect ignore - or cancel - its own request
        once it is stale:

        ```tsx
        useEffect(() => {
          const controller = new AbortController();
          fetch(`/api/search?q=${encodeURIComponent(query)}`, { signal: controller.signal })
            .then((r) => r.json())
            .then(setResults)
            .catch((e) => { if (e.name !== 'AbortError') setError(e); });
          return () => controller.abort();
        }, [query]);
        ```

        An `ignore` flag set in cleanup works too (react.dev shows that pattern). Debouncing reduces requests
        but doesn't remove the race on its own. A data-fetching library or router loader handles this for you.
      rubric:
        - Identifies out-of-order responses as the cause.
        - Uses the effect cleanup to cancel or ignore the stale request.
        - Handles the AbortError without treating it as a failure.
        - Knows debouncing alone doesn't fix the race.
      followUps:
        - How would you write a test that reproduces this race deterministically?
        - What changes if the results come from a router loader instead?
      solution: |
        Out-of-order responses; cancel or ignore the previous request in the effect's cleanup. See [React state
        and effects](#/lesson/react-state-and-effects).

  - rounds: [domain-deep-dive]
    subjects: [fullstack]
    exercise:
      id: fs-state-placement
      type: short
      concept: fullstack-engineering
      skill: application
      title: Where should this state live?
      prompt: |
        A dashboard has: the signed-in user, the payments list fetched from the API, the current filter (status
        and date range), and whether a "refund" dialog is open. Where does each piece of state belong, and why?
      hints:
        - Which state is a copy of server data?
        - Which state should survive a reload or be shareable as a link?
      modelAnswer: |
        - **Payments list** - server state: a cache of API data, owned by a data-fetching layer (router loaders
          or a query library) with refetching and invalidation, not copied into a global store.
        - **Filter** - URL search params: it survives reload, back/forward works and the view can be shared.
        - **Dialog open** - local component state (`useState`) in the component that renders it.
        - **Signed-in user** - app-wide context (or loaded once by the root route), because many components read
          it and it changes rarely.

        The rule: keep state as close to where it is used as possible, don't duplicate server data, and put
        what defines "what am I looking at" in the URL.
      rubric:
        - Treats fetched data as server state, not app state.
        - Puts the filter in the URL with a reason.
        - Keeps the dialog local.
        - Gives a general rule rather than "put everything in Redux".
      solution: |
        Server cache for the list, URL for the filter, local state for the dialog, context for the user. See
        [frontend state management](#/lesson/frontend-state-management).

  - rounds: [domain-deep-dive, debugging-rca]
    subjects: [fullstack]
    exercise:
      id: fs-express-async-error
      type: mcq
      concept: fullstack-engineering
      skill: analysis
      title: The error handler that never runs
      prompt: |
        In an Express 5 app, an `async` route handler awaits a database call that rejects. The app has an error
        middleware `(err, req, res, next) => ...` registered **before** the routes. Clients get Express's
        default HTML error page instead of your JSON problem details. Why?
      options:
        - id: order
          text: Error-handling middleware must be registered after the routes; Express passes the error to error handlers that come later in the stack.
          feedback: Correct - Express 5 forwards a rejected promise from a handler to next(err), but only error handlers registered after that point receive it.
        - id: async
          text: Express 5 does not catch rejected promises from async handlers; wrap every handler in try/catch.
          feedback: That was Express 4. Express 5 calls next(err) when a handler's returned promise rejects.
        - id: three-args
          text: The error handler needs three arguments, not four.
          feedback: The opposite - Express recognises an error handler by its four parameters.
        - id: json
          text: The error handler must call res.json before next().
          feedback: The handler isn't reached at all - its position is the problem.
      correct: [order]
      hints:
        - How does Express find which middleware handles an error?
        - What changed about async handlers between Express 4 and 5?
      solution: |
        Move the four-argument error middleware after the routes. See [an Express HTTP
        API](#/lesson/express-http-server) and [input validation and error
        handling](#/lesson/input-validation-and-error-handling).

  - rounds: [domain-deep-dive, system-test-strategy]
    subjects: [fullstack]
    exercise:
      id: fs-rest-status-codes
      type: short
      concept: fullstack-engineering
      skill: application
      title: Pick the status codes
      prompt: |
        For a `POST /v1/payments/{id}/refunds` endpoint, which status code do you return for: a created refund;
        a body that fails validation; a payment that belongs to another merchant; a refund larger than the
        remaining amount; a client over its rate limit? Justify each.
      hints:
        - Should "it exists but isn't yours" reveal that it exists?
        - Is "too large" a syntax problem or a conflict with the resource's state?
      modelAnswer: |
        - **201 Created** with a `Location` of the new refund.
        - **400 Bad Request** (or 422 if the API reserves 400 for malformed syntax and 422 for well-formed but
          invalid content) - with a problem details body listing the fields.
        - **404 Not Found** - returning 403 would confirm the payment exists to a merchant who may not know it;
          many APIs use 404 for other tenants' resources.
        - **409 Conflict** or **422** - the request is valid but conflicts with the payment's current state;
          pick one and document it.
        - **429 Too Many Requests** with `Retry-After`.

        Consistency matters more than the exact choice where two codes are defensible: document them in the
        OpenAPI contract and use problem details (RFC 9457) for every error.
      rubric:
        - Uses 201 for creation.
        - Distinguishes validation errors from state conflicts.
        - Considers information leakage for another tenant's resource.
        - Uses 429 with Retry-After.
        - Mentions documenting the choice and a consistent error format.
      solution: |
        201, 400/422, 404, 409/422, 429 - with reasons and a documented, consistent problem details format.
        See [REST API design](#/lesson/rest-api-design).

  - rounds: [domain-deep-dive, online-assessment]
    subjects: [fullstack]
    exercise:
      id: fs-composite-index
      type: mcq
      concept: fullstack-engineering
      skill: application
      title: Which index serves the query?
      prompt: |
        The hottest query is
        `SELECT * FROM payments WHERE merchant_id = $1 AND status = 'succeeded' ORDER BY created_at DESC LIMIT 50`.
        Which single B-tree index lets PostgreSQL find the rows and return them in order without sorting?
      options:
        - id: eq-eq-sort
          text: (merchant_id, status, created_at DESC)
          feedback: Correct - equality columns first, then the sort column, so the 50 rows are read in order from the index.
        - id: sort-first
          text: (created_at DESC, merchant_id, status)
          feedback: With the sort column first, the merchant's rows are scattered through the whole index.
        - id: separate
          text: Three separate indexes on merchant_id, status and created_at
          feedback: PostgreSQL may combine them with a bitmap scan, but then it must sort - and the status index is low-selectivity.
        - id: status-only
          text: (status)
          feedback: Most payments are probably succeeded - this index barely narrows anything and doesn't help the order.
      correct: [eq-eq-sort]
      hints:
        - Which columns are compared with = and which one is ordered?
        - In a multicolumn B-tree, which column order lets the scan start at one merchant's rows?
      solution: |
        Equality columns first, then the ORDER BY column. Confirm with EXPLAIN that the plan is an Index Scan
        with no Sort node. See [indexes and query plans](#/lesson/postgres-indexes-and-query-plans).

  - rounds: [domain-deep-dive, debugging-rca]
    subjects: [fullstack]
    exercise:
      id: fs-lost-update
      type: interview
      concept: fullstack-engineering
      skill: analysis
      title: Two refunds, one payment
      prompt: |
        Two refund requests for the same payment arrive at the same time. Each reads the refunded total, checks
        the new refund fits, and writes. Both succeed and the payment is refunded more than it was captured. The
        database is PostgreSQL at the default isolation level. Explain what happened and two ways to prevent it.
      hints:
        - What is the default isolation level, and what does it allow between a read and a later write?
        - How can the second transaction be made to wait for the first?
      modelAnswer: |
        A **lost update** under Read Committed (PostgreSQL's default): both transactions read the same old total,
        both pass the check, both write. Fixes:

        1. **Lock the row**: `SELECT ... FROM payments WHERE id = $1 FOR UPDATE` at the start; the second
           transaction waits, then reads the updated total and fails the check.
        2. **Atomic conditional update**: `UPDATE payments SET refunded_minor = refunded_minor + $2 WHERE id = $1
           AND refunded_minor + $2 <= captured_minor RETURNING ...` - zero rows means it didn't fit.
        3. Or run at **Serializable** and retry on SQLSTATE 40001.

        Back it with a CHECK constraint (`refunded_minor <= captured_minor`) so a bug can't violate the rule, and
        test it with two real concurrent connections, not one.
      rubric:
        - Names the lost update and the default isolation level.
        - Gives a row lock or an atomic conditional update.
        - Mentions Serializable with retries as an alternative.
        - Adds a database constraint as a backstop and a concurrency test.
      followUps:
        - How would you write an automated test that reliably reproduces this?
        - What does SKIP LOCKED do, and why is it wrong here?
      solution: |
        Read Committed lets both read the old total; lock with FOR UPDATE, use one conditional UPDATE, or use
        Serializable with retries - plus a CHECK constraint. See [transactions and
        isolation](#/lesson/transactions-and-isolation).

  - rounds: [domain-deep-dive]
    subjects: [fullstack]
    exercise:
      id: fs-zero-downtime-migration
      type: interview
      concept: fullstack-engineering
      skill: application
      title: Rename a column without downtime
      prompt: |
        You must rename `payments.amount` to `amount_minor` on a busy table, while old and new versions of the
        API run side by side during a rolling deploy. How?
      hints:
        - During the deploy, which versions of the code read and write the table?
        - Can you split the change into steps that are each compatible with both versions?
      modelAnswer: |
        Use **expand and contract** (parallel change):

        1. **Expand**: add `amount_minor` (nullable, no default rewrite); deploy code that writes both columns and
           still reads `amount`.
        2. **Backfill** in small batches; then add the NOT NULL constraint safely (for example a CHECK constraint
           added `NOT VALID` and validated separately, to avoid a long lock).
        3. **Switch reads** to `amount_minor`; keep writing both.
        4. **Contract**: once no running version uses `amount`, stop writing it and drop it in a later release.

        A plain `ALTER TABLE ... RENAME COLUMN` is instant in PostgreSQL but breaks every running instance that
        still uses the old name. Also set a `lock_timeout` on migrations so a blocked ALTER doesn't queue all
        traffic behind it.
      rubric:
        - Explains why a direct rename breaks the old version during a rolling deploy.
        - Describes expand, backfill, switch, contract in order.
        - Mentions batching and lock-safe constraint changes.
        - Mentions lock_timeout or another guard against lock queues.
      followUps:
        - How do you roll back halfway through?
        - How would you test the migration before production?
      solution: |
        Parallel change: add, dual-write, backfill, switch reads, drop later - each step compatible with both
        versions. See [migrations and data access](#/lesson/migrations-and-data-access).

  - rounds: [domain-deep-dive, online-assessment]
    subjects: [fullstack]
    exercise:
      id: fs-cookie-attributes
      type: mcq
      concept: fullstack-engineering
      skill: application
      title: The session cookie
      prompt: Which Set-Cookie header is the best choice for a dashboard's session id served only over HTTPS?
      options:
        - id: secure
          text: "Set-Cookie: __Host-sid=<random>; Path=/; Secure; HttpOnly; SameSite=Lax"
          feedback: Correct - HttpOnly keeps it from JavaScript, Secure from plain HTTP, SameSite limits cross-site sending, and the __Host- prefix requires Secure, Path=/ and no Domain.
        - id: localstorage
          text: No cookie - store the session token in localStorage and send it in a header.
          feedback: Any XSS can read localStorage; an HttpOnly cookie can't be read by script.
        - id: domain
          text: "Set-Cookie: sid=<random>; Domain=example.com; Secure"
          feedback: Domain widens it to every subdomain, and without HttpOnly script can read it.
        - id: none
          text: "Set-Cookie: sid=<random>; SameSite=None; HttpOnly"
          feedback: SameSite=None sends it on cross-site requests (CSRF exposure), and browsers reject SameSite=None without Secure.
      correct: [secure]
      hints:
        - Which attribute stops JavaScript from reading the cookie?
        - What does the __Host- prefix require?
      solution: |
        Secure, HttpOnly, SameSite=Lax (or Strict) and the __Host- prefix. See [sessions, cookies and
        tokens](#/lesson/sessions-cookies-and-tokens).

  - rounds: [domain-deep-dive]
    subjects: [fullstack]
    exercise:
      id: fs-pkce
      type: short
      concept: fullstack-engineering
      skill: recall
      title: What PKCE protects
      prompt: What attack does PKCE (RFC 7636) prevent in the OAuth 2.0 authorization code flow, and how does it work?
      hints:
        - What could an attacker do with a stolen authorization code?
        - What does the client send at the start, and what at the end?
      modelAnswer: |
        It stops an attacker who **intercepts the authorization code** from redeeming it. The client creates a
        random `code_verifier`, sends its SHA-256 hash as `code_challenge` (method `S256`) in the authorization
        request, and must send the original `code_verifier` when exchanging the code for tokens. The
        authorization server checks they match, so a stolen code alone is useless. OAuth 2.0 Security Best
        Current Practice (RFC 9700) recommends PKCE for all clients, including confidential ones.
      rubric:
        - Names authorization code interception (or injection).
        - Describes verifier, S256 challenge and the check at the token endpoint.
        - Knows it is recommended for all clients, not only mobile/SPA.
      solution: |
        Code interception; verifier → S256 challenge → verifier checked at the token endpoint. See [passwords,
        OAuth 2.0 and OpenID Connect](#/lesson/passwords-oauth-and-oidc).

  - rounds: [domain-deep-dive, debugging-rca]
    subjects: [fullstack]
    exercise:
      id: fs-xss-react
      type: interview
      concept: fullstack-engineering
      skill: analysis
      title: XSS in a React app
      prompt: |
        "React escapes everything, so we can't have XSS." A security review still finds one in your dashboard.
        Where would you look, and how do you prevent it?
      hints:
        - Which React APIs and HTML attributes bypass escaping?
        - What defence still helps if one slips through?
      modelAnswer: |
        React escapes text in JSX, but these bypass it:

        - `dangerouslySetInnerHTML` with user-controlled HTML (merchant notes, rich text) - sanitize with a
          maintained library or avoid HTML;
        - URLs in `href`/`src` from user data - a `javascript:` URL runs script; allow only http(s);
        - server-rendered HTML or templates outside React, and third-party scripts or widgets;
        - DOM APIs used directly (`innerHTML`, `insertAdjacentHTML`) in effects or libraries.

        Defence in depth: a strict **Content Security Policy** (nonces or hashes, no `unsafe-inline`), HttpOnly
        session cookies so script can't steal them, and tests that render known payloads and assert they appear
        as text.
      rubric:
        - Names dangerouslySetInnerHTML and javascript URLs.
        - Mentions non-React rendering paths or third-party scripts.
        - Recommends sanitizing or allow-listing, plus CSP.
        - Suggests a test with payloads.
      followUps:
        - What does a CSP nonce do, and why is unsafe-inline a problem?
        - How would you find every dangerouslySetInnerHTML in a large codebase and decide which are safe?
      solution: |
        Escaping covers JSX text only; look at dangerouslySetInnerHTML, URLs, non-React rendering and third-party
        code; sanitize, allow-list URL schemes and add a strict CSP. See [the OWASP Top 10 for
        developers](#/lesson/owasp-top-10-for-developers).

  - rounds: [domain-deep-dive, system-test-strategy]
    subjects: [fullstack]
    exercise:
      id: fs-testing-pyramid-stack
      type: short
      concept: fullstack-engineering
      skill: application
      title: Which test catches it?
      prompt: |
        For each bug, name the cheapest test that reliably catches it: (a) a refund over the captured amount is
        accepted because of a `>` instead of `>=`; (b) the unique constraint on merchant e-mail is missing; (c)
        the API renamed a field the React app reads; (d) the sign-in journey is broken by a CSP header.
      hints:
        - Choose the lowest layer that can see the bug.
        - Which bugs need a real database or a real browser?
      modelAnswer: |
        (a) A **unit test** on the refund rule at the boundary (equal and one more). (b) An **API or repository
        test against a real PostgreSQL** (PGlite or Testcontainers) inserting the e-mail twice - a mock can't
        see a constraint. (c) A **contract test** - the client's expectations or both sides validated against
        the OpenAPI schema. (d) An **end-to-end test** in a real browser - only a browser enforces CSP.
      rubric:
        - Unit for the boundary, with boundary values.
        - Real database for the constraint, and why a mock fails.
        - Contract test for the renamed field.
        - End-to-end only for the browser-level failure.
      solution: |
        Unit, API with a real database, contract, end-to-end. See [testing a full stack
        app](#/lesson/fullstack-testing-strategy).

  - rounds: [coding-dsa]
    subjects: [fullstack]
    exercise:
      id: fs-lru-cache
      type: interview
      concept: coding-problem-solving
      skill: application
      title: An LRU cache in TypeScript
      prompt: |
        Implement `class LruCache<K, V>` with `constructor(capacity: number)`, `get(key): V | undefined` and
        `set(key, value): void`, both O(1). When full, `set` of a new key evicts the least recently used entry;
        `get` and `set` both count as a use. Example with capacity 2: `set(a,1) set(b,2) get(a) set(c,3)` evicts
        `b`, so `get(b)` is undefined and `get(a)` is 1.
      hints:
        - A JavaScript Map remembers insertion order.
        - Moving a key to "most recent" can be a delete followed by a set.
      modelAnswer: |
        ```typescript
        class LruCache<K, V> {
          private readonly entries = new Map<K, V>();
          constructor(private readonly capacity: number) {
            if (!Number.isInteger(capacity) || capacity < 1) throw new RangeError('capacity must be >= 1');
          }
          get(key: K): V | undefined {
            if (!this.entries.has(key)) return undefined;
            const value = this.entries.get(key) as V;
            this.entries.delete(key); // move to most recent
            this.entries.set(key, value);
            return value;
          }
          set(key: K, value: V): void {
            this.entries.delete(key);
            this.entries.set(key, value);
            if (this.entries.size > this.capacity) {
              const oldest = this.entries.keys().next().value as K; // first key = least recently used
              this.entries.delete(oldest);
            }
          }
        }
        ```

        A `Map` iterates in insertion order, so delete-then-set moves a key to the end and the first key is the
        least recently used - each operation is O(1). `has` before `get` keeps `undefined` values correct. In a
        language without an ordered map, use a hash map plus a doubly linked list.
      rubric:
        - Correct eviction order, with get counting as a use.
        - O(1) operations, with the reason.
        - Handles updating an existing key and stored undefined values.
        - Tests the example and an edge case (capacity 1, overwrite).
      followUps:
        - How would you add a time-to-live per entry?
        - Where would an LRU cache sit in a Node.js API, and what is wrong with it when you run four instances?
      solution: |
        Use Map's insertion order: delete and re-insert on every use; evict the first key when over capacity.

  - rounds: [system-test-strategy]
    subjects: [fullstack]
    exercise:
      id: fs-sd-url-shortener
      type: interview
      concept: system-design
      skill: analysis
      title: Design a link shortener for payment links
      prompt: |
        SandPay (fictional) wants short links for payment pages: merchants create them in the dashboard, and
        customers open them from SMS. Expect 1 million new links a day and 50 million clicks a day. Design it.
      hints:
        - Start with requirements and turn the numbers into per-second rates.
        - Which path is hot - creating links or following them?
      modelAnswer: |
        **Requirements:** create a link (merchant, target URL, expiry); redirect fast; links expire; no
        guessable codes (they lead to payment pages); click counts per link, may lag.

        **Estimates:** 1 M / 86,400 ≈ 12 creates/s; 50 M / 86,400 ≈ 580 redirects/s on average - say 3,000/s at
        an assumed 5x peak. Read-heavy, ~50:1. Rows are small: 1 M × ~300 B ≈ 300 MB a day.

        **API:** `POST /v1/links` → 201 `{ code, short_url }`; `GET /{code}` → 302 to the target (or 404/410 when
        expired). Use a 302 rather than 301 so browsers don't cache a redirect that can expire.

        **Data:** `links(code PRIMARY KEY, merchant_id, target_url, expires_at, created_at)`. Codes: random
        8+ characters from a URL-safe alphabet (not sequential ids - guessable); insert and retry on the rare
        unique-key collision.

        **Design:** stateless redirect service reading by primary key; a cache (code → target, TTL until expiry)
        absorbs the hot links; clicks go to a queue or a buffered counter and are aggregated asynchronously, so
        the redirect never waits on a write. The dashboard API writes links to the primary.

        **Deep dives:** cache invalidation when a merchant disables a link (delete the key, short TTL as a
        backstop); rate limiting creation per merchant; abuse - validate target URLs belong to SandPay's
        payment domain (no open redirect); expiry with 410 Gone.
      rubric:
        - Converts daily volumes into per-second rates with a peak assumption.
        - Identifies the redirect as the hot, read-heavy path and caches it.
        - Chooses non-guessable codes and handles collisions.
        - Picks 302 vs 301 with a reason.
        - Takes click counting off the request path.
        - Addresses abuse (open redirect) and expiry.
      followUps:
        - A merchant disables a link; how fast must it stop working, and how do you guarantee it?
        - How would you test the redirect path's p99 under load?
      solution: |
        Small write path, hot read path: random codes with a unique key, cached redirects (302), asynchronous
        click counts, open-redirect protection and expiry. See [full stack system design and mock
        interview](#/lesson/fullstack-system-design-interview).

  - rounds: [system-test-strategy, domain-deep-dive]
    subjects: [fullstack]
    exercise:
      id: fs-sd-notifications
      type: interview
      concept: system-design
      skill: analysis
      title: Real-time payment notifications in the dashboard
      prompt: |
        Merchants want new payments to appear in the open dashboard within 2 seconds, without reloading. 5,000
        dashboards are open at peak. How would you build it, and what can go wrong?
      hints:
        - Which transport fits one-way server-to-browser updates?
        - What happens when a connection drops for 30 seconds?
      modelAnswer: |
        **Transport:** server-to-browser only, so **Server-Sent Events** (`text/event-stream`, built into
        browsers with `EventSource` and automatic reconnect) or WebSockets if two-way messages are needed. 5,000
        long-lived connections are fine for Node.js, but the load balancer's idle timeout and connection limits
        must be configured for them.

        **Source of events:** the payment is committed with an outbox row in the same transaction; a relay
        publishes to a pub/sub channel per merchant; each API instance subscribes for the merchants connected to
        it and pushes to their streams.

        **Gaps:** a dropped connection misses events. Give each event an id; SSE sends `Last-Event-ID` on
        reconnect, and the server replays from the outbox or simply tells the client to refetch the first page.
        Treat push as a hint and the API list as the truth.

        **Scale and safety:** authenticate the stream with the session cookie, scope it to the merchant,
        heartbeat comments to keep proxies from closing idle connections, and back off on reconnect storms after
        a deploy.
      rubric:
        - Chooses SSE or WebSockets with a reason.
        - Gets events from a reliable source (outbox or change feed), not a dual write.
        - Handles missed events on reconnect.
        - Mentions load balancer timeouts, heartbeats and reconnect storms.
        - Scopes the stream to the merchant's session.
      followUps:
        - How do you deploy a new API version without dropping 5,000 connections at once?
        - How do you test that no event is lost across a reconnect?
      solution: |
        SSE fed from the outbox via pub/sub, event ids with Last-Event-ID replay or a refetch, heartbeats and
        timeouts configured, merchant-scoped authentication.

  - rounds: [system-test-strategy, online-assessment]
    subjects: [fullstack]
    exercise:
      id: fs-sd-replica-read
      type: mcq
      concept: system-design
      skill: analysis
      title: Read-after-write on a replica
      prompt: |
        After moving reads to an asynchronous PostgreSQL read replica, users sometimes don't see a change they
        saved a moment ago; it appears after a reload a few seconds later. What is the best first fix?
      options:
        - id: primary-window
          text: Route each user's reads to the primary for a few seconds after they write, and keep everyone else on the replica.
          feedback: Correct - it gives the writer read-your-writes and keeps the replica's capacity for everyone else.
        - id: no-replica
          text: Remove the replica - replicas can't be used for user-facing reads.
          feedback: They can; you need a rule for the reads that must see the user's own writes.
        - id: cache
          text: Put a cache in front of the replica.
          feedback: A cache adds another stale copy - it makes the problem more likely, not less.
        - id: vacuum
          text: Run VACUUM more often on the primary.
          feedback: Vacuum doesn't make WAL replay faster; the delay is asynchronous replication.
      correct: [primary-window]
      hints:
        - Is the data lost, or late?
        - Who needs the fresh data - every user, or the one who wrote it?
      solution: |
        Asynchronous replication is eventually consistent. Give the writer read-your-writes (primary for a short
        window, or an LSN check) - see [full stack system design and mock
        interview](#/lesson/fullstack-system-design-interview).

  - rounds: [system-test-strategy, domain-deep-dive]
    subjects: [fullstack]
    exercise:
      id: fs-sd-rate-limit
      type: interview
      concept: system-design
      skill: application
      title: Rate limiting an API across servers
      prompt: |
        Design rate limiting for a public API running on six servers: each API key may make 100 requests per
        second with bursts up to 200. What algorithm, where are the counters, and what does the client see?
      hints:
        - Which algorithm has both a burst size and a sustained rate?
        - What goes wrong if each server counts on its own?
      modelAnswer: |
        A **token bucket** per API key: capacity 200 (the burst), refill 100 tokens per second (the rate).
        Counters in a **shared store** (for example Redis with an atomic script, or the gateway's built-in
        limiter) because six in-memory limiters would allow six times the limit; alternatively route each key to
        one server, at the cost of uneven load. Refused requests get **429 Too Many Requests** with
        **Retry-After** (RFC 6585, RFC 9110) and a problem details body; 429 must not be cached. Decide what
        happens if the store is down - fail open for read endpoints, maybe fail closed for expensive ones - and
        monitor 429s per key. Document the limits; the IETF RateLimit header draft can advertise them, labelled
        as a draft.
      rubric:
        - Names token bucket (or sliding window) with burst and rate mapped to parameters.
        - Explains why per-server counters are wrong and offers a shared store or sticky routing.
        - Returns 429 with Retry-After and a clear body.
        - Decides fail-open versus fail-closed.
        - Mentions monitoring and documenting limits.
      followUps:
        - How do you test the limiter without waiting in real time?
        - Clients retry immediately after a 429. What do you tell them, and how do you enforce it?
      solution: |
        Token bucket (200 burst, 100/s) in a shared store, 429 with Retry-After, a fail-open/closed decision and
        monitoring. See [full stack system design and mock
        interview](#/lesson/fullstack-system-design-interview).

  - rounds: [system-test-strategy]
    subjects: [fullstack]
    exercise:
      id: fs-sd-outbox
      type: short
      concept: system-design
      skill: application
      title: Save and notify
      prompt: |
        When an order is saved, an e-mail must be sent and a webhook delivered. The code commits the order, then
        publishes an event to a queue. What can go wrong, and what pattern fixes it?
      hints:
        - What if the process stops between the commit and the publish?
        - Once fixed, can an event be delivered twice?
      modelAnswer: |
        A **dual write**: if the process crashes or the queue is down after the commit, the order exists but no
        event is ever sent (and publishing first gives events for orders that rolled back). The **transactional
        outbox** fixes it: insert the event into an outbox table in the same transaction as the order; a relay
        publishes unpublished rows and marks them sent. The relay can send an event twice (crash after send,
        before marking), so the e-mail and webhook consumers must be **idempotent** - record processed event ids.
      rubric:
        - Explains the crash window between commit and publish.
        - Describes the outbox written in the same transaction and a relay.
        - States at-least-once delivery and idempotent consumers.
      solution: |
        Dual write → transactional outbox + relay → idempotent consumers.

  - rounds: [debugging-rca]
    subjects: [fullstack]
    exercise:
      id: fs-pool-exhaustion
      type: interview
      concept: debugging-and-rca
      skill: analysis
      title: Requests hang under load
      prompt: |
        Under load, some API requests hang for 30 seconds and then fail, while CPU is low on both the API servers
        and PostgreSQL. Logs show "timeout exceeded when trying to connect" from the node-postgres pool. What do
        you suspect, how do you confirm it, and how do you fix it?
      hints:
        - What is a request waiting for when CPU is idle?
        - Which code paths might take a client from the pool and not give it back?
      modelAnswer: |
        **Suspect:** pool exhaustion - every pooled client is checked out, so new requests wait for one. Either
        clients **leak** (a code path calls `pool.connect()` and never `release()`, often an early return or a
        thrown error without `finally`), or clients are held too long (a slow external call made inside a
        transaction), or the pool is too small for the load.

        **Confirm:** log `pool.totalCount`, `pool.idleCount` and `pool.waitingCount` over time - a leak shows
        total at the maximum, idle at 0 and waiting growing even when traffic drops. In PostgreSQL,
        `pg_stat_activity` shows connections `idle in transaction` for a long time. Reproduce with the error path
        that skips release.

        **Fix:** release in `finally` (or use `pool.query` for single queries); never hold a transaction across a
        network call; set `idle_in_transaction_session_timeout` and statement timeouts; size the pool with
        Little's law and keep total connections under PostgreSQL's `max_connections`.
      rubric:
        - Identifies pool exhaustion and lists leak, long holds and undersizing as causes.
        - Confirms with pool counters and pg_stat_activity before changing code.
        - Fixes with release in finally and no network calls inside transactions.
        - Mentions timeouts and sizing against max_connections.
      followUps:
        - How would you write a test that fails if a code path leaks a client?
        - Twenty API instances each have a pool of 20. What problem is waiting for you?
      solution: |
        Pool exhaustion from leaked or long-held clients; confirm with pool counters and pg_stat_activity; release
        in finally, keep transactions short, add timeouts, size against max_connections. See [migrations and
        data access](#/lesson/migrations-and-data-access).

  - rounds: [domain-deep-dive, online-assessment]
    subjects: [fullstack]
    exercise:
      id: fs-accessible-button
      type: mcq
      concept: fullstack-engineering
      skill: application
      title: The clickable div
      prompt: |
        A "Refund" control is written as `<div class="btn" onClick={refund}>Refund</div>`. Mouse users are
        fine. What is the best fix for keyboard and screen reader users?
      options:
        - id: button
          text: Use <button type="button" onClick={refund}>Refund</button>
          feedback: Correct - a native button is focusable, activates with Enter and Space, and has the button role, with nothing extra to maintain.
        - id: role
          text: Add role="button" to the div.
          feedback: The role is announced, but the div still isn't focusable and doesn't respond to Enter or Space - you'd have to add tabindex and key handlers yourself.
        - id: tabindex
          text: Add tabindex="0" to the div.
          feedback: Now it can be focused, but it has no role and Enter or Space do nothing.
        - id: aria-label
          text: Add aria-label="Refund".
          feedback: It already has a text name; the problems are focus, keyboard activation and role.
      correct: [button]
      hints:
        - What does a native button give you for free?
        - Which two keys activate a button?
      solution: |
        Use the native element. See [web accessibility and WCAG 2.2](#/lesson/web-accessibility-wcag) and
        [semantic HTML and forms](#/lesson/html-semantics-and-forms).
