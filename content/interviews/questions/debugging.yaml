questions:
  - rounds: [debugging-rca, automation-coding]
    subjects: [java, ui-automation, frameworks]
    exercise:
      id: db-selenium-sleep
      type: debug
      concept: debugging-and-rca
      skill: analysis
      title: A test that fails on slow days
      prompt: |
        This Selenium test fails a few times a week with `expected: <SUCCEEDED> but was: <PENDING>`. Which line
        causes it?
      language: java
      code: |
        @Test
        void showsSucceededStatus() throws InterruptedException {
            driver.get(baseUrl + "/checkout");
            driver.findElement(By.id("pay")).click();
            Thread.sleep(2000);
            String status = driver.findElement(By.id("status")).getText();
            assertEquals("SUCCEEDED", status);
        }
      correctLines: [5]
      lineNotes:
        - line: 7
          note: The assertion is right - it fails only because the status was read before it was final.
        - line: 6
          note: Reading the status once is the symptom; the cause is guessing how long to wait on line 5.
      hints:
        - The status changes asynchronously. How does the test decide when to read it?
      solution: |
        **Line 5.** A fixed sleep guesses the timing: too short on a slow day (flaky), too long on a fast one (slow
        suite). Wait for the state instead - for example `WebDriverWait` until the status is SUCCEEDED or FAILED.
      followUp: |
        Write the wait so that a FAILED status fails the test immediately with a clear message instead of timing out.
  - rounds: [debugging-rca, automation-coding]
    subjects: [playwright]
    exercise:
      id: db-playwright-missing-await
      type: debug
      concept: debugging-and-rca
      skill: analysis
      title: A Playwright test that never fails
      prompt: |
        This test kept passing even after the cart total was broken. Which line is the defect?
      language: typescript
      code: |
        test('shows the cart total', async ({ page }) => {
          await page.goto('/shop/');
          await page.getByRole('button', { name: 'Add to cart' }).first().click();
          expect(page.getByTestId('cart-total')).toHaveText('€4.50');
        });
      correctLines: [4]
      lineNotes:
        - line: 3
          note: "`.first()` is a deliberate choice here, and the click is awaited."
      hints:
        - Web-first assertions such as `toHaveText` retry over time. What does that make them return?
      solution: |
        **Line 4.** `toHaveText` is an asynchronous, retrying assertion and returns a promise. Without `await`, the
        test function can finish before the assertion has been checked, so a failure can be missed or reported
        against the wrong place. Add `await`; the `@typescript-eslint/no-floating-promises` lint rule catches this
        class of mistake.
  - rounds: [debugging-rca, domain-deep-dive]
    exercise:
      id: db-retry-new-key
      type: debug
      concept: debugging-and-rca
      skill: analysis
      title: Charged twice after a timeout
      prompt: |
        After a network incident, some customers were charged twice. This (fictional SandPay) client code ran
        during the incident. Which line causes the double charges?
      language: java
      code: |
        Payment createWithRetry(PaymentRequest request) {
            for (int attempt = 1; attempt <= 3; attempt++) {
                String key = UUID.randomUUID().toString();
                try {
                    return client.create(request, key);
                } catch (TimeoutException e) {
                    log.warn("attempt {} timed out", attempt);
                }
            }
            throw new IllegalStateException("payment failed");
        }
      correctLines: [3]
      lineNotes:
        - line: 10
          note: Misleading - after timeouts the outcome is unknown, not failed - but this line doesn't charge anyone.
        - line: 6
          note: Retrying after a timeout is reasonable - if the retry is idempotent.
      hints:
        - A timeout doesn't mean the first request failed. What makes a retry safe?
      solution: |
        **Line 3.** A new idempotency key per attempt makes each retry a new payment. After a timeout the first
        request may have succeeded, so the retry charges again. Create the key once, before the loop, and reuse it.
        See [idempotency keys](#/lesson/idempotency-keys).
  - rounds: [debugging-rca]
    subjects: [playwright]
    exercise:
      id: db-foreach-async
      type: debug
      concept: debugging-and-rca
      skill: analysis
      title: Refunds that finish too late
      prompt: |
        The log says "all refunds sent" before any refund has finished, and failed refunds are never reported.
        Which line is the cause?
      language: typescript
      code: |
        async function refundAll(ids: string[]) {
          ids.forEach(async (id) => {
            await api.refund(id);
          });
          console.log('all refunds sent');
        }
      correctLines: [2]
      lineNotes:
        - line: 5
          note: The log is only wrong because nothing before it waited.
      hints:
        - What does `forEach` do with the promise an async callback returns?
      solution: |
        **Line 2.** `forEach` ignores the promises returned by async callbacks, so nothing waits for them and their
        rejections go unhandled. Use `for (const id of ids) await api.refund(id);` to run them one by one, or
        `await Promise.all(ids.map((id) => api.refund(id)))` to run them together.
  - rounds: [debugging-rca, online-assessment]
    exercise:
      id: db-sql-date-range
      type: debug
      concept: sql-and-data
      skill: analysis
      title: January is missing a day
      prompt: |
        `created_at` is a timestamp. Finance says January's totals are missing payments from 31 January. Which line
        is wrong?
      language: sql
      code: |
        SELECT customer_id, SUM(amount_minor) AS total
        FROM payments
        WHERE status = 'SUCCEEDED'
          AND created_at >= '2026-01-01'
          AND created_at <= '2026-01-31'
        GROUP BY customer_id;
      correctLines: [5]
      lineNotes:
        - line: 4
          note: The start of the range is fine - midnight on 1 January is included.
      hints:
        - What time of day does the literal '2026-01-31' mean when compared with a timestamp?
      solution: |
        **Line 5.** Compared with a timestamp, `'2026-01-31'` means midnight at the start of 31 January, so later
        payments that day are excluded. Use a half-open range: `created_at < '2026-02-01'`. (Time zones are the
        next question to ask.)
  - rounds: [debugging-rca]
    exercise:
      id: rca-local-vs-ci
      type: interview
      concept: debugging-and-rca
      skill: analysis
      title: Passes locally, fails in CI
      prompt: |
        **Interviewer:** "A UI test passes on your laptop every time but fails in CI about half the time. Walk me
        through how you find the cause."
      hints:
        - List what is different between the two environments, then collect evidence.
      modelAnswer: |
        - **Evidence first:** the CI failure message, screenshot, trace or video, logs, and whether it fails at the
          same step.
        - **Differences:** headless versus headed, screen size, CPU speed (timing), browser and driver versions,
          time zone and locale, test data and environment, parallel workers, network access.
        - **Reproduce:** run locally with CI's settings (headless, same viewport, same browser version, parallel),
          or run in the CI container; repeat the test many times.
        - **Hypotheses:** for example "a missing wait that only shows on slower machines" - confirm by adding
          tracing or slowing the machine before fixing.
        - **Fix and guard:** the real cause (a wait for state, isolated data), not a retry; keep the evidence on
          failure.
      rubric:
        - Started from evidence such as screenshots, traces and logs
        - Listed concrete differences between local and CI
        - Reproduced with CI's conditions or repeated runs
        - Confirmed a hypothesis before fixing
        - Fixed the cause rather than adding retries
      solution: |
        "Works on my machine" is a list of differences waiting to be checked - interviewers want to see that list
        and a method for narrowing it.
      followUps:
        - What would you add to the framework so the next failure is easier to diagnose?
  - rounds: [debugging-rca, domain-deep-dive]
    exercise:
      id: rca-duplicate-charges
      type: interview
      concept: debugging-and-rca
      skill: analysis
      title: Duplicate charges after a release
      prompt: |
        **Interviewer:** "After yesterday's release, support reports a handful of customers charged twice. How do
        you investigate?"
      hints:
        - Scope the impact, find the common factor, then the mechanism.
      modelAnswer: |
        - **Contain:** confirm the reports with data (two successful payments for one order), estimate how many are
          affected, and alert the team - refunds and possibly a rollback or feature flag.
        - **Find the pattern:** what affected payments share - payment method, app version, retries, timeouts, time
          window, one service instance.
        - **Trace one case end to end:** request ids, idempotency keys, provider references, timestamps across
          client, backend and provider logs.
        - **Likely mechanisms:** retries without the same idempotency key, a double-submitted form, a webhook
          processed twice, a race between two workers.
        - **Fix and prevent:** fix the mechanism, add a test that reproduces it, reconcile and refund everyone
          affected, and add monitoring for duplicate charges.
      rubric:
        - Contained impact and informed others first
        - Looked for a common pattern across affected payments
        - Traced one case with ids across systems
        - Named plausible mechanisms such as retries without idempotency
        - Added a regression test, refunds and monitoring
      solution: |
        Payments debugging starts with **customer impact**, then evidence across systems - see
        [declines, timeouts and unknown outcomes](#/lesson/declines-timeouts-unknown-outcomes).
      followUps:
        - Which test would have caught this before release?
  - rounds: [debugging-rca]
    exercise:
      id: rca-error-spike
      type: interview
      concept: debugging-and-rca
      skill: analysis
      title: Errors after a deploy
      prompt: |
        **Interviewer:** "Ten minutes after a deploy, the error rate of the checkout API rises from 0.1% to 5%.
        What do you do?"
      hints:
        - Stop the bleeding, then investigate.
      modelAnswer: |
        - **Mitigate first:** the deploy is the obvious suspect - roll back or disable the change if that is the
          team's process, and confirm the rate drops.
        - **Characterise:** which endpoints, status codes, clients, regions; new error messages in logs; timing
          relative to the deploy.
        - **Compare:** what changed in the release (code, config, dependencies, migrations); reproduce in a test
          environment.
        - **Root cause and prevention:** fix, add a test for the case, and consider canary releases and alerts that
          would have caught it with less impact.
      rubric:
        - Mitigated first, for example with a rollback
        - Characterised the errors by endpoint, code and client
        - Compared the release changes and reproduced the issue
        - Added prevention such as tests, canaries or alerts
      solution: |
        Interviewers check for **mitigation before investigation** - customers first, root cause second.
      followUps:
        - What if rolling back isn't possible because of a database migration?
  - rounds: [debugging-rca]
    exercise:
      id: rca-off-by-a-cent
      type: interview
      concept: debugging-and-rca
      skill: analysis
      title: Totals off by a cent
      prompt: |
        **Interviewer:** "Some order totals are one cent higher in the app than in the payment provider's records.
        It happens only for some combinations of items. What do you suspect and how do you confirm it?"
      hints:
        - Which kinds of arithmetic produce small, combination-dependent differences?
      modelAnswer: |
        - **Suspects:** floating-point arithmetic for money, rounding per item versus on the total, different
          rounding modes, tax or discount calculated in a different order on each side.
        - **Confirm:** collect failing orders and their item amounts, recompute both ways, find the smallest
          example that reproduces it, check the code paths that compute the total.
        - **Fix:** integer minor units or decimal types, one agreed rounding rule and place; tests with the
          problematic combinations and boundary values.
      rubric:
        - Suspected floating-point or rounding differences
        - Collected concrete failing examples and recomputed them
        - Reduced it to a minimal reproduction
        - Proposed exact money arithmetic and a single rounding rule
        - Added tests for the problematic combinations
      solution: |
        Money in floating point is a classic interview topic: `0.1 + 0.2` is not exactly `0.3` in binary floating
        point.
      followUps:
        - Where in a payment flow can rounding legitimately differ, for example with currency conversion?
  - rounds: [debugging-rca, automation-coding]
    exercise:
      id: rca-unfamiliar-codebase
      type: interview
      concept: debugging-and-rca
      skill: analysis
      title: An unfamiliar codebase with failing tests
      prompt: |
        **Interviewer:** "Here is a repository you have never seen, with a few failing tests and an AI coding
        assistant available. You have 60 minutes to make the tests pass and add a small feature. How do you work?"
        (Some companies have piloted rounds like this.)
      hints:
        - Orientation, small verified steps, and you stay responsible for every change.
      modelAnswer: |
        - **Orient:** read the README, run the tests, skim the structure and the failing tests first - they describe
          the expected behaviour.
        - **Plan out loud:** pick the failure with the clearest message; form a hypothesis before changing code.
        - **Small steps:** one change at a time, re-running the relevant tests after each.
        - **Use the assistant deliberately:** ask it to explain code or draft a change, then read and check what it
          produces; never paste changes you can't explain.
        - **Feature:** write or extend a test first, implement, run the whole suite.
        - **Communicate:** keep the interviewer informed about progress, trade-offs and what you would do with more
          time.
      rubric:
        - Oriented by running the tests and reading them first
        - Worked in small steps verified by tests
        - Used the AI assistant critically and verified its output
        - Wrote or extended a test for the feature
        - Explained their reasoning throughout
      solution: |
        Rounds like this test **judgement and verification** - the assistant speeds you up only if you can tell
        when it is wrong.
      followUps:
        - The assistant's fix makes the test pass but you don't understand why. What do you do?
