questions:
  - rounds: [recruiter-screen]
    exercise:
      id: rs-walk-me-through
      type: interview
      concept: motivation-and-communication
      skill: application
      title: Walk me through your background
      prompt: |
        **Recruiter:** "Walk me through your background and what you're working on now."
      hints:
        - Past, present, future - in about 90 seconds.
      modelAnswer: |
        - **Past (one or two sentences):** where you started and the thread that connects your roles - for
          example manual testing of payment flows, then API and UI automation.
        - **Present (the most detail):** your current role, the product, your responsibilities and one
          concrete result ("I automated our checkout regression in Playwright; the release check went from two
          days to forty minutes").
        - **Future:** why this role is the next step - the skill or domain you want to grow in, and why at this
          company.
        - Stops after about 90 seconds and invites questions.
      rubric:
        - Kept it to about 90 seconds with a clear past, present and future
        - Gave at least one concrete, measurable result
        - Connected the story to this specific role
        - Ended in a way that invites follow-up questions
      solution: |
        The recruiter is checking **clarity and fit**, not testing knowledge. A rehearsed, specific story beats a
        complete one.
      followUps:
        - Which part of your current work do you enjoy most?
        - What would you like to do less of?
  - rounds: [recruiter-screen]
    exercise:
      id: rs-why-this-role
      type: interview
      concept: motivation-and-communication
      skill: application
      title: Why this role?
      prompt: |
        **Recruiter:** "Why are you interested in this role - and in us?"
      hints:
        - Something about the role, something about the company, something about you.
      modelAnswer: |
        - **The role:** the work itself - for example owning automation for a payments product, or moving from
          scripted testing to framework and CI work.
        - **The company:** one specific, researched reason - the product, its users, its engineering practices,
          or a problem it solves.
        - **You:** the experience you bring that matches, so it sounds like a good fit both ways.
        - Avoids answers only about salary, brand name or "I need a change".
      rubric:
        - Named something specific about the role's work
        - Named something specific and researched about the company
        - Connected their own experience to the role
        - Avoided purely negative or money-only reasons
      solution: |
        Specificity is the signal - generic praise sounds like an answer sent to every company.
      followUps:
        - What do you know about our product?
        - What other roles are you considering?
  - rounds: [recruiter-screen]
    exercise:
      id: rs-current-project
      type: interview
      concept: motivation-and-communication
      skill: application
      title: Describe your current project
      prompt: |
        **Recruiter:** "Tell me about the project you're on now - what does it do and what is your part?"
      hints:
        - The product in one sentence, then your responsibilities, then your tools.
      modelAnswer: |
        - The product in one sentence a non-specialist understands ("a sales app field agents use to take
          orders and collect payments").
        - Team and process: team size, release cadence, how testing fits in.
        - Your part: what you test or automate, what you own end to end.
        - Tools and stack named briefly (Java, Selenium, Playwright, Postman, Jenkins...).
        - One result or improvement you drove.
      rubric:
        - Explained the product in plain language
        - Made their own responsibilities clear
        - Named tools without turning it into a list of buzzwords
        - Included a result or improvement
      solution: |
        Recruiters relay your answers to hiring managers - make your part easy to repeat.
      followUps:
        - What is the biggest problem your team has right now?
  - rounds: [recruiter-screen]
    exercise:
      id: rs-why-leaving
      type: interview
      concept: motivation-and-communication
      skill: application
      title: Why are you looking to move?
      prompt: |
        **Recruiter:** "Why are you looking for a change right now?"
      hints:
        - Towards something, not only away from something.
      modelAnswer: |
        - Frames the move as **growth towards** something: a domain, a scale, a kind of work (more automation,
          product company, ownership of quality).
        - Is honest without criticising the current employer or colleagues.
        - If there is a real constraint (relocation, company changes), states it briefly and moves on.
      rubric:
        - Framed the move positively, towards something
        - Did not criticise the current employer
        - Was consistent with the rest of their story
      solution: |
        Recruiters listen for red flags - blame and vagueness - more than for the reason itself.
      followUps:
        - What would make you stay where you are?
  - rounds: [recruiter-screen, hr-final]
    exercise:
      id: rs-logistics
      type: short
      concept: career-and-offer
      skill: application
      title: Notice period and logistics
      prompt: |
        **Recruiter:** "What's your notice period, where are you based, and are you open to working from the
        office?" Answer as you would on the call.
      hints:
        - Short, factual, and say what is negotiable.
      modelAnswer: |
        A direct answer to each: the notice period (and whether an early release or buy-out is possible), the
        current location and willingness to relocate or commute, and the work arrangement you can accept - plus
        any hard constraint, stated once, without over-explaining.
      rubric:
        - Answered each question directly
        - Said what is negotiable and what is not
        - Stayed brief and factual
      solution: |
        Logistics answers decide whether the process continues; vague ones create doubt.
  - rounds: [hr-final]
    exercise:
      id: hr-salary-expectations
      type: interview
      concept: career-and-offer
      skill: application
      title: Salary expectations
      prompt: |
        **HR:** "What are your salary expectations?"
      hints:
        - A researched range, and what it depends on.
      modelAnswer: |
        - Has researched the market band for the role, level and city (salary surveys, people in similar
          roles, the posting if it shows a range).
        - Gives a **range** anchored on that research and on the role's scope, not only on the current salary.
        - Mentions what else matters (variable pay, benefits, learning, the work) and stays open to discussing
          the whole offer.
        - Stays polite and confident; doesn't apologise for the number.
      rubric:
        - Gave a range based on research, not a guess
        - Linked it to the role's scope or level
        - Considered the whole offer, not only base salary
        - Stayed professional and confident
      solution: |
        The aim is a fair offer and a good start - a researched range shows both seriousness and realism.
      followUps:
        - Your range is above our budget. What now?
        - What is your current compensation?
  - rounds: [hr-final]
    exercise:
      id: hr-why-hire-you
      type: interview
      concept: career-and-offer
      skill: application
      title: Why should we hire you?
      prompt: |
        **HR:** "We've seen several good candidates. Why should we choose you?"
      hints:
        - Three reasons the team cares about, each with evidence.
      modelAnswer: |
        - Two or three strengths that match what the role needs (from the job description and earlier rounds).
        - Evidence for each - a result, a project, a piece of feedback.
        - One thing about how you work with others (ownership, communication).
        - Ends with genuine interest in the role.
      rubric:
        - Picked strengths that match the role
        - Backed each with evidence
        - Included how they work with others
        - Stayed confident without exaggerating
      solution: |
        Use what you learned in earlier rounds about the team's problems - and answer them.
      followUps:
        - What is your biggest weakness for this role?
  - rounds: [hr-final, recruiter-screen]
    exercise:
      id: hr-questions-for-us
      type: short
      concept: career-and-offer
      skill: application
      title: Do you have any questions for us?
      prompt: |
        **HR:** "Do you have any questions for us?" Write the two or three questions you would ask.
      hints:
        - Questions that help you decide - about the work, the team, how success is measured.
      modelAnswer: |
        Good questions are specific and useful for the decision, for example: what the first three months in
        the role look like; how testing and releases work today and what the team wants to improve; how success
        is measured for this role; how the team handles production incidents. Avoid questions answered on the
        website, and ask about pay and benefits in the offer discussion rather than first.
      rubric:
        - Asked at least two questions
        - Questions were specific to the role or team
        - Questions would help them decide whether to accept
      solution: |
        "No questions" reads as low interest; good questions show you are evaluating the role too.
  - rounds: [hr-final]
    exercise:
      id: hr-multiple-offers
      type: interview
      concept: career-and-offer
      skill: application
      title: Other offers
      prompt: |
        **HR:** "Are you interviewing elsewhere? Do you have other offers?"
      hints:
        - Honest, without bluffing, and clear about your timeline.
      modelAnswer: |
        - Honest about being in other processes, without naming companies or inventing offers.
        - Shares the timeline that matters (deadlines from other companies) so HR can plan.
        - Says what makes this role interesting, so the answer doesn't sound like a threat.
      rubric:
        - Was honest and didn't bluff
        - Shared relevant timelines
        - Reaffirmed genuine interest in this role
      solution: |
        Being clear about timelines helps both sides; bluffing about offers can backfire badly.
      followUps:
        - If both offers were equal, what would you choose and why?
