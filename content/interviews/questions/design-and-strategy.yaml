questions:
  - rounds: [test-design]
    exercise:
      id: td-upi-payment
      type: testdesign
      concept: test-design-coverage
      skill: application
      title: Test a UPI payment flow
      prompt: |
        An app adds UPI payments: the user enters a UPI id (or picks an app), approves the request in their UPI
        app, and returns to see the result. Design the tests. Include preconditions, steps, expected results and
        evidence. (Treat provider specifics as assumptions to confirm.)
      hints:
        - The approval happens outside your app - what can happen in between?
        - Think about timeouts and statuses that arrive later.
      modelAnswer: |
        - **Happy path:** valid UPI id, approve, app shows success; the order is paid in the backend.
        - **Validation:** invalid or unknown UPI id formats rejected before sending.
        - **User actions outside the app:** decline in the UPI app; ignore the request until it expires; approve
          after a long delay.
        - **Interruptions:** app killed or backgrounded while waiting; network lost on return; returning via the
          OS back button.
        - **Asynchronous status:** pending shown while unknown; final status from the server (webhook or polling),
          not assumed by the app; no duplicate payment when the user retries while pending.
        - **Amounts:** limits and boundaries the provider documents (confirm them), refunds afterwards.
        - **Evidence:** app screens, backend payment records and status history, provider sandbox logs.
      rubric:
        - Covered success, decline and expiry or timeout
        - Covered interruptions such as killing or backgrounding the app
        - Treated the final status as asynchronous and server-confirmed
        - Checked duplicate payments on retry
        - Named evidence from the backend, not only the UI
        - Marked provider-specific details as assumptions to confirm
      solution: |
        The core of any external-approval flow is **"the outcome is decided elsewhere and arrives later"** - see
        [webhooks and asynchronous status](#/lesson/webhooks-and-async-status).
  - rounds: [test-design]
    exercise:
      id: td-login-otp
      type: testdesign
      concept: test-design-coverage
      skill: application
      title: Test login with a one-time password
      prompt: |
        A login sends a six-digit one-time password (OTP) by SMS that is valid for five minutes, allows three
        attempts and can be resent after 30 seconds. Design the tests, including security cases.
      hints:
        - Each rule has a boundary.
      modelAnswer: |
        - **Happy path:** correct OTP within time → logged in.
        - **Boundaries:** just before and after five minutes; the third wrong attempt locks (or as specified); the
          resend button just before and after 30 seconds.
        - **Resend:** the old OTP stops working after a resend (if specified); limits on resends.
        - **Input:** fewer or more than six digits, letters, pasted values with spaces.
        - **Security:** OTP not in the URL or logs; rate limiting by number and by device or IP; OTP bound to the
          session that requested it; brute force blocked.
        - **Delivery:** delayed SMS, two OTPs arriving out of order.
        - **Evidence:** UI, auth service logs (without the OTP itself), lockout records.
      rubric:
        - Tested the time, attempt and resend boundaries on both sides
        - Covered resend behaviour and old OTPs
        - Covered invalid input formats
        - Covered security such as rate limiting, logging and session binding
        - Covered delivery problems such as delays
      solution: |
        Boundary values on **every** rule, plus security, separate a strong answer from a list of happy paths.
  - rounds: [test-design]
    exercise:
      id: td-refund-api
      type: testdesign
      concept: test-design-coverage
      skill: application
      title: Test a refund API
      prompt: |
        Design API tests for `POST /v1/payments/{id}/refunds` (fictional SandPay): full and partial refunds of a
        captured payment.
      hints:
        - The payment's state and the refunds so far decide what is allowed.
      modelAnswer: |
        - **Valid:** full refund; several partial refunds up to the captured amount; correct new status.
        - **Invalid:** amount zero, negative, above the remaining amount; refund of an uncaptured or failed
          payment; unknown payment id; another merchant's payment (authorisation).
        - **Idempotency:** the same request with the same key twice creates one refund; same key, different body
          is rejected.
        - **Concurrency:** two simultaneous partial refunds that together exceed the amount - at most one
          succeeds.
        - **Asynchronous:** a refund that is pending, then succeeds or fails; webhooks sent.
        - **Evidence:** responses, the payment's refund list, ledger entries, webhook deliveries.
      rubric:
        - Covered full and multiple partial refunds
        - Covered invalid amounts and invalid payment states
        - Covered authorisation across merchants
        - Covered idempotency and concurrent refunds
        - Named evidence beyond the response body
      solution: |
        Concurrency and idempotency are where refund APIs lose money - interviewers look for them explicitly.
  - rounds: [test-design]
    exercise:
      id: td-file-upload
      type: testdesign
      concept: test-design-coverage
      skill: application
      title: Test a settlement file upload
      prompt: |
        Merchants upload a CSV settlement file (up to 10 MB) that is validated and then processed in the
        background. Design the tests.
      hints:
        - File-level, row-level and processing-level cases.
      modelAnswer: |
        - **File level:** valid file; empty file; exactly 10 MB and just over; wrong type disguised as .csv;
          encoding (UTF-8 with and without BOM); different line endings.
        - **Row level:** missing columns, extra columns, quoted fields with commas, invalid amounts and dates,
          duplicate rows.
        - **Processing:** progress and final status visible; partial failures reported per row; re-upload of the
          same file doesn't double-process.
        - **Security:** formula injection in cells (values starting with =), path names, malware scanning if
          applicable.
        - **Performance:** a full-size file within the expected time.
      rubric:
        - Covered size boundaries and file type
        - Covered encoding and line endings
        - Covered row-level validation including quoting
        - Covered duplicate processing on re-upload
        - Covered a security case such as formula injection
      solution: |
        Background processing means the **status and error reporting** are part of the feature - test them.
  - rounds: [test-design]
    exercise:
      id: td-coupon
      type: testdesign
      concept: test-design-coverage
      skill: application
      title: Test a coupon code at checkout
      prompt: |
        Checkout gets a coupon field: percentage or fixed discounts, a minimum order value, an expiry date, and
        one use per customer. Design the tests.
      hints:
        - Rules interact - think about combinations, not only each rule alone.
      modelAnswer: |
        - **Each rule:** valid percentage and fixed coupons; minimum order just below and at the value; expired and
          not-yet-valid coupons; second use by the same customer.
        - **Calculations:** rounding of percentage discounts in minor units; discount larger than the order;
          taxes and fees before or after the discount (as specified).
        - **Interactions:** cart changes after applying (dropping below the minimum); removing the coupon; two
          coupons if not allowed.
        - **Concurrency:** the same one-use coupon used in two tabs at once.
        - **Payment:** the charged amount equals the discounted total; refunds of discounted orders.
      rubric:
        - Covered each rule with boundaries
        - Covered rounding and discount larger than the order
        - Covered interactions such as cart changes after applying
        - Covered concurrent use of a one-use coupon
        - Checked the amount actually charged
      solution: |
        Interviewers look for **interactions and money** - the charged amount and rounding are where real coupon
        bugs live.
  - rounds: [test-design, online-assessment]
    exercise:
      id: td-search-filters
      type: mcq
      concept: test-design-coverage
      skill: application
      title: Boundary values for a price filter
      prompt: |
        A product search has a price filter "from 100 to 500 (inclusive)". Which set of values best tests the
        boundaries?
      options:
        - id: boundaries
          text: 99, 100, 101, 499, 500, 501
          feedback: Correct - just below, on and just above each boundary.
        - id: middle
          text: 150, 300, 450
          feedback: All inside the range - they never touch the boundaries where off-by-one bugs live.
        - id: extremes
          text: 0, 100, 500, 1000000
          feedback: On the boundaries, but missing the values just inside and just outside.
        - id: random
          text: Ten random values between 0 and 1000
          feedback: Random values rarely hit the exact boundaries.
      correct: [boundaries]
      hints:
        - Where do off-by-one bugs appear?
      solution: |
        **99, 100, 101, 499, 500, 501** - boundary value analysis tests each boundary and its neighbours.
  - rounds: [framework-design]
    exercise:
      id: fd-from-scratch
      type: interview
      concept: framework-architecture
      skill: application
      title: Design a framework from scratch
      prompt: |
        **Interviewer:** "You are the first automation engineer at a company with a web shop and an API. Design
        the automation framework. Walk me through the structure and your first month."
      hints:
        - Layers, the reason for each part, and what you leave out at first.
      modelAnswer: |
        - **Layers:** tests → page objects / API clients → infrastructure (browser, config, test data, reporting).
        - **Choices:** language and tool matching the team (Java + Selenium or TypeScript + Playwright); JUnit or
          Playwright Test fixtures for lifecycle; config for environments and secrets from the environment.
        - **Isolation:** a browser per test, unique test data, API setup for speed.
        - **Evidence and CI:** screenshots or traces on failure, reports kept as CI artefacts, a smoke suite on
          every merge.
        - **First month:** three critical journeys and API smoke tests, running in CI, reliable before growing.
        - **Left out deliberately:** BDD layer, retries, multi-browser - until a need appears.
      rubric:
        - Described layers and their responsibilities
        - Justified tool choices by the team and product
        - Covered isolation, configuration and evidence
        - Planned a small reliable start in CI
        - Named what to leave out until needed
      solution: |
        See [a small reference framework](#/lesson/reference-framework-skeleton) - "why is each part there?" is
        the question behind the question.
      followUps:
        - How would you handle test data?
        - When would you add parallel execution?
  - rounds: [framework-design]
    exercise:
      id: fd-parallel
      type: interview
      concept: framework-architecture
      skill: application
      title: Make the suite run in parallel
      prompt: |
        **Interviewer:** "The suite takes 90 minutes. How would you make it run in parallel safely?"
      hints:
        - Isolation of drivers and data first, then the runner.
      modelAnswer: |
        - Measure first: per-test times, setup costs, which tests are slow.
        - Isolation: one browser per test (no static drivers), unique test data per test, no order dependence.
        - Runner: JUnit parallel execution, TestNG parallel, Playwright workers, or CI sharding.
        - Shared resources: accounts, rate limits, environments - give each worker its own or pool them.
        - Roll out gradually, watch the failure rate, fix causes rather than adding retries.
      rubric:
        - Started from measurements
        - Ensured isolation of drivers and data
        - Named a concrete parallel mechanism
        - Considered shared resources such as accounts and rate limits
        - Planned a gradual rollout with monitoring
      solution: |
        Isolation is the hard part; the configuration flag is the easy part.
      followUps:
        - Which part of a framework usually breaks first in parallel runs?
  - rounds: [framework-design]
    exercise:
      id: fd-reporting-ci
      type: interview
      concept: framework-architecture
      skill: application
      title: Reporting and CI
      prompt: |
        **Interviewer:** "How should test results reach developers, and what runs in CI at which point?"
      hints:
        - Fast feedback, evidence, and ownership.
      modelAnswer: |
        - **Stages:** unit and API tests on every commit; a UI smoke suite on every merge; the full suite nightly or
          before release; performance tests on a schedule.
        - **Reporting:** failures in the pull request with a link to evidence (screenshots, traces, logs); trends
          over time (pass rate, flaky rate, duration).
        - **Ownership:** a failing test has an owner; flaky tests are tracked and fixed, not retried silently.
        - **Quality gate:** merges blocked on agreed suites.
      rubric:
        - Matched suites to pipeline stages by speed and value
        - Put failure evidence where developers look
        - Tracked trends such as flakiness and duration
        - Defined ownership and quality gates
      solution: |
        Good reporting changes behaviour: developers fix what they can see quickly and trust.
      followUps:
        - What would you do with a test that fails once a week in CI only?
  - rounds: [framework-design, system-test-strategy]
    exercise:
      id: fd-test-data
      type: interview
      concept: framework-architecture
      skill: application
      title: Test data management
      prompt: |
        **Interviewer:** "How do you manage test data for an automation suite that runs in parallel against a
        shared test environment?"
      hints:
        - Create, isolate, clean up.
      modelAnswer: |
        - Each test creates the data it needs (through APIs or seeding), with unique identifiers.
        - Read-only reference data shared; mutable data never shared between tests.
        - Clean-up after tests, or data designed to be harmless if left (expiry, a test-data marker).
        - No production data with personal information; synthetic data or masked copies.
        - Factories or builders in code, versioned with the tests.
      rubric:
        - Tests create their own mutable data with unique ids
        - Separated shared read-only data from mutable data
        - Planned clean-up or harmless leftovers
        - Avoided real personal data
      solution: |
        Shared mutable data is the most common cause of "passes alone, fails in parallel".
      followUps:
        - How do you test with data that only exists in production?
  - rounds: [system-test-strategy]
    exercise:
      id: st-payments-service
      type: interview
      concept: system-test-strategy
      skill: application
      title: Test strategy for a payments microservice
      prompt: |
        **Interviewer:** "A payments microservice talks to a provider, a ledger service and a notification
        service, and receives provider webhooks. What is your test strategy?"
      hints:
        - Levels, dependencies, failure modes, and production.
      modelAnswer: |
        - **Unit tests** for amount rules, state transitions and idempotency logic.
        - **Contract tests** with the ledger and notification services, and against the provider's documented API.
        - **Integration tests** with a provider sandbox or simulator: timeouts, declines, unknown outcomes, webhook
          retries and duplicates, signature checks.
        - **End-to-end** happy paths only, through the real UI and services.
        - **Resilience:** provider slow or down, ledger unavailable - no lost or double payments; reconciliation
          catches mismatches.
        - **Non-functional:** load at peak, latency budgets, security (authorisation, secrets).
        - **Production:** monitoring of payment success rates, alerts, synthetic transactions.
      rubric:
        - Mapped test levels to the service's risks
        - Covered contracts with neighbouring services
        - Covered provider failure modes and webhooks
        - Covered resilience against double or lost payments
        - Included production monitoring or synthetic checks
      solution: |
        The core risks of payments systems - **unknown outcomes, duplicates, reconciliation** - should drive the
        strategy; see [declines, timeouts and unknown outcomes](#/lesson/declines-timeouts-unknown-outcomes).
      followUps:
        - What would you not test end to end, and why?
  - rounds: [system-test-strategy]
    exercise:
      id: st-rate-limiter
      type: interview
      concept: system-test-strategy
      skill: application
      title: Test a rate limiter
      prompt: |
        **Interviewer:** "Our public API allows 100 requests per minute per API key and returns 429 above that.
        How would you test it?"
      hints:
        - Boundaries, windows, keys, distribution.
      modelAnswer: |
        - **Boundaries:** request 100 succeeds, 101 gets 429 with a Retry-After header (if specified); the limit
          resets after the window.
        - **Window type:** fixed or sliding window - bursts at the window edge.
        - **Isolation:** one key's traffic doesn't affect another key.
        - **Distribution:** with several server instances, the limit is enforced across them, not per instance.
        - **Behaviour:** blocked requests have no side effects; error body is clear.
        - **Tooling:** a script or load tool against a test environment with a lower configured limit.
      rubric:
        - Tested the limit boundary and reset
        - Considered the window type and edge bursts
        - Tested isolation between keys
        - Tested across multiple instances
        - Checked that blocked requests have no side effects
      solution: |
        The distributed case - limits per instance instead of per key overall - is the bug most strategies miss.
      followUps:
        - How do you test it without hitting production limits?
  - rounds: [system-test-strategy]
    exercise:
      id: st-performance-checkout
      type: interview
      concept: system-test-strategy
      skill: application
      title: Performance testing a checkout
      prompt: |
        **Interviewer:** "A sale is coming and we expect ten times the normal checkout traffic. How do you plan the
        performance testing?"
      hints:
        - Targets, realistic load, the bottlenecks, and what you monitor.
      modelAnswer: |
        - **Targets:** expected peak (orders per minute), latency goals (for example 95th percentile), error
          budget.
        - **Workload model:** realistic mix (browse, cart, pay), think times, data volumes; payment provider
          mocked or sandboxed within its own limits.
        - **Tests:** load at peak, stress beyond it, a soak test for hours, and a spike.
        - **Observe:** latency percentiles, errors, database and queue metrics, resource use.
        - **Environment:** production-like; results compared with targets; fixes re-tested.
      rubric:
        - Set measurable targets
        - Modelled a realistic workload
        - Planned load, stress, soak or spike tests
        - Named what to monitor during the test
        - Considered the external provider's limits
      solution: |
        Averages hide pain - talk about **percentiles** and the error rate under load.
      followUps:
        - The provider's sandbox allows ten requests per second. How do you test at peak anyway?
  - rounds: [system-test-strategy]
    exercise:
      id: st-observability
      type: interview
      concept: system-test-strategy
      skill: application
      title: Testing in production and observability
      prompt: |
        **Interviewer:** "Which risks would you rather detect in production than prevent with pre-release tests -
        and how?"
      hints:
        - Risks that depend on real traffic, data or third parties.
      modelAnswer: |
        - Risks that depend on real conditions: provider behaviour, real device and network diversity, data
          volumes, rare timing issues.
        - Techniques: feature flags and canary releases, synthetic transactions, monitoring business metrics
          (payment success rate by method), alerts with runbooks, reconciliation jobs.
        - Safety: small blast radius, fast rollback, no real customer harm from tests.
      rubric:
        - Named risks that are hard to reproduce before release
        - Named production techniques such as canaries, flags or synthetic checks
        - Mentioned business-level monitoring
        - Addressed safety and rollback
      solution: |
        Mature quality strategies include **after-release detection** - not as a replacement for testing, but for
        what testing can't reach.
      followUps:
        - How do you test that an alert actually fires?
