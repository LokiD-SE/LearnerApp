questions:
  - rounds: [hiring-manager]
    exercise:
      id: hm-measure-quality
      type: interview
      concept: quality-leadership
      skill: application
      title: How do you measure quality?
      prompt: |
        **Hiring manager:** "How do you know whether your team's product quality is getting better or worse?"
      hints:
        - Outcome measures, process measures, and their limits.
      modelAnswer: |
        - **Outcomes:** escaped defects by severity, production incidents and time to recover, customer-reported
          issues, failed payments or refunds caused by defects.
        - **Process:** time from commit to production, how long a release check takes, flaky-test rate, time to
          diagnose a failed test, test coverage of critical paths (not just a code-coverage number).
        - Trends over time matter more than single numbers; metrics are discussed with the team, not used to
          blame.
        - Limits: counting test cases or bugs found says little on its own.
      rubric:
        - Named outcome measures such as escaped defects or incidents
        - Named process or feedback measures such as flaky rate or lead time
        - Warned against vanity metrics such as raw test counts
        - Talked about trends and team use rather than blame
      solution: |
        Managers want testers who think about **outcomes for customers**, not about the size of the test suite.
      followUps:
        - Which one metric would you start with in a new team?
        - How would you react if escaped defects rose after we doubled automation?
  - rounds: [hiring-manager]
    exercise:
      id: hm-automation-roi
      type: interview
      concept: quality-leadership
      skill: application
      title: What should we automate?
      prompt: |
        **Hiring manager:** "We have 2,000 manual regression cases and two automation engineers. How would you
        decide what to automate first?"
      hints:
        - Value, stability, and the cost of maintenance.
      modelAnswer: |
        - Prioritise by risk and value: critical business flows (checkout, payment, refund), frequently run checks,
          areas with past regressions.
        - Prefer stable features and the lowest sensible level (API before UI where the risk allows).
        - Don't automate everything: one-off checks, rapidly changing UI and exploratory work stay manual.
        - Build a small reliable core first and run it in CI; measure time saved and defects caught before
          expanding.
        - Retire or merge redundant manual cases on the way.
      rubric:
        - Prioritised by risk and frequency
        - Preferred lower test levels such as API where possible
        - Said some things should not be automated
        - Started small with a reliable core and measured value
      solution: |
        "Automate everything" is the weak answer; **automate what pays back, reliably** is the strong one.
      followUps:
        - How would you report progress to management after three months?
  - rounds: [hiring-manager]
    exercise:
      id: hm-flaky-suite
      type: interview
      concept: quality-leadership
      skill: application
      title: A suite nobody trusts
      prompt: |
        **Hiring manager:** "Our UI suite fails 20% of runs and developers ignore it. You join next month. What do
        you do?"
      hints:
        - Data first, quick wins, then prevent it coming back.
      modelAnswer: |
        - Measure: which tests fail, how often, with which errors - group failures by cause.
        - Quarantine the worst offenders so the suite is trusted again, with an owner and a deadline for each.
        - Fix the common causes: sleeps and missing waits, shared test data, environment instability, test order
          dependence.
        - Prevent recurrence: evidence on failure (traces, screenshots), a flaky-rate metric, review guidelines,
          no blind retries.
        - Communicate progress so developers start trusting failures again.
      rubric:
        - Started from data about the failures
        - Restored trust quickly, for example with a tracked quarantine
        - Named concrete root causes of flakiness
        - Added prevention such as evidence, metrics or guidelines
        - Considered how developers' trust is rebuilt
      solution: |
        This is a leadership question disguised as a technical one - **trust** is the real problem to solve.
      followUps:
        - When is retrying a failed test acceptable?
  - rounds: [hiring-manager]
    exercise:
      id: hm-release-readiness
      type: interview
      concept: judgement-and-prioritisation
      skill: application
      title: Is it ready to release?
      prompt: |
        **Hiring manager:** "How do you decide whether a release is ready - and who decides?"
      hints:
        - Criteria agreed in advance, the evidence, and the owner of the decision.
      modelAnswer: |
        - Release criteria agreed before testing: critical flows pass, no open blockers or critical defects,
          known issues accepted by the product owner, rollback ready, monitoring in place.
        - Evidence: test results with coverage of the changed areas, open defects with impact, risk notes.
        - The decision is owned by the product or release owner; QA provides the information and a
          recommendation.
        - After release: smoke checks and monitoring for the first hours.
      rubric:
        - Described release criteria agreed in advance
        - Described the evidence QA provides
        - Placed the decision with the right owner
        - Included post-release checks or monitoring
      solution: |
        Managers look for testers who **inform decisions** rather than act as the gate.
      followUps:
        - What would you do if the release criteria were not met but the business insists?
  - rounds: [hiring-manager]
    exercise:
      id: hm-first-90-days
      type: interview
      concept: quality-leadership
      skill: application
      title: Your first 90 days
      prompt: |
        **Hiring manager:** "What would you do in your first 90 days here?"
      hints:
        - Learn, contribute, then improve.
      modelAnswer: |
        - **First 30 days:** learn the product, users, architecture, release process and current pain points;
          shadow releases; fix small things to learn the codebase.
        - **Days 30-60:** own an area of testing; contribute to automation; propose improvements based on what
          you saw.
        - **Days 60-90:** deliver one agreed improvement with a measurable result (a stable smoke suite, faster
          release checks, better bug triage).
        - Regular check-ins with the manager about expectations.
      rubric:
        - Started with learning the product and current process
        - Contributed early with small wins
        - Proposed improvements based on evidence they gathered
        - Set a measurable goal and agreed it with the manager
      solution: |
        The answer shows how you **land** in a new team - humble first, then useful, then improving.
      followUps:
        - What would you want from me as your manager?
  - rounds: [hiring-manager]
    exercise:
      id: hm-regression-squeeze
      type: interview
      concept: judgement-and-prioritisation
      skill: application
      title: Regression in two days
      prompt: |
        **Hiring manager:** "Full regression takes five days and the release is in two. What do you do?"
      hints:
        - Risk-based selection, parallelism, and transparency.
      modelAnswer: |
        - Analyse the change: what changed, which areas it touches, what depends on it.
        - Select tests by risk: critical flows, changed areas and their neighbours, historically fragile areas;
          run automation in parallel; split manual work across the team.
        - Agree the plan and the residual risk with the release owner.
        - Monitor closely after release; run the remaining regression soon after.
        - Longer term: shorten regression with automation and better test selection.
      rubric:
        - Based the selection on what changed and on risk
        - Used parallelism or team distribution
        - Agreed residual risk with the release owner
        - Planned follow-up testing and a longer-term fix
      solution: |
        A plan plus **explicit residual risk** is the mature answer - not heroic overtime.
      followUps:
        - Which data would you want to make test selection automatic?
  - rounds: [hiring-manager]
    exercise:
      id: hm-stakeholder-reporting
      type: interview
      concept: quality-leadership
      skill: application
      title: Reporting test status
      prompt: |
        **Hiring manager:** "How do you report test status to a product manager or a director who has two minutes?"
      hints:
        - The decision they need, the risk, and the ask.
      modelAnswer: |
        - Lead with the bottom line: ready / ready with risks / not ready.
        - Top risks in business terms (which customers, which money flows) and what is being done.
        - What you need from them (a decision, a priority call, more time).
        - Details available on request: dashboards, defect lists, coverage.
      rubric:
        - Led with the bottom line
        - Explained risks in business terms
        - Stated a clear ask or decision needed
        - Kept detail available but out of the headline
      solution: |
        Senior stakeholders need **decisions, not data dumps** - translating test results into risk is a core
        senior-tester skill.
      followUps:
        - How would that report differ for the developers?
