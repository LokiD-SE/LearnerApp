questions:
  - rounds: [coding-dsa, online-assessment]
    exercise:
      id: cd-first-unique-char
      type: interview
      concept: coding-problem-solving
      skill: application
      title: First non-repeating character
      prompt: |
        Write a function that returns the first character in a string that appears only once, or no result if
        every character repeats. Example: `"sandpay"` → `'s'`; `"aabb"` → none. Write the code, then state its
        time and space complexity.
      hints:
        - Two passes - count, then find.
        - A map that remembers insertion order, or a second pass over the string.
      modelAnswer: |
        ```java
        static Optional<Character> firstUnique(String text) {
            Map<Character, Integer> counts = new HashMap<>();
            for (char c : text.toCharArray()) counts.merge(c, 1, Integer::sum);
            for (char c : text.toCharArray()) {
                if (counts.get(c) == 1) return Optional.of(c);
            }
            return Optional.empty();
        }
        ```

        - O(n) time (two passes), O(k) extra space for k distinct characters.
        - Edge cases: empty string (empty result), all repeated, a single character, case sensitivity (ask).
        - Tests: `"sandpay"`, `"aabb"`, `""`, `"x"`.
      rubric:
        - Correct for the examples and edge cases
        - Asked or stated how to treat case and empty input
        - O(n) time with a map or counting array, and said so
        - Tested the code with examples including an edge case
      solution: |
        The brute force (compare every character with every other) is O(n²); the counting pass is the expected
        improvement. Interviewers watch for **clarifying questions and self-testing** as much as the code.
      followUps:
        - What changes if the input is a stream you can read only once?
        - What if the string contains emoji (surrogate pairs)?
  - rounds: [coding-dsa]
    exercise:
      id: cd-duplicate-payment-ids
      type: interview
      concept: coding-problem-solving
      skill: application
      title: Duplicate payment ids
      prompt: |
        A settlement file lists payment ids, one per row. Return the ids that appear more than once, each once,
        in the order they first became duplicates. Example: `[p1, p2, p1, p3, p2, p1]` → `[p1, p2]`.
      hints:
        - Remember what you've seen; remember what you've already reported.
      modelAnswer: |
        ```java
        static List<String> duplicates(List<String> ids) {
            Set<String> seen = new HashSet<>();
            Set<String> reported = new LinkedHashSet<>();
            for (String id : ids) {
                if (!seen.add(id)) reported.add(id);   // add returns false if already present
            }
            return new ArrayList<>(reported);
        }
        ```

        - O(n) time, O(n) space.
        - Edge cases: empty list, no duplicates, the same id three times (reported once), null ids (ask).
      rubric:
        - Correct output including ids seen three or more times
        - Kept the required order
        - Used sets for O(n) time and explained the complexity
        - Tested empty and no-duplicate inputs
      solution: |
        `Set.add` returning false is the neat trick; a `LinkedHashSet` keeps first-duplicate order. Nested loops
        work but are O(n²) - fine for ten ids, not for a day's settlement file.
      followUps:
        - The file has 100 million rows and doesn't fit in memory. What now?
  - rounds: [coding-dsa]
    exercise:
      id: cd-two-amounts
      type: interview
      concept: coding-problem-solving
      skill: application
      title: Two payments that make a refund
      prompt: |
        Given payment amounts in minor units and a refund amount, return the indexes of two different payments
        whose amounts add up to the refund, or none. Example: `[500, 1200, 300, 900]`, refund `1500` → `[1, 2]`.
      hints:
        - For each amount, which other amount would complete it?
        - A map from amount to index answers that in O(1).
      modelAnswer: |
        ```java
        static Optional<int[]> pairFor(long[] amounts, long refund) {
            Map<Long, Integer> indexOf = new HashMap<>();
            for (int i = 0; i < amounts.length; i++) {
                Integer j = indexOf.get(refund - amounts[i]);
                if (j != null) return Optional.of(new int[] {j, i});
                indexOf.put(amounts[i], i);
            }
            return Optional.empty();
        }
        ```

        - O(n) time, O(n) space; the brute force is O(n²).
        - Edge cases: the same payment can't be used twice (looking up before inserting handles it), duplicate
          amounts, no pair, negative amounts (ask whether they exist).
      rubric:
        - Correct, and never pairs a payment with itself
        - O(n) with a map, with complexity explained
        - Discussed edge cases such as duplicates and no answer
        - Tested with the example and a no-answer case
      solution: |
        Looking up **before** inserting is what prevents using one payment twice.
      followUps:
        - Return all pairs, not just one.
        - The list is sorted - can you do it in O(1) extra space?
  - rounds: [coding-dsa, online-assessment]
    exercise:
      id: cd-balanced-brackets
      type: interview
      concept: coding-problem-solving
      skill: application
      title: Balanced brackets
      prompt: |
        Write a function that checks whether the brackets `()[]{}` in a string are balanced. Other characters are
        ignored. Examples: `"{a[1](2)}"` → true, `"(]"` → false, `"(("` → false.
      hints:
        - The most recent opening bracket must close first.
        - A stack.
      modelAnswer: |
        ```java
        static boolean balanced(String text) {
            Deque<Character> open = new ArrayDeque<>();
            for (char c : text.toCharArray()) {
                switch (c) {
                    case '(', '[', '{' -> open.push(c);
                    case ')' -> { if (open.isEmpty() || open.pop() != '(') return false; }
                    case ']' -> { if (open.isEmpty() || open.pop() != '[') return false; }
                    case '}' -> { if (open.isEmpty() || open.pop() != '{') return false; }
                    default -> { }
                }
            }
            return open.isEmpty();
        }
        ```

        - O(n) time, O(n) space in the worst case.
        - Edge cases: empty string (true), only closing brackets, leftovers at the end.
      rubric:
        - Correct for nesting, wrong order and leftovers
        - Used a stack and explained why
        - Handled closing brackets on an empty stack
        - Stated complexity and tested edge cases
      solution: |
        Forgetting the final `isEmpty()` check (for `"(("`) is the most common bug.
      followUps:
        - How would you report the position of the first error?
  - rounds: [coding-dsa]
    exercise:
      id: cd-totals-by-currency
      type: interview
      concept: coding-problem-solving
      skill: application
      title: Totals per currency
      prompt: |
        Given a list of payments (currency code and amount in minor units), return the total per currency with
        currencies in alphabetical order. Explain the data structure you chose.
      hints:
        - Which map keeps its keys sorted?
      modelAnswer: |
        ```java
        record Payment(String currency, long amountMinor) {}

        static SortedMap<String, Long> totals(List<Payment> payments) {
            SortedMap<String, Long> totals = new TreeMap<>();
            for (Payment p : payments) totals.merge(p.currency(), p.amountMinor(), Math::addExact);
            return totals;
        }
        ```

        - O(n log k) for k currencies with a TreeMap (or HashMap and sort the k keys at the end).
        - `Math::addExact` refuses to overflow silently; amounts as `long` minor units, never `double`.
        - Edge cases: empty list, unknown or lower-case currency codes (normalise or reject - ask).
      rubric:
        - Correct totals with sorted keys
        - Used long minor units, not floating point
        - Explained the map choice and complexity
        - Considered overflow or input normalisation
      solution: |
        This small problem reveals two things interviewers care about in payments: **the right collection** and
        **exact money arithmetic**.
      followUps:
        - Write the same with streams.
  - rounds: [coding-dsa]
    exercise:
      id: cd-merge-sorted-events
      type: interview
      concept: coding-problem-solving
      skill: application
      title: Merge two sorted event logs
      prompt: |
        Two services log events with timestamps, each log already sorted by time. Merge them into one sorted list
        without sorting the combined list from scratch.
      hints:
        - Two pointers, always take the smaller head.
      modelAnswer: |
        ```java
        static List<Long> merge(List<Long> a, List<Long> b) {
            List<Long> merged = new ArrayList<>(a.size() + b.size());
            int i = 0, j = 0;
            while (i < a.size() && j < b.size()) {
                merged.add(a.get(i) <= b.get(j) ? a.get(i++) : b.get(j++));
            }
            while (i < a.size()) merged.add(a.get(i++));
            while (j < b.size()) merged.add(b.get(j++));
            return merged;
        }
        ```

        - O(n + m) time, compared with O((n + m) log(n + m)) for sorting.
        - Equal timestamps: `<=` keeps events from `a` first (stable) - say which order you want.
      rubric:
        - Correct merge including leftovers
        - Linear time with two pointers, explained
        - Discussed equal timestamps
        - Tested with an empty list on one side
      solution: |
        Forgetting the leftover loops is the classic bug; say "and now the remaining elements" out loud.
      followUps:
        - Merge k sorted logs efficiently.
  - rounds: [coding-dsa]
    exercise:
      id: cd-rate-limit-window
      type: interview
      concept: coding-problem-solving
      skill: application
      title: Too many requests in a second
      prompt: |
        Given request timestamps in milliseconds, sorted ascending, and a limit N, return the index of the first
        request that makes more than N requests fall within any 1,000 ms window (the request and the N before it),
        or -1.
      hints:
        - Keep the timestamps of the current window in a queue.
        - Drop timestamps older than 1,000 ms before checking the size.
      modelAnswer: |
        ```java
        static int firstViolation(long[] times, int limit) {
            Deque<Long> window = new ArrayDeque<>();
            for (int i = 0; i < times.length; i++) {
                while (!window.isEmpty() && times[i] - window.peekFirst() >= 1000) window.pollFirst();
                window.addLast(times[i]);
                if (window.size() > limit) return i;
            }
            return -1;
        }
        ```

        - O(n) time: each timestamp enters and leaves the queue once; O(N) space.
        - Boundary: decide whether a request exactly 1,000 ms later is in the same window (here it is not) and
          test it.
      rubric:
        - Correct sliding window that drops old timestamps
        - Linear time with the reasoning given
        - Discussed the window boundary explicitly
        - Tested a boundary case
      solution: |
        Rate limiting and sliding windows come up for API testers because the same logic decides when a server
        returns 429 - **boundary** cases are where real limiters have bugs.
      followUps:
        - How would you test a real API's rate limit without being blocked?
  - rounds: [coding-dsa, online-assessment]
    exercise:
      id: cd-missing-id
      type: interview
      concept: coding-problem-solving
      skill: application
      title: The missing invoice number
      prompt: |
        Invoices are numbered 1 to n. A list contains n - 1 of them in random order. Find the missing number in
        O(n) time and O(1) extra space.
      hints:
        - What should the numbers add up to?
      modelAnswer: |
        ```java
        static long missing(int[] numbers) {
            long n = numbers.length + 1;
            long expected = n * (n + 1) / 2;
            long actual = 0;
            for (int x : numbers) actual += x;
            return expected - actual;
        }
        ```

        - Uses `long` so `n * (n + 1)` doesn't overflow `int` for large n (XOR of 1..n and the list is an
          overflow-free alternative).
        - Edge cases: n = 1 (empty list → 1), the missing number is 1 or n.
      rubric:
        - Correct with the sum or XOR approach
        - Avoided integer overflow
        - O(n) time and O(1) space, explained
        - Tested the first and last number missing
      solution: |
        Sorting (O(n log n)) or a set (O(n) space) work but miss the stated constraints; overflow is the follow-up
        trap.
      followUps:
        - Two numbers are missing. What changes?
  - rounds: [coding-dsa]
    exercise:
      id: cd-anagrams
      type: interview
      concept: coding-problem-solving
      skill: application
      title: Are they anagrams?
      prompt: |
        Write a function that decides whether two strings are anagrams of each other (same letters, same counts),
        ignoring case and spaces. Example: `"Listen"` and `"Silent"` → true.
      hints:
        - Count letters up for one string and down for the other.
      modelAnswer: |
        ```java
        static boolean anagrams(String a, String b) {
            Map<Character, Integer> counts = new HashMap<>();
            for (char c : a.toLowerCase(Locale.ROOT).toCharArray()) if (c != ' ') counts.merge(c, 1, Integer::sum);
            for (char c : b.toLowerCase(Locale.ROOT).toCharArray()) if (c != ' ') counts.merge(c, -1, Integer::sum);
            return counts.values().stream().allMatch(n -> n == 0);
        }
        ```

        - O(n) time; sorting both strings is the O(n log n) alternative.
        - `Locale.ROOT` avoids locale-dependent case conversion.
      rubric:
        - Correct, including different lengths
        - Ignored case and spaces as asked
        - Linear time with counting, or explained the sorting trade-off
        - Tested a negative case
      solution: |
        Saying *why* you passed `Locale.ROOT` is a small signal of care that interviewers notice.
      followUps:
        - Group a list of words into anagram groups.
  - rounds: [coding-dsa]
    exercise:
      id: cd-top-error-codes
      type: interview
      concept: coding-problem-solving
      skill: application
      title: Most frequent error codes
      prompt: |
        Given a list of decline codes from today's failed payments, return the k most frequent codes, most frequent
        first.
      hints:
        - Count first; then you need only the top k, not a full sort.
      modelAnswer: |
        ```java
        static List<String> topK(List<String> codes, int k) {
            Map<String, Long> counts = codes.stream().collect(Collectors.groupingBy(c -> c, Collectors.counting()));
            PriorityQueue<Map.Entry<String, Long>> heap = new PriorityQueue<>(Map.Entry.comparingByValue());
            for (Map.Entry<String, Long> e : counts.entrySet()) {
                heap.offer(e);
                if (heap.size() > k) heap.poll();          // drop the least frequent
            }
            List<String> top = new ArrayList<>();
            while (!heap.isEmpty()) top.add(heap.poll().getKey());
            Collections.reverse(top);
            return top;
        }
        ```

        - O(n + m log k) for n codes and m distinct codes; sorting all counts is O(n + m log m).
        - Ties: say how they are ordered (here unspecified) - ask.
      rubric:
        - Counted correctly with a map
        - Kept only the top k, for example with a min-heap of size k
        - Explained complexity versus a full sort
        - Discussed ties and k larger than the number of codes
      solution: |
        Sorting all counts is acceptable for small m; the heap shows you know the better general answer.
      followUps:
        - The codes arrive as a live stream. How do you keep the top k up to date?
