questions:
  - rounds: [behavioural]
    exercise:
      id: bh-critical-bug-late
      type: interview
      concept: ownership
      skill: application
      title: A critical bug found late
      prompt: |
        **Interviewer:** "Tell me about a time you found a critical bug close to a release. What did you do?"
      hints:
        - STAR - and the decision about the release is the interesting part.
      modelAnswer: |
        - **Situation:** the release, the date, what was at stake (for example a payments release with a
          marketing launch).
        - **Task:** your responsibility - finding it, and making sure the right people decided with the facts.
        - **Action:** how you confirmed and isolated it, assessed impact (how many users, which money flows),
          raised it with evidence, proposed options (fix, feature flag, delay) and helped verify the fix.
        - **Result:** what was decided and what happened - plus what you changed so such bugs are found earlier
          (a test added to CI, a check in the definition of done).
      rubric:
        - Used a specific, real situation
        - Described their own actions, not only the team's
        - Assessed impact and gave the decision makers options with evidence
        - Reported a concrete result
        - Said what changed afterwards to catch it earlier
      solution: |
        The signal is **ownership with judgement** - not "I found it and they fixed it", but how you made the
        risk visible and helped decide.
      followUps:
        - Who made the release decision, and did you agree with it?
        - Why wasn't the bug caught earlier?
        - What would you do if the decision makers ignored the risk?
  - rounds: [behavioural]
    exercise:
      id: bh-disagreed-developer
      type: interview
      concept: collaboration-and-conflict
      skill: application
      title: Disagreeing with a developer
      prompt: |
        **Interviewer:** "Tell me about a time a developer disagreed that something you reported was a bug."
      hints:
        - Evidence, their perspective, and how the decision was made.
      modelAnswer: |
        - Situation: the behaviour and why you thought it was wrong (requirement, user impact).
        - Listened to the developer's view - maybe the requirement was ambiguous or the behaviour intended.
        - Brought evidence: the requirement, logs, a reproduction, user impact; involved the product owner when
          it was a product decision rather than a defect.
        - Result: the outcome (fixed, or accepted as intended with a documented decision) and a better working
          relationship - for example agreeing on acceptance criteria earlier next time.
      rubric:
        - Showed they listened to the developer's perspective
        - Used evidence rather than opinion
        - Escalated to the right person for product decisions
        - Kept the relationship constructive
        - Described what changed in how they work together
      solution: |
        Interviewers look for **evidence and respect** - stories where you "won" against a developer are weaker
        than stories where the team made a better decision.
      followUps:
        - What if the product owner had sided with the developer?
        - How do you write a bug report that avoids this argument?
  - rounds: [behavioural, hiring-manager]
    exercise:
      id: bh-missed-deadline
      type: interview
      concept: judgement-and-prioritisation
      skill: application
      title: Not enough time to test everything
      prompt: |
        **Interviewer:** "Tell me about a time you couldn't test everything before a deadline. How did you
        decide what to test?"
      hints:
        - Risk-based prioritisation, and making the gaps visible.
      modelAnswer: |
        - Situation: the deadline, the scope, why time was short.
        - Prioritised by risk: what changed, what is used most, where money or data could be lost, what failed
          before; ran the critical paths (and automation) first.
        - Made the remaining risk explicit to the release decision makers: what was tested, what wasn't, and the
          likely impact.
        - Result: the release outcome, and follow-up testing or monitoring after release.
      rubric:
        - Explained a risk-based way of choosing what to test
        - Made untested areas and their risk visible to others
        - Did not silently cut testing
        - Mentioned follow-up such as post-release checks or monitoring
      solution: |
        The key phrase is **"made the risk visible"** - testers don't decide alone, they inform the decision.
      followUps:
        - What did you test after the release?
        - How would you avoid the same squeeze next time?
  - rounds: [behavioural]
    exercise:
      id: bh-unclear-requirements
      type: interview
      concept: ambiguity-and-learning
      skill: application
      title: Unclear requirements
      prompt: |
        **Interviewer:** "Tell me about a time you had to test something with unclear or missing requirements."
      hints:
        - How you reduced the ambiguity, not just how you coped with it.
      modelAnswer: |
        - Situation: the feature and what was unclear.
        - Reduced ambiguity: asked specific questions, wrote down assumptions and got them confirmed, used
          examples (given/when/then) with the product owner, explored the existing behaviour.
        - Tested against the agreed examples and flagged open questions in the test report.
        - Result: issues found early, and clearer acceptance criteria adopted by the team afterwards.
      rubric:
        - Asked targeted questions and documented assumptions
        - Turned ambiguity into concrete examples or acceptance criteria
        - Kept testing moving while questions were open
        - Showed a lasting improvement for the team
      solution: |
        Ambiguity stories show **initiative**: you made the requirement better, not only tested around it.
      followUps:
        - What if nobody could answer your questions before the release?
  - rounds: [behavioural]
    exercise:
      id: bh-critical-feedback
      type: interview
      concept: ambiguity-and-learning
      skill: application
      title: Critical feedback
      prompt: |
        **Interviewer:** "Tell me about a time you received critical feedback. What did you do with it?"
      hints:
        - Real feedback, your reaction, and a visible change.
      modelAnswer: |
        - Specific feedback that was genuinely about you (for example "your bug reports are hard to reproduce" or
          "your test automation is hard for others to maintain").
        - Honest about the first reaction, then how you checked it was valid (examples, asking others).
        - Concrete changes you made and how you checked they worked.
        - Result: improved outcome and possibly helping others with the same thing.
      rubric:
        - Chose real, meaningful feedback
        - Showed openness rather than defensiveness
        - Described concrete changes they made
        - Showed the result of the change
      solution: |
        Interviewers test **coachability** - a story where the feedback was unfair misses the point.
      followUps:
        - What feedback have you found hardest to act on?
  - rounds: [behavioural]
    exercise:
      id: bh-production-incident
      type: interview
      concept: ownership
      skill: application
      title: A production incident
      prompt: |
        **Interviewer:** "Tell me about a production issue that you were involved in. What was your role?"
      hints:
        - During the incident, and after it.
      modelAnswer: |
        - Situation: what customers experienced and how it was detected.
        - Your role during it: reproducing, narrowing down with logs and ids, verifying the fix or rollback.
        - After it: root cause, why tests didn't catch it, the test or monitor added, and a blameless review.
        - Result: time to recover, and that the same class of issue was caught later by the new check.
      rubric:
        - Described their concrete role during the incident
        - Used evidence such as logs, ids or metrics
        - Explained the root cause and why it escaped testing
        - Described a lasting fix - a test, a monitor or a process change
      solution: |
        Strong stories are **blameless and systemic**: what in the process let it through, and what closes the
        gap.
      followUps:
        - How would you have caught it before release?
        - How do you test that a monitor actually alerts?
  - rounds: [behavioural, hiring-manager]
    exercise:
      id: bh-push-back-release
      type: interview
      concept: judgement-and-prioritisation
      skill: application
      title: Pushing back on a release
      prompt: |
        **Interviewer:** "Have you ever recommended not releasing? How did that go?"
      hints:
        - Evidence, alternatives, and who decided.
      modelAnswer: |
        - The risk and the evidence (failing payment flow, data loss risk, regulatory impact).
        - Alternatives offered: release with the feature flagged off, partial rollout, a fix with a short delay.
        - Communicated to the decision makers clearly and without drama; respected their decision.
        - Result and reflection - including if the release went ahead and what you monitored.
      rubric:
        - Based the recommendation on evidence and impact
        - Offered alternatives rather than a plain no
        - Respected who owns the decision
        - Reflected on the outcome
      solution: |
        Interviewers look for **courage with judgement** - neither a gatekeeper who blocks everything nor someone
        who stays quiet.
      followUps:
        - What would you do if you were overruled and the issue then hit customers?
  - rounds: [behavioural]
    exercise:
      id: bh-helped-teammate
      type: interview
      concept: collaboration-and-conflict
      skill: application
      title: Helping a teammate
      prompt: |
        **Interviewer:** "Tell me about a time you helped a colleague be more effective."
      hints:
        - What they struggled with, what you did, what changed for them.
      modelAnswer: |
        - The colleague's situation (new joiner, struggling with automation, overloaded).
        - What you did: pairing, a guide, reviewing their tests with kind specifics, sharing a tool or template.
        - Result for them and the team (faster onboarding, fewer flaky tests), and what you learned.
      rubric:
        - Described a specific need of the colleague
        - Described concrete help they gave
        - Showed the result for the colleague or team
      solution: |
        This question checks whether you **multiply** the team's effectiveness, not only your own.
      followUps:
        - How do you give feedback on someone else's test code?
  - rounds: [behavioural]
    exercise:
      id: bh-learned-fast
      type: interview
      concept: ambiguity-and-learning
      skill: application
      title: Learning something new quickly
      prompt: |
        **Interviewer:** "Tell me about a time you had to learn a new tool or technology quickly."
      hints:
        - How you learned, not only that you did.
      modelAnswer: |
        - The context and the deadline (for example a move from Selenium to Playwright, or a new payment provider's
          API).
        - The learning strategy: official docs, a small spike project, pairing with someone who knew it, learning
          only what the task needed first.
        - Result: delivered on time, and shared the knowledge (a guide, a template, a demo).
      rubric:
        - Explained a deliberate learning approach
        - Applied it to a real deliverable
        - Shared what they learned with others
      solution: |
        Technology changes - interviewers want evidence you can **learn on demand**.
      followUps:
        - What would you learn next, and why?
  - rounds: [behavioural, hiring-manager]
    exercise:
      id: bh-most-proud
      type: interview
      concept: ownership
      skill: application
      title: The work you're most proud of
      prompt: |
        **Interviewer:** "What piece of work are you most proud of, and why?"
      hints:
        - Your role, the difficulty, and the impact.
      modelAnswer: |
        - A specific piece of work with a clear before and after (a framework, a test strategy, a hard defect).
        - Why it was hard - technical or organisational obstacles.
        - Your own decisions and contributions.
        - The impact, ideally measured, and what you would do differently now.
      rubric:
        - Chose a specific piece of work with a visible impact
        - Explained what made it hard
        - Made their own contribution clear
        - Reflected on what they would do differently
      solution: |
        The "why" reveals what you value - make sure it is something the team values too.
      followUps:
        - Who else contributed, and how?
