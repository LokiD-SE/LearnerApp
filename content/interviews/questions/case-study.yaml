questions:
  - rounds: [case-study]
    exercise:
      id: cs-estimate-release
      type: interview
      concept: consulting-and-estimation
      skill: application
      title: Estimate the testing for a client release
      prompt: |
        **Manager:** "A retail client releases a new mobile checkout with a new payment provider in eight weeks.
        They ask us for a testing estimate by Friday. How do you approach it?"
      hints:
        - Scope and assumptions before numbers.
      modelAnswer: |
        - **Clarify scope:** platforms and devices, payment methods, integrations (provider, order system), what
          the client's own team tests, environments and test data availability.
        - **Break down the work:** test planning, test design, environment and data setup, functional testing by
          area, integration with the provider's sandbox, regression, automation (if in scope), UAT support,
          defect re-testing.
        - **Estimate with ranges:** per item, from comparable projects; add contingency for risks such as late
          builds or sandbox limits.
        - **State assumptions and dependencies** explicitly, and the risks if they don't hold.
        - **Present options:** for example a lean scope versus full coverage with automation.
      rubric:
        - Clarified scope and responsibilities first
        - Broke the work into estimable pieces
        - Gave ranges and contingency rather than one number
        - Stated assumptions, dependencies and risks
        - Offered the client options
      solution: |
        Consulting interviews value **structure and explicit assumptions** - a precise number without them is a
        red flag.
      followUps:
        - The client says the estimate is too high. What do you do?
  - rounds: [case-study]
    exercise:
      id: cs-full-automation
      type: interview
      concept: consulting-and-estimation
      skill: application
      title: "\"Automate everything in three months\""
      prompt: |
        **Client:** "We want 100% of our 1,500 manual test cases automated within three months." How do you
        respond?
      hints:
        - Understand the goal behind the request.
      modelAnswer: |
        - **Ask why:** faster releases? fewer escaped defects? lower cost? The goal shapes the plan.
        - **Explain the trade-offs** with evidence: not every case is worth automating; flaky or costly automation
          slows teams down; some testing (exploratory, usability) shouldn't be automated.
        - **Propose a plan:** analyse and prioritise the cases (risk, frequency, stability), automate critical flows
          first at the right level (API before UI), measure value, then expand.
        - **Agree success measures** with the client - for example release check time or escaped defects - rather
          than a percentage of cases automated.
      rubric:
        - Asked about the goal behind the request
        - Explained why 100% automation is not the right target, with reasons
        - Proposed a prioritised, phased plan
        - Agreed outcome-based success measures
        - Stayed respectful of the client's goal
      solution: |
        Pushing back well means **redirecting to the client's real goal**, not refusing.
      followUps:
        - The client insists on the percentage target. What now?
  - rounds: [case-study]
    exercise:
      id: cs-migration
      type: interview
      concept: consulting-and-estimation
      skill: application
      title: Testing a payments platform migration
      prompt: |
        **Manager:** "A bank client is moving merchants from a legacy payments platform to a new one over six
        months. What would the test approach cover?"
      hints:
        - Data, behaviour, cut-over and the money.
      modelAnswer: |
        - **Data migration:** completeness and accuracy of merchants, stored payment methods (tokens), open
          transactions and history - reconciled with counts and sums.
        - **Behavioural equivalence:** the same inputs give the same results on both platforms (fees, statuses,
          reports) - for example by running both in parallel for a period.
        - **Integrations:** acquirers, reporting, the merchants' own integrations and webhooks.
        - **Cut-over and rollback:** rehearsals, timing, what happens to payments in flight, a tested rollback.
        - **Non-functional:** performance at peak, security and compliance requirements.
        - **Phasing:** pilot merchants first, with monitoring and reconciliation after each wave.
      rubric:
        - Covered data migration with reconciliation
        - Covered behavioural equivalence such as parallel runs
        - Covered integrations including merchants' systems
        - Covered cut-over, in-flight payments and rollback
        - Proposed a phased rollout with monitoring
      solution: |
        Migrations fail at the **edges**: in-flight transactions, rarely used features and integrations nobody
        documented.
      followUps:
        - How do you prove to the client that no money was lost?
  - rounds: [case-study, hiring-manager]
    exercise:
      id: cs-qa-assessment
      type: interview
      concept: consulting-and-estimation
      skill: application
      title: Assess a client's QA practice
      prompt: |
        **Manager:** "A client complains about production defects and slow releases. You have two weeks to assess
        their QA practice and recommend improvements. What do you do?"
      hints:
        - Gather evidence, find the few biggest causes, recommend a roadmap.
      modelAnswer: |
        - **Gather evidence:** interviews with developers, testers and product owners; defect data (where defects
          are found, which escape); pipeline and release data; a look at test suites and environments.
        - **Analyse:** the few biggest causes - for example late testing, unstable environments, no regression
          automation, unclear requirements.
        - **Recommend:** a prioritised roadmap with quick wins and longer-term changes, owners and measures of
          success.
        - **Communicate:** a short executive summary with evidence, and a detailed report for the teams.
      rubric:
        - Collected evidence from people and data
        - Identified a few root causes rather than a long list of symptoms
        - Recommended a prioritised roadmap with quick wins
        - Defined how success would be measured
        - Tailored communication to executives and teams
      solution: |
        Assessments are judged on **evidence-based priorities** - the client needs the three changes that matter,
        not fifty observations.
