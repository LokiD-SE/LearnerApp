# Track L (security testing: ethics and method, web and API vulnerabilities, DevSecOps, reporting) interview
# questions. Each is limited to the security-testing subject, so it is asked in courses about that track. Written
# for practice in the style of the round; not questions from any company. SandPay is fictional. Sources: NIST SP
# 800-115 (Rules of Engagement, scanning and penetration testing definitions), the OWASP Web Security Testing Guide
# v4.2, the OWASP Risk Rating Methodology and RFC 9110, as taught in the lessons the answers link to.
questions:
  - rounds: [domain-deep-dive, online-assessment]
    subjects: [security-testing]
    exercise:
      id: sec-q-first-step
      type: mcq
      concept: security-testing
      skill: application
      title: The first day of an engagement
      prompt: |
        A client asks you to security-test the SandPay merchant portal. Before sending a single request, what must
        be in place?
      options:
        - id: authorisation
          text: Written authorisation from the system owner and a written scope - which hosts, what you may do and when - agreed before testing starts.
          feedback: Correct - NIST calls the Rules of Engagement the guidelines "established before the start of a security test" that give the team authority to conduct defined activities.
        - id: scanner
          text: A scanner configured with the most aggressive profile, so nothing is missed.
          feedback: Aggressive scans on a live system are exactly what a scope and a schedule exist to control; tools come after permission.
        - id: verbal
          text: A verbal "go ahead" from your contact, because the client obviously wants the test.
          feedback: A verbal yes does not say what is in scope, who else must be told or who is responsible if something breaks; get it in writing.
        - id: report-template
          text: The report template, so the findings can be written up as you go.
          feedback: Useful, but it comes after permission and scope; testing without them is unauthorised even if the report is perfect.
      correct: [authorisation]
      hints:
        - Who gives you the right to test, and where is the limit written down?
      solution: |
        Written authorisation and a written scope come first - hosts, techniques, time window, contacts and what to do
        if something goes wrong. See [Security testing fundamentals](#/lesson/security-testing-fundamentals).

  - rounds: [domain-deep-dive, online-assessment]
    subjects: [security-testing]
    exercise:
      id: sec-q-out-of-scope
      type: mcq
      concept: security-testing
      skill: application
      title: A login page that is not yours
      prompt: |
        While testing the in-scope portal you notice a link to `admin.partner-bank.example`, a host that is not in the
        written scope. It shows an admin login that looks like it uses a vendor's default credentials. What do you do?
      options:
        - id: stop-and-tell
          text: Do not try the credentials or send anything else to that host; note what you saw and tell the engagement owner.
          feedback: Correct - a host outside the written scope is not yours to test, whatever it looks like; the owner decides what to do about the observation.
        - id: try-once
          text: Try the default credentials once to confirm - one login attempt cannot hurt.
          feedback: Logging in to a system you are not authorised to test is the unauthorised access the scope exists to prevent; a single attempt still counts.
        - id: scan-it
          text: Run a quick scan on it to give the client a more complete picture.
          feedback: Scanning is testing; it needs the host's owner to have agreed, and the partner bank is not your client.
        - id: ignore
          text: Say nothing, because it is outside the scope.
          feedback: Staying out of it is right, but silence wastes a useful observation; tell the owner what you saw, without testing it.
      correct: [stop-and-tell]
      hints:
        - Is observing a link the same as testing the host behind it?
      solution: |
        Stay inside the scope, record what you observed without interacting further, and report it to the engagement
        owner, who can ask the partner. See [Security testing fundamentals](#/lesson/security-testing-fundamentals).

  - rounds: [domain-deep-dive, online-assessment]
    subjects: [security-testing]
    exercise:
      id: sec-q-scan-vs-pentest
      type: mcq
      concept: security-testing
      skill: recall
      title: Vulnerability scan or penetration test
      prompt: |
        A manager asks: "We run a scanner every night - why do we also pay for a penetration test?" Which answer is
        best supported by NIST SP 800-115?
      options:
        - id: scan-known
          text: A scanner identifies known vulnerabilities, with high false positive rates; a penetration test has assessors mimic real-world attacks to find ways to circumvent security features, often by combining vulnerabilities to gain more access than any single one gives.
          feedback: Correct - NIST lists scanning as identifying known vulnerabilities (with high false positive rates) and describes penetration testing as assessors mimicking real-world attacks, most often looking for combinations of vulnerabilities.
        - id: same
          text: They are the same activity, and the penetration test is just more expensive.
          feedback: A scan is automated pattern matching against known issues; a penetration test chains weaknesses with human judgement.
        - id: pentest-no-tools
          text: A penetration test never uses tools, only manual work.
          feedback: Penetration testers use tools constantly; the difference is judgement and goal, not the absence of tools.
        - id: scanner-better
          text: A scanner is always better because it is repeatable and cheap.
          feedback: Repeatable and cheap, yes, but it misses what needs judgement (business logic, chained flaws) and reports things that are not real.
      correct: [scan-known]
      hints:
        - Which of the two needs a human to decide what is real?
      solution: |
        NIST SP 800-115 lists vulnerability scanning as identifying known vulnerabilities (noting high false positive
        rates) and defines penetration testing as security testing in which evaluators mimic real-world attacks. Use
        both: the scanner for breadth and regression, the tester for depth. See [DAST with OWASP
        ZAP](#/lesson/dast-with-owasp-zap).

  - rounds: [domain-deep-dive, online-assessment, system-test-strategy]
    subjects: [security-testing]
    exercise:
      id: sec-q-idor-method
      type: mcq
      concept: security-testing
      skill: application
      title: Testing for insecure direct object references
      prompt: |
        Merchant Alice can open `/api/payments/pay_1001`. How do you test whether the API checks that a payment
        belongs to the caller?
      options:
        - id: two-accounts
          text: Use two test accounts that own different payments; first confirm each can read its own, then request one account's payment id with the other account's token and see whether it is returned.
          feedback: Correct - this is the WSTG method (at least two users who own different objects), and the control proves the request itself is valid.
        - id: guess-ids
          text: Run a script that guesses thousands of payment ids with Alice's token.
          feedback: Guessing wastes requests and may touch real customers' data; with a second account you already know a valid id that belongs to someone else.
        - id: look-at-ui
          text: Check that the page does not show a link to other merchants' payments.
          feedback: Hidden links are not access control; the API must refuse the request itself.
        - id: admin
          text: Log in as an administrator and check that the payment loads.
          feedback: An administrator can usually read everything by design, so a success proves nothing about a merchant's access.
      correct: [two-accounts]
      hints:
        - You need an id that you know belongs to someone else.
      solution: |
        Two accounts, a control request for each account's own object, then the cross-account request. A 2xx with the
        other owner's data is the finding; a refusal, with the control passing, is a pass. See [Testing access control
        and IDOR](#/lesson/testing-access-control-idor).

  - rounds: [domain-deep-dive, debugging-rca]
    subjects: [security-testing]
    exercise:
      id: sec-q-validate-finding
      type: mcq
      concept: security-testing
      skill: analysis
      title: The scanner says XSS
      prompt: |
        An automated scan reports "Reflected XSS" on `/search`. Before it goes into a report, what should you do?
      options:
        - id: reproduce
          text: Reproduce it by hand with a harmless marker, confirm the marker comes back unencoded in the HTML, and record the request and response as evidence.
          feedback: Correct - NIST says findings "often need to be validated to isolate false positives", and manual examination typically gives more accurate results than a second tool.
        - id: second-scanner
          text: Run a second scanner and report it if both agree.
          feedback: NIST warns that comparison tools "can often produce similar results - including the same false positives".
        - id: report-as-is
          text: Report it with the scanner's severity; the client can sort out false positives.
          feedback: Unvalidated findings waste the client's time and cost your credibility; validating is part of the job.
        - id: drop
          text: Drop it, because scanners are unreliable.
          feedback: High false positive rates mean verify, not ignore; some of the findings are real.
      correct: [reproduce]
      hints:
        - What does evidence from your own request look like?
      solution: |
        Reproduce manually with a harmless marker and keep the request and response. See [Testing cross-site
        scripting](#/lesson/testing-cross-site-scripting) and the [triage mock
        interview](#/lesson/security-testing-mock-interview).

  - rounds: [domain-deep-dive, debugging-rca]
    subjects: [security-testing]
    exercise:
      id: sec-q-no-repro
      type: mcq
      concept: security-testing
      skill: analysis
      title: "It did not reproduce - so it is fixed?"
      prompt: |
        A developer says the open redirect is fixed. You send the original payload again and the server answers
        `/settings` instead of redirecting. Can you close the finding?
      options:
        - id: variants
          text: Not yet - confirm a positive control still works, then try the other ways of writing "another site" (absolute, protocol-relative, backslash, userinfo) before saying it is fixed.
          feedback: Correct - a negative result is only as good as the test; a fix that blocks one spelling often misses another.
        - id: yes
          text: Yes - the exact payload from the report no longer works.
          feedback: Fixes written against one payload commonly pass that payload and nothing else.
        - id: ask
          text: Yes, if the developer is experienced.
          feedback: Verification does not depend on who wrote the fix; it depends on evidence.
        - id: scan
          text: No - only a full scan can show a fix.
          feedback: A targeted retest with variants is faster and more precise than a full scan for one finding.
      correct: [variants]
      hints:
        - How many ways can a URL point to another site?
      solution: |
        Run the control, retry the original and the variants, and record every request. A reproduction failing on the
        original payload only is not a fix. See [Testing SSRF and open redirects](#/lesson/testing-ssrf-and-open-redirects).

  - rounds: [domain-deep-dive, online-assessment]
    subjects: [security-testing]
    exercise:
      id: sec-q-safe-methods
      type: mcq
      concept: security-testing
      skill: analysis
      title: "Is a GET always safe to send?"
      prompt: |
        Your scope allows "read-only testing". You find the request `GET /api/payments/pay_1001/cancel` in the
        documentation. Can you send it with a test account?
      options:
        - id: check
          text: Not without care - RFC 9110 defines GET as safe in its semantics, but a server can implement side effects anyway; read what the endpoint does and use disposable test data or ask.
          feedback: Correct - RFC 9110 notes that its definition "does not prevent an implementation from including behavior that is potentially harmful"; the name of the method guarantees nothing.
        - id: yes
          text: Yes - GET is a safe method, so it cannot change anything.
          feedback: The method name does not stop a badly designed endpoint from cancelling a payment.
        - id: only-post
          text: No - only POST requests are ever dangerous.
          feedback: Any method can carry a side effect; and POST is not the only unsafe one (PUT, PATCH and DELETE are too).
        - id: head
          text: Yes - but send HEAD instead, which is always harmless.
          feedback: HEAD is defined as safe too, but a server can still route it to the same handler.
      correct: [check]
      hints:
        - Who decides what a GET handler really does - the RFC or the developer?
      solution: |
        RFC 9110 section 9.2.1 defines GET, HEAD, OPTIONS and TRACE as safe, but the server decides what actually
        happens. For a state-changing looking path, read the documentation and test with data you may destroy.

  - rounds: [domain-deep-dive, system-test-strategy]
    subjects: [security-testing]
    exercise:
      id: sec-q-estimate-forgotten
      type: mcq
      concept: security-testing
      skill: application
      title: What a test estimate forgets
      prompt: |
        A colleague estimates a portal test as "40 endpoints at 1.5 hours = 60 hours". Which costs are missing from
        a defensible estimate?
      options:
        - id: overheads
          text: Setup (accounts, scope, tools), extra effort for every role (access control is tested again), the report, the re-test of the fixes and some contingency.
          feedback: Correct - these are the lines that turn a testing figure into an engagement estimate, and each can be stated as an assumption.
        - id: nothing
          text: Nothing - testing hours are the whole job.
          feedback: Reporting and re-testing are routinely a large part of the work.
        - id: tool-licences
          text: Only the licence cost of the scanner.
          feedback: Licences are a cost, but they are not hours and they are not what is usually forgotten.
        - id: lunch
          text: Breaks and holidays, which the client should absorb.
          feedback: Productive hours per day is a rate you state; it is not the missing piece.
      correct: [overheads]
      hints:
        - Think about what happens after the testing stops.
      solution: |
        Add setup, a per-role uplift, uploads and integrations, reporting, the re-test and contingency, and state the
        rate of each as an assumption. See the estimator in the [triage mock
        interview](#/lesson/security-testing-mock-interview).

  - rounds: [domain-deep-dive, online-assessment]
    subjects: [security-testing]
    exercise:
      id: sec-q-context-severity
      type: mcq
      concept: security-testing
      skill: analysis
      title: Same flaw, different severity
      prompt: |
        The OWASP Risk Rating Methodology's own worked example has a medium likelihood and a high technical impact,
        but a low business impact. Which overall severity does the methodology give, and why does it matter?
      options:
        - id: low
          text: Low - when you have good business impact information you use it instead of the technical impact, because the business impact is what justifies the cost of fixing.
          feedback: Correct - medium likelihood with low impact gives Low in the severity table; the page says understanding the business context is critical.
        - id: high
          text: High - technical impact always decides.
          feedback: The methodology says business impact is more important when you have it; the technical figure is the fallback.
        - id: critical
          text: Critical - any high impact is critical.
          feedback: Critical needs both high likelihood and high impact in the table.
        - id: medium
          text: Medium - always take the middle value.
          feedback: The severity comes from the table of likelihood level and impact level, not from the middle.
      correct: [low]
      hints:
        - Which impact does the methodology prefer when it has both?
      solution: |
        Likelihood MEDIUM with impact LOW is Low in the OWASP table. Ask who is affected and what it costs the
        business before arguing about the technical score. See [Security testing fundamentals](#/lesson/security-testing-fundamentals).

  - rounds: [domain-deep-dive, online-assessment]
    subjects: [security-testing]
    exercise:
      id: sec-q-rate-limit-test
      type: mcq
      concept: security-testing
      skill: application
      title: Testing a login limit safely
      prompt: |
        You want to check that the login endpoint limits guesses. What is the responsible way?
      options:
        - id: own-account
          text: Use your own test account, send a small number of attempts inside the agreed window, and stop as soon as the limit shows (or after the agreed number), noting the responses.
          feedback: Correct - you prove the control exists or not without locking customers out or flooding the service.
        - id: real-users
          text: Try common passwords against real merchants' accounts to see which fall.
          feedback: That is password guessing against real people's accounts - harmful, and almost certainly outside any scope.
        - id: flood
          text: Send thousands of attempts a second to see when it breaks.
          feedback: That is a denial-of-service test, which needs its own explicit approval, not a login check.
        - id: skip
          text: Skip it; rate limits cannot be tested without attacking.
          feedback: They can - a handful of attempts on a test account shows whether the limit is there.
      correct: [own-account]
      hints:
        - Whose account may you lock out?
      solution: |
        Test accounts only, a small agreed number of attempts, stop when the answer changes. Anything bigger is a load
        or denial-of-service test and needs separate approval. See [Testing authentication](#/lesson/testing-authentication).

  - rounds: [domain-deep-dive, behavioural]
    subjects: [security-testing]
    exercise:
      id: sec-q-real-data
      type: mcq
      concept: security-testing
      skill: analysis
      title: Real card data in a response
      prompt: |
        During an in-scope test, a response contains what looks like a real customer's name and card details. What
        do you do?
      options:
        - id: minimal
          text: Stop probing that endpoint, keep the minimum evidence (the request and a masked copy of the response), do not copy or share the data, and tell the engagement owner at once.
          feedback: Correct - you prove the exposure with the least personal data, protect the people affected and let the owner decide next steps.
        - id: collect
          text: Download everything you can reach to show how bad it is.
          feedback: Extracting more real personal data creates a second incident; one masked example proves the point.
        - id: ignore
          text: Carry on and mention it in the final report.
          feedback: Real data exposure may need action sooner than a report in two weeks; tell the owner now.
        - id: post
          text: Post a screenshot in the team chat so everyone sees it.
          feedback: A screenshot with real card data in a chat is a new leak.
      correct: [minimal]
      hints:
        - What is the least you need to prove the finding?
      solution: |
        Stop, minimal masked evidence, no copies, immediate notice to the engagement owner. See [Testing
        cryptography and data exposure](#/lesson/testing-cryptography-and-data-exposure).

  - rounds: [domain-deep-dive, online-assessment]
    subjects: [security-testing]
    exercise:
      id: sec-q-sqli-fix
      type: mcq
      concept: security-testing
      skill: application
      title: The right fix for SQL injection
      prompt: |
        Your test shows `/api/payments?status=` is injectable. Which fix do you recommend first?
      options:
        - id: parameterised
          text: Use parameterised queries (prepared statements) so the input is never part of the SQL text.
          feedback: Correct - the injection exists because input becomes part of the statement; parameters keep data and code separate.
        - id: blacklist
          text: Block the words SELECT, UNION and quote characters in the input.
          feedback: Blocklists are bypassed by encodings and variants, and they break legitimate input.
        - id: waf
          text: Put a web application firewall in front and leave the code.
          feedback: A WAF can reduce exposure but it does not remove the flaw; fix the code.
        - id: hide-errors
          text: Hide the database error messages.
          feedback: That removes one clue but not the injection; blind techniques still work.
      correct: [parameterised]
      hints:
        - Where does the attacker's text end up?
      solution: |
        Parameterised queries, with an allow-list for identifiers such as sort columns. See [Testing SQL
        injection](#/lesson/testing-sql-injection).

  - rounds: [domain-deep-dive, system-test-strategy]
    subjects: [security-testing]
    exercise:
      id: sec-q-explain-xss
      type: short
      concept: security-testing
      skill: recall
      title: Explain cross-site scripting
      prompt: |
        "Explain cross-site scripting." Answer with the four parts of an explain answer: what it is, how it works, how
        it fails or what it costs, and how you would test and fix it - five or six sentences.
      modelAnswer: |
        Cross-site scripting is when an application puts untrusted input into a page in a way that the browser runs it
        as script. It works because the browser cannot tell the developer's script from script that arrived inside the
        data: if the search term is written into the HTML without encoding, a term holding script runs in the visitor's
        session, with that site's cookies and permissions. It comes in reflected, stored and DOM-based forms; stored is
        the most serious because every visitor runs it. The cost is account takeover, actions performed as the user
        and data theft. To test it I send a harmless marker to every input that is echoed, check where and how it
        appears (HTML body, attribute, script, URL) and whether it is encoded, and keep the request and response as
        evidence; to fix it, encode output for the context, and use a content security policy as a second layer.
      rubric:
        - Defines XSS as untrusted input that the browser executes as script.
        - Explains the mechanism (missing output encoding) and at least two forms (reflected, stored or DOM).
        - Names the impact in terms of a user's session and data.
        - Describes a safe test with a harmless marker and evidence.
        - Names context-aware output encoding as the main fix.
      hints:
        - Definition, mechanism, limits or cost, test.
      solution: |
        Definition, mechanism, forms and impact, a harmless-marker test, and output encoding as the fix. See [Testing
        cross-site scripting](#/lesson/testing-cross-site-scripting).

  - rounds: [domain-deep-dive, system-test-strategy]
    subjects: [security-testing]
    exercise:
      id: sec-q-explain-ssrf
      type: short
      concept: security-testing
      skill: recall
      title: Explain server-side request forgery
      prompt: |
        "What is SSRF, and how would you test for it safely?" Answer in five or six sentences.
      modelAnswer: |
        Server-side request forgery is when an application fetches a URL that the client supplied, so the client can
        make the server send requests to places the client could not reach itself, such as internal services or cloud
        metadata addresses. It happens in features that fetch a URL on the user's behalf - webhooks, image import, link
        preview. The impact depends on what the server can reach: internal data, internal admin interfaces or
        credentials. To test it safely I only point the feature at a listener I run myself, or at a marker on a local
        service I own, never at third-party hosts, and I check whether the server connected and what it returned
        (in-band) or only whether it connected (blind). The fix is an allow-list of destinations, checked after
        resolving the name, with redirects not followed, and network rules that deny the server access to internal
        ranges.
      rubric:
        - Defines SSRF as the server fetching an attacker-chosen URL.
        - Names features where it appears (webhooks, imports, previews).
        - Explains the impact in terms of what the server can reach.
        - Tests only with a listener or target the tester controls, and distinguishes in-band from blind.
        - Names an allow-list checked after resolution and network-level controls.
      hints:
        - Who sends the request, and what can they reach?
      solution: |
        The server fetches a URL the client chose; test only against your own listener; fix with an allow-list checked
        after name resolution and with network egress rules. See [Testing SSRF and open
        redirects](#/lesson/testing-ssrf-and-open-redirects).

  - rounds: [domain-deep-dive, case-study]
    subjects: [security-testing]
    exercise:
      id: sec-q-write-finding
      type: short
      concept: security-testing
      skill: application
      title: Write the finding
      prompt: |
        You confirmed that merchant Alice can read merchant Bob's payment by changing the id in
        `GET /api/payments/{id}`. Write the finding in five or six sentences: a title, what you did, what happened,
        the impact and the fix.
      modelAnswer: |
        **Title: Any merchant can read another merchant's payments (broken object-level authorisation).** With two
        test accounts, merchant A (m_100) and merchant B (m_200), I first confirmed each could read its own payment.
        Then, signed in as A, I requested a payment owned by B (`GET /api/payments/pay_2001`) and the API returned it,
        including B's merchant id and amount, so the API does not check who owns the payment. Any signed-in merchant can
        therefore read every other merchant's payments by changing the id. The impact is disclosure of other merchants' transaction data, a privacy and
        contract problem for SandPay. Fix: check that the payment belongs to the authenticated merchant on the server
        for every request and return the same 404 for objects that are not the caller's. Evidence: request and
        response pairs for both accounts, timestamps, and the build tested.
      rubric:
        - The title states the flaw and who can do what, not only the endpoint.
        - Says what was done, including the two accounts and a control request.
        - Describes the observed result with a concrete request and response fact.
        - States the impact for the business, not only the technical effect.
        - Gives a specific server-side fix and names the evidence kept.
      hints:
        - Could a stranger repeat your steps from the text alone?
      solution: |
        Title, steps with a control, observed result, impact and a server-side fix with evidence. See [Reporting
        vulnerabilities and scoring with CVSS](#/lesson/vulnerability-reporting-and-cvss).

  - rounds: [domain-deep-dive, behavioural]
    subjects: [security-testing]
    exercise:
      id: sec-q-scope-creep
      type: short
      concept: security-testing
      skill: application
      title: "While you are at it - test our partner too"
      prompt: |
        Mid-engagement the client says: "Our payment partner's sandbox is linked from the portal - since you are
        already testing, can you give it a go as well?" What do you say, in four or five sentences?
      modelAnswer: |
        I would say yes in principle but not yet: the partner's systems belong to someone else, so we need their
        written permission, and the scope and schedule should be updated before I send any request. I would ask the
        client to get the partner's consent and any rules their sandbox has, such as rate limits and allowed hours.
        Meanwhile I stay inside the current scope and carry on. Once the amended scope is signed I would test only what
        it lists, and I would note the extra effort, because it changes the estimate and the retest plan.
      rubric:
        - Does not test the partner's systems on the client's say-so alone.
        - Asks for written permission from the partner's owner and an amended scope.
        - Keeps working inside the existing scope meanwhile.
        - Mentions rules of the target (limits, hours) and the effect on effort or schedule.
      hints:
        - Who owns the partner's sandbox?
      solution: |
        Permission comes from the owner of the system, in writing, with an amended scope - and the estimate changes
        with it.

  - rounds: [system-test-strategy, domain-deep-dive]
    subjects: [security-testing]
    exercise:
      id: sec-q-test-feature
      type: interview
      concept: security-testing
      skill: analysis
      title: 'Interview: test the statement download'
      prompt: |
        "SandPay merchants can download their settlement statement as a PDF at
        `/statements/download?file=2026-10.pdf`. How would you test this feature for security?"
      modelAnswer: |
        I would start with permission and scope: which environment, which accounts, what I may not do, and who to
        call. Then I would ask what the feature does - it takes a file name from the client, needs a login, belongs to
        one merchant, and the files hold financial data. That tells me where to look.

        Access control first: two merchant accounts, each downloading their own statement as a control, then A
        requesting B's file name, and a request with no login or an expired session - the answer should be refusal
        every time. File handling next: the `file` parameter is a path, so I try traversal forms such as `../` and
        encoded variants against a harmless target file, and check that only the statements folder is reachable. I
        would also check the response headers and file type (a download should not be rendered as a page), the error
        messages for a missing file (no paths or stack traces), and whether the endpoint can be called thousands of
        times (rate limits). Finally the data itself: is it transported over TLS, and does the PDF carry more than the
        merchant should see?

        I would write each as a test case with an expected result and evidence, rate the findings with likelihood and
        business impact, report them with steps to reproduce, and offer to retest after the fixes.
      rubric:
        - Starts with permission, scope and understanding what the feature does.
        - Covers access control with two accounts and a control, including unauthenticated access.
        - Covers path traversal and file handling on the file parameter.
        - Covers error handling, rate limiting and transport or data exposure.
        - Ends with evidence, severity by business impact, a report and a retest.
      followUps:
        - Which of these tests would you automate, and which not?
        - What would make you stop testing this endpoint immediately?
      hints:
        - What does the file parameter let a client choose?
      solution: |
        Permission and scope, a feature analysis, access control with two accounts, traversal on the file parameter,
        error handling, rate limiting and data exposure - each with evidence and a retest. See [Testing file handling
        and path traversal](#/lesson/testing-file-handling-and-path-traversal).

  - rounds: [debugging-rca, system-test-strategy]
    subjects: [security-testing]
    exercise:
      id: sec-q-scanner-120
      type: interview
      concept: security-testing
      skill: analysis
      title: 'Interview: 120 findings, report due tomorrow'
      prompt: |
        "A scanner reported 120 findings on the portal and the client wants a report tomorrow. What do you do?"
      modelAnswer: |
        I would not forward 120 findings. First I check scope: every finding must be on a host in the written scope; I
        hand any that are not back to the owner without testing them. Then I deduplicate - the same flaw is often
        reported on many URLs - and group by type.

        For each group I validate by hand with a control: reproduce with my own request, keep the request and response,
        and check that my test would have worked (a negative without a working control proves nothing). That gives me
        confirmed findings, false positives, and some I could not verify yet. I rate the confirmed ones by likelihood
        and by business impact, not by the scanner's label, and order the report by that, with the false positive rate
        and what I did not verify stated openly.

        For tomorrow I would deliver the confirmed findings with evidence and a fix for each, a list of what is still
        unverified, and a plan for the rest, rather than 120 unchecked rows.
      rubric:
        - Checks scope first and returns out-of-scope hosts without testing them.
        - Deduplicates and groups the findings.
        - Validates manually with a positive control and keeps evidence.
        - Rates by likelihood and business impact instead of the scanner's severity.
        - Reports confirmed, false positive and unverified separately and honestly.
      followUps:
        - What if the client insists on all 120 in the report?
        - How would you tune the scanner for next time?
      hints:
        - What is the first question you ask of every row?
      solution: |
        Scope, deduplicate, validate with controls, rate by business impact, and report confirmed, false positive and
        unverified separately. See the [triage mock interview](#/lesson/security-testing-mock-interview).

  - rounds: [debugging-rca, domain-deep-dive]
    subjects: [security-testing]
    exercise:
      id: sec-q-verify-fix
      type: interview
      concept: security-testing
      skill: analysis
      title: 'Interview: "it is fixed, please close it"'
      prompt: |
        "Our developers say the IDOR you reported last month is fixed. How do you verify that, and what would make you
        refuse to close it?"
      modelAnswer: |
        I verify on the build that contains the fix, and I record which build it was. First the positive control: both
        accounts can still read their own payments, because a fix that breaks the feature, or a login that no longer
        works, would make every denial meaningless. Then the original request - account A asking for B's payment - must
        now be refused, with the same answer as for an object that does not exist, so the API does not reveal which ids
        are real.

        Then variants: other endpoints that take the same id (a list, an export, an update), other methods (PUT,
        DELETE), the id in a different place (body, header), different encodings, and the same check for an
        administrator and an unauthenticated caller. I would also look at what the fix is: a check in one handler
        leaves the others open; a shared check on the object is better.

        I would refuse to close it if the control fails, if any variant still returns another merchant's data, or if I
        cannot reproduce the original on the previous build to prove my test still detects the flaw. I would record
        the requests and responses and keep the test, so it can run on every release.
      rubric:
        - Tests the build with the fix and records it.
        - Runs a positive control before trusting any refusal.
        - Repeats the original request and expects a refusal that does not leak.
        - Tries variants (other endpoints, methods, id locations, roles).
        - States conditions for refusing to close, and keeps the test as regression.
      followUps:
        - How do you prove the test still finds the flaw?
        - Who should write the regression test?
      hints:
        - How would you know your test could still detect the bug?
      solution: |
        Control, original request, variants, a check that the test still detects the flaw on the old build, and a
        regression test. See [Automating security regression tests](#/lesson/security-regression-automation).

  - rounds: [system-test-strategy, case-study]
    subjects: [security-testing]
    exercise:
      id: sec-q-scope-and-estimate
      type: interview
      concept: security-testing
      skill: analysis
      title: 'Interview: how long for 40 endpoints and 3 roles?'
      prompt: |
        "We have a payments API with 40 endpoints, 3 user roles, a file upload and two outgoing webhooks. How long
        would a security test take, and what would you need from us?"
      modelAnswer: |
        I would give a range with assumptions, not a single number. My model: hours per endpoint times the number of
        endpoints, plus an uplift for each extra role because access control is tested again for every role, plus fixed
        time for the upload and each integration, plus setup (accounts, scope, documentation), then the report, the
        re-test of the fixes and some contingency. As an illustration only, with assumed rates of 1.5 hours per
        endpoint and a 40 percent uplift per extra role, 40 endpoints and 3 roles is already about 108 hours before the
        upload, integrations and the overheads, which is why I would not quote "40 times 1.5".

        From the client I need: the written scope and permission, an environment that is not production if possible,
        two or three test accounts per role, the API description, who to call, the testing window, and what is out of
        bounds (denial of service, third-party hosts). I would also ask for a few findings from earlier tests, to
        calibrate my rates, and I would agree how many re-test rounds are included.
      rubric:
        - Offers a model with assumptions instead of a single figure.
        - Includes the role uplift, upload and integrations, setup, report, re-test and contingency.
        - Does the arithmetic with stated, assumed rates.
        - Lists what is needed from the client (scope, environment, accounts, documentation, contacts, window).
        - Mentions out-of-bounds activities and re-test rounds.
      followUps:
        - What would make you widen the range?
        - How would you tell the client the estimate if they have a fixed budget?
      hints:
        - What costs more than the sum of the endpoints?
      solution: |
        Endpoints, roles, uploads, integrations, setup, report, re-test and contingency with assumed rates, plus a list of
        what you need from the client. See the estimator in the [triage mock
        interview](#/lesson/security-testing-mock-interview).

  - rounds: [debugging-rca, behavioural]
    subjects: [security-testing]
    exercise:
      id: sec-q-intruder-found
      type: interview
      concept: security-testing
      skill: analysis
      title: 'Interview: someone else got there first'
      prompt: |
        "During an authorised test you find a web shell on the server and log lines that look like another attacker
        is active right now. What do you do?"
      modelAnswer: |
        I stop the test activity that touches that system and tell the engagement owner and the contact named for
        incidents immediately, by the channel agreed in the rules of engagement, not by email in the report. NIST SP
        800-115 says the assessment plan should state what assessors do if they find an intruder or an intruder's
        footprints, including whether testing stops and who decides when it restarts; I would follow that, and if the
        plan says nothing I would stop and ask rather than guess.

        I would not remove the shell or clean up, because that destroys evidence and is not my decision. I would note
        what I saw - times, file paths, log lines - without touching more, keep my own activity log so the
        client's responders can tell my requests from the attacker's, and wait for their instruction. Testing resumes
        only when the owner says so. In the report, this goes into a separate section as an incident, not as a normal
        finding.
      rubric:
        - Stops activity on the affected system and notifies the engagement owner at once.
        - Uses the agreed incident contact and channel from the rules of engagement.
        - Does not remove or alter what was found.
        - Keeps a record of its own activity so responders can tell it from the attacker.
        - Resumes only on the owner's decision and reports the incident separately.
      followUps:
        - What would you put in your own activity log?
        - What if the contact does not answer?
      hints:
        - Whose decision is it to clean up?
      solution: |
        Stop, notify through the agreed channel, preserve evidence, keep your own activity log, resume only when told.
        NIST SP 800-115 asks the assessment plan to cover exactly this case.
