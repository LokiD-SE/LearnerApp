questions:
  - rounds: [online-assessment]
    exercise:
      id: oa-severity-priority
      type: mcq
      concept: testing-fundamentals
      skill: recall
      title: Severity and priority
      prompt: |
        The company logo is misspelt on the home page. Nothing else is affected, and a big launch is tomorrow.
        Which classification fits best?
      options:
        - id: low-sev-high-pri
          text: Low severity, high priority
          feedback: Correct - functionally harmless (low severity), but very visible and urgent to fix (high priority).
        - id: high-sev-high-pri
          text: High severity, high priority
          feedback: Severity describes impact on the system's function - a misspelt logo breaks nothing.
        - id: low-sev-low-pri
          text: Low severity, low priority
          feedback: The launch and the visibility make it urgent for the business, so priority is high.
        - id: high-sev-low-pri
          text: High severity, low priority
          feedback: That combination fits a serious crash in a rarely used feature - the opposite of this case.
      correct: [low-sev-high-pri]
      hints:
        - Severity is impact on function; priority is urgency for the business.
      solution: |
        **Low severity, high priority.** Severity is about technical impact; priority is about how soon it must be
        fixed. Teams define the exact scales, so ask which ones they use.
  - rounds: [online-assessment]
    exercise:
      id: oa-smoke-sanity
      type: mcq
      concept: testing-fundamentals
      skill: recall
      title: Smoke testing
      prompt: |
        A new build has just been deployed to the test environment. What is a smoke test for?
      options:
        - id: build-stable
          text: A quick, broad check that the build's most important functions work, before deeper testing
          feedback: Correct - it decides whether the build is stable enough to test further.
        - id: deep-module
          text: A thorough test of one module after a bug fix
          feedback: That is closer to re-testing or sanity testing of a specific change.
        - id: performance
          text: Checking how the system behaves under heavy load
          feedback: That is load or performance testing.
        - id: all-regression
          text: Running the full regression suite
          feedback: Regression is broad and deep; smoke is broad and shallow.
      correct: [build-stable]
      hints:
        - Think "does it catch fire when switched on?".
      solution: |
        A **smoke test** is a short, broad check of critical functions on a new build. Teams use "sanity test"
        differently - often for a narrow check of a specific change - so confirm the local meaning.
  - rounds: [online-assessment]
    exercise:
      id: oa-retest-regression
      type: mcq
      concept: testing-fundamentals
      skill: recall
      title: Re-testing and regression testing
      prompt: |
        A developer fixed a bug in the refund calculation. Which statement is right?
      options:
        - id: both
          text: Re-test the bug's own scenario, and run regression tests on related areas that the fix might have broken
          feedback: Correct - re-testing confirms the fix; regression checks that nothing else broke.
        - id: retest-only
          text: Re-testing the original bug is enough
          feedback: A fix can break neighbouring behaviour - that is what regression testing is for.
        - id: same-thing
          text: Re-testing and regression testing mean the same thing
          feedback: Re-testing targets the fixed defect; regression targets unchanged areas.
        - id: regression-only
          text: Run regression only; the developer already checked the fix
          feedback: Independent confirmation of the fix is still part of testing.
      correct: [both]
      hints:
        - One checks the fix, the other checks everything around it.
      solution: |
        **Re-testing** confirms the specific defect is fixed; **regression testing** checks that the change didn't
        break anything that used to work.
  - rounds: [online-assessment]
    exercise:
      id: oa-equivalence
      type: mcq
      concept: testing-fundamentals
      skill: application
      title: Equivalence partitioning
      prompt: |
        A field accepts an age from 18 to 60 (whole numbers). Using equivalence partitioning, how many partitions
        are there, counting valid and invalid ones?
      options:
        - id: three
          text: Three - below 18, 18 to 60, above 60
          feedback: Correct - one valid partition and two invalid ones (for whole-number input).
        - id: two
          text: Two - valid and invalid
          feedback: Values below and above the range are invalid for different reasons, so they are separate partitions.
        - id: forty-three
          text: Forty-three - one per valid age
          feedback: Every value in a partition is expected to behave the same, so one representative is enough.
        - id: one
          text: One - 18 to 60
          feedback: Invalid partitions need tests too.
      correct: [three]
      hints:
        - Valid values behave the same; which groups of invalid values behave the same?
      solution: |
        **Three**: below 18 (invalid), 18-60 (valid), above 60 (invalid). Non-numeric or empty input are further
        invalid classes if the field allows typing them.
  - rounds: [online-assessment]
    exercise:
      id: oa-defect-lifecycle
      type: order
      concept: testing-fundamentals
      skill: recall
      title: A typical defect life cycle
      prompt: |
        Put a typical defect's states in order, from report to closure (names vary between tools).
      items:
        - id: new
          text: New - reported by the tester
        - id: assigned
          text: Assigned - given to a developer
        - id: fixed
          text: Fixed - the developer changed the code
        - id: retest
          text: Ready for re-test - in a build the tester can use
        - id: closed
          text: Closed - the tester confirmed the fix
      hints:
        - Who acts at each step - tester, lead, developer, tester?
      solution: |
        New → Assigned → Fixed → Ready for re-test → Closed. Real workflows add states such as Rejected, Deferred,
        Duplicate and Reopened.
  - rounds: [online-assessment]
    exercise:
      id: oa-http-status
      type: mcq
      concept: testing-fundamentals
      skill: recall
      title: 401 or 403?
      prompt: |
        An API request carries a valid token for a user who is not allowed to see the resource. Which status code
        fits best according to HTTP semantics?
      options:
        - id: s403
          text: '403 Forbidden'
          feedback: Correct - the client is identified but not permitted.
        - id: s401
          text: '401 Unauthorized'
          feedback: 401 means the request lacks valid authentication credentials - here they are valid.
        - id: s404
          text: '404 Not Found'
          feedback: Some APIs return 404 to hide that a resource exists, but by default 403 is the semantic answer.
        - id: s400
          text: '400 Bad Request'
          feedback: The request is well-formed; the problem is permission.
      correct: [s403]
      hints:
        - Is the problem who you are, or what you're allowed to do?
      solution: |
        **403**: authenticated but not authorised. **401**: not (validly) authenticated. Some APIs deliberately
        answer 404 to avoid revealing a resource - check the API's documentation.
  - rounds: [online-assessment]
    exercise:
      id: oa-sql-join
      type: mcq
      concept: sql-and-data
      skill: application
      title: Orders without payments
      prompt: |
        Tables `orders(id, ...)` and `payments(id, order_id, ...)`. Which query lists orders that have **no**
        payment?

        ```sql
        -- A
        SELECT o.id FROM orders o JOIN payments p ON p.order_id = o.id WHERE p.id IS NULL;
        -- B
        SELECT o.id FROM orders o LEFT JOIN payments p ON p.order_id = o.id WHERE p.id IS NULL;
        -- C
        SELECT o.id FROM orders o LEFT JOIN payments p ON p.order_id = o.id WHERE p.id IS NOT NULL;
        -- D
        SELECT p.order_id FROM payments p WHERE p.order_id IS NULL;
        ```
      options:
        - id: b
          text: B
          feedback: Correct - the LEFT JOIN keeps every order; rows without a match have NULL payment columns.
        - id: a
          text: A
          feedback: An inner JOIN keeps only orders that have a payment, so p.id is never NULL here.
        - id: c
          text: C
          feedback: That lists orders that do have a payment.
        - id: d
          text: D
          feedback: Payments without an order are a different question - and orders with no payment don't appear in payments at all.
      correct: [b]
      hints:
        - Which join keeps rows from the left table even without a match?
      solution: |
        **B.** `LEFT JOIN ... WHERE right.id IS NULL` is the standard "anti-join"; `NOT EXISTS` is an equivalent
        alternative.
  - rounds: [online-assessment]
    exercise:
      id: oa-sql-having
      type: mcq
      concept: sql-and-data
      skill: application
      title: Customers with several failed payments
      prompt: |
        Which clause keeps only customers with more than three failed payments in
        `SELECT customer_id, COUNT(*) FROM payments WHERE status = 'FAILED' GROUP BY customer_id ____`?
      options:
        - id: having
          text: HAVING COUNT(*) > 3
          feedback: Correct - HAVING filters groups after aggregation.
        - id: where
          text: AND COUNT(*) > 3 (added to the WHERE clause)
          feedback: WHERE filters rows before grouping; aggregates are not allowed there.
        - id: order
          text: ORDER BY COUNT(*) > 3
          feedback: ORDER BY sorts; it doesn't remove groups.
        - id: limit
          text: LIMIT 3
          feedback: LIMIT caps the number of rows returned, regardless of their counts.
      correct: [having]
      hints:
        - Rows are filtered before grouping, groups after.
      solution: |
        **HAVING COUNT(*) > 3.** WHERE filters rows; HAVING filters groups.
  - rounds: [online-assessment]
    subjects: [java, ui-automation, frameworks]
    exercise:
      id: oa-java-string-equality
      type: mcq
      concept: coding-problem-solving
      skill: application
      title: Comparing strings in Java
      prompt: |
        What does this print?

        ```java
        String a = "pay";
        String b = new String("pay");
        System.out.println((a == b) + " " + a.equals(b));
        ```
      options:
        - id: false-true
          text: false true
          feedback: Correct - `new String` creates a different object, but the characters are equal.
        - id: true-true
          text: true true
          feedback: "`==` compares references; `new String(...)` always creates a new object."
        - id: true-false
          text: true false
          feedback: "`equals` compares the characters, which are the same."
        - id: compile-error
          text: It doesn't compile
          feedback: Both comparisons are valid Java.
      correct: [false-true]
      hints:
        - What does `==` compare for objects?
      solution: |
        **false true.** Use `equals` for content; `==` checks whether two references point to the same object.
  - rounds: [online-assessment]
    subjects: [java, ui-automation, frameworks]
    exercise:
      id: oa-java-hashset-equals
      type: mcq
      concept: coding-problem-solving
      skill: analysis
      title: equals without hashCode
      prompt: |
        `Amount` is a class with fields `value` and `currency` that overrides `equals` but **not** `hashCode`.
        What is the most likely result of adding `new Amount(100, "EUR")` twice to a `HashSet` and printing the
        size?
      options:
        - id: two
          text: Usually 2
          feedback: Correct - the two equal objects most likely have different identity hash codes, so the set never compares them with equals.
        - id: one
          text: Always 1
          feedback: HashSet looks up the bucket by hashCode first; without a matching hashCode, equals is often never called.
        - id: exception
          text: An exception is thrown
          feedback: Breaking the equals/hashCode contract causes wrong results, not an exception.
        - id: zero
          text: '0'
          feedback: The first add always succeeds, so the set can't be empty.
      correct: [two]
      hints:
        - Which method does HashSet call first?
      solution: |
        **Usually 2.** Equal objects must have equal hash codes; override both (or use a `record`, which generates
        both). See [equals and hashCode](#/lesson/java-equals-hashcode).
  - rounds: [online-assessment]
    subjects: [playwright]
    exercise:
      id: oa-js-event-loop
      type: mcq
      concept: coding-problem-solving
      skill: analysis
      title: Promises and timers
      prompt: |
        What does this print, in order?

        ```js
        console.log('A');
        setTimeout(() => console.log('B'), 0);
        Promise.resolve().then(() => console.log('C'));
        console.log('D');
        ```
      options:
        - id: adcb
          text: A D C B
          feedback: Correct - synchronous code first, then microtasks (promise callbacks), then the timer task.
        - id: abcd
          text: A B C D
          feedback: Callbacks never run in the middle of synchronous code.
        - id: adbc
          text: A D B C
          feedback: Promise callbacks (microtasks) run before the next task such as a timer.
        - id: acdb
          text: A C D B
          feedback: The `.then` callback waits until the current synchronous code has finished.
      correct: [adcb]
      hints:
        - Synchronous code, then microtasks, then tasks.
      solution: |
        **A D C B.** See [async JavaScript and TypeScript types](#/lesson/js-ts-async-and-types).
  - rounds: [online-assessment]
    subjects: [playwright]
    exercise:
      id: oa-js-equality
      type: mcq
      concept: coding-problem-solving
      skill: recall
      title: Strict equality
      prompt: |
        In JavaScript, what is `0 == ''` and what is `0 === ''`?
      options:
        - id: true-false
          text: true and false
          feedback: Correct - `==` converts the string to a number (0); `===` compares types without converting.
        - id: false-false
          text: false and false
          feedback: Loose equality converts `''` to the number 0 first.
        - id: true-true
          text: true and true
          feedback: Strict equality never converts - a number is never `===` a string.
        - id: error
          text: A TypeError
          feedback: Comparisons don't throw; they coerce (`==`) or compare strictly (`===`).
      correct: [true-false]
      hints:
        - Which operator converts types?
      solution: |
        **true and false.** Use `===` in tests and code so type conversion can't hide a bug.
  - rounds: [online-assessment, debugging-rca]
    exercise:
      id: oa-flaky-cause
      type: mcq
      concept: debugging-and-rca
      skill: analysis
      title: The most likely cause of a flaky test
      prompt: |
        A UI test passes when run alone but fails about one run in five in the full suite, always at a different
        step. Which cause is most likely?
      options:
        - id: shared-state
          text: Shared state or timing - for example data used by another test, or a missing wait for an asynchronous update
          feedback: Correct - intermittent failures at varying steps point to timing or interference between tests.
        - id: wrong-locator
          text: A wrong locator
          feedback: A wrong locator fails every time, at the same step.
        - id: product-bug-always
          text: A deterministic bug in the product
          feedback: A deterministic bug fails every run.
        - id: syntax
          text: A syntax error in the test
          feedback: That would stop the test from compiling or running at all.
      correct: [shared-state]
      hints:
        - What changes between runs, and between running alone and together?
      solution: |
        **Shared state or timing.** Collect evidence (traces, logs, which tests ran before it) to tell the two
        apart.
