questions:
  - rounds: [domain-deep-dive]
    subjects: [payments-testing, api-testing, payment-architecture]
    exercise:
      id: dd-auth-capture
      type: interview
      concept: payments-domain
      skill: application
      title: Authorisation and capture
      prompt: |
        **Interviewer:** "Explain the difference between authorising and capturing a card payment, and the tests
        you would write because of it."
      hints:
        - Reserving money versus taking it.
      modelAnswer: |
        - **Authorisation:** the issuer approves and reserves the amount on the customer's card; no money moves yet.
        - **Capture:** the merchant asks to collect an authorised amount (often when goods ship); settlement moves
          the money later.
        - Some flows capture immediately, others later; an authorisation that is never captured expires or is
          released after a period that depends on the card scheme and issuer.
        - **Tests:** capture the full and a partial amount; capture more than authorised (rejected); capture twice;
          void an authorisation; capture after expiry; refund only captured money; statuses and webhooks at each
          step.
      rubric:
        - Explained that authorisation reserves and capture collects
        - Mentioned delayed capture or expiry of authorisations
        - Named tests for partial, over- and double capture
        - Named tests for voids and refunds in the right states
      solution: |
        See [the payment lifecycle](#/lesson/payment-lifecycle-overview). Expiry periods are scheme- and
        issuer-specific - say so rather than quoting a number.
      followUps:
        - How would you test an authorisation that expires?
  - rounds: [domain-deep-dive]
    subjects: [payments-testing, api-testing, payment-architecture]
    exercise:
      id: dd-unknown-outcome
      type: interview
      concept: payments-domain
      skill: analysis
      title: A timeout during payment
      prompt: |
        **Interviewer:** "Our server calls the payment provider and the call times out. What state is the payment
        in, what should the system do, and how do you test it?"
      hints:
        - Did the provider receive the request?
      modelAnswer: |
        - The outcome is **unknown**: the provider may have charged the card, rejected it or never received the
          request.
        - The system must not report failure or success; it marks the payment as pending or unknown, then resolves
          it - by retrying with the same idempotency key, querying the provider, or waiting for a webhook.
        - The customer sees a pending state and is not encouraged to pay again.
        - **Tests:** simulate timeouts before and after the provider processes the request; retry with the same
          key; webhook arrives later; reconciliation catches anything still unresolved.
      rubric:
        - Said the outcome is unknown rather than failed
        - Described resolving it with an idempotent retry, a status query or a webhook
        - Considered what the customer sees
        - Named tests that simulate timeouts at different points
        - Mentioned reconciliation as the safety net
      solution: |
        This is the core idea of [declines, timeouts and unknown outcomes](#/lesson/declines-timeouts-unknown-outcomes).
      followUps:
        - How do you simulate "the provider processed it but the response was lost"?
  - rounds: [domain-deep-dive, system-test-strategy]
    subjects: [payments-testing, api-testing, payment-architecture]
    exercise:
      id: dd-webhooks
      type: interview
      concept: payments-domain
      skill: application
      title: Testing webhooks
      prompt: |
        **Interviewer:** "Our backend receives payment status webhooks from the provider. What can go wrong, and how
        do you test it?"
      hints:
        - Delivery is at least once, and order is not guaranteed by many providers.
      modelAnswer: |
        - **Authenticity:** signature verification - valid, invalid, missing, replayed old events.
        - **Duplicates:** the same event delivered twice is processed once.
        - **Order:** a later status arriving before an earlier one doesn't move the payment backwards.
        - **Failures:** our endpoint returns an error or times out - the provider retries (according to its
          documented policy) and we handle the retry.
        - **Missing events:** a reconciliation or status query catches payments whose webhook never came.
        - **Tooling:** the provider's sandbox or CLI to send test events, or a stub that signs events.
      rubric:
        - Tested signature verification
        - Tested duplicate delivery
        - Tested out-of-order events
        - Tested our endpoint failing and provider retries
        - Covered missing events with reconciliation or polling
      solution: |
        See [webhooks and asynchronous status](#/lesson/webhooks-and-async-status). Retry schedules and ordering
        guarantees are provider-specific - check the provider's documentation.
      followUps:
        - How would you test webhook handling in an automated suite without the real provider?
  - rounds: [domain-deep-dive]
    subjects: [payments-testing, payment-architecture]
    exercise:
      id: dd-reconciliation
      type: interview
      concept: payments-domain
      skill: application
      title: Reconciliation
      prompt: |
        **Interviewer:** "What is payment reconciliation, and how would you test a reconciliation job?"
      hints:
        - Two records of the same money that must agree.
      modelAnswer: |
        - **What:** comparing our records (orders, payments, refunds) with the provider's settlement reports and the
          bank, and flagging differences.
        - **Mismatches to test:** missing on either side, amount or currency differs, status differs (we think
          failed, provider settled), duplicates, refunds and fees, items settling on a different day.
        - **Job behaviour:** idempotent re-runs, large files, partial or late reports, time zones at day
          boundaries, clear output for finance.
      rubric:
        - Explained reconciliation as comparing internal and provider records
        - Listed several mismatch types
        - Covered timing such as late settlement and day boundaries
        - Covered re-runs and large or partial reports
      solution: |
        Reconciliation is the safety net for every unknown outcome - testers who know it stand out in payments
        interviews.
  - rounds: [domain-deep-dive, online-assessment]
    subjects: [api-testing, payments-testing, payment-architecture, playwright]
    exercise:
      id: dd-idempotent-methods
      type: mcq
      concept: payments-domain
      skill: recall
      title: Idempotent HTTP methods
      prompt: |
        According to HTTP semantics (RFC 9110), which methods are defined as idempotent?
      options:
        - id: get-put-delete
          text: GET, PUT and DELETE
          feedback: Correct - repeating them has the same intended effect as sending them once (GET is also safe).
        - id: post
          text: POST, GET and PUT
          feedback: POST is not idempotent - repeating it may create another resource or charge again.
        - id: patch
          text: PATCH and PUT
          feedback: PATCH is not defined as idempotent; whether it is depends on the patch format and the API.
        - id: all
          text: All methods, if the server is well written
          feedback: Idempotency is a property the method's definition promises; servers make POST safe to retry with tools such as idempotency keys.
      correct: [get-put-delete]
      hints:
        - Which method creates new things on each call?
      solution: |
        **GET, PUT and DELETE** (plus HEAD, OPTIONS and TRACE). POST needs an
        [idempotency key](#/lesson/idempotency-keys) to be retried safely.
  - rounds: [domain-deep-dive]
    subjects: [payments-testing, mobile-testing]
    exercise:
      id: dd-3ds
      type: testdesign
      concept: payments-domain
      skill: application
      title: Customer authentication challenges
      prompt: |
        Card payments may require the customer to authenticate with their bank (for example a 3-D Secure
        challenge). Design the tests for the checkout's authentication step. Mark provider-specific behaviour as an
        assumption to confirm in the provider's sandbox documentation.
      hints:
        - The bank may not ask, may ask and succeed, or may ask and fail - and the customer may simply leave.
      modelAnswer: |
        - **No challenge** (frictionless): payment continues without customer action.
        - **Challenge passed:** the customer completes it and the payment proceeds.
        - **Challenge failed or cancelled:** the payment is not charged; a clear message lets the customer retry or
          use another card.
        - **Abandoned or timed out:** the customer closes the window or waits too long; the order doesn't hang
          forever.
        - **Interruptions:** browser back, page reload, app switching on mobile during the challenge.
        - **Evidence:** the status recorded in our backend, the provider's sandbox logs, no duplicate charges.
        - Use the provider's documented sandbox test cards for each outcome.
      rubric:
        - Covered no challenge, passed and failed challenges
        - Covered abandoned or timed-out challenges
        - Covered interruptions such as back, reload or app switching
        - Checked backend status and no duplicate charges
        - Used the provider's sandbox test data and marked assumptions
      solution: |
        Authentication steps hand control to a third party - the same "outcome decided elsewhere" pattern as other
        redirects and app switches.
  - rounds: [domain-deep-dive]
    subjects: [playwright]
    exercise:
      id: dd-playwright-vs-selenium
      type: interview
      concept: automation-skills
      skill: application
      title: Playwright or Selenium?
      prompt: |
        **Interviewer:** "Why would you choose Playwright over Selenium for a new project - or the other way
        round?"
      hints:
        - Features, ecosystem and the team's situation.
      modelAnswer: |
        - **Playwright:** automatic waiting and web-first assertions, isolated browser contexts, network
          interception and API testing built in, a test runner with fixtures, parallel runs and traces; bindings
          for JavaScript/TypeScript, Python, Java and .NET; Chromium, Firefox and WebKit builds.
        - **Selenium:** the W3C WebDriver standard, implemented by browser vendors' drivers; many languages; Selenium
          Grid; large existing ecosystem and skills; Appium uses the same WebDriver protocol for mobile apps.
        - **Decide by context:** existing suites and skills, languages, browsers that must be covered, mobile needs,
          CI infrastructure - not by fashion.
      rubric:
        - Named concrete Playwright strengths such as auto-waiting, contexts or tracing
        - Named concrete Selenium strengths such as the WebDriver standard, Grid or ecosystem
        - Mentioned language and browser support accurately
        - Based the decision on the team's context
      solution: |
        Tool-comparison answers are judged on **accuracy and context** - avoid "X is just faster" without evidence.
      followUps:
        - How would you migrate a Selenium suite to Playwright without stopping releases?
  - rounds: [domain-deep-dive, debugging-rca]
    subjects: [playwright]
    exercise:
      id: dd-playwright-ci-debug
      type: interview
      concept: automation-skills
      skill: application
      title: Debugging a Playwright failure from CI
      prompt: |
        **Interviewer:** "A Playwright test failed in CI and you can't reproduce it locally. What do you use to
        investigate?"
      hints:
        - Playwright can record what happened during the run.
      modelAnswer: |
        - **Traces:** configure `trace` (for example `'on-first-retry'` or `'retain-on-failure'`) and open the
          trace from the CI artefacts with `npx playwright show-trace` or the HTML report - it shows actions, DOM
          snapshots, console and network.
        - **Screenshots and video:** `screenshot: 'only-on-failure'`, `video: 'retain-on-failure'`.
        - **Reports:** the HTML report kept as a CI artefact.
        - **Reproduce:** run with CI's settings (headless, workers, browser), `--repeat-each` to find flakiness.
      rubric:
        - Used traces and knew how to open them
        - Mentioned screenshots, video or reports as CI artefacts
        - Reproduced with CI settings or repeated runs
      solution: |
        See [Playwright network mocking and API testing](#/lesson/playwright-network-and-api) and the
        Playwright configuration docs for the exact option values your version supports.
  - rounds: [domain-deep-dive, online-assessment]
    subjects: [playwright]
    exercise:
      id: dd-playwright-actionability
      type: mcq
      concept: automation-skills
      skill: recall
      title: What Playwright checks before a click
      prompt: |
        Before `locator.click()` acts, Playwright waits for actionability checks. Which list matches its
        documentation?
      options:
        - id: checks
          text: The element is visible, stable (not animating), receives events (not covered) and enabled
          feedback: Correct - these are the actionability checks the Playwright docs list for click.
        - id: network-idle
          text: The network has been idle for 500 ms
          feedback: Waiting for network idle is not part of actionability, and the docs discourage relying on it.
        - id: dom-loaded
          text: Only that the element exists in the DOM
          feedback: Playwright waits for more than existence - an invisible or covered element is not clicked.
        - id: none
          text: Nothing - you must add explicit waits
          feedback: Auto-waiting is one of Playwright's core features.
      correct: [checks]
      hints:
        - Could a real user click an invisible, moving or covered button?
      solution: |
        **Visible, stable, receives events, enabled.** `fill` also waits for the element to be editable. See
        [Playwright locators and assertions](#/lesson/playwright-locators-and-assertions).
  - rounds: [domain-deep-dive, online-assessment]
    subjects: [java, ui-automation, frameworks]
    exercise:
      id: dd-mixing-waits
      type: mcq
      concept: automation-skills
      skill: recall
      title: Implicit and explicit waits together
      prompt: |
        What does the Selenium documentation say about mixing implicit and explicit waits?
      options:
        - id: dont-mix
          text: Don't mix them - doing so can cause unpredictable wait times
          feedback: Correct - the Selenium docs warn against mixing them.
        - id: recommended
          text: Mixing is recommended for the most stable tests
          feedback: The documentation warns against it; the waits can interact and stretch timeouts.
        - id: implicit-wins
          text: The implicit wait always overrides the explicit wait
          feedback: They don't override each other - an explicit wait's polling calls can each wait for the implicit timeout.
        - id: no-effect
          text: It has no effect either way
          feedback: It does have an effect - timing becomes hard to predict.
      correct: [dont-mix]
      hints:
        - What happens when each poll of an explicit wait itself waits implicitly?
      solution: |
        **Don't mix them.** Use explicit waits for conditions; see
        [Selenium waits and synchronisation](#/lesson/selenium-waits-and-synchronisation).
  - rounds: [domain-deep-dive]
    subjects: [java, ui-automation, frameworks]
    exercise:
      id: dd-selenium-architecture
      type: interview
      concept: automation-skills
      skill: application
      title: How Selenium talks to the browser
      prompt: |
        **Interviewer:** "What happens between `driver.findElement(...).click()` in your Java test and the click
        in Chrome?"
      hints:
        - Client library, protocol, driver, browser.
      modelAnswer: |
        - The Java client library turns the call into W3C WebDriver commands - HTTP requests with JSON bodies.
        - The browser driver (chromedriver, or a Grid node forwarding to one) receives them and drives the browser
          through the browser's own automation interface.
        - The response (element reference, success or an error such as no such element) travels back to the
          client, which returns a value or throws an exception.
        - Consequences: each call is a round trip (so chatty tests are slow), and the page can change between calls
          (stale elements, timing).
      rubric:
        - Mentioned the W3C WebDriver protocol over HTTP
        - Described the driver's role between client and browser
        - Described errors returning as exceptions
        - Connected the architecture to speed or staleness in tests
      solution: |
        Knowing the architecture explains many flaky-test symptoms - interviewers use this question to tell users of
        a tool from people who understand it.
      followUps:
        - How does Selenium Grid change this picture?
  - rounds: [domain-deep-dive, hiring-manager]
    exercise:
      id: dd-your-framework
      type: interview
      concept: framework-architecture
      skill: application
      title: Your automation, in depth
      prompt: |
        **Interviewer:** "Pick the test automation you know best and walk me through it in depth - how a test runs,
        from the command to the report."
      hints:
        - Follow one test from start to finish, then zoom out.
      modelAnswer: |
        - **One test end to end:** the command or CI job, configuration loading, setup (browser or API client, test
          data), the steps through page objects or clients, assertions, teardown, and the report.
        - **Design decisions:** why it is structured this way, what you changed and why, what you would do
          differently now.
        - **Numbers:** suite size, run time, flaky rate, how often it catches real defects.
        - **Honest limits:** what is weak today and the plan for it.
      rubric:
        - Traced one test from command to report
        - Explained the reasons behind the design
        - Gave concrete numbers such as run time or flaky rate
        - Was honest about weaknesses and next steps
      solution: |
        Deep dives check whether you **built and understood** the work on your CV - depth on one thing beats
        breadth on ten.
      followUps:
        - Which part of it would you delete if you could?
  - rounds: [domain-deep-dive, system-test-strategy]
    exercise:
      id: dd-test-pyramid
      type: interview
      concept: system-test-strategy
      skill: application
      title: Where should the tests live?
      prompt: |
        **Interviewer:** "A new fee calculation affects checkout, the API and the monthly invoice. Which tests would
        you write at which level - unit, API or service, UI - and why?"
      hints:
        - Test each rule where it is cheapest to test it reliably.
      modelAnswer: |
        - **Unit:** the fee rules themselves - every method, boundary and rounding case; fast and many.
        - **API or service:** the fee appears correctly in the API response and stored records; error cases; a few
          representative combinations.
        - **UI:** one or two journeys showing the fee to the customer and in the invoice; not every combination.
        - **Why:** lower levels are faster, more stable and pinpoint failures; higher levels prove the parts work
          together. Avoid repeating the same combinations at every level.
      rubric:
        - Put the detailed rule combinations at the unit level
        - Used API or service tests for integration and stored data
        - Kept UI tests to a few journeys
        - Explained the speed, stability and diagnosis trade-offs
      solution: |
        This is the test pyramid applied to a real change - interviewers listen for **why**, not for the shape.
      followUps:
        - Developers own unit tests in this team. How do you know the fee rules are covered?
  - rounds: [domain-deep-dive, system-test-strategy]
    exercise:
      id: dd-mock-or-real
      type: interview
      concept: system-test-strategy
      skill: analysis
      title: Mock it or use the real thing?
      prompt: |
        **Interviewer:** "When do you replace a dependency - a payment provider, a database, another team's
        service - with a mock or stub, and when do you test against the real one?"
      hints:
        - What does each choice let you test, and what does it hide?
      modelAnswer: |
        - **Mock or stub** to make tests fast and deterministic, and to reach states that are hard to produce for
          real: timeouts, rare errors, unknown outcomes, slow responses.
        - **Risk of mocks:** they encode your assumptions; if the real dependency behaves differently, tests pass
          while production fails.
        - **Real or sandbox** tests (fewer) confirm the assumptions: contract tests, a provider sandbox, an
          integration environment.
        - **Balance:** most tests with fakes, a smaller set against real or sandbox dependencies, and contract
          tests to keep the fakes honest.
      rubric:
        - Named benefits of mocks such as speed, determinism and rare states
        - Named the risk that mocks drift from reality
        - Used real or sandbox dependencies to confirm assumptions
        - Mentioned contract tests or a balance between the two
      solution: |
        The strongest answers end with **how to keep fakes honest** - contract tests or periodic checks against
        the real thing.
      followUps:
        - The provider's sandbox behaves differently from production. What do you do?
