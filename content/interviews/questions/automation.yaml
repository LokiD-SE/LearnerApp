questions:
  - rounds: [automation-coding]
    exercise:
      id: ac-wait-for-status
      type: interview
      concept: automation-skills
      skill: application
      title: Wait for an asynchronous status
      prompt: |
        After clicking Pay, the order page shows PENDING, then SUCCEEDED or FAILED a few seconds later. Write the
        code that waits for the final status and returns it - in Selenium (Java) or Playwright (TypeScript).
        Explain why your approach is not flaky.
      hints:
        - Wait for a condition on the state, with a timeout - never a fixed sleep.
      modelAnswer: |
        ```java
        String status = new WebDriverWait(driver, Duration.ofSeconds(10))
            .withMessage("a final order status")
            .until(d -> {
                String text = d.findElement(By.cssSelector("[data-testid='order-status']")).getText().trim();
                return Set.of("SUCCEEDED", "FAILED").contains(text) ? text : null;
            });
        ```

        ```ts
        const status = page.getByTestId('order-status');
        await expect(status).toHaveText(/^(SUCCEEDED|FAILED)$/, { timeout: 10_000 });
        ```

        - Polls for the state, returns as soon as it holds, fails clearly after the timeout.
        - Finds the element inside the condition (Selenium) so a re-render can't make it stale.
      rubric:
        - Waited for a condition on the state, not a fixed time
        - Used a timeout and a clear failure message
        - Avoided stale references or one-shot reads
        - Explained why the approach is stable
      solution: |
        This is the [waits lesson](#/lesson/selenium-waits-and-synchronisation) in interview form; the
        explanation counts as much as the code.
      followUps:
        - The status sometimes takes two minutes in the sandbox. What would you change?
        - How do you test the timeout path itself?
  - rounds: [automation-coding]
    exercise:
      id: ac-login-page-object
      type: interview
      concept: automation-skills
      skill: application
      title: A login page object
      prompt: |
        Write a page object for a login page with email, password, a "Sign in" button and an error message area.
        A successful login lands on the dashboard. Show how a test uses it for both a success and a failure.
      hints:
        - Methods named after intent; one per expected outcome; no assertions inside.
      modelAnswer: |
        ```java
        public final class LoginPage {
            private static final By EMAIL = By.id("email");
            private static final By PASSWORD = By.id("password");
            private static final By SIGN_IN = By.cssSelector("[data-testid='sign-in']");
            private static final By ERROR = By.cssSelector("[role='alert']");
            private final WebDriver driver;
            private final WebDriverWait wait;

            public LoginPage(WebDriver driver) {
                this.driver = driver;
                this.wait = new WebDriverWait(driver, Duration.ofSeconds(10));
                wait.until(ExpectedConditions.visibilityOfElementLocated(SIGN_IN));   // loaded
            }

            public DashboardPage signInAs(String email, String password) {
                submit(email, password);
                return new DashboardPage(driver);            // its constructor waits for the dashboard
            }

            public String signInExpectingError(String email, String password) {
                submit(email, password);
                return wait.until(ExpectedConditions.visibilityOfElementLocated(ERROR)).getText();
            }

            private void submit(String email, String password) {
                driver.findElement(EMAIL).sendKeys(email);
                driver.findElement(PASSWORD).sendKeys(password);
                driver.findElement(SIGN_IN).click();
            }
        }

        // in tests
        assertEquals("Welcome", new LoginPage(driver).signInAs(user.email(), user.password()).greeting());
        assertTrue(new LoginPage(driver).signInExpectingError(user.email(), "wrong").contains("incorrect"));
        ```

        Credentials come from configuration or test data, never hard-coded real secrets.
      rubric:
        - Private locators and intent-named methods
        - One method per expected outcome, returning the next page or data
        - Waits for the page and for each outcome
        - Assertions in the tests, not in the page object
        - No real credentials hard-coded
      solution: |
        Compare with [page objects done right](#/lesson/page-objects-done-right): the `signInAs` /
        `signInExpectingError` split is the pattern interviewers look for.
      followUps:
        - Login is needed by 300 tests and is slow. What do you do?
  - rounds: [automation-coding]
    exercise:
      id: ac-api-test-create-payment
      type: interview
      concept: automation-skills
      skill: application
      title: An API test for creating a payment
      prompt: |
        Write an automated API test for `POST /v1/payments` on the (fictional) SandPay sandbox: a valid request
        returns `201` and a payment with status `PENDING` or `SUCCEEDED`, and repeating it with the same
        `Idempotency-Key` returns the same payment id. Use any client you know (REST Assured, Playwright request,
        Java's HttpClient).
      hints:
        - Arrange the request, act twice with one key, assert status, body and idempotency.
      modelAnswer: |
        ```ts
        test('create payment is idempotent', async ({ request }) => {
          const key = crypto.randomUUID();
          const body = { amount: 1999, currency: 'EUR', source: 'tok_sandpay_success' };
          const headers = { 'Idempotency-Key': key };

          const first = await request.post('v1/payments', { data: body, headers });
          expect(first.status()).toBe(201);
          const payment = await first.json();
          expect(['PENDING', 'SUCCEEDED']).toContain(payment.status);

          const repeat = await request.post('v1/payments', { data: body, headers });
          expect((await repeat.json()).id).toBe(payment.id);
        });
        ```

        - A fresh key per test run, so tests don't collide.
        - Asserts the body as well as the status code; the API key comes from the environment.
        - Follow-up checks: same key with a different body (the API should reject it), missing fields (400).
      rubric:
        - Checked both the status code and the body
        - Tested idempotency with the same key twice
        - Generated a unique key per run and kept secrets out of the code
        - Named further negative cases
      solution: |
        The idempotency part shows payments-specific depth - see the
        [idempotency keys lesson](#/lesson/idempotency-keys).
      followUps:
        - How would you test what happens when the first request times out?
  - rounds: [automation-coding]
    exercise:
      id: ac-data-driven
      type: interview
      concept: automation-skills
      skill: application
      title: Data-driven tests
      prompt: |
        Fee rules differ for card, bank transfer and wallet payments at several amounts. Write one parameterised
        test that checks the fee for each combination, and say where the test data should live.
      hints:
        - JUnit's @ParameterizedTest with @CsvSource, or test.describe with a data table in Playwright.
      modelAnswer: |
        ```java
        @ParameterizedTest(name = "{0} fee for {1} is {2}")
        @CsvSource({
            "card, 10000, 175",
            "card, 1999, 55",
            "bank-transfer, 1999, 50",
            "wallet, 500, 10",
        })
        void feeFor(String method, long amountMinor, long expectedFee) {
            assertEquals(expectedFee, FeePolicies.forMethod(method).feeFor(amountMinor));
        }
        ```

        - Readable names per case, so a failure says which combination broke.
        - Small, meaningful data inline; large or shared data in a versioned file next to the tests - not a
          spreadsheet on someone's machine.
        - Include boundaries (minimum fee, rounding) on purpose.
      rubric:
        - Wrote one parameterised test instead of copies
        - Each case is named in the report
        - Chose cases deliberately, including boundaries
        - Gave a sensible answer on where data lives
      solution: |
        Data-driven tests are only as good as the **cases chosen** - the rounding and minimum cases are the ones
        that find bugs.
      followUps:
        - When does data-driven testing make a suite harder to maintain?
  - rounds: [automation-coding]
    exercise:
      id: ac-iframe-and-tab
      type: interview
      concept: automation-skills
      skill: application
      title: An iframe and a new tab
      prompt: |
        The card form is in an iframe, and "View receipt" opens a new tab. Write the code (Selenium or Playwright)
        to fill the card form, then read the receipt number from the new tab and come back.
      hints:
        - Selenium switches context; Playwright scopes with frameLocator and gets the new page from the context.
      modelAnswer: |
        ```ts
        const card = page.frameLocator('[data-testid="sandpay-frame"]');
        await card.getByLabel('Test card').fill('sandpay-success');
        await card.getByLabel('Name on card').fill('Asha Rao');
        // ... pay, then:
        const [receipt] = await Promise.all([
          page.context().waitForEvent('page'),          // start waiting before the click
          page.getByRole('link', { name: 'View receipt' }).click(),
        ]);
        await receipt.waitForLoadState();
        const number = await receipt.getByTestId('receipt-number').textContent();
        await receipt.close();                            // back to the original page object
        ```

        In Selenium: `driver.switchTo().frame(...)` and `switchTo().defaultContent()` in a `finally`; for the tab,
        remember the original window handle, switch to the new one, then switch back.
      rubric:
        - Handled the iframe correctly (scoped locator or switch in and out)
        - Waited for the new tab before using it
        - Returned to the original page or window
        - Kept the frame handling reusable, for example in a component
      solution: |
        Starting the wait for the new page **before** the click avoids missing a fast popup.
      followUps:
        - How would you put this in page objects?
  - rounds: [take-home]
    exercise:
      id: th-checkout-plan
      type: testdesign
      concept: test-design-coverage
      skill: application
      title: "Take-home: a test plan for the SandPay shop's checkout"
      prompt: |
        Write the test plan you would hand in for the SandPay Demo Shop's checkout (published with this app under
        `shop/`): scope, risks, test cases grouped and prioritised, what you would automate and why, and how you
        would report results. Keep it to what a reviewer can read in 15 minutes.
      hints:
        - Lead with scope, assumptions and the top risks.
        - Use the shop's test cards to cover outcomes.
      modelAnswer: |
        - **Scope and assumptions:** catalog, cart, checkout, SandPay frame, order page; fictional data; one
          browser to start.
        - **Top risks:** wrong totals, double payment, declines not shown, pending payments never settling in the
          UI, the card frame not reporting readiness.
        - **P0 cases:** success, insufficient funds, card declined, pending → succeeded, pending → failed, Pay
          disabled until details are complete, totals across quantities.
        - **P1:** unknown test card, empty cart, back navigation after paying, reload on the order page, catalog
          API failure and retry.
        - **Automation:** P0 journeys with page objects; API-level checks for products.json; network mocks for the
          catalog error.
        - **Reporting:** a short summary, a table of cases and results, defects with evidence.
      rubric:
        - Stated scope and assumptions
        - Identified the top risks
        - Covered success, declines and pending outcomes with the test cards
        - Prioritised cases into P0 and P1
        - Explained what to automate and why
        - Kept it organised and short enough to review
      solution: |
        Take-homes are judged on **organisation and judgement** as much as coverage - one reported rejection cited
        test cases that were scattered and unorganised.
  - rounds: [take-home]
    exercise:
      id: th-automate-checkout
      type: interview
      concept: automation-skills
      skill: application
      title: "Take-home: automate the checkout"
      prompt: |
        **Assignment:** automate three checkout journeys of the SandPay Demo Shop (success, a declined card, and a
        payment that is pending first) with the framework and language of your choice. Hand in code and a README.
        Describe what you would deliver and how it is structured - or do it in `practice/framework` or
        `practice/playwright` and summarise your result.
      hints:
        - The README matters as much as the code.
      modelAnswer: |
        - **Structure:** page objects for catalog, checkout (with a card-frame component) and order; tests that read
          like the journeys; configuration for the base URL.
        - **Stability:** waits for state (status, overlay), no sleeps, isolated browser per test.
        - **README:** how to install and run, assumptions, what is covered and not, how to see reports and
          evidence, ideas for next steps.
        - **Scope discipline:** three solid journeys rather than twenty fragile ones.
      rubric:
        - Proposed a clear structure with page objects
        - Covered the three outcomes with waits for state
        - Described a README with run instructions and assumptions
        - Kept scope sensible for the time
      solution: |
        Both practice projects already contain a reference version of these journeys - compare your structure with
        `CheckoutJourneyTest` or `tests/journeys/checkout.spec.ts`.
      followUps:
        - What would you add with one more day?
        - How would it run in CI?
  - rounds: [take-home]
    exercise:
      id: th-bug-reports
      type: short
      concept: test-design-coverage
      skill: application
      title: "Take-home: exploratory charter and findings"
      prompt: |
        Spend 30 minutes exploring the SandPay shop's cart and checkout with a charter of your choice. Write the
        charter, what you covered, and your findings (bugs, risks or questions) in the format you would hand in.
      hints:
        - "A charter: explore <area> with <resources> to discover <information>."
      modelAnswer: |
        A charter such as "Explore the cart and checkout with quantity changes, reloads and the test cards to
        discover how totals and payment states hold up"; a list of what was covered (tours, data used); findings
        written so someone else can reproduce them - steps, expected and actual, evidence - and open questions
        separated from defects.
      rubric:
        - Wrote a focused charter
        - Listed what was covered and how
        - Findings are reproducible with steps and evidence
        - Separated defects from questions and risks
      solution: |
        Exploratory take-homes test **communication**: a reviewer should understand your session without asking
        you anything.
