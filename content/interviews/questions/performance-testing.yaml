# Track K (performance testing with JMeter and Locust) interview questions. Each is limited to the
# performance-testing subject, so it is asked in courses about that track. Written for practice in the style of the
# round; not questions from any company. SandPay is fictional; every figure is an assumption for practice.
questions:
  - rounds: [domain-deep-dive, online-assessment]
    subjects: [performance-testing]
    exercise:
      id: pt-q-average-hides-tail
      type: mcq
      concept: performance-testing
      skill: analysis
      title: A good average, unhappy users
      prompt: |
        A load test of SandPay's checkout reports an average response time of 180 ms, under the 250 ms target, and
        support still hears that "checkout hangs". What is the most useful next look?
      options:
        - id: percentiles
          text: The distribution - p50, p95 and p99 (and the maximum) per request, ideally over time.
          feedback: Correct - an average can look fine while a few percent of requests are many times slower, and those are the users who complain.
        - id: more-users
          text: Rerun with twice the users and compare the averages.
          feedback: More load changes the system under test; first read what the existing run already says about the tail.
        - id: mean-of-means
          text: Average the per-minute averages to get a more stable number.
          feedback: Averaging averages hides the tail even further, and it weighs quiet minutes like busy ones.
        - id: ignore
          text: Nothing - the target is met.
          feedback: The target was written as an average, which is the weakness; users experience individual requests.
      correct: [percentiles]
      hints:
        - Google's SRE book says most metrics are better thought of as distributions than as averages.
      solution: |
        Look at percentiles and the shape over time. The SRE book chapter on service level objectives notes that "a
        simple average can obscure these tail latencies, as well as changes in them". See [Performance metrics and
        percentiles](#/lesson/performance-metrics-and-percentiles).

  - rounds: [domain-deep-dive, online-assessment]
    subjects: [performance-testing]
    exercise:
      id: pt-q-users-needed
      type: mcq
      concept: performance-testing
      skill: application
      title: How many virtual users?
      prompt: |
        Each shopper on SandPay's checkout waits for a page (0.3 s on average) and then spends 2.7 s reading before
        the next click. You must offer 200 requests per second in a closed model. How many virtual users?
      options:
        - id: u600
          text: 600 - users = throughput x (response time + think time) = 200 x 3.0.
          feedback: Correct - Little's law applied to the closed loop.
        - id: u60
          text: 60 - users = throughput x response time = 200 x 0.3.
          feedback: That counts only the users inside the server; the others are thinking and still belong to the test.
        - id: u200
          text: 200 - one user per request per second.
          feedback: That is only true if each user sends exactly one request per second, which needs a 1.0 s cycle.
        - id: u667
          text: 667 - throughput / 0.3.
          feedback: That ignores think time and divides when it should multiply.
      correct: [u600]
      hints:
        - One cycle is the wait for the reply plus the think time.
      solution: |
        N = X x (R + Z) = 200 x (0.3 + 2.7) = 600. See [Little's law and workload models](#/lesson/littles-law-and-workload-models).

  - rounds: [domain-deep-dive, online-assessment]
    subjects: [performance-testing]
    exercise:
      id: pt-q-closed-model-slows
      type: mcq
      concept: performance-testing
      skill: analysis
      title: The server slows down
      prompt: |
        Midway through a closed-model test the server's response time grows tenfold. What happens to the number of
        requests the test sends, and why does it matter?
      options:
        - id: fewer
          text: It falls, because each user waits for its reply before the next request - so the test eases off exactly when the system is struggling.
          feedback: Correct - this is why a closed model under-reports damage during an overload and why an open model, which sends on a schedule, is the better check for arrival-rate targets.
        - id: same
          text: It stays the same; the tool sends on a fixed schedule.
          feedback: That describes an open model, not a closed one.
        - id: more
          text: It rises, because the tool compensates for the slow replies.
          feedback: Tools do not compensate; closed-loop users simply wait.
        - id: stops
          text: It drops to zero because the tool aborts on slow replies.
          feedback: Tools keep waiting until a timeout; they do not abort on their own.
      correct: [fewer]
      hints:
        - In a closed model, how many requests can one user have in flight?
      solution: |
        One user, one request in flight - so a slower server means fewer requests. Choose an open or paced model when
        the requirement is an arrival rate. See [Little's law and workload models](#/lesson/littles-law-and-workload-models).

  - rounds: [domain-deep-dive, online-assessment]
    subjects: [performance-testing]
    exercise:
      id: pt-q-fast-errors
      type: mcq
      concept: performance-testing
      skill: analysis
      title: The run with a great median
      prompt: |
        In a stress run, 70% of the requests failed with HTTP 503, and the median response time of the whole run was
        1 ms, while successful requests took about 21 ms. A colleague writes "latency improved under load". What is wrong?
      options:
        - id: separate
          text: Fast failures pulled the median down. Report latency for successful requests separately, report the error rate, and fix the errors before reading latency.
          feedback: Correct - the SRE book warns that a failed request can be served very quickly and that counting it in overall latency "might result in misleading calculations".
        - id: nothing
          text: Nothing - a lower median is an improvement.
          feedback: The requests that were rejected did no work; they say nothing about checkout speed.
        - id: percentile
          text: Use the p99 instead of the median; it will be correct.
          feedback: A higher percentile helps a little here, but mixing failures with successes still misleads.
        - id: retry
          text: Retry every failed request until it succeeds and report the final time.
          feedback: That hides the failures from the numbers instead of explaining them.
      correct: [separate]
      hints:
        - How long does it take a server to say "busy"?
      solution: |
        Separate successful and failed requests and report the error rate first. Source - Google SRE book, "Monitoring
        Distributed Systems", the latency signal. See [Reading load test results honestly](#/lesson/reading-load-test-results).

  - rounds: [debugging-rca, domain-deep-dive]
    subjects: [performance-testing]
    exercise:
      id: pt-q-generator-bound
      type: mcq
      concept: performance-testing
      skill: analysis
      title: Throughput stops at 55 requests per second
      prompt: |
        Eight Locust users with 50 ms think time should offer about 114 requests per second against a target that
        has plenty of capacity. The run delivers 55, response times look fine, and the load generator machine is at
        88% CPU. What is the first conclusion?
      options:
        - id: generator
          text: The load generator is the bottleneck. The run says nothing about the application - lighten the script or add generator machines and rerun.
          feedback: Correct - when the generator is out of CPU, every number is a measurement of the generator.
        - id: app
          text: The application cannot go past 55 requests per second; open a performance defect.
          feedback: The application had capacity; the missing load never arrived.
        - id: network
          text: The network is the limit; switch to HTTP/2.
          feedback: There is no evidence for the network; check the tester's own machine first.
        - id: think
          text: Think time is too long; reduce it to zero.
          feedback: Removing think time changes the workload model instead of finding the cause.
      correct: [generator]
      hints:
        - Where did the load come from, and was it healthy?
      solution: |
        Check the generator's CPU, memory and network before the target. A saturated generator is the first smell of an
        untrustworthy run. See [Bottleneck analysis with the USE and RED methods](#/lesson/bottleneck-analysis).

  - rounds: [domain-deep-dive, online-assessment]
    subjects: [performance-testing]
    exercise:
      id: pt-q-warm-up
      type: mcq
      concept: performance-testing
      skill: application
      title: The slow first minute
      prompt: |
        The first minute of a ten-minute test is clearly slower than the rest (caches empty, connections being
        opened). How should the result be reported?
      options:
        - id: window
          text: Choose the measurement window after the warm-up, say so in the report, and keep the warm-up visible in the time series.
          feedback: Correct - steady state is what you compare, and the warm-up is information too (for example for a deploy followed by traffic).
        - id: delete
          text: Delete the slow minute without mentioning it.
          feedback: Cutting data silently makes the result impossible to audit.
        - id: keep
          text: Keep everything in one overall p95; it is the most honest single number.
          feedback: A warm-up inside the window blends two different behaviours into one number.
        - id: shorter
          text: Shorten the test to one minute so the warm-up is the whole test.
          feedback: A test that only measures the warm-up answers a different question.
      correct: [window]
      hints:
        - What would a reader of the report need to reproduce your number?
      solution: |
        Define the steady-state window, state it, and show the whole timeline. See [Reading load test results
        honestly](#/lesson/reading-load-test-results).

  - rounds: [domain-deep-dive, online-assessment]
    subjects: [performance-testing]
    exercise:
      id: pt-q-constant-throughput-timer
      type: mcq
      concept: performance-testing
      skill: recall
      title: A throughput timer and a slow server
      prompt: |
        A JMeter plan uses a Constant Throughput Timer set to 600 samples per minute, but the server can only
        handle 400. What throughput does the test achieve?
      options:
        - id: lower
          text: About 400 - the timer adds pauses to hold a rate down, but it cannot make a slow server answer faster or add threads.
          feedback: Correct - the manual says the throughput "will be lower if the server is not capable of handling it".
        - id: target
          text: 600 - the timer forces that rate.
          feedback: The timer only delays threads; it cannot raise the rate beyond what the threads and the server allow.
        - id: higher
          text: More than 600 to make up for the lost time.
          feedback: The timer never exceeds its target.
        - id: error
          text: The test fails with an error.
          feedback: JMeter does not fail the test; it simply produces less load.
      correct: [lower]
      hints:
        - The timer adds pauses. Can pauses speed anything up?
      solution: |
        The timer only holds a rate down. Source - Apache JMeter component reference, Constant Throughput Timer: "the
        throughput will be lower if the server is not capable of handling it". Check the achieved rate in the results, not the setting.

  - rounds: [domain-deep-dive, online-assessment]
    subjects: [performance-testing]
    exercise:
      id: pt-q-locust-constant-throughput
      type: mcq
      concept: performance-testing
      skill: application
      title: Locust, 500 iterations per second
      prompt: |
        You want a Locust test that runs 500 task iterations per second at peak. A user class sets
        `wait_time = constant_throughput(0.1)`. How many users do you start, and what limits the result?
      options:
        - id: u5000
          text: 5000 users. constant_throughput(0.1) means at most one iteration per user every 10 seconds, so 500 per second needs 5000 users - and the rate is lower if an iteration itself takes longer than 10 seconds.
          feedback: Correct - this is the worked example in Locust's documentation; the wait time can only constrain throughput, not start more users.
        - id: u50
          text: 50 users, because 500 / 10 = 50.
          feedback: The 0.1 means iterations per second per user, so each user gives at most 0.1 iterations per second.
        - id: u500
          text: 500 users, one per iteration per second.
          feedback: That would be right for constant_throughput(1), not 0.1.
        - id: any
          text: Any number - Locust adds users until it reaches 500.
          feedback: Locust never launches users to reach a target; you choose the user count.
      correct: [u5000]
      hints:
        - Per user, 0.1 iterations per second is one every how many seconds?
      solution: |
        5000 users x 0.1 = 500 iterations per second at most. Source - Locust 2.47 documentation, "Writing a locustfile",
        wait_time. Mind that wait times apply to tasks, not requests - a task with two requests doubles the request rate.

  - rounds: [domain-deep-dive, system-test-strategy]
    subjects: [performance-testing]
    exercise:
      id: pt-q-same-idempotency-key
      type: mcq
      concept: performance-testing
      skill: analysis
      title: One idempotency key for the whole test
      prompt: |
        A load test of SandPay's payment creation sends every request with the same `Idempotency-Key`. Throughput
        looks excellent. What does the test actually measure?
      options:
        - id: replay
          text: Mostly the replay path - after the first request the API returns the stored response and creates nothing. Use a fresh key per logical payment to load the creation path.
          feedback: Correct - a fixed key turns the test into a cache-hit test and hides the cost of creating payments.
        - id: creation
          text: The full payment creation path at high speed.
          feedback: Only the first request creates a payment; the rest are replays.
        - id: rate-limit
          text: The rate limiter.
          feedback: Nothing about a repeated key exercises the limiter.
        - id: nothing
          text: Nothing useful, and it fails with an error.
          feedback: The API accepts the repeated key; the result is valid but answers the wrong question.
      correct: [replay]
      hints:
        - What should the API do when it sees a key it has already stored?
      solution: |
        A fixed key measures replays. Generate a unique key per logical payment, and reuse a key only for deliberate
        retry scenarios. See [Performance testing payment systems](#/lesson/performance-testing-payment-systems).

  - rounds: [domain-deep-dive, online-assessment]
    subjects: [performance-testing]
    exercise:
      id: pt-q-test-type
      type: mcq
      concept: performance-testing
      skill: recognition
      title: Which kind of test?
      prompt: |
        "Will the checkout still behave after running for twelve hours at its normal evening load?" Which kind of
        performance test answers that?
      options:
        - id: soak
          text: A soak (endurance) test - normal load held for a long time to expose leaks and slow degradation.
          feedback: Correct - duration is the point; memory, connection and disk growth show up only over hours.
        - id: stress
          text: A stress test - load beyond capacity to find where it breaks.
          feedback: Stress increases the load; this question holds it constant.
        - id: spike
          text: A spike test - a sudden jump in load.
          feedback: A spike is sudden and short; this question is about a long, steady period.
        - id: smoke
          text: A smoke test - a minimal run to check the script works.
          feedback: A smoke test checks the test and the build, not twelve hours of behaviour.
      correct: [soak]
      hints:
        - What changes in this question - the load or the time?
      solution: |
        Soak (endurance). See [Types of performance testing](#/lesson/performance-testing-types).

  - rounds: [domain-deep-dive, system-test-strategy]
    subjects: [performance-testing]
    exercise:
      id: pt-q-explain-percentiles
      type: short
      concept: performance-testing
      skill: analysis
      title: Explain percentiles to a product manager
      prompt: |
        A product manager asks why you quote p95 and p99 instead of the average. Answer in five or six sentences.
      modelAnswer: |
        The p95 is the response time that 95% of requests beat; the other 5% are slower. If p95 is 800 ms, one request
        in twenty took longer than that, and for a page that makes ten calls about four visits in ten meet at least one
        such request (1 - 0.95^10). The average blends fast and slow requests into one number, so a long tail can grow without moving it -
        Google's SRE book warns that a simple average can obscure the tail and changes in it. I report p50 for the typical
        experience, p95 or p99 for the tail, the maximum for the worst case, and the error rate beside them, because a
        failed request can be quick and flatter the numbers. I also say how many samples stand behind a high percentile -
        a p99 from 100 samples is one request.
      rubric:
        - Defines a percentile correctly (the share of requests at or below the value).
        - Explains why an average hides a long tail, with a consequence for users.
        - Names the percentiles and what each is for, plus errors reported separately.
        - Mentions sample size for high percentiles.
      hints:
        - Start with what "p95 = 800 ms" means for a user.
      solution: |
        A percentile definition, why the average misleads, what you report (percentiles, maximum, error rate) and a caution
        about samples. See [Performance metrics and percentiles](#/lesson/performance-metrics-and-percentiles).

  - rounds: [domain-deep-dive, system-test-strategy]
    subjects: [performance-testing]
    exercise:
      id: pt-q-explain-littles-law
      type: short
      concept: performance-testing
      skill: application
      title: Explain Little's law with a number
      prompt: |
        Explain Little's law and use it once to answer "how many requests are inside the system?" for 120 requests per
        second arriving and 0.5 s spent per request.
      modelAnswer: |
        Little's law says that the average number of items in a system equals their arrival rate multiplied by the
        average time each spends in it: L = lambda x W. For SandPay's API that is 120 requests per second x 0.5 s = 60
        requests inside the system on average. It holds for any stable system whatever the arrival pattern, so I use it
        in two ways: to size things (60 requests in flight means at least 60 concurrent slots, and a pool of 20 will queue)
        and to check a run (if the numbers from a test do not satisfy it, my measurement window or my counting is wrong).
        For a closed test, with think time Z, the users needed are throughput x (response time + Z).
      rubric:
        - States the law correctly (items = arrival rate x time in system).
        - Computes 60 for the example.
        - Uses it for sizing or for checking a run, not only as a formula.
        - Adds the closed-model form with think time.
      hints:
        - Rate times time.
      solution: |
        L = lambda x W gives 60 requests in flight; use it to size pools and users and to sanity-check results. See
        [Little's law and workload models](#/lesson/littles-law-and-workload-models).

  - rounds: [domain-deep-dive, system-test-strategy]
    subjects: [performance-testing]
    exercise:
      id: pt-q-size-the-test
      type: short
      concept: performance-testing
      skill: application
      title: Size a load test on a whiteboard
      prompt: |
        SandPay's checkout handles 2,000,000 requests a day; the busiest hour is about four times the average. A
        request takes 0.25 s on average and shoppers think for 3 s between requests. How many virtual users do you
        plan for, and what do you say about your assumptions?
      modelAnswer: |
        The daily average is 2,000,000 / 86,400 = about 23 requests per second; at four times that, the peak is about
        92.6 requests per second. In a closed model with 0.25 s response time and 3 s think time, a user's cycle is 3.25 s,
        so I need 92.6 x 3.25 = about 301 users. If the pages answer more slowly under load the same users offer fewer
        requests, so I would check the achieved rate in a short run before trusting the plan. The assumptions to state:
        the peak factor comes from last year's traffic (I would read it from the access logs), the 0.25 s is today's
        response time, and the think time is a model of real shoppers - I would take it from the analytics or sessions.
      rubric:
        - Converts per day to per second and applies the peak factor.
        - Uses users = rate x (response time + think time) and rounds up.
        - Gets about 301 users.
        - States assumptions and says how to verify them (logs, a short run).
      hints:
        - Per day to per second first, then the peak, then Little's law.
      solution: |
        About 92.6 requests per second at the peak and about 301 users, with the assumptions named and checked in a short run.

  - rounds: [domain-deep-dive, system-test-strategy]
    subjects: [performance-testing]
    exercise:
      id: pt-q-vague-requirement
      type: short
      concept: performance-testing
      skill: application
      title: "'The app should be fast'"
      prompt: |
        A stakeholder says "the new settlement report must be fast". Turn that into a requirement you can test.
      modelAnswer: |
        I would ask what the user is doing and what "slow" costs them, then write a measurable requirement: "Under 40
        concurrent merchants (the observed peak), the settlement report for a 30-day range returns in under 3 seconds at
        p95 and 8 seconds at p99, with fewer than 0.1% errors, measured on an environment sized like production with
        production-like data." I would agree the percentile, the load, the data volume, the environment and the
        error budget with the stakeholder, and say how it will be measured and what happens when it is missed. Numbers
        here are examples I would replace with the team's.
      rubric:
        - Asks about the user task and the cost of slowness.
        - Writes a measurable statement with a percentile, a threshold and a load.
        - Includes error rate, data volume and environment.
        - Gets agreement on measurement and consequences.
      hints:
        - Which number, at what load, on which data?
      solution: |
        A percentile target at a stated load on production-like data with an error budget, agreed with the stakeholder. See
        [Performance requirements and SLOs](#/lesson/performance-requirements-and-slos).

  - rounds: [system-test-strategy, domain-deep-dive]
    subjects: [performance-testing]
    exercise:
      id: pt-q-design-checkout-test
      type: interview
      concept: performance-testing
      skill: analysis
      title: 'Interview: load test before a sale'
      prompt: |
        "SandPay's merchants run a big sale in three weeks and expect three times the usual checkout traffic. Plan the
        performance testing. Walk me through it."
      modelAnswer: |
        I would start with questions - what is the goal (no errors? p95 under a limit?), what the traffic looks like
        today (peak requests per second, the mix of endpoints, how long shoppers think), what is changing, and what
        environment and data I may use. From access logs I would build a workload model - the endpoint mix and arrival
        pattern - and convert the 3x expectation into target rates with Little's law for the closed parts.

        Then the tests, in order. A smoke run to prove the script. A baseline at today's load. A load test at the
        expected sale peak, held long enough to pass warm-up. A stress test beyond it to find the knee and see how the
        system fails (queues, errors, recovery). A spike for the moment the sale opens, and a soak at normal load for
        leaks. Payment specifics - unique idempotency keys per payment, retries behaving as the clients really retry,
        provider sandboxes, and a reconciliation of payments created against payments confirmed.

        For trust I would check the generator's own CPU, use percentiles by endpoint, report errors separately, and watch the
        system with USE and RED metrics so a slow result comes with a cause. The report states the knee, the headroom
        over the expected peak, the risks, and what I would change first. Afterwards the load test becomes a pipeline job
        with a baseline so the sale-day performance does not regress.
      rubric:
        - Clarifies goals, traffic, environment and data before choosing tests.
        - Builds a workload model from production data and sizes load with numbers.
        - Orders the test types sensibly (smoke, baseline, load, stress, spike, soak) with reasons.
        - Covers payment-specific traps (idempotency keys, retries, reconciliation).
        - Protects result quality (generator health, percentiles, errors separate, system metrics).
      followUps:
        - Production is shared with other tenants - where do you run the stress test?
        - What do you do if the knee is only 1.5x?
        - How would you decide the test is representative enough?
      hints:
        - Clarify, model, test types in order, payment traps, result quality, report.
      solution: |
        Requirements and a workload model first, then smoke, baseline, load, stress, spike and soak with numbers and a
        reconciliation, with generator and system metrics beside the results, and a report with headroom and risks.

  - rounds: [debugging-rca, domain-deep-dive]
    subjects: [performance-testing]
    exercise:
      id: pt-q-debug-p95-regression
      type: interview
      concept: performance-testing
      skill: analysis
      title: 'Interview: p95 doubled after a release'
      prompt: |
        "After last night's release the p95 of the payments API doubled, throughput is unchanged and CPU on the
        application servers is low. What do you do?"
      modelAnswer: |
        First I make sure the comparison is fair - same load, same test data, same environment, same window, and a baseline
        with a noise estimate, so I know a doubling is outside normal variation. I would look at which endpoints moved, by
        percentile and over time, and whether errors or retries changed, because failures can distort latency.

        Low CPU with higher latency means requests are waiting, not computing. I would look for the queue: connection pool
        waits, database time, a downstream call, lock contention, thread-pool saturation - USE for each resource and RED per
        endpoint. I compare the release diff for new queries (an N+1 pattern shows as many small queries per request), a
        missing index, a changed timeout or retry, a new synchronous call. Traces for slow requests show where the time sits.

        I confirm by reproducing it in a test environment or by rolling the suspected change back or flagging it off, then
        add a regression check to the pipeline so a repeat is caught before release.
      rubric:
        - Checks the comparison is fair and the change is above the noise.
        - Reasons that low CPU with high latency means waiting, and names candidates (pools, database, downstream, locks).
        - Uses USE and RED, traces and the release diff to localise it.
        - Confirms by reproduction or rollback and adds a regression check.
      followUps:
        - Throughput is unchanged - what does that tell you under a closed model?
        - How would you tell a pool wait from a slow query?
      hints:
        - Low CPU, high latency - what are the requests doing?
      solution: |
        A fair comparison, then find the wait (pool, database, downstream, lock) with USE, RED and traces, confirm by rollback or
        reproduction, and add a regression gate. See [Backend and database performance for
        testers](#/lesson/backend-and-database-performance).

  - rounds: [debugging-rca, domain-deep-dive]
    subjects: [performance-testing]
    exercise:
      id: pt-q-debug-flat-throughput
      type: interview
      concept: performance-testing
      skill: analysis
      title: 'Interview: more users, same throughput'
      prompt: |
        "In a step test, throughput stays near 100 requests per second from 20 users up to 100 users while response time
        keeps rising. What is happening, and what do you check next?"
      modelAnswer: |
        That is the signature of saturation: something has reached its capacity, so extra users only add waiting. By
        Little's law users = throughput x (response time + think time), so with throughput fixed, more users must show up as
        longer response time, which is what we see. The knee is around 20 users.

        Next I find the resource at its limit with the USE method on the system: utilisation, saturation and errors for CPU,
        memory, the connection pool, the database, and any downstream service - the first resource at 100% utilisation or with
        a queue is the candidate. In the test I rule out the load generator (its CPU and network) and the test itself (a
        shared lock in the script, one data row everyone updates). Then I confirm by changing one thing - a bigger pool, an
        extra worker - and checking the knee moves.
      rubric:
        - Recognises saturation and the knee, and uses Little's law to explain rising response time.
        - Applies USE to find the limiting resource.
        - Rules out the generator and test design as causes.
        - Confirms by changing one variable and re-measuring.
      followUps:
        - What if throughput falls as users increase?
        - How do you make sure the knee you found is not an artefact of the test data?
      hints:
        - Throughput flat, response time up - where do the extra users wait?
      solution: |
        Saturation: find the limiting resource with USE after ruling out the generator and the script, then confirm by changing one
        thing. See [Bottleneck analysis with the USE and RED methods](#/lesson/bottleneck-analysis).

  - rounds: [system-test-strategy, domain-deep-dive]
    subjects: [performance-testing]
    exercise:
      id: pt-q-ci-performance-gate
      type: interview
      concept: performance-testing
      skill: analysis
      title: 'Interview: a performance gate that does not flake'
      prompt: |
        "The team wants performance tests in the pipeline, but they say last time the job failed randomly and was switched off.
        How do you do it so it lasts?"
      modelAnswer: |
        Performance results are noisy, so a fixed threshold fails at random. I would keep a baseline of recent passing runs
        and compare a new run against the median with a tolerance derived from the observed noise (for example the median
        absolute deviation), not a hand-picked percentage.

        The gate needs three outcomes, not two: pass, fail, and "this run cannot be judged" - too few samples, a generator out
        of CPU, a damaged baseline - and the last one must not silently pass. It also checks error rate and budgets, because
        a p95 comparison alone misses failures that return fast.

        Placement matters. A short smoke test on every pull request, the real load test nightly or before release on a
        dedicated, stable environment, with artefacts and the baseline kept. Failures link to the report. Finally I would
        review false alarms every month and tune the tolerance, because a gate that people trust is a gate that stays on.
      rubric:
        - Explains why noise breaks fixed thresholds and proposes a baseline with a noise-based tolerance.
        - Includes an "unjudgeable run" outcome and error and budget checks.
        - Places short tests on pull requests and the real test nightly or pre-release in a stable environment.
        - Keeps artefacts and reviews false alarms.
      followUps:
        - How would you handle a slow drift of 1% per release?
        - Where would the load generator run?
      hints:
        - What makes performance numbers different from unit-test results?
      solution: |
        A noise-aware baseline gate with three outcomes, error and budget checks, sensible placement and a review loop. See
        [Performance testing in CI/CD](#/lesson/performance-testing-in-ci-cd).

  - rounds: [system-test-strategy, domain-deep-dive]
    subjects: [performance-testing]
    exercise:
      id: pt-q-payments-under-load
      type: interview
      concept: performance-testing
      skill: analysis
      title: 'Interview: what is different about payment load tests?'
      prompt: |
        "What would you do differently when load testing a payment API compared with a catalogue API?"
      modelAnswer: |
        The writes have consequences. Creating a payment moves money, so I use only synthetic data in a sandbox and never
        send load at a real provider. Idempotency keys matter twice: a unique key per logical payment, or the test measures
        cached replays; and a deliberate retry scenario to see that a client timeout followed by a retry with the same key
        does not create two payments.

        Rate limits and provider limits shape the result - I expect 429s and 503s and test that clients back off - and I
        report them separately from errors. Unknown outcomes after a timeout are the hard case: after the run I reconcile -
        payments created at the API against payments the clients saw confirmed - and treat any difference as a defect to
        explain, not noise.

        The workload model weights endpoints by real traffic (many reads per write), and the important number is often the
        success rate of payments at the target load, next to latency.
      rubric:
        - Uses synthetic data and a sandbox, never a real provider.
        - Handles idempotency keys (unique per payment, deliberate retries).
        - Treats rate limits and unknown outcomes explicitly, with reconciliation after the run.
        - Weights the workload by real traffic and reports success rate with latency.
      followUps:
        - How do you load test a provider that only offers a rate-limited sandbox?
        - What would a reconciliation mismatch tell you?
      hints:
        - Think writes, retries and money.
      solution: |
        Synthetic data, unique and retried idempotency keys, rate limits reported separately, a reconciliation after the run, and
        a traffic-weighted workload. See [Performance testing payment systems](#/lesson/performance-testing-payment-systems).
