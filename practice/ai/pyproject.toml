# LearnerApp - AI engineering practice project (Track J). Not a package: pytest reads its settings here.
[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode lets tests/<topic>/test_x.py share names across topics without __init__.py files.
addopts = ["--import-mode=importlib", "-q"]
markers = [
  "exercise: checks a learner exercise (fails until it is solved)",
]
filterwarnings = ["error::FutureWarning"]
