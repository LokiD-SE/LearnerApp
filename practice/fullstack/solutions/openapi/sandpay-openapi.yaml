# SandPay merchant dashboard - orders API (reference solution).
# Everything here is fictional: SandPay, its URLs, ids and amounts. Amounts are integers in minor units.
openapi: 3.1.2
info:
  title: SandPay merchant dashboard API
  version: 1.4.0
  description: Orders and refunds for the SandPay merchant dashboard. Errors are Problem Details (RFC 9457).
servers:
  - url: https://api.sandpay.example/v1
tags:
  - name: orders
  - name: refunds
paths:
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders, newest first
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: A page of orders.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
  /orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get one order
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders/{orderId}/refunds:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      operationId: createRefund
      tags: [refunds]
      summary: Refund part or all of a paid order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
            examples:
              partial:
                summary: A partial refund
                value: { amountMinor: 1200, reason: Item returned }
      responses:
        '201':
          description: The refund was created.
          headers:
            Location:
              description: URL of the new refund.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The order is not paid, or the refund exceeds what is left to refund.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        pattern: '^ord_[0-9]+$'
  responses:
    BadRequest:
      description: The request was not valid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No such order.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    OrderStatus:
      type: string
      enum: [pending, paid, refunded, failed]
    Order:
      type: object
      required: [id, amountMinor, currency, status, customerNote, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: '^ord_[0-9]+$'
        amountMinor:
          type: integer
          minimum: 0
          description: Amount in minor units (cents, paise).
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: ISO 4217 alphabetic code.
        status:
          $ref: '#/components/schemas/OrderStatus'
        customerNote:
          type: [string, 'null']
          description: What the customer typed at checkout, or null.
        createdAt:
          type: string
          format: date-time
      examples:
        - id: ord_1001
          amountMinor: 5000
          currency: EUR
          status: paid
          customerNote: Leave at the door
          createdAt: '2026-11-13T10:00:00.000Z'
    RefundRequest:
      type: object
      required: [amountMinor, reason]
      additionalProperties: false
      properties:
        amountMinor:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 200
    Refund:
      type: object
      required: [id, orderId, amountMinor, reason, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: '^re_[0-9]+$'
        orderId:
          type: string
        amountMinor:
          type: integer
          minimum: 1
        reason:
          type: string
        createdAt:
          type: string
          format: date-time
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
