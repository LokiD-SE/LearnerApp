# SandPay merchant dashboard - orders API. The app is built (orders-app.ts); this description of it is
# not finished. Make it an accurate OpenAPI 3.1 contract for the app - run the contract tests and fix
# what they report. Everything here is fictional; amounts are integers in minor units.
openapi: 3.0.3
info:
  title: SandPay merchant dashboard API
  version: 1.4.0
servers:
  - url: https://api.sandpay.example/v1
paths:
  /orders:
    get:
      operationId: listOrders
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: A page of orders.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
  /orders/{orderId}:
    get:
      operationId: getOrder
      parameters:
        - name: orderId
          in: path
          schema:
            type: string
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
  /orders/{orderId}/refunds:
    post:
      operationId: getOrder
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: string
        amountMinor:
          type: number
        currency:
          type: string
        status:
          type: string
          enum: [pending, paid, refunded]
        customerNote:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
