<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Products - SandPay Demo Shop</title>
    <link rel="stylesheet" href="shop.css" />
  </head>
  <body data-page="catalog">
    <header class="site-header">
      <a class="brand" href="index.html" data-testid="home-link">SandPay Demo Shop</a>
      <nav aria-label="Shop">
        <a href="index.html">Products</a>
        <a href="cart.html" data-testid="cart-link"
          >Cart <span class="cart-count" data-testid="cart-count">0</span></a
        >
        <a href="checkout.html" data-testid="checkout-link">Checkout</a>
      </nav>
    </header>
    <main>
      <h1>Coffee things</h1>
      <p class="notice">
        A practice shop for UI automation. Everything is fictional - no real products, cards or payments.
      </p>
      <div class="toolbar">
        <label for="sort" style="margin: 0">Sort by</label>
        <select id="sort" data-testid="sort">
          <option value="featured">Featured</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
        </select>
      </div>
      <ul class="products" data-testid="product-list" aria-label="Products" aria-busy="true"></ul>
    </main>
    <script src="shop.js"></script>
  </body>
</html>
