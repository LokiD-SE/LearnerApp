<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cart - SandPay Demo Shop</title>
    <link rel="stylesheet" href="shop.css" />
  </head>
  <body data-page="cart">
    <header class="site-header">
      <a class="brand" href="index.html" data-testid="home-link">SandPay Demo Shop</a>
      <nav aria-label="Shop">
        <a href="index.html">Products</a>
        <a href="cart.html" data-testid="cart-link"
          >Cart <span class="cart-count" data-testid="cart-count">0</span></a
        >
        <a href="checkout.html" data-testid="checkout-link">Checkout</a>
      </nav>
    </header>
    <main>
      <h1>Your cart</h1>
      <p data-testid="cart-empty" hidden>
        Your cart is empty. <a href="index.html">Find something you like</a>.
      </p>
      <section class="panel" data-testid="cart-content" hidden>
        <table class="lines" aria-label="Cart lines">
          <thead>
            <tr>
              <th>Product</th>
              <th>Quantity</th>
              <th class="num">Total</th>
              <th><span hidden>Actions</span></th>
            </tr>
          </thead>
          <tbody data-testid="cart-lines"></tbody>
        </table>
        <p class="total-row"><span>Total</span><span data-testid="cart-total"></span></p>
        <p><a href="checkout.html" data-testid="go-to-checkout">Go to checkout</a></p>
      </section>
    </main>
    <script src="shop.js"></script>
  </body>
</html>
