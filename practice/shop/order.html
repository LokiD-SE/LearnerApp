<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Order - SandPay Demo Shop</title>
    <link rel="stylesheet" href="shop.css" />
  </head>
  <body data-page="order">
    <header class="site-header">
      <a class="brand" href="index.html" data-testid="home-link">SandPay Demo Shop</a>
      <nav aria-label="Shop">
        <a href="index.html">Products</a>
        <a href="cart.html" data-testid="cart-link"
          >Cart <span class="cart-count" data-testid="cart-count">0</span></a
        >
        <a href="checkout.html" data-testid="checkout-link">Checkout</a>
      </nav>
    </header>
    <main>
      <section data-testid="order-found">
        <h1>Order <span data-testid="order-id"></span></h1>
        <p>Status: <span class="status" data-testid="order-status" aria-live="polite"></span></p>
        <p data-testid="order-message"></p>
        <p>Total: <span data-testid="order-total"></span></p>
        <p><a href="index.html">Continue shopping</a></p>
      </section>
      <section data-testid="order-missing" hidden>
        <h1>Order not found</h1>
        <p>Orders are kept in this browser tab only. <a href="index.html">Back to the products</a>.</p>
      </section>
    </main>
    <script src="shop.js"></script>
  </body>
</html>
