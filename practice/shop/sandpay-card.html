<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SandPay card details</title>
    <link rel="stylesheet" href="shop.css" />
    <style>
      body {
        background: var(--surface);
        padding: 0.25rem 0.75rem;
      }
      label:first-of-type {
        margin-top: 0.25rem;
      }
    </style>
  </head>
  <body>
    <form data-testid="card-form" novalidate>
      <label for="card">Test card</label>
      <input
        id="card"
        name="card"
        type="text"
        autocomplete="off"
        spellcheck="false"
        placeholder="sandpay-success"
        data-testid="card-input"
        aria-describedby="card-error"
      />
      <p class="error" id="card-error" data-testid="card-error" aria-live="polite"></p>
      <label for="card-name">Name on card</label>
      <input id="card-name" name="card-name" type="text" autocomplete="off" data-testid="card-name" />
    </form>
    <script>
      'use strict';
      // The SandPay iframe tells the shop when the card details are complete.
      const CODES = [
        'sandpay-success',
        'sandpay-slow',
        'sandpay-insufficient-funds',
        'sandpay-card-declined',
        'sandpay-unknown',
        'sandpay-pending-then-failed',
      ];
      const card = document.getElementById('card');
      const name = document.getElementById('card-name');
      const error = document.getElementById('card-error');
      document.querySelector('form').addEventListener('submit', (event) => event.preventDefault());
      const update = () => {
        const code = card.value.trim().toLowerCase();
        const known = CODES.includes(code);
        error.textContent =
          code && !known ? 'Unknown test card - see "Test cards" on the checkout page.' : '';
        card.setAttribute('aria-invalid', String(Boolean(code) && !known));
        const ready = known && name.value.trim().length > 0;
        window.parent.postMessage(
          { type: 'sandpay:card', ready, card: ready ? code : null },
          window.location.origin,
        );
      };
      card.addEventListener('input', update);
      name.addEventListener('input', update);
    </script>
  </body>
</html>
